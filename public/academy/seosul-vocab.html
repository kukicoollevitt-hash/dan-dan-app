<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>서술형 내신 · 어휘 학습</title>
<style>
  :root {
    --accent: #2e8b57; --accent2: #4caf72; --accentSoft: #aee9c6;
    --panel: #14201a; --panel2: #1c2c24; --line: #33493b; --text: #eaf5ef; --sub: #9fc4b2;
  }
  body[data-theme="adv"] {
    --accent: #3a53c8; --accent2: #5a7bf0; --accentSoft: #b9c9ff;
    --panel: #121725; --panel2: #1c2440; --line: #3a4870; --text: #eef1ff; --sub: #9aa6d4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--panel); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }

  /* 헤더 */
  .sv-top { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 80%, #000) 100%); }
  .sv-title { flex: 1; font-size: 17px; font-weight: 800; letter-spacing: 0.2px; }
  .sv-title .sv-author { font-size: 13px; font-weight: 600; opacity: 0.85; margin-left: 7px; }
  .sv-pill { background: rgba(255,255,255,0.18); border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 700; }
  .sv-close { width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.22); color: #fff; border: none; font-size: 20px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  /* 본문 스크롤 영역 */
  .sv-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 18px 26px; }
  .sv-body.sv-center { display: flex; flex-direction: column; }
  .sv-body.sv-center > * { margin-top: auto; margin-bottom: auto; }
  .sv-stage-head { text-align: center; margin: 2px 0 18px; }
  .sv-stage-head h2 { margin: 0 0 6px; font-size: 20px; font-weight: 800; }
  .sv-stage-head p { margin: 0; font-size: 13.5px; color: var(--sub); font-weight: 600; }

  /* 익히기 — 어휘 카드 그리드 */
  .sv-learn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; max-width: 1040px; margin: 0 auto; }
  .sv-vcard { position: relative; min-height: 104px; border-radius: 14px; background: var(--panel2); border: 1.5px solid var(--line); cursor: pointer; padding: 14px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease; overflow: hidden; }
  .sv-vcard:hover { transform: translateY(-3px); border-color: var(--accent2); box-shadow: 0 8px 18px rgba(0,0,0,0.3); }
  .sv-vcard .sv-word { font-size: 18px; font-weight: 800; color: var(--text); }
  .sv-vcard .sv-mean { font-size: 14px; line-height: 1.45; color: var(--sub); font-weight: 600; }
  .sv-vcard.learned { background: linear-gradient(160deg, color-mix(in srgb, var(--accent2) 62%, var(--panel2)) 0%, color-mix(in srgb, var(--accent) 30%, var(--panel2)) 100%); border-color: var(--accentSoft); box-shadow: 0 6px 20px color-mix(in srgb, var(--accent2) 42%, transparent); }
  .sv-vcard.learned .sv-word { color: #ffffff; }
  .sv-vcard.learned .sv-mean { color: color-mix(in srgb, var(--accentSoft) 70%, #ffffff); }
  .sv-vcard .sv-learned-dot { position: absolute; top: 7px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: #ffffff; color: var(--accent); font-size: 13px; display: none; align-items: center; justify-content: center; font-weight: 900; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  .sv-vcard.learned .sv-learned-dot { display: flex; }

  /* 하단 고정 바 */
  .sv-foot { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; background: var(--panel2); border-top: 1px solid var(--line); }
  .sv-progress-txt { font-size: 13.5px; font-weight: 700; color: var(--sub); }
  .sv-progress-txt b { color: var(--accentSoft); }
  .sv-btn { padding: 12px 26px; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, var(--accent2) 0%, var(--accent) 100%); color: #fff; box-shadow: 0 5px 14px rgba(0,0,0,0.3); transition: transform 0.14s ease, filter 0.14s ease; }
  .sv-btn:hover { transform: translateY(-2px); filter: brightness(1.07); }
  .sv-btn.ghost { background: var(--panel); border: 1.5px solid var(--line); color: var(--text); box-shadow: none; }
  .sv-btn.pulse { animation: svPulse 1.4s ease-in-out infinite; }
  @keyframes svPulse { 0%,100% { box-shadow: 0 5px 14px rgba(0,0,0,0.3); } 50% { box-shadow: 0 5px 22px color-mix(in srgb, var(--accent2) 70%, transparent); } }

  /* 퀴즈 */
  .sv-quiz-wrap { max-width: 940px; width: 100%; margin: 0 auto; }
  .sv-qbar { height: 12px; border-radius: 999px; background: var(--panel2); overflow: hidden; margin-bottom: 26px; }
  .sv-qbar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accentSoft)); width: 0; transition: width 0.3s ease; }
  .sv-qcount { text-align: center; font-size: 17px; color: var(--sub); font-weight: 700; margin-bottom: 22px; }
  .sv-qcard { background: var(--panel2); border: 1.5px solid var(--line); border-radius: 22px; padding: 48px 34px; text-align: center; margin-bottom: 30px; }
  .sv-qlabel { font-size: 17px; color: var(--sub); font-weight: 700; margin-bottom: 20px; }
  .sv-qmean { font-size: 32px; font-weight: 700; line-height: 1.5; color: var(--text); }
  .sv-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .sv-opt { padding: 38px 16px; border-radius: 18px; background: var(--panel2); border: 1.5px solid var(--line); color: var(--text); font-size: 28px; font-weight: 800; cursor: pointer; transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease; }
  .sv-opt:hover { transform: translateY(-2px); border-color: var(--accent2); }
  .sv-opt.correct { background: rgba(76,175,114,0.25); border-color: #4caf72; color: #d7fbe6; }
  .sv-opt.wrong { background: rgba(229,115,115,0.22); border-color: #e57373; color: #ffd9d9; }
  .sv-opt:disabled { cursor: default; }

  /* 결과 */
  .sv-result { max-width: 560px; margin: 8px auto 0; text-align: center; }
  .sv-score-ring { width: 180px; height: 180px; border-radius: 50%; margin: 10px auto 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: conic-gradient(var(--accent2) var(--deg, 0deg), var(--panel2) 0deg); position: relative; }
  .sv-score-ring::before { content: ''; position: absolute; inset: 14px; border-radius: 50%; background: var(--panel); }
  .sv-score-ring .sv-pct { position: relative; font-size: 46px; font-weight: 900; color: var(--accentSoft); line-height: 1; }
  .sv-score-ring .sv-pct small { font-size: 20px; }
  .sv-score-ring .sv-pctlb { position: relative; font-size: 13px; color: var(--sub); font-weight: 700; margin-top: 4px; }
  .sv-result h2 { font-size: 22px; font-weight: 800; margin: 4px 0 6px; }
  .sv-result .sv-sub { font-size: 14px; color: var(--sub); font-weight: 600; margin-bottom: 18px; }
  .sv-wrong-box { text-align: left; background: var(--panel2); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px 18px; margin: 0 auto 20px; max-width: 520px; }
  .sv-wrong-box h3 { margin: 0 0 10px; font-size: 14px; font-weight: 800; color: #ffb4b4; }
  .sv-wrong-box ul { list-style: none; margin: 0; padding: 0; }
  .sv-wrong-box li { padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .sv-wrong-box li:last-child { border-bottom: none; }
  .sv-wrong-box li b { color: var(--accentSoft); margin-right: 8px; }
  .sv-wrong-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sv-wrong-item { position: relative; cursor: pointer; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease, box-shadow 0.14s ease; }
  .sv-wrong-item:hover { transform: translateY(-2px); border-color: var(--accent2); }
  .sv-wrong-item b { display: block; color: #ffb4b4; font-size: 15px; margin-bottom: 3px; }
  .sv-wrong-item .sv-wi-m { font-size: 12.5px; color: var(--sub); line-height: 1.4; }
  .sv-wrong-item .sv-wi-dot { position: absolute; top: 8px; right: 9px; width: 20px; height: 20px; border-radius: 50%; background: #fff; color: var(--accent); font-size: 12px; font-weight: 900; display: none; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
  .sv-wrong-item.learned { background: linear-gradient(160deg, color-mix(in srgb, var(--accent2) 55%, var(--panel2)) 0%, color-mix(in srgb, var(--accent) 28%, var(--panel2)) 100%); border-color: var(--accentSoft); box-shadow: 0 5px 16px color-mix(in srgb, var(--accent2) 38%, transparent); }
  .sv-wrong-item.learned b { color: #ffffff; }
  .sv-wrong-item.learned .sv-wi-m { color: color-mix(in srgb, var(--accentSoft) 70%, #ffffff); }
  .sv-wrong-item.learned .sv-wi-dot { display: flex; }
  @media (max-width: 520px) { .sv-wrong-list { grid-template-columns: 1fr; } }
  .sv-result-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .sv-empty { text-align: center; padding: 60px 20px; color: var(--sub); font-weight: 700; }

  /* 경고 팝업 */
  .sv-modal-ov { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(3px); }
  .sv-modal { background: var(--panel2); border: 1.5px solid var(--line); border-radius: 18px; padding: 26px 24px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: svPop 0.25s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes svPop { from { transform: scale(0.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .sv-modal .sv-modal-ic { font-size: 42px; line-height: 1; }
  .sv-modal h3 { margin: 12px 0 8px; font-size: 18px; font-weight: 800; color: var(--text); }
  .sv-modal p { margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: var(--sub); font-weight: 600; }
  .sv-modal p b { color: var(--accentSoft); font-weight: 900; }

  /* 정답/오답 피드백 메시지 + 폭죽 */
  .sv-feedback { position: fixed; top: 42%; left: 50%; transform: translate(-50%,-50%); z-index: 60; padding: 22px 46px; border-radius: 22px; font-size: 35px; font-weight: 900; color: #fff; box-shadow: 0 14px 38px rgba(0,0,0,0.45); animation: svFbPop 1.15s ease forwards; pointer-events: none; white-space: normal; text-align: center; max-width: 80vw; line-height: 1.3; }
  .sv-feedback.ok { background: linear-gradient(135deg, #4caf72 0%, #2e8b57 100%); }
  .sv-feedback.no { background: linear-gradient(135deg, #ff8a65 0%, #e4572e 100%); }
  @keyframes svFbPop { 0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0; } 16% { transform: translate(-50%,-50%) scale(1.14); opacity: 1; } 80% { transform: translate(-50%,-50%) scale(1); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 0; } }
  .sv-confetti { position: fixed; top: -14px; z-index: 55; width: 10px; height: 14px; pointer-events: none; will-change: transform, opacity; }
  @keyframes svConfFall { 0% { transform: translateY(0) rotateZ(0deg); opacity: 1; } 100% { transform: translateY(104vh) rotateZ(680deg); opacity: 0.85; } }
</style>
</head>
<body>
  <div class="sv-top">
    <div class="sv-title" id="svTitle">어휘 학습</div>
    <span class="sv-pill">📖 어휘 50선</span>
    <button class="sv-close" id="svClose" title="닫기">&times;</button>
  </div>
  <div class="sv-body" id="svBody"></div>
  <div class="sv-foot" id="svFoot" style="display:none;"></div>

<script src="/speed-reading-workbook-data.js?v=20261108b"></script>
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const BOOK = qs.get('book') || '';
  const TITLE = qs.get('title') || '';
  const AUTHOR = qs.get('author') || '';
  const THEME = qs.get('theme') === 'adv' ? 'adv' : 'basic';
  if (THEME === 'adv') document.body.setAttribute('data-theme', 'adv');
  // 이야기별 배경 삽화 아주 연하게
  try {
    const _base = BOOK.replace(/_(adv|basic)$/, '');
    const _ov = THEME === 'adv' ? '14,18,32' : '16,26,20';
    document.body.style.background = 'linear-gradient(rgba(' + _ov + ',0.88), rgba(' + _ov + ',0.9)), url(\'/images/서술형집중대비/_배경/' + _base + '.jpg?v=20261109w\') center/cover no-repeat';
  } catch (e) {}

  const body = document.getElementById('svBody');
  const foot = document.getElementById('svFoot');
  const titleEl = document.getElementById('svTitle');
  titleEl.innerHTML = (TITLE || '어휘 학습') + (AUTHOR ? '<span class="sv-author">' + AUTHOR + '</span>' : '');

  document.getElementById('svClose').onclick = () => {
    try { parent.postMessage({ type: 'seosulVocabClose' }, '*'); } catch (e) {}
  };

  // ── 어휘 데이터 로드 ──
  // VOCAB_ALL: epVocab 10화×5 = 50개 전부(중복 포함) → 익히기 카드에 표시
  // VOCAB: 단어 기준 중복 제거 → 퀴즈(문항 중복 방지)
  function loadVocabAll() {
    const data = (window.SR_WORKBOOK_DATA || {})[BOOK];
    if (!data || !Array.isArray(data.epVocab)) return [];
    const out = [];
    data.epVocab.forEach(ep => { (ep || []).forEach(v => { if (v && v.w) out.push({ w: v.w, m: v.m || '' }); }); });
    return out;
  }
  const VOCAB_ALL = loadVocabAll();
  const VOCAB = (function () {
    const seen = new Set(); const out = [];
    VOCAB_ALL.forEach(v => { if (!seen.has(v.w)) { seen.add(v.w); out.push(v); } });
    return out;
  })();

  function shuffle(a) { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  const CHEERS = ['정답이에요! 🎉', '멋져요! 👏', '완벽해요! ✨', '최고예요! 🌟', '잘했어요! 💯', '대단해요! 🔥', '척척박사! 🧠', '그렇지, 바로 그거예요! 👍', '어휘 왕! 👑', '훌륭해요! 🌈'];
  const ENCOURAGE = ['괜찮아요, 다시 기억해요! 💪', '아쉬워요! 한 번 더 외워봐요 📖', '실수는 누구나 해요 😊', '천천히 다시 떠올려봐요 🍀', '거의 다 왔어요! ✊', '이 단어 꼭 기억해요 ✍️', '힘내요, 다음엔 맞힐 거예요 🌟', '조금만 더 집중! 🔎', '포기하지 말아요! 🌱'];

  // 중앙 피드백 메시지
  function showFeedback(msg, ok) {
    const el = document.createElement('div');
    el.className = 'sv-feedback ' + (ok ? 'ok' : 'no');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
  // 폭죽(컨페티) 효과
  function confettiBurst() {
    const colors = ['#ffd24a', '#4caf72', '#5a7bf0', '#ff8a65', '#e57fd0', '#4dd0e1', '#fff176'];
    for (let i = 0; i < 36; i++) {
      const c = document.createElement('div');
      c.className = 'sv-confetti';
      c.style.left = (Math.random() * 100) + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() < 0.5 ? '50%' : '2px';
      const dur = 0.9 + Math.random() * 0.9;
      const delay = Math.random() * 0.2;
      c.style.animation = 'svConfFall ' + dur + 's cubic-bezier(0.3,0.1,0.5,1) ' + delay + 's forwards';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), (dur + delay) * 1000 + 120);
    }
  }

  if (!VOCAB_ALL.length) {
    body.innerHTML = '<div class="sv-empty">아직 이 작품의 어휘 데이터가 준비되지 않았어요.</div>';
    return;
  }

  // ═══════════ 1단계 · 익히기 ═══════════
  function renderLearn() {
    body.classList.remove('sv-center');
    body.innerHTML =
      '<div class="sv-stage-head"><h2>① 어휘 익히기</h2><p>낱말과 뜻을 보며 외운 뒤, 카드를 누르면 ✓ 표시돼요 · 전체 ' + VOCAB_ALL.length + '개</p></div>' +
      '<div class="sv-learn-grid" id="svLearnGrid">' +
      VOCAB_ALL.map((v, i) =>
        '<div class="sv-vcard" data-i="' + i + '">' +
        '<span class="sv-learned-dot">✓</span>' +
        '<span class="sv-word">' + v.w + '</span>' +
        '<span class="sv-mean">' + v.m + '</span>' +
        '</div>'
      ).join('') +
      '</div>';
    body.querySelectorAll('.sv-vcard').forEach(card => {
      card.onclick = () => { card.classList.toggle('learned'); updateFoot(); };
    });
    foot.style.display = 'flex';
    updateFoot();
  }
  function updateFoot() {
    const learned = body.querySelectorAll('.sv-vcard.learned').length;
    const all = learned >= VOCAB_ALL.length;
    foot.innerHTML =
      '<span class="sv-progress-txt">외운 어휘 <b>' + learned + '</b> / ' + VOCAB_ALL.length + '</span>' +
      '<button class="sv-btn' + (all ? ' pulse' : '') + '" id="svToQuiz">퀴즈 풀기 →</button>';
    document.getElementById('svToQuiz').onclick = () => {
      const got = body.querySelectorAll('.sv-vcard.learned').length;
      const remain = VOCAB_ALL.length - got;
      if (remain > 0) { showLearnWarn(remain); return; }
      renderQuiz();
    };
  }
  function showWarnModal(innerHtml) {
    const ov = document.createElement('div');
    ov.className = 'sv-modal-ov';
    ov.innerHTML = '<div class="sv-modal"><div class="sv-modal-ic">⚠️</div>' + innerHtml + '<button class="sv-btn" id="svWarnOk">확인</button></div>';
    document.body.appendChild(ov);
    ov.querySelector('#svWarnOk').onclick = () => ov.remove();
    ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
  }
  function showLearnWarn(remain) {
    showWarnModal('<h3>아직 다 외우지 않았어요</h3><p>외우지 않은 어휘가 <b>' + remain + '개</b> 남았어요.<br>모든 어휘를 외운 뒤 카드를 눌러 ✓ 표시하고<br>퀴즈를 풀어 주세요.</p>');
  }
  function showResultWarn(remain) {
    showWarnModal('<h3>아직 다 외우지 않았어요</h3><p>다시 볼 어휘 <b>' + remain + '개</b>가 남았어요.<br>모두 외운 뒤 카드를 눌러 ✓ 표시하고<br>학습을 완료해 주세요.</p>');
  }

  // ═══════════ 2단계 · 퀴즈 (뜻 → 낱말 4지선다) ═══════════
  // 틀리면 선지를 다시 섞어 같은 문제 재도전 · 맞혀야 다음으로 / 정답률=첫 시도 정답 비율
  let quizOrder = [], qIdx = 0, correctCount = 0, wrongList = [], curMissed = false;
  function renderQuiz() {
    quizOrder = shuffle(VOCAB.map((_, i) => i));
    qIdx = 0; correctCount = 0; wrongList = [];
    foot.style.display = 'none';
    body.classList.add('sv-center');
    goQuestion(0);
  }
  function goQuestion(i) {
    if (i >= quizOrder.length) { renderResult(); return; }
    qIdx = i; curMissed = false; showQuestion();
  }
  function showQuestion() {
    const vi = quizOrder[qIdx];
    const v = VOCAB[vi];
    // 보기: 정답 + 오답 3 (다른 낱말에서) — 매 도전마다 다시 섞임
    const others = shuffle(VOCAB.map((_, i) => i).filter(i => i !== vi)).slice(0, 3);
    const opts = shuffle([vi, ...others]);
    body.innerHTML =
      '<div class="sv-quiz-wrap">' +
      '<div class="sv-qbar"><i style="width:' + Math.round(qIdx / quizOrder.length * 100) + '%"></i></div>' +
      '<div class="sv-qcount">' + (qIdx + 1) + ' / ' + quizOrder.length + (curMissed ? ' · 다시 풀어요 🔁' : '') + '</div>' +
      '<div class="sv-qcard"><div class="sv-qlabel">다음 뜻에 알맞은 낱말은?</div><div class="sv-qmean">' + v.m + '</div></div>' +
      '<div class="sv-opts" id="svOpts">' +
      opts.map(i => '<button class="sv-opt" data-i="' + i + '">' + VOCAB[i].w + '</button>').join('') +
      '</div></div>';
    const optEls = body.querySelectorAll('.sv-opt');
    optEls.forEach(btn => {
      btn.onclick = () => {
        const picked = +btn.getAttribute('data-i');
        optEls.forEach(b => b.disabled = true);
        if (picked === vi) {
          btn.classList.add('correct');
          if (!curMissed) correctCount++;         // 첫 시도에 맞혔을 때만 점수
          showFeedback(pick(CHEERS), true); confettiBurst();
          setTimeout(() => goQuestion(qIdx + 1), 950);   // 맞혀야 다음 문제
        } else {
          btn.classList.add('wrong');
          if (!curMissed) { wrongList.push(v); curMissed = true; }  // 오답 1회만 기록
          showFeedback(pick(ENCOURAGE), false);
          setTimeout(() => showQuestion(), 1350);   // 같은 문제, 선지 다시 섞어 재도전
        }
      };
    });
  }

  // ═══════════ 3단계 · 결과 (정답률) ═══════════
  function renderResult() {
    body.classList.add('sv-center');
    const total = quizOrder.length;
    const pct = Math.round(correctCount / total * 100);
    const deg = Math.round(pct / 100 * 360);
    const praise = pct >= 90 ? '완벽해요! 🏆' : pct >= 70 ? '잘했어요! 👍' : pct >= 50 ? '조금 더 복습해요 💪' : '다시 한번 익혀봐요 📖';
    body.innerHTML =
      '<div class="sv-result">' +
      '<div class="sv-score-ring" style="--deg:' + deg + 'deg"><span class="sv-pct">' + pct + '<small>%</small></span><span class="sv-pctlb">정답률</span></div>' +
      '<h2>' + praise + '</h2>' +
      '<div class="sv-sub">' + total + '문제 중 <b style="color:var(--accentSoft)">' + correctCount + '개</b> 정답 · 오답 ' + wrongList.length + '개</div>' +
      (wrongList.length
        ? '<div class="sv-wrong-box"><h3>✍️ 다시 볼 어휘 ' + wrongList.length + '개 · 외운 뒤 눌러 ✓</h3><div class="sv-wrong-list">' +
          wrongList.map((v, i) => '<div class="sv-wrong-item" data-i="' + i + '"><span class="sv-wi-dot">✓</span><b>' + v.w + '</b><span class="sv-wi-m">' + v.m + '</span></div>').join('') + '</div></div>'
        : '<div class="sv-wrong-box" style="border-color:var(--accent2)"><h3 style="color:var(--accentSoft)">🎉 틀린 어휘가 없어요!</h3></div>') +
      '<div class="sv-result-btns">' +
      '<button class="sv-btn ghost" id="svRetry">다시 풀기</button>' +
      '<button class="sv-btn" id="svDone">학습 완료</button>' +
      '</div></div>';
    body.querySelectorAll('.sv-wrong-item').forEach(it => {
      it.onclick = () => it.classList.toggle('learned');
    });
    document.getElementById('svRetry').onclick = renderQuiz;
    document.getElementById('svDone').onclick = () => {
      if (wrongList.length) {
        const learned = body.querySelectorAll('.sv-wrong-item.learned').length;
        const remain = wrongList.length - learned;
        if (remain > 0) { showResultWarn(remain); return; }
      }
      try { parent.postMessage({ type: 'seosulVocabClose' }, '*'); } catch (e) {}
    };
    // 부모(메뉴)에 정답률 보고 → 카드 배지 갱신
    try { parent.postMessage({ type: 'seosulVocabScore', book: BOOK, pct: pct, total: total, correct: correctCount }, '*'); } catch (e) {}
  }

  renderLearn();
})();
</script>
</body>
</html>
