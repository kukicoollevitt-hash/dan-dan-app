<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧪 색이 알려 주는 비밀 — 산과 염기의 화해 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작화학09/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "새롬이가 맛보지 않고 눈으로만 산성과 염기성을 구별하는 방법을 찾고 싶어 한 까닭은 무엇인가요?", "options": ["맛보는 것이 귀찮았기 때문에", "어떤 산과 염기는 위험해서 함부로 맛보거나 만지면 안 되기 때문에", "색깔 놀이가 재미있어 보였기 때문에", "어머니가 부엌에 들어오지 못하게 했기 때문에"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "꿈속에 나온 산이와 염이의 성격으로 알맞은 것은 무엇인가요?", "options": ["산이는 톡 쏘고 급한 성격, 염이는 쓰고 미끈미끈한 성격이었다", "산이는 느긋하고 염이는 급했다", "둘 다 조용하고 얌전했다", "둘 다 처음부터 사이가 좋았다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "보라색 양배추 물에 레몬즙과 비눗물을 각각 넣었을 때의 변화로 알맞은 것은 무엇인가요?", "options": ["레몬즙을 넣으면 노랗게, 비눗물을 넣으면 까맣게 변했다", "둘 다 색이 변하지 않았다", "레몬즙을 넣으면 빨갛게, 비눗물을 넣으면 초록색으로 변했다", "레몬즙을 넣으면 파랗게, 비눗물을 넣으면 빨갛게 변했다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "피에이치(pH) 숫자에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["숫자가 클수록 산성이 세다", "0이 한가운데인 중성이다", "숫자는 1부터 100까지 있다", "0부터 14까지 있고, 한가운데인 7이 중성이다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "산이와 염이가 싸우는 꿈 이야기가 하는 역할은 무엇인가요?", "options": ["정반대인 산과 염기가 만나 중화되는 원리를 화해 이야기로 쉽게 보여 준다", "꿈은 반대로 이루어진다는 것을 알려 준다", "새롬이가 잠을 많이 잔다는 것을 보여 준다", "산이 염기보다 세다는 것을 보여 준다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "9장에서 새롬이가 깨달은 가장 중요한 생각은 무엇인가요?", "options": ["산성은 나쁘고 염기성은 좋다는 것", "실험은 어른과 함께해야 한다는 것", "어느 쪽이 나쁜 것이 아니라, 한쪽으로 치우치지 않는 균형이 중요하다는 것", "염기성은 나쁘고 산성은 좋다는 것"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'지시약'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["병을 치료하는 데 쓰는 약", "단맛을 내는 요리 재료", "실험 기구를 닦는 세제", "산성인지 염기성인지를 색깔로 알려 주는 물질"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'중화'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["산과 염기가 알맞게 만나 서로의 지나친 성질을 없애는 것", "두 물질을 얼려서 굳히는 것", "물질을 불에 태워 없애는 것", "산성을 더 세게 만드는 것"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "속이 쓰릴 때 먹는 약이 염기성인 까닭을 짐작하면 무엇인가요?", "options": ["염기성 약이 위를 차갑게 식혀 주기 때문에", "염기성은 무엇이든 녹이기 때문에", "너무 세진 산성 위산을 중화시켜 쓰림을 가라앉히기 때문에", "염기성 약이 더 맛있기 때문에"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "\"정반대인 둘이 알맞게 만나면, 다툼이 아니라 새것이 태어나요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["서로 다른 것도 알맞게 어우러지면 물과 소금처럼 새로운 것을 만든다는 뜻", "반대되는 것끼리는 만나지 않는 것이 좋다는 뜻", "싸움에서 이긴 쪽이 새것을 갖는다는 뜻", "쌍둥이는 성격이 반대라는 뜻"], "correct": 0}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "새롬이의 탐구가 발전해 간 순서로 가장 적절한 것은 무엇입니까?", "options": ["숫자 계산 → 맛보기 → 색 관찰", "꿈 → 실험 → 맛보기", "할머니의 강의 → 암기 → 시험", "맛의 차이 발견 → 색으로 구별(지시약) → 세기(pH) → 중화의 원리와 활용"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "리트머스 할머니의 가르침 방식으로 가장 적절한 것은 무엇입니까?", "options": ["책을 읽어 오게 한 뒤 시험을 본다", "위험한 실험을 직접 해 보게 한다", "직접 시범을 보이고, 다음 궁금증을 남겨 스스로 찾아오게 한다", "한 번에 모든 지식을 알려 준다"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "리트머스 종이의 색 변화에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["푸른 종이가 붉게 변하면 산성, 붉은 종이가 푸르게 변하면 염기성이다", "중성 물질은 종이를 검게 만든다", "붉은 종이가 푸르게 변하면 산성이다", "푸른 종이가 붉게 변하면 염기성이다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "중화가 일어날 때 생기는 것으로 옳은 것은 무엇입니까?", "options": ["빛과 소리가 난다", "물과 염(예: 소금)이 생기고 열도 조금 난다", "아무것도 생기지 않는다", "기체만 생긴다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "꿈(5~6장)이라는 장치를 사용한 서사적 효과로 가장 적절한 것은 무엇입니까?", "options": ["실험의 위험성을 경고하는 효과", "눈에 보이지 않는 화학 반응을 인물들의 갈등과 화해로 형상화하는 효과", "새롬이의 게으름을 보여 주는 효과", "이야기의 길이를 늘이는 효과"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'요리하는 어머니'를 다시 바라보는 결말 장면의 의미는 무엇입니까?", "options": ["배운 과학이 일상의 균형 감각으로 확장되었음을 보여 준다", "요리는 여자의 일이라는 생각을 굳힌다", "어머니가 화학자였음이 밝혀진다", "새롬이가 요리사가 되기로 결심한다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'지시약'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["실험 순서를 알려 주는 설명서", "반응 속도를 빠르게 하는 물질", "용액의 산성·염기성을 색 변화로 나타내 주는 물질", "약의 복용법을 적은 종이"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'중성'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["산성이 아주 약한 상태", "염기성이 아주 강한 상태", "산성과 염기성이 번갈아 나타나는 상태", "산성도 염기성도 아닌 중간 상태"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "산성이 된 농사 땅에 염기성 가루를 뿌리는 일에서 추론할 수 있는 원리는 무엇입니까?", "options": ["치우친 성질을 반대 성질로 중화시켜 균형을 되찾는 것", "염기성 가루가 벌레를 쫓는 것", "가루가 흙을 부드럽게 하는 것", "땅을 더 산성으로 만들어 소독하는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'산성인 위산도 꼭 필요한 것'이라는 서술에서 추론할 수 있는 이 책의 관점은 무엇입니까?", "options": ["위산은 적을수록 좋다", "염기성 물질만 몸에 이롭다", "산성 물질은 모두 해롭다", "물질의 성질에는 선악이 없으며 문제는 지나친 치우침에 있다"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "새롬이의 탐구 태도에서 가장 두드러지는 과학적 덕목은 무엇인가?", "options": ["일상의 사소한 차이를 지나치지 않고 물음으로 바꾸는 관찰력과 안전을 고려한 탐구 설계", "한 번의 실험으로 결론을 내리는 결단력", "권위자의 말을 그대로 수용하는 순응성", "실패를 두려워하지 않는 무모함"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "산이와 염이가 '자기들은 정반대라 절대 섞일 수 없다'고 믿었던 것이 서사에서 하는 역할은 무엇인가?", "options": ["두 인물의 어리석음을 조롱하는 장치", "산과 염기의 위험성을 경고하는 장치", "실험 없이 결론 내리는 태도를 옹호하는 장치", "중화라는 반전의 극적 효과를 키우는 통념의 제시"], "correct": 3},

      {"gate": 4, "category": "내용일치", "question": "생활 속 중화의 예로 이 책에 소개되지 않은 것은 무엇인가?", "options": ["속쓰림에 염기성 약 먹기", "생선 비린내에 산성인 레몬 뿌리기", "김치를 오래 익혀 신맛 내기", "산성화된 농토에 염기성 가루 뿌리기"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'맛 → 색 → 숫자'로 이어지는 구별 방법의 발전 과정이 보여 주는 과학의 특징은 무엇인가?", "options": ["과학은 감각을 완전히 배제한다", "오래된 방법일수록 정확하다", "감각적 경험을 안전하고 객관적인 측정 수단으로 정교화해 가는 과정", "도구가 많을수록 진리에 가깝다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'미움이 풀리는 자리가 따뜻해지는 것 같았다'는 표현이 가리키는 화학적 사실은 무엇인가?", "options": ["산이 금속을 녹일 때 빛이 나는 것", "중화 반응이 일어날 때 열이 발생하는 것", "염기가 기름때를 녹이는 것", "지시약이 색을 바꾸는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'천연 지시약'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["자연에서 얻은 재료로 산성·염기성을 색 변화로 판별하는 물질", "공장에서 정밀하게 만든 시험지", "자연 상태 그대로의 깨끗한 물", "식물에서 짜낸 즙 전부"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'염(鹽)'에 대한 이 책의 설명으로 가장 적절한 것은 무엇인가?", "options": ["염기의 다른 이름", "바닷물에서만 나는 광물", "위산을 만드는 재료", "중화 때 물이 되지 않고 남은 알갱이들이 결합해 만든 새로운 물질"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'색은 거짓말을 하지 않았다'는 서술이 함축하는 측정의 가치를 추론하면 무엇인가?", "options": ["아름다운 색일수록 안전한 물질이다", "주관적 감각(맛) 대신 객관적 신호(색 변화)에 근거할 때 판단이 안전하고 정확해진다", "색맹인 사람은 과학을 할 수 없다", "색이 변하지 않는 물질은 존재하지 않는다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「정반대인 둘이 알맞게 만나면, 다툼이 아니라 새것이 태어나요.」라는 경구를 삶의 지혜로 확장할 때 가장 적절한 해석은 무엇인가?", "options": ["갈등은 어느 한쪽이 완전히 이겨야 끝난다", "반대되는 것은 처음부터 만나지 않게 해야 한다", "대립하는 성질도 알맞은 균형 속에서 만나면 서로를 보완하며 가치 있는 것을 만들어 낸다", "성격이 같은 사람끼리만 어울려야 한다"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '색이 알려 주는 비밀' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'chem09',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'chem09',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
