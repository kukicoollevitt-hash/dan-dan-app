<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 산소를 주고받는 사이 — 녹슨 못과 붉은 구리 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작화학10/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "무쇠가 못 세 개를 마른 상자, 물기 있는 흙, 기름 바르기로 나누어 둔 것에서 알 수 있는 태도는 무엇인가요?", "options": ["못을 아껴 쓰려는 알뜰한 태도", "심심해서 아무렇게나 늘어놓는 태도", "조건을 다르게 하여 비교해 보는 탐구하는 태도", "아버지 몰래 장난치는 태도"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "아버지가 무쇠를 가르치는 방식으로 알맞은 것은 무엇인가요?", "options": ["대장간 화로 앞에서 직접 보여 주며 설명해 주었다", "책을 사 주고 혼자 읽게 했다", "위험하다며 아무것도 알려 주지 않았다", "학교 선생님께 데려가 물어보게 했다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "며칠 뒤 못 세 개를 살펴본 결과로 알맞은 것은 무엇인가요?", "options": ["세 개 모두 붉게 녹슬었다", "기름 바른 못만 녹슬었다", "세 개 모두 멀쩡했다", "물기 있는 곳의 못만 녹슬고, 기름 바른 못과 마른 상자 속 못은 멀쩡했다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "철광석에서 반짝이는 쇠를 얻는 방법으로 알맞은 것은 무엇인가요?", "options": ["철광석을 물에 오래 담가 둔다", "철광석을 숯과 함께 화로에 넣고 달구어, 숯이 산소를 빼앗아 가게 한다", "철광석을 망치로 두드려 쪼갠다", "철광석에 기름을 발라 둔다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "쇠의 녹과 촛불을 나란히 보여 준 까닭은 무엇인가요?", "options": ["둘 다 산소와 만나는 산화이며, 다만 속도가 다를 뿐임을 알려 주려고", "녹이 불보다 무섭다는 것을 알려 주려고", "촛불로 녹을 없앨 수 있음을 알려 주려고", "불조심을 강조하려고"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "무쇠가 산화와 환원을 저울에 빗댄 까닭은 무엇인가요?", "options": ["저울로 녹의 무게를 잴 수 있기 때문에", "산소는 무게가 없기 때문에", "쇠가 저울로 만들어지기 때문에", "한쪽이 내려가면 다른 쪽이 올라가듯, 산소를 얻는 일과 잃는 일이 언제나 함께 일어나기 때문에"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'산화'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["물질이 얼음처럼 굳는 것", "물질이 산소를 얻어 다른 물질로 변하는 것", "물질이 물에 녹는 것", "물질이 산에서 캐어지는 것"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'환원'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["물질을 뜨겁게 녹이는 것", "물질을 잘게 부수는 것", "물질이 산소를 잃는 것", "물질을 원래 자리에 돌려놓는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "강 위의 다리나 바다의 배에 페인트를 두껍게 칠하는 까닭을 짐작하면 무엇인가요?", "options": ["산소와 물기가 쇠에 닿지 못하게 막아 녹스는 것을 막으려고", "멀리서도 잘 보이게 하려고", "무게를 늘려 튼튼하게 하려고", "색을 칠하면 값이 비싸지기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"하나가 얻으면 하나가 잃어요. 변화는 언제나 주고받음이지요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["무엇이든 잃기만 하는 쪽이 정해져 있다는 뜻", "얻는 것보다 잃는 것이 많다는 뜻", "산소를 주고받는 산화와 환원은 언제나 짝을 이루어 함께 일어난다는 뜻", "물건을 사고팔 때는 흥정을 해야 한다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "무쇠의 실험 설계(세 가지 조건의 못)가 훌륭한 이유로 가장 적절한 것은 무엇입니까?", "options": ["비싼 도구 없이 조건을 통제하여 원인을 비교할 수 있게 했기 때문", "실험 기간이 매우 짧았기 때문", "아버지의 허락을 받았기 때문", "못을 세 개나 사용했기 때문"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "녹슨 못을 '특별한 첫 번째 선생님'이라고 부르게 된 무쇠의 변화는 무엇을 보여 줍니까?", "options": ["대장간 일을 물려받겠다는 결심", "성가신 현상도 탐구를 거치면 세상의 규칙을 알려 주는 배움의 계기가 된다는 것", "녹슨 못을 수집하는 취미가 생겼다는 것", "아버지에 대한 존경심"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "우리 몸에서 일어나는 산화에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["먹은 음식이 몸속에서 산소와 만나 천천히 타며 힘과 온기를 낸다", "몸속에서는 산화가 일어나지 않는다", "숨을 쉬는 것은 이산화탄소를 들이기 위해서다", "몸속의 산화는 촛불보다 빠르게 일어난다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "화로 속에서 일어나는 일에 대한 서술로 옳은 것은 무엇입니까?", "options": ["숯이 산소를 잃고 철광석이 산소를 얻는다", "철광석과 숯이 모두 산소를 얻는다", "철광석은 산소를 잃어 환원되고, 숯은 그 산소를 얻어 산화된다", "아무런 반응도 일어나지 않는다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'녹(느린 산화) - 촛불(빠른 산화=연소) - 사과의 갈변 - 몸속의 호흡'으로 사례를 넓혀 가는 구성의 효과는 무엇입니까?", "options": ["각 사례가 서로 무관함을 보여 준다", "위험한 실험을 피하는 방법을 알려 준다", "전혀 달라 보이는 현상들이 하나의 규칙(산소와의 만남)으로 꿰어짐을 보여 준다", "실험 재료를 다양하게 소개한다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "5장에서 '쇠는 어디서 오는가'라는 물음이 하는 역할은 무엇입니까?", "options": ["대장간의 역사를 소개하는 배경 설명", "산소를 '얻는' 이야기에서 '떼어내는' 이야기(환원)로 서사를 확장하는 전환점", "무쇠의 지식을 시험하는 퀴즈", "아버지의 직업을 자랑하는 대목"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'연소'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["물질이 산소 없이 스스로 타는 것", "물질이 빛을 받아 색이 변하는 것", "물질이 빠르게 산소와 만나며 빛과 열을 내는 산화", "물질이 천천히 녹아내리는 것"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'도금'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["쇠를 두드려 모양을 잡는 일", "쇠 위에 잘 녹슬지 않는 금속을 얇게 입히는 일", "금을 캐내는 일", "쇠를 뜨겁게 녹이는 일"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "기름칠·페인트·도금이 녹을 막는 공통 원리를 추론하면 무엇입니까?", "options": ["쇠를 더 단단하게 만든다", "쇠의 온도를 낮게 유지한다", "녹을 눈에 보이지 않게 가린다", "산소와 물기가 쇠 표면에 닿는 것을 차단한다"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "'같은 규칙이 문제도 되고 해결책도 되었다'는 서술에서 추론할 수 있는 과학 지식의 가치는 무엇입니까?", "options": ["원리를 이해하면 현상을 막을 수도, 이롭게 이용할 수도 있다", "과학 지식은 언제나 위험을 낳는다", "문제와 해결책은 별개의 지식이다", "규칙은 알아도 활용할 수 없다"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "무쇠의 탐구 여정이 보여 주는 과학적 사고의 발전 단계로 가장 적절한 것은 무엇인가?", "options": ["암기 → 시험 → 응용", "모방 → 반복 → 숙달", "권위 의존 → 반항 → 독립", "현상 관찰 → 통제된 비교 실험 → 원리 발견 → 원리의 일반화와 활용"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "아버지가 철광석이라는 '검붉은 돌'을 직접 보여 준 교육적 효과는 무엇인가?", "options": ["추상적 개념(환원)을 눈앞의 실물과 공정으로 체감하게 한 것", "아들에게 가업을 잇게 하려는 설득", "광물 수집의 취미를 길러 준 것", "돌의 가격을 가르쳐 준 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "산화·환원의 동시성에 대한 서술로 옳은 것은 무엇인가?", "options": ["산화가 끝난 뒤에 환원이 시작된다", "환원은 실험실에서만 일어난다", "산소를 잃는 쪽이 있으면 반드시 그 산소를 얻는 쪽이 있어 둘은 언제나 짝으로 일어난다", "산화와 환원은 서로 무관한 별개의 반응이다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "배터리에 대한 이 책의 설명으로 옳은 것은 무엇인가?", "options": ["배터리 안에서 한쪽은 산소를 얻고 한쪽은 잃으면서 전기가 나온다", "배터리는 녹을 이용해 전기를 저장한다", "배터리는 열을 전기로 바꾸는 장치다", "배터리 안에서는 화학 반응이 일어나지 않는다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'대장간 화로 → 제철소 용광로 → 몸속'으로 규모를 오가는 결말 구성의 효과는 무엇인가?", "options": ["규모가 클수록 원리가 달라짐을 보여 준다", "동일한 원리가 문명의 토대에서 생명 활동까지 관통함을 보여 주어 법칙의 보편성을 각인한다", "제철 산업의 경제적 중요성을 강조한다", "인체의 신비를 과장한다"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'녹의 원리가 거꾸로 녹을 막는 데도 쓰인다'는 역설적 전개가 전달하는 메시지는 무엇인가?", "options": ["녹은 완전히 막을 수 없다", "자연 현상은 인간의 통제 밖에 있다", "원리에 대한 이해가 곧 문제 해결의 열쇠라는 것", "우연한 발견이 계획된 연구보다 낫다"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'산화(酸化)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["물질이 산소와 결합하여 새로운 물질로 변하는 반응", "물질이 산성 용액에 녹는 현상", "물질이 수소를 얻는 반응", "물질이 높은 열에 분해되는 현상"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'환원(還元)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["물질이 기체로 변하는 현상", "이익을 사회에 되돌려 주는 일", "물질이 원래의 모양으로 돌아가는 물리 변화", "화합물이 산소를 잃는 반응"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'철광석 속의 쇠는 이미 녹슨 것과 같은 상태'라는 통찰에서 추론할 수 있는 것은 무엇인가?", "options": ["철광석은 쇠보다 단단하다", "녹슨 못도 원리상 산소를 떼어내면 다시 쇠로 되돌릴 수 있다", "자연 상태의 쇠는 쓸모가 없다", "녹은 땅속에서만 생긴다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「하나가 얻으면 하나가 잃어요. 변화는 언제나 주고받음이지요.」라는 경구가 화학 반응을 넘어 시사하는 세계관은 무엇인가?", "options": ["세상의 변화는 승자와 패자를 반드시 남긴다", "잃지 않으려면 아무것도 주고받지 말아야 한다", "세계의 변화는 고립된 사건이 아니라 서로 주고받는 관계 속에서 일어난다", "모든 교환은 한쪽에 손해다"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '산소를 주고받는 사이' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'chem10',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'chem10',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
