<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ 레몬에서 나온 전기 — 반디와 건전지의 비밀 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작화학11/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "\"새 건전지 사면 되잖아\"라는 말을 듣고도 반디가 서랍을 쉽게 닫지 못한 까닭은 무엇인가요?", "options": ["새 건전지를 살 용돈이 없어서", "다 쓴 건전지를 버리기 아까워서", "서랍이 고장 나서", "건전지 속에서 전기가 나오는 비밀이 궁금했기 때문에"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "반디가 새벽에 이불 속에서 벌떡 일어난 까닭은 무엇인가요?", "options": ["흩어져 있던 생각의 조각들이 맞춰지며 충전의 원리를 스스로 깨달았기 때문에", "무서운 꿈을 꾸었기 때문에", "캠핑 갈 시간이 되었기 때문에", "할아버지가 부르는 소리가 들렸기 때문에"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "할아버지가 보여 준 레몬 전지에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["레몬을 전선으로 감으면 전기가 나왔다", "서로 다른 두 금속판을 꽂고 전선으로 이으니 꼬마전구에 불이 들어왔다", "레몬을 건전지에 문지르니 불이 켜졌다", "레몬즙을 건전지 안에 부어 넣었다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "1차 전지와 2차 전지에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["1차 전지는 크고 2차 전지는 작다", "리모컨용 건전지가 2차 전지다", "1차 전지는 한 번 쓰면 끝이고, 2차 전지는 충전해서 다시 쓸 수 있다", "2차 전지는 두 번만 쓸 수 있다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "맹물로 만든 전지에 불이 켜지지 않은 사건이 이야기에서 하는 역할은 무엇인가요?", "options": ["실패를 통해 전해질이 꼭 필요하다는 것을 알게 해 준다", "반디가 실험을 포기하게 만든다", "맹물이 위험하다는 것을 경고한다", "꼬마전구가 불량품임을 알려 준다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "물을 쪼개는 전기 분해 실험이 충전을 이해하는 열쇠가 된 까닭은 무엇인가요?", "options": ["전기 분해로 새 건전지를 만들 수 있기 때문에", "수소 거품이 전기를 저장하기 때문에", "물이 가장 흔한 물질이기 때문에", "충전도 전기 분해처럼 거꾸로 전기를 흘려 넣어 재료를 되돌리는 일이기 때문에"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'전해질'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["전기를 저장하는 통", "전선을 감싸는 고무", "물에 녹아 전기를 통하게 해 주는 물질", "전구 속의 가는 실"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'전기 분해'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["전선을 여러 가닥으로 나누는 일", "전기의 힘으로 물질을 쪼개어 화학 변화를 일으키는 일", "전구를 분해해서 고치는 일", "건전지를 잘라서 여는 일"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "하룻밤 사이 아연판이 거뭇거뭇하게 삭아 있던 것에서 알 수 있는 사실은 무엇인가요?", "options": ["전지의 전기는 공짜가 아니라 금속 재료가 제 몸을 내어 주며 만든 것이라는 사실", "아연판이 원래 불량품이었다는 사실", "소금물이 너무 짰다는 사실", "밤사이 누가 전지를 망가뜨렸다는 사실"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "수소 자동차가 달린 뒤에 매캐한 연기 대신 물만 남는 까닭을 짐작하면 무엇인가요?", "options": ["물탱크를 싣고 다니기 때문에", "기름을 아주 조금만 쓰기 때문에", "수소와 산소가 만나 전기를 만들고 나면 물이 생기기 때문에", "달리면서 빗물을 모으기 때문에"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "반디의 탐구 과정에서 가장 돋보이는 태도는 무엇입니까?", "options": ["할아버지의 설명을 그대로 암기하는 성실함", "배운 것을 집에서 직접 재현해 보고, 실패하면 이유를 찾아 다시 시도하는 실천력", "위험한 실험을 피하는 신중함", "여러 책을 비교하며 읽는 독서력"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "할아버지가 답을 바로 알려 주지 않고 \"내일 오면 실험을 보여 주마\"라고 한 의도는 무엇입니까?", "options": ["실험 준비에 시간이 필요했기 때문", "가게 문을 닫을 시간이었기 때문", "눈으로 확인하고 스스로 연결 지어 깨닫게 하려는 가르침의 방식", "반디를 매일 오게 하려는 꾀"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "볼타 전지에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["번개의 전기를 모아 두는 장치였다", "자석을 돌려 전기를 만드는 장치였다", "태양빛으로 전기를 만드는 장치였다", "아연판과 구리판을 산성 액체에 담가 만든 세계 최초의 화학 전지였다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "물의 전기 분해 실험 결과로 옳은 것은 무엇입니까?", "options": ["한쪽에서 수소, 다른 쪽에서 산소가 나오며 수소 쪽 거품이 두 배였다", "산소 쪽 거품이 수소 쪽의 두 배였다", "물이 끓어서 수증기가 되었다", "두 막대가 모두 녹아내렸다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'화학 전지'와 '전기 분해'를 나란히 배운 구성이 드러내는 핵심 관계는 무엇입니까?", "options": ["전기 분해가 화학 전지보다 먼저 발명되었다는 것", "화학→전기, 전기→화학으로 에너지가 서로 반대 방향으로 오가는 한 쌍이라는 것", "두 가지 모두 물이 있어야만 일어난다는 것", "화학 전지가 전기 분해보다 안전하다는 것"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "이야기가 '꺼진 손전등'으로 시작해 '충전식 손전등'으로 끝나는 구성의 효과는 무엇입니까?", "options": ["캠핑의 즐거움을 강조하는 효과", "손전등 제품을 홍보하는 효과", "처음의 문제로 돌아와 배움이 삶의 변화로 완성되었음을 보여 주는 효과", "계절의 변화를 알려 주는 효과"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'방전'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["전지에 전기를 채워 넣는 일", "전지 속의 전기를 써서 내보내는 일", "전기가 새어 나가지 않게 막는 일", "전선을 새로 까는 일"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'연료 전지'에 대한 설명으로 가장 적절한 것은 무엇입니까?", "options": ["기름을 태워 전기를 만드는 장치", "전기를 열로 바꾸는 난방 장치", "건전지 여러 개를 묶은 것", "수소와 산소를 만나게 하여 전기를 얻고 물만 남기는 전지"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "1차 전지를 충전할 수 없는 이유를 추론하면 무엇입니까?", "options": ["충전 단자가 없기 때문", "재료가 한번 변하면 전기를 거꾸로 흘려도 원래 모습으로 되돌아가지 못하기 때문", "크기가 너무 작기 때문", "전해질이 들어 있지 않기 때문"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "반디가 다 쓴 건전지를 폐건전지 수거함에 넣게 된 마음의 변화를 추론하면 무엇입니까?", "options": ["전지의 원리와 재료의 수고를 알게 되자 물건을 책임 있게 다루려는 마음이 생겼다", "수거함에 넣으면 상품권을 주기 때문이다", "서랍 정리가 귀찮아졌기 때문이다", "할아버지가 시켰기 때문이다"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "반디의 배움이 완성되는 결정적 장면이 '새벽의 각성'으로 설정된 의미는 무엇인가?", "options": ["새벽 공부가 가장 효율적이라는 교훈", "지식의 통합은 전달받는 것이 아니라 스스로의 사유 속에서 일어난다는 것", "꿈이 문제 해결의 열쇠라는 것", "잠을 줄여야 성공한다는 것"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "'전기를 아껴 쓰는 버릇'이 생긴 반디의 변화가 시사하는 바는 무엇인가?", "options": ["전기 요금이 올랐다는 것", "캠핑 준비가 철저해졌다는 것", "원리에 대한 이해가 대상을 대하는 태도와 습관까지 바꾼다는 것", "할아버지의 잔소리가 효과적이었다는 것"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "화학 전지에서 전기가 흐르는 원리에 대한 서술로 옳은 것은 무엇인가?", "options": ["활발한 금속(아연)이 내보낸 전자가 도선을 타고 다른 금속(구리) 쪽으로 이동하는 것이 전류다", "두 금속이 서로 부딪히며 마찰 전기를 일으킨다", "전해질 속의 물이 전자로 변한다", "구리판이 전자를 내보내고 아연판이 받는다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "전기 분해의 활용 사례로 이 책에 소개된 것은 무엇인가?", "options": ["번개를 모아 저장하는 기술", "금속 표면에 얇은 금속 막을 입히는 전기 도금", "바닷물을 끓여 소금을 얻는 기술", "태양광 발전"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'거꾸로 흐르는 강'이라는 비유가 형상화하는 개념은 무엇인가?", "options": ["전해질 속 물의 순환", "전선 속 전자의 빠르기", "강물 발전의 원리", "화학 에너지와 전기 에너지가 방향을 바꾸어 서로 오가는 가역적 전환"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "'레몬 한 알'이라는 소재가 서사 전체에서 수행하는 기능은 무엇인가?", "options": ["거창한 장치 없이도 전지의 핵심 원리를 눈앞에 구현해 보이는 탐구의 관문", "비타민의 중요성을 알리는 소재", "할아버지의 괴짜스러움을 보여 주는 소품", "캠핑 음식의 재료"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'전해질(電解質)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["전기를 차단하는 절연 물질", "물에 녹아 이온으로 나뉘어 전류를 흐르게 하는 물질", "전지의 겉을 싸는 금속", "전자가 모여 있는 금속판"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'2차 전지'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["두 번째로 발명된 전지", "전지 두 개를 이어 붙인 것", "방전 후 충전을 통해 재료를 되돌려 여러 번 쓸 수 있는 전지", "전압이 두 배인 전지"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'전지와 전기 분해는 서로 반대 방향으로 도는 하나의 바퀴'라는 통찰이 함축하는 에너지관은 무엇인가?", "options": ["에너지는 쓸수록 새로 생겨난다", "전기 에너지가 가장 우월한 형태다", "에너지의 전환은 한 방향으로만 일어난다", "에너지는 소멸하지 않고 형태를 바꾸며 전환된다"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "수소 연료 전지 자동차가 '깨끗한 미래 기술'로 소개되는 근거를 추론하면 무엇인가?", "options": ["소리가 나지 않아 조용하기 때문", "에너지를 얻는 과정의 부산물이 매연이 아니라 물이기 때문", "기존 자동차보다 빠르기 때문", "연료 값이 싸기 때문"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '레몬에서 나온 전기' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'chem11',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'chem11',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
