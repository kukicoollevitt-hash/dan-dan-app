<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍬 설탕은 어디로 사라졌을까 — 솔이의 부엌 실험실 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작화학12/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "솔이가 미숫가루 사건의 궁금증을 할머니 댁까지 '가방에 챙겨' 간 것에서 알 수 있는 성격은 무엇인가요?", "options": ["일상의 궁금한 일을 그냥 넘기지 않고 끝까지 알아내려는 성격", "동생에게 지기 싫어하는 성격", "할머니께 자랑하기 좋아하는 성격", "걱정이 많아 잠을 못 자는 성격"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "사흘 동안 아무 일도 없어 보이자 병을 구석으로 밀어 두었던 솔이가, 나중에 병을 볕이 드는 한가운데로 다시 옮겨 놓은 까닭은 무엇인가요?", "options": ["할머니가 옮기라고 시켰기 때문에", "선반 구석이 좁았기 때문에", "서두른다고 되는 일이 아니라면 기다림도 실험의 한 부분임을 깨달았기 때문에", "병이 예뻐서 장식하고 싶었기 때문에"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "할머니가 컵 두 개로 보여 준 실험의 결과로 알맞은 것은 무엇인가요?", "options": ["두 컵 모두 설탕이 녹지 않았다", "찬물 속 설탕은 버티고, 따뜻한 물 속 설탕은 금세 녹아 물 전체가 골고루 달았다", "찬물에서 설탕이 더 잘 녹았다", "따뜻한 물에서는 설탕이 위로 떠올랐다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "사이다 화채의 김이 빠진 까닭으로 알맞은 것은 무엇인가요?", "options": ["수박과 참외가 거품을 빨아들여서", "설탕을 너무 많이 넣어서", "송이가 몰래 마셔 버려서", "화채가 미지근해지면서 녹아 있던 이산화탄소가 빠져나가서"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "김빠진 사이다 사건이 이야기에서 하는 역할은 무엇인가요?", "options": ["여름 날씨의 무더움을 알려 준다", "솔이가 요리를 그만두게 만든다", "고체와 반대로 움직이는 기체의 용해도를 배우는 계기가 된다", "동생과 화해하는 계기가 된다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "얼음사탕이 만들어진 원리로 알맞은 것은 무엇인가요?", "options": ["뜨거울 때 잔뜩 녹였던 설탕이, 물이 식어 용해도가 줄자 결정으로 되돌아 나온 것", "실이 설탕을 빨아들여 뭉친 것", "설탕물이 햇빛에 얼어붙은 것", "막대에 발라 둔 꿀이 굳은 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "설탕물에서 '용질'과 '용매'는 각각 무엇인가요?", "options": ["용질은 컵, 용매는 숟가락이다", "용질도 물, 용매도 물이다", "용질은 물, 용매는 설탕이다", "녹는 설탕이 용질, 녹이는 물이 용매다"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'포화 용액'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["아주 뜨거운 용액", "용질을 더 녹일 수 없을 만큼 가득 찬 용액", "거품이 나는 용액", "아직 더 녹일 수 있는 용액"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "방학이 끝난 뒤 솔이가 미숫가루를 탈 때 '따뜻한 물 조금에 설탕을 먼저 녹인' 까닭은 무엇인가요?", "options": ["설탕은 따뜻한 물에 잘 녹으니 먼저 녹인 뒤 차게 만들면 달고 시원해지기 때문에", "따뜻한 물이 더 위생적이기 때문에", "찬물이 없었기 때문에", "설탕을 아끼기 위해서"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"모든 것은 제 온도에서 제 만큼만 녹아요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["무엇이든 오래 저으면 다 녹는다는 뜻", "온도에 따라 물질이 녹을 수 있는 양에는 정해진 한계가 있다는 뜻", "뜨거운 것은 무엇이든 위험하다는 뜻", "녹지 않는 것은 버려야 한다는 뜻"], "correct": 1}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "솔이의 탐구 방식이 발전해 가는 모습으로 가장 적절한 것은 무엇입니까?", "options": ["책으로만 공부하다가 실험을 포기한다", "할머니의 답을 암기하는 데서 끝난다", "우연한 실패 → 비교 실험 → 한계 찾기 실험 → 배운 원리로 생활 문제 해결로 나아간다", "동생에게 실험을 대신 시킨다"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "'눈대중으로 대충 넣던' 솔이가 '무게를 재고 온도를 살피게' 된 변화가 의미하는 것은 무엇입니까?", "options": ["요리사가 되기로 결심했다는 것", "과학적 사고가 몸에 밴 습관으로 자리 잡았다는 것", "할머니를 흉내 내게 되었다는 것", "실험 도구를 좋아하게 되었다는 것"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "용해도와 온도의 관계에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["고체와 기체 모두 온도가 높을수록 잘 녹는다", "고체와 기체 모두 온도와 무관하다", "기체는 온도가 높을수록 잘 녹는다", "고체는 대체로 온도가 높을수록 용해도가 커지고, 기체는 반대로 작아진다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "농도에 대한 할머니의 설명으로 옳은 것은 무엇입니까?", "options": ["소금 10g을 물 90g에 녹이면 소금물 100g, 농도 10%가 된다", "소금 10g을 물 100g에 녹이면 농도 10%가 된다", "농도는 용액의 온도를 나타낸다", "농도는 눈대중으로만 잴 수 있다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'사흘째, 아무 일도'라는 장 제목과 '조용한 것과 멈춘 것은 다르다'는 문장의 관계로 가장 적절한 것은 무엇입니까?", "options": ["실험 실패를 미리 알려 주는 복선이다", "변화가 보이지 않는 시간에도 병 속에서는 재결정이 진행되고 있었음을 암시한다", "할머니의 게으름을 꼬집는 표현이다", "여름날의 지루함을 묘사한 것이다"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "이야기가 미숫가루 실패로 시작해 미숫가루 성공으로 끝나는 구성의 효과는 무엇입니까?", "options": ["미숫가루의 영양을 강조하는 효과", "계절 음식을 소개하는 효과", "동생의 성장을 보여 주는 효과", "같은 문제 앞에서 달라진 솔이를 통해 배움의 완성을 보여 주는 효과"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'용해도'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["일정한 온도에서 용매가 녹일 수 있는 용질의 최대량", "용액이 어는 온도", "용질이 녹는 속도", "용액의 진하기를 백분율로 나타낸 것"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'재결정'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["결정을 잘게 부수는 일", "두 가지 용액을 섞는 일", "녹아 있던 물질이 용해도가 줄면서 다시 결정으로 나오는 것", "실수를 바로잡아 다시 결정하는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "탄산음료를 차갑게 보관해야 하는 이유를 추론하면 무엇입니까?", "options": ["차가우면 설탕이 더 잘 녹기 때문", "병이 깨지는 것을 막기 위해서", "세균 번식을 막기 위해서만", "온도가 낮을수록 기체의 용해도가 커서 톡 쏘는 이산화탄소가 달아나지 않기 때문"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "'할머니의 손맛 뒤에는 정확한 과학이 숨어 있다'는 서술에서 추론할 수 있는 것은 무엇입니까?", "options": ["손맛은 과학으로 설명할 수 없다", "오랜 경험으로 익힌 살림의 지혜가 사실은 농도·용해도의 원리와 맞닿아 있다", "요리는 반드시 저울로만 해야 한다", "할머니가 과학자 출신이라는 것"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "솔이가 '실패'라고 여겼던 얼음사탕 실험에서 얻은 가장 큰 배움은 무엇인가?", "options": ["실험은 세 번 이상 반복해야 한다는 것", "변화가 눈에 보이지 않는 시간도 과정의 일부이며, 탐구에는 기다림이 필요하다는 것", "단맛은 결정 상태일 때 가장 강하다는 것", "설탕물은 빨리 식혀야 한다는 것"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "할머니의 교육 방식의 특징으로 가장 적절한 것은 무엇인가?", "options": ["비교 실험을 직접 하게 하고, 개념의 이름은 경험 뒤에 붙여 주며, 다음 궁금증을 남겨 둔다", "위험한 부엌일은 모두 대신해 준다", "이론을 먼저 가르치고 실험은 나중에 시킨다", "실패하면 처음부터 다시 시키며 엄격하게 다룬다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "용액의 예로 이 책에 소개된 것으로 옳은 묶음은 무엇인가?", "options": ["모래물, 흙탕물, 주스", "얼음, 수증기, 눈", "바닷물, 식초, 간장, 사이다", "기름, 우유, 꿀"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "포화·불포화 용액에 대한 서술로 옳은 것은 무엇인가?", "options": ["포화 용액은 아직 더 녹일 수 있는 용액이다", "불포화 용액은 결정이 가라앉은 용액이다", "포화와 불포화는 용액의 색으로 구별한다", "더 못 녹일 만큼 가득 찬 것이 포화 용액, 더 녹일 수 있는 것이 불포화 용액이다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'고체는 올라가고 기체는 내려간다'는 화살표 두 개의 정리가 탐구에서 갖는 의미는 무엇인가?", "options": ["흩어진 두 경험(설탕·사이다)을 온도라는 하나의 변수로 통합해 설명하는 개념의 완성", "고체가 기체보다 무겁다는 사실의 확인", "화살표 그리기 연습", "실험 순서를 정리한 목차"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "매실청·장아찌·얼음사탕 등 '부엌의 일'을 실험 소재로 삼은 구성의 효과는 무엇인가?", "options": ["전통 음식의 우수성을 홍보하는 효과", "할머니 세대의 노고를 강조하는 효과", "과학이 실험실이 아니라 일상 속에 살아 있음을 체감하게 하는 효과", "요리법을 정확히 전수하는 효과"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'용해(溶解)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["물질이 열에 녹아 액체가 되는 것", "한 물질이 다른 물질에 눈에 보이지 않을 만큼 잘게 흩어져 골고루 섞이는 현상", "물질이 물과 반응해 새로운 물질이 되는 것", "고체가 기체로 바로 변하는 현상"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'농도(濃度)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["용액에 용질이 얼마나 녹아 있는지를 나타내는 진하기", "용액이 끓는 온도", "용액이 담긴 그릇의 크기", "용질이 녹는 데 걸리는 시간"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'끓기 직전의 물에 설탕을 최대한 녹인' 뒤 식히는 것이 얼음사탕 만들기의 핵심인 이유를 추론하면 무엇인가?", "options": ["뜨거운 물이 실을 소독해 주기 때문", "설탕이 뜨거운 물에서 더 달아지기 때문", "높은 온도에서 많이 녹여 두어야 식으면서 용해도를 넘는 설탕이 결정으로 석출되기 때문", "빨리 식을수록 큰 결정이 생기기 때문"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "「넘친 만큼은 반짝이는 결정이 되지요.」라는 경구가 함축하는 자연의 원리로 가장 적절한 것은 무엇인가?", "options": ["넘치는 것은 언제나 낭비로 사라진다", "자연은 인간의 개입을 거부한다", "결정은 우연의 산물이다", "조건이 달라져 품을 수 없게 된 것은 사라지지 않고 다른 모습으로 제자리를 찾는다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '설탕은 어디로 사라졌을까' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'chem12',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'chem12',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
