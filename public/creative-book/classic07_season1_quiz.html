<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 구름을 타고 온 선비 — 전우치, 백성의 편에 서다 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/고전문학07/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "재주를 철저히 숨기고 살던 전우치가 마음의 문을 연 까닭은 무엇인가요?", "options": ["도술 실력을 자랑하고 싶어서", "백성은 굶어 죽어 가는데 관리들은 곡식을 쌓아 두고 나누지 않는 모습을 보았기 때문에", "왕이 벼슬을 준다고 약속해서", "해적들이 집으로 쳐들어와서"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "서화담과 재주를 겨룬 뒤 전우치는 어떻게 달라졌나요?", "options": ["더 강한 도술을 배우러 중국으로 떠났다", "화담에게 복수를 다짐했다", "도술을 완전히 버렸다", "자신이 우물 안 개구리였음을 깨닫고 무릎을 꿇어 제자가 되었다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "전우치가 선관으로 꾸며 궁궐에서 한 일은 무엇인가요?", "options": ["옥황상제가 궁전을 짓는다며 부유한 관리들에게 황금을 바치게 했다", "왕에게 벼슬을 달라고 요구했다", "궁궐의 보물 창고를 몰래 털었다", "간신들을 벌해 달라고 청했다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "병 속에 들어가 스스로 나타난 전우치에게 일어난 일은 무엇인가요?", "options": ["기름 솥에서 크게 다쳤다", "감옥에 갇혀 오래 지냈다", "왕이 벌을 내리려 할수록 우스워지자, 결국 죄를 용서하고 선전관 벼슬을 내렸다", "백성들이 몰려와 구해 주었다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "\"백성의 것을 빼앗아 쌓은 재물이니, 주인에게 돌려주러 가는 길이다.\"라는 말에 담긴 전우치의 생각은 무엇인가요?", "options": ["황금을 관리들의 재산이 아니라 백성의 땀에서 나온 것으로 보고, 제자리로 되돌린다는 생각", "황금은 하늘의 것이라는 생각", "자기가 고생했으니 가질 자격이 있다는 생각", "훔친 것은 무엇이든 죄가 아니라는 생각"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "족자로 부자를 골탕 먹인 뒤에도 전우치의 마음이 쓸쓸해진 까닭은 무엇인가요?", "options": ["족자가 망가져 버렸기 때문에", "부자가 불쌍해졌기 때문에", "돈을 받지 못했기 때문에", "재주로 사람을 웃기고 울릴 수는 있어도 세상을 바로 세우지는 못한다고 느꼈기 때문에"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'의적'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["의리를 지키는 장군", "의술을 베푸는 의원", "나쁜 관리의 재물을 빼앗아 가난한 이에게 나누어 주는 도둑", "나라의 적을 물리치는 병사"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'누명'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["오래된 이름", "짓지도 않은 죄를 뒤집어쓰는 것", "이름이 널리 알려지는 것", "벼슬의 이름"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "조선 시대 백성들이 전우치 이야기를 읽으며 통쾌해한 까닭을 짐작하면 무엇인가요?", "options": ["현실에서 말 못 하던 억울함을, 이야기 속 주인공이 대신 갚아 주었기 때문에", "도술 장면이 신기했기 때문에", "이야기가 짧아서 읽기 쉬웠기 때문에", "그림이 많이 들어 있었기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"재주는 하늘이 주지만, 누구를 위해 쓸지는 사람이 정해요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["재주가 없으면 아무것도 할 수 없다는 뜻", "하늘이 정한 운명은 바꿀 수 없다는 뜻", "타고난 능력의 참된 가치는 그것을 쓰는 사람의 선택에 달려 있다는 뜻", "재주는 많이 가질수록 좋다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "전우치가 이름을 숨긴 채 쌀을 나눠 준 행동에서 알 수 있는 것은 무엇입니까?", "options": ["잡힐까 봐 두려웠기 때문일 뿐이다", "나중에 더 큰 상을 받으려는 계산이다", "칭찬이나 보답이 아니라 백성을 살리는 일 자체가 목적이었다는 것", "백성들이 무서웠기 때문이다"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "'숨는 것만이 능사가 아니다'라며 스스로 궁궐로 향한 전우치의 선택이 보여 주는 것은 무엇입니까?", "options": ["도망 대신 담판으로 매듭을 풀려는 당당함", "도술이 다해 어쩔 수 없었던 항복", "왕에 대한 충성심", "벼슬에 대한 욕심"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "선전관이 된 전우치가 한 일로 옳은 것은 무엇입니까?", "options": ["간신들과 손을 잡았다", "궁궐의 창고를 다시 털었다", "백성들에게 세금을 걷었다", "해적들을 사로잡고 도적 떼를 물리쳐 이름을 떨쳤다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "전우치가 다시 쫓기는 몸이 된 까닭으로 옳은 것은 무엇입니까?", "options": ["도술로 왕을 또 속였기 때문", "간신들이 나라를 빼앗으려 한다는 거짓 문서와 증인으로 모함했기 때문", "해적과 내통했기 때문", "벼슬을 버리고 달아났기 때문"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'바람을 그물로 잡는 일'이라는 비유가 표현하는 것은 무엇입니까?", "options": ["바람이 강해 그물이 찢어진다는 것", "도술로 자유자재 변신하는 전우치를 붙잡는 일의 불가능함", "날씨가 나빠 추격이 어려웠다는 것", "그물 만드는 기술의 부족"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'벌을 내리려 할수록 우스워지는 것은 오히려 궁궐 쪽'이라는 병 속 장면의 효과는 무엇입니까?", "options": ["형벌 제도의 정확한 소개", "해학과 풍자로 권력의 위엄을 뒤집어 통쾌함을 주는 효과", "왕의 자비로움을 부각하는 효과", "전우치의 잔인함을 보여 주는 효과"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'도술'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["칼을 다루는 검술", "바람을 부르고 모습을 바꾸는 등의 신비한 재주", "그림을 그리는 기술", "말을 잘하는 재주"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'모함'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["몰래 도와주는 것", "함께 모여 의논하는 것", "나쁜 꾀를 써서 남을 어려운 처지에 빠뜨리는 것", "용서를 비는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'하늘을 속인 자가 임금인들 못 속이겠느냐'는 간신들의 말이 먹혀든 이유를 추론하면 무엇입니까?", "options": ["왕에게 선관 사건으로 속았던 기억이 있어 의심의 싹이 쉽게 자랐기 때문", "간신들의 말솜씨가 뛰어났기 때문", "왕이 전우치를 처음부터 미워했기 때문", "증거가 완벽했기 때문"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'곡식을 나누는 관리가 늘어난 것도 그 뜨끔함 덕분'이라는 결말에서 추론할 수 있는 것은 무엇입니까?", "options": ["관리들이 모두 착해졌다는 것", "전우치가 몰래 관리들을 감시하고 있었다는 것", "이야기와 전설도 권력을 부끄럽게 만들어 세상을 조금씩 바꾸는 힘이 된다는 것", "백성들이 관리를 협박했다는 것"], "correct": 2}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'벌을 받게 되더라도, 굶는 백성을 두고 보는 죄보다는 가볍다'는 전우치의 말이 드러내는 가치관은 무엇인가?", "options": ["법을 어긴 대가는 반드시 치러야 한다는 준법정신", "사람의 목숨을 살리는 일이 형식적인 법보다 앞선다는 신념", "벌은 피할 수 있으면 피해야 한다는 실리주의", "죄의 무게는 왕이 정한다는 왕권 사상"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "'재주는 밖으로 뻗는 것이나, 도는 안으로 깊어지는 것'이라는 서화담의 가르침이 전우치에게 준 깨달음은 무엇인가?", "options": ["도술을 더 연마해야 한다는 것", "세상을 바꾸려면 벼슬이 필요하다는 것", "남을 이기는 능력 너머에, 자기를 닦는 수양의 길이 있다는 것", "재주와 도는 같은 것이라는 것"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "전우치전의 문학사적 성격으로 옳은 것은 무엇인가?", "options": ["임진왜란을 기록한 역사서다", "홍길동전과 함께 조선 시대 의적 소설의 대표작이다", "궁중의 잔치를 그린 수필이다", "중국에서 들어온 번역 소설이다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "이야기의 결말로 옳은 것은 무엇인가?", "options": ["전우치는 끝내 붙잡혀 벌을 받았다", "전우치는 왕이 되어 나라를 다스렸다", "전우치는 간신들에게 복수하고 궁궐에 남았다", "전우치는 서화담을 따라 태백산으로 들어갔고, 그의 이야기는 백성들 곁에 전설로 남았다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'선관 강림' 장면에서 부유한 관리들이 앞다투어 황금을 바치는 모습이 풍자하는 것은 무엇인가?", "options": ["백성의 것을 빼앗아 곳간을 채우고도 하늘 앞에서는 비굴해지는 지배층의 탐욕과 위선", "하늘에 대한 백성들의 경건한 신앙심", "궁궐 의례의 화려함", "조선 시대의 건축 기술"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'현실에서 아무 말도 할 수 없던 사람들이 이야기 속에서만은 마음껏 통쾌할 수 있었다'는 서술이 설명하는 고전 소설의 기능은 무엇인가?", "options": ["역사적 사실의 정확한 기록", "글자 교육의 교재 역할", "외국 문물의 소개", "억눌린 민중의 소망과 울분을 대신 풀어 주는 문학의 해방적 기능"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'의적(義賊)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["의리로 뭉친 도둑 무리", "탐관오리의 부정한 재물을 빼앗아 가난한 백성에게 나누어 주는, 민중이 의롭게 여긴 도둑", "나라에서 공인한 도둑", "의술을 훔쳐 배운 사람"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'풍자(諷刺)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["바람이 부는 모습을 그린 그림", "무조건 칭찬하여 기리는 표현", "웃음과 빗댐을 통해 권력이나 세태의 잘못을 꼬집는 표현 방식", "슬픔을 과장하는 표현 방식"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'속임수는 죄일까, 의로움일까'라는 서술자의 물음이 독자에게 요구하는 사고는 무엇인가?", "options": ["법은 언제나 옳다는 확신", "행위의 옳고 그름을 형식만이 아니라 목적과 결과, 시대 상황까지 함께 놓고 판단해 보는 것", "주인공은 무조건 옳다는 믿음", "속임수의 기술을 배우는 것"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "수백 년이 지나도 전우치가 영화와 드라마로 되살아나는 이유를 추론하면 무엇인가?", "options": ["도술 장면이 특수 효과로 만들기 쉽기 때문", "저작권료가 들지 않기 때문", "'가진 힘을 누구를 위해 쓸 것인가'라는 물음이 시대를 넘어 여전히 유효하기 때문", "옛날이야기는 검열을 받지 않기 때문"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '전우치' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'classic07',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'classic07',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
