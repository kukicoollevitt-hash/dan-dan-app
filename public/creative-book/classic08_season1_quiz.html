<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👻 연못에 가라앉지 않은 진실 — 장화와 홍련 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/고전문학08/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "장화와 홍련 자매를 끝까지 지탱해 준 것은 무엇이었나요?", "options": ["아버지의 든든한 보호", "마을 사람들의 도움", "넉넉한 살림살이", "\"서로를 지켜 다오\"라는 어머니의 유언과 깊은 자매의 우애"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "정동호 사또가 다른 사또들과 달랐던 점은 무엇인가요?", "options": ["도망치지 않고 촛불을 밝힌 채 기다리며, 귀신의 사연을 두려움 없이 들어 주었다", "무술 실력이 뛰어나 귀신을 물리쳤다", "부적을 붙여 귀신을 쫓아냈다", "관아에서 자지 않고 밖에서 잤다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "허 씨가 꾸민 흉계는 무엇이었나요?", "options": ["장화의 혼처에 거짓 소문을 퍼뜨렸다", "털을 뽑아 손질한 쥐를 장화의 이불 속에 넣어, 부끄러운 잘못을 저지른 것처럼 꾸몄다", "장화의 편지를 위조했다", "집에 불을 지르고 장화의 짓이라 했다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "사또가 진실을 밝혀낸 결정적 방법은 무엇이었나요?", "options": ["장쇠를 매질하여 자백을 받았다", "연못의 물을 모두 퍼냈다", "증거라던 것의 배를 갈라 쥐의 뼈를 확인했다", "허 씨의 꿈을 해몽했다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "밤마다 관아에 나타난 자매의 원혼이 정말로 바란 것은 무엇이었나요?", "options": ["억울한 사연을 들어 줄 단 한 사람", "사또들을 몰아내는 것", "계모에게 직접 복수하는 것", "관아의 재물"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "\"비극을 만든 것은 흉계였지만, 비극을 키운 것은 듣지 않는 귀였지요.\"라는 말의 뜻은 무엇인가요?", "options": ["소문이 비극을 키웠다는 뜻", "귀가 아프면 병원에 가야 한다는 뜻", "흉계만 없었다면 아무 일도 없었다는 뜻", "아버지가 딸의 말을 한 번이라도 들어 보았다면 비극을 막을 수 있었다는 뜻"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'원혼'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["아주 오래된 혼례", "깊은 산속의 신령", "억울하게 세상을 떠나 한이 맺힌 넋", "조상의 제사"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'권선징악'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["착한 사람은 복을 받고 악한 사람은 벌을 받는다는 것", "선비는 악기를 배워야 한다는 것", "힘센 사람이 이긴다는 것", "웃어른을 공경해야 한다는 것"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "이 이야기의 진짜 영웅이 '칼을 든 장수가 아니라 촛불을 켜고 기다린 사또'인 까닭을 짐작하면 무엇인가요?", "options": ["사또의 벼슬이 장수보다 높기 때문에", "억울함을 푸는 데 필요한 것은 힘이 아니라, 두려움 없이 들어 주는 귀였기 때문에", "촛불이 귀신을 쫓는 힘이 있기 때문에", "장수는 등장하지 않기 때문에"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "\"진실은 가라앉아도 사라지지 않아요. 들어 주는 귀를 기다릴 뿐이에요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["물에 가라앉은 물건은 찾을 수 없다는 뜻", "비밀은 시간이 지나면 잊힌다는 뜻", "감춰진 진실도 없어지는 것이 아니라, 밝혀 줄 사람을 만나면 반드시 드러난다는 뜻", "귀가 밝은 사람이 오래 산다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "허 씨의 악행이 자라난 뿌리로 가장 적절한 것은 무엇입니까?", "options": ["자매에 대한 오래된 원한", "전처 딸들에게 나갈 재산을 제 아들 몫으로 지키려는 욕심", "남편에 대한 불만", "마을 사람들의 이간질"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "아버지 배 무룡의 잘못으로 가장 적절한 것은 무엇입니까?", "options": ["재산을 탕진한 것", "새 부인을 맞이한 것 자체", "꾸며진 증거만 보고 딸의 말을 한마디도 들어 보지 않은 것", "벼슬을 하지 못한 것"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "홍련이 언니의 죽음에 대한 진실을 알게 된 과정으로 옳은 것은 무엇입니까?", "options": ["아버지가 뒤늦게 고백했다", "마을 사람들의 소문으로 알았다", "계모가 스스로 털어놓았다", "꿈에 나타난 언니의 말을 듣고, 장쇠를 다그쳐 그날 밤의 일을 알아냈다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "사건이 해결된 뒤의 결말로 옳은 것은 무엇입니까?", "options": ["자매를 볕 좋은 언덕에 묻고 비석을 세웠으며, 허 씨와 장쇠는 무거운 벌을 받았고 고을의 괴변이 사라졌다", "자매가 다시 살아나 집으로 돌아왔다", "아버지가 고을을 떠나 종적을 감췄다", "연못이 메워지고 관아가 옮겨졌다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'어머니의 유언'이 이야기 전체에서 하는 역할은 무엇입니까?", "options": ["재산 분배의 기준이 된다", "계모가 들어오는 원인이 된다", "죽음마저 갈라놓지 못한 자매의 우애를 처음부터 끝까지 꿰는 실이 된다", "아버지의 재혼을 막는 장애물이 된다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "사또들이 자매를 보자마자 기절하는 장면들이 거듭 배치된 효과는 무엇입니까?", "options": ["귀신의 무서움을 강조하기 위한 것일 뿐이다", "'말하려는 자'와 '듣지 못하는 자'의 어긋남을 반복해, 정동호의 경청을 더욱 빛나게 한다", "사또라는 벼슬의 나약함을 조롱한다", "관아 건물의 음침함을 묘사한다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'흉계'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["남을 해치려고 꾸미는 나쁜 꾀", "흉년이 든 해의 계획", "가슴속에 품은 큰 뜻", "제사를 지내는 순서"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'진상'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["임금께 바치는 물건", "가장 좋은 물건", "일의 참된 사정이나 형편", "밥상 위의 반찬"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'진실은 언제나, 보려는 눈에만 보이는 법'이라는 문장이 아버지의 처지와 연결될 때 뜻하는 바를 추론하면 무엇입니까?", "options": ["아버지의 시력이 나빠졌다는 것", "집안이 평안한 줄만 알았던 것은 보려 하지 않았기 때문이라는 것", "진실은 밤에만 보인다는 것", "허 씨의 연기가 완벽했다는 것"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "이 작품이 '한 걸음 더 나아간 권선징악'이라고 평가되는 이유를 추론하면 무엇입니까?", "options": ["악인의 벌이 유난히 무겁기 때문", "벌과 상을 하늘이 직접 내리기 때문", "주인공이 살아 돌아와 복을 받기 때문", "상벌을 넘어 '감쪽같이 감춘 악도 반드시 드러난다'는 믿음까지 전하기 때문"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'복수가 아니라 이야기를 들어 줄 한 사람'을 기다린 자매의 소망이 작품의 주제와 맺는 관계는 무엇인가?", "options": ["한(恨)의 본질이 보복이 아니라 억울함의 인정과 해원에 있음을 보여 준다", "귀신의 힘이 약했음을 보여 준다", "복수극의 긴장감을 높이는 장치다", "자매의 소극적 성격을 드러낸다"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "'귀신이 밤마다 나타난다면 필시 하고 싶은 말이 있다는 뜻'이라는 정동호의 말이 보여 주는 관리관(官吏觀)은 무엇인가?", "options": ["귀신도 다스리는 것이 관리의 임무라는 것", "기이한 일은 과학으로 설명해야 한다는 것", "두려운 존재조차 사연을 가진 백성으로 대하며, 듣는 것이 다스림의 근본이라는 것", "관리는 담력이 세야 한다는 것"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "장화홍련전의 문학적 성격으로 옳은 것은 무엇인가?", "options": ["평안도 철산의 전래 이야기를 바탕으로 한, 조선 시대의 대표적 가정소설이다", "중국 소설을 번역한 작품이다", "실제 재판 기록을 그대로 옮긴 문서다", "궁중 여인들의 생활을 그린 수필이다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "허 씨가 사또 앞에서 내세운 주장으로 옳은 것은 무엇인가?", "options": ["모든 것이 장쇠의 단독 범행이라 했다", "자신은 그날 집에 없었다고 했다", "아버지가 시킨 일이라고 했다", "장화가 부끄러운 잘못을 저지르고 스스로 못에 빠졌으며 증거도 있었다고 했다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'연못'이라는 공간이 작품에서 갖는 상징성으로 가장 적절한 것은 무엇인가?", "options": ["재물과 풍요의 상징", "진실이 가라앉아 있으되 사라지지 않고 기다리는 곳, 억울함이 잠긴 심연", "마을의 경계를 나타내는 표지", "계절의 변화를 보여 주는 배경"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'물에 젖은 소복'에서 '고운 색동옷'으로 바뀌는 자매의 마지막 모습이 뜻하는 것은 무엇인가?", "options": ["한이 풀려 비로소 평안을 얻은 해원(解冤)의 완성", "계절이 겨울에서 봄으로 바뀌었다는 것", "저승의 옷차림 규칙", "사또가 새 옷을 지어 주었다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'가정소설'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["가정에서 어린이에게 읽어 주는 소설", "계모와 전처 자식의 갈등 등 가정 안의 문제를 다룬 고전 소설의 갈래", "가정 살림의 방법을 알려 주는 실용서", "정원 가꾸기를 다룬 소설"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'해원(解冤)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["원수를 갚는 것", "맺힌 원한과 억울함이 풀리는 것", "소원을 비는 것", "먼 곳으로 떠나는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'사또가 없는 고을은 엉망이 되어 갔다'는 서술이 작품 안에서 수행하는 논리적 기능을 추론하면 무엇인가?", "options": ["고을 백성의 무능함을 드러낸다", "귀신의 저주가 강력함을 증명한다", "억울함이 풀리지 않은 공동체는 전체가 병든다는 것을 보여 주어, 해원이 사적 문제가 아님을 드러낸다", "사또 벼슬의 인기가 없음을 설명한다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "이 작품이 오늘날 독자에게 던지는 질문으로 가장 적절한 것은 무엇인가?", "options": ["계모는 언제나 악한 존재인가", "나는 억울함을 호소하는 목소리 앞에서 도망치지 않고 들어 주는 사람인가", "귀신은 실제로 존재하는가", "형벌은 얼마나 무거워야 하는가"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '장화와 홍련' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'classic08',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'classic08',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
