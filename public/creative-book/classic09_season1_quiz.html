<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👟 개울에 남긴 꽃신 한 짝 — 하늘이 도운 콩쥐 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/고전문학09/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "\"왜 화도 안 내?\"라는 팥쥐의 물음에 콩쥐가 한 대답은 무엇이었나요?", "options": ["화를 내면 내 마음까지 미워지는 것이 더 무섭다고 했다", "화를 내면 혼나기 때문이라고 했다", "화내는 법을 몰라서라고 했다", "팥쥐가 불쌍해서라고 했다"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "잔칫날 아침, 계모가 콩쥐에게 끝낼 수 없는 일들을 시킨 진짜 속셈은 무엇이었나요?", "options": ["콩쥐의 실력을 시험해 보려고", "집안일이 정말 급했기 때문에", "애초에 콩쥐를 잔치에 못 오게 하려는 심술이었다", "콩쥐를 일찍 재우려고"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "하늘이 보낸 손님들이 콩쥐를 도운 방법으로 알맞은 것은 무엇인가요?", "options": ["호랑이가 나무를 해 오고, 까치가 밥을 지었다", "두꺼비가 독의 구멍을 막고, 참새 떼가 벼를 찧고, 선녀가 베를 짜고 비단옷과 꽃신을 주었다", "용왕이 물을 채우고, 학이 옷을 물어다 주었다", "산신령이 나타나 계모를 혼내 주었다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "콩쥐의 꽃신 한 짝이 개울에 빠지게 된 까닭은 무엇인가요?", "options": ["팥쥐가 빼앗아 던져 버려서", "징검다리가 무너져서", "개울물이 갑자기 불어나서", "원님 행차 소리에 놀라 길을 비키다 발을 헛디뎌서"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'밑 빠진 독에 물 채우기'라는 과제가 이야기에서 뜻하는 것은 무엇인가요?", "options": ["부지런하면 무엇이든 된다는 교훈", "아무리 애써도 혼자 힘으로는 끝낼 수 없는, 처음부터 불가능하게 꾸며진 시련", "독을 고치는 방법을 배우라는 가르침", "물을 아껴 쓰라는 가르침"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "콩쥐 이야기와 서양의 신데렐라 이야기가 닮았다는 사실이 알려 주는 것은 무엇인가요?", "options": ["멀리 떨어진 나라의 사람들도 착한 마음이 복을 받는다는 닮은 꿈을 꾸었다는 것", "신데렐라가 콩쥐를 베낀 것이라는 것", "콩쥐 이야기가 서양에서 들어왔다는 것", "두 이야기의 지은이가 같다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'유언'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["떠도는 소문", "재미있는 농담", "약속을 적은 문서", "세상을 떠나는 사람이 마지막으로 남기는 말"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'행차'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["잔치에 쓰는 음식", "웃어른이나 높은 사람이 길을 나서는 것", "줄을 지어 부르는 노래", "말이 끄는 수레"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "\"개울에 남긴 꽃신 한 짝은 우연이 아니었어요.\"라는 말의 뜻을 짐작하면 무엇인가요?", "options": ["착하게 견뎌 온 콩쥐의 세월이 있었기에 꽃신이 복을 찾아오는 열쇠가 될 수 있었다는 뜻", "계모가 꽃신을 일부러 빠뜨렸다는 뜻", "원님이 미리 꽃신을 숨겨 두었다는 뜻", "꽃신이 저절로 걸어갔다는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"착한 마음은 하늘이 먼저 알아봐요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["착한 사람은 하늘을 잘 본다는 뜻", "하늘에는 눈이 달려 있다는 뜻", "보는 사람이 없어도 바르게 살아온 시간은 결코 헛되지 않다는 뜻", "기도를 많이 해야 복을 받는다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "콩쥐가 고된 나날을 견딜 수 있었던 힘으로 가장 적절한 것은 무엇입니까?", "options": ["언젠가 복수하겠다는 다짐", "마을 사람들의 물질적 도움", "아버지의 남모르는 보살핌", "'착한 마음을 잃지 말라'는 어머니와의 약속과 무덤가에서 얻는 위로"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "'착함은 약해서 지키는 것이 아니라, 지키기로 정했기에 지켜지는 것'이라는 문장이 콩쥐에 대해 말해 주는 것은 무엇입니까?", "options": ["콩쥐가 화낼 힘조차 없이 약했다는 것", "콩쥐의 착함이 체념이 아니라 스스로 선택한 의지였다는 것", "콩쥐가 겁이 많았다는 것", "착한 성격은 타고나는 것이라는 것"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "계모가 잔칫날 콩쥐에게 시킨 일 세 가지로 옳은 것은 무엇입니까?", "options": ["밑 빠진 독 채우기, 베 한 필 짜기, 마당의 벼 찧기", "빨래하기, 밥 짓기, 청소하기", "나무하기, 물 긷기, 김매기", "바느질하기, 길쌈하기, 장 담그기"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "꽃신의 주인을 찾는 과정으로 옳은 것은 무엇입니까?", "options": ["콩쥐가 스스로 관아에 찾아갔다", "계모가 신을 감추어 끝내 찾지 못했다", "팥쥐의 발에는 반도 들어가지 않았지만, 콩쥐의 발에는 꼭 맞았고 콩쥐가 나머지 한 짝을 꺼내 보였다", "마을 처녀 여럿의 발에 두루 맞았다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'아버지가 보는 앞에서만 피는 꽃'이라는 표현이 가리키는 것은 무엇입니까?", "options": ["마당에 심은 진짜 꽃", "아버지 앞에서만 꾸며 보이는 계모의 거짓 상냥함", "콩쥐의 수줍은 웃음", "팥쥐의 고운 옷"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "하늘의 도움이 '가장 캄캄한 순간'에야 나타난 구성의 의미는 무엇입니까?", "options": ["하늘이 게을렀다는 것", "도움은 우연히 오는 것이라는 것", "기적은 언제나 늦게 온다는 것", "도움은 견딜 만큼 견딘 사람의 눈물 끝에 응답으로 온다는 것"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'구박'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["오래 삶아 만든 음식", "못살게 굴며 모질게 대하는 것", "아홉 번 절하는 것", "급하게 서두르는 것"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'증표'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["어떤 사실을 증명해 주는 표시나 물건", "기차를 타는 표", "상으로 주는 종이", "세금을 낸 영수증"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "계모와 팥쥐가 마을에서 쫓겨난 결말이 전하는 메시지를 추론하면 무엇입니까?", "options": ["남을 괴롭힌 죄는 결국 제 발등으로 돌아온다는 것", "이사는 새 출발의 기회라는 것", "마을 인심이 사나웠다는 것", "벌은 마을 사람들이 정한다는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "원님의 아내가 된 뒤에도 콩쥐가 이웃에게 쌀을 나누고 억울한 이야기에 귀 기울인 것에서 추론할 수 있는 것은 무엇입니까?", "options": ["콩쥐의 착함이 복을 받기 위한 수단이 아니라 삶의 방식 그 자체였다는 것", "원님이 시켜서 한 일이라는 것", "부자가 되면 누구나 너그러워진다는 것", "쌀이 남아돌았다는 것"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'화를 내면 내 마음까지 미워진다'는 콩쥐의 말이 담고 있는 삶의 태도로 가장 적절한 것은 무엇인가?", "options": ["갈등을 회피하는 소극적 처세", "미움에 미움으로 답하지 않음으로써 자기 내면을 지키는 단단한 자기 결정", "어떤 상황에도 감정을 드러내지 않는 무감각", "벌이 두려워 참는 순종"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "팥쥐라는 인물이 서사에서 수행하는 기능으로 가장 적절한 것은 무엇인가?", "options": ["콩쥐의 선함을 대비로 도드라지게 하는 반동 인물", "이야기의 갈등을 해결하는 조력자", "콩쥐의 숨은 협력자", "서술자의 목소리를 대신하는 인물"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "콩쥐팥쥐 이야기의 전승에 대한 서술로 옳은 것은 무엇인가?", "options": ["한 작가가 창작해 신문에 연재한 소설이다", "궁중에서만 읽히던 이야기다", "서양에서 수입되어 번역된 이야기다", "글로 적히기 전부터 입에서 입으로 전해 내려온 우리 옛이야기다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "콩쥐와 신데렐라 이야기의 공통 요소로 옳은 묶음은 무엇인가?", "options": ["마법사, 호박 마차, 자정의 약속", "구박받는 착한 소녀, 신비한 도움, 잃어버린 신발 한 짝, 행복한 결말", "유리 구두, 무도회, 왕자", "계모의 개과천선, 자매의 화해"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'손등이 트고 발뒤꿈치가 갈라져도'와 같은 구체적 묘사가 하는 역할은 무엇인가?", "options": ["조선 시대 의술의 낙후함을 보여 준다", "계절이 겨울임을 알려 준다", "콩쥐의 고난을 몸의 감각으로 생생하게 전해 독자의 공감을 끌어낸다", "일의 종류를 나열한다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'신은 제 주인을 알았고, 하늘은 제 사람을 알았다'는 대구(對句)가 만드는 효과는 무엇인가?", "options": ["신발 크기의 중요성을 강조한다", "원님의 지혜를 찬양한다", "운명과 우연의 차이를 설명한다", "꽃신의 우연한 일치를 하늘의 정당한 응답으로 격상시켜 주제를 압축한다"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'권선징악(勸善懲惡)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["선을 권하고 악을 벌한다는, 고전 서사의 대표적 주제 의식", "선과 악은 구별할 수 없다는 생각", "힘 있는 자가 정의를 정한다는 생각", "악인도 용서해야 한다는 가르침"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'전승(傳承)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["전쟁에서 이기는 것", "문화나 이야기가 세대를 이어 전해 내려오는 것", "책을 인쇄하는 기술", "벼슬을 물려받는 것"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "옛사람들이 권선징악 이야기를 '힘든 세월을 견디는 힘'으로 삼은 이유를 추론하면 무엇인가?", "options": ["이야기가 실제 재판에 쓰였기 때문", "글을 배우는 교재였기 때문", "부조리한 현실 속에서도 바르게 살면 언젠가 보답받으리라는 희망을 지켜 주었기 때문", "이야기를 외우면 상을 받았기 때문"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "'착하게 견딘 모든 날들이 그 신을 콩쥐의 발에 다시 신겨 준 것'이라는 결말의 해석이 함축하는 행운관은 무엇인가?", "options": ["행운은 순전히 우연의 산물이다", "행운은 부지런한 사람을 피해 간다", "행운은 하늘이 무작위로 나눠 준다", "행운처럼 보이는 것도 실은 살아온 시간이 마련해 둔 응답이다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '하늘이 도운 콩쥐' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'classic09',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'classic09',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
