<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎭 궤짝 속에서 나온 큰소리 — 배 비장 이야기 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/고전문학10/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "배 비장의 남다른 버릇은 무엇이었나요?", "options": ["아침마다 늦잠을 자는 것", "'어떤 유혹에도 흔들리지 않는다'며 제 자랑을 크게 떠벌리는 것", "남의 흉을 보는 것", "돈을 지나치게 아끼는 것"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "애랑이 배 비장의 마음을 흔든 방법은 무엇이었나요?", "options": ["편지를 매일 보냈다", "선물을 잔뜩 안겼다", "춤과 노래로 잔치마다 눈에 띄었다", "처음에는 일부러 냉담하게 굴어 자존심을 건드린 뒤, 서서히 웃음을 보였다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "제주목사 김 경이 배 비장을 시험하기로 마음먹은 계기는 무엇이었나요?", "options": ["떠나기 전 아내에게 치는 큰소리를 우연히 들었기 때문", "배 비장이 일을 게을리했기 때문", "애랑이 먼저 부탁했기 때문", "배 비장이 목사를 험담했기 때문"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "궤짝 사건의 전말로 알맞은 것은 무엇인가요?", "options": ["배 비장이 보물을 훔쳐 궤에 숨겼다", "도둑이 배 비장을 궤에 가두었다", "애랑의 말에 속아 제 발로 궤에 들어갔고, 자물쇠가 채워진 궤는 관아 앞마당에서 열렸다", "배 비장이 궤 속에 숨어 애랑을 놀래 주려 했다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'나는 흔들리는 게 아니다, 그저 조금 궁금할 뿐이다'라는 배 비장의 혼잣말이 보여 주는 것은 무엇인가요?", "options": ["그런 변명이야말로 이미 마음이 흔들리고 있다는 가장 확실한 증거라는 것", "배 비장의 호기심이 많다는 것", "배 비장이 정말 흔들리지 않았다는 것", "애랑의 꾀가 실패했다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "\"흔들리는 것은 부끄러운 일이 아니나, 흔들리지 않는 척 꾸미는 것은 부끄러운 일일세.\"라는 김 경의 말이 가르치는 것은 무엇인가요?", "options": ["유혹은 무조건 피해야 한다는 것", "마음이 약한 것이 잘못이 아니라, 겉과 속이 다른 위선이 잘못이라는 것", "벼슬아치는 흔들려도 된다는 것", "큰소리는 클수록 좋다는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'위선'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["위에서 아래를 내려다보는 것", "가장 앞선 자리", "훌륭한 조상", "겉으로만 착하고 바른 척 꾸미는 것"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'해학'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["바다에서 배우는 학문", "익살스럽고 품위 있는 웃음의 멋", "학처럼 우아한 춤", "해로운 장난"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "궤짝이 열렸을 때 터진 마을 사람들의 웃음에 담긴 뜻을 짐작하면 무엇인가요?", "options": ["배 비장의 옷차림이 우스꽝스러웠기 때문", "힘없는 사람들의 재치가 겉과 속이 다른 양반을 통쾌하게 이긴 웃음", "궤짝의 모양이 우스웠기 때문", "김 경이 웃으라고 시켰기 때문"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "\"궤짝 뚜껑은 언젠가 열려요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["감추어 둔 겉과 속이 다른 모습은 언젠가 반드시 드러나고 만다는 뜻", "오래된 자물쇠는 녹슬어 열린다는 뜻", "비밀 상자는 만들지 말아야 한다는 뜻", "도둑은 언젠가 잡힌다는 뜻"], "correct": 0}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'진짜 단단한 사람은 조용히 단단하다'는 애랑의 판단이 배 비장에게 적중한 이유는 무엇입니까?", "options": ["애랑이 점을 잘 쳤기 때문", "배 비장이 원래 조용한 사람이었기 때문", "요란하게 단단한 척하는 사람일수록 속이 비어 있기 마련이었기 때문", "배 비장이 애랑을 미리 알고 있었기 때문"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "망신 이후 배 비장의 변화로 옳은 것은 무엇입니까?", "options": ["자랑이 차오를 때마다 궤짝 속 아침을 떠올리며, 말 대신 행동으로 보여 주는 법을 배워 갔다", "제주를 떠나 종적을 감추었다", "애랑에게 복수를 다짐했다", "더 큰 소리로 자랑하게 되었다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "배 비장이 애랑에게 빠져든 뒤의 행동으로 옳은 것은 무엇입니까?", "options": ["큰소리를 지키려 애랑을 멀리했다", "아내에게 편지로 모든 것을 고백했다", "노자와 귀한 물건들을 하나둘 건네주면서도, 낮에는 여전히 점잖은 척 헛기침을 했다", "목사에게 애랑을 소개해 달라 청했다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "관아 앞마당 장면에 대한 서술로 옳은 것은 무엇입니까?", "options": ["궤는 끝내 열리지 않았다", "배 비장이 스스로 뚜껑을 열고 당당히 나왔다", "김 경도 궤 속의 정체를 몰라 깜짝 놀랐다", "김 경은 '바다에서 떠내려온 수상한 궤'라며 짐짓 모른 척 열게 했다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'말이란 높이 쌓을수록 무너질 때 소리가 큰 법'이라는 문장이 이야기 전체에서 하는 역할은 무엇입니까?", "options": ["아내의 잔소리를 보여 준다", "배 비장의 큰소리가 큰 망신으로 돌아올 것을 미리 알려 주는 복선이 된다", "말을 아끼라는 교훈으로 이야기를 끝맺는다", "목소리 크기의 중요성을 강조한다"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'찔리는 것이 많은 사람일수록 겉치레는 요란해진다'는 서술이 꼬집는 것은 무엇입니까?", "options": ["속이 흔들릴수록 겉으로는 더 점잖은 척하는 배 비장의 이중성", "제주 사람들의 옷차림", "잔치 문화의 사치스러움", "관아의 복잡한 예절"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'비장'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["슬프고 장한 마음", "높은 벼슬아치를 곁에서 도와 일하는 자리", "무기를 보관하는 창고", "비밀을 지키는 장수"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'부임'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["벼슬을 그만두는 것", "맡은 임무를 잊는 것", "새 임지, 곧 일할 곳으로 가는 것", "임금을 뵙는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "애랑과 제주목사가 '백성의 지혜'를 상징한다고 평가되는 이유를 추론하면 무엇입니까?", "options": ["힘이 아니라 재치와 꾀로 위선적인 양반의 실체를 드러냈기 때문", "두 사람이 백성 출신이기 때문", "제주도의 풍습을 잘 알았기 때문", "글공부를 많이 했기 때문"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'그 망신이 가장 좋은 가르침이었다'는 결말에서 추론할 수 있는 것은 무엇입니까?", "options": ["망신은 자주 당할수록 좋다는 것", "뼈아픈 부끄러움이 사람을 깊이 돌아보게 하여 진짜 변화를 만들 수 있다는 것", "가르침은 반드시 스승에게 받아야 한다는 것", "웃음거리가 된 사람은 재기할 수 없다는 것"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "배 비장의 '큰소리'가 지닌 근본적 문제로 가장 적절한 것은 무엇인가?", "options": ["목소리가 지나치게 컸다는 것", "자랑의 내용이 사실이었다는 것", "시험받아 본 적 없는 의지를 완성된 인격인 양 과시한 것", "아내에게만 말했어야 했다는 것"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "애랑이라는 인물의 형상화가 지닌 의미로 가장 적절한 것은 무엇인가?", "options": ["신분이 낮아도 총명함과 재치로 권위의 허상을 꿰뚫는 민중적 지혜의 화신", "양반을 동경하는 인물", "유혹의 위험성을 경고하는 부정적 인물", "운명에 순응하는 수동적 인물"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "배비장전의 갈래와 전승에 대한 서술로 옳은 것은 무엇인가?", "options": ["실제 재판 기록을 정리한 문서다", "궁중 연회에서만 공연된 무용극이다", "조선 시대의 대표적 풍자 소설이며 판소리로도 불리며 널리 퍼졌다", "일제 강점기에 창작된 신소설이다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "이 작품이 겨눈 '진짜 과녁'으로 옳은 것은 무엇인가?", "options": ["배 비장 개인의 어리석음", "겉으로는 바른 척하며 속은 달랐던 당시 양반들의 헛된 겉치레", "제주도의 풍속", "기생 제도의 문제점"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'제 발로 궤 속에 들어갔다'는 설정의 풍자적 묘미는 무엇인가?", "options": ["궤짝의 튼튼함을 강조한다", "애랑의 힘이 세다는 것을 보여 준다", "위선자의 몰락이 타인의 강요가 아니라 제 욕망과 어리석음의 결과임을 보여 준다", "우연의 연속으로 웃음을 만든다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'직접 혼내는 것보다 웃음거리로 만드는 쪽이 따갑고 오래간다'는 서술이 설명하는 풍자의 힘은 무엇인가?", "options": ["웃음은 처벌보다 가볍다는 것", "분노보다 웃음이 대상의 권위를 무너뜨리고 기억에 오래 남는 비판이 된다는 것", "웃음은 갈등을 덮어 준다는 것", "풍자는 어린이용 문학이라는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'풍자(諷刺)'와 '해학(諧謔)'의 관계로 가장 적절한 것은 무엇인가?", "options": ["풍자는 웃음으로 잘못을 꼬집는 비판이고, 해학은 넉넉한 웃음의 멋으로, 배비장전에는 둘이 함께 녹아 있다", "해학은 풍자의 반대말이다", "둘은 완전히 같은 말이다", "풍자는 서양 문학에만 있다"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'위선(僞善)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["착한 일을 남몰래 하는 것", "속마음과 달리 겉으로만 선하고 바른 척 꾸미는 것", "남보다 앞서 나가는 것", "거짓말을 잘하는 재주"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'현실에서 차마 하지 못한 말을 이야기가 대신해 준 셈'이라는 서술에서 추론할 수 있는 풍자 문학의 사회적 기능은 무엇인가?", "options": ["지배층의 통치를 돕는 기능", "글공부를 시키는 교육 기능", "역사를 기록하는 기능", "말할 수 없는 약자들의 비판과 울분을 웃음의 형식으로 대변하는 기능"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "「겉과 속이 같은 사람만이 부끄러움이 없어요.」라는 경구가 제시하는 삶의 기준을 추론하면 무엇인가?", "options": ["부끄러움을 감추는 기술을 익혀야 한다", "남에게 보이는 모습을 잘 관리해야 한다", "말과 행동, 겉과 속이 일치하는 정직한 삶이 언제 드러나도 떳떳한 삶이다", "자랑할 일을 많이 만들어야 한다"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '배 비장 이야기' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'classic10',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'classic10',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
