<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🪞 두 명의 옹고집 — 가짜에게 자리를 빼앗긴 날 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/고전문학11/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "이야기의 처음에 나오는 옹고집은 어떤 사람이었나요?", "options": ["가난하지만 마음씨 착한 농부였다", "고집이 세고 인색하기만 한 사람이었다", "부자이면서 이웃을 잘 돕는 사람이었다", "글공부를 좋아하는 조용한 선비였다"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "쫓겨난 도승이 옹고집을 위해 준비한 것은 무엇이었나요?", "options": ["무서운 벌 대신, 옹고집이 저 자신을 볼 수 있게 하는 특별한 거울(가짜 옹고집)", "무서운 저주", "곳간을 태울 불벼락", "마을 사람들의 항의 행렬"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "가짜 옹고집은 무엇으로 만들어졌나요?", "options": ["진흙 인형", "오래된 나무 등걸", "그림자", "도승이 도술로 빚은 짚단"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "관아 송사의 결과는 어떠했나요?", "options": ["원님이 한눈에 가짜를 가려냈다", "두 옹고집의 대답과 글씨, 걸음까지 똑같아 원님도 가려내지 못했다", "가짜가 스스로 정체를 밝혔다", "진짜 옹고집이 증거 문서를 내밀어 이겼다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "수십 년을 함께 산 아내조차 진짜 남편을 가려내지 못한 까닭은 무엇이었나요?", "options": ["호통과 트집 말고는 마음을 나눈 기억이 없었기 때문에", "가짜의 연기가 너무 뛰어났기 때문에", "아내의 눈이 어두웠기 때문에", "두 사람의 옷이 똑같았기 때문에"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "대문 밖으로 쫓겨나 처마 밑에서 잔 밤이 옹고집에게 중요한 까닭은 무엇인가요?", "options": ["도승을 다시 만난 밤이기 때문에", "가짜를 이길 꾀를 떠올린 밤이기 때문에", "재산을 되찾을 계획을 세운 밤이기 때문에", "자기가 내쫓던 사람들의 서러움을 난생처음 몸으로 알게 된 밤이기 때문에"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'개과천선'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["개울을 건너 산을 넘는 것", "지난 잘못을 뉘우치고 착한 사람으로 바뀌는 것", "과일을 골고루 나누는 것", "이름을 새로 짓는 것"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'송사'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["소나무를 심는 일", "노래를 지어 바치는 일", "옳고 그름을 가려 달라고 관아에 재판을 청하는 일", "제사를 지내는 일"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "옹고집이 '매를 맞아서'가 아니라 스스로 깨닫고 변한 것이 중요한 까닭을 짐작하면 무엇인가요?", "options": ["바깥의 벌은 사람을 무릎 꿇게 할 뿐, 마음 안의 반성이라야 사람을 진짜로 바꾸기 때문에", "매를 맞으면 몸이 아프기 때문에", "도승이 힘이 약했기 때문에", "벌을 주면 마을 사람들이 슬퍼하기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"나를 돌아보지 않는 사람은 나를 잃어요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["거울을 자주 보아야 한다는 뜻", "기억력이 나빠지면 이름을 잊는다는 뜻", "자기 잘못을 살피지 않고 살면 언젠가 참된 자기 자신마저 잃게 된다는 뜻", "혼자 다니면 길을 잃는다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "도승이 '벌을 주기보다 저 자신을 보게 해 주어야겠다'고 판단한 이유로 가장 적절한 것은 무엇입니까?", "options": ["도술로 벌을 줄 힘이 없었기 때문", "매로는 사람의 마음을 바꿀 수 없음을 알았기 때문", "옹고집이 불쌍했기 때문", "마을 사람들이 말렸기 때문"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "옹고집의 뉘우침이 '진짜'라고 볼 수 있는 근거로 가장 적절한 것은 무엇입니까?", "options": ["관아에서 크게 울었기 때문", "도승 앞에서 맹세했기 때문", "원님이 용서해 주었기 때문", "집에 돌아온 뒤 곳간을 열어 나누고, 가족과 하인을 따뜻하게 대하는 행동이 하루하루 이어졌기 때문"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "집안 사람들의 마음이 가짜 쪽으로 기운 까닭으로 옳은 것은 무엇입니까?", "options": ["가짜가 먼저 자리를 지키고 있었고, 평소보다 한결 너그럽게 굴었기 때문", "가짜가 돈을 나눠 주었기 때문", "진짜가 거짓말을 했기 때문", "도승이 시켰기 때문"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "이야기의 결말로 옳은 것은 무엇입니까?", "options": ["옹고집이 재산을 모두 잃고 마을을 떠났다", "가짜가 안개로 흩어져 짚만 남았고, 돌아온 옹고집은 맹세대로 곳간을 열어 나누며 달라졌다", "두 옹고집이 한집에서 함께 살게 되었다", "가짜 옹고집이 진짜가 되어 살았다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'평생 남을 내쫓던 대문이 저를 향해 닫혔다'는 설정의 효과는 무엇입니까?", "options": ["대문의 튼튼함을 강조한다", "자기가 남에게 한 대로 자기가 당하는 처지 바꾸기를 통해 깨달음을 이끈다", "하인들의 배신을 부각한다", "집 구조를 설명한다"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'거울을 보지 않는 사람은 제 얼굴의 얼룩을 모른다'는 1장의 문장이 이야기 전체와 맺는 관계는 무엇입니까?", "options": ["옹고집의 외모를 묘사한 것이다", "가짜 옹고집이라는 '거울'로 제 모습을 보게 되는 이야기 전체를 미리 압축한 문장이다", "거울이 귀했던 시대상을 보여 준다", "도승의 도술 목록을 소개한 것이다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'인색'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["인정이 많고 후한 것", "일을 잘 미루는 것", "재물을 아끼는 데 지나쳐 남에게 베풀 줄 모르는 것", "말수가 적은 것"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'시주'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["스님에게 곡식이나 재물을 베풀어 주는 것", "시를 지어 주고받는 것", "계절마다 지내는 제사", "시장에서 물건을 사는 것"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'재물은 산처럼 쌓였는데 마음이 가난한 사람'이라는 도승의 말이 뜻하는 바를 추론하면 무엇입니까?", "options": ["재물을 더 모아야 마음도 부유해진다는 것", "가난한 사람이 마음은 부자라는 것", "곳간의 곡식이 오래되어 상했다는 것", "부유함의 참된 기준은 재산이 아니라 나누고 아끼는 마음에 있다는 것"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "'자기 자신이라는 증거 하나가 남지 않았다'는 송사 장면이 던지는 물음을 추론하면 무엇입니까?", "options": ["나를 나로 증명해 주는 것은 재산이나 문서가 아니라, 사람들과 나눈 마음과 관계라는 것", "관아의 재판 제도가 허술하다는 것", "도술은 막을 수 없다는 것", "쌍둥이는 구별할 수 없다는 것"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "옹고집의 결핍을 '거울을 보지 않는 삶'으로 규정할 때, 그 의미로 가장 적절한 것은 무엇인가?", "options": ["자기 성찰의 부재, 곧 제 행실을 돌아보는 눈이 없었다는 것", "외모를 가꾸지 않았다는 것", "글을 읽지 못했다는 것", "거울이 없을 만큼 검소했다는 것"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "도승의 응징 방식이 지닌 교육적 특징으로 가장 적절한 것은 무엇인가?", "options": ["고통의 크기로 죄의 무게를 갚게 한다", "공개 망신으로 본보기를 삼는다", "처벌 대신 처지 바꾸기의 경험을 설계하여 스스로 깨닫게 한다", "재산을 몰수해 나누어 준다"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "옹고집전의 문학적 성격으로 옳은 것은 무엇인가?", "options": ["실존 인물의 전기다", "한문으로만 전해진 궁중 문학이다", "개화기의 신문 연재소설이다", "조선 시대의 교훈 소설로, 판소리로도 불렸으며 '옹고집'은 고집불통을 가리키는 말처럼 쓰이게 되었다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "가짜 옹고집의 소멸 장면으로 옳은 것은 무엇인가?", "options": ["스스로 산으로 돌아가 스님이 되었다", "진짜와 싸우다 패해 도망쳤다", "원님의 명으로 옥에 갇혔다", "도승의 주문에 안개로 흩어지고 그 자리에 짚 몇 가닥만 남았다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'똑같은 두 사람'이라는 설정이 만들어 내는 이중의 효과로 가장 적절한 것은 무엇인가?", "options": ["쌍둥이 소재의 신기함만을 노린다", "서로 우기는 우스꽝스러움(해학)과, 정체성을 묻는 서늘한 질문(교훈)을 동시에 만든다", "도술의 위력을 과시한다", "가족의 어리석음을 조롱한다"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "이야기가 '웃음소리가 끊긴 집'에서 시작해 '웃음소리가 다시 흐르는 집'으로 끝나는 구성의 의미는 무엇인가?", "options": ["집의 소리 환경이 개선되었다는 것", "한 사람의 변화가 집안 전체의 온기를 되살렸음을 처음과 끝의 대비로 보여 준다", "잔치가 자주 열리게 되었다는 것", "하인이 늘었다는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'개과천선(改過遷善)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["허물을 고치고 착함으로 옮겨 간다는, 사람의 근본적 변화를 이르는 말", "지난 일을 잊고 새 일을 시작하는 것", "벌을 받고 죗값을 치르는 것", "이사하여 새 마을에 정착하는 것"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'변고(變故)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["갑작스럽게 일어난 심상치 않은 사고나 이상한 일", "변두리의 낡은 창고", "계절이 바뀌는 것", "옷을 갈아입는 것"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'가족조차 알아보지 못하는 나'라는 옹고집의 위기가 현대의 독자에게 던지는 물음을 추론하면 무엇인가?", "options": ["신분증을 잘 챙겨야 한다는 것", "나를 나답게 하는 것은 지위와 소유가 아니라 관계 속에 쌓아 온 진심이 아닌가 하는 물음", "가짜를 감별하는 기술이 필요하다는 것", "가족 사진을 많이 찍어야 한다는 것"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「잘못을 깨닫는 순간, 비로소 제자리로 돌아와요.」라는 경구의 함의로 가장 적절한 것은 무엇인가?", "options": ["제자리는 언제나 비어 있다", "돌아갈 자리는 재산이 지켜 준다", "잃어버린 자리의 회복은 처벌의 끝이 아니라 깨달음의 시작에서 이루어진다", "깨달음은 나이가 들면 저절로 온다"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '두 명의 옹고집' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'classic11',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'classic11',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
