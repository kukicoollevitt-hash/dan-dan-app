<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 허물을 벗은 박씨 부인 — 나라를 구한 여인 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/고전문학12/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "혼인 후 남편이 박씨를 별채에 머물게 하고 멀리한 까닭은 무엇인가요?", "options": ["박씨가 별채를 좋아했기 때문에", "못생긴 얼굴만 보고 그 사람의 전부를 판단해 버렸기 때문에", "박씨의 도술이 무서웠기 때문에", "시어머니가 시켰기 때문에"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "냉대 속에서 박씨가 보인 태도는 어떠했나요?", "options": ["원망하는 말 한마디 없이 길쌈과 바느질로 제 몫의 하루하루를 정성으로 채웠다", "남편에게 매일 항의했다", "금강산 친정으로 돌아가 버렸다", "몰래 도술로 남편을 골탕 먹였다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "집안에서 박씨의 참모습을 가장 먼저 알아본 사람은 누구였나요?", "options": ["남편", "하인", "별채의 베와 옷 솜씨를 본 시어머니", "이웃집 부인"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "박씨전의 결말로 알맞은 것은 무엇인가요?", "options": ["박씨가 하늘로 돌아가 버렸다", "전쟁에서 패해 가족이 뿔뿔이 흩어졌다", "남편이 끝내 박씨를 알아보지 못했다", "박씨가 청나라 장수 용골대를 꺾었고, 임금에게 정렬부인 칭호를 받았다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "\"정말 벗겨져야 했던 것은 겉만 보던 남편의 눈이었어요.\"라는 말의 뜻은 무엇인가요?", "options": ["박씨의 허물보다, 사람을 겉모습으로만 판단하던 남편의 잘못된 눈이 진짜 문제였다는 것", "남편의 눈에 병이 났다는 것", "허물은 눈에서 먼저 벗겨진다는 것", "남편도 허물을 쓰고 있었다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "실제 병자호란에서는 조선이 크게 패했는데, 이야기 속 박씨는 통쾌하게 이기는 까닭은 무엇인가요?", "options": ["지은이가 전쟁을 몰랐기 때문에", "박씨가 실제로 존재했기 때문에", "이야기 속에서나마 패배의 아픔을 씻고 싶었던 백성들의 간절한 소망이 담겼기 때문에", "청나라가 이야기를 검사했기 때문에"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'외모 지상주의'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["외국의 모습을 동경하는 것", "산 위에서 세상을 내려다보는 것", "옷을 잘 입는 기술", "겉모습을 가장 중요하게 여기는 잘못된 생각"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "이 이야기에서 '허물'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["잘못이나 실수를 가리키는 말", "박씨의 얼굴을 덮고 있다가 매미 껍질처럼 벗겨져 내린 껍질", "뱀이 사는 굴", "낡아서 해진 옷"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "박씨가 서러웠던 시절을 잊지 않고 어렵고 천대받는 사람들을 보살핀 까닭을 짐작하면 무엇인가요?", "options": ["임금이 시켰기 때문에", "천대받는 서러움을 몸소 겪어 보았기에 같은 처지의 사람들의 마음을 알았기 때문에", "칭호를 하나 더 받고 싶었기 때문에", "도술 연습이 필요했기 때문에"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "\"사람의 값어치는 얼굴이 아니라 마음에 있어요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["얼굴이 고운 사람은 마음도 곱다는 뜻", "사람의 참된 가치는 겉모습이 아니라 마음과 재주, 행동에서 나온다는 뜻", "거울을 보지 말라는 뜻", "마음은 얼굴에 다 드러난다는 뜻"], "correct": 1}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'언젠가 저를 알아보는 날이 오겠지요'라며 견딘 박씨의 태도에서 알 수 있는 것은 무엇입니까?", "options": ["체념하고 운명에 순응하는 소극성", "자기 가치에 대한 믿음을 잃지 않고 때를 기다리는 단단한 내면", "남편에 대한 미련", "금강산으로 돌아갈 계획"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "허물이 벗겨진 뒤 남편의 가슴을 정말로 친 것은 무엇이었습니까?", "options": ["아내의 고운 얼굴", "도술의 위력", "시어머니의 꾸중", "지혜도 재주도 마음도 처음부터 그대로였는데 자기만 보지 못했다는 사실"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "박씨의 재주에 대한 서술로 옳은 것은 무엇입니까?", "options": ["한 번 들은 글을 잊지 않고, 바람과 별을 읽으며, 바느질 솜씨는 장인도 따르지 못할 정도였다", "노래와 춤에 뛰어났다", "활쏘기와 말타기에 능했다", "장사 수완이 뛰어나 재산을 모았다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "전쟁에서 박씨가 한 일로 옳은 것은 무엇입니까?", "options": ["군량미를 모아 보냈다", "식구들을 피신시키고, 도술로 불화살을 막고 바람을 다스려 용골대의 군대를 꺾었다", "임금을 모시고 피란을 떠났다", "청나라와의 화해 문서를 썼다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'시어머니의 눈'과 '남편의 눈'을 대비시킨 구성의 효과는 무엇입니까?", "options": ["고부 갈등을 부각한다", "세대 차이를 보여 준다", "같은 사람도 보는 눈에 따라 전혀 다르게 보인다는 주제를 두 인물의 대비로 드러낸다", "시어머니의 권위를 강조한다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'허물 벗기'와 '전쟁 발발'이 같은 무렵에 배치된 구성의 의미는 무엇입니까?", "options": ["숨겨졌던 박씨의 진가가 집안을 넘어 나라를 구하는 데까지 드러나는 전환점을 만든다", "우연의 일치일 뿐이다", "전쟁이 허물을 벗게 한 원인이다", "계절의 변화를 보여 준다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'냉대'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["차게 식힌 음식", "차갑게 푸대접하는 것", "겨울의 추운 날씨", "냉정하게 판단하는 것"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'정렬부인'이라는 칭호가 뜻하는 것은 무엇입니까?", "options": ["궁궐의 벼슬 이름", "박씨의 본래 이름", "시집의 가문 이름", "나라가 공을 세운 여인에게 내린 공식적인 인정과 명예"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "박씨전이 '여성 영웅 소설'로서 지니는 의미를 추론하면 무엇입니까?", "options": ["여성의 삶이 좁게 갇혀 있던 시대에, 여성이 나라를 구하는 이야기로 새로운 소망을 그려 냈다는 것", "전쟁 기록을 정확히 남겼다는 것", "여성은 도술을 잘 부린다는 것", "혼인 제도를 비판했다는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'박씨가 받은 가장 큰 보상은 칭호가 아니라 있는 그대로의 자신을 알아봐 주는 눈들'이라는 문장에서 추론할 수 있는 것은 무엇입니까?", "options": ["칭호는 아무 소용이 없다는 것", "사람이 진정 바라는 것은 명예보다 존재 그 자체로 인정받는 일이라는 것", "임금의 상이 부족했다는 것", "박씨가 겸손했다는 것"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'얼굴은 잠시 걸치는 옷과 같다'는 박처사의 가르침이 작품 전체에서 하는 역할은 무엇인가?", "options": ["의복 문화를 소개한다", "박씨의 자존감을 지탱하고 주제를 예고하는 사상적 뼈대가 된다", "아버지의 도술 실력을 보여 준다", "혼인의 조건을 제시한다"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "남편의 변화 과정을 가장 잘 요약한 것은 무엇인가?", "options": ["무관심 → 질투 → 화해", "외모로 판단한 냉대 → 허물 벗기 앞에서의 부끄러움 → 진심 어린 사죄와 존경", "사랑 → 배신 → 후회", "동경 → 실망 → 체념"], "correct": 1},

      {"gate": 4, "category": "내용일치", "question": "박씨의 정체에 대한 서술로 옳은 것은 무엇인가?", "options": ["둔갑한 여우였다", "평범한 인간으로 도술을 익힌 것이다", "금강산 산신령의 딸이었다", "원래 하늘의 선녀로, 정해진 시련의 세월 동안 못생긴 허물을 쓰고 있었다"], "correct": 3},

      {"gate": 6, "category": "내용구조", "question": "패배의 역사를 승리의 서사로 다시 쓴 박씨전의 창작 방식이 보여 주는 문학의 기능은 무엇인가?", "options": ["역사 왜곡의 위험성", "전쟁 기술의 교육", "현실의 상처를 상상의 승리로 어루만지는 치유와 위로의 기능", "적국에 대한 증오의 선동"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'여성 영웅 소설'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["여성 작가가 쓴 모든 소설", "여성이 주인공이 되어 비범한 능력으로 나라나 공동체를 구하는 고전 소설의 갈래", "여성의 일상을 그린 수필", "영웅의 아내를 그린 소설"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'천대(賤待)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["하늘처럼 높이 받드는 것", "천천히 기다려 주는 것", "업신여겨 낮추어 함부로 대하는 것", "조상에게 제사 지내는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'얼굴이 변했을 뿐, 그 사람은 그대로였다'는 서술이 남편의 각성과 관련해 던지는 물음을 추론하면 무엇인가?", "options": ["도술은 믿을 만한가", "내가 어떤 사람을 알아보지 못하는 것은 그 사람이 부족해서인가, 내 눈이 닫혀서인가", "허물은 왜 하필 그때 벗겨졌는가", "선녀는 왜 인간 세상에 내려오는가"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「사람의 값어치는 얼굴이 아니라 마음에 있어요.」라는 경구가 외모 지상주의 시대의 독자에게 주는 메시지를 추론하면 무엇인가?", "options": ["외모를 가꾸는 노력은 무의미하다", "고전의 가르침은 현대에 맞지 않는다", "마음은 결국 얼굴에 드러난다", "겉모습으로 사람을 재단하는 시선을 거두고 내면의 가치를 보는 눈을 기르라는 것"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '박씨 부인' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'classic12',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'classic12',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
