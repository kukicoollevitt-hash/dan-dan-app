<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌍 아빠의 배는 지금 어디쯤 — 지구본을 돌리는 아이 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작지리07/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "마루가 지구와 지도를 공부하기로 결심한 까닭은 무엇인가요?", "options": ["시험에서 지리 점수가 낮았기 때문에", "항해를 떠난 아빠가 지금 어디에 있는지 짚을 수조차 없어 답답했기 때문에", "지구본이 새로 생겨 신기했기 때문에", "선생님이 숙제로 내 주었기 때문에"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "서랍에 던져 두었던 스티커를 다시 꺼낸 마루가 한 일은 무엇인가요?", "options": ["스티커를 친구에게 나눠 주었다", "지도를 떼어 내고 새 지도를 샀다", "스티커를 모두 버렸다", "아빠가 태풍을 피해 돌아간 길을 따라 크게 휘어진 곡선으로 다시 붙였다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "지구의 표면에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["지구 표면의 약 70%가 바다여서 지구를 '푸른 행성'이라고 부른다", "지구 표면의 대부분은 땅이다", "땅과 바다가 정확히 절반씩이다", "바다는 지구의 30%뿐이다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "대륙과 바다에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["대륙은 다섯 개, 바다는 여섯 개다", "가장 큰 대륙은 유럽이다", "육지는 여섯 개의 대륙으로 나뉘며 가장 큰 대륙은 아시아, 가장 큰 바다는 태평양이다", "가장 큰 바다는 인도양이다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "태풍으로 아빠와 연락이 끊긴 사건이 이야기에서 하는 역할은 무엇인가요?", "options": ["아빠의 항해 실력을 자랑하는 역할", "마루가 지리 공부를 그만두게 하는 역할", "태풍의 이름을 알려 주는 역할", "길이었던 바다가 벽처럼 느껴지는 위기를 지나, 바다를 더 깊이 이해하게 되는 계기가 된다"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "엄마가 바나나와 운동화 이야기를 들려준 까닭은 무엇인가요?", "options": ["우리 생활의 물건들이 바닷길 무역으로 오간다는 것을 알려 주어, 바다가 세상을 잇는 큰길임을 깨닫게 하려고", "바나나가 몸에 좋다는 것을 알려 주려고", "운동화를 새로 사 주겠다고 약속하려고", "저녁 반찬을 정하려고"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'대륙'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["바다 한가운데의 작은 섬", "높은 산이 이어진 곳", "아시아, 아프리카처럼 지구의 육지를 크게 나눈 큰 땅덩어리", "나라와 나라 사이의 경계"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'무역'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["배를 만드는 일", "나라와 나라가 물건을 사고파는 일", "바다에서 고기를 잡는 일", "항구를 짓는 일"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "\"바람과 물길을 읽고, 돌아갈 줄 아는 사람에게 바다는 길을 내어 주지.\"라는 아빠의 말이 뜻하는 것은 무엇인가요?", "options": ["자연은 힘으로 맞서는 것이 아니라, 알고 존중하며 지혜롭게 다루어야 한다는 뜻", "바닷바람은 항상 같은 방향으로 분다는 뜻", "빠른 배가 언제나 이긴다는 뜻", "바다에서는 지도가 필요 없다는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"바다는 대륙을 가르는 벽이 아니라, 세상을 잇는 가장 넓은 길이에요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["바다가 없으면 대륙이 하나로 붙는다는 뜻", "바다는 수영을 배우는 곳이라는 뜻", "바다를 사이에 둔 나라들이 뱃길을 통해 물건과 문화를 주고받으며 이어져 있다는 뜻", "바다 위에 다리를 놓아야 한다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "마루의 마음이 변화해 간 과정으로 가장 적절한 것은 무엇입니까?", "options": ["무관심 → 흥미 → 포기", "그리움과 답답함 → 배움의 기쁨 → 바다에 대한 원망 → 바다를 길로 이해하는 성장", "두려움 → 미움 → 복수", "자랑 → 좌절 → 침묵"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "'아빠 따라가기 지도'가 교실 게시판으로 옮겨진 일의 의미로 가장 적절한 것은 무엇입니까?", "options": ["한 아이의 그리움에서 시작된 배움이 반 전체의 세계 공부로 확장된 것", "마루가 반장이 된 것", "마루의 방이 좁아진 것", "선생님의 숙제가 늘어난 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "여섯 대륙에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["세계 인구의 절반 이상이 사는 아시아가 가장 크고, 남극은 얼음으로 덮인 대륙이다", "남극은 대륙이 아니다", "아프리카는 가장 작은 대륙이다", "오세아니아는 유럽에 속한다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "파랑호의 항해 경로로 옳은 것은 무엇입니까?", "options": ["비행기로 대륙을 건너뛰며 이동했다", "부산에서 출발해 대서양부터 건넜다", "북극해를 통과해 유럽으로 갔다", "부산에서 태평양을 건너 북아메리카에 닿았고, 이후 인도양과 아프리카를 거쳐 대서양으로 나아갔다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'지구본에서는 손가락 한 뼘, 배로는 몇 주'라는 대비가 알려 주는 것은 무엇입니까?", "options": ["지구본이 부정확하다는 것", "배가 너무 느리다는 것", "지도 위의 거리 감각과 실제 지구의 광대함 사이의 차이", "손가락 길이는 사람마다 다르다는 것"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'곧게 가는 길만 길이 아니었다'는 깨달음이 항해 밖의 삶에도 주는 교훈은 무엇입니까?", "options": ["지름길을 찾는 것이 늘 최선이다", "위험 앞에서 돌아가는 선택도 목적지에 이르는 지혜로운 길이다", "한번 정한 길은 바꾸면 안 된다", "길이 막히면 포기해야 한다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'항해'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["항구에서 배를 고치는 일", "비행기로 하늘을 나는 일", "배를 타고 바다 위의 길을 건너가는 일", "바닷속을 잠수하는 일"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'5대양'에 해당하는 바다의 묶음으로 옳은 것은 무엇입니까?", "options": ["동해, 서해, 남해, 북해, 지중해", "태평양, 대서양, 인도양, 동해, 서해", "한강, 낙동강, 압록강, 두만강, 금강", "태평양, 대서양, 인도양, 북극해, 남극해"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'삼면이 바다인 우리나라는 바닷길 덕분에 온 세계와 이어져 있다'는 말에서 추론할 수 있는 것은 무엇입니까?", "options": ["우리나라는 섬나라다", "바다로 둘러싸인 지형이 무역과 교류에는 오히려 큰 장점이 될 수 있다", "바다가 없는 나라는 무역을 할 수 없다", "우리나라는 바다가 없는 나라보다 불리하다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "'아는 만큼 덜 무섭고, 아는 만큼 더 가까웠다'는 문장이 함축하는 배움의 힘을 추론하면 무엇입니까?", "options": ["아는 것이 많으면 걱정도 많아진다", "지식은 시험을 위한 것이다", "모르는 것은 모른 채로 두는 것이 편하다", "앎은 막연한 두려움을 이해로 바꾸고, 멀리 있는 것을 가깝게 느끼게 한다"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'그리움으로 시작한 공부'라는 이 책의 설정이 학습에 대해 시사하는 바로 가장 적절한 것은 무엇인가?", "options": ["절실한 자기 동기에서 출발한 배움이 가장 깊고 오래간다는 것", "공부는 감정과 분리되어야 한다는 것", "지리는 암기 과목이라는 것", "그리움은 공부에 방해가 된다는 것"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "연락 두절 기간에 마루가 지구본을 돌려세운 행동이 상징하는 심리는 무엇인가?", "options": ["새로운 대륙을 보고 싶은 호기심", "지구본이 낡아 버리고 싶은 마음", "불안과 원망을 앎의 대상(바다)에 투사하며 배움에서 잠시 등을 돌린 상태", "지리 공부를 완성했다는 만족감"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "이 책이 소개한 대륙별 특징으로 옳은 것은 무엇인가?", "options": ["유럽은 가장 큰 대륙이다", "남극에는 세계 인구의 절반이 산다", "아프리카에는 야생 동물이 살지 않는다", "아시아는 세계 인구의 절반 이상이 사는 최대 대륙이고, 남극은 얼음으로 덮인 대륙이다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "아빠가 연락이 끊겼던 실제 이유로 옳은 것은 무엇인가?", "options": ["배가 고장 나 표류하고 있었다", "태풍을 피해 항로를 크게 돌고 항구에 머무느라 통신이 되지 않았다", "전화기를 잃어버렸다", "비밀 항로로 이동 중이었다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'바다'의 의미가 '길 → 벽 → 다시 길'로 변주되는 구성이 만들어 내는 효과는 무엇인가?", "options": ["바다의 위험성만을 강조하는 효과", "주인공의 감정 변화와 함께 바다의 양면성을 입체적으로 이해하게 하는 효과", "이야기의 배경을 자주 바꾸는 효과", "태풍의 원리를 설명하는 효과"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "결말에서 마루가 '스티커가 붙지 않은 남쪽의 하얀 대륙'을 가리키는 장면의 의미는 무엇인가?", "options": ["남극 여행을 예약했다는 것", "남극이 가장 아름다운 대륙이라는 것", "아빠의 다음 항해가 위험하다는 암시", "배움과 호기심이 완결되지 않고 미지의 세계를 향해 계속 열려 있음을 보여 준다"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'해양(海洋)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["육지 사이를 흐르는 큰 강", "지구 표면의 약 70%를 차지하는 넓은 바다", "바닷가의 모래사장", "배가 다니는 뱃길만을 가리키는 말"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'항로(航路)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["배나 비행기가 다니도록 정해진 길", "항구에 배를 대는 자리", "바다의 깊이를 잰 지도", "등대가 서 있는 곳"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'바나나 한 개에도 누군가의 항해가 있다'는 깨달음이 함축하는 세계 인식을 추론하면 무엇인가?", "options": ["과일은 국산이 가장 좋다", "일상의 사소한 물건들도 보이지 않는 세계적 연결망 위에 놓여 있다", "수입품은 비쌀 수밖에 없다", "뱃사람의 직업이 가장 힘들다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "「바다는 대륙을 가르는 벽이 아니라, 세상을 잇는 가장 넓은 길이에요.」라는 경구가 지리적 사고에 주는 통찰을 추론하면 무엇인가?", "options": ["바다를 메워 육지를 넓혀야 한다", "대륙과 대륙은 서로 무관하게 존재한다", "자연 지형의 의미는 고정된 것이 아니라 그것을 이용하는 인간의 지혜에 따라 달라진다", "지도에서 바다는 중요하지 않다"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '아빠의 배는 지금 어디쯤' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'geo07',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'geo07',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
