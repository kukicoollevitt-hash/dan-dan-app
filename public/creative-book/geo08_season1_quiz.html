<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌊 내 이름은 바다 — 세 바다를 도는 여름 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작지리08/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "이야기의 처음에 바다가 이름을 바꾸고 싶어 한 까닭은 무엇인가요?", "options": ["이름이 너무 길어서", "연예인 같은 이름을 갖고 싶어서", "친구들이 놀리고, 세상에서 제일 촌스러운 이름이라고 생각해서", "할아버지가 바꾸라고 해서"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "이름을 바꿔 달라는 바다에게 할아버지가 내건 조건은 무엇이었나요?", "options": ["이번 여름에 세 바다를 직접 다 만나 본 뒤에도 싫다면 새 이름을 지어 주겠다는 것", "등대 청소를 한 달 동안 하라는 것", "성적을 올려 오라는 것", "부모님의 허락을 받아 오라는 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "동해의 특징으로 알맞은 것은 무엇인가요?", "options": ["섬이 아주 많다", "갯벌이 넓게 펼쳐져 있다", "물이 얕아 멀리까지 걸어 들어갈 수 있다", "해안선이 매끈하고 물이 깊다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "서해와 남해의 특징으로 알맞은 것은 무엇인가요?", "options": ["서해는 물이 깊고, 남해는 갯벌이 넓다", "서해는 갯벌이 넓고 조수 간만의 차가 크며, 남해는 섬이 많고 양식업이 발달했다", "서해는 섬이 많고, 남해는 해돋이로 유명하다", "두 바다 모두 얼음으로 덮여 있다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "바다가 갯벌에서 밀물에 갇힐 뻔한 사건이 가르쳐 준 것은 무엇인가요?", "options": ["바다는 얕보면 안 되는 자연이며, 이용하려면 먼저 물때부터 알아야 한다는 것", "갯벌에는 조개가 많다는 것", "장화를 신으면 안전하다는 것", "서해에는 가지 말아야 한다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "지도를 '뒤집어 본' 할아버지의 가르침에서 한반도는 어떤 땅으로 다시 보이게 되나요?", "options": ["대륙에서 떨어져 나온 외로운 섬", "대륙의 끝에 매달린 작은 땅", "가장 추운 북쪽의 땅", "대륙과 바다를 잇는 다리이자, 넓은 바다를 향해 나아가는 땅"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'반도'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["바다 한가운데 떠 있는 섬", "한 면만 대륙에 이어지고 나머지 면이 바다로 둘러싸인 땅", "강이 바다와 만나는 곳", "산으로 둘러싸인 분지"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'영해'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["물고기가 많이 잡히는 바다", "배가 다닐 수 없는 바다", "해안선에서 일정한 거리까지, 우리나라가 다스리는 바다", "수영이 금지된 바다"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "\"무서움은 모를 때 가장 크고, 알수록 작아지는 법이거든.\"이라는 할아버지의 말이 뜻하는 것은 무엇인가요?", "options": ["무서움을 이기는 길은 도망이 아니라 그 대상을 공부하고 이해하는 것이라는 뜻", "무서운 것은 잊어버리는 게 최고라는 뜻", "어른이 되면 무서움이 저절로 사라진다는 뜻", "모르는 것이 약이라는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"반도는 끝이 아니라 다리예요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["반도에는 다리를 많이 지어야 한다는 뜻", "반도는 위험한 지형이라는 뜻", "우리나라는 대륙의 변두리가 아니라, 대륙과 해양을 잇는 자리에 있다는 뜻", "다리가 없으면 반도에 갈 수 없다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'이름을 버리려고 떠난 여행이 이름을 만나러 가는 여행이 되었다'는 문장의 의미로 가장 적절한 것은 무엇입니까?", "options": ["여행지에서 새 이름을 지었다는 것", "할아버지가 여행 계획을 속였다는 것", "여행이 길을 잃었다는 것", "이름을 거부하던 여정이 결국 이름의 의미를 발견하는 과정이 되었다는 것"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "할아버지가 자신의 '배가 뒤집힐 뻔한' 경험을 들려준 까닭은 무엇입니까?", "options": ["자신도 같은 무서움을 겪었고, 공부로 그것을 이겨 냈음을 보여 주어 바다를 다시 일으키려고", "젊은 시절을 자랑하려고", "바다 일이 위험하니 그만두라고 말리려고", "등대의 역사를 가르치려고"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "우리나라의 위치에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["아시아 대륙의 서쪽 끝에 있다", "적도 바로 아래에 있다", "아시아 대륙 동쪽 끝의 한반도이며, 북위 33도에서 43도 사이에 있다", "유럽 대륙에 속해 있다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "독도에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["서해의 가장 큰 섬이다", "역사적으로나 지리적으로나 대한민국의 영토이며, 우리나라의 가장 동쪽에 있다", "사람이 살 수 없는 무인도라 나라가 관리하지 않는다", "남해의 여러 섬 중 하나다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "세 바다를 '세모의 길'로 도는 여정 구성의 효과는 무엇입니까?", "options": ["세 바다의 서로 다른 얼굴을 하나씩 만나며 이름(바다)의 의미가 차곡차곡 채워지게 한다", "가장 빠른 길을 찾는 방법을 가르친다", "세모가 가장 아름다운 도형임을 보여 준다", "여행 경비를 아끼는 방법을 보여 준다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'바다와 바다 사이가 가장 멀어진 날'이라는 표현의 의미는 무엇입니까?", "options": ["썰물로 바닷물이 멀리 빠져나간 날", "주인공 바다의 마음이 바다(자연)와 제 이름에서 가장 멀어진 날", "동해와 서해의 거리가 가장 먼 날", "할아버지와 다툰 날"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'조수 간만의 차'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["파도의 높이 차이", "낮과 밤의 기온 차이", "밀물과 썰물로 바닷물의 높이가 달라지는 차이", "동해와 서해의 깊이 차이"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "나라의 영역을 이루는 세 가지로 옳은 것은 무엇입니까?", "options": ["도시, 농촌, 어촌", "산, 강, 바다", "육군, 해군, 공군", "영토, 영해, 영공"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'삼면이 바다라는 건 곳간이 세 개라는 뜻'이라는 말에서 추론할 수 있는 것은 무엇입니까?", "options": ["바다는 위험하니 곳간을 지어 막아야 한다", "우리나라를 둘러싼 세 바다가 저마다 수산물 등 풍부한 자원을 내어 주는 삶의 터전이라는 것", "집집마다 곳간이 세 개씩 있다는 것", "바다에 창고를 지을 수 있다는 것"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "이름을 놀리던 아이가 발표를 '가장 열심히 듣고 있었다'는 결말에서 추론할 수 있는 것은 무엇입니까?", "options": ["그 아이가 벌을 받을까 봐 긴장한 것이다", "그 아이도 이름을 바꾸고 싶어졌다", "발표 시간이 시험 범위였다", "놀림의 대상이던 이름이 이야기의 힘으로 부러움과 관심의 대상이 되었다"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "바다가 제 이름과 '화해'하기까지의 과정이 보여 주는 정체성 형성의 원리로 가장 적절한 것은 무엇인가?", "options": ["정체성은 타인의 평가로 결정된다", "이름은 부르기 쉬울수록 좋다", "자기를 이루는 것의 의미를 직접 경험하고 이해할 때, 부끄러움은 긍지로 바뀐다", "촌스러운 이름은 바꾸는 것이 합리적이다"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "'무서움이 사라진 것은 아니지만 알고 싶다는 마음이 무서움보다 커졌다'는 서술이 보여 주는 성장의 본질은 무엇인가?", "options": ["시간이 지나면 공포는 저절로 사라진다는 것", "용기는 공포심이 아예 없는 상태라는 것", "공포의 극복은 감정의 소멸이 아니라 호기심과 이해가 그것을 넘어서는 것이라는 것", "무서움은 감추는 것이 어른스럽다는 것"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "세 바다의 특징 비교로 옳은 것은 무엇인가?", "options": ["동해-갯벌, 서해-깊은 물, 남해-해돋이", "동해-섬 많음, 서해-매끈한 해안선, 남해-갯벌", "세 바다의 특징은 모두 같다", "동해-깊고 매끈한 해안선, 서해-넓은 갯벌과 큰 조차, 남해-많은 섬과 양식업"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "한반도의 '다리' 역할에 대한 서술로 옳은 것은 무엇인가?", "options": ["옛날 중국의 문화가 한반도를 거쳐 일본으로 전해졌고, 바닷길로 세계와 교류했다", "한반도는 대륙과 단절된 고립된 땅이었다", "한반도의 문화는 모두 일본에서 건너왔다", "한반도는 바다가 막혀 교류가 불가능했다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "갯벌 사고(5장)가 서사에서 수행하는 기능으로 가장 적절한 것은 무엇인가?", "options": ["서해의 아름다움을 강조하는 장치", "자연의 위력 앞에 선 위기를 통해 '알아야 이용한다'는 주제를 몸의 경험으로 새기게 하는 전환점", "할아버지의 잘못을 드러내는 장치", "여행을 중단시키기 위한 우연한 사건"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'등대'라는 소재가 이야기에서 갖는 상징적 의미로 가장 적절한 것은 무엇인가?", "options": ["관광지의 기념물", "어둠 속에서 길을 밝혀 주는 앎과 지혜, 그리고 할아버지의 삶", "낡은 시대의 유물", "바다의 위험을 알리는 경고판"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'양식업'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["바다에서 그물로 고기를 잡는 일", "서양 음식을 만드는 일", "물고기·조개 등을 인공적으로 길러 내는 산업", "배로 물건을 실어 나르는 일"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'영공(領空)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["비행기가 다니는 모든 하늘", "구름이 없는 맑은 하늘", "우주 공간 전체", "한 나라의 영토와 영해 위에 있는, 그 나라의 주권이 미치는 하늘"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'물때를 달력처럼 외우는' 갯벌 사람들의 모습에서 추론할 수 있는 삶의 지혜는 무엇인가?", "options": ["자연에 기대어 사는 삶은 자연의 리듬을 정확히 알고 따르는 데서 안전과 생계가 나온다", "갯벌 일은 달력이 없으면 불가능하다", "자연은 인간이 통제할 수 있는 대상이다", "암기력이 좋아야 어부가 될 수 있다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "「삼면의 바다는 세상으로 열린 문이에요.」라는 경구가 함축하는 국토 인식을 추론하면 무엇인가?", "options": ["문은 잘 잠가야 안전하다", "바다로 둘러싸인 지형은 고립이 아니라 세계와 교류하고 뻗어 나갈 기회의 조건이다", "우리나라는 바다를 더 넓혀야 한다", "섬나라가 반도보다 유리하다"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '내 이름은 바다' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'geo08',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'geo08',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
