<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚲 두 바퀴로 읽는 나라 — 준이의 국토 종주 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작지리09/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "이야기의 처음에 준이 우리나라에 대해 가지고 있던 생각은 무엇이었나요?", "options": ["지도 한 장이면 끝나는, 좁고 시시한 나라라고 생각했다", "산이 많아 자전거 타기 좋은 나라라고 생각했다", "세계에서 가장 큰 나라라고 생각했다", "바다가 없는 나라라고 생각했다"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "이화령 중턱에서 '돌아가도 절반, 나아가도 절반'의 갈림길에 선 준은 어떻게 했나요?", "options": ["아빠가 정해 주는 대로 따랐다", "버스를 타고 집으로 돌아갔다", "새벽에 먼저 일어나 마저 넘겠다고 스스로 정했다", "하루 더 쉬면서 결정을 미뤘다"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "'동고서저'에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["동쪽과 서쪽의 높이가 같다는 뜻이다", "서쪽이 높고 동쪽이 낮다는 뜻이다", "겨울에 동쪽이 더 춥다는 뜻이다", "동쪽이 높고 서쪽이 낮아서, 강물이 동쪽 산에서 서쪽과 남쪽 바다로 흐른다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "우리나라 국토에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["국토의 절반이 사막이다", "국토의 약 70%가 산이며, 백두산에서 한라산까지 약 1,100킬로미터다", "산은 주로 서쪽에 몰려 있다", "제주도는 강물이 쌓은 섬이다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "아빠가 형광펜이 칠해진 '절반의 지도'를 내민 장면의 의미는 무엇인가요?", "options": ["지도를 새로 사야 한다는 것", "선택을 강요하지 않고, 지나온 땀의 흔적을 보여 주며 준 스스로 길을 고르게 한 것", "돌아가는 길이 더 빠르다는 것", "형광펜 칠하기가 아빠의 취미라는 것"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "이화령 정상 이후의 내리막에서 준이 깨달은 것은 무엇인가요?", "options": ["가장 높은 곳을 넘고 나면 물이 흐르는 방향을 따라 길이 저절로 이어진다는 것", "내리막은 오르막보다 위험하다는 것", "자전거보다 버스가 빠르다는 것", "산은 오르지 않는 것이 좋다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'충적 평야'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["산꼭대기의 평평한 땅", "강이 날라 온 흙이 쌓여 만들어진 기름진 들판", "바닷물이 빠져 드러난 땅", "사람이 흙을 부어 만든 땅"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'분지'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["강 끝의 넓은 들판", "산꼭대기의 커다란 호수", "바다로 둘러싸인 땅", "주위가 산으로 둘러싸이고 가운데는 평평한 지형"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "서울, 여주, 충주 같은 도시들이 강가에 자리 잡은 까닭을 짐작하면 무엇인가요?", "options": ["강이 물을 주고 기름진 들판을 만들어 사람이 모여 살기 좋았기 때문에", "강에서 수영을 즐기려고", "강가의 땅값이 싸기 때문에", "강바람이 시원하기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"국토는 지도가 아니라, 두 바퀴와 두 발로 읽는 책이에요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["지도책은 필요 없다는 뜻", "자전거를 타면 공부를 안 해도 된다는 뜻", "몸으로 직접 겪어야 국토의 참모습을 알게 된다는 뜻", "책은 두꺼울수록 좋다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'시시하다'던 준의 생각이 '존경'으로 바뀐 결정적 계기는 무엇입니까?", "options": ["아빠의 자세한 설명을 들었기 때문", "오르막의 고통과 정상에서 본 겹겹의 산줄기를 몸으로 겪었기 때문", "소원을 들어준다는 약속 때문", "제주도 여행이 즐거웠기 때문"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "\"오늘은 아무 말도 시키지 마세요\"라며 다시 오르막에 오른 준의 모습이 보여 주는 것은 무엇입니까?", "options": ["아빠에 대한 반항심", "여행을 빨리 끝내려는 조급함", "혼자 있고 싶은 사춘기의 마음", "투정을 넘어, 스스로 선택한 길을 자기 힘으로 감당하려는 성장"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "한강과 낙동강에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["두 강 모두 동해로 흘러 들어간다", "한강은 남해로, 낙동강은 서해로 흐른다", "한강은 태백의 산골짜기에서 발원해 서해로, 낙동강은 남해로 흘러간다", "두 강은 백두산에서 시작된다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "김해평야에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["낙동강이 실어 온 흙으로 만들어진 곡창지대다", "화산 활동으로 만들어진 들판이다", "한강 하류의 평야다", "바다를 메워 만든 땅이다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'허벅지가 동고서저를 외치고 있었다'는 표현의 효과는 무엇입니까?", "options": ["운동의 중요성을 강조한다", "준의 다리가 아프다는 사실만 전달한다", "자전거의 성능을 자랑한다", "교과서의 지식이 몸의 경험으로 체득되는 순간을 실감 나게 보여 준다"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "여행의 반환점을 '이화령 고개'로 설정한 구성의 효과는 무엇입니까?", "options": ["고개의 이름을 외우게 하는 효과", "지리적 최고점과 주인공 내면의 고비를 겹쳐 놓아 극복의 의미를 키우는 효과", "숙소가 그곳뿐이었음을 보여 주는 효과", "백두대간 관광을 홍보하는 효과"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'발원'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["강물이 처음 시작되는 것", "강이 바다와 만나는 것", "소원을 비는 것", "강물이 불어나는 것"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'종주'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["가장 빠른 기록을 세우는 것", "산꼭대기에 오르는 것", "정해진 긴 길을 처음부터 끝까지 완주하는 것", "자전거를 수리하는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'분지의 여름은 푹푹 찐다'는 사실의 이유를 추론하면 무엇입니까?", "options": ["산이 사방을 둘러싸 더운 공기가 갇히기 때문", "분지에는 나무가 없기 때문", "분지가 적도에 가깝기 때문", "강이 없어 물이 부족하기 때문"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'지도에 안 보인다고 없는 것이 아니었다'는 깨달음이 시사하는 바를 추론하면 무엇입니까?", "options": ["지도는 모두 부정확하다", "작게 요약된 정보 뒤에는 직접 겪어야만 아는 실제의 크기와 무게가 있다", "갈색 줄무늬는 지도의 장식이다", "지도를 크게 인쇄해야 한다"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "준의 인식 변화 과정을 가장 잘 요약한 것은 무엇인가?", "options": ["무관심 → 흥미 → 숙달", "호기심 → 실망 → 체념", "축소된 지도가 낳은 얕봄 → 몸으로 겪은 국토의 실제 → 이해와 존경", "자신감 → 성공 → 자만"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "아빠의 동행 방식에서 가장 두드러지는 교육적 태도는 무엇인가?", "options": ["답을 미리 말하지 않고 '네 다리가 알려 줄 것'이라며 경험이 스승이 되게 하는 것", "힘든 구간마다 대신 자전거를 끌어 주는 것", "지식을 상세히 강의하는 것", "경쟁심을 자극해 분발시키는 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "이 책에 소개된 지형 개념들의 연결로 옳은 것은 무엇인가?", "options": ["백록담-충적 평야, 김해평야-분화구", "이화령-갯벌, 제주도-평야", "분지-바닷가 지형, 화산섬-강가 지형", "충적 평야-강이 쌓은 들판, 분지-산으로 둘러싸인 지형, 제주도-화산섬, 백록담-분화구 호수"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "준의 종주 경로에 대한 서술로 옳은 것은 무엇인가?", "options": ["서울에서 한강을 거슬러 동쪽으로 오르고, 이화령을 넘어 낙동강을 따라 부산에 닿았다", "부산에서 출발해 서울로 향했다", "비행기로 제주까지 간 것이 종주였다", "동해안을 따라 남쪽으로만 달렸다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'강과 준이 함께 완주했다'는 표현이 만들어 내는 효과는 무엇인가?", "options": ["강의 속도와 자전거의 속도를 비교하는 효과", "강의 오염 문제를 부각하는 효과", "산에서 바다로 흐르는 물길과 주인공의 여정을 포개어, 국토의 구조를 서사의 뼈대로 만드는 효과", "완주 기록을 강조하는 효과"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'세상에서 가장 두꺼운 책'이라는 결말의 은유가 뜻하는 것은 무엇인가?", "options": ["지리 교과서가 가장 두껍다는 것", "책은 얇을수록 읽기 좋다는 것", "지도책을 여러 권 사야 한다는 것", "국토는 페이지마다 경험과 이야기가 쌓인, 평생 읽어 갈 배움의 대상이라는 것"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'백두대간'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["백두산 꼭대기의 호수", "백두산에서 뻗어 내린 우리나라 산줄기의 큰 등줄기", "한강과 낙동강을 잇는 운하", "제주도의 옛 이름"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'곡창지대'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["곡식이 많이 나는 기름진 들판 지역", "노래가 유명한 지역", "창고가 많은 공업 지역", "골짜기가 깊은 산악 지역"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'옛날 사람들은 이 고개를 짚신 신고 넘었다'는 말이 국토와 삶의 관계에 대해 시사하는 바를 추론하면 무엇인가?", "options": ["짚신이 자전거보다 튼튼했다", "옛날에는 여행이 금지되어 있었다", "산이 칠 할인 땅의 형세가 이 땅 사람들의 길과 삶의 방식을 오랫동안 빚어 왔다", "고개는 관광을 위해 만들어졌다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "「국토는 지도가 아니라, 두 바퀴와 두 발로 읽는 책이에요.」라는 경구가 학습 일반에 주는 통찰을 추론하면 무엇인가?", "options": ["교과서 없는 수업이 최고다", "체험 학습은 비용이 많이 든다", "여행은 공부의 반대말이다", "요약된 지식은 직접적 경험과 만날 때 비로소 살아 있는 앎이 된다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '두 바퀴로 읽는 나라' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'geo09',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'geo09',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
