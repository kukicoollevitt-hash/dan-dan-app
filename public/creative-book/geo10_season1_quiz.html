<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☀️ 눈 오는 서울, 꽃 피는 제주 — 할머니의 귤밭과 기후의 비밀 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작지리10/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "누리가 '눈의 나라와 꽃의 나라가 한 나라인 비밀'을 풀겠다고 다짐한 계기는 무엇인가요?", "options": ["학교 숙제로 나왔기 때문에", "눈 내리는 서울에서 영상통화를 걸었더니, 할머니 뒤로 노란 유채꽃이 피어 있었기 때문에", "이모가 기후 연구원이기 때문에", "귤을 좋아하기 때문에"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "누리가 할머니의 귤밭을 돕기 위해 시작한 일은 무엇인가요?", "options": ["귤을 도시에 내다 파는 일", "매일 물을 주는 일", "귤나무를 새로 심는 일", "기온·볕·바람을 적는 '우리 밭 기후 일지'를 만들고 나무마다 온도계를 매단 일"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "서울과 제주의 겨울이 다른 까닭을 여는 '세 개의 열쇠'는 무엇인가요?", "options": ["위도, 해발 고도, 바다", "바람, 구름, 비", "해류, 태풍, 장마", "화산, 지진, 온천"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "가족 회의에서 할머니가 내린 결정은 무엇이었나요?", "options": ["귤나무를 모두 뽑고 애플망고를 심기로 했다", "농사를 그만두기로 했다", "할아버지와 심은 귤나무는 지키되, 볕 좋은 비탈에 새 과일을 조금 시험해 보기로 했다", "밭을 팔고 서울로 이사하기로 했다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "한라산에 오르며 '봄에서 겨울로' 하루 만에 여행한 경험이 가르쳐 준 것은 무엇인가요?", "options": ["높이 100미터를 오를 때마다 기온이 약 0.6도씩 낮아진다는 해발 고도의 열쇠", "한라산에는 눈이 많이 온다는 것", "등산은 겨울에 해야 한다는 것", "산 위에서는 귤이 잘 자란다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "달빛 아래에서 할머니가 늙은 귤나무를 쓰다듬는 장면이 보여 주는 것은 무엇인가요?", "options": ["할머니가 잠이 없으시다는 것", "귤나무에 벌레가 생겼다는 것", "밭이 팔렸다는 것", "기후 변화가 수첩 속 공부가 아니라 사십 년 세월과 살림이 걸린 삶의 문제라는 것"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'기후'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["오늘 하루의 비와 바람", "일기예보의 다른 말", "오랜 기간의 평균적인 날씨", "계절이 바뀌는 순간"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'지구 온난화'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["여름이 짧아지는 현상", "지구가 점점 따뜻해져 기후가 변하는 현상", "태양이 뜨거워지는 현상", "바닷물이 짜지는 현상"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "제주의 일 년 기온 그래프가 서울보다 완만한 언덕 모양인 까닭을 짐작하면 무엇인가요?", "options": ["천천히 데워지고 천천히 식는 바다가 사방을 둘러싸, 여름엔 덜 덥고 겨울엔 덜 춥기 때문에", "제주가 서울보다 작기 때문에", "제주에는 산이 없기 때문에", "그래프를 그린 사람이 다르기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"기후는 하루의 날씨가 아니라 삶의 무늬예요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["기후는 옷의 무늬를 정해 준다는 뜻", "날씨는 중요하지 않다는 뜻", "기후는 그 땅에 사는 사람들의 농사와 살림, 삶의 모습까지 오랫동안 빚어 낸다는 뜻", "무늬가 예쁜 지도가 좋은 지도라는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'공부가 야속했다'던 누리가 다시 힘을 얻게 된 깨달음은 무엇입니까?", "options": ["공부는 시험을 위한 것이라는 깨달음", "이모가 대신 해결해 줄 것이라는 안도감", "기후는 이기는 상대가 아니라 읽고 맞추어 가는 조건이며, 자기도 도울 일이 있다는 깨달음", "할머니가 곧 은퇴할 것이라는 사실"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "초록 이모의 설명 방식으로 가장 적절한 것은 무엇입니까?", "options": ["지구본과 손전등, 그래프 같은 도구로 눈에 보이게 보여 주고, 열쇠를 하나씩 차례로 풀게 한다", "전문 용어를 먼저 외우게 한다", "책을 빌려주고 혼자 읽게 한다", "견학만 시키고 설명은 생략한다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "위도와 기후의 관계에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["위도는 기후와 관계가 없다", "고위도일수록 햇빛을 정면으로 받는다", "적도 근처가 가장 춥다", "지구가 둥글어 위도에 따라 받는 햇빛의 양이 달라지며, 우리나라는 사계절이 뚜렷한 중위도에 있다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "할머니의 귤 농사 걱정에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["귤값이 떨어져 걱정한 것이다", "겨울이 지나치게 따뜻해지면 병이 늘고 맛이 달라지며, 뭍에서도 귤이 나기 시작했기 때문이다", "일손이 부족해 걱정한 것이다", "태풍 피해 때문이다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "이야기가 '영상통화 속 유채꽃'이라는 장면으로 시작하는 효과는 무엇입니까?", "options": ["제주 관광을 홍보하는 효과", "할머니의 안부를 전하는 효과", "통신 기술의 발달을 보여 주는 효과", "같은 날 다른 계절이라는 생생한 수수께끼를 던져 탐구의 문을 여는 효과"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "'세 개의 열쇠로 자물쇠는 열렸지만, 문 뒤에 더 큰 물음이 서 있었다'는 문장에서 '더 큰 물음'은 무엇입니까?", "options": ["네 번째 열쇠는 무엇인가", "기후 변화가 사람들의 삶을 어떻게 바꾸며 우리는 어떻게 살아야 하는가", "서울의 겨울은 왜 추운가", "한라산의 높이는 얼마인가"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'해양성 기후'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["바다의 영향으로 여름에 덜 덥고 겨울에 덜 추운 기후", "바다에서만 나타나는 기후", "비가 전혀 오지 않는 기후", "일 년 내내 더운 기후"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'고랭지'농업의 의미로 가장 적절한 것은 무엇입니까?", "options": ["온실에서 채소를 기르는 농업", "바닷가 모래땅의 농업", "서늘한 높은 지대의 기후를 이용해 배추 등을 기르는 농업", "겨울에만 하는 농업"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'더운 지방의 기후가 북쪽으로 올라오고 있다'는 사실에서 추론할 수 있는 농업의 변화는 무엇입니까?", "options": ["모든 농작물이 사라질 것이다", "작물이 자랄 수 있는 지역이 달라져, 재배 작물의 지도가 바뀌어 간다", "농업 기술이 퇴보할 것이다", "기후와 농업은 무관하다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "'변한 만큼만 나도 변하면 되지'라는 할머니의 말이 보여 주는 삶의 태도를 추론하면 무엇입니까?", "options": ["변화 앞에서 모든 것을 버리고 새로 시작하는 결단", "변화를 부정하고 옛 방식을 고수하는 고집", "변화는 운에 맡기는 체념", "지킬 것은 지키며 변화에는 유연하게 응답하는 균형 잡힌 적응"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'아는 것과 도울 수 있는 것은 다르다'는 누리의 고뇌가 '기후 일지'라는 실천으로 이어진 과정이 시사하는 바는 무엇인가?", "options": ["아이는 어른의 문제를 해결할 수 없다", "지식이 무력감을 넘어서려면 자기 자리에서 가능한 구체적 행동으로 번역되어야 한다", "일지 쓰기는 취미 활동일 뿐이다", "연구는 전문가에게 맡겨야 한다"], "correct": 1},

      {"gate": 3, "category": "내용일치", "question": "세 열쇠가 제주의 온화한 겨울을 설명하는 방식으로 옳은 것은 무엇인가?", "options": ["화산섬이라 땅속 열이 데워 주기 때문이다", "해류가 차가운 물을 몰고 오기 때문이다", "더 남쪽(저위도)이어서 햇빛을 더 받고, 사방의 바다가 기온 변화를 완만하게 해 주기 때문이다", "바람이 불지 않기 때문이다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "해발 고도와 기온의 관계로 옳은 것은 무엇인가?", "options": ["100미터 오를 때마다 약 0.6도씩 낮아져, 1,900미터가 넘는 한라산 꼭대기는 산 아래보다 10도 이상 춥다", "높이 오를수록 태양에 가까워져 더워진다", "고도는 기온에 영향을 주지 않는다", "1,000미터마다 1도씩 낮아진다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'수첩'이라는 소재가 이야기에서 변화해 가는 의미로 가장 적절한 것은 무엇인가?", "options": ["질문을 적는 공책에서, 할머니의 밭을 지키는 실천의 기록('기후 일지 1권')으로 자란다", "여행 기념품에서 일기장으로 바뀐다", "이모의 선물에서 할머니의 유품으로 바뀐다", "숙제장에서 시험지로 바뀐다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'전부 지키는 것도, 전부 바꾸는 것도 아닌' 할머니의 결정이 서사의 절정에 놓인 이유는 무엇인가?", "options": ["가족 회의가 가장 긴 장면이기 때문", "기후 변화라는 거대한 문제 앞에서 이 책이 제시하는 답, 곧 균형 잡힌 적응이 완성되는 순간이기 때문", "할머니가 주인공이기 때문", "새 과일의 이름이 공개되기 때문"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'기후(氣候)'와 '날씨'의 구분으로 가장 적절한 것은 무엇인가?", "options": ["날씨는 매일 순간순간의 대기 상태, 기후는 오랜 기간의 평균적 경향이다", "기후는 하루, 날씨는 일 년을 가리킨다", "둘은 완전히 같은 말이다", "날씨는 육지, 기후는 바다에서 쓰는 말이다"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'대륙성 기후'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["대륙에서만 비가 내리는 기후", "일 년 내내 온화한 기후", "사막에서만 나타나는 기후", "바다에서 먼 내륙에서 나타나는, 여름과 겨울의 기온 차가 큰 기후"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'추운 데서는 귤나무가 겨울을 나지 못한다'는 사실이 함축하는 기후와 산업의 관계를 추론하면 무엇인가?", "options": ["귤은 온실에서만 길러야 한다", "농부의 노력이 기후를 이긴다", "한 지역의 기후 조건이 그곳에서 가능한 작물과 산업의 범위를 규정한다", "과일 농사는 운에 달려 있다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "「무늬가 변하면 삶도 함께 움직이지요.」라는 경구가 기후 변화 시대에 주는 메시지를 추론하면 무엇인가?", "options": ["무늬는 취향의 문제일 뿐이다", "기후 변화는 자연의 일일 뿐 인간과 무관하다", "변화는 두려워하면 멈출 수 있다", "기후의 변화는 곧 삶의 방식의 변화를 요구하므로, 그것을 읽고 대비하는 지혜가 필요하다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '눈 오는 서울, 꽃 피는 제주' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'geo10',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'geo10',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
