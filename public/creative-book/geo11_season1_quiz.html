<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏙️ 뜨거운 도시, 조용한 마을 — 온이의 온도계 일지 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작지리11/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "온이가 '두 마을 온도 일지'를 만들기로 한 계기는 무엇인가요?", "options": ["시골이 더 덥다는 말을 확인하고 싶어서", "학교 숙제를 하기 위해서", "잠 못 드는 열대야를 겪던 중, 시골 여름밤은 이불을 덮고 잤다는 아빠의 말을 듣고 직접 재 보고 싶어서", "온도계를 새로 샀기 때문에"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "학교가 철거될 위기라는 소식을 듣고 온이와 아빠가 한 일은 무엇인가요?", "options": ["학교를 체험 학교로 만들어 달라는 제안 편지를 쓰고, 졸업생들의 서명을 모았다", "철거 공사장 앞에서 시위를 했다", "학교 건물을 사들이려 했다", "방송국에 제보했다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "같은 밤 열한 시에 잰 두 마을의 온도로 알맞은 것은 무엇인가요?", "options": ["도시와 시골 모두 29도였다", "도시 29도, 시골 마을 20도로 9도 차이가 났다", "시골이 도시보다 5도 더 높았다", "도시 20도, 시골 29도였다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "이야기의 결말에서 할아버지 마을에 일어난 변화가 아닌 것은 무엇인가요?", "options": ["폐교가 철거 대신 마을 체험 학교로 바뀌었다", "마을 어르신들이 농사 선생님이 되었다", "젊은 부부가 이사 와 빈집에 불이 켜졌다", "마을에 큰 종합 병원이 새로 지어졌다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "\"잠긴 교문과 도시의 열대야는 한 줄로 이어져 있었다\"는 말의 뜻은 무엇인가요?", "options": ["젊은 사람들이 농촌을 떠나 도시로 몰린 하나의 흐름이, 농촌의 폐교와 도시의 과밀을 함께 만들었다는 것", "교문과 도로가 같은 회사에서 만든 것이라는 것", "학교가 더워서 문을 닫았다는 것", "도시의 학교도 곧 문을 닫는다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'도시와 농촌은 한 나라의 두 허파'라는 비유가 뜻하는 것은 무엇인가요?", "options": ["도시와 농촌의 공기가 다르다는 것", "도시가 농촌보다 중요하다는 것", "두 곳은 경쟁 상대가 아니라, 함께 건강해야 나라가 제대로 숨 쉴 수 있는 사이라는 것", "농촌에는 산소가 많다는 것"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'이촌향도'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["도시 사람들이 시골로 여행 가는 것", "마을과 마을이 합쳐지는 것", "농촌에 새 길을 내는 것", "사람들이 농촌을 떠나 도시로 옮겨 가는 것"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'열섬 현상'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["여름에 섬이 더워지는 현상", "아스팔트와 자동차·에어컨의 열 때문에 도시 한복판이 주변보다 더 뜨거워지는 현상", "바닷물이 데워지는 현상", "산꼭대기가 추워지는 현상"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'도시에 넘치는 것을 농촌에 나누면 두 곳의 병이 함께 나을 수 있다'는 생각을 뒷받침하는 결말의 사례는 무엇인가요?", "options": ["도시 아이들이 농촌 체험 학교에 오면서 조용하던 마을에 활기가 돌아온 것", "도시의 병원을 모두 농촌으로 옮긴 것", "농촌의 어르신들이 모두 도시로 이사한 것", "도시의 아파트를 부수고 밭을 만든 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"한쪽만으로는 숨 쉴 수 없어요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["숨은 코와 입으로 함께 쉬어야 한다는 뜻", "도시 혼자만 커져서는 나라 전체가 건강할 수 없으며, 농촌과 함께 균형 있게 발전해야 한다는 뜻", "농촌에서만 살아야 건강하다는 뜻", "도시의 공기가 나빠서 숨 쉬기 어렵다는 뜻"], "correct": 1}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "온이의 탐구가 발전해 간 과정으로 가장 적절한 것은 무엇입니까?", "options": ["문제 발견 → 어른에게 해결 위임 → 종료", "온도 측정 → 지리 시험 준비 → 성적 향상", "온도의 차이 관찰 → 그 뒤의 사람의 이동 발견 → 두 지역의 문제 정리 → 해결의 제안과 참여", "시골 여행 → 도시 자랑 → 귀가"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "\"누군가는 땅을 지켜야지\"라는 할아버지의 말에 담긴 마음으로 가장 적절한 것은 무엇입니까?", "options": ["도시로 간 사람들에 대한 원망", "떠나고 싶어도 못 떠난 체념뿐", "땅값이 오르기를 기다리는 계산", "도시의 밥상을 떠받치는 농촌의 몫에 대한 긍지와 책임감"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "산업화·도시화에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["농사 중심에서 공업 중심으로 바뀌는 것이 산업화, 사람들이 도시로 모여 도시가 커지는 것이 도시화이며, 지금은 열 명 중 아홉 명이 도시에 산다", "도시화란 도시가 농촌으로 변하는 것이다", "산업화는 농업이 발달하는 것이다", "우리나라 인구의 절반은 아직 농촌에 산다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "할아버지 마을의 상황으로 옳은 것은 무엇입니까?", "options": ["젊은 가족이 많아 학교가 두 개다", "일흔둘 할아버지가 젊은 축일 만큼 고령화가 심하고, 가게가 문 닫고 병원은 차로 사십 분 거리다", "병원과 가게가 최근에 새로 생겼다", "전교생 사백 명의 학교가 운영 중이다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "할아버지의 허리 사고(5장)가 서사에서 하는 역할은 무엇입니까?", "options": ["농사일의 위험성을 경고하는 역할", "할아버지의 건강을 걱정하게 하는 역할만 한다", "휴가를 일찍 끝내게 하는 장치", "사람이 떠난 마을에서는 병원 같은 꼭 필요한 것마저 사라진다는 문제를 몸으로 실감하게 하는 역할"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "큰길가 30도와 공원 27도의 '3도 차이'가 알려 주는 것은 무엇입니까?", "options": ["같은 도시 안에서도 아스팔트와 녹지에 따라 온도가 달라지며, 나무와 쉼터가 열섬을 식힐 수 있다는 것", "온도계가 고장 났다는 것", "공원은 그늘이 많아 온도를 잴 수 없다는 것", "큰길가가 공원보다 낮은 지대라는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'고령화'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["키가 큰 사람이 늘어나는 것", "전체 인구에서 노인이 차지하는 비율이 높아지는 것", "오래된 건물이 많아지는 것", "산이 높아지는 것"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'귀농·귀촌'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["농촌 사람이 도시로 떠나는 것", "명절에 고향을 찾는 것", "도시를 떠나 농촌으로 삶터를 옮기는 것", "군대에서 고향으로 돌아오는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'도시는 사람이 넘쳐서 앓고, 시골은 사람이 모자라서 앓는다'는 통찰에서 추론할 수 있는 해법의 방향은 무엇입니까?", "options": ["한쪽으로 쏠린 것을 나누어 두 지역이 서로의 모자람을 채우게 하는 것", "도시를 더 크게 키우는 것", "농촌 사람들을 모두 도시로 모으는 것", "두 지역을 분리해 왕래를 막는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'세상에서 가장 반가운 소음'이라는 표현에 담긴 뜻을 추론하면 무엇입니까?", "options": ["시골은 원래 시끄러운 곳이라는 뜻", "조용하던 마을에 돌아온 아이들 소리가 마을이 다시 살아나는 증거이기 때문", "소음은 클수록 좋다는 뜻", "전화기 성능이 좋아졌다는 뜻"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "온이의 '온도계'가 탐구 도구로서 갖는 의미의 확장 과정으로 가장 적절한 것은 무엇인가?", "options": ["온도계는 곧 고장 나 쓸모없어진다", "날씨 관측 도구에서 요리 도구로 바뀐다", "장난감에서 과학 실험 도구로 바뀐다", "더위를 재는 도구에서, 인구 쏠림이라는 사회 문제를 읽어 내는 창이 된다"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "아빠가 오래된 앨범을 꺼내 보이며 '돌아갈 자리 하나가 없어지는 기분'이라고 말한 것의 의미는 무엇인가?", "options": ["폐교는 건물 이상의 것, 곧 한 세대의 기억과 뿌리가 담긴 장소라는 것", "이사를 자주 다녀서 집이 없다는 것", "앨범을 학교에 두고 왔다는 것", "도시 생활이 불만족스럽다는 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "도시 문제와 농촌 문제의 짝으로 옳은 것은 무엇인가?", "options": ["도시-폐교, 농촌-교통 체증", "도시-빈집 증가, 농촌-주택 부족", "도시-교통 체증·주택 부족·열섬, 농촌-폐교·빈집·의료 시설 부족", "도시-고령화, 농촌-환경 오염"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "폐교 활용에 대한 이 책의 소개로 옳은 것은 무엇인가?", "options": ["폐교는 법으로 모두 철거해야 한다", "미술관, 캠핑장, 마을 체험관으로 되살아난 사례들이 있다", "폐교는 정부만 활용할 수 있다", "폐교 활용은 실패한 정책이다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'같은 이야기의 양쪽 면'이라는 표현이 가리키는 구조적 인식은 무엇인가?", "options": ["이야기책의 앞뒤 표지를 가리킨다", "도시 과밀과 농촌 소멸이 별개의 문제가 아니라 인구 이동이라는 하나의 원인이 낳은 두 결과라는 것", "도시와 농촌의 온도 차이를 가리킨다", "아빠와 할아버지의 의견 차이를 가리킨다"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "이야기가 '뜨거운 밤'에서 시작해 '반가운 소음'으로 끝나는 구성의 효과는 무엇인가?", "options": ["여름에서 겨울로의 계절 변화를 보여 준다", "감각(더위)에서 출발한 탐구가 공동체의 회복이라는 응답에 도달하는 여정을 완성한다", "소리가 온도보다 중요함을 보여 준다", "도시의 소음 문제를 부각한다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'균형 발전'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["수도권과 지방, 도시와 농촌이 함께 골고루 발전하도록 하는 것", "모든 도시의 크기를 똑같이 만드는 것", "발전을 멈추고 현상태를 유지하는 것", "저울로 도시의 무게를 재는 것"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'교통 체증'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["교통 신호가 고장 난 상태", "버스 요금이 오르는 것", "차가 너무 많아 도로가 막히고 차들이 거북이걸음을 하는 상태", "도로가 얼어붙은 상태"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'어르신들이 평생 해 온 일들이 훌륭한 수업이 되었다'는 결말에서 추론할 수 있는 것은 무엇인가?", "options": ["농사는 배우기 쉬운 일이다", "교사 자격증이 없어도 누구나 교사가 될 수 있다", "체험 학교는 수업료가 비싸다", "고령화 마을의 어르신들이 짐이 아니라 지혜와 경험을 가진 소중한 자원이라는 것"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "「도시와 농촌은 한 나라의 두 허파예요.」라는 경구가 국토 정책에 시사하는 바를 추론하면 무엇인가?", "options": ["농촌을 모두 도시로 개발해야 한다", "도시의 성장을 멈춰야 한다", "두 지역의 인구를 강제로 절반씩 나눠야 한다", "한쪽의 과밀과 한쪽의 소멸을 함께 풀어, 두 지역이 서로를 살리는 순환을 설계해야 한다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '뜨거운 도시, 조용한 마을' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'geo11',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'geo11',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
