<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧳 밀고 당기는 힘 — 결이네 이삿날 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작지리12/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "결이가 이사 소식에 문을 쾅 닫고 반대한 까닭은 무엇인가요?", "options": ["친구도 학교도 골목도 다 있는 이 동네가 결이에게는 세상의 전부였기 때문에", "바다를 무서워했기 때문에", "이삿짐 싸는 것이 귀찮았기 때문에", "새 학교의 교복이 싫었기 때문에"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "이삿날 아침, 할아버지가 결이에게 들려준 위로는 무엇이었나요?", "options": ["이사 가면 용돈을 올려 주겠다는 약속", "금방 다시 돌아올 수 있다는 약속", "사람은 나무와 달라서 뿌리를 제 안에 지니고 다니며, 떠난 자리에서 새 이야기가 자란다는 것", "울지 말라는 꾸중"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "'배출 요인'과 '흡인 요인'에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["둘 다 공장에서 나오는 연기를 뜻한다", "지금 사는 곳에서 밀어내는 힘이 배출 요인, 다른 곳에서 끌어당기는 힘이 흡인 요인이다", "배출 요인은 당기는 힘, 흡인 요인은 미는 힘이다", "두 요인은 어른에게만 작용한다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "결이네 가족이 해온시로 이사하게 된 사정이 아닌 것은 무엇인가요?", "options": ["전세금이 올라 버티기 어려웠다", "아빠의 출퇴근이 왕복 세 시간이었다", "아빠 회사가 원격 근무를 하게 되었다", "결이가 바닷가 학교로 전학 가고 싶어 했다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "결이가 만든 '움직이는 사람들의 지도'가 알려 준 것은 무엇인가요?", "options": ["동네의 길이 복잡하다는 것", "이사 갈 곳까지의 거리", "정든 이 동네도 알고 보면 산골에서, 섬에서, 바다 건너에서 떠나온 사람들이 모여 만든 동네라는 것", "지도를 그리는 방법"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'같은 동네가 결이에게는 당기는 힘, 부모님에게는 밀어내는 힘'이라는 사실이 보여 주는 것은 무엇인가요?", "options": ["같은 장소라도 사람의 처지에 따라 머물게도 하고 떠나게도 한다는 것", "부모님이 동네를 싫어한다는 것", "결이가 아직 어리다는 것", "동네의 힘이 약해졌다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'인구 이동'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["인구가 늘어나는 것", "줄을 서서 걷는 것", "사람이 많은 곳을 피해 다니는 것", "사람들이 살던 곳을 떠나 다른 지역으로 옮겨 가는 것"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'이민'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["이웃 마을로 놀러 가는 것", "다른 나라로 아주 옮겨 가서 사는 것", "한 나라 안에서 이사하는 것", "외국으로 여행을 가는 것"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "해온시가 이사 온 가족에게 도서관 이용권과 자전거를 선물한 까닭을 짐작하면 무엇인가요?", "options": ["새 식구를 끌어당기는 흡인 요인을 만들어 사람들이 오고 싶은 도시가 되려는 것", "물건이 남아돌았기 때문에", "선물을 주는 것이 법이기 때문에", "이사 온 사람들이 부자이기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"사람은 움직이면서 고향을 잃는 게 아니라, 늘려 가는 것 같습니다.\"라는 결이의 말이 뜻하는 것은 무엇인가요?", "options": ["고향은 자주 바꿀수록 좋다는 뜻", "이사를 많이 하면 부자가 된다는 뜻", "떠나온 곳의 추억을 품은 채 새 곳에도 정이 들면, 마음의 고향이 하나 더 생긴다는 뜻", "고향이 없는 사람은 불행하다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "결이의 마음이 변화해 간 과정으로 가장 적절한 것은 무엇입니까?", "options": ["기대 → 실망 → 무관심", "분노 → 복수 → 화해", "무조건 반대 → 이동의 이치를 배우며 머리로는 이해 → 이별의 슬픔 → 품고 가는 법을 배워 새 땅에 뿌리내림", "찬성 → 반대 → 포기"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "할아버지가 '열아홉 살의 기차' 이야기를 들려준 방식의 힘은 어디에 있습니까?", "options": ["기차 여행의 즐거움을 알려 준 것", "훈계 대신, 같은 슬픔을 겪어 본 사람으로서 자기 이야기를 건네 아이의 마음을 열게 한 것", "이사의 장점을 논리적으로 설명한 것", "용돈으로 슬픔을 달래 준 것"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "결이네 가족 '이동의 역사'로 옳은 것은 무엇입니까?", "options": ["할아버지는 서울에서 산골로, 이모는 시골로 이동했다", "가족 모두 한 동네에서만 살았다", "할아버지는 일자리를 찾아 산골에서 서울로, 하나 이모는 바다 건너 호주로 이동했다", "할아버지는 호주로, 이모는 서울로 이동했다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "해온시에서의 새 생활에 대한 서술로 옳은 것은 무엇입니까?", "options": ["아빠는 슬리퍼 차림으로 서재에 출근하고, 결이는 열여덟 명뿐인 교실에서 전학생으로 환영받았다", "결이는 친구를 사귀지 못했다", "아빠는 더 먼 곳으로 출퇴근하게 되었다", "서우와의 연락이 끊어졌다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'벽지의 연필 자국'(키 재던 흔적)이라는 소재가 담고 있는 의미는 무엇입니까?", "options": ["벽지를 새로 발라야 한다는 것", "이삿짐 상자에 담아 갈 수 없는, 장소에 새겨진 성장의 시간", "연필로 벽에 낙서하면 안 된다는 것", "집이 낡았다는 증거"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'매일 보던 사이는 매일 잇는 사이가 되었다'는 문장이 보여 주는 것은 무엇입니까?", "options": ["전화 요금이 많이 나온다는 것", "만나지 못하면 우정은 끝난다는 것", "영상통화가 만남보다 좋다는 것", "물리적 거리가 멀어져도 관계는 노력으로 이어 갈 수 있다는 것"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'국제 이동'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["나라와 나라 사이를 옮겨 가는 인구 이동", "한 도시 안에서의 이사", "국제 대회에 참가하는 것", "비행기를 타는 모든 여행"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'원격 근무'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["멀리 출장을 자주 가는 근무", "밤에만 하는 근무", "회사에 나가지 않고 집 등에서 일하는 근무 방식", "두 회사에서 일하는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "할아버지 시대의 이촌향도와 결이네의 이사를 비교해 추론할 수 있는 것은 무엇입니까?", "options": ["시대가 달라도 사람의 이동에는 밀고 당기는 요인이 작용하며, 시대에 따라 그 내용(일자리→집값·근무 방식)이 달라진다", "이동의 이유는 시대와 관계없이 똑같다", "요즘 사람들은 이동하지 않는다", "옛날에는 흡인 요인이 없었다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "서우 어머니(베트남 출신)와 마이네 가족의 등장이 이야기에 더해 주는 것은 무엇입니까?", "options": ["외국 음식 소개", "인구 이동에는 나라 안의 이동뿐 아니라 국경을 넘는 이동도 있으며, 우리 이웃이 그렇게 만들어졌다는 것", "베트남과의 무역 관계", "주인공의 여행 계획"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'어른들의 화살표는 앞으로만 향하는데, 결이의 마음은 자꾸 뒤를 돌아보았다'는 문장이 포착하는 것은 무엇인가?", "options": ["어른은 뒤를 돌아보지 않는 냉정한 존재라는 것", "이사 방향을 두고 벌어진 가족의 갈등", "합리적 이유로 설명되는 이동에도, 장소에 얽힌 정서와 애도는 별도의 무게로 남는다는 것", "결이의 방향 감각이 서툴다는 것"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "결이가 마지막 주에 '동네를 한 구역씩 돌며' 작별한 행위의 의미로 가장 적절한 것은 무엇인가?", "options": ["동네 지도를 완성하려는 탐사", "친구들에게 자랑하려는 기록", "이사를 늦추려는 시간 끌기", "정든 장소들과 의식을 치르듯 이별하며 슬픔을 소화해 가는 애도의 과정"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "인구 이동의 개념들에 대한 설명으로 옳은 것은 무엇인가?", "options": ["살던 곳을 떠나 다른 지역으로 옮기는 것이 인구 이동이며, 국경을 넘으면 국제 이동, 아주 옮겨 가 살면 이민이라 한다", "이민은 국내 이동을 뜻한다", "인구 이동은 어른에게만 해당된다", "여행도 인구 이동에 포함된다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "인구 공동화와 인구 과밀에 대한 설명으로 옳은 것은 무엇인가?", "options": ["공동화는 사람이 몰리는 것, 과밀은 비어 가는 것이다", "둘 다 농촌에서만 일어난다", "사람이 빠져나간 지역은 공동화로 비어 가고, 몰리는 지역은 과밀로 집값이 오르고 길이 막힌다", "공동화와 과밀은 동시에 일어날 수 없다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'가족 이동의 역사' 숙제가 서사에서 수행하는 기능은 무엇인가?", "options": ["결이 자신의 이사를 3대에 걸친 이동의 계보 위에 놓아, 개인의 사건을 보편의 흐름으로 이해하게 한다", "숙제의 어려움을 보여 준다", "할아버지의 젊은 시절을 미화한다", "사회 성적을 올리는 계기가 된다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'두 개의 고향'이라는 결말의 표현이 완성하는 주제 의식은 무엇인가?", "options": ["고향은 태어난 곳 하나뿐이라는 것", "이동은 상실이 아니라 삶의 확장이 될 수 있다는 것", "이사는 되도록 피해야 한다는 것", "바닷가가 도시보다 살기 좋다는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'배출 요인(排出要因)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["공장에서 폐수를 내보내는 원인", "높은 집값·부족한 일자리처럼 사람을 그 지역에서 떠나게 만드는 조건", "쓰레기를 버리는 이유", "인구를 늘리는 정책"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'흡인 요인(吸引要因)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["숨을 들이쉬는 원리", "자석이 쇠를 당기는 힘", "일자리·좋은 환경처럼 사람을 그 지역으로 끌어당기는 조건", "청소기의 흡입력"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'지식은 아는 것이고, 이별은 겪는 것'이라는 문장이 학습과 삶의 관계에 대해 시사하는 바를 추론하면 무엇인가?", "options": ["지식은 슬픔 앞에서 무용하다", "개념의 이해가 감정의 무게를 대신 짊어져 주지는 못하며, 마음의 일은 따로 겪어 내야 한다", "공부를 많이 하면 이별이 쉬워진다", "이별을 겪지 않으면 배울 수 없다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「뿌리내리는 힘은 제 안에 있지요.」라는 경구의 함의로 가장 적절한 것은 무엇인가?", "options": ["삶의 안정은 장소가 아니라 관계를 맺고 적응해 가는 사람 자신의 힘에서 나온다", "이사는 뿌리를 자르는 일이다", "한곳에 오래 살아야 뿌리가 깊어진다", "고향을 떠나면 뿌리를 잃는다"], "correct": 0}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '밀고 당기는 힘' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'geo12',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'geo12',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
