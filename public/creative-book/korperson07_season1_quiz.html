<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💊 백성의 병을 고친 손 — 허준과 동의보감 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작한국인물07/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "신분의 차별을 겪던 어린 허준이 의원의 길을 고른 까닭은 무엇인가요?", "options": ["의원이 돈을 많이 벌었기 때문에", "아버지가 의원이 되라고 시켰기 때문에", "병으로 고통받는 사람을 살리는 일에는 신분보다 실력이 먼저였기 때문에", "글공부가 싫었기 때문에"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "임금의 신임을 받으면서도 허준의 마음 한쪽에 늘 있던 것은 무엇이었나요?", "options": ["약 지을 돈이 없어 병을 키우는 궁궐 밖 백성들", "더 높은 벼슬에 대한 소망", "고향으로 돌아가고 싶은 그리움", "자신을 무시했던 사람들에 대한 서운함"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "동의보감에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["한 해 만에 완성된 얇은 책이다", "중국 의학책을 그대로 베낀 책이다", "허준이 혼자 읽으려고 쓴 일기다", "15년에 걸쳐 완성한 총 25권의 의학 백과사전으로, 2009년 유네스코 세계기록유산이 되었다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "임진왜란 때 허준이 한 일로 알맞은 것은 무엇인가요?", "options": ["고향으로 피신해 전쟁을 피했다", "피난길의 임금 곁을 끝까지 지키며, 길에서 만난 병든 백성들까지 돌보았다", "의병을 일으켜 왜군과 싸웠다", "바다를 건너 명나라로 유학을 떠났다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'의술이 책 속에만 갇혀 있으면 백성은 살릴 수 없구나'라는 피난길의 다짐이 이야기에서 하는 역할은 무엇인가요?", "options": ["훗날 동의보감이라는 책으로 열매 맺는 씨앗이 된다", "전쟁의 참혹함을 보여 주는 장면일 뿐이다", "허준이 의술을 그만두는 계기가 된다", "책 읽기가 쓸모없다는 뜻을 전한다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "허준이 우리 산과 들에서 나는 약초를 중심으로 처방을 기록한 까닭은 무엇인가요?", "options": ["중국 약재를 구할 방법이 없었기 때문에", "외국 약재는 효험이 없었기 때문에", "아무리 좋은 약도 백성이 구할 수 없다면 없는 약과 같기 때문에", "우리 약초 자랑을 하고 싶었기 때문에"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'서얼'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["서쪽 지방에 사는 사람", "아버지는 양반이지만 어머니의 신분이 낮아 차별받던 신분", "글공부를 하지 않은 사람", "벼슬이 없는 선비"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'향약'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["향기가 나는 약", "마을 사람들의 약속", "시골에서 지키는 예절", "우리나라 산과 들에서 나는, 백성이 쉽게 구할 수 있는 약재"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "낮은 신분의 허준이 내의원에 들어갈 수 있었던 까닭을 짐작하면 무엇인가요?", "options": ["연줄도 재물도 아닌, 소문이 날 만큼 갈고닦은 실력 덕분에", "임금과 친척이었기 때문에", "시험 운이 좋았기 때문에", "내의원에 자리가 남았기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"사람의 값어치는 출발선이 아니라 걸어간 길이 정한다.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["출발이 늦으면 따라잡을 수 없다는 뜻", "길을 많이 걸으면 건강해진다는 뜻", "타고난 조건보다 어떻게 살아왔는지가 그 사람을 말해 준다는 뜻", "달리기는 공평한 운동이라는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'차별의 설움을 책장을 넘기는 힘으로 바꾸었다'는 서술이 보여 주는 허준의 태도는 무엇입니까?", "options": ["설움을 잊기 위해 책 속으로 도피했다", "원망과 좌절 대신 배움으로 자기 길을 개척하는 성숙한 대응", "차별한 사람들에게 복수할 힘을 길렀다", "신분 제도를 없애려는 개혁 의지"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "내의원에 들어간 뒤에도 '아침이면 가장 먼저 나와 약재를 살핀' 허준의 모습이 뜻하는 것은 무엇입니까?", "options": ["동료들에게 잘 보이려는 처세", "불면증이 있었다는 것", "벼슬 욕심이 컸다는 것", "목표를 이룬 뒤에도 처음의 성실함을 잃지 않았다는 것"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "선조가 허준에게 내린 명령으로 옳은 것은 무엇입니까?", "options": ["병든 백성 누구라도 치료의 길을 찾을 수 있는 의학책을 지으라는 것", "왜군의 동태를 살피라는 것", "중국의 의학책을 번역하라는 것", "궁궐의 약방을 새로 지으라는 것"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "동의보감의 특징으로 옳은 것은 무엇입니까?", "options": ["한자를 모르는 사람은 볼 수 없게 만들었다", "외국 약재 중심으로 처방을 정리했다", "병의 증세를 찾으면 원인과 처방이 한눈에 이어지도록, 누구나 찾기 쉽게 만들어졌다", "의원들만 보도록 비밀리에 보관되었다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'책 속의 지식과 현장의 경험이 하나로 엮였다'는 서술이 말하는 동의보감 집필 방식은 무엇입니까?", "options": ["옛 책들을 그대로 옮겨 적었다", "환자 치료 경험만으로 책을 썼다", "다른 의원들에게 대신 쓰게 했다", "의서 연구와 직접 캔 약초, 치료 경험의 기록을 함께 녹여 냈다"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "'한 권의 책으로 만 명의 의원을 만드는 일'이라는 표현의 뜻은 무엇입니까?", "options": ["좋은 책은 지식을 널리 퍼뜨려 수많은 사람이 치료의 길을 찾게 한다는 것", "의원 만 명을 길러 내는 학교를 세운다는 것", "책을 만 권 인쇄한다는 것", "의원 시험 문제집을 만든다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'내의원'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["마을의 작은 의원", "궁궐에서 임금과 왕실의 병을 돌보던, 조선 최고 의원들이 모인 곳", "약초를 파는 가게", "의학을 가르치는 학교"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'처방'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["병을 미리 막는 것", "병에 맞추어 약과 치료법을 정해 주는 것", "몸의 맥을 짚는 것", "침을 놓는 자리"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "동의보감이 중국과 일본에까지 전해져 인기를 얻은 사실에서 추론할 수 있는 것은 무엇입니까?", "options": ["조선의 의학이 이웃 나라가 배울 만큼 높은 수준에 이르렀다는 것", "중국과 일본에는 의학책이 없었다는 것", "허준이 외국어에 능통했다는 것", "조선이 책 수출로 큰돈을 벌었다는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'사백 년 지난 책이 오늘까지 존경받는 까닭'으로 이 책이 제시하는 답을 추론하면 무엇입니까?", "options": ["책의 분량이 많기 때문", "책장마다 배어 있는, 아픈 사람을 향한 한결같은 마음 때문", "종이의 질이 좋아 오래 보존되었기 때문", "임금이 명령해 만든 책이기 때문"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'배움에는 신분의 구별이 없었다. 책은 서얼이라고 글자를 감추지 않았다'는 서술이 함축하는 바로 가장 적절한 것은 무엇인가?", "options": ["신분 사회의 부조리 속에서도 지식은 차별 없이 열려 있는 통로였다는 것", "조선의 책값이 쌌다는 것", "서얼은 책만 읽어야 했다는 것", "의학책은 검열받지 않았다는 것"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "허준의 삶을 '두 개의 산을 넘은 여정'으로 요약할 때, 두 산에 해당하는 것은 무엇인가?", "options": ["가난의 산과 질병의 산", "서얼이라는 신분의 산과, 15년 집필이라는 인내의 산", "전쟁의 산과 정치의 산", "스승의 산과 제자의 산"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "허준의 생애에 대한 서술로 옳은 것은 무엇인가?", "options": ["동의보감 완성 후 벼슬에서 물러나 은둔했다", "1539년에 태어나, 1610년 동의보감을 완성했으며, 1615년 세상을 떠날 때까지 환자를 돌보았다", "임진왜란 중에 세상을 떠났다", "말년에 중국으로 건너가 활동했다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "동의보감의 문화적 가치에 대한 서술로 옳은 것은 무엇인가?", "options": ["조선에서만 읽히다 사라졌다", "전쟁으로 원본이 모두 소실되었다", "오늘날에는 효력을 인정받지 못한다", "중국·일본에 전해져 인기를 얻었고, 2009년 유네스코 세계기록유산으로 등재되었다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'실력이란 감추어도 스며 나오는 향기 같은 것'이라는 비유가 이야기 전개에서 하는 역할은 무엇인가?", "options": ["약초의 향기를 묘사한다", "궁궐의 화려함을 그린다", "신분이 아닌 실력으로 내의원 문턱을 넘는 다음 장면의 개연성을 마련한다", "허준의 외모를 묘사한다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'지식을 자랑하는 책이 아니라 사람을 살리는 책'이라는 대비가 밝히는 동의보감의 편찬 철학은 무엇인가?", "options": ["학문적 권위보다 실제로 쓰는 사람의 눈높이와 쓸모를 앞세웠다는 것", "최대한 어려운 내용을 담았다는 것", "그림을 많이 넣었다는 것", "분량을 줄여 갖고 다니기 좋게 했다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'한의학(韓醫學)'에 대한 이 책의 설명으로 가장 적절한 것은 무엇인가?", "options": ["한자로 쓰인 모든 학문", "사람의 몸을 하나의 자연으로 보고 병의 뿌리를 찾아 다스리는 우리 전통 의학", "중국에서 수입된 의학", "침만 사용하는 치료법"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'효험(效驗)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["약이나 치료가 실제로 나타내는 좋은 효과", "시험을 잘 보는 것", "효도하는 마음", "경험이 많은 것"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'좋은 약도 구할 수 없다면 없는 약과 같다'는 향약 정신이 오늘날의 의료에 시사하는 바를 추론하면 무엇인가?", "options": ["약은 비쌀수록 효과가 좋다", "전통 약초만 사용해야 한다", "수입 약을 금지해야 한다", "의술의 가치는 뛰어남만이 아니라 누구나 닿을 수 있는 접근성에서 완성된다"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "「신분은 하늘이 정했어도 실력은 스스로 쌓는 것」이라는 경구가 오늘의 독자에게 주는 메시지를 추론하면 무엇인가?", "options": ["신분 제도는 지금도 존재한다", "타고난 조건을 원망하기보다 자기가 바꿀 수 있는 것을 갈고닦는 데서 길이 열린다", "실력이 있으면 규칙을 어겨도 된다", "출발선이 같아야만 공정한 경쟁이다"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '허준과 동의보감' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'korperson07',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'korperson07',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
