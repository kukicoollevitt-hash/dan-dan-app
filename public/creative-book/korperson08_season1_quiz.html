<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 붓끝에 피어난 풀과 벌레 — 신사임당 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작한국인물08/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "어린 사임당이 그림을 그리기 전에 반드시 한 일은 무엇인가요?", "options": ["붓과 먹을 새것으로 준비했다", "유명한 화가의 그림을 베껴 그렸다", "어른들에게 그려도 되는지 물어보았다", "벌레의 더듬이가 움직이는 모양까지 오래오래 관찰했다"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "\"여자아이에게 글과 그림을 가르쳐 무엇 하느냐\"는 말에 사임당의 아버지는 어떻게 했나요?", "options": ["딸이라 하여 하늘이 준 재주를 묻는 것이 아깝다며, 책과 종이와 붓을 아낌없이 지원했다", "그림 대신 바느질만 가르쳤다", "주위의 말을 따라 그림을 그만두게 했다", "아들처럼 꾸며서 서당에 보냈다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "사임당의 포도 그림에 전해지는 이야기는 무엇인가요?", "options": ["임금이 궁궐에 걸어 두었다는 이야기", "마당에 내놓았더니 새가 진짜 포도인 줄 알고 콕콕 쪼았다는 이야기", "도둑이 훔쳐 갔다는 이야기", "비를 맞아도 지워지지 않았다는 이야기"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "오늘날 지폐에 실린 신사임당 모자에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["사임당은 천 원권, 이이는 만 원권에 실렸다", "이이만 지폐에 실렸다", "사임당은 5만 원권에, 아들 율곡 이이는 5천 원권에 나란히 실렸다", "사임당의 그림만 지폐에 실렸다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "혼인 후에도 사임당이 깊은 밤 등잔불 아래에서 붓을 든 것이 보여 주는 삶의 방식은 무엇인가요?", "options": ["어머니의 길과 예술가의 길, 어느 한쪽도 버리지 않고 두 길을 함께 걸은 것", "살림을 뒤로 미루고 그림만 그린 것", "잠이 오지 않아 시간을 보낸 것", "그림을 팔아 살림에 보탠 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "\"어머니의 하루하루가 살아 있는 교과서였다.\"라는 말의 뜻은 무엇인가요?", "options": ["어머니가 교과서를 직접 만들었다는 뜻", "교과서를 매일 읽어 주었다는 뜻", "숙제를 대신 해 주었다는 뜻", "말로 가르치기보다 공경하고 정성을 다하는 모습을 몸소 보여 주며 가르쳤다는 뜻"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'초충도'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["초원을 달리는 말 그림", "초가집과 마을을 그린 그림", "풀과 벌레를 그린 그림", "바다와 물고기를 그린 그림"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'현모양처'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["현명한 어머니이자 어진 아내", "벼슬이 높은 부인", "그림을 잘 그리는 부인", "말솜씨가 뛰어난 부인"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "율곡 이이가 조선 최고의 유학자로 자랄 수 있었던 바탕을 이 책에서 찾으면 무엇인가요?", "options": ["운이 좋아 좋은 스승을 만났기 때문", "글을 깨치기 전부터 배움이 몸에 배는 집에서 어머니의 가르침을 받으며 자랐기 때문", "궁궐에서 특별 교육을 받았기 때문", "형제가 없어 집중할 수 있었기 때문"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "\"사임당의 붓은 두 가지를 그렸어요.\"라는 말에서 '두 가지'는 무엇을 뜻하나요?", "options": ["수박과 포도", "종이 위의 풀과 벌레, 그리고 아이들 마음에 심어 준 사람의 길", "글씨와 시", "강릉의 바다와 산"], "correct": 1}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'보는 공부가 그리는 공부의 절반'이라는 사임당의 태도에서 알 수 있는 예술관은 무엇입니까?", "options": ["생생한 그림은 대상을 깊이 관찰하고 아끼는 눈에서 나온다는 것", "붓과 종이가 좋아야 그림이 좋다는 것", "빨리 그리는 것이 실력이라는 것", "상상만으로 그려야 진짜 예술이라는 것"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "사임당의 자녀 교육 원칙으로 가장 적절한 것은 무엇입니까?", "options": ["엄한 꾸중으로 버릇을 잡는 것", "경쟁에서 이기는 법을 가르치는 것", "재주보다 됨됨이가 먼저이며, 꾸중보다 본보기로 이끄는 것", "공부 시간을 정해 강요하는 것"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "사임당의 '네 가지 붓'에 해당하는 재능으로 옳은 묶음은 무엇입니까?", "options": ["노래, 춤, 악기, 바둑", "요리, 살림, 바느질, 농사", "의술, 천문, 산술, 지리", "글씨, 그림, 시, 자수"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "신사임당의 작품에 대한 오늘날의 평가로 옳은 것은 무엇입니까?", "options": ["여성 화가라는 이유로 아직 낮게 평가된다", "여성이라는 말을 떼고 보아도 조선을 대표하는 화가로 평가되며, 작품들은 국보급으로 인정받는다", "그림보다 글씨만 높이 평가된다", "작품이 남아 있지 않아 평가할 수 없다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'한 사람의 믿음이 한 사람의 재능을 살렸다'는 문장이 가리키는 관계는 무엇입니까?", "options": ["임금과 신하의 관계", "스승과 제자의 관계", "남편과 아내의 관계", "딸의 재능을 알아보고 지원한 아버지와 사임당의 관계"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "'아이들은 그림 그리는 어머니의 등을 보며 자랐다'는 문장이 보여 주는 교육의 방식은 무엇입니까?", "options": ["등을 돌리고 아이들을 외면했다는 것", "말보다 힘 있는, 몰입하고 정진하는 모습 그 자체의 가르침", "아이들에게 그림을 억지로 시켰다는 것", "아이들이 어머니를 방해하지 않았다는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'자수'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["바늘과 실로 천 위에 그림을 수놓는 것", "스스로 잘못을 고백하는 것", "글자의 수를 세는 것", "물속에서 헤엄치는 것"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'선구자'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["옛것을 지키는 사람", "구경을 좋아하는 사람", "오래 산 사람", "남보다 앞서 길을 열어 나간 사람"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'그림은 오직 실력으로만 말했다'는 서술이 담고 있는 뜻을 추론하면 무엇입니까?", "options": ["그림에 글씨를 쓰지 않았다는 것", "여성의 그림이라 낮춰 보던 편견도, 빼어난 작품 앞에서는 힘을 잃었다는 것", "사임당이 말수가 적었다는 것", "그림 값이 비쌌다는 것"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "어머니와 아들이 나란히 지폐의 얼굴이 된 사실에서 추론할 수 있는 것은 무엇입니까?", "options": ["두 사람이 부유했다는 것", "지폐 도안이 부족했다는 것", "한 가정에서 이루어진 교육과 성취가 나라 전체의 존경을 받을 만큼 컸다는 것", "지폐 인물은 가족 중에서 뽑는다는 것"], "correct": 2}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "사임당을 '현모양처'로만 부르는 것이 충분하지 않은 이유로 이 책이 제시하는 것은 무엇인가?", "options": ["그녀는 무엇보다 여성도 학문과 예술에서 뛰어난 성취를 이룰 수 있음을 증명한 선구자였기 때문", "그녀는 살림에 서툴렀기 때문", "자녀 교육에 실패했기 때문", "현모양처라는 말이 최근에 생긴 말이기 때문"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "'짧은 틈을 그림으로 채운' 사임당의 일상이 보여 주는 예술가로서의 태도는 무엇인가?", "options": ["살림을 소홀히 하는 몰입", "조건이 갖추어질 때를 기다리는 신중함", "주어진 조건 속에서도 창작을 삶의 일부로 지켜 낸 끈질긴 의지", "취미로서의 가벼운 즐김"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "신사임당의 생애에 대한 서술로 옳은 것은 무엇인가?", "options": ["1504년 강릉에서 태어나 일곱 남매를 길렀고, 마흔여덟에 세상을 떠났다", "한양에서 태어나 강릉으로 시집갔다", "평생 혼자 살며 그림에만 전념했다", "아흔 살까지 장수했다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "율곡 이이에 대한 서술로 옳은 것은 무엇인가?", "options": ["사임당의 맏아들이었다", "화가로 이름을 남겼다", "어머니와 사이가 멀었다", "일곱 남매 중 셋째 아들로, 조선 최고의 유학자이자 백성을 위한 정책을 편 정치가로 성장했다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'세월은 종이를 낡게 했지만, 그림 속 생명력만은 바래지 않았다'는 대비가 전하는 예술론은 무엇인가?", "options": ["종이의 보존 기술이 중요하다는 것", "진심과 정성이 담긴 예술은 물질의 낡음을 넘어 살아남는다는 것", "옛 그림은 복원해야 한다는 것", "박물관의 관리가 뛰어나다는 것"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "이 책이 아버지의 지원(2장)을 이야기 앞부분에 배치한 구성적 의도는 무엇인가?", "options": ["아버지를 주인공으로 삼으려는 것", "재능이 꽃피기까지는 '알아봐 주는 한 사람'이 필요함을 성취의 출발점에 새겨 두려는 것", "가정 형편을 설명하려는 것", "시대 배경을 생략하려는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'초충도(草蟲圖)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["초상화의 한 종류", "사계절 풍경을 그린 산수화", "풀과 벌레 등 주변의 작은 생명을 섬세하게 담아낸 그림", "궁중 행사를 기록한 그림"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'경지(境地)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["갈고닦아 다다른 매우 높은 수준", "땅의 경계", "조용한 마을", "공부방"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'시대가 그어 놓은 선 앞에서 멈추지 말라'는 이 책의 메시지가 사임당의 삶에서 근거로 삼는 것은 무엇인가?", "options": ["여성의 배움을 막던 시대에 붓 하나로 편견이 틀렸음을 증명한 그녀의 성취", "그녀가 시대의 규칙을 모두 따랐다는 사실", "그녀가 해외에서 공부했다는 사실", "그녀가 남장을 하고 활동했다는 사실"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'꿈과 가족 사이에서 고민하는 이들'에게 사임당의 삶이 건네는 답을 추론하면 무엇인가?", "options": ["가족을 위해 꿈은 접는 것이 옳다", "꿈을 위해 가족은 뒤로 미루어야 한다", "둘 중 하나는 반드시 실패한다", "두 길은 반드시 택일의 문제가 아니며, 정성과 의지로 함께 걸어 낼 수 있다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '신사임당' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'korperson08',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'korperson08',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
