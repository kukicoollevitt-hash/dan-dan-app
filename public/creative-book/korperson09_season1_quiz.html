<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 마음을 공부한 선비 — 퇴계 이황 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작한국인물09/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "성균관 시절 이황의 공부가 남들과 달랐던 점은 무엇인가요?", "options": ["가장 빨리 책을 읽어 치웠다", "시험에 나올 대목만 외우는 대신, 글의 근본 뜻을 파고들며 어제의 자신과 견주었다", "선생님께 답을 미리 물어보았다", "친구들과 어울려 함께만 공부했다"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "스물여섯 살이나 어린 기대승이 날카로운 반론 편지를 보냈을 때, 이황은 어떻게 했나요?", "options": ["훌륭한 물음이라며 기뻐하고, 학문의 벗으로 대하며 여러 해 동안 정성껏 편지 논쟁을 이어 갔다", "무례하다며 편지를 태워 버렸다", "제자로 삼는 조건으로 답장했다", "답장하지 않고 무시했다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "'퇴계'라는 호에 담긴 뜻으로 알맞은 것은 무엇인가요?", "options": ["큰 시내처럼 넓다는 뜻", "계곡에서 태어났다는 뜻", "벼슬에서 물러나 학문에 잠기고자 했던 뜻", "임금이 내려 준 이름"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "이황의 저술과 오늘날의 자취에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["책은 한 권만 남겼다", "저술은 모두 일본에서 만들어졌다", "만 원권 지폐에 초상이 실려 있다", "평생 70권이 넘는 책을 지었고, 성학십도를 남겼으며, 천 원권 지폐에 초상이 실려 있다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "이황이 말한 '이'와 '기'를 나침반과 물결에 빗댄 설명으로 알맞은 것은 무엇인가요?", "options": ["옳은 길을 아는 나침반(이)이 출렁이는 감정의 물결(기)을 이끌어야 사람이 바로 간다는 것", "물결(이)이 나침반(기)을 밀고 가야 한다는 것", "나침반과 물결은 아무 관계가 없다는 것", "배는 바람이 이끈다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "도산 배움터의 '첫 번째 가르침'은 무엇이었나요?", "options": ["시험에 합격하는 비법", "글씨를 반듯하게 쓰는 법", "빠르게 외우는 법", "지식보다 사람됨이 먼저이며, 배운 것을 삶으로 실천하는 것"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'성리학'에 대한 이 책의 설명으로 알맞은 것은 무엇인가요?", "options": ["별의 움직임을 연구하는 학문", "사람의 마음이 어떻게 움직이며 어떻게 바르게 사는가를 묻는 학문", "성을 쌓는 기술을 다루는 학문", "약초의 성질을 연구하는 학문"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'서원'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["책을 파는 가게", "서쪽에 있는 정원", "선비들이 공부하고 제자를 기르던 배움터", "관리들이 일하던 관청"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "\"깊이 판 우물일수록 멀리서도 물을 길으러 와요.\"라는 말이 이황의 학문과 연결되는 뜻은 무엇인가요?", "options": ["깊이 있는 학문은 바다 건너 일본까지 배우러 올 만큼 멀리 빛난다는 뜻", "우물을 잘 파야 부자가 된다는 뜻", "물이 깊으면 위험하다는 뜻", "도산에 우물이 많았다는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"배움의 끝은 벼슬이 아니라 사람다움이에요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["벼슬을 하면 공부를 그만둬야 한다는 뜻", "배움은 끝이 없어 지친다는 뜻", "공부의 참된 목적은 출세가 아니라 바르게 사는 사람이 되는 것이라는 뜻", "사람다운 사람만 벼슬을 해야 한다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'남과 견주기보다 어제의 저 자신과 견주었다'는 이황의 자세가 뜻하는 공부관은 무엇입니까?", "options": ["경쟁을 피하는 소극적 태도", "성적에 무관심한 태도", "등수가 중요하지 않던 시대상", "공부의 기준을 타인과의 경쟁이 아니라 자기 성장에 두는 것"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "이황이 높은 벼슬을 거듭 사양한 까닭으로 가장 적절한 것은 무엇입니까?", "options": ["몸이 약해 일을 할 수 없었기 때문", "정치 다툼이 무서웠기 때문", "벼슬은 한 시대의 일이지만 학문과 가르침은 여러 시대를 살리는 일이라 믿었기 때문", "고향의 재산을 관리해야 했기 때문"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "이황의 어린 시절에 대한 서술로 옳은 것은 무엇입니까?", "options": ["태어난 지 얼마 안 되어 아버지를 여의고, 홀어머니 밑에서 어렵게 자랐으며 열두 살에 논어를 다 읽었다", "부유한 집안에서 부족함 없이 자랐다", "공부를 싫어해 뒤늦게 배움을 시작했다", "궁궐에서 왕자들과 함께 공부했다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "성학십도에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["열 명의 제자를 소개한 책", "임금이 지켜야 할 도리를 열 폭의 그림과 글로 알기 쉽게 정리한 책", "열 가지 약초를 그린 책", "십 년의 일기를 모은 책"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "기대승과의 편지 논쟁이 이황의 학문에 미친 영향으로 옳은 것은 무엇입니까?", "options": ["논쟁에 지쳐 학문을 그만두게 했다", "젊은 학자들과 사이가 나빠졌다", "허술한 곳은 고치고 옳은 곳은 다듬으며 이론이 더욱 단단해졌다", "이론을 전부 버리고 새로 시작했다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'자리가 높아지는 것과 사람이 깊어지는 것은 다른 일'이라는 문장이 이야기에서 하는 역할은 무엇입니까?", "options": ["벼슬아치들을 비난하는 역할", "출세의 방법을 알려 주는 역할", "높은 자리의 어려움을 설명하는 역할", "벼슬 대신 학문으로 물러난 이황의 선택에 담긴 가치관을 압축해 보여 주는 역할"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'후학'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["학교 뒤에 있는 건물", "뒤에 배우는 사람들, 곧 다음 세대의 배우는 이들", "늦게 시작한 공부", "오후에 하는 수업"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'경전'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["학문이나 종교에서 근본 가르침을 담은 귀한 책", "경치를 그린 그림", "돈을 세는 장부", "시험 문제집"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'묻는 것을 부끄러워 말라. 묻지 않는 것이야말로 부끄러운 일이다'라는 가르침에서 추론할 수 있는 배움의 자세는 무엇입니까?", "options": ["모든 질문에는 정답이 있다는 것", "모르는 것을 감추기보다 드러내어 묻는 데서 배움이 자란다는 것", "스승에게는 질문하면 안 된다는 것", "질문은 수업이 끝난 뒤에 해야 한다는 것"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "일본 학자들이 이황을 '동방의 주자'라 부른 사실에서 추론할 수 있는 것은 무엇입니까?", "options": ["이황이 일본에서 공부했다는 것", "이황의 학문이 나라 밖에서도 최고 수준으로 우러러졌다는 것", "주자가 조선 사람이라는 것", "일본이 조선을 지배했다는 것"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'시험을 위한 공부는 시험과 함께 끝나지만, 뜻을 위한 공부는 평생을 간다'는 말이 담고 있는 학문관으로 가장 적절한 것은 무엇인가?", "options": ["공부의 가치는 목적의 깊이에 따라 수명이 달라진다는 것", "시험 공부는 할 필요가 없다는 것", "평생 시험을 준비해야 한다는 것", "공부는 빠를수록 좋다는 것"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "'죽는 날까지 스스로를 학생이라 여긴' 이황의 태도가 보여 주는 것은 무엇인가?", "options": ["제자들에 대한 겸손한 예의", "기억력이 나빠졌다는 고백", "벼슬을 얻지 못한 아쉬움", "앎의 완성이란 없으며 배움 자체가 삶의 방식이라는 평생 학습의 자세"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "이황의 생애에 대한 서술로 옳은 것은 무엇인가?", "options": ["평생 한양에서만 살았다", "1501년 안동에서 태어나 스물세 살에 성균관에 들었고, 1570년 일흔 살에 고향에서 세상을 떠났다", "벼슬을 한 번도 하지 않았다", "일본에 건너가 학문을 가르쳤다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "이와 기에 대한 이황의 학설로 옳은 것은 무엇인가?", "options": ["이와 기는 같은 것의 두 이름이다", "기가 이를 이끌어야 한다고 보았다", "이는 올바름의 원리, 기는 마음을 움직이는 힘이며, 이가 기를 이끌어야 올바른 사람이 된다고 보았다", "이와 기는 몸과 마음을 가리킨다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'노여워하기는커녕 얼굴이 환해졌다'는 기대승 편지 장면의 서술 효과는 무엇인가?", "options": ["이황의 무던한 성격을 보여 준다", "편지의 내용이 칭찬이었음을 암시한다", "젊은 학자를 이기려는 승부욕을 감춘 것이다", "독자의 예상을 뒤집으며 '학문 앞에 나이도 이름도 없다'는 대인의 풍모를 극적으로 드러낸다"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "'배움의 강줄기를 냈다'는 도산 배움터의 비유가 뜻하는 바는 무엇인가?", "options": ["한 스승의 가르침이 제자들을 통해 조선 곳곳으로 흘러 이어졌다는 것", "서원 옆에 실제로 강이 흘렀다는 것", "건물을 물가에 지었다는 것", "공부는 물처럼 쉬워야 한다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'호(號)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["관청에서 매긴 번호", "본이름 대신 허물없이 부르도록 지은 이름으로, 뜻을 담아 짓기도 한다", "벼슬의 등급", "집의 문패"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'유학자(儒學者)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["외국에서 공부한 사람", "공자의 가르침을 잇는 유학을 깊이 연구한 학자", "놀기를 좋아하는 사람", "벼슬이 높은 관리"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'명성이란 바라지 않는 사람을 오히려 따라오는 법'이라는 서술이 이황의 삶에서 근거로 삼는 것은 무엇인가?", "options": ["명성을 얻으려 애쓴 사람은 반드시 실패한다는 법칙", "조용히 물러나 학문에만 정진했음에도 그 이름이 나라 밖까지 빛나게 된 사실", "이황이 유명해지기를 몰래 바랐다는 사실", "일본이 조선의 책을 수입한 사실"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「이황은 평생 마음을 공부했고, 그 공부로 조선의 마음을 길렀다」는 문장의 함의를 추론하면 무엇인가?", "options": ["마음 공부는 혼자만을 위한 것이다", "조선 사람들은 마음이 여렸다", "심리학이 조선에서 시작되었다", "한 사람의 내면 수양이 제자와 저술을 통해 한 시대의 정신을 기르는 데까지 이르렀다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '퇴계 이황' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'korperson09',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'korperson09',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
