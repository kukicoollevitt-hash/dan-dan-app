<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔬 유배지에서 피운 오백 권의 꽃 — 다산 정약용 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작한국인물10/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "정약용에게 벼슬은 어떤 의미였나요?", "options": ["집안을 일으키는 수단", "임금 곁에 머무는 영광", "시기하는 사람들을 이기는 힘", "출세의 사다리가 아니라, 배운 것을 백성을 위해 쓸 수 있는 기회"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "유배지 강진에서 정약용이 내린 선택은 무엇이었나요?", "options": ["임금에게 용서를 비는 편지만 썼다", "세월을 원망하는 대신, 유배의 시간을 통째로 학문 연구에 바치기로 했다", "몰래 한양으로 도망칠 계획을 세웠다", "농사를 지으며 학문을 접었다"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "거중기에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["여러 개의 도르래로 무거운 돌을 쉽게 들어 올리는 기계로, 수원 화성 공사를 2년 8개월 만에 끝내게 했다", "물을 퍼 올리는 농사 기계였다", "곡식을 빻는 방아 기계였다", "적의 성을 부수는 전쟁 무기였다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "다산의 대표작 세 권으로 알맞은 묶음은 무엇인가요?", "options": ["동의보감, 성학십도, 난중일기", "훈민정음, 용비어천가, 월인천강지곡", "목민심서, 흠흠신서, 경세유표", "삼국사기, 삼국유사, 고려사"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "\"학문은 백성의 밥이 되고 약이 되어야 한다.\"라는 말에 담긴 실학의 정신은 무엇인가요?", "options": ["학문으로 농사와 의술을 대신하자는 것", "공부는 글귀 다툼이 가장 중요하다는 것", "학자는 밥과 약을 만들어 팔아야 한다는 것", "학문은 책 속에 머물지 말고 백성의 실제 삶에 도움이 되어야 한다는 것"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "18년의 유배가 정약용의 삶에서 갖는 의미로 알맞은 것은 무엇인가요?", "options": ["학문을 그만두게 된 잃어버린 세월", "불행을 학문이라는 열매로 바꾸어, 오백 권의 책이 태어난 시간", "임금을 원망하며 보낸 시간", "제자들과 헤어져 혼자 지낸 시간"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'실학'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["실내에서만 하는 공부", "실을 다루는 기술", "실제 생활에 도움이 되는 것을 추구하는 학문", "실패를 연구하는 학문"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'유배'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["죄인을 먼 곳으로 보내 살게 하는 벌", "벼슬을 올려 주는 것", "배를 타고 유람하는 것", "공부하러 외국에 가는 것"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "이백 년 전의 목민심서가 오늘날에도 공무원 필독서로 꼽히는 까닭을 짐작하면 무엇인가요?", "options": ["'관리는 백성을 위해 있다'는 가르침이 시대가 바뀌어도 변하지 않는 공직의 근본이기 때문", "다른 책이 남아 있지 않기 때문", "글이 쉬워서 빨리 읽히기 때문", "시험에 나오기 때문"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"역경은 다산의 붓을 꺾지 못했지요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["다산의 붓이 튼튼한 나무로 만들어졌다는 뜻", "유배지에서는 붓을 구하기 어려웠다는 뜻", "어떤 시련도 배움과 저술을 향한 다산의 의지를 꺾지 못했다는 뜻", "다산이 글씨를 힘주어 썼다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "정조와 정약용의 관계에 대한 설명으로 가장 적절한 것은 무엇입니까?", "options": ["학문을 사랑한 임금이 젊은 신하의 재능을 알아보고, 함께 백성 잘사는 나라를 꿈꾼 사이", "서로 경계하며 거리를 둔 사이", "혈연으로 맺어진 사이", "신하가 임금을 가르친 사제 사이"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "'복사뼈에 세 번 구멍이 났다'는 이야기가 전하는 정약용의 모습은 무엇입니까?", "options": ["유배지의 생활이 험했다는 것", "건강을 돌보지 않은 어리석음", "앉아서 공부하고 저술하는 일에 쏟은 상상을 넘는 집념", "오래된 병을 앓았다는 것"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "정약용이 유배를 당하게 된 표면적 이유로 옳은 것은 무엇입니까?", "options": ["수원 화성 공사의 실패", "거중기 발명의 실패", "임금의 재산을 훔친 죄", "천주교를 믿었다는 이유"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "흠흠신서와 경세유표에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["둘 다 농사법을 정리한 책이다", "흠흠신서는 억울한 사람이 없도록 재판의 신중함을 다룬 형법서, 경세유표는 제도를 고쳐 나라를 잘살게 하려는 개혁서다", "둘 다 시를 모은 문집이다", "흠흠신서는 의학서, 경세유표는 지리서다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'학문이 밥상까지 내려왔다'는 표현이 뜻하는 것은 무엇입니까?", "options": ["학자들이 밥상머리에서 공부했다는 것", "글공부보다 밥이 중요하다는 것", "책을 밥상 위에 두고 읽었다는 것", "실학이 농사·의학·기술처럼 백성의 하루하루와 이어진 물음을 다루었다는 것"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "'벼슬에서 쫓겨난 사람이 쓴 가장 훌륭한 벼슬살이 교과서'라는 역설적 표현의 효과는 무엇입니까?", "options": ["목민심서의 탄생 배경이 지닌 극적인 대비로 책의 가치를 더욱 도드라지게 한다", "정약용이 벼슬을 그리워했음을 보여 준다", "관리 시험의 어려움을 강조한다", "유배 제도의 부당함만을 고발한다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'목민(牧民)'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["나무를 심어 기르는 일", "백성을 보살펴 다스리는 일", "가축을 기르는 일", "목화를 재배하는 일"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'급제'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["급하게 만든 제도", "계단을 빨리 오르는 것", "과거 시험에 합격하는 것", "높은 벼슬에서 물러나는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'혼자 아는 지식은 반쪽 지식'이라는 정약용의 믿음에서 추론할 수 있는 것은 무엇입니까?", "options": ["앎은 책과 가르침으로 나누어질 때 비로소 세상을 나아지게 하는 온전한 지식이 된다", "지식은 반씩 나누어 외워야 한다", "혼자 공부하면 실력이 늘지 않는다", "책은 두 권씩 써야 한다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "수원 화성이 세계문화유산이 되고 유네스코가 정약용을 기념한 사실에서 추론할 수 있는 것은 무엇입니까?", "options": ["세계가 조선의 성곽만을 높이 평가한다는 것", "백성을 향했던 그의 학문과 업적이 인류 보편의 가치로 인정받았다는 것", "유배 제도가 세계적으로 유명해졌다는 것", "화성이 세계에서 가장 큰 성이라는 것"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'이대로 세월을 원망하며 늙어 갈 것인가, 이 시간마저 쓸모 있게 만들 것인가'라는 자문이 보여 주는 삶의 태도는 무엇인가?", "options": ["운명에 대한 체념", "복수를 위한 은밀한 준비", "통제할 수 없는 불행 앞에서도 자기 시간의 쓰임새만은 스스로 선택하는 주체적 자세", "세상과의 완전한 단절"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "'세상이 자신을 버렸다고 해서 자신마저 세상을 버리지는 않았다'는 문장이 정약용의 저술 활동과 맺는 관계는 무엇인가?", "options": ["500권의 책이 곧 세상을 향한 애정과 책임을 놓지 않았다는 증거라는 것", "저술이 세상에 대한 복수였다는 것", "책을 써서 유배에서 풀려나려 했다는 것", "세상 소식을 몰라서 쓸 수 있었다는 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "정약용의 생애에 대한 서술로 옳은 것은 무엇인가?", "options": ["평생 벼슬 없이 초야에서만 살았다", "1762년에 태어나 스물두 살에 급제했고, 강진에서 18년 유배를 살았으며 1836년 일흔다섯에 세상을 떠났다", "유배지에서 세상을 떠났다", "임진왜란 때 활약한 인물이다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "일곱 살 정약용이 지었다는 시의 내용으로 옳은 것은 무엇인가?", "options": ["강물이 바다로 흘러가는 이치를 노래했다", "어머니에 대한 그리움을 노래했다", "계절의 변화를 노래했다", "작은 산이 큰 산을 가리는 것은 멀고 가까움이 다르기 때문이라는 이치를 담았다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "거중기 일화가 실학의 정신을 보여 주는 방식으로 가장 적절한 것은 무엇인가?", "options": ["일꾼들의 고생을 덜려는 마음이 도르래의 원리라는 지식과 만나, 학문이 현실의 문제를 푸는 도구가 되는 과정을 보여 준다", "기계가 사람보다 낫다는 것을 보여 준다", "서양 기술의 우수성을 보여 준다", "공사 비용 절감의 경제 원리를 보여 준다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'유배지의 등불이 세계를 비췄다'는 은유가 압축하는 서사의 구조는 무엇인가?", "options": ["강진의 밤이 어두웠다는 사실", "가장 낮고 어두운 자리에서 이룬 성취가 시공을 넘어 인류의 유산이 된 반전의 구조", "등불이 귀하던 시대상", "유배지에서의 독서 습관"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'실학(實學)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["실험실에서 하는 학문", "옛 글귀의 해석에 힘쓰는 학문", "이론을 넘어 농업·의학·기술 등 백성의 실제 삶을 이롭게 하려 한 조선 후기의 학문 경향", "실력을 겨루는 학문"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'저술(著述)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["책을 소리 내어 읽는 것", "글을 지어 책으로 남기는 것", "책을 베껴 쓰는 것", "책을 사고파는 것"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'시간을 어떻게 쓰는가가 곧 그 사람을 말해 준다'는 명제를 정약용의 삶으로 증명한다면, 그 근거는 무엇인가?", "options": ["그는 시간을 아껴 일찍 급제했다", "그는 하루도 쉬지 않고 일했다", "같은 18년을 원망으로 채울 수도 있었으나, 오백 권의 저술로 채워 몰락의 시절을 가장 빛나는 시절로 만들었다", "그는 시계를 발명했다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "'힘든 시간이 닥쳤을 때 나는 그 시간을 무엇으로 채울 것인가'라는 이 책의 물음에 대한 다산의 대답을 추론하면 무엇인가?", "options": ["시간이 해결해 주기를 기다리라", "더 힘든 사람과 비교하며 위안하라", "주저앉는 대신 붓을 들어, 지금 할 수 있는 일에 온 힘을 쏟으라", "힘든 기억은 빨리 잊으라"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '다산 정약용' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'korperson10',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'korperson10',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
