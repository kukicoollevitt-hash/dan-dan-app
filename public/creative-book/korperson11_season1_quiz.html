<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌏 우물 밖으로 떠난 스님 — 혜초와 왕오천축국전 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작한국인물11/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "산골 소년이 수행자의 길을 걷기로 결심한 계기는 무엇이었나요?", "options": ["죽은 줄 알았던 멧돼지가 새끼들에게 젖을 먹이는 광경을 보고, 생명을 가볍게 여긴 자신을 깊이 반성했기 때문", "부모님이 절에 보냈기 때문", "마을에 큰 흉년이 들었기 때문", "유명한 스님이 되어 이름을 알리고 싶었기 때문"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "목숨을 잃을 수도 있는 인도행을 앞두고 혜초가 내린 결론은 무엇이었나요?", "options": ["더 안전한 뱃길이 열릴 때까지 기다리기로 했다", "고향 신라로 돌아가기로 했다", "두려움 때문에 꿈을 접으면 평생 그 꿈의 언저리만 맴돌 것이니, 가겠다는 것", "제자를 대신 보내기로 했다"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "혜초의 인도 여행에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["배를 타고 편안히 다녀왔다", "장사하는 상단을 따라 사막과 산맥을 넘어, 약 4년 동안 인도와 여러 나라를 여행했다", "당나라 황제의 사신으로 파견되었다", "한 달 만에 다녀온 짧은 여행이었다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "왕오천축국전에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["부처의 가르침을 번역한 경전이다", "신라의 역사를 정리한 역사책이다", "사막을 건너는 방법을 적은 안내서다", "다섯 천축국(인도)을 다녀온 기록으로, 동아시아 최초의 본격 해외 여행기로 평가받는다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "\"가르침이 태어난 땅을 두 발로 밟아 보는 것은 또 다른 공부\"라는 스승의 말이 이야기에서 하는 역할은 무엇인가요?", "options": ["책 공부가 필요 없다는 뜻을 전한다", "당나라 유학을 그만두게 만든다", "혜초의 가슴에 인도행의 불씨를 떨어뜨리는 계기가 된다", "스승의 고향 자랑일 뿐이다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "혜초가 깨달은 '우물 안 개구리'의 뜻은 무엇인가요?", "options": ["신라와 당나라가 세상의 전부인 줄 알았던 자신처럼, 좁은 세계를 전부로 믿고 사는 것", "우물에 사는 개구리는 행복하다는 것", "개구리는 하늘을 볼 수 없다는 것", "우물물이 마르면 위험하다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'순례'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["순서대로 예의를 갖추는 것", "여러 나라를 돌며 장사하는 것", "임금을 뵈러 가는 길", "성스러운 곳을 하나하나 찾아다니는 여행"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'상단'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["절에서 가장 높은 자리", "여러 나라를 오가며 장사하는 상인들의 무리", "군대의 우두머리", "책의 윗부분"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "\"혼자 본 세상은 추억이 되지만, 나누어 전한 세상은 유산이 돼요.\"라는 말의 뜻을 짐작하면 무엇인가요?", "options": ["경험을 기록해 나누면 한 사람의 체험이 모두의 지식이 되어 오래 남는다는 뜻", "여행은 혼자 가면 재미없다는 뜻", "추억은 사진으로 남겨야 한다는 뜻", "유산은 자손에게만 물려주는 것이라는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"넓은 세상은 떠나는 사람의 것이지요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["여행을 많이 하면 부자가 된다는 뜻", "떠난 사람은 돌아오지 못한다는 뜻", "익숙한 자리를 벗어나는 용기를 낸 사람만이 더 큰 세계를 만날 수 있다는 뜻", "세상은 주인이 없다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "멧돼지 사건이 혜초의 삶에서 갖는 의미로 가장 적절한 것은 무엇입니까?", "options": ["사냥 실력이 뛰어났음을 보여 주는 일화", "생명 앞의 부끄러움을 배우며 삶의 방향을 바꾼 첫 스승과도 같은 사건", "가족의 가난을 보여 주는 일화", "산골 생활의 위험함을 알려 주는 사건"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "당나라 유학 시절 혜초의 마음에 남아 있던 '갈증'은 무엇이었습니까?", "options": ["고향 음식에 대한 그리움", "더 높은 지위에 대한 바람", "경전 암송 실력의 부족", "책 속의 글자만으로는 채워지지 않는, 가르침이 태어난 땅을 직접 보고 싶다는 목마름"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "인도로 가는 길의 어려움으로 이 책에 그려진 것은 무엇입니까?", "options": ["해적의 습격과 폭풍우", "낮에는 불볕더위, 밤에는 얼어붙는 사막과 눈보라 치는 산맥", "맹수의 공격과 전염병", "길을 막는 국경 관리들"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "여행에서 혜초가 만난 세계의 모습으로 옳은 것은 무엇입니까?", "options": ["나라마다 옷차림, 인사법, 음식, 종교와 생활 모습이 저마다 달랐다", "모든 나라가 당나라와 똑같은 모습이었다", "사람이 살지 않는 빈 땅이 대부분이었다", "말이 통하지 않아 아무것도 배울 수 없었다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'다름은 두려운 것이 아니라 배울 것이 가득한 보물 창고'라는 깨달음이 보여 주는 태도는 무엇입니까?", "options": ["보물을 찾아다니는 모험심", "낯선 문화를 경계하는 신중함", "낯선 것을 열린 눈과 귀로 받아들이는 여행자의 자세", "자기 문화를 자랑하는 긍지"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'그 깨달음은 부끄러움이 아니라 기쁨이었다'는 서술의 뜻은 무엇입니까?", "options": ["자신의 작음을 아는 순간부터 배울 것이 그만큼 많아지기 때문", "부끄러움을 감추는 법을 배웠기 때문", "아무도 자신의 무지를 몰랐기 때문", "여행이 끝나 홀가분했기 때문"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'수행자'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["임금을 따라다니며 돕는 신하", "마음을 닦으며 깨달음을 구하는 사람", "여행을 직업으로 하는 사람", "글씨를 쓰는 사람"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'천축국'이 가리키는 곳으로 옳은 것은 무엇입니까?", "options": ["일본의 옛 이름", "당나라의 수도", "옛날에 인도를 부르던 이름", "신라의 산골 마을"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'기억이 흐려지기 전에 하나하나 글로 옮겼다'는 서술에서 추론할 수 있는 기록의 지혜는 무엇입니까?", "options": ["경험은 시간이 지나면 사라지므로, 생생할 때 적어 두어야 오래 남는다", "글은 천천히 쓸수록 좋다", "기억력이 나쁜 사람만 기록한다", "기록은 여행이 끝난 뒤 몇 년 뒤에 해야 정확하다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'여행은 4년으로 끝났지만, 기록은 천삼백 년을 살아남았다'는 문장이 함축하는 바를 추론하면 무엇입니까?", "options": ["여행보다 독서가 중요하다는 것", "기록은 체험의 수명을 시대를 넘어 늘려 주는 힘이 있다는 것", "옛날 종이가 튼튼했다는 것", "짧은 여행일수록 기록이 오래간다는 것"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "혜초의 삶을 이끈 두 가지 힘으로 이 책이 제시하는 것은 무엇인가?", "options": ["가난과 명예욕", "스승의 명령과 나라의 지원", "불운과 행운", "생명 앞에 부끄러움을 알았던 마음과, 모르는 세계를 향한 탐구의 정신"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "'떠나는 사람만이 만날 수 있는 세상이 있다'는 서술이 혜초의 결단과 관련해 뜻하는 바는 무엇인가?", "options": ["안전과 익숙함에 머무는 한 열리지 않는 경험의 지평이 있다는 것", "여행자는 특별한 신분이라는 것", "떠나지 않는 사람은 게으르다는 것", "세상은 떠난 사람의 소유가 된다는 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "왕오천축국전의 가치에 대한 서술로 옳은 것은 무엇인가?", "options": ["신라의 지리를 정리한 최초의 지도책이다", "불경을 최초로 한글로 옮긴 책이다", "천삼백 년 전 인도와 그 주변의 모습을 생생히 전하는, 세계적으로도 드문 기록이다", "당나라 황실의 명으로 편찬된 관찬 사서다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "혜초의 여정 순서로 옳은 것은 무엇인가?", "options": ["신라 → 인도 → 당나라", "신라 → 당나라 유학 → 상단을 따라 인도와 여러 나라 순례", "당나라 → 신라 → 인도", "인도 → 당나라 → 신라"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "이야기가 '멧돼지 사냥'이라는 산골의 사건으로 시작하는 구성적 효과는 무엇인가?", "options": ["위대한 순례자의 출발점에 생명에 대한 각성이라는 내면의 사건을 놓아, 여정의 뿌리가 마음의 변화임을 보여 준다", "사냥 기술의 발달사를 보여 준다", "신라의 산골 풍습을 소개한다", "멧돼지의 생태를 설명한다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'우물'의 은유가 결말에서 '지금의 우리'에게로 확장되는 방식은 무엇인가?", "options": ["우물물의 소중함을 일깨운다", "개구리 보호의 필요성을 알린다", "우물 파는 기술을 가르친다", "익숙한 동네와 익숙한 생각이라는 저마다의 우물을 돌아보게 하며, 바깥으로 내딛는 작은 용기를 권한다"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'기록문(記錄文)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["상상하여 지어낸 이야기", "보고 듣고 겪은 일을 사실대로 적은 글", "노래하듯 운율을 살린 글", "주장을 펴서 남을 설득하는 글"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'열망(熱望)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["뜨거운 날씨를 바라는 마음", "열 가지 소원", "무엇을 뜨겁고 간절하게 바라는 마음", "희망을 잃은 상태"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'아는 만큼 겸손해지는 법'이라는 서술이 혜초의 각성과 관련해 함축하는 바를 추론하면 무엇인가?", "options": ["겸손한 사람은 아는 것이 적다", "지식은 자랑할수록 커진다", "세계의 넓이를 실감한 사람일수록 자기 앎의 작음을 알아 배움 앞에 낮아진다", "여행자는 말을 아껴야 한다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "'누구나 자기만의 왕오천축국전을 쓸 수 있다'는 결말의 제안이 뜻하는 바를 추론하면 무엇인가?", "options": ["모두가 인도로 여행을 떠나야 한다는 것", "책을 많이 사야 한다는 것", "옛 책을 베껴 써 보라는 것", "익숙함 바깥으로 나아가 겪고 배운 것을 기록하는 삶은 누구에게나 열려 있다는 것"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '혜초와 왕오천축국전' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'korperson11',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'korperson11',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
