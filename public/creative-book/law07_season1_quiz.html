<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏛️ 편지 한 통이 법이 되기까지 — 우리 학교 앞 건널목 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작법07/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "\"우리는 애들이잖아.\"라는 주호의 말이 이든이의 가슴에 가시처럼 박힌 까닭은 무엇인가요?", "options": ["주호가 자기를 무시하는 것 같아서", "주호의 목소리가 너무 컸기 때문에", "어린이라서 아무것도 바꿀 수 없다는 것이 사고보다 더 분하게 느껴져서", "자기도 다칠까 봐 무서워져서"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "겨울에 이든이가 프로젝트 파일을 서랍 깊숙이 밀어 넣은 마음은 어떤 것이었나요?", "options": ["반년을 기다려도 달라지지 않는 것 같아 믿음이 흔들리고 지쳤기 때문에", "파일을 잃어버릴까 봐 안전하게 보관하려고", "새 프로젝트를 시작하려고", "선생님이 그만하라고 해서"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "법을 만드는 곳에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["대통령이 혼자 법을 만든다", "법원이 재판을 하면서 법을 만든다", "시청에서 시장이 법을 만든다", "국민이 뽑은 국회의원들이 모인 국회에서 만들며, 이 권한을 입법권이라고 한다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "법률안이 법이 되기까지의 순서로 알맞은 것은 무엇인가요?", "options": ["본회의 → 상임위원회 → 제안 → 공포", "제안 → 상임위원회 검토 → 본회의 토론·투표 → 대통령의 공포", "공포 → 본회의 → 상임위원회 → 제안", "제안 → 대통령 허락 → 상임위원회 → 본회의"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "아이들이 국회 상임위원회 회의를 방청한 장면이 중요한 까닭은 무엇인가요?", "options": ["잊힌 줄 알았던 제안서가 국회에서 살아 움직이고 있음을 확인하고 믿음을 되찾았기 때문에", "국회 건물 구경이 재미있었기 때문에", "버스를 타고 멀리 가 본 첫 경험이었기 때문에", "오 의원과 사진을 찍었기 때문에"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "\"느린 것과 멈춘 것은 다르다.\"라는 말이 이 이야기에서 뜻하는 것은 무엇인가요?", "options": ["느린 사람은 결국 목적지에 못 간다는 뜻", "법이 눈에 안 보이게 천천히 검토되는 것은 멈춘 것이 아니라 제 길을 걷는 중이라는 뜻", "빨리 걷는 것보다 천천히 걷는 것이 건강에 좋다는 뜻", "건널목에서는 천천히 걸어야 한다는 뜻"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'입법권'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["법을 어긴 사람을 잡아가는 권한", "재판을 하는 권한", "세금을 걷는 권한", "법을 만들 수 있는 권한"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "대통령이 하는 '공포'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["무서운 마음이 드는 것", "새로 만들어진 법을 나라에 널리 알리는 것", "법률안을 국회에 내는 것", "법을 어긴 사람을 벌하는 것"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "좋은 법이라도 서둘러 만들지 않고 몇 번이고 검토하는 까닭을 짐작하면 무엇인가요?", "options": ["법은 온 국민이 지켜야 하는 약속이라, 서둘러 만들면 엉뚱한 사람이 다칠 수 있기 때문에", "국회의원의 수가 너무 적기 때문에", "검토를 오래 할수록 월급을 많이 받기 때문에", "법을 만드는 기계가 느리기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"법은 높은 곳에서 내려오지 않아요. 낮은 곳의 목소리가 올라가 법이 되지요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["법은 높은 건물에서 만들어진다는 뜻", "목소리가 큰 사람이 이긴다는 뜻", "법의 씨앗은 보통 시민들의 목소리와 제안이라는 뜻", "낮은 곳에 사는 사람만 법을 지키면 된다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "이든이가 프로젝트를 이끌어 가는 과정에서 보인 태도로 가장 적절한 것은 무엇입니까?", "options": ["어른들의 결정을 조용히 기다리기만 했다", "분노와 좌절을 겪으면서도 조사·제안·확인의 행동을 멈추지 않았다", "친구들에게 일을 미루고 지켜보았다", "처음부터 끝까지 한 번도 흔들리지 않았다"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "오 의원이 \"이 법의 진짜 주인공은 여러분입니다\"라고 말한 뜻은 무엇입니까?", "options": ["아이들에게 상을 주겠다는 약속", "법률안의 이름을 아이들 이름으로 정했다는 뜻", "의원 자신은 아무 일도 하지 않았다는 겸손", "법의 출발점이 시민(아이들)의 목소리와 자료였다는 인정"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "아이들이 프로젝트에서 실제로 한 활동으로 옳은 것은 무엇입니까?", "options": ["국회 앞에서 시위를 벌였다", "건널목을 직접 공사했다", "차량 수 조사, 위험 지도 제작, 제안서 작성, 400명 서명 모으기를 했다", "신문사에 광고를 실었다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "본회의 통과의 조건으로 옳은 것은 무엇입니까?", "options": ["절반이 넘는 의원의 찬성", "대통령의 사전 허락", "전체 의원의 만장일치", "상임위원장의 단독 결정"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'주호의 깁스'라는 소재가 서사에서 하는 역할은 무엇입니까?", "options": ["병원 치료의 중요성을 알리는 소재", "이야기 전체를 움직이는 문제 상황의 출발점이자 제안서의 증거가 되는 소재", "주호의 용감함을 보여 주는 소재", "겨울 빙판의 위험을 알리는 소재"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'씨앗'의 비유가 이야기에서 가리키는 것은 무엇입니까?", "options": ["학교 화단에 심은 나무", "시민의 제안이 긴 과정을 거쳐 법으로 자라나는 것", "아이들의 키가 자라는 것", "건널목에 심은 가로수"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'상임위원회'에 대한 설명으로 가장 적절한 것은 무엇입니까?", "options": ["법률안을 분야별로 전문적으로 검토하는 국회의 기구", "대통령을 보좌하는 기구", "법을 어긴 사람을 재판하는 기구", "학교의 학생 자치 기구"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'삼권분립'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["국회의원을 세 번 뽑는 제도", "세 개의 정당이 경쟁하는 제도", "법을 세 번 검토하는 절차", "법을 만드는 국회, 집행하는 정부, 재판하는 법원으로 권력을 나누는 것"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'투표권이 없다고 목소리까지 없는 것은 아니다'라는 선생님의 말이 함축하는 시민 참여의 방법을 추론하면 무엇입니까?", "options": ["투표할 나이가 될 때까지 기다리는 것", "편지·제안·서명처럼 누구나 할 수 있는 참여의 길이 열려 있다는 것", "어른에게 모든 일을 맡기는 것", "법을 지키지 않는 방식으로 항의하는 것"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "이 이야기가 '법이 만들어지는 데 걸린 일 년'을 자세히 그린 의도를 추론하면 무엇입니까?", "options": ["국회의 일 처리가 느림을 비판하려고", "기다림은 언제나 헛되다는 것을 보여 주려고", "민주주의의 변화는 신중한 절차를 거치며, 그 느림이 멈춤이 아님을 보여 주려고", "아이들의 인내심을 시험하려고"], "correct": 2}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'애들이잖아'라는 체념에서 '우리가 어른들에게 가르쳐 주었다'는 결말로 이어지는 이든이의 변화가 보여 주는 것은 무엇인가?", "options": ["시민적 효능감, 곧 나의 참여가 공동체를 바꿀 수 있다는 확신의 획득", "어린이도 투표권을 가져야 한다는 주장", "권위에 대한 순응의 학습", "어른에 대한 불신의 심화"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "7장에서 이든이의 '폭발'과 좌절이 서사적으로 필요한 이유는 무엇인가?", "options": ["이든이의 급한 성격을 비판하기 위해", "제도의 완전함을 증명하기 위해", "참여의 대가가 즉각적이지 않다는 현실의 무게를 보여 주어, 이후의 회복과 결실을 더 값지게 하기 위해", "프로젝트의 실패를 예고하기 위해"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "입법 과정에 대한 서술로 옳은 것은 무엇인가?", "options": ["대통령이 법률안을 거부하면 국회는 해산된다", "상임위원회를 통과하면 곧바로 법이 된다", "법률안은 국회의원만 제출할 수 있다", "법률안은 국회의원이나 정부가 제출하며, 상임위원회 검토와 본회의 과반 찬성, 공포를 거쳐 법이 된다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "삼권분립에 따른 역할 분담으로 옳은 것은 무엇인가?", "options": ["국회가 법을 만들고 집행하며 재판까지 담당한다", "국회는 법을 만들고, 정부는 법을 집행하며, 법원은 법을 어긴 사람을 재판한다", "정부가 법을 만들고 국회가 집행한다", "법원이 법을 만들고 국회가 재판한다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'위험 지도의 빨간 점' 자리에 신호등이 세워지는 결말이 갖는 의미는 무엇인가?", "options": ["공사 업체의 성실함을 보여 준다", "우연의 일치를 통한 극적 재미를 준다", "시민이 수집한 자료가 실제 정책 집행의 근거가 되었음을 보여 준다", "지도 그리기 교육의 중요성을 강조한다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "이야기가 '첫 초록불'이라는 장면으로 마무리되는 효과는 무엇인가?", "options": ["교통 신호 교육으로 주제를 전환하는 효과", "추상적인 입법의 결실을 아이들의 일상 감각(당당한 등굣길)으로 번역해 보여 주는 효과", "계절의 변화를 알리는 효과", "새 프로젝트의 시작을 예고하는 효과"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'입법(立法) 과정'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["법을 집행하여 정책을 실현하는 절차", "법률안이 제안부터 공포까지 거치는 심의와 의결의 절차", "법정에서 판결이 내려지는 절차", "선거로 대표를 뽑는 절차"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'과반수(過半數)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["전체의 3분의 2 이상", "참석자 전원", "가장 많은 표를 얻은 쪽", "전체의 절반을 넘는 수"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'서둘러 만든 법이 엉뚱한 사람을 다치게 할 수도 있다'는 말이 입법의 신중함에 대해 시사하는 바를 추론하면 무엇인가?", "options": ["법은 적을수록 좋다", "법은 강자를 보호하기 위해 존재한다", "법의 효력이 모든 국민에게 미치므로 부작용을 거듭 살피는 숙의가 필수적이다", "신속한 입법은 언제나 잘못된 결과를 낳는다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "「낮은 곳의 목소리가 올라가 법이 되지요.」라는 경구가 함축하는 민주주의관을 추론하면 무엇인가?", "options": ["법은 전문가 집단의 전유물이어야 한다", "주권은 시민에게 있으며 제도는 그 목소리를 담아내는 통로여야 한다", "다수의 뜻은 언제나 옳다", "목소리가 커야만 정치에 참여할 수 있다"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '편지 한 통이 법이 되기까지' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'law07',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'law07',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
