<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚖️ 깨진 유리창의 진실 — 우리 반 작은 법정 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작법08/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "사건 직후 노아가 가장 억울했던 점은 무엇인가요?", "options": ["친구들이 공을 돌려주지 않은 것", "안 했다는 사실은 자기만 알고 있는데, 아니라고 말할수록 더 의심받는 것", "유리값을 물어 주게 된 것", "선생님이 자기만 혼낸 것"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "짝꿍 다인이가 한 일이 아닌 것은 무엇인가요?", "options": ["노아의 변호인을 자원했다", "포기하려는 노아에게 항소를 권했다", "노아와 함께 증거를 찾으러 다녔다", "노아 대신 유리값을 물어 주었다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "법원 견학에서 아이들이 본 판사의 모습으로 알맞은 것은 무엇인가요?", "options": ["어느 편도 들지 않고 양쪽 말을 똑같이 들으며 증거 서류를 거듭 살폈다", "목소리가 큰 쪽의 손을 들어 주었다", "방청객의 박수를 받으며 판결했다", "한쪽 이야기만 듣고 빠르게 판결했다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "과학실 유리창을 깬 진짜 범인은 무엇이었나요?", "options": ["노아가 찬 공", "옆 반 아이가 던진 돌", "강풍에 부러져 떨어진 은행나무 가지", "지나가던 새"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "규칙을 다 지킨 첫 재판에서 노아가 진 사건이 보여 주는 것은 무엇인가요?", "options": ["판사를 맡은 아이들이 나빴다는 것", "변호인이 게을렀다는 것", "재판은 원래 하나 마나라는 것", "절차를 지킨 재판도 틀릴 수 있어서, 바로잡을 기회(항소)가 필요하다는 것"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "\"소문은 빠르고 증거는 느리니까, 법정이 시간을 벌어 주는 거야.\"라는 말의 뜻은 무엇인가요?", "options": ["느린 진실이 이길 수 있도록 재판이라는 절차가 서두르지 않고 기다려 준다는 뜻", "재판은 오래 할수록 좋다는 뜻", "소문을 퍼뜨리려면 빨리 말해야 한다는 뜻", "법정의 시계는 느리게 간다는 뜻"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'무죄 추정의 원칙'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["죄가 없는 사람은 재판을 받지 않는다는 원칙", "목격자가 많으면 유죄라는 원칙", "판결이 내려지기 전까지는 누구도 죄인으로 여기지 않는다는 원칙", "죄를 지으면 반드시 벌을 받는다는 원칙"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'항소'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["판사에게 큰 소리로 항의하는 것", "판결에 불만이 있을 때 다시 재판해 달라고 요청하는 것", "재판을 도중에 그만두는 것", "증거를 새로 만들어 내는 것"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "목격자 아이들이 거짓말을 한 것이 아니라 '정말 그렇게 본 줄 알았다'는 사실에서 알 수 있는 것은 무엇인가요?", "options": ["사람의 기억은 흐릿해서, 굳게 믿는 기억도 틀릴 수 있다는 것", "목격자는 언제나 믿을 수 있다는 것", "거짓말은 금방 들통난다는 것", "눈이 나쁜 사람은 증언하면 안 된다는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"정의는 증거와 절차 위에 서지요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["정의로운 사람은 높은 곳에 서야 한다는 뜻", "증거가 많은 쪽이 언제나 착한 쪽이라는 뜻", "옳고 그름은 짐작과 소문이 아니라 증거와 공정한 절차로 가려야 한다는 뜻", "절차는 어른들만 지키면 된다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "노아가 이 사건을 겪으며 얻은 가장 큰 배움은 무엇입니까?", "options": ["소리치는 대신 절차에 기대는 법과, 함부로 손가락질하지 않는 태도", "공은 운동장 가운데서만 차야 한다는 것", "친구를 쉽게 믿으면 안 된다는 것", "소문은 무시하면 저절로 사라진다는 것"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "판사를 맡은 세 아이가 두 번째 재판에서 보여 준 미덕은 무엇입니까?", "options": ["신속하게 재판을 끝내는 결단력", "친구들의 분위기에 휩쓸리지 않고 새 증거에 따라 자기들의 판결을 스스로 뒤집은 용기", "방청객을 많이 모은 홍보 능력", "어려운 법률 용어를 잘 쓰는 지식"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "학급 법정의 규칙으로 정해진 것이 아닌 것은 무엇입니까?", "options": ["증거와 사실만 말할 것", "판결 전까지 노아를 범인이라 부르지 않을 것", "목격자가 많은 쪽의 손을 들어 줄 것", "상대의 말을 끊지 말 것"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "결정적 증거가 된 방송반 영상에 담긴 내용으로 옳은 것은 무엇입니까?", "options": ["노아가 공을 차는 장면", "노아가 유리창 앞에서 도망치는 장면", "목격자들이 거짓말을 모의하는 장면", "12시 38분 급식실 줄에 선 노아와, 강풍에 부러진 가지가 창문으로 떨어지는 장면"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "진짜 법원 견학(3장)이 이야기 전개에서 하는 역할은 무엇입니까?", "options": ["체험 학습의 즐거움을 보여 주는 삽화", "'목소리의 법정'과 대비되는 '증거의 법정'의 모범을 보여 주어 학급 재판의 기준을 세워 준다", "판사라는 직업을 홍보하는 장면", "노아의 무죄를 곧바로 증명해 주는 장면"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'증거가 없는 밤'(7장)이 서사에서 하는 역할은 무엇입니까?", "options": ["사건이 미궁에 빠졌음을 알리는 결말", "노아의 거짓말이 들통나는 위기", "진실과 증거의 간극이라는 가장 깊은 절망을 지나게 하여 발견의 극적 효과를 높인다", "다인이가 변호를 포기하는 계기"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'3심 제도'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["판사 세 명이 함께 재판하는 제도", "세 가지 죄만 재판하는 제도", "재판을 세 시간 안에 끝내는 제도", "한 사건을 최대 세 번까지 재판받을 수 있게 한 제도"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'사법권'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["법원이 재판을 통해 옳고 그름을 가리는 권한", "법을 만드는 권한", "법을 집행하는 권한", "세금을 걷는 권한"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'판사도 사람이라 틀릴 수 있다'는 전제에서 3심 제도가 만들어진 이유를 추론하면 무엇입니까?", "options": ["판사의 수를 늘리기 위해서", "재판 비용을 더 걷기 위해서", "제도 스스로 오류 가능성을 인정하고 억울함을 바로잡을 길을 미리 마련해 두기 위해서", "재판을 오래 끌기 위해서"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "사건이 끝난 뒤에도 학급 법정이 치워지지 않은 것이 상징하는 바를 추론하면 무엇입니까?", "options": ["교실 뒤 공간이 남아돌았다는 것", "다툼을 절차로 해결하는 문화가 반에 뿌리내렸다는 것", "또 유리창이 깨질 것에 대비한 것", "아이들이 판사 놀이에 빠졌다는 것"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'아니라고 말할수록 더 의심받는' 노아의 처지가 보여 주는 문제의 본질은 무엇인가?", "options": ["노아의 평소 행실이 나빴다는 것", "목격의 신뢰도가 낮다는 것", "교사의 지도력 부재", "입증 수단이 없는 개인은 소문의 법정에서 무력하다는 것"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "다인이가 변호를 자원하며 \"미덥지 못한 소문이라면 딱 질색\"이라고 말한 것에서 드러나는 가치관은 무엇인가?", "options": ["확인되지 않은 말로 사람을 판단하지 않겠다는 원칙", "친한 친구는 무조건 편들어야 한다는 의리", "소문을 퍼뜨린 아이들에 대한 복수심", "재판에서 이겨 유명해지려는 공명심"], "correct": 0},

      {"gate": 8, "category": "내용어휘", "question": "'항소(抗訴)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["판결 직후 법정에서 항의하는 행위", "증인을 다시 부르는 절차", "하급심 판결에 불복하여 상급심의 재판단을 구하는 절차", "재판을 무효로 만드는 선언"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'흐린 기억을 또렷하다고 믿은' 목격자들의 사례가 사법 제도에 시사하는 바를 추론하면 무엇인가?", "options": ["목격 증언은 재판에서 배제해야 한다", "기억력이 좋은 사람만 증인이 될 수 있다", "증언은 진실하더라도 오류일 수 있으므로 객관적 증거로 교차 검증되어야 한다", "증언이 많을수록 판결은 정확해진다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "「판결이 내려지기 전까지 누구도 죄인이 아니에요.」라는 경구가 일상의 태도로 확장될 때의 의미를 추론하면 무엇인가?", "options": ["확인되지 않은 일로 타인을 단정하고 낙인찍는 일을 삼가야 한다", "잘못을 보아도 모른 척해야 한다", "모든 갈등은 법원으로 가져가야 한다", "의심스러운 사람과는 거리를 두어야 한다"], "correct": 0}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '깨진 유리창의 진실' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'law08',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'law08',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
