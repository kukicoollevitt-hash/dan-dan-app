<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚔 벌의 끝은 어디일까 — 삼촌의 빵 굽는 교실 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작법09/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "이야기의 처음에 주안이가 가지고 있던 생각은 무엇이었나요?", "options": ["벌보다 용서가 언제나 먼저라는 생각", "도둑은 불쌍한 사람이라는 생각", "벌은 아무 소용이 없다는 생각", "나쁜 사람은 다 잡아서 오래 가둘수록 세상이 안전해진다는 생각"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "빵집 삼촌이 하는 일은 무엇인가요?", "options": ["교도소에서 빵 만드는 기술을 가르치는 선생님", "경찰서에서 도둑을 잡는 형사", "교도소를 지키는 교도관", "빵집을 여러 개 가진 사장님"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "세오의 사건에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["친구의 지우개를 훔쳐 선생님께 혼났다", "문구점에서 게임 카드를 훔쳤고, 사과와 변상을 하여 아저씨의 용서를 받았다", "누명을 쓴 것으로 나중에 밝혀졌다", "도둑질이 여러 번 반복되어 전학을 갔다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "선생님이 알려 준 벌의 세 가지 목적은 무엇인가요?", "options": ["체포, 재판, 감옥", "반성, 사과, 변상", "응보, 예방, 교화", "경고, 벌금, 징역"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "\"언제까지 받아야 되는 건지 모르겠어.\"라는 세오의 말이 보여 주는 문제는 무엇인가요?", "options": ["어른들의 벌은 끝났는데, 낙인이라는 교실의 벌은 끝나지 않는다는 것", "세오가 반성을 하지 않고 있다는 것", "벌이 너무 가벼웠다는 것", "선생님이 벌을 정하지 않았다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "삼촌이 주안이를 골목 끝 빵집에 데려간 까닭은 무엇인가요?", "options": ["소보로빵을 사 주려고", "빵집 일자리를 소개해 주려고", "빵 만드는 법을 가르쳐 주려고", "벌이 끝난 뒤 돌아갈 자리가 있으면 다시 죄를 짓지 않는다는 것을 직접 보여 주려고"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'교화'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["학교를 새로 짓는 것", "잘못한 사람이 바르게 돌아올 수 있도록 가르치고 이끄는 것", "죄지은 사람을 더 무겁게 벌하는 것", "죄를 지은 사람을 다른 나라로 보내는 것"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'재범'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["두 사람이 함께 저지른 죄", "벌을 받은 사람이 다시 죄를 짓는 것", "아주 무거운 죄", "처음 저지른 죄"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "교화가 '죄지은 사람을 위한 것이기 전에 우리 모두를 지키는 일'인 까닭을 짐작하면 무엇인가요?", "options": ["돌아갈 길이 있는 사람은 다시 죄를 짓지 않게 되어 모두가 안전해지기 때문에", "교화를 하면 세금이 줄어들기 때문에", "교도소가 좁아지기 때문에", "빵 가격이 내려가기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"규칙은 나를 묶는 사슬이 아니라, 모두를 지키는 울타리입니다.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["울타리는 튼튼하게 지어야 한다는 뜻", "규칙은 어길수록 재미있다는 뜻", "규칙은 우리를 괴롭히는 것이 아니라 모두의 안전을 위해 있는 것이라는 뜻", "규칙은 어른들만 지키면 된다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "주안이의 생각이 변화해 간 과정으로 가장 적절한 것은 무엇입니까?", "options": ["'다 가두면 된다'는 단순한 응보관 → 친구의 낙인을 목격 → 교화의 의미를 깨닫고 행동으로 옮김", "벌을 없애자는 주장 → 벌을 강화하자는 주장", "처음부터 끝까지 같은 생각을 유지함", "벌에 무관심 → 벌을 두려워함"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "학급 회의에서 \"그건 벌이 아니라 그냥 미움이야.\"라고 말한 주안이의 용기가 값진 이유는 무엇입니까?", "options": ["선생님이 시킨 발표를 잘 해냈기 때문", "자기도 한때 가졌던 생각을 스스로 뒤집으며 교실 전체의 분위기에 맞섰기 때문", "목소리가 가장 컸기 때문", "세오와 가장 친한 친구였기 때문"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "범죄와 형벌에 대한 수업 내용으로 옳은 것은 무엇입니까?", "options": ["형벌은 판사의 기분에 따라 정해진다", "벌의 목적은 응보 하나뿐이다", "폭행은 범죄지만 사기는 범죄가 아니다", "사회의 중요한 규칙을 어기는 것이 범죄이고, 법에 따라 받는 벌이 형벌이다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "삼촌의 첫 제자에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["아직 교도소에서 벌을 받고 있다", "젊은 날 큰 잘못으로 벌을 받았지만, 십 년째 빵집을 하며 다시는 죄를 짓지 않았다", "빵집을 하다 다시 죄를 지었다", "삼촌의 빵집에서 일하는 직원이다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'뉴스 속 도둑'과 '옆자리의 세오'를 나란히 놓은 구성의 효과는 무엇입니까?", "options": ["뉴스의 중요성을 강조하는 효과", "도둑질의 방법이 다양함을 보여 주는 효과", "멀리서는 쉽던 미움이 가까이서는 간단치 않음을 깨닫게 하는 효과", "세오의 죄가 뉴스에 나올 만큼 크다는 효과"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'한 번 도둑은 영원한 도둑'이라 말했던 아이가 먼저 사과하는 장면의 의미는 무엇입니까?", "options": ["낙인을 찍던 쪽의 변화가 시작되어야 돌아올 자리가 열린다는 것", "그 아이가 원래 착했다는 것", "선생님의 벌이 무서웠다는 것", "사과는 시키면 하게 된다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'낙인'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["죄의 무게를 재는 저울", "한번 찍히면 잘 지워지지 않는 부정적인 평가나 딱지", "법원이 내리는 판결문", "반성의 표시로 쓰는 글"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'응보'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["잘못을 저지르기 전에 미리 막는 것", "잘못한 사람을 가르쳐 돌아오게 하는 것", "피해자에게 나라가 보상하는 것", "잘못한 만큼 갚게 하는 것"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'돌아갈 자리가 있는 사람은 재범이 훨씬 적다'는 사실에서 추론할 수 있는 것은 무엇입니까?", "options": ["기술·일자리·맞아 주는 사람 같은 '돌아올 길'을 만드는 것이 사회 안전에 실질적으로 기여한다", "벌이 약할수록 재범이 준다", "재범을 막으려면 형량을 늘리는 수밖에 없다", "교도소를 없애면 범죄가 사라진다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "이 이야기가 '벌'에 대해 궁극적으로 전하는 메시지는 무엇입니까?", "options": ["벌은 무거울수록 정의롭다", "벌은 잘못을 갚게 하고 다음 잘못을 막을 뿐 아니라, 사람을 돌아오게 해야 완성된다", "벌보다 용서가 언제나 우선한다", "벌은 어른들의 일일 뿐이다"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "\"다 가둬 버리면 되잖아\"라는 주안이의 첫 생각이 지닌 한계로 가장 적절한 것은 무엇인가?", "options": ["법률 지식의 부족", "벌이 끝난 '그 다음', 곧 사람이 사회로 돌아오는 문제를 사고에서 배제한 것", "형벌의 종류를 몰랐던 것", "경찰의 역할을 오해한 것"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "삼촌이 '화내지 않고 갓 구운 빵을 내려놓으며' 답한 장면이 보여 주는 교육 방식은 무엇인가?", "options": ["뾰족한 물음을 꾸짖는 대신, 되물음과 실물로 스스로 생각을 넓히게 하는 방식", "전문 지식을 체계적으로 강의하는 방식", "아이의 생각을 무조건 수용하는 방식", "침묵으로 반성을 유도하는 방식"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "세오가 돌아온 뒤 교실의 상황으로 옳은 것은 무엇인가?", "options": ["아이들이 반갑게 맞아 주었다", "선생님이 세오를 다시 벌주었다", "아무도 말을 걸지 않았고, 물건이 안 보이면 눈길이 세오에게 먼저 향했다", "세오가 곧바로 전학을 갔다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "벌의 세 가지 목적에 대한 설명으로 옳은 것은 무엇인가?", "options": ["응보는 오늘날 폐지된 개념이다", "예방은 피해자를 보호하는 것만을 뜻한다", "교화는 죄인에게 상을 주는 것이다", "응보는 잘못한 만큼 갚게 하는 것, 예방은 같은 잘못을 막는 것, 교화는 바르게 돌아오게 이끄는 것이다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'칠판의 교화'와 '교실의 낙인'이 공존하는 6장의 장면이 드러내는 주제 의식은 무엇인가?", "options": ["아는 것과 사는 것 사이의 간극, 곧 배운 가치를 삶에서 실천하는 일의 어려움", "교사의 수업 방식 문제", "어린이에게 법 교육은 이르다는 것", "지식은 시험을 위한 것일 뿐이라는 냉소"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'빵 굽는 냄새'가 이야기 전체에서 갖는 상징적 의미는 무엇인가?", "options": ["삼촌의 요리 솜씨", "배고픔을 달래는 위로", "새 출발과 회복의 온기, 돌아올 자리의 따뜻함", "명절의 풍요로움"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'교화(敎化)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["죄를 저지른 사람을 사회에서 영구히 격리하는 것", "형량을 감경해 주는 제도", "피해자와 가해자를 화해시키는 절차", "가르침과 기회를 통해 사람을 변화시켜 사회로 복귀하게 하는 것"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'재범(再犯)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["두 가지 죄를 동시에 저지르는 것", "형벌을 받은 사람이 다시 범죄를 저지르는 것", "다른 사람의 범죄를 도운 것", "미수에 그친 범죄"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'세오의 벌은 끝났는데 교실의 벌은 끝나지 않았다'는 문제 상황이 형벌 제도 바깥의 우리에게 던지는 물음을 추론하면 무엇인가?", "options": ["학교에도 법원을 만들어야 하는가", "공동체가 낙인을 거두고 돌아올 자리를 내어 주는 일 또한 정의의 일부가 아닌가", "벌은 공개적으로 집행되어야 하는가", "제도의 벌을 더 무겁게 해야 하는가"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「돌아올 다리를 지키는 것은 우리 모두의 일이지요.」라는 경구의 함의로 가장 적절한 것은 무엇인가?", "options": ["다리 같은 시설물의 관리가 중요하다", "잘못한 사람을 감시하는 것이 시민의 의무다", "용서는 피해자만이 할 수 있다", "한 사람의 회복은 제도만이 아니라 공동체 구성원 모두의 태도에 달려 있다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '벌의 끝은 어디일까' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'law09',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'law09',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
