<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 상자 속의 약속 — 봄이의 첫 소비자 권리 찾기 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작법11/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "포기하고 싶어 하던 봄이가 달력에 엑스 표를 그으며 끝까지 버틴 까닭은 무엇인가요?", "options": ["자기가 걷는 절차가 다음 피해자를 막는 길이기도 하다는 고모의 말이 떠올랐기 때문에", "친구들이 끝까지 하라고 응원했기 때문에", "별별샵 사장님이 사과 전화를 했기 때문에", "새 드론을 공짜로 받기로 했기 때문에"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "알뜰 장터에서 파는 사람이 된 봄이가 한 행동으로 알맞은 것은 무엇인가요?", "options": ["가장 비싼 값을 부르고 흥정했다", "고장 난 물건을 새것처럼 꾸며 팔았다", "물건의 흠을 정직하게 적어 붙이고, 문제가 생기자 두말없이 돈을 돌려주었다", "팔고 나면 바꿔 주지 않는다는 안내문을 붙였다"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "고모가 알려 준 '계약'에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["계약서에 도장을 찍어야만 계약이다", "어른들만 계약을 할 수 있다", "계약은 회사끼리만 하는 것이다", "과자 한 봉지를 사는 것도 계약이며, 계약에는 서로의 권리와 의무가 담겨 있다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "인터넷 쇼핑의 '청약 철회'에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["한 번 산 물건은 절대 무를 수 없다", "물건을 받은 날부터 7일 안에는 계약을 물리고 반품할 수 있다", "포장을 뜯으면 무조건 환불받을 수 없다", "한 달 안에는 언제든 무를 수 있다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "고모가 권리를 찾기 전에 '증거부터 모으자'고 한 까닭은 무엇인가요?", "options": ["억울하다고 백 번 말하는 것보다 사진 한 장이 더 크게 말해 주기 때문에", "증거를 팔면 돈이 되기 때문에", "사진 찍기가 재미있기 때문에", "증거가 없으면 벌금을 내야 하기 때문에"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "봄이의 신고가 다른 피해자들의 신고와 합쳐지며 일어난 일은 무엇인가요?", "options": ["별별샵이 봄이를 고소했다", "봄이가 상금을 받았다", "문제의 드론은 판매가 중단되고 광고도 내려가, 더 큰 피해를 막게 되었다", "드론 가격이 더 올랐다"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'환불'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["물건을 새것으로 바꿔 주는 것", "값을 깎아 주는 것", "물건을 공짜로 하나 더 주는 것", "산 물건의 값으로 낸 돈을 돌려받는 것"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'불량품'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["값이 아주 비싼 물건", "품질에 문제가 있는 물건", "외국에서 만든 물건", "오래되어 낡은 물건"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "\"포장을 개봉했으므로 환불이 불가합니다\"라는 별별샵의 말이 부당한 까닭을 짐작하면 무엇인가요?", "options": ["포장을 뜯지 않고는 물건에 문제가 있는지 확인할 수 없고, 불량품을 보낸 것은 판매자가 약속을 어긴 것이기 때문에", "포장은 원래 뜯으라고 있는 것이기 때문에", "봄이가 어린이이기 때문에", "드론은 원래 잘 고장 나는 물건이기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"권리는 아는 사람의 것이고, 쓰는 사람의 것이에요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["권리는 어른이 되어야 생긴다는 뜻", "권리는 나라에서 나눠 주는 선물이라는 뜻", "권리가 있어도 알지 못하거나 행동하지 않으면 지킬 수 없다는 뜻", "아는 것이 많은 사람이 훌륭하다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "봄이가 청약 철회 요구서를 쓸 때 '감정을 쏟아 내는 대신 사실만 또박또박' 적은 이유로 가장 적절한 것은 무엇입니까?", "options": ["글씨를 잘 쓰기 위해서", "글자 수 제한이 있었기 때문에", "권리를 주장할 때는 하소연보다 사실과 증거가 힘을 갖기 때문에", "판매자를 화나게 하지 않으려고"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "봄이가 '파는 사람의 자리'에 앉아 본 경험에서 얻은 깨달음은 무엇입니까?", "options": ["장사는 이문을 많이 남겨야 한다는 것", "물건은 무조건 싸게 팔아야 한다는 것", "소비자는 언제나 의심이 많다는 것", "파는 사람의 의무가 지켜질 때 사는 사람의 권리도 지켜진다는 것"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "소비자의 권리로 이 책에 소개된 것으로 옳은 묶음은 무엇입니까?", "options": ["알 권리, 안전하게 사용할 권리, 피해를 보상받을 권리", "깎아 달라고 할 권리, 반말할 권리", "줄을 서지 않을 권리, 먼저 살 권리", "광고를 만들 권리, 가게를 열 권리"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "1372 소비자 상담 센터에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["판매자만 이용할 수 있는 번호다", "소비자라면 누구나 전화해 피해 상담을 받을 수 있는 번호다", "어른만 이용할 수 있는 번호다", "전화 요금이 아주 비싼 번호다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'독수리를 약속했지만 고장 난 참새가 왔다'는 표현이 가리키는 문제는 무엇입니까?", "options": ["드론의 이름을 잘못 지은 것", "광고와 실제 물건이 다른, 판매자의 약속 위반", "봄이의 조종 실력 부족", "배송 중 새가 상자에 들어간 사고"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "이야기가 '드론 구매 실패'로 시작해 '현명한 새 구매 성공'으로 끝나는 구성의 효과는 무엇입니까?", "options": ["배운 것을 실천하는 달라진 소비자의 모습으로 성장을 완성해 보여 준다", "드론이라는 상품을 홍보한다", "인터넷 쇼핑의 위험성만 강조한다", "용돈 모으기의 어려움을 보여 준다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'청약 철회'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["판매자가 계약을 취소하는 것", "물건값을 나중에 내겠다고 미루는 것", "일정 기간 안에 소비자가 계약을 물리고 반품할 수 있는 권리", "가게가 문을 닫는 것"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'피해 구제 신청'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["피해를 준 사람을 경찰에 신고하는 것", "보험금을 받는 절차", "세금을 돌려받는 절차", "소비자가 입은 피해를 해결해 달라고 관련 기관에 도움을 요청하는 것"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'별별샵이 너한테 이랬다면 다른 사람들에게도 그랬을 것'이라는 고모의 말에서 추론할 수 있는 것은 무엇입니까?", "options": ["한 사람의 권리 찾기는 개인의 보상을 넘어 다른 소비자를 지키는 공적인 의미를 갖는다", "별별샵은 봄이에게만 잘못했다", "피해자가 많으면 보상액이 줄어든다", "인터넷 가게는 모두 믿을 수 없다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "나라가 소비자기본법을 만들고 한국소비자원을 세워 둔 이유를 추론하면 무엇입니까?", "options": ["세금을 더 걷기 위해서", "소비자 혼자서는 힘이 큰 판매자와 맞서기 어렵기 때문에 국가가 힘의 균형을 잡아 주려는 것", "판매자를 모두 처벌하기 위해서", "물건값을 나라가 정하기 위해서"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "\"어차피 어린이 말은 안 들어주는 세상인가\"라는 좌절을 넘어서는 봄이의 경험이 보여 주는 것은 무엇인가?", "options": ["어린이는 어른의 도움 없이 아무것도 할 수 없다는 것", "포기가 때로는 현명한 선택이라는 것", "나이와 무관하게 절차와 증거를 갖춘 권리 주장은 응답받는다는 것", "불만은 크게 말할수록 잘 해결된다는 것"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "고모가 수화기를 봄이에게 직접 내밀며 \"봄이의 권리니까 봄이가 해 보라\"고 한 교육적 의도는 무엇인가?", "options": ["권리의 주체가 스스로 행사해 보는 경험이 곧 배움이라는 것", "상담원과 통화 연습을 시키려는 것", "자신이 통화하기 귀찮았기 때문", "전화 예절을 가르치려는 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "봄이가 모은 증거로 옳은 묶음은 무엇인가?", "options": ["친구들의 응원 편지와 일기장", "드론 설명서와 보증서만", "별별샵 직원의 사진", "광고 영상 저장본, 불량 부위 사진과 영상, 결제 내역, 판매자와의 대화 기록"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "사건의 최종 결과로 옳은 것은 무엇인가?", "options": ["봄이가 소송을 걸어 재판에서 이겼다", "별별샵이 끝내 환불을 거부했다", "소비자원의 권고에 따라 전액 환불과 반품비 부담이 이루어지고, 해당 드론은 판매 중단되었다", "봄이가 새 드론으로 교환만 받았다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'벽'의 은유가 이야기에서 변화해 가는 과정으로 가장 적절한 것은 무엇인가?", "options": ["꿈쩍 않던 판매자의 벽이, 증거·법·기관·연대가 모이자 끝내 무너진다", "벽이 점점 높아져 극복할 수 없게 된다", "벽은 처음부터 존재하지 않았음이 밝혀진다", "봄이가 벽을 돌아서 다른 길을 찾는다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "별점 다섯 개짜리 후기와 버젓이 떠 있는 광고를 바라보는 7장의 장면이 하는 역할은 무엇인가?", "options": ["광고 제작 기술을 소개한다", "기다림의 시간 속에서 주인공의 분노와 책임감을 함께 키워 버팀의 이유를 강화한다", "별별샵의 결백을 암시한다", "봄이의 질투심을 드러낸다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'소비자(消費者)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["물건을 만들어 파는 사람", "가게에서 일하는 사람", "돈을 빌려주는 사람", "돈을 내고 물건이나 서비스를 사서 쓰는 사람"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "권리의 '행사(行使)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["권리를 문서로 보관하는 것", "학교에서 여는 큰 모임", "가지고 있는 권리를 실제로 사용하는 것", "권리를 남에게 넘겨주는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'계약은 두 손의 약속'이라는 깨달음이 함축하는 바를 추론하면 무엇인가?", "options": ["계약서는 두 장씩 만들어야 한다", "계약은 판매자와 소비자 양쪽의 권리·의무가 맞물릴 때 온전해진다", "계약은 손해 보는 쪽이 정해져 있다", "악수를 해야 계약이 성립한다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「권리는 아는 사람의 것이고, 쓰는 사람의 것이에요.」라는 경구가 시민 교육에 시사하는 바를 추론하면 무엇인가?", "options": ["권리는 시험에 나올 때만 외우면 된다", "권리는 제도에 적혀 있는 것으로 완성되는 것이 아니라, 알고 행사하는 실천 속에서 살아난다", "권리를 모르는 사람의 권리는 소멸한다", "권리는 자주 쓸수록 닳아 없어진다"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '상자 속의 약속' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'law11',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'law11',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
