<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚠️ 내리막길의 약속 — 깨진 도자기와 책임의 무게 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작법12/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "사고가 난 날 밤, 도윤이에게 사고보다 더 무서웠던 것은 무엇이었나요?", "options": ["부서진 자전거 번개", "할아버지에게 혼나는 것", "도망쳐 버린 자기 자신", "물어 줘야 할 그릇값"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "도윤이의 이야기를 들은 아빠의 태도로 알맞은 것은 무엇인가요?", "options": ["말해 줘서 고맙다고 한 뒤, 사고와 도망 두 가지를 함께 책임지러 가자고 했다", "크게 화를 내며 자전거를 버리겠다고 했다", "모른 척 넘어가자고 했다", "할아버지에게 대신 사과하고 도윤이는 집에 있게 했다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "'불법 행위'와 책임에 대한 아빠의 설명으로 알맞은 것은 무엇인가요?", "options": ["어린이는 어떤 책임도 지지 않는다", "일부러 한 일이 아니면 아무 책임이 없다", "경찰에 잡히지만 않으면 책임이 없다", "고의가 아니어도 조심하지 않은 과실만으로 성립하며, 피해를 준 사람은 손해 배상을 해야 한다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "도윤이가 스스로 결심해서 한 일은 무엇인가요?", "options": ["새 그릇을 사서 선물했다", "할아버지 손목이 나을 때까지 토요일마다 공방 청소를 했다", "자전거를 팔아 그릇값을 냈다", "매일 반성문을 써서 보냈다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "푸른 학 작품이 담긴 상자 이야기가 보여 주는 것은 무엇인가요?", "options": ["치료비와 그릇값 말고도, 반년의 정성처럼 돈으로 값을 매길 수 없는 손해가 있다는 것", "할아버지가 정리를 잘 못한다는 것", "깨진 그릇은 빨리 버려야 한다는 것", "전시회는 미루면 된다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "깨진 조각들을 금빛 흙으로 이어 만든 작품 '다시'가 뜻하는 것은 무엇인가요?", "options": ["금이 비싼 재료라는 것", "깨진 그릇도 팔 수 있다는 것", "책임을 다하는 시간이 깨진 것을 새로운 것으로 되살릴 수 있다는 것", "할아버지의 솜씨가 여전하다는 것"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'과실'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["나무에 열리는 열매", "일부러 남을 해치는 것", "잘한 일에 대한 보람", "일부러는 아니지만 조심하지 않아 저지른 잘못"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'위자료'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["병원 치료에 드는 돈", "놀라고 속상했던 마음의 손해에 대한 배상", "그릇을 새로 사는 돈", "자전거를 고치는 돈"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "\"도망치면 잘못이 두 개가 됩니다.\"라는 말의 뜻을 짐작하면 무엇인가요?", "options": ["사고라는 실수에 더해, 책임을 피하는 잘못된 선택까지 저지르게 된다는 뜻", "도망치다가 또 사고를 낼 수 있다는 뜻", "두 번 도망치면 안 된다는 뜻", "도망치면 벌금이 두 배가 된다는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"실수는 누구나 해요. 그러나 책임지는 사람만이 실수보다 커지지요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["실수를 많이 할수록 키가 큰다는 뜻", "책임을 지려면 몸집이 커야 한다는 뜻", "실수를 안 하는 사람이 가장 훌륭하다는 뜻", "실수를 책임지는 과정에서 사람은 이전보다 더 나은 사람으로 자란다는 뜻"], "correct": 3}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "\"사고는 실수일 수 있지만, 도망은 선택이야.\"라는 아빠의 말이 구별하고 있는 것은 무엇입니까?", "options": ["실수와 성공", "의도치 않게 일어난 일과, 그 뒤에 스스로 정한 행동의 책임", "어른의 잘못과 아이의 잘못", "큰 잘못과 작은 잘못"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "할아버지가 도윤이를 대하는 방식으로 가장 적절한 것은 무엇입니까?", "options": ["끝까지 용서하지 않고 배상만 받았다", "처음부터 아무 일 없던 것처럼 대했다", "도윤이의 부모에게만 말하고 도윤이는 무시했다", "제 발로 온 용기를 알아주고, 묵묵히 지켜보다가 물레 앞으로 불러 함께 만들자고 손을 내밀었다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "손해 배상에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["치료비 같은 재산적 손해뿐 아니라 마음의 손해에 대한 위자료도 있다", "어린이가 낸 사고는 배상 대상이 아니다", "재산적 손해만 배상하면 된다", "배상은 판매자만 하는 것이다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "불법 행위가 성립하는 조건에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["반드시 일부러 한 행동이어야 한다", "경찰에 신고되어야 성립한다", "고의가 아니어도 과실이 있고, 행동과 손해 사이에 인과 관계가 있으면 성립한다", "피해액이 커야만 성립한다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'번개가 창고에서 나오지 못한' 기간이 서사에서 의미하는 것은 무엇입니까?", "options": ["자전거가 고장 났다는 사실", "죄책감의 무게에 눌린 시간이자, 진정한 책임의 의미를 찾아가는 과정", "도윤이가 자전거에 흥미를 잃었다는 것", "부모의 처벌이 계속되고 있다는 것"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "도윤이가 다시 자전거를 타되 '브레이크 위에 손가락을 얹고' 달리는 결말의 의미는 무엇입니까?", "options": ["자전거를 그만 타는 것이 아니라, 조심하며 타는 것이 진짜 책임임을 보여 준다", "할아버지가 자전거를 금지하지 않았다는 것", "브레이크를 새로 갈았다는 것", "내리막이 안전해졌다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'고의'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["오래된 옛날 물건", "일부러 하는 것", "우연히 일어나는 것", "깊이 생각하는 것"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'인과 관계'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["사람과 사람 사이의 친분", "원인이 되는 행동과 그 결과인 손해가 서로 이어져 있는 것", "법원과 경찰의 관계", "시간의 앞뒤 순서"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "피해자가 되었을 때 '증거를 남기라'는 조언(사진·진단서·목격자 연락처)의 이유를 추론하면 무엇입니까?", "options": ["배상을 요구할 때 말보다 증거가 사실을 증명해 주기 때문", "가해자를 부끄럽게 만들기 위해서", "기념으로 남기기 위해서", "보험 회사가 요구하기 때문"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'토요일의 공방 청소'가 법이 정한 배상과 구별되는 점을 추론하면 무엇입니까?", "options": ["법원이 내린 명령이라는 점", "돈이 들지 않아 경제적이라는 점", "용돈보다 값어치가 크다는 점", "의무를 넘어 마음의 손해까지 갚으려는 자발적 책임이라는 점"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "도윤이가 '내리막의 왕'에서 '흙을 배우는 어린 제자'로 변모하는 과정이 보여 주는 성장의 본질은 무엇인가?", "options": ["속도의 쾌감에 눈멀었던 아이가 책임의 시간을 통과하며 타인의 시간과 마음을 헤아리는 사람이 된 것", "취미가 자전거에서 도예로 바뀐 것", "어른의 감시가 효과를 발휘한 것", "벌이 무서워 얌전해진 것"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "할아버지가 자신의 '가마 사건'을 들려준 의도로 가장 적절한 것은 무엇인가?", "options": ["도윤이의 잘못이 얼마나 큰지 비교해 보이려고", "자신의 스승 자랑을 하려고", "같은 무게의 실수를 겪은 사람으로서, 책임의 시간이 사람을 다시 빚는다는 것을 전하려고", "도예의 어려움을 가르치려고"], "correct": 2},

      {"gate": 4, "category": "내용일치", "question": "사고 이후 이루어진 배상의 내용으로 옳은 것은 무엇인가?", "options": ["할아버지가 배상을 전부 사양했다", "병원비와 그릇값을 배상하기로 했고, 도윤이도 모은 용돈을 전부 보탰다", "보험 회사가 모든 비용을 대신 냈다", "그릇값만 물어 주고 병원비는 내지 않았다"], "correct": 1},

      {"gate": 7, "category": "내용어휘", "question": "'손해 배상(損害賠償)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["국가가 세금으로 피해를 메워 주는 제도", "보험 회사가 지급하는 보험금", "형벌의 한 종류인 벌금", "타인에게 입힌 손해를 물어 주어 원래 상태에 가깝게 되돌리는 책임"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'민법(民法)'의 성격으로 가장 적절한 것은 무엇인가?", "options": ["국가가 범죄자를 처벌하는 법", "사람과 사람 사이의 권리와 의무 관계를 다루는 법", "군인에게만 적용되는 법", "민속놀이를 보호하는 법"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'자전거를 타지 않는 것이 책임이 아니라 조심해서 타는 것이 책임'이라는 결론에서 추론할 수 있는 책임관은 무엇인가?", "options": ["책임은 어른이 대신 져 주는 것이다", "위험한 것은 모두 피하는 것이 최선이다", "책임은 회피가 아니라, 위험을 다스리며 살아가는 태도의 문제다", "한 번 사고를 낸 사람은 다시 하면 안 된다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "「책임지는 사람만이 실수보다 커지지요.」라는 경구의 함의로 가장 적절한 것은 무엇인가?", "options": ["실수는 클수록 배움도 크다", "책임은 실수를 없던 일로 만들어 준다", "실수하지 않는 삶이 가장 크다", "실수 자체가 아니라 그것을 감당하는 방식이 사람의 크기를 결정한다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '내리막길의 약속' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'law12',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'law12',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
