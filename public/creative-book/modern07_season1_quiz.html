<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🥔 감자 몇 알의 무게 — 복녀 이야기 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/현대문학07/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "이야기 처음에 나오는 복녀는 어떤 처녀였나요?", "options": ["순박하고 부지런해서 동네 어른들이 참하다고 칭찬하는 처녀였다", "게으르고 심술궂은 처녀였다", "부잣집에서 곱게 자란 처녀였다", "공부를 잘해서 유명한 처녀였다"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "복녀의 남편은 어떤 사람이었나요?", "options": ["부지런히 농사를 짓는 사람", "아내를 아끼는 다정한 사람", "해가 높이 떠도 이불 속에 있고, 복녀가 번 돈을 술과 노름에 써 버리는 게으른 사람", "마을에서 존경받는 사람"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "복녀의 혼인에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["스무 살에 부잣집으로 시집갔다", "혼인하지 않고 혼자 살았다", "서울의 큰 기와집으로 시집갔다", "열다섯 살에 평양 칠성문 밖 빈민굴로 시집갔다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "왕 서방의 감자밭에서 있었던 일로 알맞은 것은 무엇인가요?", "options": ["복녀가 밭 주인이 되었다", "복녀가 김을 매고 감자를 캐며 품삯을 받았고, 어떤 날은 삶은 감자 몇 알을 덤으로 받았다", "남편이 밭일을 도맡아 했다", "감자 농사가 망해서 일이 없어졌다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "복녀의 살림을 '밑 빠진 독'에 빗댄 까닭은 무엇인가요?", "options": ["복녀가 하루 종일 일해 한 뼘을 채우면, 남편이 하룻밤 사이에 두 뼘을 퍼내 갔기 때문에", "독이 실제로 깨져 있었기 때문에", "집에 독이 하나뿐이었기 때문에", "독에 감자를 담아 두었기 때문에"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "이 이야기에서 '감자'가 나타내는 것은 무엇인가요?", "options": ["부자가 되는 행운", "평양의 특산물", "굶주림을 달래 주기도 하고 마지막 밤 땅에 흩어지기도 한, 복녀의 힘든 삶", "남편의 게으름"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'품삯'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["품에 안은 물건", "일을 해 준 대가로 받는 돈", "옷의 품 크기", "곡식의 씨앗"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'빈민굴'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["동물이 사는 굴", "산속의 동굴 마을", "비어 있는 집", "가난한 사람들이 모여 사는 동네"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'복녀를 바꾼 것은 복녀 자신이 아니라 가난이었다'는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["복녀가 변한 것은 마음씨가 나빠서가 아니라, 굶주림과 가난한 환경이 복녀를 그렇게 밀어붙였기 때문이라는 뜻", "복녀가 원래부터 나쁜 사람이었다는 뜻", "가난이 복녀를 부자로 만들었다는 뜻", "복녀가 스스로 변하고 싶어 했다는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "이 소설이 읽는 사람에게 남기는 질문은 무엇인가요?", "options": ["감자를 어떻게 맛있게 삶을까 하는 질문", "노름에서 이기는 방법이 무엇일까 하는 질문", "사람이 변하는 것은 그 사람만의 잘못일까, 둘러싼 세상의 책임도 있을까 하는 질문", "평양까지 가는 길이 얼마나 멀까 하는 질문"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "복녀의 변화 과정을 바르게 정리한 것은 무엇입니까?", "options": ["당당하던 처녀가 점점 소심해졌다", "부끄러움 많던 순박한 처녀가, 굶주림과 싸우는 사이 목소리를 높여 제 몫을 따지는 억척스러운 사람이 되었다", "가난하던 처녀가 부자가 되어 마음이 변했다", "게으르던 처녀가 부지런해졌다"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "\"정 굶게 되면 네가 또 무슨 수를 내지 않겠나.\"라는 말에서 드러나는 남편의 됨됨이는 무엇입니까?", "options": ["아내를 깊이 믿는 든든함", "위기에서도 침착한 여유", "가족을 위해 희생하는 책임감", "제 살길을 아내에게 떠넘기는 무책임함"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "굶주림의 겨울에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["일감이 끊기고 쌀독이 바닥나, 하루 한 끼 멀건 죽으로 때우거나 그마저 거르는 날이 많았다", "이웃들이 쌀을 나누어 주어 배불리 지냈다", "남편이 나무를 해 와 방이 따뜻했다", "겨울에도 감자밭 일이 계속되었다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "감자밭의 밤 사건 전개로 옳은 것은 무엇입니까?", "options": ["왕 서방이 복녀에게 감자를 선물했다", "도둑이 들어 왕 서방이 다쳤다", "복녀가 몰래 감자를 캐다 왕 서방에게 들켜 다투었고, 소란 끝에 남편이 애꿎은 복녀에게 화풀이를 퍼부었다", "복녀가 감자밭을 사들였다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'성실함이 배신당하는 나날'이라는 표현의 뜻은 무엇입니까?", "options": ["복녀가 성실하지 않았다는 뜻", "아무리 부지런히 일해도 남편의 술과 노름 탓에 가난에서 벗어날 수 없었다는 뜻", "친구가 복녀를 배신했다는 뜻", "성실하면 반드시 성공한다는 뜻"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "마을 사람들의 손가락질 장면이 보여 주는 것은 무엇입니까?", "options": ["똑같이 가난해 서로 도울 형편이 못 되니 흉보는 일만 남은, 가난만큼 메말라 간 빈민굴의 인심", "마을 사람들의 따뜻한 관심", "복녀를 도우려는 이웃들의 계획", "빈민굴의 넉넉한 살림살이"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'억척스럽다'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["몸이 약하고 잘 아프다", "말수가 적고 조용하다", "겁이 많고 소심하다", "어떤 어려움에도 굽히지 않고 모질게 버티어 나가다"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'삯바느질'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["자기 옷을 만드는 바느질", "바느질을 배우는 수업", "돈을 받고 남의 옷을 지어 주는 바느질", "이불을 꿰매는 바느질"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "복녀가 밤에 몰래 감자를 캔 까닭을 추론하면 무엇입니까?", "options": ["품삯만으로는 도무지 살림이 펴지지 않을 만큼 가난이 깊었기 때문", "왕 서방을 골탕 먹이고 싶었기 때문", "감자 요리를 좋아했기 때문", "도둑질이 재미있었기 때문"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "쓰러진 복녀 앞에서, 어제까지 흉보던 사람들이 입을 굳게 닫은 까닭을 추론하면 무엇입니까?", "options": ["왕 서방이 무서웠기 때문", "감자 몇 알 때문이라기에는 결말이 너무 무거웠고, 복녀를 여기까지 밀어 온 것이 가난임을 그제야 돌아보았기 때문", "복녀와 친하지 않았기 때문", "밤이 깊어 졸렸기 때문"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "복녀의 성격 변화가 작품에서 보여 주는 바는 무엇인가?", "options": ["타고난 본성은 결코 변하지 않는다는 것", "노력하면 누구나 성공한다는 것", "인간의 성품이 개인의 의지보다 환경과 궁핍에 의해 바뀔 수 있다는 것", "선한 사람은 반드시 보상받는다는 것"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "복녀를 대하는 작가의 서술 태도로 가장 적절한 것은 무엇인가?", "options": ["꾸짖지도 감싸지도 않고, 가난이 사람을 어디까지 밀어붙이는지 담담하게 보여 준다", "복녀를 악인으로 단죄한다", "복녀를 영웅으로 미화한다", "복녀를 웃음거리로 만들어 풍자한다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "작품 「감자」에 대한 정보로 옳은 것은 무엇인가?", "options": ["이광수가 쓴 장편 소설이다", "김동인이 쓴 단편 소설로, 일제강점기 평양을 배경으로 한다", "조선 전기 한양이 배경이다", "행복한 결말로 끝나는 소설이다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "작품의 결말에 대한 서술로 옳은 것은 무엇인가?", "options": ["복녀가 왕 서방과 화해하고 밭을 함께 일군다", "복녀 부부가 빈민굴을 떠나 새 삶을 시작한다", "왕 서방이 감자밭을 복녀에게 물려준다", "남편의 거친 화풀이 속에 복녀가 쓰러져 다시 일어나지 못하고, 곁에 감자 몇 알이 흩어져 있다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'감자'가 작품 전체에서 지니는 다층적 상징을 바르게 설명한 것은 무엇인가?", "options": ["굶주림을 달래 준 숨통이자, 복녀를 밭으로 이끈 계기이며, 마지막 밤 흩어져 그 삶의 무게를 증언하는 사물이다", "풍요와 축복만을 상징한다", "남편의 성실함을 상징한다", "고향에 대한 그리움을 상징한다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "이 작품을 '자연주의 소설'이라 부르는 까닭으로 가장 적절한 것은 무엇인가?", "options": ["자연 풍경을 아름답게 묘사하기 때문", "농촌의 사계절을 노래하기 때문", "환경이 인간을 어떻게 바꾸는지 미화 없이 있는 그대로 보여 주기 때문", "자연 보호를 주장하기 때문"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'자연주의'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["자연으로 돌아가자는 생활 운동", "자연을 소재로 한 시 창작 기법", "신비로운 자연 현상을 다루는 문학", "인간을 환경의 산물로 보고, 현실을 미화 없이 관찰하듯 그리는 문예 사조"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'궁핍(窮乏)'의 의미로 가장 적절한 것은 무엇인가?", "options": ["궁궐에 사는 신분", "몹시 가난하여 살림이 쪼들림", "활을 잘 쏘는 재주", "마음이 좁고 옹졸함"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'복녀의 이야기는 한 사람의 잘못이 아니라 한 시대의 슬픔이었다'는 서술이 함축하는 바는 무엇인가?", "options": ["복녀에게는 아무 책임도 없다는 것", "일한 만큼 살 수 없던 시대의 구조적 가난이 빈민굴 어디에나 복녀 같은 삶을 만들어 냈다는 것", "시대가 슬프면 문학이 발전한다는 것", "복녀의 남편만이 유일한 원인이라는 것"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「감자 몇 알의 무게가 한 사람의 삶보다 무거웠던 시대. 그 시대를 잊지 않는 것이 문학의 일이에요.」라는 경구의 메시지는 무엇인가?", "options": ["문학은 비참한 시대의 진실을 기록하고 기억하게 함으로써 제 몫을 다한다는 것", "감자가 그 시절 가장 비싼 곡물이었다는 것", "문학은 즐거움만을 주어야 한다는 것", "지나간 시대는 빨리 잊는 것이 좋다는 것"], "correct": 0}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '감자' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'modern07',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'modern07',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
