<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⛵ 강물 위의 노래 — 배따라기 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/현대문학08/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "사이좋던 형이 달라지기 시작한 까닭은 무엇인가요?", "options": ["아우가 물고기를 훔쳤기 때문에", "아무 증거도 없이 아우와 아내의 사이를 의심하게 되었기 때문에", "장사가 잘되지 않았기 때문에", "마을 사람들이 형을 흉보았기 때문에"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "아우는 어떤 사람이었나요?", "options": ["형의 돈을 노리는 사람", "게을러서 일을 미루는 사람", "형과 자주 싸우는 사람", "형과 형수를 극진히 모시며 그물 손질과 배 고치는 일을 돕던, 아무 잘못 없는 사람"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "이야기가 시작되는 장면으로 알맞은 것은 무엇인가요?", "options": ["'나'가 봄날 대동강에서 뱃놀이를 하다 구슬픈 배따라기 노래를 듣고, 늙은 사공에게 그 유래를 물었다", "'나'가 시장에서 물고기를 사다가 형제를 만났다", "'나'가 산길을 걷다 노래를 배웠다", "'나'가 바다에서 고기잡이를 하고 있었다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "밤의 강에서 일어난 일로 알맞은 것은 무엇인가요?", "options": ["형제가 함께 고기를 많이 잡았다", "배가 바위에 부딪혀 가라앉았다", "형이 아우를 배에 태우고 강 한가운데로 나가, 매달리는 아우를 강물에 빠뜨리고 말았다", "아우가 헤엄쳐서 형을 구했다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "형의 의심을 '아무도 심지 않은 가시나무'에 빗댄 까닭은 무엇인가요?", "options": ["집 마당에 가시나무가 자랐기 때문에", "실제로 있지도 않은 일인데, 형의 마음속에서 의심이 저절로 무성하게 자라났기 때문에", "아우가 가시나무를 심었기 때문에", "가시나무 열매가 맛있기 때문에"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'나'가 사공에게서 형제의 옛이야기를 전해 듣는 이 작품의 짜임을 무엇이라고 하나요?", "options": ["바깥 이야기가 안쪽 이야기를 감싸는 액자식 구성", "시간을 거꾸로 되짚는 구성", "편지를 주고받는 구성", "일기 형식의 구성"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'유래'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["앞으로 일어날 일", "노래의 빠르기", "사물이나 일이 생겨난 내력", "강물의 깊이"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'회한'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["다시 만나는 기쁨", "한바탕 웃는 일", "바다에서 부는 바람", "뉘우치고 한탄하는 마음"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "형이 평생 강가에서 배따라기를 부른 까닭으로 알맞은 것은 무엇인가요?", "options": ["죄 없는 아우를 해친 죄책감과 그리움을, 노래로밖에 갚을 길이 없었기 때문에", "노래 대회에 나가고 싶었기 때문에", "목청을 자랑하고 싶었기 때문에", "사공이 되고 싶었기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'의심은 묻지 않으면 자라고, 물으면 사라져요.'라는 말이 주는 교훈은 무엇인가요?", "options": ["의심이 들면 아무에게도 말하지 말아야 한다는 것", "궁금한 것은 참아야 한다는 것", "마음에 의심이 생기면 혼자 키우지 말고, 용기 내어 솔직하게 물어보아야 한다는 것", "남을 쉽게 믿으면 안 된다는 것"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "형의 성격에서 비극을 부른 결정적 결함은 무엇입니까?", "options": ["돈을 지나치게 아끼는 인색함", "힘자랑을 좋아하는 난폭함", "진실을 물어볼 용기가 없어, 의심을 어둠 속에서 홀로 키운 것", "동생에게 일을 떠넘기는 게으름"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "형의 아내에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["남편이 냉랭해진 영문을 몰라 속을 태우면서도 정성껏 살림을 살았고, 시동생과는 아무 일도 없었다", "시동생을 미워해 모함했다", "남편을 두고 집을 떠났다", "형의 의심이 사실이라고 고백했다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "의심이 생기기 전 형제의 모습으로 옳은 것은 무엇입니까?", "options": ["서로 다른 마을에 떨어져 살았다", "재산 문제로 자주 다투었다", "형은 농사를 짓고 아우는 장사를 했다", "어부인 형을 아우가 도우며 한집에 살았고, 마을에서 소문난 의좋은 형제였다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "형이 진실을 알게 되는 과정으로 옳은 것은 무엇입니까?", "options": ["아우가 살아 돌아와 말해 주었다", "견디다 못해 아내에게 캐물었고, 한 점 거짓 없는 아내의 대답에 모든 것이 자신의 오해였음을 깨달았다", "마을 사람들이 증거를 가져왔다", "사공이 형을 찾아와 알려 주었다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'의심이란 햇빛을 쬐면 사그라들고, 어둠 속에 가두면 걷잡을 수 없이 자란다'는 표현의 뜻은 무엇입니까?", "options": ["의심은 터놓고 이야기하면 풀리지만, 혼자 숨겨 두면 점점 커져 사람을 삼킨다는 뜻", "의심은 밤에만 생긴다는 뜻", "햇빛이 밝으면 거짓말을 못 한다는 뜻", "비밀은 어두운 곳에 보관해야 한다는 뜻"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "배따라기 노래가 작품에서 하는 역할은 무엇입니까?", "options": ["뱃일의 신호로만 쓰인다", "즐거운 잔치 분위기를 돋운다", "마을의 자랑거리로 소개된다", "형의 슬픔과 회한을 상징하며, 처음과 끝을 이어 작품 전체에 흐른다"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'냉랭하다'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["물이 맑고 깨끗하다", "태도가 정답지 않고 차갑다", "날씨가 흐리고 눅눅하다", "소리가 크고 우렁차다"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'무고하다'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["옛날부터 전해 내려오다", "몸이 튼튼하고 건강하다", "아무런 잘못이나 허물이 없다", "말없이 조용하다"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "사연을 아는 사람일수록 형을 차마 탓하지 못하고 눈물지은 까닭을 추론하면 무엇입니까?", "options": ["형이 이미 평생 갚을 수 없는 회한의 벌을 스스로 받고 있음을 알았기 때문", "형이 마을에서 가장 힘이 셌기 때문", "형이 부자여서 눈치를 보았기 때문", "노래가 듣기 좋았기 때문"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "사공이 \"그 형제는 사이가 참 좋았다오. 처음에는 말이오…\"라고 말한 데서 짐작할 수 있는 것은 무엇입니까?", "options": ["사공이 이야기를 잊어버렸다는 것", "'처음에는'이라는 말 속에, 나중에는 그렇지 못했다는 슬픈 결말이 예고되어 있다는 것", "형제가 지금도 사이좋게 산다는 것", "사공이 형제를 만난 적이 없다는 것"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "형이라는 인물의 비극성에 대한 설명으로 가장 적절한 것은 무엇인가?", "options": ["본래 악인이어서가 아니라, 순한 보통 사람이 어둠 속에 키운 의심에 사로잡혀 돌이킬 수 없는 일을 저질렀다는 데 비극성이 있다", "처음부터 동생을 미워한 계획적 인물이다", "재물 욕심 때문에 몰락한 인물이다", "운명의 장난에 휘말린 죄 없는 방관자일 뿐이다"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "진실을 안 뒤 형의 남은 삶을 바르게 설명한 것은 무엇인가?", "options": ["기억을 잃고 평온하게 살았다", "마을을 떠나 새 가정을 꾸렸다", "죄책감에 마음이 무너진 채, 날마다 강가에서 노래를 부르는 것으로 평생에 걸쳐 속죄했다", "왕에게 자수하여 벌을 받았다"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "작품 「배따라기」에 대한 정보로 옳은 것은 무엇인가?", "options": ["현진건이 쓴 장편 소설이다", "김동인이 쓴 단편 소설로, 대동강을 배경으로 슬픔을 노래처럼 그려 낸 서정적 소설로 평가받는다", "해피엔딩의 가족 소설이다", "조선 시대를 배경으로 한 역사 소설이다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "강 한가운데에서 벌어진 절정 장면의 서술로 옳은 것은 무엇인가?", "options": ["아우가 죄를 고백하고 용서를 빌었다", "형이 아우를 용서하고 함께 돌아왔다", "폭풍이 몰아쳐 배가 뒤집혔다", "형이 아내와의 사이를 추궁했고, 하늘에 맹세코 아무 일 없다는 아우의 말도 듣지 않은 채 아우를 강물에 빠뜨렸다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "액자식 구성이 이 작품에서 거두는 효과로 가장 적절한 것은 무엇인가?", "options": ["사건을 빠르게 요약해 준다", "범인을 숨겨 추리의 긴장감을 만든다", "사공의 입을 거쳐 전해짐으로써 형제의 사연이 오래된 전설처럼 아득한 여운을 얻는다", "'나'를 주인공으로 만들어 준다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "이 작품이 보여 주는 비극의 근본 구조로 가장 적절한 것은 무엇인가?", "options": ["의심을 대화로 확인하지 않는 소통의 부재가 오해를 사실로 굳히고 파국으로 이끈다", "가난이 모든 불행의 원인이 된다", "권력 다툼이 가족을 갈라놓는다", "자연재해가 인간의 운명을 결정한다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'액자식 구성'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["사진과 그림을 곁들인 소설", "바깥 이야기 속에 안쪽 이야기가 들어 있어, 액자가 그림을 감싸듯 이야기가 이야기를 감싸는 구성", "장마다 제목을 붙이는 구성", "여러 주인공이 번갈아 말하는 구성"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'서정적'의 의미로 가장 적절한 것은 무엇인가?", "options": ["감정과 정서를 그윽하게 담아내어 마음을 울리는 것", "사실을 순서대로 보도하는 것", "웃음을 목적으로 하는 것", "교훈을 직접 가르치는 것"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'배따라기는 노래이기 이전에 한 사람의 평생에 걸친 사죄였다'는 서술이 함축하는 바는 무엇인가?", "options": ["노래 가사에 사과문이 들어 있다는 것", "형이 노래를 잘 부르지 못했다는 것", "사죄는 말로만 하면 된다는 것", "용서받을 길 없는 죄를 진 인간이 남은 생 전부를 참회에 바치는 모습이 그 가락에 담겨 있다는 것"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "「의심은 어둠 속에서 자라나요.」라는 경구가 오늘의 독자에게 주는 메시지는 무엇인가?", "options": ["밤에는 생각을 하지 말라는 것", "관계를 지키려면 마음속 의혹을 혼자 키우지 말고 용기 있게 드러내어 확인하라는 것", "의심이 많을수록 지혜롭다는 것", "비밀은 지킬수록 아름답다는 것"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '배따라기' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'modern08',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'modern08',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
