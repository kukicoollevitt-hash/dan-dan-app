<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕯️ 비녀 하나의 마음 — 빈처 이야기 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/현대문학09/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "주인공 '나'는 어떤 사람인가요?", "options": ["큰 회사에 다니는 회사원", "신문사 기자", "방 한 칸 셋방에 살며 글을 쓰는 가난한 문학 청년", "장사를 하는 상인"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "아내는 어떤 사람인가요?", "options": ["불평 한마디 없이 바느질품을 팔아 살림을 꾸리며, 남편의 글을 처음부터 믿어 주는 사람", "남편에게 취직하라고 조르는 사람", "좋은 옷을 사 달라고 자주 조르는 사람", "친정으로 돌아가 버린 사람"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "친구 T에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["'나'처럼 글을 쓰는 가난한 문인이다", "시골에서 농사를 짓는 친구다", "'나'에게 돈을 빌리러 온 친구다", "말쑥한 양복 차림으로 찾아온, 회사에 다니며 넉넉하게 사는 학창 시절 친구다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "어느 날 아침 '나'의 원고지 위에 놓여 있던 것은 무엇인가요?", "options": ["T가 두고 간 돈봉투", "아내가 시집올 때 가져온 단 하나뿐인 패물인 비녀", "신문사에서 온 편지", "새로 산 원고지"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'글은 내게 밥그릇이 아니라 숨구멍이었다'는 표현의 뜻은 무엇인가요?", "options": ["글쓰기는 돈벌이가 아니라, 그것 없이는 살 수 없는 존재의 이유라는 뜻", "글을 써서 밥을 많이 벌었다는 뜻", "글보다 밥이 중요하다는 뜻", "글을 그만두겠다는 뜻"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "아내가 비녀를 내놓은 행동에 담긴 뜻은 무엇인가요?", "options": ["비녀가 낡아서 버리려는 것", "남편에게 취직을 권하는 것", "남편의 꿈을 접게 하는 대신 제 가장 귀한 것을 내놓아, 남편을 믿는다는 마음을 전한 것", "새 비녀를 사 달라는 부탁"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'수척하다'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["키가 크고 튼튼하다", "몸이 야위고 파리하다", "목소리가 크다", "걸음이 빠르다"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'패물'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["싸움에서 진 물건", "버리는 물건", "부엌에서 쓰는 그릇", "몸을 꾸미는 데 쓰는 귀한 물건"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "T의 충고에 '나'가 화조차 낼 수 없었던 까닭은 무엇인가요?", "options": ["T가 무서웠기 때문에", "아내가 옆에 있었기 때문에", "T의 말이 하나도 틀리지 않았고, 스스로도 밤마다 던지던 물음이었기 때문에", "대답할 시간이 없었기 때문에"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "비녀를 받은 뒤 '나'의 마음가짐은 어떻게 달라졌나요?", "options": ["펜을 더 단단히 쥐고, 나를 믿어 주는 사람을 위해 두 사람의 꿈을 쓰기로 결심했다", "글을 그만두고 취직하기로 했다", "비녀를 팔아 새 옷을 샀다", "T에게 돈을 빌리기로 했다"], "correct": 0}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'나'가 밤마다 겪는 내적 갈등을 바르게 정리한 것은 무엇입니까?", "options": ["T에 대한 부러움과 우정 사이의 갈등", "이사를 갈지 말지에 대한 고민", "글의 소재를 정하지 못하는 고민", "문학을 향한 마음과 아내를 고생시키는 미안함이 부딪치는 갈등"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "T의 충고에 담긴 진심으로 가장 적절한 것은 무엇입니까?", "options": ["'나'를 망신 주려는 심술", "'나'의 재주가 아까워, 아내 고생을 보다 못해 현실적인 길을 권한 것", "'나'의 글을 시기하는 마음", "'나'의 방을 빼앗으려는 속셈"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "부부의 살림살이에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["세간이라야 낡은 책상과 이불 한 채가 전부인 방 한 칸 셋방에, 밥상엔 시래기국과 보리밥뿐이었다", "마당 있는 기와집에 살았다", "아내가 큰 가게를 운영했다", "원고료만으로 넉넉히 살았다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "비녀를 건네며 아내가 한 말은 무엇입니까?", "options": ["\"이걸 팔아 쌀을 사 오세요.\"", "\"친정에 다녀오겠어요.\"", "\"이거 팔아서 원고지 사세요.\"", "\"취직 자리를 알아보세요.\""], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "깊은 밤 '펜이 종이를 긁는 소리'와 '바늘이 천을 지나는 소리'를 나란히 놓은 효과는 무엇입니까?", "options": ["방이 시끄럽다는 것을 보여 준다", "각자의 자리에서 애쓰는 부부가 서로에게 말없는 응원이 되고 있음을 보여 준다", "두 사람의 사이가 멀어졌음을 보여 준다", "밤이 길다는 것을 보여 준다"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "달빛 아래 잠든 아내의 야윈 얼굴을 바라보는 장면의 역할은 무엇입니까?", "options": ["아내의 병을 암시한다", "'나'가 취직을 결심하는 계기가 된다", "아름다운 풍경 묘사로 분위기를 바꾼다", "'나'의 미안함과 번민을 가장 깊게 만들어, 다음 날 비녀 장면의 감동을 예비한다"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'회의'(글이 무슨 소용인가 하는 마음)의 의미로 가장 적절한 것은 무엇입니까?", "options": ["마음속에 품은 의심과 흔들림", "여럿이 모여 의논하는 자리", "돌아가며 인사하는 일", "기쁘게 기대하는 마음"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'자전적 소설'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["자전거 여행을 다룬 소설", "사전처럼 지식을 담은 소설", "작가 자신의 경험을 바탕으로 쓴 소설", "스스로 도는 팽이를 다룬 소설"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "T의 말을 분명히 들었을 아내가 취직 권유 대신 비녀를 내놓은 데서 추론할 수 있는 것은 무엇입니까?", "options": ["아내가 T의 말을 못 들었다는 것", "세상이 다 의심해도 남편의 길을 끝까지 믿고 지지하겠다는 아내의 선택", "아내가 비녀를 싫어했다는 것", "아내가 살림을 포기했다는 것"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "'나'가 비녀를 팔지 않고 서랍 깊숙이 넣어 둔 까닭을 추론하면 무엇입니까?", "options": ["비녀에 담긴 아내의 믿음과 사랑만은 무엇과도 바꿀 수 없는 것이었기 때문", "값이 오르기를 기다렸기 때문", "팔 곳을 찾지 못했기 때문", "아내 몰래 다시 돌려주려 했기 때문"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'나'라는 인물의 처지를 상징적으로 보여 주는 대비는 무엇인가?", "options": ["도시와 시골의 대비", "꿈은 밥이 되지 못하고 밥 걱정은 꿈을 흔드는, 이상과 현실 사이의 긴장", "형과 아우의 대비", "봄과 겨울의 대비"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "아내의 사랑이 지닌 특징으로 가장 적절한 것은 무엇인가?", "options": ["말로 자주 표현하는 적극적인 사랑", "조건을 걸고 주고받는 사랑", "눈물로 호소하는 사랑", "생색내지 않고 제 것을 내어놓으면서 그것을 희생이라 여기지도 않는, 조용하고 깊은 사랑"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "작품 「빈처」에 대한 정보로 옳은 것은 무엇인가?", "options": ["김동인이 쓴 액자식 소설이다", "3인칭 관찰자 시점의 소설이다", "현진건이 쓴 단편으로, '가난한 아내'라는 뜻의 제목을 지닌 자전적 소설이다", "조선 시대 양반가를 배경으로 한다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "결말부 부부의 모습으로 옳은 것은 무엇인가?", "options": ["살림은 여전히 어렵지만, 한숨 대신 서로의 사랑을 확인하며 등잔불 곁에서 내일을 지어 간다", "복권에 당첨되어 부자가 된다", "'나'가 취직하여 형편이 풀린다", "두 사람이 헤어져 각자의 길을 간다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "1인칭 시점이 이 작품에서 거두는 효과로 가장 적절한 것은 무엇인가?", "options": ["여러 인물의 속마음을 두루 보여 준다", "사건을 객관적 거리에서 보도하듯 전달한다", "결말을 미리 알려 준다", "흔들리는 청년의 내면 고백을 일기처럼 생생하게 전해, 독자가 그 속마음을 가까이에서 느끼게 한다"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "제목 '빈처'가 작품에서 하는 역할로 가장 적절한 것은 무엇인가?", "options": ["'나'의 가난을 조롱하는 반어이다", "서술자는 '나'이지만 작품의 진짜 주인공이 묵묵히 헌신하는 아내임을 가리킨다", "T의 부유함을 강조한다", "비녀의 값어치를 뜻한다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'초상(肖像)'을 '가난한 아내의 초상'이라는 맥락에서 풀이하면 무엇인가?", "options": ["한 인물의 모습과 됨됨이를 그려 낸 것", "죽은 사람을 기리는 의식", "돈을 빌려주는 일", "꿈에 나타난 모습"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'번민'의 의미로 가장 적절한 것은 무엇인가?", "options": ["번개처럼 빠른 결정", "여럿이 나누는 즐거운 대화", "마음이 답답하여 괴로워하며 속을 태움", "번거로운 집안일"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'고맙다는 말은 너무 가벼웠고, 미안하다는 말은 너무 무거웠다'는 서술이 함축하는 바는 무엇인가?", "options": ["어떤 말로도 담을 수 없을 만큼 벅찬 감동과 부끄러움이 뒤섞여, 침묵이 가장 정직한 대답이 되었다는 것", "'나'가 말주변이 없다는 것", "아내가 대답을 원하지 않았다는 것", "고마움과 미안함은 같은 감정이라는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "「가장 깊은 사랑은 가장 조용해요.」라는 경구가 전하는 메시지는 무엇인가?", "options": ["사랑은 비밀로 해야 한다는 것", "참된 사랑은 화려한 말이 아니라 말없는 행동과 헌신으로 증명된다는 것", "조용한 사람만 사랑할 수 있다는 것", "사랑은 소리 내어 표현하면 사라진다는 것"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '빈처' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'modern09',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'modern09',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
