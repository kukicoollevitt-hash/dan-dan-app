<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎓 팔리지 않는 기성품 — 레디메이드 인생 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/현대문학10/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "주인공 P는 어떤 사람인가요?", "options": ["공부를 싫어해 학교를 그만둔 사람", "시골에서 농사를 짓는 사람", "인력거를 만드는 기술자", "조선에서 학교를 마치고 일본 유학까지 다녀온, 마을 첫 유학생"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "친구 M은 어떤 사람인가요?", "options": ["일본에서 함께 유학한 수재", "학창 시절 공부와는 담을 쌓았지만, 지금은 인력거를 끌며 제 힘으로 밥을 버는 친구", "신문사에 다니는 기자", "P에게 돈을 빌려 간 친구"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "조선에 돌아온 P가 일자리를 구하는 과정으로 알맞은 것은 무엇인가요?", "options": ["신문사·학교·회사 어디서나 거절당했고, 직업소개소에서도 '학력이 높아 하실 일이 없다'는 말을 들었다", "돌아오자마자 학교 선생님이 되었다", "아버지의 가게를 물려받았다", "일본 회사에 취직해 다시 떠났다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "거리에서 신사의 어린 아들이 P를 가리키며 물었을 때, 신사가 한 대답은 무엇인가요?", "options": ["\"저분께 인사드려라.\"", "\"인력거는 편리한 것이란다.\"", "\"공부 안 하면 저렇게 된다.\"", "\"저분은 유학까지 다녀온 분이란다.\""], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'졸업장은 열쇠가 아니었어요. 열어 줄 문이 애초에 없었기 때문이지요.'라는 표현의 뜻은 무엇인가요?", "options": ["P가 졸업장을 잃어버렸다는 뜻", "아무리 배워도 그 배움을 쓸 일자리 자체가 조선에 없었다는 뜻", "열쇠를 새로 맞춰야 한다는 뜻", "문이 잠겨서 학교에 못 들어갔다는 뜻"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "P가 스스로를 '레디메이드 인생'이라고 부른 까닭은 무엇인가요?", "options": ["기성품 양복을 즐겨 입었기 때문에", "공장에서 일한 적이 있기 때문에", "만들어진 지 오래되었기 때문에", "공장에서 미리 만들어졌지만 아무도 사 가지 않는 기성품처럼, 배웠지만 쓰일 곳 없는 자기 처지를 빗댄 것"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'기성품'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["주문을 받아 새로 만드는 물건", "오래되어 낡은 물건", "공장에서 미리 만들어 놓은 물건", "외국에서 들여온 물건"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'자조'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["스스로를 비웃음", "스스로 도움", "아침 일찍 일어남", "혼자 밥을 지어 먹음"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "P가 처음에 M의 인력거 권유를 거절한 까닭은 무엇인가요?", "options": ["대학까지 나온 사람이 인력거를 끈다는 것에 자존심이 상했기 때문에", "인력거가 무서웠기 때문에", "다른 일자리가 정해져 있었기 때문에", "M과 사이가 나빴기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "신사의 말을 들은 P가 화 대신 씁쓸하게 웃은 까닭은 무엇인가요?", "options": ["아이가 귀여웠기 때문에", "신사가 아는 사람이었기 때문에", "'공부 안 하면 저렇게 된다'는 말이, 누구보다 열심히 공부한 자신 앞에서 던져진 어긋난 말이었기 때문에", "웃음이 많은 성격이기 때문에"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "P가 겪은 내적 갈등을 바르게 정리한 것은 무엇입니까?", "options": ["체면을 지키자니 굶어야 하고 밥을 먹자니 체면을 내려놓아야 하는, 자존심과 배고픔 사이의 갈등", "고향에 돌아갈지 말지의 갈등", "M과 절교할지 말지의 갈등", "일본에 남을지 돌아올지의 갈등"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "M이라는 인물이 작품에서 하는 역할은 무엇입니까?", "options": ["P를 골탕 먹이는 악역", "P의 성공을 시기하는 경쟁자", "배움은 짧아도 제 힘으로 살아가는 모습으로, 배움과 밥벌이가 어긋난 세상을 비추는 거울", "P에게 학문을 가르치는 스승"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "일자리를 구하지 못하던 시기 P의 형편으로 옳은 것은 무엇입니까?", "options": ["친척의 도움으로 넉넉하게 지냈다", "고향에 내려가 농사를 지었다", "인력거 회사에 바로 취직했다", "아끼던 책을 팔아 끼니를 잇고, 하숙비가 밀린 채 한 끼를 거르는 날도 있었다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "P가 인력거를 끌게 되기까지의 과정으로 옳은 것은 무엇입니까?", "options": ["신사의 소개로 인력거 회사에 들어갔다", "자존심 때문에 한 번 거절했으나, 굶주림 속에 밤새 고민한 끝에 M을 찾아가 끌어 보겠다고 말했다", "M이 인력거를 선물로 주었다", "처음 권유받은 자리에서 바로 승낙했다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'학교와 사회는 공장처럼 배운 사람을 찍어 냈지만 일할 자리는 만들지 않았다'는 서술이 비판하는 것은 무엇입니까?", "options": ["교육만 권하고 그 배움을 쓸 자리는 마련하지 않은 식민지 사회의 구조적 모순", "공장 물건의 나쁜 품질", "학생들의 게으름", "공부를 너무 조금 시키는 학교"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "신사와 아들의 대화 장면이 작품의 절정이 되는 까닭은 무엇입니까?", "options": ["P가 처음으로 손님을 태우는 장면이기 때문", "'공부하면 성공한다'는 세상의 믿음과 공부한 사람이 인력거를 끄는 현실이 한마디 말 속에서 정면으로 부딪치기 때문", "신사가 P를 도와주는 장면이기 때문", "P와 M이 화해하는 장면이기 때문"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'풍자'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["바람에 날리는 종이", "슬픔을 눈물로 표현하는 것", "웃음과 비꼼을 통해 현실의 잘못을 드러내어 비판하는 것", "아름다운 풍경을 그리는 것"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'수재'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["물난리로 입은 피해", "손재주가 좋은 사람", "나무를 다루는 목수", "머리가 뛰어나게 좋은 사람"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'P의 좌절은 게으름 탓이 아니라 성실했기에 더 쓰라렸다'는 서술이 함축하는 바는 무엇입니까?", "options": ["P가 사실은 게을렀다는 것", "성실하면 언젠가 보상받는다는 것", "좌절은 누구에게나 똑같다는 것", "약속을 믿고 최선을 다한 사람일수록, 그 약속이 거짓으로 드러났을 때 상처가 깊다는 것"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "\"오늘 하루 벌어 오늘 하루 먹고사는 게 사람 사는 일이지.\"라는 M의 말에 담긴 태도를 추론하면 무엇입니까?", "options": ["세상 탓에 머무르지 않고 눈앞의 삶을 제 힘으로 꾸려 가는 건강한 현실 감각", "돈을 모으지 않는 낭비벽", "배움을 무시하는 오만함", "내일을 포기한 절망"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "P라는 인물이 대표하는 시대상은 무엇인가?", "options": ["부를 물려받은 지주 계층", "식민지 조선에서 고등 교육을 받고도 일할 자리가 없어 거리로 내몰린 지식인 실업자 세대", "독립운동에 투신한 혁명가들", "농촌을 지킨 소작농들"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "신사와 아들의 대화 이후 P의 인식 변화로 가장 적절한 것은 무엇인가?", "options": ["자신의 처지가 개인의 불운이 아니라 배운 사람을 쓸 자리를 만들지 않은 시대의 병임을 깨달았다", "공부가 부족했음을 반성하고 다시 유학을 결심했다", "인력거 일을 그만두기로 했다", "아이의 말이 옳았음을 인정했다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "작품 「레디메이드 인생」에 대한 정보로 옳은 것은 무엇인가?", "options": ["현진건이 쓴 자전적 소설이다", "해방 후 서울을 배경으로 한다", "눈물로 호소하는 신파 소설이다", "채만식이 쓴 단편으로, 일제강점기 지식인 실업 문제를 웃음 속에 비판한 풍자 소설이다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "제목 '레디메이드'의 의미와 그 상징으로 옳은 것은 무엇인가?", "options": ["새로 유행하던 양복 상표를 뜻한다", "인력거의 별명이다", "공장에서 미리 만들어 놓은 기성품을 뜻하며, 찍혀 나왔지만 쓰일 곳 없이 버려지는 배운 사람들을 빗댄다", "일본에서 들여온 책 제목이다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'공부하면 성공한다'는 믿음과 P의 현실이 정반대로 어긋나는 이 작품의 핵심 장치는 무엇인가?", "options": ["믿음과 현실이 뒤집히는 아이러니", "시간을 거슬러 가는 회상", "꿈과 현실을 오가는 환상", "우연의 반복"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "채만식이 '울음 대신 웃음'을 택한 서술 전략의 효과는 무엇인가?", "options": ["작품을 가볍고 즐겁게만 만든다", "독자가 P의 웃음을 따라 웃다가 그 뒤에 숨은 시대의 아픔과 마주하게 되어, 비판이 더 날카롭게 스며든다", "슬픈 장면을 모두 삭제한다", "검열을 완전히 피하게 해 준다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'아이러니'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["쇠로 만든 도구", "앞뒤 운율을 맞추는 기법", "이야기를 요약하는 기술", "기대나 믿음과 실제 결과가 정반대로 어긋나는 상황"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'고발(告發)'을 이 작품의 맥락에서 풀이하면 무엇인가?", "options": ["잘못된 현실을 세상에 드러내어 알리는 것", "경찰서에 신고하는 절차", "비밀을 몰래 퍼뜨리는 것", "남의 잘못을 용서하는 것"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'P의 이야기는 한 사람의 실패담이 아니라, 열심히 산 사람을 실패하게 만든 시대의 기록'이라는 서술이 함축하는 바는 무엇인가?", "options": ["P의 노력이 부족했다는 것", "실패는 언제나 개인의 책임이라는 것", "개인의 성실을 배반하는 구조적 모순이 문제의 본질이므로, 비판의 화살은 개인이 아니라 시대를 향해야 한다는 것", "시대가 좋아지면 기록은 필요 없다는 것"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "'사람은 기성품이 아니에요.'라는 결말의 문장이 오늘의 독자에게 주는 메시지는 무엇인가?", "options": ["물건을 아껴 쓰자는 것", "저마다의 배움과 노력이 제 자리를 찾아 존중받는 세상이 되어야 한다는 것", "공장 제품을 사지 말자는 것", "공부보다 운동이 중요하다는 것"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '레디메이드 인생' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'modern10',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'modern10',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
