<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌊 흐린 강물을 거슬러 — 탁류 초봉이 이야기 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/현대문학11/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "어린 시절의 초봉은 어떤 아이였나요?", "options": ["몸이 약해 집에만 있던 아이", "말썽을 자주 부리던 아이", "총명하고 얼굴이 고와서, 동네 어른들이 크게 될 아이라고 칭찬하던 아이", "공부를 싫어하던 아이"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "초봉의 남편 고태수는 어떤 사람이었나요?", "options": ["겉으로는 점잖았지만 속으로는 방탕해서, 밤늦도록 술자리를 돌고 버는 돈보다 쓰는 돈이 많은 사람", "성실하게 은행에 다니는 사람", "초봉을 아껴 주는 다정한 사람", "가난하지만 정직한 농부"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "초봉이 학교를 그만두게 된 사정으로 알맞은 것은 무엇인가요?", "options": ["공부가 싫어져서 스스로 그만두었다", "기울어 가는 집안 형편 때문에 공부를 접고 은행에 취직했다", "선생님과 다투어서 그만두었다", "몸이 아파서 그만두었다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "아버지 정 주사에게 일어난 일로 알맞은 것은 무엇인가요?", "options": ["장사가 잘되어 부자가 되었다", "은행에 취직해 돈을 벌었다", "고향으로 돌아가 농사를 지었다", "한몫 잡게 해 주겠다는 말에 속아 남은 재산을 날리고 큰 빚까지 떠안았다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "이야기의 배경인 군산에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["금강이 바다와 만나는 항구 도시로, 일본인들이 조선의 쌀을 수탈해 가던 곳이었다", "조용한 산골 마을이었다", "임금이 사는 도읍이었다", "눈이 많이 오는 북쪽 국경 도시였다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "제목 '탁류'가 나타내는 것은 무엇인가요?", "options": ["군산의 특산물 이름", "초봉이 다니던 은행 이름", "흐린 강물처럼, 자기 뜻과 상관없이 시대에 휩쓸려 흐려져 가는 사람들의 슬픈 삶", "여름철의 큰 홍수"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'수탈'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["물건을 사고파는 일", "곡식을 거두어 저장하는 일", "세금을 깎아 주는 일", "강제로 빼앗아 가는 것"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'가세가 기울다'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["집이 한쪽으로 기울어지다", "집안의 살림 형편이 나빠지다", "가족이 이사를 가다", "세금이 많이 나오다"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "초봉이 모진 시집살이를 친정에 알리지 않은 까닭은 무엇인가요?", "options": ["제 혼인으로 형편이 나아졌다고 믿는 식구들을 걱정시키고 싶지 않았기 때문에", "편지 쓸 종이가 없었기 때문에", "친정이 너무 멀었기 때문에", "시어머니가 편지를 빼앗았기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'흐린 것은 초봉이가 아니라 시대의 강물이었다'는 말의 뜻은 무엇인가요?", "options": ["초봉이 강에서 살았다는 뜻", "강물이 실제로 더러웠다는 뜻", "초봉의 불행은 초봉의 잘못이 아니라, 초봉을 겹겹이 밀어뜨린 잘못된 시대 탓이라는 뜻", "초봉이 물을 싫어했다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "은행에 다니던 시절 초봉의 모습으로 옳은 것은 무엇입니까?", "options": ["월급을 모아 제 옷을 사 입었다", "동료들과 자주 다투었다", "일이 서툴러 자주 혼났다", "장부 정리가 꼼꼼해 사람들이 아꼈고, 월급 봉투를 통째로 어머니께 드리며 동생들 학비를 대는 것을 뿌듯해했다"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "혼처를 서둘러 정하는 정 주사 내외의 모습에서 드러나는 것은 무엇입니까?", "options": ["딸의 행복을 최우선으로 여기는 사랑", "신랑감을 오래 조사한 신중함", "초봉의 뜻을 존중하는 태도", "딸의 마음보다 집안의 빚을 먼저 보는, 혼인을 집안을 일으킬 동아줄로 여기는 태도"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "남편이 세상을 떠난 뒤 초봉이 겪은 일로 옳은 것은 무엇입니까?", "options": ["장례가 끝나기 무섭게 시어머니에게 쫓겨나 친정에 돌아왔으나, 친정마저 빚에 몰려 풍비박산이 나 있었다", "시댁의 재산을 물려받았다", "친정이 다시 부유해져 편히 지냈다", "은행에 다시 취직해 형편이 풀렸다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "혼자가 된 뒤 초봉의 생활로 옳은 것은 무엇입니까?", "options": ["학교로 돌아가 공부를 계속했다", "재혼하여 새 가정을 꾸렸다", "남의 집 궂은일과 막노동까지 닥치는 대로 하며 하루 벌어 하루 사는 나날을 보냈다", "군산을 떠나 서울로 갔다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'초봉의 혼인은 사랑의 약속이 아니라, 가난이 대신 써 준 답안지였다'는 표현의 뜻은 무엇입니까?", "options": ["초봉이 시험을 잘 보았다는 뜻", "혼인 서약서를 아버지가 대신 썼다는 뜻", "초봉이 답장을 늦게 보냈다는 뜻", "혼인이 초봉 자신의 선택이 아니라 집안의 가난이 강요한 결정이었다는 뜻"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "강물(탁류)이 작품에서 하는 역할로 가장 적절한 것은 무엇입니까?", "options": ["맑게 시작해 흐려지는 물줄기가 초봉의 인생과 겹쳐지며 작품 전체의 상징이 된다", "군산의 아름다운 풍경을 자랑한다", "홍수의 위험을 경고한다", "뱃길 교통의 발달을 보여 준다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'방탕하다'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["몸가짐이 조심스럽다", "말수가 적고 진지하다", "술과 놀이에 빠져 행실이 바르지 못하다", "씀씀이가 알뜰하다"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'풍비박산'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["바람이 세게 부는 날씨", "사방으로 날아 흩어지듯 집안이 완전히 무너짐", "산에서 부는 시원한 바람", "갑자기 부자가 됨"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'성실한 사람의 십 년이 사기꾼의 하루를 당하지 못하는 세상'이라는 서술이 비판하는 것은 무엇입니까?", "options": ["정직한 노력보다 속임수와 요행이 더 큰 힘을 갖던 뒤집힌 세상", "저축을 하지 않는 습관", "사기꾼의 부지런함", "십 년이면 강산이 변한다는 속담"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "초봉이 뜻에 없는 혼인을 끝내 받아들인 마음을 추론하면 무엇입니까?", "options": ["고태수를 남몰래 좋아했기 때문", "제 혼인으로 집안의 짐이 덜어진다면 그것으로 되었다는, 저보다 식구가 먼저인 희생의 마음", "부모가 무서웠기 때문", "혼례옷이 입고 싶었기 때문"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "초봉이라는 인물이 대표하는 존재로 가장 적절한 것은 무엇인가?", "options": ["시대에 맞서 싸운 여성 투사", "신교육을 받고 출세한 신여성", "요행으로 몰락한 투기꾼", "정직하게 살려 해도 살 수 없었던, 그 시절 조선 땅의 수많은 성실한 사람들"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "\"세상이 나를 이렇게 만들었지.\"라며 술로 세월을 보내는 정 주사에 대한 평가로 가장 적절한 것은 무엇인가?", "options": ["시대의 피해자이기도 하지만, 책임을 세상에만 돌린 채 고통을 식구들에게 떠넘기는 무력한 가장이다", "가족을 위해 끝까지 분투한 아버지다", "치밀한 계획으로 재기한 사업가다", "딸의 뜻을 존중한 깨어 있는 부모다"], "correct": 1},

      {"gate": 4, "category": "내용일치", "question": "초봉을 무너뜨린 불행들의 순서로 옳은 것은 무엇인가?", "options": ["남편의 죽음 → 학업 중단 → 아버지의 사기 피해", "시집살이 → 은행 취직 → 혼인", "학업 중단과 은행 취직 → 아버지의 사기 피해 → 뜻에 없는 혼인과 남편의 방탕 → 남편의 죽음과 축출 → 친정의 몰락", "친정의 몰락 → 학업 중단 → 혼인"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'초봉을 밀어뜨린 손은 하나가 아니었다'는 서술이 제시하는 비극의 구조는 무엇인가?", "options": ["초봉의 성격적 결함이 반복된 것", "돈놀이가 판치던 세상, 딸의 뜻을 묻지 않던 낡은 풍습, 식민지 수탈이 겹겹이 작용한 중층적 압박", "단 한 번의 우연한 사고", "고태수 한 사람의 악행"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "작품이 '흐린 강물을 비추는 거울'로 평가받는 까닭은 무엇인가?", "options": ["한 여인의 무너져 가는 삶을 통해 그 시대 전체가 얼마나 병들었는지를 있는 그대로 비추어 보여 주기 때문", "강 풍경 묘사가 아름답기 때문", "거울이 중요한 소재로 나오기 때문", "결말이 행복하게 끝나기 때문"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'리얼리즘 문학'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["미래 세계를 상상해 그리는 문학", "영웅의 모험을 노래하는 문학", "현실을 미화하지 않고 있는 그대로 그려 내어 사회의 문제를 드러내는 문학", "꿈과 환상을 좇는 문학"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'민낯'을 '시대의 민낯'이라는 맥락에서 풀이하면 무엇인가?", "options": ["백성들의 얼굴 생김새", "깨끗이 씻은 얼굴", "부끄러워 붉어진 얼굴", "꾸밈에 가려져 있던 있는 그대로의 실상"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'잘못 없는 사람이 가장 큰 벌을 받는 어긋남'이 작품의 고발 지점이 되는 까닭을 추론하면 무엇인가?", "options": ["벌은 원래 무거울수록 좋기 때문", "성실이 보답받지 못한다면 문제는 개인이 아니라 세상 쪽에 있음이 드러나기 때문", "초봉에게도 숨은 잘못이 있었기 때문", "불행은 운명이므로 어쩔 수 없기 때문"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「흐린 물속에서도 사람은 제 맑음을 기억해요.」라는 경구가 전하는 메시지는 무엇인가?", "options": ["시대가 사람을 흐리게 만들어도, 자신의 본래 맑음을 잃지 않으려는 기억이 인간의 존엄을 지킨다는 것", "물은 끓여 마셔야 한다는 것", "기억력이 좋아야 성공한다는 것", "맑은 물을 찾아 이사해야 한다는 것"], "correct": 0}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '탁류' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'modern11',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'modern11',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
