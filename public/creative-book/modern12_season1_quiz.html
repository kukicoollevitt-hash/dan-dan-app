<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👨‍👩‍👦 한 지붕 세 시대 — 삼대 이야기 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/현대문학12/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "할아버지 조의관은 어떤 사람인가요?", "options": ["집과 땅, 돈놀이로 큰 재산을 모았고, 족보와 제사 등 옛날 법도를 목숨처럼 지키는 노인", "신학문을 배우자고 주장하는 개화파", "가난하지만 마음씨 좋은 농부", "학교를 세운 교육자"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "아버지 조상훈은 어떤 사람인가요?", "options": ["아버지처럼 재산 모으는 일에만 힘쓴 사람", "일본 유학을 다녀온 젊은이", "신학문과 새 문물을 받아들이자는 개화파가 되었지만, 사업에 실패해 아버지 재산에 기대어 사는 사람", "제사를 정성껏 모시는 효자"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "손자 조덕기에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["할아버지를 그대로 본받으려 했다", "아버지를 도와 학교를 세웠다", "공부를 싫어해 유학을 포기했다", "일본 유학을 다녀왔으며, 할아버지의 세상도 아버지의 세상도 잘못되어 보여 방황했다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "명절날 저녁 밥상에서 벌어진 일로 알맞은 것은 무엇인가요?", "options": ["세 사람이 화해하고 함께 웃었다", "조의관과 조상훈 사이에 해묵은 감정이 터져 언성이 오갔고, 덕기는 묵묵히 수저만 내려놓았다", "덕기가 유학 소식을 전해 모두 기뻐했다", "조의관이 재산을 나누어 주었다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "조의관과 조상훈 부자가 멀어진 진짜 까닭은 무엇이라고 했나요?", "options": ["재산 다툼 때문에", "성격이 아니라, 저물어 가는 세상과 밀려오는 새 세상이라는 시대의 차이 때문에", "이사 문제로 다투었기 때문에", "말버릇이 서로 달랐기 때문에"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "제목 '삼대'가 뜻하는 것은 무엇인가요?", "options": ["할아버지·아버지·손자로 이어지는 세 세대", "세 채의 큰 기와집", "세 번의 큰 전쟁", "세 명의 친구"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'개화파'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["꽃을 가꾸는 사람들", "새 문물과 새 학문을 받아들이자고 주장하는 사람들", "옛 법도를 지키자는 사람들", "그림을 그리는 사람들"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'족보'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["발 모양을 그린 그림", "보물을 숨긴 지도", "요리 방법을 적은 책", "한 집안의 조상과 자손을 대대로 적어 놓은 기록"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "덕기가 '이도 저도 아닌 자리가 세상에서 제일 추운 자리'라고 느낀 까닭은 무엇인가요?", "options": ["할아버지처럼 살 수도 아버지처럼 살 수도 없는데, 아직 제 세상을 갖지 못해 어느 쪽에도 설 수 없었기 때문에", "방에 불을 때지 못했기 때문에", "겨울이 유난히 길었기 때문에", "친구가 한 명도 없었기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "이 소설이 '누가 옳았을까'라는 물음에 답을 쉽게 내주지 않는 까닭은 무엇인가요?", "options": ["작가가 결말을 잊어버렸기 때문에", "세 사람이 모두 나쁜 사람이기 때문에", "세 사람 저마다 옳은 만큼의 허물이 있어, 누구도 완전히 옳지도 그르지도 않기 때문에", "독자가 어려서 이해할 수 없기 때문에"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "조의관이 족보 정비와 성대한 제사에 큰돈을 쓴 까닭은 무엇입니까?", "options": ["아들의 사업을 돕기 위해", "자손에게 돈 쓰는 법을 가르치려고", "그것이 집안의 명예를 사는 길이라 믿었기 때문", "세금을 줄이기 위해"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "조상훈의 삶이 '모순된 삶'이라 불리는 까닭은 무엇입니까?", "options": ["입으로는 새 시대를 말하면서, 생활은 그토록 비판하던 아버지의 곳간에 얹혀 있었기 때문", "아버지를 존경하면서도 말을 안 들었기 때문", "공부를 잘했지만 시험에 떨어졌기 때문", "서울과 시골을 오가며 살았기 때문"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "덕기의 연인 홍경애에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["조씨 집안이 정해 준 혼처였다", "배움이 깊고 제 생각을 제 목소리로 말할 줄 아는 신여성으로, 세상의 편견 속에서 힘겹게 살았다", "덕기의 유학 시절 스승이었다", "조의관이 아끼는 먼 친척이었다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "유학 시절 이후 덕기의 고민으로 옳은 것은 무엇입니까?", "options": ["재산을 어떻게 불릴지 궁리했다", "할아버지의 뒤를 이어 돈놀이를 배웠다", "벗들과 절교하고 홀로 지냈다", "가난한 사람들이 짓밟히지 않는 세상이라는 사상에 끌렸지만, 집안과 물려받을 재산이 발목을 잡아 뛰어들지 못했다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'한 밥상, 세 개의 세상'이라는 장 제목이 뜻하는 바는 무엇입니까?", "options": ["한 핏줄의 삼대가 마주 앉았지만 저마다 전혀 다른 시대를 살고 있어, 밥상 위에서 시대끼리 부딪쳤다는 것", "밥상이 세 개 차려졌다는 것", "세 사람이 각자 다른 방에서 먹었다는 것", "음식이 세 가지뿐이었다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'높은 꿈도 두 발이 땅을 딛지 못하면 날개 잃은 새와 같다'는 표현이 조상훈에게 뜻하는 바는 무엇입니까?", "options": ["상훈이 새를 길렀다는 것", "뜻은 높았지만 현실을 살피는 눈이 부족해, 계획이 번번이 실패로 끝났다는 것", "상훈이 비행기를 타고 유학을 갔다는 것", "꿈은 클수록 좋다는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'우유부단'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["우유를 즐겨 마심", "부드럽고 상냥함", "줏대 없이 이랬다저랬다 함", "망설이기만 하고 결단을 내리지 못함"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'신여성'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["갓 결혼한 여성", "신을 만드는 여성 장인", "개화기에 새 교육을 받고 새로운 사고방식을 지닌 여성", "신문에 나온 여성"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "\"덕기 씨는 어느 쪽이에요?\"라는 경애의 물음에 덕기가 늘 대답을 망설인 까닭을 추론하면 무엇입니까?", "options": ["경애의 말을 알아듣지 못했기 때문", "머리는 새 세상에 가 있는데 발은 옛집에 묶여 있어, 스스로도 제 자리를 정하지 못했기 때문", "경애를 사랑하지 않았기 때문", "질문이 너무 쉬웠기 때문"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "'덕기의 방황은 혼자만의 것이 아니었다'는 서술에서 추론할 수 있는 것은 무엇입니까?", "options": ["옛것과 새것 사이에서 제 길을 찾지 못하는 고민이 그 시대 젊은 세대 전체의 것이었다는 점", "덕기가 친구들과 함께 여행을 다녔다는 점", "방황은 여럿이 하면 즐겁다는 점", "덕기의 가족이 모두 방황했다는 점"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "세 인물이 각각 대표하는 바를 바르게 정리한 것은 무엇인가?", "options": ["조의관은 새 시대, 조상훈은 옛 시대, 덕기는 중간 세대", "조의관은 구세대의 봉건적 가치, 조상훈은 이상만 앞선 개화 세대, 덕기는 그 사이에서 방황하는 신세대", "세 사람 모두 같은 가치를 대표한다", "조의관은 농민, 조상훈은 상인, 덕기는 관리를 대표한다"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "각 인물의 미덕이 허물로 뒤집히는 양상을 바르게 짝지은 것은 무엇인가?", "options": ["할아버지의 신중함이 망설임이, 아버지의 단단함이 완고함이 되었다", "덕기의 꿈이 무책임이 되었다", "세 사람 모두 미덕이 그대로 유지되었다", "할아버지의 단단함은 완고함이, 아버지의 꿈은 무책임이, 아들의 신중함은 망설임이 되었다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "작품 「삼대」에 대한 정보로 옳은 것은 무엇인가?", "options": ["염상섭이 쓴 긴 소설로, 일제강점기 서울의 한 집안 삼대를 통해 시대의 갈등을 그린 한국 근대 소설의 대표작이다", "채만식이 쓴 풍자 단편이다", "농촌 계몽 운동을 다룬 소설이다", "해방 직후를 배경으로 한 희곡이다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "덕기와 홍경애의 관계를 가로막은 것으로 옳은 것은 무엇인가?", "options": ["두 사람의 나이 차이", "경애의 유학 계획", "덕기의 우유부단함, 세상의 편견, 그리고 조씨 집안이라는 벽", "조의관의 적극적인 반대 상소"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "작가 염상섭의 서술 태도로 가장 적절한 것은 무엇인가?", "options": ["할아버지 편에서 옛 법도를 옹호한다", "덕기를 영웅으로 미화한다", "아버지 세대를 일방적으로 단죄한다", "어느 한쪽을 편들지 않고 각 인물의 장단점을 함께 보여 주는 객관적 시선을 유지한다"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "밥상 다툼 장면이 지니는 구조적 의미로 가장 적절한 것은 무엇인가?", "options": ["조선 곳곳에서 벌어지던 시대의 충돌이 한 집안 저녁상의 다툼으로 압축되어 나타난다", "명절 음식의 소중함을 일깨운다", "조씨 집안의 요리 솜씨를 보여 준다", "세 사람의 화해를 예고한다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'완고하다'의 의미로 가장 적절한 것은 무엇인가?", "options": ["완벽하게 일을 해내다", "융통성 없이 낡은 생각을 굳게 지키다", "성품이 온화하고 너그럽다", "몸이 튼튼하고 건강하다"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'세대(世代)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["세상의 큰 사건", "넓은 집터", "비슷한 시기에 태어나 같은 시대 경험을 공유하는 사람들의 층", "가족의 재산 목록"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "인물들이 '착한 편과 나쁜 편으로 나뉘지 않는' 서술 방식이 거두는 문학적 효과는 무엇인가?", "options": ["인물들이 저마다 살아 있는 사람으로 그려져, 독자가 '나라면 어느 자리에 섰을까' 스스로 묻게 된다", "이야기가 단순해져 읽기 쉬워진다", "악역이 없어 긴장감이 사라진다", "결말을 예측하기 쉬워진다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'세대의 차이는 틀림이 아니라 서로 다른 시대를 살아온 흔적'이라는 결말의 문장이 오늘의 독자에게 주는 메시지는 무엇인가?", "options": ["세대 차이는 시간이 지나면 저절로 사라진다는 것", "다른 세대를 틀렸다고 단정하기 전에, 그들이 살아온 시대를 헤아리며 이해해 보라는 것", "옛 세대의 말은 따를 필요가 없다는 것", "젊은 세대가 언제나 옳다는 것"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '삼대' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'modern12',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'modern12',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
