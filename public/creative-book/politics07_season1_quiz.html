<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 골목 끝 도서관을 지켜라 — 풀뿌리에서 자란 힘 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작정치경제07/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "\"구청에서 정한 일이면 어쩔 수 없지.\"라는 말에 이레가 \"왜 우리한테는 묻지도 않아요?\"라고 되물은 것에서 알 수 있는 태도는 무엇인가요?", "options": ["구청을 미워하는 마음", "정해진 일이라고 체념하지 않고 동네 일의 주인이 누구인지 묻는 태도", "도서관보다 학원이 좋다는 생각", "부모님 말씀에 반항하는 버릇"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "통장 할머니에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["젊은 시절 구의원을 지냈으며, 이레에게 지방자치와 참여의 길을 가르쳐 주었다", "구청에서 일하는 공무원이다", "도서관의 사서 선생님이다", "한글 교실의 학생이다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "우리 구의 '두 개의 큰 기둥'에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["학교와 도서관이다", "경찰서와 소방서다", "둘 다 대통령이 임명한다", "규칙과 예산을 살피는 지방의회와, 살림을 이끄는 구청장이며 둘 다 주민이 투표로 뽑는다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "첫 번째 공청회의 결과는 어떠했나요?", "options": ["주민들이 가득 모여 폐관이 취소되었다", "구청장이 직접 와서 사과했다", "넓은 회의장에 겨우 아홉 명만 참석해, 기존 계획대로 진행하겠다는 말을 들었다", "공청회가 아예 열리지 못했다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "서명과 숫자로 안 되던 일이 벽보 '꿈터의 하루'로 달라진 까닭은 무엇인가요?", "options": ["벽보가 크고 알록달록했기 때문에", "구청장이 벽보를 좋아했기 때문에", "숫자가 닿지 못한 사람들의 마음에, 이 일이 우리 모두의 일이라는 이야기가 가서 닿았기 때문에", "벽보에 상품권을 붙여 두었기 때문에"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "꿈터를 지킨 뒤 동네에 일어난 변화로 알맞은 것은 무엇인가요?", "options": ["도서관이 더 큰 건물로 이사했다", "구청이 모든 결정을 주민에게 미루게 되었다", "이레가 구의원이 되었다", "놀이터·가로등 문제에도 주민들이 참여하는 등, 참여가 옮겨붙었다"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'조례'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["아침에 하는 모임", "지방의회가 만드는 그 지역의 규칙", "나라 전체가 지키는 법", "구청장의 명령"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'주민 소환'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["주민들을 회의에 부르는 것", "이사 온 주민을 환영하는 잔치", "일을 제대로 못 하는 대표를 주민들이 물러나게 하는 제도", "주민들이 세금을 돌려받는 제도"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "\"지방자치의 진짜 반대말은 무관심\"이라는 할머니의 말을 짐작해 풀면 무엇인가요?", "options": ["좋은 제도가 있어도 주민이 지켜보고 참여하지 않으면 지방자치는 힘을 잃는다는 뜻", "중앙 정부가 지방보다 힘이 세다는 뜻", "무관심한 사람은 투표를 못 하게 해야 한다는 뜻", "지방에는 관심 둘 일이 없다는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"민주주의는 먼 광장이 아니라, 우리 동네 골목에서 자라요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["광장은 시위하는 곳이라는 뜻", "골목이 넓어야 나라가 발전한다는 뜻", "민주주의는 동네의 작은 일에 참여하는 데서부터 시작된다는 뜻", "도서관은 골목에 지어야 한다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "이레의 활동이 발전해 간 순서로 가장 적절한 것은 무엇입니까?", "options": ["시위 → 서명 → 벽보 → 소송", "문제 인식 → 지방자치 배우기 → 서명과 청원 → 좌절 → 이야기(벽보)로 마음 모으기 → 표결 참관", "벽보 → 청원 → 서명 → 공청회", "투표 → 소환 → 청원 → 조례"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "봉숭아에 물을 주던 할머니의 뒷모습을 벽보에 그려 넣은 이레의 선택이 보여 주는 것은 무엇입니까?", "options": ["그림 실력을 자랑하고 싶은 마음", "봉숭아 꽃의 아름다움에 대한 감탄", "벽보의 빈자리를 채우려는 급한 마음", "통계로는 전할 수 없는, 공간에 깃든 사람들의 마음을 전하려는 통찰"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "'주민 청원'에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["구청장을 바로 물러나게 하는 제도", "주민이 지방의회에 문제를 다시 살펴 달라고 정식으로 요청하는 제도이며, 서명이 함께 담기면 힘이 실린다", "법원에 재판을 청구하는 제도", "대통령에게 편지를 보내는 제도"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "꿈터 문제가 해결된 최종 과정으로 옳은 것은 무엇입니까?", "options": ["의회가 도서관을 지키는 조례안을 표결로 통과시켰고, 구청이 이를 실행해 운영이 계속되었다", "구청장이 스스로 계획을 철회했다", "중앙 정부가 예산을 내려보냈다", "주민들이 돈을 모아 도서관을 사들였다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'텅 빈 의자 사백 개'가 '서명 사백 장'보다 무거웠다는 표현의 의미는 무엇입니까?", "options": ["의자가 낡고 무거웠다는 사실", "공청회 장소가 너무 넓었다는 것", "이름을 적는 가벼운 동의와 시간을 내는 실질적 참여 사이의 간극", "서명이 위조되었을 가능성"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'풀뿌리'라는 은유가 이야기에서 뜻하는 것은 무엇입니까?", "options": ["화단의 봉숭아 뿌리", "민주주의를 아래에서 떠받치는 골목과 마을 주민들의 참여", "오래된 나무의 뿌리", "도서관 마당의 잔디"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'지방자치'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["지방 주민이 자기 지역의 문제를 직접 결정하고 해결해 가는 제도", "지방이 중앙 정부의 지시만 따르는 제도", "지방마다 왕을 두는 제도", "지방세를 걷지 않는 제도"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'공청회'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["공무원들만 모이는 회의", "공원에서 여는 음악회", "중요한 일에 대해 주민 등의 의견을 공개적으로 직접 듣는 모임", "의회의 비공개 회의"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'제도는 길을 열어 주지만, 걷는 것은 사람의 몫'이라는 문장에서 추론할 수 있는 것은 무엇입니까?", "options": ["제도가 많을수록 살기 불편해진다", "길은 걷지 않아도 저절로 목적지에 닿는다", "주민 투표·청원 같은 제도의 힘은 그것을 실제로 사용하는 참여가 있어야 발휘된다", "제도를 만드는 사람이 가장 위대하다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "'그냥 있던 도서관'과 '우리가 지켜 낸 도서관'의 차이가 시사하는 바를 추론하면 무엇입니까?", "options": ["참여의 경험이 공간에 대한 주인 의식과 공동체의 애정을 길러 낸다", "지켜 낸 도서관은 이용료를 받는다", "오래된 건물일수록 소중하다", "도서관의 책 수가 늘어났다"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'책이 한 줄도 눈에 들어오지 않았다'는 서술이 보여 주는 폐관 안내문의 의미로 가장 적절한 것은 무엇인가?", "options": ["행정의 결정 한 장이 개인의 일상과 애착의 공간을 지울 수 있다는 충격", "이레의 독서 습관이 흐트러졌다는 것", "안내문의 글씨가 너무 컸다는 것", "도서관 책이 재미없어졌다는 것"], "correct": 0},

      {"gate": 4, "category": "내용일치", "question": "지방자치의 작동 과정이 이 이야기에서 실현된 순서로 옳은 것은 무엇인가?", "options": ["구청장 명령 → 의회 추인 → 주민 통보", "주민 청원 → 의회의 조례 제정 → 단체장(구청)의 실행", "의회 발의 → 주민 투표 → 중앙 정부 승인", "주민 소환 → 새 구청장 선출 → 예산 편성"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'첫 공청회의 아홉 명'과 '두 번째 공청회의 만석'이라는 대비가 논증하는 바는 무엇인가?", "options": ["홍보물의 수가 참석자를 결정한다", "공청회는 두 번 열어야 성공한다", "저녁 시간대가 참석에 유리하다", "제도의 성패를 가르는 것은 제도 자체가 아니라 시민의 마음을 움직이는 공감과 참여다"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "이야기가 '창가 구석 자리'로 시작해 같은 자리로 끝나는 수미상관 구성의 효과는 무엇인가?", "options": ["일상은 그대로이되 '동네 소식을 지나치지 않는 시민'으로 성장한 변화를 부각한다", "도서관 좌석 배치의 중요성을 알린다", "시간이 흐르지 않았음을 보여 준다", "이레의 소극적 성격이 변하지 않았음을 보여 준다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'풀뿌리 민주주의'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["농촌 지역에서만 실시되는 민주주의", "식물 보호를 위한 환경 운동", "뿌리 깊은 전통을 지키는 보수주의", "평범한 주민들의 일상적 참여가 아래로부터 민주주의를 떠받친다는 것"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'지방자치단체장'의 역할로 가장 적절한 것은 무엇인가?", "options": ["지역의 규칙(조례)을 단독으로 제정한다", "지역의 살림을 이끌며 의회가 정한 것을 실행한다", "주민의 세금을 면제해 준다", "재판을 통해 분쟁을 해결한다"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'주민들이 지켜보지 않으면 의회도 구청도 긴장하지 않는다'는 말이 함축하는 권력과 시민의 관계를 추론하면 무엇인가?", "options": ["의회와 구청은 원래 게으른 조직이다", "권력은 감시가 없어야 능률이 오른다", "위임된 권력의 책임성은 시민의 지속적 관심과 감시 위에서 유지된다", "주민은 권력을 불신해야 한다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "「민주주의는 먼 광장이 아니라, 우리 동네 골목에서 자라요.」라는 경구의 함의로 가장 적절한 것은 무엇인가?", "options": ["대규모 집회는 민주주의에 해롭다", "골목이 많은 도시가 민주적이다", "민주주의는 선거일에만 작동한다", "민주주의의 토대는 거창한 사건이 아니라 생활 가까이의 문제에 참여하는 일상의 실천이다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '골목 끝 도서관을 지켜라' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'politics07',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'politics07',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
