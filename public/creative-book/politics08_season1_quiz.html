<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📜 펜은 칼보다 무겁다 — 우리 반 소식통 사건 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작정치경제08/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "학급 신문 기자가 된 겨레가 특히 신이 났던 까닭은 무엇인가요?", "options": ["기자가 되면 급식을 먼저 먹을 수 있어서", "시험 공부를 안 해도 되어서", "어린이의 말은 흩어지지만 글은 남아서, 자기 목소리에 확성기가 달린 기분이 들어서", "선생님께 칭찬을 받을 수 있어서"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "하진이 기사를 걱정하는 세아에게 겨레가 한 대답은 무엇이었나요?", "options": ["사실을 쓰는 게 기자이고, 우리에겐 표현의 자유가 있다고 했다", "하진이에게 먼저 물어보겠다고 했다", "기사를 고쳐 쓰겠다고 했다", "세아에게 대신 써 달라고 했다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "겨레가 쓴 급식 기사에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["소문만 듣고 하루 만에 쓴 기사였다", "일주일간 온도를 재고 취재한 근거 있는 기사였고, 학교가 배식 방법을 바꾸는 변화로 이어졌다", "교장 선생님이 화를 내서 삭제되었다", "아무도 읽지 않아 잊혔다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "헌법이 정한 국민의 4대 의무로 알맞은 것은 무엇인가요?", "options": ["투표, 봉사, 저축, 운동의 의무", "독서, 청소, 급식, 등교의 의무", "효도, 우정, 정직, 근면의 의무", "납세, 국방, 교육, 근로의 의무"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "\"그럼 나한테는... 아무 권리도 없는 거야?\"라는 하진이의 물음이 겨레에게 깨닫게 한 것은 무엇인가요?", "options": ["나의 표현의 자유 곁에는 남의 명예와 마음을 지킬 책임이 함께 있다는 것", "하진이도 기자가 되고 싶어 한다는 것", "권리는 어른만 가진다는 것", "기사는 짧게 써야 한다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "급식 기사와 하진이 기사를 '같은 펜'으로 대비한 삼촌의 말이 뜻하는 것은 무엇인가요?", "options": ["펜은 비쌀수록 좋은 기사를 쓴다는 것", "급식 기사가 더 길었다는 것", "글이 도구가 될지 흉기가 될지는 쓰는 사람의 마음이 정한다는 것", "기사는 손으로 써야 한다는 것"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'기본권'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["학교에서 정한 학생의 규칙", "기자만 가지는 특별한 권리", "어른이 되면 생기는 권리", "모든 국민이 태어날 때부터 가지며 헌법이 보장하는 권리"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'정정 보도'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["가장 큰 글씨로 싣는 기사", "틀렸거나 지나쳤던 기사를 바로잡고 사과하는 보도", "정해진 날에만 내는 신문", "정치 소식만 다루는 보도"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "소식통이 검열도 폐간도 없이 살아남을 수 있었던 까닭을 짐작하면 무엇인가요?", "options": ["기자단이 스스로 책임의 약속을 만들어 자유를 지킬 힘을 보여 주었기 때문에", "하진이가 전학을 갔기 때문에", "교장 선생님이 신문을 좋아했기 때문에", "기사를 아주 조금만 쓰기로 했기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"권리와 책임은 동전의 양면이에요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["동전을 던져서 권리를 정한다는 뜻", "권리는 돈으로 살 수 있다는 뜻", "권리를 누리려면 그에 따르는 책임도 반드시 함께 져야 한다는 뜻", "권리와 책임은 서로 상관없다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "겨레가 선생님의 말 중 '앞말만 듣고 뒷말은 흘려들은' 것이 이야기에서 갖는 의미는 무엇입니까?", "options": ["겨레의 청력에 문제가 있다는 것", "자유만 취하고 책임을 놓친 데서 갈등이 싹텄다는 것", "선생님의 설명이 부족했다는 것", "뒷말이 중요하지 않았다는 것"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "하진이에게 사과할 때 겨레가 보인 태도로 옳은 것은 무엇입니까?", "options": ["세아가 시켜서 왔다고 밝혔다", "기사의 일부는 사실이라고 끝까지 주장했다", "선물을 주며 잊어 달라고 했다", "변명 없이 잘못을 인정하고, 정정 기사에 대해 하진이의 생각을 먼저 물었다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "기본권의 종류에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["기본권은 자유권 하나뿐이다", "평등권은 어른에게만 적용된다", "자유롭게 생활할 자유권, 차별 없이 대우받을 평등권, 인간답게 살 사회권 등이 있다", "사회권은 회사에 다니는 사람의 권리다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "소식통 셋째 호에 실린 내용으로 옳은 것은 무엇입니까?", "options": ["첫 면의 정정 보도와, 하진이가 수비의 주역이었다는 새 기사", "하진이를 비판하는 후속 기사", "겨레의 사임 발표", "체육대회 일정표"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'급식 기사의 영웅'에서 '친구를 울린 기자'로 사흘 만에 뒤바뀐 구성이 보여 주는 것은 무엇입니까?", "options": ["아이들의 변덕스러운 여론", "기자라는 자리의 인기", "같은 자유라도 책임과 함께 쓰이는지에 따라 결과가 정반대가 된다는 것", "신문 발행 주기의 문제"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'필통 속 동전'이라는 소재가 결말에서 하는 역할은 무엇입니까?", "options": ["권리와 책임을 늘 함께 살피겠다는 다짐을 일상의 습관으로 보여 주는 상징", "겨레의 저축 습관을 보여 주는 소재", "행운을 비는 미신의 소재", "동전 수집이라는 새 취미"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'검열'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["기사를 쓰기 전에 취재하는 일", "발표 전에 글이나 표현물을 권력이나 어른이 미리 검사해 막는 것", "신문을 배달하는 일", "기사의 맞춤법을 고치는 일"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'참정권'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["재판을 청구할 권리", "투표 등으로 정치에 참여할 수 있는 권리", "세금을 감면받을 권리", "교육을 받을 권리"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'펜이 칼보다 강하다면 칼보다 조심스럽게 다뤄야 한다'는 삼촌의 말에서 추론할 수 있는 것은 무엇입니까?", "options": ["글의 영향력이 클수록 그것을 쓰는 사람의 책임도 무거워진다", "펜은 위험하므로 어른만 써야 한다", "칼보다 펜이 더 비싸다", "기사는 힘센 사람이 써야 한다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'자유가 많아서가 아니라 책임이 모자라서 생긴 위기'라는 진단이 함축하는 해법을 추론하면 무엇입니까?", "options": ["신문을 폐간하는 것", "기사 수를 줄이는 것", "어른의 사전 검사를 강화하는 것", "자유를 줄이는 대신 스스로 책임을 세우는 것"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "겨레가 '자기 기사를 하진이의 눈으로 다시 읽는' 행위가 상징하는 성장의 핵심은 무엇인가?", "options": ["문장력의 향상", "기사 검토 절차의 확립", "독자층 분석 능력", "타인의 자리에서 자기 행동을 성찰하는 역지사지의 획득"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "세아라는 인물이 서사에서 수행하는 역할은 무엇인가?", "options": ["겨레의 경쟁자로서 갈등을 일으키는 역할", "겨레가 듣지 않은 '책임의 목소리'를 미리 들려주는 양심의 역할", "사건을 어른들에게 알리는 고발자의 역할", "웃음을 주는 감초 역할"], "correct": 1},

      {"gate": 4, "category": "내용일치", "question": "'소식통 기자의 약속'의 내용으로 옳은 것은 무엇인가?", "options": ["기사는 반드시 어른의 검사를 받는다", "특종을 가장 우선한다", "고치기 위해 쓰고 웃음거리로 만들지 않으며, 기사 속 사람의 마음을 먼저 생각하고, 틀리면 바로잡는다", "재미없는 기사는 싣지 않는다"], "correct": 2},

      {"gate": 7, "category": "내용어휘", "question": "'표현의 자유'에 대한 이 책의 관점으로 가장 적절한 것은 무엇인가?", "options": ["불편한 것을 드러내 세상을 나아지게 하는 소중한 권리이되, 타인의 명예를 지킬 책임과 함께 간다", "무엇이든 말할 수 있는 무제한의 권리", "기자라는 직업인에게만 주어지는 권리", "사실이기만 하면 어떤 표현도 정당화되는 권리"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'청구권'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["물건값을 깎아 달라고 요구할 권리", "세금을 걷을 수 있는 국가의 권리", "국가에 어떤 행위를 요구하는 권리로, 억울할 때 재판 등을 청구할 수 있는 권리", "회사에 취직할 권리"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'사실이니까 괜찮은 게 아니었어'라는 겨레의 사과가 함축하는 저널리즘 윤리를 추론하면 무엇인가?", "options": ["사실 보도는 언제나 면책된다", "사실이라도 목적이 조롱이고 결과가 상처라면 정당한 보도가 아니다", "기사는 사실 확인 없이 써도 된다", "독자의 웃음이 기사의 최고 가치다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「한 면만 가진 동전은 세상에 없지요.」라는 경구가 시민의 삶 전반에 시사하는 바를 추론하면 무엇인가?", "options": ["동전보다 지폐가 쓰기 편하다", "의무를 다하는 사람만 목소리를 낼 자격이 있다", "권리는 쓸수록 줄어든다", "참정권·청구권 등 어떤 권리를 행사하든 그 곁의 책임까지 함께 지는 것이 성숙한 시민의 자세다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '펜은 칼보다 무겁다' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'politics08',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'politics08',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
