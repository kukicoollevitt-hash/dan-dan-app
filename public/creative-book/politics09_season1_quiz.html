<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰 다 가질 수 없어서 — 다미의 저금통과 세 가지 소원 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작정치경제09/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "다미가 반짝이 카드에 한 달 용돈을 사흘 만에 다 써 버린 까닭은 무엇인가요?", "options": ["열풍에 휩쓸린 데다 전설 카드가 안 나오자 오기가 생겨서", "카드를 모아 팔면 돈이 되기 때문에", "친구에게 선물하려고", "엄마가 사 오라고 시켜서"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "'고르기의 달인' 할머니가 알려 준 비법은 무엇인가요?", "options": ["동전을 던져 정하는 것", "가장 싼 것부터 고르는 것", "'일 년 뒤의 나는 어느 쪽을 골랐기를 바랄까' 하고 물어보는 것", "어른에게 대신 골라 달라고 하는 것"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "'희소성'에 대한 아빠의 설명으로 알맞은 것은 무엇인가요?", "options": ["돈을 많이 벌면 사라지는 문제다", "아이들에게만 있는 문제다", "보석처럼 드문 물건을 부르는 말이다", "원하는 것은 끝이 없는데 돈·물건·시간은 한정되어 있으며, 나라도 똑같은 문제 앞에 있다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "다미가 선택을 계속 미룬 결과는 어떻게 되었나요?", "options": ["할머니가 자전거를 사 주셨다", "친구들이 표를 대신 사 주었다", "세일이 끝나 자전거를 놓치고, 놀이공원 자리도 다른 친구에게 넘어가 둘 다 잃었다", "세일 기간이 연장되어 문제가 해결되었다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "반짝이 카드 사건이 이야기에서 하는 역할은 무엇인가요?", "options": ["문방구 아저씨의 장사 수완을 보여 준다", "카드 모으기의 즐거움을 알려 준다", "쓰라린 수업료를 치르고 경제 공부를 시작하게 되는 출발점이 된다", "다미의 운이 나쁘다는 것을 보여 준다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "놀이공원 대신 제안한 한강 자전거 소풍이 보여 주는 것은 무엇인가요?", "options": ["적은 비용으로도 큰 만족을 얻는 효율적인 선택이 가능하다는 것", "놀이공원은 재미없는 곳이라는 것", "자전거가 놀이기구보다 빠르다는 것", "친구들이 돈이 없었다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'기회비용'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["기회가 올 때까지 기다리는 시간", "무언가를 고를 때 포기한 것들 중 가장 아까운 것", "물건을 살 기회를 잡는 데 드는 돈", "용돈에서 저금하는 돈"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'편익'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["물건을 사는 데 드는 돈", "편의점에서 파는 물건", "선택으로 얻는 기쁨과 만족", "편지를 주고받는 일"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "\"선택을 미루는 것도 사실은 선택이며, 가장 비싼 선택\"이라는 말의 뜻을 짐작하면 무엇인가요?", "options": ["시간은 기다려 주지 않는 자원이라, 미루는 동안 기회들이 사라져 더 큰 값을 치르게 된다는 뜻", "비싼 물건일수록 오래 고민해야 한다는 뜻", "미루면 물건값이 오른다는 뜻", "선택은 빠를수록 무조건 좋다는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"선택은 잃는 것이 아니라, 가장 소중한 것을 지키는 것이에요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["아무것도 고르지 않으면 아무것도 잃지 않는다는 뜻", "고르는 일은 포기가 아니라 나에게 가장 중요한 것을 골라 지켜 내는 일이라는 뜻", "소중한 것은 금고에 보관해야 한다는 뜻", "선택은 어른이 대신 해 주는 것이라는 뜻"], "correct": 1}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'용돈이 두 배가 되어도 똑같을 것'이라는 말이 다미의 문제를 진단한 방식은 무엇입니까?", "options": ["다미의 용돈이 실제로 적다는 것", "문제의 근원은 돈의 액수가 아니라 욕구의 무한함이라는 것", "다미가 저축을 싫어한다는 것", "물가가 계속 오른다는 것"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "용돈 기입장을 쓴 뒤 다미에게 생긴 변화로 옳은 것은 무엇입니까?", "options": ["용돈이 저절로 늘어났다", "군것질에 새는 돈이 보여 절반으로 줄이고 두 달간 삼만 오천 원을 모았다", "소원 목록을 전부 지웠다", "기입장 쓰기가 귀찮아 그만두었다"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "다미가 남긴 세 가지 소원으로 옳은 것은 무엇입니까?", "options": ["하늘색 자전거, 놀이공원 나들이, 할머니 칠순 선물", "스케치북, 자유이용권, 게임기", "자전거, 스케치북, 운동화", "용돈 인상, 카드, 놀이공원"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "이야기의 결말에서 세 가지 소원이 이루어진 방식으로 옳은 것은 무엇입니까?", "options": ["용돈이 올라 셋 다 원래대로 샀다", "칠순 선물을 포기하고 자전거와 놀이공원을 골랐다", "칠순 선물 봉투를 먼저 떼어 두고, 자전거를 샀으며, 놀이공원은 한강 소풍으로 모습을 바꾸었다", "할머니가 셋 다 사 주셨다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'세일 마감'과 '표 예매 마감'이 같은 주말에 겹치는 설정의 효과는 무엇입니까?", "options": ["다미의 불운을 강조한다", "자원(돈과 시간)의 한계 속에서 피할 수 없는 선택의 순간을 만들어 낸다", "가게 주인의 상술을 고발한다", "주말의 소중함을 알려 준다"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'오늘의 마음은 시끄럽지만, 일 년 뒤의 마음은 조용하고 정직하다'는 말이 가르치는 선택의 지혜는 무엇입니까?", "options": ["일 년 동안 결정을 미루라는 것", "조용한 곳에서 결정하라는 것", "남의 의견을 듣지 말라는 것", "눈앞의 충동에서 물러나 긴 시간의 눈으로 가치를 재어 보라는 것"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'합리적 선택'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["가장 싼 것을 고르는 선택", "남들이 많이 고르는 것을 따르는 선택", "얻는 편익이 치르는 비용보다 클 때 신중하게 고르는 선택", "가장 빨리 결정하는 선택"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'충동'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["깊이 따져 보지 않고 갑자기 무언가를 하고 싶어지는 마음", "오랫동안 계획한 소원", "두 가지가 부딪치는 것", "힘차게 달리는 것"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'나라도 도로를 넓힐지 학교를 지을지 골라야 한다'는 말에서 추론할 수 있는 것은 무엇입니까?", "options": ["나라는 돈이 부족한 가난한 조직이다", "도로보다 학교가 언제나 중요하다", "나라는 세금을 더 걷으면 모든 문제를 해결할 수 있다", "희소성과 선택의 문제는 개인부터 국가까지 모든 경제 주체에게 적용된다"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "'이 자전거에는 포기한 놀이공원의 값이 담겨 있어서 더 소중하다'는 문장이 함축하는 바를 추론하면 무엇입니까?", "options": ["자전거 가격에 놀이공원 표값이 포함되었다", "기회비용을 치르고 얻은 것이기에 그 가치를 더 깊이 알게 된다", "놀이공원에 못 간 것이 두고두고 아깝다", "자전거는 비쌀수록 소중하다"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "다미의 경제적 성장 과정을 단계로 정리한 것으로 가장 적절한 것은 무엇인가?", "options": ["저축 → 투자 → 소비 → 기부", "충동 소비의 실패 → 기록과 절약 → 선택의 갈등과 회피의 대가 → 우선순위에 따른 합리적 선택", "용돈 인상 요구 → 협상 → 타결", "목록 작성 → 전부 구매 → 만족"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "할머니가 '사십 년 된 살림 장부'를 꺼내 보인 것의 의미로 가장 적절한 것은 무엇인가?", "options": ["선택의 지혜가 오랜 생활의 경험에서 벼려진 것임을 보여 준다", "할머니의 부유함을 자랑한다", "오래된 물건의 소중함을 가르친다", "장부 쓰는 법을 가르치려는 것이다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "기회비용과 편익에 대한 설명으로 옳은 것은 무엇인가?", "options": ["기회비용은 물건의 가격표와 같은 말이다", "편익은 언제나 돈으로 계산된다", "좋은 선택은 얻는 편익이 기회비용보다 큰 선택이다", "기회비용은 포기한 모든 것의 합계다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "다미가 치른 '무선택의 대가'로 옳은 것은 무엇인가?", "options": ["용돈이 깎였다", "친구들과 다투어 절교했다", "저금통의 돈을 도둑맞았다", "세일 종료로 자전거 기회를, 예매 마감으로 놀이공원 자리를 동시에 잃었다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'소원 목록 뒷면까지 빼곡'한 도입과 '목록이 밉지 않다'는 결말의 대비가 보여 주는 변화는 무엇인가?", "options": ["욕구를 원망의 대상에서, 선택으로 다스릴 수 있는 삶의 에너지로 받아들이게 된 것", "소원의 수가 줄어든 것", "소원이 모두 이루어진 것", "목록 쓰기를 그만둔 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'만 원을 두 배처럼 쓰는 공부'라는 아빠의 말이 예고하는 이 책의 주제는 무엇인가?", "options": ["돈을 두 배로 불리는 투자 기술", "용돈 인상 협상의 기술", "소득을 늘리는 것이 아니라 한정된 자원을 지혜롭게 배분하는 법", "절약만이 미덕이라는 교훈"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'희소성(稀少性)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["물건이 낡아 값이 떨어지는 성질", "무한한 욕구에 비해 그것을 채울 자원이 한정되어 있는 상태", "돈이 시간이 지나며 가치를 잃는 현상", "보석처럼 아름다운 성질"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'경제 활동'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["은행에서 하는 일만을 가리키는 말", "회사원이 하는 일", "기업이 이윤을 남기는 활동만을 가리키는 말", "생활에 필요한 것을 사고 쓰고 만드는, 일상 속의 모든 경제적 행위"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'표는 깔끔해졌는데 마음은 깔끔해지지 않은' 상황이 합리적 선택에 대해 시사하는 바를 추론하면 무엇인가?", "options": ["표 그리기는 시간 낭비다", "계산과 분석 위에, 자신이 진정 원하는 가치에 대한 성찰이 더해져야 선택이 완성된다", "마음이 시키는 대로 즉시 결정해야 한다", "선택은 논리로만 이루어진다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「잘 고른 하나는 다 가진 것보다 오래 빛나지요.」라는 경구의 함의로 가장 적절한 것은 무엇인가?", "options": ["소유의 양이 아니라 선택의 질이 만족의 깊이를 결정한다", "하나만 사면 돈이 남는다", "모든 것을 가지는 일은 불행하다", "빛나는 물건을 골라야 한다"], "correct": 0}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '다 가질 수 없어서' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'politics09',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'politics09',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
