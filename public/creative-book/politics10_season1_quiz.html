<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏪 레모네이드 한 잔은 얼마일까 — 새콤이 가판의 여름 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작정치경제10/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "재하가 첫 장사에서 레모네이드 값을 삼천 원으로 정한 까닭은 무엇이었나요?", "options": ["엄마 카페의 값을 따라 해서", "그냥 많이 남기고 싶은 욕심에서", "손님들에게 물어보고 정해서", "재료비가 삼천 원이라서"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "\"장사는 결국 운\"이라며 준영이가 포기하려 할 때, 재하가 한 일은 무엇인가요?", "options": ["더 좋은 자리로 옮겨 달라고 부탁했다", "같이 장사를 그만두었다", "다른 친구를 새 동업자로 구했다", "구경하는 사람의 눈으로 장터를 돌며 잘되는 가게들의 비결을 살폈다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "'천 원의 대소동'의 결과로 알맞은 것은 무엇인가요?", "options": ["서른 잔이 매진되었지만 재료비가 더 들어 이천 원 손해를 보았다", "한 잔도 팔지 못했다", "가장 큰 이익을 남겼다", "값이 싸다고 손님들이 의심해 안 사 갔다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "이십 년을 버틴 붕어빵 할아버지의 비결은 무엇이었나요?", "options": ["가장 싼 값으로 파는 것", "이십 년째 같은 붕어빵만 파는 것", "여름엔 팥빙수를 파는 등, 계절 따라 파는 것 자체를 바꾸는 것", "목 좋은 자리를 지키는 것"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "예보에 없던 비로 여든 잔 중 아홉 잔만 팔린 사건이 알려 주는 것은 무엇인가요?", "options": ["일기예보는 믿으면 안 된다는 것", "장사는 여름에만 해야 한다는 것", "레모네이드는 인기가 없다는 것", "수요는 가격만이 아니라 날씨·계절 같은 여러 바람에 따라 출렁인다는 것"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "마지막 두 번의 장터에서 새콤이가 흑자를 낸 비결은 무엇인가요?", "options": ["옆 가게보다 값을 확 내려서", "균형 가격은 지키면서, 날씨에 맞춰 파는 것을 바꾸었기 때문에(폭염엔 얼음 두 배, 비 오면 꿀레몬차)", "광고지를 많이 돌려서", "장사 시간을 두 배로 늘려서"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'수요'와 '공급'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["수요는 물건값, 공급은 물건 수이다", "수요는 파는 사람, 공급은 사는 사람이다", "사고 싶어 하는 마음이 수요, 팔려고 내놓는 것이 공급이다", "수요는 여름, 공급은 겨울에만 생긴다"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'균형'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["사려는 양과 팔려는 양이 딱 맞아떨어지는 자리", "저울이 한쪽으로 기우는 것", "값을 절반으로 나누는 것", "팔다 남은 물건의 양"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "옆에 어른의 에이드 가게가 생겼을 때, 값을 천 원으로 내리지 않은 것이 잘한 선택인 까닭은 무엇인가요?", "options": ["천 원으로는 팔수록 손해라서, 균형을 버리고 허둥대면 오히려 무너지기 때문에", "옆 가게가 금방 망할 것이기 때문에", "손님들은 값에 관심이 없기 때문에", "값을 바꾸는 것이 귀찮기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"사려는 마음과 팔려는 마음이 만나는 곳에서, 시장은 균형을 찾아요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["시장은 큰 건물 안에 있어야 한다는 뜻", "팔려는 마음이 언제나 이긴다는 뜻", "가격은 한쪽의 욕심이 아니라 수요와 공급이 만나는 자리에서 정해진다는 뜻", "사는 사람이 값을 마음대로 정한다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'계산기 속 세상'과 '진짜 시장'의 차이를 재하가 깨달아 가는 과정으로 옳은 것은 무엇입니까?", "options": ["가격 실험과 실패를 거치며, 계산기에는 없는 '손님의 마음'을 읽게 되었다", "계산을 더 정확하게 하는 법을 배웠다", "계산기를 버리고 감으로 장사하게 되었다", "장사를 포기하고 공부만 하게 되었다"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "엄마의 교육 방식으로 가장 적절한 것은 무엇입니까?", "options": ["장사 대신 책으로 공부하게 했다", "정답 가격을 처음부터 알려 주었다", "직접 부딪혀 실패한 뒤에, 그 경험을 개념으로 정리해 주고 다음 실험을 하게 했다", "손해가 나지 않게 돈을 보태 주었다"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "새콤이의 가격 실험 결과로 옳은 것은 무엇입니까?", "options": ["천오백 원일 때 마흔 잔을 팔아 처음으로 만 오천 원의 이익을 냈다", "삼천 원일 때 가장 많이 팔렸다", "천 원일 때 가장 큰 이익이 났다", "가격과 판매량은 아무 관계가 없었다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "수요 법칙과 공급 법칙에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["값이 오르면 사려는 양도 늘어난다", "값이 오르면 사려는 양은 줄고(수요 법칙), 팔려는 양은 늘어난다(공급 법칙)", "값이 내리면 팔려는 양이 늘어난다", "두 법칙은 같은 방향으로 움직인다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'파는 사람의 눈'에서 '구경하는 사람의 눈'으로 바꿔 장터를 본 장면이 전환점이 되는 이유는 무엇입니까?", "options": ["쉬면서 체력을 회복했기 때문", "자기 가판에 갇혀 있던 시야를 벗어나, 시장 전체와 손님의 마음을 읽게 되었기 때문", "다른 가게의 약점을 찾아냈기 때문", "관리 아저씨와 친해졌기 때문"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "이야기가 '두 잔의 굴욕'에서 시작해 '비 오는 날의 흑자'로 끝나는 구성의 효과는 무엇입니까?", "options": ["가장 나쁜 조건(비)마저 이겨 낸 변화를 통해 배움의 완성을 보여 준다", "날씨의 중요성만 강조한다", "굴욕은 시간이 지나면 잊힌다는 것을 보여 준다", "레모네이드보다 레몬차가 맛있다는 것을 보여 준다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'매출'과 '흑자'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["매출은 판 물건의 수, 흑자는 남은 물건의 수", "매출은 물건을 판 돈이고, 흑자는 번 돈이 쓴 돈보다 많은 상태다", "매출은 손해, 흑자는 이익과 같은 말이다", "매출과 흑자는 같은 말이다"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'생산자'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["물건을 사서 쓰는 사람", "시장을 관리하는 사람", "돈을 빌려주는 사람", "물건이나 서비스를 만들어 파는 사람"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'제철 과일은 나오는 양이 많아 값이 싸다'는 말에서 추론할 수 있는 원리는 무엇입니까?", "options": ["공급이 늘어나면 가격이 내려간다", "과일은 계절과 상관없이 값이 같다", "제철 과일은 맛이 없어서 싸다", "수요가 늘면 값이 내려간다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "내년에는 '메뉴를 미리 두 개 준비하겠다'는 재하의 계획에서 추론할 수 있는 배움은 무엇입니까?", "options": ["메뉴가 많을수록 무조건 잘 팔린다", "시장의 변화(날씨·수요)를 예측하고 공급을 준비하는 능동적 태도", "한 가지를 오래 파는 것이 최고라는 교훈", "장사는 준비물이 많아야 한다는 교훈"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'많이 남기고 싶어서 삼천 원'이라는 재하의 첫 가격 결정이 실패한 근본 원인은 무엇인가?", "options": ["레모네이드의 품질이 낮았기 때문", "가격을 판매자의 욕심으로만 정하고, 구매자의 지불 의사를 고려하지 않았기 때문", "가판의 위치가 나빴기 때문", "간판 디자인이 눈에 띄지 않았기 때문"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "준영이의 '운 탓'과 재하의 '아직 답을 못 찾았을 뿐'이라는 두 태도의 대비가 보여 주는 것은 무엇인가?", "options": ["실패를 통제 불가능한 운으로 돌리는 태도와, 배울 수 있는 문제로 보는 태도의 차이", "동업은 반드시 깨진다는 교훈", "성격이 다르면 친구가 될 수 없다는 것", "운도 실력이라는 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "새콤이가 겪은 시장의 변수들로 옳은 묶음은 무엇인가?", "options": ["세금, 임대료, 인건비", "가격 실패, 예보에 없던 비(수요 변화), 경쟁 가게의 등장(공급 증가)", "도난, 화재, 정전", "원료 값 폭등, 환율, 유행"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "마지막 장터에서 새콤이가 한 일로 옳은 것은 무엇인가?", "options": ["옆 가게와 손잡고 함께 팔았다", "값을 두 배로 올렸다", "비 오는 날에 맞춰 따뜻한 꿀레몬차를 같은 균형 가격에 팔아 흑자를 냈다", "마지막 날이라 공짜로 나눠 주었다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'가위표처럼 만나는 두 선' 그림이 압축하고 있는 경제 원리는 무엇인가?", "options": ["우하향하는 수요 곡선과 우상향하는 공급 곡선이 만나는 점에서 균형 가격이 형성된다는 것", "가격은 시간이 지나면 반드시 오른다는 것", "공급이 수요를 항상 이긴다는 것", "그래프는 실제 장사와 무관하다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'시장은 살아 움직여요. 그래서 어렵고, 그래서 재미있어요.'라는 재하의 말이 요약하는 시장관은 무엇인가?", "options": ["시장은 운에 좌우되는 도박판이다", "시장은 수학 공식으로 완전히 예측된다", "시장은 강자만 살아남는 정글이다", "시장은 수많은 사람의 마음이 상호 작용하며 끊임없이 변하는 생태계다"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'균형 가격'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["정부가 정해 주는 공정한 가격", "수요량과 공급량이 일치하는 지점에서 형성되는 가격", "원가에 이윤을 더한 가격", "경쟁 가게보다 조금 싼 가격"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'동업(同業)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["같은 물건을 파는 경쟁 관계", "한 사람이 여러 가게를 여는 것", "둘 이상이 함께 자본과 노력을 모아 사업을 하는 것", "남의 가게에서 일해 주는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'매진인데 손해'라는 역설이 가르치는 경영의 원리를 추론하면 무엇인가?", "options": ["매진은 언제나 성공의 증거다", "손해는 홍보 비용으로 생각해야 한다", "판매량이 아니라 수입과 비용의 차이(이익)가 사업의 지속 가능성을 결정한다", "재료비는 아끼면 아낄수록 좋다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "'가격표 뒤에 숨은 이야기가 읽힌다'는 재하의 말이 함축하는 경제적 안목을 추론하면 무엇인가?", "options": ["가격표에는 오타가 많다는 것", "모든 가격은 수요와 공급, 계절과 비용 같은 힘들이 밀고 당긴 결과물이라는 것", "비싼 물건이 언제나 좋은 물건이라는 것", "가격은 상인이 마음대로 정한 숫자라는 것"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '레모네이드 한 잔은 얼마일까' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'politics10',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'politics10',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
