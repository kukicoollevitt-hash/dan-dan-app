<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏦 잠들지 않는 돈 — 은호의 첫 통장 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작정치경제11/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "세뱃돈 십만 원을 양말 속에 숨긴 뒤 은호에게 생긴 일은 무엇인가요?", "options": ["돈이 저절로 불어났다", "동생과 사이가 좋아졌다", "돈을 금방 다 써 버렸다", "돈은 아무 일도 하지 않고, 은호의 걱정만 커져 도둑 꿈까지 꾸었다"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "\"저축은 바보들이나 하는 거야\"라던 태오는 이야기의 끝에서 어떻게 달라졌나요?", "options": ["사촌 형의 코인이 반토막 났다는 소식과 함께, 자기도 통장을 만들었다고 말했다", "코인으로 큰돈을 벌어 자랑했다", "은호에게 투자를 다시 권했다", "전학을 가서 소식이 끊겼다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "은행이 하는 일에 대한 정 선생님의 설명으로 알맞은 것은 무엇인가요?", "options": ["맡긴 돈을 금고에 그대로 보관만 한다", "돈을 찍어 내는 곳이다", "여러 사람이 맡긴 돈을 필요한 사람에게 빌려주고, 이자의 일부를 맡긴 사람에게 나눠 준다", "돈을 맡기면 보관료를 받는다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "은호가 풀어낸 '돈이 하는 세 가지 일'은 무엇인가요?", "options": ["벌기, 쓰기, 빌리기", "저축, 투자, 도박", "일하기, 쉬기, 자라기", "교환의 수단, 가치의 척도, 가치의 저장"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "십오만 원을 다 모았는데 키보드가 십칠만 원이 되어 있던 사건이 알려 주는 것은 무엇인가요?", "options": ["물가가 오르면 같은 돈으로 살 수 있는 것이 줄어드는, 저축의 약점이 있다는 것", "악기점 아저씨가 욕심쟁이라는 것", "키보드는 사지 말라는 것", "저축은 아무 소용이 없다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "삼천 원짜리 게임 아이템이 일주일 만에 천오백 원이 된 사건이 가르쳐 준 것은 무엇인가요?", "options": ["게임은 나쁜 것이라는 것", "아이템은 오래 두면 오른다는 것", "투자는 높은 수익을 기대할 수 있지만 그만큼 잃을 위험도 함께 있다는 것", "삼천 원은 작은 돈이라는 것"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'이자'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["은행에 내는 수수료", "돈을 빌려주거나 맡긴 대가로 받는 돈", "통장을 만들 때 내는 돈", "저금통에 모은 돈"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'물가 상승'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["물의 값만 오르는 것", "물건값이 올라 같은 돈으로 살 수 있는 것이 줄어드는 것", "월급이 오르는 것", "은행 이자가 오르는 것"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "\"지킬 돈은 저축으로, 불릴 돈은 공부한 만큼만 투자로\"라는 말의 뜻을 짐작하면 무엇인가요?", "options": ["저축과 투자는 적이 아니므로, 안전과 위험을 저울질하며 나누어 다루라는 뜻", "돈이 많은 사람만 투자하라는 뜻", "공부를 잘해야 부자가 된다는 뜻", "저축은 절반만 하라는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"다룰 줄 아는 사람이 돈의 주인이 돼요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["돈이 많은 사람이 주인이라는 뜻", "돈을 무서워하지도 얕보지도 않고 지혜롭게 다루는 사람이 돈에 휘둘리지 않는다는 뜻", "은행에 다니는 사람이 주인이라는 뜻", "돈을 쓰지 않는 사람이 주인이라는 뜻"], "correct": 1}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "은호의 돈 공부가 발전해 간 순서로 가장 적절한 것은 무엇입니까?", "options": ["투자 → 도박 → 저축 → 포기", "양말 속 보관 → 통장과 저축 → 물가·투자의 시련 → 균형 잡힌 계획으로 목표 달성", "용돈 협상 → 아르바이트 → 사업", "저축 → 대출 → 상환"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "용돈 기입장의 '웃는 얼굴 낙서'를 보고 코끝이 시큰해진 은호의 마음으로 가장 적절한 것은 무엇입니까?", "options": ["낙서를 지우고 싶은 부끄러움", "그동안의 노력이 헛일이 된 것 같은 속상함과 그 시간에 대한 애틋함", "이자를 더 받고 싶은 아쉬움", "기입장을 새로 사고 싶은 마음"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "화폐의 역사에 대한 할아버지의 설명으로 옳은 것은 무엇입니까?", "options": ["물물 교환에서 시작해 조개껍데기·엽전·지폐를 거쳐 카드까지 왔지만, 돈이 하는 일은 같다", "돈은 처음부터 종이돈이었다", "엽전은 장난감이었다", "카드는 돈이 아니다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "은호의 새 계획 세 가지로 옳은 것은 무엇입니까?", "options": ["용돈 인상 요구, 코인 투자, 복권 구매", "군것질 끊기, 게임 끊기, 일찍 자기", "목표 날짜 늘리기, 이자를 더 주는 어린이 적금 갈아타기, 알뜰장터에서 장난감 팔기", "은행 바꾸기, 통장 두 개 만들기, 저금통 사기"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'양말 속 돈'과 '통장 속 돈'의 대비가 보여 주는 핵심은 무엇입니까?", "options": ["양말은 보관에 나쁜 장소라는 것", "고여 있는 돈은 걱정만 낳지만, 금융을 통해 흐르는 돈은 세상에서 일을 한다는 것", "은행 금고가 옷장보다 튼튼하다는 것", "현금보다 카드가 편리하다는 것"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "아빠가 자신의 투자 실패담을 들려준 것의 효과는 무엇입니까?", "options": ["아빠의 실수를 자랑하는 것", "투자를 절대 하지 말라는 경고", "은호의 실패를 나무라는 것", "실패는 누구나 겪는 수업료임을 보여 주며, 위험을 아는 투자의 자세를 가르친 것"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'금융'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["금으로 만든 돈", "돈을 맡기고 빌려주며 돈이 흘러 다니게 하는 활동", "외국 돈으로 바꾸는 일", "돈을 세는 기술"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'자산'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["빌린 돈의 총액", "은행이 가진 돈", "돈이나 물건, 경험처럼 가치를 지닌 재산", "매달 나가는 생활비"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'남의 말만 듣고 하는 것은 투자가 아니라 도박'이라는 말에서 추론할 수 있는 투자의 조건은 무엇입니까?", "options": ["스스로 공부하고 이해한 범위 안에서 위험을 감수해야 한다", "이길 확률이 높은 쪽에 걸어야 한다", "남보다 빨리 사고 빨리 팔아야 한다", "큰돈으로 해야 성공한다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'실패의 경험까지 전부 자산'이라는 정 선생님의 말이 함축하는 바를 추론하면 무엇입니까?", "options": ["실패는 반복할수록 좋다", "실패한 돈은 돌려받을 수 있다", "자산은 돈으로만 계산된다", "돈을 다루는 지혜는 성공만이 아니라 잃어 본 경험에서도 쌓인다"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'돈의 주인'이라는 결말의 표현이 뜻하는 은호의 최종 상태로 가장 적절한 것은 무엇인가?", "options": ["돈에 대한 두려움도 맹신도 없이, 목적에 맞게 돈을 부리는 주체가 된 상태", "십만 원보다 큰돈을 갖게 된 상태", "은행의 우수 고객이 된 상태", "투자로 큰 수익을 낸 상태"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "정 선생님이 '어린이 경제 교실'에서 저울 그림을 그린 의도는 무엇인가?", "options": ["은행 저울의 정확함을 자랑하려고", "저축의 무게가 더 무겁다는 것을 보이려고", "돈의 무게를 재는 법을 가르치려고", "저축과 투자를 대립이 아닌, 안전과 수익 사이의 균형 문제로 보게 하려고"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "화폐의 세 가지 기능에 대한 설명으로 옳은 것은 무엇인가?", "options": ["벌기·쓰기·모으기의 세 기능이 있다", "교환의 수단, 가치의 척도, 가치의 저장의 기능을 하며, 물가가 오르면 저장된 가치가 새어 나간다", "화폐의 기능은 시대마다 완전히 달라진다", "가치의 저장 기능은 카드 시대에 사라졌다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "저축과 투자의 특성 비교로 옳은 것은 무엇인가?", "options": ["저축은 위험하고 투자는 안전하다", "둘 다 원금 손실의 위험이 같다", "저축은 안전하지만 물가 상승기에 실질 가치가 줄 수 있고, 투자는 수익 기대가 크지만 손실 위험도 크다", "저축은 부자만, 투자는 서민만 한다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'할아버지의 보물 상자'(화폐의 역사)가 서사 초반에 배치된 구성적 효과는 무엇인가?", "options": ["할아버지의 수집 취미를 소개하는 것", "골동품의 가치를 알려 주는 것", "옛날 돈의 아름다움을 감상하게 하는 것", "돈의 본질(변하지 않는 기능)에 대한 물음을 던져, 이후 경험들이 그 답을 채워 가게 하는 것"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "'물가와의 달리기'라는 은유가 표현하는 경제 현상은 무엇인가?", "options": ["저축의 증가 속도와 물가 상승 속도가 경주하듯 실질 구매력을 좌우하는 것", "은행 창구의 빠른 일 처리", "돈이 은행 사이를 오가는 속도", "달리기 선수의 몸값이 오르는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'적금'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["필요할 때마다 자유롭게 넣고 빼는 통장", "기간을 정해 꾸준히 돈을 넣어 목돈을 만드는 저축 상품", "주식에 돈을 넣는 것", "은행이 기업에 빌려주는 돈"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'수익'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["투자나 사업으로 얻는 이익", "물건을 산 값", "은행에 맡긴 원금", "매달 내는 세금"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'게임 아이템이 흔해지자 값이 반토막 났다'는 경험이 담고 있는 경제 원리를 추론하면 무엇인가?", "options": ["게임 회사의 잘못으로 생긴 예외적 사건이다", "공급이 늘어나면 가치(가격)가 떨어진다", "아이템은 시간이 지나면 반드시 오른다", "가상의 물건에는 가격이 없다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「돈은 잠들지 않아요. 흐르며 일하지요.」라는 경구가 금융의 사회적 역할에 대해 시사하는 바를 추론하면 무엇인가?", "options": ["돈은 밤에도 거래되는 시장이 있다", "현금은 언제나 은행에 맡겨야 안전하다", "모아진 돈이 필요한 곳으로 흘러가 가게와 집을 짓는 등 사회 곳곳의 활동을 돌게 한다", "돈을 많이 찍을수록 경제가 성장한다"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '잠들지 않는 돈' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'politics11',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'politics11',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
