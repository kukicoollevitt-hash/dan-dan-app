<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏭 된장 공장의 비밀 장부 — 정직이라는 원료 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작정치경제12/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "\"우리도 반값으로 팔면 되잖아요\"라는 노을이의 말에 할아버지가 한 대답은 무엇이었나요?", "options": ["반값으로 팔면 금방 부자가 된다고 했다", "싸다장을 경찰에 신고하겠다고 했다", "값을 반으로 줄이려면 무언가를 버려야 하는데, 아직 버릴 것을 못 찾았다고 했다", "공장을 곧 닫겠다고 했다"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "\"소비자들은 어차피 모릅니다\"라며 재료를 속이자는 거래처의 제안에 할아버지는 어떻게 했나요?", "options": ["모르니까 더 안 된다며 거절하고, 정직한 윤리 경영의 길을 지켰다", "상표만 바꾸어 받아들였다", "고민해 보겠다며 답을 미루었다", "반만 받아들이기로 했다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "견학에서 배운 기업이 하는 일로 알맞은 것은 무엇인가요?", "options": ["세금을 걷어 학교를 짓는다", "물건값을 정해 발표한다", "마을의 규칙을 만든다", "생산으로 필요한 것을 공급하고, 일자리와 소득을 만들고, 세금을 내어 사회를 돕는다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "하천의 물고기가 죽은 진짜 까닭은 무엇이었나요?", "options": ["된장 공장이 장 담근 물을 버려서", "여름 무더위에 물이 뜨거워져서", "누군가 약을 풀어서", "싸다장 공장이 폐수 처리 비용을 아끼려고 더러운 물을 몰래 버려서"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "달빛 아래에서 팔리지도 않는 된장 독을 닦는 할아버지의 모습이 보여 주는 것은 무엇인가요?", "options": ["형편이 흔들려도 자기 할 일을 지키는 정직한 기업가의 자세", "잠이 오지 않는 걱정 많은 성격", "독을 팔아 돈을 마련하려는 계획", "청소를 좋아하는 부지런함"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "진실이 밝혀진 뒤 '소비자들의 선택이 달라졌다'는 결말이 보여 주는 것은 무엇인가요?", "options": ["소비자는 언제나 싼 것을 고른다는 것", "비싼 물건이 무조건 좋다는 것", "어느 기업의 물건을 고르느냐는 소비자의 힘이 어떤 기업이 살아남을지를 정한다는 것", "신문 기사가 제일 힘이 세다는 것"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'이윤'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["공장에서 일하고 받는 월급", "판 돈에서 들어간 비용을 뺀, 기업이 벌어들이는 이익", "물건을 만들 때 드는 재료비", "나라에 내는 세금"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "기업의 '사회적 책임'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["이윤을 최대한 많이 남길 책임", "환경을 보호하고 직원을 존중하며 지역 사회에 도움이 되어야 할 책임", "광고를 많이 할 책임", "물건값을 올리지 않을 책임"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "\"신뢰는 쌓는 데 삼십 년이 걸리지만 무너지는 건 한순간\"이라는 말의 뜻을 짐작하면 무엇인가요?", "options": ["오랜 정직으로 쌓은 믿음도 한 번의 속임으로 잃을 수 있으니 지켜야 한다는 뜻", "삼십 년이 지나면 신뢰는 저절로 생긴다는 뜻", "신뢰보다 빠른 장사가 중요하다는 뜻", "무너진 신뢰는 삼십 년 뒤에 돌아온다는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"기업은 이윤을 먹고 자라지만, 신뢰 위에서만 오래 살아요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["기업은 은행 위에 세워야 한다는 뜻", "이윤이 없어도 기업은 살 수 있다는 뜻", "오래된 기업일수록 이윤이 많다는 뜻", "이윤도 필요하지만, 정직으로 쌓은 믿음이 있어야 기업이 오래갈 수 있다는 뜻"], "correct": 3}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "노을이의 '여름 숙제'였던 수수께끼의 답이 밝혀지는 과정으로 옳은 것은 무엇입니까?", "options": ["할아버지가 처음부터 답을 알려 주었다", "맛·성분 비교로 '재료와 시간'을, 하천 추적으로 '환경 비용의 떠넘김'을 차례로 밝혀냈다", "싸다장 사장이 스스로 고백했다", "선생님이 수업 시간에 알려 주었다"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "막내 아주머니의 사표와 복귀 이야기가 보여 주는 것은 무엇입니까?", "options": ["직원은 언제든 바꿀 수 있다는 것", "이직은 나쁜 선택이라는 것", "공장 일은 힘들다는 것", "기업의 흥망이 직원 가족의 생계와 직접 이어져 있다는 것"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "해맑은 된장과 싸다장 된장의 차이로 옳은 것은 무엇입니까?", "options": ["해맑은 된장은 국산 콩으로 삼 년을 기다리지만, 싸다장은 수입 콩과 첨가물로 몇 달 만에 만들었다", "싸다장이 더 좋은 콩을 썼다", "두 된장은 성분이 똑같았다", "해맑은 된장에 첨가물이 더 많았다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "진실이 밝혀진 뒤 해맑은 공장에 일어난 일로 옳은 것은 무엇입니까?", "options": ["공장을 더 큰 도시로 옮겼다", "값을 반으로 내렸다", "주문이 돌아오고 직원이 복귀했으며, 하천 살리기 성금과 어린이 견학 프로그램을 시작했다", "싸다장을 인수했다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'반값'의 비밀이 세 겹(재료·시간·폐수)으로 벗겨지는 구성의 효과는 무엇입니까?", "options": ["싸다장의 기술력을 부각한다", "이야기를 길게 늘이기 위한 장치다", "반값 물건은 모두 나쁘다는 결론을 내린다", "싼 가격 뒤에 숨은 비용이 결국 누군가에게 떠넘겨져 있음을 단계적으로 드러낸다"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "'노을이의 독'이라는 새 장독이 결말에서 상징하는 것은 무엇입니까?", "options": ["정직과 기다림의 가치가 다음 세대로 이어진다는 것", "노을이가 사장이 되었다는 것", "장독의 개수가 늘었다는 것", "삼 년 뒤 된장값이 오른다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'윤리 경영'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["이윤을 가장 앞세우는 경영", "직원 없이 혼자 하는 경영", "정직하게 장사하고 법을 지키며 기업을 운영하는 것", "광고에 돈을 아끼지 않는 경영"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'폐수'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["공장 등에서 쓰고 버리는 더러운 물", "바다로 흐르는 강물", "마시고 남은 물", "빗물이 모인 물"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "싸다장이 폐수를 몰래 버린 행동과 '반값'의 관계를 추론하면 무엇입니까?", "options": ["폐수와 가격은 아무 관련이 없다", "폐수 처리에 들어가야 할 비용을 아껴 값을 낮췄으니, 그 대가를 마을의 하천과 이웃이 대신 치른 셈이다", "폐수를 버리면 된장 맛이 좋아진다", "반값 판매로 번 돈으로 하천을 청소하려 했다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "'상표 뒷면부터 보는 버릇'이 생긴 노을이의 변화가 시사하는 소비자의 자세를 추론하면 무엇입니까?", "options": ["무엇을 어떻게 만들었는지 따져 보고 선택하는 깨어 있는 소비가 좋은 기업을 키운다", "비싼 물건만 골라 사야 한다", "상표가 유명한 것만 사야 한다", "성분표는 어른만 보면 된다"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "\"정직이 밥 먹여 줘요?\"라는 노을이의 물음에 대한 할아버지의 대답(장독의 비유)이 담고 있는 경영 철학은 무엇인가?", "options": ["신뢰는 된장처럼 오랜 시간 발효되는 자산이며, 속임수는 기업의 정체성 자체를 바꿔 버린다는 것", "정직보다 생존이 우선이라는 것", "된장은 오래 묵힐수록 비싸진다는 것", "밥은 정직과 무관하다는 것"], "correct": 0},

      {"gate": 3, "category": "내용일치", "question": "기업이 마을과 맺는 관계에 대한 이 책의 설명으로 옳은 것은 무엇인가?", "options": ["기업은 마을과 무관하게 이윤만 추구하면 된다", "기업의 세금은 국가에만 쓰인다", "직원의 소득이 마을 가게에서 돌고, 세금이 학교와 도로가 되는 등 기업은 지역과 한 몸으로 산다", "기업은 마을에 기부만 하면 책임을 다한 것이다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "싸다장 사건의 결말로 옳은 것은 무엇인가?", "options": ["증거 부족으로 무혐의 처리되었다", "사과문 발표로 마무리되었다", "해맑은 공장에 인수되었다", "무거운 벌금과 함께 생산 중지 처분을 받았다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'삼십 년 이웃의 서늘해진 눈길'(소문)과 '돌아와 고개 숙인 이웃들'(진실)의 대비가 다루는 주제는 무엇인가?", "options": ["시골 인심의 각박함", "여론의 취약함과, 사실 확인 없이 기우는 판단의 위험", "소문은 시간이 해결해 준다는 것", "이웃 간의 경쟁심"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'우리 공장의 비밀 원료: 정직'이라는 발표 화면이 압축하는 이 책의 주제는 무엇인가?", "options": ["원료 배합비는 기업 비밀이라는 것", "정직이라는 보이지 않는 가치가 제품과 기업의 지속 가능성을 만드는 핵심 요소라는 것", "비밀이 많은 기업이 성공한다는 것", "된장의 주원료는 콩이라는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'기업(企業)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["세금을 걷는 국가 기관", "이웃을 돕는 자선 단체", "공무원들이 일하는 조직", "물건이나 서비스를 생산·판매하여 이윤을 얻는 조직"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "기업의 '사회적 책임'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["이윤 추구를 넘어 환경 보호, 직원 존중, 지역 사회 기여까지 감당해야 할 기업의 책무", "적자를 내지 않을 책임", "경쟁 기업을 도울 책임", "주주에게 배당할 책임"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'이윤만 좇던 기업이 제가 버린 것에 발목을 잡혔다'는 서술이 함축하는 교훈을 추론하면 무엇인가?", "options": ["폐수 처리 기술이 부족하면 기업을 하면 안 된다", "운이 나쁜 기업은 망한다", "외부에 떠넘긴 비용은 사라지지 않고 결국 기업 자신에게 되돌아온다", "벌금 제도가 기업을 망하게 한다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "'착한 기업을 고르는 소비자가 많아지면 세상의 기업들도 착해질 수밖에 없다'는 논리를 추론하면 무엇인가?", "options": ["소비자는 기업을 처벌할 법적 권한을 가진다", "착한 기업은 광고를 하지 않는다", "기업이 소비자를 가르쳐야 한다", "소비자의 선택이 시장의 보상 구조를 바꾸어 기업의 행동을 움직이는 힘이 된다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '된장 공장의 비밀 장부' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'politics12',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'politics12',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
