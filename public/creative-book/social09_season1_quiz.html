<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📰 진짜를 찾는 아이들 — 소문이 삼킨 마을 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작사회문화09/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "하람이가 도현이에 관한 글을 확인도 하지 않고 십 분 만에 올린 까닭은 무엇인가요?", "options": ["도현이를 평소에 미워했기 때문에", "조회 수 욕심과 남이 먼저 올리면 손해라는 조바심 때문에", "선생님이 쓰라고 시켰기 때문에", "글이 사실이라는 증거를 이미 보았기 때문에"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "후배 세인이의 생각이 이야기의 처음과 끝에서 어떻게 달라졌나요?", "options": ["처음에는 열심히 취재했는데 나중에는 동아리를 그만두었다", "처음부터 끝까지 확인이 중요하다고 주장했다", "처음에는 신문에 관심이 없다가 나중에 부장이 되었다", "처음에는 재미있으면 된다고 했지만, 나중에는 말없이 취재를 따라다니게 되었다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "도현이에 관한 소문을 끝까지 거슬러 올라갔을 때, 맨 처음에 있었던 것은 무엇인가요?", "options": ["아무 근거도 없는, 이름 없는 계정의 글 한 개", "도현이 친구의 목격담", "베꼈다는 원본 그림", "미술 선생님의 말"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "신문 동아리가 새로 정한 세 가지 규칙이 아닌 것은 무엇인가요?", "options": ["출처를 끝까지 확인하기", "여러 자료를 대조하는 팩트체크 하기", "조회 수가 높을 만한 기사를 먼저 쓰기", "감정에 휘둘리지 않기"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "하람이가 붙인 '아직 확인된 바 없다'는 마지막 한 줄이 아무 소용이 없었던 까닭은 무엇인가요?", "options": ["글자가 너무 작아 보이지 않았기 때문에", "댓글이 그 문장을 가려 버렸기 때문에", "기사가 금방 삭제되었기 때문에", "사람들은 제목의 '표절'이라는 말만 기억했기 때문에"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "'아무도 안 믿는 교실' 이야기가 보여 주는 가짜 뉴스의 가장 큰 피해는 무엇인가요?", "options": ["휴대전화 사용 시간이 늘어나는 것", "한 번 속고 나면 진짜 중요한 소식조차 믿지 않게 되는 것", "조회 수가 점점 줄어드는 것", "숙제할 시간이 없어지는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'팩트체크'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["기사에 어울리는 사진을 고르는 일", "글의 맞춤법을 고치는 일", "사실인지 여러 자료를 대조해 확인하는 일", "조회 수를 매일 기록하는 일"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'취재'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["기사를 쓰기 위해 직접 조사하고 알아보는 일", "신문을 인쇄해서 나누어 주는 일", "다른 신문의 기사를 옮겨 적는 일", "재미있는 제목을 짓는 일"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "가짜 뉴스가 일부러 분노와 공포를 자극하도록 만들어지는 까닭을 짐작하면 무엇인가요?", "options": ["사람은 화가 나면 확인하지 않고 바로 누르고 퍼뜨리기 때문에", "무서운 이야기가 기억에 오래 남기 때문에", "화난 사람이 댓글을 길게 쓰기 때문에", "슬픈 이야기는 만들기 어렵기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"많이 읽히는 것과 옳은 것은 다르다.\"라는 문장의 뜻으로 알맞은 것은 무엇인가요?", "options": ["조회 수가 낮은 글은 모두 옳은 글이라는 뜻", "재미있는 글은 쓰면 안 된다는 뜻", "조회 수가 높다고 해서 그 글이 사실이거나 좋은 글인 것은 아니라는 뜻", "신문은 어른만 읽어야 한다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "하람이가 확인 없이 글을 올리게 된 심리적 배경으로 가장 적절한 것은 무엇입니까?", "options": ["도현이의 수상에 대한 개인적 질투", "학교의 명예를 지키려는 사명감", "기자로서의 특종 욕심과 경쟁심", "조회 수라는 숫자가 주는 만족감과 '먼저 올리지 않으면 손해'라는 조급함"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "\"우리만 안 쓰면 손해 아니에요?\"라는 세인이의 물음이 대변하는 태도는 무엇입니까?", "options": ["사실 여부보다 관심과 속도를 앞세우는 태도", "기사의 공정성을 최우선하는 태도", "신문의 전통을 지키려는 보수적 태도", "취재의 어려움을 호소하는 태도"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "소문의 출처를 추적한 결과로 옳은 것은 무엇입니까?", "options": ["대회 심사위원의 발언에서 시작된 것으로 확인되었다", "도현이의 친구가 처음 퍼뜨린 것으로 밝혀졌다", "맨 처음은 근거 없는 익명 계정의 글 하나였다", "원본 그림이 실제로 존재하는 것으로 드러났다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "새 규칙 시행 후 동아리에 일어난 변화로 옳은 것은 무엇입니까?", "options": ["기사 수가 두 배로 늘었다", "한 달 기사 수가 절반으로 줄고, 검증을 통과한 기사에만 확인 도장을 붙였다", "조회 수가 크게 올랐다", "재미있는 기사만 골라 싣게 되었다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'확인된 바 없다'는 단서에도 소문이 사실로 굳어진 과정이 보여 주는 것은 무엇입니까?", "options": ["자극적인 제목이 신중한 단서를 삼켜 버리는 정보 전달의 속성", "독자들의 낮은 문해력", "단서를 더 길게 써야 한다는 교훈", "댓글 기능의 기술적 문제"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "급식 소문 사건(6장)이 서사에서 하는 역할은 무엇입니까?", "options": ["학교 급식의 문제점을 고발하는 역할", "하람이와 세인이의 갈등을 심화시키는 역할", "도현이의 결백을 증명하는 역할", "거짓이 진실에 대한 믿음까지 무너뜨린다는 더 깊은 피해를 드러내는 역할"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'팩트체크'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["기사의 문장을 다듬는 교정 작업", "어떤 정보가 사실인지 여러 자료를 대조해 검증하는 일", "독자의 반응을 분석하는 일", "기사의 조회 수를 관리하는 일"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'출처 확인'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["글쓴이의 학년과 반을 알아내는 일", "글이 올라온 시각을 기록하는 일", "정보가 맨 처음 어디에서 나왔는지 끝까지 거슬러 확인하는 일", "인용한 문장에 따옴표를 붙이는 일"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "가짜 뉴스 제작자들이 '분노와 공포'를 노리는 이유를 추론하면 무엇입니까?", "options": ["분노한 독자가 더 많은 광고를 보기 때문", "무서운 이야기가 법에 걸리지 않기 때문", "공포는 오래 기억되어 광고 효과가 크기 때문", "강한 감정에 휩싸인 사람은 검증 없이 즉시 공유하기 때문"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "'3,000이 읽은 기사'와 '87이 읽은 기사'의 대비에서 추론할 수 있는 것은 무엇입니까?", "options": ["기사의 가치는 도달한 수가 아니라 그것이 세상에 남긴 결과로 판단해야 한다", "독자 수가 적은 기사는 쓸 필요가 없다", "조회 수와 기사의 질은 언제나 비례한다", "학부모가 학생보다 신문을 열심히 읽는다"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'아낀 시간은 십 분이었고, 잃은 것은 그보다 훨씬 컸다'는 하람의 자각이 함축하는 바로 가장 적절한 것은 무엇인가?", "options": ["검증의 비용은 사소하나 미검증 정보의 사회적 비용은 막대하다는 통찰", "시간 관리 능력의 부족에 대한 반성", "취재 인력 부족이라는 구조적 한계", "속보 경쟁에서 승리했다는 자부심"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "세인이의 변화가 보여 주는 성장의 본질은 무엇인가?", "options": ["선배의 권위에 대한 복종을 익힌 것", "글솜씨가 비약적으로 향상된 것", "'재미와 속도'의 논리에서 '확인과 책임'의 논리로 판단 기준이 이동한 것", "경쟁심을 버리고 겸손을 배운 것"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "소문 추적의 결과에 대한 서술로 옳은 것은 무엇인가?", "options": ["최초 유포자가 처벌을 받았다", "원본 그림이 뒤늦게 발견되었다", "도현이가 표절을 인정했다", "전달자들은 모두 앞사람을 가리켰고, 최초 지점에는 근거 없는 익명 게시물만 있었다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "정정 기사에 대한 서술로 옳은 것은 무엇인가?", "options": ["소문의 발원과 원본 부재를 사흘에 걸쳐 밝히고, 인쇄물 게시와 낭독까지 병행했다", "익명으로 조용히 게시판에만 올렸다", "학교 측의 요구로 마지못해 작성되었다", "도현이가 직접 작성하여 발표했다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'확인된 바 없다'는 단서의 실패가 정보 전달 구조에 대해 시사하는 바는 무엇인가?", "options": ["단서 문구를 법으로 의무화해야 한다는 것", "정보는 명제 전체가 아니라 가장 자극적인 조각으로 압축되어 유통된다는 것", "독자는 언제나 기사 전문을 정독한다는 것", "제목과 본문은 분리 심사되어야 한다는 것"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'거짓말이 넘치는 교실'보다 '아무것도 믿지 못하는 교실'이 더 위험하다고 서술된 이유는 무엇인가?", "options": ["불신은 교사의 권위를 훼손하기 때문", "신뢰의 붕괴는 참된 정보의 전달 경로 자체를 마비시키기 때문", "거짓말은 시간이 지나면 저절로 사라지기 때문", "불신이 학업 성적을 떨어뜨리기 때문"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'팩트체크(사실 검증)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["여론의 흐름을 조사하여 보도 방향을 정하는 일", "독자 반응 데이터를 분석하는 일", "복수의 독립된 자료를 대조하여 정보의 사실 여부를 확인하는 검증 절차", "기사의 논조를 중립적으로 다듬는 편집 과정"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'출처(出處)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["정보를 최종적으로 보도한 매체", "정보나 소문이 맨 처음 생겨나 나온 곳", "정보가 가장 많이 공유된 공간", "정보를 요약한 제목"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'분노는 검증을 건너뛰게 한다'는 명제가 가짜 뉴스의 설계 원리와 결합할 때 도출되는 결론은 무엇인가?", "options": ["감정 표현을 금지하는 규범이 필요하다", "공포보다 분노가 전파력이 약하다", "분노를 느끼는 순간이야말로 가장 의식적으로 검증해야 할 순간이다", "감정적 기사는 모두 가짜 뉴스다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "\"퍼뜨리기 전에 묻는 십 초가, 한 사람을 지켜요.\"라는 경구의 함의로 가장 적절한 것은 무엇인가?", "options": ["개인의 작은 검증 습관이 무고한 타인의 삶을 지키는 사회적 방파제가 된다", "십 초 안에 판단하지 못하면 공유하지 말아야 한다", "정보의 진위는 전문가만 판별할 수 있다", "빠른 공유가 여론 형성에 기여한다"], "correct": 0}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '진짜를 찾는 아이들' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'social09',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'social09',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
