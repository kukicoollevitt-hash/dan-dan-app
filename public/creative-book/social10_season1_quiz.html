<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍜 두 나라 사이의 아이 — 이름을 되찾은 날 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작사회문화10/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "링링이가 어머니에게 \"학교 앞에서는 그 이름으로 부르지 마\"라고 말한 마음은 무엇이었나요?", "options": ["이서연이라는 이름이 더 예뻐서", "한 사람이 이름을 두 개 가지면 안 되기 때문에", "남들과 다른 것을 들킬까 봐 부끄럽고 조마조마해서", "어머니의 목소리가 너무 커서"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "어머니가 링링이 앞에서 베트남 이야기도, 베트남 노래도 하지 않았던 까닭은 무엇이었나요?", "options": ["딸이 자기 때문에 놀림받을까 봐 지켜 주려고", "고향이 그립지 않았기 때문에", "한국말 연습에 방해가 되기 때문에", "베트남에서의 기억이 좋지 않았기 때문에"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "체험 학습 날 도시락 사건에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["링링이가 도시락을 집에 두고 왔다", "준호가 짜조 냄새에 코를 막았고, 링링이는 점심을 한 입도 먹지 않았다", "아이들이 서로 짜조를 먹겠다고 손을 내밀었다", "선생님이 도시락을 검사했다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "쌀국수 가게에서 링링이가 알게 된 사실은 무엇인가요?", "options": ["어머니가 가게를 곧 그만둔다는 것", "가게가 곧 문을 닫는다는 것", "준호가 쌀국수를 싫어한다는 것", "준호네 가족이 그 가게의 오랜 단골이라는 것"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'고향 소개하기 시간'에 링링이가 처음으로 품게 된 물음은 무엇인가요?", "options": ["왜 발표는 순서대로 해야 할까", "왜 우리 반에는 스물다섯 명이나 있을까", "강원도·부산·제주 이야기는 괜찮은데 왜 베트남 이야기만 이상하게 여겨질까", "왜 선생님이 새로 바뀌었을까"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "\"문제는 어머니의 음식이 아니라, 그것을 보는 사람의 눈이었어요.\"라는 문장의 뜻은 무엇인가요?", "options": ["같은 것도 어떤 눈으로 보느냐에 따라 놀림거리도 되고 감탄거리도 된다는 것", "음식은 눈으로 먼저 먹는다는 것", "어머니의 요리 솜씨가 부족했다는 것", "눈이 나쁘면 음식 맛을 모른다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'다문화 가족'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["식구 수가 아주 많은 가족", "여행을 자주 다니는 가족", "여러 집이 한 건물에 모여 사는 가족", "서로 다른 나라의 문화가 한 가족 안에 함께 있는 가족"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'단골'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["가게에서 일하는 사람", "어떤 가게를 자주 찾는 손님", "가게 주인의 가족", "처음 온 손님"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "\"그건 부족한 게 아니라 더 가진 거예요.\"라는 선생님의 말에 담긴 뜻을 짐작하면 무엇인가요?", "options": ["두 나라의 문화를 가진 것은 남보다 더 넓은 세상을 가진 것이라는 뜻", "발표를 두 번 한 것이나 마찬가지라는 뜻", "이름이 두 개면 물건도 두 배로 받는다는 뜻", "베트남이 한국보다 크다는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"다른 것은 틀린 것이 아니라, 세상을 넓히는 것이에요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["세상은 넓어서 여행할 곳이 많다는 뜻", "다른 사람의 말은 틀려도 참아야 한다는 뜻", "서로 다른 문화가 함께하면 모두의 세상이 더 풍성해진다는 뜻", "남과 달라지려면 노력해야 한다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "링링이가 이름과 도시락을 감추면서도 '더 조마조마해진' 이유로 가장 적절한 것은 무엇입니까?", "options": ["어머니에게 거짓말한 것이 미안했기 때문", "감춘 것은 사라진 것이 아니라 언제 들킬지 모르는 불안으로 남기 때문", "친구들이 이미 다 알고 있었기 때문", "선생님에게 혼날까 봐 두려웠기 때문"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "\"네가 부끄러워할까 봐\"라는 어머니의 대답에서 알 수 있는 것은 무엇입니까?", "options": ["어머니가 한국 생활에 완전히 적응했다는 것", "어머니가 고향을 잊고 싶어 했다는 것", "어머니가 딸의 학교생활에 무관심했다는 것", "어머니의 침묵이 자기 부끄러움이 아니라 딸을 지키려는 사랑이었다는 것"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "쌀국수 가게 장면에 대한 서술로 옳은 것은 무엇입니까?", "options": ["학교에서 놀림받던 어머니의 손맛이 그곳에서는 감탄의 대상이었다", "준호가 링링이를 보고 아이들에게 소문을 내겠다고 놀렸다", "어머니가 링링이에게 가게 일을 그만 도우라고 했다", "가게 국물은 한 시간이면 완성되는 것이었다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "링링이의 발표 내용에 포함되지 않은 것은 무엇입니까?", "options": ["두 이름의 유래", "짜조가 명절에 먹는 귀한 음식이라는 사실", "베트남에 직접 다녀온 여행 경험담", "어머니에게 배운 베트남 자장가"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'고향 소개하기 시간'이 서사에서 하는 역할은 무엇입니까?", "options": ["링링이와 준호의 갈등이 폭발하는 장면", "어머니의 과거가 밝혀지는 장면", "'다름'에 대한 링링이의 굳은 생각에 처음으로 물음표를 찍는 계기", "반 아이들의 우열을 가리는 장면"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "준호라는 인물이 이야기에서 수행하는 역할의 변화는 무엇입니까?", "options": ["처음부터 끝까지 링링이를 돕는 조력자다", "놀림의 시작이었다가, 감춰진 것의 가치를 알아보고 사과하는 화해의 다리가 된다", "끝까지 링링이를 괴롭히는 반대자다", "이야기에 거의 등장하지 않는 배경 인물이다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'다문화 가족'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["서로 다른 나라 출신의 구성원이 이루어 두 문화가 함께 있는 가족", "해외에 오래 살다 돌아온 가족", "여러 세대가 한집에 사는 대가족", "문화 예술 분야에서 일하는 가족"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'구성원'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["단체를 이끄는 대표", "어떤 모임이나 사회를 함께 이루고 있는 사람", "새로 들어온 신입", "규칙을 정하는 사람"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'반쪽짜리 두 개가 아니라, 온전한 하나가 두 배가 된 것'이라는 표현에서 추론할 수 있는 정체성에 대한 관점은 무엇입니까?", "options": ["두 문화 사이에서는 하나를 반드시 골라야 한다", "이름이 많을수록 혼란스러워진다", "두 문화를 가진 사람은 어느 쪽에도 속하지 못한다", "두 문화는 서로를 깎아내리는 것이 아니라 그 사람을 더 풍요롭게 만든다"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "'세계 음식의 날'에 짜조가 가장 먼저 동이 난 장면이 상징하는 바는 무엇입니까?", "options": ["튀김 요리가 언제나 인기라는 것", "베트남 음식이 한국 음식보다 우수하다는 것", "놀림받던 '다름'이 편견이 걷히자 모두가 반기는 풍성함이 되었다는 것", "행사 음식은 양을 넉넉히 준비해야 한다는 것"], "correct": 2}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "링링이가 '편해진 것이 아니라 자기 절반을 숨기기 시작한 것'이라는 서술이 함축하는 바로 가장 적절한 것은 무엇인가?", "options": ["정체성의 일부를 부정하는 것은 해방이 아니라 또 다른 억압의 시작이라는 것", "이름을 바꾸는 것은 법적으로 복잡하다는 것", "가족 간의 약속은 반드시 지켜져야 한다는 것", "타인의 시선은 무시하는 것이 최선이라는 것"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "'링링이가 절반을 감출 때, 어머니는 자기 전부를 감추고 있었다'는 문장이 드러내는 어머니의 처지로 가장 적절한 것은 무엇인가?", "options": ["이주 생활의 경제적 어려움", "자녀 보호를 위해 자기 존재의 뿌리 전체를 침묵 속에 접어 둔 희생", "고향에 대한 기억의 상실", "한국 문화에 대한 거부감"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "발표 이후 학급의 변화로 옳은 것은 무엇인가?", "options": ["링링이가 반장으로 선출되었다", "어머니가 학교에 초청되어 요리 수업을 열었다", "아이들이 베트남으로 수학여행을 떠났다", "아이들이 베트남말을 배우고 싶어 했고, 준호는 지난 놀림을 사과했다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "이 책이 전하는 우리 사회의 현실로 옳은 것은 무엇인가?", "options": ["다문화 가족은 도시에만 살고 있다", "다른 나라 출신 이웃의 수는 점차 줄어들고 있다", "다른 나라에서 옮겨 와 사는 이웃이 이백오십만 명을 넘어섰다", "다문화 가족은 아직 매우 드물다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'같은 손맛이 학교에서는 놀림, 가게에서는 감탄의 대상'이라는 대비 구조가 논증하는 명제는 무엇인가?", "options": ["음식의 가치는 가격이 결정한다", "차별의 원인은 대상의 결함이 아니라 그것을 바라보는 시선의 편견에 있다", "공간이 다르면 맛도 달라진다", "전문가의 평가가 아이들의 평가보다 정확하다"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "베트남 자장가가 서사에서 수행하는 상징적 기능으로 가장 적절한 것은 무엇인가?", "options": ["베트남 음악의 우수성을 알리는 장치", "발표의 긴장을 풀어 주는 여흥", "어머니의 향수를 자극하는 소재", "숨겨졌던 모녀의 유대와 뿌리가 소리로 되살아나는 회복의 매개"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'다문화(多文化)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["한 나라의 문화가 여러 지역으로 퍼지는 현상", "전통문화를 원형 그대로 보존하는 일", "한 사회 안에 서로 다른 문화가 함께 존재하는 것", "외국 문화를 일방적으로 받아들이는 것"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'편견(偏見)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["공정하지 못하고 한쪽으로 치우친 생각", "오랜 경험에서 얻은 지혜", "여러 사람이 합의한 의견", "사실에 근거한 정확한 판단"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'우리'와 '그들'로 갈라 보면 세상이 좁아진다는 서술의 논리를 추론하면 무엇인가?", "options": ["구별 짓기는 여행의 기회를 줄이기 때문이다", "배제는 그들이 가진 문화와 이야기를 접할 통로를 스스로 닫는 일이기 때문이다", "인구가 줄어 국토가 좁아지기 때문이다", "언어가 통일되지 않으면 소통 비용이 늘기 때문이다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「다른 것은 틀린 것이 아니라, 세상을 넓히는 것」이라는 경구가 공동체에 제안하는 태도를 추론하면 무엇인가?", "options": ["다름을 없애 하나의 문화로 통합하자는 동화주의", "다름을 서로 비교하여 우열을 가리자는 경쟁주의", "차이를 결핍이 아닌 자원으로 받아들여 함께 풍요로워지자는 공존의 태도", "다름을 각자의 영역에 격리하자는 분리주의"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '두 나라 사이의 아이' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'social10',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'social10',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
