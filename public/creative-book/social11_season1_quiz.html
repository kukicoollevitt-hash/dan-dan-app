<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏠 혼자 사는 사람들 — 옆집 할머니의 국 한 그릇 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작사회문화11/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "이야기의 처음에 도경이는 옆집 할머니를 어떻게 생각하고 있었나요?", "options": ["요리를 잘하는 분이라고 생각했다", "화단을 아름답게 가꾸는 분이라고 부러워했다", "친구처럼 편한 분이라고 생각했다", "무뚝뚝해 보여 무서웠고, 혼자 사니 외로울 거라고 여겼다"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "혼자 사는 삼촌이 도경이에게 들려준 생각은 무엇이었나요?", "options": ["혼자 사는 것은 부끄러운 일이라는 것", "외로울 때도 있지만 좋은 점도 많고, 진짜 문제는 아무하고도 이어져 있지 않은 것이라는 것", "혼자 살면 돈이 많이 모인다는 것", "혼자 사는 사람은 결혼을 서둘러야 한다는 것"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "도경이가 할머니에게 무슨 일이 생겼다는 것을 알아챈 단서는 무엇이었나요?", "options": ["불 꺼진 창문과 물을 주지 않아 바싹 마른 화단", "닫히지 않은 현관문", "며칠째 쌓여 있는 신문", "집 안에서 들려온 큰 소리"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "할머니의 사고 이후 이웃들이 정한 약속이 아닌 것은 무엇인가요?", "options": ["화단에 물이 주어졌는지 서로 살피기", "창가 화분과 커튼으로 안부를 알 수 있게 하기", "할머니를 요양원으로 모시고 가기", "혼자 사는 어르신 집에 비상벨 달기"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "할머니가 국 냄비를 들고 찾아온 사건(2장)이 이야기에서 중요한 까닭은 무엇인가요?", "options": ["도경이가 요리에 관심을 갖게 되어서", "도경이가 알던 '외로운 혼자'와 다른 모습을 보여 주어 생각이 바뀌는 시작이 되어서", "할머니의 요리 솜씨가 알려지게 되어서", "두 집이 싸우게 되는 원인이 되어서"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "봄에 도경이가 미역국 냄비를 들고 할머니 집 초인종을 누른 장면의 의미는 무엇인가요?", "options": ["할머니에게 요리를 배우고 싶다는 뜻", "어머니의 심부름을 한 것", "냄비를 돌려주러 간 것", "받았던 마음을 돌려주며 서로 돌보는 이웃이 되었다는 것"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "어머니가 말한 '정'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["오랫동안 사귀며 쌓인 따뜻한 마음", "맛있는 음식 솜씨", "바르게 앉는 자세", "조용한 성격"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'퇴원'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["병원에 입원하는 것", "병원을 새로 짓는 것", "치료를 마치고 병원에서 나오는 것", "의사 선생님을 만나는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "창가에 화분을 놓고 커튼으로 안부를 알리자는 도경이의 생각이 좋은 방법인 까닭은 무엇인가요?", "options": ["집 안에 들어가지 않고도 매일 무사한지 알 수 있는 간단한 신호이기 때문에", "화분이 집을 예쁘게 꾸며 주기 때문에", "커튼이 햇빛을 막아 주기 때문에", "화분을 팔아 돈을 벌 수 있기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"혼자 사는 것과 혼자인 것은 달라요. 이어짐이 그 사이를 채우지요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["혼자 살려면 튼튼한 벽이 필요하다는 뜻", "혼자 사는 사람은 이사를 자주 해야 한다는 뜻", "이웃과 마음이 이어져 있다면 혼자 살아도 외롭지 않다는 뜻", "혼자 사는 집은 좁아서 불편하다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "도경이가 처음에 '혼자'와 '외롭다'를 같은 뜻으로 여긴 까닭으로 가장 적절한 것은 무엇입니까?", "options": ["늘 시끌벅적한 자기 집의 모습만을 기준으로 옆집을 바라보았기 때문", "할머니가 외롭다고 직접 말했기 때문", "책에서 그렇게 배웠기 때문", "부모님이 그렇게 가르쳤기 때문"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "국을 나눠 준 할머니의 행동에서 짐작할 수 있는 마음으로 가장 적절한 것은 무엇입니까?", "options": ["남은 음식을 처리하려는 알뜰함", "요리 솜씨를 자랑하고 싶은 마음", "무뚝뚝한 겉모습 안에 이웃과 나누고 이어지고 싶은 따뜻한 마음", "어린 도경이를 시험해 보려는 의도"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "삼촌이 알려 준 우리나라 1인 가구의 현황으로 옳은 것은 무엇입니까?", "options": ["혼자 사는 집은 거의 사라지고 있다", "혼자 사는 사람은 대부분 노인이다", "혼자 사는 집은 백 곳 중 한 곳 정도다", "집 열 곳 중 서너 곳이 혼자 사는 집이다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "할머니가 발견되던 날의 정황으로 옳은 것은 무엇입니까?", "options": ["할머니가 스스로 구급차를 불렀다", "복지관 친구가 가장 먼저 찾아왔다", "전날 밤 넘어져 일어나지 못한 채 방바닥에서 긴 밤을 보낸 상태였다", "현관문이 열려 있어 지나가던 이웃이 발견했다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'불 켜진 창문'과 '불 꺼진 창문'의 대비가 이야기에서 하는 역할은 무엇입니까?", "options": ["쓸쓸함의 상징이 안부의 신호로 바뀌며 관심의 의미를 드러낸다", "전기 절약의 중요성을 알려 준다", "밤과 낮의 시간 흐름을 표시한다", "아파트 시설의 낡음을 보여 준다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "이야기의 처음과 끝에서 '국 한 그릇'이 오가는 방향이 바뀐 구성의 효과는 무엇입니까?", "options": ["국 끓이는 방법의 발전을 보여 준다", "계절의 변화를 알려 준다", "받기만 하던 아이가 돌려주는 사람으로 성장했음을 자연스럽게 보여 준다", "두 집의 요리 대결을 암시한다"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'1인 가구'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["가족과 떨어져 여행 중인 사람", "한 사람이 혼자 살림하며 사는 집", "방이 하나뿐인 집", "혼자 일하는 가게"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'안부'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["편지를 보내는 일", "집을 지키는 일", "이웃 간의 다툼", "편안하게 잘 지내는지에 대한 소식"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "\"이건 할머니 혼자 조심한다고 되는 일이 아니야\"라는 어머니의 말에서 추론할 수 있는 것은 무엇입니까?", "options": ["혼자 사는 사람의 안전은 이웃과 사회가 함께 챙겨야 할 공동의 일이라는 것", "할머니가 부주의한 분이라는 것", "혼자 사는 것 자체를 막아야 한다는 것", "자식들이 모셔 가는 것이 유일한 해결책이라는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "이 이야기가 '가족'에 대해 전하려는 생각으로 가장 적절한 것은 무엇입니까?", "options": ["가족은 반드시 한집에 살아야 한다", "전통적인 대가족이 가장 바람직하다", "가족이 아닌 사람과는 정을 나눌 수 없다", "가족의 모습은 여러 가지지만 서로 돌보는 마음은 같으며, 그 마음은 벽을 넘어 이웃으로도 이어진다"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "도경이의 인식 변화 과정을 순서대로 정리한 것으로 가장 적절한 것은 무엇인가?", "options": ["무관심 → 동정 → 경쟁 → 화해", "동경 → 실망 → 이해 → 무관심", "'혼자=외로움'이라는 단정 → 다른 모습의 발견 → 위험의 목격 → 이어짐의 실천", "두려움 → 미움 → 용서 → 망각"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "\"이 국이 그냥 국이 아니라, 마음이라는 걸 나는 안다\"는 할머니의 말이 함축하는 바는 무엇인가?", "options": ["나눔의 본질은 물건이 아니라 서로를 향한 관심과 애정임을 안다는 것", "국의 재료가 비싸다는 것을 안다는 것", "도경이 어머니의 요리 실력을 인정한다는 것", "답례를 받는 것이 부담스럽다는 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "할머니의 일상에 대한 서술로 옳은 것은 무엇인가?", "options": ["집 밖으로 전혀 나오지 않고 지냈다", "아침마다 화단에 물을 주고 복지관에서 노래와 체조를 배우며 지냈다", "자식들과 함께 살기 위해 이사를 준비하고 있었다", "경비 일을 하며 생계를 꾸렸다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "학교 발표에서 도경이가 소개한 내용으로 옳은 것은 무엇인가?", "options": ["혼자 사는 집은 세 곳 중 한 곳이 넘으며, 가족의 모습은 여러 가지라는 것", "가족의 모습은 예나 지금이나 한 가지라는 것", "혼자 사는 사람은 모두 불행하다는 것", "대가족 제도로 돌아가야 한다는 것"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'창밖을 눈여겨본 한 아이의 관심'에서 '비상벨 설치'로 확장되는 전개가 보여 주는 것은 무엇인가?", "options": ["기술이 사람의 관심을 대체한다는 것", "개인의 우연한 선의가 이웃의 약속을 거쳐 사회적 안전망으로 제도화되는 과정", "아이의 생각은 어른의 검증이 필요하다는 것", "관리사무소의 역할이 가장 중요하다는 것"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'벽에 마음이 오가는 작은 문 하나를 낸 것 같았다'는 표현의 함의로 가장 적절한 것은 무엇인가?", "options": ["아파트 구조 변경이 필요하다는 것", "이웃 사이의 물리적 단절은 허물 수 없다는 것", "사생활 보호가 무엇보다 중요하다는 것", "물리적 벽은 그대로여도 관계의 단절은 마음의 통로로 허물어질 수 있다는 것"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'1인 가구'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["구성원이 한 명뿐인 회사", "임시로 혼자 머무는 숙소", "한 사람이 단독으로 생계를 꾸리며 사는 가구", "독립된 방이 하나인 주거 형태"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'안전망(安全網)'의 비유적 의미로 가장 적절한 것은 무엇인가?", "options": ["공사장에 치는 그물", "위험에 빠진 사람을 놓치지 않도록 사회가 마련한 보호 장치", "범죄를 감시하는 카메라", "건물의 방범창"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'발견이 하루만 늦었다면 위험했다'는 사실이 1인 가구 시대에 던지는 시사점을 추론하면 무엇인가?", "options": ["의료 기술의 발전이 모든 문제를 해결한다", "혼자 사는 사람은 외출을 삼가야 한다", "고립의 위험은 개인의 조심성이 아니라 일상적으로 서로를 살피는 촘촘한 연결망으로 막을 수 있다", "위험은 예측할 수 없으므로 대비가 무의미하다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "「혼자 사는 것과 혼자인 것은 달라요. 이어짐이 그 사이를 채우지요.」라는 경구의 함의로 가장 적절한 것은 무엇인가?", "options": ["주거 형태를 통일해야 외로움이 사라진다", "외로움의 여부를 가르는 것은 주거 형태가 아니라 관계의 유무다", "혼자 사는 삶은 궁극적으로 극복해야 할 상태다", "이어짐은 가족 안에서만 가능하다"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '혼자 사는 사람들' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'social11',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'social11',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
