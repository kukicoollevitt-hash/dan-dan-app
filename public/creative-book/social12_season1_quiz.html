<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚖️ 방울토마토 나누는 법 — 우리 반 정의 대소동 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작사회문화12/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "나눔 담당이 된 하람이의 마음이 점점 무거워진 까닭은 무엇인가요?", "options": ["토마토가 잘 자라지 않아서", "모두가 공정을 바라지만 무엇이 공정인지는 저마다 생각이 달랐기 때문에", "선생님이 어려운 숙제를 내 주어서", "동생이 토마토를 달라고 졸라서"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "다온이가 약속을 어기고 토마토에 먼저 손을 댄 사정은 무엇이었나요?", "options": ["배가 너무 고팠기 때문에", "자기 점수가 낮은 것에 화가 나서", "친구들을 골탕 먹이고 싶어서", "병원에 계신 할머니께 토마토를 드리고 싶어서"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "철학자 아리스토텔레스가 말한 정의는 무엇인가요?", "options": ["정의란 각자에게 그의 몫을 주는 것", "정의란 힘센 사람이 정하는 것", "정의란 모두가 무조건 똑같이 갖는 것", "정의란 법을 어긴 사람을 크게 벌하는 것"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "'우리 반 나눔 법'에 들어 있지 않은 내용은 무엇인가요?", "options": ["기본 몫은 서른 명 모두 똑같이 받는다", "애쓴 친구에게는 수고한 만큼 몫을 더한다", "점수가 가장 높은 사람이 나눔 방법을 정한다", "아프거나 사정이 있어 참여하지 못한 친구의 몫은 지켜 준다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "유나의 점수표 사건이 보여 준 것은 무엇인가요?", "options": ["기록장을 더 꼼꼼히 써야 한다는 것", "점수 계산에서 실수가 있었다는 것", "유나가 사실은 게을렀다는 것", "규칙과 계산이 정확해도 정의롭지 않을 수 있다는 것"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "이름이 든 상자에서 제비를 뽑는 게임을 한 뒤, 아이들의 태도는 어떻게 달라졌나요?", "options": ["가장 운이 나쁜 자리를 먼저 떠올리며 규칙을 다듬기 시작했다", "자기 점수를 더 올리려고 다투었다", "게임이 재미없다고 불평했다", "규칙 정하기를 포기했다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'분배적 정의'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["물건을 빨리 나누어 주는 기술", "각자의 노력이나 처지에 맞게 몫을 나누는 것", "남은 것을 버리지 않고 보관하는 것", "나이 순서대로 나누어 주는 것"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "선생님이 말한 '교정적 정의'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["잘못한 사람을 반에서 내보내는 것", "잘못을 저지른 사람에게 화풀이하는 것", "벌을 통해 잘못을 바로잡고 피해를 되돌리게 하는 것", "잘못을 모른 척 덮어 주는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "\"다들 '공정'이라는 말을 자기에게 유리한 쪽으로만 쓰고 있는 것은 아닐까\"라는 하람이의 생각이 뜻하는 것은 무엇인가요?", "options": ["공정이라는 말은 어른만 쓸 수 있다는 것", "공정을 판단할 때는 자기 이익에서 한 걸음 떨어져 보아야 한다는 것", "목소리가 큰 사람의 말이 공정이라는 것", "공정이라는 말은 쓸수록 좋다는 것"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "\"정의는 각자에게 그의 몫을 주는 것, 가장 아픈 자리를 먼저 살피는 것이에요.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["몫을 정할 때 가장 불리한 처지의 사람을 먼저 생각해야 한다는 뜻", "아픈 사람에게는 아무 일도 시키지 말아야 한다는 뜻", "몫은 언제나 병원에서 정해야 한다는 뜻", "가장 힘센 사람의 몫을 먼저 정해야 한다는 뜻"], "correct": 0}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'옳은 말들이 한 교실에 모이면 왜 싸움이 되는가'라는 하람이의 고민이 드러내는 문제의식은 무엇입니까?", "options": ["회의 시간이 너무 짧다는 것", "저마다 일리 있는 주장도 각자 자기 자리에서만 판단하면 충돌한다는 것", "아이들은 아직 토론할 능력이 없다는 것", "규칙은 어른이 정해 주어야 한다는 것"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "침묵하던 다온이의 사정이 밝혀진 뒤 아이들이 정한 책임의 방식에서 알 수 있는 것은 무엇입니까?", "options": ["잘못은 잘못대로 바로잡되, 벌은 화풀이가 아니라 피해를 되돌리는 것이어야 한다는 것", "사정이 딱하면 잘못을 없던 일로 해야 한다는 것", "잘못한 사람은 모임에서 제외해야 한다는 것", "벌은 무거울수록 효과가 있다는 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "준서가 제안한 점수제의 내용과 그 근거로 옳은 것은 무엇입니까?", "options": ["제비뽑기로 몫을 정하자는 것으로, 운의 평등이 근거였다", "모두 똑같이 나누자는 것으로, 학급 전체의 소유라는 점이 근거였다", "키 순서대로 나누자는 것으로, 눈에 보이는 기준이라는 점이 근거였다", "일한 횟수대로 가져가자는 것으로, 텃밭 활동 기록장이 근거였다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "유나의 사정으로 옳은 것은 무엇입니까?", "options": ["처음부터 텃밭 활동에 관심이 없었다", "봄에 모종 심기를 도맡을 만큼 열심이었으나 다리를 다쳐 여름 내내 나오지 못했다", "전학을 와서 참여 기간이 짧았다", "학원 때문에 스스로 물 주기를 신청하지 않았다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'숫자는 정확했지만 유나의 봄을 담지 못했다'는 문장이 지적하는 점수제의 한계는 무엇입니까?", "options": ["계산 과정에 오류가 많다는 것", "기록되지 않은 노력과 피치 못할 사정을 셈에 넣지 못한다는 것", "기록장이 조작될 수 있다는 것", "점수 계산에 시간이 오래 걸린다는 것"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "제비뽑기 게임이 아이들의 판단을 바꾼 원리는 무엇입니까?", "options": ["게임의 재미가 갈등을 잊게 했기 때문", "선생님의 권위에 눌렸기 때문", "운에 모든 것을 맡기게 되었기 때문", "자기가 누구의 자리에 설지 모르게 되자 가장 불리한 자리를 기준으로 생각하게 되었기 때문"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'능력주의'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["노력과 능력에 따라 보상이 달라져야 한다는 생각", "타고난 신분에 따라 대우해야 한다는 생각", "모두에게 똑같이 나누어야 한다는 생각", "필요한 사람에게 먼저 주어야 한다는 생각"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "롤스가 말한 '무지의 베일'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["지식이 부족한 상태로 투표하는 것", "눈을 가리고 제비를 뽑는 놀이", "자기가 어떤 처지에 놓일지 모른 채 규칙을 정하는 상상의 장치", "다른 사람의 의견을 듣지 않는 태도"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'기회의 평등은 있었다'는 준서의 말에 소민이가 반박한 논리를 추론하면 무엇입니까?", "options": ["형식적으로 기회가 열려 있어도 처지에 따라 실제로 그 기회를 쓸 수 없는 사람이 있다", "신청 절차가 너무 복잡했다", "기회는 추첨으로 주어져야 공평하다", "기회의 평등보다 결과의 평등이 언제나 우선한다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'우리 반 나눔 법'의 세 조항이 종합적으로 구현하려는 정의관을 추론하면 무엇입니까?", "options": ["모든 몫을 운에 맡기는 추첨적 정의", "다수가 원하는 대로 정하는 다수결 지상주의", "성과만을 기준으로 하는 순수 능력주의", "기본적 평등 위에 노력을 보상하되 약자의 몫을 지키는 균형 잡힌 정의"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "하람이가 '정의라는 것이 정말 있기는 한 걸까'라는 회의(懷疑)에 빠졌다가 회복되는 과정이 시사하는 바로 가장 적절한 것은 무엇인가?", "options": ["정의는 다수결로만 확정된다는 것", "정의에 대한 회의는 시간이 해결해 준다는 것", "정의는 철학자에게 맡겨야 할 문제라는 것", "정의는 완성된 답이 아니라 관점의 전환을 통해 함께 만들어 가는 과정이라는 것"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "다온이의 침묵이 아이들의 분노를 키웠지만 하람이만은 '말 못 할 사정'을 짐작한 것에서 드러나는 태도는 무엇인가?", "options": ["행동의 이면을 헤아려 보려는 신중한 판단의 자세", "친한 친구를 무조건 감싸려는 편애", "갈등을 회피하려는 소극성", "증거보다 직감을 앞세우는 성급함"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "아리스토텔레스와 롤스의 생각에 대한 서술로 옳은 것은 무엇인가?", "options": ["아리스토텔레스는 무지의 베일을, 롤스는 분배적 정의를 말했다", "두 철학자 모두 결과의 완전한 평등만을 주장했다", "아리스토텔레스는 '각자에게 그의 몫을'을, 롤스는 '무지의 베일'을 말했다", "두 철학자는 같은 시대에 논쟁을 벌였다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "다온이 사건의 처리 결과로 옳은 것은 무엇인가?", "options": ["텃밭 활동이 영구히 금지되었다", "가져간 만큼 되돌리고 가을 텃밭 정리를 맡았으며, 할머니 몫은 모두가 조금씩 덜어 마련했다", "점수 0점 처리와 함께 반성문을 썼다", "선생님이 대신 배상하는 것으로 마무리되었다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'귤 한 봉지 다툼 → 토마토 두 바구니 → 교실 밖의 사회 불평등'으로 확장되는 구성의 효과는 무엇인가?", "options": ["갈등의 규모를 줄여 안도감을 주는 효과", "일상의 작은 나눔 문제가 사회 정의라는 큰 물음의 축소판임을 보여 주는 효과", "과일의 종류를 다양하게 소개하는 효과", "시간의 흐름을 강조하는 효과"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'가장 예쁜 접시가 유나의 책상 위에 놓였다'는 결말 장면의 상징적 의미는 무엇인가?", "options": ["유나의 점수가 가장 높았다는 사실의 확인", "수확 잔치의 화려함을 보여 주는 장식", "기록되지 못한 헌신과 약자의 자리를 공동체가 기억하고 존중하게 되었다는 것", "유나가 나눔 담당이 되었다는 암시"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'분배적 정의'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["잘못에 대한 처벌의 크기를 정하는 원칙", "계약을 지키도록 강제하는 원칙", "다수의 뜻에 따라 소수를 규율하는 원칙", "노력·기여·처지를 고려하여 사회적 몫을 나누는 원칙"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'교정적 정의'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["잘못을 바로잡고 침해된 것을 회복시키는 정의", "이익을 공평하게 나누는 정의", "기회를 균등하게 여는 정의", "전통과 관습을 지키는 정의"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'무지의 베일' 사고 실험이 공정한 규칙을 낳는 논리적 이유를 추론하면 무엇인가?", "options": ["운이 모든 것을 결정하므로 불만이 사라지기 때문", "자신이 최약자가 될 가능성을 배제할 수 없으므로 최약자에게도 견딜 만한 규칙을 선택하게 되기 때문", "베일이 갈등의 기억을 지워 주기 때문", "규칙을 모른 채 따르는 것이 복종심을 기르기 때문"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "이 이야기가 '시민 의식'에 대해 궁극적으로 전하는 메시지를 추론하면 무엇인가?", "options": ["시민 의식은 법률 지식의 축적으로 완성된다", "불평등의 해결은 전적으로 국가의 몫이다", "정의로운 공동체는 구성원 각자가 가장 불리한 자리를 기준으로 함께 규칙을 만들 때 가능해진다", "갈등 없는 사회가 가장 정의로운 사회다"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '방울토마토 나누는 법' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'social12',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'social12',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
