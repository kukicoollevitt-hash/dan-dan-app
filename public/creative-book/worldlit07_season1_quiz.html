<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐰 토끼 굴 아래 이상한 나라 — 앨리스의 모험 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계문학07/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "앨리스는 어떤 아이인가요?", "options": ["겁이 많아 새로운 것을 피하는 아이", "호기심이 많아 이상한 토끼를 보자 망설임 없이 뒤쫓아 굴로 뛰어든 아이", "책 읽기를 세상에서 제일 좋아하는 아이", "친구들과 노는 것만 좋아하는 아이"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "하트 여왕은 어떤 인물인가요?", "options": ["장미를 정성껏 가꾸는 상냥한 여왕", "백성의 말을 잘 들어주는 여왕", "수수께끼를 잘 내는 지혜로운 여왕", "마음에 들지 않으면 무조건 \"목을 베어라!\" 하고 소리치는 무시무시한 여왕"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "앨리스가 이상한 나라로 들어가게 된 과정으로 알맞은 것은 무엇인가요?", "options": ["회중시계를 보며 \"늦었어!\"라고 외치는 하얀 토끼를 따라 토끼 굴로 뛰어들어, 우물 같은 구멍을 끝없이 떨어졌다", "배를 타고 바다를 건너갔다", "마법사가 주문을 외워 데려갔다", "무지개 다리를 걸어서 건너갔다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "신비한 음료와 과자를 먹은 앨리스에게 일어난 일은 무엇인가요?", "options": ["하늘을 날 수 있게 되었다", "잠이 쏟아져 쓰러졌다", "음료를 마시면 몸이 아주 작아지고, 과자를 먹으면 반대로 엄청나게 커졌다", "동물의 말을 알아듣게 되었다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "모자장수의 티 파티가 '영원히 끝나지 않는' 까닭은 무엇인가요?", "options": ["이 나라의 시간이 여섯 시에 딱 멈춰 버려서, 언제나 차 마시는 시간 속에 갇혀 있기 때문에", "손님이 끝없이 몰려오기 때문에", "찻잔이 수십 개나 되기 때문에", "모자장수가 파티를 좋아하기 때문에"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "엉터리 재판 장면에서 앨리스가 보여 준 모습은 무엇인가요?", "options": ["무서워서 법정 밖으로 도망쳤다", "\"판결을 먼저 내리고 증거를 나중에 본다니 말도 안 돼요!\"라고 옳지 않은 것 앞에서 또박또박 목소리를 냈다", "여왕의 편을 들어 칭찬받았다", "졸다가 재판을 놓쳤다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'회중시계'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["벽에 거는 큰 시계", "모래가 흘러내리는 시계", "주머니에 넣고 다니는 작은 시계", "손목에 차는 시계"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'호령'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["부드럽게 달래는 말", "길게 부르는 노래", "조용히 속삭이는 말", "큰 소리로 꾸짖거나 명령함"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "하트 여왕 앞에서 앨리스가 그다지 무섭지 않았던 까닭은 무엇인가요?", "options": ["신기한 일을 다 겪어 본 데다, 여왕의 호령이 요란하기만 할 뿐 이치에 맞지 않는다는 것을 알아보았기 때문에", "여왕이 사실은 착한 사람이었기 때문에", "카드 병사들이 앨리스를 지켜 주었기 때문에", "앨리스의 몸이 커져 있었기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "꿈에서 깬 앨리스가 '어딘가 조금 달라져' 있었던 것은 무엇을 배웠기 때문인가요?", "options": ["구구단을 더 잘 외우게 되었기 때문에", "토끼를 기르는 법을 배웠기 때문에", "낯선 것 앞에서 스스로 생각하는 법과, 옳지 않은 것 앞에서 목소리를 내는 법을 배웠기 때문에", "차를 예의 바르게 마시는 법을 배웠기 때문에"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "이상한 나라를 헤매는 동안 앨리스가 성장해 간 방식으로 옳은 것은 무엇입니까?", "options": ["어리둥절한 일을 겪을수록 울며 주저앉는 대신 부지런히 묻고 따지며 스스로 생각했다", "어른들의 말을 그대로 따르기로 했다", "힘센 친구를 사귀어 보호를 받았다", "이상한 일은 모두 못 본 척했다"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "체셔 고양이의 특징으로 옳은 것은 무엇입니까?", "options": ["앨리스를 잡아먹으려 뒤쫓았다", "여왕의 명령만 따르는 충직한 신하였다", "언제나 씩 웃고 있으며, 몸이 사라져도 웃음만은 허공에 남는다", "말을 하지 못하는 평범한 고양이였다"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "하트 여왕의 정원에서 카드 병사들이 하고 있던 일은 무엇입니까?", "options": ["파이를 굽고 있었다", "붉은 장미를 심으라는 명령을 어긴 탓에, 하얀 장미에 붉은 칠을 하고 있었다", "장미를 모두 뽑고 있었다", "앨리스를 체포하려 기다리고 있었다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "이야기의 결말로 옳은 것은 무엇입니까?", "options": ["앨리스가 여왕이 되어 이상한 나라를 다스렸다", "앨리스가 토끼 굴로 다시 돌아갔다", "여왕이 앨리스에게 사과했다", "카드들이 덮치던 순간 눈을 떠 보니 언니 곁의 풀밭이었고, 모든 것이 꿈이었다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "\"어디로 가고 싶은지에 달렸지.\"라는 체셔 고양이의 대답이 던지는 물음은 무엇입니까?", "options": ["가장 빠른 지름길이 어디인가 하는 물음", "네가 정말 가고 싶은 곳, 즉 스스로의 목적이 무엇인가 하는 물음", "고양이가 사는 곳이 어디인가 하는 물음", "길이 몇 개나 되는가 하는 물음"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "이상한 나라에서 '학교에서 배운 것이 통하지 않는' 설정이 하는 역할은 무엇입니까?", "options": ["익숙한 규칙이 무너진 세계에 앨리스를 세워, 스스로 생각하는 힘을 기르게 한다", "공부가 쓸모없다는 것을 가르친다", "앨리스의 학교 성적이 나빴음을 보여 준다", "이상한 나라의 교육 제도를 소개한다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'환상 동화'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["실제 역사를 기록한 이야기", "슬픈 결말로 끝나는 이야기", "위인의 삶을 다룬 이야기", "현실에서 일어날 수 없는 신비한 상상의 세계를 그린 이야기"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'말장난(말의 놀이)'을 이 작품의 맥락에서 풀이하면 무엇입니까?", "options": ["거짓말로 남을 속이는 것", "시끄럽게 떠드는 것", "말의 소리와 뜻을 재치 있게 비틀어 웃음과 생각거리를 만드는 표현", "말을 더듬는 버릇"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "떨어지면서도 잼 병을 아래로 던지지 않고 선반에 올려 둔 행동에서 알 수 있는 앨리스의 됨됨이는 무엇입니까?", "options": ["낯선 상황에서도 남이 다칠까 먼저 헤아리는 마음", "잼을 아까워하는 알뜰함", "높은 곳을 무서워하는 소심함", "물건을 제자리에 두는 정리 습관"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'호기심이 두려움보다 언제나 한 발 앞섰다'는 서술이 뜻하는 바를 추론하면 무엇입니까?", "options": ["앨리스가 달리기를 잘한다는 뜻", "무섭고 낯선 일 앞에서도 알고 싶은 마음이 더 커서, 모험을 계속하게 되었다는 뜻", "두려움을 전혀 느끼지 못한다는 뜻", "호기심은 위험하다는 뜻"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "앨리스의 모험 전체를 관통하는 성장의 핵심은 무엇인가?", "options": ["힘센 어른의 보호를 받는 법을 배운 것", "규칙을 무조건 지키는 법을 배운 것", "권위와 혼란 앞에서 스스로 판단하고, 옳지 않은 것에 목소리를 내는 주체성을 갖게 된 것", "이상한 나라의 규칙을 모두 외운 것"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "하트 여왕이라는 인물이 상징하는 바로 가장 적절한 것은 무엇인가?", "options": ["겁을 줄 뿐 이치에 맞지 않는, 요란하지만 공허한 권위", "백성을 위한 참된 지도력", "엄격하지만 공정한 법질서", "전통을 지키는 지혜"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "작품에 대한 정보로 옳은 것은 무엇인가?", "options": ["프랑스 작가가 쓴 모험 소설이다", "1965년에 발표된 현대 동화이다", "작가는 화가이기도 했다", "영국 작가 루이스 캐럴이 1865년 발표한 환상 동화로, 작가는 수학자이기도 했다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "엉터리 재판의 전개로 옳은 것은 무엇인가?", "options": ["증거를 꼼꼼히 살펴 범인을 밝혀냈다", "증거와 증인은 뒷전인 채 여왕이 \"판결이 먼저다!\"라고 외쳤고, 항의한 앨리스에게 병사들이 달려들었다", "앨리스가 파이 도둑으로 몰려 갇혔다", "재판은 열리지 못하고 취소되었다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'말이 안 되는 것처럼 보이는 이야기들이 사실은 정교하게 짜인 말의 놀이'라는 평가가 가리키는 이 작품의 특징은 무엇인가?", "options": ["허무맹랑해 보이는 대사와 사건들 속에 논리와 언어를 비트는 치밀한 재치가 숨어 있다는 것", "이야기가 아무 계획 없이 쓰였다는 것", "어린이는 이해할 수 없는 작품이라는 것", "번역이 잘못되었다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "꿈이라는 결말 장치가 작품에서 거두는 효과로 가장 적절한 것은 무엇인가?", "options": ["모험이 모두 거짓이었음을 강조해 허무하게 만든다", "앞의 이야기를 모두 무의미하게 만든다", "환상 세계를 현실로 안전하게 되돌리면서도, 꿈이 남긴 성장은 사라지지 않음을 보여 준다", "속편을 만들기 위한 장치일 뿐이다"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'고전 명작'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["옛날 말로 쓰여 읽기 어려운 책", "오랜 세월이 지나도 가치를 인정받으며 꾸준히 사랑받는 뛰어난 작품", "출간된 지 오래된 모든 책", "박물관에 보관된 책"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'주체성'을 앨리스의 모험에 적용해 풀이하면 무엇인가?", "options": ["남의 판단에 기대지 않고 제 머리로 생각하고 제 목소리로 말하는 태도", "몸의 크기를 마음대로 바꾸는 능력", "파티의 주인이 되는 자리", "여왕의 명령을 잘 따르는 자세"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'규칙이 통하지 않는 이상한 나라'가 상상력과 관련해 보여 주는 바를 추론하면 무엇인가?", "options": ["규칙 없는 세상은 위험하니 피해야 한다는 것", "이상한 나라는 실제로 존재한다는 것", "꿈은 기억할 필요가 없다는 것", "당연하게 여기던 것을 마음껏 뒤집어 생각할 때 열리는 무한한 가능성"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "「토끼 굴은 어디에나 있어요.」라는 경구가 전하는 메시지는 무엇인가?", "options": ["토끼를 조심하라는 것", "새로운 세계로 통하는 문은 일상 곳곳에 있으며, 상상력과 용기를 내는 사람에게만 보인다는 것", "굴에 빠지지 않게 길을 잘 보라는 것", "시골에 살아야 모험을 할 수 있다는 것"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '이상한 나라의 앨리스' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldlit07',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldlit07',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
