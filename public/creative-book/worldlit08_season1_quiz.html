<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐺 늑대의 아이 모글리 — 정글북 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계문학08/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "곰 발루는 모글리에게 어떤 스승이었나요?", "options": ["무섭기만 하고 정이 없는 스승", "사냥만 가르치는 스승", "꾀를 부리면 꿀밤을 먹이지만 수업이 끝나면 꿀을 나누어 주는, 엄하고도 따뜻한 스승", "말을 가르쳐 주지 않는 스승"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "호랑이 시어칸은 어떤 인물인가요?", "options": ["빼앗긴 사냥감인 모글리를 잊지 않고 이를 갈며, 거짓말을 퍼뜨려 무리를 갈라놓는 정글의 폭군", "모글리를 지켜 주는 든든한 보호자", "발루와 친한 장난꾸러기", "숲을 다스리는 지혜로운 왕"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "아기 모글리가 늑대 무리의 일원이 된 과정으로 알맞은 것은 무엇인가요?", "options": ["시어칸이 아기를 늑대에게 맡겼다", "모글리가 스스로 시험을 통과했다", "어미 늑대가 몰래 숨겨 키웠다", "보름달 밤의 회의에서 발루가 보증을 서고 바기라가 소 한 마리를 내놓아, 정식으로 받아들여졌다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "흑표범 바기라가 모글리에게 가르친 것은 무엇인가요?", "options": ["새들의 말과 노래", "발소리를 죽여 다가가고 바람을 읽는 사냥법, 그리고 나무 오르는 법", "불을 피우는 법", "물고기를 잡는 법"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "동물들이 '붉은 꽃'이라고 부른 것은 무엇인가요?", "options": ["동물들이 무서워 이름조차 부르지 못하는 것, 바로 불", "정글에 피는 빨간 장미", "시어칸의 눈동자", "해 질 녘의 노을"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "모글리의 '가장 큰 싸움'은 무엇이었다고 했나요?", "options": ["시어칸과의 몸싸움", "젊은 늑대들과의 달리기 시합", "'나는 누구인가'라는 물음과의 싸움", "발루와의 수업"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'보증'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["선물을 주는 일", "틀림없다고 책임지고 약속하는 것", "큰 소리로 노래하는 것", "길을 안내하는 것"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'포효'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["포도를 따는 일", "동물들의 인사법", "조용히 우는 소리", "사나운 짐승이 크게 울부짖는 소리"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "시어칸이 젊은 늑대들에게 거짓말을 퍼뜨리고 다닌 까닭은 무엇인가요?", "options": ["늑대들과 친해지고 싶어서", "힘으로 안 되니 무리를 안에서 갈라놓아 모글리를 내쫓게 하려고", "발루에게 칭찬을 받고 싶어서", "정글의 법을 지키려고"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "불 앞에서 시어칸이 도망친 장면이 보여 주는 것은 무엇인가요?", "options": ["시어칸이 사실은 착했다는 것", "불이 시어칸의 친구라는 것", "호랑이는 물을 무서워한다는 것", "그토록 사납던 폭군도 불 앞에서는 한낱 겁쟁이였다는 것"], "correct": 3}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "어미 늑대가 낯선 인간 아기를 거둔 까닭으로 옳은 것은 무엇입니까?", "options": ["시어칸이 부탁했기 때문", "겁 없이 새끼들 틈으로 파고드는 모습에 마음이 움직여, 시어칸에게 내어 줄 수 없다고 결심했기 때문", "인간에게 상을 받으려고", "새끼가 없어 외로웠기 때문"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "시어칸을 물리친 뒤 모글리가 겪은 마음의 갈등은 무엇입니까?", "options": ["더 강한 적이 나타날까 하는 걱정", "불을 잃어버린 데 대한 후회", "형제들에게 미움받을까 하는 두려움", "정글에서는 인간이라 불리고 마을에서는 늑대라 불리는, 어디에도 완전히 속하지 못하는 서러움"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "발루의 수업 내용으로 옳은 것은 무엇입니까?", "options": ["물웅덩이 앞에서 다투지 않는 것 같은 정글의 법과, 새·뱀·원숭이 등 여러 동물의 말", "무기를 만드는 법", "인간의 글자와 숫자", "마을에서 장사하는 법"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "바위 언덕 대결의 전개로 옳은 것은 무엇입니까?", "options": ["발루가 시어칸과 몸싸움을 벌였다", "늑대들이 힘을 합쳐 시어칸을 쫓아냈다", "마을 화롯불에서 불씨를 담아 온 모글리가 불붙은 나뭇가지를 휘두르자, 시어칸이 꼬리를 만 채 도망쳤다", "시어칸이 모글리를 굴복시켰다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "\"정글에서 가장 위험한 것은 발톱이 아니라 검은 속셈이란다.\"라는 바기라의 말이 뜻하는 바는 무엇입니까?", "options": ["발톱을 깎아야 한다는 것", "드러난 힘보다, 뒤에서 꾸미는 음모와 이간질이 더 무섭다는 것", "표범의 발톱이 가장 날카롭다는 것", "속셈은 검은색이라는 것"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "모글리가 인간 마을로 내려가는 장면이 이야기에서 갖는 의미는 무엇입니까?", "options": ["정글의 아이가 처음으로 인간의 세계와 맞닿는, 두 세계가 만나는 순간", "모글리가 정글을 영영 떠나는 장면", "시어칸과 화해하러 가는 장면", "발루와 이별하는 장면"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'본색을 드러내다'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["몸의 색깔이 변하다", "얼굴이 빨개지다", "숨기고 있던 본래의 성질이나 속셈을 드러내다", "새 옷으로 갈아입다"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'정체성'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["몸이 얼마나 튼튼한가 하는 것", "'나는 누구인가'에 대한, 변하지 않는 자기 자신에 대한 인식", "어느 편이 이겼는가 하는 것", "시간이 멈추어 있는 상태"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'핏줄이 아니라 마음이 모글리를 가족으로 만들었다'는 서술이 함축하는 바는 무엇입니까?", "options": ["가족을 이루는 것은 태생이 아니라 서로 아끼고 책임지는 마음이라는 것", "늑대와 인간은 핏줄이 같다는 것", "가족은 반드시 핏줄로 이어져야 한다는 것", "모글리에게는 가족이 없었다는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'거짓말도 여러 번 들으면 그럴듯하게 들리는 법'이라는 서술이 젊은 늑대들의 변심과 관련해 주는 교훈은 무엇입니까?", "options": ["거짓말은 한 번만 하면 괜찮다는 것", "되풀이되는 모함에 넘어가지 않으려면 스스로 진실을 가려듣는 눈이 필요하다는 것", "여러 번 말하면 거짓도 진실이 된다는 것", "늑대는 원래 의심이 많다는 것"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "방황 끝에 모글리가 도달한 깨달음으로 가장 적절한 것은 무엇인가?", "options": ["'어디에 속하는가'보다 '나는 어떤 사람이 되고 싶은가'가 중요하며, 결국 나를 정하는 것은 나 자신이라는 것", "정글을 버리고 인간이 되어야 한다는 것", "인간 세계를 잊고 늑대로 살아야 한다는 것", "강한 자만이 살아남는다는 것"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "발루와 바기라 두 스승의 가르침을 바르게 대비한 것은 무엇인가?", "options": ["발루는 사냥을, 바기라는 노래를 가르쳤다", "발루는 정글의 법과 말을 가르치는 다정한 스승, 바기라는 생존의 기술을 단련시키는 진지한 스승이었다", "두 스승 모두 같은 것을 가르쳤다", "발루는 인간의 지식을, 바기라는 정글의 법을 가르쳤다"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "작품 「정글북」에 대한 정보로 옳은 것은 무엇인가?", "options": ["프랑스 작가가 쓴 장편 동화이다", "1994년에 발표된 현대 소설이다", "주인공은 곰 발루이다", "영국 작가 러디어드 키플링이 1894년 발표한 단편집으로, 모글리의 성장 이야기가 중심에 있다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "시어칸의 위협이 커져 가는 과정으로 옳은 것은 무엇인가?", "options": ["처음부터 무리 전체와 전면전을 벌였다", "발루를 먼저 공격했다", "때를 노리며 젊은 늑대들을 꾀어 무리를 갈라놓은 뒤, 모글리가 소년이 되자 대놓고 내놓으라 위협했다", "인간 마을을 습격해 불을 훔쳤다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'불(붉은 꽃)'이 작품에서 지니는 상징적 의미로 가장 적절한 것은 무엇인가?", "options": ["정글의 아름다움", "모글리가 동물과 구별되는 인간임을 드러내는 힘이자, 가족을 지키는 무기이면서 형제들과의 거리를 만드는 양날의 상징", "시어칸의 분노", "파괴와 재앙만을 뜻하는 상징"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'모글리는 길 잃은 아이가 아니라 두 세계를 잇는 다리가 된 아이'라는 결말의 서술이 제시하는 주제는 무엇인가?", "options": ["어느 쪽에도 온전히 속하지 못하는 다름이 결핍이 아니라, 양쪽을 모두 이해하는 고유한 가치가 될 수 있다는 것", "다리는 튼튼하게 지어야 한다는 것", "두 세계는 결국 하나가 될 수 없다는 것", "아이는 반드시 한 세계를 선택해야 한다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'공존'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["강한 쪽이 약한 쪽을 다스리는 것", "서로 떨어져 간섭하지 않는 것", "서로 다른 존재들이 함께 어울려 살아가는 것", "공을 함께 가지고 노는 것"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'이간질'의 의미로 가장 적절한 것은 무엇인가?", "options": ["사이좋게 지내도록 돕는 일", "둘 사이를 오가며 소식을 전하는 일", "시간을 알려 주는 일", "두 사람이나 무리 사이를 헐뜯어 서로 멀어지게 만드는 짓"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "불을 든 모글리를 본 형제들의 눈에 '낯선 두려움'이 어린 까닭을 추론하면 무엇인가?", "options": ["모글리가 갑자기 커졌기 때문", "함께 자란 형제가 자신들은 다룰 수 없는 인간의 힘을 지닌 다른 존재임을 실감했기 때문", "불이 너무 뜨거웠기 때문", "시어칸이 돌아올까 봐 무서웠기 때문"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "이 작품이 오늘날에도 울림을 주는 까닭으로 제시된 것은 무엇인가?", "options": ["동물과 인간이 서로 존중하며 함께 사는 길, 곧 자연과 인간의 공존을 조용히 묻고 있기 때문", "호랑이가 등장하기 때문", "정글이 신비롭게 묘사되기 때문", "영화로 많이 만들어졌기 때문"], "correct": 0}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '정글북' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldlit08',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldlit08',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
