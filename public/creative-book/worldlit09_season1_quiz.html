<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧚 네버랜드로 날아간 밤 — 피터 팬 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계문학09/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "피터 팬은 어떤 소년인가요?", "options": ["어른이 되기 싫어 어른들의 세상을 떠나, 영원히 아이의 모습으로 사는 소년", "런던에서 학교에 다니는 평범한 소년", "해적선에서 자란 소년", "요정들이 기른 왕자"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "웬디는 어떤 아이인가요?", "options": ["동생들과 자주 다투는 말괄량이", "혼자 있기를 좋아하는 조용한 아이", "밤마다 동생들에게 이야기를 들려주는 다정한 맏이로, 네버랜드에서는 아이들의 엄마 역할을 맡았다", "모험을 무서워하는 겁쟁이"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "피터 팬이 한밤중 웬디네 방에 들어온 까닭은 무엇인가요?", "options": ["후크 선장을 피해 숨으려고", "이야기를 들으러 왔다가 잃어버린 자기 그림자를 찾으려고", "팅커벨을 잃어버려서", "길을 잘못 들어서"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "세 남매가 하늘을 날 수 있었던 방법은 무엇인가요?", "options": ["마법 빗자루를 타고", "날개옷을 입고", "피터의 손을 꼭 잡고", "팅커벨의 요정 가루를 받고, 가장 즐거운 생각을 떠올려서"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "후크 선장이 악어를 무서워하는 까닭은 무엇인가요?", "options": ["악어가 해적선을 부쉈기 때문에", "악어가 피터 팬의 친구이기 때문에", "악어가 자기의 잘린 손을 삼킨 뒤로 그 맛을 잊지 못해 늘 뒤를 쫓아다니기 때문에", "어릴 적 악어에게 물린 적이 있기 때문에"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "악어가 다가올 때마다 째깍째깍 소리가 나는 까닭은 무엇인가요?", "options": ["후크의 손과 함께 시계까지 삼켰기 때문에", "악어가 이를 가는 소리 때문에", "목에 방울을 달고 있기 때문에", "해적선의 종소리 때문에"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'원한'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["오래된 소원", "멀리 있는 나라", "고마운 마음", "억울하고 분해서 잊지 못하는 마음"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'아지트'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["해적들의 배", "무리가 모이는 숨겨진 근거지", "요정의 날개", "섬의 가장 높은 산"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "즐겁던 네버랜드에서 웬디가 집으로 돌아가기로 결심한 까닭은 무엇인가요?", "options": ["아무리 즐거워도 엄마의 따뜻한 품만은 대신할 수 없어, 그리움이 자꾸 커졌기 때문에", "후크 선장이 무서웠기 때문에", "피터 팬과 다투었기 때문에", "숙제가 밀렸기 때문에"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "함께 살자는 권유에 피터 팬이 고개를 저은 까닭은 무엇인가요?", "options": ["달링 부인이 싫었기 때문에", "팅커벨이 반대했기 때문에", "언제까지나 아이로 남아 놀고 모험하고 싶어, 어른이 되는 길을 택하지 않았기 때문에", "네버랜드에 두고 온 물건이 있었기 때문에"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "후크 선장이 피터 팬에게 복수를 벼르는 까닭으로 옳은 것은 무엇입니까?", "options": ["피터가 해적선을 훔쳤기 때문", "피터가 팅커벨을 빼앗아 갔기 때문", "피터가 보물 지도를 가졌기 때문", "예전에 피터와 싸우다 오른손을 잃고 갈고리를 달게 되었기 때문"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "네버랜드에서 웬디가 한 일로 옳은 것은 무엇입니까?", "options": ["해적들과 싸우는 법을 가르쳤다", "저녁마다 이야기를 들려주고, 해진 옷을 기워 주고, 이불을 덮어 주며 아이들을 돌보았다", "인어들에게 노래를 배웠다", "보물찾기 대회를 열었다"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "네버랜드에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["부모 없이 사는 잃어버린 아이들이 피터를 대장으로 따르고, 인어의 호수와 인디언 마을이 있으며, 하늘을 날아서만 갈 수 있는 섬이다", "기차를 타고 갈 수 있는 육지의 나라이다", "어른들만 사는 섬이다", "일 년 내내 눈이 내리는 섬이다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "해적선에서 벌어진 마지막 대결의 전개로 옳은 것은 무엇입니까?", "options": ["팅커벨이 후크를 물리쳤다", "아이들이 스스로 밧줄을 풀고 도망쳤다", "붙잡힌 아이들을 미끼로 삼으려던 후크 앞에 피터가 나타나 대결에서 이겼고, 악어 소리에 놀란 후크는 바다로 뛰어들어 도망쳤다", "후크가 피터를 사로잡았다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "무서운 후크에게 '악어'라는 약점을 붙여 놓은 설정의 효과는 무엇입니까?", "options": ["무서운 악당을 우스꽝스럽게 만들어 이야기에 웃음을 더하고, 아이들이 지나치게 겁먹지 않게 한다", "악어를 주인공으로 만든다", "후크를 더 무섭게 만든다", "바다의 위험을 경고한다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'웬디의 마음 한구석에 생긴 조그만 구멍'이 가리키는 것은 무엇입니까?", "options": ["아지트 천장에 뚫린 구멍", "옷에 난 구멍", "이야깃거리가 떨어진 걱정", "즐거운 나날 속에서도 문득문득 커져 가는, 진짜 엄마와 집에 대한 그리움"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'사무치다'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["일을 처리하다", "그리움 같은 감정이 마음속 깊이 파고들다", "사무실에서 일하다", "화가 나서 소리치다"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'궁지에 몰리다'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["궁궐로 초대받다", "활을 쏘게 되다", "빠져나갈 길 없는 어려운 처지에 놓이다", "깊은 잠에 빠지다"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "피터가 '관심 없는 척하면서 이야기가 제일 잘 들리는 자리에 앉아 있던' 모습에서 추론할 수 있는 것은 무엇입니까?", "options": ["자리가 하나밖에 없었다는 것", "어른을 거부하는 피터의 마음속에도 이야기와 따뜻함을 그리워하는 아이의 마음이 숨어 있다는 것", "피터가 귀가 어둡다는 것", "피터가 이야기를 지루해했다는 것"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "달링 부인이 잃어버린 아이들에게 망설임 없이 두 팔을 벌린 행동에서 알 수 있는 것은 무엇입니까?", "options": ["아이들을 가족으로 품는 데 조건을 달지 않는 넉넉한 사랑", "아이들의 일손이 필요했다는 것", "집이 넓어서 걱정이 없었다는 것", "웬디의 부탁을 거절하지 못하는 성격"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "웬디와 피터의 마지막 선택이 대비되어 보여 주는 주제는 무엇인가?", "options": ["집이 섬보다 안전하다는 것", "자라서 어른이 되는 길도, 아이의 마음을 간직하는 길도 저마다 소중한 선택이라는 것", "모험은 한 번으로 충분하다는 것", "어른이 되는 쪽이 언제나 옳다는 것"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "네버랜드에서의 웬디의 성장을 바르게 설명한 것은 무엇인가?", "options": ["아이들을 돌보며 저도 모르게 어머니의 마음을 배워 갔고, 그 마음이 집으로 돌아갈 결심으로 이어졌다", "이야기 솜씨가 나빠졌다", "하늘을 나는 기술만 늘었다", "해적과 싸우는 전사가 되었다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "작품 「피터 팬」에 대한 정보로 옳은 것은 무엇인가?", "options": ["영국 잉글랜드 작가의 소설로 처음 발표되었다", "1911년 연극으로 처음 무대에 올랐다", "스코틀랜드 작가 제임스 매튜 배리의 작품으로, 1904년 연극으로 첫선을 보이고 1911년 소설로 발표되었다", "처음부터 만화 영화로 만들어졌다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "결말에서 잃어버린 아이들의 운명으로 옳은 것은 무엇인가?", "options": ["네버랜드에 그대로 남았다", "해적이 되어 바다로 떠났다", "각자 흩어져 살게 되었다", "웬디를 따라 런던으로 와서, 달링 부인의 가족으로 받아들여져 난생처음 진짜 가족을 갖게 되었다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'즐거운 생각을 하면 날 수 있다'는 설정이 지니는 상징적 의미로 가장 적절한 것은 무엇인가?", "options": ["행복한 마음과 상상력이야말로 사람을 자유롭게 띄워 올리는 힘이라는 것", "요정 가루가 과학적으로 가능하다는 것", "슬픈 사람은 여행할 수 없다는 것", "하늘을 나는 꿈은 위험하다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "네버랜드라는 공간이 상징하는 바로 가장 적절한 것은 무엇인가?", "options": ["어른들의 일터", "숙제도 잔소리도 어른이 될 걱정도 없는, 영원한 어린 시절과 상상력의 세계", "실제로 존재하는 남쪽 섬", "위험만 가득한 무법지대"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'판타지'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["실제 사건을 다룬 기록 문학", "웃음을 주는 짧은 이야기", "역사적 인물의 전기", "현실의 법칙을 넘어선 상상의 세계를 그린 갈래"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'순수함'을 이 작품의 맥락에서 풀이하면 무엇인가?", "options": ["아무것도 모르는 무지함", "물이 깨끗한 상태", "때 묻지 않은 어린아이 그대로의 맑은 마음", "규칙을 지키지 않는 자유분방함"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'웃음 뒤에 깊은 마음이 담겨 있다'는 이 작품 평가가 가리키는 바를 추론하면 무엇인가?", "options": ["유쾌한 모험담 아래에 어른이 되는 두려움과 순수함을 지키려는 마음이 흐르고 있다는 것", "해적 장면이 가장 웃기다는 것", "작가가 코미디 배우였다는 것", "결말이 슬프다는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'몸이 자라도 마음속 네버랜드는 사라지지 않는다'는 결말의 문장이 주는 메시지는 무엇인가?", "options": ["네버랜드 지도를 잘 보관하라는 것", "어른이 되어서도 어린 시절의 상상력과 설렘을 마음 한켠에 간직할 수 있다는 것", "어른은 다시 아이가 될 수 있다는 것", "키가 자라지 않는 사람도 있다는 것"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '피터 팬' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldlit09',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldlit09',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
