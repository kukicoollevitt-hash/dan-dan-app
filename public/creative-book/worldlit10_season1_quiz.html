<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏝️ 스물여덟 해의 무인도 — 로빈슨 크루소 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계문학10/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "젊은 시절의 로빈슨 크루소는 어떤 사람이었나요?", "options": ["고향에서 농사를 짓고 싶어 한 사람", "아버지의 반대를 무릅쓰고, 넓은 바다로 나아가는 꿈을 좇아 항해를 떠난 사람", "배 만드는 기술자가 되고 싶어 한 사람", "장사로 큰돈을 벌고 싶어 한 사람"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "프라이데이는 어떤 사람이었나요?", "options": ["로빈슨이 목숨을 구해 준 청년으로, 배움이 빠르고 마음이 따뜻한 충실한 벗이 되었다", "난파선에서 함께 살아남은 선원", "로빈슨을 찾아온 고향 친구", "섬에 살던 어부"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "로빈슨이 무인도에 홀로 남게 된 과정으로 알맞은 것은 무엇인가요?", "options": ["해적에게 붙잡혀 섬에 버려졌다", "보물을 찾으러 스스로 섬에 들어갔다", "무시무시한 폭풍에 배가 난파되어, 홀로 낯선 해변에 밀려와 살아남았다", "길을 잃고 헤엄쳐 섬에 닿았다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "난파선에서 로빈슨이 건져 온 것으로 알맞은 것은 무엇인가요?", "options": ["금화와 보석 상자", "편지와 지도", "새 옷과 신발", "뗏목으로 몇 번이고 오가며 나른 도구와 식량, 총과 화약"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "로빈슨이 기둥에 날마다 금을 그어 달력을 만든 까닭은 무엇인가요?", "options": ["날짜를 잃어버리면 나 자신도 잃을 것 같아서, 하루하루를 세는 것이 사람답게 사는 첫걸음이라 여겼기 때문에", "구조선이 오는 날짜를 맞히려고", "기둥을 예쁘게 꾸미려고", "칼 쓰는 연습을 하려고"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'부서진 배는 끝이 아니라 시작이 되어 주었다'는 말의 뜻은 무엇인가요?", "options": ["배를 고쳐서 다시 항해했다는 뜻", "배가 두 동강 났다는 뜻", "난파선에서 건진 물건들이 무인도 살림을 시작하는 밑천이 되었다는 뜻", "새 배가 곧 도착했다는 뜻"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'난파'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["배가 항구에 닿는 것", "파도를 타고 노는 것", "배를 새로 만드는 것", "배가 폭풍 등을 만나 부서지는 것"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'목축'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["나무를 심어 가꾸는 일", "소나 염소 같은 가축을 기르는 일", "물고기를 잡는 일", "곡식을 거두는 일"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "모래 위의 발자국을 본 로빈슨에게 반가움보다 두려움이 먼저 밀려온 까닭은 무엇인가요?", "options": ["발자국이 너무 컸기 때문에", "자기 발자국을 착각했기 때문에", "발자국의 주인이 어떤 사람일지 알 수 없었기 때문에", "맨발로 다니는 사람이 무서웠기 때문에"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "로빈슨이 섬을 '나를 가둔 감옥이자 나를 키워 준 학교'라고 말한 뜻은 무엇인가요?", "options": ["갇혀 지낸 고통의 시간이 동시에 스스로 살아가는 힘과 지혜를 길러 준 시간이기도 했다는 뜻", "섬에 감옥과 학교 건물이 있었다는 뜻", "섬에서 공부를 많이 했다는 뜻", "감옥보다 학교가 좋았다는 뜻"], "correct": 0}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "절망에 주저앉았던 로빈슨이 다시 일어서며 한 다짐으로 옳은 것은 무엇입니까?", "options": ["배를 만들어 당장 탈출하겠다는 다짐", "섬의 보물을 찾겠다는 다짐", "하늘만 원망하는 대신, 가진 것을 헤아리며 하루하루를 힘껏 살아 내겠다는 다짐", "구조될 때까지 아무것도 하지 않겠다는 다짐"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "수십 년 뒤 로빈슨의 달라진 모습으로 옳은 것은 무엇입니까?", "options": ["외로움에 지쳐 말을 잃었다", "고향을 완전히 잊어버렸다", "섬을 떠나 이웃 섬으로 옮겨 갔다", "구조만 기다리는 사람이 아니라 오늘을 살아 내는 사람, 곧 생존의 달인이자 섬의 주인이 되어 있었다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "무인도에서 로빈슨이 이룬 살림으로 옳은 것은 무엇입니까?", "options": ["동굴에서 열매만 따 먹으며 지냈다", "오두막을 짓고 야생 염소를 길들여 목축을 했으며, 밀알을 심어 농사짓고 빵을 굽고 그릇을 빚고 가죽옷을 지었다", "마을을 세워 여러 사람과 함께 살았다", "배를 만들어 고기잡이로 살았다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "프라이데이라는 이름의 유래로 옳은 것은 무엇입니까?", "options": ["청년을 구한 날이 마침 금요일이어서, 만난 날을 기억하자는 뜻으로 지었다", "청년의 고향 말로 친구라는 뜻이어서", "로빈슨이 가장 좋아하는 요일이어서", "청년이 스스로 지은 이름이어서"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'잃은 것을 세며 한탄하는 대신 가진 것을 세며 감사하게 되었다'는 변화가 보여 주는 것은 무엇입니까?", "options": ["로빈슨의 셈이 빨라졌다는 것", "절망을 이기는 힘이 처지의 변화가 아니라 마음가짐의 변화에서 시작된다는 것", "섬의 물건이 많아졌다는 것", "감사 일기를 쓰기 시작했다는 것"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "모래 위의 발자국 사건이 이야기에서 하는 역할은 무엇입니까?", "options": ["수십 년의 평온한 일상을 깨뜨리고, 프라이데이와의 만남이라는 새 국면으로 이야기를 이끈다", "로빈슨의 탈출 계획을 알린다", "섬의 지도를 완성하게 한다", "이야기를 처음으로 되돌린다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'표류'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["표를 사서 여행하는 것", "깃발을 흔드는 것", "계획대로 항해하는 것", "정처 없이 물결에 떠밀려 다니는 것"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'귀환'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["귀한 물건을 바치는 것", "다른 곳으로 떠나는 것", "떠났던 곳으로 다시 돌아오는 것", "환하게 웃는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "첫 수확의 날 로빈슨이 눈물이 핑 돌 만큼 기뻤던 까닭을 추론하면 무엇입니까?", "options": ["씨를 뿌리면 거둔다는 사실에서, 이 외딴섬에서도 부지런히 일하면 살아갈 수 있다는 희망을 확인했기 때문", "밀 값이 비쌌기 때문", "고향의 빵 맛이 생각났기 때문", "농사가 취미였기 때문"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'무인도에서 살아 돌아온 것이 아니라, 무인도에서 살아 낸 사람으로 돌아왔다'는 문장의 뜻을 추론하면 무엇입니까?", "options": ["로빈슨이 섬을 그리워하게 되었다는 뜻", "운 좋게 버틴 것이 아니라, 스스로의 힘으로 삶을 일구어 성장한 사람이 되어 돌아왔다는 뜻", "로빈슨이 섬에 다시 돌아갈 것이라는 뜻", "고향 사람들이 로빈슨을 못 알아보았다는 뜻"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "로빈슨의 무인도 생활이 보여 주는 인간상으로 가장 적절한 것은 무엇인가?", "options": ["절망적 환경에서도 이성과 노동으로 삶의 질서를 세워 가는, 생존 본능과 지혜를 지닌 인간", "운명에 순응하며 기다리는 인간", "타인의 도움 없이는 아무것도 못 하는 인간", "자연을 두려워하며 피하는 인간"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "로빈슨과 프라이데이의 관계가 보여 주는 바로 가장 적절한 것은 무엇인가?", "options": ["주인과 하인의 관계는 변하지 않는다는 것", "경쟁을 통해 우정이 자란다는 것", "말도 생김새도 다른 두 사람이 서로 배우고 의지하며 세상 어떤 사이보다 가까운 벗이 될 수 있다는 것", "은혜는 반드시 갚아야 한다는 것"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "작품 「로빈슨 크루소」에 대한 정보로 옳은 것은 무엇인가?", "options": ["프랑스 작가의 단편 소설이다", "1919년에 발표된 현대 소설이다", "순수한 상상만으로 지어낸 이야기이다", "영국 작가 대니얼 디포가 1719년 발표한 긴 소설로, 실제 무인도에 살았던 선원의 이야기에서 영감을 받았다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "결말의 전개로 옳은 것은 무엇인가?", "options": ["로빈슨이 섬에 남기로 결심했다", "28년 만에 영국 배가 섬에 닿아, 로빈슨은 프라이데이와 함께 그리운 고향으로 돌아갔다", "프라이데이가 홀로 섬을 지키게 되었다", "로빈슨이 뗏목을 타고 스스로 탈출했다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "이 작품이 '모험 문학의 첫 페이지'로 평가받는 까닭은 무엇인가?", "options": ["훗날 나온 수많은 무인도 이야기들이 거의 모두 이 작품에 뿌리를 두고 있기 때문", "가장 먼저 영화로 만들어졌기 때문", "작가가 모험가였기 때문", "책의 첫 장이 모험으로 시작하기 때문"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "섬 생활 서사에서 '몸의 살림'과 '마음의 살림'을 나누어 그린 구성의 효과는 무엇인가?", "options": ["집 짓는 방법을 자세히 알려 준다", "생존이 의식주 해결만이 아니라 고독과 절망을 다스리는 내면의 싸움이기도 함을 입체적으로 보여 준다", "이야기를 두 배로 길게 만든다", "로빈슨의 부지런함을 자랑한다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'개척'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["남이 만든 것을 이어받는 것", "낡은 것을 부수는 것", "아무도 손대지 않은 땅이나 분야를 열어 새로운 터전을 이루는 것", "길을 따라 걷는 것"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'생존 본능'의 의미로 가장 적절한 것은 무엇인가?", "options": ["어떤 상황에서도 살아남으려는 타고난 힘과 의지", "혼자 있고 싶어 하는 성격", "먹을 것을 탐하는 욕심", "위험을 즐기는 모험심"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "'절망을 이겨 내는 인간의 이야기는 결코 낡지 않는다'는 서술이 이 작품의 생명력과 관련해 함축하는 바는 무엇인가?", "options": ["오래된 책일수록 좋다는 것", "무인도 여행이 유행할 것이라는 것", "절망이 없는 시대가 올 것이라는 것", "시대가 바뀌어도 사람은 저마다의 '무인도'를 만나므로, 일어서는 인간의 이야기는 언제나 새로 읽힌다는 것"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "「절망은 주저앉는 자의 것이고, 무인도는 일어서는 자의 밭이 돼요.」라는 경구의 메시지는 무엇인가?", "options": ["밭농사가 가장 중요한 일이라는 것", "같은 시련도 주저앉으면 절망이 되고 일어서면 삶의 터전이 되니, 태도가 운명을 가른다는 것", "무인도에는 밭이 많다는 것", "절망은 빨리 잊는 것이 좋다는 것"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '로빈슨 크루소' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldlit10',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldlit10',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
