<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 소인국과 거인국을 오간 뱃사람 — 걸리버 여행기 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계문학11/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "걸리버는 어떤 사람인가요?", "options": ["넓은 세상이 궁금해 먼바다를 오가던, 배에서 일하는 의사", "보물을 찾아다니는 해적", "소인국에서 태어난 왕자", "육지에서만 사는 농부"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "릴리퍼트에서 걸리버가 소인들의 믿음을 얻은 방법은 무엇인가요?", "options": ["맛있는 음식을 만들어 주어서", "줄을 끊고 힘을 자랑해서", "소인들의 말을 금방 배워서", "갑자기 움직이지 않고 목소리를 낮추며, 해치지 않겠다는 것을 몸짓으로 보여 주어서"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "릴리퍼트를 위해 걸리버가 해낸 일로 알맞은 것은 무엇인가요?", "options": ["성을 새로 지어 주었다", "이웃 나라의 배들을 줄로 묶어 끌고 왔고, 한밤중 궁전의 큰불도 꺼 주었다", "소인들에게 글을 가르쳤다", "바다에 다리를 놓아 주었다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "릴리퍼트와 이웃 나라 사이에 전쟁이 시작된 까닭은 무엇인가요?", "options": ["보물을 서로 차지하려고", "임금들끼리 사이가 나빠서", "삶은 달걀을 뾰족한 쪽부터 깨느냐 뭉툭한 쪽부터 깨느냐 하는 다툼 때문에", "땅의 경계를 정하지 못해서"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "거인국에서 걸리버가 겪은 처지 변화로 알맞은 것은 무엇인가요?", "options": ["거인국에서 더 큰 거인이 되었다", "거인들의 왕이 되었다", "소인국에서 거인이었던 걸리버가, 이번에는 거꾸로 손가락만 한 소인이 되었다", "몸이 늘었다 줄었다 했다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "거인국에서 고양이와 말벌까지 무서웠던 경험이 걸리버에게 가르쳐 준 것은 무엇인가요?", "options": ["누군가에게는 아무것도 아닌 일이 다른 누군가에게는 목숨이 걸린 일일 수 있다는, 작고 약한 사람의 마음", "고양이를 길들이는 법", "벌레를 쫓는 법", "궁전에서 사는 법"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'은인'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["숨어 사는 사람", "은혜를 베풀어 준 고마운 사람", "은으로 만든 도장", "이웃에 사는 사람"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'허영심'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["남을 돕고 싶은 마음", "무엇이든 궁금해하는 마음", "비어 있는 마음", "실속 없이 겉만 화려하게 꾸며 뽐내려는 마음"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "달걀 전쟁 이야기를 통해 작가가 꼬집으려 한 것은 무엇인가요?", "options": ["사소한 일로 서로 미워하고 싸우는 사람들의 어리석은 다툼", "달걀 요리의 어려움", "소인국의 훌륭한 용기", "전쟁 무기의 발달"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "거인 농부의 손에 붙잡힌 걸리버가 '소인들이 나를 처음 보았을 때 이런 마음이었겠구나'라고 생각한 것은 무엇을 깨달은 것인가요?", "options": ["농부가 나쁜 사람이라는 것", "자기 몸이 작아졌다는 것", "입장이 뒤바뀌어 보니, 약한 자리에 선 이의 무서움을 비로소 이해하게 되었다는 것", "소인들이 힘이 세다는 것"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "소인들이 잠든 걸리버를 줄로 묶어 놓은 까닭으로 옳은 것은 무엇입니까?", "options": ["걸리버를 노예로 팔려고", "산처럼 큰 사람이 무서워, 나라를 지키려는 필사적인 몸부림이었기 때문", "걸리버의 옷을 빼앗으려고", "줄 묶기 연습을 하려고"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "거인국에서 걸리버를 대한 농부와 왕비의 차이로 옳은 것은 무엇입니까?", "options": ["농부는 걸리버를 상자에 넣어 구경거리로 전시해 돈을 벌었고, 왕비는 값을 치르고 데려와 귀한 손님으로 아꼈다", "농부는 걸리버를 무서워했고 왕비는 무시했다", "두 사람 모두 걸리버를 구경거리로 삼았다", "농부는 걸리버를 궁전에 보냈고 왕비는 내쫓았다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "비행섬 라퓨타의 학자들에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["게을러서 연구를 하지 않았다", "백성의 삶을 크게 개선했다", "걸리버에게 나는 법을 가르쳤다", "밤낮없이 연구했지만 사람들의 삶에 쓸모없는 연구뿐이었고, 정작 새는 지붕도 고칠 줄 몰랐다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "말이 다스리는 나라에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["말들이 걸리버를 왕으로 모셨다", "말과 사람이 전쟁을 벌이고 있었다", "지혜로운 말들이 나라를 다스리고, '야후'라 불리는 존재들이 부끄러운 모습으로 살고 있었다", "말들이 걸리버의 말을 훔쳐 갔다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'무서움은 서로를 모를 때 커지고, 다가서면 조금씩 녹아내린다'는 서술이 걸리버와 소인들의 관계에서 뜻하는 바는 무엇입니까?", "options": ["낯선 존재에 대한 공포는 서로를 알아 가면서 신뢰로 바뀔 수 있다는 것", "무서움은 시간이 지나면 저절로 사라진다는 것", "소인들이 겁쟁이였다는 것", "걸리버가 소인들을 놀라게 했다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'힘이란 어떻게 쓰느냐에 따라 전혀 달라진다'는 말이 걸리버의 행동과 관련해 뜻하는 바는 무엇입니까?", "options": ["힘은 셀수록 좋다는 것", "골칫거리가 될 수도 있던 커다란 몸을, 걸리버는 남을 지키는 데 써서 빛나게 했다는 것", "힘을 아껴 두어야 한다는 것", "힘없는 사람은 도울 수 없다는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'전시하다'를 이 이야기의 맥락(농부가 걸리버를 전시함)에서 풀이하면 무엇입니까?", "options": ["전쟁을 일으키다", "시장에서 물건을 사다", "여러 사람에게 보이도록 내놓아 구경거리로 삼다", "소중히 보관하다"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'편견'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["여러 편으로 나누는 것", "편리한 방법을 찾는 생각", "책을 여러 권 엮은 것", "한쪽으로 치우쳐 공정하지 못한 생각"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "소인들이 오히려 걸리버를 '이상한 사람'으로 쳐다본 장면이 보여 주는 것은 무엇입니까?", "options": ["걸리버의 옷차림이 이상했다는 것", "싸움에 빠져 있는 사람들에게는 그 다툼의 사소함이 보이지 않는다는 것", "소인들의 눈이 나빴다는 것", "걸리버가 달걀을 못 먹는다는 것"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "'진짜 여행은 돌아온 뒤에 익숙한 세상을 새로운 눈으로 보게 되는 것'이라는 서술의 뜻을 추론하면 무엇입니까?", "options": ["여행의 참된 값어치는 구경한 곳의 수가 아니라, 여행이 바꿔 놓은 자신의 시각에 있다는 것", "여행은 돌아오는 길이 가장 즐겁다는 것", "익숙한 곳은 여행할 필요가 없다는 것", "여행을 다녀오면 눈이 좋아진다는 것"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "여행을 마친 걸리버의 변화로 가장 적절한 것은 무엇인가?", "options": ["세상이 싫어져 다시는 배를 타지 않게 되었다", "거인국의 재산으로 부자가 되었다", "크고 작음이 정해진 것이 아니라 서는 자리에 따라 달라짐을 깨닫고, 세상을 바라보는 새로운 눈을 얻었다", "소인국의 왕이 되어 돌아갔다"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "소인국과 거인국에서 걸리버가 각각 배운 것을 바르게 짝지은 것은 무엇인가?", "options": ["소인국에서는 겸손을, 거인국에서는 용맹을 배웠다", "소인국에서는 한 발짝 떨어져 보면 다툼이 사소함을, 거인국에서는 낮은 자리에 선 약한 이의 마음을 배웠다", "소인국에서는 전쟁 기술을, 거인국에서는 농사법을 배웠다", "두 나라에서 같은 것을 배웠다"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "작품 「걸리버 여행기」에 대한 정보로 옳은 것은 무엇인가?", "options": ["영국 작가 조너선 스위프트가 1726년 발표한 풍자 소설이다", "대니얼 디포가 쓴 모험 소설이다", "1826년에 발표된 동화이다", "실제 항해 일지를 그대로 옮긴 기록이다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "걸리버가 여행한 나라들의 순서와 내용으로 옳은 것은 무엇인가?", "options": ["거인국 → 소인국 → 말의 나라 → 비행섬", "비행섬 → 소인국 → 거인국", "말의 나라 → 거인국 → 소인국 → 비행섬", "소인국 릴리퍼트 → 거인국 브로브딩낵 → 비행섬 라퓨타 → 말이 다스리는 나라"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'소인국과 거인국'이라는 대칭 구조가 거두는 효과로 가장 적절한 것은 무엇인가?", "options": ["이야기를 두 배로 길게 만든다", "같은 인물을 정반대 처지에 세움으로써, 크고 작음과 강하고 약함이 상대적임을 몸소 체험하게 한다", "두 나라의 지리를 비교하게 한다", "걸리버의 힘을 자랑하게 한다"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'웃음 속에 거울을 감춘 걸작'이라는 평가가 뜻하는 바는 무엇인가?", "options": ["우스꽝스러운 모험담의 옷을 입혀, 인간 세상의 허영과 어리석음을 비추는 날카로운 비판을 담았다는 것", "책 속에 실제 거울 그림이 있다는 것", "독자를 웃기기만 하면 걸작이 된다는 것", "거울처럼 반짝이는 표지로 유명하다는 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'상대적'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["상대방을 이기는 것", "언제나 변하지 않는 것", "마주 보고 서는 것", "무엇과 비교하느냐, 어디에 서느냐에 따라 달라지는 것"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'풍자 소설'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["바람과 자연을 노래한 소설", "무서운 이야기를 모은 소설", "웃음과 과장, 빗댐을 통해 현실의 잘못을 비판하는 소설", "미래를 예언하는 소설"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "라퓨타의 학자들 이야기를 통해 작가가 비판하려 한 것을 추론하면 무엇인가?", "options": ["삶과 동떨어진 채 쓸모를 잃은 학문, 지식이 사람을 이롭게 하지 못하는 공허함", "학자들의 게으름", "하늘을 나는 기술의 위험성", "지붕 수리공의 부족"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "이 작품이 300년이 지나도 읽히는 까닭을 추론하면 무엇인가?", "options": ["소인국 이야기가 아이들에게 인기 있기 때문", "사소한 일로 다투고 힘의 자리에 따라 태도가 바뀌는 인간의 모습이 시대가 지나도 되풀이되기 때문", "항해 기술이 잘 정리되어 있기 때문", "영국 역사를 배울 수 있기 때문"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '걸리버 여행기' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldlit11',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldlit11',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
