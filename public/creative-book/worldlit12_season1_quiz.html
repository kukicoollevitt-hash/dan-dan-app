<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧢 미시시피강가의 말썽꾸러기 — 톰 소여의 모험 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계문학12/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "톰 소여는 어떤 소년인가요?", "options": ["공부만 좋아하는 모범생", "겁이 많아 집에만 있는 소년", "말수가 적고 조용한 소년", "폴리 이모와 함께 살며, 머릿속이 장난 궁리로 가득한 마을 제일의 말썽꾸러기"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "허클베리 핀(헉)은 어떤 소년인가요?", "options": ["학교도 다니지 않고 자유롭게 사는, 톰의 둘도 없는 단짝 친구", "마을에서 가장 부잣집 아들", "톰과 늘 다투는 라이벌", "베키의 남동생"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "울타리 페인트칠 벌을 받은 톰이 꾀를 낸 방법은 무엇인가요?", "options": ["이모에게 울며 사정해서 벌을 면했다", "밤에 몰래 도망갔다", "페인트칠이 세상에서 가장 재미있는 일인 것처럼 연기해서, 아이들이 구슬과 사과까지 내밀며 서로 칠하겠다고 하게 만들었다", "돈을 주고 친구를 시켰다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "한밤중 묘지에서 톰과 헉이 목격한 것은 무엇인가요?", "options": ["보물 상자를 파내는 해적들", "인디언 조라는 악당이 사람을 해치고, 그 죄를 다른 사람에게 뒤집어씌우려 하는 것", "유령이 나타나는 장면", "베키가 길을 잃고 우는 모습"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "재판 날 톰이 법정에서 한 일은 무엇인가요?", "options": ["무서움보다 양심을 택해, 그날 밤 묘지에 있었으며 진짜 범인은 인디언 조라고 또박또박 증언했다", "끝까지 비밀을 지키며 침묵했다", "인디언 조를 직접 붙잡았다", "거짓 증언을 해서 혼이 났다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'진짜 용기'에 대해 이 이야기가 말하는 것은 무엇인가요?", "options": ["힘이 세면 용기도 생긴다는 것", "무서움을 아예 느끼지 않는 것", "무서움이 없는 것이 아니라, 무서움을 이겨 내고 옳은 일을 하는 것", "어른이 되어야 용기가 생긴다는 것"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'목격하다'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["목이 마르다", "어떤 일을 눈으로 직접 보다", "큰 소리로 외치다", "목적지에 도착하다"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'증언'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["선물을 주며 하는 말", "화가 나서 하는 말", "앞날을 미리 짐작하는 말", "자기가 보고 아는 사실을 밝혀 말하는 것"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "소년들이 섬으로 떠난 사이 마을에서 장례식이 준비된 까닭은 무엇인가요?", "options": ["인디언 조가 거짓 소문을 퍼뜨렸기 때문에", "마을의 오랜 풍습이었기 때문에", "며칠째 돌아오지 않는 아이들이 물에 빠졌다고 믿게 되었기 때문에", "소년들이 편지를 남겼기 때문에"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "캄캄한 동굴 속에서 톰이 계속 걸을 수 있었던 힘은 무엇이었나요?", "options": ["겁에 질린 베키를 지켜야 한다는 생각", "보물을 찾겠다는 욕심", "동굴 지도를 외우고 있었기 때문", "인디언 조가 도와주었기 때문"], "correct": 0}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "묘지 사건 뒤 톰이 겪은 마음속 갈등으로 옳은 것은 무엇입니까?", "options": ["보물을 혼자 가질까 나눌까 하는 고민", "죄 없는 사람을 구하려면 말해야 한다는 양심과, 인디언 조의 보복이 무섭다는 두려움 사이의 싸움", "헉과 절교할까 말까 하는 고민", "섬으로 떠날까 말까 하는 고민"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "이야기 끝에서 톰의 변화를 바르게 설명한 것은 무엇입니까?", "options": ["장난을 완전히 끊고 모범생이 되었다", "마을을 떠나 도시로 갔다", "장난기와 모험심은 여전했지만, 마음속에 옳은 것을 옳다고 말하는 용기가 자리 잡았다", "겁이 많아져 모험을 그만두었다"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "동굴에서 벌어진 일로 옳은 것은 무엇입니까?", "options": ["베키와 탐험하다 길을 잃었고, 어둠 속에서 숨어 있던 인디언 조와 마주쳤으나 소리를 죽여 피했으며, 한 줄기 빛을 따라 가까스로 빠져나왔다", "인디언 조에게 붙잡혀 갇혔다", "헉이 먼저 들어가 길을 안내했다", "이모와 함께 소풍을 갔다가 갇혔다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "보물 상자에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["묘지의 비석 아래에서 나왔다", "베키가 우연히 발견했다", "가짜 보물로 밝혀졌다", "톰이 헉과 함께 다시 동굴을 찾아, 인디언 조가 숨겨 둔 보물 상자를 찾아내 두 소년은 부자가 되었다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "울타리 칠하기 일화에서 톰이 깨달은 사람의 심리는 무엇입니까?", "options": ["힘든 일도 놀이처럼 재미있어 보이게 하면 남이 하고 싶어 한다는 것", "벌은 빨리 끝내는 것이 좋다는 것", "일은 여럿이 하면 빨라진다는 것", "어른 말을 잘 들어야 한다는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'자기 장례식을 본 소년들' 일화가 이야기에서 하는 역할은 무엇입니까?", "options": ["톰의 죽음을 미리 보여 주는 복선이다", "슬픔이 기쁨으로 뒤집히는 극적 재미와 함께, 톰이 가는 곳마다 상상 못 한 사건이 따라다님을 보여 준다", "마을의 장례 풍습을 소개한다", "이모의 엄격함을 보여 준다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'무고하다'(무고한 사람)의 의미로 가장 적절한 것은 무엇입니까?", "options": ["의지할 곳이 없다", "몸이 아프지 않다", "외로움을 타지 않는다", "아무런 잘못이나 죄가 없다"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'복선'과 달리 '반전'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["이야기를 처음부터 다시 시작하는 것", "이야기가 반으로 줄어드는 것", "이야기의 흐름이 예상과 정반대로 뒤집히는 것", "주인공이 바뀌는 것"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "법정 증언 뒤 톰이 두려움 속에서도 '마음 한구석이 후련했던' 까닭을 추론하면 무엇입니까?", "options": ["재판이 빨리 끝났기 때문", "옳은 일을 했다는 떳떳함이 두려움보다 컸기 때문", "사람들의 박수를 받았기 때문", "인디언 조가 멀리 도망갔기 때문"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "톰이 헉과 함께 '다시' 동굴을 찾아간 까닭을 추론하면 무엇입니까?", "options": ["어둠 속에서 본 인디언 조의 모습이 마음에 걸려, 그곳에 무언가 있으리라 짐작했기 때문", "베키가 두고 온 물건을 찾으려고", "동굴 지도를 만들려고", "숨바꼭질을 하려고"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "톰 소여의 성장을 가장 잘 요약한 것은 무엇인가?", "options": ["꾀로 벌을 떠넘기던 말썽꾸러기가, 법정의 증언과 동굴에서의 책임감을 거치며 용기와 정의를 배워 갔다", "말썽꾸러기가 얌전한 모범생으로 변했다", "겁쟁이가 힘센 소년으로 변했다", "외톨이가 친구를 사귀게 되었다"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "폴리 이모라는 인물이 작품에서 보여 주는 것은 무엇인가?", "options": ["톰을 미워하는 계모의 모습", "마을의 규칙을 강요하는 어른의 벽", "보물에 욕심을 내는 어른의 모습", "한숨을 쉬면서도 톰을 친자식처럼 아끼는, 꾸중 속에 담긴 깊은 사랑"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "작품 「톰 소여의 모험」에 대한 정보로 옳은 것은 무엇인가?", "options": ["영국 런던을 배경으로 한 소설이다", "미국 작가 마크 트웨인이 1876년 발표한 소설로, 미시시피강변 마을이 배경이다", "1976년에 발표된 현대 소설이다", "실제 재판 기록을 옮긴 논픽션이다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "「허클베리 핀의 모험」과의 관계로 옳은 것은 무엇인가?", "options": ["같은 이야기를 제목만 바꾼 것이다", "전혀 다른 작가의 작품이다", "톰의 친구 헉이 다음 작품의 주인공이 되며, 두 작품은 함께 미국 문학의 대표작으로 꼽힌다", "「허클베리 핀의 모험」이 먼저 나왔다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "울타리 칠하기 장면이 명장면으로 꼽히는 까닭은 무엇인가?", "options": ["페인트칠 방법을 자세히 알려 주기 때문", "힘든 일도 재미있어 보이면 하고 싶어지는 사람의 심리를 꿰뚫어 보았기 때문", "울타리가 마을에서 가장 컸기 때문", "이모의 벌이 가장 무거웠기 때문"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "묘지 목격 → 법정 증언 → 동굴 조우 → 보물 발견으로 이어지는 인디언 조 사건의 구성이 거두는 효과는 무엇인가?", "options": ["하나의 위협이 이야기 전체에 긴장을 이어 주다가, 마지막에 보물이라는 보상으로 반전되며 톰의 성장 서사를 완성한다", "사건들이 서로 관련 없이 흩어져 다양함을 준다", "악당의 일대기를 자세히 보여 준다", "마을의 지리를 소개한다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'모험심'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["위험을 무릅쓰고라도 새로운 일에 도전해 보려는 마음", "남을 이기려는 마음", "조심스럽게 계획을 세우는 마음", "모범이 되려는 마음"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'의롭다'의 의미로 가장 적절한 것은 무엇인가?", "options": ["의지가 강하고 고집이 세다", "의사처럼 아픈 사람을 돌보다", "의심이 많아 신중하다", "옳은 도리에 맞아 떳떳하다"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "'아이는 말썽을 통해서도 자란다'는 서술이 이 작품의 성장관과 관련해 함축하는 바는 무엇인가?", "options": ["장난과 모험의 경험 속에서도 아이는 용기와 정의 같은 소중한 가치를 배워 간다는 것", "말썽은 많이 부릴수록 좋다는 것", "어른의 가르침은 필요 없다는 것", "조용한 아이는 자라지 못한다는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "「울타리를 칠하던 꾀 많은 소년은, 진실 앞에서 마을의 가장 용감한 소년이 되었어요.」라는 경구가 대비를 통해 전하는 메시지는 무엇인가?", "options": ["꾀가 많으면 언젠가 벌을 받는다는 것", "페인트칠이 용기를 길러 준다는 것", "꾀부리던 평범한 아이도 진실을 말해야 하는 순간에 용기를 택하면 영웅이 될 수 있다는 것", "소년은 어른보다 정직하다는 것"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '톰 소여의 모험' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldlit12',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldlit12',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
