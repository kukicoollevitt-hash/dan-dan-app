<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗿 돌 속에 갇힌 사람을 꺼낸 소년, 미켈란젤로 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계인물05/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "어린 미켈란젤로가 \"돌 안에 사람이 갇혀 있어요\"라고 말한 것에서 알 수 있는 그의 남다른 점은 무엇인가요?", "options": ["돌 속에서 아직 나오지 못한 모습을 미리 보는 눈", "돌을 무서워하는 겁 많은 마음", "어른들을 놀리기 좋아하는 장난기", "돌을 팔아 돈을 벌려는 꾀"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "로렌초가 \"신분은 아버지가 주지만, 재능은 하늘이 준다\"고 말하며 한 일은 무엇인가요?", "options": ["미켈란젤로에게 새 아버지를 찾아 주었다", "미켈란젤로를 멀리 로마로 유학 보냈다", "미켈란젤로에게 귀족 신분을 사 주었다", "돌쟁이 소년을 자기 아들들과 같은 식탁에 앉혔다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "다비드가 된 커다란 대리석에 붙어 있던 별명은 무엇이었나요?", "options": ["'하얀 산'", "'죽은 돌'", "'거인의 돌'", "'행운의 돌'"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "시스티나 성당 천장화 작업에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["제자 수십 명이 대신 그려 주었다", "바닥에 그린 그림을 천장에 붙였다", "고개를 뒤로 젖힌 채 4년 동안 그렸다", "여섯 달 만에 빠르게 완성했다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "피에타에 몰래 이름을 새긴 밤을 훗날 부끄러워하며 미켈란젤로가 배운 것은 무엇인가요?", "options": ["이름은 크게 새길수록 좋다는 것", "남의 작품이라 말한 사람에게 복수해야 한다는 것", "성당에는 몰래 들어가면 안 된다는 것", "작품이 좋으면 이름은 저절로 남는다는 것"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "신과 아담의 두 손가락 사이에 작은 틈을 남겨 둔 까닭은 무엇인가요?", "options": ["닿기 직전이어야 사람이 계속 손을 뻗기 때문에", "교황이 틈을 남기라고 명령했기 때문에", "물감이 모자랐기 때문에", "손가락 그리기가 너무 어려웠기 때문에"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'후원자'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["작품의 값을 정하는 사람", "궁전을 지키는 병사", "예술가를 도와주고 뒤를 받쳐 주는 사람", "그림을 배우는 제자"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'천장화'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["천 조각에 그린 작은 그림", "건물의 천장에 그리는 큰 그림", "하늘을 바라보며 그린 풍경화", "천 년 전에 그려진 오래된 그림"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "\"언제 끝나는가?\"라는 교황의 재촉에 \"끝날 때 끝납니다.\"라고 답한 데서 짐작할 수 있는 미켈란젤로의 태도는 무엇인가요?", "options": ["서두르지 않고 작품의 완성도를 끝까지 지키려는 태도", "교황을 무시하는 버릇없는 태도", "일을 하기 싫어 미루는 게으른 태도", "언제 끝날지 정말 몰라서 얼버무리는 태도"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"걸작은 없던 것을 만드는 일이 아니라, 이미 있던 것을 가리던 것을 걷어 내는 일이다.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["걸작은 반드시 돌로 만들어야 한다는 뜻", "오래된 작품을 잘 닦아야 한다는 뜻", "숨어 있는 참모습을 찾아 드러내는 것이 창작이라는 뜻", "새로운 것은 세상에 없다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "채석장 옆에서 돌을 몇 시간이고 바라보던 어린 미켈란젤로의 모습이 보여 주는 것은 무엇입니까?", "options": ["친구가 없어 외로워하는 처지", "아버지에 대한 반항심", "돌 속에 잠든 형상을 미리 읽어 내는 조각가의 눈", "일을 피하려는 게으른 습관"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "로렌초가 미켈란젤로를 자기 아들들과 한 식탁에 앉힌 행동의 의미는 무엇입니까?", "options": ["피렌체 시민들의 환심을 사기 위한 정치적 계산", "신분보다 재능을 존중한다는 원칙의 실천", "가난한 아이를 동정한 자선 행위", "조각상을 싸게 사들이기 위한 흥정"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "'죽은 돌'이라 불리던 대리석에 대한 설명으로 옳은 것은 무엇입니까?", "options": ["바다 건너 그리스에서 가져온 귀한 돌이었다", "크기가 너무 작아 쓸모없던 돌이었다", "로렌초가 미켈란젤로에게 선물한 돌이었다", "40년간 어떤 조각가도 완성하지 못했고 잘못 파낸 상처가 깊었다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "천장화 작업 방식에 대한 서술로 옳은 것은 무엇입니까?", "options": ["회반죽이 마르기 전에 그려야 해서 그날 몫을 끝내기 전엔 내려올 수 없었다", "밑그림 없이 즉흥적으로 그려 나갔다", "여러 화가가 구역을 나누어 맡았다", "특수한 기계로 천장을 눕혀 놓고 그렸다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "피에타에 이름을 새긴 일화가 이야기에서 하는 역할은 무엇입니까?", "options": ["교황과의 갈등이 시작되는 계기", "'인정받고 싶은 마음'과 '인정받을 자격'의 차이를 깨닫는 성장의 계기", "로마를 떠나게 되는 직접적 원인", "아버지와 화해하게 되는 계기"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'닿지 않은 두 손가락'이 작품에서 갖는 의미로 가장 적절한 것은 무엇입니까?", "options": ["작업 시간이 부족했음을 보여 주는 흔적", "교황의 권위에 대한 은밀한 저항", "완성 직전의 긴장을 남겨 보는 이의 마음이 계속 손을 뻗게 하는 장치", "그림 실력의 한계를 감추기 위한 눈속임"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'후원자'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["예술가를 재정적·정신적으로 돕고 지지하는 사람", "작품의 진위를 감정하는 전문가", "공방에서 기술을 가르치는 스승", "작품을 사고파는 상인"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'르네상스'에 대한 설명으로 가장 적절한 것은 무엇입니까?", "options": ["교회 중심의 새로운 종교 운동", "왕권을 강화하려는 정치 개혁", "그리스·로마의 옛 문화를 되살리려는 흐름", "산업 기술을 발전시키려는 움직임"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "\"끝날 때 끝납니다\"라는 답변에서 추론할 수 있는 예술관은 무엇입니까?", "options": ["권력자의 명령이 작품보다 우선한다", "작품의 완성은 시간이 아니라 완성도가 결정한다", "예술가는 마감을 지킬 필요가 없다", "빠른 작업이 실력의 증거다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "'이미 있던 것을 가리던 것을 걷어 내는 일'이라는 창작관에서 추론할 수 있는 태도는 무엇입니까?", "options": ["대상 속의 본질을 발견하고 드러내는 것이 창작이라는 겸손하고도 깊은 통찰", "창작은 무(無)에서 유(有)를 만드는 마법이라는 자부심", "조각은 그림보다 우월하다는 우월감", "재료가 좋아야 걸작이 나온다는 물질주의"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'돌은 아직 세상에 나오지 못한 모습이 잠든 감옥'이라는 유년기의 인식이 함축하는 미켈란젤로의 예술관은 무엇인가?", "options": ["예술은 권력자의 주문에 봉사하는 기술이다", "조각은 창조가 아니라 돌 속의 본질적 형상을 해방시키는 발견의 행위다", "아름다움은 완벽한 비례의 계산에서 나온다", "예술의 가치는 재료의 희소성이 결정한다"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "\"신분은 아버지가 주지만, 재능은 하늘이 준다\"는 로렌초의 언명이 당대 사회에서 갖는 의미는 무엇인가?", "options": ["출신보다 개인의 능력을 존중하는, 시대를 앞선 인간관의 선언", "혈통 중심 신분 질서의 재확인", "종교적 운명론의 표현", "부의 세습을 정당화하는 논리"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "다비드 조각 작업의 조건에 대한 서술로 옳은 것은 무엇인가?", "options": ["로렌초의 정원에서 후원을 받으며 진행되었다", "여러 조수와 분업하여 단기간에 완성했다", "깊은 흠집을 피해야 했기에 처음부터 각도 하나까지 정확해야 하는, 수정 불가능한 작업이었다", "교황의 명령으로 로마에서 진행되었다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "시스티나 천장화 완성 당시의 정황으로 옳은 것은 무엇인가?", "options": ["미완성인 채로 공개되어 혹평을 받았다", "교황이 그림의 수정을 명령했다", "미켈란젤로가 성대한 축하연의 주인공이 되었다", "300명이 넘는 인물이 그려졌고, 사람들은 저절로 모자를 벗었다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "피에타 서명 일화와 노년의 회고(\"그날의 나는 아직 어렸다\")의 대비가 만들어 내는 서사적 효과는 무엇인가?", "options": ["인정 욕구를 넘어 작품 자체로 승부하게 되는 내적 성숙의 궤적을 드러낸다", "교회 권력의 부패상을 고발한다", "천재의 기행을 희화화한다", "작품 도난의 위험성을 경고한다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'닿지 않은 두 손가락'이 500년 뒤에도 힘을 갖는 미학적 원리로 가장 적절한 것은 무엇인가?", "options": ["종교적 교리의 정확한 도해", "완결 대신 '직전'의 긴장을 남김으로써 감상자의 상상과 갈망을 영원히 지속시키는 미완의 미학", "원근법의 혁신적 적용", "금기시되던 신체 묘사의 파격"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'후원(後援)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["작품을 담보로 한 금전 대여", "뒤에서 물질적·정신적으로 도와 활동을 지속하게 하는 지원", "기술 전수를 조건으로 한 도제 계약", "작품 판매를 대행하는 중개"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'르네상스'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["종교 개혁을 이끈 신학 운동", "왕정을 무너뜨린 시민 혁명", "고대 그리스·로마 문화의 부활을 통해 인간 중심의 문화를 꽃피운 흐름", "기계 문명이 시작된 산업의 전환"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "\"나는 조각가인데\"라는 물음이 사라진 8장의 각성이 의미하는 바를 추론하면 무엇인가?", "options": ["조각을 포기하고 화가로 전향하겠다는 결심", "교황의 권위에 대한 완전한 굴복", "도구가 달라도 '갇힌 것을 꺼내는 일'이라는 자기 일의 본질은 같다는 자기 정체성의 확장", "명성을 위해 어떤 일이든 하겠다는 타협"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "「걸작은 이미 있던 것을 가리던 것을 걷어 내는 일이다」라는 경구가 창작 일반에 시사하는 바를 추론하면 무엇인가?", "options": ["창작의 성패는 도구와 재료의 수준이 결정한다", "창작은 본질을 가리는 군더더기를 덜어 내어 잠재된 가치를 드러내는 과정이다", "위대한 작품은 우연한 영감의 산물이다", "모방 없는 창작은 불가능하다"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '미켈란젤로' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldperson05',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldperson05',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
