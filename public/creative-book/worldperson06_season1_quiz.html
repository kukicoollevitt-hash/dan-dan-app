<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎭 말을 돌보던 청년이 무대를 가진 날, 셰익스피어 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계인물06/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "어린 윌리엄이 아버지의 장갑 가게에서 가죽을 손질하는 척하며 정말로 한 일은 무엇인가요?", "options": ["몰래 장갑을 만들어 팔았다", "손님들의 돈을 세어 보았다", "가게에 드나드는 사람들의 말을 하나도 놓치지 않고 들었다", "숨어서 낮잠을 잤다"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "\"남의 깃털을 꽂은 까마귀\"라는 비웃음을 들었을 때 셰익스피어가 한 일은 무엇인가요?", "options": ["대꾸하지 않고 자기 글을 더 짧게, 더 사람의 말처럼 고쳐 썼다", "그 극작가들을 찾아가 크게 싸웠다", "글쓰기를 그만두고 고향으로 돌아갔다", "대학에 들어가 공부를 다시 시작했다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "런던에 도착한 셰익스피어가 처음 얻은 일은 무엇이었나요?", "options": ["극장의 표를 파는 일", "무대에 서는 배우 일", "극작가의 글을 베껴 쓰는 일", "극장 뒤 마구간에서 말을 돌보는 일"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "런던의 모든 극장이 문을 닫게 된 까닭은 무엇이었나요?", "options": ["큰불이 나서 극장이 타 버렸기 때문에", "역병이 돌아 사람이 모이는 곳이 위험해졌기 때문에", "전쟁이 일어났기 때문에", "관객이 줄어 돈을 벌 수 없었기 때문에"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "마을 광장에서 떠돌이 극단의 공연을 본 일이 윌리엄에게 중요했던 까닭은 무엇인가요?", "options": ["모아 둔 말을 쏟아 놓을 자리가 연극이라는 것을 처음 알게 되어서", "배우가 되면 돈을 많이 번다는 것을 알게 되어서", "런던 가는 길을 배우게 되어서", "왕을 직접 만나게 되어서"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "\"무대가 있어서 쓴 것이 아니라, 쓸 수밖에 없어서 썼다\"는 깨달음이 뜻하는 것은 무엇인가요?", "options": ["극장이 다시 열리지 않으리라는 슬픈 예감", "무대 없이 쓴 글은 쓸모없다는 후회", "글은 돈을 벌기 위해 쓰는 것이라는 계산", "쓰는 이유가 무대나 관객이 아니라 자기 안에 있다는 것"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'대본'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["극장의 자리 배치를 그린 그림", "배우가 할 말을 적어 놓은 글", "공연을 알리는 벽보", "연극 표의 값을 적은 종이"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'희곡'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["기쁜 일을 축하하며 부르는 노래", "우스운 이야기만 모아 놓은 책", "연극을 하기 위해 쓴 대본 형식의 글", "혼자 조용히 읽는 일기"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "\"저는 이십 년 동안 사람들 말을 들었습니다. 그게 제 학교였습니다.\"라는 말의 뜻을 짐작하면 무엇인가요?", "options": ["학교에 다니지 못한 것이 평생 부끄러웠다는 뜻", "말하기보다 듣기가 쉽다는 뜻", "이십 년 동안 학교 근처에 살았다는 뜻", "삶에서 들은 사람들의 말이 대학 공부보다 큰 배움이 되었다는 뜻"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "\"가장 낮은 자리에서 들은 말이, 가장 높은 무대의 대사가 된다.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["평범한 사람들의 진짜 말이 가장 훌륭한 작품의 재료가 된다는 뜻", "무대는 높게 지을수록 좋다는 뜻", "낮은 자리에 있는 사람은 목소리가 크다는 뜻", "대사는 어려운 말로 써야 한다는 뜻"], "correct": 0}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "장갑 가게에서 보낸 유년 시절이 셰익스피어에게 남긴 것은 무엇입니까?", "options": ["온갖 사람들의 살아 있는 말과 마음을 담아 둔 밑천", "가죽을 다루는 뛰어난 손재주", "장사꾼으로서의 셈 감각", "귀족들과의 폭넓은 인맥"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "대학 출신 극작가들의 조롱에 침묵으로 응답하고 글을 고쳐 쓴 행동에서 알 수 있는 태도는 무엇입니까?", "options": ["비판이 두려워 몸을 숨기는 소심함", "말싸움 대신 작품으로 증명하겠다는 우직한 자세", "조롱한 이들을 몰래 골탕 먹이려는 계획", "출신을 감추려는 열등감"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "런던 시절 초기 셰익스피어의 처지에 대한 서술로 옳은 것은 무엇입니까?", "options": ["대학 동문의 소개로 극단에 곧장 입단했다", "마구간에서 말을 돌보며 무대에서 가장 가까우면서도 가장 먼 사람으로 지냈다", "고향에서 가져온 재산으로 극장을 세웠다", "처음부터 주연 배우로 무대에 섰다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "역병 시기의 상황으로 옳은 것은 무엇입니까?", "options": ["관객이 두 배로 늘어 극장이 호황을 누렸다", "셰익스피어는 붓을 꺾고 장사를 시작했다", "극단들이 힘을 합쳐 더 큰 극장을 지었다", "극장 깃발이 내려가고 배우들은 흩어졌지만 그는 올릴 무대도 없는 글을 계속 썼다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "관객을 안내하고 바닥을 쓸던 시절이 훗날의 작품에 기여한 바는 무엇입니까?", "options": ["극장 운영 자금을 모을 수 있었다", "유명 배우들과 친분을 쌓을 수 있었다", "관객이 어느 대목에서 숨죽이고 하품하는지를 정면에서 배울 수 있었다", "건강한 체력을 기를 수 있었다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "8장에서 셰익스피어의 글이 달라진 핵심 변화는 무엇입니까?", "options": ["왕답고 위엄 있는 문장 대신, 서로 어긋나는 두 마음을 지닌 살아 있는 사람의 말을 쓰게 된 것", "라틴어 격언을 풍부하게 인용하게 된 것", "연설을 더 길고 장엄하게 다듬은 것", "비극을 버리고 희극만 쓰게 된 것"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'대본'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["공연의 순서를 적은 안내지", "극장의 수입과 지출을 적은 장부", "배우의 대사와 행동을 적어 공연의 바탕이 되는 글", "무대 장치를 설계한 도면"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'희곡'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["무대 상연을 전제로 쓰인 문학 갈래", "실제 사건을 기록한 역사책", "노래 가사를 모은 책", "편지 형식으로 쓴 소설"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "\"그게 제 학교였습니다\"라는 답변에서 추론할 수 있는 배움에 대한 관점은 무엇입니까?", "options": ["배움은 제도 안에서만 완성된다", "독학은 언제나 대학 교육보다 우월하다", "삶의 현장에서 사람을 관찰하고 듣는 것이 가장 깊은 공부가 될 수 있다", "학벌은 작가에게 필수 조건이다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "조롱하던 이들의 이름은 잊히고 '장갑 장수 아들'의 이름만 남은 결말이 시사하는 바는 무엇입니까?", "options": ["출신과 학벌이 아니라 작품이 결국 사람을 증명한다", "시간이 지나면 모든 이름은 공평하게 잊힌다", "비판하는 사람은 반드시 벌을 받는다", "명성은 우연이 만드는 것이다"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "'화나면서도 우스운 일'에 대한 아버지의 말을 오래 곱씹은 유년의 경험이 훗날의 작품 세계에 미친 영향으로 가장 적절한 것은 무엇인가?", "options": ["권선징악의 명확한 도덕률 확립", "희극과 비극의 엄격한 장르 구분", "고전 격식에 대한 충실한 계승", "상반된 감정이 공존하는 입체적 인간상의 창조"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "\"나 같은 게 써도 되는가\"라는 자기 의심을 창작의 동력으로 전환한 방식으로 가장 적절한 것은 무엇인가?", "options": ["조롱을 논쟁으로 되받아쳐 명성을 얻었다", "격식의 부재를 자기만의 자산, 곧 '사람의 말'로 벼려 냈다", "대학의 격식을 늦게라도 습득하여 약점을 지웠다", "익명으로 발표하여 출신을 감추었다"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "셰익스피어의 런던 정착 과정에 대한 서술로 옳은 것은 무엇인가?", "options": ["마구간지기에서 시작해 안내와 청소, 무대 뒤 관찰을 거치며 극장의 모든 자리를 몸으로 익혔다", "궁정 시인으로 발탁되어 곧바로 명성을 얻었다", "귀족 후원자의 저택에서 전속 작가로 출발했다", "대학 졸업장을 위조하여 극단에 들어갔다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "역병으로 극장이 폐쇄된 기간에 대한 서술로 옳은 것은 무엇인가?", "options": ["그는 의사가 되어 환자를 돌보았다", "극장 재개를 요구하는 시위를 이끌었다", "두 해 동안 시를 쓰고 거리를 걸으며, 상연될 곳 없는 작품들을 계속 써 두었다", "고향으로 돌아가 장갑 가게를 물려받았다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'무대에서 가장 가까운 곳에 있으면서, 무대에서 가장 먼 사람'이라는 역설적 표현의 기능은 무엇인가?", "options": ["극장 건축의 구조적 결함을 고발한다", "꿈과 현실 사이의 거리를 공간의 언어로 응축해 인물의 처지를 부각한다", "마구간 일의 고단함을 과장한다", "말과 인간의 우정을 상징한다"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "\"사느냐 죽느냐\"의 독백이 '영웅의 외침'이 아니라 '한 사람의 혼잣말'로 쓰인 것의 문학사적 의미는 무엇인가?", "options": ["라틴어 수사학의 완성을 보여 준다", "군주에 대한 충성심을 극대화한다", "위엄의 재현에서 벗어나 인간 내면의 망설임을 무대 언어로 끌어올린 전환이다", "비극의 종말을 예고한다"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'대본(臺本)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["상연을 위해 대사와 지시를 갖추어 쓴 공연의 설계도", "공연 수익의 배분을 정한 계약서", "극장의 연간 상연 목록", "배우의 연기 이론을 정리한 교본"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'희곡(戱曲)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["운율에 맞추어 낭송하는 서정시", "사건을 객관적으로 서술하는 산문 문학", "작가의 체험을 고백하는 수필", "무대 상연을 전제로 대사와 행동으로 짜인 문학 갈래"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "\"이십 년 동안 사람들 말을 들었습니다. 그게 제 학교였습니다.\"라는 발언이 함축하는 창작론을 추론하면 무엇인가?", "options": ["창작은 제도 교육의 산물이어야 한다", "위대한 문학의 원천은 이론이 아니라 삶의 언어에 대한 오랜 경청이다", "작가는 세상과 거리를 두어야 한다", "모방이야말로 창작의 유일한 길이다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "「가장 낮은 자리에서 들은 말이, 가장 높은 무대의 대사가 된다.」라는 경구의 함의로 가장 적절한 것은 무엇인가?", "options": ["예술의 보편성은 가장 평범한 삶의 진실에 뿌리내릴 때 획득된다", "낮은 신분의 언어는 무대에서 교정되어야 한다", "무대의 권위가 말의 가치를 결정한다", "높은 자리에 오르려면 낮은 자리를 견뎌야 한다"], "correct": 0}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '셰익스피어' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldperson06',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldperson06',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
