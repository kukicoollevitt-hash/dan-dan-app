<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎼 모두의 음악을 만든 사람, 모차르트 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계인물07/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "세 살의 볼프강이 누나가 틀렸던 건반 자리를 짚으며 \"아까 소리가 아팠어요. 그래서 고쳤어요.\"라고 말한 것에서 알 수 있는 것은 무엇인가요?", "options": ["누나를 놀리고 싶은 장난기", "소리를 귀로 느끼는 남다른 음악 재능", "아버지에게 혼날까 봐 무서워하는 마음", "건반을 처음 보고 신기해하는 호기심"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "모차르트가 대주교의 궁정을 떠나기로 결심하며 가장 중요하게 여긴 것은 무엇인가요?", "options": ["더 많은 봉급을 주는 다른 궁정", "더 크고 유명한 공연장", "마음대로 음악을 쓸 수 있는 자유", "편하게 쉴 수 있는 조용한 생활"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "여섯 살 모차르트의 연주를 본 귀족들이 정말로 감탄한 것은 무엇이었나요?", "options": ["음악이 아니라 '여섯 살'이라는 나이", "한 번도 틀리지 않는 정확한 연주", "아버지가 만들어 준 화려한 옷", "먼 나라에서 온 신기한 악기"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "대주교의 궁정에서 음악가였던 모차르트가 밥을 먹은 자리는 어디였나요?", "options": ["대주교의 바로 옆자리", "귀족 손님들과 같은 식탁", "혼자 쓰는 작은 방", "요리사와 마부 사이의 하인 식탁"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "누나 난네를이 무대에서 내려와야 했던 일을 보며, 볼프강이 처음으로 깨달은 것은 무엇인가요?", "options": ["누나보다 자기가 연주를 잘한다는 것", "박수는 언젠가 그친다는 것", "여행은 힘들고 지친다는 것", "귀족들은 마음씨가 착하다는 것"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "「마술피리」 공연에서 값싼 자리 사람들이 왁자하게 웃음을 터뜨릴 수 있었던 까닭은 무엇인가요?", "options": ["배우들이 우스운 옷을 입고 나와서", "표 값이 아주 싸져서", "보통 사람들의 말인 독일어로 만들어 알아들을 수 있어서", "공연 중에 선물을 나누어 주어서"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "이 이야기에서 '관례'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["새로 만들어진 엄격한 법", "왕이 신하에게 내리는 상", "음악회에서 지켜야 하는 예절", "오래전부터 그렇게 해 와서 당연하게 여겨지는 방식"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "모차르트가 마지막까지 쓰고 있던 '진혼곡'은 어떤 음악인가요?", "options": ["죽은 사람을 위로하려고 만든 음악", "결혼식에서 축하하며 연주하는 음악", "아이들에게 건반을 가르치는 연습 음악", "군인들이 행진할 때 부르는 음악"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "악보도 볼 줄 모르는 아주머니가 그의 노래를 흥얼거리는 것을 듣고 모차르트가 기뻐한 이유를 짐작하면 무엇인가요?", "options": ["그 아주머니가 유명한 귀족이었기 때문에", "노래가 팔려서 돈을 많이 벌게 되었기 때문에", "누구나 즐길 수 있는 음악을 만들고 싶다는 바람이 이루어졌기 때문에", "자기 이름이 신문에 크게 실렸기 때문에"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "\"재능은 하늘이 주지만, 그 재능을 누구에게 줄지는 사람이 정한다.\"라는 말의 뜻으로 가장 알맞은 것은 무엇인가요?", "options": ["재능이 없는 사람은 노력해도 소용없다", "재능을 어떤 사람들을 위해 쓸지는 스스로 선택하는 것이다", "재능은 어릴 때만 반짝이고 사라진다", "재능이 있으면 저절로 유명해진다"], "correct": 1}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "세 살의 볼프강이 누나가 틀린 건반 자리를 정확히 짚으며 \"소리가 아팠다\"고 표현한 일화가 보여 주는 것은 무엇입니까?", "options": ["형제 사이의 치열한 경쟁심", "엄격한 아버지에 대한 두려움", "호기심 많은 장난스러운 성격", "소리를 예민하게 감각하는 타고난 음악성"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "모차르트가 안정된 궁정 음악가 자리를 버리기로 결단한 근본적 이유는 무엇입니까?", "options": ["명령대로만 쓰는 삶 대신 창작의 자유를 원했기 때문", "더 높은 보수를 제안받았기 때문", "대주교가 그를 먼저 해고하려 했기 때문", "빈의 화려한 생활을 동경했기 때문"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "연주 여행에서 귀족들이 어린 모차르트에게 보인 감탄의 실체는 무엇이었습니까?", "options": ["작곡 실력의 완성도에 대한 평가", "연주된 음악 자체의 아름다움", "'여섯 살짜리'라는 나이에 대한 신기함", "오스트리아 출신이라는 점에 대한 호감"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "궁정 시절 모차르트의 처지를 보여 주는 사실로 알맞은 것은 무엇입니까?", "options": ["귀족들과 같은 식탁에서 대접받았다", "하인 식탁에서 요리사와 마부 사이에 앉아 식사했다", "원하는 곡을 마음껏 길게 쓸 수 있었다", "대주교의 오른팔로 존중받았다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "누나 난네를이 무대를 떠나는 장면이 이야기 전체에서 하는 역할은 무엇입니까?", "options": ["'박수는 언젠가 그친다'는 깨달음을 심어 뒷날의 위기를 예고한다", "가족의 화목함을 강조해 분위기를 밝게 만든다", "여행의 즐거움을 보여 주는 배경 역할을 한다", "대주교와의 갈등을 직접 일으키는 원인이 된다"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "「마술피리」 공연 장면에서 '값싼 자리의 웃음'이 상징하는 것은 무엇입니까?", "options": ["귀족 문화의 완전한 몰락", "공연장 시설의 개선", "경제적으로 성공한 모차르트의 여유", "신분에 상관없이 누구나 음악을 누리게 된 순간"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'관례'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["나라에서 정한 공식적인 법률", "오랫동안 되풀이되어 당연하게 굳어진 방식", "궁정에서 열리는 성대한 의식", "외국에서 새로 들어온 유행"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'진혼곡'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["왕의 즉위를 축하하는 장엄한 음악", "전쟁의 승리를 기념하는 행진 음악", "죽은 이의 넋을 위로하기 위해 만든 음악", "새해의 시작을 알리는 축제 음악"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "낯선 아주머니의 흥얼거림이 모차르트에게 '평생 바라던 일'이었던 이유를 추론하면 무엇입니까?", "options": ["음악이 신분과 지식의 벽을 넘어 보통 사람에게 닿았음을 확인했기 때문", "자신의 음악이 비싼 값에 팔리게 되었기 때문", "귀족들이 마침내 그를 다시 초대했기 때문", "아주머니가 그의 오랜 후원자였기 때문"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"재능은 하늘이 주지만, 그 재능을 누구에게 줄지는 사람이 정한다.\"에 담긴 뜻을 추론하면 무엇입니까?", "options": ["재능은 타고나야 하므로 노력은 무의미하다", "재능은 신분이 높은 사람에게만 주어진다", "재능이 크면 선택하지 않아도 성공이 따라온다", "재능의 가치는 그것을 누구를 위해 쓰느냐는 선택에서 완성된다"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "유년기의 모차르트가 '틀린 소리를 아프다'고 지각한 일화를 통해 드러나는 인물의 본질적 특성은 무엇인가?", "options": ["음을 신체 감각처럼 받아들이는 선천적 음악성", "형제에 대한 경쟁적 우월 의식", "권위에 순응하는 수동적 태도", "주목받기를 갈망하는 과시적 성향"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "모차르트가 궁정과의 결별을 감행하며 보여 준 가치관으로 가장 적절한 것은 무엇인가?", "options": ["물질적 안정을 최우선으로 하는 실리주의", "명예와 지위를 추구하는 출세 지향", "가족의 뜻에 순종하는 전통적 효 의식", "생존의 안정보다 창작의 자율성을 우선하는 예술가 의식"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "연주 여행 시기 귀족 관객들의 반응에 대한 서술로 옳은 것은 무엇인가?", "options": ["그의 작곡 기법을 체계적으로 분석하며 감상했다", "음악 자체가 아니라 '어린 나이'라는 진기함에 감탄했다", "신분을 뛰어넘어 그를 동등한 예술가로 대우했다", "연주보다 그의 외모와 의상에만 관심을 보였다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "궁정 음악가 시절 모차르트의 처우에 대한 서술로 옳은 것은 무엇인가?", "options": ["대주교의 후원 아래 창작의 전권을 위임받았다", "귀족과 동석하여 식사하는 특권을 누렸다", "하인 식탁에 배속되었고 작품도 주인의 지시에 따라 잘려 나갔다", "봉급 없이 명예직으로만 봉사했다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "난네를의 퇴장 장면이 서사 구조상 수행하는 기능으로 가장 적절한 것은 무엇인가?", "options": ["갈등이 해소되는 대단원의 역할", "시대 배경을 설명하는 단순 삽화의 역할", "'박수의 유한함'을 각인시켜 주인공의 후일 몰락과 각성을 복선처럼 예고하는 역할", "주인공의 재능을 부각하는 대조적 인물 제시의 역할"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "'값싼 자리에서 터진 웃음'이 서사 전체에서 갖는 의미로 가장 적절한 것은 무엇인가?", "options": ["예술 향유의 문턱이 허물어져 주인공의 이상이 실현되는 절정의 순간", "궁정 질서가 회복되었음을 알리는 반전의 순간", "주인공의 경제적 성공이 완성되는 결말의 순간", "귀족과의 화해가 이루어지는 화합의 순간"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'관례(慣例)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["국가 권력이 강제하는 성문화된 규범", "개인이 자율적으로 세운 행동 원칙", "오랜 반복을 통해 관습적으로 굳어져 의심 없이 통용되는 방식", "특정 계층만 아는 은밀한 약속"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'진혼곡(鎭魂曲)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["군주의 위엄을 기리기 위해 봉헌되는 음악", "죽은 이의 영혼을 위로하기 위해 작곡되는 음악", "계절의 순환을 묘사하는 표제 음악", "무용을 위해 만들어진 반주 음악"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "이름 모를 행인의 흥얼거림을 '평생 바라던 일'로 받아들인 심리를 추론할 때 가장 타당한 것은 무엇인가?", "options": ["자신의 명성이 궁정에 다시 전해지리라는 기대감", "악보 판매 수익이 증가하리라는 경제적 만족감", "경쟁 음악가들을 압도했다는 승리감", "음악이 언어와 신분의 장벽을 넘어 만인에게 도달했다는 성취감"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "「재능은 하늘이 주지만, 그 재능을 누구에게 줄지는 사람이 정한다.」라는 경구의 함의로 가장 적절한 것은 무엇인가?", "options": ["재능의 궁극적 가치는 소유가 아니라 그것을 향유하게 할 대상을 선택하는 주체적 결단에 있다", "재능은 운명적으로 결정되므로 인간의 선택은 무의미하다", "재능은 후원자의 지원 없이는 꽃필 수 없다", "재능의 크기는 대중의 평가로만 측정된다"], "correct": 0}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '모차르트' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldperson07',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldperson07',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
