<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💧 이름을 알게 된 아이, 헬렌 켈러 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계인물08/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "앤 설리번 선생님이 헬렌이 갇힌 어둠을 '짐작이 아니라 기억으로' 알 수 있었던 까닭은 무엇인가요?", "options": ["자신도 어릴 적 심한 눈병으로 앞이 잘 보이지 않았기 때문에", "헬렌과 어릴 때부터 친구였기 때문에", "눈이 안 보이는 사람을 오래 연구했기 때문에", "헬렌의 어머니에게 이야기를 자세히 들었기 때문에"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "어머니가 헬렌이 울면 원하는 것을 얼른 손에 쥐여 준 행동에 담긴 문제는 무엇이었나요?", "options": ["헬렌이 어머니를 미워하게 되었다", "헬렌의 몸이 점점 약해졌다", "헬렌이 마음을 전하는 법을 배울 필요가 없어졌다", "다른 가족들이 헬렌을 질투하게 되었다"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "헬렌이 보는 힘과 듣는 힘을 잃게 된 까닭은 무엇인가요?", "options": ["높은 곳에서 떨어지는 사고를 당해서", "태어난 지 열아홉 달 무렵 심한 열병을 앓아서", "태어날 때부터 보이지도 들리지도 않아서", "나쁜 약을 잘못 먹어서"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "우물가에서 물이 헬렌의 손등에 흐르는 동안, 앤이 헬렌의 다른 손바닥에 쓴 글자는 무엇인가요?", "options": ["'D-O-L-L' (인형)", "'T-E-A-C-H-E-R' (선생님)", "'H-E-L-E-N' (헬렌)", "'W-A-T-E-R' (물)"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "앤이 헬렌과 단둘이 별채에서 지내게 해 달라고 부탁한 까닭은 무엇인가요?", "options": ["조용한 곳에서 책을 읽어 주기 위해서", "어머니에게 집안일을 쉬게 해 주려고", "원하는 것을 저절로 얻지 못해야 배우고 싶은 마음이 생기기 때문에", "헬렌의 병을 몰래 치료하기 위해서"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "우물가 펌프 장면이 이 이야기에서 중요한 까닭은 무엇인가요?", "options": ["세상 모든 것에 이름이 있다는 것을 헬렌이 처음 깨달은 순간이어서", "헬렌이 처음으로 물놀이를 하게 된 장면이어서", "앤이 헬렌을 포기하기로 결심한 장면이어서", "가족이 모두 화해하게 된 장면이어서"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "헬렌이 배운 '점자'는 어떤 글자인가요?", "options": ["소리 나는 대로 크게 쓴 글자", "물감으로 색을 입힌 글자", "비밀을 지키려고 만든 암호 글자", "손끝으로 만져 읽도록 도드라지게 만든 글자"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "헬렌이 \"도움이 아니라 권리를 달라\"고 했을 때, '권리'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["돈이 많은 사람만 누리는 특별한 혜택", "사람이라면 누구나 누려야 할 마땅한 몫", "나라에서 주는 상과 상금", "어른이 아이에게 베푸는 친절"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "헬렌이 \"저에게 필요한 것은 동정이 아니라 기회입니다.\"라고 말한 뜻을 짐작하면 무엇인가요?", "options": ["도와주는 사람이 너무 많아 귀찮다는 뜻", "불쌍히 여기지 말고 배우고 일할 수 있게 해 달라는 뜻", "돈으로 도와주는 것이 가장 좋다는 뜻", "혼자 조용히 살고 싶다는 뜻"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "\"기적은 한 사람의 재능이 아니라 두 사람의 버팀에서 나왔다\"는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["기적은 운이 좋아야만 일어난다는 뜻", "재능이 있으면 혼자서도 무엇이든 된다는 뜻", "헬렌의 노력과 앤의 믿음이 함께했기에 가능했다는 뜻", "두 사람이 힘을 합쳐도 안 되는 일이 있다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "앤 설리번이 헬렌의 처지를 누구보다 깊이 이해할 수 있었던 배경은 무엇입니까?", "options": ["장애 아동 교육을 전공한 학자였기 때문", "오랫동안 헬렌 가족과 함께 살았기 때문", "자신도 어린 시절 눈병으로 시력을 잃다시피 한 경험이 있었기 때문", "헬렌과 같은 마을에서 자랐기 때문"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "헬렌의 가족이 '짐작 통역사'가 되어 준 것이 헬렌에게 끼친 영향은 무엇입니까?", "options": ["표현을 배워야 할 필요 자체를 잃게 만들었다", "가족과의 사이가 점점 멀어지게 했다", "말을 더 빨리 배우도록 도와주었다", "바깥세상에 대한 호기심을 키워 주었다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "헬렌 켈러가 시력과 청력을 잃게 된 경위로 옳은 것은 무엇입니까?", "options": ["선천적인 병을 가지고 태어났다", "어릴 적 큰 사고로 머리를 다쳤다", "오랜 영양 부족으로 감각이 약해졌다", "생후 열아홉 달 무렵 원인 모를 열병을 앓았다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "우물가에서 일어난 일에 대한 서술로 옳은 것은 무엇입니까?", "options": ["헬렌이 무서워하며 펌프를 피해 도망쳤다", "흐르는 물과 손바닥의 글자 'W-A-T-E-R'가 처음으로 하나로 이어졌다", "앤이 처음으로 헬렌에게 소리 내어 말을 가르쳤다", "헬렌이 펌프를 넘어뜨려 물이 쏟아졌다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "\"배우려면 먼저 아쉬워야 합니다\"라는 앤의 말이 별채 생활과 연결되는 방식은 무엇입니까?", "options": ["가족과 떨어져야 예절을 익힐 수 있다는 뜻이었다", "불편함을 참는 훈련 자체가 목적이었다", "조용한 환경이 집중력을 높인다는 뜻이었다", "저절로 채워지던 욕구를 끊어야 전하는 법을 배울 동기가 생긴다는 뜻이었다"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "펌프 장면이 서사의 전환점이 되는 이유는 무엇입니까?", "options": ["앤이 교육 방법을 완전히 바꾸기로 한 계기이므로", "손가락 놀이로 여기던 움직임이 '이름'이라는 것을 깨달으며 배움이 시작되므로", "가족이 헬렌의 교육을 반대하기 시작하는 계기이므로", "헬렌이 처음으로 목소리를 내어 말한 장면이므로"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'점자'에 대한 설명으로 가장 적절한 것은 무엇입니까?", "options": ["도드라진 점을 손끝으로 더듬어 읽도록 만든 글자", "입 모양을 본떠 만든 그림 글자", "소리의 높낮이를 기호로 나타낸 악보", "빛의 신호로 뜻을 전하는 통신 방법"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "헬렌이 요구한 '권리'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["국가가 공로자에게 수여하는 명예", "베푸는 사람의 마음에 달린 호의", "사람이라면 누구나 마땅히 누려야 할 몫", "경쟁에서 이긴 사람이 얻는 보상"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "\"동정이 아니라 기회\"라는 말에서 헬렌이 세상에 요구한 것을 추론하면 무엇입니까?", "options": ["장애인을 위한 더 많은 모금과 기부", "장애인 시설의 확충과 보호", "불쌍히 여기는 시선 대신 배우고 참여할 동등한 조건", "유명인으로서의 특별한 대우"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "이 이야기가 '기적'의 정체를 설명하는 방식으로 가장 적절한 것은 무엇입니까?", "options": ["기적은 타고난 천재성에서 비롯된다고 본다", "기적은 우연한 행운이 겹친 결과라고 본다", "기적은 종교적 힘의 개입이라고 본다", "포기하지 않은 아이와 끝까지 믿어 준 선생, 두 사람의 버팀이 만든 결과라고 본다"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "앤 설리번이 헬렌의 어둠을 '짐작이 아니라 기억으로' 이해했다는 서술의 함의로 가장 적절한 것은 무엇인가?", "options": ["교사로서의 전문 지식이 경험을 압도했다는 것", "타인의 고통은 어떤 방식으로도 이해될 수 없다는 것", "관찰과 기록만으로 완전한 공감이 가능하다는 것", "유사한 결핍을 몸소 겪은 자만이 가질 수 있는 체험적 공감이 교육의 토대였다는 것"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "가족의 무조건적 수용이 헬렌에게 '가두는 사랑'이 된 이유로 가장 적절한 것은 무엇인가?", "options": ["가족이 헬렌의 요구를 자주 오해했기 때문", "욕구가 표현 없이 충족되어 소통을 배울 내적 동기가 소거되었기 때문", "헬렌이 가족에게 과도한 죄책감을 느꼈기 때문", "가족의 보호가 외부 위험을 완전히 차단하지 못했기 때문"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "헬렌의 장애 발생 경위에 대한 서술로 옳은 것은 무엇인가?", "options": ["생후 19개월경의 열병으로 시력과 청력을 동시에 상실했다", "출생 직후의 난산으로 감각 기관이 손상되었다", "다섯 살 무렵의 낙상 사고로 청력만을 잃었다", "점진적인 유전 질환으로 성년기에 시력을 잃었다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "우물가 장면에 대한 서술로 옳은 것은 무엇인가?", "options": ["앤이 헬렌에게 처음으로 발성 훈련을 시도했다", "헬렌이 컵을 깨뜨려 앤과의 관계가 단절되었다", "한 손의 물과 다른 손의 'W-A-T-E-R'가 결합하며 기호와 대상의 연결이 성립했다", "헬렌이 스스로 펌프질하여 물을 길어 올렸다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "별채 생활이 서사에서 수행하는 기능으로 가장 적절한 것은 무엇인가?", "options": ["갈등이 완전히 해소되는 대단원의 공간", "결핍을 의도적으로 조성하여 배움의 동기를 창출하는 교육적 전환의 공간", "과거를 회상하게 하는 액자식 구성의 장치", "인물 간 오해가 증폭되는 위기의 공간"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "펌프 장면이 '기호와 세계의 만남'이라 평가되는 이유로 가장 적절한 것은 무엇인가?", "options": ["모방에 불과하던 손가락 운동이 대상을 지시하는 언어임을 각성한 순간이기 때문", "자연의 치유력이 장애를 극복하게 한 순간이기 때문", "신체 감각이 처음으로 회복된 순간이기 때문", "교사와 학생의 역할이 뒤바뀐 순간이기 때문"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'점자(點字)'에 대한 설명으로 가장 적절한 것은 무엇인가?", "options": ["수화를 지면에 옮겨 적기 위한 보조 기호", "돌출된 점의 배열을 촉각으로 판독하도록 고안된 문자 체계", "시각 장애인이 소리로 듣는 음성 기호", "그림으로 뜻을 전달하는 상형 문자의 일종"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "헬렌이 주장한 '권리(權利)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["다수결로 부여되고 박탈되는 자격", "시혜자의 선의에 따라 주어지는 혜택", "인간이라면 누구에게나 마땅히 보장되어야 할 몫", "공로에 대한 대가로 지급되는 보상"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "\"동정이 아니라 기회\"라는 발언에 담긴 헬렌의 인간관을 추론하면 무엇인가?", "options": ["장애인은 동등한 조건만 주어지면 스스로 삶을 개척할 수 있는 주체라는 것", "장애인은 사회의 보호 아래에서만 살아갈 수 있다는 것", "장애의 극복은 개인의 의지만으로 충분하다는 것", "연민은 인간이 가진 가장 고귀한 감정이라는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "'기적은 두 사람의 버팀에서 나왔다'는 결말의 통찰이 시사하는 바로 가장 적절한 것은 무엇인가?", "options": ["기적은 초월적 존재의 개입으로만 설명된다", "위대한 성취는 천재 개인의 고독한 산물이다", "한 인간의 성장은 믿어 주는 타자와의 관계 속에서 완성된다", "교육의 성패는 제도와 시설의 수준이 결정한다"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '헬렌 켈러' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldperson08',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldperson08',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
