<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🕯️ 등불을 든 여인, 그리고 숫자를 든 여인 — 나이팅게일 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계인물09/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "부유한 집에서 부족한 것 없이 자란 플로렌스가 정작 마음을 쏟은 일은 무엇이었나요?", "options": ["프랑스어와 피아노를 배우는 일", "다치거나 아픈 사람을 돌보는 일", "예쁜 옷을 입고 손님을 맞는 일", "넓은 정원을 가꾸는 일"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "군의관들이 병동에 들여보내 주지 않았을 때 나이팅게일이 한 행동은 무엇이었나요?", "options": ["곧바로 영국으로 돌아가 버렸다", "정부에 군의관들을 벌해 달라고 편지를 썼다", "큰 소리로 싸워서 억지로 들어갔다", "복도에서 붕대를 빨고 이불을 꿰매며 조용히 기다렸다"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "그 시절 사람들은 간호사라는 일을 어떻게 여겼나요?", "options": ["배울 필요 없는 잔심부름쯤으로 여겼다", "의사보다 훌륭한 일로 존경했다", "부유한 집 딸에게 어울리는 일로 여겼다", "나라에서 상을 주는 명예로운 일로 여겼다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "야전병원에서 병사들의 목숨을 가장 많이 빼앗아 간 것은 무엇이었나요?", "options": ["적군의 총알", "부족한 식량", "콜레라 같은 감염병", "추운 겨울 날씨"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "나이팅게일이 등불을 내려놓고 장부와 펜을 집어 든 것은 무엇을 깨달았기 때문인가요?", "options": ["밤에 병동을 도는 일이 너무 힘들었기 때문", "등불 기름값이 너무 비쌌기 때문", "글을 써서 유명해지고 싶었기 때문", "정성만으로는 안 되고 사람들을 움직일 증거가 필요했기 때문"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "부챗살 모양의 도표 한 장이 오랜 말싸움을 단번에 끝낼 수 있었던 까닭은 무엇인가요?", "options": ["숫자를 그림으로 바꾸어 사실이 한눈에 보였기 때문", "그림이 아주 아름다워서 사람들이 감동했기 때문", "여왕이 그 도표를 칭찬했기 때문", "도표에 유명한 화가의 그림이 들어 있었기 때문"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'야전병원'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["전쟁터 가까이에 임시로 만든 병원", "아이들만 치료하는 병원", "도시 한가운데 있는 큰 병원", "동물을 치료하는 병원"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'사망률'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["병원에 실려 오는 사람의 수", "약을 먹고 나은 사람의 수", "일정한 사람 수 가운데 죽는 사람의 비율", "병원에서 일하는 간호사의 수"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "죽는 병사가 100명 중 42명에서 2명으로 줄어든 일에서 알 수 있는 것은 무엇인가요?", "options": ["깨끗한 물과 공기 같은 위생이 사람의 목숨을 살린다는 것", "병사들의 몸이 저절로 튼튼해졌다는 것", "전쟁이 끝나서 다치는 사람이 없어졌다는 것", "값비싼 새 약이 개발되었다는 것"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "\"정성은 한 사람을 살리고, 기록은 제도를 바꾼다.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["정성을 쏟는 일은 이제 필요 없다는 뜻", "기록하는 일은 간호사만 할 수 있다는 뜻", "제도는 한번 정해지면 바꿀 수 없다는 뜻", "사실을 증명하는 기록은 세상 전체를 바꾸는 힘이 있다는 뜻"], "correct": 3}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "안락한 삶이 보장된 플로렌스가 굳이 간호의 길을 고집한 이유로 가장 적절한 것은 무엇입니까?", "options": ["아픈 사람을 돌보는 일을 자신의 소명으로 여겼기 때문", "가족과의 갈등에서 벗어나고 싶었기 때문", "해외를 여행하며 견문을 넓히고 싶었기 때문", "의사가 되기 위한 준비 과정이 필요했기 때문"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "병동 출입을 거부당했을 때 나이팅게일이 보인 태도에서 알 수 있는 성품은 무엇입니까?", "options": ["권위에 쉽게 굴복하는 소극성", "감정에 휘둘리는 즉흥성", "다투는 대신 행동으로 신뢰를 쌓는 침착한 인내심", "목적을 위해 수단을 가리지 않는 냉혹함"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "당시 간호사라는 직업에 대한 사회의 인식으로 옳은 것은 무엇입니까?", "options": ["국가가 공인한 전문 직업으로 대우받았다", "부유층 여성의 교양 활동으로 권장되었다", "의사와 동등한 의료인으로 존중받았다", "배움이 필요 없는 잔심부름으로 취급되었다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "크림 전쟁의 야전병원에서 병사들이 죽어 간 주된 원인은 무엇이었습니까?", "options": ["전투 중 입은 총상의 악화", "더러운 환경에서 퍼진 콜레라 등의 감염병", "식량 보급의 중단으로 인한 굶주림", "혹독한 추위로 인한 동상"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'등불'에서 '장부'로의 전환이 이야기에서 의미하는 바는 무엇입니까?", "options": ["밤샘 간호를 그만두고 휴식을 택했다는 것", "병사 개인에 대한 관심을 잃었다는 것", "한 사람을 돌보는 정성에서 여럿을 살릴 증명의 도구로 무기를 바꾸었다는 것", "간호보다 회계 업무가 중요해졌다는 것"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "나이팅게일의 도표가 몇 해에 걸친 논쟁을 단번에 끝낸 이유는 무엇입니까?", "options": ["빼곡한 숫자를 시각적 그림으로 바꾸어 사실이 즉시 전달되게 했기 때문", "군의관들이 모두 자리에서 물러났기 때문", "여왕이 직접 도표에 서명했기 때문", "도표의 색이 화려해 시선을 사로잡았기 때문"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'야전병원'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["감염병 환자만 격리하는 전문 병원", "전장 인근에 임시로 설치하여 부상병을 치료하는 병원", "군인 가족을 위해 도시에 세운 병원", "연구를 주된 목적으로 하는 대학 병원"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'사망률'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["병원이 하루에 받을 수 있는 환자의 수", "치료에 드는 평균 비용", "전체 인원 가운데 사망한 사람이 차지하는 비율", "병이 다른 사람에게 옮는 속도"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "사망률이 42퍼센트에서 2퍼센트로 떨어진 결과가 증명한 사실을 추론하면 무엇입니까?", "options": ["병사들의 체력이 단련되어 병을 이겨 냈다", "전투가 줄어 부상병 자체가 감소했다", "환기·청소·급수 같은 위생 개선이 죽음의 원인을 제거했다", "새로운 치료약이 대량 보급되었다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "\"정성은 한 사람을 살리고, 기록은 제도를 바꾼다.\"에 담긴 통찰로 가장 적절한 것은 무엇입니까?", "options": ["제도의 변화는 오직 권력자의 결단에 달려 있다", "마음이 옳다는 것을 증명하는 근거가 있어야 세상 전체를 움직일 수 있다", "기록보다 헌신이 언제나 더 가치 있다", "돌봄의 정성은 측정될 수 없으므로 무의미하다"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "풍요가 보장된 삶을 거부한 플로렌스의 선택을 설명하는 개념으로 가장 적절한 것은 무엇인가?", "options": ["가문의 명예를 지키려는 의무감", "현실에서 도피하려는 낭만적 동경", "돌봄을 자신의 소명(召命)으로 확신한 실존적 결단", "경제적 독립을 위한 직업적 타산"], "correct": 2},

      {"gate": 4, "category": "내용일치", "question": "크림 전쟁 야전병원의 실상에 대한 서술로 옳은 것은 무엇인가?", "options": ["의료진 부족으로 수술이 전혀 이루어지지 못했다", "보급 단절로 인한 아사자가 가장 많았다", "전사자보다 원내 감염병 사망자가 몇 곱절 많았다", "적군의 포격으로 병원 건물이 자주 파괴되었다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "'등불을 내려놓고 다른 것을 집어 들었다'는 서술이 상징하는 방법론적 전환은 무엇인가?", "options": ["개별적 헌신에서 데이터에 기반한 구조적 개혁으로의 이행", "환자 돌봄에서 행정 관리로의 직무 변경", "의료 현장에서 정치 무대로의 진출", "야간 근무에서 주간 근무로의 전환"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "부챗살 도표가 설득의 결정적 도구가 될 수 있었던 원리로 가장 적절한 것은 무엇인가?", "options": ["도표 제작자의 명성이 권위를 부여했기 때문", "통계 수치를 직관적 시각 언어로 번역하여 이해의 장벽을 제거했기 때문", "화려한 색채가 감정적 동요를 일으켰기 때문", "숫자의 나열이 전문성을 과시했기 때문"], "correct": 1},

      {"gate": 8, "category": "내용어휘", "question": "'사망률(死亡率)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["일정 집단 내에서 사망자가 차지하는 비율", "질병이 전파되는 평균 속도", "의료 행위가 실패할 확률", "병상 대비 환자 수용 비율"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "사망률 42%→2%의 급감이 갖는 논증적 의의를 추론하면 무엇인가?", "options": ["전쟁의 종결이 사망 감소의 직접 원인임을 보여 준다", "개별 간호사의 헌신이 통계를 왜곡할 수 있음을 보여 준다", "위생 개선과 생존율 사이의 인과 관계를 수치로 입증했다", "의약품 투입량과 회복 속도의 비례 관계를 증명했다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "\"정성은 한 사람을 살리고, 기록은 제도를 바꾼다.\"라는 명제의 함의로 가장 적절한 것은 무엇인가?", "options": ["제도 개혁은 소수 엘리트의 전유물이라는 것", "선의는 그것을 입증하는 객관적 근거와 결합할 때 사회적 변화의 동력이 된다는 것", "기록 문화의 발달이 돌봄의 가치를 대체한다는 것", "개인의 헌신은 통계 앞에서 무력하다는 것"], "correct": 1}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '나이팅게일' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldperson09',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldperson09',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
