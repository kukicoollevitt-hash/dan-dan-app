<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 번호 대신 이름을 부른 사람, 제인 구달 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계인물10/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "다섯 살의 제인이 닭장에 네 시간이나 숨어 앉아 있었던 까닭은 무엇인가요?", "options": ["집에 들어가기 싫어서 숨은 것이었다", "닭에게 모이를 주고 싶어서였다", "알이 어디서 나오는지 직접 보고 싶어서였다", "숨바꼭질 놀이를 하다가 잠들어서였다"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "흙투성이가 되어 돌아온 제인에게 어머니 밴이 보인 태도는 어떠했나요?", "options": ["혼내지 않고 무엇을 보았는지 끝까지 들어 주었다", "다시는 밖에 나가지 못하게 크게 혼냈다", "경찰에게 데려가 사과하게 했다", "닭장을 없애 버렸다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "학자 루이스 리키가 학위도 없는 제인에게 침팬지 연구를 맡긴 까닭은 무엇인가요?", "options": ["연구비를 아주 적게 줘도 되었기 때문에", "제인의 아버지와 친한 사이였기 때문에", "제인이 아프리카 말을 잘했기 때문에", "배운 편견 없이 있는 그대로 볼 눈을 원했기 때문에"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "침팬지 데이비드가 흰개미 집 앞에서 한 일은 무엇이었나요?", "options": ["돌을 던져 흰개미 집을 부수었다", "풀줄기의 잎을 훑어 내어 구멍에 넣고 흰개미를 낚아 먹었다", "흰개미 집 위에 올라가 잠을 잤다", "다른 침팬지들과 흰개미 집을 두고 싸웠다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "침팬지들이 계속 도망치자 제인이 바꾼 것은 무엇이었나요?", "options": ["더 많은 연구원을 데려왔다", "먹이로 침팬지를 꾀어냈다", "연구 방법 대신, 같은 시간·같은 자리·같은 옷으로 나타나는 자기 자신을 바꾸었다", "더 성능 좋은 망원경을 샀다"], "correct": 2},
      {"gate": 6, "category": "내용구조", "question": "제인이 침팬지에게 번호 대신 이름을 붙인 일이 연구에서 중요했던 까닭은 무엇인가요?", "options": ["한 마리씩 구별해서 이어지는 행동을 볼 수 있었기 때문에", "이름을 부르면 침팬지가 대답했기 때문에", "기록하는 시간이 훨씬 줄었기 때문에", "신문 기자들이 기사를 쓰기 좋았기 때문에"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'관찰'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["동물을 잡아서 우리에 가두는 일", "무엇이든 빨리 달리는 일", "글을 읽고 외우는 일", "자세히 살펴보는 일"], "correct": 3},
      {"gate": 8, "category": "내용어휘", "question": "'도구'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["숲속에 사는 동물의 집", "어떤 일을 하려고 만들어 쓰는 물건", "여러 사람이 함께 부르는 노래", "맛있는 열매가 열리는 나무"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "\"도구를 다시 정의하거나, 인간을 다시 정의하거나, 침팬지를 인간으로 받아들여야 합니다.\"라는 리키의 말이 뜻하는 것은 무엇인가요?", "options": ["도구를 만드는 것이 인간만의 특징이라는 오랜 믿음이 무너졌다는 뜻", "침팬지를 사람처럼 옷 입혀 키우자는 뜻", "제인의 관찰이 틀렸다는 뜻", "사전에 새 낱말을 실어야 한다는 뜻"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "제인이 그토록 사랑하던 숲을 떠나 세계를 돌며 이야기하는 사람이 된 까닭을 짐작하면 무엇인가요?", "options": ["숲속 생활이 지겨워졌기 때문에", "나이가 들어 관찰이 힘들어졌기 때문에", "유명해져서 돈을 벌고 싶었기 때문에", "침팬지를 지키려면 숲과 그곳 사람들의 삶까지 지켜야 했기 때문에"], "correct": 3}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "닭장 사건에서 드러나는 어린 제인의 특성으로 가장 적절한 것은 무엇입니까?", "options": ["어른의 관심을 끌고 싶어 하는 과시욕", "궁금한 것을 직접 확인할 때까지 기다리는 끈질긴 관찰력", "위험을 즐기는 모험심", "혼자 있기를 좋아하는 소극적 성격"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "어머니 밴의 양육 태도가 제인의 삶에 남긴 것으로 가장 적절한 것은 무엇입니까?", "options": ["실패를 두려워하는 신중함", "권위에 순종하는 태도", "'궁금하면 직접 보라'는 정직한 탐구의 자세", "경쟁에서 이기려는 승부욕"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "리키가 연구자를 뽑을 때 내세운 특이한 기준은 무엇이었습니까?", "options": ["학문적 지식보다 편견 없는 눈을 가질 것", "아프리카 현지 언어에 능통할 것", "최고 수준의 학위를 갖출 것", "사격과 생존 기술에 능할 것"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "데이비드 그레이비어드의 행동이 학계를 뒤흔든 이유는 무엇입니까?", "options": ["사람의 말을 알아듣는 모습을 보였기 때문", "무리를 이끄는 지도력을 보였기 때문", "불을 무서워하지 않는 모습을 보였기 때문", "풀줄기를 다듬어 쓰는, 도구의 '제작'을 보여 주었기 때문"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "몇 달간의 실패 끝에 제인이 택한 접근법의 핵심은 무엇입니까?", "options": ["침팬지들이 자신을 숲의 일부로 여기도록 한결같은 모습으로 기다리는 것", "먹이를 이용해 침팬지를 길들이는 것", "울타리를 쳐서 침팬지의 이동을 제한하는 것", "더 많은 인원으로 침팬지를 포위하는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'번호 대신 이름'이라는 선택이 연구 방법으로서 가진 힘은 무엇입니까?", "options": ["연구 기록을 암호처럼 보호할 수 있었다", "개체를 식별하여 행동을 연속적으로 추적할 수 있게 했다", "연구비 심사에서 좋은 평가를 받게 했다", "침팬지와의 정서적 교감을 차단해 주었다"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'관찰'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["실험실에서 조건을 통제하여 시험하는 일", "대상을 있는 그대로 자세히 살펴 확인하는 일", "기존 이론을 책으로 공부하는 일", "여러 사람의 의견을 모아 정리하는 일"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'도구'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["자연에서 저절로 생겨난 물체", "장식을 위해 몸에 지니는 물건", "어떤 일을 이루기 위해 만들어 쓰는 물건", "동물이 사는 보금자리"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "리키의 전보(\"도구를 다시 정의하거나, 인간을 다시 정의하거나…\")가 뜻하는 바를 추론하면 무엇입니까?", "options": ["연구 결과를 비밀에 부쳐야 한다는 경고", "제인의 관찰 기록에 오류가 많다는 지적", "연구비 지원을 중단하겠다는 통보", "인간과 동물을 가르던 기준 자체를 재검토해야 하는 발견이라는 평가"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "제인이 관찰을 뒤로 미루고 숲 밖으로 나온 결정에서 추론할 수 있는 깨달음은 무엇입니까?", "options": ["침팬지의 보전은 숲과 지역 사람들의 삶까지 함께 나아져야 가능하다는 것", "연구는 젊은 세대에게 넘겨야 한다는 것", "도시 생활이 연구보다 편안하다는 것", "강연이 관찰보다 학문적으로 가치 있다는 것"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "닭장 일화가 보여 주는 제인 구달의 방법론적 원형(原型)으로 가장 적절한 것은 무엇인가?", "options": ["권위 있는 문헌에 의존하는 학구적 태도", "가설을 세워 실험으로 검증하는 조작적 접근", "답을 전해 듣는 대신 대상 곁에서 직접 오래 바라보는 참여적 관찰", "다수의 사례를 수집해 평균을 내는 통계적 접근"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "어머니 밴이 제인에게 미친 영향을 가장 적절하게 설명한 것은 무엇인가?", "options": ["엄격한 규율로 인내심을 단련시켰다", "호기심을 꾸짖지 않고 탐구로 이어지도록 승인해 준 정서적 토대였다", "학문적 지식을 직접 전수한 첫 스승이었다", "경쟁심을 자극하여 성취동기를 부여했다"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "리키가 '학위 없음'을 오히려 장점으로 평가한 논리로 옳은 것은 무엇인가?", "options": ["학위 소지자는 위험한 오지 근무를 기피하기 때문", "무보수로 고용할 수 있어 비용이 절감되기 때문", "젊은 연구자가 체력적으로 유리하기 때문", "제도권 교육이 심어 주는 선입견 없이 현상을 볼 수 있기 때문"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "데이비드 그레이비어드의 흰개미 낚시 관찰이 갖는 핵심 사실은 무엇인가?", "options": ["침팬지가 인간의 행동을 모방했다는 것", "침팬지가 집단으로 사냥을 조직했다는 것", "침팬지가 대상물을 용도에 맞게 변형하여 도구를 '제작'했다는 것", "침팬지가 불을 이용해 먹이를 익혔다는 것"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'연구 방법이 아니라 자기 자신을 바꾸었다'는 서술이 의미하는 연구 전략은 무엇인가?", "options": ["관찰자가 환경의 일부로 받아들여질 때까지 일관된 존재로 머무르는 습관화 전략", "관찰 대상을 통제된 공간으로 옮기는 실험실 전략", "첨단 장비로 원거리에서 기록하는 비접촉 전략", "보상을 제공하여 행동을 유도하는 조건화 전략"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "개체 식별과 명명(이름 붙이기)이 발견의 전제 조건이 된 이유로 가장 적절한 것은 무엇인가?", "options": ["명명이 학계의 공식 인증 절차였기 때문", "이름이 침팬지와의 의사소통 수단이 되었기 때문", "번호 체계보다 기록 속도가 빨랐기 때문", "동일 개체의 행동을 시간 축 위에서 연결해 반복성을 확인할 수 있었기 때문"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'관찰(觀察)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["대상에 개입하지 않고 지속적으로 살펴 사실을 확인하는 탐구 방법", "조건을 통제하고 변인을 조작하여 결과를 확인하는 방법", "문헌과 이론을 비교·분석하는 방법", "설문을 통해 다수의 의견을 수집하는 방법"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'도구(道具)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["자연 상태 그대로의 사물", "특정 목적을 수행하기 위해 가공·사용되는 물건", "소유자의 지위를 드러내는 상징물", "생존과 무관한 유희의 대상"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "리키의 전보가 함축하는 학문적 충격을 추론하면 무엇인가?", "options": ["연구 윤리 규정을 위반했다는 견책", "'도구 제작 = 인간의 전유물'이라는 인간 정의의 경계가 붕괴했다는 선언", "관찰 데이터의 통계적 보완이 필요하다는 요청", "연구 지역을 확대해야 한다는 제안"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "제인 구달이 '가장 사랑하는 일을 내려놓은' 선택에서 추론되는 가치관은 무엇인가?", "options": ["명성과 영향력을 우선하는 현실주의", "학문과 실천은 분리되어야 한다는 원칙주의", "연구자 개인의 성취보다 보전이라는 공동의 과제를 앞세우는 책임 의식", "자연은 인간의 개입 없이 스스로 회복된다는 낙관주의"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '제인 구달' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldperson10',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldperson10',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
