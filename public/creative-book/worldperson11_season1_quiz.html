<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐭 빼앗길 수 없는 것을 가진 사람, 월트 디즈니 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계인물11/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "전쟁터에서 월트가 자기가 모는 구급차에 만화를 그린 까닭은 무엇인가요?", "options": ["무서울 때일수록 사람들에게 웃음이 필요하다고 생각해서", "구급차가 낡아서 흠집을 가리려고", "그림 연습할 종이가 없어서", "다른 차와 구별하기 위해서"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "사업가가 \"내 조건을 받아들이지 않으면 아무것도 남지 않는다\"고 했을 때, \"그럼 아무것도 없는 쪽을 택하겠습니다\"라고 한 월트의 태도는 어떤 것인가요?", "options": ["화가 나서 아무렇게나 내뱉은 말버릇", "깊이 생각하지 않는 성급함", "부당한 조건에 굴복하지 않겠다는 단호함", "사업가를 골탕 먹이려는 꾀"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "월트가 애써 키운 토끼 캐릭터를 빼앗긴 까닭은 무엇이었나요?", "options": ["직원들이 그림을 전부 잃어버려서", "다른 화가가 먼저 그린 그림이어서", "토끼의 인기가 갑자기 식어서", "계약서상 캐릭터의 권리가 자기 것이 아니었기 때문에"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "「증기선 윌리」가 사람들을 놀라게 한 새로운 점은 무엇이었나요?", "options": ["처음으로 색깔을 입힌 만화 영화라서", "그림의 움직임과 소리가 박자에 딱 맞게 어우러져서", "실제 배우와 만화가 함께 나와서", "상영 시간이 세 시간이 넘어서"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "모든 것을 잃고 돌아가는 기차 안에서 미키를 그린 장면이 보여 주는 월트의 삶의 방식은 무엇인가요?", "options": ["잃은 것을 세는 대신 다음 것을 그리는 것", "잃은 것을 되찾을 때까지 싸우는 것", "실패하면 일을 바꾸는 것", "슬플 때는 아무것도 하지 않고 쉬는 것"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "'디즈니의 망상'이라 불리던 「백설 공주」의 성공이 보여 주는 것은 무엇인가요?", "options": ["운이 좋으면 무엇이든 성공한다는 것", "비웃음을 받는 일은 하지 말아야 한다는 것", "해 본 사람이 없어 불가능하다던 일이 새로운 기준이 될 수 있다는 것", "영화는 짧게 만들수록 좋다는 것"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'배급'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["영화에 나오는 배우를 뽑는 일", "만든 영화를 극장에 나누어 공급하는 일", "영화표를 검사하는 일", "영화 줄거리를 쓰는 일"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "월트가 집을 '담보'로 잡았다는 말의 뜻은 무엇인가요?", "options": ["집을 완전히 팔아 버렸다는 뜻", "집을 다른 사람에게 빌려주었다는 뜻", "집을 새로 지었다는 뜻", "돈을 빌리면서 갚지 못할 때를 대비해 집을 맡겼다는 뜻"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "\"토끼를 빼앗기지 않았다면 평생 그 토끼만 그리고 있었을 것\"이라는 월트의 말에서 짐작할 수 있는 생각은 무엇인가요?", "options": ["토끼 그림이 미키보다 훌륭했다는 것", "빼앗아 간 사업가에게 아직 화가 나 있다는 것", "잃어버린 경험이 오히려 새로운 것을 만드는 계기가 되었다는 것", "캐릭터는 자주 바꿀수록 좋다는 것"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "월트가 디즈니랜드를 만들기로 마음먹게 된 경험은 무엇이었나요?", "options": ["아이들이 노는 동안 벤치에 혼자 앉아 어른과 아이가 함께 즐길 곳이 없음을 느낀 것", "외국의 유명한 놀이공원을 여행하며 부러웠던 것", "은행이 먼저 돈을 대 주겠다고 찾아온 것", "직원들이 놀이공원 사업을 건의한 것"], "correct": 0}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "전쟁터의 구급차에 만화를 그린 행동에서 드러나는 월트의 신념은 무엇입니까?", "options": ["예술은 전쟁을 기록해야 한다는 사명감", "공포 속에 있는 사람일수록 웃음이 절실하다는 믿음", "규율에 얽매이지 않으려는 반항심", "자신의 그림 실력을 알리려는 공명심"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "\"아무것도 없는 쪽을 택하겠습니다\"라는 선택이 보여 주는 월트의 가치관은 무엇입니까?", "options": ["손해를 보더라도 부당한 지배 아래 창작하지 않겠다는 자존심", "치밀한 계산에 따른 사업적 판단", "동업자에 대한 의리와 헌신", "눈앞의 이익을 좇는 즉흥적 기질"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "토끼 캐릭터 사건의 전말로 옳은 것은 무엇입니까?", "options": ["직원들의 실수로 원본 그림이 소실되었다", "토끼 영화가 흥행에 실패해 스스로 포기했다", "경쟁사가 비슷한 캐릭터를 먼저 발표했다", "계약서의 빈틈으로 캐릭터의 권리와 직원까지 빼앗겼다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "「증기선 윌리」가 이룬 혁신으로 옳은 것은 무엇입니까?", "options": ["최초로 장편 분량의 만화 영화를 선보였다", "실사와 만화를 한 화면에 합성했다", "그림의 동작과 소리를 한 치의 어긋남 없이 일치시켰다", "세계 최초로 천연색 화면을 구현했다"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "'기차 안에서 태어난 생쥐'라는 설정이 이야기 구조에서 하는 역할은 무엇입니까?", "options": ["과거를 그리워하는 회상의 장치", "가장 무너진 순간이 가장 큰 창조의 출발점이 되는 반전의 장치", "여행의 낭만을 강조하는 배경 묘사", "사업가의 악행을 고발하는 증거 제시"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "「백설 공주」의 성공이 서사에서 증명하는 명제는 무엇입니까?", "options": ["'불가능'의 근거가 '전례 없음'뿐이라면 도전으로 뒤집을 수 있다", "충분한 자본만 있으면 어떤 영화든 성공한다", "비평가의 예측은 언제나 빗나간다", "기술보다 이야기가 언제나 중요하다"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'배급'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["영화의 각본을 심사하는 일", "출연 배우를 선발하고 관리하는 일", "완성된 영화를 극장들에 공급하여 상영되게 하는 일", "영화 제작에 필요한 자금을 모으는 일"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'담보'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["빚을 갚지 못할 경우를 대비해 맡기는 재산", "이익을 나누기로 한 동업 계약", "재산을 무상으로 기부하는 일", "보험 회사에 다달이 내는 돈"], "correct": 0},
      {"gate": 9, "category": "내용추론", "question": "토끼 상실 사건에 대한 월트의 훗날 회고에서 추론할 수 있는 인생관은 무엇입니까?", "options": ["계약서를 잘 쓰는 것이 창작보다 중요하다", "상실은 안주를 깨뜨려 새로운 창조로 나아가게 하는 계기가 될 수 있다", "빼앗긴 것은 반드시 되찾아야 한다", "성공한 것은 바꾸지 말고 지켜야 한다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "벤치에서의 구상이 디즈니랜드로 이어진 과정에서 추론할 수 있는 월트의 발상법은 무엇입니까?", "options": ["전문가의 자문을 충실히 따르는 신중함", "경쟁자의 성공을 재빨리 모방하는 순발력", "유행을 분석해 대중의 취향을 좇는 계산", "일상의 불편에서 아무도 만들지 않은 것의 필요를 발견하는 눈"], "correct": 3}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "전장(戰場)의 구급차에 만화를 그린 행위가 함축하는 월트의 예술관으로 가장 적절한 것은 무엇인가?", "options": ["예술은 현실의 참상을 있는 그대로 기록해야 한다", "웃음은 극한의 공포 속에서 인간을 버티게 하는 힘이라는 확신", "예술은 전쟁의 승리를 고취하는 수단이어야 한다", "창작은 안정된 환경에서만 가능하다"], "correct": 1},

      {"gate": 3, "category": "내용일치", "question": "토끼 캐릭터 상실 사건의 경위로 옳은 것은 무엇인가?", "options": ["흥행 부진으로 배급사가 계약을 해지했다", "저작권 소송에서 패소하여 권리를 상실했다", "계약서상 권리 귀속의 맹점을 이용당해 캐릭터와 인력을 함께 빼앗겼다", "화재로 원본 필름이 소실되었다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "「증기선 윌리」의 기술적 성취에 대한 서술로 옳은 것은 무엇인가?", "options": ["영상과 음향의 완전한 동기화를 최초로 구현했다", "컴퓨터 그래픽을 처음 도입했다", "입체 영상 기술을 상용화했다", "즉석에서 관객과 대화하는 상영 방식을 도입했다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'가장 크게 무너진 기차 안에서 가장 유명한 것이 태어났다'는 구성이 만들어 내는 서사적 효과는 무엇인가?", "options": ["시간의 흐름을 뒤섞는 몽타주 효과", "절망과 창조를 한 장면에 겹쳐 반전의 극적 긴장을 극대화하는 효과", "주인공의 심리를 감추는 서스펜스 효과", "배경 묘사를 통한 서정적 여운의 효과"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "'디즈니의 망상'이라는 조롱이 '새로운 기준'으로 반전되는 구조가 전달하는 주제 의식은 무엇인가?", "options": ["대중의 평가는 언제나 옳다는 것", "불가능하다는 판정의 근거가 '전례 없음'뿐일 때, 그것은 반박이 아니라 미개척지의 표지라는 것", "천재는 시대를 잘 타고나야 한다는 것", "자본의 규모가 성패를 결정한다는 것"], "correct": 1},
      {"gate": 7, "category": "내용어휘", "question": "'배급(配給)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["완성된 작품을 상영망에 유통·공급하는 사업", "작품의 제작비를 조달하는 금융 활동", "작품의 내용을 심의하는 행정 절차", "출연진의 계약을 대행하는 중개업"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'담보(擔保)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["수익을 배분하기로 하는 동업의 약정", "재산을 사회에 환원하는 기부 행위", "위험에 대비해 다달이 납입하는 보험료", "채무 불이행에 대비하여 채권자에게 제공하는 재산"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "\"빼앗겼기 때문에 미키가 태어났다\"는 회고에서 추론되는 상실에 대한 관점은 무엇인가?", "options": ["상실은 반드시 보상으로 회복되어야 한다", "상실은 안주의 관성을 끊어 창조적 도약을 강제하는 역설적 동력이 될 수 있다", "상실을 예방하는 제도적 장치가 최우선이다", "상실의 고통은 시간이 지나면 저절로 잊힌다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "월트 디즈니의 생애를 관통하는 '빼앗길 수 없는 것'의 정체를 추론하면 무엇인가?", "options": ["법적으로 보호되는 저작권과 상표권", "축적된 자본과 스튜디오 설비", "새로운 것을 계속 만들어 내는 창조의 능력 그 자체", "대중의 변함없는 사랑과 명성"], "correct": 2}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '월트 디즈니' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldperson11',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldperson11',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
