<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧂 소금 한 줌으로 제국을 흔든 사람, 간디 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계인물12/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "어린 시절과 젊은 시절의 간디에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["어릴 때부터 용감해서 무서운 것이 없었다", "겁이 많았고, 첫 재판에서는 한마디도 못 하고 법정을 빠져나왔다", "친구가 많아 늘 사람들 앞에 나서기를 좋아했다", "공부를 싫어해 학교에 다니지 않았다"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "기차에서 쫓겨나 낯선 역에서 밤을 새운 뒤, 간디가 마음속으로 정한 한 가지는 무엇인가요?", "options": ["도망가지 않고 부당한 일에 맞서겠다는 것", "기차 회사를 상대로 소송을 걸겠다는 것", "곧바로 인도로 돌아가겠다는 것", "다시는 기차를 타지 않겠다는 것"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "간디가 정당하게 산 일등석 표를 가지고 있었는데도 기차에서 쫓겨난 까닭은 무엇이었나요?", "options": ["표를 잃어버렸기 때문에", "기차가 고장 났기 때문에", "피부색이 다르다는 이유 때문에", "자리를 잘못 앉았기 때문에"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "1930년의 소금 행진에 대한 설명으로 알맞은 것은 무엇인가요?", "options": ["수천 명이 모여서 출발했다", "말과 마차를 타고 이동했다", "영국군이 처음부터 행진을 막았다", "78명으로 시작해 걸을수록 수천 명으로 불어났다"], "correct": 3},
      {"gate": 5, "category": "내용구조", "question": "간디가 여러 문제 가운데 하필 '소금'을 골라 싸운 까닭은 무엇인가요?", "options": ["소금이 가장 비싼 물건이었기 때문에", "부자든 가난한 사람이든 누구나 먹는 것이라 인도 사람 전부가 같은 편이 될 수 있어서", "영국이 소금을 가장 아꼈기 때문에", "바닷가 마을 사람들이 부탁했기 때문에"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "간디가 직접 물레를 돌려 실을 잣고 그 천으로 옷을 지어 입은 행동에 담긴 뜻은 무엇인가요?", "options": ["새 옷을 살 돈이 없었기 때문에", "옷 만드는 사업을 시작하려고", "말로 시키기 전에 스스로 먼저 변화가 되어 보이려고", "물레 돌리기가 취미였기 때문에"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'불복종'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["부당한 법이나 명령에 일부러 따르지 않는 일", "어른의 말씀을 잘 듣는 일", "군대에서 명령을 전달하는 일", "법을 새로 만드는 일"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'독립'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["두 나라가 하나로 합쳐지는 일", "전쟁에서 이겨 남의 땅을 차지하는 일", "왕이 새로 즉위하는 일", "다른 나라의 지배에서 벗어나 스스로 서는 일"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "사람들을 잡아 가둘수록 소금을 만드는 사람이 오히려 늘어난 까닭을 짐작하면 무엇인가요?", "options": ["감옥의 밥이 맛있다고 소문났기 때문에", "때리고 가둘수록 잘못한 쪽은 영국이라는 것이 뚜렷해져 더 많은 사람이 용기를 냈기 때문에", "소금 값이 크게 올랐기 때문에", "경찰의 수가 부족했기 때문에"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "\"눈에는 눈으로 대응하면, 결국 온 세상이 눈멀게 됩니다.\"라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["폭력을 폭력으로 되갚으면 결국 모두가 상처 입고 만다는 뜻", "눈이 나쁘면 싸움에서 진다는 뜻", "맞은 만큼 갚아 주어야 공평하다는 뜻", "싸움 구경을 하면 안 된다는 뜻"], "correct": 0}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "'겁 많던 청년'이라는 간디의 출발점이 이야기에서 강조되는 이유는 무엇입니까?", "options": ["법률가로서의 자질 부족을 비판하기 위해", "어린 시절 교육의 중요성을 알리기 위해", "위대함은 타고난 기질이 아니라 결심과 선택의 반복에서 나왔음을 보여 주기 위해", "가족의 반대가 심했음을 설명하기 위해"], "correct": 2},
      {"gate": 2, "category": "인물파악", "question": "마리츠버그 역의 밤이 간디의 생애에서 갖는 의미로 가장 적절한 것은 무엇입니까?", "options": ["변호사 개업을 결심한 계기", "영국 유학을 결정한 계기", "남아프리카 정착을 포기한 계기", "차별에 도망치지 않고 맞서기로 결단한 전환점"], "correct": 3},
      {"gate": 3, "category": "내용일치", "question": "기차 사건의 내용으로 옳은 것은 무엇입니까?", "options": ["정당한 일등석 표를 소지했으나 피부색을 이유로 끌려 내려졌다", "표를 위조한 사실이 드러나 하차당했다", "기차 고장으로 모든 승객이 함께 내렸다", "좌석 등급을 착각하여 스스로 자리를 옮겼다"], "correct": 0},
      {"gate": 4, "category": "내용일치", "question": "소금 행진의 전개 과정으로 옳은 것은 무엇입니까?", "options": ["처음부터 수만 명이 조직적으로 동원되었다", "78명으로 출발해 마을을 지날수록 수천 명의 행렬로 불어났다", "영국군의 저지로 바다에 도착하지 못했다", "기차와 배를 이용해 신속히 이동했다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'소금'이라는 소재 선택에 담긴 간디의 전략적 판단은 무엇입니까?", "options": ["영국 경제에 가장 큰 타격을 주는 품목이었기 때문", "군사적으로 중요한 물자였기 때문", "외국 언론이 가장 좋아할 소재였기 때문", "신분·빈부·종교를 가리지 않는 것이어서 모두를 하나로 묶을 수 있었기 때문"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "물레가 이야기에서 상징하는 바로 가장 적절한 것은 무엇입니까?", "options": ["말보다 앞선 실천, 스스로 변화가 되는 저항의 방식", "전통 산업의 경제적 우수성", "기계 문명에 대한 무조건적 거부", "농촌 생활의 한가로움"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'불복종'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["명령의 내용을 몰래 바꾸는 일", "부당한 법과 명령에 의도적으로 따르지 않는 저항 방식", "윗사람의 지시를 잊어버리는 일", "법정에서 판결에 항소하는 절차"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'독립'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["두 나라가 동맹을 맺는 일", "한 나라가 다른 나라를 병합하는 일", "다른 나라의 지배에서 벗어나 주권을 되찾는 일", "정권이 다른 정당으로 교체되는 일"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'잡아들일수록 부끄러워지는 쪽은 제국이었다'는 서술의 의미를 추론하면 무엇입니까?", "options": ["감옥 운영 비용이 국가 재정을 압박했다는 뜻", "경찰 인력이 부족해 치안이 무너졌다는 뜻", "죄수들이 감옥 안에서 세력을 키웠다는 뜻", "비폭력 앞에서 폭력적 진압은 진압하는 쪽의 부당함만 드러냈다는 뜻"], "correct": 3},
      {"gate": 10, "category": "내용추론", "question": "\"눈에는 눈\"에 대한 간디의 경고가 담고 있는 통찰은 무엇입니까?", "options": ["같은 방식의 복수는 정의를 세우는 가장 빠른 길이다", "보복의 악순환은 승자 없이 모두를 파괴로 이끈다", "힘의 균형이 이루어져야 평화가 온다", "용서는 강자만이 베풀 수 있는 특권이다"], "correct": 1}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "법정에서 도망친 청년이 수십만 군중 앞에 서는 인물로 변모하는 과정이 시사하는 바로 가장 적절한 것은 무엇인가?", "options": ["위대함의 본질은 타고난 기질이 아니라 결정적 순간의 선택과 그 반복에 있다", "웅변술의 훈련이 지도자의 필수 조건이다", "유년기의 결핍은 성인기의 성취로 반드시 보상된다", "공포의 극복은 종교적 수행을 통해서만 가능하다"], "correct": 0},
      {"gate": 2, "category": "인물파악", "question": "마리츠버그 역에서의 결단이 갖는 실존적 의미로 가장 적절한 것은 무엇인가?", "options": ["법률가로서의 경력을 지키려는 직업적 판단", "개인의 굴욕을 공동체의 문제로 전환하여 회피 대신 대면을 선택한 삶의 방향 전환", "안전한 귀향을 위한 일시적 타협", "보복을 다짐하는 사적 원한의 시작"], "correct": 1},
      {"gate": 3, "category": "내용일치", "question": "남아프리카에서 인도인들이 겪던 차별의 실상으로 옳은 것은 무엇인가?", "options": ["토지 소유가 전면 금지되었다", "교육 기관 입학이 원천 봉쇄되었다", "종교 활동이 법으로 금지되었다", "야간 통행이 제한되고 번호가 적힌 증명서 휴대가 강제되었다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "소금법의 내용과 그 성격으로 옳은 것은 무엇인가?", "options": ["소금 생산을 직접 금지하고 무거운 세금을 얹어, 가장 가난한 이의 생필품까지 수탈한 법이었다", "소금의 품질을 관리하기 위한 위생 법령이었다", "소금 수출을 장려하기 위한 무역 법령이었다", "인도 상인의 소금 전매권을 보호하는 법이었다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "'소금'이라는 소재의 서사적·전략적 기능으로 가장 적절한 것은 무엇인가?", "options": ["제국의 군사력을 직접 무력화하는 수단", "가장 보편적인 생필품을 매개로 계급·종교의 경계를 넘는 연대를 창출하는 구심점", "영국 본토 여론을 자극하기 위한 상징 조작", "경제적 자급자족을 완성하는 산업 정책"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "물레와 소금이 '무기'로 명명되는 역설의 함의로 가장 적절한 것은 무엇인가?", "options": ["농업 사회로의 회귀가 저항의 목표라는 것", "무기 없는 저항은 실패할 수밖에 없다는 것", "일상의 가장 평범한 사물이야말로 누구나 참여할 수 있는 저항의 도구가 된다는 것", "상징보다 실리가 중요하다는 것"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'시민 불복종(不服從)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["법 절차에 따라 청원과 소송을 제기하는 행위", "무장 봉기를 통해 정권을 전복하는 행위", "불의한 법에 공개적·비폭력적으로 따르지 않되 그 처벌은 감수하는 저항", "비밀 결사를 통한 지하 저항 운동"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'독립(獨立)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["외국 자본의 투자를 유치하는 경제 정책", "타국의 지배에서 벗어나 주권을 회복하여 스스로 서는 것", "연방 내에서 자치권을 확대하는 것", "국제 기구에 가입하여 지위를 인정받는 것"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "'때릴수록 때리는 쪽이 부끄러워진다'는 비폭력 저항의 작동 원리를 추론하면 무엇인가?", "options": ["되갚지 않는 저항 앞에서 폭력적 진압은 그 부당성을 스스로 증명하게 된다", "진압의 강도가 높아질수록 저항 비용이 커져 저항이 소멸한다", "폭력의 공포가 대중의 참여를 차단한다", "국제 사회의 경제 제재가 자동으로 발동된다"], "correct": 0},
      {"gate": 10, "category": "내용추론", "question": "독립 축하 자리에 불참하고 분쟁 지역에서 단식한 간디의 행보에서 추론되는 그의 궁극적 목표는 무엇인가?", "options": ["정치 권력의 장악과 새 정부 수립", "국제 사회에서의 개인적 명성 획득", "영국에 대한 역사적 심판과 배상", "지배의 종식을 넘어 증오 없이 공존하는 공동체의 실현"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '간디' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldperson12',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldperson12',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
