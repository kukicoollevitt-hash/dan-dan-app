<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌻 살아서 한 점, 죽어서 온 세상 — 반 고흐 - 시즌1 관문평가</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Gmarket Sans", "Noto Sans KR", sans-serif;
      background: url('/images/창작도서/창작세계인물13/00.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 0;
    }

    .quiz-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      max-width: 750px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
      position: relative;
      z-index: 1;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quiz-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .quiz-header h1 {
      font-size: 32px;
      color: #2c3e50;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .quiz-header .gate-number {
      font-size: 18px;
      color: #2d6a4f;
      font-weight: 600;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .quiz-header .category-badge {
      display: inline-block;
      padding: 6px 16px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e0e0e0;
      border-radius: 10px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .question-box {
      background: #f8f9fa;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 30px;
      border-left: 5px solid #2d6a4f;
    }

    .question-text {
      font-size: 20px;
      color: #2c3e50;
      font-weight: 600;
      line-height: 1.7;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .option-btn {
      background: white;
      border: 2px solid #e0e0e0;
      padding: 20px 25px;
      border-radius: 15px;
      font-size: 17px;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.3s ease;
      text-align: left;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover {
      border-color: #2d6a4f;
      background: #f0fff4;
      transform: translateX(5px);
    }

    .option-btn.selected {
      border-color: #2d6a4f;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
    }

    .option-btn.correct {
      border-color: #27ae60;
      background: #27ae60;
      color: white;
    }

    .option-btn.wrong {
      border-color: #e74c3c;
      background: #e74c3c;
      color: white;
    }

    .option-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .submit-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-message {
      text-align: center;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-message.correct {
      background: #d4edda;
      color: #155724;
      border: 2px solid #28a745;
    }

    .result-message.wrong {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #dc3545;
    }

    .congrats-container {
      text-align: center;
      animation: scaleIn 0.6s ease-out;
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.8);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .congrats-container h2 {
      font-size: 44px;
      margin-bottom: 20px;
    }

    .congrats-container p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .score-summary {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 16px;
      margin: 25px 0;
      text-align: left;
    }

    .score-summary h3 {
      font-size: 18px;
      color: #2d6a4f;
      margin-bottom: 15px;
      text-align: center;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }

    .score-item:last-child {
      border-bottom: none;
    }

    .score-item .category {
      font-weight: 600;
      color: #2c3e50;
    }

    .score-item .score {
      font-weight: 700;
      color: #2d6a4f;
    }

    .back-btn {
      background: white;
      border: 2px solid #2d6a4f;
      color: #2d6a4f;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-right: 10px;
    }

    .back-btn:hover {
      background: #2d6a4f;
      color: white;
    }

    /* 레이더 차트 */
    .radar-container {
      display: flex;
      justify-content: center;
      margin: 25px 0;
    }

    .radar-chart {
      position: relative;
      width: 280px;
      height: 280px;
    }

    /* 반응형 */
    @media (max-width: 768px) {
      .quiz-container {
        padding: 30px 20px;
      }
      .quiz-header h1 {
        font-size: 24px;
      }
      .question-text {
        font-size: 17px;
      }
      .option-btn {
        font-size: 15px;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quizContainer">
    <!-- 퀴즈 내용이 여기에 동적으로 생성됩니다 -->
  </div>

  <script>
    // 퀴즈 문제 데이터 - 5가지 카테고리별 2문제씩 총 10문제
    // 카테고리: 인물파악, 내용일치, 내용구조, 내용어휘, 내용추론
    const quizDataSeason1 = [
      {"gate": 1, "category": "인물파악", "question": "젊은 빈센트가 화랑에서 그림 파는 일을 하다가 쫓겨난 까닭은 무엇인가요?", "options": ["그림을 몰래 집에 가져가서", "지각을 너무 자주 해서", "손님과 큰 싸움을 벌여서", "손님이 고른 그림이 좋지 않다고 참지 못하고 말해 버려서"], "correct": 3},
      {"gate": 2, "category": "인물파악", "question": "동생 테오가 형 빈센트에게 해 준 일로 알맞은 것은 무엇인가요?", "options": ["십 년 동안 한 번도 거르지 않고 매달 생활비를 부쳐 주었다", "형의 그림을 모두 비싸게 사 주었다", "형에게 그림 그리는 법을 가르쳐 주었다", "형을 자기 회사에 취직시켜 주었다"], "correct": 0},
      {"gate": 3, "category": "내용일치", "question": "빈센트가 살아 있는 동안 실제로 팔린 그림은 몇 점이었다고 전해지나요?", "options": ["백 점이 넘게 팔렸다", "단 한 점이었다", "오십 점쯤 팔렸다", "한 점도 팔리지 않았다"], "correct": 1},
      {"gate": 4, "category": "내용일치", "question": "「별이 빛나는 밤」은 어디에서 그려진 그림인가요?", "options": ["파리의 화려한 작업실", "노란 집의 손님방", "쇠창살 달린 창이 있는 요양원의 방", "아를의 밀밭 한가운데"], "correct": 2},
      {"gate": 5, "category": "내용구조", "question": "탄광 마을에서 광부들의 뒷모습을 그린 일이 빈센트의 삶에서 중요한 까닭은 무엇인가요?", "options": ["그리는 동안 처음으로 마음이 조용해지며 자기 길을 발견했기 때문에", "광부들이 그림값을 후하게 주었기 때문에", "그 그림으로 미술 대회에서 상을 받았기 때문에", "교회에서 그림을 칭찬해 주었기 때문에"], "correct": 0},
      {"gate": 6, "category": "내용구조", "question": "테오의 아내 요한나가 이야기의 결말에서 한 중요한 일은 무엇인가요?", "options": ["형제의 무덤을 아름답게 꾸몄다", "남겨진 그림을 모두 박물관에 기증했다", "형제의 이야기를 영화로 만들었다", "그림과 편지를 지켜 내고 전시회와 책으로 세상에 알렸다"], "correct": 3},
      {"gate": 7, "category": "내용어휘", "question": "'화랑'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["그림 그리는 도구를 만드는 공장", "화가들이 모여 사는 마을", "그림을 걸어 두고 사고파는 가게", "오래된 그림을 고치는 병원"], "correct": 2},
      {"gate": 8, "category": "내용어휘", "question": "'걸작'의 뜻으로 알맞은 것은 무엇인가요?", "options": ["걸어 다니며 그린 그림", "아주 뛰어나 오래 남는 작품", "벽에 걸 수 있게 만든 작품", "가장 크게 그린 그림"], "correct": 1},
      {"gate": 9, "category": "내용추론", "question": "빈센트가 물감을 두껍게 얹어 소용돌이치듯 그린 까닭을 짐작하면 무엇인가요?", "options": ["물감이 남아돌아서 아낌없이 쓴 것이다", "눈에 보이는 그대로가 아니라 자기가 느낀 감정을 그리려 했기 때문이다", "붓이 낡아서 얇게 칠할 수 없었기 때문이다", "빨리 그리려고 대충 칠한 것이다"], "correct": 1},
      {"gate": 10, "category": "내용추론", "question": "\"그림은 그대로인데, 알아보는 눈이 생기기까지 시간이 걸린 것뿐\"이라는 말의 뜻으로 알맞은 것은 무엇인가요?", "options": ["시간이 지나면 그림값은 무조건 오른다는 뜻", "옛날 사람들은 그림을 볼 줄 몰랐다는 뜻", "지금 인정받지 못한다고 해서 가치가 없는 것은 아니라는 뜻", "그림은 오래 보관할수록 색이 좋아진다는 뜻"], "correct": 2}
    ];

    // 시즌2 (5~6학년 수준) - 표현 약간 어렵게
    const quizDataSeason2 = [
      {"gate": 1, "category": "인물파악", "question": "화랑 점원 시절의 사건에서 드러나는 빈센트의 기질은 무엇입니까?", "options": ["이익을 위해 신념을 감추는 처세술", "손해를 보더라도 솔직함을 굽히지 못하는 우직함", "손님의 비위를 맞추는 사교성", "일에 대한 무관심과 게으름"], "correct": 1},
      {"gate": 2, "category": "인물파악", "question": "테오가 형에게 보낸 답장(\"갚을 생각 하지 말고 그리기만 해\")에서 알 수 있는 테오의 마음은 무엇입니까?", "options": ["형의 빚을 기록해 두려는 꼼꼼함", "형에 대한 동정과 연민", "형의 그림이 지닌 가치에 대한 흔들림 없는 믿음", "형이 곧 유명해질 것이라는 막연한 기대"], "correct": 2},
      {"gate": 3, "category": "내용일치", "question": "빈센트의 생전 처지에 대한 서술로 옳은 것은 무엇입니까?", "options": ["말년에는 유럽 최고의 화가로 인정받았다", "꾸준히 그림이 팔려 생활이 안정되어 있었다", "왕실의 후원을 받으며 작업했다", "십 년간 이천 점 가까이 그렸으나 팔린 것은 단 한 점이었다"], "correct": 3},
      {"gate": 4, "category": "내용일치", "question": "「별이 빛나는 밤」의 탄생 배경으로 옳은 것은 무엇입니까?", "options": ["스스로 들어간 요양원의 창살 너머로 본 새벽 하늘을 그렸다", "파리의 옥상에서 불꽃놀이를 보고 그렸다", "고향 네덜란드의 겨울 밤하늘을 추억하며 그렸다", "천문대에서 망원경으로 관측한 별을 그렸다"], "correct": 0},
      {"gate": 5, "category": "내용구조", "question": "탄광 마을 장면이 서사에서 갖는 의미로 가장 적절한 것은 무엇입니까?", "options": ["교회와의 갈등이 폭발하는 위기의 장면", "거듭된 실패 끝에 그림이라는 자기 길을 발견하는 출발점", "광부들의 파업을 이끄는 영웅적 장면", "가난에서 벗어나 성공을 시작하는 장면"], "correct": 1},
      {"gate": 6, "category": "내용구조", "question": "요한나라는 인물이 이야기의 구조에서 수행하는 역할은 무엇입니까?", "options": ["형제의 비극을 심화시키는 갈등의 원인", "빈센트의 그림 세계를 비판하는 반대자", "잊힐 뻔한 유산을 세상과 이어 평가의 반전을 만드는 다리", "형제의 재산을 관리하는 조력자"], "correct": 2},
      {"gate": 7, "category": "내용어휘", "question": "'화랑'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["그림을 전시하고 사고파는 가게", "화가를 길러 내는 교육 기관", "물감과 붓을 파는 상점", "그림을 복원하고 보관하는 창고"], "correct": 0},
      {"gate": 8, "category": "내용어휘", "question": "'걸작'의 의미로 가장 적절한 것은 무엇입니까?", "options": ["미완성으로 남은 작품", "여러 사람이 함께 만든 작품", "가장 큰 화폭에 그린 작품", "매우 뛰어나서 오래도록 남는 작품"], "correct": 3},
      {"gate": 9, "category": "내용추론", "question": "\"밀밭 앞에서 가슴이 뛰었다면 밀밭은 뛰는 색으로 그려야 한다\"는 믿음에서 추론할 수 있는 빈센트의 그림관은 무엇입니까?", "options": ["그림은 사진처럼 정확해야 한다", "그림은 유행을 따라야 팔린다", "그림은 본 것의 재현이 아니라 느낀 것의 표현이다", "그림은 기술 연마가 전부다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "반 고흐의 생애가 '가치와 인정의 시차'에 대해 시사하는 바는 무엇입니까?", "options": ["당대의 평가와 진정한 가치는 어긋날 수 있으며, 가치는 알아보는 눈을 만나 뒤늦게 빛나기도 한다", "시대를 앞선 것은 결국 모두 잊히고 만다", "예술의 가치는 가격으로만 측정된다", "인정받지 못하는 것은 재능이 부족하다는 증거다"], "correct": 0}
    ];

    // 시즌3 (중1~2 수준) - 표현 더 어렵게
    const quizDataSeason3 = [
      {"gate": 1, "category": "인물파악", "question": "화랑에서의 해고 사건이 예고하는 빈센트의 생애 전체의 특성으로 가장 적절한 것은 무엇인가?", "options": ["세속의 규범과 타협하지 못하는 진실성이 그의 불행과 예술 모두의 근원이 된다는 것", "권위에 대한 순응이 그의 몰락을 초래한다는 것", "상업적 감각의 부재가 노력으로 극복된다는 것", "대인 관계의 기술이 성공의 조건이라는 것"], "correct": 0},

      {"gate": 3, "category": "내용일치", "question": "빈센트의 화풍(畫風)에 대한 서술로 옳은 것은 무엇인가?", "options": ["당대에 유행하던 매끈하고 단정한 화풍을 충실히 따랐다", "어두운 단색조를 평생 고수했다", "물감을 두껍게 얹은 거친 붓 자국으로 감정을 표현했다", "자를 대고 그린 정밀한 기하학적 구도를 추구했다"], "correct": 2},
      {"gate": 4, "category": "내용일치", "question": "형제 사후 유산의 운명에 대한 서술로 옳은 것은 무엇인가?", "options": ["국가가 몰수하여 국립 미술관에 소장했다", "요한나가 그림과 육백여 통의 편지를 지켜 전시와 출판으로 세상에 알렸다", "채권자들에게 헐값으로 분산 매각되었다", "화재로 대부분 소실되었다"], "correct": 1},
      {"gate": 5, "category": "내용구조", "question": "'가장 외로운 시절에 가장 환한 해바라기를 그렸다'는 역설이 만들어 내는 효과로 가장 적절한 것은 무엇인가?", "options": ["시대 배경의 사실적 재현", "계절의 순환에 따른 서정적 분위기 조성", "인물의 이중성에 대한 도덕적 비판", "절망과 창조 사이의 긴장을 통해 예술이 삶을 버티는 방식이었음을 부각"], "correct": 3},
      {"gate": 6, "category": "내용구조", "question": "요한나의 서사적 기능을 '다리'에 비유할 때, 그 다리가 잇는 두 지점은 무엇인가?", "options": ["생전의 몰이해와 사후의 재평가", "네덜란드와 프랑스라는 두 나라", "종교와 예술이라는 두 세계", "가난과 부유함이라는 두 계층"], "correct": 0},
      {"gate": 7, "category": "내용어휘", "question": "'화랑(畫廊)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["화가들의 공동 작업 공간", "그림을 전시·매매하는 상업적 공간", "미술 이론을 연구하는 학술 기관", "작품을 수리·복원하는 전문 시설"], "correct": 1},
      {"gate": 8, "category": "내용어휘", "question": "'걸작(傑作)'의 개념으로 가장 적절한 것은 무엇인가?", "options": ["제작 기간이 가장 오래 걸린 작품", "작가가 마지막으로 남긴 작품", "예술적 성취가 탁월하여 시대를 넘어 남는 작품", "가장 높은 가격에 거래된 작품"], "correct": 2},
      {"gate": 9, "category": "내용추론", "question": "'재현이 아니라 표현'이라는 빈센트의 화법이 미술사에 남긴 유산을 추론하면 무엇인가?", "options": ["원근법의 완성으로 사실주의를 심화시켰다", "사진술과의 경쟁에서 회화의 패배를 인정하게 했다", "감정을 화면에 직접 옮기는 길을 열어 이후 수많은 화가들의 방식이 되었다", "종교화의 전통을 부활시켰다"], "correct": 2},
      {"gate": 10, "category": "내용추론", "question": "\"언젠가 내 그림이 물감값보다 값어치 있음을 알게 될 것\"이라는 편지 구절과 그의 사후 운명이 함께 증명하는 명제는 무엇인가?", "options": ["예술가는 생전의 평가에 연연해야 한다", "시장의 가격이 예술의 가치를 즉시 반영한다", "무명의 시간은 재능 부족의 증거다", "가치에 대한 확신은 당대의 몰이해보다 오래 살아남는다"], "correct": 3}
    ];

    // URL 파라미터에서 시즌 정보 가져오기
    function getSeasonFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('season') || 'season1';
    }

    // 시즌에 따른 퀴즈 데이터 선택
    const season = getSeasonFromUrl();
    const quizData = season === 'season1' ? quizDataSeason1
                   : season === 'season2' ? quizDataSeason2
                   : quizDataSeason3;


    let currentGate = 0;
    let selectedAnswer = null;
    let categoryScores = {
      "인물파악": 0,
      "내용일치": 0,
      "내용구조": 0,
      "내용어휘": 0,
      "내용추론": 0
    };

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      const quiz = quizData[currentGate];

      container.innerHTML = `
        <div class="quiz-header">
          <h1>🌿 관문평가</h1>
          <p class="gate-number">10개 관문 중 ${quiz.gate}번째</p>
          <span class="category-badge">${quiz.category}</span>
        </div>

        <div class="progress-bar-container">
          <div class="progress-bar" style="width: ${(quiz.gate / 10) * 100}%"></div>
        </div>

        <div class="question-box">
          <p class="question-text">${quiz.question}</p>
        </div>

        <div class="options-container">
          ${quiz.options.map((option, index) => `
            <button class="option-btn" onclick="selectAnswer(${index})">
              ${index + 1}. ${option}
            </button>
          `).join('')}
        </div>

        <button class="submit-btn" onclick="submitAnswer()" disabled>
          답안 제출
        </button>
      `;
    }

    function selectAnswer(index) {
      selectedAnswer = index;

      // 모든 버튼 선택 해제
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.remove('selected'));

      // 선택한 버튼 표시
      buttons[index].classList.add('selected');

      // 제출 버튼 활성화
      document.querySelector('.submit-btn').disabled = false;
    }

    function submitAnswer() {
      const quiz = quizData[currentGate];
      const buttons = document.querySelectorAll('.option-btn');
      const submitBtn = document.querySelector('.submit-btn');

      // 버튼 비활성화
      buttons.forEach(btn => btn.disabled = true);
      submitBtn.disabled = true;

      const isCorrect = selectedAnswer === quiz.correct;

      if (isCorrect) {
        // 정답 - 카테고리 점수 추가
        categoryScores[quiz.category]++;
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('correct');
        showResult(true);
      } else {
        // 오답 - 정답 표시
        buttons[selectedAnswer].classList.remove('selected');
        buttons[selectedAnswer].classList.add('wrong');
        buttons[quiz.correct].classList.add('correct');
        showResult(false);
      }
    }

    function showResult(isCorrect) {
      const container = document.getElementById('quizContainer');

      // 결과 메시지 추가
      const resultMsg = document.createElement('div');
      if (isCorrect) {
        resultMsg.className = 'result-message correct';
        resultMsg.innerHTML = '🎉 정답입니다! 다음 관문으로 이동합니다...';
      } else {
        resultMsg.className = 'result-message wrong';
        resultMsg.innerHTML = '❌ 틀렸습니다. 다음 관문으로 이동합니다...';
      }
      container.insertBefore(resultMsg, container.firstChild);

      // 1.5초 후 다음 문제로
      setTimeout(() => {
        currentGate++;
        selectedAnswer = null;

        if (currentGate >= quizData.length) {
          // 모든 관문 완료!
          showCongratulations();
        } else {
          renderQuiz();
        }
      }, 1500);
    }

    // 영역별 점수를 10점 만점으로 환산 (2문제=10점, 1문제=5점, 0문제=1점)
    function convertToRadarScore(correctCount) {
      if (correctCount === 2) return 10;
      if (correctCount === 1) return 5;
      return 1;
    }

    // 레이더 차트 그리기
    function drawRadarChart(scores) {
      const canvas = document.getElementById('radarCanvas');
      const ctx = canvas.getContext('2d');
      const centerX = 140;
      const centerY = 140;
      const maxRadius = 100;

      // 5각형 좌표 계산 (상단부터 시계방향)
      const angles = [];
      for (let i = 0; i < 5; i++) {
        angles.push((Math.PI * 2 * i / 5) - Math.PI / 2);
      }

      // 배경 격자 그리기 (10, 5, 1 레벨)
      ctx.strokeStyle = '#e0e0e0';
      ctx.lineWidth = 1;

      [1, 0.5, 0.1].forEach(ratio => {
        ctx.beginPath();
        for (let i = 0; i <= 5; i++) {
          const angle = angles[i % 5];
          const x = centerX + Math.cos(angle) * maxRadius * ratio;
          const y = centerY + Math.sin(angle) * maxRadius * ratio;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // 축 그리기
      ctx.strokeStyle = '#d0d0d0';
      angles.forEach(angle => {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(angle) * maxRadius, centerY + Math.sin(angle) * maxRadius);
        ctx.stroke();
      });

      // 데이터 영역 그리기
      const categories = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      ctx.beginPath();
      ctx.fillStyle = 'rgba(45, 106, 79, 0.3)';
      ctx.strokeStyle = '#2d6a4f';
      ctx.lineWidth = 2;

      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 데이터 포인트 그리기
      ctx.fillStyle = '#1b4332';
      categories.forEach((cat, i) => {
        const score = scores[cat];
        const ratio = score / 10;
        const x = centerX + Math.cos(angles[i]) * maxRadius * ratio;
        const y = centerY + Math.sin(angles[i]) * maxRadius * ratio;
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      });

      // 라벨 그리기
      ctx.fillStyle = '#2c3e50';
      ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
      ctx.textAlign = 'center';

      const labelOffset = 18;
      const labels = ['인물파악', '내용일치', '내용구조', '내용어휘', '내용추론'];
      labels.forEach((label, i) => {
        const x = centerX + Math.cos(angles[i]) * (maxRadius + labelOffset);
        const y = centerY + Math.sin(angles[i]) * (maxRadius + labelOffset);
        ctx.fillText(label, x, y + 4);
      });
    }

    function showCongratulations() {
      const container = document.getElementById('quizContainer');

      // 영역별 레이더 점수 계산 (10점 만점)
      const radarScores = {
        "인물파악": convertToRadarScore(categoryScores["인물파악"]),
        "내용일치": convertToRadarScore(categoryScores["내용일치"]),
        "내용구조": convertToRadarScore(categoryScores["내용구조"]),
        "내용어휘": convertToRadarScore(categoryScores["내용어휘"]),
        "내용추론": convertToRadarScore(categoryScores["내용추론"])
      };

      // 총점 계산 (100점 만점)
      const totalRadarScore = Object.values(radarScores).reduce((a, b) => a + b, 0);
      const totalScore100 = totalRadarScore * 2; // 50점 만점 → 100점 만점으로 환산

      container.innerHTML = `
        <div class="congrats-container">
          <h2>🎊 관문평가 완료! 🎊</h2>
          <p>
            10개의 관문을 모두 완료했습니다!<br>
            '반 고흐' 이야기를 잘 이해하셨네요.
          </p>

          <div class="radar-container">
            <canvas id="radarCanvas" width="280" height="280"></canvas>
          </div>

          <div class="score-summary">
            <h3>📊 영역별 점수 (각 10점 만점)</h3>
            <div class="score-item">
              <span class="category">👤 인물파악</span>
              <span class="score">${radarScores["인물파악"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">✅ 내용일치</span>
              <span class="score">${radarScores["내용일치"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🏗️ 내용구조</span>
              <span class="score">${radarScores["내용구조"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">📚 내용어휘</span>
              <span class="score">${radarScores["내용어휘"]} / 10</span>
            </div>
            <div class="score-item">
              <span class="category">🔍 내용추론</span>
              <span class="score">${radarScores["내용추론"]} / 10</span>
            </div>
            <div class="score-item" style="border-top: 2px solid #2d6a4f; margin-top: 10px; padding-top: 15px;">
              <span class="category" style="font-size: 18px;">총점</span>
              <span class="score" style="font-size: 22px; color: #1b4332;">${totalScore100}점</span>
            </div>
          </div>

          <button class="back-btn" onclick="goBack()">
            ← 목록으로 돌아가기
          </button>
          <button class="submit-btn" onclick="retryQuiz()" style="margin-top: 10px;">
            🔄 다시 풀기
          </button>
        </div>
      `;

      // 레이더 차트 그리기
      setTimeout(() => {
        drawRadarChart(radarScores);
      }, 100);

      // 결과 저장 (서버 API 호출)
      saveQuizResult(radarScores, totalScore100);

      // 결과 저장 (부모 창에 전달)
      if (window.parent !== window) {
        window.parent.postMessage({
          action: 'quizComplete',
          storyId: 'worldperson13',
          season: getSeasonFromUrl(),
          scores: radarScores,
          totalScore: totalScore100
        }, '*');
      }
    }

    // 서버에 결과 저장
    async function saveQuizResult(scores, totalScore) {
      try {
        // 로그인 정보 가져오기 (sessionStorage 'user' 키 사용)
        const userInfo = JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || '{}');
        const grade = userInfo.grade || '';
        const name = userInfo.name || '';

        if (!grade || !name) {
          console.log('[saveQuizResult] 로그인 정보 없음 - 저장 건너뜀');
          return;
        }

        // URL 파라미터에서 시즌 가져오기
        const season = getSeasonFromUrl();

        const response = await fetch('/api/creative-quiz/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grade,
            name,
            storyId: 'worldperson13',
            season,
            scores,
            totalScore
          })
        });

        const result = await response.json();
        if (result.ok) {
          console.log('[saveQuizResult] 저장 완료:', result);
        } else {
          console.error('[saveQuizResult] 저장 실패:', result.message);
        }
      } catch (err) {
        console.error('[saveQuizResult] 오류:', err);
      }
    }

    function goBack() {
      if (window.parent !== window) {
        window.parent.postMessage({ action: 'closeStory' }, '*');
      } else {
        window.history.back();
      }
    }

    function retryQuiz() {
      currentGate = 0;
      selectedAnswer = null;
      categoryScores = {
        "인물파악": 0,
        "내용일치": 0,
        "내용구조": 0,
        "내용어휘": 0,
        "내용추론": 0
      };
      renderQuiz();
    }

    // 페이지 로드 시 첫 번째 퀴즈 표시
    window.addEventListener('DOMContentLoaded', () => {
      renderQuiz();
    });

    // ESC 키로 뒤로가기
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (confirm('퀴즈를 종료하고 목록으로 돌아가시겠습니까?')) {
          goBack();
        }
      }
    });
  </script>
