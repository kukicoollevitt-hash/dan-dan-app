
<title>국어 개념 원정대 — 롤플레잉 탐험</title>
<style>
  #bootOv{position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(120% 90% at 50% -10%, #123e52 0%, #08222c 55%, #05171e 100%);
    font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    transition:opacity .5s ease}
  #bootOv.bye{opacity:0; pointer-events:none}
  .boot-seal{width:74px; height:74px; border-radius:50%; display:grid; place-items:center; font-size:38px;
    background:radial-gradient(circle at 35% 30%, #ffb974, #ff8a3d 60%, #c85e1c);
    box-shadow:0 10px 30px rgba(255,138,61,.4), inset 0 2px 5px rgba(255,255,255,.4);
    animation:bootBob 2s ease-in-out infinite}
  @keyframes bootBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
  .boot-msg{font-size:16.5px; font-weight:800; color:#f4e7c9; letter-spacing:-.2px}
  .boot-msg .d{display:inline-block; animation:bootDot 1.4s ease-in-out infinite}
  .boot-msg .d:nth-child(2){animation-delay:.2s}.boot-msg .d:nth-child(3){animation-delay:.4s}
  @keyframes bootDot{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .boot-track{position:relative; width:min(320px,72vw); height:16px; border-radius:10px; overflow:hidden;
    background:rgba(244,231,201,.12); border:1px solid rgba(244,231,201,.22)}
  .boot-fill{position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:10px;
    background:linear-gradient(90deg,#f6c945,#ff8a3d); box-shadow:0 0 14px rgba(246,201,69,.55);
    transition:width .3s ease}
  .boot-fill::after{content:''; position:absolute; inset:0;
    background:linear-gradient(110deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
    animation:bootShine 1.3s linear infinite}
  @keyframes bootShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .boot-pct{font-size:13px; font-weight:900; color:#f6c945; font-variant-numeric:tabular-nums; letter-spacing:.06em}
  .ptab.locked{opacity:.62}
  .soon-ov{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:20px;
    background:rgba(4,14,20,.7); backdrop-filter:blur(5px); animation:fade .25s ease}
  .soon-ov.bye{opacity:0; transition:opacity .25s}
  .soon-card{position:relative; width:100%; max-width:380px; text-align:center; overflow:hidden;
    background:linear-gradient(165deg,#14384a 0%,#0d2836 60%,#0a2130 100%);
    border:1.5px solid rgba(246,201,69,.45); border-radius:24px; padding:34px 26px 26px;
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(244,231,201,.15);
    animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
  .soon-glow{position:absolute; left:50%; top:-40px; width:260px; height:160px; transform:translateX(-50%);
    background:radial-gradient(ellipse, rgba(246,201,69,.28), transparent 70%); pointer-events:none}
  .soon-badge{display:inline-block; font-size:10px; font-weight:900; letter-spacing:.3em; color:#3a2a04;
    background:linear-gradient(135deg,#ffe9a8,var(--gold)); border-radius:20px; padding:5px 14px 5px 16px; margin-bottom:14px}
  .soon-book{font-size:54px; line-height:1; margin-bottom:12px; filter:drop-shadow(0 8px 18px rgba(199,123,176,.5)); animation:hop 2.2s ease-in-out infinite}
  .soon-card h3{font-size:20px; color:#fff; letter-spacing:-.3px; margin-bottom:10px}
  .soon-card p{font-size:13.5px; line-height:1.7; color:#bcd3dc; margin-bottom:16px}
  .soon-isles{font-size:19px; letter-spacing:4px; margin-bottom:20px; color:#8ea1ab}
  .soon-dots{font-weight:900; color:var(--gold); letter-spacing:2px; margin:0 2px}
  .soon-ok{font-family:inherit; font-weight:800; font-size:15px; cursor:pointer; border:none; border-radius:14px; padding:13px 34px;
    background:linear-gradient(135deg,#e3a5d0,var(--lit)); color:#2c0a22; box-shadow:0 6px 18px rgba(199,123,176,.45); transition:.15s}
  .soon-ok:hover{transform:translateY(-2px)}
  .soon-ok:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .soon-spark{position:absolute; font-size:13px; pointer-events:none; opacity:0; animation:soonTwinkle 2.2s ease-in-out infinite}
  @keyframes soonTwinkle{0%,100%{opacity:0; transform:scale(.5)}50%{opacity:.9; transform:scale(1.15)}}
  @media (prefers-reduced-motion:reduce){ .boot-seal,.boot-msg .d,.boot-fill::after{animation:none} }
</style>
<div id="bootOv" role="status" aria-live="polite">
  <div class="boot-seal">🧭</div>
  <div class="boot-msg">원정대가 여행을 준비 중입니다<span class="d">.</span><span class="d">.</span><span class="d">.</span></div>
  <div class="boot-track"><div class="boot-fill" id="bootFill"></div></div>
  <div class="boot-pct" id="bootPct">0%</div>
</div>
<script>
(function(){
  var p=0, fill=document.getElementById('bootFill'), pct=document.getElementById('bootPct'), done=false;
  var tick=setInterval(function(){
    if(done) return;
    p += (90-p)*0.055 + 0.12;               // 90%까지 점근 (실제 파싱 완료 전엔 다 차지 않음)
    if(p>90) p=90;
    fill.style.width=p+'%'; pct.textContent=Math.round(p)+'%';
  }, 90);
  window.__expBootDone=function(){
    done=true; clearInterval(tick);
    fill.style.width='100%'; pct.textContent='100%';
    setTimeout(function(){
      var ov=document.getElementById('bootOv');
      if(ov){ ov.classList.add('bye'); setTimeout(function(){ ov.remove(); },520); }
    }, 280);
  };
  // 안전장치 — 신호가 오지 않아도 25초 뒤엔 화면을 열어준다
  setTimeout(function(){ if(!done) window.__expBootDone(); }, 25000);
})();
</script>

<style>
  :root{
    --ink:#08191f; --parch:#f4e7c9; --accent:#ff8a3d; --accent-soft:#ffb679; --gold:#f6c945;
    --gram:#4f9dd6; --lit:#c77bb0; --xp:#7ad0a8; --stroke:rgba(244,231,201,.16); --tilt:24deg;
    --font:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* iframe 팝업에서 우측 스크롤바 숨김 — 스크롤 기능은 유지 */
  html{scrollbar-width:none}
  html::-webkit-scrollbar, body::-webkit-scrollbar, #worldMap::-webkit-scrollbar{display:none}
  #worldMap{scrollbar-width:none}
  .wrap{min-height:100%; font-family:var(--font); color:var(--parch);
    background:radial-gradient(120% 90% at 50% -10%, #123e52 0%, #08222c 55%, #05171e 100%);
    padding:clamp(12px,2.2vw,24px); display:flex; flex-direction:column; align-items:center; gap:11px}
  .shell{width:100%; max-width:960px; display:flex; flex-direction:column; gap:11px}

  .hud{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:12px}
  .seal{width:46px;height:46px;border-radius:50%; flex:none; display:grid;place-items:center;font-size:23px;
    background:radial-gradient(circle at 35% 30%, #ffb974, var(--accent) 60%, #c85e1c); box-shadow:0 6px 18px rgba(255,138,61,.35), inset 0 2px 4px rgba(255,255,255,.4)}
  .brand .eyebrow{font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--accent-soft); font-weight:700; margin-bottom:3px}
  .brand h1{font-size:clamp(16px,2.6vw,23px); letter-spacing:-.5px; line-height:1}
  .tabs{display:flex; gap:7px}
  .ptab{font-family:inherit; font-weight:800; font-size:13px; cursor:pointer; color:#a9bcc6; background:rgba(244,231,201,.06); border:1px solid var(--stroke); border-radius:11px; padding:8px 15px; transition:.2s; display:flex;align-items:center;gap:6px}
  .ptab .ic{width:19px;height:19px;border-radius:5px;display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.12)}
  .ptab.on{color:var(--ink); border-color:transparent}
  .ptab.on[data-p="gram"]{background:linear-gradient(135deg,#7ec0f0,var(--gram))}
  .ptab.on[data-p="lit"]{background:linear-gradient(135deg,#e3a5d0,var(--lit))}

  .party{display:flex; align-items:center; gap:13px; background:rgba(9,29,37,.72); border:1px solid var(--stroke); border-radius:16px; padding:10px 14px}
  .party.lvup{animation:lvglow 1s ease}
  @keyframes lvglow{0%,100%{box-shadow:none}40%{box-shadow:0 0 0 3px var(--gold),0 0 30px rgba(246,201,69,.5)}}
  .avatar{width:56px;height:56px;border-radius:14px; flex:none; display:grid;place-items:center; overflow:visible; background:radial-gradient(circle at 40% 30%, #29566a, #113542); border:2px solid #e8cf9c}
  .pinfo{flex:1; min-width:150px}
  .prow{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13.5px}
  .lv{background:var(--gold); color:#4a3400; font-weight:900; font-size:11px; border-radius:8px; padding:2px 8px; font-variant-numeric:tabular-nums}
  .title{font-size:11.5px; color:var(--accent-soft); font-weight:700}
  .xpbar{position:relative; height:12px; border-radius:8px; background:rgba(244,231,201,.1); margin-top:7px; overflow:hidden}
  .xpbar i{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:8px; background:linear-gradient(90deg,#57b98a,var(--xp)); transition:width .5s ease}
  .xptxt{position:absolute; inset:0; display:grid; place-items:center; font-size:9.5px; font-weight:800; color:#eaf5ef}
  .loot{display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:none}
  .loot-label{font-size:10px; color:#8ea1ab; font-weight:700}
  .loot-items{display:flex; gap:3px; font-size:17px; min-height:20px; max-width:150px; flex-wrap:wrap; justify-content:flex-end}
  .loot-empty{font-size:11px; color:#5f747f}
  .foxsvg{display:block; overflow:visible} .fx-aura{animation:apulse 2.4s ease-in-out infinite}
  @keyframes apulse{0%,100%{opacity:.5}50%{opacity:1}}

  /* ── 3D 다이오라마 씬 ── */
  .scene{position:relative; width:100%; aspect-ratio:3/2; min-height:360px; border-radius:22px; overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(244,231,201,.1)}
  .sky{position:absolute; inset:0; z-index:0; background:linear-gradient(180deg,#0f3b63 0%, #1f6b8e 42%, #3f97a6 66%, #e8b874 100%)}
  .sun{position:absolute; right:16%; top:15%; width:82px;height:82px;border-radius:50%; background:radial-gradient(circle, #fff3d0 0%, #ffd98a 40%, rgba(255,200,110,0) 72%); filter:blur(1px)}
  .far{position:absolute; bottom:24%; border-radius:50% 50% 45% 55%/70% 70% 40% 40%; background:#1c5566; opacity:.5; filter:blur(3px)}
  .far.f1{left:8%; width:150px; height:42px} .far.f2{right:12%; width:120px; height:34px; bottom:28%; opacity:.36}
  .cloud{position:absolute; height:32px; border-radius:40px; background:rgba(255,255,255,.85); filter:blur(6px); opacity:.72}
  .cloud::before,.cloud::after{content:''; position:absolute; background:inherit; border-radius:50%}
  .cloud::before{width:46%; height:150%; left:14%; top:-46%} .cloud::after{width:34%; height:130%; right:16%; top:-30%}
  .cloud.c1{width:150px; top:15%; animation:cd 48s linear infinite}
  .cloud.c2{width:110px; top:29%; opacity:.5; height:24px; animation:cd 70s linear infinite reverse}
  .cloud.c3{width:190px; top:7%; opacity:.38; animation:cd 94s linear infinite}
  @keyframes cd{from{left:-24%}to{left:118%}}
  .vignette{position:absolute; inset:0; z-index:8; pointer-events:none; border-radius:22px; box-shadow:inset 0 0 130px rgba(3,14,20,.5), inset 0 -30px 60px rgba(3,14,20,.4)}

  .scene-inner{position:absolute; inset:0; z-index:2; perspective:1050px; perspective-origin:50% 38%; transition:opacity .32s ease, transform .32s ease}
  .scene-inner.out-left{opacity:0; transform:translateX(-46px)} .scene-inner.out-right{opacity:0; transform:translateX(46px)}
  .isle-shadow{position:absolute; left:50%; top:74%; width:60%; height:13%; transform:translate(-50%,-50%); z-index:1; background:radial-gradient(ellipse, rgba(0,0,0,.4), transparent 70%); animation:float 6s ease-in-out infinite}
  .float{position:absolute; inset:0; z-index:2; animation:float 6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .ground{position:absolute; left:9%; right:9%; top:20%; bottom:14%; transform-style:preserve-3d; transform:rotateX(var(--tilt)); transform-origin:50% 92%}
  .terrain{position:absolute; inset:0; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 14px 12px rgba(0,0,0,.35))}

  .stop{position:absolute; z-index:4; transform-origin:50% 100%; transform:translate(-50%,-100%) rotateX(calc(-1*var(--tilt))) scale(var(--sc,1));
    display:flex; flex-direction:column; align-items:center; gap:3px; border:none; background:none; padding:0; color:inherit; font-family:inherit; cursor:default}
  .stop .bshadow{position:absolute; left:50%; bottom:-7px; transform:translateX(-50%); width:40px; height:11px; border-radius:50%; background:rgba(0,0,0,.32); filter:blur(2px); z-index:-1}
  .stop .banner{font-size:13px; font-weight:800; background:rgba(8,25,31,.74); padding:2px 8px; border-radius:20px; border:1px solid var(--stroke); white-space:nowrap; margin-bottom:1px}
  .stop .bldg{width:62px; height:62px; display:grid; place-items:end center; transition:transform .25s, filter .3s}
  .stop .badge{position:absolute; top:-4px; right:2px; width:20px;height:20px;border-radius:50%; display:grid;place-items:center; font-size:12px; font-weight:900;
    background:radial-gradient(circle at 35% 30%,#fff2c4,var(--gold) 70%,#c9971a); color:#5a3d05; box-shadow:0 2px 6px rgba(0,0,0,.4); opacity:0; transform:scale(.4); transition:.3s}
  .stop.done .badge{opacity:1; transform:scale(1)}
  .stop.locked{cursor:pointer} .stop.locked .bldg{filter:grayscale(.6) brightness(.66)} .stop.locked .banner{opacity:.7}
  .stop.done{cursor:pointer} .stop.done .banner{background:rgba(207,95,24,.85); border-color:transparent}
  .stop.current{cursor:pointer} .stop.current .bldg{filter:drop-shadow(0 0 10px rgba(246,201,69,.85)); animation:pop2 1.5s ease-in-out infinite}
  .stop.current .banner{background:var(--accent); color:#3a1c04; border-color:transparent}
  .stop.current:hover .bldg,.stop.done:hover .bldg{transform:translateY(-4px)}
  .stop:focus-visible{outline:none} .stop:focus-visible .bldg{filter:drop-shadow(0 0 0 3px var(--gold))}
  @keyframes pop2{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  .hero{position:absolute; z-index:6; transform-origin:50% 100%; transform:translate(-50%,-100%) rotateX(calc(-1*var(--tilt)));
    transition:left .7s ease-in-out, top .7s ease-in-out; pointer-events:none}
  .hero .fig{filter:drop-shadow(0 4px 4px rgba(0,0,0,.45)); animation:hop 2s ease-in-out infinite}
  .hero.walking .fig{animation:walk .26s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes walk{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}
  .hero .shadow{position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); width:32px; height:9px; border-radius:50%; background:rgba(0,0,0,.34); filter:blur(2px)}
  .member{position:absolute; left:0; top:0; transform:translate(calc(-50% + var(--ox,0px)), calc(-100% + var(--oy,0px)))}
  .member.leader{z-index:2}
  .member .mfig{display:block; animation:hop 2s ease-in-out infinite; animation-delay:var(--d,0s); filter:drop-shadow(0 4px 4px rgba(0,0,0,.42))}
  .member .mshadow{position:absolute; left:50%; bottom:-4px; transform:translateX(-50%); width:37px;height:9px;border-radius:50%; background:rgba(0,0,0,.3); filter:blur(2px)}
  .member .mshadow.s{width:25px;height:7px}
  .hero.walking .member .mfig{animation:walk .28s ease-in-out infinite; animation-delay:var(--d,0s)}
  .pfriends{display:flex; align-items:center; gap:0; margin-top:6px; min-height:18px}
  .pfriends .pf-lb{font-size:10px; color:#8ea1ab; font-weight:700; margin-right:5px}
  .pfriends .pf{margin-left:-4px}
  .pfriends .pf svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
  .dust{position:absolute; z-index:6; font-size:15px; pointer-events:none; will-change:transform,opacity}
  @keyframes puff{to{transform:translate(var(--dx),-14px) scale(.4); opacity:0}}

  /* 이미지 모드 (문법: 주신 일러스트를 섬/배경으로) */
  .land-photo{position:absolute; inset:0; z-index:0; background-size:cover; background-position:center}
  .land-photo video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none}
  .hero.flat{transform:translate(-50%,-100%)}
  .pin{position:absolute; z-index:4; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; gap:3px; border:none;background:none;padding:0;color:inherit;font-family:inherit;cursor:default}
  .pin .pshadow{position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); width:28px;height:8px;border-radius:50%; background:rgba(0,0,0,.4); filter:blur(2px); z-index:-1}
  .pin .pflag{position:relative; width:36px;height:36px;border-radius:50%; display:grid;place-items:center; font-size:16px; font-weight:900;
    background:radial-gradient(circle at 36% 28%, #2f5a6b,#123641); color:#fff; border:2.5px solid rgba(255,255,255,.75); box-shadow:0 5px 12px rgba(0,0,0,.55)}
  .pin .pcap{font-size:14px; font-weight:800; background:rgba(8,25,31,.85); padding:4px 12px; border-radius:20px; white-space:nowrap}
  .pin.locked{opacity:.6;cursor:pointer} .pin.locked .pflag{filter:grayscale(.4) brightness(.85)}
  .pin.done{cursor:pointer} .pin.done .pflag{background:radial-gradient(circle at 36% 28%, var(--accent-soft),var(--accent) 62%,#cf5f18); border-color:#ffe0c0} .pin.done .pcap{background:rgba(207,95,24,.85)}
  .pin.current{cursor:pointer} .pin.current .pflag{background:#fff; color:var(--ink); border-color:#fff; animation:beat2 1.5s ease-in-out infinite} .pin.current .pcap{background:var(--accent); color:#3a1c04}
  .pin.current:hover .pflag,.pin.done:hover .pflag{transform:translateY(-3px)}
  .pin:focus-visible .pflag{box-shadow:0 0 0 4px var(--gold)}
  @keyframes beat2{0%,100%{box-shadow:0 5px 12px rgba(0,0,0,.55),0 0 0 0 rgba(255,255,255,.6)}50%{box-shadow:0 5px 12px rgba(0,0,0,.55),0 0 0 10px rgba(255,255,255,0)}}
  .btn.ghost{background:rgba(244,231,201,.08); color:var(--parch); border:1px solid var(--stroke)}
  .btn.ghost:hover{background:rgba(244,231,201,.15)}
  .btn.ghost.on{background:linear-gradient(135deg,#7ec0f0,var(--gram)); color:#08191f; border-color:transparent}
  .pin.editing{opacity:1!important; cursor:grab; z-index:20; touch-action:none}
  .pin.editing .pflag{filter:none!important; border-style:dashed; box-shadow:0 0 0 3px rgba(246,201,69,.45),0 5px 12px rgba(0,0,0,.5)}
  .editbar{display:flex; flex-direction:column; gap:8px; background:rgba(9,29,37,.85); border:1px solid var(--stroke); border-radius:14px; padding:12px 15px; font-size:12.5px}
  .editbar .eb-title b{color:var(--gold)}
  .editbar code{font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--xp); word-break:break-all; background:rgba(0,0,0,.25); padding:6px 8px; border-radius:8px}
  .editbar .eb-btns{display:flex; gap:8px; flex-wrap:wrap}
  .editbar .btn{padding:8px 14px; font-size:12.5px}
  .editbar textarea{width:100%; height:76px; font-size:10px; background:#0a2530; color:#cfe; border:1px solid var(--stroke); border-radius:8px; padding:8px}

  .nameplate{position:absolute; top:14px; left:14px; z-index:7; background:rgba(8,25,31,.6); backdrop-filter:blur(4px); border:1px solid var(--stroke); border-radius:14px; padding:8px 14px}
  .nameplate .u{font-size:10px; letter-spacing:.2em; color:var(--accent-soft); font-weight:800; text-transform:uppercase} .nameplate .n{font-size:16px; font-weight:800; margin-top:2px}
  .quest{position:absolute; top:14px; right:14px; z-index:7; background:rgba(8,25,31,.6); backdrop-filter:blur(4px); border:1px solid var(--stroke); border-radius:12px; padding:7px 12px; font-size:11.5px; max-width:44%} .quest b{color:var(--gold)}

  .win{position:absolute; inset:0; z-index:9; display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:rgba(6,20,27,.72); backdrop-filter:blur(3px); text-align:center; padding:20px}

        const stat=done?'<span class="wm-st done">✓ 정복 완료</span>':(cur?'<span class="wm-st cur">▶ 원정 중</span>':'<span class="wm-st">미탐험</span>');
        return `<button class="wm-card ${cur?'cur':''}" data-k="${k}">
          <span class="wm-img" style="background-image:url('${T[k]||''}')"></span>
          <span class="wm-num">${k+1}</span>
          <span class="wm-name">${nm}</span>${active==='gram'?('<span class="gs-row" style="justify-content:center">'+starHTML(k)+(k<8?('<span class="gs-mag wm-mag" data-land="'+k+'" data-lname="'+nm+'" title="종합 리포트">\uD83D\uDD0D</span>'):'')+'</span>'):''}${stat}<span class="wm-crew" data-crew="${k}"></span></button>`; }).join('')}
      </div></div>`;
    worldOv.classList.add('show');
    worldOv.querySelectorAll('.wm-mag').forEach(m=>m.addEventListener('click',e=>{ e.stopPropagation(); window.__landReport(+m.dataset.land, m.dataset.lname); }));
    worldOv.querySelectorAll('.wm-card').forEach(c=>c.addEventListener('click',()=>{
      worldOv.classList.remove('show');
      const k=+c.dataset.k;
      if(k===view){ render(); dialogueForLand(); } else go(k);
    }));
    loadPresence();
  }

  // ── 원정대 동행 현황 — 카드 "탐험 중" 배지 + 발자국 대열 (완성 구조 · 순위 없음) ──
  var __presCache=null, __presAt=0;
  const __presEsc=s=>String(s||'').replace(/[<>&"]/g,'');
  function fillPresence(){
    if(!__presCache) return;
    const d=__presCache, me=__GK_STU;
    const meFirst=arr=>me?[...arr.filter(s=>s.grade===me.grade&&s.name===me.name),...arr.filter(s=>!(s.grade===me.grade&&s.name===me.name))]:arr;
    worldOv.querySelectorAll('.wm-crew').forEach(el=>{
      const k=+el.dataset.crew, list=meFirst((d.lands&&d.lands[k])||[]);
      if(!list.length){ el.innerHTML='<span class="wm-crew-empty">🌱 미개척지 — 첫 발자국을 남겨보자!</span>'; return; }
      const names=list.map(s=>__presEsc(s.name));
      const isMe0=me&&list[0]&&list[0].grade===me.grade&&list[0].name===me.name;
      const head=names.slice(0,2).map((n,i)=>(i===0&&isMe0)?('<span style="color:#f6c945">'+n+'</span>'):n).join('·');
      el.innerHTML='🏕️ <b>'+head+'</b>'+(names.length>2?' 외 '+(names.length-2)+'명':'')+' 탐험 중';
    });
    const tr=document.getElementById('wmTrail');
    if(tr && d.trail && d.trail.length){
      const byLand={}; d.trail.forEach(s=>{ (byLand[s.land]=byLand[s.land]||[]).push(s); });
      tr.innerHTML='<div class="wm-trail-title">🐾 함께 걷는 원정길 — 지금 우리 원정대는 여기까지 왔어요</div><div class="wm-path">'+
        UNITS[active].map((nm,k)=>{
          const ss=meFirst(byLand[k]||[]);
          const chips=ss.slice(0,3).map(s=>'<span class="wm-chip'+(me&&s.grade===me.grade&&s.name===me.name?' me':'')+'">'+__presEsc(s.name)+'</span>').join('')+(ss.length>3?'<span class="wm-chip more">+'+(ss.length-3)+'</span>':'');
          return '<div class="wm-station'+(ss.length?' has':'')+(k%2?' alt':'')+'" title="'+__presEsc(nm)+'">'+
            '<span class="wm-flag">'+(ss.length?'🚩':'🏳️')+'</span>'+
            '<span class="wm-station-num">'+(k+1)+'</span>'+
            '<div class="wm-station-crew">'+chips+'</div>'+
          '</div>';
        }).join('')+'</div>';
      tr.style.display='';
    }
  }
  function loadPresence(){
    if(__presCache && Date.now()-__presAt<60000){ fillPresence(); return; }
    fetch('/api/gukeo-expedition/presence').then(r=>r.json()).then(d=>{
      if(d && d.ok){ __presCache=d; __presAt=Date.now(); fillPresence(); }
    }).catch(function(){});
  }
  document.getElementById('worldBtn').addEventListener('click',showWorldMap);

  view=state[active].cur; render(); dialogueForLand();
  showWorldMap();
  if(window.__expBootDone) window.__expBootDone();
})();
</script>

  // ── 웹툰 ──
  
  // 웹툰 컷 확인 OX — 정답이어야 다음 컷/본문으로. 결과는 별점 통계(wtox)에 기록
  window.umunWtAsk=function(ci,wq,thenText){

    ov.innerHTML='<div style="width:min(540px,92%);text-align:center;padding:24px 20px;background:#0f2a35;border:1.5px solid rgba(246,201,69,.55);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.55)">'
      +'<div style="font-size:12px;font-weight:900;letter-spacing:.22em;color:#f6c945;margin-bottom:12px">🎞️ 웹툰 확인 퀴즈</div>'
      +'<div style="font-size:18px;font-weight:800;color:#fff;line-height:1.65;margin-bottom:18px;word-break:keep-all">'+wq.q+'</div>'
      +'<div style="display:flex;gap:14px;justify-content:center">'
      +'<button id="wtOxO" style="flex:0 0 130px;padding:14px 0;border:none;border-radius:14px;cursor:pointer;font-family:inherit;font-weight:900;font-size:20px;background:linear-gradient(135deg,#8fe3b8,#3f9e79);color:#06281b">O</button>'
      +'<button id="wtOxX" style="flex:0 0 130px;padding:14px 0;border:none;border-radius:14px;cursor:pointer;font-family:inherit;font-weight:900;font-size:20px;background:linear-gradient(135deg,#ffb3c8,#d16a86);color:#3a0f1d">X</button></div>'
      +'<div id="wtOxMsg" style="min-height:22px;margin-top:12px;font-weight:800;font-size:14.5px"></div></div>';
    wrap.appendChild(ov);
    var lock=false;
    function bigMark(sym,color){
      var b=document.createElement('div'); b.textContent=sym;
      b.style.cssText='position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.25);font-size:120px;z-index:7;pointer-events:none;color:'+color+';text-shadow:0 8px 28px rgba(0,0,0,.55);transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s ease .55s;opacity:1';
      wrap.appendChild(b);
      requestAnimationFrame(function(){ b.style.transform='translate(-50%,-50%) scale(1)'; b.style.opacity='0'; });
      setTimeout(function(){ b.remove(); },1000);
    }
    function fireworks(){
      var EMO=['🎆','✨','⭐','🎉','💥','🌟'];
      for(var k=0;k<26;k++){
        (function(){
          var s=document.createElement('span');
          s.textContent=EMO[Math.floor(Math.random()*EMO.length)];
          var ang=Math.random()*6.283, dist=70+Math.random()*150;
          s.style.cssText='position:absolute;left:50%;top:48%;font-size:'+(16+Math.random()*16)+'px;z-index:6;pointer-events:none;opacity:1;transform:translate(-50%,-50%);transition:transform .95s cubic-bezier(.15,.65,.35,1),opacity .95s';
          wrap.appendChild(s);
          requestAnimationFrame(function(){
            s.style.transform='translate(calc(-50% + '+Math.cos(ang)*dist+'px), calc(-50% + '+Math.sin(ang)*dist+'px)) rotate('+(Math.random()*280-140)+'deg)';
            s.style.opacity='0';
          });
          setTimeout(function(){ s.remove(); },1100);
        })();
      }
    }
    function pick(v){
      if(lock) return; lock=true;
      var ok=(v===wq.a);
      try{ window.__statRec(GP.key, GP.srcLand, ok, 'wtox', wq.q, ok?'정답':'오답'); }catch(e){}
      var msg=document.getElementById('wtOxMsg');
      if(ok){ GP.wtPass[ci]=1;
        if(!GP.ro) __gkProgSave(GP.key,{wt:Object.keys(GP.wtPass).map(Number),step:0});
        bigMark('⭕','#7ad0a8'); fireworks();
        if(msg){ msg.style.color='#7ad0a8'; msg.textContent=thenText?'정답! 본문 학습으로 출발 🎉':'정답! 다음 컷으로 출발 🎉'; }
        setTimeout(function(){ ov.remove(); if(thenText) window.umunShowText(); else window.umunGo(1); },1050);
      } else {
        bigMark('❌','#ff5577');
        if(msg){ msg.style.color='#ff9db4'; msg.textContent='앗! 컷을 다시 한 번 읽고 도전해 보자'; }
        setTimeout(function(){ ov.remove(); lock=false; },1100);
      }
    }
    document.getElementById('wtOxO').onclick=function(){pick(true)};
    document.getElementById('wtOxX').onclick=function(){pick(false)};
  };
  window.umunGo=function(d){
    var img=document.getElementById('umunImg'); if(!img||!GP) return;
    var max=GP.pack.imgs.length-1;
    var cur=parseInt(img.getAttribute('data-i')||'0',10);
    // 컷 확인 OX — 맞혀야 다음 컷으로 (뒤로 가기는 자유)
    if(d>0){
      if(GP.ro){ if(cur===max) return; }
      else {
        var wq=(GP.pack.wtOx||[])[cur]; GP.wtPass=GP.wtPass||{};
        if(wq && !GP.wtPass[cur]){ window.umunWtAsk(cur, wq, cur===max); return; }
        if(cur===max){ window.umunShowText(); return; }
      }
    }
    var i=cur+d;
    if(i<0) i=0; if(i>max) i=max;
    img.setAttribute('data-i',i); img.src=gkImg(GP.pack.imgs[i]);
    var pg=document.getElementById('umunPg'); if(pg) pg.textContent=(i+1)+' / '+(max+1);
  };
  window.umunShowText=function(){
    if(GP && GP.pack.imgs && GP.pack.imgs.length){
      var last=GP.pack.imgs.length-1, lq=(GP.pack.wtOx||[])[last]; GP.wtPass=GP.wtPass||{};
      if(lq && !GP.wtPass[last]){ window.umunWtAsk(last, lq, true); return; }
    }
    if(GP && !GP.ro) __gkProgSave(GP.key,{wtDone:1,step:1});
    var v=document.getElementById('umunView'), t=document.getElementById('umunText');
    if(v) v.style.display='none'; if(t) t.style.display='block';
    var mb=document.getElementById('mBody'); if(mb) mb.scrollTop=0;
    window.umunStep(0,'ok'); window.umunStep(1,'cur');
  };

  // ── 본문 순서 읽기 + 구간 OX ──
  window.umunRead=function(el){
    if(GP&&GP.ro) return;
    if(el.classList.contains('rd')) return;
    if(document.getElementById('umunQz')) return;
    if(!GP) return;
    var items=Array.prototype.slice.call(document.querySelectorAll('#umunText .umun-it'));
    var next=document.querySelectorAll('#umunText .umun-it.rd').length;
    if(items.indexOf(el)!==next){ window.umunToast('\uD83D\uDC46 순서대로 읽어요!'); return; }
    el.classList.add('rd');
    var rd=next+1;
    if(!GP.ro) __gkProgSave(GP.key,{rd:rd});
    var c=document.getElementById('umunRdCnt'); if(c) c.textContent=rd;
    var sec=GP.bounds.indexOf(rd);
    if(sec>=0){ setTimeout(function(){ window.umunQuiz(sec); },350); }
  };
  window.umunQuiz=function(sec){
    var qz=GP.pack.sections[sec].ox;
    var ov=document.createElement('div'); ov.id='umunQz';
    ov.style.cssText='position:fixed;inset:0;z-index:98;display:flex;align-items:center;justify-content:center;background:rgba(4,14,20,.72);backdrop-filter:blur(3px)';
    ov.innerHTML='<div style="width:min(420px,88vw);background:linear-gradient(165deg,#14384a,#0d2836);border:1.5px solid rgba(246,201,69,.45);border-radius:20px;padding:26px 22px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)">'
      +'<div style="font-size:11px;font-weight:900;letter-spacing:.25em;color:#f6c945;margin-bottom:10px">\u2B55\u274C 확인 퀴즈</div>'
      +'<div style="font-size:16px;font-weight:800;color:#fff;line-height:1.6;margin-bottom:20px">'+qz.q+'</div>'
      +'<div style="display:flex;gap:12px;justify-content:center">'
      +'<button onclick="umunAns('+sec+',true)" style="width:92px;height:72px;border-radius:16px;cursor:pointer;font-size:34px;background:rgba(79,157,214,.25);border:2px solid #4f9dd6">\u2B55</button>'
      +'<button onclick="umunAns('+sec+',false)" style="width:92px;height:72px;border-radius:16px;cursor:pointer;font-size:34px;background:rgba(209,106,134,.22);border:2px solid #d16a86">\u274C</button>'
      +'</div></div>';
    document.body.appendChild(ov);
  };
  window.umunAns=function(sec,ans){
    var ov=document.getElementById('umunQz'); if(ov) ov.remove();
    var items=Array.prototype.slice.call(document.querySelectorAll('#umunText .umun-it'));
    if(ans===GP.pack.sections[sec].ox.a){
      if(window.__statRec) window.__statRec(GP.key,GP.srcLand,true,'ox');
      if(!GP.ro) __gkProgSave(GP.key,{sec:sec+1,step:2+sec});
      window.umunBoom();

        window.umunStep(GP.fillStep,'cur');

          var t=document.getElementById('umunText'), f=document.getElementById('umunFill');
          if(t) t.style.display='none'; if(f) f.style.display='block';
          var mb=document.getElementById('mBody'); if(mb) mb.scrollTop=0;

      if(window.__statRec) window.__statRec(GP.key,GP.srcLand,false,'ox',GP.pack.sections[sec].ox.q,(GP.pack.sections[sec].ox.a?'\u2B55':'\u274C'));

    }

  // ── 빈칸 (드래그+탭) ──
  window.umunBkCur=function(){
    var bks=document.querySelectorAll('#umunFill .umun-bk');
    bks.forEach(function(b){ b.classList.remove('cur'); });
    for(var i=0;i<bks.length;i++){ if(!bks[i].classList.contains('ok')){ bks[i].classList.add('cur'); break; } }
  };
  function fillOk(target,ch){
    if(window.__statRec) window.__statRec(GP.key,GP.srcLand,true,'fill');
    window.umunBoom();
    target.textContent=ch.getAttribute('data-w');
    target.classList.add('ok'); target.classList.remove('cur');
    ch.classList.add('used');
    if(!GP.ro) __gkProgSave(GP.key,{fillN:document.querySelectorAll('#umunFill .umun-bk.ok').length});
    window.umunBkCur();
    if(document.querySelectorAll('#umunFill .umun-bk:not(.ok)').length===0) window.umunFillComplete();
  }
  function fillNo(target){
    if(window.__statRec) window.__statRec(GP.key,GP.srcLand,false,'fill','빈칸 넣기 문제',target.getAttribute('data-a'));
    target.classList.add('no');
    setTimeout(function(){ target.classList.remove('no'); },420);
    window.umunToast('\uD83E\uDD14 다른 빈칸의 낱말이에요!');
  }
  window.umunChip=function(ch){
    if(GP&&GP.ro) return;
    var bks=document.querySelectorAll('#umunFill .umun-bk'); var cur=null;
    for(var i=0;i<bks.length;i++){ if(!bks[i].classList.contains('ok')){ cur=bks[i]; break; } }
    if(!cur) return;
    if(ch.getAttribute('data-w')===cur.getAttribute('data-a')) fillOk(cur,ch); else fillNo(cur);
  };
  window.umunDrop=function(ch,bk){
    if(ch.getAttribute('data-w')===bk.getAttribute('data-a')) fillOk(bk,ch); else fillNo(bk);
  };
  window.umunDragStart=function(e,ch){
    if(GP&&GP.ro) return;
    if(ch.classList.contains('used')) return;
    e.preventDefault();
    var sx=e.clientX, sy=e.clientY, moved=false;
    var ghost=null, gx=sx, gy=sy, raf=0, lastOver=null;
    var paint=function(){
      raf=0;
      if(ghost) ghost.style.transform='translate3d('+gx+'px,'+gy+'px,0) translate(-50%,-50%) scale(1.06)';
      var el=document.elementFromPoint(gx,gy);
      var bk=el&&el.closest?el.closest('.umun-bk'):null;
      if(bk&&bk.classList.contains('ok')) bk=null;
      if(lastOver!==bk){ if(lastOver) lastOver.classList.remove('over'); if(bk) bk.classList.add('over'); lastOver=bk; }
    };
    var mv=function(ev){
      if(!moved && Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return;
      if(!ghost){
        moved=true; ch.classList.add('dragging');
        ghost=ch.cloneNode(true);
        ghost.style.cssText='position:fixed;left:0;top:0;z-index:120;pointer-events:none;margin:0;opacity:.95;transition:none;will-change:transform;box-shadow:0 10px 26px rgba(0,0,0,.5);font-weight:800;font-size:15px;padding:11px 20px;border-radius:12px;border:1.5px solid #7ec0f0;background:#1d4a63;color:#fff';
        document.body.appendChild(ghost);
      }
      gx=ev.clientX; gy=ev.clientY;
      if(!raf) raf=requestAnimationFrame(paint);
    };
    var up=function(ev){
      document.removeEventListener('pointermove',mv);
      document.removeEventListener('pointerup',up);
      document.removeEventListener('pointercancel',up);
      ch.classList.remove('dragging');
      if(raf) cancelAnimationFrame(raf);
      if(lastOver) lastOver.classList.remove('over');
      if(ghost){ ghost.remove(); }
      if(!moved){ window.umunChip(ch); return; }
      var el=document.elementFromPoint(ev.clientX,ev.clientY);
      var bk=el&&el.closest?el.closest('.umun-bk'):null;
      if(!bk||bk.classList.contains('ok')) return;
      window.umunDrop(ch,bk);
    };
    document.addEventListener('pointermove',mv);
    document.addEventListener('pointerup',up);
    document.addEventListener('pointercancel',up);
  };
  window.umunFillComplete=function(){
    if(!GP.ro) __gkProgSave(GP.key,{fillDone:1,step:2+GP.nSec});
    window.umunStep(GP.fillStep,'ok'); window.umunStep(GP.mcqStep,'cur');

      window.umunMcqShow(0);
    },900);
  };

  }
  window.umunMcqShow=function(i){ mcqRender(GP.pack.mcq,i,'\u270F\uFE0F 문제 풀이','#d16a86','umunMcqPick'); };
  window.umunExamShow=function(i){ mcqRender(GP.pack.exam,i,'\uD83D\uDCDD 형성평가','#f6c945','umunExamPick'); };
  window.umunExamPick=function(btn,i,c){
    if(window.__statRec) window.__statRec(GP.key,GP.srcLand, c===GP.pack.exam[i].a,'exam',GP.pack.exam[i].q,GP.pack.exam[i].c[GP.pack.exam[i].a]);
    if(c===GP.pack.exam[i].a){
      window.umunBoom(); btn.classList.add('good');
      if(i+1<GP.pack.exam.length){ window.umunToast('\uD83C\uDF89 정답!'); setTimeout(function(){ window.umunExamShow(i+1); },700); }
      else{
        if(!GP.ro) __gkProgSave(GP.key,{done:1,exam:1});
        setTimeout(function(){
          var qv=document.getElementById('umunMcq');
          if(qv) qv.innerHTML='<div style="text-align:center;padding:26px 0"><div style="font-size:46px;margin-bottom:10px">\uD83C\uDFC6</div><div style="font-weight:900;font-size:18px;color:#f6c945;margin-bottom:6px">형성평가 20문항 완주!</div><div style="color:#9fb6c0;font-size:13px">아래 버튼으로 관문을 통과하세요</div></div>';
          var d=document.getElementById('mDo'); if(d) d.style.display='';
        },800);
        window.umunToast('\uD83C\uDF89 형성평가 완료!');
      }
    } else {
      btn.classList.add('bad');
      GP.wrong=(GP.wrong||0)+1;
      if(GP.wrong>=3){
        window.umunToast('\uD83D\uDCDA 오답 3회! 해당 땅에서 다시 학습해요');
        setTimeout(function(){
          var m=document.getElementById('modal'); if(m) m.classList.remove('show');
          if(window.__expGo) window.__expGo(GP.srcLand);
        },1200);
      } else {
        window.umunToast('\uD83D\uDE05 틀렸어요! 1번 문제부터 다시! ('+GP.wrong+'/3)');
        setTimeout(function(){ window.umunExamShow(0); },1000);
      }
    }
  };
  window.umunAdvShow=function(i){ mcqRender(GP.pack.adv,i,'\uD83D\uDE80 심화 확장','#f6c945','umunAdvPick'); };
  window.umunMcqPick=function(btn,i,c){
    if(window.__statRec) window.__statRec(GP.key,GP.srcLand, c===GP.pack.mcq[i].a,'mcq',GP.pack.mcq[i].q,GP.pack.mcq[i].c[GP.pack.mcq[i].a]);
    if(c===GP.pack.mcq[i].a){
      window.umunBoom(); btn.classList.add('good');
      if(!GP.ro) __gkProgSave(GP.key,{mcqI:i+1});
      if(i+1<GP.pack.mcq.length){ window.umunToast('\uD83C\uDF89 정답!'); setTimeout(function(){ window.umunMcqShow(i+1); },800); }
      else{
        if(!GP.ro) __gkProgSave(GP.key,{mcqDone:1,step:3+GP.nSec});
        window.umunStep(GP.mcqStep,'ok'); window.umunStep(GP.advStep,'cur');
        window.umunToast('\uD83C\uDF89 정답! 이제 심화 문제에 도전!');
        setTimeout(function(){ window.umunAdvShow(0); },900);
      }
    } else { btn.classList.add('bad'); window.umunToast('\uD83D\uDE05 다시 생각해보세요!'); }
  };
  window.umunAdvPick=function(btn,i,c){
    if(window.__statRec) window.__statRec(GP.key,GP.srcLand, c===GP.pack.adv[i].a,'adv',GP.pack.adv[i].q,GP.pack.adv[i].c[GP.pack.adv[i].a]);
    if(c===GP.pack.adv[i].a){
      window.umunBoom(); btn.classList.add('good');
      if(!GP.ro) __gkProgSave(GP.key,{advI:i+1});
      if(i+1<GP.pack.adv.length){ window.umunToast('\uD83C\uDF89 정답!'); setTimeout(function(){ window.umunAdvShow(i+1); },800); }
      else{
        if(!GP.ro) __gkProgSave(GP.key,{done:1,step:4+GP.nSec});
        window.umunStep(GP.advStep,'ok');
        setTimeout(function(){
          var qv=document.getElementById('umunMcq');
          if(qv) qv.innerHTML='<div style="text-align:center;padding:26px 0"><div style="font-size:46px;margin-bottom:10px">\uD83C\uDFC6</div><div style="font-weight:900;font-size:18px;color:#f6c945;margin-bottom:6px">심화까지 모두 통과!</div><div style="color:#9fb6c0;font-size:13px">아래 버튼으로 관문을 통과하세요</div></div>';
          var d=document.getElementById('mDo'); if(d) d.style.display='';
        },800);
        window.umunToast('\uD83C\uDF89 전 단계 완료!');
      }
    } else { btn.classList.add('bad'); window.umunToast('\uD83D\uDE05 다시 생각해보세요!'); }
  };

  // ── 모달 열림 감지 → 관문 엔진 렌더 ──
  var mb=document.getElementById('mBody');
  if(mb){
    new MutationObserver(function(){
      var root=mb.querySelector('.gate-root');
      var d=document.getElementById('mDo');
      if(root){ window.renderGate(root); }
      else if(d){ d.style.display=''; }
    }).observe(mb,{childList:true});
  }

  // ── 전장의 안개 (좌표 재설정 동안 임시 비활성화 — FOG_ON을 true로 바꾸면 재가동) ──
  (function(){
    var FOG_ON=false;
    function init(){
      if(!FOG_ON) return;
      var scene=document.getElementById('scene'); if(!scene){ setTimeout(init,600); return; }
      var cv=document.createElement('canvas'); cv.id='fogCv';
      cv.style.cssText='position:absolute;inset:0;z-index:5;pointer-events:none;transition:opacity 1.1s ease;opacity:1';
      scene.appendChild(cv);
      var radii={}, running=false, lastKick=0;
      function targets(){
        var els=Array.prototype.slice.call(scene.querySelectorAll('.stop,.pin'));
        var r=scene.getBoundingClientRect();
        var list=[], doneCnt=0, total=els.length;
        els.forEach(function(el,i){
          var done=el.classList.contains('done'), curr=el.classList.contains('current');
          if(done) doneCnt++;
          if(done||curr){
            var b=el.getBoundingClientRect();
            list.push({k:i, x:b.left+b.width/2-r.left, y:b.top+b.height*0.72-r.top,
              rad:Math.max(r.width,r.height)*((curr?0.24:0.19)+0.025*doneCnt)});
          }
        });
        return {list:list, w:r.width, h:r.height, allDone:(total>0&&doneCnt>=total), none:(total===0)};
      }
      function frame(){
        var t=targets();
        if(t.none||t.allDone){ cv.style.opacity='0'; running=false; return; }
        cv.style.opacity='1';
        if(cv.width!==Math.round(t.w)||cv.height!==Math.round(t.h)){ cv.width=Math.round(t.w); cv.height=Math.round(t.h); }
        var ctx=cv.getContext('2d');
        ctx.clearRect(0,0,cv.width,cv.height);
        ctx.fillStyle='rgba(2,7,11,0.94)'; ctx.fillRect(0,0,cv.width,cv.height);
        ctx.globalCompositeOperation='destination-out';
        var moving=false;
        t.list.forEach(function(h){
          var r0=radii[h.k]||0;
          var nr=r0+(h.rad-r0)*0.09;
          if(Math.abs(h.rad-nr)>0.6) moving=true;
          radii[h.k]=nr;
          var g=ctx.createRadialGradient(h.x,h.y,nr*0.32,h.x,h.y,nr);
          g.addColorStop(0,'rgba(0,0,0,1)'); g.addColorStop(1,'rgba(0,0,0,0)');
          ctx.fillStyle=g; ctx.beginPath(); ctx.arc(h.x,h.y,nr,0,7); ctx.fill();
        });
        ctx.globalCompositeOperation='source-over';
        if(moving||Date.now()-lastKick<1200){ requestAnimationFrame(frame); }
        else { running=false; }
      }
      function kick(){ lastKick=Date.now(); if(!running){ running=true; requestAnimationFrame(frame); } }
      new MutationObserver(kick).observe(scene,{subtree:true,attributes:true,attributeFilter:['class'],childList:true});
      addEventListener('resize',kick);
      setTimeout(kick,800); setTimeout(kick,2500);
      var winState='idle';
      new MutationObserver(function(){
        var w=scene.querySelector('.win'); if(!w) return;
        if(w.classList.contains('show')){
          if(winState==='idle'){
            winState='delaying';
            w.classList.remove('show');
            kick();
            if(window.umunToast) window.umunToast('\uD83D\uDDFA\uFE0F 섬이 모두 밝혀졌어요!');
            setTimeout(function(){ winState='shown'; w.classList.add('show'); },3400);
          }
        } else { if(winState==='shown'){ winState='idle'; } }
      }).observe(scene,{subtree:true,attributes:true,attributeFilter:['class']});
    }
    init();
  })();
})();
</script>
