<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧠 LTI 문해성향검사 — 정보 입력</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"Gmarket Sans","Noto Sans KR",sans-serif;color:#33240f;
    background:#dcecff; min-height:100vh; position:relative;
    display:flex; justify-content:center; padding:18px; overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:url("images/LTI%EB%B0%B0%EA%B2%BD.jpg") center center / cover no-repeat;
  }
  .bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;}
  .stage{position:relative;z-index:2;width:100%;max-width:440px;margin:auto;}
  .card{
    background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    border:1.5px solid rgba(255,255,255,.7);border-radius:26px;padding:26px 24px 30px;
    box-shadow:0 22px 55px rgba(60,90,150,.28);
  }
  /* 센터명 상단 고정 배지 */
  .center-pill{
    display:block;text-align:center;font-size:15px;font-weight:800;color:#2b6ca3;
    background:#eaf5ff;border:1.5px solid #cfe6fb;border-radius:16px;padding:11px 14px;margin-bottom:18px;
  }
  .center-pill small{display:block;font-size:11px;color:#7fa6c4;font-weight:700;margin-bottom:2px;}
  .hero{text-align:center;margin-bottom:6px;}
  .hero .em{font-size:46px;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12));}
  .title{font-size:23px;font-weight:800;text-align:center;line-height:1.3;margin:4px 0 2px;}
  .title .hl{background:linear-gradient(120deg,#ff7a3d,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .subtitle{text-align:center;font-size:13px;color:#8a7255;font-weight:600;margin-bottom:20px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:800;color:#5a4a2e;margin-bottom:6px;}
  .field label .req{color:#ff5d8f;margin-left:2px;}
  .field input,.field select{
    width:100%;font-family:inherit;font-size:16px;font-weight:600;color:#33240f;
    border:2px solid #ffe0c2;border-radius:14px;padding:13px 14px;background:#fff;outline:none;
    transition:border-color .15s;
  }
  .field input:focus,.field select:focus{border-color:#ff7a3d;}
  .field select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23b58a5a' stroke-width='2'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}

  .start-btn{
    display:block;width:100%;border:none;cursor:pointer;margin-top:22px;
    font-family:inherit;font-weight:800;font-size:18px;color:#fff;
    background:linear-gradient(120deg,#ff7a3d,#ffb03d);
    padding:16px;border-radius:16px;box-shadow:0 8px 0 #e0672c,0 12px 24px rgba(255,120,60,.35);
    transition:transform .12s,box-shadow .12s;
  }
  .start-btn:active{transform:translateY(5px);box-shadow:0 3px 0 #e0672c,0 6px 14px rgba(255,120,60,.3);}
  .err{color:#e03b5f;font-size:12.5px;font-weight:700;text-align:center;margin-top:12px;min-height:16px;}
  .foot{text-align:center;font-size:11px;color:#8a99b8;margin-top:16px;font-weight:600;}
</style>
</head>
<body>
  <!-- LTI 동화 배경 영상 -->
  <video class="bg-video" autoplay loop muted playsinline preload="auto"
    poster="images/LTI%EB%B0%B0%EA%B2%BD.jpg">
    <source src="images/LTI%EB%AC%B8%ED%95%B4%EC%84%B1%ED%96%A5%EA%B2%80%EC%82%AC%EB%B0%B0%EA%B2%BD.mp4" type="video/mp4">
  </video>
  <div class="stage">
    <div class="card">
      <div class="center-pill" id="centerPill"><small>검사 센터</small><span id="centerName">불러오는 중…</span></div>

      <div class="hero"><span class="em">🧠</span></div>
      <div class="title">나의 <span class="hl">문해력 성향</span> 검사</div>
      <div class="subtitle">LTI · Literacy Type Indicator<br>정보를 입력하고 검사를 시작하세요!</div>

      <div class="field">
        <label>학년<span class="req">*</span></label>
        <select id="grade">
          <option value="" disabled selected>학년 선택</option>
          <optgroup label="초등학생">
            <option value="초1">초등 1학년</option>
            <option value="초2">초등 2학년</option>
            <option value="초3">초등 3학년</option>
            <option value="초4">초등 4학년</option>
            <option value="초5">초등 5학년</option>
            <option value="초6">초등 6학년</option>
          </optgroup>
          <optgroup label="중등">
            <option value="중1">중등 1학년</option>
            <option value="중2">중등 2학년</option>
            <option value="중3">중등 3학년</option>
          </optgroup>
          <optgroup label="고등학생">
            <option value="고1">고등 1학년</option>
            <option value="고2">고등 2학년</option>
            <option value="고3">고등 3학년</option>
          </optgroup>
        </select>
      </div>

      <div class="field">
        <label>이름<span class="req">*</span></label>
        <input type="text" id="name" placeholder="이름을 입력해주세요" maxlength="20" autocomplete="off">
      </div>

      <div class="field">
        <label>연락처<span class="req">*</span></label>
        <input type="tel" id="phone" placeholder="예) 010-1234-5678" maxlength="20" inputmode="numeric" autocomplete="off">
      </div>

      <button class="start-btn" onclick="startTest()">🧠 검사 시작하기</button>
      <div class="err" id="err"></div>
      <div class="foot">브레인 문해력 · LTI(Literacy Type Indicator)</div>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  let ACADEMY_NAME = '';

  // 센터명 상단 고정: URL ?id= 우선, 실패 시 관리자 세션 폴백 (진단테스트와 동일)
  async function loadCenterName(){
    let name = '';
    try{
      const id = (new URLSearchParams(location.search).get('id') || '').trim();
      if(/^[a-fA-F0-9]{24}$/.test(id)){
        const r = await fetch(`/api/academy/lookup?id=${encodeURIComponent(id)}`);
        const d = await r.json();
        if(d && d.ok && d.academyName) name = d.academyName;
      }
    }catch(e){}
    if(!name){
      try{
        const r = await fetch('/api/admin/info');
        if(r.ok){ const d = await r.json(); if(d && d.success && d.academyName) name = d.academyName; }
      }catch(e){}
    }
    ACADEMY_NAME = name || '';
    $('centerName').textContent = ACADEMY_NAME || '센터 정보 없음';
  }
  loadCenterName();

  function startTest(){
    const grade = $('grade').value.trim();
    const name  = $('name').value.trim();
    const phone = $('phone').value.trim();
    if(!grade){ return showErr('학년을 선택해주세요.'); }
    if(!name){  return showErr('이름을 입력해주세요.'); }
    if(!phone){ return showErr('연락처를 입력해주세요.'); }
    // 학년으로 검사 레벨 결정: 초등 → elem, 중·고 → mid
    const level = grade.startsWith('초') ? 'elem' : 'mid';
    // 입력 정보를 검사 페이지로 전달 (같은 도메인 sessionStorage 공유)
    const id = (new URLSearchParams(location.search).get('id') || '').trim();
    sessionStorage.setItem('ltiAcademyEntry', JSON.stringify({
      id, academyName: ACADEMY_NAME, grade, name, phone, level
    }));
    location.href = 'mbti.html';
  }
  function showErr(m){ $('err').textContent = m; }
</script>
</body>
</html>
