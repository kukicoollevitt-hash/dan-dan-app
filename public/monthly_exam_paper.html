<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAIN 월말 모의고사 시험지</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #1a1a1a;
    --line: #8a8a8a;
    --page-w: 210mm;
    --page-h: 296.8mm;
    --page-pad-v: 11mm;
    --page-pad-h: 10mm;
    --col-gap: 8mm;
  }

  html, body { background: #e9ecef; }
  body {
    font-family: 'Batang', '바탕', 'Nanum Myeongjo', 'AppleMyungjo', serif;
    color: var(--ink);
    line-height: 1.55;
  }

  /* ─── 화면 전용 툴바 ─── */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: #1f2937; color: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  .toolbar .tb-title { font-weight: 700; font-size: 15px; flex: 1; }
  .toolbar button {
    border: none; border-radius: 8px; padding: 9px 18px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .tb-print { background: #059669; color: #fff; }
  .tb-print:hover { background: #047857; }
  .tb-hint { font-size: 12px; color: #cbd5e1; }

  /* ─── A4 페이지 (화면·인쇄 동일 레이아웃) ─── */
  #sheet { padding: 16px 0 40px; }
  .page {
    background: #fff;
    width: var(--page-w);
    height: var(--page-h);
    padding: var(--page-pad-v) var(--page-pad-h);
    margin: 0 auto 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .page-num {
    position: absolute;
    left: 0; right: 0;
    bottom: 3.2mm;
    text-align: center;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 8.5pt;
    color: #555;
  }
  .page-foot {
    position: absolute;
    bottom: 3.6mm;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 6.5pt;
    letter-spacing: 0.4px;
    color: #999;
  }
  .page-foot.fl { left: var(--page-pad-h); }
  .page-foot.fr { right: var(--page-pad-h); }

  /* ─── 표지 (첫 페이지) ─── */
  .cover {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    text-align: center;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .cover-logo { width: 44mm; height: auto; margin-top: 11mm; }
  .cover-title { font-size: 39pt; font-weight: 900; color: #111; margin-top: 11mm; letter-spacing: 2px; white-space: nowrap; }
  .cover-title .cover-lv { color: #1a3d7c; }
  .cover-round {
    font-size: 16pt; font-weight: 800; color: #fff; background: #1a3d7c;
    padding: 2mm 9mm; border-radius: 30px; margin-top: 7mm; letter-spacing: 2px;
  }
  .cover-info { font-size: 11pt; color: #555; margin-top: 5mm; letter-spacing: 1px; }
  .cover-fields { display: flex; gap: 12mm; margin-top: 14mm; }
  .cover-box {
    display: flex; align-items: center; gap: 6mm;
    border: 2px solid var(--ink); border-radius: 2.5mm;
    padding: 6mm 8mm; min-width: 66mm;
  }
  .cover-box-lbl { font-size: 13pt; font-weight: 800; color: #222; flex-shrink: 0; letter-spacing: 1px; }
  .cover-box-line { flex: 1; border-bottom: 1.5px solid #888; height: 8mm; }
  .cover-notes { align-self: stretch; margin: 12mm 4mm 0; border-top: 1.5px solid #aaa; padding-top: 5mm; text-align: left; }
  .cover-notes .nt { font-size: 10.5pt; color: #333; line-height: 1.75; display: flex; gap: 2.5mm; margin-bottom: 2mm; }
  .cover-notes .nt::before { content: '▸'; color: #1a3d7c; font-weight: 900; flex-shrink: 0; }
  .cover-sign {
    align-self: stretch; margin: 9mm 4mm 0; border: 2px solid var(--ink); border-radius: 3mm;
    padding: 5mm 7mm 6mm; text-align: left;
  }
  .cover-sign .sh { font-size: 12pt; font-weight: 800; color: #111; margin-bottom: 1.5mm; }
  .cover-sign .sd { font-size: 9.5pt; color: #666; margin-bottom: 4mm; }
  .cover-sign .sp {
    font-size: 15pt; font-weight: 800; color: #1a3d7c; letter-spacing: 1px;
    text-align: center; margin-bottom: 9mm;
  }
  .cover-sign .sgrid {
    display: flex; flex-wrap: nowrap; justify-content: center; gap: 1.5mm;
  }
  .cover-sign .sq {
    flex: 1 1 0; min-width: 0; max-width: 12mm;
    aspect-ratio: 1 / 1;             /* 글자 수와 무관하게 한 줄에 채워 정사각 유지 */
    border: 1.3px solid var(--ink); border-radius: 1mm;
  }
  .cover-sign .sq-sp { border-style: dashed; border-color: #bbb; } /* 띄어쓰기 칸 */
  .cover-foot { margin-top: auto; font-size: 8.5pt; color: #999; padding-top: 6mm; letter-spacing: .5px; }

  /* ─── 머리말 (1페이지 상단) ─── */
  .paper-head {
    border: 2.5px solid var(--ink);
    padding: 10px 14px 9px;
    margin-bottom: 6mm;
    flex-shrink: 0;
  }
  .ph-top {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px; margin-bottom: 6px;
  }
  .ph-series {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 11pt; font-weight: 800; letter-spacing: 1px;
  }
  .ph-teacher {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 9pt; font-weight: 800; color: #b91c1c;
    border: 1.5px solid #b91c1c; border-radius: 4px; padding: 1px 8px;
  }
  .ph-explain {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 9pt; font-weight: 800; color: #047857;
    border: 1.5px solid #047857; border-radius: 4px; padding: 1px 8px;
  }
  .ph-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ph-title { font-size: 16pt; font-weight: 800; letter-spacing: 2px; }
  .ph-meta {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 9pt; color: #333; text-align: right; line-height: 1.5;
  }
  .ph-name {
    display: flex; gap: 14px; margin-top: 7px; padding-top: 6px;
    border-top: 1px solid var(--line);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 10pt;
  }
  .ph-name .slot {
    border-bottom: 1px solid var(--ink);
    min-width: 34mm;
    display: inline-block;
    height: 9mm;              /* 손글씨 쓸 세로 공간 */
    vertical-align: bottom;
  }

  /* ─── 2단 칼럼 영역 ─── */
  .cols {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .col {
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    font-size: 9.8pt;
    text-align: justify;
  }
  .col:first-child { padding-right: calc(var(--col-gap) / 2); }
  .col + .col {
    border-left: 1px solid #999;
    padding-left: calc(var(--col-gap) / 2);
  }

  /* 지문 묶음 안내 [n~m] */
  .p-range {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-weight: 800; font-size: 10pt;
    margin-bottom: 2.5mm;
  }

  /* 지문 박스 */
  .p-box {
    border: 1.2px solid var(--ink);
    padding: 3mm 3.5mm;
    margin-bottom: 4mm;
  }
  .p-box .p-subject {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 8pt; font-weight: 700; color: #555;
    margin-bottom: 1.5mm;
  }
  .p-box p { margin-bottom: 2.2mm; text-indent: 3.2mm; }
  .p-box p:last-child { margin-bottom: 0; }

  /* 문항 */
  .q { margin-bottom: 8mm; }
  .q-stem { margin-bottom: 2.4mm; }
  .q-stem .q-no { font-weight: 800; }
  .q-stem .q-score {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 8.5pt; color: #333;
  }
  .q-opts { list-style: none; font-size: 9pt; }
  .q-opts li { display: flex; gap: 1.6mm; margin-bottom: 1.3mm; }
  .q-opts .mark { flex-shrink: 0; }

  /* 교사용 정답·해설 */
  .q-answer {
    border: 1px dashed #059669;
    background: #f0fdf6;
    padding: 2mm 2.5mm;
    margin-top: 1.5mm;
    font-size: 8.8pt;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: #14532d;
  }
  .q-answer b { color: #047857; }
  .q-answer .q-wrong { color: #57534e; margin-top: 1.2mm; }
  .q-answer .q-wrong b { color: #78716c; }

  /* 교사용 정답표 */
  .answer-table-wrap { margin-top: 2mm; }
  .answer-table-title {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-weight: 800; font-size: 10.5pt; margin-bottom: 2mm;
  }
  table.answer-table {
    width: 100%; border-collapse: collapse;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 8.5pt; text-align: center;
  }
  table.answer-table th, table.answer-table td {
    border: 1px solid var(--ink); padding: 1mm 0;
  }
  table.answer-table th { background: #efefef; }

  .load-error {
    padding: 40px; text-align: center;
    font-family: 'Pretendard', sans-serif; color: #b91c1c; font-size: 15px;
  }

  /* ─── 인쇄 ─── */
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .toolbar { display: none; }
    #sheet { padding: 0; }
    .page {
      margin: 0; box-shadow: none;
      break-after: page;
    }
    .page:last-child { break-after: auto; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="tb-title" id="tbTitle">시험지 준비 중…</div>
  <div class="tb-hint">인쇄 창에서 ‘PDF로 저장’을 선택하면 파일로 저장돼요</div>
  <button class="tb-print" onclick="window.print()">🖨 인쇄 · PDF 저장</button>
</div>

<div id="sheet">
  <div class="load-error" id="loading">시험지를 불러오는 중입니다…</div>
</div>

<script>
  const CIRCLED = ['①','②','③','④','⑤'];
  // 회차별 필적 확인 문구 (정자로 기재) — 문해·성장 테마의 고운 문장
  const HANDWRITING = [
    '하늘은 맑고 바다는 푸르다',
    '봄바람에 꽃잎이 곱게 흩날린다',
    '책 속에 길이 있고 꿈이 자란다',
    '별빛은 어둠 속에서 더욱 빛난다',
    '맑은 물은 돌 틈으로 굽이쳐 흐른다',
    '한 걸음씩 오르면 높은 산도 넘는다',
    '아침 해가 온 세상을 환히 비춘다',
    '작은 씨앗이 큰 나무로 자란다',
    '글을 읽는 마음이 세상을 넓힌다',
    '바람은 쉬지 않고 강물은 흐른다',
    '새벽이슬 머금은 풀잎이 반짝인다',
    '오늘의 땀방울이 내일의 열매가 된다',
  ];
  const LOGO_SRC = 'images/%EB%B8%8C%EB%A0%88%EC%9D%B8%EB%AC%B8%ED%95%B4%EB%A0%A5%EB%A1%9C%EA%B3%A0_%ED%88%AC%EB%AA%85.png';
  const params = new URLSearchParams(location.search);
  const level = params.get('level') === 'mid' ? 'mid' : 'elem';
  const round = Math.min(12, Math.max(1, parseInt(params.get('round') || '1', 10) || 1));
  const isTeacher = params.get('teacher') === '1';
  const isExplain = params.get('answers') === '1';   // 해설지 (응시 완료 학생용)
  const showAnswers = isTeacher || isExplain;

  const script = document.createElement('script');
  script.src = `/monthly_exam_data/monthly_${level}_${round}.js?v=${Date.now()}`;   // 데이터 캐시 방지
  script.onload = render;
  script.onerror = () => {
    document.getElementById('loading').textContent = '시험지 데이터를 불러오지 못했습니다. 회차를 확인해 주세요.';
  };
  document.head.appendChild(script);

  /* ── 페이지 조립: 실제 A4 페이지 DOM을 만들어 블록을 좌→우 칼럼 순서로 채움.
        화면 미리보기와 인쇄 결과가 항상 동일함 ── */
  function render() {
    const d = window.MONTHLY_EXAM_DATA;
    if (!d) return;
    const levelKo = level === 'mid' ? '중등' : '초등';
    const docKo = isExplain ? '해설지' : isTeacher ? '시험지(교사용)' : '시험지(학생용)';
    document.title = `BRAIN월말_${levelKo}_${round}회차_${docKo}`;
    document.getElementById('tbTitle').textContent = `${d.title} · ${docKo}`;

    const sheet = document.getElementById('sheet');
    sheet.innerHTML = '';

    let colIdx = 0, cols = null;

    function newPage(withHead) {
      const page = document.createElement('div');
      page.className = 'page';
      if (withHead) {
        page.innerHTML = `
          <div class="paper-head">
            <div class="ph-top">
              <span class="ph-series">✦ BRAIN 월말 모의고사</span>
              ${isTeacher ? '<span class="ph-teacher">교사용 · 정답/해설 포함</span>'
                : isExplain ? '<span class="ph-explain">해설지 · 정답/해설 포함</span>'
                : `<span class="ph-meta">제${round}회</span>`}
            </div>
            <div class="ph-main">
              <div class="ph-title">${levelKo} 문해 모의고사 · ${round}회차</div>
              <div class="ph-meta">${d.totalQuestions}문항 · ${d.totalMinutes}분 · ${d.totalScore}점 만점</div>
            </div>
            <div class="ph-name">
              <span>학년 <span class="slot"></span></span>
              <span>이름 <span class="slot"></span></span>
              <span>점수 <span class="slot" style="min-width:20mm"></span></span>
            </div>
          </div>`;
      }
      const c = document.createElement('div');
      c.className = 'cols';
      c.innerHTML = '<div class="col"></div><div class="col"></div>';
      page.appendChild(c);
      sheet.appendChild(page);
      cols = c.querySelectorAll('.col');
      colIdx = 0;
    }

    const curCol = () => cols[colIdx];
    function nextCol() {
      if (colIdx === 0) colIdx = 1;
      else newPage(false);
    }
    const fits = (col) => col.scrollHeight <= col.clientHeight + 1;

    /* 블록을 현재 칼럼에 넣어보고, 넘치면 다음 칼럼으로 */
    function place(el) {
      curCol().appendChild(el);
      if (fits(curCol())) return;
      curCol().removeChild(el);
      nextCol();
      curCol().appendChild(el);
    }

    function el(tag, cls, html) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html != null) e.innerHTML = html;
      return e;
    }

    // 학생용 시험지에는 맨 앞에 표지 1페이지 (교사용/해설지는 제외)
    if (!showAnswers) {
      const phrase = HANDWRITING[(round - 1) % HANDWRITING.length];
      const cover = document.createElement('div');
      cover.className = 'page';
      cover.innerHTML = `
        <div class="cover">
          <img class="cover-logo" src="${LOGO_SRC}" alt="브레인 문해력">
          <div class="cover-title">브레인 <span class="cover-lv">${levelKo}</span> 문해 모의고사</div>
          <div class="cover-round">제 ${round} 회차</div>
          <div class="cover-info">${d.totalQuestions}문항 · ${d.totalMinutes}분 · ${d.totalScore}점 만점</div>
          <div class="cover-fields">
            <div class="cover-box">
              <div class="cover-box-lbl">학년</div>
              <div class="cover-box-line"></div>
            </div>
            <div class="cover-box">
              <div class="cover-box-lbl">이름</div>
              <div class="cover-box-line"></div>
            </div>
          </div>
          <div class="cover-notes">
            <div class="nt">문제지의 해당란에 <b>학년</b>과 <b>성명</b>을 정확히 기재하시오.</div>
            <div class="nt">시험지를 다 푼 이후에는 <b>답안지를 문해프로그램에 입력</b>해 주세요.</div>
          </div>
          <div class="cover-sign">
            <div class="sh">■ 필적 확인란</div>
            <div class="sd">아래 문구를 정자로 또박또박 기재하시오.</div>
            <div class="sp">“${phrase}”</div>
            <div class="sgrid">${phrase.split('').map(ch => `<span class="sq${ch === ' ' ? ' sq-sp' : ''}"></span>`).join('')}</div>
          </div>
          <div class="cover-foot">브레인 월말 문해 모의고사 ${round}회차</div>
        </div>`;
      sheet.appendChild(cover);
    }

    // 학생용은 표지에 정보가 있으니 문제 첫 장 머리말 생략 · 교사용/해설지는 머리말 유지
    newPage(showAnswers);

    d.passages.forEach(p => {
      const qs = p.questions || [];
      const first = qs[0] ? qs[0].no : '';
      const last = qs.length ? qs[qs.length - 1].no : '';

      /* [n~m] 안내 + 지문 첫 문단은 한 묶음으로 배치 (안내문만 칼럼 끝에 남는 고아 방지) */
      const range = el('div', 'p-range', `[${first}~${last}] 다음 글을 읽고 물음에 답하시오.`);
      let box = el('div', 'p-box', `<div class="p-subject">${p.subject} · ${p.title}</div>`);
      const paras = p.text.map(t => el('p', '', t));

      curCol().appendChild(range);
      curCol().appendChild(box);
      box.appendChild(paras[0]);
      if (!fits(curCol())) {
        curCol().removeChild(range);
        curCol().removeChild(box);
        nextCol();
        curCol().appendChild(range);
        curCol().appendChild(box);
      }

      /* 나머지 문단을 하나씩 채우고, 넘치면 다음 칼럼에 이어짐 박스로 분할 */
      for (let i = 1; i < paras.length; i++) {
        box.appendChild(paras[i]);
        if (!fits(curCol())) {
          box.removeChild(paras[i]);
          nextCol();
          box = el('div', 'p-box', `<div class="p-subject">${p.subject} · ${p.title} (이어서)</div>`);
          curCol().appendChild(box);
          box.appendChild(paras[i]);
        }
      }

      qs.forEach(q => {
        const qEl = el('div', 'q', `
          <div class="q-stem"><span class="q-no">${q.no}.</span> ${q.text} <span class="q-score">[${q.score}점]</span></div>
          <ul class="q-opts">
            ${q.options.map((opt, i) => `<li><span class="mark">${CIRCLED[i]}</span><span>${opt}</span></li>`).join('')}
          </ul>
          ${showAnswers ? `<div class="q-answer"><b>정답 ${CIRCLED[q.answer - 1]}</b> · ${q.correct || ''}
            ${q.wrong ? `<div class="q-wrong"><b>오답 풀이</b> · ${q.wrong}</div>` : ''}</div>` : ''}
        `);
        place(qEl);
      });
    });

    if (showAnswers) {
      const all = d.passages.flatMap(p => p.questions || []);
      const perRow = 10;
      let tableHtml = '';
      for (let s = 0; s < all.length; s += perRow) {
        const chunk = all.slice(s, s + perRow);
        tableHtml += `
          <tr><th>번호</th>${chunk.map(q => `<td>${q.no}</td>`).join('')}</tr>
          <tr><th>정답</th>${chunk.map(q => `<td><b>${CIRCLED[q.answer - 1]}</b></td>`).join('')}</tr>
          <tr><th>배점</th>${chunk.map(q => `<td>${q.score}</td>`).join('')}</tr>
        `;
      }
      place(el('div', 'answer-table-wrap', `
        <div class="answer-table-title">■ 빠른 정답표</div>
        <table class="answer-table">${tableHtml}</table>
      `));
    }

    /* 페이지 하단: 중앙 번호 + 좌우 꼬리말 (표지는 번호·꼬리말 없음, 문제 첫 장부터 -1-) */
    const hasCover = !showAnswers;
    sheet.querySelectorAll('.page').forEach((pg, i) => {
      if (hasCover && i === 0) return; // 표지 건너뜀 (자체 푸터 있음)
      const num = hasCover ? i : (i + 1);
      pg.appendChild(el('div', 'page-num', `- ${num} -`));
      pg.appendChild(el('div', 'page-foot fl', 'Brain Literacy Exam'));
      pg.appendChild(el('div', 'page-foot fr', `${levelKo}문해모의고사`));
    });
  }
</script>
</body>
</html>
