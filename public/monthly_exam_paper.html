<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAIN 월말 모의고사 시험지</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #1a1a1a;
    --line: #8a8a8a;
    --page-w: 210mm;
    --page-h: 296.8mm;
    --page-pad-v: 11mm;
    --page-pad-h: 10mm;
    --col-gap: 8mm;
  }

  html, body { background: #e9ecef; }
  body {
    font-family: 'Batang', '바탕', 'Nanum Myeongjo', 'AppleMyungjo', serif;
    color: var(--ink);
    line-height: 1.55;
  }

  /* ─── 화면 전용 툴바 ─── */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: #1f2937; color: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  .toolbar .tb-title { font-weight: 700; font-size: 15px; flex: 1; }
  .toolbar button {
    border: none; border-radius: 8px; padding: 9px 18px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .tb-print { background: #059669; color: #fff; }
  .tb-print:hover { background: #047857; }
  .tb-hint { font-size: 12px; color: #cbd5e1; }

  /* ─── A4 페이지 (화면·인쇄 동일 레이아웃) ─── */
  #sheet { padding: 16px 0 40px; }
  .page {
    background: #fff;
    width: var(--page-w);
    height: var(--page-h);
    padding: var(--page-pad-v) var(--page-pad-h);
    margin: 0 auto 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .page-num {
    position: absolute;
    left: 0; right: 0;
    bottom: 3.2mm;
    text-align: center;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 8.5pt;
    color: #555;
  }
  .page-foot {
    position: absolute;
    bottom: 3.6mm;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 6.5pt;
    letter-spacing: 0.4px;
    color: #999;
  }
  .page-foot.fl { left: var(--page-pad-h); }
  .page-foot.fr { right: var(--page-pad-h); }

  /* ─── 표지 (첫 페이지) ─── */
  .cover {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    text-align: center;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .cover-logo { width: 44mm; height: auto; margin-top: 11mm; }
  .cover-title { font-size: 39pt; font-weight: 900; color: #111; margin-top: 11mm; letter-spacing: 2px; white-space: nowrap; }
  .cover-title .cover-lv { color: #1a3d7c; }
  .cover-round {
    font-size: 16pt; font-weight: 800; color: #fff; background: #1a3d7c;
    padding: 2mm 9mm; border-radius: 30px; margin-top: 7mm; letter-spacing: 2px;
  }
  .cover-info { font-size: 11pt; color: #555; margin-top: 5mm; letter-spacing: 1px; }
  .cover-fields { display: flex; gap: 12mm; margin-top: 14mm; }
  .cover-box {
    display: flex; align-items: center; gap: 6mm;
    border: 2px solid var(--ink); border-radius: 2.5mm;
    padding: 6mm 8mm; min-width: 66mm;
  }
  .cover-box-lbl { font-size: 13pt; font-weight: 800; color: #222; flex-shrink: 0; letter-spacing: 1px; }
  .cover-box-line { flex: 1; border-bottom: 1.5px solid #888; height: 8mm; }
  .cover-notes { align-self: stretch; margin: 12mm 4mm 0; border-top: 1.5px solid #aaa; padding-top: 5mm; text-align: left; }
  .cover-notes .nt { font-size: 10.5pt; color: #333; line-height: 1.75; display: flex; gap: 2.5mm; margin-bottom: 2mm; }
  .cover-notes .nt::before { content: '▸'; color: #1a3d7c; font-weight: 900; flex-shrink: 0; }
  .cover-sign {
    align-self: stretch; margin: 9mm 4mm 0; border: 2px solid var(--ink); border-radius: 3mm;
    padding: 5mm 7mm 6mm; text-align: left;
  }
  .cover-sign .sh { font-size: 12pt; font-weight: 800; color: #111; margin-bottom: 1.5mm; }
  .cover-sign .sd { font-size: 9.5pt; color: #666; margin-bottom: 4mm; }
  .cover-sign .sp {
    font-size: 15pt; font-weight: 800; color: #1a3d7c; letter-spacing: 1px;
    text-align: center; margin-bottom: 9mm;
  }
  .cover-sign .sgrid {
    display: flex; flex-wrap: nowrap; justify-content: center; gap: 1.5mm;
  }
  .cover-sign .sq {
    flex: 1 1 0; min-width: 0; max-width: 12mm;
    aspect-ratio: 1 / 1;             /* 글자 수와 무관하게 한 줄에 채워 정사각 유지 */
    border: 1.3px solid var(--ink); border-radius: 1mm;
  }
  .cover-sign .sq-sp { border-style: dashed; border-color: #bbb; } /* 띄어쓰기 칸 */
  .cover-foot { margin-top: auto; font-size: 8.5pt; color: #999; padding-top: 6mm; letter-spacing: .5px; }

  /* ─── 머리말 (1페이지 상단) ─── */
  .paper-head {
    border: 2.5px solid var(--ink);
    padding: 10px 14px 9px;
    margin-bottom: 6mm;
    flex-shrink: 0;
  }
  .ph-top {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 6px; margin-bottom: 6px;
  }
  .ph-series {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 11pt; font-weight: 800; letter-spacing: 1px;
  }
  .ph-teacher {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 9pt; font-weight: 800; color: #b91c1c;
    border: 1.5px solid #b91c1c; border-radius: 4px; padding: 1px 8px;
  }
  .ph-explain {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 9pt; font-weight: 800; color: #047857;
    border: 1.5px solid #047857; border-radius: 4px; padding: 1px 8px;
  }
  .ph-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ph-title { font-size: 16pt; font-weight: 800; letter-spacing: 2px; }
  .ph-meta {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 9pt; color: #333; text-align: right; line-height: 1.5;
  }
  .ph-name {
    display: flex; gap: 14px; margin-top: 7px; padding-top: 6px;
    border-top: 1px solid var(--line);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 10pt;
  }
  .ph-name .slot {
    border-bottom: 1px solid var(--ink);
    min-width: 34mm;
    display: inline-block;
    height: 9mm;              /* 손글씨 쓸 세로 공간 */
    vertical-align: bottom;
  }

  /* ─── 2단 칼럼 영역 ─── */
  .cols {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .col {
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    font-size: 9.8pt;
    text-align: justify;
  }
  .col:first-child { padding-right: calc(var(--col-gap) / 2); }
  .col + .col {
    border-left: 1px solid #999;
    padding-left: calc(var(--col-gap) / 2);
  }

  /* 지문 묶음 안내 [n~m] */
  .p-range {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-weight: 800; font-size: 10pt;
    margin-bottom: 2.5mm;
  }

  /* 지문 박스 */
  .p-box {
    border: 1.2px solid var(--ink);
    padding: 3mm 3.5mm;
    margin-bottom: 4mm;
  }
  .p-box .p-subject {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 8pt; font-weight: 700; color: #555;
    margin-bottom: 1.5mm;
  }
  .p-box p { margin-bottom: 2.2mm; text-indent: 3.2mm; }
  .p-box p:last-child { margin-bottom: 0; }
  /* 지문이 칼럼을 넘어 이어질 때: 맞닿는 밑줄을 없애 한 박스처럼 자연스럽게 연결 ('(이어서)' 표기 불필요) */
  .p-box.cont-into { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .p-box.cont-from { border-top: none; padding-top: 0; }

  /* 문항 */
  .q { margin-bottom: 8mm; }
  /* 칼럼을 넘겨 이어지는 보기 묶음: 번호 없이 보기만 이어지므로 윗여백 제거 */
  .q.q-cont { margin-top: 0; }
  .q-stem { margin-bottom: 2.4mm; }
  .q-stem .q-no { font-weight: 800; }
  .q-stem .q-score {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 8.5pt; color: #333;
  }
  .q-opts { list-style: none; font-size: 9pt; }
  .q-opts li { display: flex; gap: 1.6mm; margin-bottom: 1.3mm; }
  .q-opts .mark { flex-shrink: 0; }

  /* 교사용 정답·해설 */
  .q-answer {
    border: 1px dashed #059669;
    background: #f0fdf6;
    padding: 2mm 2.5mm;
    margin-top: 1.5mm;
    font-size: 8.8pt;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: #14532d;
  }
  .q-answer b { color: #047857; }
  .q-answer .q-wrong { color: #57534e; margin-top: 1.2mm; }
  .q-answer .q-wrong b { color: #78716c; }

  /* 교사용 정답표 */
  .answer-table-wrap { margin-top: 2mm; }
  .answer-table-title {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-weight: 800; font-size: 10.5pt; margin-bottom: 2mm;
  }
  table.answer-table {
    width: 100%; border-collapse: collapse;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 8.5pt; text-align: center;
  }
  table.answer-table th, table.answer-table td {
    border: 1px solid var(--ink); padding: 1mm 0;
  }
  table.answer-table th { background: #efefef; }

  .load-error {
    padding: 40px; text-align: center;
    font-family: 'Pretendard', sans-serif; color: #b91c1c; font-size: 15px;
  }

  /* ─── 인쇄 ─── */
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .toolbar { display: none; }
    #sheet { padding: 0; }
    .page {
      margin: 0; box-shadow: none;
      break-after: page;
    }
    .page:last-child { break-after: auto; }
  }
  /* 🖍 OMR 답안지 (학생용 마지막 장) */
  .omr {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    display: flex; flex-direction: column; height: 100%;
  }
  .omr-head {
    display: flex; align-items: center; justify-content: space-between;
    border: 1.5px solid var(--ink); border-bottom-width: 3px;
    padding: 3mm 4.5mm; margin-bottom: 4mm; background: #f5f7fb;
  }
  .omr-title { font-size: 15pt; font-weight: 900; color: #1a3d7c; letter-spacing: 1px; }
  .omr-sub { font-size: 9pt; font-weight: 700; color: #555; margin-top: 1mm; }
  .omr-right { display: flex; flex-direction: column; align-items: flex-end; gap: 2.5mm; }
  .omr-time {
    display: inline-flex; align-items: flex-end; gap: 2mm;
    border: 1.5px solid #bf360c; background: #fff7f2;
    padding: 2.2mm 3mm; font-weight: 800;
  }
  .omr-time .t-lbl { font-size: 9.5pt; color: #bf360c; }
  .omr-time .t-slot { display: inline-block; min-width: 14mm; border-bottom: 1.2px solid #bf360c; height: 5.5mm; }
  .omr-time .t-unit { font-size: 9.5pt; color: #bf360c; }
  .omr-fields { display: flex; gap: 4mm; font-size: 9.5pt; font-weight: 700; }
  .omr-fields .f {
    display: flex; align-items: flex-end; gap: 2mm;
    border: 1.2px solid var(--ink); background: #fff; padding: 2.5mm 3mm;
  }
  .omr-fields .f .slot { display: inline-block; min-width: 22mm; border-bottom: 1.2px solid #777; height: 5.5mm; }
  .omr-guide {
    display: flex; align-items: center; gap: 4mm; flex-wrap: wrap;
    border: 1px dashed #8a93a6; background: #fbfcfe;
    padding: 2mm 3.5mm; margin-bottom: 4mm;
    font-size: 8.5pt; color: #333; font-weight: 600;
  }
  .omr-guide .ex { display: inline-flex; align-items: center; gap: 1.2mm; }
  .omr-guide .bub { width: 4.6mm; height: 4.6mm; font-size: 6.5pt; }
  .omr-cols { display: flex; gap: 5mm; align-items: flex-start; }
  .omr-col { flex: 1; display: flex; flex-direction: column; gap: 3mm; min-width: 0; }
  .omr-block { border: 1.5px solid var(--ink); }
  .omr-block-head {
    display: flex; align-items: center; gap: 2.5mm;
    background: #e8edf6; border-bottom: 0.5mm solid var(--ink);
    padding: 1.3mm 2.5mm;
  }
  .omr-block-head .pb {
    background: #1a3d7c; color: #fff; font-size: 7.5pt; font-weight: 800;
    padding: 0.8mm 2.2mm; border-radius: 1.2mm; letter-spacing: 0.3px;
  }
  .omr-block-head .ps { font-size: 9pt; font-weight: 800; color: #1a3d7c; }
  .omr-block table { width: 100%; border-collapse: collapse; }
  .omr-block td { border: 0.35mm solid #9aa3b5; text-align: center; vertical-align: middle; padding: 0.9mm 0.8mm; }
  .omr-block tr td:first-child { border-left: none; }
  .omr-block tr td:last-child { border-right: none; }
  .omr-block .no { width: 9mm; font-weight: 800; font-size: 9.5pt; background: #f5f7fb; color: #bf5a1c; }
  .bub {
    display: inline-flex; align-items: center; justify-content: center;
    width: 5mm; height: 5mm; border: 0.45mm solid #222; border-radius: 50%;
    font-size: 7.5pt; font-weight: 700; color: #444; line-height: 1;
  }
  .bub.filled { background: #111; border-color: #111; color: #111; }
  .omr-foot {
    margin-top: auto; padding-top: 4mm; text-align: center;
    font-size: 8.5pt; color: #555; font-weight: 600;
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="tb-title" id="tbTitle">시험지 준비 중…</div>
  <div class="tb-hint">인쇄 창에서 ‘PDF로 저장’을 선택하면 파일로 저장돼요</div>
  <button class="tb-print" onclick="window.print()">🖨 인쇄 · PDF 저장</button>
</div>

<div id="sheet">
  <div class="load-error" id="loading">시험지를 불러오는 중입니다…</div>
</div>

<script>
  const CIRCLED = ['①','②','③','④','⑤'];
  // 회차별 필적 확인 문구 (정자로 기재) — 문해·성장 테마의 고운 문장
  const HANDWRITING = [
    '하늘은 맑고 바다는 푸르다',
    '봄바람에 꽃잎이 곱게 흩날린다',
    '책 속에 길이 있고 꿈이 자란다',
    '별빛은 어둠 속에서 더욱 빛난다',
    '맑은 물은 돌 틈으로 굽이쳐 흐른다',
    '한 걸음씩 오르면 높은 산도 넘는다',
    '아침 해가 온 세상을 환히 비춘다',
    '작은 씨앗이 큰 나무로 자란다',
    '글을 읽는 마음이 세상을 넓힌다',
    '바람은 쉬지 않고 강물은 흐른다',
    '새벽이슬 머금은 풀잎이 반짝인다',
    '오늘의 땀방울이 내일의 열매가 된다',
  ];
  const LOGO_SRC = 'images/%EB%B8%8C%EB%A0%88%EC%9D%B8%EB%AC%B8%ED%95%B4%EB%A0%A5%EB%A1%9C%EA%B3%A0_%ED%88%AC%EB%AA%85.png';
  const params = new URLSearchParams(location.search);
  const level = ['mid', 'elem34'].includes(params.get('level')) ? params.get('level') : 'elem';
  const round = Math.min(12, Math.max(1, parseInt(params.get('round') || '1', 10) || 1));
  // 🏆 KLC 경시대회 지원: ?exam=klc_2027_q1 이면 해당 데이터 파일을 직접 로드
  const examParam = (params.get('exam') || '').trim();
  const isKlc = /^klc_[a-z0-9_]+$/.test(examParam);
  const isTeacher = params.get('teacher') === '1';
  const isExplain = params.get('answers') === '1';   // 해설지 (응시 완료 학생용)
  const showAnswers = isTeacher || isExplain;

  // 🖨 용지 크기: 기본 A4, size=a3 이면 A3로 확대 + 여백 넓게
  //   zoom으로 균일 확대해 A4 레이아웃을 그대로 A3 크기로 키움(비율·정렬 유지, 깨짐 없음)
  const paperSize = params.get('size') === 'a3' ? 'a3' : 'a4';
  if (paperSize === 'a3') {
    const st = document.createElement('style');
    st.textContent =
      '@page { size: A3; margin: 0; }' +
      ' .page { zoom: 1.25; }' +                          /* A4 → A3 크기로 확대 */
      ' @media print { .page { margin: 14mm auto; } }';   /* 인쇄 시 상하좌우 여백 추가 */
    document.head.appendChild(st);
    const _hint = document.querySelector('.tb-hint');
    if (_hint) _hint.textContent = 'A3 크기 · 여백 넓게 — 인쇄 창에서 용지를 A3로 선택하세요';
  }

  // 🏆 KLC 경시대회: 표지·OMR을 어두운 남색(딥 네이비) 컨셉으로 전환 (일반 월말 시험지는 기본 파란색 유지)
  if (isKlc) {
    const navy = document.createElement('style');
    navy.textContent =
      '.cover-title .cover-lv{color:#1e2a4f;}' +
      '.cover-round{background:#1e2a4f;box-shadow:none;}' +
      '.cover-notes .nt::before{color:#1e2a4f;}' +
      '.cover-sign{border-color:#2a3a5e;}' +
      '.cover-sign .sp{color:#1e2a4f;}' +
      '.cover-sign .sq{border-color:#2a3a5e;}' +
      '.omr-title{color:#1e2a4f;}' +
      '.omr-block-head{background:#1e2a4f;}' +
      '.omr-block-head .ps{color:#1e2a4f;}' +
      /* 로고는 원래 남색 → 살짝 어둡게 해 딥 네이비 톤과 맞춤 */
      '.cover-logo{filter:brightness(0.72) contrast(1.08) saturate(1.1);}';
    document.head.appendChild(navy);
  }

  const script = document.createElement('script');
  script.src = isKlc
    ? `/monthly_exam_data/${examParam}.js?v=${Date.now()}`                         // 🏆 경시대회 데이터
    : `/monthly_exam_data/monthly_${level}_${round}.js?v=${Date.now()}`;           // 데이터 캐시 방지
  script.onload = render;
  script.onerror = () => {
    document.getElementById('loading').textContent = '시험지 데이터를 불러오지 못했습니다. 회차를 확인해 주세요.';
  };
  document.head.appendChild(script);

  /* ── 페이지 조립: 실제 A4 페이지 DOM을 만들어 블록을 좌→우 칼럼 순서로 채움.
        화면 미리보기와 인쇄 결과가 항상 동일함 ── */
  function render() {
    const d = window.MONTHLY_EXAM_DATA;
    if (!d) return;
    const levelKo = isKlc ? '경시대회' : (level === 'mid' ? '핏' : (level === 'elem34' ? '온' : '업')); // 브랜드 등급명 (온=초1~4, 업=초5~6, 핏=중등)
    // 🏆 경시대회 구분(초등/중등)·분기·월 (examParam과 데이터에서 동적 산출)
    const klcDiv   = (examParam.indexOf('mid') >= 0 || d.grade === 'mid') ? '중등' : '초등';
    const klcQ     = d.quarter || 1;
    const klcMonth = ({1:'3월', 2:'6월', 3:'9월', 4:'12월'})[klcQ] || '3월';
    const docKo = isExplain ? '해설지' : isTeacher ? '시험지(교사용)' : '시험지(학생용)';
    document.title = isKlc ? `KLC경시대회_2027_${klcDiv}_${klcQ}분기_${docKo}` : `BRAIN월말_${levelKo}_${round}회차_${docKo}`;
    document.getElementById('tbTitle').textContent = `${d.title} · ${docKo}`;
    // 🏆 경시대회/월말 공통 라벨 (KLC는 회차 대신 초등/중등·분기(월) 표기)
    const SERIES_LABEL = isKlc ? '✦ 전국 교과문해력 경시대회' : '✦ BRAIN 월말 모의고사';
    const HEAD_TITLE   = isKlc ? `2027 전국 교과문해력 경시대회 · ${klcDiv} ${klcQ}분기(${klcMonth})` : `${levelKo} 문해 모의고사 · ${round}회차`;
    const ROUND_TAG    = isKlc ? `${klcQ}분기` : `제${round}회`;
    const COVER_TITLE  = isKlc ? '브레인 <span class="cover-lv">전국 교과문해력</span> 경시대회' : `브레인 <span class="cover-lv">${levelKo}</span> 문해 모의고사`;
    const COVER_ROUND  = isKlc ? `2027학년 ${klcDiv} ${klcMonth}` : `제 ${round} 회차`;
    const FOOT_LABEL   = isKlc ? `전국 교과문해력 경시대회 · 2027 ${klcDiv} ${klcQ}분기` : `브레인 월말 문해 모의고사 ${round}회차`;
    const OMR_SUB      = isKlc ? `전국 교과문해력 경시대회 · ${klcDiv} ${klcQ}분기 · ${d.totalQuestions}문항` : `브레인 ${levelKo} 문해 모의고사 · 제${round}회 · ${d.totalQuestions}문항`;
    const PAGE_FOOT    = isKlc ? '교과문해력경시대회' : `${levelKo}문해모의고사`;

    const sheet = document.getElementById('sheet');
    sheet.innerHTML = '';

    let colIdx = 0, cols = null;

    function newPage(withHead) {
      const page = document.createElement('div');
      page.className = 'page';
      if (withHead) {
        page.innerHTML = `
          <div class="paper-head">
            <div class="ph-top">
              <span class="ph-series">${SERIES_LABEL}</span>
              ${isTeacher ? '<span class="ph-teacher">교사용 · 정답/해설 포함</span>'
                : isExplain ? '<span class="ph-explain">해설지 · 정답/해설 포함</span>'
                : `<span class="ph-meta">${ROUND_TAG}</span>`}
            </div>
            <div class="ph-main">
              <div class="ph-title">${HEAD_TITLE}</div>
              <div class="ph-meta">${d.totalQuestions}문항 · ${d.totalMinutes}분 · ${d.totalScore}점 만점</div>
            </div>
            <div class="ph-name">
              <span>학년 <span class="slot"></span></span>
              <span>이름 <span class="slot"></span></span>
              <span>점수 <span class="slot" style="min-width:20mm"></span></span>
            </div>
          </div>`;
      }
      const c = document.createElement('div');
      c.className = 'cols';
      c.innerHTML = '<div class="col"></div><div class="col"></div>';
      page.appendChild(c);
      sheet.appendChild(page);
      cols = c.querySelectorAll('.col');
      colIdx = 0;
    }

    const curCol = () => cols[colIdx];
    function nextCol() {
      if (colIdx === 0) colIdx = 1;
      else newPage(false);
    }
    const fits = (col) => col.scrollHeight <= col.clientHeight + 1;

    /* 블록을 현재 칼럼에 넣어보고, 넘치면 다음 칼럼으로 */
    function place(el) {
      curCol().appendChild(el);
      if (fits(curCol())) return;
      curCol().removeChild(el);
      nextCol();
      curCol().appendChild(el);
    }

    function el(tag, cls, html) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html != null) e.innerHTML = html;
      return e;
    }

    // 학생용 시험지에는 맨 앞에 표지 1페이지 (교사용/해설지는 제외)
    if (!showAnswers) {
      const phrase = HANDWRITING[(round - 1) % HANDWRITING.length];
      const cover = document.createElement('div');
      cover.className = 'page';
      cover.innerHTML = `
        <div class="cover">
          <img class="cover-logo" src="${LOGO_SRC}" alt="브레인 문해력">
          <div class="cover-title">${COVER_TITLE}</div>
          <div class="cover-round">${COVER_ROUND}</div>
          <div class="cover-info">${d.totalQuestions}문항 · ${d.totalMinutes}분 · ${d.totalScore}점 만점</div>
          <div class="cover-fields">
            <div class="cover-box">
              <div class="cover-box-lbl">학년</div>
              <div class="cover-box-line"></div>
            </div>
            <div class="cover-box">
              <div class="cover-box-lbl">이름</div>
              <div class="cover-box-line"></div>
            </div>
          </div>
          <div class="cover-notes">
            <div class="nt">문제지의 해당란에 <b>학년</b>과 <b>성명</b>을 정확히 기재하시오.</div>
            <div class="nt">시험지를 다 푼 이후에는 <b>답안지를 문해프로그램에 입력</b>해 주세요.</div>
          </div>
          <div class="cover-sign">
            <div class="sh">■ 필적 확인란</div>
            <div class="sd">아래 문구를 정자로 또박또박 기재하시오.</div>
            <div class="sp">“${phrase}”</div>
            <div class="sgrid">${phrase.split('').map(ch => `<span class="sq${ch === ' ' ? ' sq-sp' : ''}"></span>`).join('')}</div>
          </div>
          <div class="cover-foot">${FOOT_LABEL}</div>
        </div>`;
      sheet.appendChild(cover);
    }

    // 학생용은 표지에 정보가 있으니 문제 첫 장 머리말 생략 · 교사용/해설지는 머리말 유지
    newPage(showAnswers);

    d.passages.forEach(p => {
      const qs = p.questions || [];
      const first = qs[0] ? qs[0].no : '';
      const last = qs.length ? qs[qs.length - 1].no : '';

      /* [n~m] 안내 + 지문 첫 문단은 한 묶음으로 배치 (안내문만 칼럼 끝에 남는 고아 방지) */
      const range = el('div', 'p-range', `[${first}~${last}] 다음 글을 읽고 물음에 답하시오.`);
      let box = el('div', 'p-box', `<div class="p-subject">${p.subject} · ${p.title}</div>`);
      const paras = p.text.map(t => el('p', '', t));

      curCol().appendChild(range);
      curCol().appendChild(box);
      box.appendChild(paras[0]);
      if (!fits(curCol())) {
        curCol().removeChild(range);
        curCol().removeChild(box);
        nextCol();
        curCol().appendChild(range);
        curCol().appendChild(box);
      }

      /* 나머지 문단을 채우되, 한 문단이 칼럼을 넘치면 '문장 단위'로 쪼개 현재 칼럼을 최대한 채우고
         나머지만 다음 칼럼으로 이어지게 한다(문단 통짜 이동 시 생기던 하단 공백 제거).
         소수점 숫자(예: 0.6도)는 마침표 뒤에 공백이 없어 분리되지 않는다. */
      const splitSentences = (html) => {
        const parts = html.split(/(?<=[.!?])\s+/).filter(s => s.length);
        return parts.length ? parts.map((s, i) => i < parts.length - 1 ? s + ' ' : s) : [html];
      };
      for (let i = 1; i < paras.length; i++) {
        box.appendChild(paras[i]);
        if (fits(curCol())) continue;
        box.removeChild(paras[i]);
        const sentences = splitSentences(paras[i].innerHTML);
        let idx = 0, cont = false;
        while (idx < sentences.length) {
          const fresh = (box.children.length === 0);
          const p = el('p', '');
          if (cont) p.style.textIndent = '0';
          box.appendChild(p);
          let placed = idx;
          for (let s = idx; s < sentences.length; s++) {
            p.innerHTML = sentences.slice(idx, s + 1).join('');
            if (!fits(curCol())) { p.innerHTML = sentences.slice(idx, s).join(''); break; }
            placed = s + 1;
          }
          if (placed === idx) {
            if (fresh) { p.innerHTML = sentences[idx]; placed = idx + 1; } // 빈 칼럼엔 넘쳐도 1문장(무한루프 방지)
            else { box.removeChild(p); }                                   // 공간 없음 → 다음 칼럼
          }
          idx = placed;
          if (idx < sentences.length) {        // 남은 문장 → 다음 칼럼 이어짐 박스
            box.classList.add('cont-into');
            nextCol();
            box = el('div', 'p-box cont-from');
            curCol().appendChild(box);
            cont = true;
          }
        }
      }

      qs.forEach(q => {
        /* 발문 + 보기 한 개를 한 묶음으로 현재 칼럼에 넣는다(발문만 칼럼 끝에 남는 고아 방지).
           나머지 보기는 하나씩 채우다 넘치면 다음 칼럼에 '이어짐' 묶음으로 계속 흐르게 해 빈칸을 없앤다. */
        const stemHtml = `<div class="q-stem"><span class="q-no">${q.no}.</span> ${q.text} <span class="q-score">[${q.score}점]</span></div>`;
        const liHtml = (i) => `<li><span class="mark">${CIRCLED[i]}</span><span>${q.options[i]}</span></li>`;

        let cont = el('div', 'q');
        cont.innerHTML = stemHtml + '<ul class="q-opts"></ul>';
        let ul = cont.querySelector('.q-opts');
        ul.insertAdjacentHTML('beforeend', liHtml(0)); // 발문 + 첫 보기는 함께
        curCol().appendChild(cont);
        if (!fits(curCol())) {            // 발문+첫 보기가 현재 칼럼에 안 들어가면 통째 이동
          curCol().removeChild(cont);
          nextCol();
          curCol().appendChild(cont);
        }

        for (let i = 1; i < q.options.length; i++) {
          ul.insertAdjacentHTML('beforeend', liHtml(i));
          if (!fits(curCol())) {          // 이 보기가 넘치면 다음 칼럼에 이어 붙인다
            ul.removeChild(ul.lastElementChild);
            nextCol();
            cont = el('div', 'q q-cont');
            cont.innerHTML = '<ul class="q-opts"></ul>';
            ul = cont.querySelector('.q-opts');
            ul.insertAdjacentHTML('beforeend', liHtml(i));
            curCol().appendChild(cont);
          }
        }

        if (showAnswers) {                // 교사용 정답·해설 박스는 마지막 묶음 뒤에
          const ans = el('div', 'q-answer', `<b>정답 ${CIRCLED[q.answer - 1]}</b> · ${q.correct || ''}
            ${q.wrong ? `<div class="q-wrong"><b>오답 풀이</b> · ${q.wrong}</div>` : ''}`);
          cont.appendChild(ans);
          if (!fits(curCol())) {
            cont.removeChild(ans);
            nextCol();
            cont = el('div', 'q q-cont');
            cont.appendChild(ans);
            curCol().appendChild(cont);
          }
        }
      });
    });

    /* 🖍 학생용 마지막 장: OMR 답안지 — 문제를 다 푼 뒤 수기 마킹용 (문항·보기 수는 데이터 기준 자동)
          프로그램의 '답안 현황' 입력 패널과 동일하게 지문 단위 블록 + 좌우 2열 교차 배치 (입력 시 혼동 방지) */
    if (!showAnswers) {
      const all = d.passages.flatMap(p => p.questions || []);
      const maxOpts = Math.max(...all.map(q => (q.options || []).length), 5);
      const blockHtml = (p, pi) => `
        <div class="omr-block">
          <div class="omr-block-head"><span class="pb">지문 ${pi + 1}</span><span class="ps">${p.subject}</span></div>
          <table>
            ${(p.questions || []).map(q => `
              <tr>
                <td class="no">${q.no}</td>
                ${Array.from({ length: maxOpts }, (_, i) =>
                  `<td>${i < (q.options || []).length ? `<span class="bub">${CIRCLED[i]}</span>` : ''}</td>`
                ).join('')}
              </tr>`).join('')}
          </table>
        </div>`;
      // 지문이 많으면(9개 이상·예: KLC 11지문) 3열로 자동 전환해 한 장에 들어가게(2열이면 마지막 지문이 짤림)
      const nCols = d.passages.length > 8 ? 3 : 2;
      const cols = Array.from({ length: nCols }, () => []);
      d.passages.forEach((p, pi) => cols[pi % nCols].push(blockHtml(p, pi)));  // 행 우선(지문1·2·3 → 4·5·6 …)
      const omrPage = document.createElement('div');
      omrPage.className = 'page';
      omrPage.innerHTML = `
        <div class="omr">
          <div class="omr-head">
            <div>
              <div class="omr-title">OMR 답안지</div>
              <div class="omr-sub">${OMR_SUB}</div>
            </div>
            <div class="omr-right">
              <div class="omr-time">
                <span class="t-lbl">⏱ 시험 소요시간</span>
                <span class="t-slot"></span><span class="t-unit">분</span>
              </div>
              <div class="omr-fields">
                <span class="f">학년 <span class="slot"></span></span>
                <span class="f">이름 <span class="slot"></span></span>
              </div>
            </div>
          </div>
          <div class="omr-guide">
            <span>■ 마킹 방법 : 답란의 번호를 컴퓨터용 사인펜으로 까맣게 칠하세요.</span>
            <span class="ex">바른 표기 <span class="bub filled">●</span></span>
            <span class="ex">잘못된 표기 <span class="bub" style="background:linear-gradient(135deg,transparent 45%,#222 45%,#222 55%,transparent 55%);">&nbsp;</span> <span class="bub" style="border-style:dashed;color:#999;">√</span></span>
          </div>
          <div class="omr-cols">
            ${cols.map(c => `<div class="omr-col">${c.join('')}</div>`).join('')}
          </div>
          <div class="omr-foot">답안지 마킹 후, 반드시 <b>문해프로그램에 답안을 입력</b>해 주세요. · ${FOOT_LABEL}</div>
        </div>`;
      sheet.appendChild(omrPage);
    }

    if (showAnswers) {
      const all = d.passages.flatMap(p => p.questions || []);
      const perRow = 10;
      let tableHtml = '';
      for (let s = 0; s < all.length; s += perRow) {
        const chunk = all.slice(s, s + perRow);
        tableHtml += `
          <tr><th>번호</th>${chunk.map(q => `<td>${q.no}</td>`).join('')}</tr>
          <tr><th>정답</th>${chunk.map(q => `<td><b>${CIRCLED[q.answer - 1]}</b></td>`).join('')}</tr>
          <tr><th>배점</th>${chunk.map(q => `<td>${q.score}</td>`).join('')}</tr>
        `;
      }
      place(el('div', 'answer-table-wrap', `
        <div class="answer-table-title">■ 빠른 정답표</div>
        <table class="answer-table">${tableHtml}</table>
      `));
    }

    /* 페이지 하단: 중앙 번호 + 좌우 꼬리말 (표지는 번호·꼬리말 없음, 문제 첫 장부터 -1-) */
    const hasCover = !showAnswers;
    sheet.querySelectorAll('.page').forEach((pg, i) => {
      if (hasCover && i === 0) return; // 표지 건너뜀 (자체 푸터 있음)
      const num = hasCover ? i : (i + 1);
      pg.appendChild(el('div', 'page-num', `- ${num} -`));
      pg.appendChild(el('div', 'page-foot fl', 'Brain Literacy Exam'));
      pg.appendChild(el('div', 'page-foot fr', PAGE_FOOT));
    });
  }
</script>
</body>
</html>
