          <p>남한과 북한의 여러 학자들은 지금껏 서로 힘을 모아 「겨레말 큰사전」을 함께 편찬하는 뜻깊은 작업을 꾸준히 진행해 왔다. 이 사전은 남한과 북한에서 각각 사용하는 수많은 어휘를 두루 모으고 차곡차곡 정리하여, 서로의 서로 다른 언어를 한결 깊이 이해하도록 돕는 데에 큰 의미가 있다. 남쪽에서는 더없이 익숙하지만 북쪽에서는 영 낯선 말도 있고, 반대로 북쪽에서는 아주 흔하지만 남쪽에서는 좀처럼 잘 쓰지 않는 말도 분명 있을 것이다. 이처럼 서로 다른 어휘를 한데 가지런히 모으면, 저마다 다른 표현을 나란히 비교해 보고 그 숨은 뜻을 또렷이 알아볼 수 있다. 사전을 편찬하는 일은 결코 단순히 단어를 길게 나열하기만 하는 작업이 아니다. 그것은 오랜 세월 면면히 이어져 온 소중한 민족의 언어와 문화를 고스란히 보존하고, 남북한이 함께 나누며 어우러질 수 있는 문화 공동체의 폭을 한층 넓히는 뜻깊은 일이기도 하다. 흩어진 말들을 한데 모아 엮는 이 작업은, 곧 갈라진 민족의 뿌리를 다시 하나로 이어 가는 소중한 밑거름이 되는 셈이다.</p>
          <p class="section-title">⑤ 언어와 문화를 이해하는 민간 교류의 중요성</p>
          <p>남북한의 언어 차이를 줄이는 두 번째 방법은, 남한과 북한 사이의 활발한 민간 교류를 꾸준히 이어 가는 것이다. 언어란 단순히 메마른 정보를 전달하는 도구에 그치는 것이 아니라, 사람들이 날마다 살아가는 방식과 그 안에 담긴 생각까지 고스란히 녹아든 소중한 문화의 일부이기 때문이다. 따라서 서로가 쓰는 말을 진정으로 이해하려면, 그 말을 실제로 사용하는 사람들의 평범한 생활과 깊은 문화를 함께 두루 알아야 한다. 물론 두꺼운 책이나 사전을 펼쳐 낯선 단어의 뜻을 하나하나 배울 수도 있겠지만, 실제로 얼굴을 마주하고 정답게 이야기를 나누다 보면 그 말이 과연 어떤 상황에서 쓰이는지까지도 아주 자연스럽게 익힐 수 있다. 이렇듯 꾸준한 문화 교류가 차곡차곡 이루어지면, 서로가 쓰는 표현을 더 이상 낯설게만 느끼지 않게 된다. 이러한 소중한 경험은 남북한 사람들이 서로 마음의 거리를 조금씩 좁히고, 다가올 미래의 통합을 차분히 준비하는 데에 큰 도움이 될 것이다. 글자로만 배운 말은 쉽게 잊히지만, 사람과 부대끼며 익힌 말은 마음에 남아 서로를 잇는 끈이 되어 주기 때문이다.</p>
          <p class="section-title">⑥ 스포츠 교류를 통해 가까워지는 남과 북</p>
          <p>이러한 민간 교류를 실제로 실천할 수 있는 여러 분야 가운데 하나가 바로 스포츠다. 평창 동계 올림픽 여자 아이스하키 남북 단일팀의 사례처럼, 남북한의 선수들이 한자리에 모여 함께 땀 흘려 훈련하고 실제 경기에 나란히 참여하면, 서로가 쓰는 언어를 직접 몸으로 접할 소중한 기회가 자연스레 생긴다. 선수들은 세밀한 작전을 설명하거나 연습 방법을 함께 의논하는 과정에서, 상대편이 즐겨 사용하는 낯선 표현을 조금씩 익혀 나갈 수 있다. 하나의 같은 목표를 향해 온 힘을 한데 모으는 바로 그 과정에서, 단순한 말의 차이뿐만 아니라 서로 다른 생활 방식과 문화의 차이까지도 한결 깊이 이해하게 된다. 아이스하키뿐 아니라 축구와 같은 다른 여러 종목에서도 이런 교류가 활발히 이루어진다면, 비슷하게 좋은 효과를 충분히 기대할 수 있다. 여기서 무엇보다 중요한 것은 특정한 종목 그 자체보다, 서로 함께 활동하고 마음을 터놓고 대화할 기회를 꾸준히 만들어 가는 일이다. 승패를 겨루는 경기장 안에서도 같은 편으로 호흡을 맞추다 보면, 말의 벽은 허물어지고 끈끈한 동료애가 자라나기 때문이다.</p>
          <p class="section-title">⑦ 문화 교류가 만들어 내는 언어적 공감대</p>
          <p>비단 스포츠뿐만 아니라, 참으로 다양한 문화 활동 또한 남북한의 벌어진 언어 차이를 줄이는 데에 적지 않은 도움이 될 수 있다. 서로가 즐겨 부르는 노래와 정겨운 이야기, 그리고 멋진 공연을 가까이에서 두루 접하다 보면, 일상 속에서 흔히 쓰는 생생한 표현과 그 속에 깊이 담긴 섬세한 감정을 자연스레 이해할 기회가 점점 늘어난다. 물론 처음에는 영 낯선 말이 불쑥 등장하더라도, 그 뜻을 서로 정답게 묻고 차근차근 설명하는 과정을 몇 번 거치다 보면 조금씩 익숙해질 수 있다. 서로가 쓰는 다른 표현을 무작정 틀린 말이라고 섣불리 단정해 버리기보다는, 도대체 왜 그런 말을 쓰는지 다정하게 궁금해하는 열린 태도가 무엇보다 필요하다. 왜냐하면 언어란 본래 사람과 사람 사이의 따뜻한 관계 속에서 끊임없이 살아 움직이는 것이기 때문이다. 이러한 교류가 그저 한 번의 반짝 행사로 덧없이 끝나지 않고 오래도록 꾸준히 지속될 때, 비로소 남북한 사람들은 서로의 언어와 문화를 한층 더 깊이 이해할 수 있을 것이다.</p>
          <p class="section-title">⑧ 언어 차이를 줄여 주는 기술의 역할</p>
          <p>남북한의 언어 차이를 줄이는 세 번째 방법은, 발전한 기술을 슬기롭게 활용하여 그 차이를 좁혀 주는 여러 편리한 도구를 개발하는 것이다. 실제로 우리나라의 한 회사는 남한의 어휘를 그에 해당하는 북한의 어휘로 손쉽게 바꾸어 주는 앱을 개발하여, 남한 생활에 아직 서툰 탈북 청소년에게 큰 도움을 주었다고 한다. 남한에 와서 처음 듣는 생소한 단어를 쉽사리 이해하기 어려울 때, 이 앱을 이용하면 자신에게 익숙한 표현과 나란히 비교해 가며 그 뜻을 어렵지 않게 알아볼 수 있다. 이는 전혀 낯선 언어 환경에 하루빨리 적응해 가는 데에 참으로 실질적인 도움이 될 수 있다. 두꺼운 사전을 일일이 찾아보는 기존의 방법에 더해, 늘 손에 쥔 휴대전화와 같은 편리한 기기를 함께 활용하면 꼭 필요한 바로 그 순간에 즉시 정보를 확인할 수 있다는 커다란 장점도 있다. 이처럼 발전한 기술은 서로 다른 사람들 사이의 막힌 소통을 이어 주는 든든한 다리가 되어 줄 수 있다. 손안의 기기 하나가, 말이 통하지 않아 답답하던 순간을 이해와 공감의 시간으로 바꾸어 주는 고마운 도우미가 되는 것이다.</p>
          <p class="section-title">⑨ 공통 사전과 교류, 기술이 함께 발전해야 하는 이유</p>
          <p>남북한의 서로 다른 언어를 가깝게 연결해 주는 기술이 더욱 발전하면, 서로의 말을 이해하는 방법 또한 한결 다양하고 풍부해질 수 있다. 예를 들어 어떤 낯선 단어를 검색했을 때, 그 즉시 상대 지역에서 쓰는 표현과 정확한 뜻을 나란히 함께 알려 주는 편리한 기능도 충분히 생각해 볼 수 있다. 학교에서 열심히 공부를 하거나 평범한 일상생활을 하는 도중에도, 이런 똑똑한 도구를 곁에 두고 이용하면 모르는 말을 그냥 무심코 지나치지 않고 그 자리에서 바로 확인할 수 있다. 다만 여기서 한 가지 명심할 점은, 아무리 뛰어난 기술만으로 남북의 언어 차이가 깨끗이 모두 사라지는 것은 결코 아니라는 사실이다. 똑같은 하나의 단어라도 그것이 실제로 쓰이는 구체적인 상황과 그 밑바탕에 깔린 문화적 배경까지 두루 알아야, 비로소 그 뜻을 온전하고 정확하게 이해할 수 있기 때문이다. 따라서 공통 사전과 꾸준한 민간 교류, 그리고 소통을 돕는 기술은 어느 하나도 빠짐없이 서로를 보완하며 함께 발전해 나가야 한다.</p>

          <p>가슴 아픈 분단이라는 역사적 상황 때문에, 남한과 북한의 언어생활에는 어느새 적지 않은 차이가 생기고 말았다. 그러나 남한과 북한에서 쓰는 말은 본래 하나의 뿌리 깊은 민족어에서 함께 갈라져 이어져 왔으며, 사실 서로 다른 점보다 공통된 바탕이 훨씬 더 크고 넓다. 그러므로 우리는 바로 이 소중한 공통점을 든든한 바탕으로 삼아, 서로의 차이를 조금씩 꾸준히 좁혀 나갈 수 있다. 이를 위해서는 「겨레말 큰사전」의 편찬을 끈기 있게 이어 가고, 남북 사이의 민간 교류를 더욱 폭넓게 확대하며, 서로의 언어 소통에 실질적인 도움이 되는 기술을 부지런히 개발하려는 노력이 반드시 필요하다. 그리고 그 무엇보다도, 서로가 쓰는 표현에 따뜻한 관심을 기울이고 낯선 말을 기꺼이 이해하려는 열린 자세가 가장 중요하다. 같은 언어를 쓰는 하나의 한민족으로서 이러한 작은 노력을 차곡차곡 쌓아 갈 때, 비로소 다가올 통일 시대에 진정한 마음의 통합까지 이룰 든든한 준비를 할 수 있을 것이다. 말이 하나로 이어지는 날, 오랜 세월 갈라져 있던 두 마음도 비로소 하나가 될 수 있을 것이다.</p>

          <p>어제 멋지게 차려입었던 옷은 오늘 새로 입은 옷에 금세 밀려나고, 오늘 입은 옷은 또다시 내일 입을 새로운 옷에 자리를 내주며 밀려난다. 우리는 흔히 유행이라는 이름으로 이런 끝없는 변화를 끊임없이 되풀이한다. 더구나 요즘에는 유행이 바뀌는 속도가 예전보다 한층 더 빨라져 거의 날마다 새로운 옷이 쏟아져 나오고, 온갖 광고는 소비자에게 어서 신상품을 사라며 쉴 새 없이 유혹의 손길을 뻗친다. 그러나 설레며 새 옷을 입는 즐거움도 그저 잠시뿐, 몇 번 입어 보지도 못한 옷이 벌써 유행에 뒤처졌다는 서글픈 이유로 미련 없이 버려지곤 한다. 한 미국 잡지에 따르면, 2010년대 미국인의 의류 구매량은 놀랍게도 1980년대보다 무려 다섯 배나 많아졌다고 한다. 우리나라에서도 사람들이 옷을 사는 횟수와 그 양이 해마다 빠르게 늘어나고 있다. 그렇다면 사람들은 대체 어쩌다가 이렇게 많은 옷을 손쉽게 사고 또 쉽게 버리게 되었을까? 넘쳐 나는 옷장 속 옷들 뒤에는, 우리가 미처 생각하지 못한 복잡한 사연들이 겹겹이 숨어 있는 것이다.</p>
          <p class="section-title">② 값싼 옷을 만드는 의류 업체들의 가격 경쟁</p>
          <p>옷 소비가 이토록 크게 늘어난 주요 원인 가운데 하나는, 바로 여러 의류 업체들 사이에 벌어지는 치열한 가격 경쟁이다. 예를 들어 A 기업이 청바지 한 벌을 5만 원에 팔고 있을 때, B 기업이 그와 비슷한 품질의 청바지를 4만 5천 원이라는 더 싼값에 내놓으면 소비자는 아무래도 더 저렴한 제품을 선택하기 쉽다. 따라서 업체들은 치열한 판매 경쟁에서 어떻게든 이기기 위해, 옷을 만드는 데 드는 생산 비용을 한 푼이라도 더 낮추려고 안간힘을 쓴다. 의류 산업은 옷 한 벌을 만드는 데에도 수많은 사람의 손길이 일일이 필요한 노동 집약 산업이어서, 전체 비용 가운데 사람에게 주는 인건비가 차지하는 비중이 유난히 크다. 많은 업체들이 캄보디아나 방글라데시처럼 임금이 상대적으로 낮은 나라에 생산 공장을 세워 두는 까닭도 바로 여기에 있다. 우리가 평소 입는 옷의 원산지 표시를 가만히 살펴보면, 이러한 숨은 생산 구조를 어렵지 않게 확인할 수 있다. 눈앞의 저렴한 가격 뒤에는 저 멀리 다른 나라에서 땀 흘려 일하는 수많은 사람들의 손길이 깃들어 있는 셈이다.</p>
          <p class="section-title">③ 6개월에서 2주로 줄어든 의류 생산 기간</p>
          <p>값이 더없이 저렴하면서도 최신 유행을 그대로 반영한 옷을 손쉽게 살 수 있게 된 또 다른 이유는, 다름 아닌 업체들 사이의 속도 경쟁이다. 과거에는 새로운 유행을 반영한 옷을 기획하고 생산하여 매장에 보기 좋게 진열하기까지 보통 여섯 달 정도의 제법 긴 시간이 걸렸다. 그러나 여러 업체들은 유행이 미처 식어 버리기 전에 서둘러 제품을 내놓아야 비로소 더 많이 팔 수 있다는 사실을 일찌감치 깨달았다. 이에 업체들은 전체 생산 과정에서 상대적으로 중요도가 낮은 단계를 과감하게 줄이거나 아예 없애고, 여러 운송 수단을 두루 활용하여 제품을 옮기는 배송 시간까지도 바짝 단축하였다. 그 놀라운 결과로, 불과 단 2주 만에 뚝딱 새 옷을 만들어 내어 매장에 선보이는 업체까지 등장하기에 이르렀다. 이처럼 최신 유행을 누구보다 빠르게 반영한 옷을 저렴한 값에 판매하는 전략은, 어느새 의류 시장의 더없이 중요한 경쟁 방식으로 확고하게 자리 잡았다. 그러나 이처럼 숨 가쁘게 빨라진 생산 속도 뒤에는, 미처 예상하지 못한 또 다른 그늘이 드리워지기 시작했다.</p>
          <p class="section-title">④ 빠른 생산 속도가 불러온 디자인 도용 문제</p>
          <p>빠르게 만들어 싸게 파는 이런 영리한 전략에 수많은 소비자들은 그야말로 열렬히 호응하였다. 최신 유행에 꼭 맞는 멋진 옷을 큰 부담 없는 저렴한 가격에 손쉽게 살 수 있으니 소비자는 더없이 만족하고, 그 많은 옷을 판매한 업체 또한 적지 않은 이익을 얻는다. 그래서 겉으로만 보면 모두에게 좋은 변화처럼 보이기도 한다. 하지만 옷을 만드는 생산 속도를 지나치게 무리하여 높이면 뜻밖의 문제가 생길 수 있다. 일부 업체는 전에 없던 새로운 디자인을 충분히 연구하고 고민할 시간을 미처 들이지 않은 채, 그저 서둘러 신상품을 내놓으려고만 한다. 그러다가 그만 다른 사람이 애써 만든 디자인을 아무런 허락도 없이 몰래 베껴서, 불법 복제품을 만들어 내는 안타까운 일이 종종 벌어지곤 한다. 실제로 세계적으로 이름난 한 의류 업체는 이러한 디자인 도용 혐의로 무려 50번이 넘게 고발을 당하고 언론으로부터 따가운 비판을 받았다고 한다. 값싼 옷의 화려한 이면에는 바로 이런 어두운 문제가 조용히 숨어 있는 것이다.</p>
          <p class="section-title">⑤ 창작자의 권리를 위협하는 불법 복제품</p>
          <p>억울하게 디자인 도용을 당한 원작자는 자신의 소중한 지적 재산권을 지키기 위해 법적으로 소송을 제기할 수 있다. 하지만 옷의 디자인에서는 완전히 독창적인 창작과 기존에 있던 디자인의 모방을 또렷이 구분해 내기가 무척 어려운 경우가 많다. 그래서 소송은 공연히 길고 복잡하게 늘어지기 쉽고, 그 과정에서 드는 비용도 결코 적지 않다. 그래서 힘없는 개인 디자이너 가운데에는 이러한 커다란 부담 때문에 아예 소송 자체를 중도에 포기해 버리는 사람도 적지 않다. 반면에 일부 몰염치한 업체는 남의 디자인을 베껴서 얻는 이익이 처벌로 입게 되는 손해보다 훨씬 더 크다고 영악하게 판단하여, 이런 잘못된 관행을 좀처럼 고치려 하지 않는다. 이런 부당한 상황이 계속 이어지면, 디자이너들은 애써 떠올린 자신의 소중한 아이디어를 제대로 보호받기 어렵고, 전에 없던 새로운 디자인을 창조해 내려는 의욕마저 점점 떨어질 수밖에 없다. 결국 빠른 유행이 불러온 뼈아픈 대가를, 정작 아무 잘못 없는 창작자가 고스란히 치르는 셈이다.</p>
          <p class="section-title">⑥ 한 해 800억 점의 옷이 만들어지는 세상</p>
          <p>옷을 지나치게 많이 생산하고 또 그만큼 많이 버리는 과정에서는 심각한 환경오염 문제도 함께 뒤따른다. 국제 환경 단체인 그린피스가 2016년에 발표한 자료에 따르면, 전 세계에서 한 해 동안 생산되는 의류는 자그마치 약 800억 점에 이른다고 한다. 당시 세계 인구가 약 75억 명이었으므로, 이는 단순히 계산해도 한 사람당 무려 열 점 넘게 고루 나눌 수 있을 만큼 어마어마한 양이다. 그러나 안타깝게도 그 가운데 약 4분의 3에 해당하는 600억 점이, 끝내 제대로 쓰이지도 못한 채 그대로 소각되거나 땅에 매립되고 만다고 한다. 한 해 동안 생산되는 옷감의 면적도 약 40만 제곱킬로미터에 달해, 이는 우리나라의 전체 국토를 무려 네 번이나 뒤덮을 수 있을 만큼 넓은 넓이다. 게다가 옷을 만드는 생산 도중에 그냥 버려지는 자투리 직물만 해도 약 6만 제곱킬로미터에 이른다. 결국 옷이 싸고 흔해지면 흔해질수록, 그만큼 소중한 자원의 낭비와 넘쳐 나는 쓰레기도 함께 늘어나는 것이다. 값싸게 산 옷 한 벌이 지구에 남기는 무거운 흔적을, 우리는 눈치채지 못하고 지나치는 셈이다.</p>
          <p class="section-title">⑦ 옷을 만들고 버리는 과정에서 발생하는 환경오염</p>
          <p>이렇게 버려지는 옷과 직물 가운데 상당수는, 안타깝게도 자연에서 좀처럼 잘 분해되지 않는 합성 섬유로 만들어진다. 원문은 그 비율을 무려 약 65퍼센트 정도로 제시하고 있다. 이런 옷을 땅속에 묻으면 아주 오랫동안 썩지 않고 그대로 남아 있고, 그렇다고 불에 태우면 몸에 해로운 유해 물질이 발생하여 소중한 환경을 오염시킬 수 있다. 그렇다고 해서 천연 섬유의 원료를 기르는 과정에 아무런 문제가 없는 것 또한 결코 아니다. 옷의 대표적인 천연 원료인 면화는 전 세계 경작지의 겨우 약 2.5퍼센트에서만 재배되지만, 원문에 따르면 놀랍게도 전 세계 살충제 사용량의 약 16퍼센트가 바로 이 면화를 재배하는 데에 쓰인다고 한다. 이렇게 뿌려진 독한 살충제가 땅속 토양에 깊이 스며들어 지하수와 강으로 흘러 들어가면, 결국 그곳에 사는 수많은 동식물의 건강까지도 심각하게 위협할 수 있다. 결국 옷을 만들고 또 버리는 그 모든 단계에서, 애꿎은 자연이 무거운 부담을 고스란히 떠안는 셈이다. 합성 섬유든 천연 섬유든 쉬운 길이 없으니, 처음부터 옷을 아껴 쓰는 지혜가 필요한 것이다.</p>
          <p class="section-title">⑧ 값싼 옷 뒤에 숨겨진 개발도상국 노동자의 희생</p>
          <p>비단 자연뿐만 아니라, 그 옷을 직접 만드는 수많은 노동자들 또한 소리 없이 고통받고 있다. 많은 업체들은 옷을 만드는 생산 비용을 조금이라도 더 낮추기 위해, 임금이 상대적으로 싼 개발도상국의 공장에 옷 제작을 맡기곤 한다. 원문에 따르면 방글라데시는 전 세계에서 두 번째로 많은 의류를 생산하고 수출하는 나라로, 당시 약 400만 명에 이르는 사람들이 의류 공장에서 고되게 일하고 있었다고 한다. 일부 업체가 무리하게 빠른 납품을 재촉하면, 힘없는 공장 노동자들은 정해진 기한을 맞추기 위해 깊은 밤늦은 시간까지 쉬지 않고 일하고 마땅히 쉬어야 할 시간마저 빼앗기고 만다. 그런데도 원문에 소개된 2014년을 기준으로, 이들 노동자가 받는 한 달 월급은 고작 약 7만 원 남짓에 지나지 않았다. 소비자가 저렴한 옷을 아무렇지 않게 손쉽게 사서 입는 바로 그동안, 저 먼 생산 현장의 노동자들은 열악한 작업 환경과 턱없이 낮은 임금을 묵묵히 감당하고 있었던 것이다. 우리가 손에 쥔 값싼 옷 한 벌의 가격 속에는, 누군가의 고된 하루와 서러운 희생이 조용히 녹아들어 있는 셈이다.</p>
          <p class="section-title">⑨ 불필요한 옷 소비를 줄여야 하는 이유</p>
          <p>이러한 여러 문제를 쉽사리 해결하기 어려운 가장 큰 이유는, 수많은 업체들이 끊임없이 더 싸고 더 빠른 옷을 내놓으려고 치열하게 경쟁하기 때문이다. 노동자의 임금을 올려 주거나 열악한 작업 환경을 개선하려면 아무래도 비용이 더 많이 들기 때문에, 일부 기업은 이러한 소중한 변화를 자꾸만 뒤로 미루기 쉽다. 그렇다면 과연 힘없는 소비자인 우리는 무엇을 할 수 있을까? 우선 무엇보다 옷을 꼭 필요한 정도 이상으로 지나치게 많이 사지 않으려는 신중한 태도가 중요하다. 혹시 그저 유행에 뒤처질까 공연히 걱정하여 비슷한 옷을 여러 벌씩 사들이거나, 몇 번 제대로 입지도 않은 멀쩡한 옷을 너무 쉽게 버린 적은 없었는지 스스로를 차분히 돌아보아야 한다. 옷을 그저 잠깐 쓰고 버리는 하찮은 일회용품이 아니라, 오래도록 아껴 입어야 할 소중한 필수품으로 여긴다면 불필요한 소비를 얼마든지 줄일 수 있다. 바로 이렇게 저마다의 소비 습관을 조금씩 바꾸어 나가는 것이야말로, 의미 있는 변화의 든든한 출발점이 된다.</p>
          <p class="section-title">⑩ 공존과 상생을 위한 윤리적인 옷 소비</p>
          <p>우리가 옷을 구매할 때에는, 과연 누가 어떤 과정을 거쳐 그 옷을 만들었는지에 대해서도 따뜻한 관심을 기울여야 한다. 혹시 다른 사람의 디자인을 함부로 도용하지는 않았는지, 또 생산 과정에서 소중한 환경을 오염시키거나 힘없는 노동자를 부당하게 대우하지는 않았는지 꼼꼼히 살펴보는 것이다. 만약 그러한 정보를 얻기가 어렵다면, 해당 기업에 생산 과정을 투명하게 공개할 것을 당당히 요구할 수도 있다. 물론 공정하게 만든 옷은 아무래도 비용이 더 들어 가격이 조금 높을 수 있지만, 그렇다고 부당한 방법으로 억지로 낮춘 값싼 가격 역시 결코 진정으로 공정하다고 보기는 어렵다. 제품에 담긴 정보를 하나하나 꼼꼼히 확인하는 일은 다소 번거롭고 성가실 수 있다. 그러나 우리가 과연 어떤 옷을 선택하느냐에 따라, 의류 산업과 그 안의 노동자, 그리고 우리가 사는 지구 환경에 미치는 영향까지도 크게 달라진다. 이제는 모두의 공존과 상생을 깊이 생각하며 한 벌의 옷을 소비할 때다. 소비자 한 사람 한 사람의 작은 선택이 모일 때, 더 공정하고 건강한 의류 산업을 만들어 갈 수 있을 것이다.</p>

          <p class="section-title">① 복제 양 돌리의 탄생과 생명 과학의 발전</p>
          <p>1996년 7월 5일, 마침내 세계 최초로 복제된 포유동물인 양 돌리가 세상에 태어났다. 이 돌리는 다 자란 어른 양의 체세포에서 얻어 낸 유전 정보를 그대로 이용하여 만들어진 놀라운 생명이었다. 이후 과학자들은 이 복제 기술을 한 걸음 더 응용하여, 사람의 유전자를 몸속에 지닌 양 폴리와 몰리까지도 잇따라 탄생시켰다. 이들은 사람의 혈액을 응고시키는 데 꼭 필요한 단백질과 관련된 유전자를 양의 젖 생산 과정에 교묘하게 연결하여, 그 젖에서 혈우병 치료에 쓰이는 귀한 물질을 얻으려는 뚜렷한 목적으로 만들어졌다. 이러한 일련의 연구는 동물 복제 기술이 장차 인간의 여러 질병을 치료하는 데에도 요긴하게 활용될 수 있다는 밝은 가능성을 생생하게 보여 주었다. 그러나 생명을 인위적으로 복제하는 기술이 눈부시게 발전하자, 전에 없던 새로운 윤리적 논쟁 또한 함께 뜨겁게 시작되었다. 과연 과학이 할 수 있는 일과 과학이 해도 되는 일은 서로 같은 것일까 하는, 결코 가볍지 않은 물음이 비로소 우리 앞에 던져진 것이다.</p>
          <p class="section-title">② 인간 배아 복제와 과학자의 연구 자유</p>
          <p>복제 양 돌리의 탄생 이후로 온갖 동물 복제 실험과 시도가 세계 곳곳으로 빠르게 확산되면서, 그 논쟁은 마침내 인간 복제의 가능성으로까지 조심스레 이어졌다. 바로 이 과정에서 무척 중요한 하나의 질문이 사람들의 머릿속에 또렷이 떠올랐다. 과연 과학자의 연구 자유는 도대체 어디까지 허용해야 마땅한 것일까? 생명 과학과 생명 공학 분야의 수많은 연구자는, 인간 배아 복제를 포함한 여러 배아 연구를 정부가 함부로 규제하면 소중한 연구의 자유가 심각하게 침해된다고 목소리 높여 주장한다. 과학의 눈부신 발전을 결코 인위적으로 가로막아서는 안 되며, 연구자라면 누구나 자유롭게 탐구할 수 있어야 한다는 것이다. 이들은 배아 복제 기술을 꾸준히 발전시키면 암과 같은 무서운 난치병의 치료 가능성을 한층 넓히고, 나아가 국가 전체의 과학 기술 경쟁력까지도 크게 높일 수 있다고 한껏 기대한다. 숱한 환자들에게 새로운 희망을 안겨 줄 수 있는 연구를 섣불리 가로막는 것이야말로 오히려 더 큰 잘못일 수 있다는 것이다.</p>
          <p class="section-title">③ 생명의 존엄성을 강조하는 복제 연구 반대론</p>
          <p>반면에 인간 배아 복제 연구에는 반드시 엄격한 사회적 규제가 필요하다는 정반대의 주장도 분명히 존재한다. 이러한 입장에서는 소중한 배아를 한낱 단순한 실험 재료로 함부로 다루어서는 결코 안 된다고 힘주어 본다. 배아를 제멋대로 조작하고 실험하며 끝내 폐기해 버리는 그 과정이, 생명에 대한 마땅한 존중을 뿌리째 훼손할 수 있기 때문이다. 또한 인간 배아 복제를 선뜻 허용하기 시작하면, 언젠가는 인간 개체 그 자체를 통째로 복제하는 위험한 기술로까지 이어질 가능성마저 있다며 깊이 우려한다. 따라서 그저 연구의 자유라는 이유 하나만으로 세상의 모든 실험을 무턱대고 허용할 수는 없으며, 돌이킬 수 없는 위험한 방향으로 치닫기 전에 반드시 제도를 통해 그 한계를 분명히 제한해야 한다고 주장한다. 결국 생명 복제를 둘러싼 이 뜨거운 논쟁의 한가운데에는, 과학 연구의 자유와 그 한계를 과연 어디에 둘 것인가라는 근본적인 문제가 묵직하게 놓여 있다. 어느 한쪽의 목소리만 옳다고 쉽게 단정하기 어려운 만큼, 우리는 두 입장을 모두 귀 기울여 들으며 깊이 고민해 보아야 한다.</p>
          <p class="section-title">④ 과학자 공동체가 지켜 온 자율성의 전통</p>
          <p>오랜 세월 동안 과학자들은 외부의 그 어떤 간섭도 없이 자유롭게 연구할 때 비로소 참된 진리에 가장 가까이 다가갈 수 있다고 굳게 믿어 왔다. 20세기 중반 무렵까지만 해도 과학자 공동체는 스스로 연구의 방향과 방법을 결정하는 소중한 자율성을 무엇보다 중요하게 여겼다. 과학이란 본래 객관적인 진리를 탐구하는 아주 특수한 영역이므로, 마땅히 정치나 사회의 온갖 통제에서 벗어나 있어야 한다는 생각이 당시 널리 퍼져 있었다. 연구의 자유가 충분히 보장되어야만 비로소 전에 없던 새로운 발견과 과학의 눈부신 진보가 가능해진다는 나름의 탄탄한 논리였다. 이러한 전통적인 믿음은 과학을 사회의 다른 여러 활동과 또렷이 구별 지어 주고, 과학자 공동체만의 독립성을 굳건히 지켜 내는 든든한 근거가 되어 주었다. 그러나 과학의 눈부신 성과가 사회 전체에 미치는 영향이 날로 커지면서, 이 오래된 믿음 또한 전에 없던 새로운 질문을 마주하게 되었다. 과학이 더 이상 세상과 동떨어진 섬이 아니라 사회와 긴밀히 맞닿아 있는 이상, 그 자유 또한 홀로 완결될 수 없게 된 것이다.</p>
          <p class="section-title">⑤ 국가의 지원과 자율성을 바탕으로 한 제1차 사회 계약</p>
          <p>저 참혹한 제2차 세계 대전을 힘겹게 거치면서, 과학과 사회 사이에는 이른바 ‘제1차 사회 계약’이라 불리는 새로운 관계가 자연스레 형성되었다. 국가는 과학이 장차 농업과 의료, 그리고 군사 분야를 눈부시게 발전시키고 나아가 공공의 이익을 크게 높여 줄 것이라고 한껏 기대하였다. 그래서 국가는 과학 연구에 넉넉하게 자금을 지원해 주는 대신, 과학자 공동체가 지닌 소중한 자율성만큼은 충분히 존중해 주기로 하였다. 연구를 일일이 직접 통제하기보다는, 오히려 자유로운 탐구를 든든하게 뒷받침해 주는 편이 훨씬 더 큰 성과를 낳는다고 현명하게 판단한 것이다. 전쟁이 끝난 이후 미국에서는 국립 과학 재단과 국립 보건 연구원과 같은 여러 정부 기관을 통해 그야말로 대규모의 연구비가 아낌없이 지원되었다. 이처럼 국가가 든든히 지원하고 과학자가 자율적으로 연구하는 방식은, 이내 다른 여러 서구 선진국에까지도 폭넓게 확산되어 갔다. 국가의 넉넉한 뒷받침과 과학자의 자유로운 탐구가 한데 어우러지면서, 전후의 과학은 그야말로 눈부신 황금기를 맞이할 수 있었다.</p>
          <p class="section-title">⑥ 헌법이 보장하는 학문과 연구의 자유</p>
          <p>연구의 자유는 오늘날 세계 여러 나라에서 법적으로도 든든하게 보호받고 있다. 우리나라의 헌법 제22조 제1항 역시 “모든 국민은 학문과 예술의 자유를 가진다.”라고 분명하게 규정하고 있다. 여기서 말하는 학문의 자유에는, 단순히 무엇을 연구할지를 선택하는 일뿐만 아니라 연구의 방법과 그 내용, 나아가 연구를 진행할 시기와 장소까지도 스스로 결정하는 자유가 두루 포함된다. 이는 곧 학문 활동이 국가 권력의 그 어떤 부당한 간섭도 받지 않아야 한다는 소중한 뜻이다. 본래 학문이란 인간이 스스로 끊임없이 질문을 던지고 참된 진리를 추구해 나가는 고귀한 정신적 활동이며, 따라서 연구자는 오직 자신의 판단과 책임에 따라 그 탐구를 꿋꿋이 이어 가야 한다. 그러므로 학문의 자유는 그저 몇몇 과학자에게만 특별히 주어지는 특혜가 결코 아니라, 헌법이 모든 국민에게 보장하는 더없이 중요한 기본권으로 이해되어야 한다. 자유로운 탐구가 보장될 때 비로소 새로운 지식이 꽃피고, 그 열매가 다시 사회 전체를 이롭게 하기 때문이다.</p>
          <p class="section-title">⑦ 연구의 자유에도 한계가 필요한 이유</p>
          <p>그렇다면 과연 헌법이 든든히 보장하는 연구의 자유는, 그 어떤 상황에서도 결코 제한할 수 없는 절대적인 권리인 것일까? 어떤 연구 때문에 전에 없던 새로운 위험이 발생하거나 애꿎은 다른 사람의 권리가 심각하게 침해될 가능성이 뚜렷이 있는데도, 그저 무조건 허용해야만 하는 것일까? 많은 법학자는 연구의 자유가 비록 민주 사회의 더없이 중요한 기본권이기는 하지만, 그렇다고 아무런 제약 없이 무제한으로 보장되는 것은 결코 아니라고 차분히 설명한다. 연구의 자유가 세상의 다른 모든 소중한 가치를 송두리째 희생시키면서까지 반드시 지켜야 할 절대적인 권리는 아니라는 뜻이다. 특히 사람의 소중한 생명과 신체, 스스로 결정할 권리, 그리고 인간으로서의 존엄성을 심각하게 해치는 연구라면, 마땅히 정당한 제한이 필요할 수 있다. 연구의 자유는 분명 존중받아야 마땅하지만, 동시에 다른 사람의 기본적인 권리와도 서로 아름답게 조화를 이루어야 한다. 나의 자유가 다른 이의 소중한 권리를 짓밟는 순간, 그것은 더 이상 올바른 자유라고 부를 수 없기 때문이다.</p>
          <p class="section-title">⑧ 과학 기술의 발전이 불러온 사회적 책임</p>
          <p>20세기 중반 이후로는 과학을 바라보는 우리 사회의 시선 또한 이전과 크게 달라지기 시작했다. 과학은 분명 인류의 생활을 눈부시게 개선해 주었지만, 한편으로는 저 끔찍한 원자 폭탄과 같은 무시무시한 대량 살상 무기를 만드는 데에 이용되기도 하였다. 또한 산업과 기술의 눈부신 발전이 때로는 인간을 소외시키고 소중한 환경을 심각하게 파괴할 수도 있다는 뼈아픈 사실마저 하나둘 드러났다. 이에 따라 과학 연구의 결과가 과연 우리 사회에 어떤 영향을 미치는지 신중하게 따져 보아야 한다는 목소리가 점점 더 크게 높아졌다. 과학자가 그저 전에 없던 새로운 지식을 발견하는 데에만 온 관심을 쏟는 것으로는 결코 충분하지 않다는 것이다. 연구의 목적과 방법, 그리고 예상되는 온갖 위험까지도 두루 살피는 윤리 의식과 사회적 책임이 그 무엇보다 중요해졌다. 과학을 그저 무조건 자유롭게 내버려 두어야 한다는 오래된 믿음에 마침내 큰 변화가 생기기 시작한 것이다. 과학이 지닌 힘이 커진 만큼, 그 힘을 어디에 어떻게 쓸 것인가에 대한 무거운 책임 또한 함께 커진 셈이다.</p>

          <p class="section-title">⑩ 과학 연구의 자유와 사회적 규제의 조화</p>
          <p>이처럼 오늘날의 과학 연구는, 더 이상 오로지 객관적인 진리만을 묵묵히 탐구하는 순수한 활동에만 머무르지 않게 되었다. 과학이 사회에 미치는 영향과 복잡한 경제적 이해관계가 날로 커지면서, 연구의 자유를 그저 절대적으로만 보장해야 한다는 생각도 차츰차츰 약해져 갔다. 그 대신 과학자 스스로의 투철한 윤리 의식과 무거운 사회적 책임을 강조하고, 꼭 필요한 경우에는 연구에 적절한 규제를 가해야 한다는 견해가 점점 더 큰 힘을 얻게 되었다. 하지만 그렇다고 해서 외부의 부당한 간섭을 굳건히 막아 내고 자유롭게 연구할 소중한 권리까지 결코 가볍게 여겨서는 안 된다. 여기서 정말로 중요한 것은, 자유와 규제라는 둘 가운데 성급하게 어느 하나만을 택하는 일이 결코 아니다. 오히려 우리 모두의 사회적 공동선을 위해 연구의 자유를 소중히 지키면서도, 동시에 생명과 존엄을 든든히 보호할 수 있는 지혜로운 균형점을 함께 찾아 가는 일이다. 자유와 책임이라는 두 날개가 고르게 어우러질 때, 비로소 과학은 인류를 더 나은 내일로 데려다줄 수 있을 것이다.</p>

          <p>우리가 눈에 보이는 사물을 그림으로 나타내는 방식은, 크게 촉각상과 시각상이라는 두 가지 개념으로 설명해 볼 수 있다. 먼저 촉각상이란, 손으로 직접 만져서 알 수 있는 사물의 실제 형태와 크기에 대한 인식을 그 바탕으로 삼은 이미지를 말한다. 예를 들어 똑같은 물건 두 개가 앞뒤로 나란히 놓이면, 눈에는 멀리 있는 물건이 상대적으로 더 작아 보이지만, 정작 손으로 만져 보면 그 실제 크기는 서로 똑같을 수 있다. 촉각상은 바로 이렇게 보는 위치에 따라 이리저리 달라지는 겉모습보다, 사물 그 자체가 지닌 변하지 않는 형태를 무엇보다 중요하게 여긴다. 반면에 시각상이란, 우리 눈에 실제로 보이는 그대로의 모습을 있는 그대로 나타낸 이미지를 말한다. 그래서 가까운 물건은 크게, 반대로 먼 물건은 작게 보이는 눈앞의 차이까지도 고스란히 표현해 낸다. 결국 이 두 가지 방식은, 과연 무엇을 더 중요하게 여겨 전달하려 하느냐에 따라 서로 달라지는 것이다. 같은 사물을 앞에 두고도 어떤 이는 눈에 비친 모습을, 또 어떤 이는 머릿속에 아는 모습을 담으려 하는 셈이다.</p>
          <p class="section-title">⑥ 고대 이집트 벽화와 우리나라 민화의 공통점</p>
          <p>저 오래된 고대 이집트의 벽화는, 눈에 실제로 보이는 모습보다 사물의 참된 형태에 대한 앎을 더 중시한 그림이라고 설명할 수 있다. 오늘날 멀고 가까움을 표현하는 원근법에 익숙한 현대인의 눈에는, 이러한 표현이 다소 어색하게 느껴질 수도 있다. 그러나 특별히 원근법을 따로 배우지 않은 사람은, 사물을 그릴 때 자신이 이미 머릿속으로 알고 있는 형태를 자연스레 드러내기 쉽다. 실제로 우리나라 민화 가운데 책거리 그림을 가만히 들여다보면, 책장이나 탁자의 앞부분과 뒷부분을 똑같은 길이로 나란히 그린 경우가 무척 많다. 만약 실제로 눈에 보이는 대로 충실히 그린다면, 멀리 있는 뒷부분은 마땅히 더 짧게 그려져야 옳다. 그런데도 우리 민화에서는 그러한 길이의 차이를 굳이 줄이지 않고 그대로 두었다. 이는 결코 그림 솜씨가 서툴러 생긴 단순한 실수가 아니라, 오히려 촉각상에 가까운 하나의 표현 방식으로 깊이 이해할 수 있다. 멀리 떨어진 두 나라의 그림이 비슷한 생각을 품고 있었다는 사실은, 사람의 눈과 마음이 지닌 공통된 성질을 새삼 돌아보게 한다.</p>
          <p class="section-title">⑦ 서양 미술에서 발전한 시각적 사실성</p>
          <p>비단 책거리 그림뿐만 아니라, 건물을 그린 여러 그림에서도 앞쪽과 뒤쪽의 길이를 서로 비슷하게 표현한 흥미로운 사례를 어렵지 않게 찾아볼 수 있다. 이러한 표현 방식은 결코 어느 특정한 지역에서만 나타나는 독특한 현상이 아니라, 세계 여러 문화권에서 두루 공통적으로 발견된다. 이는 사람이란 본래 자신이 이미 알고 있는 사물의 구조를 그림 속에 고스란히 담으려 하는 자연스러운 성향을 지녔기 때문이다. 하지만 저 고대 그리스와 르네상스 시대의 유럽에서는, 오직 눈으로 직접 보는 시각적 경험에만 철저하게 의존하여 대상을 꼼꼼히 묘사하려는 새로운 흐름이 유난히 두드러지게 나타났다. 보는 위치에 따라 시시각각 달라지는 사물의 크기와 형태를 최대한 사실적으로 재현해 내려는 것이다. 이처럼 시각적인 사실성을 무엇보다 강조하는 태도는, 이후 오랫동안 서양 미술을 대표하는 더없이 중요한 표현 특성으로 확고하게 자리 잡았다. 그렇다고 해서 이와 다른 표현 방식이 결코 틀린 것은 아니다. 이는 보이는 대로와 아는 대로의 서로 다른 선택일 뿐, 어느 하나가 옳다고 말할 수는 없는 것이다.</p>
          <p class="section-title">⑧ 미술의 목적은 눈에 보이는 것을 재현하는 것뿐일까?</p>
          <p>우리는 미술의 역할을, 그저 눈앞에 보이는 장면을 똑같이 옮겨 담는 일로만 좁게 생각해서는 결코 안 된다. 그림이란 사람들이 저마다 세상을 과연 어떻게 알고 이해하며 또 느끼는지를 생생하게 전달하는 소중한 수단이기도 하기 때문이다. 눈에 보이는 시각적 사실성을 충실히 이용하는 것은, 그러한 깊은 생각을 표현하는 수많은 방법 가운데 그저 하나일 뿐이다. 이러한 점은 저 오래된 고대 이집트 벽화를 다시 한번 찬찬히 살펴보면 한층 더 분명하게 드러난다. 이집트 벽화 속에는 얼굴과 몸을 각각 서로 다른 방향에서 본 모습으로 교묘하게 결합한 인물도 있지만, 한편으로는 정면이나 측면 가운데 어느 한 방향에서 본 모습에 가깝게 그린 인물도 함께 있다. 들에서 일하는 농부나 춤을 추는 무희처럼, 상대적으로 신분이 낮은 사람들을 묘사한 그림이 바로 그 대표적인 예다. 이렇듯 같은 벽화 안에서도 인물에 따라 표현에 차이가 나는 데에는, 분명 그럴 만한 까닭이 숨어 있었다. 하나의 그림 속에 다른 표현이 나란히 담겨 있다는 사실이야말로, 그림이 단순한 베끼기가 아님을 보여 주는 증거다.</p>
          <p class="section-title">⑨ 이집트 벽화에 담긴 신분과 세계의 질서</p>
          <p>저 오래된 고대 이집트 사람들은, 결코 모든 인물을 똑같은 하나의 방식으로만 그리지는 않았다. 들에서 일하는 농부나 흥겹게 춤추는 무희처럼 신분이 상대적으로 낮은 사람은, 눈에 실제로 보이는 모습에 가까운 시각상으로 묘사하는 경우가 적지 않았다. 반면에 위대한 파라오나 높은 귀족처럼 신분이 고귀한 인물은, 오히려 사물의 변하지 않는 실제 형태에 대한 앎을 강조하는 촉각상에 가깝게 정성껏 표현하였다. 그리고 이는 결코 단순히 그림을 그리는 기술이 부족하여 어쩔 수 없이 생긴 차이만은 결코 아니었다. 바로 고대 이집트 사람들이 사람의 신분과 이 세계의 질서를 과연 어떻게 깊이 이해하고 있었는지가, 그림의 형식 속에 고스란히 담겨 있었던 것이다. 따라서 우리가 이집트 벽화를 감상할 때에는, 단지 그것이 실제 사람과 얼마나 똑같아 보이는지만을 따질 것이 아니라, 그 표현 방식 속에 깊이 담긴 생각과 가치까지도 세심하게 읽어 내야 한다. 그림의 형식 하나하나에는 그것을 그린 사람들이 세상을 바라보던 눈길이 고스란히 새겨져 있기 때문이다.</p>

          <p>원문은 보이는 대로 그리는 일이란 결국 흘러가는 한순간의 모습을 그대로 붙잡아 두는 것이며, 그래서 끝내 사라질 수밖에 없는 모든 존재의 덧없는 운명을 은근히 드러낸다고 설명한다. 반면에 아는 대로 그리는 일은, 시간이 흘러도 결코 변하지 않는 세계의 질서를 표현하여 영원한 삶에 대한 간절한 믿음을 그 속에 담아내는 방식이 된다. 그래서 저 고대 이집트의 벽화에서는, 촉각상이 시각상보다 세계의 깊은 질서와 변치 않는 진리를 전달하는 데에 한결 더 유리한 이미지로 귀하게 여겨졌다. 결국 서양의 사실적인 초상화와 저 이집트의 오래된 벽화는, 서로 전혀 다른 목적에 따라 각기 다른 표현 방식을 신중하게 선택한 셈이다. 그러므로 하나의 그림을 온전히 이해하려면, 단지 그것이 실제와 얼마나 똑 닮았는지를 넘어서서, 과연 무엇을 보여 주려 했고 또 그 속에 어떤 세계관을 담아내려 했는지까지 깊이 살펴보아야 한다. 그렇게 바라볼 때 비로소 한 폭의 그림은, 단순한 그림을 넘어 그 시대 사람들의 마음을 들려주는 이야기가 되어 준다.</p>

          <p>이처럼 인공지능과 로봇 기술의 눈부신 발전은 분명 우리 생활을 한결 편리하게 만들어 주지만, 동시에 사람들의 기존 일자리를 심각하게 위협할 수도 있다. 만약 어떤 업무를 기계가 사람보다 훨씬 더 빠르고 정확하게 수행해 낼 수 있다면, 이윤을 좇는 기업은 당연히 그 업무를 서둘러 자동화하려 들 것이다. 그러면 그동안 오랫동안 바로 그 같은 일을 묵묵히 해 온 사람들은, 하루아침에 소중한 일자리를 잃거나 전혀 새로운 역할을 애써 찾아야 하는 딱한 상황에 내몰릴 수 있다. 특히 제2의 기계 시대에는 단순한 반복 노동뿐만 아니라, 전문적인 지식을 활용하는 고차원적인 업무마저도 자동화의 대상이 된다. 복잡하기 짝이 없는 계산은 물론이고, 흩어진 정보를 꼼꼼히 분석하고 신중하게 판단하는 일까지도 이제 로봇이 거뜬히 수행하기 시작했기 때문이다. 따라서 기술 발전이 가져오는 이러한 변화는 결코 몇몇 특정 직업에만 한정되지 않고, 머지않아 사회 전체로 널리 확산될 수 있다. 그러므로 우리는 변화를 남의 일로만 여길 것이 아니라, 누구나 마주하게 될 우리 모두의 문제로 받아들여야 한다.</p>
          <p class="section-title">④ 전문직도 피할 수 없는 인공지능과의 경쟁</p>
          <p>과거에는 전문적인 지식과 오랜 세월의 훈련이 반드시 필요한 직업만큼은 기계가 쉽사리 대신할 수 없을 것이라고 흔히들 생각했다. 그러나 인공지능이 눈부시게 발전하면서, 이러한 오래된 믿음마저도 조금씩 달라지고 있다. 기자와 의사, 약사, 변호사, 회계사, 세무사, 교수처럼 하나같이 높은 전문성이 요구되는 쟁쟁한 직업들조차도, 이제는 똑똑한 로봇과 치열하게 경쟁해야 하는 상황에 놓이게 되었다. 인공지능은 방대한 자료를 눈 깜짝할 사이에 빠르게 분석하고, 복잡한 계산을 척척 처리하며, 일정하게 정해진 기준에 따라 흔들림 없이 판단을 내릴 수 있다. 예전에는 그저 새로운 기술을 틈틈이 익히거나 재교육을 꾸준히 받는 것만으로도, 자신의 직업적인 경쟁력을 거뜬히 유지할 수 있었다. 하지만 이제는 기술이 변화하는 속도가 워낙 빨라지면서, 단순히 기존의 업무를 조금 더 잘하는 것만으로는 결코 충분하지 않을 수 있다. 전문직이라는 울타리마저 더 이상 안전한 피난처가 되어 주지 못하는 시대가, 어느새 우리 앞에 성큼 다가온 셈이다.</p>
          <p class="section-title">⑤ 단 5분 만에 지진 기사를 작성한 로봇</p>
          <p>지난 2015년 3월 30일 새벽 2시 무렵, 미국 캘리포니아주 인근에서 규모 4의 제법 큰 지진이 갑작스럽게 발생하였다. 그런데 놀랍게도 《로스앤젤레스 타임스》는 지진이 일어난 지 불과 단 5분 만에, 그와 관련된 기사를 발 빠르게 보도하였다. 이렇듯 믿기 힘들 만큼 빠른 보도가 가능했던 이유는, 바로 그 기사를 작성한 주체가 다름 아닌 ‘퀘이크봇’이라는 똑똑한 로봇이었기 때문이다. 퀘이크봇은 지진에 관한 수많은 데이터를 바탕으로 꼭 필요한 정보만을 깔끔하게 정리하여, 순식간에 기사 한 편을 뚝딱 작성해 냈다. 이처럼 지진이나 스포츠 경기의 결과, 또 증권 시황처럼 이미 정해진 데이터를 활용하는 기사는, 로봇이 누구보다 빠르게 처리할 수 있는 대표적인 분야다. 바로 이러한 사례는 그동안 오직 기자만의 고유한 업무라고 철석같이 여겨졌던 기사 작성까지도, 이제 얼마든지 자동화될 수 있음을 분명하게 보여 준다. 사람만이 할 수 있다고 믿었던 글쓰기의 영역마저 기계가 넘보기 시작했다는 사실은, 우리에게 적지 않은 놀라움을 안겨 준다.</p>
          <p class="section-title">⑥ 기사 작성 로봇이 보여 준 직업의 미래</p>
          <p>이러한 기사 작성 로봇은 이미 세계 여러 언론 기관에서 요긴하게 활용되고 있다. 에이피통신과 같은 세계적인 주요 언론 기관에서도, 로봇이 방대한 데이터를 바탕으로 수많은 기사를 척척 작성해 내고 있다. 우리나라 국내에서도 기사 작성 로봇은 어느새 단순한 실험 단계를 훌쩍 넘어서서, 사람이 직접 쓴 기사와 좀처럼 구별하기 어려울 정도로 매끄러운 글을 척척 만들어 내고 있다. 과거에는 한 사람의 기자가 오랜 기간에 걸쳐 고된 훈련을 받아야 비로소 기사를 작성할 수 있었지만, 이제는 그 일부 업무를 로봇이 대신 처리해 준다. 그렇다고 해서 이것이 곧 기자라는 직업이 반드시 완전히 사라진다는 뜻은 결코 아니다. 다만 하나의 직업을 구성하는 여러 가지 업무 가운데 일부가 자동화되면서, 앞으로 사람이 직접 담당해야 할 역할이 크게 달라질 수 있다는 의미다. 그리고 다른 여러 전문직 또한 이와 비슷한 변화를 머지않아 경험하게 될 수 있다. 중요한 것은 변화 앞에서 무작정 두려워하기보다, 달라지는 역할을 슬기롭게 받아들이고 사람만이 할 수 있는 일을 새롭게 찾아 나가는 지혜인 것이다.</p>
          <p class="section-title">⑦ 새로운 기술을 적극적으로 받아들이는 자세</p>
          <p>빠르게 변화하는 직업 세계에 슬기롭게 적응하기 위한 첫 번째 방법은, 무엇보다 최신 기술을 두려움 없이 적극적으로 받아들이는 것이다. 인공지능과 로봇, 그리고 여러 자동화 기술이 과연 어떤 원리로 작동하며 또 자신의 업무에 구체적으로 어떻게 활용될 수 있는지를 끊임없이 탐구해야 한다. 예를 들어 의사가 더없이 정교한 수술에 수술용 로봇을 능숙하게 활용하듯이, 누구나 자신의 전문 분야에 새로운 기술을 슬기롭게 접목할 방법을 부지런히 찾아야 한다. 로봇이 사람보다 더 정확하고 빠르게 수행할 수 있는 업무는 과감하게 로봇에게 맡기고, 정작 사람은 전에 없던 새로운 문제를 발견하고 그것을 창의적으로 해결하는 일에 온전히 집중할 수 있다. 여기서 정말로 중요한 것은, 로봇과 똑같은 일을 두고 소모적으로 경쟁하는 데에만 머무르지 않는 것이다. 오히려 발전한 기술을 슬기롭게 활용하여, 이전에는 미처 없었던 새로운 가치와 역할을 스스로 만들어 내야 한다. 로봇을 두려운 경쟁자가 아니라 든든한 동반자로 여길 때, 비로소 우리는 기술이 열어 준 새로운 기회를 온전히 누릴 수 있을 것이다.</p>
          <p class="section-title">⑧ 평생 학습과 재교육이 필요한 이유</p>
          <p>변화하는 직업 세계에 적응하기 위한 두 번째 방법은, 평생토록 끊임없이 배우고 새로운 능력을 꾸준히 익혀 나가는 것이다. 한평생 단 하나의 직장에서 똑같은 일만 하며 살아갈 수 있다는 오래된 기대가 점점 약해져 가는 오늘날의 시대에는, 무엇보다 지속적인 학습과 꾸준한 재교육이 참으로 중요하다. 지금 당장은 자신의 분야에서 최신 기술을 누구보다 능숙하게 활용한다고 하더라도, 얼마 지나지 않아 그보다 훨씬 더 발전된 새로운 기술이 불쑥 등장할 수 있기 때문이다. 따라서 한 번 배워 둔 지식에만 안일하게 의존해서는, 숨 가쁘게 변화하는 직업 환경에 결코 제대로 적응하기 어렵다. 그러므로 늘 새로운 기기와 낯선 업무 방식을 부지런히 배우고, 필요하다면 지금까지와는 전혀 다른 분야에까지도 용감하게 도전할 준비를 갖추어야 한다. 배움이란 결코 학교를 졸업하면 그것으로 끝나 버리는 활동이 아니라, 긴 직업 생활 내내 쉼 없이 이어지는 기나긴 과정이다. 그래서 다가올 미래에는 평생 학습자로서의 열린 태도가 그 무엇보다 중요한 경쟁력이 된다.</p>
          <p class="section-title">⑨ 예측하기 어려운 미래에 필요한 유연성</p>
          <p>불확실한 미래의 직업 세계에서 또 하나의 몹시 중요한 능력은, 바로 어떤 상황에도 부드럽게 대응하는 유연성이다. 기술이 눈부시게 빠른 속도로 발전하면, 우리가 지금까지 미처 알지 못했던 전혀 새로운 환경이 언제 어디서든 불쑥 나타날 수 있다. 오래도록 익숙하던 업무가 하루아침에 사라지거나 직업의 역할 자체가 크게 달라질 때, 만약 기존의 방식만을 끝까지 고집한다면 변화에 슬기롭게 적응하기가 몹시 어려워진다. 반대로 전혀 낯선 새로운 상황을 기꺼이 받아들이고 또 다른 가능성을 부지런히 탐색하는 사람은, 남들이 보지 못하는 새로운 길을 어렵지 않게 발견해 낼 수 있다. 돌이켜 보면 인류는 지금까지 수없이 많은 어려움에 거듭 부딪혀 왔지만, 그때마다 늘 창의적인 방법을 찾아내어 끝끝내 문제를 해결해 왔다. 그리고 앞으로도 이처럼 유연한 태도는 여전히 더없이 중요하다. 불확실한 미래를 그저 막연히 두려워하기보다, 새로운 기술과 환경을 부지런히 배우고 자신의 능력을 끊임없이 변화시키려는 열린 자세가 반드시 필요하다.</p>
          <p class="section-title">⑩ 로봇 시대에도 중요한 좋은 동료의 가치</p>
          <p>끝으로 무엇보다 중요한 것은, 다른 사람들이 진정으로 함께 일하고 싶어 하는 그런 사람이 되는 것이다. 아무리 인공지능과 로봇이 눈부시게 발전하더라도, 수많은 업무에서 가장 마지막 최종적인 결정과 전체를 아우르는 관리의 책임만큼은 여전히 사람에게 고스란히 남을 수 있다. 함께 일하는 동료를 진심으로 존중하고 맡은 바에 책임감 있게 행동하며 서로 기꺼이 협력하는 능력은, 아무리 뛰어난 기술만으로도 좀처럼 대신하기 어려운 소중한 가치다. 설령 누군가가 깊은 전문 지식과 뛰어난 기술을 두루 갖추었다고 하더라도, 정작 다른 사람과 원만하게 협력하지 못한다면 결코 좋은 동료가 되기 어렵다. 그러므로 다가올 미래의 직업 세계에서는, 단지 기술을 능숙하게 활용하는 능력뿐만 아니라 한 사람의 인격과 성숙한 태도까지도 더욱 중요해질 것이다. 결국 우리는 끊임없이 새로운 기술을 배우면서도, 동시에 인간다운 따뜻한 품성과 서로 협력하는 자세를 함께 소중히 길러 나가야 한다. 기계가 아무리 발전해도 끝내 대신할 수 없는 것은, 바로 사람과 사람 사이에 오가는 신뢰와 따뜻한 마음이기 때문이다.</p>

          <p>사람은 시각과 청각, 후각, 미각, 촉각이라는 다섯 가지 소중한 감각을 통해 자신을 둘러싼 세상을 폭넓게 인식한다. 이 다섯 가지 감각 가운데에서도 특히 시각은 유난히 중요한 역할을 맡고 있다. 원문에서는 우리가 날마다 받아들이는 수많은 정보의 무려 약 80퍼센트가량이 바로 이 시각에 크게 의존한다고 자세히 설명한다. 우리는 눈으로 참으로 많은 것을 직접 확인하며 살아가기에, 자연스럽게 눈에 보이는 정보를 굳게 신뢰하곤 한다. 그러나 두 눈을 멀쩡히 뜨고 있다고 해서, 우리가 눈앞의 모든 것을 빠짐없이 다 알아차리는 것은 결코 아니다. 똑같은 하나의 장면을 함께 보더라도, 어떤 사람은 그 속에서 중요한 대상을 또렷이 발견하는가 하면, 또 다른 사람은 그것이 거기에 있었다는 사실조차 까맣게 모를 수도 있다. 그렇다면 과연 우리가 보고 있다고 굳게 믿는 이 세상은, 실제 모습과 얼마나 똑같은 것일까? 눈에 비친 것이 곧 진실이라는 우리의 오랜 믿음은, 어쩌면 생각만큼 그리 든든하지 않은 것일지도 모른다.</p>
          <p class="section-title">② 농구공 패스 횟수를 세는 특별한 실험</p>
          <p>지난 1999년, 심리학자인 대니얼 사이먼스와 크리스토퍼 차브리스는 사람의 시각과 주의력 사이의 흥미로운 관계를 알아보는 기발한 실험 하나를 세상에 발표하였다. 연구진은 우선 여러 학생들을 흰옷을 입은 조와 검은 옷을 입은 조, 이렇게 두 무리로 나누어 농구공을 저마다 서로 주고받게 하였다. 그런 다음 약 1분가량 촬영한 그 영상을 실험에 참여한 참가자들에게 차분히 보여 주었다. 참가자들이 받은 지시는 뜻밖에도 아주 간단한 것이었다. 검은 옷을 입은 사람들의 움직임은 깨끗이 무시하고, 오직 흰옷을 입은 사람들이 공을 과연 몇 번이나 주고받는지만 꼼꼼히 세어 보라는 것이었다. 대부분의 참가자들은 지시에 충실히 따라 패스 횟수를 세는 데 어렵지 않게 성공하였다. 일부는 너무도 간단한 과제라며, 도대체 이 실험의 진짜 목적이 무엇인지 몹시 의아해하기도 하였다. 그러나 사실 연구진이 정말로 알아보려던 것은 전혀 다른 곳에 따로 숨어 있었다. 참가자들이 패스 횟수에 온 신경을 쏟는 바로 그 순간, 진짜 실험은 그들도 모르는 사이에 이미 시작되고 있었던 것이다.</p>
          <p class="section-title">③ 눈앞의 고릴라를 보지 못한 사람들</p>
          <p>사실 농구공을 한창 주고받는 그 영상 한가운데에는, 뜻밖의 놀라운 장면 하나가 몰래 숨어 있었다. 바로 커다란 고릴라 의상을 뒤집어쓴 사람이 불쑥 등장하여 천천히 걸어가다가, 두 손으로 가슴을 쿵쿵 두드리고는 유유히 화면 밖으로 사라진 것이다. 이 고릴라는 무려 약 9초라는 결코 짧지 않은 시간 동안 화면에 또렷이 나타나 있었다. 그런데 놀랍게도 패스 횟수를 세던 참가자들 가운데 약 절반가량은, 그 고릴라가 버젓이 등장했다는 사실조차 전혀 알아차리지 못하였다. 반면에 나머지 참가자들은 고릴라를 금세 발견하고는 그 엉뚱한 등장에 깜짝 놀라기도 하였다. 고릴라를 보지 못한 사람에게 똑같은 영상을 다시 한번 보여 주자, 어떤 이는 처음 보았던 영상에는 분명 고릴라가 없었다며 혹시 다른 영상을 보여 준 것 아니냐고 되레 의심하기까지 하였다. 두 눈앞에 그토록 분명히 있었던 고릴라가, 과연 왜 일부 사람들에게는 전혀 보이지 않았던 것일까? 이 놀라운 결과는 우리가 눈으로 본다는 것의 의미를 처음부터 다시 생각해 보게 만든다.</p>
          <p class="section-title">④ 보고도 알아차리지 못하는 무주의 맹시</p>
          <p>연구진은 이처럼 신기한 현상을 가리켜 ‘무주의 맹시’라고 이름 붙였다. 이는 눈이나 시력 자체에 어떤 문제가 있어서 대상을 보지 못하는 현상과는 분명히 다르다. 다시 말해, 눈으로 분명히 들어온 정보가 있더라도 그 대상에 미처 주의를 기울이지 않으면, 우리가 의식적으로 그것을 또렷이 알아차리지 못할 수 있다는 뜻이다. 실험 속 참가자들은 오로지 흰옷을 입은 사람들의 패스 횟수를 정확하게 세는 일에만 온 신경을 집중하고 있었다. 그리고 바로 그 과정에서, 패스와는 아무런 관계도 없던 뜻밖의 고릴라는 그만 인식의 대상에서 통째로 빠져 버리고 만 것이다. 이처럼 사람이 지닌 주의력에는 분명한 한계가 존재한다. 어떤 하나의 과제에 깊이 몰두하여 집중하다 보면, 다른 중요한 정보가 바로 눈앞 시야에 버젓이 들어오더라도 그만 놓쳐 버릴 수 있다. 따라서 우리가 무엇을 보았는지는, 단순히 눈앞에 과연 무엇이 있었는지만으로 결정되는 것이 결코 아니다. 그보다는 우리가 그 순간 과연 무엇에 마음을 두고 있었는지가, 본 것과 보지 못한 것을 가르는 더 중요한 열쇠인 셈이다.</p>
          <p class="section-title">⑤ 관심과 감정에 따라 달라지는 시각</p>
          <p>이러한 무주의 맹시는 결코 특별한 실험실 안에서만 나타나는 신기한 일이 아니다. 예를 들어 사랑하는 사람과 막 실연한 사람은, 거리에서 유독 행복해 보이는 다정한 연인들이 유난히 더 자주 눈에 띈다고 느낄 수 있다. 또 오랜만에 만난 아버지의 부쩍 늙으신 모습에 마음이 쓰인 날에는, 길에서 마주치는 노인들의 모습이 평소보다 한결 더 눈에 들어오기도 한다. 그렇다고 해서 바로 그날 갑자기 거리에 연인이나 노인이 부쩍 많아진 것은 결코 아니다. 사실 이전에도 그와 비슷한 장면들은 늘 우리 주변에 있었지만, 그저 거기에 아무런 관심을 두지 않아 미처 알아차리지 못했을 가능성이 훨씬 크다. 결국 우리 마음속에 품은 생각과 그때그때의 감정이, 우리의 주의를 끄는 대상을 슬그머니 바꾸어 놓는 것이다. 마치 고릴라가 그 영상 속에 처음부터 버젓이 있었던 것처럼, 이 넓은 세상에는 우리가 미처 보지 못한 채 무심코 지나치는 것들이 참으로 많다. 어쩌면 우리는 저마다의 관심이라는 좁은 창을 통해, 세상의 아주 작은 조각만을 바라보며 살아가는지도 모른다.</p>
          <p class="section-title">⑥ 눈이 아니라 뇌가 세상을 인식하는 과정</p>
          <p>우리는 흔히 두 눈으로 세상을 본다고 아무렇지 않게 말하지만, 사실 눈에 들어온 시각 정보를 실제로 해석해 내는 곳은 다름 아닌 우리의 뇌다. 밝은 빛이 눈 속으로 들어오면, 눈 안쪽 망막에 자리한 수많은 시각 세포가 그 빛의 자극을 재빠르게 전기적인 신호로 바꾸어 낸다. 그리고 이렇게 만들어진 신호는 가느다란 시신경을 거쳐, 머리 뒤통수 쪽에 자리하고 있는 뇌의 시각 피질로 차곡차곡 전달된다. 바로 그곳에서 전달받은 정보가 꼼꼼히 처리되어야만, 우리는 비로소 어떤 대상을 또렷이 보았다고 느끼게 된다. 따라서 눈은 그저 빛을 받아들이는 하나의 통로일 뿐이고, 정작 그 정보를 바탕으로 눈앞에 무엇이 있는지를 판단하는 역할은 온전히 뇌가 맡고 있는 셈이다. 그래서 설령 눈이 아무리 멀쩡하더라도, 만약 뇌의 정보 처리 과정에 문제가 생기면 사물을 제대로 인식하기가 몹시 어려워질 수 있다. 결국 우리가 날마다 경험하는 이 생생한 시각 세계는, 눈과 뇌가 서로 힘을 합하여 함께 만들어 내는 결과인 셈이다.</p>
          <p class="section-title">⑦ 시각 피질의 여러 영역이 협력하는 원리</p>
          <p>우리 뇌의 시각 피질은 결코 하나의 단순한 영역이 아니라, 저마다 다른 여러 부분이 서로 긴밀하게 협력하는 무척 복잡한 체계다. 원문에 따르면, 지금까지 알려진 영역만 해도 무려 약 30개에 이른다고 한다. 그 가운데 V1과 V2 영역은 선과 경계, 모서리 같은 가장 기본적인 시각 정보를 처리하고, V3 영역은 사물의 전체적인 형태를 구성하는 데에 주로 관여한다. 또한 V4 영역은 다채로운 색을, 그리고 V5 영역은 사물의 움직임을 처리하는 데에 저마다 중요한 역할을 맡는다. 이 여러 영역들은 각자 따로따로 일하는 데에만 그치지 않고, 서로의 정보를 촘촘하게 연결하여 하나의 장면을 온전하게 이해하도록 돕는다. 이는 마치 여러 악기가 정확한 박자에 맞추어 함께 연주해야 비로소 조화로운 음악이 아름답게 만들어지는 오케스트라와도 꼭 닮았다. 우리가 날마다 자연스럽게 바라보는 평범한 풍경 하나도, 사실은 뇌의 이 여러 영역이 한꺼번에 함께 작동한 놀라운 결과인 것이다. 눈 깜짝할 사이에 이루어지는 이 복잡한 과정을 알고 나면, 바라보는 일 하나조차 간단하지 않음을 깨닫게 된다.</p>
          <p class="section-title">⑧ 뇌의 기능이 달라지면 보이는 세상도 달라진다</p>
          <p>만약 뇌의 여러 시각 영역들이 서로 제대로 협력하지 못하게 되면, 우리는 똑같은 하나의 장면마저도 전혀 다르게 경험할 수 있다. 원문은 만약 색을 처리하는 V4 영역에 문제가 생기면, 원래는 색맹이 결코 아니었던 사람조차도 세상을 온통 흑백으로만 보게 될 수 있다고 설명한다. 또한 움직임을 처리하는 V5 영역이 손상되면, 빠르게 내달리는 자동차의 움직임을 제대로 알아차리기가 몹시 어려워질 수 있다고 한다. 바로 이러한 사례들은 무언가를 보는 일이란 단순히 눈에 빛이 들어오는 과정만으로 끝나는 것이 결코 아님을 생생하게 보여 준다. 우리 뇌는 사물의 형태와 색, 움직임 등 여러 가지 정보를 각각 나누어 꼼꼼히 처리한 뒤, 마침내 그것들을 하나로 종합해 낸다. 그래서 그 여러 영역 가운데 어느 한 부분의 기능이라도 달라지면, 우리가 받아들이는 세계의 모습 또한 사뭇 달라질 수 있다. 결국 시각이란 눈의 능력인 동시에, 뇌의 섬세한 해석 능력이기도 한 셈이다. 우리가 보는 세상은 눈이 받아들인 그대로가 아니라, 뇌가 정성껏 빚어낸 하나의 해석인 것이다.</p>
          <p class="section-title">⑨ 뇌가 정보를 선택하고 무시하는 이유</p>
          <p>이 넓은 세상에는 우리가 눈으로 받아들여야 할 정보가 너무나도 많아서, 사실 뇌가 그 모든 것을 하나도 빠짐없이 다 처리하기란 무척 어려운 일이다. 그래서 우리 뇌는 그 가운데 정말로 중요한 정보에만 집중하고, 나머지 정보는 적절히 과감하게 무시해 버리는 영리한 전략을 사용한다. 이를테면 우리는 벽 뒤로 쥐의 가느다란 꼬리 끝만 살짝 보여도, 어렵지 않게 쥐 전체의 모습을 머릿속에 생생히 떠올릴 수 있다. 눈으로 들어온 부족한 정보를, 그동안 쌓아 온 과거의 경험과 지식으로 알아서 척척 채워 넣는 것이다. 그러나 과연 무엇을 더 중요하게 여기는지는, 그때그때의 상황과 저마다의 관심에 따라 얼마든지 달라진다. 이는 비단 보는 일뿐만 아니라 소리를 듣는 일 또한 꼭 비슷하다. 다른 생각에 깊이 빠져 있는 아이는 부모의 말을 분명히 듣고도 그 내용을 제대로 알아차리지 못할 수 있다. 이는 일부러 무시했다기보다, 그저 주의가 온통 다른 곳에 쏠려 버린 결과일 수 있는 것이다. 그러므로 상대의 주의를 먼저 끄는 일이 원활한 소통에 큰 도움이 된다.</p>
          <p class="section-title">⑩ 내가 본 세상이 반드시 옳은 것은 아니다</p>
          <p>그 유명한 고릴라 실험은, 우리가 눈으로 분명히 본 것을 언제나 완전하게 인식하는 것은 결코 아니라는 중요한 사실을 일깨워 준다. 사람의 뇌는 눈앞에 쏟아지는 수많은 정보 가운데 오직 일부만을 골라 선택하고, 또 저마다의 경험과 관심에 따라 그 의미를 제각기 다르게 해석한다. 그러므로 설령 똑같은 장소에서 똑같은 장면을 함께 보았더라도, 사람마다 서로 전혀 다른 내용을 기억하거나 서로 다른 판단을 내릴 수 있다. 따라서 단지 자신의 두 눈으로 직접 확인했다는 이유 하나만으로, 그 판단이 반드시 옳다고 성급하게 단정 지어서는 결코 안 된다. 마찬가지로 다른 사람이 자신과 다르게 보았다고 해서, 곧바로 그것이 틀렸다며 함부로 비난할 일도 결코 아니다. 우리는 모두 저마다 미처 보지 못한 부분이 얼마든지 있을 수 있음을 겸허히 인정해야 한다. 바로 이러한 열린 태도야말로, 서로의 다른 관점을 깊이 이해하고 불필요한 다툼을 줄여 나가는 소중한 출발점이 된다. 내가 보지 못한 것을 다른 사람이 보았을 수 있다고 인정하는 겸손함 속에서, 우리는 더 넓은 세상을 바라볼 수 있다.</p>

          <p>일제가 우리 조선을 강제로 병합한 뒤, 조선 총독부는 자신들의 식민 통치를 한껏 과시하기 위한 거대한 새 청사의 건립을 서둘러 추진하였다. 그런데 그들이 청사를 세울 부지로 기어이 선택한 곳은, 다름 아닌 조선 왕조의 중심 궁궐인 경복궁의 넓은 앞뜰이었다. 사실 경복궁의 안타까운 훼손은 그보다 훨씬 이전부터 이미 서서히 진행되고 있었다. 1910년 5월 15일 자 「대한매일신보」는 「경복궁이 없어지네」라는 가슴 아픈 제목의 기사를 실었다. 그 기사에 따르면, 5월 10일에 궁내부는 경복궁 안에 공원을 만든다는 그럴듯한 핑계를 대며 소중한 전각 4,000여 칸을 통째로 경매에 내놓았다고 한다. 여기에는 조선인과 일본인 80여 명이 참여하였고, 결국 약 10명에게 그 전각들이 뿔뿔이 팔려 나갔다. 이처럼 궁궐의 소중한 건물들이 사방으로 흩어지는 가운데, 총독부 청사의 공사는 유서 깊은 경복궁의 본래 모습을 더욱 크게 바꾸어 놓고 말았다. 오백 년 왕조의 숨결이 서린 궁궐이 하루아침에 헐려 나가는 모습을, 당시 백성들은 그저 가슴 치며 바라볼 수밖에 없었다.</p>

          <p class="section-title">⑦ 설의식의 고별사에 담긴 민족의 슬픔과 저항</p>
          <p>광화문의 해체가 본격적으로 시작되기 바로 전, 「동아일보」의 문화부 기자였던 설의식은 「헐려 짓는 광화문」이라는 제목의 애끓는 고별사를 써 내려갔다. 그는 광화문을 그저 돌과 나무로 이루어진 하나의 단순한 건물이 아니라, 무려 오백 년이라는 긴 세월의 역사를 고스란히 간직한 살아 있는 존재로 애틋하게 그려 냈다. 전국 방방곡곡에서 모여든 귀한 석재와 목재, 그리고 그것을 쌓아 올린 수많은 백성의 땀과 눈물이 바로 그 안에 깊이 배어 있다고 절절히 호소하였다. 충신과 역적, 또 개화와 수구를 외치던 숱한 인물들이 쉼 없이 드나들고, 머나먼 외국에서 온 사절과 귀한 손님들이 지나다닌 자리도 바로 이 광화문이었다. 설의식은 광화문이 본래의 제자리와 올바른 방향을 떠나는 순간, 그것이 지닌 소중한 생명과 고유한 역할마저 함께 잃고 만다고 뼈아프게 보았다. 그의 애절한 글은 곧 소중한 문화유산의 훼손을 향한 깊은 분노이자, 가혹한 일제의 정책에 맞선 글을 통한 뜨거운 저항이었다. 총칼로 맞설 수 없던 시대에, 그는 한 편의 글로써 민족의 아픔을 세상에 널리 알리고 외쳤던 것이다.</p>
          <p class="section-title">⑧ 광복 이후에도 계속된 조선 총독부 건물 논쟁</p>
          <p>마침내 1945년 8월, 그토록 염원하던 광복을 맞이하였지만, 일제가 세운 거대한 조선 총독부 건물은 안타깝게도 곧바로 사라지지 않았다. 이 건물은 어느새 ‘중앙청’이라는 새 이름으로 바뀌어 한동안 정부의 청사로 쓰였고, 1986년에는 대대적인 보수 작업을 거쳐 국립 중앙 박물관으로 새롭게 문을 열기까지 하였다. 그렇게 시간이 흐르면서, 이 건물을 과연 어떻게 처리해야 옳은지를 둘러싼 뜨거운 논쟁이 끊임없이 이어졌다. 한편에서는 일제의 식민 지배를 생생히 상징하는 치욕적인 건물이므로, 하루빨리 철거하여 비뚤어진 역사를 바로 세워야 한다는 주장이 힘을 얻었다. 그러나 반대로 비록 아픈 역사일지라도 그 또한 엄연한 우리의 역사인 만큼, 건물을 그대로 남겨 두어 후대에 뼈아픈 교훈으로 보여 주어야 한다는 신중한 의견도 만만치 않게 제기되었다. 이 논쟁은 결국 지나간 과거의 상처를 어떻게 기억하고 또 어떻게 다루어야 하는가에 관한, 우리 사회의 깊고 묵직한 고민이었다. 역사를 지우는 것이 옳은지 남겨 되새기는 것이 옳은지에 대한 물음은, 지금도 답하기 어려운 과제로 남아 있다.</p>

          <p>오랜 세월에 걸친 치열한 논쟁 끝에, 마침내 1995년에 이르러 일제가 세운 조선 총독부 건물이 완전히 철거되었다. 그 이후로는 일제에 의해 처참히 훼손되었던 경복궁의 소중한 공간을 본래대로 되살리는 복원 사업도 차근차근 함께 진행되었다. 광화문을 본래의 올바른 위치와 방향에 정확히 맞추어 반듯하게 바로 세우려는 노력은, 2006년에 이르러 비로소 본격적인 복원 공사로 이어지게 되었다. 그리고 마침내 2010년, 오랜 기다림 끝에 새롭게 복원된 광화문이 그 당당한 모습을 다시 세상에 드러냈다. 이는 결코 단지 오래된 건축물 하나를 새로 지어 올리는 단순한 일이 아니었다. 일제 강점기에 억울하게 제자리에서 밀려났던 궁궐의 정문을 반듯하게 바로잡고, 처참히 훼손되었던 역사적 공간의 참된 의미를 되찾아 가는 뜻깊은 과정이었다. 광화문이 다시 제자리에 서기까지 걸린 그 긴 시간은, 소중한 문화유산을 지키고 되살리는 일이 과연 얼마나 어렵고 더딘지를 생생하게 보여 준다. 잃은 것을 되찾기란 처음 지키는 것보다 훨씬 힘든 법이니, 가진 것을 소중히 여겨야 하는 까닭도 여기에 있다.</p>

          <p>광화문은 경복궁의 당당한 얼굴이자, 우리나라를 대표하는 더없이 소중한 역사적 상징물이다. 머나먼 조선 시대에는 위엄 있는 왕궁의 정문으로서 수많은 사람과 숱한 사건을 묵묵히 맞이하였고, 가혹한 일제 강점기에는 모진 식민 통치의 압박 속에서 본래의 자리와 그 당당한 모습을 모두 잃고 말았다. 그리고 그토록 바라던 광복을 맞이한 뒤에도, 오랜 논쟁과 더딘 복원의 과정을 힘겹게 거쳐야만 하였다. 그래서 광화문을 지킨다는 것은, 그저 낡고 오래된 건물 하나를 보존하는 일만을 뜻하는 것이 결코 아니다. 그것은 바로 그 안에 깊이 담긴 우리 민족의 유구한 역사와 소중한 기억을 다음 세대로 면면히 이어 가는 일이기도 하다. 설의식을 비롯한 수많은 사람들이 광화문의 해체를 그토록 슬퍼하고 아파한 까닭도, 바로 여기에 깊이 있었다. 앞으로 그 어떤 변화와 어려움이 또다시 찾아오더라도, 우리는 광화문에 깃든 역사의 숨결을 결코 잊지 말고 기억하여 다음 세대에 고스란히 전해 주어야 한다. 과거를 기억하는 그 마음이야말로, 같은 아픔을 되풀이하지 않게 지켜 주는 든든한 울타리가 될 것이다.</p>

          <p class="section-title">⑤ 청소년 퀴즈 프로그램으로 전한 한국의 상처</p>
          <p>박흥신 대사는 프랑스 측에 한국 국민이 느끼는 깊은 상처를 생생하게 설명하기 위해, 뜻밖의 흥미로운 이야기 하나를 꺼내 들었다. 그가 파리에 부임하기 바로 전, 우연히 텔레비전에서 청소년 대상의 퀴즈 프로그램을 보게 되었는데, 마침 프랑스가 1866년 병인양요 때 약탈해 간 소중한 도서가 과연 무엇인지를 묻는 문제가 떡하니 나왔다는 것이다. 그는 이처럼 어린 청소년을 대상으로 한 방송에까지 버젓이 등장할 만큼, 외규장각 의궤 문제가 한국 사회 전체에 얼마나 깊이 각인되어 남아 있는지를 힘주어 강조하였다. 그러면서 한국 사람들이 아무리 프랑스를 좋아하고 가깝게 여기더라도, 소중한 문화재를 끝내 돌려주지 않는 현실은 결국 프랑스의 국가 이미지에 결코 좋지 않은 영향을 줄 수밖에 없다고 날카롭게 지적하였다. 이는 곧 의궤의 반환이 단순한 문화재 분쟁을 훌쩍 넘어, 두 나라의 미래 관계와 깊은 신뢰에까지 맞닿아 있는 중대한 문제임을 일깨우려는 의미 있는 발언이었다. 딱딱한 논리만을 내세우는 대신 상대의 마음에 와닿을 이야기를 들려준 것은, 협상을 부드럽게 이끄는 방법이었다.</p>
          <p class="section-title">⑥ 문화재 대신 영원한 감사를 받으라는 설득</p>
          <p>이어 한국 측은 2001년의 의궤 맞교환안이 과연 왜 국내에서 그토록 강한 반발을 불러일으켰는지에 대해서도 차분히 설명하였다. 외규장각 의궤는 그 하나하나가 모두 더없이 소중한 유산인데, 정작 프랑스에 있는 의궤를 돌려받기 위해 한국에 남아 있는 또 다른 의궤를 내주는 일은 마치 귀한 장남을 구하기 위해 애꿎은 차남을 인질로 내주는 것과 다를 바 없다는 뼈아픈 비판이 있었다는 것이다. 박흥신 대사는 왕실의 소중한 유산을 끝내 지켜 내지 못했다는 깊은 자책감과, 저 가슴 아픈 일제 강점기의 상처까지 겹겹이 겹친 한국 국민의 복잡한 정서를 부디 깊이 이해해 달라고 간곡히 요청하였다. 그러면서 그는 아무런 대가도 요구하지 말고 먼저 의궤를 선뜻 돌려준 뒤, 그 대신 한국 국민의 영원토록 변치 않을 깊은 감사와 두터운 우정을 받으라고 넌지시 제안하였다. 그는 바로 그러한 통 큰 결단이 오히려 두 나라의 관계를 한층 더 굳건하게 만들어 주는 든든한 토대가 될 것이라고 진심으로 설득하였다. 눈앞의 이익보다 상대의 아량을 믿고 기대는 제안은, 협상에 돌파구를 열 신선한 발상이었다.</p>
          <p class="section-title">⑦ 2010년 6월, 의궤 297권의 일괄 반환 요구</p>
          <p>2010년 6월, 두 번째 공식 협상이 이번에는 한국 측 대사관에서 새롭게 열리게 되었다. 프랑스는 외규장각 의궤를 여러 개의 묶음으로 나누어 그중 일부만을 먼저 한국에 가져가 전시하고, 일정한 기간이 지나고 나면 또 다른 묶음으로 차례차례 교체하는 방안을 새로이 제시하였다. 이는 곧 의궤를 조금씩 돌려 가며 번갈아 보여 주겠다는 다소 어정쩡한 제안이었다. 한국 측은 이러한 방식이 결코 근본적인 해결책이 될 수 없다고 분명히 판단하였지만, 그래도 어디까지나 외교 협상인 만큼 상대의 설명을 끝까지 차분히 경청하였다. 그런 다음 외규장각 의궤 297권은 결코 나눌 수 없는 하나의 전체로서 다루어야 한다는 확고한 원칙을 분명하게 밝혔다. 이는 모든 의궤가 똑같은 장소에서 똑같은 시각에 프랑스군에게 한꺼번에 약탈당했으므로, 결코 낱권이나 묶음으로 뿔뿔이 분리하지 말고 반드시 전부를 한꺼번에 돌려받아야 한다는 단호한 입장이었다. 한 가족이 함께 끌려갔다면 마땅히 함께 돌아와야 하듯, 흩어진 반환은 결코 온전한 귀환이 될 수 없었던 것이다.</p>
          <p class="section-title">⑧ 문화재 반환의 선례를 우려한 프랑스</p>
          <p>안타깝게도 두 번째 협상을 거친 이후에도, 두 나라의 입장은 좀처럼 쉽게 좁혀지지 않았다. 프랑스는 만약 외규장각 의궤 전부를 아무런 조건도 없이 선뜻 넘겨주고 나면, 앞으로 다른 여러 나라들도 저마다 자국의 문화재를 돌려 달라고 요구하고 나설 수 있다며 깊이 우려하였다. 요컨대 문화재를 일방적으로 양도한 좋지 않은 선례를 괜히 남기고 싶지 않았던 것이다. 그래서 프랑스는 아주 작은 것이라도 좋으니 한국으로부터 그에 상응하는 대가를 받아, 서로 교환하는 모양새만이라도 그럴듯하게 갖추자고 끈질기게 요구하였다. 그러나 한국으로서는 소중한 의궤를 되찾는 대신 또다시 다른 문화재를 내놓는 방식을 도저히 받아들이기 어려웠다. 결국 양측은 모두 하루빨리 해결을 간절히 원하면서도, 저마다 서로 다른 원칙을 끝까지 지키려 하였다. 그리하여 협상은 또다시 답답한 교착 상태에 놓이고 말았고, 이제는 실질적인 반환과 외교적인 명분을 함께 살릴 수 있는 지혜로운 방법이 절실히 필요해졌다. 어느 쪽도 완전히 지지 않으면서 모두가 받아들일 수 있는 묘안을 찾는 일은, 쉽지 않은 어려운 숙제였다.</p>
          <p class="section-title">⑨ 2010년 11월, 5년 단위 갱신 대여라는 극적인 합의</p>
          <p>그리고 마침내 2010년 11월 12일, 서울에서 열린 한 국제회의를 뜻깊은 계기로 삼아 두 나라는 비로소 극적인 합의에 도달하게 되었다. 그 내용은 프랑스가 외규장각 의궤 전부를 한국에 한꺼번에 보내 주되, 다만 그 법적인 형식만큼은 ‘5년 단위로 갱신되는 대여’의 방식으로 정한다는 것이었다. 프랑스의 국립도서관은 끝까지 한국으로부터 반드시 대가를 받아야 한다며 강하게 반대하고 나섰지만, 두 나라 관계의 새로운 출발을 간절히 원하던 최고 정책 결정자의 과감한 결단이 마침내 이 어려운 합의를 이끌어 냈다. 한국 또한 완전한 소유권 반환이라는 명분을 비록 당장은 온전히 얻어 내지는 못하였지만, 무엇보다 소중한 의궤를 하루빨리 우리 땅으로 가져오는 실질적인 실리를 우선하기로 지혜롭게 결정하였다. 이는 곧 오랜 세월 끝없이 이어져 온 의궤의 서러운 유랑을 마침내 끝내기 위해, 양측이 서로 한 발씩 양보한 현실적인 절충안을 함께 선택한 뜻깊은 순간이었다. 완벽한 승리를 고집하기보다 실현 가능한 최선을 택한 이 결정이야말로, 오랜 난제를 풀어낸 열쇠가 되어 주었다.</p>

          <p>어렵게 합의가 이루어진 뒤에도, 외규장각 의궤를 안전하게 한국으로 옮겨 오기 위한 섬세한 일들은 여전히 계속되었다. 양측은 의궤를 넘기는 이관 날짜부터 꼼꼼한 포장 방법과 알맞은 포장 재질, 믿을 만한 예술품 전문 운송 업체의 신중한 선정, 그리고 가져온 뒤의 보관 방식까지 그야말로 세밀한 부분 하나하나를 함께 논의하였다. 또한 양국 학예 연구사들의 활발한 교류와, 의궤를 디지털화하는 작업을 모두 마친 뒤에 그 소중한 파일을 서로 공유하는 문제까지도 중요한 협상의 대상이 되었다. 무엇보다 소중한 문화유산을 옮기는 일인 만큼, 그 어느 한 부분도 결코 소홀히 할 수 없었기 때문이다. 다행히도 이러한 실무 협상은 처음에 우려했던 것보다 훨씬 더 서로의 입장을 존중하는 따뜻한 분위기 속에서 순조롭게 진행되었다. 결국 외규장각 의궤의 귀환은, 역사적인 상처를 바로잡으려는 우리의 끈질긴 노력과 상대의 현실까지 두루 고려한 슬기로운 외교적 판단이 한데 어우러져 함께 만들어 낸 소중한 결과였다.</p>

        content: `
          <p class="section-title">① 인간의 합리성은 모든 문화에서 같을까?</p>

          <p class="section-title">② 미얀마 농부들이 종교 의례에 돈을 쓰는 이유</p>
          <p>미국의 인류학자 스피로는 미얀마 사람들에게 종교적인 지출이 증권 투자보다 더 합리적인 결정일 수 있다고 설명했다. 그가 관찰한 북부 미얀마의 가난한 농부들은 승려들을 위한 만찬을 열고 탑을 쌓는 데 수입의 상당 부분을 썼다. 저축을 중요하게 여기는 사람에게는 이런 지출이 낭비처럼 보일 수 있다. 그러나 농부들은 부가 언제 사라질지 모른다고 여겨, 돈을 쌓아 두기보다 의미 있는 일에 쓰는 편이 좋다고 생각했다. 또한 그들은 환생과 업보를 믿으며 공덕을 쌓는 것을 중요하게 여겼다. 종교적 지출은 현세에서 존경을 얻고 내세에 더 나은 환생을 기대하는 실천이었던 것이다.</p>
          <p class="section-title">③ 성대한 결혼식에 많은 돈을 쓰는 문화</p>

          <p class="section-title">④ 낭비처럼 보이는 소비에도 합리성이 있을까?</p>

          <p class="section-title">⑤ 인도 사람들이 소를 숭배하는 환경적 이유</p>

          <p class="section-title">⑥ 이슬람 사회에서 돼지고기를 금하는 까닭</p>

      bimun28: {

        content: `
          <p class="section-title">① 우리가 마시는 커피와 생물학적 커피의 차이</p>
          <p>우리가 마시는 커피와 생물학적 의미의 커피는 다르다. 생물학적 커피는 커피나무 열매인 체리의 씨앗, 곧 생두를 가리킨다. 갓 수확한 생두는 흰색에 가깝고 향이 거의 없으며 맛은 쓰다. 그러나 우리가 마시는 커피에서는 꽃향기와 초콜릿 향까지 느껴지고, 신맛과 쓴맛이 어우러지며 색도 갈색을 띤다. 이 차이는 생두를 말리고 볶는 여러 가공 과정을 거치면서 만들어진다. 커피 한 잔의 맛과 향은 씨앗 자체뿐 아니라 수확 이후 어떻게 가공하느냐에 따라 달라지므로, 커피를 이해하려면 생두가 한 잔의 음료로 바뀌는 과정을 살펴볼 필요가 있다.</p>
          <p class="section-title">② 가장 오래된 커피 가공법, 건식법</p>
          <p>커피를 가공하는 방법은 크게 건식법과 습식법으로 나뉜다. 건식법은 가장 오래되고 단순한 방식으로, 기계를 적게 쓰고 햇빛과 바람을 활용한다. 건식법의 첫 단계는 빨갛게 익은 열매인 체리를 수확하는 일이다. 수확한 체리는 세척한 뒤 잘 익은 열매와 덜 익은 열매, 손상된 열매로 나누어 선별한다. 이때 먼지와 흙, 나뭇가지 같은 이물질은 바람에 날려 제거한다. 같은 농장에서 수확했더라도 열매의 상태가 다르면 최종 생두의 품질이 달라질 수 있으므로, 수확과 선별에서부터 세심한 관리가 필요하다. 특히 다음 단계인 건조 작업에서 커피의 품질이 크게 좌우된다.</p>
          <p class="section-title">③ 햇볕과 바람으로 커피 체리를 말리는 과정</p>

          <p class="section-title">④ 커피의 품질을 결정하는 수분 함유량</p>
          <p>커피 체리를 말리는 건조 작업은 최종 품질을 결정하는 중요한 단계다. 지나치게 말리면 쉽게 부서져 운송하는 동안 손상될 위험이 크고, 반대로 덜 말리면 곰팡이가 피거나 썩어 품질이 떨어진다. 건조를 마친 체리는 사일로에 보관했다가, 공장에서 기계로 생두를 분리하고 등급을 매겨 포대에 담는다. 건식법은 비용과 노동력이 적게 들어 값싼 로부스타 커피를 가공하는 데 널리 쓰인다. 브라질 아라비카의 약 95퍼센트와 에티오피아, 아이티 등의 아라비카 대부분도 건식법으로 가공된다. 이처럼 건식법은 여러 생산국에서 실제로 활용되는 중요한 가공법이다.</p>

          <p>또 다른 가공 방법은 습식법이다. 습식법은 특별히 고안된 기계와 많은 물을 쓰므로 비용이 많이 들지만, 원두 본래의 맛과 향을 더 잘 보존하고 손상도 적어 고급 아라비카 커피에 주로 이용된다. 수확한 체리는 물탱크에서 세척하고 분류한 뒤, 체리의 껍질과 과육을 제거한다. 바로 이 단계가 건식법과 습식법을 구분하는 가장 큰 차이점이다. 과육 제거 기계의 두 면 사이를 체리가 통과하면 껍질과 과육이 떨어져 나가고 생두가 분리되는데, 두 면의 간격은 생두가 손상되지 않도록 조절한다. 껍질과 과육을 빨리 제거할수록 생두 손상이 적으므로, 습식법에서는 수확 직후부터 신속하고 정확하게 작업하는 것이 중요하다.</p>

          <p>벤담이 구상한 ‘패놉티콘’은 한곳에서 모든 대상을 감시할 수 있도록 설계된 일망 감시 감옥이다. 그 구조는 원형의 건물이 중앙의 탑을 둘러싼 형태다. 원형 건물은 수많은 독방으로 나뉘며, 독방마다 창문이 둘 있어 하나는 중앙 탑을, 다른 하나는 바깥을 향한다. 바깥 창문으로 들어오는 빛 덕분에 중앙 탑의 감시자는 역광을 이용해 독방 속 사람의 윤곽을 선명하게 파악할 수 있다. 중앙 탑에 감시인 한 명을 두고 각 독방에 죄수나 병자, 광인, 노동자, 학생 등을 한 사람씩 수용하는 것이다. 이렇게 감시자는 독방을 직접 돌아다니지 않고도 중앙에서 각 사람의 상태를 확인할 수 있다.</p>
          <p class="section-title">② 어둠 대신 빛으로 감시하는 새로운 감옥</p>

          <p class="section-title">③ 개인을 고립시켜 질서를 유지하는 감시 체제</p>
          <p>독방 사이의 비가시성은 감옥 안의 질서를 유지하는 중요한 수단이 된다. 죄수들이 서로 만나지 못하면 음모를 꾸미거나 집단 탈옥을 계획할 가능성이 줄어든다. 병자들이 분리되어 있으면 전염의 위험을 낮출 수 있고, 광인들이 서로 폭력을 행사할 위험도 줄어든다. 이처럼 사람들 사이의 접촉을 차단하는 일은 단순한 격리가 아니라 집단의 움직임을 통제하는 방식이다. 여러 사람이 뒤섞여 집단적인 영향을 만들어 내던 군중은 사라지고, 서로 분리된 개인들의 집합이 남는다. 간수에게는 통제하기 어려운 군중이 셀 수 있고 관리할 수 있는 개인들로 바뀌는 것이다.</p>
          <p class="section-title">④ 감시자가 없어도 계속되는 감시의 효과</p>
          <p>패놉티콘에서 중요한 것은 감시자가 매 순간 실제로 바라보는지가 아니라, 수감자가 언제든 감시당할 수 있다고 의식하게 만드는 것이다. 독방의 사람은 감시자를 볼 수 없어 지금 감시가 이루어지는지 확인할 수 없으므로, 늘 시선을 의식하며 행동을 조심하게 된다. 그래서 권력이 완벽하게 작동할수록 실제로 권력을 행사하는 횟수나 강제적인 행동은 오히려 줄어든다. 이러한 건축적 장치는 특정 감시자와 상관없이 일정한 권력 관계를 유지한다. 결국 패놉티콘은 사람을 가두는 시설인 동시에 감시 가능성을 마음속에 심어 놓는 장치가 된다. 실제 감시보다 감시당할 수 있다는 의식이 더 큰 힘을 발휘하는 것이다.</p>
          <p class="section-title">⑤ 보는 사람과 보이는 사람을 분리하는 권력</p>
          <p>일망 감시 감옥의 구조는 ‘봄’과 ‘보임’의 관계를 분리한다. 독방의 사람은 중앙 탑을 볼 수 없지만 자신은 드러나고, 중앙 탑의 사람은 모든 독방을 보면서도 드러나지 않는다. 보는 사람과 보이는 사람이 나뉘는 구조는 권력을 자동적이고 비개성적인 것으로 만든다. 권력의 근원이 특정 감시자의 인격이나 능력이 아니라 건물의 배치 자체에 있기 때문이다. 그래서 관리 책임자가 자리를 비우더라도 그의 가족이나 측근, 심지어 하인까지 중앙 탑에 들어가 감시자의 역할을 대신할 수 있다. 결국 권력은 한 사람에게 속한 힘이 아니라 누구든 그 자리에 들어서면 행사할 수 있는 힘으로 바뀐다.</p>
          <p class="section-title">⑥ 감시자의 의도와 관계없이 작동하는 권력</p>
          <p>패놉티콘에서 감시자의 동기는 권력의 효과를 결정하는 조건이 아니다. 중앙 탑에 들어선 사람이 호기심으로 보든 철학적 탐구로 관찰하든 결과는 비슷하다. 수감자에게는 누가 보든 자신이 관찰될 수 있다는 사실이 중요하기 때문이다. 오히려 익명의 관찰자가 많아질수록 수감자는 언제 누구에게 자신의 행동이 드러날지 알 수 없어, 간파될 위험과 감시받는다는 불안감이 더 커진다. 권력을 행사하는 사람들의 목적과 성격이 달라도 독방에 있는 사람에게 나타나는 효과는 한결같다. 패놉티콘이 경이로운 시설인 이유는 다양한 사람의 서로 다른 욕망을 하나의 동일한 권력 효과로 바꾸어 놓기 때문이다.</p>
          <p class="section-title">⑦ 외부의 감시가 스스로를 통제하는 힘으로 바뀌다</p>
          <p>패놉티콘의 감시 효과는 결국 수감자 자신의 마음속으로 옮겨 간다. 자신이 감시당한다는 사실을 의식하는 사람은 외부 명령을 기다리지 않고 스스로 권력의 강제력을 떠맡아, 감시하는 자와 감시받는 자의 역할을 혼자서 수행한다. 이렇게 권력 관계를 내면화한 사람은 스스로 자신을 예속시키게 된다. 그 덕분에 외부의 권력은 직접적인 물리적 힘을 덜 써도 되며, 감시자가 수시로 개입하지 않아도 수감자는 규칙에 맞추어 행동한다. 권력의 모습은 점점 희미해지지만 그 효과는 오히려 깊고 오래 지속되며, 별도의 명령 없이도 끊임없이 자신을 갱신한다. 이처럼 패놉티콘은 외부의 감시가 자기 감시로 바뀌는 과정을 보여 준다.</p>
          <p class="section-title">⑧ 감옥을 넘어 사회 전반으로 확장되는 감시 원리</p>
          <p>일망 감시 감옥은 단지 죄수를 가두는 특이한 건물로만 이해해서는 안 된다. 그것은 인간의 일상생활과 권력 사이의 관계를 규정하는 하나의 일반적인 모델이다. 패놉티콘이 처음 구상된 뒤 여러 형태로 변형되어 온 사실은, 이 구조가 강렬한 영향을 주었음을 보여 준다. 패놉티콘에는 저항을 최소화하면서 사람들을 관찰하고 통제하는 특정한 권력 체제가 이상적인 형태로 압축되어 있다. 중앙에서 여러 개인을 보고 개인들은 서로 분리되는 구조는 감옥 밖에서도 응용할 수 있다. 그러므로 패놉티콘은 감옥의 설계도인 동시에 권력이 사람들에게 작용하는 방식을 설명하는 정치적 기술의 모델이기도 하다.</p>
          <p class="section-title">⑨ 적은 인원으로 많은 사람을 통제하는 효율성</p>
          <p>패놉티콘의 구조가 여러 시설에 적용될 수 있는 까닭은 적은 수의 감시자로 많은 사람을 통제할 수 있기 때문이다. 일반적으로 감시 대상이 늘수록 지켜보는 사람도 늘어야 하지만, 일망 감시의 구조에서는 중앙 탑과 독방의 배치만으로 수많은 개인을 한눈에 파악한다. 또한 감시받는 사람들이 스스로 행동을 조절하므로 매번 힘을 행사할 필요도 줄어든다. 기하학적인 배치가 별도의 강제 없이도 행동을 바꾸는 조건이 되는 셈이다. 이러한 체제는 조용하고 자발적으로 작동하는 것처럼 보이지만, 실제로는 권력의 효과를 끊임없이 유지한다. 패놉티콘은 적은 비용과 인력으로 강한 통제 효과를 얻으려는 권력의 효율성을 드러낸다.</p>
          <p class="section-title">⑩ 패놉티콘이 보여 주는 보이지 않는 권력의 본질</p>
          <p>패놉티콘의 핵심은 감시자가 모든 사람을 실제로 계속 바라보는 데 있지 않다. 감시 대상이 언제든 보일 수 있다는 사실을 의식해 스스로 행동하게 만드는 데 있다. 원형 건물과 중앙 탑, 빛이 드는 독방, 막힌 벽은 모두 이 효과를 위해 설계된 것이다. 그 결과 외부의 감시는 수감자의 자기 통제로 바뀌고, 직접적인 강제력은 줄어들어도 권력 관계는 지속된다. 결국 일망 감시 감옥은 권력이 반드시 눈에 보이는 명령이나 폭력으로만 작동하는 것은 아니며, 보이지 않는 감시의 가능성만으로도 사람의 행동을 바꿀 수 있음을 보여 준다. 이런 점에서 패놉티콘은 감시와 권력의 관계를 설명하는 대표적인 사례가 된다.</p>

          <p>여러분은 하루에 돈을 얼마나 쓰나요? 교통비와 식비만으로도 만 원 이상을 지출하기 쉽습니다. 그런데 세계에는 하루 1달러 미만으로 살아가는 사람이 약 12억 명, 2달러 미만으로 생활하는 사람이 약 30억 명이나 된다는 통계가 있습니다. 이 수치는 당시의 빈곤 현실을 보여 줍니다. 이런 사람들에게 전기를 쓰는 일은 쉽지 않습니다. 마을에 전기를 공급하려면 발전소와 송전선이 필요하고 막대한 비용이 들며, 전기가 공급되어도 매달 전기료를 내는 것이 큰 부담이기 때문입니다. 우리가 당연하게 여기는 전등 하나도 누군가에게는 쉽게 누릴 수 없는 혜택인 셈입니다.</p>

          <p>전기가 부족한 지역의 어려움은 밤에 불을 켜지 못하는 데서 끝나지 않습니다. 깨끗한 식수를 얻는 일에도 전기가 필요하기 때문입니다. 물을 정수하고 수도 시설을 유지하려면 여러 장비와 에너지가 드는데, 개발도상국의 많은 지역에서는 정수 시설과 상하수도를 갖추는 데 큰 비용이 듭니다. 그 결과 주민들이 오염된 물을 마시고 질병에 걸리기도 합니다. 그렇다면 가난하다는 이유로 질병의 위험을 당연히 감수해야 할까요? 그렇지 않습니다. 기술의 혜택을 많이 누리는 사람들이 어려운 사람들을 도울 방법을 찾아야 하며, 이것이 바로 ‘적정 기술’의 출발입니다.</p>

          <p>적정 기술은 가난한 사람들도 기술의 혜택을 누리게 하자는 취지에서 발전했습니다. 그 출발점에는 마하트마 간디가 있습니다. 간디는 인도의 각 마을이 다른 곳에 의존하지 않고 독립적으로 경제 활동을 하기를 바라, 지역에서 활용할 작고 실용적인 기술을 개발하려 했습니다. 그는 기업의 이윤을 늘리는 대량 생산 기술이나 소수만 이익을 얻는 기술을 바람직하게 여기지 않았습니다. 간디의 영향을 받은 경제학자 슈마허는 《작은 것이 아름답다》에서 ‘중간 기술’을 강조했습니다. 중간 기술이란 최소한의 비용으로 현지 재료를 쓰며 주민이 직접 활용하는 기술로, 많은 사람의 삶을 개선하는 ‘인간의 얼굴을 한 기술’입니다.</p>

          <p>‘중간 기술’이라는 이름은 자칫 수준이 낮거나 열등한 기술이라는 오해를 부를 수 있습니다. 그래서 오늘날에는 상황에 알맞은 기술이라는 뜻에서 ‘적정 기술’이라는 표현을 주로 씁니다. 적정 기술이 되려면 적은 비용으로 활용할 수 있고, 가능하면 현지에서 나는 재료와 노동력을 이용해 일자리를 만들어야 합니다. 또 사용 방법이 간단해 특정 분야의 전문 지식이 없어도 이용할 수 있어야 합니다. 지역 주민이 스스로 만들 수 있고, 사람들의 협력을 이끌어 지역 사회의 발전에 기여해야 합니다. 이처럼 적정 기술은 가장 뛰어난 기술보다 생활에 실제로 도움이 되는 기술을 중시합니다.</p>

          <p>1921년 오토 뢰비 박사는 신경 전달 물질의 존재를 밝히려고 개구리 심장 두 개로 실험을 했습니다. 그는 미주 신경이 붙어 있는 심장과 제거한 심장을 각각 링거액에 담근 뒤 액체가 통하도록 연결했습니다. 첫 번째 심장의 미주 신경을 자극하자 그 박동이 느려졌는데, 놀랍게도 신경이 제거된 두 번째 심장의 박동까지 느려졌습니다. 뢰비는 첫 번째 심장의 신경 말단에서 방출된 물질이 링거액을 따라 두 번째 심장에 영향을 주었다고 판단했습니다. 이는 신경의 작용이 화학 물질을 통해 전달됨을 보여 주는 결정적인 증거였습니다. 이 물질은 아세틸콜린이며, 뢰비는 이 공로로 1936년 노벨 생리·의학상을 받았습니다.</p>
          <p class="section-title">④ 신경 전달 물질이 시냅스 틈을 건너는 과정</p>
          <p>신경 전달 물질은 평소 신경 섬유의 말단에 있는 작은 주머니인 시냅스 소포에 저장되어 있습니다. 세포 안에서 전기적 신호가 신경 섬유막을 따라 말단까지 전달되면, 소포가 세포막과 융합하면서 신경 전달 물질을 밖으로 내보냅니다. 방출된 물질은 다음 신경 세포와의 좁은 공간인 시냅스 틈을 지나 다음 세포막의 수용체와 결합합니다. 수용체는 정보를 받아들이는 단백질로 이루어져 있습니다. 신경 세포끼리 붙어 있지 않아도 정보가 이어지는 까닭은, 전기적 신호가 화학적 신호로 바뀌어 틈을 건너고 다음 세포의 반응을 일으키기 때문입니다. 이렇게 작은 틈을 두고 신호가 이어지는 연결 부위를 시냅스라고 부릅니다.</p>
          <p class="section-title">⑤ 열쇠와 열쇠 구멍으로 이해하는 신경 전달의 원리</p>

          <p>신경 전달 물질이 수용체와 결합하면 신경 세포막에서 전기를 띤 입자들이 이동하는 길이 열리기도 하는데, 이 길을 이온 통로라고 합니다. 이온이란 원자나 분자가 전기를 띠게 된 것으로, 양의 전기를 띠면 양이온, 음의 전기를 띠면 음이온이라고 부릅니다. 이온 통로는 수용체 자체가 통로가 되기도 하고, 수용체의 작용으로 다른 통로가 활성화되기도 합니다. 통로가 열리면 양이온이나 음이온이 세포막을 가로질러 이동하며, 어떤 이온이 어느 방향으로 움직이는지에 따라 신경 세포의 전기적 상태가 달라집니다. 눈에 보이지 않는 작은 분자들의 이동이 우리 몸의 정보 전달에 중요한 역할을 하는 셈입니다.</p>

          <p class="section-title">Part 1. 고향으로 가는 창섭</p>

          <p>병원을 지금보다 더 크게 늘리자면 적지 않은 큰돈이 필요했는데, 창섭은 그 밑천을 다름 아닌 고향의 땅에서 마련할 작정이었다. 아버지가 쥐고 있는 그 기름진 논밭을 팔면 넉넉히 될 터였다. 창섭은 차창 밖으로 빠르게 스쳐 지나가는 들판을 바라보며, 어떻게 하면 완고한 아버지를 잘 설득할 수 있을지 머릿속으로 궁리에 궁리를 거듭했다. 아버지가 과연 순순히 응해 주실지, 창섭은 벌써부터 마음이 무거웠다.</p>
          <p class="section-title">Part 2. 의사가 된 사연</p>
          <p>창섭이 하필 험한 의사의 길을 걷게 된 데에는 가슴 아픈 사연이 있었다. 어린 시절, 하나뿐인 어린 누이가 그만 맹장염에 걸리고 말았다. 그런데 무지한 시골 의사의 어처구니없는 오진으로 그만 손쓸 때를 놓쳐, 누이는 그만 꽃다운 어린 나이에 허망하게 세상을 떠나고 말았다.</p>
          <p>그 일은 어린 창섭의 가슴에 평생 지워지지 않을 만큼 깊고 아프게 사무쳤다. 본디 아버지는 하나뿐인 아들이 농업학교에 진학해 땅을 지키며 살아가기를 간절히 바랐다. 그러나 창섭은 아버지의 간곡한 뜻을 끝내 거스르고 서울로 올라가 기어이 의전에 들어갔다. 누이처럼 억울하게 죽는 사람을 없애겠다는 한결같은 일념으로, 그는 밤낮없이 공부에 매달려 마침내 어엿한 의사가 되었다. 그에게 의사의 길은 한낱 직업이 아니라, 세상을 떠난 누이에게 바치는 오랜 약속과도 같았다.</p>
          <p class="section-title">Part 3. 돌다리를 고치는 아버지</p>
          <p>오랜만에 고향 마을 어귀에 막 들어서자, 창섭의 눈에 전혀 뜻밖의 광경이 들어왔다. 늙은 아버지가 개울가에 쭈그려 앉아 낡고 오래된 돌다리를 손수 고치고 있는 것이었다. 지난여름 모진 장마에 큰물이 크게 지면서 그 튼튼하던 돌다리의 한쪽이 그만 폭삭 내려앉아 버린 모양이었다.</p>
          <p>아버지는 바짓가랑이를 둥둥 걷어붙인 채 묵직한 돌덩이를 이리저리 맞추어 가며 땀을 뻘뻘 흘리고 있었다. 창섭이 보기에는 품만 잔뜩 드는 미련하기 짝이 없는 일이었다. 저럴 바에야 차라리 나무로 새 다리를 놓으면 훨씬 쉽고 값도 덜 들 텐데. 창섭은 속으로 답답했다. 그러나 아버지는 그 낡은 돌다리에 유난히 깊은 정성을 쏟으며 조금도 서두르지 않았다. 땀방울이 턱 끝에서 뚝뚝 떨어졌지만, 아버지의 손길에는 한 치의 흐트러짐도 없었다. 창섭은 그 모습을 멀찍이서 가만히 지켜보았다.</p>
          <p class="section-title">Part 4. 병원 확장의 꿈</p>
          <p>저녁상을 물린 뒤, 창섭은 마침내 큰맘 먹고 어렵게 입을 열었다. 그는 서울에서 병원이 날로 번창하고 있으며, 이제는 더 큰 건물로 옮겨 병원을 크게 늘려야 할 때가 되었다고 아버지께 차분히 말씀드렸다. 날마다 찾아오는 환자가 너무 많아 지금의 작고 비좁은 병원으로는 도저히 다 감당할 수가 없다는 것이었다.</p>
          <p>그렇게 말하는 창섭의 목소리에는 은근한 자부심이 짙게 배어 있었다. 더 큰 병원을 세워 더 많은 환자를 살려 내는 것이야말로 의사로서 더없이 보람 있는 일이라 굳게 여겼기 때문이다. 창섭은 그 큰 꿈을 이루기 위해서는 아버지의 도움이 꼭 필요하다고 힘주어 말했다. 그러고는 조심스레 가슴에 품어 온 본론을 꺼내 놓았다. 아버지가 과연 어떤 대답을 내놓을지, 창섭은 조마조마한 마음으로 그 얼굴을 살폈다. 방 안에는 잠시 무거운 침묵이 흘렀다.</p>
          <p class="section-title">Part 5. 땅을 팔자는 제안</p>
          <p>"아버지, 고향 땅을 파시는 게 어떻겠습니까." 창섭은 미리 차분히 준비해 온 말을 차근차근 늘어놓기 시작했다. 아버지가 가지고 있는 그 기름진 논밭을 지금 팔기만 하면 병원을 늘릴 밑천이 넉넉히 마련된다는 것이었다. 게다가 땅값이 한창 크게 오른 바로 지금이 팔기에 가장 좋은 때라고도 덧붙였다.</p>
          <p>창섭의 생각에 땅이란 결국 돈으로 바꿀 수 있는 하나의 재산일 뿐이었다. 그저 가만히 묵혀 두어 봐야 큰 이문이 남는 것도 아니니, 값이 좋을 때 얼른 팔아 더 요긴하고 값진 곳에 쓰는 편이 훨씬 이롭다고 보았다. 창섭은 이것이야말로 누가 보아도 틀림없이 합리적이고 현명한 셈이라고 믿어 조금도 의심치 않았다. 땅에 무슨 특별한 뜻이 있다고 그토록 끌어안고만 있는지, 창섭으로서는 아버지의 마음을 도무지 알 수 없었다. 그는 아버지가 당연히 고개를 끄덕이리라 여겼다.</p>
          <p class="section-title">Part 6. 아버지의 거절</p>
          <p>묵묵히 아들의 말을 끝까지 듣고만 있던 아버지의 얼굴이 점점 딱딱하게 굳어졌다. 이윽고 아버지는 낮고 단호한 목소리로 천천히 입을 열었다. "땅은 팔 수 없다." 조상 대대로 물려받아 소중히 지켜 온 그 땅을, 한낱 돈 몇 푼과 함부로 바꿀 수는 결코 없다는 것이었다. 아버지의 목소리에는 한 치의 흔들림도 없었다. 그 말 속에는 오랜 세월의 무게가 고스란히 담겨 있었다.</p>
          <p>아버지에게 땅은 결코 한낱 사고파는 흔한 물건 따위가 아니었다. 할아버지의 할아버지 때부터 뜨거운 피땀을 흘려 가며 손수 일구어 온, 값으로는 도저히 매길 수 없는 더없이 소중한 것이었다. 아버지는 아들의 제안을 조금의 망설임도 없이 단칼에 잘라 거절했다. 창섭은 아버지의 뜻밖의 완강한 태도에 그만 말문이 턱 막히고 말았다. 아버지가 이토록 완강하게 나올 줄은 미처 생각지 못했던 것이다.</p>
          <p class="section-title">Part 7. 땅의 참뜻</p>
          <p>아버지는 땅에 대한 당신의 깊은 생각을 아들에게 조용히 풀어 놓기 시작했다. 아버지에게 땅은 한낱 돈벌이의 수단이 아니라, 온갖 곡식과 뭇 생명을 길러 내는 천지 만물의 근본이었다. 사람이 땅에 정성껏 씨를 뿌리면 땅은 어김없이 몇 곱절로 되돌려 주니, 그보다 더 정직하고 고마운 것이 이 세상에 어디 있겠느냐는 것이었다.</p>
          <p>"땅을 천하게 여기는 세상이 됐어. 땅처럼 정직한 것이 없는데 말이다." 아버지는 요즘 사람들이 소중한 땅을 한낱 돈으로만 보고 함부로 사고파는 각박한 세태를 깊이 걱정하고 한탄했다. 땅을 소중히 여기고 끝까지 지키며 가꾸는 것이야말로 사람의 마땅한 도리라고, 아버지는 거듭 힘주어 말했다. 창섭은 그 말씀 앞에서 쉬이 입을 뗄 수 없었다. 땅을 한낱 돈으로만 셈하던 자신이 어쩐지 조금씩 부끄럽게 느껴지기 시작했다.</p>
          <p class="section-title">Part 8. 돌다리와 나무다리</p>
          <p>이야기 끝에, 화제는 자연스레 아버지가 낮에 손수 고치던 돌다리로 옮아갔다. 창섭은 답답하고 안타까운 마음에 한마디 보탰다. "돌다리는 고치기도 그렇게 힘든데, 그냥 나무다리를 새로 놓으시지요. 품도 훨씬 적게 들고 손보기도 간편하지 않습니까." 그러나 아버지는 말없이 고개를 가로저었다.</p>
          <p>나무다리는 당장은 쉽고 싸 보여도 몇 해 못 가 썩어 무너지지만, 돌다리는 품이 많이 들어도 한번 제대로 놓으면 몇십 년, 몇백 년을 간다는 것이었다. 게다가 그 돌다리는 아버지가 어릴 적 글공부하러 건너던 다리요, 조상들의 상여가 건너가던 유서 깊은 다리이기도 했다. 아버지에게 돌다리는 한낱 구조물이 아니라, 대를 이어 온 삶과 정성이 깃든 소중한 것이었다. 돌다리를 손수 고치는 일은 곧 조상과 땅을 함께 정성껏 지키고 받드는 일이기도 했다.</p>
          <p class="section-title">Part 9. 굽히지 않는 뜻</p>
          <p>창섭은 아버지와 자신 사이에 가로놓인 깊고 아득한 골을 비로소 뼈저리게 실감했다. 땅을 그저 사고파는 돈으로만 보는 자신과, 땅을 살아 숨 쉬는 생명이자 삶의 근본으로 여기는 아버지. 두 사람의 생각은 아무리 애를 써도 좀처럼 만날 수 없는 평행선과도 같았다. 그 거리는 결코 좁혀질 것 같지 않았다. 창섭은 그 아득한 거리 앞에서 저도 모르게 길고 깊은 한숨을 내쉬었다.</p>
          <p>창섭은 아버지의 그 굳은 뜻을 끝내 꺾을 수 없음을 조용히 깨달았다. 그리고 그 완고함 속에 깊이 담긴 아버지의 곧고 맑은 신념을, 어렴풋하게나마 존중하는 마음이 가슴속에 생겨났다. 창섭은 더 이상 땅 이야기를 꺼내지 않았다. 이튿날, 그는 무거우면서도 한편 숙연한 마음을 가만히 안고 다시 서울로 올라갔다. 돌아가는 기차 안에서도 아버지의 말씀이 오래도록 귓가를 맴돌았다.</p>
          <p class="section-title">Part 10. 돌다리에 서서</p>

          <p>젊은 나이에 홀로된 어머니에게 박적골은 더 이상 정든 고향이 아니라, 지아비를 잃은 아픔이 사무친 땅이 되고 말았다. 어린 오빠와 나, 두 남매를 홀로 떠안게 된 어머니는 슬픔에 주저앉기보다, 자식만은 보란 듯이 키워 내겠다고 이를 악물었다. 그 무렵부터 어머니의 눈빛에는 전에 없던 단단한 결기가 서리기 시작했고, 말수도 눈에 띄게 줄어들었다.</p>

          <p>어머니는 먼저 오빠를 데리고 서울로 올라가 자리를 잡으려 애썼다. 나는 그동안 박적골에 남아 할아버지, 할머니의 따뜻한 손에서 자랐다. 그러던 어느 날, 서울에 가 있던 어머니가 뜻밖에도 나를 데리러 시골로 내려왔다. 오랜만에 본 어머니의 얼굴은 반가우면서도, 고된 서울살이에 전보다 수척해져 어딘가 낯설게만 느껴졌다. 나는 영문도 모른 채, 그저 오랜만에 내려온 어머니가 반가워 뒤만 졸졸 따라다녔다.</p>
          <p>어머니는 나를 보자마자 서울로 함께 가자고 하였다. 나는 뜻밖의 말에 선뜻 마음이 내키지 않았다. 정든 할아버지, 할머니와 동무들, 마음껏 뛰놀던 이 시골을 떠나야 한다니 눈앞이 캄캄했다. 그러나 한번 마음먹은 어머니의 뜻은 조금도 굽힐 수 없을 만큼 단단했다. 나는 아무리 떼를 써도 소용없음을 알고, 결국 울며 겨자 먹기로 어머니를 따라나설 수밖에 없었다.</p>
          <p class="section-title">Part 4. 서울로 가는 길</p>
          <p>난생처음 나는 정든 박적골을 떠나 먼 서울길에 올랐다. 덜컹거리는 기차에 몸을 싣고 한참을 달려, 마침내 서울에 다다랐다. 서울은 내가 그려 보던 것과는 비교도 안 되게 크고 복잡한 곳이었다. 역을 빠져나오자마자 눈에 들어오는 것마다 처음 보는 신기한 광경뿐이어서, 나는 벌어진 입을 다물지 못한 채 두리번거렸다. 기차가 내뿜는 검은 연기와 요란한 기적 소리마저 낯설고 신기하기만 하였다.</p>
          <p>하늘을 찌를 듯 높은 건물과 쇳소리를 내며 달리는 전차, 그리고 수많은 사람들이 바삐 오가는 거리는 어린 내 눈을 온통 휘둥그렇게 만들었다. 시골에서는 결코 볼 수 없던 낯선 풍경에 가슴이 두근거렸다. 설렘과 두려움이 뒤섞인 묘한 기분이었다. 나는 어머니의 손을 꼭 붙잡은 채, 이 거대한 도시가 앞으로 내 삶을 어떻게 바꾸어 놓을지 가늠조차 할 수 없었다.</p>
          <p class="section-title">Part 5. 문밖 현저동</p>
          <p>그러나 어머니가 나를 데려간 곳은, 내가 상상하던 번듯한 서울 한복판이 아니었다. 그곳은 사대문 '안'이 아니라 '밖'이었다. 서대문 밖 현저동의 가파른 산동네, 숨이 턱에 차도록 비탈길을 올라야 하는 그 꼭대기에 우리 세 식구가 깃들 조그만 셋방 하나가 있었다. 처음 그 초라한 집을 올려다본 나는 그만 말을 잃고 말았다.</p>
          <p>다닥다닥 맞붙은 초라한 집들과 좁고 비탈진 골목길은, 내가 꿈꾸던 화려한 서울과는 거리가 멀어도 한참 멀었다. 번화한 '문안'을 코앞에 두고도 우리는 그 언저리 '문밖'에 머물러야 했다. 화려한 도시의 변두리에서, 우리 세 식구의 고단한 서울살이가 그렇게 시작되었다. 그래도 어머니는 조금도 기죽지 않고 이내 소매를 걷어붙였다. 오히려 어머니의 눈빛은 전보다 한층 더 단단하게 빛났고, 나는 그런 어머니가 못내 믿음직스러웠다.</p>
          <p class="section-title">Part 6. 억척스러운 엄마</p>
          <p>서울살이는 어느 것 하나 녹록지 않았다. 가진 것 없는 어머니는 남의 집 삯바느질을 맡아, 밤이 이슥하도록 바늘을 놀렸다. 희미한 등잔불 아래 등을 잔뜩 구부린 채, 어머니의 바느질은 좀처럼 그칠 줄을 몰랐다. 밤마다 사각사각 들려오는 그 바느질 소리가 어린 나에게는 자장가와도 같아서, 나는 그 소리를 들으며 스르르 잠이 들곤 했다. 나는 그 희미한 등잔 불빛 아래 어머니 무릎을 베고 스르르 잠든 밤이 참으로 많았다.</p>
          <p>어머니는 더없이 억척스러웠다. 당신은 끼니를 거르면서도 자식들 입에는 어떻게든 밥을 넣어 주었고, 아무리 고단해도 자식 앞에서는 내색 한 번 하지 않았다. 그 모진 세월을 어머니는 오로지 두 남매를 번듯하게 키워 내겠다는 일념 하나로 버텼다. 어린 나는 그런 어머니의 굽은 등을 바라보며, 어렴풋이나마 그 깊고 뜨거운 사랑을 느끼곤 했다.</p>
          <p class="section-title">Part 7. 신여성의 꿈</p>
          <p>어머니에게는 남다른 꿈이 하나 있었다. 바로 딸인 나를 '신여성'으로 키우겠다는 것이었다. 신여성이란, 구시대의 여인들과 달리 번듯하게 공부해 제 앞가림을 하고, 세상 앞에 당당하게 자기 목소리를 내며 살아가는 새로운 여성을 뜻했다. 어머니는 그런 딸의 모습을 늘 마음속에 그리며 고단함을 이겨 냈다. 그것은 가난에 짓눌리지 않으려는, 어머니의 더없이 간절한 소망이기도 했다.</p>
          <p>어머니는 입버릇처럼 말했다. "너는 꼭 공부를 해서 신여성이 되어야 한다." 가난한 살림에 계집아이를 공부시킨다는 것은 그 시절 결코 흔한 일이 아니었다. 그러나 어머니는 그 꿈을 조금도 굽히지 않았다. 당신이 여자라는 이유로 못다 이룬 삶을 딸에게서나마 꽃피우려는 듯, 어머니의 교육열은 그 누구보다 뜨겁고 간절하였다. 나는 그런 어머니의 큰 기대가 때로는 버겁게 느껴지기도 했다.</p>
          <p class="section-title">Part 8. 문안 학교에 보내려는 엄마</p>
          <p>어머니의 꿈은 결코 말로만 그치지 않았다. 어머니는 변두리 문밖의 아이가 아니라, 번듯한 사대문 '안'의 학교에 나를 들여보내려 온갖 애를 썼다. 집은 비록 가난한 문밖 산동네에 있었지만, 배움만은 문안의 아이들에게 결코 뒤져서는 안 된다는 것이 어머니의 굳은 생각이었다. 그 굳은 다짐은 그 누구도 함부로 꺾을 수 없을 만큼 단단하였다.</p>
          <p>어머니는 이런저런 방도를 궁리하며 발이 닳도록 뛰어다녔다. 가난한 형편에 쉽지 않은 일이었으나, 한번 마음먹은 어머니의 억척 앞에서는 못 넘을 벽이 없는 듯했다. 나는 그렇게 어머니의 손에 이끌려, 문밖 아이의 몸으로 당당히 문안의 학교 문턱을 넘게 되었다. 그것은 어머니가 온 힘을 다해 나에게 열어 준 새로운 세상의 문이었다. 나는 그 새로운 세상의 문 앞에서 설렘 반 두려움 반으로 가슴이 두근거렸다.</p>
          <p class="section-title">Part 9. 두 세계 사이의 '나'</p>
          <p>서울살이에 차츰 익숙해지면서도, 나는 늘 두 세계 사이에 어정쩡하게 끼인 듯한 기분이었다. 마음껏 뛰놀던 자유로운 시골과, 억척스레 버텨야만 하는 고단한 서울. 할아버지로 대표되는 낡은 구습과 어머니가 좇는 새로운 신식. 그 두 세계는 번번이 내 어린 마음 안에서 소리 없이 부딪치곤 했다. 나는 어느 쪽이 참된 내 모습인지 알 수 없어 이따금 혼란스러웠다.</p>
          <p>그 사이에서 나는 이따금 어리둥절했고, 문밖과 문안 그 어디에도 온전히 속하지 못한 어정쩡한 아이 같았다. 그러면서도 나는 어머니의 억센 손에 이끌려 조금씩 도시의 아이로, 신식의 세계로 나아갔다. 어머니가 미리 그려 놓은 길을 따라, 나는 내 뜻과는 상관없이 천천히, 그러나 분명하게 변해 가고 있었다. 그 변화는 더디지만 결코 되돌릴 수 없는 것이어서, 나는 그렇게 조금씩 서울 아이가 되어 갔다.</p>

          <p>어머니는 그 집을 가만히 올려다보며 감개무량한 얼굴로 말했다. "드디어 서울에 말뚝을 박았구나." 정든 고향을 등지고 맨손으로 올라와, 온갖 고생 끝에 비로소 이 낯선 도시에 뿌리를 내린 것이다. 그 말뚝 하나에는, 자식을 기어이 번듯하게 키워 내겠다던 어머니의 억척과 꿈이 고스란히 박혀 있었다. 우리 가족의 삶은 그 말뚝 위에서 새롭게 뻗어 나가기 시작했다.</p>

          <p>그러던 어느 날, 친정 아버지 박처사가 금강산에서 멀리 딸을 찾아왔다. 박처사는 오랜만에 만난 박씨를 가만히 바라보더니, 마침내 때가 이르렀음을 일러 주었다. "네 액운이 이제 다 하였구나." 그러고는 두 눈을 지그시 감고 신비한 진언을 가만히 외우기 시작하였다. 박씨는 아무 말 없이 두 손을 가지런히 모은 채 아버지의 말을 가만히 따랐다.</p>
          <p>그 순간 참으로 놀라운 일이 벌어졌다. 박씨의 몸을 감싸고 있던 그 흉한 허물이 마치 뱀이 묵은 껍질을 벗듯 스르르 벗겨져 내린 것이다. 허물 속에서 드러난 것은, 눈이 부시도록 아름다운 천하제일의 미인이었다. 본디 박씨는 하늘이 정한 액운 때문에 잠시 추한 허물을 쓰고 있었을 뿐, 그 참모습은 더없이 곱고 빼어났던 것이다. 그 눈부신 모습에 곁에서 지켜보던 집안사람들은 모두 놀라 입을 다물지 못하였다.</p>

          <p>이시백은 지난날의 잘못을 진심으로 사죄하고, 비로소 박씨를 참된 아내로 깍듯이 존중하며 극진히 사랑하게 되었다. 박씨 또한 지난날의 서러움을 마음에 담아 두지 않고 남편을 너그러이 받아들였다. 겉모습에 가려 그동안 미처 보지 못했던 참된 가치를, 이시백은 그제야 비로소 깨달은 것이다. 그제야 두 사람은 비로소 참되고 따뜻한 부부의 정을 도탑게 나누게 되었다.</p>

          <p>그러나 박씨는 조금도 두려워하지 않았다. 박씨가 주문을 외며 도술을 부리자, 피화당의 나무들이 삽시간에 창검을 든 수많은 군사로 변하고, 모진 바람과 사나운 불길이 한꺼번에 일어나 청군을 덮쳤다. 수많은 적병이 추풍낙엽처럼 쓰러지고, 기고만장하던 용골대마저 끝내 박씨 앞에 무릎을 꿇고 목숨을 빌며 항복하고 말았다. 그토록 기세등등하고 교만하기 짝이 없던 적장이 끝내 한낱 여인 앞에 무릎을 꿇고 만 것이다.</p>

          <p>그 외딴섬에서 만도를 기다리고 있던 것은 끝도 없는 강제노동이었다. 일본군은 그 섬에 비행장을 닦으려 했고, 끌려온 조선 사람들은 날마다 산을 깎고 굴을 파야 했다. 뙤약볕 아래서 온종일 곡괭이질을 해도, 돌아오는 것은 겨우 주먹밥 몇 덩이뿐이었다. 손바닥은 부르터 터지고 등은 땀으로 흠뻑 젖었다. 모진 배고픔과 고된 일에 사람들은 하나둘 힘없이 쓰러져 갔다. 그래도 감독관의 매서운 눈초리에 쉴 수 있는 시간은 좀처럼 주어지지 않았다. 그 지옥 같은 나날에 고향 생각만이 유일한 위안이었다.</p>
          <p>게다가 전쟁이 막바지로 치달으면서, 섬에는 적의 비행기가 뻔질나게 날아들었다. 공습경보가 요란하게 울리면 모두들 하던 일을 팽개치고 굴속으로 몸을 숨기기 바빴다. 폭탄이 터질 때마다 발밑의 땅이 들썩 뒤흔들렸고, 죽음은 늘 코앞에 바짝 붙어 있었다. 언제 어디서 폭탄이 떨어질지 몰라 잠시도 마음을 놓을 수 없었다. 만도는 그 아슬아슬한 틈바구니에서 이를 악물고 하루하루를 버텨 냈다. 오직 고향으로 살아서 돌아갈 날만을 생각하며 그 모진 세월을 견뎌 낸 것이다. 살아서 돌아갈 수 있을지조차 알 수 없는 날들이 끝없이 이어졌다. 그래도 만도는 끝내 희망의 끈을 놓지 않았다.</p>
          <p class="section-title">Part 6. 한쪽 팔을 잃다</p>
          <p>그날도 만도는 여느 때처럼 굴을 파고 있었다. 단단한 바위를 뚫으려면 다이너마이트를 쓸 수밖에 없었다. 심지에 불을 붙여 놓고 서둘러 굴 밖으로 몸을 피하려던 바로 그때, 하필이면 적의 비행기가 또다시 새카맣게 머리 위로 들이닥쳤다. 요란한 폭음과 함께 사방이 순식간에 아수라장으로 변하고 말았다. 여기저기서 비명과 흙먼지가 한꺼번에 치솟았다. 눈앞이 캄캄해지고 귓속이 먹먹했다. 그 섬에서는 하루에도 몇 번씩 그런 아찔한 순간이 되풀이되었다.</p>

          <p class="section-title">Part 7. 역에서의 기다림</p>
          <p>아득한 옛 회상에서 문득 깨어났을 때, 만도는 어느새 정거장에 다다라 있었다. 아직 기차가 들어올 시간은 한참 멀었는데도, 만도는 플랫폼을 이리저리 서성이며 자꾸만 철길 저편을 내다보았다. 담배를 한 대 피워 물었다가 이내 비벼 끄고, 애꿎은 고등어 꾸러미만 공연히 고쳐 쥐기를 거듭했다. 혹시라도 그 사이 아들을 못 알아볼까 봐, 만도는 자꾸만 애가 타고 조바심이 났다. 시간은 어쩌면 그리도 더디게 가는지 몰랐다. 만도는 자꾸만 옷매무새를 가다듬으며 아들을 기다렸다.</p>
          <p>이윽고 저 멀리서 기적 소리가 길게 울리더니, 시커먼 기차가 숨을 거칠게 몰아쉬며 들어섰다. 만도의 가슴이 주체할 수 없이 쿵쿵 뛰기 시작했다. 사람들이 우르르 쏟아져 내리는 틈바구니에서, 만도는 목을 길게 빼고 애타게 아들의 모습을 찾았다. 어디 있나, 우리 진수가 어디 있나. 만도는 까치발을 들고 사람들 틈을 샅샅이 살폈다. 당장이라도 "아부지!" 하고 달려올 것만 같아 가슴이 뛰었다. 반가운 얼굴을 당장이라도 볼 것만 같아 그만 눈앞이 다 아른거릴 지경이었다. 멀쩡히 걸어 들어올 아들을 떠올리자 입가에 다시 웃음이 번졌다. 만도는 설렘에 자꾸만 발끝을 들썩였다.</p>

          <p>그런데 아무리 눈을 씻고 둘러보아도 아들의 모습은 얼른 눈에 띄지 않았다. 사람들이 거의 다 빠져나갔을 무렵, 저만치서 한 젊은이가 절뚝거리며 힘겹게 다가왔다. 지팡이에 가까스로 몸을 의지한 채, 한쪽 바짓가랑이가 허전하게 텅 비어 있는 모습이었다. 한쪽 다리를 잃은 아들의 모습이었다. 다름 아닌, 그렇게 애타게 기다리던 진수였다. 만도는 제 눈을 의심하며 그 자리에 우뚝 멈춰 섰다. 설마 하는 마음에 만도는 눈을 비비고 다시 보았다.</p>

          <p>명은이와 몇 번 더 만나 이야기를 나누는 사이, 나는 그 아이가 대체 왜 앞을 보지 못하게 되었는지 그 사연을 듣게 되었다. 명은이의 두 눈을 멀게 한 것은 다름 아닌 전쟁이었다. 어느 날 느닷없이 들이닥친 공습으로, 명은이네 집은 그만 삽시간에 불길에 휩싸이고 말았다고 했다. 그 불길은 순식간에 온 집을 집어삼킬 듯 거세게 번져 갔다. 매캐한 연기와 불티가 사방을 뒤덮었다고 했다. 어린 명은이가 감당하기엔 생각만 해도 몸서리쳐지는 끔찍한 일이었다.</p>
          <p>그 불길 속에서 명은이는 부모가 미처 빠져나오지 못하고 끔찍하게 목숨을 잃는 광경을 제 눈으로 고스란히 지켜보고야 말았다. 너무도 참혹한 그 장면이 어린 명은이의 두 눈과 여린 마음을 함께 멀게 해 버린 것이다. 그날 이후로 명은이의 세상은 온통 캄캄한 어둠에 잠겨 버렸다. 그 뒤로 명은이는 환한 웃음을 잃고 말았다. 세상을 향해 마음의 문마저 굳게 닫아 버린 듯했다. 어린 나는 그 깊은 슬픔을 다 헤아릴 수 없어, 그 기막힌 사연을 듣고 한동안 아무 말도 할 수 없었다. 명은이는 그 이야기를 들려주는 내내 가늘게 몸을 떨었다. 어린 나이에 감당하기엔 너무도 크고 깊은 슬픔이었다. 나는 그 작은 손을 가만히 잡아 줄 수밖에 없었다.</p>

          <p>"저기 감나무에 감이 빨갛게 익었어." "지금 하늘이 참 파래." 내 말을 가만히 들으며 명은이는 보이지 않는 바깥세상을 제 마음속으로 가만히 그려 보곤 했다. 그럴 때면 명은이의 얼굴에 발그레한 생기가 돌았다. 명은이는 그렇게 조금씩 잃었던 웃음을 되찾아 갔고, 나는 그런 명은이를 지켜보는 것이 참 좋았다. 눈먼 소녀와 철없는 소년은 그렇게 둘도 없는 동무가 되어 갔다. 둘이 함께라면 어떤 길도 무섭지 않았고, 우리는 날이 저무는 줄도 모르고 함께 어울려 다녔다. 서로에게 둘은 없어서는 안 될 소중한 동무가 되어 있었다. 함께 있는 동안만은 전쟁의 두려움도 잊을 수 있었다.</p>

          <p>명은이에게는 유난히 가만히 귀를 기울이는 소리가 하나 있었다. 바로 신광교회의 종소리였다. 아침저녁으로 "뎅—, 뎅—" 하고 묵직한 종소리가 온 동네에 울려 퍼지면, 명은이는 하던 일을 멈추고 그 소리에 온 마음을 쏟아 귀를 기울였다. 종소리가 울리는 동안 명은이의 얼굴은 더없이 평온해 보였고, 그 소리는 온 동네를 가만히 어루만지는 듯했다. 그 순간만은 명은이도 어둠을 잊은 듯 보였다. 그 소리는 명은이에게 어머니의 품처럼 포근한 것이었다.</p>
          <p>"저 소리를 들으면 가슴이 뻥 뚫리는 것 같아." 명은이는 종종 그렇게 말하곤 했다. 앞을 보지 못하는 명은이에게 그 종소리는, 어두운 세상 너머 저 먼 어딘가로 제 마음을 실어 보내 주는 유일한 통로 같았다. 보이지 않는 대신 명은이는 그 소리로 세상을 느끼고 있었던 것이다. 나는 종소리에 가만히 귀 기울이는 명은이의 옆얼굴을 바라보며, 저 소리가 명은이에게 어떤 의미인지 어렴풋이 느낄 수 있었다. 종소리가 멎으면 명은이는 늘 아쉬운 얼굴을 했고, 나는 그런 명은이 곁을 조용히 지켜 주었다. 나는 명은이를 위해 종소리가 울릴 때면 늘 곁에 있어 주었다. 두 아이는 그렇게 종소리를 함께 기다리는 사이가 되었다.</p>
          <p class="section-title">Part 6. 에밀레종 이야기</p>

          <p class="section-title">Part 7. 명은의 소원</p>

          <p class="section-title">Part 1. 똥주의 등장</p>
          <p>내 이름은 도완득. 가진 것도, 내세울 것도 별로 없는 평범한 고등학생이다. 그래도 나는 그럭저럭 조용히, 남들 눈에 띄지 않게 살고 싶었다. 그런데 그 평온을 한순간에 보란 듯이 박살 낸 사람이 있었으니, 바로 담임 똥주다. 본명은 이동주지만 아무도 그렇게 부르지 않는다. 입만 열면 거친 말이 쏟아지는 데다, 하필이면 우리 옥탑방 바로 옆집에 사는 통에 나는 학교에서나 집에서나 하루 종일 똥주에게 시달려야 했다. 학교에서는 선생이랍시고 사사건건 나를 들볶았고, 집에서는 얇은 벽 하나 사이로 그 큰 목소리가 고스란히 넘어왔다.</p>
          <p>똥주는 걸핏하면 나를 불러 세워 시시콜콜 참견을 늘어놓았다. 급식으로 주는 우유를 꼬박꼬박 챙겨 주는가 하면, 반 아이들이 다 보는 앞에서 내 집안 사정을 속속들이 들춰내 사람을 민망하게 만들기 일쑤였다. 얼굴이 화끈 달아오르는 날이 한두 번이 아니었다. 나는 그때마다 고개를 푹 숙인 채 아무 대꾸도 하지 못하고 속으로만 애를 태웠다. 나는 그런 똥주가 지긋지긋하고 또 지긋지긋했다. 저 인간만 없으면 내 인생이 한결 편하고 조용할 텐데. 나는 날마다 그런 생각을 되뇌며 똥주를 미워하고 또 미워했다. 그러나 하루라도 똥주 없는 날이 오기를 바라는 내 마음과 달리, 그는 좀처럼 내 곁을 떠날 줄 몰랐다.</p>
          <p class="section-title">Part 2. 춤추는 아버지</p>
          <p>우리 아버지는 등이 굽은 작고 왜소한 몸으로 평생을 살아오셨다. 한때는 카바레 무대에서 환한 조명을 받으며 화려하게 춤을 추던 어엿한 춤꾼이었다. 그러나 시대가 변해 카바레가 하나둘 문을 닫자, 아버지는 이제 시장 바닥이나 길거리에서 춤을 추며 물건을 파는 초라한 신세가 되었다. 사람들의 따가운 시선과 손가락질이 쏟아져도 아버지는 아무 말 없이 그저 묵묵히 춤을 추었다. 어린 시절부터 나는 그런 아버지가 창피하면서도, 한편으로는 누구보다 가엾고 안쓰러웠다. 그 작은 등에 밴 땀을 볼 때마다 내 가슴은 알 수 없이 저려 왔다.</p>
          <p>우리 집에는 아버지와 나 말고도 한 사람이 더 있었다. 피 한 방울 안 섞인 가짜 삼촌, 남민구다. 말이 어눌하고 어딘가 조금 모자란 듯했지만, 아버지와 오래도록 무대를 함께해 온 한 식구나 다름없는 사람이었다. 세상 물정에는 어두웠어도 마음만은 더없이 착하고 따뜻해, 나는 그런 삼촌을 친삼촌처럼 따랐다. 좁고 낡은 옥탑방에서 몸을 부대끼며 우리 셋은 그렇게 서로 기대어 살았다. 누구 하나 넉넉할 것 없는 처지였지만, 서로의 온기로 고단한 하루하루를 견뎌 냈다. 가난하고 보잘것없었지만, 그래도 나에게는 더없이 소중한 가족이었다.</p>
          <p class="section-title">Part 3. 교회에서의 기도</p>
          <p>나는 이따금 동네 교회에 갔다. 무슨 독실한 믿음이 있어서가 결코 아니었다. 솔직히 말하면, 교회에만 가면 꼭 비는 소원이 딱 하나 있었기 때문이다. "하느님, 제발 우리 똥주 좀 데려가 주세요." 나는 두 손을 가지런히 모으고 눈을 꼭 감은 채, 누구보다 진지하고 간절하게 똥주가 내 앞에서 영영 사라지기를 빌고 또 빌었다. 그 순간만큼은 나도 세상 누구 못지않게 경건하고 간절한 사람이었다. 신자들도 저렇게까지 정성스레 기도하지는 못할 거라고 혼자 생각했다. 그러나 아무리 두 손을 모아 빌어도 내 소원은 좀처럼 이루어질 기미가 보이지 않았다.</p>
          <p>그만큼 똥주는 내 삶을 사사건건 들쑤셔 놓는 지독한 골칫덩어리였다. 남의 집 사정을 제멋대로 파헤쳐 들추고, 아무 데서나 큰소리로 내 이름을 불러 대 사람을 곤란하게 만들기 일쑤였다. 조용히 지내고 싶은 나에게 똥주는 그야말로 재앙 같은 존재였다. 나는 그런 똥주를 어떻게든 내 곁에서 떼어 내고 싶었다. 그러나 아무리 간절히 빌고 또 빌어도 똥주는 멀쩡히 내 옆집에 눌러 버티고 있었다. 하느님도 어지간히 무심한 모양이었다. 나는 그래도 포기하지 않고 교회에 갈 때마다 늘 똑같은 소원을 거듭 빌어 댔다. 그러면서도 마음 한구석으로는 이 지긋지긋한 미움이 영영 끝나지 않을 것만 같아 답답하기만 했다.</p>
          <p class="section-title">Part 4. 똥주의 비밀</p>
          <p>그런데 미워하기만 했던 똥주에게는 내가 전혀 모르던 또 다른 얼굴이 숨어 있었다. 처음에 나는 똥주가 가난한 집에 나오는 정부 수급품을 몰래 빼돌려 제 잇속을 챙기는 파렴치한 인간인 줄로만 알았다. 그래서 그를 더욱더 괘씸하고 얄밉게 여겼다. 저런 인간이 선생이라니, 하고 속으로 몇 번이나 비웃었다. 그러나 알고 보니 그것은 터무니없는 오해였다. 사실은 내 짐작과는 전혀 다른 일이 벌어지고 있었던 것이다. 나는 그제야 내가 똥주를 얼마나 성급하게 단정했는지 깨달았다. 겉으로 드러난 모습만 보고 사람을 함부로 판단한 것이 영 부끄러웠다.</p>
          <p>똥주는 제 쥐꼬리만 한 월급을 쪼개 가며 형편이 어려운 이웃과, 제대로 대접조차 받지 못하는 외국인 노동자들을 남몰래 돕고 있었다. 생색 한 번 내지 않고 그 일을 묵묵히 이어 오고 있었던 것이다. 거칠고 뻔뻔해 보이는 겉모습과는 달리, 속으로는 누구보다 약하고 힘없는 사람들의 편에 든든히 서 있었던 것이다. 나는 그 뜻밖의 사실을 알고 나서, 똥주를 향해 굳게 품고 있던 미움이 조금씩 흔들리기 시작했다. 어쩌면 나는 그를 처음부터 한참 잘못 보고 있었는지도 몰랐다. 미워하던 마음 한편에 나도 모르게 낯선 고마움이 조금씩 비집고 들어왔다.</p>
          <p class="section-title">Part 5. 어머니가 살아 있다</p>
          <p>어느 날 똥주가 나를 조용히 불러 세우더니 좀처럼 믿기 힘든 뜻밖의 말을 꺼냈다. "완득아, 너희 어머니 살아 계신다." 나는 순간 내 귀를 의심하지 않을 수 없었다. 나는 어려서부터 어머니 없이 혼자 자랐고, 그저 오래전에 돌아가신 줄로만 알고 있었다. 그런데 살아 계시다니, 그것도 머나먼 베트남에서 시집온 분이라니 도무지 믿기지 않았다. 나는 한참을 멍하니 똥주의 얼굴만 바라보았다. 심장이 쿵쿵 뛰고 머릿속이 어지럽게 뒤엉켰다. 어머니라는 말이 이렇게 낯설고 멀게 느껴질 줄은 미처 몰랐다.</p>
          <p>어머니는 내가 아주 어렸을 때 집을 떠났다고 했다. 낯선 나라에 시집와 지독한 가난과 서러운 멸시를 견디다 못해, 끝내 어린 나와 아버지 곁을 떠날 수밖에 없었던 것이다. 말도 통하지 않는 땅에서 얼마나 외롭고 힘들었을지, 나로서는 가늠조차 되지 않았다. 나는 그 말을 듣는 순간 머릿속이 하얘졌다. 얼굴조차 모르는 어머니가 살아 있다는 사실 앞에서, 반가움과 원망과 어색함이 한꺼번에 밀려들어 나는 한참을 어쩔 줄 몰라 했다. 그날 밤 나는 좀처럼 잠을 이루지 못하고 이불 속에서 몇 번이나 뒤척였다. 얼굴도 모르는 어머니를 만나야 한다는 생각에 가슴이 자꾸만 두근거렸다.</p>
          <p class="section-title">Part 6. 어머니와의 첫 만남</p>
          <p>똥주의 주선으로, 나는 마침내 어머니와 한자리에 마주 앉게 되었다. 작은 체구에 아직 서툰 한국말을 쓰는 분이었다. 어머니는 나를 보자마자 두 눈에 눈물부터 가득 글썽였지만, 나는 대체 어떤 표정을 지어야 할지 몰라 그저 멀뚱히 선 채로 낯선 어머니의 얼굴만 하염없이 바라보고 있었다. 무슨 말이든 해야 할 것 같은데, 입이 좀처럼 떨어지지 않았다. 반가움인지 서먹함인지 알 수 없는 감정이 가슴속에서 뒤엉켰다. 작은 어깨를 떨며 나를 바라보는 어머니 앞에서, 나는 그저 발끝만 내려다보고 있었다.</p>
          <p>오랜 세월을 생판 남처럼 멀리 떨어져 지낸 사이라, 우리는 짧은 말 한마디 나누는 것조차 어색하고 서먹서먹하기만 했다. 어머니가 내게 새 신발을 사다 주었을 때도, 나는 고맙다는 말 한마디를 선뜻 입 밖에 내지 못했다. 가슴 한구석이 자꾸만 뻐근하게 저려 오는데, 그 마음을 어떻게 드러내야 할지 도무지 알 수 없었다. 괜히 퉁명스러운 표정만 짓고 돌아서는 내가 나도 미웠다. 어머니와 나 사이에는 쉬이 좁혀지지 않는 거리가 놓여 있었다. 그래도 나를 바라보는 어머니의 눈빛만은 한없이 따뜻해, 나는 자꾸만 그 얼굴을 몰래 훔쳐보게 되었다. 돌아오는 길 내내 어머니의 글썽이던 눈이 눈앞에 어른거렸다.</p>
          <p class="section-title">Part 7. 킥복싱에 빠지다</p>
          <p>그 무렵 나는 아주 우연한 계기로 킥복싱이라는 운동을 시작하게 되었다. 처음에는 그저 가슴속에 꽉 들어찬 분을 어디든 풀 데가 필요했을 뿐이었다. 세상은 늘 나에게만 유난히 불공평한 것 같았고, 나는 그 억울함과 답답함을 대체 어디다 쏟아야 할지 몰라 날마다 혼자 속으로만 끙끙 삭이고 있었다. 체육관 문을 처음 밀고 들어서던 날, 나도 모르게 심장이 두근거렸다. 땀 냄새 가득한 그곳이 어쩐지 나를 반겨 주는 것만 같았다. 낡은 글러브를 끼고 샌드백 앞에 서자, 묵은 체증이 조금은 내려가는 듯했다.</p>
          <p>그런데 체육관에서 샌드백을 힘껏 두드리고 땀을 뻘뻘 쏟아 내다 보니, 신기하게도 마음이 조금씩 가벼워지는 것이었다. 주먹을 내지르고 발을 힘차게 차는 동안, 막연하기만 하던 분노가 어느새 또렷한 열정으로 서서히 바뀌어 갔다. 나는 비로소 무언가에 온 마음을 다해 진지하게 매달리는 법을 배웠다. 킥복싱은 나에게, 세상과 맞설 용기와 나 자신을 곧게 세울 목표를 함께 안겨 주었다. 나는 난생처음으로 무언가를 간절히, 온 힘을 다해 잘해 보고 싶어졌다. 그 마음이 나를 조금씩 바꾸어 놓고 있었다. 주먹을 뻗을 때마다, 나는 내가 아무것도 아닌 존재가 아니라는 것을 조금씩 느꼈다.</p>
          <p class="section-title">Part 8. 윤하와 가까워지다</p>
          <p>우리 반에는 정윤하라는 아이가 있었다. 전교 1, 2등을 늘 다투는 똑 부러진 모범생으로, 나와는 영 어울릴 일이라고는 없는 전혀 다른 부류의 아이였다. 그런데 어쩐 일인지 윤하는 먼저 자꾸만 내게 다가와 말을 걸어왔고, 나는 그런 윤하가 이상하게도 싫지만은 않았다. 오히려 윤하가 말을 걸어 주는 날이면 괜히 기분이 좋아지고 하루가 환해지곤 했다. 무심한 척했지만, 나도 모르게 윤하의 자리를 자꾸 흘깃거렸다. 그런 내 마음을 들킬까 봐 나는 일부러 더 퉁명스럽게 굴곤 했다.</p>
          <p>우리는 사사건건 티격태격 다투면서도 조금씩 가까워졌다. 윤하는 내 무뚝뚝하고 투박한 겉모습 너머에 숨은 속마음을 가만히 들여다볼 줄 아는 아이였다. 섣불리 동정하지도, 함부로 캐묻지도 않으면서 내 곁에 가만히 있어 주었다. 윤하와 이런저런 이야기를 나누다 보면, 그동안 꽁꽁 닫아 두었던 마음의 문이 저절로 스르르 열리는 것 같았다. 무뚝뚝한 나에게도 누군가와 마음을 나누는 일이 그리 나쁘지만은 않다는 것을, 나는 윤하 덕분에 조금씩 알아 갔다. 윤하는 어느새 내게 둘도 없이 특별한 사람이 되어 있었다. 세상이 아주 조금은 살 만한 곳일지도 모른다는 생각이, 윤하 곁에서 처음으로 들었다.</p>
          <p class="section-title">Part 9. 어머니를 이해하다</p>

          <p>그런데 유재필은 죽어 떠오른 잉어들을 한참 동안 물끄러미 바라보다가, 아무렇지 않게 그것을 건져 올려 큼지막한 솥에 넣고 얼큰하게 매운탕을 끓였다. 그러고는 평소 함께 고생하던 운전기사들을 불러 모아 둘러앉아 맛있게 나눠 먹었다. "죽은 괴기를 그냥 썩혀 버리느니 사람 입에라도 들어가는 게 낫지유." 뒤늦게 이 일을 전해 들은 총수는 펄펄 뛰며 노발대발하였다. 그러나 유재필은 그 와중에도 조금도 주눅 들거나 당황하지 않고 그저 태연하고 떳떳하기만 했다. 값비싼 물고기든 함께 고생한 사람들의 끼니든, 그에게는 사람의 입에 들어가는 쪽이 늘 먼저였다. 허영 가득한 그 집안에서 유재필만이 홀로 제정신인 듯 보였다. 함께 둘러앉아 매운탕을 먹던 기사들도 그 말에 말없이 고개를 끄덕였다.</p>
          <p class="section-title">Part 7. 총수의 위선</p>
          <p>매운탕 사건은 유재필의 눈에 비친 총수의 민낯을 더욱 또렷하게 드러내 보여 주었다. 총수는 바깥으로는 자선이니 베풂이니 하며 자비롭고 인정 많은 사람인 척 내세우기를 무척이나 좋아했다. 신문에 큼지막하게 오르내릴 선행에는 선뜻 큰돈을 쾌척하면서도, 정작 제 밑에서 궂은일을 하는 아랫사람들에게는 더없이 인색하고 쌀쌀맞기 그지없었다. 겉으로 꾸민 그 자비 뒤에 감춰진 속내가 유재필의 눈에는 빤히 들여다보였다. 세상의 칭찬과 체면을 얻는 데에는 아낌이 없으면서, 정작 곁에서 땀 흘리는 사람의 사정에는 눈길 한 번 주지 않았다.</p>
          <p>유재필은 그런 총수의 겉과 속이 전혀 다른 위선에 그만 정나미가 뚝 떨어지고 말았다. 비단잉어 한 마리만도 못하게 사람을 함부로 여기고 업신여기는 그 삭막한 세계에서, 그는 더 이상 마음을 붙이고 일할 수가 없었다. 곧고 소탈하기 그지없는 유재필의 성정은, 그런 번지르르한 허울과는 끝내 어울리지 못했던 것이다. 아무리 좋은 양복에 좋은 차라 한들, 사람대접 못 받는 자리가 무슨 소용이겠는가. 유재필은 차라리 그 자리를 훌훌 떠나는 편이 낫겠다고 마음을 굳게 먹기에 이르렀다. 돈과 체면에 매인 삶보다, 사람 사는 정이 있는 곳으로 돌아가고 싶었던 것이다.</p>
          <p class="section-title">Part 8. 노선 상무로 좌천</p>
          <p>결국 유재필은 이런저런 일로 총수의 눈 밖에 나고 말았다. 할 말을 꾹 참지 못하고 바른말을 거침없이 내뱉는 그의 꼿꼿한 성미가 번번이 총수의 비위를 거슬렀던 것이다. 윗사람이라고 해서 무턱대고 고개를 숙이거나 비위를 맞추는 법이 없었으니, 그가 미움을 사는 것도 어쩌면 당연한 노릇이었다. 옳다고 여기면 상대가 누구든 할 말은 꼭 하고야 마는 사람이었다. 얼마 지나지 않아 그는 총수의 곁에서 밀려나, 그룹이 거느린 운수 회사의 노선 상무라는 한직으로 멀찍이 좌천되고 말았다. 누가 보아도 그것은 명백한 내쫓김이나 다름없는 서러운 일이었다.</p>

          <p>저녁상을 물린 뒤, 창섭은 마침내 큰맘 먹고 어렵게 입을 열었다. 그는 서울에서 병원이 날로 번창하고 있으며, 이제는 더 큰 건물로 옮겨 병원을 크게 늘려야 할 때가 되었다고 아버지께 차분히 말씀드렸다. 날마다 찾아오는 환자가 너무 많아 지금의 작고 비좁은 병원으로는 도저히 다 감당할 수가 없다는 것이었다. 좋은 시설을 갖추면 더 많은 생명을 제때 구할 수 있다는 말도 덧붙였다. 아버지는 아무 말 없이 묵묵히 아들의 말을 끝까지 들어 주었다. 그 표정에서는 좀처럼 속내를 읽어 낼 수 없었다.</p>
          <p>그렇게 말하는 창섭의 목소리에는 은근한 자부심이 짙게 배어 있었다. 더 큰 병원을 세워 더 많은 환자를 살려 내는 것이야말로 의사로서 더없이 보람 있는 일이라 굳게 여겼기 때문이다. 창섭은 그 큰 꿈을 이루기 위해서는 아버지의 도움이 꼭 필요하다고 힘주어 말했다. 그러고는 조심스레 가슴에 오래 품어 온 본론을 꺼내 놓았다. 아버지가 과연 어떤 대답을 내놓을지, 창섭은 조마조마한 마음으로 그 얼굴을 살폈다. 방 안에는 잠시 숨 막힐 듯 무거운 침묵이 흘렀다. 등잔불만 조용히 흔들리는 가운데, 창섭은 마른침을 삼키며 아버지의 입이 열리기를 기다렸다. 그 짧은 침묵이 창섭에게는 유난히 길고 무겁게만 느껴졌다.</p>
          <p class="section-title">Part 5. 땅을 팔자는 제안</p>
          <p>"아버지, 고향 땅을 파시는 게 어떻겠습니까." 창섭은 미리 차분히 준비해 온 말을 차근차근 늘어놓기 시작했다. 아버지가 가지고 있는 그 기름진 논밭을 지금 팔기만 하면 병원을 늘릴 밑천이 넉넉히 마련된다는 것이었다. 게다가 땅값이 한창 크게 오른 바로 지금이 팔기에 가장 좋은 때라고도 덧붙였다. 나중에 값이 내리기 전에 서둘러야 한다는 말까지 조목조목 늘어놓았다. 창섭은 아버지가 그 이치를 찬찬히 들으면 당연히 고개를 끄덕이리라 여겼다. 그만큼 그는 자신이 세운 그 계획에 넘치도록 자신이 있었다.</p>
          <p>창섭의 생각에 땅이란 결국 돈으로 바꿀 수 있는 하나의 재산일 뿐이었다. 그저 가만히 묵혀 두어 봐야 큰 이문이 남는 것도 아니니, 값이 좋을 때 얼른 팔아 더 요긴하고 값진 곳에 쓰는 편이 훨씬 이롭다고 보았다. 창섭은 이것이야말로 누가 보아도 틀림없이 합리적이고 현명한 셈이라고 믿어 조금도 의심치 않았다. 땅에 무슨 특별한 뜻이 있다고 그토록 끌어안고만 있는지, 창섭으로서는 아버지의 마음을 도무지 알 수 없었다. 서울에서 배우고 익힌 그의 셈법으로는, 묵은 논밭을 쥐고만 있는 것이 더없이 답답하게만 느껴졌다. 그는 아버지도 이 좋은 기회를 마다할 리 없다고 철석같이 믿고 있었다.</p>
          <p class="section-title">Part 6. 아버지의 거절</p>
          <p>묵묵히 아들의 말을 끝까지 듣고만 있던 아버지의 얼굴이 점점 딱딱하게 굳어졌다. 이윽고 아버지는 낮고 단호한 목소리로 천천히 입을 열었다. "땅은 팔 수 없다." 조상 대대로 물려받아 소중히 지켜 온 그 땅을, 한낱 돈 몇 푼과 함부로 바꿀 수는 결코 없다는 것이었다. 아버지의 목소리에는 한 치의 흔들림도 없었고, 그 말 속에는 평생 땅을 지고 살아온 세월의 묵직한 무게가 고스란히 담겨 있었다. 창섭은 그 짧은 한마디에 그만 가슴이 철렁 내려앉았다. 아버지의 그 단호한 한마디에는 어떤 설득도 비집고 들어갈 틈이 전혀 없어 보였다.</p>
          <p>아버지에게 땅은 결코 한낱 사고파는 흔한 물건 따위가 아니었다. 할아버지의 할아버지 때부터 뜨거운 피땀을 흘려 가며 손수 일구어 온, 값으로는 도저히 매길 수 없는 더없이 소중한 것이었다. 아버지는 아들의 제안을 조금의 망설임도 없이 단칼에 잘라 거절했다. 창섭은 아버지의 뜻밖의 완강한 태도에 그만 말문이 턱 막히고 말았다. 아버지가 이토록 완강하게 나올 줄은 미처 생각지도 못했던 것이다. 미리 준비해 온 숱한 말들이 입안에서만 맴돌 뿐, 쉬이 밖으로 나오지 못했다. 창섭은 꿈쩍도 않는 아버지 앞에서 한없이 작아지는 자신을 느꼈다.</p>
          <p class="section-title">Part 7. 땅의 참뜻</p>
          <p>아버지는 땅에 대한 당신의 깊은 생각을 아들에게 조용히 풀어 놓기 시작했다. 아버지에게 땅은 한낱 돈벌이의 수단이 아니라, 온갖 곡식과 뭇 생명을 길러 내는 천지 만물의 근본이었다. 사람이 땅에 정성껏 씨를 뿌리면 땅은 어김없이 몇 곱절로 되돌려 주니, 그보다 더 정직하고 고마운 것이 이 세상에 또 어디 있겠느냐는 것이었다. 땅은 거짓을 모르고 애쓴 만큼 꼭 그만큼을 돌려준다고 했다. 사람이 땀 흘려 땅을 가꾸면 땅도 그 마음을 알고 어김없이 곡식으로 보답한다는 것이었다. 땅을 속이면 땅도 끝내 사람을 속인다는 것이 아버지의 오랜 믿음이었다.</p>
          <p>"땅을 천하게 여기는 세상이 됐어. 땅처럼 정직한 것이 없는데 말이다." 아버지는 요즘 사람들이 소중한 땅을 한낱 돈으로만 보고 함부로 사고파는 각박한 세태를 깊이 걱정하고 한탄했다. 땅을 소중히 여기고 끝까지 지키며 가꾸는 것이야말로 사람의 마땅한 도리라고, 아버지는 거듭 힘주어 말했다. 창섭은 그 말씀 앞에서 쉬이 입을 뗄 수 없었다. 땅을 한낱 돈으로만 셈하던 자신이 어쩐지 조금씩 부끄럽게 느껴지기 시작했다. 아버지의 말씀에는 책에서는 배울 수 없는 깊은 이치가 담겨 있었다. 창섭은 그 묵직한 말씀을 한마디도 놓치지 않고 가만히 가슴에 새겼다.</p>
          <p class="section-title">Part 8. 돌다리와 나무다리</p>
          <p>이야기 끝에, 화제는 자연스레 아버지가 낮에 손수 고치던 돌다리로 옮아갔다. 창섭은 답답하고 안타까운 마음에 한마디 보탰다. "돌다리는 고치기도 그렇게 힘든데, 그냥 나무다리를 새로 놓으시지요. 품도 훨씬 적게 들고 손보기도 간편하지 않습니까." 그러나 아버지는 말없이 고개를 가로저었다. 그 눈빛에는 조금의 흔들림도 없었다. 창섭에게는 당장 편하고 값싼 쪽이 옳아 보였지만, 아버지의 생각은 전혀 달랐던 것이다. 아버지에게는 눈앞의 편리함보다 오래오래 남는 것이 늘 더 값졌다.</p>

          <p>창섭은 아버지의 그 굳은 뜻을 끝내 꺾을 수 없음을 조용히 깨달았다. 그리고 그 완고함 속에 깊이 담긴 아버지의 곧고 맑은 신념을, 어렴풋하게나마 존중하는 마음이 가슴속에 생겨났다. 창섭은 더 이상 땅 이야기를 꺼내지 않았다. 이튿날, 그는 무거우면서도 한편 숙연한 마음을 가만히 안고 다시 서울로 올라갔다. 돌아가는 기차 안에서도 아버지의 나직한 말씀이 오래도록 귓가를 맴돌며 가슴을 울렸다. 창섭은 차창에 머리를 기댄 채, 땅과 아버지에 대해 처음으로 깊이 생각해 보았다. 아버지가 지키려는 것이 한낱 땅이 아님을, 그는 어렴풋이 깨닫기 시작했다.</p>

          <p>나는 날마다 동무들과 뒷동산을 뛰어다니고, 개울에서 물장구를 치며 거리낌 없이 자유를 누렸다. 누구에게 매여 지내는 법 없이, 들꽃처럼 마음껏 피어나던 나날이었다. 박적골은 어린 나에게 더없이 포근하고 넉넉한 세상이어서, 나는 담장 너머 바깥세상이 어떤 곳인지 알지도, 궁금해하지도 않았다. 해가 뉘엿뉘엿 저물도록 산과 들을 쏘다니다 흙투성이가 되어 돌아와도 나를 나무라는 이는 아무도 없었다. 지금 돌이켜 보아도 그 시절이 내 생애에서 가장 티 없이 맑고 행복한 때였다.</p>
          <p class="section-title">Part 2. 아버지의 죽음</p>
          <p>그러나 겉으로 평화롭던 우리 집에는 남모를 깊은 그늘이 드리워 있었다. 내가 아주 어렸을 적, 아버지가 갑작스러운 복통으로 자리에 몸져누우신 것이다. 변변한 병원 한 번 가 보지 못한 채, 좋다는 약 한 첩 제대로 써 보지도 못하고 아버지는 손쓸 겨를도 없이 그만 세상을 떠나고 말았다. 집안의 든든한 기둥이 하루아침에 무너지자 온 식구의 앞날이 캄캄해졌다. 밤이 이슥하도록 울음소리가 그치지 않았고, 어린 나는 영문도 모른 채 그저 어머니 곁에 붙어 함께 울음을 터뜨리곤 했다. 그 겨울은 유난히도 길고 시리게 느껴졌다. 그러나 어머니만은 좀처럼 눈물을 보이지 않았다. 다만 두 아이를 끌어안은 그 팔에만 전에 없던 힘이 실려 있을 뿐이었다.</p>
          <p>젊은 나이에 홀로된 어머니에게 박적골은 더 이상 정든 고향이 아니라, 지아비를 잃은 아픔이 사무친 땅이 되고 말았다. 어린 오빠와 나, 두 남매를 홀로 떠안게 된 어머니는 슬픔에 주저앉기보다, 자식만은 보란 듯이 키워 내겠다고 이를 악물었다. 그 무렵부터 어머니의 눈빛에는 전에 없던 단단한 결기가 서리기 시작했고, 말수도 눈에 띄게 줄어들었다. 어머니는 밤마다 홀로 마당에 나와 먼 하늘을 오래 올려다보곤 하였다. 그 굳게 다문 입매에서, 나는 어렴풋이 어떤 비장한 각오를 느꼈다.</p>
          <p class="section-title">Part 3. 나를 데리러 온 엄마</p>
          <p>어머니는 먼저 오빠를 데리고 서울로 올라가 자리를 잡으려 애썼다. 나는 그동안 박적골에 남아 할아버지, 할머니의 따뜻한 손에서 자랐다. 그러던 어느 날, 서울에 가 있던 어머니가 뜻밖에도 나를 데리러 시골로 내려왔다. 오랜만에 본 어머니의 얼굴은 반가우면서도, 고된 서울살이에 전보다 수척해져 어딘가 낯설게만 느껴졌다. 거칠어진 손마디와 꺼칠한 낯빛이 그간의 고생을 말없이 일러 주는 듯하였다. 나는 영문도 모른 채, 그저 오랜만에 내려온 어머니가 반가워 그 치맛자락을 붙들고 뒤만 졸졸 따라다녔다. 어머니는 그런 나를 한참이나 말없이 내려다보기만 하였다.</p>
          <p>어머니는 나를 보자마자 서울로 함께 가자고 하였다. 나는 뜻밖의 말에 선뜻 마음이 내키지 않았다. 정든 할아버지, 할머니와 동무들, 마음껏 뛰놀던 이 시골을 떠나야 한다니 눈앞이 캄캄했다. "서울엔 안 갈래요." 나는 몇 번이고 떼를 쓰며 매달렸으나, 한번 마음먹은 어머니의 뜻은 조금도 굽힐 수 없을 만큼 단단했다. 나는 아무리 떼를 써도 소용없음을 알고, 결국 할머니 품에 안겨 한바탕 울고 난 뒤 울며 겨자 먹기로 어머니를 따라나설 수밖에 없었다. 뒤돌아보니 할머니가 사립문에 기대선 채 하염없이 손을 흔들고 있었다.</p>
          <p class="section-title">Part 4. 서울로 가는 길</p>
          <p>난생처음 나는 정든 박적골을 떠나 먼 서울길에 올랐다. 덜컹거리는 기차에 몸을 싣고 한참을 달려, 마침내 서울에 다다랐다. 서울은 내가 그려 보던 것과는 비교도 안 되게 크고 복잡한 곳이었다. 역을 빠져나오자마자 눈에 들어오는 것마다 처음 보는 신기한 광경뿐이어서, 나는 벌어진 입을 다물지 못한 채 두리번거렸다. 기차가 내뿜는 검은 연기와 귀를 찢는 요란한 기적 소리마저 낯설고 신기하기만 하였다. 어머니 손을 놓칠세라 나는 그 치맛자락을 더욱 꼭 움켜쥐었다. 발밑을 스치는 사람들의 걸음이 어찌나 빠른지, 나는 그만 어지러워 눈을 질끈 감았다.</p>
          <p>하늘을 찌를 듯 높은 건물과 쇳소리를 내며 달리는 전차, 그리고 수많은 사람들이 바삐 오가는 거리는 어린 내 눈을 온통 휘둥그렇게 만들었다. 시골에서는 결코 볼 수 없던 낯선 풍경에 가슴이 두근거렸다. 저마다 바쁜 걸음으로 스쳐 가는 사람들 틈에서, 나는 설렘과 두려움이 뒤섞인 묘한 기분에 사로잡혔다. 이 많은 사람 가운데 나를 아는 이는 어머니 하나뿐이구나 싶었다. 나는 어머니의 손을 꼭 붙잡은 채, 이 거대한 도시가 앞으로 내 삶을 어떻게 바꾸어 놓을지 가늠조차 할 수 없었다. 다만 어머니의 손만이 이 낯선 세상에서 유일한 의지가 되어 주었다.</p>
          <p class="section-title">Part 5. 문밖 현저동</p>
          <p>그러나 어머니가 나를 데려간 곳은, 내가 상상하던 번듯한 서울 한복판이 아니었다. 그곳은 사대문 '안'이 아니라 '밖'이었다. 서대문 밖 현저동의 가파른 산동네, 숨이 턱에 차도록 비탈길을 한참이나 올라야 하는 그 꼭대기에 우리 세 식구가 깃들 조그만 셋방 하나가 있었다. 처음 그 초라한 집을 올려다본 나는 그만 말을 잃고 말았다. 내가 그리던 서울이 고작 이런 곳이었나 싶어, 어린 마음에도 서운함이 울컥 밀려들었다. 그토록 꿈꾸던 서울이 이런 비탈 꼭대기일 줄은 미처 몰랐던 것이다.</p>
          <p>다닥다닥 맞붙은 초라한 집들과 좁고 비탈진 골목길은, 내가 꿈꾸던 화려한 서울과는 거리가 멀어도 한참 멀었다. 번화한 '문안'을 코앞에 두고도 우리는 그 언저리 '문밖'에 머물러야 했다. 저 아래로는 불빛 환한 문안이 손에 잡힐 듯 내려다보였으나, 그곳은 우리에게 그림의 떡과도 같았다. 화려한 도시의 변두리에서, 우리 세 식구의 고단한 서울살이가 그렇게 시작되었다. 그래도 어머니는 조금도 기죽지 않고 이내 소매를 걷어붙였다. 오히려 어머니의 눈빛은 전보다 한층 더 단단하게 빛났고, 나는 그런 어머니가 못내 믿음직스러웠다. 이 가파른 산동네가 앞으로 우리의 터전이 되리라 생각하니 마음이 묘하였다.</p>
          <p class="section-title">Part 6. 억척스러운 엄마</p>
          <p>서울살이는 어느 것 하나 녹록지 않았다. 가진 것 없는 어머니는 남의 집 삯바느질을 맡아, 밤이 이슥하도록 바늘을 놀렸다. 희미한 등잔불 아래 등을 잔뜩 구부린 채, 어머니의 바느질은 좀처럼 그칠 줄을 몰랐다. 바늘에 손끝을 찔려 피가 배어 나와도 어머니는 잠깐 입에 물고는 이내 다시 바늘을 잡았다. 밤마다 사각사각 들려오는 그 바느질 소리가 어린 나에게는 자장가와도 같아서, 나는 그 희미한 등잔 불빛 아래 어머니 무릎을 베고 스르르 잠든 밤이 참으로 많았다. 그 소리가 멎는 밤이면 나는 까닭 모를 불안에 잠을 설치곤 했다.</p>
          <p>어머니는 더없이 억척스러웠다. 당신은 끼니를 거르면서도 자식들 입에는 어떻게든 밥을 넣어 주었고, 아무리 고단해도 자식 앞에서는 내색 한 번 하지 않았다. 더러 내가 잠결에 눈을 떠 "엄마, 안 주무세요?" 하고 물으면, 어머니는 "어서 자거라" 하며 등을 다독여 줄 뿐이었다. 그 모진 세월을 어머니는 오로지 두 남매를 번듯하게 키워 내겠다는 일념 하나로 버텼다. 어린 나는 그런 어머니의 굽은 등을 바라보며, 어렴풋이나마 그 깊고 뜨거운 사랑을 가슴으로 느끼곤 했다. 그러면서도 나는 어머니의 고생이 다 나를 위한 것임을 알아, 공연히 코끝이 시큰해지곤 했다.</p>
          <p class="section-title">Part 7. 신여성의 꿈</p>
          <p>어머니에게는 남다른 꿈이 하나 있었다. 바로 딸인 나를 '신여성'으로 키우겠다는 것이었다. 신여성이란, 구시대의 여인들과 달리 번듯하게 공부해 제 앞가림을 하고, 세상 앞에 당당하게 자기 목소리를 내며 살아가는 새로운 여성을 뜻했다. 어머니는 그런 딸의 모습을 늘 마음속에 그리며 고단함을 이겨 냈다. 그것은 가난에 짓눌리지 않으려는, 어머니의 더없이 간절한 소망이기도 했다. 아무리 살림이 쪼들려도 그 꿈만은 어머니가 끝끝내 놓지 않은 마지막 끈이었다. 어머니는 그 꿈을 말할 때면 유난히 눈빛이 반짝이며 고단한 기색마저 가시는 듯하였다.</p>
          <p>어머니는 입버릇처럼 말했다. "너는 꼭 공부를 해서 신여성이 되어야 한다." 가난한 살림에 계집아이를 공부시킨다는 것은 그 시절 결코 흔한 일이 아니었다. 이웃들은 계집애 공부시켜 무엇하느냐며 뒤에서 혀를 차기도 했다. 그러나 어머니는 그 꿈을 조금도 굽히지 않았다. 당신이 여자라는 이유로 못다 이룬 삶을 딸에게서나마 꽃피우려는 듯, 어머니의 교육열은 그 누구보다 뜨겁고 간절하였다. 나는 그런 어머니의 큰 기대가 때로는 어깨에 얹힌 짐처럼 버겁게 느껴지기도 했다. 그러나 그 기대 속에 담긴 간절함을, 나는 차마 모른 체할 수 없었다.</p>
          <p class="section-title">Part 8. 문안 학교에 보내려는 엄마</p>
          <p>어머니의 꿈은 결코 말로만 그치지 않았다. 어머니는 변두리 문밖의 아이가 아니라, 번듯한 사대문 '안'의 학교에 나를 들여보내려 온갖 애를 썼다. 집은 비록 가난한 문밖 산동네에 있었지만, 배움만은 문안의 아이들에게 결코 뒤져서는 안 된다는 것이 어머니의 굳은 생각이었다. 그 굳은 다짐은 그 누구도 함부로 꺾을 수 없을 만큼 단단하였다. 어머니는 날마다 그 먼 길을 손수 나를 데리고 오르내리는 수고도 조금도 마다하지 않았다. 비탈길을 오르내리느라 어머니의 신발 뒤축이 닳고 또 닳았으나, 어머니는 오직 딸을 번듯한 학교에 들여보내겠다는 일념뿐이었다.</p>
          <p>어머니는 이런저런 방도를 궁리하며 발이 닳도록 뛰어다녔다. 가난한 형편에 쉽지 않은 일이었으나, 한번 마음먹은 어머니의 억척 앞에서는 못 넘을 벽이 없는 듯했다. 여기저기 사정하고 매달린 끝에, 나는 그렇게 어머니의 손에 이끌려, 문밖 아이의 몸으로 당당히 문안의 학교 문턱을 넘게 되었다. 그것은 어머니가 온 힘을 다해 나에게 열어 준 새로운 세상의 문이었다. 나는 그 새로운 세상의 문 앞에서 설렘 반 두려움 반으로 가슴이 두근거렸다. 어머니는 교문 앞에서 내 옷매무새를 몇 번이고 매만져 주며, 기죽지 말고 당당하라 거듭 일렀다.</p>
          <p class="section-title">Part 9. 두 세계 사이의 '나'</p>
          <p>서울살이에 차츰 익숙해지면서도, 나는 늘 두 세계 사이에 어정쩡하게 끼인 듯한 기분이었다. 마음껏 뛰놀던 자유로운 시골과, 억척스레 버텨야만 하는 고단한 서울. 할아버지로 대표되는 낡은 구습과 어머니가 좇는 새로운 신식. 그 두 세계는 번번이 내 어린 마음 안에서 소리 없이 부딪치곤 했다. 시골의 넉넉한 인심이 그리우면서도, 문안 아이들처럼 번듯해지고 싶은 마음도 함께 자라났다. 나는 어느 쪽이 참된 내 모습인지 알 수 없어 이따금 혼란스러웠다. 어느 쪽도 선뜻 버릴 수 없어, 나는 늘 그 경계에서 서성였다.</p>
          <p>그 사이에서 나는 이따금 어리둥절했고, 문밖과 문안 그 어디에도 온전히 속하지 못한 어정쩡한 아이 같았다. 문안 아이들 틈에서는 문밖 아이라 움츠러들고, 문밖에 돌아오면 어느새 다른 아이가 되어 있었다. 그러면서도 나는 어머니의 억센 손에 이끌려 조금씩 도시의 아이로, 신식의 세계로 나아갔다. 어머니가 미리 그려 놓은 길을 따라, 나는 내 뜻과는 상관없이 천천히, 그러나 분명하게 변해 가고 있었다. 그 변화는 더디지만 결코 되돌릴 수 없는 것이어서, 나는 그렇게 조금씩 서울 아이가 되어 갔다. 돌이켜 보면 그 어정쩡함이야말로, 두 세계를 다 품은 내 어린 날의 참모습이었는지도 모른다.</p>
          <p class="section-title">Part 10. 서울에 박은 말뚝</p>

          <p>세월이 흘러 두 사람이 어엿하게 장성하자, 나라에서 널리 인재를 뽑는 과거를 베푼다는 소식이 들려왔다. 평국과 보국은 함께 서울로 올라가 나란히 과거에 응시하였다. 수많은 선비가 구름처럼 몰려든 시험 자리에서, 두 사람은 그동안 갈고닦은 재주를 조금도 거리낌 없이 마음껏 펼쳐 보였다. 두 젊은이가 한껏 뿜어내는 기개와 재주는 둘레에서 지켜보던 이들을 절로 감탄하게 하였다. 특히 평국의 글과 활 솜씨는 시험관들마저 놀라 거듭 돌아보게 할 만큼 빼어났다. 수많은 응시자가 몰렸으나 그 재주를 당해 낼 자가 아무도 없었다.</p>
          <p>마침내 드러난 그 결과는 참으로 놀라웠다. 평국이 당당히 장원으로 급제하고, 보국은 그 아래인 부장원으로 급제한 것이다. 여기서도 계월이 보국보다 한 수 위임이 뚜렷이 드러났다. 어린 나이에 나란히 과거에 오른 두 사람을 두고 온 조정이 그 재주를 칭송하니, 계월은 여자의 몸을 감춘 채 당당히 벼슬길에 올랐다. 만일 헤어진 홍 시랑 부부가 이 더없이 자랑스러운 광경을 보았다면 얼마나 기뻐하였을까. 계월은 문득 그리운 부모를 떠올리며 남몰래 눈시울을 붉혔다. 세상은 평국을 어엿한 사내 급제자로만 알았으니, 그 가슴에 품은 사연을 아는 이는 아무도 없었다.</p>
          <p class="section-title">Part 6. 대원수 계월</p>
          <p>그 무렵 나라에 뜻하지 않은 큰 환난이 닥쳤다. 서번과 가달국이 군사를 일으켜 명나라의 변방을 사납게 침범해 온 것이다. 적의 기세가 어찌나 거세고 사나운지 조정이 발칵 뒤집혔다. 천자는 이 위기를 막아 낼, 가장 믿을 만한 장수를 찾아 적을 물리치게 하려 하였다. 변방에서 올라오는 급보가 날마다 조정을 어지럽히니, 나라의 운명이 오직 이 한 번의 싸움에 걸린 듯하였다. 변방의 성이 잇따라 무너지고 백성들이 적의 손에 짓밟히니, 조정의 신하들은 서로 얼굴만 바라볼 뿐 선뜻 나서는 이가 없었다. 적의 기세가 날로 거세지니 천자의 근심도 깊어만 갔다.</p>
          <p>이때 뛰어난 재주로 이름이 높던 평국, 곧 계월이 삼군을 거느리는 대원수로 임명되었다. 그리고 보국이 그 아래 부원수가 되어 함께 출전하게 되었다. 훗날 아내가 될 계월이 총사령관인 원수요, 남편이 될 보국이 그 명을 받드는 부원수가 된 것이다. 계월은 투구를 눌러쓰고 늠름한 모습으로 대군을 이끌고 적을 향해 힘차게 나아갔다. 그 당당하고 늠름한 모습에서는 한 치의 두려움도 찾아볼 수 없어, 뭇 군사들도 모두 그 뒤를 든든히 믿고 따랐다. 깃발이 바람에 나부끼고 북소리가 천지를 울리니, 적을 향해 나아가는 대군의 사기가 하늘을 찌를 듯하였다.</p>
          <p class="section-title">Part 7. 보국의 패배와 계월의 승리</p>
          <p>본격적인 싸움이 벌어지자, 부원수 보국은 홀로 큰 공을 세우고 싶은 욕심에 그만 대원수 계월의 명령을 어기고 말았다. 함부로 적진 깊이 뛰어든 보국은 적의 교묘한 계략에 걸려 크게 패하고, 목숨마저 위태로운 지경에 이르렀다. 대원수 계월은 군령을 어긴 보국을 마땅히 군법으로 엄히 다스리려 하였다. "군령이 이토록 가볍단 말이냐!" 보국은 제 성급함을 뒤늦게 뼈저리게 뉘우치며 머리를 조아렸다. 간신히 목숨을 건져 진영으로 돌아온 보국은 차마 계월의 얼굴을 마주 보지 못하였다. 제 공명심이 하마터면 군사들마저 사지로 몰 뻔했음을 그제야 깨달은 것이다.</p>
          <p>그러나 계월은 한집에서 함께 자란 지난 정을 생각해 끝내 보국을 용서하였다. 그러고는 몸소 말을 몰아 적진으로 번개같이 달려 나갔다. 계월이 신통한 용병술로 사방에서 적을 몰아치니, 그 사납던 서번과 가달의 대군이 삽시간에 모래성처럼 무너졌다. 계월은 끝내 적을 섬멸하고 큰 공을 세웠으며, 그 와중에 뜻밖에도 헤어졌던 부모와 극적으로 다시 만나게 되었다. 계월의 뛰어난 지략과 용맹 앞에 온 군사가 입을 모아 탄복하였다. 오랜 세월 애타게 그리던 부모와 부둥켜안고, 계월은 그동안 참아 온 눈물을 비로소 쏟아 냈다.</p>
          <p class="section-title">Part 8. 여자임이 탄로 나다</p>
          <p>큰 싸움에서 이기고 개선한 계월은, 그간 쌓인 과로가 한꺼번에 겹쳐 그만 병이 들어 자리에 눕고 말았다. 계월을 몹시 아끼던 천자는 이를 걱정하여, 궁중의 의원인 어의를 몸소 보내 병을 살피게 하였다. 그런데 어의가 맥을 짚어 보고는 깜짝 놀라 아뢰었다. 대원수 평국이 뜻밖에도 여자라는 것이었다. 어의는 차마 제 눈과 손을 믿지 못해 몇 번이고 다시 맥을 짚어 보고서야 조심스레 그 사실을 아뢰었다. 어의는 떨리는 목소리로 천자께 아뢰며, 차마 믿기지 않는다는 듯 몇 번이고 말끝을 흐렸다.</p>

          <p>적의 기세가 어찌나 사납던지, 급기야 천자가 적에게 겹겹이 포위되어 목숨이 경각에 달렸다. 뿐만 아니라 남편 보국마저 적에게 둘러싸여 금방이라도 목숨을 잃을 위태로운 처지가 되고 말았다. 바로 그때, 계월이 번개같이 말을 몰아 달려들어 위기에 빠진 천자와 보국의 목숨을 한꺼번에 구해 냈다. 계월이 아니었다면 나라도 남편도 지켜 낼 수 없었을 것이다. 홀로 대군을 호령하는 그 당당한 기개에 적장마저 간담이 서늘해져 감히 맞서지 못하였다. 천자는 위기에서 벗어난 뒤 계월의 손을 잡고, 그대야말로 나라의 기둥이라며 거듭 치하하였다. 보국 또한 아내 앞에 고개를 들지 못하였다.</p>
