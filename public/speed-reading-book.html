          <p>다만 인간으로 태어난 이들은 모두 전생의 일을 까맣게 잊은 채였다. 제가 본디 연화봉의 성진이요 선녀였다는 것도 모르고, 그저 주어진 삶을 향해 묵묵히 나아갈 뿐이었다. 전생의 인연이란 참으로 질기고도 묘한 것이었다. 비록 서로를 알아보지 못할지라도, 정해진 운명은 이들을 기어이 한자리로 이끌 터였다. 양소유의 앞에는, 여덟 여인과 얽힌 기이하고도 화려한 인연의 길이 활짝 열려 있었다. 운명의 실타래는 그렇게 조용히 풀려 가기 시작했다.</p>

          <p class="section-title">Part 6. 장원급제와 입신양명</p>
          <p>장성한 양소유는 큰 뜻을 품고 과거를 보러 서울로 올라갔다. 그 빼어난 글재주 앞에서는 당할 자가 없어, 양소유는 단번에 과거에 장원으로 급제하였다. 어린 나이에 벼슬길에 오른 그는, 가는 곳마다 비범한 재주를 떨쳤다. 나라에 어려운 일이 생기면 양소유가 나서서 지혜로 풀었고, 변방에 난리가 일면 대장이 되어 적을 물리쳤다. 문무를 두루 갖춘 그의 공은 날로 높아만 갔다. 임금의 두터운 신임을 받은 양소유는 마침내 벼슬이 대승상에 이르고, 위국공이라는 높은 작위까지 받기에 이르렀다. 한 몸에 부귀와 공명을 모두 거머쥔 것이다. 지난날 성진이 그토록 그리워하던 속세의 영화가, 이제 양소유의 손안에 고스란히 들어온 셈이었다.</p>
          <p>세상 사람들은 그의 출세를 우러러보았고, 양소유의 이름은 온 나라에 드높았다. 입신양명의 꿈을 남김없이 이룬 그의 앞날은, 눈부신 햇살처럼 찬란하게만 보였다. 양소유가 가는 길마다 영광과 찬사가 뒤따랐다. 미천한 선비에서 일약 나라의 기둥이 되기까지, 그의 출세는 거침이 없었다. 지난 생에 성진이 산중에서 꿈꾸던 바로 그 부귀영화를, 양소유는 이제 현실에서 손에 쥔 것이다. 그러나 그 영화의 끝에 무엇이 기다리는지는 아직 아무도 알지 못했다.</p>

          <p class="section-title">Part 7. 2처 6첩의 영화</p>
          <p>부귀와 공명을 이룬 양소유에게는, 세상의 온갖 사랑 또한 아낌없이 찾아들었다. 양소유는 살아가는 동안 여덟 여인을 차례로 만나, 그들을 모두 아내와 첩으로 맞아들였다. 그 여덟 여인이 바로 전생의 팔선녀였으나, 아무도 그 사실을 알지 못했다. 재상가의 규수인 정경패와 임금의 누이인 난양공주를 두 정실 아내로 삼고, 기생이던 계섬월과 적경홍, 그리고 진채봉을 비롯한 여섯 여인을 첩으로 거느리니, 이른바 이처 육첩의 복을 누리게 되었다. 여덟 여인은 서로 시기하거나 다투는 법 없이, 한 지아비를 모시며 우애 좋게 어울려 살았다. 양소유의 집안에는 날마다 웃음과 풍악이 끊이지 않았다.</p>
          <p>세상의 부귀와 영화, 그리고 사랑까지 모두 거머쥔 그의 삶은, 그야말로 더 바랄 것이 없어 보였다. 사람으로 태어나 누릴 수 있는 온갖 복락을, 양소유는 남김없이 다 누리고 있었던 것이다. 그렇게 영화로운 세월은 꿈결처럼 흘러갔다. 부귀와 사랑을 한꺼번에 거머쥔 양소유는, 세상에 부러울 것이 없었다. 지난날 성진이 그리던 속세의 즐거움이란 즐거움은, 양소유의 삶 속에 남김없이 펼쳐졌다. 사람이 누릴 수 있는 복이 이보다 더할 수 있으랴 싶을 만큼, 그의 나날은 화려하고 흡족했다. 그러나 화무십일홍이라 하였던가.</p>

          <p class="section-title">Part 8. 인생무상</p>
          <p>부귀영화 속에 세월은 덧없이 흘러, 양소유도 어느덧 머리가 희끗한 노인이 되었다. 그는 벼슬에서 물러나 여덟 부인과 더불어 한가로운 여생을 보내고 있었다. 어느 가을날, 양소유는 부인들과 함께 높은 누각에 올라 사방을 둘러보았다. 때마침 저무는 가을 들녘에는 쓸쓸한 바람이 불고, 멀리 산기슭에는 옛 영웅호걸들의 무덤이 점점이 흩어져 있었다. 그 황량한 풍경을 바라보던 양소유의 가슴에, 문득 알 수 없는 서글픔이 밀려들었다. 한 시대를 호령하던 진시황도, 한무제도 지금은 한 줌 흙이 되어 저 무덤 속에 누워 있지 않은가. 제가 평생을 다해 이룬 이 부귀와 영화 또한, 결국은 저 무덤처럼 덧없이 스러지고 말 것이었다.</p>

          <p>대사는 성진의 헛된 욕망을 다스리고자, 꿈을 빌려 속세의 영화를 끝까지 겪게 한 것이었다. 성진은 꿈과 현실이 둘이 아님을, 그리고 그토록 그리던 속세의 복락이 한바탕 꿈에 지나지 않음을 온몸으로 깨달았다. 꿈과 생시가 뒤바뀐 그 순간, 성진의 머릿속은 아득하기만 했다. 평생이라 여겼던 그 긴 세월이, 눈 깜짝할 사이의 한바탕 꿈이었다니. 성진은 비로소 스승의 깊은 뜻을 헤아렸다. 속세의 영화를 끝까지 겪어 본 뒤에야, 그 부질없음을 뼈저리게 알게 된 것이다. 그 뼈아픈 깨달음은 천금보다도 값진 것이었다.</p>

          <p>어느 선녀는 재상가의 귀한 딸로, 어느 선녀는 이름난 기생으로, 또 어느 선녀는 공주로 태어나니, 그 신분과 처지는 저마다 달랐다. 그러나 전생의 인연은 끊어지지 않는 법이어서, 이 여덟 여인은 머지않아 양소유와 하나하나 기이한 인연으로 맺어질 운명이었다. 다만 인간으로 태어난 이들은 모두 전생의 일을 까맣게 잊은 채였다. 제가 본디 연화봉의 성진이요 선녀였다는 것도 모르고, 그저 주어진 삶을 향해 묵묵히 나아갈 뿐이었다.</p>

          <p>배가 부산에 가까워질 무렵, 나는 또 다른 모멸을 겪어야 했다. 다름 아닌 일본 형사의 감시와 검문이었다. 조선인 승객들은 하나하나 불려 나가, 어디서 와서 어디로 가는지, 무슨 일을 하는 사람인지 꼬치꼬치 심문을 받았다. 나 역시 예외가 아니었다. 형사는 나를 위아래로 훑어보며, 유학생이라는 내 신분을 미심쩍은 눈초리로 캐물었다. 혹시 불온한 사상을 품은 자가 아닌지 의심하는 기색이 역력했다. 아무 잘못도 없이 그저 조선인이라는 이유만으로, 나는 죄인처럼 취조를 받아야 했다. 그 모욕적인 눈초리 앞에서, 나는 얼굴이 화끈거리면서도 한마디 항변조차 하지 못했다.</p>
          <p>식민지 백성에게는 기본적인 자유도, 인간다운 대접도 허락되지 않았던 것이다. 검문을 마치고 돌아서는 내 등 뒤로, 형사의 싸늘한 시선이 끈질기게 따라붙었다. 제 땅에 돌아가면서도 죄인처럼 감시받아야 하는 그 처지가, 나는 서럽고도 참담하기 그지없었다. 이것이 바로 나라 잃은 백성의 처지였다. 아무리 공부를 하고 아무리 번듯한 차림을 해도, 조선인이라는 사실 하나만으로 나는 늘 의심과 감시의 대상이 되어야 했다. 그 서러운 깨달음이 가슴을 묵직하게 짓눌렀다. 나라를 잃는다는 것의 참뜻을, 나는 그제야 온몸으로 알게 되었다.</p>

          <p class="section-title">Part 5. 부산에 내리다</p>
          <p>마침내 배가 부산항에 닿았다. 오랜만에 밟아 보는 고국 땅이었으나, 내 눈에 비친 부산의 모습은 낯설기만 했다. 항구 일대는 어느새 일본인들의 세상이 되어 있었다. 번듯한 건물과 상점에는 일본 글자 간판이 나붙었고, 거리에는 일본 옷을 입은 사람들이 활개를 쳤다. 정작 이 땅의 주인이어야 할 조선 사람들은, 제 나라 항구에서조차 변두리로 밀려나 초라하게 웅크리고 있었다. 지게를 진 조선인 짐꾼들이 일본인들의 짐을 나르며 굽실거리는 모습이, 내 가슴을 아프게 했다. 불과 몇 해 사이에 고국은 이토록 낯선 모습으로 변해 있었던 것이다. 동경에서 상상하던 고향과, 눈앞에 펼쳐진 식민지 항구의 현실은 너무도 달랐다.</p>
          <p>나는 착잡한 마음으로 부두를 빠져나왔다. 고향에 돌아왔다는 반가움보다, 이 땅을 뒤덮은 암담한 그늘이 먼저 가슴을 짓눌렀다. 여정은 아직 멀었고, 내 마음은 벌써부터 지쳐 가고 있었다. 몇 해 사이에 고향이 이토록 변할 수 있다는 것이, 나로서는 좀처럼 믿기지 않았다. 내가 그리던 조선은 어디에도 없고, 오직 남의 나라가 되어 버린 낯선 땅만이 눈앞에 있을 뿐이었다. 나는 무거운 짐을 짊어진 듯한 마음으로 발걸음을 옮겼다. 고향은 이미 내가 알던 그 고향이 아니었다.</p>

          <p class="section-title">Part 6. 무덤 같은 조선</p>
          <p>부산에서 기차에 오른 나는 경성을 향해 북으로 올라갔다. 차창 밖으로 스쳐 가는 조선의 풍경은, 하나같이 가난하고 암담하기만 했다. 김천을 지나고 대전을 지나는 동안, 내 눈에 들어온 것은 헐벗은 산과 메마른 들, 그리고 궁핍에 찌든 사람들뿐이었다. 다 쓰러져 가는 초가집들, 누더기를 걸친 채 멍하니 앉아 있는 사람들, 생기라고는 찾아볼 수 없는 거리. 조선 땅 어디를 둘러보아도 활기나 희망 같은 것은 보이지 않았다. 나는 문득 이 조선 전체가 하나의 거대한 무덤처럼 느껴졌다. 살아 있으되 살아 있지 못한 사람들이, 숨만 겨우 붙은 채 묘지 속에 누워 있는 것만 같았다.</p>
          <p>일본의 손아귀에 눌려 모든 생기를 빼앗긴 식민지 조선은, 그야말로 생명이 꺼져 가는 거대한 공동묘지였다. 차창에 비친 그 황량한 풍경을 바라보며, 나는 말할 수 없는 답답함과 절망에 가슴이 턱 막혀 왔다. 이것이 내가 돌아온 고향의 참모습이었다. 그 무덤 같은 풍경은 차창을 스쳐 끝없이 이어졌다. 나는 그것이 한두 마을의 일이 아니라, 조선 땅 전체의 모습임을 깨닫고 소름이 끼쳤다. 살아 있는 나라가 아니라, 서서히 죽어 가는 나라를 지나고 있는 셈이었다. 나는 그 깊은 절망을 안고 묵묵히 북으로 향할 뿐이었다.</p>

          <p class="section-title">Part 7. 형을 만나다</p>
          <p>가는 길에 나는 김천에 들러 형을 만났다. 형은 그곳 보통학교에서 아이들을 가르치는 교사였다. 오랜만에 만난 형은 반가웠으나, 이야기를 나눌수록 나는 어쩐지 마음이 답답해졌다. 형은 식민지 현실에 분노하거나 저항하기보다는, 그저 주어진 자리에서 조용히 순응하며 살아가고 있었다. 일본의 지배 아래 교사 노릇을 하며, 적당히 타협하고 적당히 체념한 채로 하루하루를 버티는 것이었다. 가족을 건사하려면 어쩔 수 없다는 것이, 형의 변명이라면 변명이었다. 나는 그런 형을 차마 대놓고 나무랄 수는 없었다. 그러나 동시에, 배운 조선 사람들마저 저렇게 무기력하게 시대에 길들여져 가는 현실이 못내 서글펐다.</p>
          <p>불의를 보고도 분노할 힘조차 잃어버린 지식인들. 어쩌면 그것이야말로 식민지가 조선 사람에게 입힌 가장 깊은 상처인지도 몰랐다. 나는 형과의 짧은 만남을 뒤로하고, 무거운 마음으로 다시 북행 기차에 올랐다. 어쩌면 나 역시 동경으로 돌아가면, 형과 조금도 다를 바 없는 무기력한 지식인이 되고 말 것이었다. 그 생각에 이르자 나는 더욱 참담해졌다. 분노할 줄 알면서도 끝내 아무것도 하지 못하는 것, 그것이 우리 세대의 비극이었다. 그 서글픔은 기차가 달리는 내내 좀처럼 가시지 않았다.</p>

          <p class="section-title">Part 8. 아내의 죽음</p>
          <p>기나긴 여정 끝에, 나는 마침내 경성의 집에 다다랐다. 그러나 집 안에 감도는 침울한 공기가, 이미 모든 것을 말해 주고 있었다. 위독하던 아내는, 내가 당도하기도 전에 끝내 숨을 거둔 뒤였다. 얼굴도 모르고 맺어져 평생을 서먹하게 지낸 아내였으나, 막상 그 죽음 앞에 서고 보니 마음이 착잡하기 이를 데 없었다. 아내는 낡은 구습에 매인 집안에서, 변변히 제 뜻 한번 펴 보지 못하고 쓸쓸히 눈을 감았다. 봉건적인 집안의 한 여인으로 태어나, 그렇게 조용히 스러져 간 것이다. 나는 그 죽음이 단지 한 사람의 죽음으로만 느껴지지 않았다. 그것은 마치 낡고 병든 옛 조선이 천천히 숨을 거두어 가는 모습과도 같았다.</p>
          <p>눈물보다 먼저 깊은 한숨이 새어 나왔다. 식민지의 어두운 현실도, 집안의 낡은 구습도, 그 어느 것 하나 내 힘으로 어찌해 볼 수 없다는 무력감이, 아내의 주검 앞에서 더욱 무겁게 나를 짓눌렀다. 아내의 창백한 얼굴을 내려다보며, 나는 오래도록 아무 말도 하지 못했다. 그 쓸쓸한 죽음이, 낡은 조선이 맞이한 운명을 고스란히 비추는 듯하여 가슴이 더욱 저렸다. 나는 그저 깊은 무력감 속에 말없이 서 있을 뿐이었다. 낡은 조선의 그늘이 그 집 안에도 짙게 드리워져 있었다. 나는 그저 말없이 고개를 떨굴 수밖에 없었다.</p>

          <p class="section-title">Part 9. 장례를 치르며</p>
          <p>아내의 장례가 치러지는 동안, 나는 집안 가득한 낡은 풍경 속에서 숨이 막힐 듯한 답답함을 느꼈다. 봉건적인 격식과 허례허식이 상가를 가득 메웠다. 곡소리와 제사 절차는 번잡하기만 했고, 사람들은 저마다 체면과 형식에만 매여 분주했다. 정작 죽은 이에 대한 참된 슬픔이나, 살아 있는 이들의 앞날에 대한 고민은 어디에도 보이지 않았다. 그 모든 것이 내게는 그저 공허한 껍데기처럼 느껴졌다. 집안 어른들은 여전히 낡은 관습을 금과옥조처럼 떠받들었고, 세상이 어떻게 변해 가는지에는 도무지 관심이 없었다. 바깥세상이 식민지의 어둠 속에서 신음하는 동안에도, 집 안의 시간은 수백 년 전 그대로 멈추어 있는 듯했다.</p>
          <p>나는 그 침체되고 고루한 분위기 속에서 심한 환멸을 느꼈다. 아내의 죽음을 애도하기보다, 나는 이 숨 막히는 옛 조선의 공기로부터 어서 벗어나고만 싶어졌다. 바깥은 식민지의 어둠으로 신음하는데, 집 안은 여전히 수백 년 묵은 관습에 갇혀 있었다. 그 두 겹의 어둠 사이에서, 나는 숨조차 제대로 쉴 수가 없었다. 어서 이 질식할 듯한 상가를 벗어나고 싶은 마음뿐이었다. 죽은 이도 산 이도, 모두가 그 낡은 격식의 틀 안에 갇혀 있을 뿐이었다. 그 광경을 지켜보는 내 마음은 애도보다 환멸로 가득 차올랐다.</p>

          <p class="section-title">Part 10. 다시 동경으로</p>
          <p>장례를 모두 마친 뒤, 나는 더는 그곳에 머물고 싶지 않았다. 고향의 집도, 조선 땅 전체도 내게는 그저 숨 막히는 거대한 무덤처럼 느껴질 뿐이었다. 생기를 잃고 낡은 관습에 매인 채, 식민지의 어둠 속에서 서서히 썩어 가는 조선. 그것은 마치 구더기가 들끓는 공동묘지와도 같았다. 그 암담한 현실 앞에서, 나는 아무것도 바꿀 수 없는 제 무력함만을 뼈저리게 확인했을 뿐이었다. 나는 결국 짐을 꾸려 다시 동경으로 떠나기로 했다. 고향을 등지고 떠나는 발걸음이 가볍지는 않았으나, 그 무덤 같은 땅에 더 머무를 수는 없었다. 다만 이번 여정에서 나는, 식민지 조선의 참혹한 현실을 똑똑히 두 눈으로 보고 가슴에 깊이 새겼다.</p>

          <p>동경을 떠난 나는 기차를 몇 번이고 갈아타며 시모노세키에 이르렀다. 거기서 부산으로 가는 관부연락선에 몸을 실었다. 현해탄을 건너는 그 배는, 조선과 일본을 잇는 길목이자 식민지 백성의 설움이 오가는 통로이기도 했다. 배에 오르는 조선 사람들의 표정은 하나같이 어둡고 주눅 들어 있었다. 일본인들이 거드름을 피우며 활보하는 반면, 조선인들은 구석에서 눈치를 보며 몸을 웅크렸다.</p>
          <p>같은 배를 탔으되, 그 처지는 하늘과 땅처럼 달랐다. 나는 그 광경을 보며 새삼 식민지 조선의 현실을 실감했다. 동경에서 책 속에 파묻혀 있을 때는 미처 보지 못했던 것들이, 고향에 가까워질수록 하나둘 또렷이 드러나기 시작했다. 나는 갑판에 서서, 점점 멀어지는 일본 땅과 점점 다가오는 조선 땅을 번갈아 바라보았다. 그 사이의 캄캄한 밤바다처럼, 내 마음도 어둡게 일렁였다.</p>

          <p class="section-title">Part 3. 엿들은 이야기</p>
          <p>배 안의 목욕탕에서, 나는 일본인 몇몇이 주고받는 이야기를 우연히 엿듣게 되었다. 그들은 조선에서 값싼 노동자를 모아 가는 일을 두고 떠벌리고 있었다. 무지한 조선 농민들을 좋은 일자리가 있다고 속여서는, 헐값에 사다가 험한 곳으로 팔아넘긴다는 것이었다. 그러면서도 그들은 조금의 죄책감도 없이, 도리어 어리석은 조선인들을 비웃으며 낄낄거렸다. 조선 사람을 사람이 아니라 한낱 짐승이나 물건처럼 여기는 그 말투에, 나는 온몸이 부들부들 떨렸다.</p>
          <p>분노와 함께 견딜 수 없는 수치심이 밀려들었다. 그러나 나는 끝내 아무 말도 하지 못한 채, 그저 묵묵히 그 자리를 빠져나올 뿐이었다. 식민지 지식인의 무력함이란 그런 것이었다. 눈앞의 불의에 분노하면서도 선뜻 나서지 못하는 비겁함이, 바로 나의 것이기도 했던 까닭이다. 나는 그 쓰라린 수치심을 가슴 깊이 삼킬 수밖에 없었다.</p>

          <p class="section-title">Part 4. 형사의 감시</p>
          <p>배가 부산에 가까워질 무렵, 나는 또 다른 모멸을 겪어야 했다. 다름 아닌 일본 형사의 감시와 검문이었다. 조선인 승객들은 하나하나 불려 나가, 어디서 와서 어디로 가는지, 무슨 일을 하는 사람인지 꼬치꼬치 심문을 받았다. 나 역시 예외가 아니었다. 형사는 나를 위아래로 훑어보며, 유학생이라는 내 신분을 미심쩍은 눈초리로 캐물었다.</p>
          <p>혹시 불온한 사상을 품은 자가 아닌지 의심하는 기색이 역력했다. 아무 잘못도 없이 그저 조선인이라는 이유만으로, 나는 죄인처럼 취조를 받아야 했다. 그 모욕적인 눈초리 앞에서, 나는 얼굴이 화끈거리면서도 한마디 항변조차 하지 못했다. 식민지 백성에게는 기본적인 자유도, 인간다운 대접도 허락되지 않았던 것이다. 제 땅에 돌아가면서도 죄인처럼 감시받아야 하는 그 처지가, 나는 서럽고도 참담하기 그지없었다.</p>

          <p class="section-title">Part 5. 부산에 내리다</p>
          <p>마침내 배가 부산항에 닿았다. 오랜만에 밟아 보는 고국 땅이었으나, 내 눈에 비친 부산의 모습은 낯설기만 했다. 항구 일대는 어느새 일본인들의 세상이 되어 있었다. 번듯한 건물과 상점에는 일본 글자 간판이 나붙었고, 거리에는 일본 옷을 입은 사람들이 활개를 쳤다. 정작 이 땅의 주인이어야 할 조선 사람들은, 제 나라 항구에서조차 변두리로 밀려나 초라하게 웅크리고 있었다.</p>
          <p>지게를 진 조선인 짐꾼들이 일본인들의 짐을 나르며 굽실거리는 모습이, 내 가슴을 아프게 했다. 불과 몇 해 사이에 고국은 이토록 낯선 모습으로 변해 있었던 것이다. 동경에서 상상하던 고향과, 눈앞에 펼쳐진 식민지 항구의 현실은 너무도 달랐다. 나는 착잡한 마음으로 부두를 빠져나왔다. 고향에 돌아왔다는 반가움보다, 이 땅을 뒤덮은 암담한 그늘이 먼저 가슴을 짓눌렀다.</p>

          <p class="section-title">Part 6. 무덤 같은 조선</p>

          <p>나는 문득 이 조선 전체가 하나의 거대한 무덤처럼 느껴졌다. 일본의 손아귀에 눌려 모든 생기를 빼앗긴 식민지 조선은, 그야말로 생명이 꺼져 가는 거대한 공동묘지였다. 차창에 비친 그 황량한 풍경을 바라보며, 나는 말할 수 없는 답답함과 절망에 가슴이 턱 막혀 왔다. 그것이 한두 마을의 일이 아니라, 조선 땅 전체의 모습임을 깨닫고 소름이 끼쳤다.</p>

          <p class="section-title">Part 7. 형을 만나다</p>
          <p>가는 길에 나는 김천에 들러 형을 만났다. 형은 그곳 보통학교에서 아이들을 가르치는 교사였다. 오랜만에 만난 형은 반가웠으나, 이야기를 나눌수록 나는 어쩐지 마음이 답답해졌다. 형은 식민지 현실에 분노하거나 저항하기보다는, 그저 주어진 자리에서 조용히 순응하며 살아가고 있었다. 일본의 지배 아래 교사 노릇을 하며, 적당히 타협하고 적당히 체념한 채로 하루하루를 버티는 것이었다.</p>

          <p class="section-title">Part 2. 끌려간 명준</p>
          <p>명준에게는 남모를 아픈 사연이 하나 있었다. 그의 아버지가 일찍이 북으로 넘어가, 그곳에서 높은 자리에 오른 공산주의자가 되어 있었던 것이다. 그 때문에 명준은 남한에서 늘 감시의 눈초리를 받아야 했다. 급기야 어느 날, 명준은 영문도 모른 채 경찰에 끌려갔다. 아버지가 북에서 하는 일을 캐묻는다는 구실이었다. 명준은 아버지의 일을 알지 못한다고 항변했으나, 경찰은 그 말을 믿어 주지 않았다. 도리어 그들은 명준에게 혹독한 매질과 고문을 가했다. 아들이라는 이유 하나만으로, 명준은 죄 없이 짐승처럼 짓밟혀야 했다. 그 모진 고문 앞에서, 명준이 마음속에 품었던 남한에 대한 마지막 희망마저 산산이 부서지고 말았다.</p>
          <p>자유를 내세우는 이 땅에, 정작 한 개인의 자유도 존엄도 없음을 그는 뼈저리게 깨달았다. 명준의 가슴에는 남한 사회에 대한 깊고 차가운 환멸이 자리 잡기 시작했다. 명준은 제 아버지가 어떤 사람인지조차 제대로 알지 못했다. 그런데도 아버지의 그림자 하나 때문에, 그는 온전한 한 사람으로 대접받지 못했다. 그 부당함 앞에서, 명준이 품었던 이상은 첫 번째 깊은 상처를 입었다. 이상으로 가득하던 한 청년이, 세상의 폭력 앞에서 처음으로 무너지기 시작한 것이다.</p>

          <p class="section-title">Part 3. 밀실뿐인 남쪽</p>
          <p>고문의 상처가 아물수록, 명준의 눈에 비친 남한의 모습은 더욱 또렷해졌다. 그가 찾아 헤매던 참된 광장은, 이 남쪽 땅 어디에도 없었다. 사람들은 저마다 제 밀실 속에 틀어박혀, 오직 제 잇속만을 챙기기에 바빴다. 돈과 권력을 좇아 서로 속이고 짓밟는 아귀다툼만이 거리를 메웠다. 겉으로는 자유와 민주를 외쳤으나, 그 속을 들여다보면 부패와 이기심만이 곪아 가고 있었다. 더불어 사는 공동의 삶, 참된 광장의 정신은 어디에서도 찾아볼 수 없었다. 저마다 외로운 밀실에 갇힌 사람들의 세상, 그것이 명준이 본 남한의 민낯이었다. 그런 곳에서는 아무리 발버둥 쳐도, 참된 삶의 자리를 찾을 수 없을 것 같았다.</p>
          <p>명준은 날이 갈수록 남쪽에서의 삶에 깊은 회의를 느꼈다. 밀실만 있고 광장이 없는 이 땅은, 그에게 더 이상 머물 곳이 되지 못했다. 그의 마음은 서서히 다른 곳을 향하기 시작했다. 자유란 말은 거리에 넘쳐 났으나, 정작 그 자유를 누릴 광장은 어디에도 없었다. 사람들은 저마다의 밀실에서 서로에게 등을 돌린 채 살아갈 뿐이었다. 명준은 그런 남한에서 더는 숨조차 제대로 쉴 수 없을 것 같았다. 자유라는 허울 뒤에 감춰진 그 차가운 민낯이, 명준을 끝내 등 돌리게 만들었다. 그는 이 숨 막히는 밀실의 땅을 떠나기로 마음을 굳혀 갔다.</p>

          <p class="section-title">Part 4. 윤애와의 사랑</p>
          <p>그 무렵 명준에게는 윤애라는 여인이 있었다. 명준은 윤애를 사랑했고, 그녀와의 사랑 속에서 메마른 삶의 위안을 얻으려 했다. 윤애는 다정하고 아름다운 여인이었다. 명준은 그녀의 품에서나마, 바깥세상의 환멸을 잠시 잊을 수 있었다. 그러나 두 사람의 사랑은 끝내 명준의 깊은 공허를 채워 주지 못했다. 명준이 윤애에게 바란 것은 단순한 남녀의 정만이 아니라, 제 영혼을 온전히 기댈 수 있는 참된 결합이었다. 하지만 사랑만으로는, 그가 품은 삶의 근원적인 물음에 답할 수 없었다. 밀실 안의 달콤한 사랑도, 광장의 부재라는 허기를 끝내 메워 주지는 못했던 것이다.</p>
          <p>명준은 윤애를 사랑하면서도, 한편으로는 더 큰 무언가를 향한 갈증에 시달렸다. 두 사람 사이에는 어쩔 수 없는 거리가 가로놓여 있었다. 결국 그 사랑도 명준을 온전히 붙들어 두지는 못했다. 그의 마음은 이미 남쪽 너머의 세계를 향해 기울어 가고 있었다. 사랑하는 사람 곁에서도 채워지지 않는 그 공허가, 명준을 더욱 쓸쓸하게 했다. 윤애의 따뜻한 품도, 그가 그토록 갈망하는 광장의 자리를 대신해 줄 수는 없었다. 명준의 눈은 자꾸만 먼 곳을 향하곤 했다. 사랑조차도 끝내 그를 이 남쪽 땅에 붙들어 두지는 못했던 것이다.</p>

          <p class="section-title">Part 5. 북으로 가는 길</p>
          <p>남쪽에서 끝내 참된 광장을 찾지 못한 명준은, 마침내 중대한 결심을 했다. 삼팔선을 넘어 북으로 가기로 한 것이다. 아버지가 있는 그곳, 사회주의의 이상을 내건 북녘에서라면, 저가 그토록 그리던 참된 광장을 만날 수 있으리라 믿었던 까닭이다. 밀실뿐인 남한에 환멸한 그에게, 북은 마지막 희망처럼 보였다. 모두가 더불어 평등하게 사는 세상, 너와 나의 구분 없이 하나의 공동체를 이루는 열린 광장을, 명준은 북녘에 그런 세상이 펼쳐져 있으리라 기대했다. 그 희망을 품고, 그는 정든 남쪽 땅과 윤애를 뒤로한 채 위험을 무릅쓰고 북으로 넘어갔다. 삼팔선을 넘는 그의 발걸음에는 비장함과 설렘이 뒤섞여 있었다.</p>
          <p>어쩌면 이번에야말로 제 영혼이 깃들 참된 삶의 자리를 찾을지 모른다는 기대 때문이었다. 그러나 그를 기다리고 있던 북녘의 현실이 어떠할지, 그때의 명준은 미처 알지 못했다. 남쪽에서 잃어버린 꿈을, 그는 북쪽에서 되찾고 싶었다. 설령 목숨을 건 위험한 길일지라도, 참된 광장이 거기 있다면 기꺼이 건너갈 작정이었다. 그 간절한 희망 하나가 그를 끝내 삼팔선 너머로 이끌었다. 한 가닥 희망을 좇아 그는 돌아올 수 없는 강을 건넜다. 그러나 그 희망이 또 다른 환멸의 시작일 줄은, 그때는 미처 알 수 없었다.</p>

          <p class="section-title">Part 6. 텅 빈 광장</p>
          <p>그러나 북녘에서 명준을 기다린 것은, 그가 꿈꾸던 참된 광장이 아니었다. 겉으로 북한은 온통 거대한 광장처럼 보였다. 사람들은 날마다 광장에 모여 구호를 외치고 깃발을 흔들었다. 그러나 그 광장에는 정작 사람의 참된 삶도, 뜨거운 열정도 깃들어 있지 않았다. 모든 것이 위에서 정해 준 대로 움직이는, 생기 없는 기계 같은 세상이었다. 사람들은 저마다 거대한 조직의 부품처럼, 시키는 대로 외치고 시키는 대로 움직일 뿐이었다. 자유로운 생각도, 진정한 소통도 그곳에는 없었다. 요란한 구호 소리만 가득할 뿐, 그 광장은 속이 텅 빈 껍데기에 지나지 않았다. 남쪽에 밀실만 있었다면, 북쪽에는 알맹이 없는 광장만이 있었던 셈이다.</p>
          <p>명준은 또 한 번 깊은 환멸에 빠지고 말았다. 남에서도 북에서도, 그가 그토록 찾아 헤매던 참된 삶의 자리는 끝내 보이지 않았다. 그의 외로운 방황은 어디에서도 끝나지 않았다. 명준은 그 텅 빈 광장 한복판에서 오히려 더욱 외로웠다. 모두가 한목소리로 외치는 그 속에서, 그는 끝내 제 목소리를 낼 수 없었다. 남쪽의 밀실을 피해 왔건만, 북쪽에는 또 다른 감옥이 그를 기다리고 있었던 것이다. 그렇게 명준은 또다시 발 디딜 곳을 잃은 채 홀로 떠돌아야 했다.</p>

          <p class="section-title">Part 7. 은혜를 만나다</p>
          <p>메마른 북녘의 삶 속에서, 명준에게도 한 줄기 빛이 찾아들었다. 은혜라는 여인을 만난 것이다. 은혜는 무용을 하는 아름다운 여인이었다. 춤추는 은혜의 모습에서, 명준은 그 삭막한 세상에서는 좀처럼 느낄 수 없던 생명의 약동과 따뜻한 온기를 보았다. 두 사람은 자연스레 서로에게 이끌려 깊은 사랑에 빠졌다. 명준에게 은혜는 단순한 연인이 아니었다. 모든 이상이 무너진 폐허 같은 삶 속에서, 은혜는 그가 기댈 수 있는 유일한 위안이자 안식처였다. 북녘의 공허한 광장에서도, 사랑하는 은혜의 품속만은 따뜻하고 참된 자리처럼 느껴졌다. 어쩌면 참된 광장이란 거창한 이념 속이 아니라, 사랑하는 사람과 나누는 그 작은 온기 속에 있는 것인지도 몰랐다.</p>
          <p>명준은 은혜와의 사랑에 온 마음을 쏟았다. 세상에 대한 환멸로 얼어붙었던 그의 가슴이, 은혜 앞에서만은 조금씩 녹아내리고 있었다. 그것은 잿빛 삶에 피어난 한 송이 붉은 꽃과도 같았다. 거창한 이념도, 뜨거운 구호도 끝내 채워 주지 못한 그 자리를, 은혜의 사랑이 조용히 채워 주었다. 명준은 처음으로 이 삭막한 세상에 머물고 싶다는 생각이 들었다. 은혜가 있는 한, 그는 더 이상 외롭지 않을 것만 같았다. 명준은 그 애틋한 사랑에 제 모든 것을 걸었다.</p>

          <p class="section-title">Part 8. 전쟁과 은혜의 죽음</p>
          <p>그러나 두 사람의 사랑에도 끝내 거대한 불행의 그림자가 드리워졌다. 바로 6·25 전쟁이 터진 것이다. 온 나라가 전쟁의 포화에 휩싸이고, 명준 또한 전쟁의 한복판으로 내몰렸다. 명준은 전선으로 나가 싸웠고, 은혜 역시 간호병이 되어 전쟁터로 향했다. 참혹한 전장 한가운데서, 두 사람은 기적처럼 다시 만났다. 포탄이 쏟아지는 전선의 어느 동굴에서, 명준과 은혜는 짧지만 그 어느 때보다 뜨거운 사랑을 나누었다. 언제 죽을지 모르는 극한의 상황 속에서, 그 사랑은 더욱 애틋하고 절실했다. 그러나 전쟁은 끝내 그 마지막 사랑마저 앗아 가고 말았다. 은혜가 그 전쟁통에 목숨을 잃고 만 것이다.</p>
          <p>유일한 위안이자 안식처였던 은혜를 잃고, 명준은 완전히 무너져 내렸다. 참된 광장도, 사랑하는 사람도 모두 잃은 그에게, 이제 세상에 남은 것은 아무것도 없었다. 그의 영혼은 깊은 어둠 속으로 끝없이 가라앉았다. 하필 참된 안식을 겨우 찾은 그 순간에, 전쟁은 그에게서 모든 것을 앗아 가 버렸다. 은혜의 죽음은 곧 명준의 마지막 희망이 꺼지는 일이었다. 세상은 그에게 사랑할 자리 하나조차 끝끝내 허락하지 않았다. 세상도, 이념도, 사랑마저도 그를 끝내 저버린 셈이었다. 명준에게 이제 남은 것은 캄캄한 절망뿐이었다.</p>

          <p class="section-title">Part 9. 중립국을 택하다</p>
          <p>전쟁이 끝나고, 명준은 포로가 되어 수용소에 갇히는 신세가 되었다. 이윽고 휴전이 성립되고, 포로들을 송환하는 날이 왔다. 포로들에게는 세 갈래의 길이 주어졌다. 남한으로 갈 것인가, 북한으로 돌아갈 것인가, 아니면 그 어느 쪽도 아닌 중립국으로 갈 것인가. 많은 이들이 남이나 북을 택했으나, 명준의 선택은 달랐다. 그는 남한도, 북한도 택하지 않았다. 밀실뿐이던 남쪽도, 껍데기 광장뿐이던 북쪽도, 그에게는 더 이상 돌아갈 곳이 되지 못했던 까닭이다. 양쪽 모두에 깊이 환멸한 명준은, 마침내 제3의 길인 중립국을 택했다. 남도 북도 아닌, 저 멀리 낯선 땅으로 떠나기로 한 것이다.</p>
          <p>그것은 분단된 조국의 두 이념 모두를 거부한, 외롭고도 쓸쓸한 선택이었다. 어디에도 참된 광장이 없다면, 차라리 아무에게도 속하지 않은 곳으로 가겠다는 것이었다. 명준은 그렇게 중립국행 배에 몸을 실었다. 정든 조국을 영영 등진 채로. 조국의 두 쪽 어디에도 그가 돌아갈 광장은 없었다. 차라리 아무도 그를 모르는 낯선 땅에서, 새로 시작해 보고 싶었는지도 몰랐다. 그러나 그 선택은 희망이라기보다, 갈 곳 없는 자의 마지막 몸부림에 가까웠다. 그것은 어쩌면 세상에서 가장 외롭고 쓸쓸한 자유였는지도 몰랐다.</p>

          <p class="section-title">Part 10. 푸른 바다로</p>

          <p class="section-title">Part 1. 임 씨를 부르다</p>
          <p>원미동의 한 집에 사는 그는, 장마철을 앞두고 걱정이 많았다. 해마다 비만 오면 옥상에서 물이 새고 욕실이 눅눅해졌던 까닭이다. 아내와 의논한 끝에, 그는 동네에서 연탄 배달을 하며 틈틈이 막일도 한다는 임 씨를 불러 수리를 맡기기로 했다. 임 씨는 그다지 번듯한 차림은 아니었다. 볕에 그을린 얼굴에 거친 손, 낡은 작업복 차림의 그는, 한눈에도 고된 일로 다져진 막일꾼이었다. 그런 임 씨를 집 안으로 들이며, 그는 어쩐지 마음이 썩 내키지 않았다. 번듯한 기술자도 아니고 연탄이나 나르는 사람에게 집 수리를 맡겨도 될까 하는 미덥지 못한 마음이 들었던 것이다.</p>
          <p>그러나 달리 사람을 구하기도 마땅치 않았고, 임 씨가 품삯도 싸게 해 주겠다 하여 그냥 맡기기로 했다. 임 씨는 옥상과 욕실을 꼼꼼히 둘러보고는, 어디가 어떻게 잘못되었는지를 차분히 설명했다. 그렇게 임 씨와 그의 짧은 인연이 시작되었다. 임 씨는 수리에 필요한 것들을 머릿속으로 가늠하며, 그에게 하나하나 일러 주었다. 그 말투는 투박했으나, 제 일에 밝은 사람다운 자신감이 은근히 묻어났다. 그는 반신반의하면서도, 일단 임 씨에게 집을 맡겨 보기로 했다. 그 선택이 과연 어떤 결과를 가져올지, 그때의 그는 알지 못했다.</p>

          <p class="section-title">Part 2. 미리 품은 의심</p>
          <p>일을 맡기기로는 했으나, 그의 마음 한구석에는 임 씨에 대한 의심이 좀처럼 가시지 않았다. 세상에 떠도는 소문이 그러했다. 막일꾼이란 으레 어수룩한 집주인을 속이기 마련이라는 것이었다. 멀쩡한 곳도 고장 났다고 둘러대 공사를 키우고, 값싼 재료를 쓰면서 비싼 값을 부르고, 일부러 일을 질질 끌어 품삯을 올려 받는다는 이야기를 그는 익히 들어 왔다. 그러니 임 씨 역시 틀림없이 그런 수작을 부리리라고, 그는 지레짐작을 했다. 그는 임 씨가 일하는 내내 곁에서 지켜보며 은근히 경계를 늦추지 않았다. 혹시 쓸데없는 일을 벌이지는 않는지, 재료를 빼돌리지는 않는지 감시하듯 살폈다.</p>
          <p>임 씨가 무슨 말을 할 때마다, 그는 그 속에 숨은 꿍꿍이가 없는지 의심부터 하고 들었다. 그에게 임 씨는 아직 믿을 수 없는, 그저 경계해야 할 막일꾼일 뿐이었다. 그 편견의 눈으로, 그는 임 씨의 일거수일투족을 지켜보고 있었다. 그는 임 씨가 조금이라도 수상한 낌새를 보이면 당장이라도 따질 작정이었다. 손해를 보지 않으려면 막일꾼일수록 바짝 지켜봐야 한다고 믿었던 것이다. 그런 그의 눈초리에는, 임 씨를 향한 불신이 고스란히 담겨 있었다. 그 불신이 머지않아 부끄러운 오해였음이 드러날 줄은, 그는 미처 알지 못했다.</p>

          <p class="section-title">Part 3. 묵묵한 성실함</p>
          <p>그러나 그런 그의 의심은, 임 씨가 일을 시작하자마자 조금씩 흔들리기 시작했다. 임 씨는 그가 생각하던 그런 막일꾼이 아니었다. 그는 입을 꾹 다문 채, 오직 제 일에만 묵묵히 매달렸다. 땀이 비 오듯 흘러도 쉬는 법이 없었고, 꾀를 부리거나 대충 넘어가는 일도 없었다. 옥상의 갈라진 틈을 하나하나 메우고, 방수액을 꼼꼼히 발라 나가는 그 손길에는 정성이 가득했다. 뜨거운 햇볕 아래서 그 고된 일을 하면서도, 임 씨는 조금의 불평도 내비치지 않았다. 그저 제가 맡은 일을 제대로 해내겠다는 일념뿐인 듯했다. 그 성실한 모습을 지켜보던 그는, 어쩐지 머쓱해지기 시작했다.</p>
          <p>꿍꿍이를 품은 사람의 몸놀림이라고는 도무지 보이지 않았던 까닭이다. 임 씨의 묵묵한 땀방울을 바라보며, 그는 제가 품었던 의심이 조금은 부끄러워졌다. 그러면서도 그는 아직 완전히 경계를 풀지는 못했다. 보통의 일꾼이라면 주인이 보지 않는 틈을 타 대충 넘어갔을 법한데, 임 씨에게는 그런 꾀가 없었다. 누가 보든 보지 않든, 그의 일하는 태도는 한결같았다. 그 우직한 성실함이, 그의 삐딱하던 마음을 조금씩 돌려놓고 있었다. 그는 저도 모르게 임 씨의 손끝을 눈여겨보게 되었다. 거기엔 꾸밈없는 장인의 정성이 배어 있었다.</p>

          <p class="section-title">Part 4. 알아서 고쳐 주다</p>
          <p>임 씨의 성실함은 거기서 그치지 않았다. 그는 맡은 일만 겨우 해치우고 마는 사람이 아니었다. 옥상 방수를 하다가 낡은 배수구가 막힌 것을 발견하면, 시키지도 않았는데 그것까지 말끔히 뚫어 놓았다. 욕실을 손보다가 수도꼭지가 헐거운 것을 보면, 두말없이 단단히 조여 주었다. 품삯을 더 받으려는 기색도 전혀 없었다. 그저 눈에 보이는 대로, 손봐야 할 곳이면 어디든 제 일처럼 고쳐 놓는 것이었다. 게다가 임 씨는 재료를 쓰는 데에도 조금의 인색함이 없었다. 값이 좀 나가더라도 튼튼하고 좋은 것을 골라, 오래가도록 꼼꼼히 일을 마무리했다. 어차피 한 번 하는 일, 제대로 해 놓아야 한다는 것이었다.</p>
          <p>그 모습은 그가 소문으로 듣던 막일꾼과는 영 딴판이었다. 제 일처럼 집을 돌보는 임 씨를 보며, 그의 마음속 의심은 점점 자리를 잃어 갔다. 그러나 셈을 치르기 전까지는, 그는 아직 마음을 다 놓지 못했다. 그런 임 씨를 지켜보며, 그는 문득 부끄러운 생각이 들었다. 제 집 일을 제 일보다 더 정성껏 돌봐 주는 사람을, 그동안 도둑이나 되는 양 의심해 왔던 것이다. 임 씨의 손길이 닿은 자리마다, 집은 몰라보게 깔끔해져 갔다. 그렇게 임 씨의 성실함은, 그의 오래된 편견을 서서히 허물어뜨리고 있었다.</p>

          <p class="section-title">Part 5. 가시지 않는 미심쩍음</p>
          <p>임 씨가 아무리 성실하게 일을 해도, 그의 마음 밑바닥에는 한 가닥 미심쩍음이 끈질기게 남아 있었다. 혹시 이 모든 것이, 나중에 품삯을 두둑이 부르기 위한 수작은 아닐까 하는 의심이었다. 지금은 저렇게 성실한 척하다가, 막상 셈을 치를 때가 되면 이것저것 핑계를 대며 큰돈을 요구하지는 않을까. 공연히 없는 일까지 벌여 놓고, 그 값을 몽땅 떠넘기려는 속셈은 아닐까. 그는 임 씨의 지나칠 만큼 성실한 모습이 도리어 수상쩍게 여겨지기까지 했다. 세상에 공짜가 없고, 손해 보려는 사람도 없는 법이니, 저 정성 뒤에는 필시 무슨 꿍꿍이가 있으리라 짐작한 것이다. 그만큼 그의 마음속에는 막일꾼에 대한 불신이 뿌리 깊게 박혀 있었다.</p>
          <p>그는 셈을 치를 그 순간을 은근히 긴장하며 기다렸다. 과연 임 씨가 얼마를 부를지, 그 액수를 듣고 나서야 비로소 그를 믿을 수 있을 것 같았다. 그렇게 수리가 모두 끝나고, 마침내 셈을 치를 때가 되었다. 그만큼 세상에 대한 그의 불신은 뿌리가 깊었다. 남에게 속아 본 경험이, 그로 하여금 사람을 쉬이 믿지 못하게 만들었던 것이다. 임 씨의 정성을 두 눈으로 보면서도, 그는 끝내 마지막 의심 한 가닥을 내려놓지 못했다. 사람을 쉬이 믿지 못하는 그 마음이, 도리어 그 자신을 더 초라하게 만들고 있었다.</p>

          <p class="section-title">Part 6. 뜻밖의 셈</p>
          <p>드디어 임 씨가 품삯을 계산해 내밀었다. 그런데 그 액수를 들은 그는, 그만 제 귀를 의심하고 말았다. 임 씨가 부른 값이, 그가 속으로 각오하고 있던 것보다 훨씬 적었던 것이다. 그뿐만이 아니었다. 임 씨는 애초에 하기로 했던 일 가운데 다 끝내지 못한 부분이 있다며, 그 몫만큼을 셈에서 덜어 내기까지 했다. 더 받으려 떼를 쓰기는커녕, 제 손으로 값을 깎아 내리는 것이었다. 그가 그동안 품어 온 의심과는 완전히 정반대였다. 임 씨는 오직 제가 일한 만큼만, 그것도 더없이 정직하게 셈을 했다. 바가지를 씌우기는커녕, 받아 마땅한 것조차 제대로 챙기지 않는 셈이었다.</p>
          <p>그는 그 뜻밖의 정직함 앞에서 그만 할 말을 잃고 말았다. 세상이 다 저를 속이려 든다고 믿어 온 그에게, 임 씨의 그 정직함은 큰 충격이자 부끄러움이었다. 그는 뒤늦게야, 제가 얼마나 터무니없는 편견에 사로잡혀 있었는지를 깨달았다. 임 씨에게 셈이란, 더 받고 덜 받고를 흥정하는 일이 아니었다. 그저 제가 한 만큼, 땀 흘린 만큼만 정직하게 받는 일이었을 뿐이다. 그 당연한 이치를, 그는 여태 까맣게 잊고 살아왔던 것이다. 정직이라는 당연한 이치가 어째서 이토록 귀하고 낯설게 느껴지는지, 그는 씁쓸함마저 느꼈다.</p>

          <p class="section-title">Part 7. 부끄러움과 술 한잔</p>
          <p>임 씨를 의심했던 제 마음이 부끄러워, 그는 차마 그 돈을 그대로 받을 수가 없었다. 그는 임 씨에게 오히려 미안한 마음이 들었다. 순박하고 정직한 사람을 공연히 도둑 대하듯 경계했던 것이, 두고두고 낯이 뜨거웠다. 그는 그 미안함을 조금이나마 덜고자, 임 씨에게 술이나 한잔하고 가라며 붙들었다. 하루 종일 고된 일을 한 임 씨도 사양하지 않고, 두 사람은 마주 앉아 술잔을 기울였다. 처음에는 서먹하던 분위기도, 술이 몇 잔 돌자 차츰 누그러졌다. 집주인과 막일꾼이라는 벽을 사이에 두고 마주했던 두 사람은, 어느새 사람과 사람으로서 이야기를 나누게 되었다. 그는 임 씨에게 이것저것 말을 건넸고, 임 씨도 그동안 살아온 이야기를 하나둘 풀어놓기 시작했다.</p>
          <p>술기운이 돌수록, 임 씨의 투박한 말 속에 담긴 고단한 삶의 무게가 그의 가슴에 묵직하게 다가왔다. 그는 비로소, 임 씨라는 한 사람의 삶에 진심으로 귀를 기울이게 되었다. 벽 하나를 사이에 두고 서로를 경계하던 두 사람 사이에, 술잔이 오가며 조금씩 온기가 돌기 시작했다. 그는 임 씨가 더 이상 경계해야 할 막일꾼이 아니라, 저와 조금도 다를 바 없는 한 사람임을 느꼈다. 그렇게 두 사람의 거리는 조금씩 좁혀져 갔다. 술잔 너머로 임 씨의 진솔한 얼굴이 비로소 보이기 시작했다.</p>

          <p class="section-title">Part 8. 임 씨의 고단한 삶</p>
          <p>술잔을 기울이며, 임 씨는 제가 살아온 고단한 내력을 띄엄띄엄 들려주었다. 본디 임 씨는 시골에서 농사를 짓던 사람이었다. 그러나 농사만으로는 도무지 식구를 먹여 살릴 수가 없어, 처자식을 데리고 도시로 올라온 것이었다. 도시라고 해서 그를 반겨 주는 곳은 없었다. 배운 것도 가진 것도 없는 그가 할 수 있는 일이라고는, 오직 몸으로 때우는 험한 일뿐이었다. 그래서 그는 연탄을 나르고, 막일을 하고, 닥치는 대로 온갖 일을 하며 하루하루를 버텼다. 여러 입을 가진 식구를 먹여 살리자면, 한시도 몸을 놀릴 수가 없었다. 비가 오나 눈이 오나, 임 씨는 좀처럼 쉬는 날이 없었다.</p>
          <p>그렇게 뼈 빠지게 일을 해도 살림은 좀처럼 펴지지 않았으나, 임 씨는 조금도 세상을 원망하지 않았다. 제 식구를 굶기지 않는 것, 그것 하나만으로도 그는 묵묵히 제 삶을 견뎌 내고 있었다. 그 꾸밈없는 이야기에, 그는 가슴이 뭉클해지는 것을 느꼈다. 그 고단한 세월을 이야기하면서도, 임 씨의 목소리에는 신세 한탄이나 불평이 묻어나지 않았다. 다만 제가 짊어진 삶의 무게를 담담히 받아들이는 사람의 담백함이 있을 뿐이었다. 그 담담함이 도리어 그의 마음을 더욱 아리게 했다. 그 담백함 속에 임 씨라는 사람의 참된 품격이 깃들어 있었다.</p>

          <p>그러나 돈을 떼먹은 자는 번번이 임 씨를 피하거나 빈말로 돌려보냈다. 비를 맞으며 먼 길을 찾아가도, 임 씨는 제가 흘린 땀의 대가를 끝내 받지 못하고 돌아서기 일쑤였다. 그런데도 임 씨는 그 돈을 쉬이 포기하지 못했다. 그것은 제 식구의 끼니가 걸린, 피땀으로 번 정당한 몫이었던 까닭이다. 비 오는 날마다 가리봉동으로 향하는 임 씨의 쓸쓸한 발걸음을 떠올리며, 그는 코끝이 시큰해졌다.</p>

          <p class="section-title">Part 10. 임 씨를 다시 보다</p>
          <p>임 씨의 이야기를 다 듣고 난 그는, 오래도록 말을 잇지 못했다. 처음 임 씨를 막일꾼이라 깔보고 의심했던 제 모습이, 이제는 더없이 부끄럽게 느껴졌다. 그가 편견의 눈으로 함부로 재단했던 임 씨는, 실은 누구보다 정직하고 성실한 사람이었다. 가진 것 없고 배운 것 없어도, 임 씨는 제 손으로 땀 흘려 번 것만을 떳떳이 취하며, 식구를 위해 묵묵히 제 삶을 견뎌 내고 있었다. 세상이 아무리 그를 속이고 떼먹어도, 그는 끝내 정직함을 잃지 않았다.</p>
          <p>그런 임 씨야말로, 번듯한 체면 뒤에서 남을 의심이나 하던 자신보다 훨씬 더 참된 사람이 아닌가. 그는 임 씨에게 깊은 존경과 함께, 가슴 저린 연민을 느꼈다. 임 씨와의 짧은 만남은, 사람을 겉모습만으로 함부로 판단해서는 안 된다는 깊은 깨달음을 그에게 남겼다. 비 오는 날 가리봉동으로 향하는 임 씨의 뒷모습을, 그는 오래도록 잊지 못할 것 같았다.</p>
        `
      },

    };

    // 각 파트별 클릭해야 할 문장 수 추적
    let partSentenceCounts = {};  // { partNum: totalSentences }
    let clickedSentences = {};    // { partNum: Set of clicked indices }

    // 진행 상태 UI 생성
    function renderProgressDots() {
      let html = '<div class="part-progress">';
      for (let i = 1; i <= 10; i++) {
        let className = 'part-dot';
        if (completedParts.includes(i)) {
          className += ' completed';
        } else if (i === currentPart) {
          className += ' current';
        }
        html += `<div class="${className}" onclick="scrollToPart(${i})">${i}</div>`;
      }
      html += '</div>';
      return html;
    }

    // 특정 파트로 스크롤
    function scrollToPart(partNum) {
      const partSection = document.getElementById('part-' + partNum);
      if (partSection) {
        partSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    // 문장을 클릭 가능하게 변환 (isCompleted: 완료된 파트는 모두 clicked 상태)
    function makeSentencesClickable(content, partNum, isCompleted = false) {
      // p 태그 내용만 처리 (section-title 제외)
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = content;

      const paragraphs = tempDiv.querySelectorAll('p:not(.section-title)');
      let sentenceIndex = 0;

      paragraphs.forEach(p => {
        const text = p.innerHTML;
        // 문장 단위로 분리 (마침표, 물음표, 느낌표 기준)
        const sentences = text.split(/(?<=[.?!])\s+/);

        const wrappedSentences = sentences.map(sentence => {
          if (sentence.trim()) {
            const clickedClass = isCompleted ? ' clicked' : '';
            const wrapped = `<span class="clickable-sentence${clickedClass}" data-part="${partNum}" data-idx="${sentenceIndex}" onclick="clickSentence(${partNum}, ${sentenceIndex})">${sentence}</span>`;
            sentenceIndex++;
            return wrapped;
          }
          return sentence;
        });

        p.innerHTML = wrappedSentences.join(' ');
      });

      // 해당 파트의 총 문장 수 저장
      partSentenceCounts[partNum] = sentenceIndex;
      if (!clickedSentences[partNum]) {
        clickedSentences[partNum] = new Set();
      }

      return tempDiv.innerHTML;
    }

    // 도서 표시 (전체 스크롤, 파트별 문장 클릭)
    function displayBook(id) {
      const container = document.getElementById('bookContent');
      const book = BOOK_DATA[id];

      // 현재 파트에 맞는 배경 이미지 설정
      updateBackground(id, currentPart);

      if (!book) {
        container.innerHTML = `
          <div class="error">
            해당 도서를 찾을 수 없습니다.<br>
            (도서 ID: ${id || '없음'})
          </div>
        `;
        return;
      }

      // 파트별로 분리
      const regex = /<p class="section-title">Part (\d+)\.([^<]*)<\/p>([\s\S]*?)(?=<p class="section-title">Part \d+\.|$)/g;
      let partsHtml = '';
      let match;

      while ((match = regex.exec(book.content)) !== null) {
        const partNum = parseInt(match[1]);
        const partTitle = match[2];
        const partContent = match[3];

        // 파트 상태 결정
        let partClass = 'part-section';
        if (completedParts.includes(partNum)) {
          partClass += ' completed-part';
        } else if (partNum === currentPart) {
          partClass += ' current';
        } else if (partNum > currentPart) {
          partClass += ' locked';
        }

        // 현재 파트만 문장 클릭 가능하게
        let processedContent = partContent;
        if (partNum === currentPart) {
          processedContent = makeSentencesClickable(partContent, partNum);
        } else if (completedParts.includes(partNum)) {
          // 완료된 파트는 문장을 clicked 상태로 표시
          processedContent = makeSentencesClickable(partContent, partNum, true);
        }

        partsHtml += `
          <div class="${partClass}" id="part-${partNum}">
            <p class="section-title">Part ${partNum}.${partTitle}</p>
            ${processedContent}
          </div>
        `;
      }

      container.innerHTML = `
        <div class="book-header">
          <div class="book-title">${book.title}</div>
          <div class="book-author">${book.author}</div>
        </div>
        ${renderProgressDots()}
        <div class="book-content">
          ${partsHtml}
        </div>
      `;

      // 현재 파트로 스크롤
      setTimeout(() => scrollToPart(currentPart), 100);

      // 이미 클릭된 문장들 표시 복원
      restoreClickedState();
    }

    // 클릭 상태 복원
    function restoreClickedState() {
      if (clickedSentences[currentPart]) {
        clickedSentences[currentPart].forEach(idx => {
          const sentence = document.querySelector(`.clickable-sentence[data-part="${currentPart}"][data-idx="${idx}"]`);
          if (sentence) {
            sentence.classList.add('clicked');
          }
        });
      }
    }

    // 문장 클릭 처리
    function clickSentence(partNum, idx) {
      // 현재 파트가 아니면 무시
      if (partNum !== currentPart) return;

      const sentence = document.querySelector(`.clickable-sentence[data-part="${partNum}"][data-idx="${idx}"]`);
      if (!sentence || sentence.classList.contains('clicked')) return;

      // 클릭 표시
      sentence.classList.add('clicked');
      clickedSentences[partNum].add(idx);

      // 해당 파트의 모든 문장을 클릭했는지 확인
      if (clickedSentences[partNum].size >= partSentenceCounts[partNum]) {
        // 모든 문장 클릭 완료 → 퀴즈 표시
        setTimeout(() => showQuiz(partNum), 500);
      }
    }

    // 현재 파트 문장 클릭 초기화 (오답 시)
    function resetCurrentPartClicks() {
      clickedSentences[currentPart] = new Set();
      document.querySelectorAll(`.clickable-sentence[data-part="${currentPart}"]`).forEach(el => {
        el.classList.remove('clicked');
      });
    }

    // 퀴즈 표시
    function showQuiz(partNum) {
      const mainIdeas = PART_MAIN_IDEAS[bookId];
      if (!mainIdeas) return;

      const correctAnswer = mainIdeas[partNum - 1];
      const otherAnswers = mainIdeas.filter((_, idx) => idx !== partNum - 1);

      // 다른 답변 중 3개 랜덤 선택
      const shuffledOthers = otherAnswers.sort(() => Math.random() - 0.5).slice(0, 3);

      // 정답 포함 4개 옵션 섞기
      const options = [correctAnswer, ...shuffledOthers].sort(() => Math.random() - 0.5);

      currentQuizAnswer = options.indexOf(correctAnswer);
      selectedAnswer = null;

      document.getElementById('quizPartLabel').textContent = `Part ${partNum}`;

      const optionsContainer = document.getElementById('quizOptions');
      optionsContainer.innerHTML = options.map((opt, idx) =>
        `<div class="quiz-option" onclick="selectQuizOption(${idx})">${idx + 1}. ${opt}</div>`
      ).join('');

      const submitBtn = document.getElementById('quizSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '정답 확인';
      submitBtn.style.display = 'block';
      submitBtn.onclick = submitQuizAnswer;
      document.getElementById('quizResult').style.display = 'none';
      document.getElementById('quizOverlay').classList.add('active');
    }

    // 퀴즈 옵션 선택
    function selectQuizOption(idx) {
      if (document.querySelector('.quiz-option.correct')) return; // 이미 제출 후에는 선택 불가

      selectedAnswer = idx;
      document.querySelectorAll('.quiz-option').forEach((opt, i) => {
        opt.classList.toggle('selected', i === idx);
      });
      document.getElementById('quizSubmitBtn').disabled = false;
    }

    // 퀴즈 정답 제출
    function submitQuizAnswer() {
      if (selectedAnswer === null) return;

      const options = document.querySelectorAll('.quiz-option');
      const resultDiv = document.getElementById('quizResult');
      const submitBtn = document.getElementById('quizSubmitBtn');

      if (selectedAnswer === currentQuizAnswer) {
        // 정답 - 폭죽 효과
        showConfetti();

        options[selectedAnswer].classList.add('correct');
        resultDiv.className = 'quiz-result correct';
        resultDiv.innerHTML = '🎉 정답입니다!';
        resultDiv.style.display = 'block';

        // 파트 완료 처리
        if (!completedParts.includes(currentPart)) {
          completedParts.push(currentPart);
        }

        // 버튼 숨기고 1.2초 후 자동으로 다음 파트로 이동
        submitBtn.style.display = 'none';
        setTimeout(() => {
          closeQuizAndNext();
        }, 1200);
      } else {
        // 오답 - 엑스 표시 효과
        showWrongX();

        options[selectedAnswer].classList.add('wrong');
        options[currentQuizAnswer].classList.add('correct');
        resultDiv.className = 'quiz-result wrong';
        resultDiv.innerHTML = '오답입니다. 다시 문장을 클릭해주세요.';
        resultDiv.style.display = 'block';

        // 버튼 숨기고 1.2초 후 자동으로 다시 읽기
        submitBtn.style.display = 'none';
        setTimeout(() => {
          closeQuizAndRetry();
        }, 1200);
      }
    }

    // 오답 시 퀴즈 닫고 다시 시작
    function closeQuizAndRetry() {
      document.getElementById('quizOverlay').classList.remove('active');
      resetCurrentPartClicks();
      scrollToPart(currentPart);
    }

    // 퀴즈 닫고 다음 파트로
    function closeQuizAndNext() {
      document.getElementById('quizOverlay').classList.remove('active');

      if (currentPart < 10) {
        currentPart++;
        // 배경 이미지 변경
        updateBackground(bookId, currentPart);
        displayBook(bookId);
      } else {
        // 완독 완료
        completeReading();
      }
    }

    // 완독 완료 처리
    function completeReading() {
      // 총 독해 시간 계산
      const totalSeconds = Math.floor((Date.now() - readingStartTime) / 1000);
      const timeString = formatTime(totalSeconds);

      // 총 독해 시간 표시
      document.getElementById('totalReadingTime').textContent = timeString;

      // 폭죽 효과
      showConfetti();

      // 완독 팝업 표시
      document.getElementById('completeOverlay').classList.add('active');

      // 부모 창에 완독 완료 알림
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'readingComplete',
          bookId: bookId,
          totalTime: totalSeconds
        }, '*');
      }
    }

    // 완독 팝업 닫기
    function closeCompletePopup() {
      document.getElementById('completeOverlay').classList.remove('active');

      // 완독 완료 화면 표시
      const container = document.getElementById('bookContent');
      const book = BOOK_DATA[bookId];
      const totalSeconds = Math.floor((Date.now() - readingStartTime) / 1000);
      const timeString = formatTime(totalSeconds);

      container.innerHTML = `
        <div class="book-header">
          <div class="book-title">${book.title}</div>
          <div class="book-author">${book.author}</div>
        </div>
        ${renderProgressDots()}
        <div class="book-content" style="text-align: center; padding: 60px 40px;">
          <div style="font-size: 60px; margin-bottom: 20px;">🎉</div>
          <div style="font-size: 24px; font-weight: 700; color: #10b981; margin-bottom: 12px;">완독을 축하합니다!</div>
          <div style="font-size: 16px; color: #374151; margin-bottom: 8px;">총 독해 시간</div>
          <div style="font-size: 28px; font-weight: 700; color: #3b82f6; margin-bottom: 24px;">${timeString}</div>
          <div style="font-size: 16px; color: #6b7280; margin-bottom: 30px;">모든 파트를 읽고 중심 내용을 확인했습니다.</div>
          <div style="font-size: 15px; color: #10b981; font-weight: 600;">이제 문제풀이를 시작해주세요!</div>
        </div>
      `;
    }

    // 초기화
    if (bookId) {
      displayBook(bookId);
    } else {
      document.getElementById('bookContent').innerHTML = `
        <div class="error">도서 ID가 지정되지 않았습니다.</div>
      `;
    }
  </script>
</body>
