<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스피드 독서왕 - 도서 읽기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      transition: background-image 0.5s ease-in-out;
    }
    .book-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px 100px;
    }
    .book-header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 16px;
      color: white;
    }
    .book-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .book-author {
      font-size: 16px;
      opacity: 0.9;
    }
    .book-content {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      line-height: 2;
      font-size: 18px;
      color: #333;
    }
    .book-content p {
      margin-bottom: 20px;
      text-indent: 1em;
    }
    .book-content .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #10b981;
      margin: 30px 0 20px;
      text-indent: 0;
    }
    .loading {
      text-align: center;
      padding: 100px 20px;
      color: #666;
      font-size: 18px;
    }
    .error {
      text-align: center;
      padding: 100px 20px;
      color: #ef4444;
      font-size: 18px;
    }

    /* 파트별 진행 UI */
    .part-progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      background: #f8fafc;
      padding: 15px 0;
      z-index: 100;
    }
    .part-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      transition: all 0.3s;
      cursor: pointer;
    }
    .part-dot.completed {
      background: #10b981;
      color: white;
    }
    .part-dot.current {
      background: #3b82f6;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    /* 문장 클릭 스타일 */
    .clickable-sentence {
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 4px;
      padding: 2px 4px;
      margin: -2px -4px;
      display: inline;
    }
    .clickable-sentence:hover {
      background: #fef3c7;
    }
    .clickable-sentence.clicked {
      background: #d1fae5;
      color: #065f46;
    }
    .clickable-sentence.disabled {
      cursor: default;
    }
    .clickable-sentence.disabled:hover {
      background: transparent;
    }

    /* 파트 섹션 스타일 */
    .part-section {
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e5e7eb;
    }
    .part-section:last-child {
      border-bottom: none;
    }
    .part-section.locked .clickable-sentence {
      cursor: default;
      color: #9ca3af;
    }
    .part-section.locked .clickable-sentence:hover {
      background: transparent;
    }
    .part-section.completed-part .clickable-sentence {
      background: #d1fae5;
      color: #065f46;
      cursor: default;
    }
    .part-section.completed-part .clickable-sentence:hover {
      background: #d1fae5;
    }

    /* 중심내용 퀴즈 팝업 */
    .quiz-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .quiz-overlay.active {
      display: flex;
    }
    .quiz-popup {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .quiz-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .quiz-part-label {
      display: inline-block;
      background: #3b82f6;
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .quiz-title {
      font-size: 20px;
      font-weight: 700;
      color: #1f2937;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quiz-option {
      padding: 16px 20px;
      background: #f8fafc;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      color: #374151;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .quiz-option:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .quiz-option.selected {
      border-color: #3b82f6;
      background: #dbeafe;
    }
    .quiz-option.correct {
      border-color: #10b981;
      background: #d1fae5;
      color: #065f46;
    }
    .quiz-option.wrong {
      border-color: #ef4444;
      background: #fee2e2;
      color: #991b1b;
    }
    .quiz-submit-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .quiz-submit-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .quiz-result {
      text-align: center;
      padding: 20px;
      margin-top: 16px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
    }
    .quiz-result.correct {
      background: #d1fae5;
      color: #065f46;
    }
    .quiz-result.wrong {
      background: #fee2e2;
      color: #991b1b;
    }

    /* 폭죽 효과 */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2000;
      overflow: hidden;
      display: none;
    }
    .confetti {
      position: absolute;
      top: -20px;
      font-size: 20px;
      animation: confetti-fall 2s ease-out forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* 엑스 표시 효과 */
    .wrong-x-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      pointer-events: none;
    }
    .wrong-x {
      font-size: 150px;
      color: #ef4444;
      animation: wrong-shake 0.5s ease-out;
      text-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
    }
    @keyframes wrong-shake {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.2) rotate(-5deg); }
      50% { transform: scale(1.1) rotate(5deg); }
      75% { transform: scale(1.15) rotate(-3deg); }
    }

    /* 완독 축하 팝업 */
    .complete-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1500;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .complete-overlay.active {
      display: flex;
    }
    .complete-popup {
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      animation: popup-bounce 0.5s ease-out;
    }
    @keyframes popup-bounce {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .complete-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    .complete-title {
      font-size: 28px;
      font-weight: 700;
      color: #10b981;
      margin-bottom: 16px;
    }
    .complete-time {
      font-size: 18px;
      color: #374151;
      margin-bottom: 8px;
    }
    .complete-time-value {
      font-size: 32px;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 24px;
    }
    .complete-message {
      font-size: 16px;
      color: #6b7280;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .complete-btn {
      display: inline-block;
      padding: 16px 40px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .complete-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>
  <div class="book-container">
    <div id="bookContent">
      <div class="loading">도서를 불러오는 중...</div>
    </div>
  </div>

  <!-- 폭죽 효과 컨테이너 -->
  <div class="confetti-container" id="confettiContainer"></div>

  <!-- 엑스 표시 효과 -->
  <div class="wrong-x-container" id="wrongXContainer">
    <div class="wrong-x">✕</div>
  </div>

  <!-- 중심내용 퀴즈 팝업 -->
  <div class="quiz-overlay" id="quizOverlay">
    <div class="quiz-popup">
      <div class="quiz-header">
        <div class="quiz-part-label" id="quizPartLabel">Part 1</div>
        <div class="quiz-title">이 파트의 중심 내용은?</div>
      </div>
      <div class="quiz-options" id="quizOptions"></div>
      <button class="quiz-submit-btn" id="quizSubmitBtn" disabled onclick="submitQuizAnswer()">정답 확인</button>
      <div class="quiz-result" id="quizResult" style="display:none;"></div>
    </div>
  </div>

  <!-- 완독 축하 팝업 -->
  <div class="complete-overlay" id="completeOverlay">
    <div class="complete-popup">
      <div class="complete-icon">🎉</div>
      <div class="complete-title">완독을 축하합니다!</div>
      <div class="complete-time">총 독해 시간</div>
      <div class="complete-time-value" id="totalReadingTime">0분 0초</div>
      <div class="complete-message">
        모든 파트를 읽고 중심 내용을 확인했습니다.<br>
        이제 문제풀이를 시작해주세요!
      </div>
      <button class="complete-btn" onclick="closeCompletePopup()">확인</button>
    </div>
  </div>

  <script>
    // URL에서 도서 ID 가져오기
    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('id');

    // 파트별 진행 상태
    let currentPart = 1;
    let completedParts = [];
    let selectedAnswer = null;
    let currentQuizAnswer = null;
    let readingStartTime = Date.now(); // 독해 시작 시간

    // 폭죽 효과
    function showConfetti() {
      const container = document.getElementById('confettiContainer');
      container.style.display = 'block';
      container.innerHTML = '';

      const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6', '#e84393', '#00d2d3', '#ff9f43'];
      const shapes = ['🎉', '🎊', '⭐', '✨', '💫', '🌟', '🎈', '🎀'];

      for (let i = 0; i < 60; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        confetti.style.animationDuration = (Math.random() * 1 + 1.5) + 's';
        confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];
        confetti.style.fontSize = (Math.random() * 15 + 15) + 'px';
        container.appendChild(confetti);
      }

      setTimeout(() => {
        container.style.display = 'none';
        container.innerHTML = '';
      }, 2500);
    }

    // 엑스 표시 효과
    function showWrongX() {
      const container = document.getElementById('wrongXContainer');
      container.style.display = 'flex';

      setTimeout(() => {
        container.style.display = 'none';
      }, 800);
    }

    // 시간 포맷팅
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}분 ${secs}초`;
    }

    // 도서별 파트 이미지 경로 매핑
    const PART_IMAGES = {
      // 스피드 독서왕 주요 도서
      sonagi: (part) => `/rain/rain_${String(part).padStart(2, '0')}.jpg`,
      goodday: (part) => `/good/good1_${String(part).padStart(2, '0')}.jpg`,
      dongbaek: (part) => `/flower/flower${String(part).padStart(2, '0')}.jpg`,
      chunhyang: (part) => `/girl/girl${String(part).padStart(2, '0')}.jpg`,
      samdae: (part) => `/three/three${String(part).padStart(2, '0')}.jpg`,
      // 기타 도서
      love: (part) => `/images/love/love${String(part).padStart(2, '0')}.jpg`,
      sampo: (part) => `/images/sampo/sampo${String(part).padStart(2, '0')}.jpg`,
      cap: (part) => `/images/cap/cap${String(part).padStart(2, '0')}.jpg`,
      sim: (part) => `/images/sim/sim${String(part).padStart(2, '0')}.jpg`,
      toki: (part) => `/images/toki/toki${String(part).padStart(2, '0')}.jpg`,
      hu: (part) => `/images/hu/hu${String(part).padStart(2, '0')}.jpg`,
      rich: (part) => `/images/rich/rich${String(part).padStart(2, '0')}.jpg`,
      yang: (part) => `/images/yang/yang${String(part).padStart(2, '0')}.jpg`,
      chunbyun: (part) => `/images/chunbyun/chunbyun${String(part).padStart(2, '0')}.jpg`,
      guunmong: (part) => `/images/guunmong/guunmong${String(part).padStart(2, '0')}.jpg`,
      jangma: (part) => `/images/jangma/jangma${String(part).padStart(2, '0')}.jpg`,
      hong: (part) => `/images/hong/hong${String(part).padStart(2, '0')}.jpg`,
      hwang: (part) => `/images/hwang/hwang${String(part).padStart(2, '0')}.jpg`,
      lee: (part) => `/images/lee/lee${String(part).padStart(2, '0')}.jpg`,
      lady: (part) => `/images/lady/lady${String(part).padStart(2, '0')}.jpg`,
      nine: (part) => `/images/nine/nine${String(part).padStart(2, '0')}.jpg`,
      park: (part) => `/images/park/park${String(part).padStart(2, '0')}.jpg`,
      suk: (part) => `/images/suk/suk${String(part).padStart(2, '0')}.jpg`,
      sunan: (part) => `/images/sunan/sunan${String(part).padStart(2, '0')}.jpg`,
      un: (part) => `/images/un/un${String(part).padStart(2, '0')}.jpg`
    };

    // 배경 이미지 변경 함수
    function updateBackground(bookId, partNum) {
      console.log('updateBackground called:', bookId, partNum);
      if (PART_IMAGES[bookId]) {
        const imgUrl = PART_IMAGES[bookId](partNum);
        console.log('Setting background image:', imgUrl);
        document.body.style.backgroundImage = `url('${imgUrl}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';
      } else {
        console.log('No image mapping for bookId:', bookId);
      }
    }

    // 각 도서별 파트 중심내용 데이터
    const PART_MAIN_IDEAS = {
      bimun1: [
        "조선 사람들은 시계보다 자연의 흐름에 맞춰 살아 시계가 필요 없었다",
        "농사를 위해 계절을 알려 주는 달력이 시계보다 훨씬 중요했다",
        "조상들은 절기에 맞춰 자연의 질서를 따르며 한 해 농사를 지었다",
        "공업이 발달하면서 자연을 따르던 농사와 달리 시계가 중요해지기 시작했다",
        "공업 사회에서는 시간을 들인 만큼 생산량이 늘어 시간이 곧 돈이 되었다",
        "도시가 커지며 사람들은 자연의 흐름 대신 시계의 시간에 맞춰 살게 되었다",
        "더 많은 생산을 위해 자연의 질서를 거스른 인간에게 그 대가가 돌아왔다",
        "계절을 무시한 생산과 소비가 자원을 축내고 자연의 균형을 무너뜨렸다",
        "자연의 리듬(철)을 아는 사람은 무리하지 않아 세상을 온전하게 한다",
        "시계의 조급함에서 벗어나 달력이 담은 자연의 리듬을 되새겨야 한다"
      ],
      bimun2: [
        "청산도는 산·바다·하늘이 푸른 아름다운 섬으로, 아시아 첫 슬로시티로 선정되었다",
        "청산도의 슬로길은 원래 있던 마을길을 살려 자연과 잘 어우러진, 느리게 걷는 길이다",
        "시간이 넉넉지 않다면 1박 2일로 경치 좋은 1·4번과 볼거리 많은 5번 코스를 추천한다",
        "1번 코스는 유채꽃밭·청보리밭·바다가 어우러져 산·들·바다를 한눈에 감상할 수 있다",
        "1번 코스는 영화·드라마 촬영지로 유명하고, 끝의 화랑포에서 인생 사진을 남길 수 있다",
        "4번 코스 낭길은 낭떠러지를 끼고도 울창한 숲 사이로 나 있어 바다 위를 걷는 듯 신비롭다",
        "5번 코스에는 범이 웅크린 모습을 닮은 범바위 등 독특한 볼거리가 많다",
        "범바위 정상에서는 넓은 바다와 작은 섬들이 한눈에 들어와 가슴이 뻥 뚫린다",
        "구들장논은 돌 많고 물 부족한 청산도에서 농사지으려 만든, 주민의 지혜가 담긴 논이다",
        "장기미(공룡알) 해변까지 둘러보며 청산도 슬로길에서 오래 남을 추억을 만들 수 있다"
      ],
      bimun3: [
        "잘못된 식습관, 특히 즉석식품·외식으로 소금을 지나치게 섭취하는 것이 아이들 건강을 위협한다",
        "즉석식품·외식 자체가 아니라 그 속 소금을 과다 섭취하는 것이 문제다",
        "세포생물학자들은 짜게 먹어 몸의 수분이 부족해지는 것을 건강 문제의 원인으로 보아 소금을 '물 도둑'이라 한다",

        '항아리 냉장고는 큰 항아리 속 작은 항아리 사이를 젖은 모래로 채우는데, 진흙 항아리가 바깥 열의 전달을 줄이고 모래 속 물이 증발하며 주변의 열을 빼앗아, 전기 없이도 냉장 효과를 얻는 과학 원리를 이용한다.',
        '오염된 물을 빨아들여 정화해 마시게 하는 휴대용 장치 라이프 스트로는 거대한 정수 시설 없이 개인이 식수를 얻게 하여, 사용자가 처한 환경을 고려해 꼭 필요한 기능을 간단한 도구로 구현한 적정 기술이다.',
        '자동차 바퀴처럼 생겨 구멍에 줄을 엮어 굴려 운반하는 물통 큐 드럼은 특별한 동력 없이 모양과 운반 방식만 바꿔 힘이 약한 아이도 쉽게 물을 옮기게 하여, 작은 아이디어가 큰 도움을 줄 수 있음을 보여 준다.',
        '덥고 건조한 서남아시아에서는 두꺼운 흙벽돌 벽과 높은 천장·꼭대기 창문, 호리병 물병으로 에어컨 없이 실내를 시원하게 유지했는데, 재료·구조·물의 성질을 이용한 적정 기술의 특징을 잘 보여 준다.',
        '흙벽돌집은 두꺼운 흙벽돌의 단열로 바깥 열을 막고 더운 공기가 높은 창으로 빠져나가게 하며, 호리병 속 물이 열에너지를 흡수해 증발하는 원리로 사막에서도 시원하게 지낼 수 있는, 자연의 성질을 활용한 지혜이다.',
        '가장 추운 극지방의 이누이트는 눈으로 이글루를 짓고 내부 벽에 물을 뿌려 그 물이 얼며 응고열을 방출해 실내를 덥히는데, 흔한 눈을 재료로 활용해 혹독한 추위에 대응한 생활의 지혜가 담겨 있다.',
        '눈 오는 날의 포근함도 물이 얼며 열을 방출하는 현상인 것처럼 과학은 삶 깊숙이 함께하며 적정 기술의 밑바탕에도 과학이 숨어 있으니, 우리도 과학적 사고를 바탕으로 적정 기술을 개발하고 부족한 에너지를 보충할 방법을 함께 모색해 보자.'
      ],
      simhwa1_11: [
        '우리나라는 배달 공화국이라 할 만큼 배달 산업이 발달해 별의별 물건을 당일 배달까지 하며 빠른 전달이 경쟁력이 되었는데, 빠른 배달이 언제나 좋은지 그 과정에 숨은 문제를 돌아볼 필요가 있다.',
        '소비자는 빨라진 배달을 편리하게 느끼지만 그 이면에는 그림자가 있어, 일부 택배 기사가 시간을 맞추려 과속·신호위반으로 사고를 내며 산업 재해의 절반 이상이 교통사고로, 속도 압박이 안전을 위협한다.',
        '아침에 분류한 물건을 그날 다 배달해야 하는 택배 기사는 물건이 쌓여 밤늦게까지 일하고 쉬는 시간·배송 시간을 줄여야 하는데, 소비자가 빠르게 받는 동안 기사는 긴 노동을 감당하며 건강이 위협받는다.',
        '2017년 조사에서 서울 택배 기사의 주당 평균 노동이 74시간, 연 3,848시간으로 OECD 1인당 1,759시간의 두 배가 넘고 우리나라 평균 2,024시간보다 1,824시간 많아, 빠른 배송 유지의 부담이 그만큼 컸다.',
        '택배 기사는 한 달 평균 25.3일 근무에 휴무일은 0.152일뿐이고 쉬는 날 없다는 응답이 90.6퍼센트, 아파도 일한 응답이 74.1퍼센트로, 과도한 노동과 부족한 휴식으로 건강이 위협받고 있었다.',
        '배달 산업이 커지면 수입도 늘 것 같지만 시장 과열로 가격 경쟁이 심해져 배송량이 늘어도 수입은 그대로였고, 유류비 등 비용을 직접 부담해 한 건당 800원 정도만 남아 산업 성장이 소득 증가로 이어지지 않았다.',
        '한 건당 800원으로 월 350만 원을 벌려면 25.3일간 하루 170개 가까이, 하루 12시간, 한 시간에 14개 넘게 배달해야 하는데, 싣고 이동해 전달하는 과정까지 더하면 여유 없는 일정이라 쉴 새 없이 움직여야 한다.',
        '가격·속도 경쟁에서 소비자는 싸고 빠른 배달을, 기업은 소비자 확보를 원하지만 그 부담은 배송을 담당하는 택배 기사에게 집중되므로, 편리함만을 기준으로 배달의 가치를 판단해서는 안 된다.',
        '모든 노동자는 바람직한 환경에서 일할 권리가 있고 택배 기사도 핵심 노동자이니 안전한 환경을 보장받아야 하며, 산업 발전은 이용자 편의만이 아니라 노동자의 삶도 나아지는 것이어야 하므로 그들의 시간과 위험에도 관심을 기울여야 한다.',
        '우리의 편리함이 누군가의 희생을 바탕으로 한 것이라면 때로 포기할 수 있어야 하며, 배달 속도만 중시하지 않았는지 돌아보고 필요한 시간을 이해하며 작은 불편을 받아들여, 소비자의 편리함과 노동자의 권리가 함께 존중될 때 배달 산업도 바람직하게 발전한다.'
      ],
      simhwa1_12: [
        '플라스틱은 가볍고 변형이 쉽고 다양한 빛깔과 절연성 덕에 여러 제품에 쓰여 생활 깊숙이 자리 잡았지만, 잠깐 쓰고 버린 플라스틱이 자연에 오래 남아 예상 못한 피해를 일으킬 수 있어 그 편리함 뒤의 문제를 살펴야 한다.',
        '플라스틱이 문제가 되는 가장 큰 이유는 잘 썩지 않아 분해에 500년 이상 걸려 지금까지 생산한 것이 지구에 남아 있을 수 있는데도, 재활용된다는 생각에 쉽게 쓰고 버려 작은 편리함에 큰 손실을 부르는 소탐대실을 하고 있는지 모른다.',
        '플라스틱은 종류가 다양해 재질별 선별이 어렵고 이물질 묻은 용기도 많아 실제 재활용량은 적고 재활용해도 품질 낮은 제품에 쓰이기 쉬우므로, 분리배출만으로 버린 플라스틱이 모두 새 제품이 된다고 생각해서는 안 된다.',
        '이물질이나 섞인 재질 때문에 재활용 시 품질이 떨어져 함지·정화조 같은 낮은 제품이 되고 페트병조차 화학 솜·노끈이 되기 쉬우므로, 재활용은 도움은 되나 모든 문제를 해결하지 못해 처음부터 적게 쓰는 노력이 필요하다.',
        '재활용 안 된 플라스틱은 태우거나 묻지만 수거된 것에만 해당하고 수거 안 된 것은 떠돌다 바다로 흘러들어 작은 조각으로 부서져 바다 생물과 마주치니, 눈앞에서 사라졌다고 자연에서 없어진 것은 아님을 기억해야 한다.',
        '2009년 크리스 조던이 미드웨이섬에서 찍은 사진 속 멸종 위기종 앨버트로스는 몸속에 플라스틱 조각이 가득했는데, 작아진 조각을 먹이로 착각해 삼켜 영양을 얻지 못하고 영양실조로 죽어 간 것으로, 바다 쓰레기의 위험을 보여 준다.',
        '붉은바다거북은 백 개씩 일곱 번 알을 낳아도 태어난 곳에 돌아올 확률이 5,000분의 1에 지나지 않을 만큼 본래 생존이 어려운데, 바다를 떠다니는 플라스틱 쓰레기가 그 낮은 생존 가능성을 더욱 떨어뜨린다.',
        '바다거북은 플라스틱·비닐·풍선을 해파리 먹이로 착각해 삼키지만 소화되지 않아 영양을 얻지 못하고 화학 물질이 쌓여 이상 행동·약한 알·죽음에 이르니, 무심코 버린 쓰레기가 다음 세대의 생존까지 위협한다.',
        '2012년 제주 김녕 앞바다에서 떠밀려 온 어린 뱀머리돌고래는 부검 결과 근육·지방층이 부족하고 위에서 비닐·끈 뭉치가 나와 영양 부족으로 죽은 것으로, 바다의 플라스틱이 우리나라 바다 생명도 위협함을 보여 준다.',
        '해양 쓰레기의 60~80퍼센트인 플라스틱은 동물과 경관·관광·선박을 해치고 미세 플라스틱은 물고기·굴을 통해 우리 식탁에 올라 건강까지 위협하므로, 플라스틱을 줄일 만큼 줄이고 특히 일회용 제품은 되도록 선택하지 않는 태도가 필요하다.'
      ],
      simhwa2_01: [
        '우리는 빛을 좋고 어둠을 나쁘게 여기지만 건강 관점에서는 어둠도 빛만큼 중요한데, 인공조명 발달로 밤낮 구분이 흐려지고 도심 밤이 환해진 생활이 정말 아무 문제도 일으키지 않는지 생각해 보아야 한다.',
        '멜라토닌은 어두운 환경에서 만들어지고 밝은 빛에 노출되면 합성이 억제되는 호르몬으로 수면·체온 조절과 항산화·면역·기억에 관여하므로, 어둠은 몸이 리듬을 유지하도록 돕는 환경이라 밤의 빛은 이 조절 과정을 방해할 수 있다.',
        '우리는 수많은 인공 빛에 둘러싸여 자신도 모르게 생체 리듬이 흐트러지고 관련 증상을 겪을 수 있는데, 일부 연구는 야간 인공조명 노출과 유방암 위험의 관련성을 보고하며 빛이 멜라토닌 합성을 억제하는 점을 원인으로 본다.',
        '빛 공해는 동물에게도 영향을 주어 호숫가 야간 조명은 동물성 플랑크톤의 성장을 막고 녹조류를 늘려 수질을 나쁘게 하며, 물속 생물과 물의 상태가 달라져 물고기 생태까지 해치니 육지의 불빛이 물속 생명을 바꾼다.',
        '인공 빛은 벌의 비행을 방해하고 철새가 빛을 별빛으로 착각해 경로를 벗어나 건물에 부딪혀 죽게 하므로, 빛은 이들에게 방향 판단에 영향을 주는 요소이며 편리를 위한 조명이 다른 생물에게 혼란을 줄 수 있다.',
        '식물도 빛 받는 시간에 영향을 받아 하루 종일 빛에 노출되면 꽃·씨 맺기에 문제가 생기고 빛에 민감한 들깨는 씨를 못 맺고 키만 자라므로, 건강한 성장에는 빛의 밝기뿐 아니라 받는 시간도 중요하며 어둠도 필요하다.',
        '국립식량과학원 연구에서 밤에 6~10럭스 빛에 장기간 노출되자 벼 16퍼센트·보리 20퍼센트·들깨 94퍼센트 수확량이 줄어, 야간 조명이 작물마다 다른 영향을 주며 빛과 어둠의 주기가 어긋나면 농업 생산도 피해를 입는다.',
        '지나친 인공 빛은 사람의 수면·생체 리듬, 동물의 이동·먹이 활동, 식물의 꽃·씨 맺기와 수확량에 영향을 주어, 문명의 상징인 조명의 이면에 생명과 환경의 문제가 숨어 있으니 빛 공해는 건강·생태계·식량에 연결된 문제이다.',
        '세계 여러 나라가 인공 빛을 규제하고 불필요한 조명을 줄이지만 규제만으로 막을 수 없고 밝은 밤을 당연시하는 생활 방식이 그대로면 과도한 조명이 계속되므로, 편리함이 건강과 자연에 남기는 상처를 돌아보고 필요한 빛과 불필요한 빛을 구별해야 한다.',
        '모든 생명체는 자연의 낮과 밤에 맞출 때 건강을 유지하기 쉽고 인간도 자연 속 생명체이므로 어둠이 필요한 시간을 존중하고 피해를 외면하지 말아야 하며, 세상이 바뀌길 기다리기보다 빈방 전등 끄기 같은 작은 실천부터 시작하자.'
      ],
      simhwa2_02: [
        '밥상머리 교육은 젓가락질 가르치기에서 출발했고 젓가락 쓰는 모습으로 교육을 판단할 만큼 엄격했는데, 요즘 서툰 어린이를 위한 기능성 젓가락을 첫 번째 글은 젓가락에 숨은 힘을 못 깨닫게 하는 장난이라 비판한다.',
        '젓가락질은 겉보기에 단순하나 손가락의 관절·근육을 섬세하게 움직이고 힘을 조절해야 하는 손과 뇌의 협력 활동으로, 첫 번째 글은 이 미세한 움직임이 뇌를 자극하고 유아·어린이 성장 발육에 유익하다고 설명한다.',

        '도용당한 원작자는 소송할 수 있으나 창작과 모방을 구분하기 어려워 소송이 길고 비용이 들어 포기하기도 하고 일부 업체는 이익이 손해보다 커 관행을 안 고치는데, 이러면 디자이너가 아이디어를 보호받기 어렵고 창조 의욕이 떨어져 창작자가 대가를 치른다.',
        '그린피스에 따르면 한 해 약 800억 점의 옷이 생산되어 한 사람당 열 점 넘는 양인데 그중 4분의 3인 600억 점이 소각·매립되고 옷감 면적도 국토의 네 배에 달해, 옷이 싸고 흔해질수록 자원 낭비와 쓰레기도 늘어난다.',
        '버려지는 옷의 약 65퍼센트인 합성 섬유는 땅에 묻으면 오래 남고 태우면 유해 물질이 나오며, 천연 원료인 면화도 세계 살충제의 16퍼센트를 써 지하수·강을 오염시켜 동식물을 위협하니 옷을 만들고 버리는 모든 단계에서 자연이 부담을 진다.',
        '자연뿐 아니라 노동자도 고통받아 업체는 임금 싼 개발도상국에 제작을 맡기는데 방글라데시는 세계 2위 생산·수출국으로 400만 명이 일하며 빠른 납품에 늦게까지 일해도 2014년 월급이 7만 원 남짓이라, 소비자가 싼 옷을 사는 동안 노동자는 열악한 환경과 낮은 임금을 감당했다.',
        '업체들이 더 싸고 빠른 옷을 경쟁하고 임금·환경 개선은 비용이 들어 변화가 미뤄지는데, 소비자는 옷을 필요 이상 사지 않고 몇 번 안 입고 버린 적 없는지 돌아보며 옷을 일회용품이 아닌 오래 입을 필수품으로 여겨 불필요한 소비를 줄이는 소비 습관 바꾸기가 변화의 출발점이다.',
        '옷을 살 때 누가 어떤 과정으로 만들었는지 관심을 갖고 디자인 도용·환경오염·노동자 대우를 살피며 생산 과정 공개를 요구할 수 있는데, 공정한 옷은 비싸도 부당하게 낮춘 가격은 공정하지 않으니 우리의 선택이 산업·노동자·환경에 미치는 영향을 생각해 공존과 상생의 소비를 해야 한다.'
      ],
      simhwa2_07: [
        '1996년 세계 최초로 복제된 양 돌리가 체세포 유전 정보로 태어나고 인간 유전자를 지닌 폴리·몰리도 혈우병 치료 물질을 얻으려 만들어져 동물 복제가 질병 치료에 활용될 가능성을 보였으나, 생명 복제 기술 발전으로 새로운 윤리적 논쟁이 시작되었다.',
        '돌리 이후 동물 복제가 확산되며 논쟁이 인간 복제로 이어져 연구 자유의 한계가 문제되는데, 많은 연구자는 배아 연구를 규제하면 연구 자유가 침해된다며 과학 발전을 막지 말아야 하고 배아 복제가 난치병 치료와 국가 경쟁력을 높인다고 기대한다.',
        '반면 배아 복제에 엄격한 규제가 필요하다는 주장은 배아를 실험 재료로 다루면 생명 존중이 훼손되고 인간 개체 복제로 이어질 수 있다며, 연구 자유만으로 모든 실험을 허용할 수 없고 제도로 제한해야 한다고 보아 논쟁의 중심에 자유와 한계의 문제가 있다.',
        '과학자들은 외부 간섭 없이 연구할 때 진리에 다가간다고 믿어 20세기 중반까지 공동체의 자율성을 중시하고 과학을 정치·사회 통제에서 벗어난 영역으로 보았으나, 과학 성과가 사회에 미치는 영향이 커지며 이 믿음도 새 질문을 마주했다.',
        '제2차 세계 대전을 거치며 국가가 과학에 자금을 지원하는 대신 과학자 공동체의 자율성을 존중하는 ‘제1차 사회 계약’이 형성되어, 미국은 국립 과학 재단 등으로 대규모 연구비를 지원했고 이 방식이 서구 선진국에 확산되었다.',
        '연구의 자유는 법으로 보호받아 우리 헌법 제22조 제1항도 학문과 예술의 자유를 규정하며 연구 선택·방법·내용·시기·장소 결정의 자유를 포함하는데, 이는 국가 권력의 부당한 간섭을 받지 않아야 한다는 뜻으로 학문의 자유는 특혜가 아니라 헌법이 보장하는 기본권이다.',
        '헌법이 보장하는 연구의 자유도 무제한은 아니어서 많은 법학자는 다른 모든 가치를 희생하며 지킬 절대적 권리는 아니라 보며, 특히 생명·신체·자기 결정권·존엄성을 해치는 연구는 정당한 제한이 필요하니 연구 자유는 다른 사람의 권리와 조화를 이루어야 한다.',
        '20세기 중반 이후 과학이 원자 폭탄 같은 대량 살상 무기에 이용되고 인간 소외·환경 파괴를 부를 수 있음이 드러나, 연구 결과의 사회적 영향을 따지고 목적·방법·위험을 살피는 윤리 의식과 사회적 책임이 중요해져 과학을 무조건 자유롭게 두어야 한다는 믿음이 변했다.',
        '1980년대 이후 산학 협동 확대로 연구의 산업화·상품화가 빨라져 이윤과 경쟁력에 기여할 때 지원받는 ‘제2차 사회 계약’이 나타나, 기업 관련 연구는 비밀로 유지되고 거대 과제가 늘며 개별 과학자가 전체를 파악하기 어려워지고 연구 부정행위도 나타났다.',
        '과학 연구는 순수한 진리 탐구에 머물지 않고 사회적 영향·이해관계가 커져 자유의 절대적 보장 생각이 약해지고 윤리 의식·사회적 책임과 규제가 힘을 얻었으나 자유로운 연구 권리도 가볍게 여겨선 안 되니, 자유와 규제 중 하나를 택하기보다 공동선을 위해 자유를 지키며 생명과 존엄을 보호하는 균형을 찾아야 한다'
      ],
      simhwa2_08: [
        '몽마르트르 테르트르 광장의 작가는 검은 종이로 관광객 얼굴을 옆모습으로 표현하는데, 정면을 실루엣으로 하면 이목구비가 안 드러나 알아보기 어렵고 옆얼굴은 윤곽이 뚜렷해, 보는 방향에 따라 드러나는 특징이 달라짐을 보여 준다.',
        '옆모습을 그린 이미지를 프로필이라 하며 핵심 특징을 드러낸다는 점에서 약력 소개 글과 통하는데, 서양은 중세 말~르네상스에 옆얼굴 초상이 많았고 중국은 정면 얼굴을 중시해, 같은 얼굴을 두고 왜 다른 방향을 택했는지 묻는다.',
        '동물을 떠올리면 특징을 잘 보여 주는 방향이 함께 떠올라 말·물고기는 옆모습, 도마뱀은 위에서 본 모습이 익숙한데, 이는 여러 번 보고 기억한 모습 중 특징이 잘 드러나는 방향이 전형으로 자리 잡은 것으로 정면상·측면상도 여러 면 중 하나를 택한 결과다.',
        '서양에서 프로필 초상화가 발달한 데는 얼굴이 측면에서 특징이 뚜렷하고 윤곽을 배치·재현하기 쉬우며 로마 주화에 측면상을 쓴 전통이 영향을 미쳐, 표현 방식과 오랜 관습이 결합한 여러 요인이 함께 작용한 결과다.',
        '사물을 그리는 방식은 촉각상과 시각상으로 설명되는데, 촉각상은 만져 아는 실제 형태·크기를 중시해 보는 위치에 따른 차이보다 사물 자체 형태를 중요시하고, 시각상은 눈에 보이는 대로 가까운 것은 크게 먼 것은 작게 표현해 무엇을 중시하느냐에 따라 달라진다.',
        '고대 이집트 벽화는 보이는 모습보다 실제 형태의 앎을 중시한 그림으로 원근법을 안 배운 사람은 아는 형태를 드러내기 쉬운데, 우리 민화 책거리가 책장·탁자 앞뒤를 같은 길이로 그린 것도 실수가 아니라 촉각상에 가까운 표현으로 이해할 수 있다.',
        '건물 그림에서 앞뒤 길이를 비슷하게 그리는 것은 여러 문화권에서 보이는데 사람이 아는 구조를 담으려 하기 때문이며, 고대 그리스·르네상스 유럽은 시각적 경험에 의존해 크기·형태를 사실적으로 재현하는 시각적 사실성을 서양 미술의 특성으로 삼았으나 다른 표현이 틀린 것은 아니다.',
        '미술은 보이는 장면을 똑같이 옮기는 일만이 아니라 세상을 알고 이해하고 느끼는 바를 전달하는 수단이며 시각적 사실성은 그 한 방법일 뿐인데, 이집트 벽화에 얼굴·몸을 다른 방향으로 결합한 인물과 한 방향에 가깝게 그린 농부·무희 같은 인물이 함께 있는 표현 차이에는 이유가 있다.',
        '이집트인은 농부·무희처럼 신분이 낮은 사람은 시각상으로, 파라오·귀족처럼 높은 사람은 촉각상에 가깝게 그렸는데 이는 기술 부족이 아니라 신분과 세계의 질서에 대한 이해가 담긴 것으로, 벽화는 실제 사람 같은지만이 아니라 표현에 담긴 생각과 가치도 읽어야 한다.',
        '보이는 대로 그리는 일은 사라질 존재의 운명을, 아는 대로 그리는 일은 변치 않는 질서와 영원한 삶의 믿음을 담아 이집트 벽화에서 촉각상이 질서·진리 전달에 유리하게 여겨졌는데, 서양 초상화와 이집트 벽화는 다른 목적에 따라 다른 표현을 택한 것이라 그림은 닮음을 넘어 무엇을 보여 주려 했고 어떤 세계관을 담았는지 살펴야 한다.'
      ],
      simhwa2_09: [
        '21세기 들어 일자리 구조를 바꾸는 변화가 시작돼, 증기 기관으로 육체노동을 대신한 제1의 기계 시대와 달리 디지털로 열린 제2의 기계 시대에는 인공지능 로봇이 육체노동뿐 아니라 지적·정신적 업무까지 수행해 직업 세계 전체를 흔든다.',
        '인공지능 로봇은 퀴즈 대결에서 인간을 이기고 기계 학습으로 시행착오를 거쳐 스스로 문제 해결법을 익히며, 자율 주행차·산업·재난 구조·군사 로봇과 공중 배달 드론 등 여러 분야에서 인간의 능력에 도전하고 있다.',
        '인공지능·로봇은 생활을 편리하게 하지만 기계가 빠르고 정확한 업무는 자동화돼 기존 일자리를 위협하는데, 제2의 기계 시대에는 단순 반복뿐 아니라 분석·판단 등 지식 업무도 자동화돼 변화가 특정 직업을 넘어 사회 전체로 확산될 수 있다.',
        '전문 지식과 훈련이 필요한 직업은 기계가 대신 못 한다 여겼으나 인공지능 발전으로 기자·의사·변호사 등 전문직도 로봇과 경쟁하게 되어, 자료 분석·계산·판단을 해내는 인공지능 앞에서 기존 업무를 더 잘하는 것만으로는 충분하지 않을 수 있다.',
        '2015년 《로스앤젤레스 타임스》가 지진 5분 만에 보도한 기사를 작성한 것은 ‘퀘이크봇’ 로봇으로, 지진·스포츠·증권 시황처럼 정해진 데이터를 활용하는 기사는 로봇이 빠르게 처리해 기자 고유 업무인 기사 작성도 자동화될 수 있음을 보여 준다.',
        '에이피통신 등 여러 언론과 국내에서도 로봇이 사람 글과 구별하기 어려운 기사를 작성하는데, 이는 기자라는 직업이 사라진다는 뜻이 아니라 직업을 이루는 업무 일부가 자동화되며 사람이 맡을 역할이 달라지는 것으로 다른 전문직도 비슷한 변화를 겪을 수 있다.',
        '변화에 적응하는 첫 방법은 최신 기술을 적극 받아들이는 것으로, 기술의 원리와 활용법을 탐구해 수술용 로봇처럼 전문 분야에 접목하고 잘하는 일은 로봇에 맡기며 사람은 새 문제 해결에 집중해, 경쟁에 머물지 말고 새로운 가치와 역할을 만들어야 한다.',
        '두 번째 방법은 평생 끊임없이 배우고 익히는 것으로, 한 직장·한 지식에 의존하기 어려운 시대에는 지속적 학습과 재교육이 중요하며 새 기기·업무 방식을 배우고 다른 분야에 도전할 준비를 해 평생 학습자의 태도가 중요한 경쟁력이 된다.',
        '미래에 중요한 또 하나의 능력은 유연성으로, 익숙한 업무가 사라질 때 기존 방식만 고집하면 적응하기 어렵고 새 상황을 받아들여 탐색하는 사람은 새 길을 찾는데, 인류가 창의적으로 어려움을 해결해 왔듯 미래를 두려워 말고 배우며 능력을 변화시키는 자세가 필요하다.',
        '마지막으로 중요한 것은 함께 일하고 싶은 사람이 되는 것으로, 로봇이 발전해도 최종 결정·관리 책임은 사람에게 남고 존중·책임감·협력은 기술로 대신하기 어려운 가치라, 미래에는 기술 활용 능력뿐 아니라 인격과 태도도 중요하므로 기술과 인간다운 품성·협력 자세를 함께 길러야 한다.'
      ],
      simhwa2_10: [
        '사람은 다섯 감각으로 세상을 인식하고 특히 시각이 중요해 정보의 약 80퍼센트를 시각에 의존하지만, 눈을 떠도 모든 것을 알아차리는 것은 아니어서 같은 장면도 다르게 보이니 우리가 믿는 세상이 실제와 얼마나 같은지 묻는다.',
        '1999년 사이먼스와 차브리스는 시각과 주의력의 관계를 알아보려 흰옷·검은 옷 조가 농구공을 주고받는 영상을 보여 주고 흰옷 조의 패스 횟수만 세게 했는데, 대부분 성공했으나 연구진이 정말 알아보려던 것은 따로 있었다.',
        '영상 한가운데 고릴라 의상을 입은 사람이 9초간 등장해 가슴을 두드리고 나갔는데 패스를 세던 참가자의 약 절반은 고릴라를 알아차리지 못했고, 다시 보여 주자 다른 영상 아니냐 의심하기도 해 눈앞의 고릴라가 왜 안 보였는지 묻는다.',
        '연구진은 이를 ‘무주의 맹시’라 불렀는데 이는 시력 문제가 아니라 정보가 들어와도 주의를 기울이지 않으면 알아차리지 못하는 것으로, 패스에 집중해 고릴라가 인식에서 빠진 것처럼 주의력에 한계가 있어 본 것은 눈앞에 있던 것만으로 결정되지 않는다.',
        '무주의 맹시는 실험실만의 일이 아니어서 실연한 사람은 연인이, 아버지를 걱정한 날엔 노인이 더 눈에 띄는데 이는 갑자기 많아진 게 아니라 관심을 두지 않아 못 알아챈 것으로, 생각과 감정이 주의를 끄는 대상을 바꾸어 세상에는 못 보고 지나치는 것이 많다.',
        '우리는 눈으로 본다 하지만 시각 정보를 해석하는 곳은 뇌로, 빛이 눈에 들어오면 망막의 시각 세포가 전기 신호로 바꿔 시신경을 거쳐 시각 피질로 전달돼 처리되어야 보는데, 눈은 빛을 받는 통로이고 뇌가 판단해 시각 세계는 눈과 뇌가 함께 만드는 결과다.',
        '시각 피질은 약 30개 영역이 협력하는 복잡한 체계로 V1·V2는 선·경계, V3는 형태, V4는 색, V5는 움직임을 처리하며 서로 정보를 연결해 장면을 이해하도록 돕는데, 이는 여러 악기가 박자를 맞춰 음악을 만드는 오케스트라와 같아 풍경도 여러 영역이 함께 작동한 결과다.',
        '뇌의 시각 영역이 협력하지 못하면 V4에 문제가 생기면 색맹이 아니어도 흑백으로 보고 V5가 손상되면 자동차 움직임을 알아차리기 어려운데, 이는 보는 일이 빛이 들어오는 것으로 끝나지 않고 뇌가 형태·색·움직임을 나눠 처리해 종합함을 보여 주어 시각은 눈과 뇌의 해석 능력이다.',
        '세상에는 정보가 너무 많아 뇌가 다 처리할 수 없어 중요한 것에 집중하고 나머지를 무시하며 쥐 꼬리만 봐도 전체를 떠올리듯 부족한 정보를 경험·지식으로 채우는데, 무엇이 중요한지는 상황·관심에 따라 다르고 듣는 일도 비슷해 상대의 주의를 먼저 끄는 것이 소통에 도움이 된다.',
        '고릴라 실험은 본 것을 늘 완전하게 인식하는 것은 아님을 알려 주는데 뇌가 일부를 선택하고 경험·관심으로 해석해 같은 장면도 다르게 기억·판단할 수 있으니, 자기 눈으로 봤다고 반드시 옳다 단정하거나 남이 다르게 봤다고 비난하지 말고 못 본 부분이 있을 수 있음을 인정하는 태도가 서로를 이해하고 다툼을 줄이는 출발점이다.'
      ],
      simhwa2_11: [
        '광화문은 경복궁 남쪽 정문으로 ‘왕의 큰 덕이 온 나라를 비춘다’는 뜻을 지녀 1395년 세워지고 1426년 이름을 얻었는데, 궁궐 출입구를 넘어 조선 왕조의 권위와 정신을 상징하는 건축물이라 그 변화에 우리 역사의 아픔이 새겨져 있다.',
        '경복궁 주요 건물은 광화문~교태전으로 남북 일직선에 놓여 관악산을 바라보며 왕실의 질서와 위엄을 드러냈는데, 일제가 앞뜰에 총독부 청사를 세워 배치를 훼손하고 광화문 방향도 남산 쪽으로 바꿔 광화문의 수난은 식민 통치의 상징적 장면이었다.',
        '일제는 식민 통치를 과시할 총독부 청사를 경복궁 앞뜰에 세웠는데 경복궁 훼손은 그 전부터 진행돼 1910년 궁내부가 공원을 핑계로 전각 4,000여 칸을 경매에 내놓아 흩어졌고, 총독부 청사 공사는 경복궁 모습을 더욱 크게 바꾸었다.',
        '총독부 청사가 드러나자 일제는 앞에 선 광화문을 걸림돌로 여겨 철거하려 했는데, 「동아일보」가 철거 계획을 폭로하고 반대 여론이 거세지며 일부 일본인 학자도 부당함을 지적해, 광화문을 지키려는 목소리는 역사와 문화를 지키려는 요구였다.',
        '철거 반대 여론이 커지자 일제는 광화문을 없애는 대신 옮기기로 했으나 제자리를 떠나는 것만으로 의미가 훼손됐는데, 해태 석상이 철거되고 「조선일보」가 ‘나는 가나이다’라는 고별사를 실어 사람들은 이 이전을 민족의 역사와 존엄이 밀려나는 사건으로 받아들였다.',
        '1926년 광화문 해체가 시작되어 건춘문 옆으로 옮길 계획이었고 「동아일보」가 공사 소식을 전했는데, 완전히 사라지는 것은 아니나 본래 터와 방향을 잃는 일은 가볍지 않았으니 궁궐 정문은 제자리에 있을 때 건물과 공간의 의미를 온전히 드러내기 때문이다.',
        '설의식은 「헐려 짓는 광화문」 고별사에서 광화문을 오백 년 역사를 간직한 존재로 그려 전국의 석재·목재와 백성의 땀·눈물이 배었다 호소하고 본래 자리를 떠나면 생명과 역할을 잃는다 보아, 그의 글은 문화유산 훼손에 대한 분노이자 일제 정책에 맞선 저항이었다.',
        '광복 후에도 총독부 건물은 ‘중앙청’·국립 중앙 박물관으로 쓰이며 처리를 둘러싼 논쟁이 이어져, 식민 지배 상징이니 철거해 역사를 바로 세우자는 주장과 아픈 역사도 역사이니 남겨 보여 주자는 의견이 맞서, 과거의 상처를 기억하고 다루는 방법에 관한 고민이었다.',
        '오랜 논쟁 끝에 1995년 총독부 건물이 철거되고 경복궁 복원이 진행돼 2006년 광화문 복원 공사가 시작되어 2010년 복원된 광화문이 모습을 드러냈는데, 이는 건물을 새로 짓는 일이 아니라 밀려났던 정문을 바로잡고 역사적 공간의 의미를 되찾는 과정이었다.',
        '광화문은 경복궁의 얼굴이자 우리나라를 대표하는 상징물로 조선의 정문·일제의 수난·광복 후 복원을 거쳐, 광화문을 지킨다는 것은 낡은 건물 보존이 아니라 그 안의 역사와 민족의 기억을 이어 가는 일이므로 깃든 역사의 숨결을 기억해 다음 세대에 전해야 한다.'
      ],
      simhwa2_12: [
        '외규장각 의궤는 조선 왕실 의식을 기록한 문화유산인데 1866년 병인양요 때 프랑스가 약탈해 오래 떠나 있었고, 맞교환을 고수하는 프랑스와 약탈품을 돌려받으며 다른 문화재를 내줄 수 없다는 한국의 입장 차로 교착됐다가 2010년 전환점을 맞았다.',
        '2010년 3월 한국 외교통상부는 프랑스가 의궤 전부를 넘겨주면 국내법 범위에서 해외 전시 가능한 문화재를 전시하겠다는, ‘등가 등량의 교환’에서 벗어난 제안을 내놓아 전시를 협상 기회로 활용하려 했으나 형식을 중시한 프랑스가 받아들일 가능성은 크지 않았다.',
        '2010년 5월 공식 협상이 다시 열려 프랑스 장 오르티즈 국장은 협상 부진에 양측 책임이 있다며 의궤 문제가 우호 관계를 해친다는 지적에 공감해 새 해결책을 모색하기로 했고, 한국 대표들은 쟁점을 짚고 대응을 준비하려 상대 설명을 끝까지 듣기로 했다.',
        '프랑스는 협상을 재개하면서도 1993년 정상이 합의한 ‘교류와 대여’ 원칙을 토대로 2001년 무산된 의궤 맞교환을 다시 제시해 교환 형식을 원했으나, 약탈품을 되찾으려 다른 문화재를 내주는 발상은 한국 국민에게 받아들여지기 어려웠다.',
        '박흥신 대사는 병인양요 약탈 도서를 묻는 청소년 퀴즈 프로그램을 예로 들어 의궤 문제가 한국 사회에 깊이 남아 있음을 강조하고 문화재를 안 돌려주는 현실이 프랑스 이미지에 나쁘다고 지적해, 의궤 반환이 두 나라의 미래 관계와 신뢰에 관련된 문제임을 일깨웠다.',
        '한국 측은 프랑스 의궤를 돌려받으려 한국 의궤를 내주는 2001년 맞교환안이 장남을 위해 차남을 인질로 내주는 것 같다는 비판을 받은 까닭을 설명하며 자책감과 일제 강점기 상처가 겹친 정서를 이해해 달라고 하고, 대가 없이 돌려준 뒤 영원한 감사를 받으라고 설득했다.',
        '2010년 6월 프랑스는 의궤를 여러 묶음으로 나눠 교체하며 전시하는 방안을 제시했으나 한국은 근본 해결책이 아니라 보면서도 경청한 뒤, 모든 의궤가 같은 장소·시각에 약탈당했으니 297권을 나누지 말고 전부 한꺼번에 돌려받아야 한다는 원칙을 밝혔다.',
        '프랑스는 의궤를 조건 없이 넘기면 다른 나라도 반환을 요구할 선례가 될까 우려해 작은 대가라도 받아 교환 모양새를 갖추자 했으나 한국은 다른 문화재를 내줄 수 없어, 양측이 해결을 원하면서도 다른 원칙을 지켜 협상이 교착돼 반환과 명분을 함께 살릴 방법이 필요해졌다.',
        '2010년 11월 서울 국제회의를 계기로 프랑스가 의궤 전부를 한꺼번에 보내되 법적 형식은 ‘5년 단위 갱신 대여’로 정하는 극적 합의에 도달했는데, 국립도서관의 반대에도 최고 정책 결정자의 결단이 이끌었고 한국도 소유권 명분 대신 의궤를 가져오는 실리를 택한 절충안이었다.',
        '합의 후에도 이관 날짜·포장·운송·보관과 학예사 교류·디지털화 파일 공유까지 세밀히 논의하며 소홀히 하지 않았고 실무 협상은 서로를 존중하는 분위기로 진행돼, 외규장각 의궤의 귀환은 역사적 상처를 바로잡는 끈질긴 노력과 상대 현실을 고려한 외교적 판단이 함께 만든 결과였다.'
      ],
      bimun25: [
        '미세 먼지 관련 보도는 2014년부터 크게 늘었지만 서울 PM-10 농도는 20년간 오히려 감소해, 사람들이 느끼는 심각성과 실제 농도가 늘 같지 않으므로 측정 자료와 발생 원인을 함께 살펴야 한다',

          <p class="section-title">① 디지털 기기에 의존하는 현대인의 생활</p>

          <p class="section-title">② 적정 기술의 의미와 특징</p>

          <p class="section-title">③ 전기 없이 사용하는 항아리 냉장고</p>
          <p>적정 기술의 예로는 나이지리아의 교사인 모하메드 바 압바가 개발한 ‘항아리 냉장고’가 유명하다. 이 냉장고는 냉장고가 없는 지역이나 냉장고가 있더라도 전기가 제대로 공급되지 않아 음식물 보관에 어려움을 겪는 사람들에게 매우 유용한 발명품이다. 보관 기간이 3일 정도밖에 되지 않는 토마토나 후추와 같은 식품을 이 냉장고에 보관하면 21일 정도까지 신선하게 보관할 수 있다고 한다. 전기를 사용하는 일반 냉장고와 달리 주변에서 구할 수 있는 재료를 활용한다는 점도 특별하다. 간단한 구조로 식품을 오래 보관하도록 돕는 획기적인 기술인 셈이다.</p>
          <p class="section-title">④ 항아리 냉장고에 숨겨진 과학 원리</p>
          <p>‘항아리 냉장고’의 원리는 간단하다. 먼저 큰 항아리 속에 작은 항아리를 집어넣는다. 그리고 두 항아리 사이의 공간을 젖은 모래로 채운 다음, 젖은 헝겊으로 작은 항아리를 덮는다. 진흙으로 빚은 항아리는 외부의 열이 안쪽으로 전달되는 것을 줄이는 역할을 한다. 또 모래 속의 물은 증발하면서 주변의 열을 빼앗아 간다. 이 때문에 작은 항아리 안의 온도가 낮아져 채소나 과일을 오랫동안 신선하게 보관할 수 있다. 전기를 공급받지 못하는 곳에서도 물이 증발할 때 열을 흡수하는 과학적 원리를 이용해 냉장 효과를 얻는 것이다. 구조는 단순하지만 실용적인 발명품이다.</p>
          <p class="section-title">⑤ 오염된 물을 정화하는 라이프 스트로</p>
          <p>또 다른 적정 기술로는 오염된 물을 정화할 수 있는 휴대용 물 정화 장치인 ‘라이프 스트로’가 있다. 빨대처럼 생긴 라이프 스트로로 물을 빨아들이면 물이 간이 정화 장치를 통과하면서 깨끗해져 마실 수 있게 된다. 깨끗한 식수를 구하기 어려운 지역의 사람들에게 도움이 되는 장치이다. 거대한 정수 시설을 설치하지 않더라도 개인이 물을 정화해 마실 수 있도록 고안되었다는 점에서 의미가 있다. 적정 기술은 이렇게 사람들이 생활 속에서 겪는 어려움을 살피고, 꼭 필요한 기능을 간단한 도구로 구현한다. 복잡한 기술보다 사용자의 환경을 고려한 발상이 중요한 것이다.</p>
          <p class="section-title">⑥ 물을 쉽게 운반하는 큐 드럼</p>

          <p>덥고 건조한 서남아시아 지역에서는 주변의 흙을 이용해 만든 흙벽돌로 집을 지었다. 흙으로 만든 벽돌로 벽을 두껍게 쌓고 천장을 높인 다음, 창문을 꼭대기에 설치하였다. 집 안의 벽에는 호리병 모양의 물병을 적당한 높이에 걸어 두었다. 이렇게 하여 바깥 기온이 40도가 넘는 더위에도 실내 온도를 25도 정도로 시원하게 유지할 수 있었다고 한다. 전기를 사용하는 에어컨이 없어도 건물의 재료와 구조, 물의 성질을 이용해 더위를 줄인 것이다. 주변 환경에 알맞은 재료를 선택하고 집의 형태를 조절한 점에서 적정 기술의 특징을 잘 보여 준다.</p>
          <p class="section-title">⑧ 흙벽돌집의 온도를 낮추는 과학적 원리</p>
          <p>서남아시아 흙벽돌집이 시원한 원리는 간단하다. 우선 단열 효과가 큰 두꺼운 흙벽돌이 더운 바깥 공기의 열이 실내로 들어오는 것을 줄여 준다. 그리고 따뜻해진 공기가 위로 올라가는 성질을 이용해 더운 공기가 높은 곳의 창문으로 빠져나가도록 한다. 이때 벽에 걸어 놓은 호리병 속의 물은 실내의 열에너지를 흡수하면서 증발하여 수증기로 빠져나간다. 물이 증발하면서 주변의 열을 빼앗는 것이다. 서남아시아 사람들은 이러한 과학적 원리를 생활에 적용하여 사막의 덥고 건조한 기후에서도 비교적 시원하게 지낼 수 있었다. 자연의 성질을 잘 활용한 지혜로운 방법이다.</p>
          <p class="section-title">⑨ 추운 지역의 지혜가 담긴 이글루</p>
          <p>지구상에서 가장 추운 지역에 사는 이누이트들은 ‘이글루’라고 부르는 집을 짓는다. 이글루의 재료는 주변에서 쉽게 구할 수 있는 눈이다. 이들은 눈을 다듬어 벽돌 모양으로 다진 뒤 둥근 반원 모양의 집을 짓는다. 그런 다음 이글루의 내부 벽에 물을 뿌리면 그 물이 차가운 눈과 얼음을 만나 얼면서 열을 방출한다. 이를 응고열이라고 한다. 원문은 이 과정에서 내부 기온이 올라가 실내가 따뜻해진다고 설명한다. 눈은 추운 곳에서 쉽게 얻을 수 있는 재료이지만, 이를 집의 재료로 활용하면 혹독한 추위에 대응할 수 있다. 자연환경에 맞춘 생활의 지혜가 담겨 있는 것이다.</p>

          <p>배달 산업의 규모가 커지면 그 분야에서 일하는 사람들의 수입도 함께 늘어날 것이라고 생각하기 쉽다. 그러나 택배 기사들의 현실은 그렇지 못했다. 택배 시장이 과열되면서 업체들 사이에 더 저렴한 가격으로 배달하려는 경쟁이 심해졌기 때문이다. 배송하는 물건의 수가 많아져도 택배 기사 개인의 수입은 거의 달라지지 않았다. 택배 기사들은 일을 하면서 유류비, 차량 유지비, 통신비 등 여러 비용을 직접 부담해야 한다. 이런 비용을 제외하면 택배 한 건당 평균 800원 정도를 벌 수 있다고 한다. 배달 산업의 성장이 곧바로 택배 기사의 소득 증가로 이어지지는 않았던 것이다.</p>
          <p class="section-title">⑦ 하루 170개 가까운 물건을 배달해야 하는 이유</p>
          <p>택배 기사들이 얼마나 많은 물건을 배달해야 하는지 계산해 보면 노동의 강도를 더욱 분명하게 알 수 있다. 택배 한 건당 평균 800원을 번다고 가정하면, 한 달에 약 350만 원을 벌기 위해서는 월 25.3일 동안 하루 평균 170개 가까운 물건을 배달해야 한다. 주당 평균 노동 시간이 74시간이므로 주 6일 근무로 계산하면 하루에 약 12시간을 일하는 셈이다. 그 시간 동안 한 시간에 평균 14개가 넘는 물건을 전달해야 한다. 물건을 싣고 이동하며 수취인에게 전달하는 과정까지 생각하면 결코 여유로운 일정이 아니다. 결국 택배 기사들은 많이 배달하기 위해 쉴 새 없이 움직여야 한다.</p>
          <p class="section-title">⑧ 속도 경쟁의 부담은 누구에게 돌아가는가?</p>
          <p>이러한 현실은 배달 산업에서 벌어지는 가격 경쟁과 속도 경쟁이 누구에게 부담을 주는지 보여 준다. 소비자는 저렴한 비용으로 물건을 빠르게 받기를 원하고, 기업은 더 많은 소비자를 확보하기 위해 경쟁한다. 그러나 정해진 시간에 많은 물건을 배달해야 하는 부담은 실제 배송을 담당하는 택배 기사들에게 집중된다. 택배 기사들은 수입을 유지하기 위해 배송량을 늘리고, 배송 시간을 맞추기 위해 휴식까지 줄여야 하는 상황에 놓인다. 배달 서비스가 편리해질수록 그 서비스를 가능하게 하는 사람들의 노동 환경도 함께 살펴야 한다. 편리함만을 기준으로 배달의 가치를 판단해서는 안 되는 이유이다.</p>
          <p class="section-title">⑨ 택배 기사들에게도 보장되어야 할 노동자의 권리</p>
          <p>모든 노동자는 바람직한 환경에서 일할 권리가 있다. 택배 기사들은 물건을 소비자에게 직접 전달하는 택배 산업의 핵심 노동자들이므로, 이들 역시 안전하고 적절한 환경에서 일할 권리를 보장받아야 한다. 빠른 배송을 위해 과속을 감수하거나 몸이 아픈 날에도 쉬지 못하는 상황을 당연하게 여겨서는 안 된다. 산업이 발전한다는 것은 서비스를 이용하는 사람들의 편의만 높아지는 일이 아니어야 한다. 그 산업을 움직이는 노동자들의 삶도 함께 나아질 수 있어야 한다. 택배 기사들의 노동을 단순히 배송 속도나 물건의 개수로만 평가하지 말고, 그들이 감당하는 시간과 위험에도 관심을 기울여야 한다.</p>
          <p class="section-title">⑩ 빠른 배달보다 중요한 것은 사람의 권리</p>
          <p>우리가 누리는 편리함이 누군가의 희생을 바탕으로 이루어진 것이라면, 때로는 그 편리함을 포기할 수도 있어야 한다. 물건을 조금 늦게 받는 것이 불편할 수는 있지만, 빠른 배송 때문에 택배 기사들의 안전과 건강이 위협받는다면 생각을 바꿀 필요가 있다. 우리는 그동안 배달 속도를 지나치게 중요하게 여기지는 않았는지 돌아보아야 한다. 택배 기사들이 무리하지 않고 일할 수 있도록 배송에 필요한 시간을 이해하고 작은 불편을 받아들이는 태도가 중요하다. 소비자의 편리함과 노동자의 권리가 함께 존중받을 때 배달 산업도 더 바람직한 방향으로 발전할 수 있을 것이다.</p>

        content: `
          <p class="section-title">① 우리 생활을 편리하게 만드는 플라스틱</p>
          <p>플라스틱은 매우 가볍고 모양을 변형하기 쉬우며, 여러 가지 빛깔로 만들 수도 있다. 게다가 전기가 잘 통하지 않는 절연성까지 뛰어나 다양한 제품의 재료로 사용된다. 우리 주변을 둘러보면 음식을 담는 용기부터 비닐봉지, 생활용품까지 플라스틱으로 만든 물건을 쉽게 발견할 수 있다. 이처럼 플라스틱은 편리한 성질 덕분에 우리 생활 깊숙이 자리 잡았다. 하지만 편리하다는 이유만으로 플라스틱을 마음껏 사용해도 되는 것은 아니다. 우리가 잠깐 사용하고 버린 플라스틱이 자연에 오랫동안 남아 예상하지 못한 피해를 일으킬 수 있기 때문이다. 플라스틱의 편리함 뒤에 숨은 문제를 살펴볼 필요가 있다.</p>
          <p class="section-title">② 500년이 지나도 사라지지 않는 플라스틱</p>

          <p class="section-title">④ 재활용해도 원래 모습으로 돌아가기 어려운 이유</p>
          <p>재활용 과정에서는 플라스틱의 품질이 떨어지는 문제도 나타난다. 이물질이 묻어 있거나 여러 재질이 섞여 있으면 원래와 같은 품질의 제품을 만들기 어렵기 때문이다. 그 결과 재활용한 플라스틱은 함지나 정화조처럼 상대적으로 품질이 낮은 제품으로 만들어지기도 한다. 재활용률이 70퍼센트 정도로 비교적 높다고 소개된 페트병조차 다시 페트병이 되기보다는 화학 솜이나 노끈 등의 재료로 사용된다고 한다. 따라서 재활용은 플라스틱 쓰레기를 줄이는 데 도움이 되지만 모든 문제를 해결하는 방법은 아니다. 무엇보다 플라스틱을 처음부터 적게 사용하는 노력이 필요하다.</p>
          <p class="section-title">⑤ 바다로 흘러 들어가는 플라스틱 쓰레기</p>
          <p>재활용되지 않은 플라스틱 쓰레기는 대개 태우거나 매립장에 묻는다. 그러나 이러한 처리 방법도 수거된 쓰레기에만 해당한다. 수거되지 않은 플라스틱은 산과 들에 아무렇게나 버려지거나 땅속에 묻히고, 바람과 물을 따라 이곳저곳을 떠돌다가 바다로 흘러들어 가기도 한다. 바다에 도착한 플라스틱은 금방 사라지지 않는다. 파도와 햇빛 등의 영향을 받으며 깨지고 닳아 점점 작은 조각으로 부서진다. 그렇게 작아진 플라스틱 조각은 물속을 떠다니며 바다 생물과 마주친다. 사람이 버린 물건이 눈앞에서 사라졌다고 해서 자연에서도 없어진 것은 아니라는 사실을 기억해야 한다.</p>

          <p class="section-title">⑦ 플라스틱이 위협하는 붉은바다거북의 생존</p>
          <p>플라스틱은 또 다른 멸종 위기종인 붉은바다거북의 생존도 위협한다. 산란기를 맞은 바다거북은 한 번에 많으면 백 개가량의 알을 낳고, 이러한 산란을 일곱 번까지 하기도 한다. 알에서 깨어난 새끼 거북은 모래 구덩이를 빠져나와 바다로 향한다. 이후 오랜 시간을 바다에서 보내다가 약 30년이 지나 자신이 태어났던 바닷가를 다시 찾아온다. 그러나 그때까지 살아 돌아올 확률은 5,000분의 1에 지나지 않는다고 한다. 본래도 생존하기 어려운 바다거북에게 플라스틱 쓰레기는 또 하나의 위협이 된다. 바다에 떠다니는 쓰레기가 그 낮은 생존 가능성을 더욱 떨어뜨리는 것이다.</p>
          <p class="section-title">⑧ 먹이로 착각한 플라스틱의 치명적인 위험</p>
          <p>바다거북은 바다를 떠다니는 플라스틱 조각이나 비닐, 풍선 등을 해파리 같은 먹이로 착각해 삼키기도 한다. 하지만 이런 쓰레기는 몸속에서 제대로 소화되지 않는다. 먹이를 먹었다고 생각해도 필요한 영양분을 충분히 얻지 못하고, 쓰레기와 관련된 화학 물질이 몸속에 쌓일 수도 있다. 그 결과 이상 행동을 보이거나 껍질이 약한 알을 낳기도 하며, 심한 경우 죽음에 이르기도 한다. 플라스틱은 바다거북 한 마리의 건강만 해치는 것이 아니라 다음 세대의 생존에도 영향을 줄 수 있는 것이다. 우리가 무심코 버린 비닐이나 풍선이 바다에서는 생명을 위협하는 위험한 물건으로 바뀐다.</p>

          <p>플라스틱으로 피해를 입은 해양 동물의 사례는 해외에만 있는 것이 아니다. 2012년 8월 제주 김녕 앞바다에서는 어린 암컷 뱀머리돌고래가 바닷가로 떠밀려 왔다. 사람들이 죽음의 원인을 알아보기 위해 부검한 결과, 돌고래는 근육량과 지방층이 부족한 상태였다. 팽창한 위 속에서는 비닐과 엉킨 끈 뭉치도 발견되었다. 돌고래는 이런 이물질 때문에 먹이를 제대로 먹지 못했고, 결국 영양 부족으로 죽은 것으로 설명된다. 바다에 버려진 플라스틱은 멀리 떨어진 동물만의 문제가 아니라 우리나라 바다의 생명도 위협하고 있다. 제주에서 발견된 돌고래는 그 사실을 보여 주는 안타까운 사례이다.</p>

          <p class="section-title">① 화려한 불빛으로 다시 태어나는 도시의 밤</p>

          <p class="section-title">② 겨울잠을 자는 나무에게 가해지는 빛의 스트레스</p>
          <p>겨울에 기온이 5℃ 이하로 내려가면 많은 나무는 광합성과 증산 같은 생리 작용을 거의 멈춘다. 잎을 떨어뜨리고 휴면 상태에 들어가 추운 계절을 견디는 것이다. 곰이 겨울잠을 자듯 나무도 대체로 11월부터 이듬해 2월까지 휴식 시간을 갖는다. 그런데 이 시기에 나무를 밝은 전구로 감싸 놓으면 어떤 일이 일어날까? 국립산림과학원의 조사에 따르면 가로수에 설치된 전구의 밝기는 평균 300럭스 안팎이고, 발열 온도는 약 28℃라고 한다. 쉬어야 할 나무에 이러한 빛과 열이 계속 닿는다면 큰 스트레스가 될 수 있다. 보기 좋은 장식이 나무의 자연스러운 겨울나기를 방해하는 셈이다.</p>
          <p class="section-title">③ 인공조명이 무너뜨리는 나무의 생체 리듬</p>

          <p class="section-title">⑤ 멜라토닌 분비와 야간 조명의 위험성</p>
          <p>사람의 몸에는 멜라토닌이라는 호르몬이 있다. 멜라토닌은 낮과 밤에 따라 달라지는 생체 리듬을 조절하는 데 중요한 역할을 하며, 어두운 환경에서 분비가 활발해진다. 원문은 멜라토닌이 산화를 막고 노화를 억제하며 면역 기능을 강화하는 데에도 관련이 있다고 설명한다. 그런데 밤에 밝은 조명을 오래 쬐면 멜라토닌의 분비가 방해받을 수 있다. 2004년 영국 런던에서 열린 국제아동백혈병학술회의에서는 야간 조명과 암 발생 가능성에 대한 우려가 제기되었다고 한다. 이는 빛이 몸에 미치는 영향을 연구할 필요가 있다는 뜻이다. 다만 야간 조명이 암을 일으킨다고 확정된 사실처럼 받아들여서는 안 된다.</p>

          <p class="section-title">⑨ 세계적인 관광 도시가 된 빛의 도시 리옹</p>

          <p>프랑스 파리의 몽마르트르 언덕에는 화가들이 모여 작품을 만드는 테르트르 광장이 있다. 이곳에서는 검은 종이를 오려 관광객의 얼굴을 표현하는 작가도 만날 수 있다. 그런데 그가 만드는 초상은 대부분 얼굴의 정면이 아니라 옆모습이다. 정면을 검은 실루엣으로 나타내면 눈과 코, 입의 생김새가 드러나지 않아 누구인지 알아보기 어렵기 때문이다. 머리 모양에 따라서도 전혀 다른 사람처럼 보일 수 있다. 반면 옆얼굴에는 이마에서 코와 입, 턱으로 이어지는 윤곽이 뚜렷하게 나타난다. 이처럼 어느 방향에서 대상을 바라보느냐에 따라 드러나는 특징은 달라진다.</p>
          <p class="section-title">② 동서양 초상화에 나타난 서로 다른 표현 방식</p>
          <p>대상의 옆모습을 그린 이미지를 미술에서는 프로필이라고 부른다. 한 사람의 성품이나 약력을 간략히 소개하는 글도 프로필이라고 하는데, 두 용법에는 핵심적인 특징을 드러낸다는 공통점이 있다. 서양에서는 중세 말부터 르네상스 무렵까지 인물의 옆얼굴을 담은 초상화가 많이 제작되었다. 그러나 우리나라를 비롯한 동양에서는 이런 방식의 초상화가 크게 발달하지 않았다. 특히 중국에서는 정면에서 바라본 얼굴이 인물의 인품과 특징을 압축하여 전달하는 중요한 초상 형식이었다. 서양에도 정면 초상이 있었지만 중국에 비하면 상대적으로 드물었다. 같은 얼굴을 두고 왜 서로 다른 방향을 선택했을까?</p>
          <p class="section-title">③ 동물마다 특징을 가장 잘 보여 주는 방향</p>
          <p>동물을 머릿속에 떠올리면 그 동물을 가장 잘 나타내는 방향이 자연스럽게 생각난다. 말을 그려 보라고 하면 대개 머리와 몸통, 네 다리가 한눈에 보이는 옆모습을 떠올린다. 물고기 역시 지느러미와 꼬리의 형태가 드러나는 옆모습이 익숙하다. 반면 도마뱀은 위에서 내려다본 모습이 먼저 떠오를 수 있다. 이처럼 동물마다 그 대상을 대표한다고 느끼는 면이 다르다. 우리가 여러 번 보고 기억해 온 모습 가운데 특징이 잘 드러나는 방향이 머릿속에 전형으로 자리 잡은 것이다. 정면상과 측면상도 결국 대상의 여러 면 중에서 하나를 선택하여 표현한 결과라고 볼 수 있다.</p>
          <p class="section-title">④ 서양에서 프로필 초상화가 발달한 이유</p>
          <p>서양에서 인물의 옆얼굴을 그린 프로필 초상화가 널리 나타난 데에는 여러 이유가 있다. 원문은 백인과 흑인의 얼굴이 해부학적 구조상 측면에서 특징을 뚜렷하게 드러낸다는 점을 한 요인으로 든다. 또한 옆모습은 얼굴의 형태를 화면에 배치하기 좋고, 정면상보다 윤곽을 정확히 재현하기 쉽다는 장점이 있다. 역사적인 전통도 영향을 미쳤다. 고대 로마에서는 주화에 황제의 얼굴을 새길 때 주로 측면상을 사용했다. 이렇게 얼굴의 특징을 표현하는 방식과 오랫동안 이어진 관습이 결합하여 서양의 프로필 초상화 전통을 형성한 것으로 볼 수 있다. 여러 요인이 함께 작용한 결과다.</p>
          <p class="section-title">⑤ 촉각상과 시각상은 어떻게 다를까?</p>
          <p>사물을 그림으로 나타내는 방식은 촉각상과 시각상이라는 두 개념으로 설명할 수 있다. 촉각상은 손으로 만져 알 수 있는 사물의 실제 형태와 크기에 대한 인식을 바탕으로 한 이미지다. 같은 물건 두 개가 앞뒤로 놓이면 멀리 있는 물건이 작아 보이지만, 만져 보면 실제 크기는 같을 수 있다. 촉각상은 이렇게 보는 위치에 따라 달라지는 모습보다 사물 자체의 형태를 중요하게 여긴다. 반면 시각상은 눈에 보이는 그대로의 모습을 나타낸다. 가까운 물건은 크게, 먼 물건은 작게 보이는 차이도 표현한다. 두 방식은 무엇을 더 중요하게 전달하려는지에 따라 달라진다.</p>
          <p class="section-title">⑥ 고대 이집트 벽화와 우리나라 민화의 공통점</p>
          <p>고대 이집트 벽화는 눈에 보이는 모습보다 사물의 실제 형태에 대한 앎을 중시한 그림으로 설명할 수 있다. 원근법에 익숙한 오늘날 사람에게는 이러한 표현이 어색하게 느껴질 수 있다. 그러나 특별히 원근법을 배우지 않은 사람은 사물을 그릴 때 자신이 알고 있는 형태를 드러내기 쉽다. 우리나라 민화의 책거리 그림을 보면 책장이나 탁자의 앞부분과 뒷부분을 같은 길이로 그린 경우가 많다. 실제로 눈에 보이는 대로라면 멀리 있는 뒷부분은 더 짧아야 한다. 그런데 그림에서는 그런 차이를 줄이지 않는다. 이는 실수라기보다 촉각상에 가까운 표현 방식으로 이해할 수 있다.</p>
          <p class="section-title">⑦ 서양 미술에서 발전한 시각적 사실성</p>
          <p>책거리뿐 아니라 건물을 그린 그림에서도 앞쪽과 뒤쪽의 길이를 비슷하게 표현하는 사례를 볼 수 있다. 이러한 방식은 특정 지역에만 나타나는 현상이 아니라 여러 문화권에서 발견된다. 사람은 자신이 알고 있는 사물의 구조를 그림에 담으려 하기 때문이다. 하지만 고대 그리스와 르네상스 시대의 유럽에서는 시각적 경험에 철저히 의존하여 대상을 묘사하려는 흐름이 두드러졌다. 보는 위치에 따라 달라지는 크기와 형태를 사실적으로 재현하려는 것이다. 이처럼 시각적 사실성을 강조하는 태도는 이후 서양 미술의 중요한 표현 특성으로 자리 잡았다. 그렇다고 다른 표현이 틀린 것은 아니다.</p>
          <p class="section-title">⑧ 미술의 목적은 눈에 보이는 것을 재현하는 것뿐일까?</p>
          <p>미술의 역할을 눈앞에 보이는 장면을 똑같이 옮기는 일로만 생각해서는 안 된다. 그림은 사람들이 세상을 어떻게 알고 이해하며 느끼는지를 전달하는 수단이기도 하다. 시각적 사실성을 이용하는 것은 그러한 생각을 표현하는 여러 방법 가운데 하나일 뿐이다. 이 점은 고대 이집트 벽화를 다시 살펴보면 분명해진다. 이집트 벽화에는 얼굴과 몸을 서로 다른 방향에서 본 모습으로 결합한 인물도 있지만, 정면이나 측면 중 한 방향에서 본 모습에 가깝게 그린 인물도 있다. 농부나 무희처럼 신분이 낮은 사람들을 묘사한 그림이 그 예다. 표현의 차이에는 이유가 있었다.</p>
          <p class="section-title">⑨ 이집트 벽화에 담긴 신분과 세계의 질서</p>
          <p>고대 이집트인들은 모든 인물을 같은 방식으로 그리지 않았다. 농부나 무희처럼 신분이 낮은 사람은 눈에 보이는 모습에 가까운 시각상으로 묘사하는 경우가 있었다. 반면 파라오나 귀족처럼 높은 신분의 인물은 사물의 실제 형태에 대한 앎을 강조하는 촉각상에 가깝게 표현했다. 이는 그림을 그리는 기술이 부족해서 생긴 차이만은 아니었다. 이집트인들이 사람의 신분과 세계의 질서를 어떻게 이해했는지가 그림의 형식에 담긴 것이다. 따라서 벽화를 볼 때는 얼마나 실제 사람처럼 보이는지만 따질 것이 아니라, 표현 방식에 담긴 생각과 가치도 읽어야 한다.</p>
          <p class="section-title">⑩ 보이는 대로 그리는 그림과 아는 대로 그리는 그림</p>
          <p>원문은 보이는 대로 그리는 일이 순간의 모습을 붙잡는 것이며, 결국 사라질 수밖에 없는 존재의 운명을 드러낸다고 설명한다. 반면 아는 대로 그리는 일은 변하지 않는 질서를 표현하여 영원한 삶에 대한 믿음을 담는 방식이 된다. 그래서 이집트 벽화에서 촉각상은 시각상보다 세계의 질서와 진리를 전달하는 데 더 유리한 이미지로 여겨졌다. 서양의 사실적인 초상화와 이집트의 벽화는 서로 다른 목적에 따라 다른 표현을 선택한 셈이다. 그림을 이해하려면 단지 얼마나 닮았는지를 넘어, 무엇을 보여 주려 했고 어떤 세계관을 담았는지 살펴보아야 한다.</p>

          <p class="section-title">③ 로봇이 가져올 일자리 구조의 변화</p>

          <p>2010년 3월, 한국 외교통상부는 기존 협상의 틀을 바꾸는 새로운 제안을 내놓았다. 프랑스가 외규장각 의궤 전부를 한국에 넘겨주면, 한국은 국내법에 어긋나지 않는 범위에서 해외 전시가 가능한 우리 문화재를 프랑스에 전시하겠다는 것이었다. 이전까지 논의되던 ‘등가 등량의 교환’, 곧 비슷한 가치와 수량의 문화재를 맞바꾸는 방식에서 벗어난 제안이었다. 한국은 어차피 많은 비용을 들여 해외에서 우리 문화재를 소개하고 있었으므로 전시를 외교적 협상의 기회로 활용하려 했다. 하지만 문화재를 주고받는 형식을 중요하게 여긴 프랑스가 이 제안을 선뜻 받아들일 가능성은 크지 않았다.</p>
          <p class="section-title">③ 2010년 5월, 다시 시작된 한불 공식 협상</p>
          <p>2010년 5월, 프랑스 외무부 아시아태평양국 국장 집무실에서 공식 협상이 다시 열렸다. 한국 측에서는 박흥신 대사와 원문의 화자가 협상 대표로 참석했다. 프랑스의 장 오르티즈 국장은 그동안 협상이 진전되지 못한 데에는 양측 모두 책임이 있다고 말했다. 또 외규장각 의궤 문제가 두 나라의 우호 관계를 해친다는 한국 측 지적에 공감하여 새로운 해결책을 모색하기로 했다고 밝혔다. 한국 대표들은 오랜 냉각기 끝에 마련된 자리인 만큼 프랑스 측의 설명을 끝까지 듣기로 했다. 상대의 생각을 충분히 파악해야 협상의 쟁점을 정확히 짚고 다음 대응을 준비할 수 있다고 판단했기 때문이다.</p>
          <p class="section-title">④ 프랑스가 고수한 문화재 맞교환의 원칙</p>
          <p>프랑스는 협상을 재개하면서도 기존 원칙을 포기하지 않았다. 장 오르티즈 국장은 1993년 양국 정상이 합의한 ‘교류와 대여’의 원칙을 협상의 토대로 삼아야 한다고 주장했다. 구체적인 출발점으로는 2001년 양국 민간 전문가들이 잠정적으로 합의했다가 한국의 반대로 무산된 의궤 맞교환 방안을 제시했다. 프랑스는 문화재를 일방적으로 돌려주는 방식보다 서로 교환하는 형식을 원한 것이다. 그러나 한국에서 의궤 맞교환은 이미 거센 비판을 받은 방식이었다. 약탈당한 문화재를 되찾으려면 국내에 있는 또 다른 소중한 문화재를 내주어야 한다는 발상 자체가 국민에게 받아들여지기 어려웠다.</p>
          <p class="section-title">⑤ 청소년 퀴즈 프로그램으로 전한 한국의 상처</p>
          <p>박흥신 대사는 프랑스 측에 한국 국민이 느끼는 상처를 설명하기 위해 뜻밖의 이야기를 꺼냈다. 파리에 부임하기 전 텔레비전에서 청소년 퀴즈 프로그램을 보았는데, 프랑스가 1866년 병인양요 때 약탈해 간 도서가 무엇인지 묻는 문제가 나왔다는 것이다. 그는 청소년 대상 방송에까지 등장할 만큼 외규장각 의궤 문제가 한국 사회에 깊이 남아 있다고 강조했다. 한국 사람들이 프랑스를 좋아하더라도 문화재를 돌려주지 않는 현실은 프랑스의 국가 이미지에 좋지 않은 영향을 준다고 지적했다. 이는 의궤 반환이 단순한 문화재 분쟁을 넘어 두 나라의 미래 관계와 신뢰에 관련된 문제임을 일깨우려는 발언이었다.</p>
          <p class="section-title">⑥ 문화재 대신 영원한 감사를 받으라는 설득</p>
          <p>한국 측은 2001년 의궤 맞교환안이 왜 국내에서 강한 반발을 불러왔는지도 설명했다. 외규장각 의궤 하나하나가 소중한 유산인데, 프랑스에 있는 의궤를 돌려받으려고 한국의 다른 의궤를 내주는 일은 장남을 구하기 위해 차남을 인질로 내주는 것과 같다는 비판이 있었다. 박흥신 대사는 왕실의 유산을 지키지 못했다는 자책감과 일제 강점기의 상처까지 겹친 한국 국민의 정서를 이해해 달라고 요청했다. 그리고 대가를 요구하지 말고 의궤를 돌려준 뒤 한국 국민의 영원한 감사와 우정을 받으라고 제안했다. 그는 그런 결단이 오히려 양국 관계를 더욱 굳건하게 만드는 토대가 될 것이라고 설득했다.</p>
          <p class="section-title">⑦ 2010년 6월, 의궤 297권의 일괄 반환 요구</p>
          <p>2010년 6월, 두 번째 공식 협상이 한국 측 대사관에서 열렸다. 프랑스는 외규장각 의궤를 여러 묶음으로 나누어 일부를 한국에 가져가 전시하고, 일정 기간이 지나면 다른 묶음으로 교체하는 방안을 제시했다. 의궤를 차례로 돌려 가며 보여 주겠다는 제안이었다. 한국 측은 이 방식이 근본적인 해결책이 될 수 없다고 보았지만 외교 협상인 만큼 상대의 설명을 차분히 들었다. 이어 의궤 297권은 하나의 전체로 다루어야 한다는 원칙을 분명히 밝혔다. 모든 의궤가 같은 장소에서 같은 시각에 프랑스군에게 약탈당했으므로 낱권이나 묶음으로 분리하지 않고 전부를 한꺼번에 돌려받아야 한다는 입장이었다.</p>
          <p class="section-title">⑧ 문화재 반환의 선례를 우려한 프랑스</p>
          <p>두 번째 협상 이후에도 양국의 입장은 쉽게 좁혀지지 않았다. 프랑스는 외규장각 의궤 전부를 아무 조건 없이 넘겨주면 다른 나라들도 자국 문화재의 반환을 요구할 수 있다고 우려했다. 문화재를 일방적으로 양도한 선례를 남기고 싶지 않았던 것이다. 그래서 작은 것이라도 한국으로부터 대가를 받아 교환하는 모양새를 갖추자고 요구했다. 그러나 한국은 의궤를 되찾는 대신 다른 문화재를 내놓는 방식을 받아들이기 어려웠다. 양측은 모두 해결을 원하면서도 서로 다른 원칙을 지키려 했다. 협상은 다시 답답한 교착 상태에 놓였고, 실질적인 반환과 외교적 명분을 함께 살릴 방법이 필요해졌다.</p>
          <p class="section-title">⑨ 2010년 11월, 5년 단위 갱신 대여라는 극적인 합의</p>
          <p>마침내 2010년 11월 12일, 서울에서 열린 국제회의를 계기로 양국은 극적인 합의에 도달했다. 프랑스가 외규장각 의궤 전부를 한국에 한꺼번에 보내되, 법적 형식은 ‘5년 단위로 갱신되는 대여’로 정한 것이다. 프랑스 국립도서관은 끝까지 한국으로부터 대가를 받아야 한다며 반대했지만, 양국 관계의 새로운 출발을 원하는 최고 정책 결정자의 결단이 합의를 이끌었다. 한국도 완전한 소유권 반환이라는 명분을 당장 얻지는 못했지만 의궤를 우리 땅에 가져오는 실리를 우선하기로 했다. 오랜 세월 이어진 의궤의 유랑을 끝내기 위해 양측이 현실적인 절충안을 선택한 순간이었다.</p>
          <p class="section-title">⑩ 외규장각 의궤의 귀환이 남긴 외교적 의미</p>
          <p>합의가 이루어진 뒤에도 외규장각 의궤를 안전하게 한국으로 옮기기 위한 일은 계속되었다. 양측은 이관 날짜와 포장 방법, 포장 재질, 예술품 전문 운송 업체의 선정, 보관 방식까지 세밀하게 논의했다. 학예 연구사들의 교류와 의궤 디지털화 작업을 마친 뒤 파일을 공유하는 문제도 협상 대상이었다. 소중한 문화유산을 옮기는 일이므로 어느 한 부분도 소홀히 할 수 없었다. 다행히 실무 협상은 처음 우려했던 것보다 서로의 입장을 존중하는 분위기에서 진행되었다. 외규장각 의궤의 귀환은 역사적 상처를 바로잡으려는 끈질긴 노력과 상대의 현실을 고려한 외교적 판단이 함께 만들어 낸 결과였다.</p>

          <p>미세 먼지는 입자의 크기에 따라 크게 PM-10과 PM-2.5로 나눕니다. PM-10은 지름이 10마이크로미터 이하인 입자를 가리킵니다. 사람 머리카락의 단면 지름이 보통 80~100마이크로미터 정도이므로, 머리카락보다 훨씬 작은 먼지인 셈입니다. PM-2.5는 지름이 2.5마이크로미터 이하인 입자로, 흔히 초미세 먼지라고 부릅니다. 초미세 먼지는 입자가 더욱 작아 인체에 미치는 영향에 관한 연구에서 특히 주목받고 있습니다. 서울에서 관측된 초미세 먼지의 약 10년간 농도 변화도 전체적으로 조금씩 감소하는 모습을 보였지만, PM-10에 비해서는 감소 폭이 작았습니다. 따라서 미세 먼지가 줄었다는 말만으로 초미세 먼지 문제까지 충분히 해결되었다고 생각해서는 안 됩니다. 두 종류는 크기가 다를 뿐 아니라 발생 과정과 구성 물질에도 차이가 있습니다. 미세 먼지의 특성을 파악할 때 입자의 크기를 먼저 구분하는 이유가 여기에 있습니다. PM-2.5는 PM-10보다 작은 입자까지 포함하므로 두 수치의 측정 대상이 같지 않다는 사실을 기억해야 합니다.</p>
          <p class="section-title">③ 자연에서 발생하는 미세 먼지와 배기가스의 검댕</p>
          <p>PM-10에 해당하는 미세 먼지에는 자연에서 생겨나는 입자들이 있습니다. 봄철 중국에서 우리나라로 날아오는 황사는 대표적인 사례입니다. 바다에서 파도가 칠 때 물거품이 공기 중으로 흩어졌다가 작은 알갱이로 남는 해염 입자도 있습니다. 꽃가루 역시 공기 중을 떠다니는 입자라는 점에서 미세 먼지의 한 종류로 볼 수 있습니다. 원문에서는 황사와 해염 입자, 꽃가루를 자연 미세 먼지의 예로 소개하며, 대체로 크기가 커서 초미세 먼지에는 잘 포함되지 않는다고 설명합니다. 반면 버스나 트럭의 배기가스에서 나오는 검댕은 매우 작은 초미세 먼지의 대표적인 예입니다. 최근에는 자동차 배기구에 오염 물질을 줄이는 장치를 달아 과거보다 배출량이 감소했습니다. 이 밖에도 황산, 황산 암모늄, 해양 유기물 등 다양한 화학적 성분이 초미세 먼지를 이룹니다. 같은 먼지처럼 보여도 입자가 어디에서 왔고 무엇으로 이루어졌는지에 따라 성질은 서로 다릅니다. 미세 먼지를 모두 공장이나 자동차에서 나온 오염 물질로 생각해서는 안 됩니다. 자연에서 발생한 입자도 함께 구분해야 합니다.</p>
          <p class="section-title">④ 바람에 날리는 먼지와 공기 중에서 만들어지는 먼지</p>
          <p>자연 미세 먼지는 땅이나 바다에 있던 물질이 바람을 타고 공기 중으로 올라오면서 생깁니다. 자동차가 지나갈 때 길가의 흙먼지가 날리는 모습을 떠올려 보세요. 이렇게 바닥에 있던 먼지가 다시 날아오르는 것을 비산 먼지라고 하며, 대기 중 미세 먼지 농도를 높이는 원인 가운데 하나입니다. 황사도 비슷한 원리로 발생합니다. 동아시아의 건조한 땅에서 강한 바람이 불면 흙먼지가 높이 떠올라 먼 거리를 이동하고 우리나라까지 도달하기도 합니다. 하지만 초미세 먼지 가운데는 기체 상태의 물질이 공기 중에서 반응하여 새 입자를 만드는 경우도 많습니다. 더운 날 냉장고에서 꺼낸 음료수 표면에 물방울이 맺히거나 추운 아침 안개가 생기는 것은 수증기가 응결하기 때문입니다. 초미세 먼지의 생성도 작은 물질들이 모여 입자를 이룬다는 점에서 이와 비교할 수 있습니다. 다만 초미세 먼지의 재료는 수증기와 달리 인체에 해로울 수 있는 여러 오염 물질이라는 점이 중요합니다. 눈에 보이는 흙먼지와 초미세 먼지는 생성 방식이 다를 수 있습니다. 따라서 먼지가 만들어지는 과정도 조사해야 합니다.</p>
          <p class="section-title">⑤ 초미세 먼지를 만들어 내는 네 가지 대표 물질</p>
          <p>초미세 먼지를 만들어 내는 대표적인 재료로는 이산화 황, 질소 화합물, 암모니아, 유기 기체가 있습니다. 먼저 화력 발전소에서 전기를 생산할 때 발생하는 이산화 황은 대기 중에서 화학 반응을 거쳐 황산이나 황산염 성분의 입자를 형성할 수 있습니다. 자동차 배기가스에 포함된 질소 화합물도 대기 중에서 반응하여 질산염 성분의 초미세 먼지를 만듭니다. 소나 돼지의 사육 과정이나 사람의 활동에서 나오는 암모니아는 다른 물질과 결합해 암모늄 성분의 입자를 형성하는 데 관여합니다. 화학 용매를 사용할 때 발생하거나 나무에서 자연적으로 나오는 유기 기체도 산화 과정을 거치면서 유기 탄소를 포함한 입자로 바뀔 수 있습니다. 이렇게 기체가 대기 중에서 반응해 만들어지는 입자는 처음부터 먼지 형태로 배출되는 검댕과 구별됩니다. 초미세 먼지를 줄이려면 이미 만들어진 먼지뿐 아니라 입자의 재료가 되는 기체의 배출도 관리해야 하는 이유입니다. 같은 초미세 먼지라도 성분이 다양하며, 지역과 계절에 따라 구성이 달라질 수 있습니다. 한 가지 오염원만 줄여서는 충분하지 않을 수 있습니다.</p>
          <p class="section-title">⑥ 우리나라의 미세 먼지 농도는 얼마나 심각할까?</p>
          <p>그렇다면 우리나라의 미세 먼지와 초미세 먼지 농도는 어느 정도일까요? 원문에서는 당시 우리나라의 초미세 먼지 농도가 사계절 내내 1세제곱미터당 20마이크로그램을 넘는 수준이었다고 설명합니다. 또한 당시 세계보건기구가 건강 보호를 위해 권장하던 초미세 먼지 농도 기준은 1세제곱미터당 10마이크로그램이었다고 소개합니다. 이 수치들은 원문이 작성된 시점의 설명이므로 현재의 측정값이나 최신 권고 기준과 구별해서 이해해야 합니다. 한편 우리나라의 PM-10 농도는 지난 20년 동안 전반적으로 감소했습니다. 정부가 미세 먼지를 줄이기 위해 많은 예산을 투입하고 환경 정책을 추진한 결과로 설명됩니다. 그러나 원문에서 주목하는 문제는 2012년에 농도가 가장 낮아진 뒤 일부 기간에 다시 높아졌다는 점입니다. 배출량을 줄이려는 노력에도 농도가 달라진다면, 그 이유를 배출원 이외의 조건에서도 찾아보아야 합니다. 미세 먼지의 증감 원인을 이해하려면 같은 장소에서 오랫동안 축적한 자료를 비교해야 합니다. 짧은 기간에 농도가 높아졌다는 사실만으로 장기적인 추세까지 단정할 수는 없습니다.</p>
          <p class="section-title">⑦ 바람의 세기가 미세 먼지 농도를 결정하는 이유</p>
          <p>미세 먼지 농도를 변화시키는 중요한 조건 가운데 하나는 바람의 세기, 즉 풍속입니다. 바람이 강하게 불면 굴뚝이나 자동차에서 나온 오염 물질이 주변 공기와 잘 섞여 특정 지역에 쌓이는 정도가 줄어듭니다. 반대로 바람이 약하면 같은 양의 오염 물질이 배출되어도 공기 중에 머물면서 농도가 높아질 수 있습니다. 원문에서는 이를 확인하기 위해 과거 20년간의 미세 먼지 농도 평균을 기준으로 삼고, 해마다 얼마나 높거나 낮았는지를 비교했습니다. 그 결과 2012년의 미세 먼지 농도가 가장 낮았고 이후에는 조금씩 증가하는 모습이 나타났습니다. 같은 방법으로 풍속의 변화를 분석하자 2012년에 바람이 가장 강했고 그 뒤로는 약해지는 경향을 보였습니다. 두 변화가 서로 관련되어 있다는 사실은 미세 먼지 농도를 배출량만으로 설명하기 어렵다는 점을 보여 줍니다. 대기의 흐름과 혼합 정도도 함께 살펴야 정확한 원인을 이해할 수 있습니다. 이 분석은 정책 효과를 판단할 때 기상 조건도 고려해야 함을 시사합니다. 바람의 차이를 무시하면 배출량의 변화를 정확히 읽기 어렵습니다.</p>
          <p class="section-title">⑧ 고기압과 저기압에 따라 달라지는 미세 먼지 농도</p>
          <p>기압 역시 미세 먼지 농도에 영향을 주는 중요한 기상 조건입니다. 원문에서는 대체로 고기압의 영향을 받을 때 미세 먼지 농도가 높아지는 경향이 있다고 설명합니다. 2013년 1월 중국 베이징에서는 미세 먼지 농도가 1세제곱미터당 1,000마이크로그램에 이를 정도로 심각한 오염이 나타났습니다. 당시 한반도를 포함한 동아시아는 고기압의 영향권에 있었습니다. 겨울철 고기압 아래에서는 북쪽에서 불어오는 바람이 약해지고 공기가 정체되면서 오염 물질이 잘 흩어지지 못하는 상황이 생길 수 있습니다. 반면 저기압이 영향을 줄 때에는 공기의 흐름이 상대적으로 활발해지고 비나 눈이 동반되기도 합니다. 이런 조건에서는 공기 중 입자가 씻겨 내려가거나 퍼져 나가 미세 먼지가 쌓이기 어려울 수 있습니다. 결국 미세 먼지 농도는 배출량뿐 아니라 기압, 바람, 강수와 같은 날씨의 영향을 함께 받습니다. 물론 고기압이라고 해서 언제나 오염이 심해지는 것은 아닙니다. 실제 농도는 그때 배출된 물질의 양과 바람의 방향, 대기 상태에 따라 달라집니다. 날씨를 함께 관찰해야 하는 이유입니다.</p>
          <p class="section-title">⑨ 지구 온난화와 미세 먼지는 서로 어떤 영향을 줄까?</p>
          <p>지구 온난화도 미세 먼지의 생성에 영향을 줄 수 있습니다. 여름철 기온이 높아지면 사람이 땀을 흘려 체온을 조절하듯 나무도 더위에 반응하여 유기 기체를 내보냅니다. 온도가 높아질수록 이런 기체의 배출이 늘어날 수 있으며, 대기 중에서 산화 반응을 거치면 유기 탄소 성분의 에어로졸이 형성됩니다. 반대로 미세 먼지는 기후에도 영향을 줍니다. 1991년 필리핀 피나투보산이 폭발했을 때 화산재와 가스가 높은 대기층까지 올라갔고, 이 가운데 일부 물질은 성층권에 머물렀습니다. 화산 분출로 만들어진 입자들이 태양 복사 에너지를 반사하면서 지구의 기온이 일시적으로 낮아졌습니다. 원문은 기온이 원래 수준으로 회복되는 데 약 5년이 걸렸다고 설명합니다. 이처럼 대기 중 입자는 햇빛을 직접 반사하거나 구름에 영향을 주면서 기후 변화에 중요한 역할을 합니다. 기후와 미세 먼지는 한쪽만 영향을 주는 관계가 아니라 서로 영향을 주고받는 관계입니다. 따라서 대기 오염을 연구할 때는 기온과 구름, 태양 에너지의 변화도 함께 고려해야 합니다.</p>
          <p class="section-title">⑩ 인공위성으로 관측하는 지구 대기와 미세 먼지의 미래</p>
          <p>과학자들은 미세 먼지와 지구 대기의 변화를 더 정확히 이해하기 위해 인공위성을 활용합니다. 원문에서는 미국 항공우주국 NASA가 쏘아 올린 다섯 개의 인공위성이 시간 차이를 두고 비슷한 궤도를 따라 이동하면서 대기를 관측한다고 소개합니다. 이 위성들은 대기를 구성하는 화학 물질과 오염 물질, 미세 먼지, 온도, 기압 등에 관한 정보를 수집합니다. 지상 관측만으로는 넓은 지역에서 일어나는 변화를 한눈에 살피기 어렵지만, 인공위성을 활용하면 여러 지역의 대기 상태를 비교하고 오염 물질의 이동을 분석하는 데 도움을 받을 수 있습니다. 우리나라도 미세 먼지를 비롯한 대기 오염 물질을 관측하고 공기의 흐름을 분석하기 위한 위성 기술을 추진해 왔습니다. 앞으로 관측 기술이 더욱 발전하면 한반도와 동아시아는 물론 전 세계 대기의 변화를 더욱 면밀하게 살필 수 있을 것입니다. 미세 먼지 문제를 해결하려면 지속적인 관측과 과학적인 분석이 함께 이루어져야 합니다. 이렇게 얻은 자료는 대기 오염이 언제 어디서 심해지는지 파악하고, 앞으로의 변화를 예측하는 연구에도 활용될 수 있습니다.</p>

        content: `
          <p class="section-title">① 2만 파운드를 건 필리어스 포그의 세계 일주</p>
          <p>『80일간의 세계 일주』는 부유하면서도 괴짜인 영국 신사 필리어스 포그의 이야기를 다룬 소설이다. 포그는 매일 똑같은 시간에 식사하고 정확히 30도의 물로 면도할 만큼 규칙적인 생활을 한다. 어느 날 하인이 29도의 물을 가져왔다는 이유로 그를 해고하고, 파스파르투라는 새 하인을 고용한다. 그러고는 평소처럼 혁신 클럽으로 향한다. 클럽에서 포그는 세계 일주를 80일 안에 끝낼 수 있는지를 두고 회원들과 논쟁을 벌인다. 그는 자신의 주장을 증명하기 위해 2만 파운드, 오늘날 돈으로 약 20억 원에 해당하는 거액을 걸고 내기한다. 포그는 그날 저녁 고용한 지 반나절도 안 된 파스파르투와 함께 런던을 떠난다. 그가 계획한 경로는 파리와 수에즈, 아덴, 인도의 뭄바이와 콜카타, 싱가포르, 홍콩, 상하이, 요코하마를 거쳐 미국의 샌프란시스코와 오마하, 뉴욕을 지나 리버풀을 통해 런던으로 돌아오는 긴 여정이었다. 평소 한 치의 흐트러짐도 용납하지 않던 신사가 갑자기 세계를 한 바퀴 돌겠다고 나선 것이다.</p>
          <p class="section-title">② 끊어진 철길과 2,000파운드짜리 코끼리</p>
          <p>포그의 여행은 처음에는 계획대로 진행되는 듯했다. 인도 뭄바이에 예정보다 이틀이나 빨리 도착했기 때문이다. 그러나 곧 예상하지 못한 문제가 생겼다. 영국 신문에는 인도 횡단 철도가 완전히 개통되었다고 보도되었지만, 실제로는 약 80킬로미터 구간에 철길이 놓이지 않았던 것이다. 포그와 파스파르투는 일정에 차질이 생기지 않도록 다른 교통수단을 찾았다. 그들은 한 인도인에게 코끼리를 빌리려 했으나 주인은 시간당 40파운드를 주겠다는 제안에도 응하지 않았다. 그러자 포그는 코끼리를 아예 1,000파운드에 사겠다고 나섰다. 함께 여행하던 영국 육군 준장은 주인이 값을 더 올릴 수 있으니 신중하게 생각하라고 충고했다. 하지만 포그는 내기에서 이기려면 코끼리가 반드시 필요하므로 제값의 스무 배라도 내겠다고 말했다. 결국 오랜 흥정 끝에 포그 일행은 2,000파운드를 주고 코끼리를 사서 밀림을 헤쳐 나갔다. 코끼리의 일반적인 값보다 훨씬 많은 돈을 지불하면서도 포그는 망설이지 않았다. 그에게는 돈을 아끼는 일보다 예정된 시간 안에 다음 목적지에 도착하는 일이 더 중요했기 때문이다.</p>
          <p class="section-title">③ 아우다 부인을 구하고 계속되는 여행의 위기</p>
          <p>코끼리를 타고 인도의 밀림을 지나던 포그 일행은 브라만교도들에게 화형당할 위험에 놓인 아우다 부인을 발견한다. 끊어진 철길 때문에 이미 많은 시간을 허비했지만, 포그는 일정을 이유로 위험에 빠진 사람을 외면하지 않았다. 일행은 힘을 모아 아우다 부인을 구했고, 그녀는 목숨을 구해 준 포그의 호의에 감동하여 여행에 동행한다. 이후에도 예상하지 못한 난관이 이어졌다. 홍콩에서 일본 요코하마로 이동하려던 일행은 배를 놓치고 말았다. 포그는 하루에 100파운드를 주는 조건으로 수로 안내선을 빌려 상하이로 향했다. 그곳에서 가까스로 태평양을 건너는 배에 올라 미국에 도착한 일행은 대륙 횡단 열차를 탔다. 그러나 이동 도중 인디언들의 공격으로 갈아타야 할 기차를 놓치자, 썰매를 빌려 돛을 달고 달린 끝에 다른 열차로 옮겨 탔다. 포그는 시간을 지키기 위해 끊임없이 새로운 방법을 찾아야 했다. 파스파르투와 아우다 부인이 함께하게 되면서 포그의 여행은 단순한 내기 이상의 이야기가 되었다. 그만큼 여정은 험난했다.</p>
          <p class="section-title">④ 배까지 사들이며 세계 일주를 이어 가다</p>
          <p>미국을 횡단한 포그 일행은 서둘러 대서양 횡단 기선을 타려 했지만, 불과 45분 차이로 배를 놓치고 말았다. 포그는 항구를 둘러보다 프랑스 보르도로 향하는 화물선 ‘앙리에타호’를 발견했다. 선장은 처음에 일행을 태우기를 거절했으나 포그가 한 사람당 2,000파운드를 제시하자 결국 승낙했다. 항해 도중에는 연료가 떨어지는 위기까지 닥쳤다. 그러자 포그는 건조된 지 20년 된, 5만 달러짜리 배를 6만 달러라는 거금을 주고 사들였다. 이후 배의 나무로 된 부분을 연료로 사용하며 항해를 계속했다. 코끼리를 비싸게 사거나 안내선을 빌리고 배까지 구입하는 행동은 일반 여행객이라면 쉽게 선택하지 못할 방법이었다. 하지만 포그에게 가장 중요한 것은 80일 안에 세계 일주를 마치는 일이었다. 그는 온갖 수단을 동원해 위기를 넘겼고, 마침내 약속된 시간 직전에 혁신 클럽 홀에 들어섰다. 선장이 처음에는 거절했던 승선 요청을 거액의 제안 뒤에 받아들였다는 점도 눈여겨볼 만하다. 같은 배의 자리라도 포그에게는 내기의 성패가 걸린 기회였으므로 그 가치는 훨씬 높았다.</p>
          <p class="section-title">⑤ 포그의 선택으로 이해하는 지불 용의 가격</p>
          <p>포그는 세계 일주를 떠나기 전에 상세한 계획표를 작성했지만, 실제 여행에서는 예기치 못한 사건들이 계속 발생했다. 철길이 끊어져 있거나 배를 놓칠 때마다 그는 다른 교통수단을 찾아야 했다. 이때 포그는 코끼리나 배를 소유한 사람에게 일반적인 시장 가격보다 훨씬 높은 금액을 제시했다. 경제학에서는 이러한 행동을 ‘지불 용의 가격’이라는 개념으로 설명할 수 있다. 지불 용의 가격이란 소비자가 어떤 상품을 구입하기 위해 최대한 지불하겠다고 마음먹은 금액을 뜻한다. 같은 코끼리라도 평범한 여행객에게는 그저 이동 수단이지만, 거액의 내기가 걸린 포그에게는 약속을 지킬 수 있게 해 주는 중요한 수단이었다. 따라서 포그가 코끼리와 배에 대해 생각하는 최대 지불 금액은 다른 사람보다 훨씬 높았다. 그에게 비싼 가격은 단순한 낭비가 아니라 내기에서 승리하기 위한 선택이었다. 여기서 시장 가격은 실제 거래에서 형성되는 가격을 말한다. 지불 용의 가격은 그와 달리 소비자가 마음속으로 정한 최대 금액이다. 두 가격은 반드시 같지 않다.</p>
          <p class="section-title">⑥ 같은 상품이라도 소비자가 느끼는 가치는 다르다</p>
          <p>그렇다고 포그가 여행하는 동안 언제나 비싼 가격을 지불한 것은 아니다. 일정에 문제가 없을 때에는 다른 여행객과 마찬가지로 정해진 요금을 내고 기차나 배를 이용했다. 포그는 필요하다면 높은 가격도 낼 마음이 있었지만, 실제로는 보통 요금만 지불하는 경우가 많았던 것이다. 이렇게 자신이 최대한 지불할 생각이었던 금액보다 낮은 가격에 상품이나 서비스를 이용하면 소비자는 이익을 얻는다. 이를 ‘소비자 잉여’라고 한다. 사람마다 같은 물건에 부여하는 가치가 다르다는 점도 중요하다. 예를 들어 우체국에서 판매하는 우표 한 장의 가격은 누구에게나 같지만, 어떤 사람은 몇백 원도 아깝다고 여기고 어떤 수집가는 희귀한 우표에 수백만 원이나 수천만 원의 가치를 부여한다. 따라서 같은 가격에 같은 물건을 사더라도 소비자가 느끼는 이익은 서로 다를 수 있다. 우표를 보내는 데 필요한 기능은 같더라도, 수집가에게는 희소성이나 개인적 만족이 추가적인 가치를 만든다. 포그가 교통수단에 부여한 가치 역시 이동 자체의 편리함보다 정해진 시간에 목적지에 도착한다는 목표에서 나왔다.</p>
          <p class="section-title">⑦ 사과 한 개로 알아보는 소비자 잉여의 계산</p>
          <p>영국의 경제학자 앨프리드 마셜은 소비자가 상품을 구입하여 얻는 이익을 ‘소비자 잉여’라는 개념으로 설명했다. 소비자 잉여는 소비자의 지불 용의 가격에서 실제 지불한 가격을 뺀 금액이다. 예를 들어 과일 가게에서 사과 한 개를 사려는 소비자 A는 최대 1,500원을 낼 생각이고, 소비자 B는 최대 1,000원을 낼 생각이라고 하자. 두 사람의 지불 용의 가격은 각각 1,500원과 1,000원이다. 그런데 가게에서 사과를 한 개에 500원에 판매한다면 A는 1,500원까지 낼 마음이 있었지만 500원만 냈으므로 1,000원의 소비자 잉여를 얻는다. B 역시 1,000원까지 낼 생각이었지만 500원만 냈으므로 소비자 잉여는 500원이다. 같은 사과를 같은 가격에 샀어도 A가 시장 거래를 통해 얻은 소비자 잉여가 B보다 500원 더 큰 셈이다. 이때 소비자 잉여는 상인이 소비자에게 직접 건네준 돈이 아니다. 자신이 지불할 수 있다고 여긴 금액보다 실제로 적게 지불함으로써 얻은 경제적 이득을 수치로 나타낸 것이다.</p>
          <p class="section-title">⑧ 판매자가 소비자의 최대 지불 금액을 안다면?</p>
          <p>소비자 잉여가 발생하는 까닭은 소비자가 상품에 부여하는 가치와 시장에서 실제로 지불하는 가격이 서로 다를 수 있기 때문이다. 포그처럼 지불 용의 가격이 높은 사람은 일반적인 요금으로 교통수단을 이용할 때 큰 소비자 잉여를 얻는다. 반대로 판매자가 모든 소비자의 지불 용의 가격을 정확히 알고 각자에게 그 최대 금액을 받는다면 소비자 잉여는 사라질 것이다. 그러나 현실에서 이런 방식으로 가격을 정하기는 매우 어렵다. 예를 들어 극장이 같은 등급의 좌석을 팔면서 관람객마다 지불할 마음이 있는 최대 금액을 알아내 서로 다른 요금을 부과한다면, 많은 관람객은 불공정하다고 느끼며 다른 극장을 선택할 수 있다. 판매자는 소비자의 마음속 최대 가격을 정확히 알기도 어렵다. 결국 소비자 잉여는 실제 시장 거래에서 흔히 나타나는 현상이다. 원문은 같은 품질의 상품에 대체로 같은 가격이 붙는 경쟁적 시장의 특성에 주목한다. 이때 구매자는 자신이 생각한 최대 가격보다 낮은 값에 물건을 살 수 있다. 판매자가 사람마다 다른 값을 요구하기 어려운 상황이 소비자에게 이익을 가져다주는 셈이다.</p>
          <p class="section-title">⑨ 경쟁적 시장에서 소비자 잉여가 발생하는 이유</p>
          <p>일반적으로 기업들이 서로 경쟁하는 시장에서는 품질이 같은 상품을 소비자마다 제각기 다른 가격에 판매하기 어렵다. 판매자가 어떤 상품을 독점하는 상황이 아니라면, 소비자는 더 저렴한 가격을 제시하는 다른 판매자를 선택할 수 있기 때문이다. 그래서 같은 상품을 같은 가격에 판매하더라도 소비자마다 얻는 잉여는 다르게 나타난다. 최대한 1,500원을 낼 생각이었던 사람이 500원에 사과를 사는 경우와, 최대한 1,000원을 낼 생각이었던 사람이 같은 사과를 500원에 사는 경우가 그렇다. 두 사람 모두 거래를 통해 이익을 얻지만 그 크기는 다르다. 포그 역시 급박한 상황이 아닐 때는 일반 요금으로 이동하면서 큰 소비자 잉여를 누렸다. 이러한 설명은 시장에서 소비자들이 자신이 생각하는 가치보다 낮은 가격에 상품을 구입할 때 혜택을 얻을 수 있다는 사실을 보여 준다. 다만 소비자 잉여가 크다는 사실은 물건을 공짜로 얻었다는 뜻이 아니다. 자신이 그 물건에 부여한 가치에 비해 적은 돈을 냈다는 의미다.</p>
          <p class="section-title">⑩ 포그가 세계 일주를 통해 얻은 진정한 이익</p>

          <p class="section-title">⑦ 돼지를 가족처럼 여기고 숭배하는 문화</p>
          <p>반면 중국과 남태평양의 여러 섬나라에서는 돼지가 매우 특별하고 좋은 동물로 여겨진다. 이 지역의 일부 공동체에서는 돼지를 방목하여 기르며, 돼지가 집안이나 부엌에 들어오는 일도 자연스럽게 받아들인다. 돼지는 단순한 가축이나 애완동물을 넘어 사람들과 가까이 생활하는 존재다. 어떤 지역에서는 돼지를 조상신에게 바치는 가장 귀한 의례용 동물로 여긴다. 같은 돼지를 두고 어떤 문화는 먹는 것을 금지하지만 다른 문화는 소중히 기르고 제사에 사용한다는 점이 흥미롭다. 이는 한 동물의 의미가 어디서나 똑같이 정해지는 것이 아니라, 사람들이 살아온 환경과 문화적 경험에 따라 달라진다는 사실을 보여 준다. 돼지가 어떤 지역에서는 위험하거나 부담스러운 가축이지만 다른 지역에서는 식량과 의례를 위한 중요한 자원이 될 수 있는 것이다. 따라서 한 문화의 금기나 숭배를 다른 문화의 기준으로만 평가해서는 그 행동이 지닌 의미를 충분히 이해하기 어렵다. 서로 다른 의미를 비교할 때에는 동물 자체의 특성뿐 아니라 사람들이 그 동물과 맺어 온 관계를 함께 살펴보는 일이 중요하다.</p>
          <p class="section-title">⑧ 뉴기니 마링족의 특별한 돼지 축제, 카이코</p>
          <p>인류학자 로이 라파포트는 뉴기니 고산 지대에 사는 바가 마링족의 ‘카이코’라는 돼지 축제를 연구했다. 원문에 따르면 이 축제는 보통 12년에 한 번씩 열리며 거의 일 년 동안 이어진다. 마링족은 돼지를 기르면서 식량과 의례에 활용하지만, 돼지 수가 계속 늘어나면 문제가 생긴다. 돼지가 밭을 훼손하고 사람들의 노동과 자원을 많이 필요로 하며, 이웃과 다투는 일도 늘어나는 것이다. 이런 상황이 나타나면 부족 사람들은 축제를 열어야 할 때가 되었다고 판단한다. 축제 기간에는 기르던 돼지 대부분을 잡아 식량으로 사용한다. 겉으로 보면 오랫동안 길러 온 가축을 한꺼번에 소비하는 큰 잔치에 불과해 보일 수 있다. 그러나 이 축제는 지나치게 늘어난 돼지의 수를 조절하고 공동체가 사용할 수 있는 자원에 맞춰 생활을 유지하는 기능을 한다. 라파포트는 의례가 단순한 종교 행사에 그치지 않고 생태계와 사회의 균형에 관계된다는 점에 주목했다. 그래서 축제에 쓰이는 돼지의 수와 축제가 열리는 시점은 공동체가 처한 환경을 이해하는 단서가 된다. 의례와 생업이 이어져 있는 셈이다.</p>
          <p class="section-title">⑨ 돼지 축제에 숨겨진 생태학적 전략</p>
          <p>마링족의 카이코 축제는 돼지를 잡아먹는 행사에서 끝나지 않는다. 원문에서는 축제가 끝난 뒤 두세 달 이내에 다른 부족과 전쟁을 벌이기도 하며, 남은 돼지들을 제물로 바치거나 조상신에게 올리는 제사에 활용한다고 설명한다. 그 뒤에는 남아 있는 돼지를 다시 키우며 다음 축제까지의 생활을 이어 간다. 이렇게 돼지를 기르고, 수가 늘어나면 축제를 열어 줄이고, 다시 사육하는 과정이 반복된다. 라파포트는 이 주기가 공동체의 자원과 생산 활동, 적절한 가축 수와 인구, 부족 사이의 관계를 조절하는 생태학적 전략이라고 해석했다. 축제는 종교적 믿음과 공동체의 의무를 실천하는 자리이면서도 생활환경의 부담을 줄이는 역할을 한다. 따라서 외부인의 눈에 비효율적인 잔치로 보이는 행동도 그 사회 전체의 생존 조건 속에서는 합리적인 선택일 수 있다. 이러한 해석은 문화적 관습을 이해할 때 의례의 겉모습뿐 아니라 그 결과와 기능도 살펴야 한다는 사실을 알려 준다. 이때 축제의 의미는 돼지고기를 얼마나 먹는가에만 있지 않다. 사람과 가축, 땅과 이웃 부족의 관계까지 함께 살펴야 비로소 드러난다.</p>
          <p class="section-title">⑩ 서로 다른 문화에는 서로 다른 합리성이 있다</p>
          <p>지금까지 살펴본 사례들은 합리성의 기준이 문화와 환경에 따라 달라질 수 있음을 보여 준다. 북부 미얀마의 농부들이 종교적 의례에 돈을 쓰는 행동은 불교적 신념과 공동체의 존경을 얻으려는 목적에서 이해할 수 있다. 여러 사회의 성대한 혼례도 친족 관계와 지위를 유지하는 기능을 한다. 인도의 소 숭배와 이슬람 사회의 돼지고기 금기는 마빈 해리스의 해석에서 환경에 적응한 전략으로 설명된다. 반대로 뉴기니 마링족의 돼지 축제는 가축과 자원을 조절하는 의례로 이해된다. 돼지를 혐오하는 문화와 귀하게 여기는 문화는 서로 모순되어 보이지만, 각각의 생활 조건 속에서 나름의 이유를 지닌다. 그러므로 다른 문화의 행동이 우리에게 낯설다는 이유만으로 어리석거나 비합리적이라고 단정해서는 안 된다. 문화 상대주의는 각 사회가 오랜 시간 쌓아 온 지식과 지혜를 그 사회의 맥락에서 이해하려는 태도다. 서로 다른 합리성을 인정할 때 우리는 인간의 삶을 더 폭넓게 바라볼 수 있다. 자신의 기준이 유일한 정답이라고 믿는 태도에서 벗어나면, 다른 사람의 선택을 이해하는 질문도 풍부해질 수 있다.</p>

          <p class="section-title">② 가장 오래된 커피 가공법, 건식법</p>
          <p>커피를 가공하는 방법은 크게 건식법과 습식법으로 나뉜다. 건식법은 자연식이라고도 하며, 가장 오래되고 단순한 가공 방식이자 기계를 적게 사용하는 방법이다. 건식법의 첫 단계는 커피나무에서 빨갛게 익은 열매인 체리를 수확하는 일이다. 수확 방법은 농장의 규모와 시설, 위치, 재배하는 커피의 품질 등에 따라 달라진다. 수확한 체리는 세척한 뒤 키질 등을 통해 잘 익은 열매와 덜 익은 열매, 손상된 열매로 나누어 선별한다. 이때 먼지와 흙, 나뭇가지 같은 이물질은 바람에 날려 제거한다. 잘 익은 열매만 모으는 작업은 이후 건조와 가공의 출발점이 된다. 같은 농장에서 수확했더라도 열매의 익은 정도나 상태가 다르면 최종 생두의 품질에도 차이가 생길 수 있기 때문이다. 건식법은 복잡한 기계 장치보다 햇빛과 바람을 적극적으로 활용한다는 점에서 전통적인 방식의 특징을 잘 보여 준다. 그러나 단순하다고 해서 아무렇게나 진행해도 되는 것은 아니다. 수확과 선별에서부터 세심한 관리가 필요하며, 특히 다음 단계인 건조 작업에서 커피의 품질이 크게 좌우된다.</p>
          <p class="section-title">③ 햇볕과 바람으로 커피 체리를 말리는 과정</p>
          <p>건식법으로 선별한 커피 체리는 커다란 콘크리트 바닥이나 벽돌로 만든 파티오, 또는 넓게 펼쳐 놓은 돗자리 위에 놓고 햇볕에 말린다. 우리나라에서 가을에 고추를 널어 말리는 모습과 비슷하다. 열매를 한곳에 그대로 두면 고르게 마르지 않으므로 갈퀴나 손을 이용해 꾸준히 섞고 뒤집어 주어야 한다. 체리의 수분 함유량이 약 12.5퍼센트가 될 때까지 말리는 것이 목표이며, 보통 2~3주가 걸린다. 햇볕이 약하거나 습도가 높은 지역에서는 건조 기간이 4주까지 늘어나기도 한다. 규모가 큰 농장에서는 뜨거운 바람을 내보내는 드라이어를 사용해 건조 시간을 단축하기도 한다. 이처럼 건식법은 햇볕에 맡겨 두기만 하는 작업이 아니라 열매의 상태와 날씨를 살피면서 수분을 조절하는 과정이다. 충분한 햇빛과 적절한 통풍이 확보되어야 체리 전체가 골고루 마를 수 있다. 농장에서는 건조 장소와 날씨에 맞추어 열매를 뒤집는 작업을 반복한다. 이렇게 시간을 들여 말린 체리는 다음 가공 단계로 옮겨지기 전까지 품질을 유지할 수 있도록 관리된다.</p>
          <p class="section-title">④ 커피의 품질을 결정하는 수분 함유량</p>
          <p>커피 체리를 말리는 건조 작업은 최종 품질을 결정하는 중요한 단계다. 체리를 지나치게 말리면 쉽게 부서져 운송하는 동안 손상될 위험이 커진다. 반대로 충분히 말리지 않으면 곰팡이가 피거나 열매가 썩어 품질이 떨어질 수 있다. 그래서 건식법에서는 수분 함유량을 약 12.5퍼센트로 맞추는 일이 중요하다. 건조를 마친 체리는 껍질을 벗길 때까지 특별히 설계된 저장 시설인 사일로에 보관한다. 이후 공장에서는 기계를 사용해 마른 체리에서 생두를 분리하고, 상태에 따라 선별하고 등급을 매겨 포대에 담는다. 건식법은 습식법보다 비용과 노동력이 적게 드는 편이어서 값싼 로부스타 커피를 가공하는 데 널리 사용된다. 브라질에서 생산되는 아라비카 커피의 약 95퍼센트와 에티오피아, 아이티, 파라과이에서 생산되는 아라비카의 대부분도 원문에 따르면 건식법으로 가공된다. 인도와 에콰도르의 일부 아라비카 커피 역시 이 방법을 거친다. 이처럼 건식법은 단순한 전통 방식에 머무르지 않고 여러 생산국에서 실제로 활용되는 중요한 가공법이다.</p>
          <p class="section-title">⑤ 물과 기계를 이용하는 고급 커피 가공법, 습식법</p>
          <p>커피를 가공하는 또 다른 방법은 습식법이다. 습식법은 특별히 고안된 기계와 많은 양의 물을 사용하므로 건식법에 비해 비용이 많이 든다. 그러나 원문에서는 커피 원두 본래의 맛과 향을 더 잘 보존할 수 있고, 원두가 손상되는 정도도 적다는 장점을 강조한다. 이러한 이유로 습식법은 고급 아라비카 커피를 가공하는 데 주로 이용된다. 수확한 체리는 건식법에서와 마찬가지로 물이 가득 담긴 커다란 탱크에서 세척하고 분류한다. 잘 익은 것과 덜 익은 것, 큰 것과 작은 것을 구분한 뒤에는 체리의 껍질과 과육을 제거한다. 바로 이 단계가 건식법과 습식법을 구분하는 가장 큰 차이점이다. 과육 제거 기계에는 움직이는 면과 고정된 면이 마주 보는 부분이 있다. 체리가 그 사이를 통과하면 껍질과 과육이 떨어져 나가고 생두가 분리된다. 두 면 사이의 간격은 생두가 손상되지 않도록 조절할 수 있다. 수확한 뒤 껍질과 과육을 가능한 한 빨리 제거할수록 생두의 품질이 덜 손상된다. 따라서 습식법에서는 수확 직후부터 세척과 분류, 과육 제거까지의 작업을 신속하고 정확하게 진행하는 것이 중요하다.</p>
          <p class="section-title">⑥ 발효를 통해 생두의 점액질을 제거하다</p>
          <p>습식법에서 껍질과 과육을 벗겨 낸 생두는 진동판을 지나며 두 번째 분류 과정을 거친다. 과육이 제대로 제거되지 않은 체리나 생두 사이에 남아 있던 과육 조각이 이때 걸러진다. 이어 생두는 다시 탱크로 옮겨져 물로 깨끗하게 세척된다. 세척을 마친 생두는 커다란 탱크에서 발효 과정을 거친다. 이 과정에서는 생두에 남아 있던 끈적끈적한 점액질이 분해되고 제거된다. 발효는 세심한 주의가 필요한 단계다. 잘못 관리하면 커피에서 불쾌한 신맛이 날 수 있기 때문이다. 점액질이 사라지는 데 걸리는 시간은 효소의 농도와 점액층의 두께 등에 따라 달라지며, 원문에서는 일반적으로 24~36시간 정도라고 설명한다. 발효가 끝난 생두는 표면의 미끈거리는 느낌이 사라져 손으로 만지면 조약돌과 비슷한 감촉을 준다. 이렇게 습식법은 열매를 씻고 과육을 벗겨 내는 작업에서 끝나지 않는다. 남은 점액질을 발효로 제거하고 상태를 확인하는 과정까지 거쳐야 다음 단계인 건조를 진행할 수 있다. 발효 시간과 관리 상태는 커피의 맛과 향에도 영향을 미치므로 꼼꼼한 관찰이 필요하다.</p>
          <p class="section-title">⑦ 발효를 마친 생두의 건조와 파치먼트 커피</p>
          <p>습식법에서 발효가 끝난 생두는 다시 한번 물로 씻어 낸다. 이때 생두에는 약 37퍼센트의 수분이 들어 있으므로 그대로 보관하기 어렵다. 따라서 수분 함유량을 이상적인 수준인 약 12.5퍼센트로 낮추기 위한 건조 작업을 진행한다. 건조에는 햇볕이나 뜨거운 바람을 내는 드라이어를 사용할 수 있고, 두 방법을 함께 쓰기도 한다. 햇볕에 말릴 때는 건식법처럼 넓은 콘크리트 바닥이나 돗자리를 이용한다. 생두를 2~10센티미터 두께로 펼쳐 놓고 자주 뒤집어 골고루 마르게 한다. 이렇게 말리는 데는 보통 8~10일이 걸린다. 규모가 큰 커피 농장에서는 수확량이 많기 때문에 생두가 상하기 전에 빠르게 말릴 수 있는 드라이어가 필요하다. 건조를 마친 생두는 얇은 막에 싸인 상태로 남아 있다. 원문에서는 이 상태를 영어로 막을 뜻하는 ‘파치먼트’라는 말을 붙여 ‘파치먼트 커피’라고 부른다. 즉 습식법은 발효 뒤에도 세척과 건조를 거쳐야 하며, 최종적으로 생두의 수분을 안정적인 수준으로 낮추는 일이 중요하다.</p>
          <p class="section-title">⑧ 수출 전 마지막 가공 단계, 큐어링</p>
          <p>건식법과 습식법으로 얻은 생두는 수출되기 직전에 ‘큐어링’이라는 마지막 정리 단계를 거친다. 이때 생두에 남아 있는 얇은 막을 벗겨 내고 먼지와 여러 불순물을 제거한다. 겉으로 보기에는 문제가 없어도 눈으로 쉽게 발견할 수 없는 결점이 있을 수 있으므로 기계를 이용해 불량한 생두를 골라내기도 한다. 이렇게 정리된 생두에는 품질에 따라 이름과 등급이 매겨진다. 도매상들은 이 정보를 바탕으로 원하는 생두를 선택하고 주문할 수 있다. 커피 열매를 수확한 뒤 세척하고 말리거나 과육을 제거해 발효시키고, 다시 건조한 다음 막까지 벗겨 내는 과정은 길고 복잡하다. 하지만 이 모든 과정을 마쳤다고 해서 우리가 마시는 커피가 완성되는 것은 아니다. 이 단계에서 얻은 것은 여전히 볶지 않은 생두이기 때문이다. 생두는 아직 우리가 익숙하게 느끼는 풍부한 향과 짙은 갈색을 충분히 갖추지 못한 상태다. 따라서 생두를 상품으로 분류하고 수출할 준비를 마친 뒤에도, 실제로 음료를 만들기 위해서는 또 하나의 중요한 과정이 남아 있다. 바로 생두를 열로 볶는 로스팅이다.</p>
          <p class="section-title">⑨ 생두를 향기로운 원두로 바꾸는 로스팅의 원리</p>
          <p>생두가 우리가 아는 커피 원두로 바뀌려면 로스팅, 곧 배전이라는 볶는 과정을 거쳐야 한다. 원문에서는 생두를 약 180~250도의 온도에서 12~20분 동안 볶는다고 설명한다. 이때 생두에 들어 있는 당분 등이 열에 의해 변화하면서 색과 향이 달라진다. 이러한 변화를 이해하는 데는 어린 시절 만들어 먹던 ‘뽑기’를 떠올리면 쉽다. 설탕을 쇠로 된 주걱에 담아 불 위에 올리면 녹으면서 구수한 향을 내는 갈색 액체로 변한다. 이처럼 당분이 가열되어 색과 향이 바뀌는 현상을 캐러멜화라고 한다. 커피를 볶는 동안에도 여러 화학적 변화가 일어나 생두에서는 느끼기 어려웠던 풍부한 향이 나타난다. 커피 기름으로 알려진 물질도 이 과정에서 원두의 향과 특성을 이해하는 데 중요한 요소로 소개된다. 로스팅은 단순히 원두를 뜨겁게 만드는 일이 아니라 커피의 맛과 향을 형성하는 핵심 단계다. 같은 생두라도 얼마나 오래, 얼마나 강하게 볶느냐에 따라 완성된 원두의 색깔과 풍미가 달라질 수 있다. 이 때문에 볶는 정도를 조절하는 기술도 중요하다.</p>
          <p class="section-title">⑩ 로스팅의 강도에 따라 달라지는 커피의 맛과 향</p>
          <p>커피 원두는 로스팅의 강도에 따라 서로 다른 맛과 향을 지니게 된다. 원문에서는 로스팅의 강도를 대략 아홉 가지로 나누며, 볶는 정도에 따라 원두의 색이 황토색에서 검은색에 가까운 짙은 갈색까지 달라진다고 설명한다. 원두를 추출해 마실 때 느껴지는 쓴맛과 단맛, 신맛도 로스팅 정도에 따라 조금씩 달라진다. 로스팅은 커피를 생산하는 나라보다 소비하는 나라에서 주로 이루어진다고 한다. 소비자의 취향에 맞추어 원두를 볶기 위한 이유도 있고, 원문에서는 브라질을 제외한 여러 생산국이 로스팅 기술을 충분히 갖추지 못했던 점도 그 배경으로 든다. 이렇게 볶은 커피 원두는 다시 드립이나 에스프레소 등의 방식으로 추출한다. 그제야 우리가 일상에서 마시는 음료인 커피가 완성된다. 한 잔의 커피가 만들어지기까지는 열매의 수확과 선별, 건식 또는 습식 가공, 건조와 큐어링, 로스팅과 추출이라는 여러 단계가 필요하다. 따라서 커피의 향과 맛은 커피나무에서 시작해 가공하는 사람들의 손길을 거치며 완성되는 결과라고 할 수 있다.</p>

          <p>우리 대한 사회는 무정한 사회입니다. 다른 나라에도 정이 메마른 사회가 있겠지만, 우리 사회는 그중에서도 불쌍한 처지에 놓여 있다고 생각합니다. 오랫동안 이어진 무정함이 나라를 쇠약하게 만들었고, 사람들은 여러 백 년 동안 살아도 사는 것 같지 않은 세월을 보냈습니다. 우리는 유정한 사회의 참맛을 모르고 살아왔기에 이러한 무정함을 견디지만, 따뜻한 사회에서 살던 사람이 갑자기 이곳에 들어온다면 견디기 어려울 것입니다. 민족의 생사가 걸린 문제 앞에서도 냉정한 태도를 보이는 것이 우리의 현실입니다. 우리가 벌이는 운동에서도 동지 사이에 정이 충분했다면 더 큰 힘을 발휘했을 것입니다. 정이 있어야 단결할 수 있고, 단결해야 민족도 흥할 수 있습니다. 정은 본래 사람에게 주어진 마음이지만, 우리는 남을 공경하는 법을 배우면서도 남을 사랑하는 일은 잊어버렸습니다. 혼례와 상례, 제사도 진심을 나누기보다 겉치레에 치우쳤습니다. 서로를 존중하는 예절에 사랑과 동정이 함께하지 않으면 사회는 따뜻해질 수 없습니다.</p>
          <p class="section-title">④ 공포와 매질 속에서 자라는 아이들</p>
          <p>여러분은 자신의 어린 시절을 돌아보십시오. 부모와 자녀, 형과 아우 사이에는 마땅히 서로 사랑하는 정이 있어야 하지만, 우리 가정에서는 그 정을 찾아보기 어렵습니다. 어른들은 어린아이를 하나의 장난감처럼 여기고, 우는 모습과 웃는 모습을 보려고 일부러 울리거나 웃깁니다. 호랑이나 귀신이 온다고 겁을 주는 일도 흔합니다. 조부모나 부모는 따뜻한 말보다 호령과 매질로 아이를 대하기 일쑤입니다. 아이는 잘못을 저질러 매를 맞을까 두려워하며 살아갑니다. 나 역시 어릴 때 산에서 노는 것을 가장 좋아했지만, 하루 종일 즐겁게 놀다가도 집으로 돌아올 때면 매를 맞을 생각에 떨었습니다. 때로는 잘못했다는 이유로 아이를 집 밖으로 내쫓기까지 합니다. 제 부모의 집에서 쫓겨난 아이가 울면서 주변을 서성이는 모습은 참으로 안타깝습니다. 강보에 싸인 시절부터 두려움 속에 자란 아이는 가정을 벗어나 학교에 가서도 편안함을 얻지 못합니다. 훈장마저 호랑이처럼 엄하게 대하니, 아이는 학교에 가고 싶어서가 아니라 부모가 시키기 때문에 마지못해 가는 것입니다.</p>
          <p class="section-title">⑤ 가족과 남녀 사이에 사라진 따뜻한 정</p>
          <p>가정 안에서 정이 부족한 모습은 아이들에게만 나타나는 것이 아닙니다. 시부모와 며느리, 형과 아우를 비롯한 가족들이 서로 원수처럼 지내기도 합니다. 관리와 백성 사이도 마찬가지입니다. 리와 면, 군과 도의 관청을 찾아가 보아도 어디에서든 찬바람 같은 냉대를 느낄 수 있습니다. 그보다 더욱 안타까운 것은 남녀 사이의 무정함입니다. 우리 가정에서는 부부가 서로 바라보며 웃기만 해도 큰일이 난 것처럼 여기곤 합니다. 남녀 사이에 정을 나눌 기회를 막고 서로 마주 보는 일조차 어렵게 만들었습니다. 그러다 보니 남녀가 사귀는 일 자체를 잘못된 행동으로 몰아가기도 합니다. 이는 남녀가 정당하게 교제할 길을 가로막는 것입니다. 가족과 사회가 서로 사랑하고 믿는 관계를 이루지 못하면 사람들은 언제나 다른 사람의 눈치를 보며 살아갑니다. 따뜻한 말과 웃음이 사라진 자리에 두려움과 의심이 들어섭니다. 이러한 무정함을 그대로 두고서는 사람들의 마음을 하나로 모으기도, 활기찬 사회를 만들기도 어렵습니다.</p>
          <p class="section-title">⑥ 사랑과 존중으로 아이를 기르는 다정한 사회</p>
          <p>이제 눈을 돌려 정이 많은 다른 사회의 모습을 살펴봅시다. 그곳의 가정에서는 부모가 아이에게 함부로 화를 내지 않습니다. 인형 같은 장난감을 주어 아끼고 사랑하는 마음을 기르게 하고, 잠잘 때에는 아이를 안아 주고 입을 맞추며 재웁니다. 식탁에서도 아이를 소중히 대하며 억지로 먹으라고 호령하지 않습니다. 그러므로 아이들은 어릴 때부터 공포심 없이 화기애애한 분위기 속에서 자랍니다. 글쓴이가 본 서양의 아이들은 꽃보다 귀하게 대접받았는데, 정이 가득한 가정에서 성장했기 때문입니다. 학교에서도 교사가 학생을 친절하게 대하므로 학생들은 선생을 따르고 학교에 가기를 좋아합니다. 글쓴이는 당시 소학교에 여성 교사가 많다는 점을 들며 여성이 남성보다 정이 많다고 설명합니다. 아이들이 학교를 두려워하지 않는 것은 가정에서 시작된 따뜻한 관계가 학교에서도 이어지기 때문이라고 봅니다. 아이를 억누르는 대신 존중하고 사랑하는 태도가 배움의 즐거움까지 키운다는 것입니다. 이런 경험은 자라서 다른 사람을 대하는 태도에도 이어질 수 있습니다.</p>
          <p class="section-title">⑦ 정을 소중히 여기는 서양 사회의 모습</p>
          <p>정이 많은 사회에서는 학교뿐 아니라 배와 집회 장소에서도 화기로운 분위기를 느낄 수 있습니다. 예배당에는 음악대가 있고 교우들은 때때로 함께 모여 웃고 음식을 나누며 친목을 다집니다. 사람들은 서로의 정을 밥과 옷 못지않게 소중한 것으로 여깁니다. 상인과 학생은 물론 신문을 파는 아이들까지도 저마다 친목 단체를 만들고 어울립니다. 정을 나누지 않고서는 살아가기 어렵다고 생각하기 때문입니다. 글쓴이가 미국에서 가장 부럽게 여긴 모습은 직업의 높고 낮음과 관계없이 사람들이 즐겁게 살아가는 것이었습니다. 손님이 찾아오면 웃으며 맞이하고, 약혼한 남녀는 서로를 사랑하는 마음을 거리낌 없이 표현합니다. 다른 사람들도 이를 흉보지 않으므로 두 사람에게는 공포보다 두터운 정이 남습니다. 남녀의 화합은 사회의 정을 이루는 기초인데, 우리 사회는 남녀를 엄격히 갈라놓아 차가운 분위기를 만들었다고 글쓴이는 비판합니다. 그는 서양 사람들이 정 속에서 자라고 살다가 죽으며, 그 정에서 화기와 흥미가 생겨 여러 일을 활발하게 해낸다고 보았습니다.</p>
          <p class="section-title">⑧ 정의 돈수를 실천하기 위한 일곱 가지 자세</p>
          <p>우리가 사회를 새롭게 고치려 한다면 무엇보다 먼저 다정한 사회를 만들어야 합니다. 글쓴이는 우리 사회에 따뜻한 정이 부족하므로 정을 기르는 공부와 연습이 꼭 필요하다고 강조합니다. 그래야 비로소 살아가는 참맛을 알 수 있다는 것입니다. 말 한마디와 행동 하나로 서로의 정을 해치는 일도 가볍게 보아서는 안 됩니다. 우리 동포는 함께 모이기만 하면 다투는 일이 많다고 여겨 왔습니다. 그러나 다른 사람의 결점을 지적할 때에도 듣기 싫은 말로 상처를 주기보다 사랑하는 마음으로 타일러야 합니다. 정을 기르는 데에는 몇 가지 주의할 점이 있습니다. 남의 일에 함부로 개입하지 말고, 각자의 개성을 존중하며, 다른 사람의 자유를 침범하지 않아야 합니다. 또한 남에게 물질적으로 의지하지 말고, 상대의 정이 깊거나 얕다고 탓하지 말아야 합니다. 신의를 지키고 예절을 갖추는 일도 중요합니다. 서로 사랑한다는 이유로 상대의 자유를 억누르거나 지나친 요구를 하는 것은 참된 정이 아닙니다. 정은 상대를 존중하는 태도 속에서 더욱 두터워집니다.</p>
          <p class="section-title">⑨ 어려운 이웃을 외면하지 않는 유정한 사회</p>
          <p>무정한 사회와 유정한 사회는 나라를 위해 애쓰는 사람을 대하는 태도에서도 차이가 납니다. 무정한 사회에서는 애국자의 결점만 찾아 비난하다가 그가 위험에 빠져도 도와주지 않습니다. 공익사업에 돈을 내던 사람이 형편 때문에 더는 기부하지 못하면, 그동안 베푼 도움을 고맙게 여기기는커녕 오히려 욕하기도 합니다. 글쓴이는 이러한 태도가 얼마나 무정한 일인지 되묻습니다. 반대로 정이 있는 사회에서는 길에서 어려움을 겪는 사람을 만나면 나이나 체면을 따지지 않고 구하려고 합니다. 도움을 주느라 수고하는 일도 마다하지 않으며, 신분이 높고 낮은지를 구별하지 않습니다. 자기의 좋은 옷을 찢어서라도 다친 사람의 상처를 싸매 주고 곁에서 간호합니다. 이런 행동은 다른 사람의 고통을 자신의 고통처럼 여기는 동정에서 나옵니다. 정은 가까운 가족이나 친구에게만 베푸는 마음이 아니라 도움이 필요한 낯선 사람에게도 뻗어 나가야 합니다. 누군가가 이미 베푼 선의를 기억하고 감사하는 태도 또한 유정한 사회를 이루는 중요한 바탕입니다.</p>
          <p class="section-title">⑩ 정의 돈수, 우리 사회를 변화시키는 힘</p>
          <p>정이 없는 사회에서 살아가는 사람의 고통은 참으로 크고, 그 사회는 가시밭처럼 괴롭기만 합니다. 글쓴이는 우리 대한 사회가 바로 그런 무정한 사회가 되어 버렸다고 탄식합니다. 그러나 이를 바꾸기 위해서는 서로에게 정을 베풀고, 이미 있는 정을 더욱 깊고 두텁게 가꾸어야 합니다. 정의가 있어야 화기가 생기고, 화기가 있어야 흥미가 생기며, 흥미가 있어야 성공할 수 있습니다. 사람들은 정이 넘치는 사회에서 비로소 어떤 사업이나 의무도 억지로가 아니라 스스로 하고 싶은 마음으로 실천하게 됩니다. 서로를 두려워하는 대신 믿고, 남의 결점을 공격하는 대신 사랑으로 충고하며, 어려운 사람을 외면하지 않고 도와야 합니다. 남의 개성과 자유를 존중하고 신의와 예절을 지키는 것도 정을 기르는 실천입니다. 글쓴이는 우리가 어디로 가든 ‘정의 돈수’라는 네 글자를 삶의 지침으로 삼자고 당부합니다. 정의 돈수는 단지 좋은 감정을 품자는 말이 아닙니다. 친애와 동정을 꾸준히 공부하고 연습하여 개인의 삶과 사회 전체를 따뜻하게 바꾸자는 다짐입니다.</p>

          <p class="section-title">③ 편의점의 경쟁력을 만드는 정보와 배송 시스템</p>
          <p>큰 창고도 없는 편의점이 어떻게 수천 종류의 상품을 갖추고 필요한 물건을 제때 공급할 수 있을까? 그 비결은 판매 정보 통합 관리 시스템과 정교한 배송 체계에 있다. 편의점은 어떤 상품이 얼마나 팔렸고 재고가 얼마나 남았는지를 실시간으로 파악한다. 본사는 이러한 자료를 바탕으로 배송 차량을 하루에 한두 번씩 순회시키며 가맹점마다 필요한 상품을 맞춤형으로 공급한다. 이를테면 어느 점포에는 볼펜 몇 자루와 라면 몇 개를 보내는 식이다. 전국의 가맹점을 관리하는 본사가 상품을 일괄 구매하고 유통하므로 규모의 경제도 실현할 수 있다. 동시에 각 동네의 주민들이 무엇을 필요로 하는지 세밀하게 파악하여 신속하게 대응하는 유연한 전략도 갖추고 있다. 다시 말해 대규모 유통망의 효율성과 작은 동네 가게의 세심함을 결합한 것이다. 편의점이 기존 구멍가게나 슈퍼마켓은 물론 백화점, 대형 할인점, 홈쇼핑과도 경쟁할 수 있는 힘은 바로 이러한 정보와 배송 시스템에서 나온다. 눈에 보이지 않는 물류의 힘이 작은 매장을 지탱하는 것이다.</p>
          <p class="section-title">④ 환한 조명에 숨겨진 편의점의 디자인 전략</p>
          <p>편의점의 또 다른 차별성은 매장의 디자인이다. 편의점에 들어서면 가장 먼저 눈에 띄는 것은 환한 조명이다. 천장에는 형광등이 빼곡하게 설치되어 있고, 대낮에도 불을 밝게 켜 놓는다. 밤에는 그 밝음이 화려하게 느껴져 손님에게 신선하고 활기찬 공간에 들어왔다는 인상을 준다. 조명을 밝게 하여 소비 욕구를 자극하는 것은 백화점 진열장에서도 사용되는 오래된 방법이다. 편의점은 이처럼 일상과 다른 특별한 분위기를 집 가까운 곳으로 끌어들였다. 물건을 진열할 때에도 빛이 어느 각도로 반사되어야 소비자에게 부담을 주지 않으면서 구매 욕구를 높일 수 있을지 계산한다. 그 결과 조명과 선반의 위치까지 일정한 규격에 따라 배치된다. 밝은 빛은 진열된 상품을 돋보이게 할 뿐 아니라, 손님이 매장을 깨끗하고 활기찬 공간으로 느끼도록 한다. 우리가 아무 생각 없이 들어가는 편의점의 밝은 실내에도 소비자의 시선과 행동을 고려한 세심한 설계가 숨어 있는 셈이다. 밝은 조명은 편의점만의 독특한 분위기를 만드는 중요한 장치이기도 하다.</p>
          <p class="section-title">⑤ 어두운 도시를 밝히는 편의점의 안전 기능</p>
          <p>편의점의 밝은 조명은 상품을 돋보이게 하는 것에 그치지 않고 사람들을 안심시키는 역할도 한다. 여성들이 늦은 밤에도 편의점에 들어가고, 낯선 손님이 옆에 있어도 크게 신경 쓰지 않는 데에는 구석구석을 비추는 환한 불빛이 영향을 준다. 투명한 유리창을 통해 바깥에서도 매장 안을 훤히 볼 수 있다는 점 역시 안정감을 높인다. 도난 방지를 위해 설치된 볼록 거울은 계산대 직원이 매장 전체를 살필 수 있게 해 준다. 흥미롭게도 매장 안의 밝은 빛은 바깥으로도 퍼져 나가 어두운 도시에서 오아시스 같은 역할을 한다. 이는 지역의 치안에도 도움이 될 수 있다. 실제로 일본의 일부 편의점에는 아이들과 여성이 위급할 때 도움을 요청할 수 있는 점포라는 안내문이 붙어 있다. 천장이나 간판 옆에 경광등을 달고 비상시에 사이렌을 울리기도 한다. 위험에 처한 사람이 가까운 편의점으로 달려가 도움을 청할 수 있으므로, 편의점은 물건을 파는 가게를 넘어 때로는 파출소와 비슷한 기능까지 수행하는 것이다. 밤늦게까지 켜진 불빛이 거리의 안전감을 높여 주는 셈이다.</p>
          <p class="section-title">⑥ 도시인이 편의점의 무관심을 편안하게 느끼는 이유</p>
          <p>편의점은 도시 문화가 만들어 낸 상업 공간이며, 특히 젊은 도시인들의 인간관계 감각과 잘 맞는다. 예전의 구멍가게에서는 주인이 늘 자리를 지키며 손님을 맞이했으므로 무엇을 살지 정하고 들어가야 할 것 같은 부담이 있었다. 그러나 편의점의 점원은 손님이 들어오고 나갈 때 간단히 인사할 뿐, 먼저 말을 걸거나 시선을 오래 보내지 않는다. 손님이 질문하기 전에는 굳이 관심을 드러내지 않는 것이다. 이러한 ‘무관심의 배려’는 오히려 손님을 홀가분하게 만든다. 특별히 살 물건이 없어도 부담 없이 들어가 상품을 둘러볼 수 있다. 편의점은 이처럼 인간관계의 번거로움을 피하고 싶어 하는 도시인에게 잘 어울린다. 대형 할인점이 백화점보다 편하게 느껴지는 이유 가운데 하나도 점원이 계속 따라다니며 말을 걸지 않는다는 점일 것이다. 반면 익명의 손님들이 끊임없이 드나들고 점원도 자주 바뀌므로, 전통적인 동네 가게에서처럼 주인과 손님 사이에 친밀한 단골 관계가 형성되기는 쉽지 않다. 이처럼 적당한 거리감 자체가 도시 소비자에게는 편안함이 된다.</p>
          <p class="section-title">⑦ 표준화된 고객 응대와 예측 가능한 인간관계</p>
          <p>편의점은 하루 24시간 문을 열어야 하므로 주인이 직접 계산대를 지키기보다 아르바이트 점원을 고용하는 경우가 많다. 그런데 어느 편의점을 가더라도 점원들이 손님을 대하는 태도와 방식은 놀랄 만큼 비슷하다. 이는 고객 응대가 일정한 규칙에 따라 표준화되어 있기 때문이다. 사회학자 조지 리처는 즉석 식품점의 특징을 ‘각본에 의한 고객과의 상호 작용’과 ‘예측 가능한 종업원의 행동’으로 설명했다. 햄버거 가게에서 종업원이 어떤 말로 주문을 받고 어떻게 응대할지 세밀하게 정해져 있는 것처럼, 편의점에서도 비슷한 방식이 나타난다. 손님은 종업원이 누구인지, 어떤 기분인지 크게 신경 쓰지 않고 익숙한 절차에 따라 물건을 고르고 계산할 수 있다. 이러한 관계는 불필요한 감정 교류가 없는 깔끔한 소통을 가능하게 한다. 또한 짧은 시간에 많은 손님을 상대하는 데에도 효율적이다. 편의점이 주는 편안함은 단지 점원의 친절함 때문이 아니라, 어디에서나 비슷한 서비스를 예상할 수 있다는 데에서도 나온다. 표준화된 응대는 손님과 점원 모두에게 행동의 기준을 제공한다.</p>
          <p class="section-title">⑧ 고객의 행동까지 분석하는 치밀한 정보 시스템</p>
          <p>편의점에서는 주인과 손님 사이에 깊은 인간관계가 형성되지 않지만, 역설적으로 고객에 관한 정보는 매우 자세하게 수집된다. 원문에 따르면 일부 편의점에서는 점원이 물건값을 계산할 때 구매자의 성별과 연령대를 계산기의 버튼으로 입력하고, 그 자료가 곧바로 본사에 전달된다. 천장에 설치된 CCTV도 도난 방지만을 위한 장치는 아니다. 어떤 연령대와 성별의 손님이 매장 어느 곳에 오래 머무는지 분석하는 데 활용되기도 한다. 녹화 화면은 주기적으로 본사에 보내져 분석된다. 어떤 점포에서는 삼각김밥 진열대에 초소형 카메라를 설치해 손님이 상품을 고르는 모습을 기록하기도 한다. 손님이 처음부터 살 물건을 정하고 오는지, 여러 상품을 들어 보며 비교하는지, 유통기한을 확인하는지, 한 번에 몇 개를 사는지 등을 통계로 처리하는 것이다. 이렇게 모은 정보는 상품 배치와 판매 전략에 활용된다. 편의점의 성장 뒤에는 소비자의 행동을 치밀하게 파악하고 관리하는 정보 시스템이 작동하고 있다. 손님이 의식하지 못하는 사이에도 소비의 흔적은 자료로 남는다.</p>
          <p class="section-title">⑨ 편의점의 성장 뒤에 숨겨진 주인과 점원의 고충</p>
          <p>편의점이 빠르게 성장했다고 해서 가맹점 주인의 수입까지 늘어난 것은 아니다. 한때 편의점은 한 달에 300만 원 이상의 수입을 넉넉하게 기대할 수 있는 유망한 사업으로 여겨졌다. 그러나 조기 퇴직자와 부업으로 편의점을 운영하려는 사람이 늘어나자 가맹점 개설을 희망하는 이들이 몰렸다. 본사들은 예상 매출액을 부풀려 개업을 적극적으로 권하기도 했다. 그 결과 가까운 거리에 여러 편의점이 들어서 서로 손님을 빼앗는 경쟁이 벌어졌고, 적자를 보는 가게도 적지 않게 되었다. 아르바이트 점원의 처지도 힘겹다. 원문에 묘사된 당시 점원들은 비정규직으로 일하며 공통된 유니폼을 입고 시급 약 3,000원을 받으면서 하루 10시간 정도 일했다. 물건을 검수하고 옮기고, 창고를 정리하고, 상품을 진열하고, 청소와 계산 확인까지 맡았다. 밤샘 근무에 술 취한 손님의 행패까지 겹치면 고통이 커졌다. 낮에도 무리한 요구를 하거나 가격에 항의하는 손님을 상대해야 했다. 고객에게 편리한 공간이 누군가에게는 고된 일터인 셈이다.</p>
          <p class="section-title">⑩ 도시의 성좌, 편리함 뒤에 감춰진 불편한 진실</p>
          <p>편리함을 뜻하는 영어 단어 ‘컨비니언스(convenience)’는 ‘함께 있음’을 뜻하는 라틴어에서 유래했다. 편의점은 이제 도시인의 일상에 자연스럽게 스며들어, 사람들은 환하고 깔끔한 매장을 자기 방처럼 친숙하게 느낀다. 늦은 밤 인터넷을 하다가 출출해졌을 때도 언제든 찾아갈 수 있고, 수많은 상품이 진열된 가게가 연중무휴로 문을 열고 있다는 사실은 고맙기까지 하다. 외롭고 힘겹게 살아가는 사람들에게 편의점은 어두운 도시를 밝히는 ‘도시의 성좌’처럼 작은 위안을 준다. 그러나 편의점에서 소비자의 욕망과 행동은 체계적으로 수집되고 관리된다. 가맹점 주인과 점원의 업무 역시 정해진 지침에 따라 기계적으로 이루어진다. 소비자의 편리함은 저절로 만들어지는 것이 아니다. 누군가가 밤을 새우고 고된 노동을 감당해야 유지된다. 구멍가게와 슈퍼마켓을 밀어내며 도시 곳곳에 들어선 편의점은 문명의 편리함과 함께 그 뒤에 감춰진 외로움과 고단함도 드러낸다. 우리 생활을 바꾸는 거대한 시스템이 앞으로 도시인의 삶을 어떻게 만들어 갈지 돌아보게 한다.</p>
