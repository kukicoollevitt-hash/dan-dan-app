<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스피드 독서왕 - 도서 읽기</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f8fafc;
      min-height: 100vh;
      transition: background-image 0.5s ease-in-out;
    }
    .book-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px 100px;
    }
    .book-header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 16px;
      color: white;
    }
    .book-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .book-author {
      font-size: 16px;
      opacity: 0.9;
    }
    .book-content {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      line-height: 2;
      font-size: 18px;
      color: #333;
    }
    .book-content p {
      margin-bottom: 20px;
      text-indent: 1em;
    }
    .book-content .section-title {
      font-size: 20px;
      font-weight: 700;
      color: #10b981;
      margin: 30px 0 20px;
      text-indent: 0;
    }
    .loading {
      text-align: center;
      padding: 100px 20px;
      color: #666;
      font-size: 18px;
    }
    .error {
      text-align: center;
      padding: 100px 20px;
      color: #ef4444;
      font-size: 18px;
    }

    /* 파트별 진행 UI */
    .part-progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      background: #f8fafc;
      padding: 15px 0;
      z-index: 100;
    }
    .part-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      transition: all 0.3s;
      cursor: pointer;
    }
    .part-dot.completed {
      background: #10b981;
      color: white;
    }
    .part-dot.current {
      background: #3b82f6;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    /* 문장 클릭 스타일 */
    .clickable-sentence {
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 4px;
      padding: 2px 4px;
      margin: -2px -4px;
      display: inline;
    }
    .clickable-sentence:hover {
      background: #fef3c7;
    }
    .clickable-sentence.clicked {
      background: #d1fae5;
      color: #065f46;
    }
    .clickable-sentence.disabled {
      cursor: default;
    }
    .clickable-sentence.disabled:hover {
      background: transparent;
    }

    /* 파트 섹션 스타일 */
    .part-section {
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e5e7eb;
    }
    .part-section:last-child {
      border-bottom: none;
    }
    .part-section.locked .clickable-sentence {
      cursor: default;
      color: #9ca3af;
    }
    .part-section.locked .clickable-sentence:hover {
      background: transparent;
    }
    .part-section.completed-part .clickable-sentence {
      background: #d1fae5;
      color: #065f46;
      cursor: default;
    }
    .part-section.completed-part .clickable-sentence:hover {
      background: #d1fae5;
    }

    /* 중심내용 퀴즈 팝업 */
    .quiz-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .quiz-overlay.active {
      display: flex;
    }
    .quiz-popup {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }
    .quiz-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .quiz-part-label {
      display: inline-block;
      background: #3b82f6;
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .quiz-title {
      font-size: 20px;
      font-weight: 700;
      color: #1f2937;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quiz-option {
      padding: 16px 20px;
      background: #f8fafc;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      color: #374151;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .quiz-option:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }
    .quiz-option.selected {
      border-color: #3b82f6;
      background: #dbeafe;
    }
    .quiz-option.correct {
      border-color: #10b981;
      background: #d1fae5;
      color: #065f46;
    }
    .quiz-option.wrong {
      border-color: #ef4444;
      background: #fee2e2;
      color: #991b1b;
    }
    .quiz-submit-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .quiz-submit-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .quiz-result {
      text-align: center;
      padding: 20px;
      margin-top: 16px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
    }
    .quiz-result.correct {
      background: #d1fae5;
      color: #065f46;
    }
    .quiz-result.wrong {
      background: #fee2e2;
      color: #991b1b;
    }

    /* 폭죽 효과 */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2000;
      overflow: hidden;
      display: none;
    }
    .confetti {
      position: absolute;
      top: -20px;
      font-size: 20px;
      animation: confetti-fall 2s ease-out forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* 엑스 표시 효과 */
    .wrong-x-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      pointer-events: none;
    }
    .wrong-x {
      font-size: 150px;
      color: #ef4444;
      animation: wrong-shake 0.5s ease-out;
      text-shadow: 0 0 30px rgba(239, 68, 68, 0.5);
    }
    @keyframes wrong-shake {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.2) rotate(-5deg); }
      50% { transform: scale(1.1) rotate(5deg); }
      75% { transform: scale(1.15) rotate(-3deg); }
    }

    /* 완독 축하 팝업 */
    .complete-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1500;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .complete-overlay.active {
      display: flex;
    }
    .complete-popup {
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      animation: popup-bounce 0.5s ease-out;
    }
    @keyframes popup-bounce {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .complete-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    .complete-title {
      font-size: 28px;
      font-weight: 700;
      color: #10b981;
      margin-bottom: 16px;
    }
    .complete-time {
      font-size: 18px;
      color: #374151;
      margin-bottom: 8px;
    }
    .complete-time-value {
      font-size: 32px;
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 24px;
    }
    .complete-message {
      font-size: 16px;
      color: #6b7280;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .complete-btn {
      display: inline-block;
      padding: 16px 40px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .complete-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>
  <div class="book-container">
    <div id="bookContent">
      <div class="loading">도서를 불러오는 중...</div>
    </div>
  </div>

  <!-- 폭죽 효과 컨테이너 -->
  <div class="confetti-container" id="confettiContainer"></div>

  <!-- 엑스 표시 효과 -->
  <div class="wrong-x-container" id="wrongXContainer">
    <div class="wrong-x">✕</div>
  </div>

  <!-- 중심내용 퀴즈 팝업 -->
  <div class="quiz-overlay" id="quizOverlay">
    <div class="quiz-popup">
      <div class="quiz-header">
        <div class="quiz-part-label" id="quizPartLabel">Part 1</div>
        <div class="quiz-title">이 파트의 중심 내용은?</div>
      </div>
      <div class="quiz-options" id="quizOptions"></div>
      <button class="quiz-submit-btn" id="quizSubmitBtn" disabled onclick="submitQuizAnswer()">정답 확인</button>
      <div class="quiz-result" id="quizResult" style="display:none;"></div>
    </div>
  </div>

  <!-- 완독 축하 팝업 -->
  <div class="complete-overlay" id="completeOverlay">
    <div class="complete-popup">
      <div class="complete-icon">🎉</div>
      <div class="complete-title">완독을 축하합니다!</div>
      <div class="complete-time">총 독해 시간</div>
      <div class="complete-time-value" id="totalReadingTime">0분 0초</div>
      <div class="complete-message">
        모든 파트를 읽고 중심 내용을 확인했습니다.<br>
        이제 문제풀이를 시작해주세요!
      </div>
      <button class="complete-btn" onclick="closeCompletePopup()">확인</button>
    </div>
  </div>

  <script>
    // URL에서 도서 ID 가져오기
    const urlParams = new URLSearchParams(window.location.search);
    const bookId = urlParams.get('id');

    // 파트별 진행 상태
    let currentPart = 1;
    let completedParts = [];
    let selectedAnswer = null;
    let currentQuizAnswer = null;
    let readingStartTime = Date.now(); // 독해 시작 시간

    // 폭죽 효과
    function showConfetti() {
      const container = document.getElementById('confettiContainer');
      container.style.display = 'block';
      container.innerHTML = '';

      const colors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#9b59b6', '#e84393', '#00d2d3', '#ff9f43'];
      const shapes = ['🎉', '🎊', '⭐', '✨', '💫', '🌟', '🎈', '🎀'];

      for (let i = 0; i < 60; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * 100 + '%';
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        confetti.style.animationDuration = (Math.random() * 1 + 1.5) + 's';
        confetti.textContent = shapes[Math.floor(Math.random() * shapes.length)];
        confetti.style.fontSize = (Math.random() * 15 + 15) + 'px';
        container.appendChild(confetti);
      }

      setTimeout(() => {
        container.style.display = 'none';
        container.innerHTML = '';
      }, 2500);
    }

    // 엑스 표시 효과
    function showWrongX() {
      const container = document.getElementById('wrongXContainer');
      container.style.display = 'flex';

      setTimeout(() => {
        container.style.display = 'none';
      }, 800);
    }

    // 시간 포맷팅
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}분 ${secs}초`;
    }

    // 도서별 파트 이미지 경로 매핑
    const PART_IMAGES = {
      // 스피드 독서왕 주요 도서
      sonagi: (part) => `/rain/rain_${String(part).padStart(2, '0')}.jpg`,
      goodday: (part) => `/good/good1_${String(part).padStart(2, '0')}.jpg`,
      dongbaek: (part) => `/flower/flower${String(part).padStart(2, '0')}.jpg`,

      jangma: (part) => `/images/jangma/jangma${String(part).padStart(2, '0')}.jpg`,
      hong: (part) => `/images/hong/hong${String(part).padStart(2, '0')}.jpg`,

    // 배경 이미지 변경 함수
    function updateBackground(bookId, partNum) {
      console.log('updateBackground called:', bookId, partNum);
      if (PART_IMAGES[bookId]) {
        const imgUrl = PART_IMAGES[bookId](partNum);
        console.log('Setting background image:', imgUrl);
        document.body.style.backgroundImage = `url('${imgUrl}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';
      } else {
        console.log('No image mapping for bookId:', bookId);
      }
    }

          <p>세 사람은 함께 눈 덮인 겨울 들길을 걸었다. 바람은 매섭고 길은 멀기만 하였다. 백화는 얇은 옷차림에 신발마저 변변치 않아, 추위에 발을 동동 굴렀다. 처음엔 백화를 못마땅해하던 영달도, 그 딱한 모습에 차츰 마음이 누그러졌다. 길을 걷다 백화가 눈길에 미끄러져 넘어지자, 영달이 선뜻 손을 내밀어 일으켜 주었다. 정 씨는 그런 두 사람을 보며 빙그레 웃었다. 셋은 추위를 피해 잠시 길가의 빈집에 들어가 불을 피우고 언 몸을 녹이기도 하였다. 함께 손을 쬐며, 그들은 조금씩 서로에게 마음을 열어 갔다.</p>
          <p>갈 곳 없이 떠도는 처지라는 그 공통점이, 어느새 세 사람을 가깝게 묶어 주고 있었다. 티격태격하던 처음과 달리, 이제는 서로의 발걸음을 챙기고 안부를 물었다. 눈보라 속의 고단한 길이었지만, 함께였기에 조금은 견딜 만하였다. 정 씨는 가진 담배를 영달과 나누어 피웠고, 백화는 언 손을 호호 불며 두 사람 뒤를 종종걸음으로 따랐다. 서로 처지가 고단한 것을 알기에, 굳이 많은 말이 필요 없었다. 그저 같은 길을 함께 걷는 것만으로도 큰 위안이 되었다. 세상 끝으로 내몰린 세 떠돌이의 정이, 그렇게 눈길 위에서 조용히 쌓여 갔다. 비록 가진 것은 없어도, 서로가 있어 춥지만은 않은 길이었다.</p>

          <p class="section-title">Part 5. 백화의 사연</p>
          <p>길을 걷는 동안, 백화는 조금씩 제 지난 이야기를 털어놓았다. 그녀가 술집 작부로 흘러든 것은 열여덟 어린 나이 때부터였다. 가난한 집안 형편에 떠밀려, 이 술집 저 술집을 전전하며 모진 세월을 보냈다. 몸과 마음이 다 닳도록 고단한 삶이었다. 백화는 그동안 수많은 남자들을 스쳐 보냈노라 하였다. 그중에는 가슴 아픈 사연도 적지 않았다. 군대 간 젊은 병사들에게 살뜰히 정을 주고, 그들이 떠날 때면 몰래 눈물짓던 이야기도 있었다. 겉으로는 억세고 드세 보이는 백화였지만, 그 속에는 누구보다 여리고 따뜻한 마음이 숨어 있었다. 고된 삶에 시달리면서도, 백화는 정 많고 인간다운 심성을 끝내 잃지 않고 있었던 것이다.</p>
          <p>영달과 정 씨는 그 이야기를 들으며, 백화를 함부로 여기던 처음의 마음을 못내 부끄러워하였다. 백화 또한 한낱 가엾은 떠돌이였고, 저희와 조금도 다를 바 없는 처지였던 것이다. 백화의 이야기에는 웃음과 눈물이 함께 배어 있었다. 모진 세월을 견뎌 온 사람만이 지을 수 있는, 그런 담담한 표정이었다. 영달은 괜히 코끝이 시큰해졌다. 백화가 겪은 설움이, 곧 저희가 겪어 온 설움과 조금도 다르지 않았던 까닭이다. 세 사람은 그렇게 서로의 아픔을 알아 갔다. 같은 처지의 사람들끼리만 나눌 수 있는 위로였다.</p>

          <p class="section-title">Part 6. 서로 기대어</p>
          <p>추위와 고단함 속에서, 세 사람은 어느새 서로에게 둘도 없는 의지가 되어 있었다. 영달은 백화의 무거운 봇짐을 대신 들어 주고, 백화는 가진 주먹밥을 두 사내에게 선뜻 나누어 주었다. 정 씨는 두 젊은이를 마치 제 자식처럼 살뜰히 챙겼다. 눈보라가 몰아치면 서로 몸을 바짝 붙여 온기를 나누었다. 그렇게 함께 걷는 동안, 영달의 마음속에는 백화를 향한 연민과 호감이 조금씩 피어올랐다. 억척스러운 겉모습 뒤에 감춰진 백화의 여린 마음을, 영달은 이제 알 것 같았다. 백화 또한 무뚝뚝하지만 속정 깊은 영달에게 차츰 마음이 기울었다. 두 사람 사이에는 말로 다 하지 못할 따뜻한 감정이 소리 없이 오갔다.</p>
          <p>비록 가진 것 하나 없는 떠돌이들이었지만, 서로를 보듬는 그 마음만은 무엇보다 넉넉하였다. 세상에서 버림받은 이들끼리 나누는 온기였기에, 그 정은 더욱 애틋하고 소중하였다. 말은 투박해도 서로를 아끼는 마음은 숨길 수 없었다. 영달이 괜히 백화에게 퉁을 놓으면, 백화도 지지 않고 톡 맞받아쳤다. 그러나 그 티격태격 속에는 어느새 따스한 정이 묻어났다. 정 씨는 그런 두 젊은이를 흐뭇하게 바라보곤 하였다. 고단한 길 위에서, 피 한 방울 섞이지 않은 세 사람은 그렇게 한 가족처럼 가까워져 갔다.</p>

          <p class="section-title">Part 7. 백화의 본심</p>
          <p>이윽고 세 사람은 백화가 기차를 타야 할 갈림길에 이르렀다. 백화는 제 고향으로 돌아가려는 참이었다. 헤어질 때가 다가오자, 백화는 한참을 머뭇거리다 영달에게 속마음을 털어놓았다. "저어… 나랑 같이 우리 고향으로 가지 않을래요? 거기 가서 함께 농사라도 지으며 조용히 살면…." 떠돌이 생활을 그만두고, 영달과 함께 새 삶을 꾸리고 싶다는 간절한 마음이었다. 그러고는 백화가 나직이 제 본심을 내비치듯 말하였다. "사실 내 이름은 백화가 아니에요.</p>
          <p>진짜 이름은 이점례예요." '백화'는 술집에서 쓰던 가짜 이름일 뿐, 이점례가 바로 그녀의 진짜 이름이었다. 본명을 밝힌다는 것은, 그만큼 영달에게 제 마음을 다 열어 보였다는 뜻이었다. 그것은 작부 백화가 아닌, 한 사람의 여인 이점례로서 건네는 진심이었다. 영달은 그 말에 가슴이 뭉클해졌다. 그러나 그는 선뜻 그러자고 대답하지 못하였다. 이점례라는 그 이름을 입에 올리는 백화의 목소리는, 가늘게 떨리고 있었다. 평생 가짜 이름 뒤에 숨어 살아온 그녀였다. 영달은 그 진심이 고마우면서도, 한편으로는 가슴이 미어졌다. 백화의 그 간절한 마음을 선뜻 받아 주지 못하는 제 처지가, 그 순간 더없이 초라하게만 느껴졌던 것이다.</p>

          <p class="section-title">Part 8. 이별</p>
          <p>영달은 한참을 망설인 끝에, 끝내 백화를 따라나서지 못하였다. 정처 없이 떠도는 제 신세로는, 백화를 책임지고 거둘 자신이 도무지 없었던 것이다. 그러나 영달은 백화를 그냥 빈손으로 보낼 수는 없었다. 그는 주머니를 털어, 백화가 고향까지 갈 기차표를 끊어 주었다. 그러고는 가는 길에 먹으라며 삶은 달걀과 귤 몇 개까지 사서 손에 쥐여 주었다. 가진 것 없는 떠돌이가 건넬 수 있는, 최선의 마음이었다. 백화는 그 투박한 다정함에 그만 눈시울을 붉혔다. "고마워요. 정말… 고마워요."</p>

          <p>바다를 가로막아 방둑을 쌓고, 산을 깎아 길을 내며, 트럭과 중장비가 밤낮으로 드나든다 하였다. 고기잡이하던 순박한 사람들은 이미 뿔뿔이 흩어지고 없었다. 정 씨가 그토록 돌아가고 싶어 하던 그 고향은, 거센 산업화의 물결에 휩쓸려 이미 흔적도 없이 사라져 버린 것이었다. 정 씨는 노인의 말을 차마 믿고 싶지 않았다. 그 고요하던 바다가, 그 정겹던 마을이 그렇게 변했다니. 십 년을 하루같이 그리며 버텨 온 고향이었다. 그런데 막상 돌아갈 그곳이 송두리째 사라졌다는 것이다. 먼 하늘을 올려다보는 정 씨의 눈에는 쓸쓸함이 가득하였다. 그는 그만 그 자리에 멍하니 서 버리고 말았다.</p>

          <p class="section-title">Part 1. 이인국 박사와 회중시계</p>
          <p>이인국 박사는 서울에서 손꼽히는 외과 의사였다. 그가 운영하는 병원은 늘 돈 많고 지위 높은 환자들로 북적였다. 그날, 이인국 박사는 미국으로 떠날 채비를 하며 낡은 회중시계를 꺼내 들여다보았다. 그 시계는 그가 일제강점기에 제국대학 의학부를 우수한 성적으로 졸업할 때 받은 것이었다. 회중시계는 어느덧 삼십 년 가까운 세월 동안, 그의 파란만장한 인생을 묵묵히 함께해 온 물건이었다. 그는 시계를 어루만지며 지난날을 천천히 되짚어 보았다. 일제강점기와 해방, 그리고 전쟁에 이르기까지, 세상은 몇 번이고 뒤집히고 또 뒤집혔다. 그 격변의 소용돌이 속에서, 수많은 사람들이 몰락하고 스러져 갔다.</p>
          <p>그러나 이인국 박사만은 그때마다 늘 멀쩡히 살아남았다. 아니, 살아남은 정도가 아니라 오히려 그때마다 더 높이 올라섰다. 그 비결이 대체 무엇이던가. 회중시계를 바라보는 그의 입가에, 어쩐지 묘한 웃음이 번졌다. 회중시계의 바늘은 지난 삼십 년을 한결같이 돌아왔다. 그러나 그 세월 동안 이인국이 섬긴 주인은 몇 번이고 바뀌었다. 시계는 변함이 없었으되, 정작 그 주인의 처세는 바람처럼 변덕스러웠던 것이다. 이제 그는 또 한 번, 새로운 세상을 향해 발을 내디디려 하고 있었다.</p>

          <p class="section-title">Part 2. 일제강점기의 친일</p>
          <p>이인국의 처세술은 멀리 일제강점기로 거슬러 올라간다. 그는 일찍이 일본어를 누구보다 유창하게 구사하였다. 일본인 앞에서는 일본인보다 더 일본인처럼 행동하여, 그들의 환심을 사는 데 조금도 거리낌이 없었다. 그의 병원을 찾는 환자도 대개는 친일 고관이나 일본인들이었다. 가난한 조선 사람은 뒷전으로 밀려나기 일쑤였다. 이인국은 집에서도 일본말만 쓰기를 고집하여, '국어 상용의 집'이라는 패를 자랑스레 내걸었다. 자식들에게도 철저히 일본식 교육을 시켰고, 아들은 일본으로 유학을 보냈다. 당시 그는 일본이 세운 질서가 영원하리라 굳게 믿었다.</p>
          <p>그러니 일본에 바짝 붙어 출세하는 것이, 가장 현명한 처신이라 여겼던 것이다. 그는 의술이 뛰어난 의사이기 이전에, 시류를 읽고 권력에 빌붙는 데 능한 사람이었다. 그렇게 이인국은 일제강점기 내내 남부럽지 않은 부와 지위를 누리며 떵떵거리고 살았다. 그는 일본인 의사들과 어울리며 그들의 신임을 얻는 데 온 힘을 쏟았다. 조선인이라는 사실조차 애써 감추려 들었다. 그에게 조선은 등져야 할 과거요, 일본은 올라타야 할 미래였던 셈이다. 그는 이 좋은 세상이 영영 그대로일 줄만 알았으나, 그 믿음은 오래가지 못할 것이었다.</p>

          <p class="section-title">Part 3. 해방과 위기</p>
          <p>그러나 세상은 영원하지 않았다. 1945년, 마침내 광복이 찾아왔다. 일본은 패망하였고, 이인국이 살던 북쪽에는 소련군이 들어왔다. 하루아침에 온 세상이 뒤집힌 것이다. 그토록 떵떵거리던 친일파 이인국의 처지는 졸지에 위태로워졌다. 일본에 빌붙어 호강하던 그를, 사람들이 가만둘 리 없었다. 이인국은 친일파로 지목되어, 결국 치안대에 붙잡혀 감방에 갇히고 말았다. 좁고 차가운 감방 안에는 온갖 죄목으로 끌려온 사람들이 뒤섞여 있었다. 평생을 떵떵거리며 살던 이인국에게, 그 감방살이는 견디기 힘든 치욕이었다. 게다가 친일 행적이 낱낱이 드러나면 어떤 벌을 받게 될지 알 수 없었다.</p>
          <p>그러나 이인국은 결코 여기서 주저앉을 사람이 아니었다. 그는 절망하는 대신, 이 위기를 어떻게 벗어날지 재빨리 머리를 굴리기 시작하였다. 위기는 곧 기회라는 것을, 그는 본능적으로 알고 있었던 것이다. 같은 감방에 갇힌 다른 친일파들은 하나같이 겁에 질려 벌벌 떨고 있었다. 그러나 이인국만은 달랐다. 그는 이런 상황에서도 어떻게든 빠져나갈 구멍이 있으리라 믿었다. 절망은 애초에 그의 몫이 아니었다. 그의 눈은 어느새 살길을 찾아 번득이고 있었다. 그는 기어이 이 감방을 벗어나고야 말겠다고 다짐하였다.</p>

          <p class="section-title">Part 4. 스텐코프와 혹 수술</p>
          <p>감방에 갇힌 이인국이 가장 먼저 한 일은, 다름 아닌 러시아어를 익히는 것이었다. 이제는 소련이 세상을 쥐었으니, 그들의 말을 배워 두는 것이 살길이라 여긴 것이다. 그는 틈만 나면 러시아어 단어를 외우며 기회를 엿보았다. 그러던 어느 날, 뜻밖의 기회가 찾아왔다. 감방을 관리하던 소련군 장교 스텐코프의 얼굴에, 커다란 혹이 하나 달려 있는 것을 발견한 것이다. 이인국은 때를 놓치지 않고, 자신이 그 혹을 말끔히 떼어 주겠노라 자청하였다. 뛰어난 외과 의사였던 그에게 혹을 떼는 수술쯤은 어려운 일이 아니었다. 과연 수술은 감쪽같이 성공하였다.</p>
          <p>오랜 골칫거리였던 혹이 사라지자, 스텐코프는 크게 기뻐하며 이인국을 달리 보기 시작하였다. 이인국의 실력과 처세에 감탄한 스텐코프는, 그를 '꺼삐딴 리', 곧 '리 대장'이라 부르며 가까이 두었다. 수술을 마친 스텐코프는 이인국의 손을 덥석 잡으며 거듭 고마움을 표하였다. 이인국은 속으로 쾌재를 불렀다. 궁지에 몰렸던 그가, 의술 하나로 단숨에 판세를 뒤집어 버린 것이다. 감방에 갇힌 친일파가, 단숨에 소련군 장교의 신임받는 사람으로 둔갑하는 순간이었다. 그의 처세술이 또 한 번 번쩍 빛을 발한 셈이었다. 참으로 놀랍고도 얄미운 변신이었다.</p>

          <p class="section-title">Part 5. 친소파로 변신</p>
          <p>스텐코프의 신임을 얻은 이인국은, 머지않아 감방에서 풀려났다. 친일파로 몰려 죽을 뻔하던 그가, 이번에는 소련군의 비호를 받는 몸이 된 것이다. 이인국은 조금도 거리낌 없이, 어제까지의 친일파에서 하루아침에 친소파로 변신하였다. 그는 일본에 빌붙던 그 재주 그대로, 이번에는 소련에 바짝 붙어 다시금 승승장구하였다. 러시아어를 더욱 열심히 익히고, 소련군 간부들과 두루 친분을 쌓았다. 일제 때 '국어 상용'을 외치던 바로 그 입으로, 이제는 소련을 소리 높여 찬양하였다. 그뿐 아니라 이인국은 아들 원식이를 소련으로 유학까지 보냈다. 일본으로 유학 보내던 그 아들을, 이번에는 소련으로 보낸 것이다.</p>
          <p>세상이 바뀌면 재빨리 그 세상에 맞추어 처신하는 것, 그것이 이인국의 변함없는 생존 방식이었다. 신념이나 지조 따위는 그에게 애초에 있지도 않았다. 어제까지 일본을 떠받들던 사람이, 오늘은 소련을 떠받드는 데 조금의 거리낌도 없었다. 그에게 어제의 신념이란 언제든 갈아 끼울 수 있는 헌 옷에 지나지 않았다. 중요한 것은 지금 누가 세상을 쥐고 있느냐, 오직 그것뿐이었다. 어제의 적에게 오늘 머리를 조아리는 일도 그에게는 조금도 거북하지 않았다. 오직 살아남아 출세하는 것만이, 그가 아는 유일한 가치였다.</p>

          <p class="section-title">Part 6. 월남</p>
          <p>그러나 이인국의 평탄한 길도 다시 한번 위기를 맞았다. 한국 전쟁이 터진 것이다. 전세가 엎치락뒤치락 뒤바뀌는 혼란 속에서, 이인국은 또 한 번 재빠른 판단을 내렸다. 그는 미련 없이 북녘 땅을 버리고, 남쪽으로 피란길에 올랐다. 소련에 붙어 누리던 모든 것을 뒤로하고, 홀몸으로 삼팔선을 넘어 월남한 것이다. 소련으로 유학 간 아들과도 그렇게 생이별을 하게 되었다. 낯선 남쪽 땅 서울에서, 이인국은 맨손으로 다시 시작해야 했다. 그러나 그는 조금도 주저하지 않았다. 뛰어난 의술과 특유의 처세술을 밑천 삼아, 서울에서 다시 병원을 열고 빠르게 자리를 잡아 나갔다.</p>
          <p>전쟁으로 모든 것을 잃고 좌절하는 사람들 틈에서도, 이인국만은 또다시 보란 듯이 일어섰다. 그에게 중요한 것은 오직 지금, 이 땅에서 어떻게 살아남아 성공하느냐 하는 것뿐이었다. 지나간 과거 따위는 조금도 돌아보지 않았다. 북에 두고 온 재산도, 소련에 보낸 아들도 그에게는 그리 큰 미련이 아니었다. 살아남기 위해서라면 무엇이든 미련 없이 버릴 수 있는 그였다. 그에게 지난날의 영화는 이미 흘러간 물일 뿐이었고, 오직 눈앞의 새 세상만이 중요하였다. 남쪽 땅은 그에게 또 하나의 새로운 무대일 뿐이었다. 그의 눈은 늘 새로운 기회만을 좇았다.</p>

          <p class="section-title">Part 7. 친미파가 되다</p>
          <p>서울에 자리 잡은 이인국은, 이제 새롭게 떠오른 세력이 누구인지를 이내 간파하였다. 바로 미국이었다. 해방 뒤로 남한에는 미국의 힘이 깊숙이 뻗쳐 있었다. 이인국은 조금의 망설임도 없이, 이번에는 미국에 바짝 붙기로 작정하였다. 일본어와 러시아어를 익혔던 그 재주로, 그는 또다시 영어 공부에 매달렸다. 어느새 그의 입에서는 제법 능숙한 영어가 흘러나왔다. 이인국은 미군 장교들과 교분을 쌓고, 그들에게 유용한 정보를 제공하며 환심을 샀다. 특히 그는 미국 대사관에 드나드는 브라운이라는 미국인과 각별한 친분을 맺는 데 성공하였다.</p>
          <p>친일파였다가 친소파였던 그가, 이제는 누구보다 열렬한 친미파로 또 한 번 변신한 것이다. 그는 미국이야말로 이제 세상을 쥔 가장 강한 나라라고 확신하였다. 그러니 미국에 줄을 대는 것이, 앞으로 출세할 가장 확실한 길이라 여겼던 것이다. 그는 미국식 생활 방식을 재빠르게 받아들였고, 미국인들의 비위를 맞추는 데 능수능란하였다. 일제 때 일본말만 쓰던 그 집이, 이제는 온통 미국풍으로 바뀌었다. 어제의 소련이 오늘의 미국으로 바뀌었을 뿐, 그의 셈속은 조금도 달라지지 않았다. 부끄러움이란 애초에 그에게는 없는 감정이었다. 그의 변신에는 조금의 거리낌도 없었다.</p>

          <p class="section-title">Part 8. 고려청자와 미국行</p>
          <p>이인국의 다음 목표는 미국으로 건너가는 것이었다. 미국에 가서 더 넓은 세상에서 성공을 이어 가고자 한 것이다. 그는 그 꿈을 이루기 위해, 브라운 씨를 한층 더 극진히 공략하였다. 그러던 어느 날, 이인국은 브라운 씨에게 아주 특별한 선물을 바쳤다. 다름 아닌 귀한 고려청자였다. 우리 민족의 소중한 문화재인 고려청자를, 그는 제 출세를 위한 뇌물로 아낌없이 내놓은 것이다. 값을 매길 수조차 없는 그 보물을 받아 든 브라운 씨는, 흡족한 얼굴로 이인국의 청을 선선히 들어주었다. 마침내 이인국은 국무성 초청이라는 명목으로, 미국 유학의 길을 손에 넣게 되었다.</p>
          <p>민족의 유산을 팔아서라도 제 영달을 꾀하는 그의 모습에는, 조금의 부끄러움도 없었다. 오히려 그는 뜻을 이루었다는 만족감에 득의양양할 뿐이었다. 그에게 고려청자는 그저 출세를 위한 하나의 수단에 지나지 않았던 것이다. 브라운 씨는 그 고려청자의 아름다움에 연신 감탄을 금치 못하였다. 이인국은 그 모습을 흐뭇하게 바라보며, 제 계획이 척척 들어맞는 것에 회심의 미소를 지었다. 값진 문화재 한 점으로 미국行을 사들인 셈이었다. 나라의 보물보다 제 한 몸의 출세가 먼저인 사람이었다. 민족의 보물도 그의 욕심 앞에서는 한낱 뇌물일 따름이었다.</p>

          <p class="section-title">Part 9. 변신의 처세</p>

          <p>도리어 용왕은 하루가 다르게 쇠약해져, 이제는 숨조차 가쁘게 몰아쉬는 지경에 이르렀다. 수궁 안은 온통 무거운 근심에 휩싸였다. 용왕이 세상을 떠나기라도 하면, 바닷속 나라가 큰 혼란에 빠질 것이 뻔하였기 때문이다. 용왕은 평소 백성을 어질게 다스려 바닷속 모든 생물의 존경을 받아 왔다. 그런 용왕이 시름시름 앓아눕자, 수궁의 물고기들도 저마다 제 일처럼 슬퍼하였다. 신하들은 밤낮으로 용왕의 쾌차를 빌었으나, 온갖 약이 다 소용없으니 그저 발만 동동 구를 뿐이었다. 하루빨리 묘약을 찾지 못하면 정말 큰일이었다. 수궁의 시름은 날로 깊어만 갔다.</p>

          <p class="section-title">Part 2. 토끼 간이 약</p>
          <p>용왕의 병이 끝내 낫지 않자, 수궁에는 무거운 절망이 감돌았다. 바로 그때, 하늘에서 한 도사가 홀연히 내려와 용왕 앞에 나타났다. 도사는 용왕의 맥을 짚어 보고 병의 뿌리를 가만히 살피더니, 이윽고 무겁게 입을 열었다. "용왕의 병은 예사 약으로는 결코 고칠 수 없습니다. 오직 한 가지, 뭍에 사는 토끼의 생간을 구해 드셔야만 비로소 나을 수 있습니다." 그 말에 용왕과 신하들은 모두 귀가 번쩍 뜨였다. 그러나 이내 난감한 기색이 감돌았다. 토끼란 저 멀리 육지의 산속에 사는 짐승이니, 물속 생물들이 어찌 그것을 구해 온단 말인가.</p>
          <p>뭍에 올라가면 숨을 쉴 수조차 없는 수궁의 신하들에게는, 그야말로 막막하기 그지없는 일이었다. 그러나 용왕의 목숨이 걸린 일이었다. 어떻게든 토끼를 산 채로 잡아다, 그 생간을 구해 와야만 하였다. 도사는 그 말만 남기고는, 왔을 때처럼 홀연히 자취를 감추었다. 용왕은 지푸라기라도 잡는 심정으로, 반드시 토끼의 간을 구해 오라 엄히 명하였다. 토끼를 잡아 오는 자에게는 큰 상을 내리겠다는 약속도 잊지 않았다. 용왕은 곧 신하들을 한자리에 불러 모아, 누가 이 막중한 일을 맡을 것인지 의논하게 하였다. 신하들의 얼굴에는 하나같이 수심이 가득하였다.</p>

          <p class="section-title">Part 3. 자라의 자원</p>
          <p>용왕의 명을 받든 신하들이 넓은 수궁 뜰에 빼곡히 모여들었다. 그러나 선뜻 나서는 자가 아무도 없었다. 뭍에 올라 토끼를 잡아 오는 일은, 목숨을 건 위험한 일이었기 때문이다. 내로라하는 큰 물고기들도 저마다 핑계를 대며 슬그머니 꽁무니를 뺐다. "저는 몸집이 너무 커서 뭍에 오르면 금방 들킬 것입니다." "저는 비늘이 번쩍여 눈에 띄기 쉽습니다." 서로 미루며 눈치만 살피는 가운데, 드디어 한 신하가 앞으로 썩 나섰다. 바로 등에 단단한 딱지를 진 자라, 곧 별주부였다.</p>
          <p>"소신이 비록 보잘것없으나, 뭍과 물을 모두 오갈 수 있사옵니다. 제가 기어이 토끼를 잡아 오겠나이다." 자라의 충성스러운 자원에 용왕은 크게 기뻐하였다. 자라는 혹시라도 토끼를 못 알아볼까 하여, 토끼의 생김새를 그린 화상 한 장을 받아 품에 고이 지녔다. 용왕은 그 갸륵한 충성에 자라의 등을 어루만지며 거듭 치하하였다. 다른 신하들은 선뜻 나서지 못한 것을 부끄러워하면서도, 위험한 일을 떠맡은 자라를 못내 안쓰럽게 여겼다. 그러나 자라는 조금도 두려워하는 기색이 없었다. 그러고는 용왕께 하직 인사를 올리고, 머나먼 육지를 향해 기나긴 길을 떠났다. 떠나는 그 뒷모습을 신하들이 숙연히 지켜보았다.</p>

          <p class="section-title">Part 4. 육지로 나선 자라</p>
          <p>자라는 깊은 바닷속에서 헤엄쳐 올라, 마침내 낯선 육지의 뭍에 다다랐다. 평생 물속에서만 살던 자라에게, 뭍의 세상은 온통 신기하고 또 두렵기만 하였다. 느릿느릿 기어서 산으로 오르는 길은 여간 더디고 고된 것이 아니었다. 그래도 자라는 용왕을 살려야 한다는 일념으로, 조금도 포기하지 않고 꾸역꾸역 산을 기어올랐다. 자라는 틈틈이 품에서 토끼 화상을 꺼내어, 지나는 짐승들의 생김새와 견주어 보았다. 그러던 어느 날, 자라는 숲속에서 깡충깡충 뛰노는 한 짐승을 발견하였다. 긴 귀에 짧은 꼬리, 동그란 눈을 가진 그 모습이 화상 속 토끼와 조금도 다르지 않았다. 자라는 속으로 쾌재를 불렀다.</p>
          <p>옳거니, 바로 저놈이 그토록 찾던 토끼로구나 싶었다. 자라는 반가운 마음을 애써 감추고, 천연덕스러운 얼굴로 토끼에게 슬그머니 다가갔다. 뭍의 산짐승들은 처음 보는 자라를 신기한 듯 기웃거렸다. 느릿느릿 기어 다니는 그 모습이 우스웠던 것이다. 그러나 자라는 조금도 아랑곳하지 않고, 오직 토끼를 꾀어낼 궁리에만 온 신경을 쏟았다. 섣불리 덤볐다가는 토끼가 놀라 달아날 것이 뻔하였다. 자라는 우선 토끼의 마음을 사로잡을 말부터 차근차근 궁리하였다. 그 짧은 사이에도 온갖 꾀가 꼬리를 물고 떠올랐다.</p>

          <p class="section-title">Part 5. 토끼를 꾀다</p>
          <p>자라는 토끼에게 공손히 다가가 넙죽 인사를 건넸다. 그러고는 짐짓 딱하다는 듯한 표정으로 말을 꺼냈다. "토 선생, 이 험한 산속에서 늘 쫓기며 사시느라 얼마나 고생이 많으십니까? 독수리와 사냥꾼에 쫓기고, 겨울이면 먹을 것이 없어 굶주리니 그 신세가 참으로 가엾습니다." 토끼가 가만히 들어 보니 과연 틀린 말이 하나도 없었다. 자라는 이때다 싶어, 용궁의 좋은 점을 침이 마르도록 늘어놓기 시작하였다. "우리 수궁에 가시면 사정이 아주 다릅니다. 높은 벼슬을 얻어 떵떵거리며 살 수 있고, 산해진미가 날마다 상에 가득하며, 아름다운 경치 속에서 아무런 걱정 없이 지낼 수 있습니다."</p>
          <p>그 달콤한 말에 토끼의 귀가 솔깃해졌다. 산속의 고달픈 삶에 넌더리가 나 있던 토끼였다. 자라가 거듭 부추기자, 토끼는 마침내 그 꾐에 홀딱 넘어가고 말았다. "그렇다면 나도 그 좋다는 용궁에 한번 가 보겠소." 자라는 토끼가 마음을 바꿀세라, 어서 가자며 거듭 재촉하였다. 토끼는 당장이라도 호강하며 살 생각에 두 눈이 반짝거렸다. 토끼는 눈앞의 부귀영화에 눈이 멀어, 그것이 무서운 함정인 줄은 꿈에도 알지 못하였다. 자라의 입가에는 회심의 미소가 번졌다. 모든 일이 제 뜻대로 되어 가고 있었다.</p>

          <p class="section-title">Part 6. 용궁으로</p>
          <p>토끼가 따라나서기로 하자, 자라는 속으로 뛸 듯이 기뻤다. 그러나 겉으로는 짐짓 태연한 척하며, 토끼를 제 등에 냉큼 업었다. "자, 내 등에 꼭 업히시오. 바닷길은 내가 안전하게 모시겠소." 자라는 토끼를 등에 태운 채, 깊고 푸른 바닷속으로 거침없이 헤엄쳐 들어갔다. 난생처음 바닷속을 구경하는 토끼는, 눈앞에 펼쳐진 신비로운 광경에 그만 넋을 잃었다. 울긋불긋한 산호와 온갖 물고기들이 떼 지어 노니는 모습이 꿈결처럼 황홀하였다. 토끼는 제가 곧 높은 벼슬을 얻어 호강하며 살 생각에, 벌써부터 마음이 들떴다.</p>
          <p>이윽고 자라와 토끼는 으리으리한 수궁에 다다랐다. 번쩍이는 궁궐과 위엄 있게 늘어선 신하들의 모습에, 토끼는 그만 입을 다물지 못하였다. 자라는 곧장 토끼를 데리고 용왕 앞으로 나아갔다. 토끼는 제가 큰 환영을 받는 줄로만 알고, 의기양양하게 궁궐 안으로 들어섰다. 용왕과 신하들은 드디어 토끼가 잡혀 왔다는 소식에 모두 반색하였다. 토끼는 그 떠들썩한 분위기를, 제가 귀한 손님으로 환영받는 것이라 철석같이 믿었다. 어리석게도 토끼는 제 목숨이 경각에 달린 줄도 모른 채 싱글벙글하였다. 그러나 그것은 토끼의 크나큰 착각이었다. 궁궐 깊은 곳에는 끔찍한 운명이 토끼를 기다리고 있었다.</p>

          <p class="section-title">Part 7. 간을 내놓아라</p>
          <p>용왕 앞에 이른 토끼는, 그제야 무언가 심상치 않은 분위기를 느꼈다. 자신을 바라보는 용왕과 신하들의 눈빛이, 반가움이 아니라 어딘가 섬뜩하였던 것이다. 이윽고 용왕이 무겁게 입을 열었다. "토끼야, 네 간이 과인의 병을 고칠 약이라 하니, 미안하나 네 간을 내어 주어야겠다." 그 말에 토끼는 눈앞이 캄캄해졌다. 높은 벼슬은커녕, 애초에 제 간을 빼앗아 용왕의 약으로 쓰려고 자신을 꾀어 온 것이었다. 자라가 늘어놓던 그 달콤한 말이 모두 새빨간 거짓이었음을, 토끼는 그제야 뼈저리게 깨달았다. 용왕의 명이 떨어지자, 신하들이 당장 토끼의 배를 가르려고 시퍼런 칼을 들고 우르르 다가섰다.</p>
          <p>토끼는 등골이 오싹하고 다리가 후들후들 떨렸다. 이대로 가만히 있다가는 꼼짝없이 배가 갈려 죽을 판이었다. 그러나 토끼는 본디 영리하기 짝이 없는 짐승이었다. 토끼는 이제 꼼짝없이 죽었구나 싶어 눈앞이 아뜩하였다. 그러나 여기서 넋을 놓고 있을 수는 없었다. 당황한 기색을 보였다가는 그대로 끝장이었다. 토끼는 가까스로 정신을 가다듬고, 짐짓 여유로운 표정을 지으며 이 절체절명의 위기를 벗어날 꾀를 번개같이 머릿속으로 굴리기 시작하였다. 이제 살길은 오직 꾀 하나뿐이었다.</p>

          <p class="section-title">Part 8. 토끼의 꾀</p>
          <p>토끼는 짐짓 아무렇지 않은 척, 도리어 껄껄 큰 소리로 웃음을 터뜨렸다. 용왕과 신하들이 어리둥절하여 토끼를 멀거니 쳐다보았다. 토끼는 짐짓 안타깝다는 듯 혀를 차며 말하였다. "저런, 참으로 딱하게 되었습니다. 진작 말씀하실 것이지요. 실은 저희 토끼들은 간을 몸속에 넣고 다니지 않습니다. 워낙 귀한 것이라, 깨끗한 바위에 꺼내어 볕에 잘 말려 두고 다니지요. 하필이면 오늘도 간을 산속 바위에 널어 두고 그냥 왔으니, 이 일을 어쩝니까." 그러고는 제 배를 툭툭 두드리며 말을 이었다.</p>
          <p>"정 못 믿으시겠거든 지금 당장 제 배를 갈라 보십시오. 간이 없으면 저만 공연히 죽고 용왕의 병도 못 고치니, 서로 낭패가 아니겠습니까?" 토끼의 말이 어찌나 천연덕스럽고 그럴듯하던지, 용왕과 신하들은 그만 감쪽같이 속아 넘어가고 말았다. 어리석은 용왕은 토끼의 말을 조금도 의심하지 않았다. 만일 토끼가 조금이라도 당황하는 기색을 보였다면, 용왕은 그 말을 믿지 않았을 것이다. 그러나 토끼가 어찌나 태연하던지, 그 누구도 거짓이라고는 꿈에도 생각지 못하였다. 도리어 토끼를 극진히 대접하며, 어서 그 간을 가져오라고 신신당부하기까지 하였다. 참으로 어처구니없는 노릇이었다.</p>

          <p class="section-title">Part 9. 다시 육지로</p>
          <p>용왕은 자라를 다시 불러, 토끼를 모시고 뭍에 올라가 간을 가져오라 명하였다. 애써 잡아 온 토끼를 도로 뭍으로 데려가야 한다니, 자라는 어쩐지 마음 한구석이 꺼림칙하였다. 그러나 용왕의 명이 지엄하니 거스를 도리가 없었다. 자라는 다시 토끼를 제 등에 업고, 왔던 바닷길을 되짚어 육지로 향하였다. 토끼는 자라의 등에 업힌 채, 속으로 쾌재를 부르며 터져 나오려는 웃음을 간신히 꾹 참았다. 이제 뭍에만 닿으면 그대로 줄행랑을 칠 참이었다. 바닷길을 건너는 동안, 토끼는 짐짓 아무것도 모르는 척 태연한 표정을 지었다. 혹시라도 자라가 눈치를 챌까 조심한 것이다.</p>
          <p>자라는 그런 토끼의 속도 까맣게 모른 채, 어서 간을 가져다 용왕의 병을 고칠 생각에만 골몰하였다. 이윽고 저 멀리 푸른 산과 뭍이 눈앞에 보이기 시작하였다. 토끼의 가슴은 이제 살았다는 기쁨에 콩닥콩닥 뛰었다. 자라가 토끼에게 몇 번이고 간을 꼭 챙겨 오라 당부하자, 토끼는 걱정 말라며 짐짓 의젓하게 대답하였다. 속으로는 자라의 어리숙함을 비웃으면서도, 겉으로는 더없이 공손한 척하였다. 뭍에 닿는 순간만을, 토끼는 애타게 손꼽아 기다렸다. 바다 끝에 뭍이 가까워질수록 그 마음은 더욱더 조급해졌다.</p>

          <p>그러나 허생은 기뻐하기는커녕 도리어 길게 탄식하였다. "겨우 만 냥으로 온 나라의 과일을 마음대로 좌지우지할 수 있다니, 이 나라 경제의 밑천이 그만큼 보잘것없다는 뜻이로구나." 제사와 잔치에 과일을 빠뜨릴 수 없는 양반가에서는, 값이 아무리 올라도 울며 겨자 먹기로 과일을 사들여야 했다. 허생은 그 틈을 놓치지 않고 큰 이문을 남겼다. 허생이 애초에 노린 것은 돈이 아니라, 바로 그 사실을 세상에 똑똑히 보이는 것이었다. 그 한탄 속에는 조선 경제에 대한 날카로운 통찰이 담겨 있었다.</p>

          <p class="section-title">Part 5. 제주 말총 매점과 한탄</p>
          <p>과일 장사로 큰돈을 쥔 허생은, 이번에는 바다를 건너 제주도로 들어갔다. 그러고는 제주에서 나는 말총을 닥치는 대로 사들이기 시작하였다. 말총이란 말의 갈기와 꼬리털로, 당시 양반들이 머리에 두르는 망건과 갓을 만드는 데 꼭 필요한 재료였다. 허생이 제주의 말총을 모조리 쓸어 담자, 이번에도 똑같은 일이 벌어졌다. 머지않아 온 나라에 망건 만들 재료가 동이 나, 망건값이 열 배로 껑충 뛰어오른 것이다. 허생은 또다시 손쉽게 큰 이문을 남겼다. 그러나 허생의 마음은 오히려 더욱 무거워졌다. 고작 한 사람이 푼돈을 들여 물건을 매점한 것만으로, 온 나라의 물가가 요동치고 백성들이 큰 곤란을 겪으니 말이다.</p>

          <p class="section-title">Part 6. 빈 섬과 도적떼</p>
          <p>그 무렵 나라 곳곳에서는 먹고살 길이 막막해진 백성들이 도적이 되어 떠돌고 있었다. 변산 일대에는 그런 도적 떼가 수천 명이나 우글거렸다. 관가에서도 좀처럼 그들을 잡지 못해 골머리를 앓았다. 이 소문을 들은 허생은 조금도 두려워하는 기색 없이 홀로 도적의 소굴로 찾아 들어갔다. 그러고는 도적의 우두머리를 만나, 그들이 도적이 될 수밖에 없었던 딱한 처지를 헤아려 주었다. "너희가 장가를 들고 땅을 일구며 살고 싶어도, 돈이 없고 땅이 없어 이 지경에 이른 것이 아니냐."</p>

          <p class="section-title">Part 7. 재물을 덜어 내다</p>
          <p>섬의 땅은 기름지고 물산이 넉넉하여, 애써 가꾼 농사는 해마다 풍년이 들었다. 사람들은 부지런히 일하여 먹고도 남을 만큼 넉넉히 곡식을 거두었다. 허생은 남아도는 곡식을 이웃 나라인 일본의 어느 섬에 내다 팔아, 은 백만 냥이라는 어마어마한 재물을 벌어들였다. 그러나 허생은 그 많은 돈을 보고도 조금도 기뻐하지 않았다. 도리어 그는 "이 작은 섬에 이토록 많은 재물을 쌓아 두면 도리어 화가 될 뿐이다"라고 하였다. 그러고는 은 오십만 냥을 조금의 아까움도 없이 바닷속에 던져 버렸다.</p>
          <p>또한 허생은 섬을 떠나기에 앞서, 글을 아는 자들을 모조리 배에 태워 함께 섬 밖으로 데리고 나왔다. 뒷날 그들이 공연히 분란의 씨앗이 될까를 염려한 까닭이었다. 허생은 섬에 남은 사람들에게, 부디 글과 다툼을 멀리하고 순박하게 살아가라 거듭 당부하였다. 허생은 재물이란 넘치면 오히려 사람을 망치는 법임을 잘 알고 있었다. 또한 그는 그 섬을 다스리는 임금 노릇에도 조금도 미련을 두지 않았다. 애초에 그가 바란 것은 재물이나 권세가 결코 아니었다. 그렇게 자급자족하는 새 세상을 섬에 남겨 둔 채, 허생은 더없이 홀가분한 걸음으로 조용히 뭍으로 돌아왔다. 그 걸음에는 큰일을 마친 자의 담담함이 어려 있었다.</p>

          <p>심 봉사는 앞이 보이지 않아도 어린 딸을 품에 안고, 세상을 다 가진 듯 행복해하였다. 가난한 살림이었으나 그 집안에는 웃음이 끊이지 않았다. 심 봉사는 딸의 얼굴을 비록 볼 수는 없었으나, 작은 손을 매만지고 숨소리를 들으며 그 모습을 마음에 그렸다. 곽씨 부인은 밤새 아이를 품고도 고단한 줄을 몰랐다. 가난하여 변변히 해 줄 것은 없었으나, 두 사람의 사랑만은 그 무엇보다 넉넉하였다. 부부는 이 어린 딸이 무탈하게만 자라 주기를 밤낮으로 바랐다. 그것이 가난한 두 사람의 하나뿐인 소원이었다.</p>

          <p class="section-title">Part 2. 곽씨 부인의 죽음</p>
          <p>그러나 그 행복은 오래가지 못하였다. 심청을 낳은 곽씨 부인이 산후의 몸을 끝내 추스르지 못하고, 그만 자리에 눕고 만 것이다. 변변한 약 한 첩 쓰지 못하는 가난 속에서 부인의 병세는 날로 깊어만 갔다. 곽씨 부인은 눈먼 남편과 갓난 딸을 두고 차마 눈을 감지 못하였다. "이 어린것을 두고 제가 먼저 가다니…. 부디 몸 성히 청이를 길러 주십시오." 부인은 애끊는 유언을 남기고, 심청을 낳은 지 이레 만에 끝내 세상을 떠나고 말았다. 심 봉사는 하늘이 무너지는 듯한 슬픔에 몸부림치며 통곡하였다. 그러나 슬퍼만 하고 있을 수는 없었다.</p>
          <p>당장 젖먹이 딸을 먹여 살려야 했던 것이다. 심 봉사는 어린 심청을 품에 안고, 동네 아낙들을 일일이 찾아다니며 젖동냥을 하였다. "이 아이 젖 좀 물려 주시오." 눈먼 아비의 애처로운 사정에, 마을 여인들은 너도나도 선뜻 젖을 물려 주었다. 젖동냥으로도 모자란 날이면, 심 봉사는 미음을 쑤어 어린것의 입에 떠 넣어 주었다. 한밤중 아이가 보채며 울면, 눈먼 아비는 서툰 손길로 등을 토닥이며 밤을 지새웠다. 아내를 잃은 슬픔을 속으로 삼킨 채, 심 봉사는 오직 딸 하나를 바라보며 모진 세월을 견뎌 냈다. 그렇게 심청은 온 동네의 젖을 먹고 자라났다. 참으로 모질고도 애틋한 세월이었다.</p>

          <p class="section-title">Part 3. 효녀로 자란 심청</p>
          <p>심 봉사의 그런 정성 속에서, 심청은 큰 탈 없이 무럭무럭 자라났다. 심청은 예닐곱 살 무렵부터 벌써 철이 들어, 눈먼 아버지의 손발이 되어 드렸다. 열 살을 넘기면서부터는 동냥과 품팔이를 조금도 마다하지 않고, 손수 아버지를 봉양하기 시작하였다. 추운 날이면 제 몸으로 아버지의 언 손을 녹여 드리고, 끼니때면 따뜻한 밥을 먼저 아버지께 올렸다. 동네 사람들은 그 지극한 효성을 보고 저마다 입을 모아 칭찬하였다. "저런 효녀가 세상에 또 어디 있겠나." 심청은 비록 어린 나이에 고생이 막심하였으나, 아버지를 모실 수 있다는 것만으로도 조금도 힘든 내색을 하지 않았다.</p>
          <p>심 봉사 또한 그런 기특한 딸을 더없이 아끼고 자랑스러워하였다. 부녀는 비록 가난하였으나, 서로를 의지하며 오순도순 살아갔다. 심청의 곱고 착한 마음씨는 나이를 먹을수록 더욱 깊어만 갔다. 이웃의 궂은일을 도와주고 삯을 받아 오면, 심청은 제 입에 드는 것보다 아버지의 끼니를 먼저 챙겼다. 맛난 것이 생기면 저는 굶을지언정 아버지께 올렸고, 험한 일도 아버지가 알까 봐 내색하지 않았다. 그 효성에 하늘도 무심치 않으리라고 동네 사람들은 입을 모았다. 어느새 심청은 효성이 지극한 아리따운 처녀로 자라 있었다.</p>

          <p class="section-title">Part 4. 공양미 삼백 석</p>
          <p>그러던 어느 날, 심청이 늦도록 돌아오지 않자 심 봉사는 딸을 마중하러 길을 나섰다. 그러나 앞을 보지 못하는 터라, 그만 발을 헛디뎌 개울에 풍덩 빠지고 말았다. 허우적대며 꼼짝없이 물에 빠져 죽을 뻔한 순간, 마침 지나던 몽은사의 화주승이 그를 발견하고 건져 주었다. 화주승은 물에 빠진 까닭을 듣고는, 솔깃한 말을 꺼냈다. "부처님께 공양미 삼백 석을 바치고 지성으로 불공을 드리면, 반드시 눈을 떠 앞을 보게 될 것이오." 평생 앞 못 보는 것이 한이던 심 봉사는, 그 말에 앞뒤 가릴 것도 없이 덜컥 삼백 석을 시주하겠노라 약속해 버렸다.</p>
          <p>그러나 집으로 돌아와 가만히 생각하니, 끼니조차 잇기 어려운 형편에 공양미 삼백 석이란 그야말로 하늘의 별 따기였다. 심 봉사는 공연한 약속을 한 것을 땅을 치며 후회하였다. 그러나 이미 부처님께 바치기로 한 약속을 어길 수도 없어 더욱 애가 탔다. 밥도 넘기지 못하고 긴 한숨만 내쉬는 아버지를, 심청은 애가 타서 곁에서 지켜보았다. 무슨 큰 걱정이 있는 것이 틀림없었다. 근심에 싸여 끙끙 앓는 아버지를 보고, 심청은 그 까닭을 조심스레 캐묻기 시작하였다. 아버지는 한사코 괜찮다며 손사래를 쳤으나, 딸의 거듭된 물음에 끝내 속사정을 털어놓고 말았다.</p>

          <p class="section-title">Part 5. 몸을 팔다</p>
          <p>마침내 아버지에게서 공양미 삼백 석 이야기를 들은 심청은, 깊은 시름에 잠겼다. 어떻게든 그 삼백 석을 마련해 아버지의 눈을 뜨게 해 드리고 싶었다. 그러던 차에 심청은, 남경 상인들이 인당수를 지날 때 제물로 바칠 처녀를 사려 한다는 소문을 듣게 되었다. 거친 뱃길의 안전을 빌기 위해 처녀를 산 제물로 바친다는 것이었다. 심청은 조금도 망설이지 않았다. 제 한 몸을 바쳐 아버지가 눈을 뜰 수만 있다면, 그보다 더한 일이라도 마다하지 않을 것 같았다. 심청은 상인들을 찾아가, 공양미 삼백 석을 받는 대신 기꺼이 제물이 되겠노라 선뜻 제 몸을 팔았다.</p>
          <p>상인들은 심청의 갸륵한 효심에 감탄하면서도, 약속대로 몽은사에 공양미 삼백 석을 올려 주었다. 그리고 심청이 떠나야 할 날을 정하였다. 심청은 이 모든 사실을 아버지에게는 차마 밝히지 못한 채, 홀로 남겨질 아버지를 생각하며 남몰래 눈물을 삼켰다. 아버지 곁을 떠난다는 생각에 가슴이 미어졌으나, 심청은 겉으로는 애써 태연한 척하였다. 아버지가 눈을 떠 밝은 세상을 보게 될 것을 떠올리면, 그 두려움도 조금은 견딜 만하였다. 남은 며칠을 심청은 더욱 정성껏 아버지를 봉양하며 보냈다. 그 며칠이 아버지와 함께할 마지막 시간이었다.</p>

          <p class="section-title">Part 6. 아버지와의 이별</p>
          <p>어느덧 심청이 상인들을 따라 떠나야 할 날이 밝았다. 심청은 마지막으로 아버지의 밥상을 정성껏 차려 올렸다. 그러고는 더 이상 숨길 수 없어, 그간의 사정을 눈물로 아뢰었다. 자신이 공양미 삼백 석에 몸을 팔아 오늘 인당수로 떠난다는 말을 들은 심 봉사는, 그만 넋을 잃고 말았다. "아니, 이게 대체 무슨 소리냐! 눈을 뜬들 무엇 하겠느냐, 네가 없으면 내가 어찌 산단 말이냐! 차라리 나를 데려가거라!" 심 봉사는 딸을 붙들고 땅을 치며 통곡하였다. 그러나 이미 공양미는 절에 올려졌고, 떠나야 할 날은 돌이킬 수 없었다.</p>
          <p>심청은 오열하는 아버지를 끌어안고, 눈물로 마지막 당부를 올렸다. "아버지, 부디 몸 성히 지내시어 밝은 눈을 얻으소서. 불효한 소녀는 먼저 갑니다." 차마 떨어지지 않는 발걸음을, 심청은 모질게 돌려 상인들을 따라나섰다. 심청은 몇 번이고 뒤를 돌아보며 아버지의 모습을 눈에 담았다. 이승에서 다시는 뵙지 못할 아버지였다. 멀어지는 딸의 뒷모습에 심 봉사는 하염없이 땅을 치며 울었고, 온 동네 사람들도 그 애절한 이별에 함께 눈물을 흘렸다. 배에 오른 심청은 멀어지는 고향 땅을 바라보며, 아버지의 눈이 꼭 뜨이기를 속으로 빌고 또 빌었다. 그 간절한 기도만이 거친 바다 위로 하염없이 흩어졌다.</p>

          <p class="section-title">Part 7. 인당수 투신</p>
          <p>심청을 실은 배는 거친 바다를 가르며 마침내 인당수에 이르렀다. 인당수는 예부터 물살이 사납고 풍랑이 거세기로 이름난 험한 바다였다. 뱃사람들은 제단을 차리고 정성껏 고사를 지낸 뒤, 심청에게 물에 들 것을 청하였다. 심청은 뱃머리에 올라 서쪽 하늘을 향해 두 손을 모으고 간절히 빌었다. "하느님, 부디 이 몸을 받으시고, 그 대신 눈먼 제 아버지의 눈을 밝게 열어 주옵소서." 심청은 아버지를 마지막으로 소리 내어 부르고는, 치마를 뒤집어쓴 채 성난 물결 속으로 몸을 던졌다. 거센 파도가 삽시간에 심청을 집어삼켜 버렸다.</p>
          <p>다시 잔잔히 가라앉는 바다를 바라보며, 뱃사람들은 그 갸륵한 효심에 저마다 눈물을 뿌렸다. 꽃다운 나이에 아버지를 위해 선뜻 목숨을 바친 심청의 효성은, 하늘과 바다를 모두 감동시키기에 조금도 모자람이 없었다. 하늘도 그 지극한 효심을 차마 저버리지 못하였던 것이다. 뱃사람들은 심청의 넋을 위로하며 한동안 그 자리를 떠나지 못하였다. 신기하게도, 심청이 몸을 던지자 그토록 사납던 풍랑이 거짓말처럼 잦아들고 바다가 이내 잔잔해졌다. 상인들은 무사히 뱃길을 갈 수 있게 되었으나, 그 마음만은 끝내 무겁기만 하였다. 그러나 심청의 이야기는 결코 그것으로 끝이 아니었다. 바닷속에서는 뜻밖의 일이 심청을 기다리고 있었다.</p>

          <p class="section-title">Part 8. 용궁과 환생</p>
          <p>심청이 가라앉은 곳은 다름 아닌 용왕이 다스리는 바닷속 용궁이었다. 하늘과 바다를 감동시킨 심청의 지극한 효성은, 이미 용왕의 귀에까지 전해져 있었다. 용왕은 선녀들을 보내어, 물에 든 심청을 극진히 받들어 모시게 하였다. 심청은 용궁에서 더없이 융숭한 대접을 받으며 한동안 머물렀다. 얼마 뒤, 용왕은 이토록 효성 지극한 사람을 바닷속에만 둘 수는 없다고 여겼다. 용왕은 심청을 한 송이 커다란 연꽃 속에 고이 태워, 다시 세상의 바다 위로 돌려보냈다. 심청을 품은 연꽃은 둥실둥실 떠올라, 인당수의 푸른 물결 위를 홀로 떠다녔다. 마침 그곳을 다시 지나던, 전날 심청을 제물로 샀던 남경 상인들이 그 신기한 연꽃을 발견하였다.</p>
          <p>사람 하나가 들어앉을 만큼 커다란 연꽃이 물 위에 두둥실 떠 있으니, 결코 예삿일이 아니라 여겼다. 상인들은 그 연꽃을 조심조심 고이 건져 올렸다. 상인들은 전에 제물로 바친 처녀를 문득 떠올리며 알 수 없는 숙연함에 잠겼다. 이토록 크고 고운 연꽃은 난생처음 보는 것이었다. 그들은 이것이 결코 예사 꽃이 아님을 직감하였다. 꽃에서는 은은한 향기가 그윽이 풍겨 나왔다. 연꽃을 실은 뱃전에는 상서로운 기운마저 감도는 듯하였다. 상인들은 그 꽃을 고이 모셔 서둘러 뱃머리를 돌렸다.</p>

          <p class="section-title">Part 9. 황후가 된 심청</p>
          <p>상인들은 그 신비로운 연꽃을 임금께 바치는 것이 마땅하다 여겨, 대궐로 소중히 가지고 올라갔다. 때마침 임금은 황후를 잃고 홀로 쓸쓸히 지내던 터였다. 임금이 그 연꽃을 가까이 두고 보니, 어느 날 꽃송이가 스르르 벌어지며 그 속에서 아리따운 처녀가 걸어 나오는 것이 아닌가. 바로 심청이었다. 임금은 그 고운 자태와 갸륵한 사연에 크게 감복하여, 마침내 심청을 황후로 맞아들였다. 하루아침에 황후가 된 심청이었으나, 그 마음속에는 오직 한 가지 근심뿐이었다. 바로 홀로 두고 온 눈먼 아버지였다. 아버지가 과연 눈을 떴는지, 살아 계시기나 한지 알 길이 없어 밤낮으로 애가 탔다.</p>

          <p class="section-title">Part 8. 옥중 상봉</p>
          <p>거지 행색의 몽룡은 먼저 춘향의 집을 찾아, 애타게 사위를 기다리던 월매와 마주하였다. 월매는 거지가 되어 돌아온 몽룡을 보고 그만 크게 낙심하였으나, 몽룡은 조금도 내색 없이 춘향이 갇힌 옥으로 향하였다. 옥방에서 몽룡을 마주한 춘향은, 그토록 그리던 지아비가 비렁뱅이 꼴이 되어 나타난 것을 보고 한순간 가슴이 무너졌다. 그러나 춘향은 조금도 몽룡을 원망하거나 변심하지 않았다. 도리어 춘향은 몽룡의 앞날을 걱정하며, 자신이 죽거든 부디 잘 거두어 달라고 애틋하게 당부하였다. "서방님이 비록 이리 되셨어도, 소녀의 지아비는 오직 서방님 한 분뿐입니다. 내일 사또의 생일잔치가 끝나면 소녀는 죽은 목숨이나, 그래도 결코 두 마음은 품지 않겠습니다."</p>

          <p>부자는 곧장 양반의 집을 찾아갔다. 그러고는 자기가 그 천 석의 빚을 대신 갚아 줄 터이니, 그 대신 양반 신분을 자기에게 넘겨 달라고 제안하였다. 부자는 비록 배운 것은 없어도, 세상 돌아가는 이치를 꿰뚫어 보는 눈만은 밝은 사람이었다. 돈으로 그토록 바라던 신분까지 살 수 있다면, 그까짓 천 석쯤은 조금도 아깝지 않다고 여겼다. 부자는 조금도 망설이지 않고 자신의 뜻을 거듭 밝혔다. 양반에게는 뜻밖의, 그러나 더없이 솔깃한 제안이었다. 참으로 대담한 발상이 아닐 수 없었다.</p>

          <p class="section-title">Part 5. 거래 성립</p>
          <p>빚에 짓눌려 옥에 갇힐 날만 기다리던 양반에게, 부자의 제안은 그야말로 가뭄의 단비와도 같았다. 양반은 두말없이 그 제안을 덥석 받아들였다. 부자는 약속대로 관가로 달려가, 양반이 진 환곡 천 석을 한꺼번에 모두 갚아 주었다. 산더미처럼 쌓였던 빚이 한순간에 깨끗이 사라졌다. 양반은 옥에 갇힐 신세를 면하였고, 부자는 그토록 바라던 양반 신분을 손에 넣게 되었다. 두 사람 모두 제 뜻을 이룬 셈이었다. 양반은 부자에게 거듭 고마움을 전하며, 이제부터 양반 노릇은 그대가 하라고 하였다. 부자는 꿈에도 그리던 양반이 되었다는 생각에 가슴이 벅차올랐다.</p>
          <p>이제 자기도 떳떳이 고개를 들고, 남들에게 존경받으며 살 수 있게 되었다고 굳게 믿었다. 부자는 당장이라도 번듯한 의관을 갖추어 입고 마을을 활보하고 싶은 마음뿐이었다. 이제 누구도 자기를 함부로 대하지 못하리라 생각하니 절로 어깨가 으쓱해졌다. 관가에서도 밀린 환곡을 한꺼번에 받게 되었으니 더없이 반가운 일이었다. 그러나 양반이 된다는 것이 과연 무엇을 뜻하는지, 부자는 아직 아무것도 알지 못하였다. 기쁨에 들뜬 그의 앞에 어떤 굴레가 기다리는지도 알 턱이 없었다. 그렇게 신분이 뒤바뀌는 기이한 거래가 성사된 것이다.</p>

          <p class="section-title">Part 6. 군수의 증서</p>
          <p>그런데 이 소식이 곧 정선 군수의 귀에까지 들어갔다. 군수는 가난한 양반이 그 많은 환곡을 다 갚았다는 말에 놀라, 그 까닭을 알아보러 몸소 양반의 집을 찾았다. 자초지종을 들은 군수는 고개를 끄덕이면서도 한 가지를 깊이 염려하였다. "신분을 사고판 일을 이렇게 말로만 두었다가는, 훗날 반드시 서로 발뺌을 하며 송사가 벌어질 것이다. 그러니 이 일을 문서로 또렷이 밝혀 두는 것이 좋겠다." 군수는 고을 사람들을 한자리에 불러 모아 증인으로 세우고, 양반 매매를 공식으로 증명하는 증서를 만들어 주기로 하였다. 부자는 이제 관가에서 번듯한 문서까지 만들어 준다 하니, 더없이 든든하고 기뻤다.</p>
          <p>이윽고 군수가 붓을 들어 증서를 써 내려가기 시작하였다. 과연 그 증서에는 양반이란 어떤 존재인지가 낱낱이 적히게 될 터였다. 군수는 붓과 먹을 가져오게 하고 두루마리를 넓게 펼쳤다. 둘러선 고을 사람들도 저마다 숨을 죽인 채 그 광경을 지켜보았다. 양반 신분을 사고파는 일이 대체 어떻게 문서로 남을지, 모두가 자못 궁금해하는 눈치였다. 둘러선 사람들 사이에서는 나직한 수군거림이 끊이지 않았다. 부자는 설레는 마음으로 그 앞에 공손히 꿇어앉아 귀를 기울였다. 모두의 시선이 군수의 붓끝으로 쏠렸다.</p>

          <p class="section-title">Part 7. 첫 번째 증서 — 양반의 의무</p>
          <p>군수가 써 내려간 첫 번째 증서에는, 양반이 지켜야 할 온갖 까다로운 법도가 빼곡히 적혀 있었다. 그 내용은 가히 숨이 막힐 지경이었다. 양반은 새벽 네 시만 되면 어김없이 일어나 등불을 켜고 꿇어앉아야 한다. 눈은 코끝을 가만히 내려다보고, 두 발꿈치는 가지런히 모아야 한다. 아무리 춥고 배가 고파도 결코 내색해서는 안 되며, 추워도 곁불을 쬐어서는 안 된다. 밥을 먹을 때에도 맨상투 바람으로 먹어서는 안 되고, 국을 먼저 훌훌 들이켜서도 안 된다. 말을 할 때에는 언제나 느릿느릿 점잖게 하며, 아무리 급해도 종종걸음을 쳐서는 안 된다.</p>
          <p>손에 돈을 직접 쥐어서도 안 되고, 쌀값이 얼마냐 묻는 것조차 체면을 깎는 일이라 하였다. 또한 날이 아무리 더워도 버선을 벗어서는 안 되고, 걸음은 항상 의젓하게 떼어야 한다. 병이 나도 무당을 불러 굿을 해서는 안 되며, 아무리 화가 나도 아내를 때리거나 그릇을 깨뜨려서는 안 된다고 하였다. 더위에 손부채질을 하여서도 안 되고, 이가 쑤셔도 끙끙 소리 내어 앓아서는 안 된다 하였다. 이렇듯 양반이 지켜야 할 법도는 끝도 없이 줄줄이 이어졌다. 하나같이 번거롭고 고통스럽기 짝이 없는 것들뿐이었다. 부자는 듣기만 하여도 벌써 숨이 턱턱 막히는 듯하였다.</p>

          <p class="section-title">Part 8. 부자의 불만</p>
          <p>군수가 그 긴 증서를 다 읽어 내려가자, 곁에서 잠자코 듣고 있던 부자의 얼굴이 점점 일그러졌다. 양반이 되기만 하면 떵떵거리며 편히 살 줄 알았는데, 증서에 적힌 것은 온통 고달프고 까다로운 규범뿐이었던 것이다. 새벽부터 일어나 꿇어앉아야 하고, 추워도 불을 못 쬐고, 배고파도 꾹 참아야 하다니. 부자는 그만 기가 턱 막혔다. "아니, 이게 다 무엇이란 말이오? 나는 양반이 좋다기에 큰돈을 들여 산 것인데, 이대로라면 손해만 잔뜩 보는 꼴이 아니오. 제발 좀 이롭게, 내게 득이 되도록 고쳐 주시오!" 부자는 답답한 마음에 군수에게 사정하였다.</p>
          <p>양반 노릇이 이토록 불편하고 괴로운 것일 줄은 미처 몰랐던 터였다. 부자는 양반이란 그저 떵떵거리며 남을 부리고 사는 자리인 줄로만 알았다. 그런데 막상 그 속을 들여다보니, 온종일 체면을 차리느라 제 몸 하나 편히 두지 못하는 고역이 아닌가. 차라리 상민으로 지내던 때가 훨씬 속 편하였다는 생각마저 들 지경이었다. 부자의 얼굴에는 낭패한 기색이 역력하였다. 군수는 알겠다는 듯 고개를 끄덕이더니, 그러면 다시 증서를 고쳐 써 주겠노라 하였다. 그러고는 곧 또 한 장의 새로운 증서를 쓰기 시작하였다. 기대가 컸던 만큼 부자의 실망도 그만큼 깊었다.</p>

          <p class="section-title">Part 9. 두 번째 증서 — 양반의 특권</p>
          <p>군수가 다시 써 내려간 두 번째 증서에는, 이번에는 양반이 누릴 수 있는 온갖 특권이 적혀 있었다. 그러나 그 특권이라는 것은 하나같이 상민을 함부로 짓밟는 횡포에 지나지 않았다. 양반은 농사를 짓지 않아도 되고, 글만 조금 읽으면 과거에 급제해 벼슬을 얻을 수 있다. 이웃집 소가 있으면 끌어다가 제 밭을 먼저 갈게 하고, 마을 사람을 불러다 제 논의 김을 매게 하여도 누구 하나 감히 거역하지 못한다. 상민이 양반에게 밉보이기라도 하면, 그 코에 잿물을 들이붓고 상투를 잡아 휘두르며 수염을 잡아 뽑아도 아무런 탈이 없다. 뿐만 아니라 궁할 때면 이웃의 재물을 꾸어다 써도 되고, 마을의 일꾼을 거저 부려도 누가 감히 뭐라 하지 못한다.</p>
          <p>상민을 잡아다 제집 일을 시키고도 삯 한 푼 주지 않아도 그만이었다. 법도 체면도 모두 양반의 편이었으니, 힘없는 백성만 억울할 따름이었다. 증서가 길어질수록 그 횡포의 가짓수도 끝없이 늘어만 갔다. 이렇듯 두 번째 증서는, 양반이 아무런 벌도 받지 않고 상민을 제 마음대로 부리고 괴롭힐 수 있다는 내용으로 가득하였다. 양반의 권세란 곧 힘없는 백성을 짓누르는 횡포와 다름없음을, 군수는 그 증서에 낱낱이 드러내 보인 것이었다. 듣는 이의 낯이 다 화끈거릴 지경이었다.</p>

          <p class="section-title">Part 10. 부자의 도망</p>
          <p>두 번째 증서의 내용을 끝까지 듣고 난 부자는, 그만 기가 질려 혀를 내둘렀다. 양반의 의무는 고달프기 짝이 없더니, 양반의 특권이라는 것은 또 한결같이 남을 등쳐 먹는 도둑질이나 다름없었던 것이다. 그것은 선비의 체면이 아니라 차라리 도적의 행실에 가까웠다. 부자는 질겁하여 손사래를 치며 외쳤다. "그만두시오, 그만둬! 참으로 맹랑하기 짝이 없구려. 당신들은 지금 나를 장차 도둑놈으로 만들 작정이란 말이오?"</p>
          <p>부자는 더 들을 것도 없다는 듯 머리를 절레절레 흔들며 그 자리에서 벌떡 일어났다. 그러고는 뒤도 돌아보지 않고 부리나케 달아나 버렸다. 그날 이후로 부자는 죽을 때까지 두 번 다시 '양반'이라는 말을 입에 담지 않았다. 애써 큰돈을 치르고 사려 했던 양반이, 겉으로는 번드르르하나 그 속은 허례와 횡포로 가득 찬 허울뿐임을 똑똑히 깨달은 까닭이었다. 부자가 꽁지 빠지게 달아나는 뒷모습을 보며, 둘러섰던 고을 사람들은 저마다 어이없다는 듯 혀를 찼다. 그토록 떠받들던 양반이 알고 보니 그런 것이었다니, 다들 기가 막힐 노릇이었다. 번듯한 이름 뒤에 감추어진 양반 사회의 민낯이 이 한바탕 소동으로 낱낱이 드러난 셈이었다. 연암이 이 한 편의 이야기에 담고자 한 뜻이 바로 거기에 있었다.</p>

          <p>그런데 요즘 들어 점순이가 부쩍 나를 못살게 굴기 시작했다. 까닭을 도무지 알 수가 없었다. 나는 그저 농사일이며 나무하는 일에만 매달렸을 뿐, 계집애의 속마음 같은 걸 헤아릴 줄은 깜깜 몰랐다. 어른들은 계집애가 사내를 괴롭히는 데에는 다 속뜻이 있다고들 했지만, 나는 그런 말을 들어도 영 알아듣지 못했다. 점순이가 나를 볼 때마다 눈을 반짝이며 쫓아다니는 것이, 나는 그저 심술로만 여겨졌다. 오늘도 점순이는 울타리 너머에서 나를 빤히 쳐다보고 있었다. 나는 괜히 뒤통수가 따가워 자꾸만 몸을 틀었다.</p>

          <p class="section-title">Part 2. 감자 세 개</p>
          <p>그날도 나는 울타리를 엮느라 바빴다. 그때 점순이가 사방을 두리번거리며 살금살금 다가오더니, 제 치마 속에서 무언가를 불쑥 꺼내 내밀었다. 노릇노릇 알맞게 구운 굵은 감자 세 개였다. "느 집엔 이거 없지?" 점순이는 생색을 내듯 말하며, 어서 받아먹으라고 자꾸 눈짓을 했다. 그것은 제가 먹다 남은 것도 아니요, 나 먹으라고 일부러 구워 온 것이 분명했다. 그러나 나는 그 속을 알 리 없었다. 나는 순간 자존심이 울컥 상했다. 제까짓 게 마름집 딸이라고 나를 업신여기는 것만 같았던 것이다. 나는 돌아보지도 않은 채 "</p>
          <p>안 먹는다. 우리 집엔 감자 많다." 하고는 어깨 너머로 그 손을 탁 밀어 버렸다. 그러자 점순이의 얼굴이 금세 홍당무처럼 새빨개졌다. 나를 독하게 쏘아보는 두 눈에는 어느새 눈물까지 글썽글썽 맺혔다. 점순이는 입술을 바르르 떨더니, 홱 몸을 돌려 달아나 버렸다. 나는 그저 어리둥절할 뿐이었다. 그까짓 감자 한 알에 왜 저리 서러워하는지, 나로서는 도무지 알 수 없는 노릇이었다. 나중에야 어렴풋이 깨달은 것이지만, 점순이가 그토록 서러워한 데에는 필시 까닭이 있었을 것이다. 그러나 그때의 나는 그런 속내를 헤아리기엔 너무도 어수룩하기만 했다. 그날 이후로 점순이의 심술은 날이 갈수록 더해만 갔다.</p>

          <p class="section-title">Part 3. 씨암탉을 때리다</p>
          <p>감자를 거절당한 그날 뒤로, 점순이는 아주 독이 오른 듯했다. 하루는 내가 마당에 나와 보니, 점순이가 우리 집 씨암탉을 담 밑에 몰아넣고 사정없이 때리고 있는 것이 아닌가. 가뜩이나 알을 잘 낳던 귀한 암탉이었다. 점순이는 암탉을 두 손으로 움켜쥐고는, 때릴 테면 때려 보라는 듯 나를 흘끔거리며 매질을 했다. 매질을 할수록 더 약이 오르는지, 나중에는 암탉의 죽지를 붙들어 땅바닥에 메다꽂기까지 했다. 암탉이 꼬꼬댁 비명을 지르며 날개를 푸드덕거렸다. 나는 기가 막혔지만, 선뜻 달려들어 말리지도 못했다. 마름집 딸을 잘못 건드렸다가는 무슨 봉변을 당할지 몰라서였다. 그저 발만 동동 구르며 "남의 닭을 왜 때리느냐"</p>
          <p>고 소리칠 뿐이었다. 그러자 점순이는 앙칼지게 "그래, 때렸다. 어쩔 테냐." 하며 오히려 나를 매섭게 쏘아붙였다. 나는 분해서 얼굴이 벌겋게 달아올랐지만, 끝내 아무 말도 못 하고 돌아서야 했다. 돌아서는 내 등 뒤로 점순이의 쌀쌀맞은 웃음소리가 따라붙었다. 나는 그 웃음소리가 귀에 쟁쟁해, 그날 밤 잠자리에서도 좀처럼 분이 가시지 않았다. 도대체 내가 무얼 잘못했기에 점순이가 저러는지, 아무리 곱씹어도 알 길이 없었다. 점순이의 심술이 대체 어디까지 갈지, 생각할수록 속이 터질 노릇이었다.</p>

          <p class="section-title">Part 4. 닭싸움</p>
          <p>점순이의 심술은 거기서 그치지 않았다. 점순이네 수탉은 덩치가 크고 사나운 놈이었는데, 우리 집 수탉은 그에 비하면 턱없이 작고 순했다. 점순이는 틈만 나면 제 집 수탉을 몰고 와, 우리 수탉과 싸움을 붙였다. 점순네 수탉은 한번 덤벼들면 상대가 피를 보기 전에는 물러서는 법이 없었다. 큰 수탉이 달려들어 우리 닭의 볏을 사정없이 쪼아 댔다. 우리 수탉은 얼마 버티지도 못하고 선혈이 낭자하게 터져, 피를 뚝뚝 흘리며 구석으로 쫓겨 다녔다. 점순이는 그 꼴을 보며 재미있다는 듯 깔깔거렸다. 나는 달려가 두 닭을 억지로 떼어 놓았지만, 내가 돌아서기만 하면 점순이는 또다시 싸움을 붙여 놓곤 했다.</p>
          <p>날마다 그 모양이니, 우리 수탉은 성한 데가 없이 볏이 찢기고 깃털이 숭숭 빠졌다. 보다 못한 나는 우리 닭을 안아다 광 속에 가두어도 보았지만, 그때뿐이었다. 우리 수탉은 기껏 한두 번 대들다가는 번번이 꽁무니를 빼고 달아나기 바빴다. 그럴 때마다 점순이는 신이 나서 손뼉을 치며 더욱 좋아라 했다. 나는 그 모습에 울화가 치밀면서도, 겉으로는 내색 한 번 하지 못했다. 나는 애꿎은 닭만 바라보며 속을 끓였다. 그러면서도 점순이에게 대놓고 따지지도 못하는 내 처지가, 한없이 초라하게만 느껴졌다.</p>

          <p class="section-title">Part 5. 속만 끓이는 나</p>
          <p>날마다 피투성이가 되는 우리 수탉을 볼 때마다, 나는 가슴이 미어지는 것 같았다. 점순이가 미워 견딜 수가 없었다. 그러나 그 미움을 겉으로 드러낼 수도 없는 노릇이었다. 우리는 점순네 땅을 부쳐 먹고 사는 처지라, 점순이에게 잘못 대들었다가는 당장 땅이 떨어질까 두려웠기 때문이다. 땅이 떨어지면 온 식구가 길바닥에 나앉아야 했다. 어머니가 늘 당부하던 말이 자꾸만 귓가에 맴돌았다. 나는 애꿎은 지게 작대기만 땅바닥에 탁탁 내리치며 분을 삭였다. 점순이는 그런 내 속도 모르고, 아니 어쩌면 뻔히 알면서도 더욱 기승을 부렸다.</p>
          <p>울타리 너머로 나를 빤히 보며 입을 삐죽거리기도 하고, 혀를 쏙 내밀며 약을 올리기도 했다. 나는 그저 얼굴만 벌겋게 붉히고 고개를 돌릴 뿐이었다. 점순이가 왜 하필 나한테만 이러는지, 생각하면 할수록 알 수 없는 노릇이었다. 분하고 서럽고, 또 어쩐지 까닭 모를 서운함까지 뒤섞여 마음이 몹시 복잡했다. 밤이면 나는 우리 수탉의 찢긴 볏에 약을 발라 주며, 애꿎은 그놈만 가만히 어루만지곤 했다. 말 못 하는 짐승이 무슨 죄인가 싶어, 볼수록 더욱 가엾기만 했다. 나는 그 복잡한 심사를 누구에게도 털어놓지 못한 채 혼자 끙끙 앓았다. 애꿎은 하늘만 올려다보며 긴 한숨을 내쉴 뿐이었다.</p>

          <p class="section-title">Part 6. 고추장을 먹이다</p>
          <p>이대로 두었다가는 우리 수탉이 머지않아 죽고 말 것만 같았다. 나는 어떻게든 우리 닭을 이기게 하고 싶었다. 궁리 끝에 떠올린 것이 바로 고추장이었다. 고추장을 먹이면 닭이 매운 기운에 힘이 펄펄 솟아 사나워진다는 말을, 나는 어디선가 들었던 것이다. 나는 아무도 몰래 부엌에서 고추장을 한 숟가락 퍼다가, 물에 멀겋게 개어 우리 수탉의 주둥이에 억지로 발라 먹였다. 닭은 맵다고 몸서리를 치며 고개를 내둘렀다. 그러고는 점순네 수탉 앞에 슬그머니 내다 놓았다. 처음 얼마간은 과연 효험이 있는 듯했다. 우리 수탉이 전에 없이 기세 좋게 달려들어 큰 닭의 볏을 쪼아 댔다.</p>
          <p>나는 신이 나서 손에 땀을 쥐고 지켜보았다. 그러나 그것도 잠시뿐이었다. 매운 기운이 가시자 우리 닭은 이내 축 지쳐 늘어졌고, 큰 수탉에게 도로 사정없이 쪼이고 말았다. 고추장이 너무 과했는지, 나중에는 우리 닭이 도리어 비실비실 맥을 못 추기까지 했다. 나는 그런 닭을 보며 괜한 짓을 했나 싶어 후회가 밀려들었다. 그래도 달리 뾰족한 수가 없으니 그저 답답하기만 했다. 마지막으로 믿었던 고추장마저 이 모양이니, 나는 하늘이 무너지는 것만 같았다. 나는 그만 맥이 탁 풀려 그 자리에 주저앉고 말았다. 고추장까지 먹였는데도 소용이 없으니, 이제는 더 어찌해 볼 도리가 없었다.</p>

          <p class="section-title">Part 7. 산에서 내려오는 길</p>
          <p>그날 나는 뒷산으로 나무를 하러 올라갔다. 한 짐 가득 나무를 해서 지게에 지고 산길을 터덜터덜 내려오는데, 멀리 우리 집 마당 쪽에서 요란한 닭 소리가 들려왔다. 가슴이 철렁 내려앉았다. 지게를 진 두 어깨가 천근만근 무거웠지만, 나는 나무 짐도 잊은 채 비탈을 구르듯 뛰어 내려갔다. 아니나 다를까, 점순이가 또 저희 수탉을 몰고 와 우리 닭과 싸움을 붙여 놓은 것이었다. 내가 산에 간 틈을 노린 모양이었다. 큰 수탉은 작정한 듯 우리 닭을 사납게 몰아붙였고, 우리 수탉은 거의 초주검이 되어 피를 흘리며 바닥에 널브러져 있었다. 눈을 희번덕이며 당장이라도 숨이 넘어갈 듯 가쁜 숨만 할딱이고 있었다.</p>
          <p>점순이는 바위에 걸터앉아, 그 광경을 태평스레 내려다보며 히죽히죽 웃고 있었다. 그 태평스러운 웃음을 보자, 나는 눈앞이 아뜩하고 숨이 턱 막히는 것만 같았다. 가까이 다가가 그 참혹한 꼴을 보는 순간, 나는 지게를 내팽개치다시피 벗어 던지고 단숨에 달려들었다. 머릿속이 하얘지고, 그동안 쌓이고 쌓인 분이 왈칵 치밀어 올랐다. 더는 참을 수가 없었다. 눈앞의 그 광경에 나는 그만 눈이 뒤집히고 말았다. 나도 모르게 두 주먹이 부르르 떨리고, 온몸의 피가 거꾸로 솟는 것만 같았다.</p>

          <p class="section-title">Part 8. 수탉을 때려죽이다</p>
          <p>나는 앞뒤 가릴 것도 없이, 지게 작대기를 집어 들고 점순네 수탉을 향해 힘껏 내리쳤다. 한 번, 두 번, 정신없이 후려치자, 그 크고 사납던 수탉이 외마디 소리를 지르며 그 자리에 폭 고꾸라졌다. 날개를 몇 번 파닥이더니, 이내 축 늘어져 꼼짝도 하지 않았다. 숨이 끊어진 것이었다. 그제야 나는 내가 무슨 짓을 저질렀는지 깨닫고 소스라치게 놀랐다. 하필이면 마름집 닭을 죽여 놓았으니, 이 일이 알려지면 우리 집은 꼼짝없이 땅이 떨어지고 쫓겨날지도 몰랐다. 어머니와 아버지의 겁에 질린 얼굴이 눈앞에 어른거렸다. 겁이 더럭 나서 온몸이 사시나무처럼 바르르 떨렸다.</p>
          <p>나는 죽은 닭을 내려다보며 어쩔 줄을 몰라, 그만 울음이 왈칵 터지고 말았다. 눈물 콧물이 범벅이 되도록 엉엉 울었다. 작대기를 쥔 손이 아직도 부들부들 떨렸고, 나는 내가 무슨 짓을 저질렀는지도 실감이 나지 않았다. 한참을 멍하니 서 있다가, 나는 그만 다리에 힘이 풀려 그 자리에 털썩 주저앉고 말았다. 이 일을 대체 어찌 수습해야 할지, 그저 눈앞이 캄캄하고 막막하기만 했다. 땅이 꺼지고 하늘이 노랗게만 보였다. 점순이가 바로 곁에 서 있다는 것조차 까맣게 잊은 채, 나는 그저 겁에 질려 어린애처럼 울기만 했다.</p>

          <p class="section-title">Part 9. 그럼 이담부턴 안 그럴 테냐</p>
          <p>그런 나를 점순이가 가만히 바라보고 있었다. 그러더니 뜻밖에도 성을 내기는커녕, 눈을 할기죽거리며 나직이 물었다. "그럼, 너 이담부턴 안 그럴 테냐?" 나는 무엇을 안 그러겠다는 것인지도 잘 몰랐지만, 겁에 질린 나머지 얼결에 "그래, 그래. 인제 안 그럴 테다." 하고 연신 고개를 끄덕였다. 그러자 점순이의 얼굴이 금세 환하게 풀렸다. "닭 죽은 건 염려 마라. 내가 집에 가서 아무 말도 안 할 테니까."</p>

          <p>파리만 날리는 전을 붙들고 앉았느니, 차라리 시원한 막걸리 한 사발로 더위나 식히는 편이 나을 성싶었다. 두 사람은 전을 접고 충줏집 주막을 향해 어슬렁어슬렁 발길을 옮겼다. 돌이켜 보면 봉평은 허 생원에게 그저 스쳐 지나는 여느 장이 아니었다. 무슨 까닭에서인지 그는 해마다 이 장만은 거르는 법이 없었고, 비쩍 마른 늙은 나귀를 몰고 꼬박꼬박 봉평을 찾아들곤 했다. 제 몸뚱이처럼 지친 그 짐승과 함께 걸어온 길이 어느새 반생이었다. 장판을 빠져나오는 그의 등 뒤로 한여름 햇살이 쏟아졌고, 멀리 산기슭에는 머지않아 하얗게 피어날 메밀밭이 희끗희끗 눈에 어렸다.</p>

          <p class="section-title">Part 2. 충줏집에서의 실랑이</p>
          <p>충줏집 주막은 장을 파한 장꾼들로 제법 흥성거렸다. 허 생원이 한 귀퉁이에 앉아 막걸리 사발을 기울이는데, 맞은편에서 젊은 장돌뱅이 하나가 주모와 농지거리를 주고받으며 희희낙락하고 있었다. 훤칠하고 붙임성 좋은, 동이라는 애송이였다. 아직 솜털도 채 가시지 않은 녀석이 계집과 수작을 부리는 꼴을 보자, 허 생원은 까닭 모를 심사가 대번에 뒤틀렸다. 어쩌면 그것은 제 젊음을 모두 길 위에 덧없이 흘려보낸 늙은이의 부질없는 노여움이었는지도 몰랐다. 그 자신도 왜 그리 부아가 치미는지 알 수 없었다. 불쑥 솟는 화를 참지 못하고, 그는 성큼 다가가 동이의 뺨을 철썩 올려붙였다. "낮부터 술추렴에 계집 희롱이라니, 젊은 녀석이 버르장머리가 없구나."</p>
          <p>뜻밖의 매에도 동이는 대들지 않았다. 억울한 빛이 얼굴을 스치고 입술이 파르르 떨렸으나, 그는 끝내 말 한마디 없이 고개를 숙이고 조용히 물러났다. 왁자하던 주막 안이 일순 찬물을 끼얹은 듯 조용해졌다. 매를 든 손이 도리어 민망하여, 허 생원은 애꿎은 사발만 거푸 비웠다. 곁에서 조 선달이 "애먼 아이한테 왜 그리 모질게 구나" 하고 핀잔을 주었지만, 그는 멋쩍은 낯으로 입을 다문 채 쓰디쓴 술만 들이켤 뿐이었다. 공연한 짓을 했다는 뒤늦은 뉘우침이 술기운과 함께 가슴 밑바닥을 쓸고 지나갔다.</p>

          <p class="section-title">Part 3. 날뛰는 나귀</p>
          <p>얼마 지나지 않아, 매를 맞고 물러갔던 동이가 숨을 헐떡이며 다시 달려왔다. "아저씨, 나귀가… 나귀가 고삐를 끊고 날뛰어요!" 뺨을 맞고도 앙심 한 점 없이, 제 일인 양 달려와 급히 알려 주는 품이었다. 허 생원은 가슴이 철렁하여 사발을 내려놓고 한달음에 달려 나갔다. 짓궂은 장터 아이들이 돌팔매질을 하며 놀려 댄 탓인지, 늙은 나귀가 눈을 희번덕이며 사납게 몸부림을 치고 있었다. 반평생을 길 위에서 함께 늙어 온 나귀였다. 털이 숭숭 빠지고 다리가 후들거리는 그 짐승의 가여운 꼴이, 허 생원은 문득 제 늙고 초라한 몰골과 꼭 닮은 듯하여 가슴이 아릿하게 저려 왔다.</p>
          <p>그는 다급히 나귀의 목덜미를 끌어안고 등을 쓸며 가만가만 어르고 달래어, 겨우 날뛰는 짐승을 진정시켰다. 거친 숨이 차츰 가라앉자, 나귀는 젖은 눈으로 주인을 물끄러미 올려다보았다. 그 축축한 눈빛에 허 생원은 공연히 코끝이 시큰해졌다. 그제야 그의 눈길이 동이에게로 천천히 돌아갔다. 뺨을 때려 쫓은 아이가, 도리어 제 걱정인 양 숨이 턱에 차도록 달려와 준 것이었다. 미안함과 겸연쩍음이 뒤섞여 무어라 말을 건네지도 못하고, 허 생원은 "고맙다"는 한마디를 끝내 속으로만 삼켰다. 아이의 선량한 마음이 늙은 가슴 한구석에 오래도록 따뜻하게 남았다.</p>

          <p class="section-title">Part 4. 달밤, 메밀꽃 산길</p>
          <p>밤이 깊어 세 사람은 다음 장이 서는 대화를 향해 밤길을 나섰다. 허 생원과 조 선달, 그리고 어느새 한 일행이 된 동이였다. 낮의 서먹함도 깊은 밤길 앞에서는 슬그머니 풀어졌다. 하늘에는 둥근 달이 두둥실 떠올라, 온 산천이 희부옇게 젖어 빛나고 있었다. 길은 메밀밭 사이로 구불구불 이어졌는데, 바야흐로 활짝 핀 메밀꽃이 달빛을 받아 소금을 뿌린 듯 하얗게 흐드러져 있었다. 그야말로 숨이 막힐 듯한 정경이었다. 은은한 꽃 내음이 코끝을 간질이고, 어디선가 들려오는 개울물 소리가 밤의 적막을 잔잔히 채웠다. 짐을 진 나귀의 방울 소리만 딸랑딸랑 울리는 산길을, 세 그림자가 앞서거니 뒤서거니 느릿느릿 걸어갔다.</p>
          <p>달밤이 깊을수록 허 생원의 마음 한구석에서는 아련한 옛 기억이 소리 없이 피어올랐다. 이런 밤이면 으레 떠오르는, 평생 잊지 못한 한 사람의 얼굴이었다. 짐승 같은 달빛이 흐뭇이 흐르는 밤이면, 그는 언제나 젊은 날의 그 여름밤으로 아련히 되돌아가곤 했다. 가슴속 깊이 묻어 둔 이야기가 달빛에 녹아 저절로 입가로 떠오르는 듯했다. 그는 걸음을 늦추고 조 선달의 곁으로 슬며시 다가서며, 늘 그래 왔듯 지난 이야기를 또 꺼내려 조용히 입을 열었다. 메밀꽃은 끝없이 하얗게 펼쳐지고, 둥근 달은 세 나그네의 등 뒤를 말없이 따라왔다.</p>

          <p class="section-title">Part 5. 늘 하던 옛이야기</p>
          <p>이런 달밤이면 으레 그렇듯, 허 생원은 또 그 이야기를 꺼냈다. "조 선달, 내 젊었을 적 이야기를 또 해도 괜찮겠나." 조 선달은 벌써 귀에 못이 박히도록 들은 이야기였으나, 늙은 동무의 청을 매정하게 자를 수는 없었다. "하게. 밤길도 긴데 들어 줌세." 그는 짐짓 못 이기는 체 고개를 끄덕였다. 허 생원에게 그 이야기는 결코 한낱 지나간 추억이 아니었다. 가진 것 없이 길 위를 떠돈 쓸쓸한 반평생에, 그래도 식은 가슴을 덥혀 주는 단 하나의 등불 같은 기억이었다. 그는 담배를 한 모금 길게 빨고는, 먼 산마루에 걸린 달을 그윽이 올려다보며 천천히 말문을 열었다. 벌써 이십 년도 더 지난 일이건만, 그 밤의 일만은 어제런 듯 또렷하기만 했다.</p>
          <p>낮에 뺨을 맞았던 젊은 동이도 어느새 노여움을 잊고 조용히 귀를 기울였다. 바로 이 봉평에서, 꼭 오늘처럼 달이 희맑게 밝던 어느 여름밤의 이야기였다. 허 생원의 목소리는 낮고 느렸으나, 그 속에는 평생을 혼자 삭여 온 애틋한 그리움이 잔잔히 배어 있었다. 메밀꽃 하얀 밤길에, 늙은 장돌뱅이의 옛이야기가 실꾸리 풀리듯 조용히 풀려 나왔다. 조 선달도 동이도, 저마다 발걸음을 늦추며 그 아련한 이야기 속으로 말없이 젖어 들었다. 달빛만이 그 이야기를 가만히 굽어보고 있었다.</p>

          <p class="section-title">Part 6. 물레방앗간의 인연</p>
          <p>그 무렵 허 생원도 지금의 동이처럼 혈기가 넘치는 젊은 장돌뱅이였다. 장사가 신통치 않아 마음이 울적하던 어느 달밤, 그는 답답한 더위를 식히려 홀로 개울가로 목욕을 나갔다. 훌훌 옷을 벗으러 들어선 물레방앗간에, 뜻밖에도 성 서방네 처녀가 홀로 앉아 흐느끼고 있었다. 집안이 기울어 식구들이 뿔뿔이 흩어지게 되었고, 처녀 또한 낯선 곳으로 팔려 가듯 시집을 가야 할 서글픈 처지라 했다. 달빛만이 희미하게 비쳐 드는 어둑한 방앗간 안에서, 두 젊은이는 서로의 외롭고 서러운 신세를 두런두런 주고받으며 밤이 깊는 줄도 몰랐다. 가진 것 없이 떠도는 가난한 떠돌이와, 오갈 데 없는 가엾은 처녀였다.</p>
          <p>쓸쓸한 두 마음은 자연스레 서로에게 기대었고, 그 밤 그들은 짧지만 더없이 깊은 인연을 맺었다. 메밀꽃이 하얗게 흐드러진 그 밤의 일을, 허 생원은 평생 단 한 번의 꿈결처럼 가슴 깊이 품게 되었다. "그런 밤은 다시없었지. 꼭 오늘 같은, 달이 흐뭇하게 흐르던 밤이었네." 허 생원은 말끝을 흐리며 긴 한숨을 내쉬었다. 그 한숨 속에는 이십 년 세월의 그리움이 고스란히 담겨 있었다. 조 선달은 몇 번이고 들은 이야기건만, 그 대목에서는 늘 괜스레 숙연해져 말을 아끼곤 했다.</p>

          <p class="section-title">Part 7. 다시 못 만난 사람</p>
          <p>그러나 그 밤이 처음이자 마지막이었다. 날이 밝자 처녀는 이미 집안 사정에 떠밀려 흔적 없이 자취를 감춘 뒤였다. 허 생원이 애가 타도록 이리저리 수소문을 해 보았으나, 성 서방네가 밤새 어디로 야반도주를 했는지 아는 이가 아무도 없었다. 단 하룻밤의 애틋한 인연이 그렇게 허무하게 끊어진 것이다. 그 뒤로 허 생원은 그 처녀를 영영 다시 만나지 못했다. 장돌뱅이로 이 장 저 장을 정처 없이 떠돌면서도, 그의 마음만은 늘 봉평 언저리에 붙박인 듯 매여 있었다. 혹시나 그 사람의 소식이라도 바람결에 들을까, 아니면 번잡한 장터 모퉁이에서 우연히 마주치기라도 할까 하는 부질없는 바람 때문이었다.</p>
          <p>그래서 그는 해마다 봉평 장만은 단 한 번도 거르는 법이 없었다. "인연이란 참 모질기도 하지. 단 한 번 스치고는 사람을 평생 이렇게 붙들어 매니 말일세." 늙은 허 생원의 목소리에 지울 수 없는 쓸쓸함이 짙게 묻어났다. 조 선달은 여러 번 들은 이야기였으나 이번에도 잠자코 고개를 끄덕였고, 젊은 동이는 까닭 모를 뭉클함에 말없이 밤하늘만 올려다보았다. 달은 여전히 희맑게 밝았고, 하얀 메밀꽃은 그 옛날 그 밤처럼 바람에 가만가만 흔들리고 있었다. 세 사람의 걸음만 소리 없이 이어졌다.</p>

          <p class="section-title">Part 8. 동이의 내력</p>
          <p>허 생원의 이야기가 끝나자, 이번에는 동이가 제 서러운 신세를 조용히 풀어놓았다. 그는 아버지의 얼굴을 한 번도 본 적이 없다고 했다. 어머니가 그를 밴 채로 집에서 쫓겨나, 달도 채 차기 전에 낯선 땅에서 홀로 그를 낳았다는 것이다. 가만히 들어 보니 그 어머니의 고향이 다름 아닌 봉평이라 했다. 허 생원은 무심코 듣다가 문득 가슴 한구석이 서늘해지는 것을 느꼈다. 동이는 어려서부터 의붓아버지 밑에서 자랐는데, 술만 취하면 사정없이 매질을 해 대는 그 모진 손찌검을 끝내 견디다 못해 몇 해 전 집을 뛰쳐나왔다고 했다. 그 뒤로 떠돌이 장돌뱅이가 되어 이 장 저 장을 전전하며 외롭게 혼자 살아왔다는 것이다.</p>
          <p>"어머니는 지금 제천 땅에 홀로 계십니다. 언젠가 돈을 모아 꼭 모셔다가 함께 살려고요." 어머니를 말하는 동이의 목소리에는 애틋한 정이 촉촉이 배어 있었다. 허 생원은 그만 걸음을 멈출 뻔했다. 봉평에서 홀로 아이를 낳았다는 여인이라니 — 가슴 깊은 곳에서 알 수 없는 떨림이 가느다랗게 일어 번져 갔다. 그러나 그는 애써 내색하지 않고, 묵묵히 동이의 이야기에 가만히 귀를 기울일 뿐이었다. 달빛이 두 사람의 어깨 위로 고요히 쏟아져 내렸다.</p>

          <p class="section-title">Part 9. 개울을 건너다</p>
          <p>이야기에 잠긴 사이, 일행은 어느새 밤의 개울가에 이르렀다. 장마 끝이라 물이 제법 불어 세차게 흐르고 있었다. 앞서 건너던 허 생원이 그만 이끼 낀 미끄러운 돌을 헛디뎌, 첨벙 하고 물속에 빠지고 말았다. 늙은 몸이 차가운 물살에 속절없이 휘청거렸다. 동이가 깜짝 놀라 달려와, 허우적대는 그를 부축해 일으키더니 선뜻 제 등을 내밀었다. "어르신, 어서 업히십시오. 물이 깊어 위험합니다." 허 생원은 사양할 겨를도 없이 그 젊고 든든한 등에 가만히 업혔다. 동이의 등은 바위처럼 넓고 또 불처럼 따뜻했다. 물을 건너는 동안, 등에 업힌 허 생원은 저도 모르게 동이의 어머니 이야기를 다시 조심스레 묻게 되었다.</p>

          <p>일자리를 모두 잃은 황수건은 당장 먹고살 길이 막막해졌다. 그런 그를 바라보는 내 마음도 영 편치 않았다. 무엇이든 제 손으로 벌어 살아 보려는 그의 처지가 딱하기 그지없었다. 하루는 황수건이 머뭇거리며, 장사라도 한번 해 보고 싶은데 밑천이 없다는 말을 조심스레 꺼냈다. 참외 장사라도 벌여 보면 그래도 입에 풀칠은 하지 않겠느냐는 것이었다. 그 말을 듣자 나는 차마 모른 체할 수가 없었다. 썩 넉넉한 형편은 아니었으나, 나는 선뜻 그에게 돈 삼 원을 쥐여 주었다. 이 돈으로 참외라도 받아다 팔아 보라고, 부디 이번에는 자리를 잡으라고 일렀다. 황수건은 뜻밖의 큰돈에 어쩔 줄을 몰라 했다.</p>
          <p>그 모자란 얼굴에 금세 환한 희망이 피어올랐다. 그는 연방 고맙다는 말을 되뇌며, 이번에야말로 꼭 성공해 보이겠노라 다짐했다. 나는 그 순박한 다짐이 부디 헛되지 않기를 마음속으로 빌었다. 변변한 재주 하나 없는 그에게, 그 삼 원은 세상에 다시 서 보려는 마지막 끈과도 같았다. 돈을 받아 쥔 그의 손이 가늘게 떨리는 것을, 나는 보았다. 그 작은 돈에 한 사람의 희망이 통째로 매달려 있다고 생각하니, 나도 모르게 마음이 숙연해졌다. 부디 이번만은 세상이 그를 모른 체하지 않기를 나는 간절히 바랐다.</p>

          <p class="section-title">Part 7. 어긋난 장사</p>
          <p>그러나 황수건의 참외 장사는 처음부터 어긋나기만 했다. 미련하고 서툰 그가 장사를 제대로 해낼 리 만무했다. 좋은 참외를 고를 줄도, 값을 흥정할 줄도 몰랐으니, 받아 온 참외부터가 변변치 못했다. 게다가 그는 사람을 끌어 물건을 파는 재간이 도무지 없었다. 어수룩하게 앉아 있기만 하니, 지나가는 사람들은 거들떠보지도 않았다. 팔리지 않은 참외는 하루가 다르게 무르고 썩어 갔다. 설상가상으로 그 무렵 장마까지 들이닥쳤다. 며칠이고 비가 퍼붓자, 그나마 남아 있던 참외마저 죄다 썩어 문드러지고 말았다. 애써 받아 온 밑천이 고스란히 빗물에 녹아 버린 셈이었다. 삼 원의 희망은 그렇게 허무하게 사라지고 말았다.</p>
          <p>황수건은 텅 빈 손으로 멍하니 비 오는 하늘만 올려다볼 뿐이었다. 그 꼴을 전해 들은 나는 가슴이 미어지는 듯했다. 모처럼 품었던 작은 꿈이 또 한 번 그의 손아귀를 맥없이 빠져나가 버린 것이다. 세상은 끝끝내 이 가엾은 사내의 편을 들어 주지 않았다. 나는 그를 나무랄 수도, 위로할 수도 없어 그저 말없이 바라볼 뿐이었다. 애초에 장사 같은 것이 그에게 가당키나 한 일이었을까. 돌이켜 보면 그 삼 원마저 그에게는 너무 무거운 짐이었는지도 몰랐다. 그 허망함은 오래도록 쉬이 가시지 않았다.</p>

          <p class="section-title">Part 8. 아내마저 떠나고</p>
          <p>엎친 데 덮친 격으로, 황수건에게 더 큰 불행이 닥쳤다. 그나마 곁을 지키던 아내마저 그를 버리고 도망가 버린 것이다. 가난에 지치고 기약 없는 살림에 그만 넌더리가 났던 모양이다. 하기야 모자란 남편 하나만 바라보고 살기에는, 그 앞날이 너무도 막막했을 것이다. 아내가 떠나자 황수건은 그야말로 외톨이가 되었다. 일자리도, 밑천도, 이제는 아내마저 없었다. 가진 것이라고는 아무것도 남지 않은, 그야말로 빈손이었다. 나는 그 소식을 듣고 한동안 말을 잇지 못했다. 세상의 불운이란 불운은 어쩌면 이 한 사람에게만 모조리 쏟아지는 것 같았다. 그러나 정작 황수건은 아내를 원망하지 않았다.</p>

          <p class="section-title">Part 9. 원망을 모르는 사람</p>
          <p>모든 것을 잃고도 황수건은 끝내 사람을 원망하지 않았다. 세상이 그에게 그토록 모질게 굴었건만, 그의 마음속에는 미움이라는 것이 자리할 줄을 몰랐다. 저를 쫓아낸 사람도, 저를 버리고 간 아내마저도 그는 미워하지 않았다. 도리어 그 모든 불운을 제 모자람 탓으로 돌리며, 여전히 사람 좋은 웃음을 잃지 않았다. 나는 그 순박한 마음이 애처로우면서도, 한편으로는 숙연한 생각마저 들었다. 영악한 사람들은 작은 손해에도 이를 갈며 남을 미워하는데, 가진 것 없는 이 모자란 사내는 모든 것을 빼앗기고도 맑은 마음을 잃지 않았다. 어쩌면 세상의 영악함보다, 황수건의 저 어수룩한 선량함이 훨씬 더 귀한 것인지도 몰랐다.</p>
          <p>나는 그를 볼 때마다 가슴 한구석이 따뜻해지면서도 동시에 저려 왔다. 저렇듯 착하기만 한 사람이 어찌하여 이토록 박복해야 하는가. 그 물음 앞에서 나는 번번이 말문이 막히고 말았다. 황수건을 향한 나의 연민은 그렇게 날이 갈수록 깊어만 갔다. 가진 것 없고 모자란 사람이 도리어 가장 맑은 마음을 지녔다는 사실이, 나에게는 하나의 깨달음처럼 다가왔다. 세상의 잣대로는 그가 어리석어 보일지 몰라도, 나는 그 어리석음이 차라리 거룩하게 느껴졌다. 나는 그 맑은 사람 앞에서 늘 작아지는 기분이었다.</p>

          <p class="section-title">Part 10. 달밤의 노래</p>

          <p>그런데 뜻밖에도, 애가 타기는 점순이도 나 못지않은 모양이었다. 하루는 점순이가 내 곁으로 슬그머니 다가오더니, 아무도 안 듣는 데서 나직이 속삭이는 것이었다. "밤낮 일만 하면 뭐 해. 성례를 시켜 줘야 할 거 아니야." 나는 그 말에 그만 깜짝 놀라고 말았다. 수줍기만 하던 점순이가 먼저 그런 말을 꺼낼 줄은 꿈에도 몰랐던 것이다. 점순이는 답답하다는 듯 입을 삐죽거리며, 아버지한테 가서 어서 혼인시켜 달라고 조르라는 눈치를 주었다. 이대로 가만히 있으면 평생 이렇게 부려만 먹힌다는 것이었다. 그 말을 듣고 보니 과연 옳은 말이었다. 점순이도 나와 혼인하고 싶어 하는구나 생각하니, 한편으로는 가슴이 콩닥거리고 한편으로는 어디서 없던 용기가 불끈 솟았다.</p>
          <p>여태 나는 장인이 무서워 입도 뻥끗 못 했는데, 정작 점순이가 저리 등을 떠미니 더는 가만있을 수가 없었다. 나는 이번에야말로 장인에게 단단히 따져 보리라 마음을 굳게 먹었다. 점순이는 그 말을 남기고는 홱 돌아서 제 볼일을 보러 가 버렸다. 나는 그 야무진 뒷모습을 바라보며 가슴이 다 벅차올랐다. 저렇게 당찬 점순이가 내 편이니, 이제는 무서울 것이 하나도 없을 듯싶었다. 나는 절로 어깨가 으쓱해지는 것만 같았다.</p>

          <p class="section-title">Part 6. 꾀병을 부리며 대들다</p>
          <p>점순이의 부추김에 용기를 얻은 나는, 드디어 큰일을 한번 벌이기로 작정했다. 이날 나는 멀쩡한 몸을 핑계 삼아, 배가 아프다며 논으로 나가지 않고 방에 드러누워 버렸다. 일을 안 하고 버팀으로써 장인의 애를 바싹 태워 기어이 성례를 받아 낼 속셈이었다. 아니나 다를까, 장인이 득달같이 달려와 왜 일을 안 하느냐고 성화를 부렸다. 나는 짐짓 배를 움켜쥐고 끙끙 앓는 시늉을 했다. 그러고는 큰맘을 먹고 입을 열었다. "점순이하고 성례를 시켜 주시기 전엔, 저는 인제 일 못 하겠습니다." 여태 고분고분하던 내가 뜻밖의 소리를 내뱉자, 장인은 두 눈이 휘둥그레졌다. 이내 얼굴이 붉으락푸르락해지더니, 그 걸쭉한 욕이 대번에 터져 나왔다.</p>
          <p>하지만 나도 이번만은 결코 물러서지 않았다. 점순이 생각에, 또 삼 년 칠 개월의 억울함에 어디서 그런 배짱이 솟았는지, 나는 장인의 욕설에도 꿈쩍 않고 버텼다. 그 바람에 장인과 나 사이에는 금세 험악한 기운이 감돌기 시작했다. 장인은 당장이라도 달려들 듯 두 눈을 부라렸지만, 나는 배를 움켜쥔 채 꼼짝도 하지 않았다. 여기서 또 밀리면 몇 해를 공으로 부려먹히고 말 터였다. 나는 속으로 점순이를 떠올리며 이를 악물고 버텼다. 좁은 방 안에는 금세 팽팽한 긴장이 감돌았다.</p>

          <p class="section-title">Part 7. 사타구니 잡고 드잡이</p>
          <p>말로 옥신각신하던 끝에, 기어이 장인과 나는 멱살을 움켜잡고 드잡이를 벌이게 되었다. 성이 머리끝까지 난 장인이 지게 막대기를 들고 나를 후려치려 들었고, 나도 더는 참지 못하고 그예 맞붙고 말았다. 그러다 어찌어찌 서로의 사타구니를 움켜쥐는 지경에까지 이르렀다. 둘이 한 덩어리로 엉겨 붙어 데굴데굴 구르며, 한 손으로는 상대의 급소를 붙잡고 놓지 않으니, 그 꼴이 말이 아니었다. 아파서 악을 쓰는 소리에 온 동네가 떠나갈 듯했다. 장인은 내 사타구니를 움켜쥔 채 "이놈!" 하고 벼락같이 소리를 질렀고, 나도 지지 않고 장인의 그곳을 꽉 붙잡았다. 서로 급소를 잡혔으니 섣불리 힘을 쓸 수도 없어, 그저 아이고 소리만 내지르며 뒹굴 뿐이었다.</p>
          <p>체면이고 뭐고 다 내던진, 참으로 우스꽝스럽고도 처절한 싸움이었다. 명색이 장인과 사위가 밭머리에서 그 모양으로 엉겨 붙었으니, 지나가던 사람이 보았다면 배를 잡고 웃었을 것이다. 그래도 그 순간 나는 오직 성례 생각뿐이라 도무지 물러설 줄을 몰랐다. 흙먼지를 온통 뒤집어쓴 채 둘이 한참을 뒹구는 꼴은 그야말로 가관도 그런 가관이 없었다. 그러면서도 나는 이 싸움이 어떻게든 성례로 이어지기만을 애타게 바랐다. 아픈 것도 아픈 것이지만, 여기서 지면 또 공사가 되고 마니 죽어도 손을 놓을 수가 없었다.</p>

          <p class="section-title">Part 8. 점순이만 믿고</p>
          <p>장인과 사타구니를 맞잡고 뒹구는 와중에도, 내 머릿속에는 온통 점순이 생각뿐이었다. 다른 사람도 아니고, 이게 다 점순이와 혼인을 하자고 벌인 일이 아니던가. 나는 은근히 점순이가 달려와 내 편을 들어 주기를 손꼽아 기대했다. 이 싸움은 결국 저를 위한 것이니, 점순이도 틀림없이 내 손을 들어 줄 거라 믿었다. 아버지가 아무리 제 아비라 해도, 성례를 미루며 사람을 애먹이는 쪽은 장인이요, 점순이와 어엿이 혼인하려는 쪽은 바로 나였다. 그러니 점순이가 어느 편을 들지는 뻔한 노릇이라고 나는 철석같이 믿어 의심치 않았다. 마침 소란을 듣고 점순이가 집 안에서 허둥지둥 뛰어나오는 것이 보였다.</p>
          <p>나는 속으로 '옳거니, 이제야 점순이가 나서서 아버지를 말리고 내 편을 들어 주겠구나' 하고 은근히 반가웠다. 급소를 잡혀 눈물이 찔끔 날 지경이면서도, 나는 점순이만 오면 이 싸움이 내게 유리하게 풀리리라 생각하며 이를 악물고 끝까지 버텼다. 생각하면 할수록 점순이가 내 편을 드는 것이 너무도 당연한 이치였다. 나는 그 믿음 하나로 급소가 아픈 것도 꾹 참으며 버텼다. 점순이가 한마디만 거들어 주면 제아무리 장인이라도 꼼짝없이 성례를 승낙하리라 싶었다. 그 믿음 하나만으로도 나는 그저 든든하기만 했다.</p>

          <p class="section-title">Part 9. 아버지 편을 든 점순이</p>
          <p>그런데 이게 대체 웬 날벼락이란 말인가. 달려온 점순이는 내 예상과는 영 딴판으로 굴었다. 제 아비가 사위에게 급소를 잡혀 쩔쩔매는 꼴을 보더니, 점순이는 되레 나에게 달려들어 내 편이 아니라 아버지 편을 드는 것이 아닌가. 점순이는 발을 동동 구르며 "아버지를 왜 이렇게 해!" 하고 앙칼지게 나를 나무랐다. 심지어 울먹이며 내 귀며 등짝을 사정없이 잡아 뜯는 통에, 나는 그만 어안이 벙벙해지고 말았다. 나를 부추겨 이 싸움을 하게 만든 장본인이 바로 점순이였건만, 막상 제 아비가 당하는 꼴은 차마 못 보겠던 모양이다. 나는 급소의 아픔보다도 그 서운함에 가슴이 더 아리고 쓰렸다.</p>
          <p>철석같이 믿었던 점순이에게 뒤통수를 맞은 것 같아 눈앞이 다 아득해졌다. 그렇게 점순이마저 아버지 편을 드니, 나는 이쪽저쪽에서 몰리는 꼴이 되어 그만 기운이 쭉 빠지고 말았다. 도무지 점순이의 알 수 없는 속을 헤아릴 길이 없어, 나는 멍하니 그 자리에 주저앉고 말았다. 나를 부추길 때는 언제고, 막상 일이 벌어지자 저렇게 홱 돌변하다니 기가 막힐 노릇이었다. 여자의 마음이란 참으로 알다가도 모를 것이구나 싶었다. 나는 점순이의 그 속내를 도무지 헤아릴 길이 없어 그저 멍하기만 했다. 세상에 이런 법도 다 있는가 싶어 기가 찼다.</p>

          <p class="section-title">Part 10. 또 속아 넘어가는 나</p>
          <p>싸움이 그렇게 흐지부지 끝나자, 장인은 언제 그랬냐는 듯 슬그머니 태도를 바꾸었다. 조금 전까지 씩씩거리던 그가 이번에는 제법 너그러운 낯을 하고는, 내 등을 툭툭 토닥이며 달래기 시작했다. "이 사람아, 그만 화 풀게. 내 올가을에는 꼭 점순이하고 성례를 시켜 줄 테니 말이야." 가을이라는 그 한마디에, 나는 또 그만 귀가 솔깃해지고 말았다. 사실 따지고 보면 그 '가을'이라는 약속도 벌써 몇 번째인지 몰랐다. 번번이 봄이 가고 가을이 가도 성례는 끝내 이루어지지 않았으면서 말이다. 그런데도 어리숙한 나는 장인의 그 말 한마디에 노여움이 눈 녹듯 스르르 풀리고 말았다.</p>

          <p>내가 보기에 점순이는 진작 시집갈 나이가 되고도 남았다. 알고 보면 그것은 성례를 미뤄 나를 더 오래 공짜로 부려먹으려는 뻔한 수작이었다. 그러나 나는 그 속셈을 번연히 알면서도 차마 대놓고 따지지는 못하고, 그저 속만 바싹바싹 끓였다. 점순이 키가 어서 크기만을 애타게 바라고 또 바랄 뿐이었다.</p>

          <p class="section-title">Part 4. 애만 타는 나날</p>
          <p>성례는 도무지 기약이 없고, 일은 날이 갈수록 고되기만 했다. 봄이면 논을 갈고 모를 내고, 여름이면 땡볕에 김을 매고, 가을이면 추수에 허리가 휘었다. 겨울에도 땔나무를 하느라 쉴 틈이 없었다. 그렇게 사철 내내 소처럼 부려지면서도, 나는 점순이와의 혼인 하나만 바라보며 이를 악물었다. 그러나 날이 가고 달이 가도 혼인 이야기는 도무지 나올 기미가 없었다.</p>
          <p>동갑내기 친구들은 벌써 장가를 들어 아이까지 보았는데, 나만 이 집에 매여 공으로 일만 하고 있으니 속이 터질 노릇이었다. 그렇다고 이제 와서 때려치우고 나가자니, 그동안 바친 삼 년 칠 개월이 너무도 아까웠다. 나는 그저 벙어리 냉가슴 앓듯 혼자서만 끙끙거릴 뿐이었다. 밤이면 봉당에 누워 애꿎은 천장만 올려다보며 긴 한숨을 내쉬었다.</p>

          <p class="section-title">Part 5. 점순이의 부추김</p>
          <p>그런데 뜻밖에도, 애가 타기는 점순이도 나 못지않은 모양이었다. 하루는 점순이가 내 곁으로 슬그머니 다가오더니, 아무도 안 듣는 데서 나직이 속삭이는 것이었다. "밤낮 일만 하면 뭐 해. 성례를 시켜 줘야 할 거 아니야." 나는 그 말에 그만 깜짝 놀라고 말았다.</p>
          <p>수줍기만 하던 점순이가 먼저 그런 말을 꺼낼 줄은 꿈에도 몰랐던 것이다. 점순이는 아버지한테 가서 어서 혼인시켜 달라고 조르라는 눈치를 주었다. 이대로 가만히 있으면 평생 이렇게 부려만 먹힌다는 것이었다. 점순이도 나와 혼인하고 싶어 하는구나 생각하니, 가슴이 콩닥거리고 어디서 없던 용기가 불끈 솟았다. 여태 나는 장인이 무서워 입도 뻥끗 못 했는데, 정작 점순이가 저리 등을 떠미니 더는 가만있을 수가 없었다. 나는 이번에야말로 장인에게 단단히 따져 보리라 마음을 굳게 먹었다.</p>

          <p class="section-title">Part 6. 꾀병을 부리며 대들다</p>
          <p>점순이의 부추김에 용기를 얻은 나는, 드디어 큰일을 벌이기로 작정했다. 이날 나는 멀쩡한 몸을 핑계 삼아, 배가 아프다며 논으로 나가지 않고 방에 드러누워 버렸다. 일을 안 하고 버팀으로써 장인의 애를 바싹 태워 기어이 성례를 받아 낼 속셈이었다. 아니나 다를까, 장인이 득달같이 달려와 왜 일을 안 하느냐고 성화를 부렸다. 나는 짐짓 배를 움켜쥐고 앓는 시늉을 했다. 그러고는 큰맘을 먹고 입을 열었다.</p>
          <p>"점순이하고 성례를 시켜 주시기 전엔, 저는 인제 일 못 하겠습니다." 여태 고분고분하던 내가 뜻밖의 소리를 내뱉자, 장인은 두 눈이 휘둥그레졌다. 이내 얼굴이 붉으락푸르락해지더니 그 걸쭉한 욕이 대번에 터져 나왔다. 하지만 나도 이번만은 결코 물러서지 않았다. 삼 년 칠 개월의 억울함에 어디서 그런 배짱이 솟았는지, 나는 장인의 욕설에도 꿈쩍 않고 버텼다.</p>

          <p class="section-title">Part 7. 사타구니 잡고 드잡이</p>
          <p>말로 옥신각신하던 끝에, 기어이 장인과 나는 멱살을 움켜잡고 드잡이를 벌이게 되었다. 성이 머리끝까지 난 장인이 지게 막대기를 들고 나를 후려치려 들었고, 나도 더는 참지 못하고 그예 맞붙고 말았다. 그러다 어찌어찌 서로의 사타구니를 움켜쥐는 지경에까지 이르렀다. 둘이 한 덩어리로 엉겨 붙어 데굴데굴 구르며, 한 손으로 상대의 급소를 붙잡고 놓지 않으니 그 꼴이 말이 아니었다. 서로 급소를 잡혔으니 섣불리 힘을 쓸 수도 없어, 그저 아이고 소리만 내지르며 뒹굴 뿐이었다.</p>

          <p>장인과 사타구니를 맞잡고 뒹구는 와중에도, 내 머릿속에는 온통 점순이 생각뿐이었다. 다른 사람도 아니고, 이게 다 점순이와 혼인을 하자고 벌인 일이 아니던가. 나는 은근히 점순이가 달려와 내 편을 들어 주기를 손꼽아 기대했다. 성례를 미루며 사람을 애먹이는 쪽은 장인이요, 점순이와 어엿이 혼인하려는 쪽은 바로 나였다.</p>
          <p>그러니 점순이가 어느 편을 들지는 뻔한 노릇이라고 나는 철석같이 믿어 의심치 않았다. 마침 소란을 듣고 점순이가 집 안에서 허둥지둥 뛰어나오는 것이 보였다. 나는 속으로 '옳거니, 이제야 점순이가 나서서 내 편을 들어 주겠구나' 하고 은근히 반가웠다. 급소를 잡혀 눈물이 찔끔 날 지경이면서도, 나는 점순이만 오면 이 싸움이 유리하게 풀리리라 생각하며 이를 악물고 버텼다.</p>

          <p>그런데 이게 대체 웬 날벼락이란 말인가. 달려온 점순이는 내 예상과는 영 딴판으로 굴었다. 제 아비가 사위에게 급소를 잡혀 쩔쩔매는 꼴을 보더니, 점순이는 되레 나에게 달려들어 아버지 편을 드는 것이 아닌가. 점순이는 발을 동동 구르며 "아버지를 왜 이렇게 해!" 하고 앙칼지게 나를 나무랐다.</p>
          <p>심지어 울먹이며 내 귀며 등짝을 사정없이 잡아 뜯는 통에, 나는 그만 어안이 벙벙해지고 말았다. 나를 부추겨 이 싸움을 하게 만든 장본인이 바로 점순이였건만, 막상 제 아비가 당하는 꼴은 차마 못 보겠던 모양이다. 나는 급소의 아픔보다도 그 서운함에 가슴이 더 아리고 쓰렸다. 철석같이 믿었던 점순이에게 뒤통수를 맞은 것 같아 눈앞이 아득해졌다. 도무지 점순이의 알 수 없는 속을 헤아릴 길이 없어, 나는 멍하니 그 자리에 주저앉고 말았다.</p>

          <p class="section-title">Part 3. 마을의 일꾼</p>
          <p>황만근은 마을에서 아무도 하려 들지 않는 궂은일을 도맡아 하는 사람이었다. 동네에 초상이 나면 남들이 꺼리는 험한 일을 그가 나서서 했고, 더럽고 힘든 일이라면 으레 그의 몫으로 돌아왔다. 가뭄에 마른 도랑을 치고, 눈이 오면 길을 쓸고, 품이 많이 드는 일에는 언제나 그가 불려 나왔다. 그러면서도 그는 변변한 품삯 한 번 제대로 받은 적이 없었다. 사람들은 당연하다는 듯 그를 부렸고, 고맙다는 말조차 아꼈다. 그래도 황만근은 싫은 내색 한 번 하지 않았다. 누가 시켜서가 아니라, 그저 마땅히 해야 할 일이라 여겨 묵묵히 몸을 놀렸다. 남들이 외면하는 일을 제 일처럼 떠맡는 그 모습을, 마을 사람들은 그저 미련한 탓으로만 돌렸다.</p>
          <p>그러나 돌이켜 보면 그 숱한 궂은일이 다 황만근의 손을 거쳐 치러졌으니, 마을은 알게 모르게 그에게 큰 빚을 지고 있었던 셈이다. 다만 아무도 그것을 빚이라 여기지 않았을 뿐이다. 누가 알아주지 않아도 그는 조금도 개의치 않았다. 마을 한구석이 더러우면 말없이 치웠고, 길이 막히면 묵묵히 터놓았다. 그렇게 황만근의 손길이 닿지 않은 곳이 마을에는 거의 없다시피 했다. 그런데도 사람들은 그 공을 당연한 것으로만 알았지, 끝내 고마운 줄을 몰랐다. 묵묵히 손해 보며 사는 것, 그것이 바로 황만근이라는 사람이었다.</p>

          <p class="section-title">Part 4. 어머니와 아들</p>
          <p>황만근에게는 목숨처럼 지켜야 할 두 사람이 있었다. 늙은 홀어머니와 어린 아들 영호였다. 그는 둘도 없는 효자였다. 제 몸이 고단해도 어머니의 끼니와 약을 먼저 챙겼고, 궂은 날이면 어머니가 거동하기 편하도록 손수 길을 쓸었다. 어머니를 모시는 그의 정성은 마을에서도 모르는 이가 없을 만큼 지극했다. 일찍이 아내는 그런 가난하고 어리숙한 그를 끝내 견디지 못하고 집을 떠나 버렸다. 그 뒤로 황만근은 홀로 아들 영호를 키웠다. 아비 노릇이라고 유난스럽지는 않았으나, 제가 먹지 못해도 자식은 먹였고, 제가 헐벗어도 자식은 입혔다. 어머니와 아들, 그 두 사람을 위해서라면 그는 어떤 고생도 마다하지 않았다.</p>
          <p>바보라 손가락질받는 사내였지만, 피붙이를 건사하는 그 마음만은 세상 어느 영악한 가장보다도 깊고 든든했다. 가진 것 없는 살림 속에서도 그 작은 식구는, 황만근의 묵묵한 등에 기대어 하루하루를 살아갔다. 어머니가 편찮으시면 밤을 새워 간호했고, 영호가 아프면 제 일을 제쳐 두고 둘러업고 뛰었다. 가난이 그들의 살림을 늘 쪼들리게 했지만, 황만근의 넓은 등은 두 사람에게 더없이 든든한 울타리였다. 세상은 그를 하찮게 여겼어도, 그 집안에서만큼은 그가 하늘 같은 가장이었다.</p>

          <p class="section-title">Part 5. 빚에 짓눌린 농촌</p>
          <p>그 무렵 농촌은 빚더미에 짓눌려 신음하고 있었다. 정부는 농민들에게 농사를 키우라며 빚을 내어 경운기며 트랙터 같은 농기계를 사들이게 부추겼다. 소를 더 먹이고 땅을 더 부치면 살림이 나아지리라는 말에, 마을 사람들은 너도나도 빚을 얻었다. 그러나 막상 농사를 키워 본들 돌아오는 것은 빚뿐이었다. 애써 거둔 곡식 값은 제자리인데 갚아야 할 이자는 눈덩이처럼 불어나, 농가마다 빚에 허리가 휘었다. 농기계는 녹슬어 가고, 빚 독촉은 날로 심해졌다. 그런데 이 와중에도 황만근만은 달랐다. 그는 애초에 제 분수에 넘치는 빚을 지지 않았다. 남들이 기계를 들이고 규모를 늘릴 때에도, 그는 제 힘으로 지을 수 있는 만큼만 우직하게 농사를 지었다.</p>
          <p>빚을 내어 욕심을 부리느니, 적게 거두어도 제 땀으로 떳떳이 사는 편이 낫다는 것이었다. 사람들은 그런 그를 또 미련하다 비웃었지만, 빚에 짓눌린 그들에 비하면 황만근의 살림은 가난해도 한결 홀가분했다. 빚을 못 갚아 야반도주하듯 마을을 떠나는 집이 하나둘 생겨났고, 인심마저 날로 메말라 갔다. 그런 가운데 황만근의 고집스러운 농사는 유난스레 미련해 보였다. 그러나 적어도 그는 빚 독촉에 밤잠을 설치는 일만은 없었다. 제 분수를 아는 그 삶이, 요란한 욕심보다 오히려 단단했던 것이다.</p>

          <p class="section-title">Part 6. 농민 궐기대회</p>
          <p>마침내 마을에 농민 궐기대회 소식이 전해졌다. 빚에 짓눌린 농민들이 한데 모여, 농가부채를 탕감해 달라고 목소리를 높이는 자리였다. 가까운 읍내보다 훨씬 더 먼 곳에서 큰 집회가 열린다고 했다. 이장은 마을 사람들을 불러 모아, 이번 대회에 꼭 참가해야 한다고 목소리를 높였다. 그러면서 한 가지 방침을 전했다. 다름 아니라, 저마다 경운기를 몰고 가서 농민의 세를 당당히 보이자는 것이었다. 수많은 경운기가 줄지어 대회장으로 몰려가면, 그 광경만으로도 농민들의 분노와 결기를 똑똑히 드러낼 수 있으리라는 생각에서였다. 이장의 말에 사람들은 저마다 고개를 끄덕였다.</p>
          <p>옳은 말이다, 당연히 그래야 한다며 입을 모았다. 빚에 시달리던 터라, 대회에 나가 억울함을 쏟아 내자는 데에는 누구도 이견이 없었다. 적어도 그 자리에서만큼은, 모두가 경운기를 몰고 함께 나아갈 것처럼 결의에 차 보였다. 황만근도 그 한자리에서 이장의 말을 가만히, 그러나 누구보다 깊이 새겨듣고 있었다. 사람들은 저마다 주먹을 불끈 쥐며 반드시 참가하겠노라 다짐했다. 그 자리의 뜨거운 열기만 보아서는, 온 마을이 경운기를 몰고 나설 것만 같았다. 그러나 뜨거운 결의와 실제 행동은 늘 별개의 것이었다.</p>

          <p class="section-title">Part 7. 말과 행동이 다른 사람들</p>
          <p>그러나 막상 대회 날이 밝자, 사람들의 결의는 온데간데없이 사라졌다. 경운기를 몰고 먼 길을 가자던 약속은, 번거롭고 고되다는 이유로 슬그머니 뒷전으로 밀려났다. 느려 터진 경운기로 그 먼 데까지 어떻게 가느냐는 것이었다. 똑똑한 마을 사람들은 저마다 더 편한 길을 택했다. 더러는 버스나 트럭을 얻어 타고 갔고, 더러는 이런저런 핑계를 대며 아예 가지 않았다. 입으로는 농민의 단결이니 세력 과시니 그럴듯한 말을 늘어놓던 이들이었다. 그러나 정작 제 몸으로 그 말을 지키는 사람은 아무도 없었다. 말과 행동이 그렇게 따로 놀았다. 오직 한 사람, 황만근만이 달랐다.</p>
          <p>그는 이장이 한 말을 조금도 의심하지 않았다. 경운기를 몰고 가라 했으니 경운기를 몰고 가는 것이 마땅하다고, 그는 곧이곧대로 믿었다. 영악한 셈속도, 몸을 사리는 꾀도 그에게는 없었다. 남들이 다 말을 저버릴 때, 그 어리숙한 사내만이 홀로 그 말을 제 몸으로 지키려 하고 있었다. 그럴듯한 명분을 앞세우던 이들일수록, 정작 제 몸이 고될 일에는 누구보다 먼저 발을 뺐다. 민씨는 그 씁쓸한 광경을 말없이 지켜보았다. 말만 번지르르한 세상에, 그 말을 곧이곧대로 믿고 지키려는 황만근이 도리어 유별나 보일 지경이었다.</p>

          <p class="section-title">Part 8. 황만근의 마지막 길</p>
          <p>대회 전날 밤, 황만근은 길 떠날 채비를 하다 말고 민씨를 찾아왔다. 두 사람은 호롱불 아래 마주 앉아 밤이 깊도록 이야기를 나누었다. 그 자리에서 황만근은 제 나름의 농사 철학을 드문드문 풀어놓았다. 빚을 내어 욕심을 부리면 끝내 그 빚에 잡아먹히고 만다는 것, 농사란 제 땅과 제 힘에 맞게 정직하게 지어야 한다는 것이었다. 꾸밈없는 그 말들이 민씨에게는 어느 똑똑한 사람의 말보다도 깊고 묵직하게 다가왔다. 이윽고 날이 밝자, 황만근은 낡은 경운기에 올라탔다. 탈탈거리는 경운기를 몰고, 그는 홀로 먼 대회장을 향해 길을 나섰다. 느릿느릿 멀어져 가는 그 뒷모습을, 민씨는 한참이나 말없이 바라보았다.</p>
          <p>다른 사람들은 다 꾀를 부려 빠졌는데, 저 우직한 사내만이 홀로 약속을 지키러 가는구나 싶었다. 그러나 그때까지만 해도 민씨는 미처 알지 못했다. 그 길이 황만근의 마지막 길이 되리라는 것을 말이다. 민씨는 그 투박한 말 속에 담긴 올곧음에 가슴이 서늘해졌다. 배운 티를 내는 누구의 말보다도, 그 말은 참되고 또 무거웠다. 떠나는 황만근의 뒷모습은 작고 초라했으나, 민씨의 눈에는 그 어떤 거인보다도 크고 꿋꿋하게 비쳤다. 민씨는 그 겨울밤의 대화를 오래도록 잊지 못했다.</p>

          <p class="section-title">Part 9. 돌아온 유골</p>
          <p>그러나 황만근은 끝내 마을로 돌아오지 못했다. 먼 대회장까지 느린 경운기로 다녀오는 길은 너무도 멀고 험했다. 대회를 마치고 돌아오던 밤, 그만 경운기가 고장으로 멈춰 서 버렸다. 인적 하나 없는 캄캄한 길 위에서 오도 가도 못하게 된 그는, 깊어 가는 겨울밤의 추위를 끝내 견디지 못했다. 그 우직한 사내는 그렇게 차가운 길바닥에서 홀로 쓸쓸히 숨을 거두었다. 아무도 그의 곁을 지켜 주지 못한 외로운 죽음이었다. 그가 떠난 지 일주일이 지나서야, 아들 영호가 멀리서 아버지의 유골을 수습해 돌아왔다. 살아 돌아오리라 믿었던 황만근은, 한 줌 뼈가 되어서야 비로소 마을로 돌아온 것이다.</p>
          <p>뒤늦게 그 소식이 전해지자, 황만근을 바보라 비웃던 마을 사람들도 차마 말을 잇지 못했다. 누구도 지키지 않은 약속을 홀로 지키려다, 그 우직한 사람이 끝내 목숨까지 잃고 만 것이었다. 민씨는 차마 그 유골 앞에 바로 설 수가 없었다. 바보라 비웃음을 받으면서도 끝까지 약속을 저버리지 않은 그 우직함이, 도리어 그를 죽음으로 몰아간 셈이었다. 그러나 그것은 결코 어리석음이 아니라, 아무나 가질 수 없는 지독한 정직함이었다. 민씨의 가슴속에서 무언가가 묵직하게 무너져 내렸다. 그 무엇으로도 돌이킬 수 없는 일이었다.</p>

          <p class="section-title">Part 10. 황 선생을 기리며</p>
          <p>민씨는 황만근의 죽음 앞에서 오래도록 깊은 생각에 잠겼다. 세상 사람들이 바보라 손가락질하던 그가, 실은 누구보다 정직하고 헌신적인 사람이었음을 그는 뒤늦게 사무치게 깨달았다. 영악한 이들이 말만 앞세우고 제 몸을 사릴 때, 황만근은 묵묵히 그 말을 제 몸으로 지켰다. 마을의 궂은일을 도맡고, 어머니와 자식을 건사하고, 분수에 맞게 정직하게 살다가, 끝내 남들이 저버린 약속을 홀로 지키다 죽었다. 그런 사람을 어찌 한낱 바보라 부를 수 있단 말인가. 민씨가 보기에 황만근이야말로 이 각박한 세상에 드문 참된 사람, 말없는 성인이었다. 민씨는 붓을 들어, 그 어리숙하고도 거룩했던 삶을 기리는 글을 묘비명처럼 써 내려갔다.</p>
          <p>여기, 평생 남을 위해 묵묵히 일하고도 바보라 불린 한 사람이 있었다고. 그리고 그 바보야말로, 우리 가운데 가장 곧고 가장 사람다운 사람이었다고. 그 짧은 비문에, 민씨는 못다 한 존경과 애도를 모두 담았다. 어쩌면 세상은 이런 사람을 바보라 부르며 밀어내고, 그 희생 위에서 태연히 굴러가는지도 몰랐다. 민씨의 글은 한 사람을 위한 추모를 넘어, 영악함만을 좇는 세상을 향한 조용한 꾸짖음이기도 했다. 황만근은 그렇게, 말없이 자신의 삶으로 말하고 있었다.</p>

          <p>그러나 사람들은 대수롭지 않다는 듯 심드렁할 뿐이었다. 바보 같은 황만근이 제풀에 돌아오겠거니 하는 투였다. 마을의 온갖 궂은일을 도맡아 온 그가 사라졌는데도, 아무도 그 부재를 심각하게 여기지 않았다. 오직 민씨만이 가슴이 서늘했다. 있을 때는 아무도 거들떠보지 않다가, 사라지고 나서야 비로소 그 빈자리가 얼마나 큰지 느끼게 되는 사람이 있는 법이었다.</p>

          <p class="section-title">Part 2. 마을의 반편이</p>
          <p>마을 사람들에게 황만근은 오래전부터 그저 반편이 취급을 받았다. 어려서부터 그는 또래보다 굼뜨고 어수룩해, 사람들의 놀림과 손가락질 속에서 자랐다. 말도 어눌하고 하는 짓도 미련해 보여, 누구 하나 그를 온전한 사람으로 쳐 주지 않았다. 그러나 민씨가 가까이에서 지켜본 황만근은 사람들이 말하는 그런 바보가 아니었다. 셈에 밝지 못하고 제 잇속을 챙길 줄 모를 뿐, 그 마음만은 누구보다 맑고 어질었다.</p>
          <p>거짓을 꾸밀 줄도, 남을 속일 줄도 몰랐다. 세상이 영악하게 돌아가는 이치를 모른다는 것이, 그에게는 도리어 흉이 되어 돌아왔다. 어리석어 보이는 그 우직함 속에, 실은 쉬이 흉내 낼 수 없는 어떤 올곧음이 깊이 깃들어 있었다. 세상이 그를 바보라 부를수록, 그 맑은 마음의 결은 도리어 더욱 도드라져 보였다.</p>

          <p class="section-title">Part 3. 마을의 일꾼</p>
          <p>황만근은 마을에서 아무도 하려 들지 않는 궂은일을 도맡아 하는 사람이었다. 동네에 초상이 나면 남들이 꺼리는 험한 일을 그가 나서서 했고, 더럽고 힘든 일이라면 으레 그의 몫으로 돌아왔다. 가뭄에 마른 도랑을 치고, 눈이 오면 길을 쓸고, 품이 많이 드는 일에는 언제나 그가 불려 나왔다. 그러면서도 변변한 품삯 한 번 제대로 받은 적이 없었다. 사람들은 당연하다는 듯 그를 부렸고, 고맙다는 말조차 아꼈다.</p>
          <p>그래도 황만근은 싫은 내색 한 번 하지 않았다. 누가 시켜서가 아니라, 그저 마땅히 해야 할 일이라 여겨 묵묵히 몸을 놀렸다. 돌이켜 보면 그 숱한 궂은일이 다 황만근의 손을 거쳐 치러졌으니, 마을은 알게 모르게 그에게 큰 빚을 지고 있었던 셈이다. 다만 아무도 그것을 빚이라 여기지 않았을 뿐이다.</p>

          <p class="section-title">Part 4. 어머니와 아들</p>
          <p>황만근에게는 목숨처럼 지켜야 할 두 사람이 있었다. 늙은 홀어머니와 어린 아들 영호였다. 그는 둘도 없는 효자였다. 제 몸이 고단해도 어머니의 끼니와 약을 먼저 챙겼고, 궂은 날이면 어머니가 거동하기 편하도록 손수 길을 쓸었다. 일찍이 아내는 가난하고 어리숙한 그를 끝내 견디지 못하고 집을 떠나 버렸다. 그 뒤로 황만근은 홀로 아들 영호를 키웠다.</p>
          <p>제가 먹지 못해도 자식은 먹였고, 제가 헐벗어도 자식은 입혔다. 어머니와 아들, 그 두 사람을 위해서라면 그는 어떤 고생도 마다하지 않았다. 바보라 손가락질받는 사내였지만, 피붙이를 건사하는 그 마음만은 세상 어느 영악한 가장보다도 깊고 든든했다. 가진 것 없는 살림 속에서도 그 작은 식구는, 황만근의 묵묵한 등에 기대어 하루하루를 살아갔다. 세상은 그를 하찮게 여겼어도, 그 집안에서만큼은 그가 하늘 같은 가장이었다.</p>

          <p class="section-title">Part 5. 빚에 짓눌린 농촌</p>
          <p>그 무렵 농촌은 빚더미에 짓눌려 신음하고 있었다. 정부는 농민들에게 농사를 키우라며 빚을 내어 경운기며 트랙터 같은 농기계를 사들이게 부추겼다. 땅을 더 부치면 살림이 나아지리라는 말에, 마을 사람들은 너도나도 빚을 얻었다. 그러나 막상 농사를 키워 본들 돌아오는 것은 빚뿐이었다. 곡식 값은 제자리인데 갚아야 할 이자는 눈덩이처럼 불어나, 농가마다 빚에 허리가 휘었다.</p>
          <p>그런데 이 와중에도 황만근만은 달랐다. 그는 애초에 제 분수에 넘치는 빚을 지지 않았다. 남들이 기계를 들이고 규모를 늘릴 때에도, 그는 제 힘으로 지을 수 있는 만큼만 우직하게 농사를 지었다. 빚을 내어 욕심을 부리느니, 적게 거두어도 제 땀으로 떳떳이 사는 편이 낫다는 것이었다. 사람들은 그런 그를 또 미련하다 비웃었지만, 빚에 짓눌린 그들에 비하면 황만근의 살림은 가난해도 한결 홀가분했다.</p>

          <p class="section-title">Part 6. 농민 궐기대회</p>
          <p>마침내 마을에 농민 궐기대회 소식이 전해졌다. 빚에 짓눌린 농민들이 한데 모여, 농가부채를 탕감해 달라고 목소리를 높이는 자리였다. 가까운 읍내보다 훨씬 더 먼 곳에서 큰 집회가 열린다고 했다. 이장은 마을 사람들을 불러 모아, 이번 대회에 꼭 참가해야 한다고 목소리를 높였다. 그러면서 한 가지 방침을 전했다.</p>
          <p>저마다 경운기를 몰고 가서 농민의 세를 당당히 보이자는 것이었다. 수많은 경운기가 줄지어 대회장으로 몰려가면, 그 광경만으로도 농민들의 분노와 결기를 똑똑히 드러낼 수 있으리라는 생각에서였다. 이장의 말에 사람들은 저마다 고개를 끄덕이며, 당연히 그래야 한다고 입을 모았다. 황만근도 그 한자리에서 이장의 말을 가만히, 그러나 누구보다 깊이 새겨듣고 있었다. 그 자리의 뜨거운 열기만 보아서는, 온 마을이 경운기를 몰고 나설 것만 같았다.</p>

          <p class="section-title">Part 7. 말과 행동이 다른 사람들</p>
          <p>그러나 막상 대회 날이 밝자, 사람들의 결의는 온데간데없이 사라졌다. 경운기를 몰고 먼 길을 가자던 약속은, 번거롭고 고되다는 이유로 슬그머니 뒷전으로 밀려났다. 느려 터진 경운기로 그 먼 데까지 어떻게 가느냐는 것이었다. 사람들은 저마다 더 편한 길을 택했다. 더러는 버스나 트럭을 얻어 타고 갔고, 더러는 핑계를 대며 아예 가지 않았다. 입으로는 농민의 단결이니 세력 과시니 그럴듯한 말을 늘어놓던 이들이었다.</p>
          <p>그러나 정작 제 몸으로 그 말을 지키는 사람은 아무도 없었다. 오직 한 사람, 황만근만이 달랐다. 그는 이장이 한 말을 조금도 의심하지 않았다. 경운기를 몰고 가라 했으니 그리하는 것이 마땅하다고, 그는 곧이곧대로 믿었다. 남들이 다 말을 저버릴 때, 그 어리숙한 사내만이 홀로 그 말을 제 몸으로 지키려 하고 있었다.</p>

          <p>대회 전날 밤, 황만근은 길 떠날 채비를 하다 말고 민씨를 찾아왔다. 두 사람은 호롱불 아래 마주 앉아 밤이 깊도록 이야기를 나누었다. 그 자리에서 황만근은 제 나름의 농사 철학을 드문드문 풀어놓았다. 빚을 내어 욕심을 부리면 끝내 그 빚에 잡아먹히고 만다는 것, 농사란 제 땅과 제 힘에 맞게 정직하게 지어야 한다는 것이었다. 꾸밈없는 그 말들이 민씨에게는 어느 똑똑한 사람의 말보다도 깊고 묵직하게 다가왔다.</p>
          <p>이윽고 날이 밝자, 황만근은 낡은 경운기에 올라탔다. 탈탈거리는 경운기를 몰고, 그는 홀로 먼 대회장을 향해 길을 나섰다. 느릿느릿 멀어져 가는 그 뒷모습을, 민씨는 한참이나 말없이 바라보았다. 그러나 그때까지만 해도 민씨는 미처 알지 못했다. 그 길이 황만근의 마지막 길이 되리라는 것을 말이다.</p>

          <p>그가 떠난 지 일주일이 지나서야, 아들 영호가 멀리서 아버지의 유골을 수습해 돌아왔다. 살아 돌아오리라 믿었던 황만근은, 한 줌 뼈가 되어서야 비로소 마을로 돌아온 것이다. 뒤늦게 그 소식이 전해지자, 황만근을 바보라 비웃던 마을 사람들도 차마 말을 잇지 못했다. 누구도 지키지 않은 약속을 홀로 지키려다, 그 우직한 사람이 끝내 목숨까지 잃고 만 것이었다.</p>

          <p class="section-title">Part 2. 적이 된 두 아들</p>
          <p>두 할머니 사이에는 남모를 깊은 사연이 하나 가로놓여 있었다. 다름 아니라, 두 분의 아들이 서로 총부리를 겨누는 적이 되어 있었던 것이다. 외할머니의 아들, 그러니까 나의 외삼촌은 국군이 되어 전쟁터에 나가 있었다. 반면 친할머니의 아들인 나의 삼촌은, 산으로 들어가 빨치산이 되어 있었다. 한쪽은 나라를 지키는 군인이요, 한쪽은 그에 맞서는 인민군 편이었으니, 같은 핏줄로 얽힌 한집안에서 두 아들이 서로 다른 편에 서 버린 셈이었다. 세상이 둘로 갈라지면서, 그 갈라진 금이 바로 우리 집 안방을 가로지르고 있었던 것이다. 그래도 아직은 두 할머니 모두 제 아들이 무사하기만을 애타게 빌 뿐이었다.</p>
          <p>외할머니는 외삼촌이 전장에서 살아 돌아오기를 빌었고, 친할머니는 삼촌이 산에서 무사하기를 빌었다. 서로 반대편에 선 아들을 둔 두 어머니가 한 지붕 아래서 각자의 자식을 위해 기도하는 모습을, 어린 나는 그저 묵묵히 지켜볼 뿐이었다. 나는 그 두 분이 서로의 아들이 적이 되었다는 사실을 두고 속으로 어떤 마음일지 짐작조차 할 수 없었다. 겉으로는 서로 아무렇지 않은 척했지만, 두 할머니의 가슴속에서는 이미 보이지 않는 불안이 조금씩 자라나고 있었던 것이다. 어린 나는 그저 두 할머니의 굳은 얼굴만 번갈아 살필 뿐이었다.</p>

          <p class="section-title">Part 3. 외삼촌의 전사</p>
          <p>그러던 어느 날, 끝내 우리 집에 비보가 날아들었다. 전쟁터에 나가 있던 외삼촌이 그만 전사하고 말았다는 소식이었다. 국군 소위로 용감히 싸우던 외삼촌이, 어느 전투에서 꽃다운 목숨을 잃고 말았다는 것이다. 그 소식을 들은 외할머니는 그 자리에서 폭삭 주저앉고 말았다. 하나뿐인 아들을 잃은 어미의 슬픔은 차마 눈 뜨고 볼 수 없을 만큼 처절했다. 외할머니는 땅을 치고 가슴을 쥐어뜯으며, 목이 쉬도록 통곡하고 또 통곡했다. 집안은 온통 울음바다가 되었다. 어린 나조차도 그 비통한 울음소리에 가슴이 미어지는 듯했다. 장맛비는 그런 외할머니의 설움을 아는지 모르는지, 그날도 추적추적 끝없이 내리고 있었다.</p>
          <p>자식을 가슴에 묻은 외할머니의 통곡은 밤이 깊도록 그칠 줄을 몰랐다. 그리고 그 깊은 슬픔은 이윽고, 제 아들을 빼앗아 간 자들에 대한 무서운 원망으로 서서히 변해 가고 있었다. 나는 그 낯설고도 무서운 울음 앞에서 어찌할 바를 몰라 방 한구석에 쪼그려 앉아 있을 뿐이었다. 자식을 앞세운 어미의 슬픔이 얼마나 깊고 무서운 것인지, 그때 나는 어렴풋이 느꼈다. 외할머니의 눈빛은 어느새 슬픔을 지나 서늘한 노여움으로 물들어 가고 있었다. 그 비통한 밤은 유난히도 길고 어두웠다.</p>

          <p class="section-title">Part 4. 저주와 갈등</p>
          <p>슬픔이 극에 달하자, 외할머니의 통곡은 끝내 무서운 저주로 터져 나왔다. 외할머니는 하늘을 향해 울부짖으며, 제 아들을 죽인 빨갱이들을 모조리 벼락 맞아 죽으라고, 씨도 남기지 말고 쓸어 가라고 모진 저주를 퍼부었다. 그러나 외할머니는 미처 생각지 못했다. 바로 그 저주를 듣고 있는 친할머니의 아들이, 다름 아닌 빨치산이라는 것을 말이다. 친할머니는 그 말을 듣는 순간 얼굴이 하얗게 질리고 말았다. 제 아들더러 벼락 맞아 죽으라는 소리나 다름없었으니, 그 가슴이 어떠했겠는가. 친할머니는 부들부들 떨며 외할머니에게 대들었다. 어찌 그런 모진 말을 할 수 있느냐는 것이었다.</p>
          <p>그렇게 두 할머니는 서로의 아들을 사이에 두고 돌이킬 수 없이 등을 돌리고 말았다. 사돈지간의 정은 온데간데없이 사라지고, 그 자리에는 깊은 미움과 원망만이 들어섰다. 다정하던 한집안이 전쟁으로 인해 두 쪽으로 쩍 갈라져 버린 것이다. 어린 나는 두 할머니 사이에 흐르는 그 험악한 기운에 그만 숨이 막힐 것만 같았다. 같은 집에 살면서도 서로를 원수처럼 여기게 된 두 분을 보며, 나는 전쟁이란 것이 참으로 무섭고 모진 것임을 비로소 어렴풋이 깨달았다. 집안의 공기는 커다란 돌덩이처럼 무겁게 가라앉고 말았다.</p>

          <p class="section-title">Part 5. 얼어붙은 집안</p>
          <p>그날 이후로 우리 집안은 숨이 막힐 듯 얼어붙고 말았다. 두 할머니는 한 지붕 아래 살면서도 서로 말 한마디 섞지 않았다. 밥상도 따로 받고, 길에서 마주쳐도 고개를 홱 돌려 버렸다. 한때 그토록 정답던 두 분이 이제는 원수처럼 서로를 미워하니, 집안에는 늘 살얼음판 같은 긴장이 감돌았다. 그 사이에 낀 어린 나는 어느 쪽 편도 들 수가 없어, 두 할머니의 눈치를 보느라 하루하루가 조마조마했다. 친할머니에게 다가가면 외할머니가 서운해할까 겁이 났고, 외할머니를 따르면 친할머니가 노여워할까 조심스러웠다. 어른들의 그 깊은 미움을, 어린 나로서는 도무지 어찌할 도리가 없었다.</p>
          <p>집 안에는 늘 축축한 장마 냄새와 함께 무거운 침묵이 깔려 있었다. 끝없이 내리는 궂은비처럼, 두 할머니 사이의 골도 날이 갈수록 깊어만 갔다. 나는 이 지긋지긋한 장마가, 또 이 집안의 싸늘한 냉기가 언제쯤 걷힐지 그저 막막하기만 했다. 나는 어서 이 비가 그치고 두 할머니가 예전처럼 도란도란 이야기를 나누는 날이 오기만을 속으로 간절히 빌었다. 그러나 비도 미움도 좀처럼 그칠 기미를 보이지 않았다. 어린 내 마음에도 그 끝 모를 장마는 참으로 지겹고 또 서러웠다. 그 끝없는 기다림의 끝은 좀처럼 보이지 않았다.</p>

          <p class="section-title">Part 6. 아들을 기다리는 친할머니</p>
          <p>그런 가운데, 친할머니는 산으로 간 아들을 애타게 기다리고 있었다. 하루는 친할머니가 용하다는 점쟁이를 찾아가 아들의 안부를 물었다. 점쟁이는 친할머니에게, 아들이 머지않아 꼭 집으로 돌아올 것이라고 일러 주었다. 그것도 아무 날 아무 시에 틀림없이 돌아오리라고, 날짜까지 콕 집어 말해 주었다. 그 말을 철석같이 믿은 친할머니는 그날부터 들뜨기 시작했다. 아들이 돌아온다는 그날이 가까워지자, 친할머니는 온 정성을 다해 준비를 했다. 집 안팎을 말끔히 쓸고 닦고, 없는 살림을 털어 아들이 좋아하던 음식을 정성껏 장만했다. 오랫동안 집을 비운 아들을 맞이할 생각에, 친할머니의 주름진 얼굴에는 오랜만에 화색이 돌았다.</p>
          <p>나 역시 삼촌이 정말로 돌아올까 싶어 은근히 마음이 설레었다. 드디어 점쟁이가 말한 바로 그날이 밝았다. 친할머니는 아침부터 사립문 앞을 서성이며, 행여 아들이 올까 하여 눈이 빠지도록 길목을 바라보고 있었다. 그 모습을 가만히 지켜보는 내 마음도 덩달아 두근거리기 시작했다. 돌아올 아들을 기다리는 친할머니의 그 간절함이, 어린 나에게까지 고스란히 전해져 왔기 때문이다. 나는 조마조마한 마음으로 그 하루를 친할머니와 함께 지켜보았다.</p>

          <p class="section-title">Part 7. 구렁이가 나타나다</p>
          <p>그러나 날이 저물도록 기다리던 아들은 끝내 오지 않았다. 바로 그때, 집안을 발칵 뒤집어 놓는 일이 벌어졌다. 난데없이 커다란 구렁이 한 마리가 집 안에 모습을 드러낸 것이다. 징그럽게 몸뚱이가 굵은 구렁이가, 마당의 감나무 가지를 칭칭 감고 축 늘어져 있었다. 그 끔찍한 광경에 집안은 삽시간에 아수라장이 되었다. 여자들은 비명을 지르며 달아났고, 아이들은 울음을 터뜨렸다. 모두가 겁에 질려 어쩔 줄을 몰라 했다. 그런데 뒤늦게 그 구렁이를 본 친할머니는, 그만 외마디 소리를 지르며 그 자리에서 혼절하여 쓰러지고 말았다. 아들이 돌아온다던 바로 그날, 아들 대신 나타난 그 흉측한 구렁이를 보고 무언가를 직감했던 것이다.</p>
          <p>집안은 울음과 비명과 혼란으로 뒤죽박죽이 되었다. 쓰러진 친할머니를 둘러업고 안방으로 모시는 사이에도, 그 구렁이는 감나무에 몸을 감은 채 꿈쩍도 하지 않았다. 장맛비는 그런 소동을 아는지 모르는지, 그날도 세차게 퍼붓고 있었다. 어린 나는 그 광경이 하도 무서워 어머니의 치맛자락 뒤로 숨어 그저 벌벌 떨 수밖에 없었다. 아들이 돌아온다던 날 아들 대신 나타난 구렁이라니, 온 집안에는 불길한 기운만이 짙게 감돌았다. 어린 나는 그저 숨을 죽인 채 그 자리에 얼어붙어 있을 뿐이었다.</p>

          <p class="section-title">Part 8. 삼촌의 넋이런가</p>
          <p>정신을 잃었던 친할머니는 끝내 깨어나지 못하고 자리에 몸져눕고 말았다. 집안 사람들은 그 구렁이를 어떻게든 쫓아내려고 갖은 애를 썼다. 작대기로 건드려 보고 돌을 던져도 보았지만, 구렁이는 조금도 꿈쩍하지 않았다. 마치 그 집을 떠날 생각이 없다는 듯, 감나무를 감은 채 그저 가만히 똬리를 틀고 있을 뿐이었다. 그러자 사람들 사이에서 수군거림이 일기 시작했다. 아무래도 저 구렁이가 예사 짐승이 아니라는 것이었다. 하필 아들이 돌아온다던 그날, 아들 대신 나타난 구렁이라니. 사람들은 그것이 바로 산에서 죽은 삼촌의 넋, 곧 삼촌의 화신이 분명하다고 입을 모았다.</p>
          <p>돌아오지 못한 아들이 구렁이가 되어서라도 그리운 집을 찾아온 것이라고들 했다. 그 말을 듣자 집안은 더욱 술렁였다. 어린 나 역시 그 구렁이가 정말로 삼촌의 넋일지도 모른다는 생각에, 온몸에 소름이 돋고 가슴이 서늘해졌다. 아무도 선뜻 그 구렁이에게 다가서지 못한 채, 모두 겁에 질려 발만 동동 구를 뿐이었다. 어른들조차 감히 손을 대지 못하고 쩔쩔매는 그 광경에, 나는 더럭 겁이 나고 말았다. 돌아오지 못한 삼촌이 정말로 저 구렁이가 되어 돌아온 것이라면, 그 맺힌 한을 대체 어찌 풀어 주어야 할지 아무도 알지 못했다.</p>

          <p class="section-title">Part 9. 외할머니가 달래다</p>
          <p>바로 그때, 뜻밖의 사람이 선뜻 나섰다. 다름 아닌 외할머니였다. 아들을 잃고 빨갱이를 저주하던 바로 그 외할머니가, 조용히 구렁이 앞으로 걸어 나간 것이다. 외할머니는 마치 죽은 사돈의 아들을 대하듯, 구렁이를 향해 다정하고 나지막한 목소리로 말을 건네기 시작했다. 먼 길 오느라 고생했으니 이제 그만 편히 돌아가라고, 집안일은 염려 말고 부디 좋은 곳으로 가라고 곡진히 타일렀다. 그러고는 혼절해 누운 친할머니의 머리카락을 몇 올 가만히 빗겨 거두어다가, 그것을 불에 살라 구렁이를 조심스레 떠나보내려 했다. 신기하게도, 그렇게 외할머니가 정성껏 달래자 그토록 꿈쩍 않던 구렁이가 스르르 몸을 풀기 시작했다.</p>
          <p>이윽고 구렁이는 감나무에서 천천히 미끄러져 내려오더니, 담을 넘어 어디론가 조용히 사라져 버렸다. 제 아들을 죽인 쪽을 저주하던 외할머니가, 도리어 그 반대편 아들의 넋을 제 손으로 고이 달래어 보낸 것이었다. 그 모습을 지켜보던 집안 사람들은 모두 숙연해지고 말았다. 아무도 선뜻 나서지 못하던 그 일을, 하필 가장 깊이 상처받았던 외할머니가 해낸 것이었다. 그 다정한 손길 앞에서는 미움도 원망도 한낱 부질없는 것이 되고 마는 듯했다. 나는 그 숙연한 광경을 바라보며 어린 가슴이 뭉클해졌다.</p>

          <p class="section-title">Part 10. 화해, 그리고 걷힌 장마</p>

          <p class="section-title">Part 5. 그림의 떡, 입주권</p>
          <p>집을 헐리는 대가로, 가족에게는 입주권이라는 것이 주어졌다. 재개발로 새로 짓는 아파트에 들어갈 수 있는 권리, 사람들이 '딱지'라고 부르는 종잇조각이었다. 겉보기에는 그럴듯한 보상 같았다. 그러나 거기에는 함정이 있었다. 그 입주권을 가지고 실제로 아파트에 들어가려면, 적지 않은 웃돈을 따로 마련해야 했다. 하루 벌어 하루를 사는 난쟁이 가족에게 그런 큰돈이 있을 리 없었다. 손에 입주권을 쥐고도 아파트는 그림의 떡일 뿐이었다. 바로 그 틈을 노리고, 투기꾼들이 벌 떼처럼 동네로 몰려들었다. 그들은 돈 없는 철거민들의 딱지를 헐값에 사들여, 그것으로 큰 이문을 챙기려는 자들이었다.</p>

          <p class="section-title">Part 6. 헐값에 팔려 간 보금자리</p>
          <p>끝내 난쟁이 가족도 그 입주권을 팔 수밖에 없었다. 당장 거처를 옮길 돈도, 끼니를 이을 돈도 없었으니, 손에 쥔 딱지라도 팔아 급한 불을 꺼야 했다. 투기꾼들은 그 다급한 처지를 놓치지 않았다. 그들은 입주권의 제값에 한참 못 미치는 헐값을 내밀며, 가족을 몰아세우듯 흥정을 했다. 결국 가족은 제대로 된 값도 받지 못한 채, 그 소중한 딱지를 넘기고 말았다. 집을 헐린 것도 서러운데, 보상으로 받은 권리마저 헐값에 빼앗기다시피 팔아넘긴 것이다. 집도 잃고, 아파트도 갈 수 없게 된 가족은 그야말로 오도 가도 못할 처지에 놓였다. 떠나야 할 날은 다가오는데, 식구들이 몸 누일 곳은 어디에도 없었다.</p>
          <p>투기꾼의 농간에 가족은 더욱 깊은 궁지로 몰렸다. 성실하게 살아온 죄밖에 없는 사람들이, 어째서 이토록 무참히 모든 것을 빼앗겨야 하는가. 그 서러운 물음 앞에서 가족은 그저 막막할 뿐이었다. 어린 자식들은 그 부당한 거래를 지켜보면서도 어찌할 도리가 없었다. 가진 것 없는 자에게는 억울함을 호소할 곳조차 없었다. 세상은 힘없는 사람들의 눈물에는 조금도 귀를 기울이지 않았다. 집을 잃은 서러움에 더해, 이제는 당장 오늘 밤 어디서 자야 할지조차 막막하기만 했다. 가족의 앞날에는 짙은 어둠만이 무겁게 드리워져 있었다.</p>

          <p class="section-title">Part 7. 집을 나간 영희</p>
          <p>그렇게 집안이 벼랑 끝으로 몰리던 어느 날, 막내딸 영희가 소리 없이 집을 나갔다. 아직 어린 소녀였으나, 영희는 제 나름의 결심을 품고 있었다. 가족이 헐값에 빼앗기다시피 넘긴 그 입주권을, 어떻게든 되찾아 오겠다는 것이었다. 영희는 그 딱지를 사 간 부동산 사나이, 곧 투기꾼의 뒤를 따라갔다. 어린 영희가 할 수 있는 일이라고는 그 사내의 곁에 머무르며 기회를 엿보는 것뿐이었다. 그것이 얼마나 위험하고 모진 길인지, 영희 또한 모르지 않았다. 그러나 무너져 가는 가족을 지키기 위해, 영희는 제 한 몸을 기꺼이 내던지기로 한 것이다. 집을 나서는 어린 딸의 뒷모습을, 가족은 뒤늦게야 알고 가슴을 쳤다.</p>
          <p>가장 여리고 어린 막내가, 가족 가운데 가장 무거운 짐을 제 어깨에 짊어진 셈이었다. 영희의 가출은 철없는 도망이 아니라, 벼랑 끝에서 가족을 구하려는 처절한 몸부림이었다. 어린 딸이 떠난 빈자리를 바라보며, 가족은 미안함과 안타까움에 차마 말을 잇지 못했다. 그러나 이미 영희는 쉬이 돌아올 수 없는 길로 들어선 뒤였다. 가족을 위해 제 몸을 던진 그 어린 결심이, 모두의 가슴을 더욱 미어지게 했다. 어린 막내의 희생 위에서야 겨우 숨을 돌릴 수 있다는 사실이, 가족에게는 무엇보다 뼈아픈 일이었다.</p>
