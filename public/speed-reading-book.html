          <p class="section-title">Part 2. 시를 주고받다</p>
          <p>타오르는 마음을 끝내 억누르지 못한 이생은, 어느 날 애틋한 그리움을 시 한 수에 곱게 적어 담 안으로 살며시 던져 넣었다. 날마다 담 밑을 서성이며 처녀의 그림자라도 보기를 애타게 바라던 끝에, 가슴속 말을 더는 묻어 둘 수 없어 짜낸 큰 용기였다. 시를 던져 넣고 돌아선 뒤에도 이생은 가슴이 두근거려 밤새 잠을 이루지 못하였다. 뜻밖에 담 너머로 날아든 시를 받아 든 최랑 또한 가슴이 몹시 두근거렸다. 글귀마다 묻어나는 선비의 진심에, 최랑의 고운 얼굴은 어느새 발그레 물들었다.</p>
          <p>사실 최랑 역시 담 너머에서 날마다 서성이던 그 선비를 오래전부터 남몰래 눈여겨보고 있던 터였다. 최랑은 설레는 마음으로 곧 화답하는 시를 지어, 저녁 무렵 아무도 모르게 담 너머로 이생에게 조심스레 던져 보냈다. 서로의 시에 담긴 마음을 확인한 두 사람은, 비록 얼굴을 맞대지는 못했으나 오직 글로써 남몰래 사랑을 키워 나갔다. 날마다 주고받는 시 속에는 못다 한 그리움이 그득 담겨 있었다. 어둠 속에서 날아오는 시 한 장을 기다리는 일이, 이제 두 사람의 가장 큰 즐거움이 되었다. 얼굴 한번 제대로 본 적 없으면서도, 두 사람은 어느새 서로가 아니면 안 될 것만 같아, 날마다 그리움만 하염없이 깊이 쌓여 갔다.</p>
          <p class="section-title">Part 3. 밀회</p>
          <p>날이 갈수록 마음이 간절해진 이생은, 마침내 큰 용기를 내어 담을 넘기로 하였다. 밤이 깊어 인적이 뚝 끊긴 뒤, 그는 뛰는 가슴을 억누르며 숨을 죽이고 조심조심 최랑의 집 후원으로 몰래 숨어들었다. 행여 발을 헛디뎌 인기척이라도 날까 매 순간 마음을 졸였다. 뜻밖의 인기척에 놀란 최랑은 두려우면서도 반가운 마음으로 이생을 맞아들였다. 꿈에도 그리던 임이 눈앞에 서 있으니, 최랑은 행여 집안 사람들이 알아챌까 가슴을 졸이면서도, 그 설레는 마음만은 끝내 감추지 못하였다.</p>
          <p>두 사람은 집 뒤 외진 별당에서 남몰래 마주 앉아, 밤이 새도록 도란도란 끝없이 정담을 나누었다. 시를 읊고 거문고를 타며 서로를 향한 애정을 거듭 확인하였다. 그동안 담을 사이에 두고 애태우던 마음을 비로소 마음껏 털어놓으니, 두 사람의 정은 더욱 깊어만 갔다. 그날 이후 이생은 밤마다 어김없이 담을 넘어 최랑을 찾았고, 희미한 별당의 등불 아래 가만히 마주 앉은 두 사람에게는 세상 그 무엇도 조금도 두렵지 않은 것만 같았다. 거문고 가락이 잦아들면 두 사람은 지난 시절 담 너머로 시를 주고받던 이야기를 하며 밤을 지새웠다. 그러나 부모의 눈을 피한 이 은밀한 사랑이 언제까지나 무사히 이어질 수는 없는 노릇이었다.</p>
          <p class="section-title">Part 4. 부모의 반대</p>
          <p>이생의 수상한 거동을 눈여겨보던 부모는, 마침내 아들이 밤마다 어디론가 몰래 드나드는 것을 알아채고 말았다. 자초지종을 하나하나 캐묻고 비로소 사실을 알게 된 이생의 아버지는 크게 노하였다. 한창 학업에 힘써야 할 아들이 여색에 빠져 집안을 욕되게 한다며 호되게 꾸짖었다. 아버지는 하나뿐인 아들이 앞길을 그르칠까 노심초사하였다. 이생이 무릎을 꿇고 용서를 빌었으나 아버지의 꾸중은 좀처럼 그치지 않았다. 양반가의 자식이 과거 공부는 멀리하고 밤마실만 다니며 처녀의 담을 넘나든다 하니, 완고한 아버지의 노여움은 더욱 컸다.</p>
          <p>아버지는 끝내 이생을 당장 멀리 울주의 시골 농장으로 내려보내기로 하였다. 최랑과 멀찍이 떼어 놓아 그 인연을 아예 끊어 버리려는 심산이었다. 하루아침에 사랑하는 이와 생이별을 하게 된 이생은 가슴이 미어지는 듯하였으나, 서릿발 같은 아버지의 뜻을 차마 거스를 수는 없었다. 한번 결심한 아버지의 뜻은 조금도 꺾을 수 없었던 것이다. 떠나는 날, 이생은 최랑에게 한마디 기별조차 전하지 못한 것이 두고두고 마음에 걸려 차마 발걸음이 떨어지지 않았다. 그렇게 두 사람은 다시 만날 기약도 없이, 서로를 그리워할 틈만 남긴 채 안타깝게 헤어지고 말았다.</p>
          <p class="section-title">Part 5. 상사병과 혼인</p>
          <p>한편 영문도 모른 채 이생의 발길이 뚝 끊긴 최랑은, 날이 갈수록 애가 타들어 갔다. 기다리고 또 기다려도 임이 끝내 오지 않으니, 최랑은 그만 상사병이 들어 자리에 눕고 말았다. 한때 밝고 영특하던 최랑이 하루가 다르게 수척하게 야위어 가니, 집안의 근심이 이만저만이 아니었다. 밤이면 남몰래 눈물로 베개를 적시며 임을 그리워하였다. 식음을 전폐하고 나날이 생기를 잃어 가며 꺼져 가는 딸을 보다 못한 최랑의 부모가, 마침내 딸을 끈질기게 달래어 그 딱한 사연을 알아내었다.</p>
          <p>딸의 목숨이 위태롭다 여긴 최랑의 부모는, 몸소 이생의 집을 찾아가 눈물로 간곡히 혼인을 청하였다. 양가가 거듭 의논한 끝에, 그토록 완강하던 이생의 부모도 딸을 살리려는 그 지극한 마음에 감복하여 결국 두 사람의 혼인을 허락하였다. 마침내 이생과 최랑은 백년가약을 맺어 어엿한 부부가 되었다. 오래 떨어져 애태우던 두 사람은 비로소 한집에서 밤낮으로 정을 나누게 되었다. 처음에는 격이 맞지 않는다며 망설이던 이생의 부모였다. 그러나 거듭 찾아와 호소하는 최랑 부모의 정성에 마침내 마음이 움직였다. 온갖 시련과 반대 끝에 어렵사리 이룬 사랑인지라, 두 사람의 기쁨은 이루 말할 수 없이 컸다.</p>
          <p class="section-title">Part 6. 홍건적의 난</p>
          <p>그러나 두 사람의 단란한 행복은 그리 오래가지 못하였다. 뜻밖에도 홍건적이 고려 땅으로 물밀듯이 쳐들어온 것이다. 붉은 수건을 머리에 두른 사나운 도적 떼가 온 나라를 휩쓸며 거침없이 노략질을 일삼으니, 놀란 백성들은 세간도 버려둔 채 저마다 살길을 찾아 사방으로 뿔뿔이 흩어졌다. 미처 피하지 못한 이들은 도적의 칼에 쓰러지거나 어디론가 끌려갔다. 송도 거리에는 주인 잃은 울음소리만 가득하였다. 곳곳에서 불길이 하늘로 치솟고 백성들의 아우성이 그치지 않으니, 그 평화롭던 온 나라가 순식간에 아수라장으로 변하고 말았다.</p>
          <p>이생의 집안도 밀려드는 난리를 피해 황급히 피란길에 올랐으나, 아수라장 같은 혼란 속에서 식구들이 그만 뿔뿔이 흩어지고 말았다. 이생은 간신히 몸을 피해 가까스로 목숨을 보전하였지만, 사랑하는 아내 최랑과도 생사조차 알 수 없이 헤어지게 되었다. 아무리 돌아보아도 혼란한 인파 속에 아내의 모습은 보이지 않았다. 이생은 끝까지 아내의 손을 놓치지 않으려 애썼으나 지키지 못한 것을 두고두고 거듭 자책하며, 정처 없이 피란길을 헤매었다. 백년해로를 꿈꾸던 평화로운 세상이 모진 전란으로 하루아침에 속절없이 무너져 내린 것이다.</p>
          <p class="section-title">Part 7. 최랑의 죽음</p>
          <p>정신없이 피란하던 중에 최랑은 그만 흉포한 홍건적의 무리에게 사로잡히고 말았다. 다른 식구들과도 그만 뿔뿔이 흩어진 뒤라, 최랑의 곁에는 그를 지켜 줄 이가 아무도 남아 있지 않았다. 도적들은 최랑의 빼어난 미모를 탐하여, 순순히 제 말을 따르라며 겁박하고 모질게 윽박질렀다. 그러나 최랑은 조금도 굴하지 않고 끝까지 꼿꼿이 맞서며 도적들을 매섭게 쏘아보았다. 사로잡힌 백성들 틈에서 최랑은 홀로 몸을 떨면서도 입술을 굳게 깨물었다. 두려움에 떨기는커녕 그 눈빛에는 오히려 서릿발 같은 기개가 서려 있었다.</p>
          <p>최랑은 도적들을 향해 추상같이 꾸짖으며, 차라리 이 자리에서 죽을지언정 지아비를 두고 정절을 꺾을 수는 없다고 결연히 소리쳤다. 끝내 그 뜻을 굽히지 않자, 흉악한 도적은 사납게 칼을 휘둘러 기어이 최랑의 목숨을 빼앗고 말았다. 꽃다운 아내가 절개를 지키려 끝내 목숨까지 버렸다는 그 애달픈 사실을, 이생은 한참 뒤에야 비로소 전해 듣고 알게 되었다. 지아비 이생의 이름을 가슴에 품은 채, 최랑은 끝내 한 발도 물러서지 않았다. 최랑은 그렇게 모진 전란 속에서도 끝까지 절개를 지키다, 서슬 퍼런 칼날 아래 꽃다운 나이에 애처롭게 스러지고 말았다.</p>
          <p class="section-title">Part 8. 돌아온 환신</p>
          <p>이윽고 모진 난리가 조금씩 가라앉자, 이생은 홀로 폐허가 된 옛집으로 터덜터덜 돌아왔다. 그러나 반겨 줄 아내 최랑은 어디에도 보이지 않았다. 옛집 마당엔 잡초만 무성하고, 담은 무너지고 반가이 맞아 줄 이 하나 없어 이생의 마음은 더없이 허전하고 쓸쓸하였다. 이생은 생사조차 알 수 없는 아내를 그리며, 텅 빈 집 안에서 홀로 깊은 슬픔에 잠겨 하루하루를 애통하게 보냈다. 이웃도 뿔뿔이 흩어져 아내의 소식을 물을 곳조차 없었다. 이생은 혹시나 하여 최랑이 숨었을 만한 곳을 날마다 찾아 헤매었다. 끼니도 거른 채 아내의 이름만 부르며 긴긴밤을 지새우기 일쑤였다.</p>
          <p>그렇게 밤낮으로 애통해하던 어느 밤이었다. 놀랍게도 최랑이 생시와 조금도 다름없는 모습으로 홀연히 이생 앞에 나타났다. 이생은 벅찬 반가움에 어쩔 줄을 몰라 아내의 손부터 덥석 잡았다. 그러나 이내 그는 아내가 이미 홍건적의 손에 죽어, 이승 사람이 아닌 환신으로 돌아왔음을 어렴풋이 깨달았다. 죽어서도 지아비를 차마 잊지 못해 돌아온 아내가, 이생은 가엾고도 사무치게 그리웠다. 죽은 아내를 산 사람 대하듯 반기는 그 모습은 애처롭기 그지없었다. 그런데도 그는 조금도 두려워하지 않고, 오히려 반가이 돌아온 최랑을 예전처럼 따뜻이 맞아들였다.</p>
          <p class="section-title">Part 9. 죽음을 넘은 삼 년</p>
          <p>이생은 아내가 이미 저세상 사람인 줄 번연히 알면서도, 돌아온 최랑과 다시금 부부의 연을 이어 갔다. 두 사람은 난리 통에 흩어져 죽은 가족들의 유해를 하나하나 거두어 정성껏 장사 지내고, 조용히 세상을 등진 채 오직 서로만을 의지하며 조촐히 살았다. 낮에는 남의 눈을 피해 숨어 지내고, 밤이면 둘이 마주 앉아 지난 일을 도란도란 이야기하며 못다 한 정을 나누었다. 이웃들은 흉흉한 소문에 그 집 근처에 얼씬도 하지 않았다. 그러나 이생에게는 오직 최랑과 함께 있다는 사실만이 소중하였다. 세상과 담을 쌓은 그 고요한 나날이 두 사람에게는 더없이 평온하였다.</p>
          <p>삶과 죽음의 경계마저 뛰어넘은 그 사랑은, 어느 때보다도 애틋하고 깊었다. 이생과 최랑은 그렇게 꿈결 같은 삼 년의 세월을 함께 보냈다. 비록 한 사람은 산 자요 다른 한 사람은 이미 죽은 혼이었으나, 서로를 향한 마음만은 생전과 조금도 다르지 않았다. 비록 저승과 이승으로 갈린 몸이었으나, 두 사람은 함께하는 하루하루가 아까워 더없이 애틋하게 아껴 보냈다. 남들이 보기엔 외로운 홀아비의 삶이었으나, 이생은 조금도 외롭지 않았다. 그것은 이 세상 그 어떤 인연보다도 지극하고 애틋한, 삶과 죽음을 넘어선 사랑이었다.</p>
          <p class="section-title">Part 10. 영원한 이별</p>
          <p>그러나 산 자와 죽은 자가 영원히 함께할 수는 없는 법이었다. 이승에 머물 기한이 다하자, 최랑은 이생에게 마지막 작별을 고하였다. 최랑은 정해진 때가 되면 미련 없이 저승으로 떠나야 함을 처음부터 잘 알고 있었다. 짧은 재회가 더없이 소중하였기에, 이별의 순간은 그만큼 더 애달팠다. 담담히 작별을 고하는 아내 앞에서 이생은 그저 말을 잇지 못하였다. 최랑은 이제 저승으로 돌아가야 하는 제 운명을 담담히 받아들이며, 아직 제대로 묻히지 못한 채 들판에 버려진 자신의 유골을 거두어 양지바른 곳에 장사 지내 줄 것을 간곡히 부탁하였다.</p>

          <p>주고받는 글자 하나하나에 서로를 향한 뜨거운 연정이 사무쳤다. 그러나 시를 주고받을수록 그리움은 더욱 커져만 갔고, 그저 멀리서 바라보기만 해야 하는 안타까움도 날로 깊어졌다. 그리움은 날로 깊어 가는데 서로 만날 길은 좀처럼 열리지 않으니, 운영의 애는 더욱 타들어 갔다. 밤이면 임의 얼굴을 떠올리며 홀로 눈물짓는 날이 많았다. 서로를 향한 마음은 날이 갈수록 걷잡을 수 없이 커져만 갔다. 운영은 이 사랑이 어떤 끝을 맞을지 못내 두려웠다. 궁녀의 몸으로 외간 남자를 사모함은 목숨을 건 위험한 일임을 번연히 알면서도, 한번 타오른 운영의 마음은 좀처럼 사그라들지 않았다.</p>
          <p class="section-title">Part 6. 무녀의 도움과 밀회</p>
          <p>애타게 그리움만 키우던 두 사람은, 마침내 궁 밖에 사는 한 무녀의 도움을 받게 되었다. 무녀가 두 사람 사이를 부지런히 오가며 은밀히 편지와 소식을 전해 준 것이다. 그렇게 가느다란 끈이 가까스로 이어지자, 두 사람의 사랑은 한층 더 깊어졌다. 편지 한 장을 주고받기까지 얼마나 마음을 졸였는지, 두 사람만이 알 뿐이었다. 운영은 무녀가 전해 준 편지를 품에 안고 밤새 읽고 또 읽었다. 무녀가 아니었다면 두 사람의 사랑은 진작 끊어졌을 것이다. 무녀는 들킬까 늘 조마조마하였으나, 두 사람의 애절한 사정을 가엾이 여겨 기꺼이 그 위험한 심부름을 하였다.</p>
          <p>이윽고 김 진사는 큰 위험을 무릅쓰고 어두운 밤을 틈타 수성궁의 높은 담을 넘었다. 그리고 그토록 애타게 그리던 운영과 마침내 마주하여 애틋한 정을 나누었다. 발각되는 날에는 곧 목숨을 잃을 줄 번연히 알면서도, 두 사람은 그 아슬아슬한 사랑을 차마 멈출 수 없었다. 달빛 아래 손을 맞잡은 그 짧은 순간이 두 사람에게는 온 세상을 얻은 듯 소중하였다. 짧은 만남 뒤의 긴 기다림이 두 사람을 더욱 애타게 하였다. 그럴수록 두 사람은 더 큰 위험을 꿈꾸게 되었다. 담 하나를 사이에 둔 그 짧디짧은 만남은 꿈결처럼 달콤하면서도 못내 아슬아슬하고 위태로웠다.</p>
          <p class="section-title">Part 7. 달아날 결심</p>
          <p>그러나 담을 몰래 넘나드는 위험한 밀회가 언제까지나 무사할 수는 없는 노릇이었다. 날로 커지는 두려움에 떨던 두 사람은, 마침내 차라리 이 갑갑한 궁을 영영 벗어나기로 뜻을 모았다. 함께 아무도 모르는 머나먼 곳으로 달아나, 그곳에서 남몰래 부부가 되어 살아 보자는 것이었다. 하루에도 몇 번씩 들킬까 가슴이 철렁 내려앉았다. 두 사람은 끝내 더는 이렇게 지낼 수 없다고 생각하였다. 궁의 담은 날이 갈수록 더 높고 두텁게만 느껴졌다. 궁에 갇힌 채 속절없이 시들어 가느니, 차라리 담을 넘어 자유로이 사랑을 좇기로 마음을 굳힌 것이다.</p>
          <p>궁녀의 몸으로 궁의 담을 넘어 달아난다는 것은, 목숨을 건 그야말로 엄청난 결단이었다. 그러나 사랑을 지키려는 두 사람에게는 달리 길이 없었다. 김 진사는 서둘러 달아날 채비를 꾸렸고, 운영 또한 설렘 반 두려움 반으로 떨리는 마음을 안고 그날이 오기만을 기다렸다. 혹여 일이 그르칠까 두려우면서도, 자유로운 사랑을 향한 꿈은 어떤 두려움보다 간절하였다. 오직 사랑 하나만을 붙들고 두 사람은 함께 길을 떠나기로 하였다. 두 사람은 떠날 날을 손꼽으며 그 위험한 결심을 거듭 굳혔고, 담 밖 세상이 과연 자신들을 받아 줄지 알 수 없었으나 두려움보다 사랑이 앞섰다.</p>
          <p class="section-title">Part 8. 종 특의 배신</p>
          <p>김 진사에게는 평소 부리던 특이라는 종이 하나 있었다. 김 진사는 함께 달아날 때 요긴하게 쓸 재물을 미리 빼내어, 그 일을 모두 종 특에게 은밀히 맡겨 두었다. 김 진사는 특을 오랜 세월 곁에 두고 부린 터라, 조금도 그를 의심하지 않았다. 그러나 특은 겉으로는 충직한 척하면서도 속은 음흉하기 짝이 없는, 겉과 속이 다른 교활한 자였다. 특은 평소 궂은일도 마다 않아 주인의 신임이 두터웠다. 그러나 그 속에는 주인의 재물을 노리는 흉심이 깊이 숨어 있었다. 특은 공손한 낯빛으로 주인을 감쪽같이 속여 온 것이다.</p>

          <p>죄 없는 동무들에게까지 화가 미치게 된 것을 괴로워하던 운영은, 끝내 비극적인 결심을 하고 말았다. 제 한 몸 희생하여 가엾은 동무들을 구하려는 것이, 운영이 택할 수 있는 마지막 길이었다. 동무들이 저로 인해 모진 벌을 받게 된 것을 운영은 차마 견딜 수 없었던 것이다. 바로 그날 밤, 운영은 홀로 조용히 방에 들어가 스스로 목을 매어 짧은 생을 마감하고 말았다. 운영은 홀로 모든 죄를 뒤집어쓰기로 마음먹었다. 동무들의 눈물 어린 얼굴이 자꾸만 눈앞에 어른거렸다. 자유로운 사랑을 꿈꾸었으나 끝내 궁의 높은 담을 넘지 못한 한 여인이, 그렇게 꽃다운 나이에 애처롭게 스러지고 말았다.</p>
          <p class="section-title">Part 10. 김 진사의 죽음과 남은 이야기</p>

          <p>삼포는 정 씨가 나고 자란 고향 마을이었다. 바다가 가깝고 인심 좋은 곳이라 하였다. 정 씨에게 삼포는 고단한 떠돌이 생활의 마지막 안식처와도 같았다. 영달은 딱히 갈 곳이 없던 터라, 정 씨를 따라 그쪽으로 함께 가 보기로 하였다. 두 사내는 그렇게 나란히 눈 덮인 겨울 들길을 걸어 나갔다. 정 씨는 걸으며 삼포의 풍경을 하나하나 들려주었다. 맑은 바닷물과 모래밭, 고기잡이 나가는 배들, 그리고 인심 좋은 이웃들. 떠올리는 것만으로도 정 씨의 목소리에는 따뜻한 정이 묻어났다. 정 씨가 들려주는 삼포 이야기에, 영달도 어쩐지 마음 한구석이 푸근해졌다. 그렇게 돌아갈 고향이 있다는 것이, 영달에게는 그저 부럽기만 하였다.</p>

          <p class="section-title">Part 3. 백화와의 만남</p>
          <p>두 사람이 찬샘이라는 마을을 지날 무렵이었다. 그곳에서 그들은 백화라는 젊은 여자를 만나게 되었다. 백화는 술집에서 작부 노릇을 하다, 그곳을 몰래 도망쳐 나온 참이었다. 나이는 스물두엇쯤 되어 보였다. 술집 주인이 빚을 빌미로 그녀를 붙잡아 두고 부려 먹었는데, 더는 견디지 못하고 뛰쳐나온 것이었다. 영달과 정 씨는 처음에 그 드센 여자가 영 탐탁지 않았다. 백화 또한 두 사내를 잔뜩 경계하며 톡톡 쏘아붙였다. 셋은 처음엔 사사건건 티격태격하였다. 그러나 다 같이 갈 곳 없는 처지에, 추운 겨울 눈길을 홀로 가기란 서로에게 쉽지 않은 일이었다.</p>
          <p>마침 백화가 가려는 길도 두 사람이 가는 방향과 얼추 같았다. 결국 세 사람은 자연스레 함께 길을 걷게 되었다. 서로 퉁명스레 말을 주고받으면서도, 눈보라 치는 길에서는 결국 서로가 서로에게 의지가 될 수밖에 없었다. 백화는 처음엔 사내들을 믿지 못해 잔뜩 날을 세웠다. 그동안 숱한 남자들에게 데고 속아 온 탓이었다. 그러나 영달과 정 씨가 저를 함부로 대하지 않는 것을 보고, 조금씩 경계를 풀어 갔다. 갈 곳 없기는 셋 다 매한가지였던 것이다. 그렇게 세 떠돌이의 뜻밖의 동행이, 눈 쌓인 겨울 길 위에서 조용히 시작되었다. 누구도 미처 예상치 못한 인연이었다.</p>

          <p class="section-title">Part 4. 셋이 된 동행</p>
          <p>세 사람은 함께 눈 덮인 겨울 들길을 걸었다. 바람은 매섭고 길은 멀기만 하였다. 백화는 얇은 옷차림에 신발마저 변변치 않아, 추위에 발을 동동 굴렀다. 처음엔 백화를 못마땅해하던 영달도, 그 딱한 모습에 차츰 마음이 누그러졌다. 길을 걷다 백화가 눈길에 미끄러져 넘어지자, 영달이 선뜻 손을 내밀어 일으켜 주었다. 정 씨는 그런 두 사람을 보며 빙그레 웃었다. 셋은 추위를 피해 잠시 길가의 빈집에 들어가 불을 피우고 언 몸을 녹이기도 하였다. 함께 손을 쬐며, 그들은 조금씩 서로에게 마음을 열어 갔다.</p>
          <p>갈 곳 없이 떠도는 처지라는 그 공통점이, 어느새 세 사람을 가깝게 묶어 주고 있었다. 티격태격하던 처음과 달리, 이제는 서로의 발걸음을 챙기고 안부를 물었다. 눈보라 속의 고단한 길이었지만, 함께였기에 조금은 견딜 만하였다. 정 씨는 가진 담배를 영달과 나누어 피웠고, 백화는 언 손을 호호 불며 두 사람 뒤를 종종걸음으로 따랐다. 서로 처지가 고단한 것을 알기에, 굳이 많은 말이 필요 없었다. 그저 같은 길을 함께 걷는 것만으로도 큰 위안이 되었다. 세상 끝으로 내몰린 세 떠돌이의 정이, 그렇게 눈길 위에서 조용히 쌓여 갔다. 비록 가진 것은 없어도, 서로가 있어 춥지만은 않은 길이었다.</p>

          <p class="section-title">Part 5. 백화의 사연</p>
          <p>길을 걷는 동안, 백화는 조금씩 제 지난 이야기를 털어놓았다. 그녀가 술집 작부로 흘러든 것은 열여덟 어린 나이 때부터였다. 가난한 집안 형편에 떠밀려, 이 술집 저 술집을 전전하며 모진 세월을 보냈다. 몸과 마음이 다 닳도록 고단한 삶이었다. 백화는 그동안 수많은 남자들을 스쳐 보냈노라 하였다. 그중에는 가슴 아픈 사연도 적지 않았다. 군대 간 젊은 병사들에게 살뜰히 정을 주고, 그들이 떠날 때면 몰래 눈물짓던 이야기도 있었다. 겉으로는 억세고 드세 보이는 백화였지만, 그 속에는 누구보다 여리고 따뜻한 마음이 숨어 있었다. 고된 삶에 시달리면서도, 백화는 정 많고 인간다운 심성을 끝내 잃지 않고 있었던 것이다.</p>
          <p>영달과 정 씨는 그 이야기를 들으며, 백화를 함부로 여기던 처음의 마음을 못내 부끄러워하였다. 백화 또한 한낱 가엾은 떠돌이였고, 저희와 조금도 다를 바 없는 처지였던 것이다. 백화의 이야기에는 웃음과 눈물이 함께 배어 있었다. 모진 세월을 견뎌 온 사람만이 지을 수 있는, 그런 담담한 표정이었다. 영달은 괜히 코끝이 시큰해졌다. 백화가 겪은 설움이, 곧 저희가 겪어 온 설움과 조금도 다르지 않았던 까닭이다. 세 사람은 그렇게 서로의 아픔을 알아 갔다. 같은 처지의 사람들끼리만 나눌 수 있는 위로였다.</p>

          <p class="section-title">Part 6. 서로 기대어</p>
          <p>추위와 고단함 속에서, 세 사람은 어느새 서로에게 둘도 없는 의지가 되어 있었다. 영달은 백화의 무거운 봇짐을 대신 들어 주고, 백화는 가진 주먹밥을 두 사내에게 선뜻 나누어 주었다. 정 씨는 두 젊은이를 마치 제 자식처럼 살뜰히 챙겼다. 눈보라가 몰아치면 서로 몸을 바짝 붙여 온기를 나누었다. 그렇게 함께 걷는 동안, 영달의 마음속에는 백화를 향한 연민과 호감이 조금씩 피어올랐다. 억척스러운 겉모습 뒤에 감춰진 백화의 여린 마음을, 영달은 이제 알 것 같았다. 백화 또한 무뚝뚝하지만 속정 깊은 영달에게 차츰 마음이 기울었다. 두 사람 사이에는 말로 다 하지 못할 따뜻한 감정이 소리 없이 오갔다.</p>
          <p>비록 가진 것 하나 없는 떠돌이들이었지만, 서로를 보듬는 그 마음만은 무엇보다 넉넉하였다. 세상에서 버림받은 이들끼리 나누는 온기였기에, 그 정은 더욱 애틋하고 소중하였다. 말은 투박해도 서로를 아끼는 마음은 숨길 수 없었다. 영달이 괜히 백화에게 퉁을 놓으면, 백화도 지지 않고 톡 맞받아쳤다. 그러나 그 티격태격 속에는 어느새 따스한 정이 묻어났다. 정 씨는 그런 두 젊은이를 흐뭇하게 바라보곤 하였다. 고단한 길 위에서, 피 한 방울 섞이지 않은 세 사람은 그렇게 한 가족처럼 가까워져 갔다.</p>

          <p class="section-title">Part 7. 백화의 본심</p>
          <p>이윽고 세 사람은 백화가 기차를 타야 할 갈림길에 이르렀다. 백화는 제 고향으로 돌아가려는 참이었다. 헤어질 때가 다가오자, 백화는 한참을 머뭇거리다 영달에게 속마음을 털어놓았다. "저어… 나랑 같이 우리 고향으로 가지 않을래요? 거기 가서 함께 농사라도 지으며 조용히 살면…." 떠돌이 생활을 그만두고, 영달과 함께 새 삶을 꾸리고 싶다는 간절한 마음이었다. 그러고는 백화가 나직이 제 본심을 내비치듯 말하였다. "사실 내 이름은 백화가 아니에요.</p>
          <p>진짜 이름은 이점례예요." '백화'는 술집에서 쓰던 가짜 이름일 뿐, 이점례가 바로 그녀의 진짜 이름이었다. 본명을 밝힌다는 것은, 그만큼 영달에게 제 마음을 다 열어 보였다는 뜻이었다. 그것은 작부 백화가 아닌, 한 사람의 여인 이점례로서 건네는 진심이었다. 영달은 그 말에 가슴이 뭉클해졌다. 그러나 그는 선뜻 그러자고 대답하지 못하였다. 이점례라는 그 이름을 입에 올리는 백화의 목소리는, 가늘게 떨리고 있었다. 평생 가짜 이름 뒤에 숨어 살아온 그녀였다. 영달은 그 진심이 고마우면서도, 한편으로는 가슴이 미어졌다. 백화의 그 간절한 마음을 선뜻 받아 주지 못하는 제 처지가, 그 순간 더없이 초라하게만 느껴졌던 것이다.</p>

          <p class="section-title">Part 8. 이별</p>
          <p>영달은 한참을 망설인 끝에, 끝내 백화를 따라나서지 못하였다. 정처 없이 떠도는 제 신세로는, 백화를 책임지고 거둘 자신이 도무지 없었던 것이다. 그러나 영달은 백화를 그냥 빈손으로 보낼 수는 없었다. 그는 주머니를 털어, 백화가 고향까지 갈 기차표를 끊어 주었다. 그러고는 가는 길에 먹으라며 삶은 달걀과 귤 몇 개까지 사서 손에 쥐여 주었다. 가진 것 없는 떠돌이가 건넬 수 있는, 최선의 마음이었다. 백화는 그 투박한 다정함에 그만 눈시울을 붉혔다. "고마워요. 정말… 고마워요."</p>
          <p>백화는 몇 번이고 뒤를 돌아보며 기차에 올랐다. 멀어지는 기차를 바라보는 영달의 마음도 못내 허전하였다. 함께 가자던 백화의 말이, 자꾸만 귓가에 맴돌았다. 그러나 서로 가는 길이 다른 것을 어쩌랴. 영달은 애써 마음을 다잡고, 다시 정 씨와 함께 삼포를 향해 발길을 돌렸다. 백화가 탄 기차가 플랫폼을 천천히 빠져나갔다. 영달은 기차가 아주 보이지 않을 때까지, 그 자리에 우두커니 서 있었다. 잡지 못한 인연이 못내 아쉬웠다. 그러나 떠돌이 처지에 누군가의 손을 잡는다는 것은, 그에게 너무도 사치스러운 일이었다. 떠나는 백화의 뒷모습 위로, 눈은 여전히 소리 없이 내려 쌓이고 있었다.</p>

          <p class="section-title">Part 9. 삼포의 소식</p>
          <p>백화와 헤어진 영달과 정 씨는, 다시 삼포를 향해 길을 재촉하였다. 정 씨는 십 년 넘게 그리던 고향이 가까워 온다는 생각에, 발걸음이 한결 가벼웠다. 그런데 길에서 만난 한 노인에게 삼포 이야기를 꺼냈다가, 뜻밖의 소식을 듣게 되었다. "삼포? 아, 거기 말이오? 거긴 이제 옛날 그 삼포가 아니라오." 노인의 말에 정 씨의 얼굴이 굳어졌다. 노인이 전하는 삼포의 모습은, 정 씨가 알던 고향과는 영 딴판이었다. 한적하던 그 바닷가 마을에 이제는 관광지를 만든다며 큰 공사가 한창 벌어지고 있다는 것이었다.</p>
          <p>바다를 가로막아 방둑을 쌓고, 산을 깎아 길을 내며, 트럭과 중장비가 밤낮으로 드나든다 하였다. 고기잡이하던 순박한 사람들은 이미 뿔뿔이 흩어지고 없었다. 정 씨가 그토록 돌아가고 싶어 하던 그 고향은, 거센 산업화의 물결에 휩쓸려 이미 흔적도 없이 사라져 버린 것이었다. 정 씨는 노인의 말을 차마 믿고 싶지 않았다. 그 고요하던 바다가, 그 정겹던 마을이 그렇게 변했다니. 십 년을 하루같이 그리며 버텨 온 고향이었다. 그런데 막상 돌아갈 그곳이 송두리째 사라졌다는 것이다. 먼 하늘을 올려다보는 정 씨의 눈에는 쓸쓸함이 가득하였다. 그는 그만 그 자리에 멍하니 서 버리고 말았다.</p>

          <p class="section-title">Part 10. 사라진 고향</p>
          <p>삼포가 몰라보게 변해 버렸다는 말에, 정 씨는 그만 맥이 탁 풀리고 말았다. 마음속에 고이 품어 온 고향이 하루아침에 사라진 것이나 다름없었다. 떠돌이 생활을 끝내고 돌아가 뿌리내릴 그곳이, 이제는 더 이상 예전의 삼포가 아니었다. 돌아갈 고향을 잃은 정 씨의 마음은, 눈 내리는 겨울 들판처럼 허전하고 쓸쓸하기만 하였다. 영달은 그런 정 씨를 가만히 바라볼 뿐, 무어라 위로의 말을 건네지도 못하였다. 두 사람은 결국, 삼포로 가는 기차에 몸을 실었다. 그러나 정 씨의 발걸음은 올 때와 달리 조금도 가볍지 않았다. 설렘으로 향하던 길이, 어느새 정처 없는 또 다른 떠돌이 길이 되어 버린 까닭이었다.</p>

          <p>이제 그만 집에 가 보게. 앓는 아주머니가 기다릴 걸세" 하고 말렸으나, 김 첨지는 들은 체도 하지 않았다. 도리어 그는 "죽기는 누가 죽어!" 하고 버럭 소리를 질렀다. 술기운이 오를수록 김 첨지의 목소리는 점점 더 커졌다. 그러나 그 요란한 너스레 뒤에는, 차마 입 밖에 내지 못할 두려움이 깊이 숨어 있었다. 집에 돌아가 아내의 싸늘한 얼굴을 마주하게 될까 봐, 그는 그 순간을 한사코 뒤로 미루고만 싶었던 것이다. 그 날 선 서슬에 치삼은 그만 더 말을 잇지 못하였다. 두 사람 사이에는 한동안 무거운 침묵만이 흘렀다.</p>

          <p>술이 거나하게 오른 김 첨지는, 갑자기 눈물을 뚝뚝 흘리기 시작하였다. "여보게, 내 마누라가 죽었다네. 오늘 아침에 그만 죽어 버렸어." 치삼이 깜짝 놀라 "뭐라고?" 하고 되묻자, 김 첨지는 이번에는 또 껄껄 웃어 젖혔다. "하하, 다 거짓말일세. 죽기는 왜 죽어. 멀쩡히 살아 있다네." 김 첨지는 울다가 웃고, 웃다가 또 울었다.</p>

          <p>아저씨가 우리 집에 오신 뒤로, 나는 날마다 사랑방을 들락거렸어요. 아저씨가 나를 참 귀여워해 주셨거든요. 무릎에 앉혀 놓고 옛날이야기도 들려주시고, 그림도 그려 주시고, 가끔은 맛있는 과자도 사 주셨어요. 나는 어느새 아저씨가 세상에서 제일 좋아졌어요. 그런데 아저씨한테는 유난히 좋아하는 음식이 하나 있었는데, 바로 삶은 달걀이었어요. 우리 어머니는 그걸 어떻게 아셨는지, 아저씨 밥상에 늘 삶은 달걀을 빠뜨리지 않고 올려 주셨어요. 하루는 내가 아저씨 방에서 달걀을 집어 먹으려는데, 아저씨가 "옥희도 달걀을 좋아하느냐?" 하고 물으시기에 냉큼 "네!"</p>
          <p>하고 대답했지요. 그랬더니 그다음부터는 어머니가 달걀을 더 많이 사다가 삶아 주시는 거예요. 나는 아저씨 덕분에 달걀을 실컷 먹게 되어 얼마나 좋았는지 몰라요. 아저씨와 나는 그렇게 날이 갈수록 점점 더 가까운 사이가 되어 갔답니다. 아저씨는 가끔 나한테 어머니 이야기를 넌지시 물으시기도 했어요. 너희 어머니는 무슨 꽃을 좋아하시느냐 하는 식으로요. 나는 그게 뭐가 궁금한가 싶으면서도, 아는 대로 또박또박 일러 드렸지요. 그러면 아저씨는 그저 빙그레 웃기만 하셨어요. 나는 아저씨가 오신 뒤로 우리 집이 훨씬 더 즐거워졌어요.</p>

          <p class="section-title">Part 1. 용왕의 병</p>
          <p>먼 옛날, 깊고 푸른 남해 바닷속에 용왕이 살았다. 용왕은 드넓은 수궁을 다스리며 온갖 물고기와 바다 생물들을 거느리는, 더없이 존귀한 존재였다. 그런데 어느 날부터 용왕이 까닭 모를 병에 걸려 그만 자리에 눕고 말았다. 처음에는 대수롭지 않게 여겼으나, 병세는 날이 갈수록 점점 깊어만 갔다. 수궁의 이름난 어의들이 모두 달려와 용왕을 살폈다. 그들은 저마다 귀하다는 약을 지어 올렸다. 산삼이며 녹용이며, 바닷속에서 구할 수 있는 온갖 영약이 다 동원되었다. 그러나 어떤 약을 써도 용왕의 병은 조금도 차도가 없었다.</p>
          <p>도리어 용왕은 하루가 다르게 쇠약해져, 이제는 숨조차 가쁘게 몰아쉬는 지경에 이르렀다. 수궁 안은 온통 무거운 근심에 휩싸였다. 용왕이 세상을 떠나기라도 하면, 바닷속 나라가 큰 혼란에 빠질 것이 뻔하였기 때문이다. 용왕은 평소 백성을 어질게 다스려 바닷속 모든 생물의 존경을 받아 왔다. 그런 용왕이 시름시름 앓아눕자, 수궁의 물고기들도 저마다 제 일처럼 슬퍼하였다. 신하들은 밤낮으로 용왕의 쾌차를 빌었으나, 온갖 약이 다 소용없으니 그저 발만 동동 구를 뿐이었다. 하루빨리 묘약을 찾지 못하면 정말 큰일이었다. 수궁의 시름은 날로 깊어만 갔다.</p>

          <p class="section-title">Part 2. 토끼 간이 약</p>
          <p>용왕의 병이 끝내 낫지 않자, 수궁에는 무거운 절망이 감돌았다. 바로 그때, 하늘에서 한 도사가 홀연히 내려와 용왕 앞에 나타났다. 도사는 용왕의 맥을 짚어 보고 병의 뿌리를 가만히 살피더니, 이윽고 무겁게 입을 열었다. "용왕의 병은 예사 약으로는 결코 고칠 수 없습니다. 오직 한 가지, 뭍에 사는 토끼의 생간을 구해 드셔야만 비로소 나을 수 있습니다." 그 말에 용왕과 신하들은 모두 귀가 번쩍 뜨였다. 그러나 이내 난감한 기색이 감돌았다. 토끼란 저 멀리 육지의 산속에 사는 짐승이니, 물속 생물들이 어찌 그것을 구해 온단 말인가.</p>
          <p>뭍에 올라가면 숨을 쉴 수조차 없는 수궁의 신하들에게는, 그야말로 막막하기 그지없는 일이었다. 그러나 용왕의 목숨이 걸린 일이었다. 어떻게든 토끼를 산 채로 잡아다, 그 생간을 구해 와야만 하였다. 도사는 그 말만 남기고는, 왔을 때처럼 홀연히 자취를 감추었다. 용왕은 지푸라기라도 잡는 심정으로, 반드시 토끼의 간을 구해 오라 엄히 명하였다. 토끼를 잡아 오는 자에게는 큰 상을 내리겠다는 약속도 잊지 않았다. 용왕은 곧 신하들을 한자리에 불러 모아, 누가 이 막중한 일을 맡을 것인지 의논하게 하였다. 신하들의 얼굴에는 하나같이 수심이 가득하였다.</p>

          <p class="section-title">Part 3. 자라의 자원</p>
          <p>용왕의 명을 받든 신하들이 넓은 수궁 뜰에 빼곡히 모여들었다. 그러나 선뜻 나서는 자가 아무도 없었다. 뭍에 올라 토끼를 잡아 오는 일은, 목숨을 건 위험한 일이었기 때문이다. 내로라하는 큰 물고기들도 저마다 핑계를 대며 슬그머니 꽁무니를 뺐다. "저는 몸집이 너무 커서 뭍에 오르면 금방 들킬 것입니다." "저는 비늘이 번쩍여 눈에 띄기 쉽습니다." 서로 미루며 눈치만 살피는 가운데, 드디어 한 신하가 앞으로 썩 나섰다. 바로 등에 단단한 딱지를 진 자라, 곧 별주부였다.</p>
          <p>"소신이 비록 보잘것없으나, 뭍과 물을 모두 오갈 수 있사옵니다. 제가 기어이 토끼를 잡아 오겠나이다." 자라의 충성스러운 자원에 용왕은 크게 기뻐하였다. 자라는 혹시라도 토끼를 못 알아볼까 하여, 토끼의 생김새를 그린 화상 한 장을 받아 품에 고이 지녔다. 용왕은 그 갸륵한 충성에 자라의 등을 어루만지며 거듭 치하하였다. 다른 신하들은 선뜻 나서지 못한 것을 부끄러워하면서도, 위험한 일을 떠맡은 자라를 못내 안쓰럽게 여겼다. 그러나 자라는 조금도 두려워하는 기색이 없었다. 그러고는 용왕께 하직 인사를 올리고, 머나먼 육지를 향해 기나긴 길을 떠났다. 떠나는 그 뒷모습을 신하들이 숙연히 지켜보았다.</p>

          <p class="section-title">Part 4. 육지로 나선 자라</p>
          <p>자라는 깊은 바닷속에서 헤엄쳐 올라, 마침내 낯선 육지의 뭍에 다다랐다. 평생 물속에서만 살던 자라에게, 뭍의 세상은 온통 신기하고 또 두렵기만 하였다. 느릿느릿 기어서 산으로 오르는 길은 여간 더디고 고된 것이 아니었다. 그래도 자라는 용왕을 살려야 한다는 일념으로, 조금도 포기하지 않고 꾸역꾸역 산을 기어올랐다. 자라는 틈틈이 품에서 토끼 화상을 꺼내어, 지나는 짐승들의 생김새와 견주어 보았다. 그러던 어느 날, 자라는 숲속에서 깡충깡충 뛰노는 한 짐승을 발견하였다. 긴 귀에 짧은 꼬리, 동그란 눈을 가진 그 모습이 화상 속 토끼와 조금도 다르지 않았다. 자라는 속으로 쾌재를 불렀다.</p>
          <p>옳거니, 바로 저놈이 그토록 찾던 토끼로구나 싶었다. 자라는 반가운 마음을 애써 감추고, 천연덕스러운 얼굴로 토끼에게 슬그머니 다가갔다. 뭍의 산짐승들은 처음 보는 자라를 신기한 듯 기웃거렸다. 느릿느릿 기어 다니는 그 모습이 우스웠던 것이다. 그러나 자라는 조금도 아랑곳하지 않고, 오직 토끼를 꾀어낼 궁리에만 온 신경을 쏟았다. 섣불리 덤볐다가는 토끼가 놀라 달아날 것이 뻔하였다. 자라는 우선 토끼의 마음을 사로잡을 말부터 차근차근 궁리하였다. 그 짧은 사이에도 온갖 꾀가 꼬리를 물고 떠올랐다.</p>

          <p class="section-title">Part 5. 토끼를 꾀다</p>
          <p>자라는 토끼에게 공손히 다가가 넙죽 인사를 건넸다. 그러고는 짐짓 딱하다는 듯한 표정으로 말을 꺼냈다. "토 선생, 이 험한 산속에서 늘 쫓기며 사시느라 얼마나 고생이 많으십니까? 독수리와 사냥꾼에 쫓기고, 겨울이면 먹을 것이 없어 굶주리니 그 신세가 참으로 가엾습니다." 토끼가 가만히 들어 보니 과연 틀린 말이 하나도 없었다. 자라는 이때다 싶어, 용궁의 좋은 점을 침이 마르도록 늘어놓기 시작하였다. "우리 수궁에 가시면 사정이 아주 다릅니다. 높은 벼슬을 얻어 떵떵거리며 살 수 있고, 산해진미가 날마다 상에 가득하며, 아름다운 경치 속에서 아무런 걱정 없이 지낼 수 있습니다."</p>
          <p>그 달콤한 말에 토끼의 귀가 솔깃해졌다. 산속의 고달픈 삶에 넌더리가 나 있던 토끼였다. 자라가 거듭 부추기자, 토끼는 마침내 그 꾐에 홀딱 넘어가고 말았다. "그렇다면 나도 그 좋다는 용궁에 한번 가 보겠소." 자라는 토끼가 마음을 바꿀세라, 어서 가자며 거듭 재촉하였다. 토끼는 당장이라도 호강하며 살 생각에 두 눈이 반짝거렸다. 토끼는 눈앞의 부귀영화에 눈이 멀어, 그것이 무서운 함정인 줄은 꿈에도 알지 못하였다. 자라의 입가에는 회심의 미소가 번졌다. 모든 일이 제 뜻대로 되어 가고 있었다.</p>

          <p class="section-title">Part 6. 용궁으로</p>
          <p>토끼가 따라나서기로 하자, 자라는 속으로 뛸 듯이 기뻤다. 그러나 겉으로는 짐짓 태연한 척하며, 토끼를 제 등에 냉큼 업었다. "자, 내 등에 꼭 업히시오. 바닷길은 내가 안전하게 모시겠소." 자라는 토끼를 등에 태운 채, 깊고 푸른 바닷속으로 거침없이 헤엄쳐 들어갔다. 난생처음 바닷속을 구경하는 토끼는, 눈앞에 펼쳐진 신비로운 광경에 그만 넋을 잃었다. 울긋불긋한 산호와 온갖 물고기들이 떼 지어 노니는 모습이 꿈결처럼 황홀하였다. 토끼는 제가 곧 높은 벼슬을 얻어 호강하며 살 생각에, 벌써부터 마음이 들떴다.</p>
          <p>이윽고 자라와 토끼는 으리으리한 수궁에 다다랐다. 번쩍이는 궁궐과 위엄 있게 늘어선 신하들의 모습에, 토끼는 그만 입을 다물지 못하였다. 자라는 곧장 토끼를 데리고 용왕 앞으로 나아갔다. 토끼는 제가 큰 환영을 받는 줄로만 알고, 의기양양하게 궁궐 안으로 들어섰다. 용왕과 신하들은 드디어 토끼가 잡혀 왔다는 소식에 모두 반색하였다. 토끼는 그 떠들썩한 분위기를, 제가 귀한 손님으로 환영받는 것이라 철석같이 믿었다. 어리석게도 토끼는 제 목숨이 경각에 달린 줄도 모른 채 싱글벙글하였다. 그러나 그것은 토끼의 크나큰 착각이었다. 궁궐 깊은 곳에는 끔찍한 운명이 토끼를 기다리고 있었다.</p>

          <p class="section-title">Part 7. 간을 내놓아라</p>
          <p>용왕 앞에 이른 토끼는, 그제야 무언가 심상치 않은 분위기를 느꼈다. 자신을 바라보는 용왕과 신하들의 눈빛이, 반가움이 아니라 어딘가 섬뜩하였던 것이다. 이윽고 용왕이 무겁게 입을 열었다. "토끼야, 네 간이 과인의 병을 고칠 약이라 하니, 미안하나 네 간을 내어 주어야겠다." 그 말에 토끼는 눈앞이 캄캄해졌다. 높은 벼슬은커녕, 애초에 제 간을 빼앗아 용왕의 약으로 쓰려고 자신을 꾀어 온 것이었다. 자라가 늘어놓던 그 달콤한 말이 모두 새빨간 거짓이었음을, 토끼는 그제야 뼈저리게 깨달았다. 용왕의 명이 떨어지자, 신하들이 당장 토끼의 배를 가르려고 시퍼런 칼을 들고 우르르 다가섰다.</p>
          <p>토끼는 등골이 오싹하고 다리가 후들후들 떨렸다. 이대로 가만히 있다가는 꼼짝없이 배가 갈려 죽을 판이었다. 그러나 토끼는 본디 영리하기 짝이 없는 짐승이었다. 토끼는 이제 꼼짝없이 죽었구나 싶어 눈앞이 아뜩하였다. 그러나 여기서 넋을 놓고 있을 수는 없었다. 당황한 기색을 보였다가는 그대로 끝장이었다. 토끼는 가까스로 정신을 가다듬고, 짐짓 여유로운 표정을 지으며 이 절체절명의 위기를 벗어날 꾀를 번개같이 머릿속으로 굴리기 시작하였다. 이제 살길은 오직 꾀 하나뿐이었다.</p>

          <p class="section-title">Part 8. 토끼의 꾀</p>
          <p>토끼는 짐짓 아무렇지 않은 척, 도리어 껄껄 큰 소리로 웃음을 터뜨렸다. 용왕과 신하들이 어리둥절하여 토끼를 멀거니 쳐다보았다. 토끼는 짐짓 안타깝다는 듯 혀를 차며 말하였다. "저런, 참으로 딱하게 되었습니다. 진작 말씀하실 것이지요. 실은 저희 토끼들은 간을 몸속에 넣고 다니지 않습니다. 워낙 귀한 것이라, 깨끗한 바위에 꺼내어 볕에 잘 말려 두고 다니지요. 하필이면 오늘도 간을 산속 바위에 널어 두고 그냥 왔으니, 이 일을 어쩝니까." 그러고는 제 배를 툭툭 두드리며 말을 이었다.</p>
          <p>"정 못 믿으시겠거든 지금 당장 제 배를 갈라 보십시오. 간이 없으면 저만 공연히 죽고 용왕의 병도 못 고치니, 서로 낭패가 아니겠습니까?" 토끼의 말이 어찌나 천연덕스럽고 그럴듯하던지, 용왕과 신하들은 그만 감쪽같이 속아 넘어가고 말았다. 어리석은 용왕은 토끼의 말을 조금도 의심하지 않았다. 만일 토끼가 조금이라도 당황하는 기색을 보였다면, 용왕은 그 말을 믿지 않았을 것이다. 그러나 토끼가 어찌나 태연하던지, 그 누구도 거짓이라고는 꿈에도 생각지 못하였다. 도리어 토끼를 극진히 대접하며, 어서 그 간을 가져오라고 신신당부하기까지 하였다. 참으로 어처구니없는 노릇이었다.</p>

          <p class="section-title">Part 9. 다시 육지로</p>

          <p>만 냥을 손에 쥔 허생은, 곧장 경기도와 삼남 지방이 만나는 길목인 안성으로 내려갔다. 안성은 각지의 온갖 물산이 모여드는 큰 장이 서는 고장이었다. 허생은 그곳에서 대추, 밤, 감, 배, 석류 같은 온갖 과일을 보이는 족족 두 배 값을 쳐주고 몽땅 사들였다. 온 장터의 과일이란 과일은 모조리 허생의 창고로 들어갔다. 얼마 지나지 않아 과연 나라 안에 과일이 씨가 말라 버렸다. 제사상을 차리고 잔치를 벌이려 해도 과일을 구할 길이 없으니, 값은 하늘 높은 줄 모르고 치솟았다. 그제야 허생은 쟁여 두었던 과일을 풀어, 처음 산값의 열 배를 받고 되팔았다. 앉은자리에서 만 냥이 몇 배로 불어났다.</p>
          <p>그러나 허생은 기뻐하기는커녕 도리어 길게 탄식하였다. "겨우 만 냥으로 온 나라의 과일을 마음대로 좌지우지할 수 있다니, 이 나라 경제의 밑천이 그만큼 보잘것없다는 뜻이로구나." 제사와 잔치에 과일을 빠뜨릴 수 없는 양반가에서는, 값이 아무리 올라도 울며 겨자 먹기로 과일을 사들여야 했다. 허생은 그 틈을 놓치지 않고 큰 이문을 남겼다. 허생이 애초에 노린 것은 돈이 아니라, 바로 그 사실을 세상에 똑똑히 보이는 것이었다. 그 한탄 속에는 조선 경제에 대한 날카로운 통찰이 담겨 있었다.</p>

          <p class="section-title">Part 5. 제주 말총 매점과 한탄</p>
          <p>과일 장사로 큰돈을 쥔 허생은, 이번에는 바다를 건너 제주도로 들어갔다. 그러고는 제주에서 나는 말총을 닥치는 대로 사들이기 시작하였다. 말총이란 말의 갈기와 꼬리털로, 당시 양반들이 머리에 두르는 망건과 갓을 만드는 데 꼭 필요한 재료였다. 허생이 제주의 말총을 모조리 쓸어 담자, 이번에도 똑같은 일이 벌어졌다. 머지않아 온 나라에 망건 만들 재료가 동이 나, 망건값이 열 배로 껑충 뛰어오른 것이다. 허생은 또다시 손쉽게 큰 이문을 남겼다. 그러나 허생의 마음은 오히려 더욱 무거워졌다. 고작 한 사람이 푼돈을 들여 물건을 매점한 것만으로, 온 나라의 물가가 요동치고 백성들이 큰 곤란을 겪으니 말이다.</p>
          <p>"이처럼 나라의 경제가 허약하기 짝이 없으니, 백성들이 어찌 넉넉히 살기를 바라겠는가." 망건을 두르지 못하면 양반들은 상투를 가릴 길이 없어 바깥출입조차 하지 못하였다. 그러니 값이 아무리 치솟아도 말총을 사지 않을 도리가 없었다. 이는 허생이 재물을 탐해서가 아니라, 나라 경제의 허점을 몸소 증명해 보이려는 것이었다. 백성의 삶을 떠받쳐야 할 나라 살림이 이토록 허술하니, 허생의 근심은 쉬이 가시지 않았다. 허생은 조선의 좁고 약한 경제 현실을 뼈아프게 곱씹으며, 거듭 깊은 한숨을 내쉬었다.</p>

          <p class="section-title">Part 6. 빈 섬과 도적떼</p>
          <p>그 무렵 나라 곳곳에서는 먹고살 길이 막막해진 백성들이 도적이 되어 떠돌고 있었다. 변산 일대에는 그런 도적 떼가 수천 명이나 우글거렸다. 관가에서도 좀처럼 그들을 잡지 못해 골머리를 앓았다. 이 소문을 들은 허생은 조금도 두려워하는 기색 없이 홀로 도적의 소굴로 찾아 들어갔다. 그러고는 도적의 우두머리를 만나, 그들이 도적이 될 수밖에 없었던 딱한 처지를 헤아려 주었다. "너희가 장가를 들고 땅을 일구며 살고 싶어도, 돈이 없고 땅이 없어 이 지경에 이른 것이 아니냐."</p>

          <p class="section-title">Part 7. 재물을 덜어 내다</p>
          <p>섬의 땅은 기름지고 물산이 넉넉하여, 애써 가꾼 농사는 해마다 풍년이 들었다. 사람들은 부지런히 일하여 먹고도 남을 만큼 넉넉히 곡식을 거두었다. 허생은 남아도는 곡식을 이웃 나라인 일본의 어느 섬에 내다 팔아, 은 백만 냥이라는 어마어마한 재물을 벌어들였다. 그러나 허생은 그 많은 돈을 보고도 조금도 기뻐하지 않았다. 도리어 그는 "이 작은 섬에 이토록 많은 재물을 쌓아 두면 도리어 화가 될 뿐이다"라고 하였다. 그러고는 은 오십만 냥을 조금의 아까움도 없이 바닷속에 던져 버렸다.</p>
          <p>또한 허생은 섬을 떠나기에 앞서, 글을 아는 자들을 모조리 배에 태워 함께 섬 밖으로 데리고 나왔다. 뒷날 그들이 공연히 분란의 씨앗이 될까를 염려한 까닭이었다. 허생은 섬에 남은 사람들에게, 부디 글과 다툼을 멀리하고 순박하게 살아가라 거듭 당부하였다. 허생은 재물이란 넘치면 오히려 사람을 망치는 법임을 잘 알고 있었다. 또한 그는 그 섬을 다스리는 임금 노릇에도 조금도 미련을 두지 않았다. 애초에 그가 바란 것은 재물이나 권세가 결코 아니었다. 그렇게 자급자족하는 새 세상을 섬에 남겨 둔 채, 허생은 더없이 홀가분한 걸음으로 조용히 뭍으로 돌아왔다. 그 걸음에는 큰일을 마친 자의 담담함이 어려 있었다.</p>

          <p class="section-title">Part 1. 심청의 출생</p>
          <p>황해도 도화동에 심학규라는 한 봉사가 살았다. 본디 양반의 후예였으나 집안이 기울고 두 눈마저 멀어, 가난하기가 이를 데 없는 처지였다. 그러나 그의 아내 곽씨 부인은 어질고 바느질 솜씨가 뛰어나, 삯바느질로 살림을 꾸리며 눈먼 남편을 정성으로 섬겼다. 다만 두 사람에게는 나이 마흔이 넘도록 슬하에 자식이 없는 것이 한이었다. 곽씨 부인은 이름난 산과 절을 찾아다니며 정성껏 자식 낳기를 빌었다. 그 지극한 정성이 하늘에 닿았는지, 마침내 부인은 귀한 딸을 얻게 되었다. 아이의 이름을 청이라 지으니, 이가 곧 심청이었다. 늦게 얻은 딸이라 심 봉사 내외의 기쁨은 이루 말할 수 없었다.</p>
          <p>심 봉사는 앞이 보이지 않아도 어린 딸을 품에 안고, 세상을 다 가진 듯 행복해하였다. 가난한 살림이었으나 그 집안에는 웃음이 끊이지 않았다. 심 봉사는 딸의 얼굴을 비록 볼 수는 없었으나, 작은 손을 매만지고 숨소리를 들으며 그 모습을 마음에 그렸다. 곽씨 부인은 밤새 아이를 품고도 고단한 줄을 몰랐다. 가난하여 변변히 해 줄 것은 없었으나, 두 사람의 사랑만은 그 무엇보다 넉넉하였다. 부부는 이 어린 딸이 무탈하게만 자라 주기를 밤낮으로 바랐다. 그것이 가난한 두 사람의 하나뿐인 소원이었다.</p>

          <p class="section-title">Part 2. 곽씨 부인의 죽음</p>
          <p>그러나 그 행복은 오래가지 못하였다. 심청을 낳은 곽씨 부인이 산후의 몸을 끝내 추스르지 못하고, 그만 자리에 눕고 만 것이다. 변변한 약 한 첩 쓰지 못하는 가난 속에서 부인의 병세는 날로 깊어만 갔다. 곽씨 부인은 눈먼 남편과 갓난 딸을 두고 차마 눈을 감지 못하였다. "이 어린것을 두고 제가 먼저 가다니…. 부디 몸 성히 청이를 길러 주십시오." 부인은 애끊는 유언을 남기고, 심청을 낳은 지 이레 만에 끝내 세상을 떠나고 말았다. 심 봉사는 하늘이 무너지는 듯한 슬픔에 몸부림치며 통곡하였다. 그러나 슬퍼만 하고 있을 수는 없었다.</p>
          <p>당장 젖먹이 딸을 먹여 살려야 했던 것이다. 심 봉사는 어린 심청을 품에 안고, 동네 아낙들을 일일이 찾아다니며 젖동냥을 하였다. "이 아이 젖 좀 물려 주시오." 눈먼 아비의 애처로운 사정에, 마을 여인들은 너도나도 선뜻 젖을 물려 주었다. 젖동냥으로도 모자란 날이면, 심 봉사는 미음을 쑤어 어린것의 입에 떠 넣어 주었다. 한밤중 아이가 보채며 울면, 눈먼 아비는 서툰 손길로 등을 토닥이며 밤을 지새웠다. 아내를 잃은 슬픔을 속으로 삼킨 채, 심 봉사는 오직 딸 하나를 바라보며 모진 세월을 견뎌 냈다. 그렇게 심청은 온 동네의 젖을 먹고 자라났다. 참으로 모질고도 애틋한 세월이었다.</p>

          <p class="section-title">Part 3. 효녀로 자란 심청</p>
          <p>심 봉사의 그런 정성 속에서, 심청은 큰 탈 없이 무럭무럭 자라났다. 심청은 예닐곱 살 무렵부터 벌써 철이 들어, 눈먼 아버지의 손발이 되어 드렸다. 열 살을 넘기면서부터는 동냥과 품팔이를 조금도 마다하지 않고, 손수 아버지를 봉양하기 시작하였다. 추운 날이면 제 몸으로 아버지의 언 손을 녹여 드리고, 끼니때면 따뜻한 밥을 먼저 아버지께 올렸다. 동네 사람들은 그 지극한 효성을 보고 저마다 입을 모아 칭찬하였다. "저런 효녀가 세상에 또 어디 있겠나." 심청은 비록 어린 나이에 고생이 막심하였으나, 아버지를 모실 수 있다는 것만으로도 조금도 힘든 내색을 하지 않았다.</p>
          <p>심 봉사 또한 그런 기특한 딸을 더없이 아끼고 자랑스러워하였다. 부녀는 비록 가난하였으나, 서로를 의지하며 오순도순 살아갔다. 심청의 곱고 착한 마음씨는 나이를 먹을수록 더욱 깊어만 갔다. 이웃의 궂은일을 도와주고 삯을 받아 오면, 심청은 제 입에 드는 것보다 아버지의 끼니를 먼저 챙겼다. 맛난 것이 생기면 저는 굶을지언정 아버지께 올렸고, 험한 일도 아버지가 알까 봐 내색하지 않았다. 그 효성에 하늘도 무심치 않으리라고 동네 사람들은 입을 모았다. 어느새 심청은 효성이 지극한 아리따운 처녀로 자라 있었다.</p>

          <p class="section-title">Part 4. 공양미 삼백 석</p>
          <p>그러던 어느 날, 심청이 늦도록 돌아오지 않자 심 봉사는 딸을 마중하러 길을 나섰다. 그러나 앞을 보지 못하는 터라, 그만 발을 헛디뎌 개울에 풍덩 빠지고 말았다. 허우적대며 꼼짝없이 물에 빠져 죽을 뻔한 순간, 마침 지나던 몽은사의 화주승이 그를 발견하고 건져 주었다. 화주승은 물에 빠진 까닭을 듣고는, 솔깃한 말을 꺼냈다. "부처님께 공양미 삼백 석을 바치고 지성으로 불공을 드리면, 반드시 눈을 떠 앞을 보게 될 것이오." 평생 앞 못 보는 것이 한이던 심 봉사는, 그 말에 앞뒤 가릴 것도 없이 덜컥 삼백 석을 시주하겠노라 약속해 버렸다.</p>
          <p>그러나 집으로 돌아와 가만히 생각하니, 끼니조차 잇기 어려운 형편에 공양미 삼백 석이란 그야말로 하늘의 별 따기였다. 심 봉사는 공연한 약속을 한 것을 땅을 치며 후회하였다. 그러나 이미 부처님께 바치기로 한 약속을 어길 수도 없어 더욱 애가 탔다. 밥도 넘기지 못하고 긴 한숨만 내쉬는 아버지를, 심청은 애가 타서 곁에서 지켜보았다. 무슨 큰 걱정이 있는 것이 틀림없었다. 근심에 싸여 끙끙 앓는 아버지를 보고, 심청은 그 까닭을 조심스레 캐묻기 시작하였다. 아버지는 한사코 괜찮다며 손사래를 쳤으나, 딸의 거듭된 물음에 끝내 속사정을 털어놓고 말았다.</p>

          <p class="section-title">Part 5. 몸을 팔다</p>
          <p>마침내 아버지에게서 공양미 삼백 석 이야기를 들은 심청은, 깊은 시름에 잠겼다. 어떻게든 그 삼백 석을 마련해 아버지의 눈을 뜨게 해 드리고 싶었다. 그러던 차에 심청은, 남경 상인들이 인당수를 지날 때 제물로 바칠 처녀를 사려 한다는 소문을 듣게 되었다. 거친 뱃길의 안전을 빌기 위해 처녀를 산 제물로 바친다는 것이었다. 심청은 조금도 망설이지 않았다. 제 한 몸을 바쳐 아버지가 눈을 뜰 수만 있다면, 그보다 더한 일이라도 마다하지 않을 것 같았다. 심청은 상인들을 찾아가, 공양미 삼백 석을 받는 대신 기꺼이 제물이 되겠노라 선뜻 제 몸을 팔았다.</p>
          <p>상인들은 심청의 갸륵한 효심에 감탄하면서도, 약속대로 몽은사에 공양미 삼백 석을 올려 주었다. 그리고 심청이 떠나야 할 날을 정하였다. 심청은 이 모든 사실을 아버지에게는 차마 밝히지 못한 채, 홀로 남겨질 아버지를 생각하며 남몰래 눈물을 삼켰다. 아버지 곁을 떠난다는 생각에 가슴이 미어졌으나, 심청은 겉으로는 애써 태연한 척하였다. 아버지가 눈을 떠 밝은 세상을 보게 될 것을 떠올리면, 그 두려움도 조금은 견딜 만하였다. 남은 며칠을 심청은 더욱 정성껏 아버지를 봉양하며 보냈다. 그 며칠이 아버지와 함께할 마지막 시간이었다.</p>

          <p class="section-title">Part 6. 아버지와의 이별</p>
          <p>어느덧 심청이 상인들을 따라 떠나야 할 날이 밝았다. 심청은 마지막으로 아버지의 밥상을 정성껏 차려 올렸다. 그러고는 더 이상 숨길 수 없어, 그간의 사정을 눈물로 아뢰었다. 자신이 공양미 삼백 석에 몸을 팔아 오늘 인당수로 떠난다는 말을 들은 심 봉사는, 그만 넋을 잃고 말았다. "아니, 이게 대체 무슨 소리냐! 눈을 뜬들 무엇 하겠느냐, 네가 없으면 내가 어찌 산단 말이냐! 차라리 나를 데려가거라!" 심 봉사는 딸을 붙들고 땅을 치며 통곡하였다. 그러나 이미 공양미는 절에 올려졌고, 떠나야 할 날은 돌이킬 수 없었다.</p>
          <p>심청은 오열하는 아버지를 끌어안고, 눈물로 마지막 당부를 올렸다. "아버지, 부디 몸 성히 지내시어 밝은 눈을 얻으소서. 불효한 소녀는 먼저 갑니다." 차마 떨어지지 않는 발걸음을, 심청은 모질게 돌려 상인들을 따라나섰다. 심청은 몇 번이고 뒤를 돌아보며 아버지의 모습을 눈에 담았다. 이승에서 다시는 뵙지 못할 아버지였다. 멀어지는 딸의 뒷모습에 심 봉사는 하염없이 땅을 치며 울었고, 온 동네 사람들도 그 애절한 이별에 함께 눈물을 흘렸다. 배에 오른 심청은 멀어지는 고향 땅을 바라보며, 아버지의 눈이 꼭 뜨이기를 속으로 빌고 또 빌었다. 그 간절한 기도만이 거친 바다 위로 하염없이 흩어졌다.</p>

          <p class="section-title">Part 7. 인당수 투신</p>
          <p>심청을 실은 배는 거친 바다를 가르며 마침내 인당수에 이르렀다. 인당수는 예부터 물살이 사납고 풍랑이 거세기로 이름난 험한 바다였다. 뱃사람들은 제단을 차리고 정성껏 고사를 지낸 뒤, 심청에게 물에 들 것을 청하였다. 심청은 뱃머리에 올라 서쪽 하늘을 향해 두 손을 모으고 간절히 빌었다. "하느님, 부디 이 몸을 받으시고, 그 대신 눈먼 제 아버지의 눈을 밝게 열어 주옵소서." 심청은 아버지를 마지막으로 소리 내어 부르고는, 치마를 뒤집어쓴 채 성난 물결 속으로 몸을 던졌다. 거센 파도가 삽시간에 심청을 집어삼켜 버렸다.</p>
          <p>다시 잔잔히 가라앉는 바다를 바라보며, 뱃사람들은 그 갸륵한 효심에 저마다 눈물을 뿌렸다. 꽃다운 나이에 아버지를 위해 선뜻 목숨을 바친 심청의 효성은, 하늘과 바다를 모두 감동시키기에 조금도 모자람이 없었다. 하늘도 그 지극한 효심을 차마 저버리지 못하였던 것이다. 뱃사람들은 심청의 넋을 위로하며 한동안 그 자리를 떠나지 못하였다. 신기하게도, 심청이 몸을 던지자 그토록 사납던 풍랑이 거짓말처럼 잦아들고 바다가 이내 잔잔해졌다. 상인들은 무사히 뱃길을 갈 수 있게 되었으나, 그 마음만은 끝내 무겁기만 하였다. 그러나 심청의 이야기는 결코 그것으로 끝이 아니었다. 바닷속에서는 뜻밖의 일이 심청을 기다리고 있었다.</p>

          <p class="section-title">Part 8. 용궁과 환생</p>
          <p>심청이 가라앉은 곳은 다름 아닌 용왕이 다스리는 바닷속 용궁이었다. 하늘과 바다를 감동시킨 심청의 지극한 효성은, 이미 용왕의 귀에까지 전해져 있었다. 용왕은 선녀들을 보내어, 물에 든 심청을 극진히 받들어 모시게 하였다. 심청은 용궁에서 더없이 융숭한 대접을 받으며 한동안 머물렀다. 얼마 뒤, 용왕은 이토록 효성 지극한 사람을 바닷속에만 둘 수는 없다고 여겼다. 용왕은 심청을 한 송이 커다란 연꽃 속에 고이 태워, 다시 세상의 바다 위로 돌려보냈다. 심청을 품은 연꽃은 둥실둥실 떠올라, 인당수의 푸른 물결 위를 홀로 떠다녔다. 마침 그곳을 다시 지나던, 전날 심청을 제물로 샀던 남경 상인들이 그 신기한 연꽃을 발견하였다.</p>
          <p>사람 하나가 들어앉을 만큼 커다란 연꽃이 물 위에 두둥실 떠 있으니, 결코 예삿일이 아니라 여겼다. 상인들은 그 연꽃을 조심조심 고이 건져 올렸다. 상인들은 전에 제물로 바친 처녀를 문득 떠올리며 알 수 없는 숙연함에 잠겼다. 이토록 크고 고운 연꽃은 난생처음 보는 것이었다. 그들은 이것이 결코 예사 꽃이 아님을 직감하였다. 꽃에서는 은은한 향기가 그윽이 풍겨 나왔다. 연꽃을 실은 뱃전에는 상서로운 기운마저 감도는 듯하였다. 상인들은 그 꽃을 고이 모셔 서둘러 뱃머리를 돌렸다.</p>

          <p class="section-title">Part 9. 황후가 된 심청</p>

          <p class="section-title">Part 7. 암행어사 이몽룡</p>
          <p>한편 한양으로 올라간 이몽룡은, 밤낮을 가리지 않고 학업에 정진하였다. 그 피나는 노력이 헛되지 않아, 몽룡은 마침내 과거에 당당히 장원으로 급제하였다. 임금은 그의 뛰어난 재주를 어여삐 여겨, 몽룡에게 전라도 일대를 살피는 암행어사의 중임을 내렸다. 암행어사란 임금을 대신하여 지방 관리들의 잘잘못을 몰래 살피고, 탐관오리를 벌하며 백성을 보살피는 막중한 벼슬이었다. 몽룡은 마패를 품에 깊이 지니고, 그리운 남원을 향해 길을 재촉하였다. 그러나 그는 자신의 신분을 감추기 위해, 일부러 다 떨어진 옷에 헤진 갓을 쓴 초라한 거지 행색으로 변장하였다.</p>

          <p class="section-title">Part 8. 옥중 상봉</p>
          <p>거지 행색의 몽룡은 먼저 춘향의 집을 찾아, 애타게 사위를 기다리던 월매와 마주하였다. 월매는 거지가 되어 돌아온 몽룡을 보고 그만 크게 낙심하였으나, 몽룡은 조금도 내색 없이 춘향이 갇힌 옥으로 향하였다. 옥방에서 몽룡을 마주한 춘향은, 그토록 그리던 지아비가 비렁뱅이 꼴이 되어 나타난 것을 보고 한순간 가슴이 무너졌다. 그러나 춘향은 조금도 몽룡을 원망하거나 변심하지 않았다. 도리어 춘향은 몽룡의 앞날을 걱정하며, 자신이 죽거든 부디 잘 거두어 달라고 애틋하게 당부하였다. "서방님이 비록 이리 되셨어도, 소녀의 지아비는 오직 서방님 한 분뿐입니다. 내일 사또의 생일잔치가 끝나면 소녀는 죽은 목숨이나, 그래도 결코 두 마음은 품지 않겠습니다."</p>

          <p>그 무렵, 같은 마을에 사는 한 부자가 이 딱한 소문을 전해 들었다. 그 부자는 재물은 산더미처럼 쌓아 두었으나, 신분이 낮은 상민인 탓에 늘 천대를 받으며 살아왔다. 아무리 돈이 많아도 양반 앞에서는 함부로 말 한마디 못 하고, 말을 타고 가다가도 양반을 만나면 얼른 내려서 굽실거려야 했다. 부자는 늘 그것이 뼈에 사무치게 분하고 서러웠다. 그러던 차에 양반이 환곡을 갚지 못해 옥에 갇히게 되었다는 소문을 듣자, 부자의 머릿속에 한 가지 묘안이 번쩍 떠올랐다. "양반은 아무리 가난해도 늘 존귀한 대접을 받고, 나는 아무리 부유해도 늘 천한 대접을 받으니 이 얼마나 억울한 노릇인가. 옳다, 이참에 저 양반의 신분을 통째로 사들이자!"</p>
          <p>부자는 곧장 양반의 집을 찾아갔다. 그러고는 자기가 그 천 석의 빚을 대신 갚아 줄 터이니, 그 대신 양반 신분을 자기에게 넘겨 달라고 제안하였다. 부자는 비록 배운 것은 없어도, 세상 돌아가는 이치를 꿰뚫어 보는 눈만은 밝은 사람이었다. 돈으로 그토록 바라던 신분까지 살 수 있다면, 그까짓 천 석쯤은 조금도 아깝지 않다고 여겼다. 부자는 조금도 망설이지 않고 자신의 뜻을 거듭 밝혔다. 양반에게는 뜻밖의, 그러나 더없이 솔깃한 제안이었다. 참으로 대담한 발상이 아닐 수 없었다.</p>

          <p class="section-title">Part 5. 거래 성립</p>
          <p>빚에 짓눌려 옥에 갇힐 날만 기다리던 양반에게, 부자의 제안은 그야말로 가뭄의 단비와도 같았다. 양반은 두말없이 그 제안을 덥석 받아들였다. 부자는 약속대로 관가로 달려가, 양반이 진 환곡 천 석을 한꺼번에 모두 갚아 주었다. 산더미처럼 쌓였던 빚이 한순간에 깨끗이 사라졌다. 양반은 옥에 갇힐 신세를 면하였고, 부자는 그토록 바라던 양반 신분을 손에 넣게 되었다. 두 사람 모두 제 뜻을 이룬 셈이었다. 양반은 부자에게 거듭 고마움을 전하며, 이제부터 양반 노릇은 그대가 하라고 하였다. 부자는 꿈에도 그리던 양반이 되었다는 생각에 가슴이 벅차올랐다.</p>
          <p>이제 자기도 떳떳이 고개를 들고, 남들에게 존경받으며 살 수 있게 되었다고 굳게 믿었다. 부자는 당장이라도 번듯한 의관을 갖추어 입고 마을을 활보하고 싶은 마음뿐이었다. 이제 누구도 자기를 함부로 대하지 못하리라 생각하니 절로 어깨가 으쓱해졌다. 관가에서도 밀린 환곡을 한꺼번에 받게 되었으니 더없이 반가운 일이었다. 그러나 양반이 된다는 것이 과연 무엇을 뜻하는지, 부자는 아직 아무것도 알지 못하였다. 기쁨에 들뜬 그의 앞에 어떤 굴레가 기다리는지도 알 턱이 없었다. 그렇게 신분이 뒤바뀌는 기이한 거래가 성사된 것이다.</p>

          <p class="section-title">Part 6. 군수의 증서</p>
          <p>그런데 이 소식이 곧 정선 군수의 귀에까지 들어갔다. 군수는 가난한 양반이 그 많은 환곡을 다 갚았다는 말에 놀라, 그 까닭을 알아보러 몸소 양반의 집을 찾았다. 자초지종을 들은 군수는 고개를 끄덕이면서도 한 가지를 깊이 염려하였다. "신분을 사고판 일을 이렇게 말로만 두었다가는, 훗날 반드시 서로 발뺌을 하며 송사가 벌어질 것이다. 그러니 이 일을 문서로 또렷이 밝혀 두는 것이 좋겠다." 군수는 고을 사람들을 한자리에 불러 모아 증인으로 세우고, 양반 매매를 공식으로 증명하는 증서를 만들어 주기로 하였다. 부자는 이제 관가에서 번듯한 문서까지 만들어 준다 하니, 더없이 든든하고 기뻤다.</p>
          <p>이윽고 군수가 붓을 들어 증서를 써 내려가기 시작하였다. 과연 그 증서에는 양반이란 어떤 존재인지가 낱낱이 적히게 될 터였다. 군수는 붓과 먹을 가져오게 하고 두루마리를 넓게 펼쳤다. 둘러선 고을 사람들도 저마다 숨을 죽인 채 그 광경을 지켜보았다. 양반 신분을 사고파는 일이 대체 어떻게 문서로 남을지, 모두가 자못 궁금해하는 눈치였다. 둘러선 사람들 사이에서는 나직한 수군거림이 끊이지 않았다. 부자는 설레는 마음으로 그 앞에 공손히 꿇어앉아 귀를 기울였다. 모두의 시선이 군수의 붓끝으로 쏠렸다.</p>

          <p class="section-title">Part 7. 첫 번째 증서 — 양반의 의무</p>
          <p>군수가 써 내려간 첫 번째 증서에는, 양반이 지켜야 할 온갖 까다로운 법도가 빼곡히 적혀 있었다. 그 내용은 가히 숨이 막힐 지경이었다. 양반은 새벽 네 시만 되면 어김없이 일어나 등불을 켜고 꿇어앉아야 한다. 눈은 코끝을 가만히 내려다보고, 두 발꿈치는 가지런히 모아야 한다. 아무리 춥고 배가 고파도 결코 내색해서는 안 되며, 추워도 곁불을 쬐어서는 안 된다. 밥을 먹을 때에도 맨상투 바람으로 먹어서는 안 되고, 국을 먼저 훌훌 들이켜서도 안 된다. 말을 할 때에는 언제나 느릿느릿 점잖게 하며, 아무리 급해도 종종걸음을 쳐서는 안 된다.</p>
          <p>손에 돈을 직접 쥐어서도 안 되고, 쌀값이 얼마냐 묻는 것조차 체면을 깎는 일이라 하였다. 또한 날이 아무리 더워도 버선을 벗어서는 안 되고, 걸음은 항상 의젓하게 떼어야 한다. 병이 나도 무당을 불러 굿을 해서는 안 되며, 아무리 화가 나도 아내를 때리거나 그릇을 깨뜨려서는 안 된다고 하였다. 더위에 손부채질을 하여서도 안 되고, 이가 쑤셔도 끙끙 소리 내어 앓아서는 안 된다 하였다. 이렇듯 양반이 지켜야 할 법도는 끝도 없이 줄줄이 이어졌다. 하나같이 번거롭고 고통스럽기 짝이 없는 것들뿐이었다. 부자는 듣기만 하여도 벌써 숨이 턱턱 막히는 듯하였다.</p>

          <p class="section-title">Part 8. 부자의 불만</p>
          <p>군수가 그 긴 증서를 다 읽어 내려가자, 곁에서 잠자코 듣고 있던 부자의 얼굴이 점점 일그러졌다. 양반이 되기만 하면 떵떵거리며 편히 살 줄 알았는데, 증서에 적힌 것은 온통 고달프고 까다로운 규범뿐이었던 것이다. 새벽부터 일어나 꿇어앉아야 하고, 추워도 불을 못 쬐고, 배고파도 꾹 참아야 하다니. 부자는 그만 기가 턱 막혔다. "아니, 이게 다 무엇이란 말이오? 나는 양반이 좋다기에 큰돈을 들여 산 것인데, 이대로라면 손해만 잔뜩 보는 꼴이 아니오. 제발 좀 이롭게, 내게 득이 되도록 고쳐 주시오!" 부자는 답답한 마음에 군수에게 사정하였다.</p>
          <p>양반 노릇이 이토록 불편하고 괴로운 것일 줄은 미처 몰랐던 터였다. 부자는 양반이란 그저 떵떵거리며 남을 부리고 사는 자리인 줄로만 알았다. 그런데 막상 그 속을 들여다보니, 온종일 체면을 차리느라 제 몸 하나 편히 두지 못하는 고역이 아닌가. 차라리 상민으로 지내던 때가 훨씬 속 편하였다는 생각마저 들 지경이었다. 부자의 얼굴에는 낭패한 기색이 역력하였다. 군수는 알겠다는 듯 고개를 끄덕이더니, 그러면 다시 증서를 고쳐 써 주겠노라 하였다. 그러고는 곧 또 한 장의 새로운 증서를 쓰기 시작하였다. 기대가 컸던 만큼 부자의 실망도 그만큼 깊었다.</p>

          <p class="section-title">Part 9. 두 번째 증서 — 양반의 특권</p>
          <p>군수가 다시 써 내려간 두 번째 증서에는, 이번에는 양반이 누릴 수 있는 온갖 특권이 적혀 있었다. 그러나 그 특권이라는 것은 하나같이 상민을 함부로 짓밟는 횡포에 지나지 않았다. 양반은 농사를 짓지 않아도 되고, 글만 조금 읽으면 과거에 급제해 벼슬을 얻을 수 있다. 이웃집 소가 있으면 끌어다가 제 밭을 먼저 갈게 하고, 마을 사람을 불러다 제 논의 김을 매게 하여도 누구 하나 감히 거역하지 못한다. 상민이 양반에게 밉보이기라도 하면, 그 코에 잿물을 들이붓고 상투를 잡아 휘두르며 수염을 잡아 뽑아도 아무런 탈이 없다. 뿐만 아니라 궁할 때면 이웃의 재물을 꾸어다 써도 되고, 마을의 일꾼을 거저 부려도 누가 감히 뭐라 하지 못한다.</p>
          <p>상민을 잡아다 제집 일을 시키고도 삯 한 푼 주지 않아도 그만이었다. 법도 체면도 모두 양반의 편이었으니, 힘없는 백성만 억울할 따름이었다. 증서가 길어질수록 그 횡포의 가짓수도 끝없이 늘어만 갔다. 이렇듯 두 번째 증서는, 양반이 아무런 벌도 받지 않고 상민을 제 마음대로 부리고 괴롭힐 수 있다는 내용으로 가득하였다. 양반의 권세란 곧 힘없는 백성을 짓누르는 횡포와 다름없음을, 군수는 그 증서에 낱낱이 드러내 보인 것이었다. 듣는 이의 낯이 다 화끈거릴 지경이었다.</p>

          <p class="section-title">Part 10. 부자의 도망</p>
          <p>두 번째 증서의 내용을 끝까지 듣고 난 부자는, 그만 기가 질려 혀를 내둘렀다. 양반의 의무는 고달프기 짝이 없더니, 양반의 특권이라는 것은 또 한결같이 남을 등쳐 먹는 도둑질이나 다름없었던 것이다. 그것은 선비의 체면이 아니라 차라리 도적의 행실에 가까웠다. 부자는 질겁하여 손사래를 치며 외쳤다. "그만두시오, 그만둬! 참으로 맹랑하기 짝이 없구려. 당신들은 지금 나를 장차 도둑놈으로 만들 작정이란 말이오?"</p>
          <p>부자는 더 들을 것도 없다는 듯 머리를 절레절레 흔들며 그 자리에서 벌떡 일어났다. 그러고는 뒤도 돌아보지 않고 부리나케 달아나 버렸다. 그날 이후로 부자는 죽을 때까지 두 번 다시 '양반'이라는 말을 입에 담지 않았다. 애써 큰돈을 치르고 사려 했던 양반이, 겉으로는 번드르르하나 그 속은 허례와 횡포로 가득 찬 허울뿐임을 똑똑히 깨달은 까닭이었다. 부자가 꽁지 빠지게 달아나는 뒷모습을 보며, 둘러섰던 고을 사람들은 저마다 어이없다는 듯 혀를 찼다. 그토록 떠받들던 양반이 알고 보니 그런 것이었다니, 다들 기가 막힐 노릇이었다. 번듯한 이름 뒤에 감추어진 양반 사회의 민낯이 이 한바탕 소동으로 낱낱이 드러난 셈이었다. 연암이 이 한 편의 이야기에 담고자 한 뜻이 바로 거기에 있었다.</p>

          <p class="section-title">Part 1. 소작인의 아들과 마름집 딸</p>
          <p>우리 집은 점순네 땅을 부쳐 먹고 사는 소작인이었다. 땅 한 뙈기 없는 처지라, 마름인 점순이네한테 밉보이기라도 하면 집도 내놓고 당장 쫓겨날 판이었다. 그래서 어머니는 늘 내게 점순네 비위를 거스르지 말라고 신신당부를 했다. 나는 그 말을 뼈에 새기고, 점순이 앞에서는 늘 조심조심하며 지냈다. 점순이는 나와 동갑내기였지만, 나보다 훨씬 당돌하고 깜찍한 계집애였다. 나로 말할 것 같으면 숫기가 없고 어수룩해서, 점순이 앞에만 서면 공연히 쭈뼛거리기 일쑤였다. 동네 애들은 그런 나를 두고 숙맥이라고 놀려 댔지만, 나는 그런 말에도 그저 헤벌쭉 웃고 말 뿐이었다.</p>
          <p>그런데 요즘 들어 점순이가 부쩍 나를 못살게 굴기 시작했다. 까닭을 도무지 알 수가 없었다. 나는 그저 농사일이며 나무하는 일에만 매달렸을 뿐, 계집애의 속마음 같은 걸 헤아릴 줄은 깜깜 몰랐다. 어른들은 계집애가 사내를 괴롭히는 데에는 다 속뜻이 있다고들 했지만, 나는 그런 말을 들어도 영 알아듣지 못했다. 점순이가 나를 볼 때마다 눈을 반짝이며 쫓아다니는 것이, 나는 그저 심술로만 여겨졌다. 오늘도 점순이는 울타리 너머에서 나를 빤히 쳐다보고 있었다. 나는 괜히 뒤통수가 따가워 자꾸만 몸을 틀었다.</p>

          <p class="section-title">Part 2. 감자 세 개</p>
          <p>그날도 나는 울타리를 엮느라 바빴다. 그때 점순이가 사방을 두리번거리며 살금살금 다가오더니, 제 치마 속에서 무언가를 불쑥 꺼내 내밀었다. 노릇노릇 알맞게 구운 굵은 감자 세 개였다. "느 집엔 이거 없지?" 점순이는 생색을 내듯 말하며, 어서 받아먹으라고 자꾸 눈짓을 했다. 그것은 제가 먹다 남은 것도 아니요, 나 먹으라고 일부러 구워 온 것이 분명했다. 그러나 나는 그 속을 알 리 없었다. 나는 순간 자존심이 울컥 상했다. 제까짓 게 마름집 딸이라고 나를 업신여기는 것만 같았던 것이다. 나는 돌아보지도 않은 채 "</p>
          <p>안 먹는다. 우리 집엔 감자 많다." 하고는 어깨 너머로 그 손을 탁 밀어 버렸다. 그러자 점순이의 얼굴이 금세 홍당무처럼 새빨개졌다. 나를 독하게 쏘아보는 두 눈에는 어느새 눈물까지 글썽글썽 맺혔다. 점순이는 입술을 바르르 떨더니, 홱 몸을 돌려 달아나 버렸다. 나는 그저 어리둥절할 뿐이었다. 그까짓 감자 한 알에 왜 저리 서러워하는지, 나로서는 도무지 알 수 없는 노릇이었다. 나중에야 어렴풋이 깨달은 것이지만, 점순이가 그토록 서러워한 데에는 필시 까닭이 있었을 것이다. 그러나 그때의 나는 그런 속내를 헤아리기엔 너무도 어수룩하기만 했다. 그날 이후로 점순이의 심술은 날이 갈수록 더해만 갔다.</p>

          <p class="section-title">Part 3. 씨암탉을 때리다</p>
          <p>감자를 거절당한 그날 뒤로, 점순이는 아주 독이 오른 듯했다. 하루는 내가 마당에 나와 보니, 점순이가 우리 집 씨암탉을 담 밑에 몰아넣고 사정없이 때리고 있는 것이 아닌가. 가뜩이나 알을 잘 낳던 귀한 암탉이었다. 점순이는 암탉을 두 손으로 움켜쥐고는, 때릴 테면 때려 보라는 듯 나를 흘끔거리며 매질을 했다. 매질을 할수록 더 약이 오르는지, 나중에는 암탉의 죽지를 붙들어 땅바닥에 메다꽂기까지 했다. 암탉이 꼬꼬댁 비명을 지르며 날개를 푸드덕거렸다. 나는 기가 막혔지만, 선뜻 달려들어 말리지도 못했다. 마름집 딸을 잘못 건드렸다가는 무슨 봉변을 당할지 몰라서였다. 그저 발만 동동 구르며 "남의 닭을 왜 때리느냐"</p>
          <p>고 소리칠 뿐이었다. 그러자 점순이는 앙칼지게 "그래, 때렸다. 어쩔 테냐." 하며 오히려 나를 매섭게 쏘아붙였다. 나는 분해서 얼굴이 벌겋게 달아올랐지만, 끝내 아무 말도 못 하고 돌아서야 했다. 돌아서는 내 등 뒤로 점순이의 쌀쌀맞은 웃음소리가 따라붙었다. 나는 그 웃음소리가 귀에 쟁쟁해, 그날 밤 잠자리에서도 좀처럼 분이 가시지 않았다. 도대체 내가 무얼 잘못했기에 점순이가 저러는지, 아무리 곱씹어도 알 길이 없었다. 점순이의 심술이 대체 어디까지 갈지, 생각할수록 속이 터질 노릇이었다.</p>

          <p class="section-title">Part 4. 닭싸움</p>
          <p>점순이의 심술은 거기서 그치지 않았다. 점순이네 수탉은 덩치가 크고 사나운 놈이었는데, 우리 집 수탉은 그에 비하면 턱없이 작고 순했다. 점순이는 틈만 나면 제 집 수탉을 몰고 와, 우리 수탉과 싸움을 붙였다. 점순네 수탉은 한번 덤벼들면 상대가 피를 보기 전에는 물러서는 법이 없었다. 큰 수탉이 달려들어 우리 닭의 볏을 사정없이 쪼아 댔다. 우리 수탉은 얼마 버티지도 못하고 선혈이 낭자하게 터져, 피를 뚝뚝 흘리며 구석으로 쫓겨 다녔다. 점순이는 그 꼴을 보며 재미있다는 듯 깔깔거렸다. 나는 달려가 두 닭을 억지로 떼어 놓았지만, 내가 돌아서기만 하면 점순이는 또다시 싸움을 붙여 놓곤 했다.</p>
          <p>날마다 그 모양이니, 우리 수탉은 성한 데가 없이 볏이 찢기고 깃털이 숭숭 빠졌다. 보다 못한 나는 우리 닭을 안아다 광 속에 가두어도 보았지만, 그때뿐이었다. 우리 수탉은 기껏 한두 번 대들다가는 번번이 꽁무니를 빼고 달아나기 바빴다. 그럴 때마다 점순이는 신이 나서 손뼉을 치며 더욱 좋아라 했다. 나는 그 모습에 울화가 치밀면서도, 겉으로는 내색 한 번 하지 못했다. 나는 애꿎은 닭만 바라보며 속을 끓였다. 그러면서도 점순이에게 대놓고 따지지도 못하는 내 처지가, 한없이 초라하게만 느껴졌다.</p>

          <p class="section-title">Part 5. 속만 끓이는 나</p>
          <p>날마다 피투성이가 되는 우리 수탉을 볼 때마다, 나는 가슴이 미어지는 것 같았다. 점순이가 미워 견딜 수가 없었다. 그러나 그 미움을 겉으로 드러낼 수도 없는 노릇이었다. 우리는 점순네 땅을 부쳐 먹고 사는 처지라, 점순이에게 잘못 대들었다가는 당장 땅이 떨어질까 두려웠기 때문이다. 땅이 떨어지면 온 식구가 길바닥에 나앉아야 했다. 어머니가 늘 당부하던 말이 자꾸만 귓가에 맴돌았다. 나는 애꿎은 지게 작대기만 땅바닥에 탁탁 내리치며 분을 삭였다. 점순이는 그런 내 속도 모르고, 아니 어쩌면 뻔히 알면서도 더욱 기승을 부렸다.</p>
          <p>울타리 너머로 나를 빤히 보며 입을 삐죽거리기도 하고, 혀를 쏙 내밀며 약을 올리기도 했다. 나는 그저 얼굴만 벌겋게 붉히고 고개를 돌릴 뿐이었다. 점순이가 왜 하필 나한테만 이러는지, 생각하면 할수록 알 수 없는 노릇이었다. 분하고 서럽고, 또 어쩐지 까닭 모를 서운함까지 뒤섞여 마음이 몹시 복잡했다. 밤이면 나는 우리 수탉의 찢긴 볏에 약을 발라 주며, 애꿎은 그놈만 가만히 어루만지곤 했다. 말 못 하는 짐승이 무슨 죄인가 싶어, 볼수록 더욱 가엾기만 했다. 나는 그 복잡한 심사를 누구에게도 털어놓지 못한 채 혼자 끙끙 앓았다. 애꿎은 하늘만 올려다보며 긴 한숨을 내쉴 뿐이었다.</p>

          <p class="section-title">Part 6. 고추장을 먹이다</p>
          <p>이대로 두었다가는 우리 수탉이 머지않아 죽고 말 것만 같았다. 나는 어떻게든 우리 닭을 이기게 하고 싶었다. 궁리 끝에 떠올린 것이 바로 고추장이었다. 고추장을 먹이면 닭이 매운 기운에 힘이 펄펄 솟아 사나워진다는 말을, 나는 어디선가 들었던 것이다. 나는 아무도 몰래 부엌에서 고추장을 한 숟가락 퍼다가, 물에 멀겋게 개어 우리 수탉의 주둥이에 억지로 발라 먹였다. 닭은 맵다고 몸서리를 치며 고개를 내둘렀다. 그러고는 점순네 수탉 앞에 슬그머니 내다 놓았다. 처음 얼마간은 과연 효험이 있는 듯했다. 우리 수탉이 전에 없이 기세 좋게 달려들어 큰 닭의 볏을 쪼아 댔다.</p>
          <p>나는 신이 나서 손에 땀을 쥐고 지켜보았다. 그러나 그것도 잠시뿐이었다. 매운 기운이 가시자 우리 닭은 이내 축 지쳐 늘어졌고, 큰 수탉에게 도로 사정없이 쪼이고 말았다. 고추장이 너무 과했는지, 나중에는 우리 닭이 도리어 비실비실 맥을 못 추기까지 했다. 나는 그런 닭을 보며 괜한 짓을 했나 싶어 후회가 밀려들었다. 그래도 달리 뾰족한 수가 없으니 그저 답답하기만 했다. 마지막으로 믿었던 고추장마저 이 모양이니, 나는 하늘이 무너지는 것만 같았다. 나는 그만 맥이 탁 풀려 그 자리에 주저앉고 말았다. 고추장까지 먹였는데도 소용이 없으니, 이제는 더 어찌해 볼 도리가 없었다.</p>

          <p class="section-title">Part 7. 산에서 내려오는 길</p>
          <p>그날 나는 뒷산으로 나무를 하러 올라갔다. 한 짐 가득 나무를 해서 지게에 지고 산길을 터덜터덜 내려오는데, 멀리 우리 집 마당 쪽에서 요란한 닭 소리가 들려왔다. 가슴이 철렁 내려앉았다. 지게를 진 두 어깨가 천근만근 무거웠지만, 나는 나무 짐도 잊은 채 비탈을 구르듯 뛰어 내려갔다. 아니나 다를까, 점순이가 또 저희 수탉을 몰고 와 우리 닭과 싸움을 붙여 놓은 것이었다. 내가 산에 간 틈을 노린 모양이었다. 큰 수탉은 작정한 듯 우리 닭을 사납게 몰아붙였고, 우리 수탉은 거의 초주검이 되어 피를 흘리며 바닥에 널브러져 있었다. 눈을 희번덕이며 당장이라도 숨이 넘어갈 듯 가쁜 숨만 할딱이고 있었다.</p>
          <p>점순이는 바위에 걸터앉아, 그 광경을 태평스레 내려다보며 히죽히죽 웃고 있었다. 그 태평스러운 웃음을 보자, 나는 눈앞이 아뜩하고 숨이 턱 막히는 것만 같았다. 가까이 다가가 그 참혹한 꼴을 보는 순간, 나는 지게를 내팽개치다시피 벗어 던지고 단숨에 달려들었다. 머릿속이 하얘지고, 그동안 쌓이고 쌓인 분이 왈칵 치밀어 올랐다. 더는 참을 수가 없었다. 눈앞의 그 광경에 나는 그만 눈이 뒤집히고 말았다. 나도 모르게 두 주먹이 부르르 떨리고, 온몸의 피가 거꾸로 솟는 것만 같았다.</p>

          <p class="section-title">Part 8. 수탉을 때려죽이다</p>
          <p>나는 앞뒤 가릴 것도 없이, 지게 작대기를 집어 들고 점순네 수탉을 향해 힘껏 내리쳤다. 한 번, 두 번, 정신없이 후려치자, 그 크고 사납던 수탉이 외마디 소리를 지르며 그 자리에 폭 고꾸라졌다. 날개를 몇 번 파닥이더니, 이내 축 늘어져 꼼짝도 하지 않았다. 숨이 끊어진 것이었다. 그제야 나는 내가 무슨 짓을 저질렀는지 깨닫고 소스라치게 놀랐다. 하필이면 마름집 닭을 죽여 놓았으니, 이 일이 알려지면 우리 집은 꼼짝없이 땅이 떨어지고 쫓겨날지도 몰랐다. 어머니와 아버지의 겁에 질린 얼굴이 눈앞에 어른거렸다. 겁이 더럭 나서 온몸이 사시나무처럼 바르르 떨렸다.</p>
          <p>나는 죽은 닭을 내려다보며 어쩔 줄을 몰라, 그만 울음이 왈칵 터지고 말았다. 눈물 콧물이 범벅이 되도록 엉엉 울었다. 작대기를 쥔 손이 아직도 부들부들 떨렸고, 나는 내가 무슨 짓을 저질렀는지도 실감이 나지 않았다. 한참을 멍하니 서 있다가, 나는 그만 다리에 힘이 풀려 그 자리에 털썩 주저앉고 말았다. 이 일을 대체 어찌 수습해야 할지, 그저 눈앞이 캄캄하고 막막하기만 했다. 땅이 꺼지고 하늘이 노랗게만 보였다. 점순이가 바로 곁에 서 있다는 것조차 까맣게 잊은 채, 나는 그저 겁에 질려 어린애처럼 울기만 했다.</p>

          <p class="section-title">Part 9. 그럼 이담부턴 안 그럴 테냐</p>

          <p class="section-title">Part 6. 소나기</p>

          <p>소녀를 안으로 들여보내고 자기는 밖에 서 있으려 했으나, 비가 들이쳐 어쩔 수 없었다. 소녀가 들어오라고 손짓했다. 소년이 들어가니 수숫단 속은 좁아 둘의 몸이 바싹 붙었다. 소녀에게서 향긋한 냄새가 났다. 소녀의 젖은 머리칼이 이마에 가만히 달라붙어 있었다. 소년은 꼼짝도 못 하고 숨만 죽인 채 앉아 있었다. 빗물이 수숫단을 타고 뚝뚝 떨어져 내렸다. 이윽고 빗소리가 뜸해지기 시작했다. 수숫단 틈으로 내다보니, 어느새 구름이 걷히고 햇빛이 눈부시게 비치고 있었다. 두 아이는 그제야 마주 보며 멋쩍게 웃었다.</p>

          <p class="section-title">Part 7. 도랑을 건너</p>
          <p>소나기가 지나가자, 두 아이는 움집에서 나와 산을 내려왔다. 그런데 올 때 건넜던 도랑이 엄청나게 불어 있었다. 붉은 흙탕물이 콸콸 소리를 내며 사납게 흘렀다. 소녀가 머뭇거리자, 소년이 등을 돌려 대었다. "업혀." 소녀는 잠깐 망설이다가 조심스레 소년의 등에 업혔다. 소년은 소녀를 업고 한 발 한 발 도랑으로 들어섰다. 도랑물은 발목을 지나 어느새 정강이까지 차올랐다. 물살에 다리가 휘청거렸지만, 소년은 이를 악물고 끝까지 건넜다. 소년은 소녀가 혹 미끄러질까 봐 두 손에 힘을 꼭 주었다. 등에 업힌 소녀는 소년의 목덜미를 가만히 붙잡고 있었다.</p>
          <p>소녀의 가슴이 소년의 등에 닿아 따뜻했다. 소년은 괜히 얼굴이 화끈거렸다. 도랑을 다 건너 소녀를 내려놓으니, 소녀의 분홍 스웨터 앞자락에 검붉은 진흙물이 들어 있었다. 소년의 등에서 옮아 간 얼룩이었다. 소녀는 그 얼룩을 가만히 들여다볼 뿐 아무 말도 하지 않았다. 두 아이는 다시 개울가에 이르렀다. 헤어질 때, 소녀가 "그런데 저, 오늘 참 재밌었어." 하고 나직이 말했다. 소년은 대답도 못 한 채 멀어지는 소녀의 뒷모습만 하염없이 바라보았다. 소녀의 분홍 스웨터 자락이 저녁놀 속으로 차츰 작아져 갔다. 그날 밤 소년은 좀처럼 잠을 이루지 못했다.</p>

          <p class="section-title">Part 8. 보이지 않는 소녀</p>
          <p>그 뒤로 소녀는 개울가에 나오지 않았다. 하루, 이틀, 소년은 날마다 개울가로 나가 보았지만, 소녀의 모습은 끝내 보이지 않았다. 소년은 까닭 모를 허전함에 가슴이 답답했다. 주머니 속에는 언젠가 소녀에게 주려고 넣어 둔 대추가 들어 있었다. 소년은 그 대추를 만지작거리며 소녀를 생각했다. 학교에서 돌아오면 으레 개울가로 나갔다. 조약돌을 주워 물에 던져 보기도 하고, 징검다리에 가만히 앉아 보기도 했다. 개울가 미루나무 잎이 하나둘 노랗게 물들어 떨어지고 있었다. 소년은 그 잎을 주워 물 위에 띄워 멀리 흘려보내곤 했다. 그러나 소녀는 좀처럼 나타나지 않았다. 혹시 앓는 건 아닐까.</p>
          <p>그날 소나기를 함께 맞은 탓은 아닐까. 소년은 공연히 마음이 무거웠다. 밤이면 소년은 잠자리에 누워 그날의 일을 자꾸만 되새겼다. 수숫단 속에서 맡았던 향긋한 냄새가 코끝에 되살아나는 듯했다. 동네 사람들의 말로는, 윤 초시네가 요즘 집안이 많이 기울었다고 했다. 대대로 내려오던 전답을 하나둘 팔고 있다는 것이었다. 소년은 소녀네 집 쪽을 멀리서 바라보곤 했다. 그러면서도 차마 찾아가 볼 엄두는 내지 못했다. 가을이 점점 깊어 가고, 개울물도 날로 차가워졌다. 소년의 그리움만 자꾸 깊어 갔다.</p>

          <p class="section-title">Part 9. 이사 간다는 말</p>
          <p>그러던 어느 날, 소년은 개울가에서 다시 소녀를 만났다. 소녀는 그사이 몹시 야위고 얼굴이 창백해져 있었다. "그동안 앓았다." 소녀가 힘없이 말했다. 그 소나기를 맞은 뒤로 내내 자리에 누워 있었다는 것이다. 소년은 가슴이 뜨끔했다. 소녀의 야윈 얼굴을 보자, 소년은 가슴 한구석이 아릿해 왔다. 무슨 말이라도 해 주고 싶었지만, 좀처럼 입이 떨어지지 않았다. 소녀가 다시 말을 이었다. "저, 우리 이사 가게 됐다." 집안 형편이 어려워져 양평으로 간다고 했다. 소년은 그만 할 말을 잃고 말았다.</p>
          <p>마침 주머니에 있던 대추를 꺼내 소녀에게 쥐여 주었다. 대추를 받는 소녀의 손끝이 유난히 차갑게 느껴졌다. "우리 증조부가 심으신 거다. 맛봐라." 소녀는 대추를 받으며 희미하게 웃었다. 그날따라 개울물 소리가 유난히 쓸쓸하게 들려왔다. 소년은 소녀에게 무언가 더 주고 싶어 안타까웠다. 그날 밤, 소년은 남의 호두밭에 몰래 들어가 호두를 땄다. 소녀에게 주려는 것이었다. 들킬까 가슴이 두근거렸지만, 조금도 무섭지 않았다. 손이 긁히고 옷이 찢어져도 아깝지 않았다. 다만 소녀가 이사 가기 전에 그것을 전할 수 있을지, 그것만이 걱정이었다. 소년은 호두를 품에 안고 밤길을 달려 돌아왔다.</p>

          <p>스님이 말했다. “댁의 눈을 뜨고 싶으시거든, 부처님께 공양미 삼백 석을 시주하시오. 그리하면 감은 눈을 다시 뜰 수 있소.” 심봉사는 앞뒤 가릴 것 없이 얼떨결에 약속하고 말았다. “삼백 석을 바치겠습니다. 꼭 바치겠습니다.” 스님이 떠나고 나서야 심봉사는 비로소 정신이 들었다. 삼백 석이라니! 밥도 제대로 못 먹는 형편에 그 많은 쌀을 어찌 마련한단 말인가. 참으로 큰일이었다.</p>
          <p class="section-title">Part 4. 후회</p>
          <p>집에 돌아온 심봉사는 땅을 치며 후회했다. 삼백 석이나 되는 쌀을 대체 어디서 구한단 말인가. 평생을 꼬박 모은다 해도 삼백 석은 모을 수 없었다. 밥도 제대로 못 먹는 형편에 삼백 석이라니. 심봉사는 긴 한숨을 쉬며 탄식했다. 밤새 잠을 이루지 못하고 이리저리 뒤척였다. “어찌하면 좋단 말인가. 부처님께 한 약속을 어기면 큰 벌을 받을 터인데.” 눈을 뜨고 싶은 마음은 간절했으나 방법이 없었다.</p>
          <p>심청은 아버지가 밤새 한숨 쉬는 소리를 들었다. “아버지, 무슨 걱정이 있으세요?” 심청이 묻자, 심봉사는 차마 말할 수 없어 얼버무렸다. “아무것도 아니다, 청아.” 하지만 심청은 눈치 빠른 아이였다. 동네 사람들에게 넌지시 물어 그 사정을 알아내고 말았다. 아버지가 공양미 삼백 석을 약속했다는 것을. 심청의 마음이 무거워졌다. 어떻게든 아버지의 눈을 뜨게 해드리고 싶었다.</p>
          <p class="section-title">Part 5. 심청의 결심</p>
          <p>심청은 마침내 결심했다. 아버지의 눈을 뜨게 할 수만 있다면 무엇이든 하겠다고. 밤새 홀로 고민하다가 결심을 굳게 다졌다. 아버지께서 세상을 환히 볼 수 있게 된다면, 제 목숨 하나쯤이야 아깝지 않았다. 그러던 차에 심청은 한 가지 소문을 들었다. 남경으로 장사하러 가는 뱃사람들이 인당수에 바칠 제물로 처녀를 사들인다는 소문이었다. 인당수는 바다의 험하기로 이름난 길목이었다.</p>
          <p>그 험한 곳을 무사히 지나려면 처녀를 제물로 바쳐야 거센 풍랑을 피할 수 있다고 했다. 심청은 곧장 그 뱃사람들을 찾아갔다. “저를 사 가세요. 공양미 삼백 석에 저를 팔겠습니다.” 뱃사람들은 깜짝 놀랐다. 이렇게 어린 처녀가 스스로 목숨을 내놓다니. 심청이 아버지의 눈을 뜨게 하려 한다며 사정을 밝히자, 뱃사람들은 그 효심에 눈물을 흘리며 삼백 석을 내주어 몽운사로 보냈다.</p>
          <p class="section-title">Part 6. 마지막 밤</p>
          <p>떠나는 날이 하루하루 다가왔다. 심청은 끝내 아버지에게 사실을 말하지 못했다. 목숨을 바치러 간다는 말을 어찌 입에 담겠는가. 아버지가 아시면 한사코 막으실 것이 분명했다. 차라리 모르시는 편이 나았다. 마지막 밤, 심청은 아버지를 위해 정성껏 밥상을 차렸다. 평소에는 구하기 힘든 귀한 반찬까지 애써 마련했다. “아버지, 많이 잡수세요.” 심청은 북받치는 눈물을 꾹 삼켰다.</p>
          <p>심봉사는 아무것도 모른 채 밥을 맛있게 먹었다. “오늘따라 반찬이 유난히 맛있구나, 청아.” 심청은 차마 대답하지 못하고 고개를 숙였다. 뜨거운 눈물이 두 뺨을 타고 흘러내렸다. 눈이 먼 심봉사는 딸이 우는 것을 알지 못했다. 밤이 깊어가자 심청은 잠든 아버지를 오래도록 바라보았다. “아버지, 부디 눈을 뜨셔서 세상 구경 많이 하세요. 이 불효녀를 용서해 주세요.” 그리고 새벽에 집을 나섰다.</p>
          <p class="section-title">Part 7. 인당수</p>
          <p>배가 드디어 인당수에 이르렀다. 그러자 갑자기 하늘이 시커멓게 어두워지고 바람이 거세게 몰아쳤다. 집채만 한 파도가 일어나고, 배가 금방이라도 뒤집힐 듯 크게 흔들렸다. 뱃사람들이 겁에 질려 소리쳤다. “이제 제물을 바칠 때가 되었다!” 심청은 깨끗한 흰 옷으로 갈아입고 뱃머리에 올라섰다. 하늘을 올려다보니 둥근 달이 밝게 떠 있었다. 아버지 생각이 사무치게 간절했다.</p>
          <p>“아버지, 부디 눈을 뜨셔서 세상 구경 많이 하세요. 이 불효녀를 용서해 주세요.” 심청은 하염없이 눈물을 흘리며 마지막 말을 남겼다. 그러고는 성난 바다를 향해 몸을 던졌다. 풍덩, 하는 물소리와 함께 심청의 몸이 깊은 바닷속으로 가라앉았다. 바로 그 순간, 거세던 풍랑이 거짓말처럼 멈추었다. 파도가 잔잔해지고 바람이 그치니, 배는 무사히 항해를 이어 갔다. 심청의 희생이 바다를 잠재운 것이다.</p>
          <p class="section-title">Part 8. 용궁</p>
          <p>그러나 심청은 죽지 않았다. 깊은 바닷속에서는 용왕이 심청을 기다리고 있었다. 용왕은 심청의 지극한 효심에 깊이 감동한 터였다. “이렇게 갸륵한 효녀를 어찌 죽게 하겠느냐.” 용왕이 신하들에게 명했다. “어서 저 처녀를 곱게 구하여 모셔 오라.” 신하들이 심청을 받들어 용궁으로 모셔 왔다. 용궁에서 심청은 극진한 대접을 받았다. 상마다 산해진미가 가득 차려졌다.</p>

          <p class="section-title">Part 9. 왕비가 된 심청</p>
          <p>바다 위를 떠다니던 연꽃이 어느 날 임금의 눈에 띄었다. 임금이 신하들에게 명했다. “저 연꽃을 건져 오너라. 저리 탐스러운 연꽃은 내 처음 보는도다.” 신하들이 연꽃을 건져 궁궐로 가져왔다. 임금이 연꽃을 물에 띄워 두었더니, 며칠 뒤 꽃봉오리가 활짝 피어났다. 그 속에서 아름다운 처녀가 걸어 나오니, 바로 심청이었다. 임금은 깜짝 놀라 물었다. “이게 대체 어찌 된 일이냐?”</p>
          <p>심청은 그간의 사연을 낱낱이 아뢰었다. 아버지의 눈을 뜨게 하려고 인당수에 몸을 던졌던 일을. 임금은 심청의 고운 용모와 지극한 효심에 반하고 말았다. “이런 효녀라면 왕비로 삼으리라.” 임금은 심청을 왕비로 맞아들였다. 왕비가 되었어도 심청의 마음은 늘 아버지 곁에 있었다. “아버지를 찾고 싶습니다.” 심청이 아뢰자, 임금은 흔쾌히 허락하고 방방곡곡의 맹인을 불러 모으는 큰 잔치를 열게 했다.</p>

          <p>쓸쓸한 두 마음은 자연스레 서로에게 기대었고, 그 밤 그들은 짧지만 더없이 깊은 인연을 맺었다. 메밀꽃이 하얗게 흐드러진 그 밤의 일을, 허 생원은 평생 단 한 번의 꿈결처럼 가슴 깊이 품게 되었다. "그런 밤은 다시없었지. 꼭 오늘 같은, 달이 흐뭇하게 흐르던 밤이었네." 허 생원은 말끝을 흐리며 긴 한숨을 내쉬었다. 그 한숨 속에는 이십 년 세월의 그리움이 고스란히 담겨 있었다. 조 선달은 몇 번이고 들은 이야기건만, 그 대목에서는 늘 괜스레 숙연해져 말을 아끼곤 했다.</p>

          <p class="section-title">Part 7. 다시 못 만난 사람</p>
          <p>그러나 그 밤이 처음이자 마지막이었다. 날이 밝자 처녀는 이미 집안 사정에 떠밀려 흔적 없이 자취를 감춘 뒤였다. 허 생원이 애가 타도록 이리저리 수소문을 해 보았으나, 성 서방네가 밤새 어디로 야반도주를 했는지 아는 이가 아무도 없었다. 단 하룻밤의 애틋한 인연이 그렇게 허무하게 끊어진 것이다. 그 뒤로 허 생원은 그 처녀를 영영 다시 만나지 못했다. 장돌뱅이로 이 장 저 장을 정처 없이 떠돌면서도, 그의 마음만은 늘 봉평 언저리에 붙박인 듯 매여 있었다. 혹시나 그 사람의 소식이라도 바람결에 들을까, 아니면 번잡한 장터 모퉁이에서 우연히 마주치기라도 할까 하는 부질없는 바람 때문이었다.</p>

          <p>마침내 이주민들의 쌓이고 쌓인 분노가 터지고 말았다. 약속을 저버린 처사에 맞서, 사람들은 거리로 쏟아져 나와 항의하기 시작했다. 훗날 광주대단지 사건이라 불린 일이었다. 살길이 막힌 이들의 절규는 걷잡을 수 없이 거세졌다. 배운 사람이자 말주변이 있던 권씨는, 자연스레 그 성난 무리의 한가운데에 서게 되었다. 그는 이주민들의 부당한 처지를 조리 있게 대변했고, 앞장서서 그들의 억울함을 세상에 외쳤다. 결코 제 한 몸의 이익을 위해서가 아니었다. 벼랑에 몰린 가난한 이웃들을 위해, 옳지 않은 것을 옳지 않다고 말했을 뿐이었다. 그것이 배운 사람으로서 마땅히 해야 할 도리라 그는 믿었다.</p>
          <p>그러나 세상은 그런 그를 그냥 두지 않았다. 질서를 어지럽힌 주동자로 지목되어, 권씨는 끝내 경찰에 붙잡혀 가고 말았다. 옳은 소리를 한 대가는 참혹하기 그지없었다. 가족을 지키려던 성실한 가장이, 하루아침에 쫓기는 신세로 뒤바뀐 것이다. 그날의 일은 권씨의 삶을 송두리째 뒤바꾸어 놓았다. 반듯하던 한 사내의 앞길에, 돌이킬 수 없는 짙은 그늘이 무겁게 드리워지고 있었다. 앞에 나선다는 것이 얼마나 위험한 일인지 모르지 않았으나, 그는 끝내 물러서지 않았다. 불의를 차마 외면하지 못한 한 사람의 양심이, 도리어 그를 죄인으로 만든 셈이었다.</p>

          <p class="section-title">Part 6. 전과자가 되다</p>
          <p>그 일로 권씨는 끝내 전과자가 되고 말았다. 옳은 일에 앞장섰을 뿐이건만, 세상은 그의 이마에 지울 수 없는 낙인을 찍어 버렸다. 감옥에서 풀려난 뒤에도 그를 기다린 것은 끝없는 감시의 눈초리였다. 경찰은 수시로 그의 거처를 들여다보았고, 어디를 가든 요시찰 인물이라는 꼬리표가 그림자처럼 그를 따라다녔다. 그런 처지에 변변한 일자리가 생길 리 없었다. 이력서를 넣는 곳마다 그의 전과가 번번이 발목을 잡았고, 애써 얻은 일자리도 신원이 드러나면 이내 쫓겨나기 일쑤였다. 배운 것도, 가슴에 품은 뜻도 남부럽지 않았으나, 세상은 전과자라는 한마디로 그 모든 것을 가차 없이 덮어 버렸다.</p>
          <p>아무리 발버둥 쳐도 한번 찍힌 낙인은 좀처럼 지워지지 않았다. 가장이 일을 못 하니 식구들의 살림은 밑바닥으로 곤두박질쳤다. 만삭의 아내와 어린것들을 데리고, 권씨는 이 셋방 저 셋방을 떠돌다 끝내 내 집 문간방까지 흘러든 것이었다. 사연을 알고 나니, 나는 그 꼿꼿하던 사내의 등이 왜 그토록 쓸쓸하고 무거워 보였는지 비로소 알 것 같았다. 그 작은 어깨에, 세상이 지운 너무도 무거운 짐이 얹혀 있었던 것이다. 하루하루가 감시와 멸시의 연속이었고, 사람다운 대접 한 번 받기가 하늘의 별 따기였다.</p>

          <p class="section-title">Part 7. 마지막 자존심, 구두</p>
          <p>비로소 나는 권씨가 날마다 구두를 닦던 까닭을 어렴풋이나마 짐작할 수 있었다. 전과자라는 낙인에 세상 모든 문이 닫혔어도, 그는 끝내 단 한 가지만은 결코 놓지 않으려 했다. 바로 사람으로서의 자존심이었다. 끼니를 걸러도, 남의 집 문간방을 전전해도, 그는 결코 스스로를 함부로 내버리지 않았다. 아홉 켤레의 구두를 번쩍이게 닦는 일은, 세상에 짓밟혀도 나는 아직 꺾이지 않았노라 다짐하는 그만의 조용한 의식과도 같았다. 남들이 보기엔 부질없고 궁상맞은 짓이었을지도 모른다. 그러나 그 반들반들한 구두코에는, 배운 사람으로서의 긍지와, 끝까지 사람답게 살고자 하는 안간힘이 고스란히 담겨 있었다.</p>
          <p>세상이 제 모든 것을 앗아 가도, 저 구두만은 결코 빼앗기지 않겠다는 듯 그는 날마다 묵묵히 솔질을 거듭했다. 구두를 닦는 그 시간만큼은, 권씨도 잠시 짓밟히기 전의 반듯한 자신으로 돌아가는 듯했다. 나는 그 모습이 애처로우면서도 한편으로 숙연했다. 한 사내가 끝끝내 지키려는 마지막 자존심이, 그 아홉 켤레의 구두 위에 위태롭게 얹혀 있었던 것이다. 그 구두들은 그가 한때 어엿하고 떳떳한 사람이었음을 말해 주는 유일한 증거이기도 했다. 세상은 그를 전과자라 불렀으나, 반들거리는 구두코에 비친 그의 얼굴만은 여전히 꼿꼿했다.</p>

          <p class="section-title">Part 8. 아내의 수술</p>
          <p>그러던 어느 날, 권씨네에 뜻밖의 큰일이 닥쳤다. 산달이 된 아내가 아이를 낳으려다, 그만 순산을 하지 못하게 된 것이다. 의사는 당장 제왕절개 수술을 하지 않으면 산모와 아이가 모두 위태롭다고 했다. 그러나 수술에는 적지 않은 돈이 들었고, 당장 끼니조차 버거운 권씨에게 그런 큰돈이 있을 리 없었다. 평생 남에게 아쉬운 소리 한 번 해 본 적 없던 그였다. 그 꼿꼿하던 사내가, 핏기 하나 없이 창백한 얼굴로 나를 찾아왔다. 한참을 차마 입을 떼지 못하고 애꿎은 방바닥만 바라보며 머뭇거리던 끝에, 그는 떨리는 목소리로 수술비를 좀 꾸어 달라 겨우 말을 꺼냈다.</p>
          <p>자존심을 목숨처럼 여기던 사람이, 그 자존심을 스스로 꺾고 어렵사리 내민 부탁이었다. 그 한마디를 꺼내기까지 그가 얼마나 속으로 피를 삼켰을지, 나는 그의 일그러진 낯빛만 보고도 넉넉히 짐작할 수 있었다. 아내와 아이의 목숨이 걸린 일 앞에서, 그는 끝내 제 마지막 자존심마저 내려놓은 것이었다. 그러나 말을 마친 뒤에도 그는 고개를 들지 못했다. 나는 선뜻 대답을 하지 못한 채, 그 애처로운 사내의 얼굴을 안타깝게 바라볼 뿐이었다. 그 부탁은 한낱 돈을 꾸는 것이 아니라, 제 살을 깎아 내미는 것이나 다름없는 일이었다.</p>

          <p class="section-title">Part 9. 남몰래 치른 수술비</p>
          <p>넉넉지 못한 형편이라, 나 역시 선뜻 큰돈을 내주겠다는 말이 쉬이 나오지 않았다. 내가 머뭇거리며 궁한 사정을 늘어놓는 사이, 권씨의 얼굴에 짙은 그늘이 무겁게 드리워졌다. 그는 더 조르지도 매달리지도 않았다. 평생 자존심 하나로 버텨 온 사내답게, 다만 꺾인 어깨로 조용히 방을 나설 뿐이었다. 어렵사리 손을 벌렸다가 빈손으로 돌아서는 그 뒷모습이 오래도록 눈에 밟혔다.</p>
          <p>그러나 끝내 나는 사람의 목숨이 걸린 일을 모른 체할 수 없었다. 권씨가 돌아간 뒤, 나는 서둘러 병원으로 달려갔다. 그러고는 권씨 몰래, 내가 보증을 서서 그 아내의 수술이 무사히 치러지도록 손을 썼다. 다행히 수술은 잘 끝났고, 권씨의 아내는 건강한 아이를 낳았다. 그러나 정작 권씨는 그 일을 까맣게 알지 못했다. 제 힘으로 끝내 수술비를 마련하지 못했다고만 여기고 있을 터였다. 돈을 구하지 못했다는 절망과, 남 앞에 손을 벌렸다는 꺾인 자존심이 그를 어떤 벼랑으로 내몰지, 그때의 나는 미처 헤아리지 못했다. 빈손으로 돌아서던 그 쓸쓸한 뒷모습만이, 자꾸 가슴 한구석을 서늘하게 했다.</p>

          <p class="section-title">Part 10. 구두만 남기고</p>
          <p>바로 그날 밤이었다. 깊은 밤, 웬 강도 하나가 시퍼런 식칼을 들고 내 방에 몰래 숨어들었다. 서툴고 어설픈 그 몸짓이, 도무지 강도질에 익숙한 자의 것이 아니었다. 나는 어둠 속에서 그 목소리와 거동을 이내 알아차리고 말았다. 다름 아닌 권씨였다. 낮에 어렵사리 돈을 빌리러 왔다가 빈손으로 돌아갔던 바로 그 사내가, 끝내 수술비를 구하지 못한 절망과 상한 자존심을 못 이겨 도둑의 탈을 쓰고 든 것이었다. 나는 짐짓 모르는 체하려다, 결국 나직이 그의 이름을 불렀다. 정체가 드러난 순간, 권씨는 그 자리에 돌처럼 얼어붙고 말았다. 그는 떨리는 목소리로 "이래 봬도 나, 대학까지 나온 사람이오" 하고 내뱉듯 중얼거렸다. 그 짧은 한마디에, 짓밟힐 대로 짓밟힌 한 사내의 자존심이 처절하게 묻어났다.</p>

          <p>황수건에게는 남몰래 품은 큰 꿈이 하나 있었다. 바로 번듯한 원배달원이 되는 것이었다. 그는 아직 남의 밑에서 신문 몇 장이나 거드는 보조배달에 지나지 않았다. 그런데도 그는 제가 곧 원배달이 될 것처럼 늘 들떠서 떠벌리곤 했다. 원배달이 되면 월급도 많이 받고, 저 혼자 한 구역을 맡아 당당히 신문을 돌릴 수 있다는 것이었다. 그 꿈을 이야기할 때면, 황수건의 얼굴에는 더없이 환한 빛이 돌았다. 모자란 그에게도 세상을 향한 소박한 소망이 있었던 것이다. 나는 그 꿈이 애처로우면서도 차마 꺾을 수가 없었다. 셈도 흐리고 눈치도 없는 그가 과연 원배달 노릇을 제대로 해낼 수 있을지, 솔직히 나는 미덥지가 않았다.</p>
          <p>그러나 그가 하도 신이 나서 떠드는 통에, 나는 그저 고개를 끄덕이며 그의 꿈을 응원해 주는 수밖에 없었다. 황수건은 제 꿈을 이야기하는 것만으로도 벌써 원배달이 다 된 듯 흐뭇해했다. 그 천진한 모습이 나는 못내 마음에 걸렸다. 세상이 과연 저 소박한 꿈 하나를 순순히 들어줄 것인지, 나는 공연히 불안해지곤 했다. 그는 틈만 나면 원배달이 되면 무엇부터 하겠다며 신이 나서 늘어놓았다. 듣는 나까지 공연히 그 꿈이 이루어지기를 바라게 될 만큼, 그의 바람은 순수하고도 간절했다.</p>

          <p class="section-title">Part 4. 빼앗긴 자리</p>
          <p>그러나 세상은 황수건의 소박한 꿈을 가만히 두지 않았다. 그는 하는 일마다 번번이 실수를 저질렀다. 신문을 엉뚱한 집에 넣는가 하면, 돌려야 할 집을 빼먹기도 했다. 셈이 흐리니 날짜를 헷갈리고, 눈치가 없으니 사람들의 타박을 사기 일쑤였다. 신문사에서도 그런 그를 곱게 볼 리 없었다. 급기야 황수건은 원배달은커녕, 겨우 붙어 있던 보조배달 자리마저 위태로워졌다. 얼마 뒤, 그 자리에는 그보다 약삭빠르고 일 잘하는 다른 사람이 들어앉았다. 황수건은 그렇게 제 일자리를 고스란히 빼앗기고 말았다. 꿈에 그리던 원배달은 그만두고라도, 당장 신문 한 장 돌릴 데가 없어진 것이다.</p>
          <p>그런데도 황수건은 세상을 원망할 줄 몰랐다. 저를 밀어낸 사람을 미워하지도 않았다. 다만 멋쩍은 듯 허허 웃으며, 그래도 언젠가는 꼭 원배달이 될 거라고 혼잣말처럼 중얼거릴 뿐이었다. 나는 그 어이없는 낙천에 도리어 가슴이 먹먹해졌다. 가진 것 없는 자의 꿈은 어쩌면 이토록 쉽게 짓밟히고 마는 것일까. 그 생각에 나는 오래도록 마음이 무거웠다. 어쩌면 그는 애초에 이 약삭빠른 세상과는 어울리지 못할 사람이었는지도 몰랐다. 그렇게 생각하니 그의 허허로운 웃음이 더욱 쓸쓸하게만 보여, 나는 한참을 멍하니 서 있었다.</p>

          <p class="section-title">Part 5. 번번이 잃은 일자리</p>
          <p>황수건이 일자리를 잃은 것은 이번이 처음은 아니었다. 알고 보니 그는 전에도 번번이 일자리에서 쫓겨난 전력이 있었다. 한때 그는 어느 학교의 사환 노릇을 한 적도 있었다. 종을 치고 심부름을 하는, 그리 어렵지 않은 일이었다. 그러나 그 일마저도 그는 오래 붙어 있지 못했다. 모자라고 굼뜬 탓에 번번이 실수를 저질렀고, 사람들의 성화에 끝내 그 자리에서도 밀려나고 말았던 것이다. 세상은 황수건 같은 사람에게 좀처럼 자리를 내어 주지 않았다. 조금만 느리고 조금만 어수룩해도, 사람들은 이내 그를 쓸모없는 사람으로 치부해 버렸다. 영악하지 못한 것이 그의 죄라면 죄였다. 나는 그의 지난 이야기를 들으며, 이 순박한 사내가 세상에서 설 자리를 하나둘 잃어 온 내력이 못내 안쓰러웠다.</p>
          <p>남에게 해 한 번 끼친 적 없는 사람이, 다만 모자라다는 이유만으로 어디에서도 받아들여지지 못했다. 황수건은 그런 설움을 거듭 겪고도, 여전히 사람 좋은 웃음을 잃지 않았다. 그 변함없는 웃음이 나는 자꾸만 마음에 밟혔다. 세상이 조금만 너그러웠더라면, 저 선량한 사람도 어느 한구석에 자리를 붙이고 살 수 있었을 것이다. 나는 그런 생각에 공연히 세상이 야속해지곤 했다. 밤이 이슥하도록 창밖만 바라보며, 나는 쉬이 잠을 이루지 못했다.</p>

          <p class="section-title">Part 6. 삼 원의 밑천</p>
          <p>일자리를 모두 잃은 황수건은 당장 먹고살 길이 막막해졌다. 그런 그를 바라보는 내 마음도 영 편치 않았다. 무엇이든 제 손으로 벌어 살아 보려는 그의 처지가 딱하기 그지없었다. 하루는 황수건이 머뭇거리며, 장사라도 한번 해 보고 싶은데 밑천이 없다는 말을 조심스레 꺼냈다. 참외 장사라도 벌여 보면 그래도 입에 풀칠은 하지 않겠느냐는 것이었다. 그 말을 듣자 나는 차마 모른 체할 수가 없었다. 썩 넉넉한 형편은 아니었으나, 나는 선뜻 그에게 돈 삼 원을 쥐여 주었다. 이 돈으로 참외라도 받아다 팔아 보라고, 부디 이번에는 자리를 잡으라고 일렀다. 황수건은 뜻밖의 큰돈에 어쩔 줄을 몰라 했다.</p>
          <p>그 모자란 얼굴에 금세 환한 희망이 피어올랐다. 그는 연방 고맙다는 말을 되뇌며, 이번에야말로 꼭 성공해 보이겠노라 다짐했다. 나는 그 순박한 다짐이 부디 헛되지 않기를 마음속으로 빌었다. 변변한 재주 하나 없는 그에게, 그 삼 원은 세상에 다시 서 보려는 마지막 끈과도 같았다. 돈을 받아 쥔 그의 손이 가늘게 떨리는 것을, 나는 보았다. 그 작은 돈에 한 사람의 희망이 통째로 매달려 있다고 생각하니, 나도 모르게 마음이 숙연해졌다. 부디 이번만은 세상이 그를 모른 체하지 않기를 나는 간절히 바랐다.</p>

          <p class="section-title">Part 7. 어긋난 장사</p>
          <p>그러나 황수건의 참외 장사는 처음부터 어긋나기만 했다. 미련하고 서툰 그가 장사를 제대로 해낼 리 만무했다. 좋은 참외를 고를 줄도, 값을 흥정할 줄도 몰랐으니, 받아 온 참외부터가 변변치 못했다. 게다가 그는 사람을 끌어 물건을 파는 재간이 도무지 없었다. 어수룩하게 앉아 있기만 하니, 지나가는 사람들은 거들떠보지도 않았다. 팔리지 않은 참외는 하루가 다르게 무르고 썩어 갔다. 설상가상으로 그 무렵 장마까지 들이닥쳤다. 며칠이고 비가 퍼붓자, 그나마 남아 있던 참외마저 죄다 썩어 문드러지고 말았다. 애써 받아 온 밑천이 고스란히 빗물에 녹아 버린 셈이었다. 삼 원의 희망은 그렇게 허무하게 사라지고 말았다.</p>
          <p>황수건은 텅 빈 손으로 멍하니 비 오는 하늘만 올려다볼 뿐이었다. 그 꼴을 전해 들은 나는 가슴이 미어지는 듯했다. 모처럼 품었던 작은 꿈이 또 한 번 그의 손아귀를 맥없이 빠져나가 버린 것이다. 세상은 끝끝내 이 가엾은 사내의 편을 들어 주지 않았다. 나는 그를 나무랄 수도, 위로할 수도 없어 그저 말없이 바라볼 뿐이었다. 애초에 장사 같은 것이 그에게 가당키나 한 일이었을까. 돌이켜 보면 그 삼 원마저 그에게는 너무 무거운 짐이었는지도 몰랐다. 그 허망함은 오래도록 쉬이 가시지 않았다.</p>

          <p class="section-title">Part 8. 아내마저 떠나고</p>
          <p>엎친 데 덮친 격으로, 황수건에게 더 큰 불행이 닥쳤다. 그나마 곁을 지키던 아내마저 그를 버리고 도망가 버린 것이다. 가난에 지치고 기약 없는 살림에 그만 넌더리가 났던 모양이다. 하기야 모자란 남편 하나만 바라보고 살기에는, 그 앞날이 너무도 막막했을 것이다. 아내가 떠나자 황수건은 그야말로 외톨이가 되었다. 일자리도, 밑천도, 이제는 아내마저 없었다. 가진 것이라고는 아무것도 남지 않은, 그야말로 빈손이었다. 나는 그 소식을 듣고 한동안 말을 잇지 못했다. 세상의 불운이란 불운은 어쩌면 이 한 사람에게만 모조리 쏟아지는 것 같았다. 그러나 정작 황수건은 아내를 원망하지 않았다.</p>
          <p>떠난 사람을 탓하기는커녕, 도리어 제가 못나서 아내가 고생만 하다 갔다며 쓸쓸히 웃을 뿐이었다. 그 어수룩한 웃음 뒤에 감춰진 외로움을, 나는 차마 바로 볼 수가 없었다. 모든 것을 잃고도 남을 탓할 줄 모르는 그 맑은 마음이, 나를 더욱 아프게 했다. 그렇게 하나둘 모든 것을 잃어 가면서도, 그는 끝내 누구 하나 붙들고 하소연하는 법이 없었다. 혼자 삭이고 혼자 견디는 그 외로운 모습이, 보는 이의 가슴을 더욱 먹먹하게 했다. 나는 그에게 무슨 말을 건네야 할지 도무지 알 수가 없었다. 그 말 없는 견딤이 차라리 통곡보다 아프게 다가왔다.</p>

          <p class="section-title">Part 9. 원망을 모르는 사람</p>
          <p>모든 것을 잃고도 황수건은 끝내 사람을 원망하지 않았다. 세상이 그에게 그토록 모질게 굴었건만, 그의 마음속에는 미움이라는 것이 자리할 줄을 몰랐다. 저를 쫓아낸 사람도, 저를 버리고 간 아내마저도 그는 미워하지 않았다. 도리어 그 모든 불운을 제 모자람 탓으로 돌리며, 여전히 사람 좋은 웃음을 잃지 않았다. 나는 그 순박한 마음이 애처로우면서도, 한편으로는 숙연한 생각마저 들었다. 영악한 사람들은 작은 손해에도 이를 갈며 남을 미워하는데, 가진 것 없는 이 모자란 사내는 모든 것을 빼앗기고도 맑은 마음을 잃지 않았다. 어쩌면 세상의 영악함보다, 황수건의 저 어수룩한 선량함이 훨씬 더 귀한 것인지도 몰랐다.</p>
          <p>나는 그를 볼 때마다 가슴 한구석이 따뜻해지면서도 동시에 저려 왔다. 저렇듯 착하기만 한 사람이 어찌하여 이토록 박복해야 하는가. 그 물음 앞에서 나는 번번이 말문이 막히고 말았다. 황수건을 향한 나의 연민은 그렇게 날이 갈수록 깊어만 갔다. 가진 것 없고 모자란 사람이 도리어 가장 맑은 마음을 지녔다는 사실이, 나에게는 하나의 깨달음처럼 다가왔다. 세상의 잣대로는 그가 어리석어 보일지 몰라도, 나는 그 어리석음이 차라리 거룩하게 느껴졌다. 나는 그 맑은 사람 앞에서 늘 작아지는 기분이었다.</p>

          <p class="section-title">Part 10. 달밤의 노래</p>
          <p>어느 달이 유난히 밝은 밤이었다. 볼일을 보고 집으로 돌아오던 나는, 문득 저만치 큰길을 걸어오는 한 사람을 보았다. 다름 아닌 황수건이었다. 그는 혼자였다. 그런데 뜻밖에도, 그는 흥얼흥얼 나직이 노래를 부르며 걷고 있었다. 일자리도 밑천도 아내도 모두 잃은 그가, 달빛 아래 홀로 노래를 부르고 있었던 것이다. 그 모습이 어찌나 애잔하던지, 나는 그만 걸음을 멈추고 말았다. 환한 달빛이 그 어수룩한 사내의 어깨 위로 고요히 쏟아지고 있었다. 세상의 온갖 불운을 다 짊어지고도, 그는 그 밤 달빛을 벗 삼아 제 설움을 노래로 달래고 있는 듯했다. 나는 차마 그를 부르지 못했다.</p>

          <p>황수건에게는 남몰래 품은 큰 꿈이 하나 있었다. 바로 번듯한 원배달원이 되는 것이었다. 그는 아직 남의 밑에서 신문 몇 장이나 거드는 보조배달에 지나지 않았다. 그런데도 제가 곧 원배달이 될 것처럼 늘 들떠서 떠벌리곤 했다. 원배달이 되면 월급도 많이 받고, 저 혼자 한 구역을 맡아 당당히 신문을 돌릴 수 있다는 것이었다.</p>
          <p>그 꿈을 이야기할 때면 황수건의 얼굴에는 더없이 환한 빛이 돌았다. 모자란 그에게도 세상을 향한 소박한 소망이 있었던 것이다. 나는 그 꿈이 애처로우면서도 차마 꺾을 수가 없었다. 셈도 흐리고 눈치도 없는 그가 과연 원배달 노릇을 해낼 수 있을지 미덥지 않았다. 그러나 하도 신이 나서 떠드는 통에, 나는 그저 고개를 끄덕이며 그의 꿈을 응원해 주는 수밖에 없었다.</p>

          <p>세상은 황수건 같은 사람에게 좀처럼 자리를 내어 주지 않았다. 조금만 느리고 어수룩해도, 사람들은 이내 그를 쓸모없는 사람으로 치부해 버렸다. 영악하지 못한 것이 그의 죄라면 죄였다. 남에게 해 한 번 끼친 적 없는 사람이, 다만 모자라다는 이유만으로 어디에서도 받아들여지지 못했다. 그런 설움을 거듭 겪고도, 황수건은 여전히 사람 좋은 웃음을 잃지 않았다.</p>

          <p class="section-title">Part 6. 삼 원의 밑천</p>
          <p>일자리를 모두 잃은 황수건은 당장 먹고살 길이 막막해졌다. 그런 그를 바라보는 내 마음도 영 편치 않았다. 하루는 황수건이 머뭇거리며, 장사라도 한번 해 보고 싶은데 밑천이 없다는 말을 조심스레 꺼냈다. 참외 장사라도 벌여 보면 입에 풀칠은 하지 않겠느냐는 것이었다. 그 말을 듣자 나는 차마 모른 체할 수가 없었다. 썩 넉넉한 형편은 아니었으나, 나는 선뜻 그에게 돈 삼 원을 쥐여 주었다.</p>
          <p>이 돈으로 참외라도 받아다 팔아 보라고, 부디 이번에는 자리를 잡으라고 일렀다. 황수건은 뜻밖의 큰돈에 어쩔 줄을 몰라 했다. 그 모자란 얼굴에 금세 환한 희망이 피어올랐다. 그는 연방 고맙다는 말을 되뇌며, 이번에야말로 꼭 성공해 보이겠노라 다짐했다. 변변한 재주 하나 없는 그에게, 그 삼 원은 세상에 다시 서 보려는 마지막 끈과도 같았다.</p>

          <p>그러나 황수건의 참외 장사는 처음부터 어긋나기만 했다. 미련하고 서툰 그가 장사를 제대로 해낼 리 만무했다. 좋은 참외를 고를 줄도, 값을 흥정할 줄도 몰라 받아 온 참외부터가 변변치 못했다. 게다가 사람을 끌어 물건을 파는 재간이 도무지 없었다. 어수룩하게 앉아 있기만 하니 지나가는 사람들은 거들떠보지도 않았다. 팔리지 않은 참외는 하루가 다르게 무르고 썩어 갔다.</p>

          <p class="section-title">Part 2. 욕쟁이 장인 봉필</p>
          <p>장인 봉필 영감으로 말할 것 같으면, 이 동네에서 모르는 사람이 없는 마름이었다. 마름이란 땅 주인을 대신해 소작인들을 부리는 자리라, 제법 위세가 등등했다. 그런데 이 양반의 입이 어찌나 걸던지, 걸핏하면 상스러운 욕을 함부로 퍼부어 대기 일쑤였다. 오죽하면 동네 사람들이 뒤에서 그를 '욕필이'라고 수군거릴 정도였다. 성이 봉가인지 욕가인지 헷갈릴 만큼, 입만 열면 대뜸 욕부터 튀어나왔다. 나도 하루에 몇 번씩 그 욕을 고스란히 얻어먹어야 했다. 일을 잘해도 욕, 못해도 욕이었다. 그러나 나는 그저 꾹 참을 수밖에 없었다. 장인의 비위를 거슬렀다가는 점순이와의 혼인이 영영 틀어질까 겁이 났기 때문이다.</p>
          <p>게다가 이 교활한 영감은 제 딸을 미끼로 나 같은 사람을 공짜로 부려먹는 데 아주 이골이 나 있었다. 나뿐 아니라 전에도 데릴사위를 여럿 들였다가 실컷 부려만 먹고 내쫓았다는 소문까지 돌았다. 그래도 나는 설마 나한테야 그러랴 싶어, 그저 묵묵히 욕을 참으며 일만 했다. 그 소문을 들을 때마다 나는 공연히 뒷덜미가 서늘해지곤 했다. 그러나 이미 삼 년을 꼬박 바친 터라, 이제 와서 슬그머니 발을 빼기도 어려운 노릇이었다. 나는 애써 좋은 쪽으로만 생각하며 스스로를 다독일 수밖에 없었다.</p>

          <p class="section-title">Part 3. 키가 크면 성례</p>
          <p>장인과 맺은 혼인의 조건이란 것이 참으로 묘하기 짝이 없었다. 다름 아니라, 점순이의 키가 다 크면 그때 성례를 시켜 준다는 것이었다. 처음 그 말을 들었을 때만 해도 나는 별 의심 없이 고개를 끄덕였다. 머지않아 점순이도 키가 쑥쑥 자랄 터이니, 혼인할 날도 금세 오려니 믿었던 것이다. 그런데 이게 웬일인가. 어느덧 삼 년 하고도 일곱 달이 지났건만, 장인은 여전히 점순이 키가 아직 안 컸다는 한마디로 성례를 자꾸만 미루는 것이었다. 내가 보기에 점순이는 진작 시집갈 나이가 되고도 남았다. 키도 또래에 견주어 조금도 작지 않았다. 그런데도 장인은 번번이 키 타령을 늘어놓으며 나를 어르고 달랬다.</p>
          <p>알고 보면 그것은 성례를 미뤄 나를 더 오래 공짜로 부려먹으려는 뻔한 수작이었다. 그러나 나는 그 속셈을 번연히 알면서도, 차마 대놓고 따지지는 못하고 그저 속만 바싹바싹 끓였다. 점순이 키가 어서 크기만을 애타게 바라고 또 바랄 뿐이었다. 그럴 때마다 나는 점순이 곁에 슬쩍 서서 키를 가만히 견주어 보곤 했다. 암만 봐도 점순이 머리가 내 어깨께에 닿을 만큼은 자란 듯싶은데, 장인은 늘 아니라고 딱 잡아뗐다. 그 속이 빤히 들여다보여도 나는 벙어리처럼 입을 다물 수밖에 없었다. 참으로 답답하고 기막힌 노릇이었다.</p>

          <p class="section-title">Part 4. 애만 타는 나날</p>
          <p>성례는 도무지 기약이 없고, 일은 날이 갈수록 고되기만 했다. 봄이면 논을 갈고 모를 내고, 여름이면 땡볕에 김을 매고, 가을이면 추수에 허리가 휘었다. 겨울에도 땔나무를 하느라 쉴 틈이 없었다. 그렇게 사철 내내 소처럼 부려지면서도, 나는 점순이와의 혼인 하나만 바라보며 이를 악물었다. 그러나 날이 가고 달이 가도 혼인 이야기는 도무지 나올 기미가 보이지 않았다. 나는 점순이의 키를 몰래 눈대중해 보기도 했다. 작년이나 올해나 그 키가 그 키 같아, 암만 뜯어봐도 더 자란 것 같지가 않았다. 이러다가는 내 머리가 하얗게 세도록 장가는 못 가는 게 아닐까 하는 불안이 밀려들었다.</p>
          <p>동갑내기 친구들은 벌써 장가를 들어 아이까지 보았는데, 나만 이 집에 매여 공으로 일만 하고 있으니 속이 터질 노릇이었다. 그렇다고 이제 와서 때려치우고 나가자니, 그동안 바친 삼 년 칠 개월이 너무도 아까웠다. 나는 그저 벙어리 냉가슴 앓듯 혼자서만 끙끙거릴 뿐이었다. 밤이면 나는 봉당에 누워 애꿎은 천장만 하염없이 올려다보며 긴 한숨을 내쉬었다. 언제쯤이면 이 지긋지긋한 머슴살이를 면하고 점순이와 어엿한 살림을 차릴 수 있을까. 아무리 생각해도 앞이 캄캄하기만 했다. 무심한 세월만 야속하게 흘러갈 뿐이었다.</p>

          <p class="section-title">Part 5. 점순이의 부추김</p>
          <p>그런데 뜻밖에도, 애가 타기는 점순이도 나 못지않은 모양이었다. 하루는 점순이가 내 곁으로 슬그머니 다가오더니, 아무도 안 듣는 데서 나직이 속삭이는 것이었다. "밤낮 일만 하면 뭐 해. 성례를 시켜 줘야 할 거 아니야." 나는 그 말에 그만 깜짝 놀라고 말았다. 수줍기만 하던 점순이가 먼저 그런 말을 꺼낼 줄은 꿈에도 몰랐던 것이다. 점순이는 답답하다는 듯 입을 삐죽거리며, 아버지한테 가서 어서 혼인시켜 달라고 조르라는 눈치를 주었다. 이대로 가만히 있으면 평생 이렇게 부려만 먹힌다는 것이었다. 그 말을 듣고 보니 과연 옳은 말이었다. 점순이도 나와 혼인하고 싶어 하는구나 생각하니, 한편으로는 가슴이 콩닥거리고 한편으로는 어디서 없던 용기가 불끈 솟았다.</p>
          <p>여태 나는 장인이 무서워 입도 뻥끗 못 했는데, 정작 점순이가 저리 등을 떠미니 더는 가만있을 수가 없었다. 나는 이번에야말로 장인에게 단단히 따져 보리라 마음을 굳게 먹었다. 점순이는 그 말을 남기고는 홱 돌아서 제 볼일을 보러 가 버렸다. 나는 그 야무진 뒷모습을 바라보며 가슴이 다 벅차올랐다. 저렇게 당찬 점순이가 내 편이니, 이제는 무서울 것이 하나도 없을 듯싶었다. 나는 절로 어깨가 으쓱해지는 것만 같았다.</p>

          <p class="section-title">Part 6. 꾀병을 부리며 대들다</p>
          <p>점순이의 부추김에 용기를 얻은 나는, 드디어 큰일을 한번 벌이기로 작정했다. 이날 나는 멀쩡한 몸을 핑계 삼아, 배가 아프다며 논으로 나가지 않고 방에 드러누워 버렸다. 일을 안 하고 버팀으로써 장인의 애를 바싹 태워 기어이 성례를 받아 낼 속셈이었다. 아니나 다를까, 장인이 득달같이 달려와 왜 일을 안 하느냐고 성화를 부렸다. 나는 짐짓 배를 움켜쥐고 끙끙 앓는 시늉을 했다. 그러고는 큰맘을 먹고 입을 열었다. "점순이하고 성례를 시켜 주시기 전엔, 저는 인제 일 못 하겠습니다." 여태 고분고분하던 내가 뜻밖의 소리를 내뱉자, 장인은 두 눈이 휘둥그레졌다. 이내 얼굴이 붉으락푸르락해지더니, 그 걸쭉한 욕이 대번에 터져 나왔다.</p>
          <p>하지만 나도 이번만은 결코 물러서지 않았다. 점순이 생각에, 또 삼 년 칠 개월의 억울함에 어디서 그런 배짱이 솟았는지, 나는 장인의 욕설에도 꿈쩍 않고 버텼다. 그 바람에 장인과 나 사이에는 금세 험악한 기운이 감돌기 시작했다. 장인은 당장이라도 달려들 듯 두 눈을 부라렸지만, 나는 배를 움켜쥔 채 꼼짝도 하지 않았다. 여기서 또 밀리면 몇 해를 공으로 부려먹히고 말 터였다. 나는 속으로 점순이를 떠올리며 이를 악물고 버텼다. 좁은 방 안에는 금세 팽팽한 긴장이 감돌았다.</p>

          <p class="section-title">Part 7. 사타구니 잡고 드잡이</p>
          <p>말로 옥신각신하던 끝에, 기어이 장인과 나는 멱살을 움켜잡고 드잡이를 벌이게 되었다. 성이 머리끝까지 난 장인이 지게 막대기를 들고 나를 후려치려 들었고, 나도 더는 참지 못하고 그예 맞붙고 말았다. 그러다 어찌어찌 서로의 사타구니를 움켜쥐는 지경에까지 이르렀다. 둘이 한 덩어리로 엉겨 붙어 데굴데굴 구르며, 한 손으로는 상대의 급소를 붙잡고 놓지 않으니, 그 꼴이 말이 아니었다. 아파서 악을 쓰는 소리에 온 동네가 떠나갈 듯했다. 장인은 내 사타구니를 움켜쥔 채 "이놈!" 하고 벼락같이 소리를 질렀고, 나도 지지 않고 장인의 그곳을 꽉 붙잡았다. 서로 급소를 잡혔으니 섣불리 힘을 쓸 수도 없어, 그저 아이고 소리만 내지르며 뒹굴 뿐이었다.</p>
          <p>체면이고 뭐고 다 내던진, 참으로 우스꽝스럽고도 처절한 싸움이었다. 명색이 장인과 사위가 밭머리에서 그 모양으로 엉겨 붙었으니, 지나가던 사람이 보았다면 배를 잡고 웃었을 것이다. 그래도 그 순간 나는 오직 성례 생각뿐이라 도무지 물러설 줄을 몰랐다. 흙먼지를 온통 뒤집어쓴 채 둘이 한참을 뒹구는 꼴은 그야말로 가관도 그런 가관이 없었다. 그러면서도 나는 이 싸움이 어떻게든 성례로 이어지기만을 애타게 바랐다. 아픈 것도 아픈 것이지만, 여기서 지면 또 공사가 되고 마니 죽어도 손을 놓을 수가 없었다.</p>

          <p class="section-title">Part 8. 점순이만 믿고</p>
          <p>장인과 사타구니를 맞잡고 뒹구는 와중에도, 내 머릿속에는 온통 점순이 생각뿐이었다. 다른 사람도 아니고, 이게 다 점순이와 혼인을 하자고 벌인 일이 아니던가. 나는 은근히 점순이가 달려와 내 편을 들어 주기를 손꼽아 기대했다. 이 싸움은 결국 저를 위한 것이니, 점순이도 틀림없이 내 손을 들어 줄 거라 믿었다. 아버지가 아무리 제 아비라 해도, 성례를 미루며 사람을 애먹이는 쪽은 장인이요, 점순이와 어엿이 혼인하려는 쪽은 바로 나였다. 그러니 점순이가 어느 편을 들지는 뻔한 노릇이라고 나는 철석같이 믿어 의심치 않았다. 마침 소란을 듣고 점순이가 집 안에서 허둥지둥 뛰어나오는 것이 보였다.</p>
          <p>나는 속으로 '옳거니, 이제야 점순이가 나서서 아버지를 말리고 내 편을 들어 주겠구나' 하고 은근히 반가웠다. 급소를 잡혀 눈물이 찔끔 날 지경이면서도, 나는 점순이만 오면 이 싸움이 내게 유리하게 풀리리라 생각하며 이를 악물고 끝까지 버텼다. 생각하면 할수록 점순이가 내 편을 드는 것이 너무도 당연한 이치였다. 나는 그 믿음 하나로 급소가 아픈 것도 꾹 참으며 버텼다. 점순이가 한마디만 거들어 주면 제아무리 장인이라도 꼼짝없이 성례를 승낙하리라 싶었다. 그 믿음 하나만으로도 나는 그저 든든하기만 했다.</p>

          <p class="section-title">Part 9. 아버지 편을 든 점순이</p>
          <p>그런데 이게 대체 웬 날벼락이란 말인가. 달려온 점순이는 내 예상과는 영 딴판으로 굴었다. 제 아비가 사위에게 급소를 잡혀 쩔쩔매는 꼴을 보더니, 점순이는 되레 나에게 달려들어 내 편이 아니라 아버지 편을 드는 것이 아닌가. 점순이는 발을 동동 구르며 "아버지를 왜 이렇게 해!" 하고 앙칼지게 나를 나무랐다. 심지어 울먹이며 내 귀며 등짝을 사정없이 잡아 뜯는 통에, 나는 그만 어안이 벙벙해지고 말았다. 나를 부추겨 이 싸움을 하게 만든 장본인이 바로 점순이였건만, 막상 제 아비가 당하는 꼴은 차마 못 보겠던 모양이다. 나는 급소의 아픔보다도 그 서운함에 가슴이 더 아리고 쓰렸다.</p>
          <p>철석같이 믿었던 점순이에게 뒤통수를 맞은 것 같아 눈앞이 다 아득해졌다. 그렇게 점순이마저 아버지 편을 드니, 나는 이쪽저쪽에서 몰리는 꼴이 되어 그만 기운이 쭉 빠지고 말았다. 도무지 점순이의 알 수 없는 속을 헤아릴 길이 없어, 나는 멍하니 그 자리에 주저앉고 말았다. 나를 부추길 때는 언제고, 막상 일이 벌어지자 저렇게 홱 돌변하다니 기가 막힐 노릇이었다. 여자의 마음이란 참으로 알다가도 모를 것이구나 싶었다. 나는 점순이의 그 속내를 도무지 헤아릴 길이 없어 그저 멍하기만 했다. 세상에 이런 법도 다 있는가 싶어 기가 찼다.</p>

          <p class="section-title">Part 10. 또 속아 넘어가는 나</p>

          <p class="section-title">Part 1. 사라진 황만근</p>
          <p>황만근이 돌아오지 않았다. 농민 궐기대회에 간다며 전날 새벽 경운기를 몰고 나간 뒤로, 하루가 지나고 이틀이 지나도 그는 마을로 돌아오지 않았다. 평소 같으면 누구보다 먼저 들일을 나왔을 그가 보이지 않자, 이웃인 민씨는 문득 불길한 예감이 들었다. 민씨는 도시에서 내려와 이 마을에 자리를 잡은 사람으로, 어리숙한 황만근을 이웃이자 벗으로 여겨 온 터였다. 그는 마을 사람들을 불러 모아 황만근의 행방을 물었다. 그러나 사람들은 대수롭지 않다는 듯 심드렁할 뿐이었다. 바보 같은 황만근이 어디서 길이나 잃었겠거니, 제풀에 돌아오겠거니 하는 투였다.</p>
          <p>여태 마을의 온갖 궂은일을 도맡아 온 그가 하루아침에 사라졌는데도, 아무도 그의 부재를 심각하게 여기지 않았다. 오직 민씨만이 가슴 한구석이 서늘했다. 그제야 그는 깨달았다. 있을 때는 아무도 거들떠보지 않다가, 사라지고 나서야 비로소 그 빈자리가 얼마나 큰지를 느끼게 되는 사람이 있다는 것을 말이다. 날이 갈수록 민씨의 불안은 짙어만 갔다. 황만근이 없는 마을은 어딘가 톱니 하나가 빠진 것처럼 삐걱거렸으나, 사람들은 그것조차 알아차리지 못했다. 민씨는 홀로 그 빈자리를 메우던 한 사람의 무게를 가만히 곱씹었다.</p>

          <p class="section-title">Part 2. 마을의 반편이</p>
          <p>마을 사람들에게 황만근은 오래전부터 그저 '반편이'였다. 어려서부터 그는 또래보다 굼뜨고 어수룩해, 사람들의 놀림과 손가락질 속에서 자랐다. 말도 어눌하고 하는 짓도 미련해 보여, 누구 하나 그를 온전한 사람으로 쳐 주지 않았다. 아이들은 그를 '바보 만근이'라 부르며 뒤를 따라다녔고, 어른들은 그를 부려먹을 때나 찾았다. 그러나 민씨가 가까이에서 지켜본 황만근은 결코 사람들이 말하는 그런 바보가 아니었다. 셈에 밝지 못하고 제 잇속을 챙길 줄 모를 뿐, 그 마음만은 누구보다 맑고 어질었다. 거짓을 꾸밀 줄도, 남을 속일 줄도 몰랐다. 세상이 영악하게 돌아가는 이치를 모른다는 것이, 그에게는 도리어 흉이 되어 돌아왔다.</p>
          <p>똑똑한 사람들은 그런 그를 비웃었지만, 그 비웃음 뒤에서 황만근은 묵묵히 제 할 일을 했다. 어리석어 보이는 그 우직함 속에, 실은 범접하기 어려운 어떤 올곧음이 깊이 깃들어 있었던 것이다. 그는 제가 손해를 보더라도 남에게 모질게 구는 법이 없었다. 누가 무엇을 부탁하면 거절할 줄을 몰라, 언제나 손해는 고스란히 그의 몫이었다. 사람들은 그 어수룩함을 비웃었으나, 민씨는 그것이야말로 쉬이 흉내 낼 수 없는 선함임을 알았다. 세상이 그를 바보라 부를수록, 그 맑은 마음의 결은 도리어 더욱 도드라져 보였다.</p>

          <p class="section-title">Part 3. 마을의 일꾼</p>
          <p>황만근은 마을에서 아무도 하려 들지 않는 궂은일을 도맡아 하는 사람이었다. 동네에 초상이 나면 남들이 꺼리는 험한 일을 그가 나서서 했고, 더럽고 힘든 일이라면 으레 그의 몫으로 돌아왔다. 가뭄에 마른 도랑을 치고, 눈이 오면 길을 쓸고, 품이 많이 드는 일에는 언제나 그가 불려 나왔다. 그러면서도 그는 변변한 품삯 한 번 제대로 받은 적이 없었다. 사람들은 당연하다는 듯 그를 부렸고, 고맙다는 말조차 아꼈다. 그래도 황만근은 싫은 내색 한 번 하지 않았다. 누가 시켜서가 아니라, 그저 마땅히 해야 할 일이라 여겨 묵묵히 몸을 놀렸다. 남들이 외면하는 일을 제 일처럼 떠맡는 그 모습을, 마을 사람들은 그저 미련한 탓으로만 돌렸다.</p>
          <p>그러나 돌이켜 보면 그 숱한 궂은일이 다 황만근의 손을 거쳐 치러졌으니, 마을은 알게 모르게 그에게 큰 빚을 지고 있었던 셈이다. 다만 아무도 그것을 빚이라 여기지 않았을 뿐이다. 누가 알아주지 않아도 그는 조금도 개의치 않았다. 마을 한구석이 더러우면 말없이 치웠고, 길이 막히면 묵묵히 터놓았다. 그렇게 황만근의 손길이 닿지 않은 곳이 마을에는 거의 없다시피 했다. 그런데도 사람들은 그 공을 당연한 것으로만 알았지, 끝내 고마운 줄을 몰랐다. 묵묵히 손해 보며 사는 것, 그것이 바로 황만근이라는 사람이었다.</p>

          <p class="section-title">Part 4. 어머니와 아들</p>
          <p>황만근에게는 목숨처럼 지켜야 할 두 사람이 있었다. 늙은 홀어머니와 어린 아들 영호였다. 그는 둘도 없는 효자였다. 제 몸이 고단해도 어머니의 끼니와 약을 먼저 챙겼고, 궂은 날이면 어머니가 거동하기 편하도록 손수 길을 쓸었다. 어머니를 모시는 그의 정성은 마을에서도 모르는 이가 없을 만큼 지극했다. 일찍이 아내는 그런 가난하고 어리숙한 그를 끝내 견디지 못하고 집을 떠나 버렸다. 그 뒤로 황만근은 홀로 아들 영호를 키웠다. 아비 노릇이라고 유난스럽지는 않았으나, 제가 먹지 못해도 자식은 먹였고, 제가 헐벗어도 자식은 입혔다. 어머니와 아들, 그 두 사람을 위해서라면 그는 어떤 고생도 마다하지 않았다.</p>
          <p>바보라 손가락질받는 사내였지만, 피붙이를 건사하는 그 마음만은 세상 어느 영악한 가장보다도 깊고 든든했다. 가진 것 없는 살림 속에서도 그 작은 식구는, 황만근의 묵묵한 등에 기대어 하루하루를 살아갔다. 어머니가 편찮으시면 밤을 새워 간호했고, 영호가 아프면 제 일을 제쳐 두고 둘러업고 뛰었다. 가난이 그들의 살림을 늘 쪼들리게 했지만, 황만근의 넓은 등은 두 사람에게 더없이 든든한 울타리였다. 세상은 그를 하찮게 여겼어도, 그 집안에서만큼은 그가 하늘 같은 가장이었다.</p>

          <p class="section-title">Part 5. 빚에 짓눌린 농촌</p>
          <p>그 무렵 농촌은 빚더미에 짓눌려 신음하고 있었다. 정부는 농민들에게 농사를 키우라며 빚을 내어 경운기며 트랙터 같은 농기계를 사들이게 부추겼다. 소를 더 먹이고 땅을 더 부치면 살림이 나아지리라는 말에, 마을 사람들은 너도나도 빚을 얻었다. 그러나 막상 농사를 키워 본들 돌아오는 것은 빚뿐이었다. 애써 거둔 곡식 값은 제자리인데 갚아야 할 이자는 눈덩이처럼 불어나, 농가마다 빚에 허리가 휘었다. 농기계는 녹슬어 가고, 빚 독촉은 날로 심해졌다. 그런데 이 와중에도 황만근만은 달랐다. 그는 애초에 제 분수에 넘치는 빚을 지지 않았다. 남들이 기계를 들이고 규모를 늘릴 때에도, 그는 제 힘으로 지을 수 있는 만큼만 우직하게 농사를 지었다.</p>
          <p>빚을 내어 욕심을 부리느니, 적게 거두어도 제 땀으로 떳떳이 사는 편이 낫다는 것이었다. 사람들은 그런 그를 또 미련하다 비웃었지만, 빚에 짓눌린 그들에 비하면 황만근의 살림은 가난해도 한결 홀가분했다. 빚을 못 갚아 야반도주하듯 마을을 떠나는 집이 하나둘 생겨났고, 인심마저 날로 메말라 갔다. 그런 가운데 황만근의 고집스러운 농사는 유난스레 미련해 보였다. 그러나 적어도 그는 빚 독촉에 밤잠을 설치는 일만은 없었다. 제 분수를 아는 그 삶이, 요란한 욕심보다 오히려 단단했던 것이다.</p>

          <p class="section-title">Part 6. 농민 궐기대회</p>
          <p>마침내 마을에 농민 궐기대회 소식이 전해졌다. 빚에 짓눌린 농민들이 한데 모여, 농가부채를 탕감해 달라고 목소리를 높이는 자리였다. 가까운 읍내보다 훨씬 더 먼 곳에서 큰 집회가 열린다고 했다. 이장은 마을 사람들을 불러 모아, 이번 대회에 꼭 참가해야 한다고 목소리를 높였다. 그러면서 한 가지 방침을 전했다. 다름 아니라, 저마다 경운기를 몰고 가서 농민의 세를 당당히 보이자는 것이었다. 수많은 경운기가 줄지어 대회장으로 몰려가면, 그 광경만으로도 농민들의 분노와 결기를 똑똑히 드러낼 수 있으리라는 생각에서였다. 이장의 말에 사람들은 저마다 고개를 끄덕였다.</p>
          <p>옳은 말이다, 당연히 그래야 한다며 입을 모았다. 빚에 시달리던 터라, 대회에 나가 억울함을 쏟아 내자는 데에는 누구도 이견이 없었다. 적어도 그 자리에서만큼은, 모두가 경운기를 몰고 함께 나아갈 것처럼 결의에 차 보였다. 황만근도 그 한자리에서 이장의 말을 가만히, 그러나 누구보다 깊이 새겨듣고 있었다. 사람들은 저마다 주먹을 불끈 쥐며 반드시 참가하겠노라 다짐했다. 그 자리의 뜨거운 열기만 보아서는, 온 마을이 경운기를 몰고 나설 것만 같았다. 그러나 뜨거운 결의와 실제 행동은 늘 별개의 것이었다.</p>

          <p class="section-title">Part 7. 말과 행동이 다른 사람들</p>
          <p>그러나 막상 대회 날이 밝자, 사람들의 결의는 온데간데없이 사라졌다. 경운기를 몰고 먼 길을 가자던 약속은, 번거롭고 고되다는 이유로 슬그머니 뒷전으로 밀려났다. 느려 터진 경운기로 그 먼 데까지 어떻게 가느냐는 것이었다. 똑똑한 마을 사람들은 저마다 더 편한 길을 택했다. 더러는 버스나 트럭을 얻어 타고 갔고, 더러는 이런저런 핑계를 대며 아예 가지 않았다. 입으로는 농민의 단결이니 세력 과시니 그럴듯한 말을 늘어놓던 이들이었다. 그러나 정작 제 몸으로 그 말을 지키는 사람은 아무도 없었다. 말과 행동이 그렇게 따로 놀았다. 오직 한 사람, 황만근만이 달랐다.</p>
          <p>그는 이장이 한 말을 조금도 의심하지 않았다. 경운기를 몰고 가라 했으니 경운기를 몰고 가는 것이 마땅하다고, 그는 곧이곧대로 믿었다. 영악한 셈속도, 몸을 사리는 꾀도 그에게는 없었다. 남들이 다 말을 저버릴 때, 그 어리숙한 사내만이 홀로 그 말을 제 몸으로 지키려 하고 있었다. 그럴듯한 명분을 앞세우던 이들일수록, 정작 제 몸이 고될 일에는 누구보다 먼저 발을 뺐다. 민씨는 그 씁쓸한 광경을 말없이 지켜보았다. 말만 번지르르한 세상에, 그 말을 곧이곧대로 믿고 지키려는 황만근이 도리어 유별나 보일 지경이었다.</p>

          <p class="section-title">Part 8. 황만근의 마지막 길</p>
          <p>대회 전날 밤, 황만근은 길 떠날 채비를 하다 말고 민씨를 찾아왔다. 두 사람은 호롱불 아래 마주 앉아 밤이 깊도록 이야기를 나누었다. 그 자리에서 황만근은 제 나름의 농사 철학을 드문드문 풀어놓았다. 빚을 내어 욕심을 부리면 끝내 그 빚에 잡아먹히고 만다는 것, 농사란 제 땅과 제 힘에 맞게 정직하게 지어야 한다는 것이었다. 꾸밈없는 그 말들이 민씨에게는 어느 똑똑한 사람의 말보다도 깊고 묵직하게 다가왔다. 이윽고 날이 밝자, 황만근은 낡은 경운기에 올라탔다. 탈탈거리는 경운기를 몰고, 그는 홀로 먼 대회장을 향해 길을 나섰다. 느릿느릿 멀어져 가는 그 뒷모습을, 민씨는 한참이나 말없이 바라보았다.</p>
          <p>다른 사람들은 다 꾀를 부려 빠졌는데, 저 우직한 사내만이 홀로 약속을 지키러 가는구나 싶었다. 그러나 그때까지만 해도 민씨는 미처 알지 못했다. 그 길이 황만근의 마지막 길이 되리라는 것을 말이다. 민씨는 그 투박한 말 속에 담긴 올곧음에 가슴이 서늘해졌다. 배운 티를 내는 누구의 말보다도, 그 말은 참되고 또 무거웠다. 떠나는 황만근의 뒷모습은 작고 초라했으나, 민씨의 눈에는 그 어떤 거인보다도 크고 꿋꿋하게 비쳤다. 민씨는 그 겨울밤의 대화를 오래도록 잊지 못했다.</p>

          <p class="section-title">Part 9. 돌아온 유골</p>

          <p class="section-title">Part 6. 헐값에 팔려 간 보금자리</p>
          <p>끝내 난쟁이 가족도 그 입주권을 팔 수밖에 없었다. 당장 거처를 옮길 돈도, 끼니를 이을 돈도 없었으니, 손에 쥔 딱지라도 팔아 급한 불을 꺼야 했다. 투기꾼들은 그 다급한 처지를 놓치지 않았다. 그들은 입주권의 제값에 한참 못 미치는 헐값을 내밀며, 가족을 몰아세우듯 흥정을 했다. 결국 가족은 제대로 된 값도 받지 못한 채, 그 소중한 딱지를 넘기고 말았다. 집을 헐린 것도 서러운데, 보상으로 받은 권리마저 헐값에 빼앗기다시피 팔아넘긴 것이다. 집도 잃고, 아파트도 갈 수 없게 된 가족은 그야말로 오도 가도 못할 처지에 놓였다. 떠나야 할 날은 다가오는데, 식구들이 몸 누일 곳은 어디에도 없었다.</p>
          <p>투기꾼의 농간에 가족은 더욱 깊은 궁지로 몰렸다. 성실하게 살아온 죄밖에 없는 사람들이, 어째서 이토록 무참히 모든 것을 빼앗겨야 하는가. 그 서러운 물음 앞에서 가족은 그저 막막할 뿐이었다. 어린 자식들은 그 부당한 거래를 지켜보면서도 어찌할 도리가 없었다. 가진 것 없는 자에게는 억울함을 호소할 곳조차 없었다. 세상은 힘없는 사람들의 눈물에는 조금도 귀를 기울이지 않았다. 집을 잃은 서러움에 더해, 이제는 당장 오늘 밤 어디서 자야 할지조차 막막하기만 했다. 가족의 앞날에는 짙은 어둠만이 무겁게 드리워져 있었다.</p>

          <p class="section-title">Part 7. 집을 나간 영희</p>
          <p>그렇게 집안이 벼랑 끝으로 몰리던 어느 날, 막내딸 영희가 소리 없이 집을 나갔다. 아직 어린 소녀였으나, 영희는 제 나름의 결심을 품고 있었다. 가족이 헐값에 빼앗기다시피 넘긴 그 입주권을, 어떻게든 되찾아 오겠다는 것이었다. 영희는 그 딱지를 사 간 부동산 사나이, 곧 투기꾼의 뒤를 따라갔다. 어린 영희가 할 수 있는 일이라고는 그 사내의 곁에 머무르며 기회를 엿보는 것뿐이었다. 그것이 얼마나 위험하고 모진 길인지, 영희 또한 모르지 않았다. 그러나 무너져 가는 가족을 지키기 위해, 영희는 제 한 몸을 기꺼이 내던지기로 한 것이다. 집을 나서는 어린 딸의 뒷모습을, 가족은 뒤늦게야 알고 가슴을 쳤다.</p>
          <p>가장 여리고 어린 막내가, 가족 가운데 가장 무거운 짐을 제 어깨에 짊어진 셈이었다. 영희의 가출은 철없는 도망이 아니라, 벼랑 끝에서 가족을 구하려는 처절한 몸부림이었다. 어린 딸이 떠난 빈자리를 바라보며, 가족은 미안함과 안타까움에 차마 말을 잇지 못했다. 그러나 이미 영희는 쉬이 돌아올 수 없는 길로 들어선 뒤였다. 가족을 위해 제 몸을 던진 그 어린 결심이, 모두의 가슴을 더욱 미어지게 했다. 어린 막내의 희생 위에서야 겨우 숨을 돌릴 수 있다는 사실이, 가족에게는 무엇보다 뼈아픈 일이었다.</p>

          <p class="section-title">Part 8. 되찾은 입주권</p>
          <p>영희는 투기꾼 사내의 곁에서 모진 나날을 견뎠다. 어린 소녀가 감당하기에는 너무도 가혹한 시간이었다. 몸과 마음이 다 바스러지는 듯한 고통 속에서도, 영희는 오직 가족과 입주권만을 생각하며 이를 악물었다. 그러던 끝에 영희는 마침내 기회를 잡았다. 사내가 금고 깊숙이 넣어 둔 입주권과 돈을, 영희는 제 손으로 되찾아 냈다. 집을 지키기 위해 바친 희생의 대가였다. 영희는 그 길로 관청을 찾아가, 되찾은 입주권으로 가족의 아파트 입주 절차를 밟았다. 어린 딸이 제 몸을 바쳐, 빼앗겼던 가족의 보금자리를 기어이 되살려 낸 것이다. 그것은 누구도 대신해 주지 않은, 영희 혼자만의 외로운 싸움이었다.</p>

          <p>되찾은 입주권도, 바쳐 온 희생도, 아버지의 빈자리 앞에서는 아무 소용이 없었다. 영희는 그 자리에 무너지듯 주저앉고 말았다. 집을 지키려 모든 것을 걸었건만, 정작 가장 지키고 싶던 아버지를 잃고 만 것이다. 남은 가족의 통곡이 가난한 행복동 하늘에 서럽게 울려 퍼졌다. 세상의 가장 낮은 곳에서 가장 무거운 짐을 지던 아버지는, 그렇게 소리 없이 스러지고 말았다. 영희가 모든 것을 바쳐 집을 되찾은 바로 그때, 정작 그 집에서 함께 살아야 할 아버지는 영영 돌아올 수 없게 된 것이다. 운명은 끝까지 이 가난한 가족에게 모질기만 했다.</p>

          <p>전차에서 내린 구보는 한 다방으로 발걸음을 옮겼다. 그는 다방 한구석에 자리를 잡고 앉아, 따끈한 차를 시켜 놓고 홀로 상념에 잠겼다. 다방 안에는 담배 연기가 자욱했고, 축음기에서는 나직한 음악이 흘러나왔다. 사람들이 삼삼오오 모여 이야기를 나누는 그 풍경 속에서도, 구보는 어쩐지 혼자인 듯한 외로움을 떨칠 수가 없었다. 문득 그는 제 몸이 성치 않다는 생각에 사로잡혔다. 요즘 들어 부쩍 귀가 잘 들리지 않는 것 같기도 하고, 눈앞이 침침한 것도 같았다. 신경쇠약이라는 병이 제 몸을 갉아먹고 있는 것은 아닐까 하는 불안이 스멀스멀 피어올랐다. 젊은 나이에 벌써 몸도 마음도 지쳐 버린 것만 같아, 구보는 공연히 서글퍼졌다.</p>
          <p>번잡한 도시 한복판의 다방에서, 사람들 틈에 둘러싸여 있으면서도 그는 더없이 고독했다. 차는 식어 갔고, 구보의 상념도 끝 모르게 깊어만 갔다. 외로움은 이 도시가 그에게 안긴 보이지 않는 병과도 같았다. 사람들 속에 있을수록 더 깊어지는 그 외로움을, 구보는 이해할 수 없으면서도 어쩌지 못했다. 어쩌면 그것은 이 변해 가는 도시를 살아가는 모든 이들의 보이지 않는 병인지도 몰랐다. 구보는 식어 가는 찻잔처럼, 제 마음도 서서히 식어 가는 것만 같았다.</p>

          <p class="section-title">Part 6. 지난 사랑의 기억</p>
          <p>식어 가는 찻잔을 바라보던 구보의 생각은, 어느새 지난 시절로 거슬러 올라갔다. 문득 오래전 맞선 자리에서 마주했던 한 여인의 얼굴이 떠올랐다. 참하고 단아하던 그 여인을, 구보는 한때 마음에 두기도 했었다. 그러나 가난한 처지에 앞날조차 막막하던 그는, 끝내 그 인연을 제 손으로 붙잡지 못하고 흘려보내고 말았다. 돌이켜 보면 그때 용기를 내었더라면, 지금쯤 제 곁에도 따뜻한 가정이 있었을지 모를 일이었다. 사랑이란, 또 혼인이란 대체 무엇일까. 구보는 어머니가 바라는 혼인을 떠올리며 마음이 복잡해졌다. 외로움을 생각하면 누군가와 함께이고 싶다가도, 막상 평범한 가정에 매여 사는 삶을 떠올리면 선뜻 마음이 내키지 않았다.</p>
          <p>사랑을 바라면서도 사랑으로 뛰어들지 못하는 제 우유부단함이, 구보는 문득 한심스러웠다. 지나간 인연은 돌이킬 수 없었고, 그 아련한 기억만이 식은 찻잔 위로 쓸쓸히 피어올랐다 사라졌다. 사랑을 붙잡지 못한 지난날의 후회가, 외로운 지금에 와서야 뒤늦게 사무쳤다. 그러나 구보는 알았다. 설령 그 시절로 돌아간다 해도, 우유부단한 자신은 또 그렇게 인연을 놓치고 말았으리라는 것을. 그 씁쓸한 깨달음이 그를 더욱 쓸쓸하게 했다. 식어 버린 차처럼, 지난 사랑의 기억도 그렇게 차갑게 식어 있었다.</p>

          <p class="section-title">Part 7. 경성역의 군중</p>
          <p>다방을 나선 구보는 발길을 경성역으로 돌렸다. 그는 사람의 온기가 그리웠다. 수많은 사람이 오가는 역에 가면, 그 북적임 속에서 외로움이 조금은 가실까 싶었던 것이다. 과연 경성역 대합실은 오가는 사람들로 발 디딜 틈 없이 붐볐다. 그러나 막상 그 군중 속에 선 구보가 마주한 것은, 따뜻한 인정이 아니라 차갑고 메마른 도시의 얼굴이었다. 사람들은 저마다 제 갈 길만 바쁘게 좇을 뿐, 곁에 선 이에게는 눈길 한 번 주지 않았다. 병든 듯 지친 얼굴들, 돈과 짐 보따리에만 매달린 사람들 틈에서, 구보는 도리어 더 깊은 외로움을 느꼈다. 수많은 사람 속에 있으면서도 아무와도 이어지지 못하는 고독이, 그 어떤 적막보다도 그를 시리게 했다.</p>
          <p>사람을 찾아 사람들 속으로 들어왔건만, 거기에 그가 바라던 온기는 없었다. 구보는 쓸쓸한 마음으로 그 차가운 군중을 등지고, 다시 역을 빠져나왔다. 도시는 그토록 많은 사람을 품고 있으면서도, 정작 사람과 사람을 이어 주지는 못했다. 저마다 섬처럼 떨어져 제 갈 길만 가는 군중의 모습이, 구보에게는 이 시대의 쓸쓸한 자화상처럼 보였다. 그는 그 차가운 풍경을 가슴에 담으며 발길을 돌렸다. 사람을 그리워할수록, 이 도시의 외로움은 도리어 더욱 짙어지기만 했다.</p>

          <p>그래도 구보는 그 짧은 만남이 고마웠다. 적어도 이 각박한 도시에, 제 마음을 알아주는 벗 하나는 있다는 사실이 그나마 위로가 되었다. 두 사람은 다음을 기약하며 아쉬운 작별을 나누었다. 벗과 나눈 몇 마디 말이, 온종일 얼어 있던 구보의 마음을 잠시나마 녹여 주었다. 역시 사람은 사람에게서 위로를 얻는 법이었다. 다만 그 온기가 오래가지 못한다는 것이, 구보에게는 못내 아쉬울 따름이었다. 짧은 만남의 온기를 가슴에 품은 채, 구보는 다시 홀로 거리로 나섰다. 어차피 외로움은 그의 오랜 길동무였다.</p>

          <p class="section-title">Part 9. 글쓰기의 의미를 묻다</p>
          <p>벗과 헤어진 뒤, 구보는 밤이 깊도록 거리를 거닐었다. 낮과는 또 다른 얼굴을 한 도시의 밤 풍경이, 네온 불빛 아래 묘한 빛을 뿜어내고 있었다. 정처 없는 산책 속에서, 구보는 문득 제 삶을 돌아보았다. 직업도 없이, 혼인도 없이, 날마다 이렇게 거리나 떠도는 제 삶이 과연 옳은 것인가. 그러다 그의 생각은 끝내 글쓰기에 가 닿았다. 그가 끝끝내 번듯한 직업 대신 붙들고 있는 것이 바로 소설이었다. 비록 당장 돈이 되지도, 남들이 알아주지도 않았으나, 구보에게 글을 쓴다는 것은 세상을 들여다보고 사람을 이해하려는 제 나름의 길이었다. 온종일 거리를 떠돌며 사람과 도시를 관찰한 것도, 돌이켜 보면 다 좋은 글을 쓰기 위한 밑거름이었는지 몰랐다.</p>

          <p>한번 일기 시작한 속세의 욕망은, 성진의 맑던 도심을 송두리째 뒤흔들어 놓았다. 밤이 깊도록 성진은 번뇌에 사로잡혀 잠을 이루지 못했다. 청정하던 수행자의 마음에, 그렇게 짙은 먹구름이 무겁게 드리워지고 있었다. 아무리 염불을 외고 마음을 다잡으려 애써도, 한번 피어오른 속세의 그리움은 좀처럼 사그라들지 않았다. 도리어 날이 갈수록 그 번뇌는 깊어만 갔다. 성진은 제 마음이 어찌하여 이토록 흔들리는지 알 수 없어 괴로워했다. 수행자로서의 평온은 이미 깨어진 뒤였다. 성진은 밤마다 홀로 길고 깊은 한숨을 내쉴 따름이었다.</p>

          <p class="section-title">Part 4. 육관대사의 벌</p>
          <p>성진의 흐트러진 마음을, 덕 높은 육관대사가 모를 리 없었다. 대사는 성진을 불러 앉히고 그 어지러운 심사를 낱낱이 꾸짖었다. 불도를 닦는 몸으로 어찌 속세의 부귀와 여색을 탐하느냐는 것이었다. 그러나 대사는 단순히 꾸짖는 데에 그치지 않았다. 성진이 그토록 속세의 삶을 그리워하니, 차라리 그 욕망을 직접 겪어 보게 하리라 마음먹은 것이다. 대사는 성진을 인간 세상으로 내치는 벌을 내렸다. 성진뿐만이 아니었다. 성진과 더불어 마음을 어지럽힌 팔선녀 또한, 나란히 인간 세상에 태어나 속세의 삶을 겪도록 하였다. 저승사자에게 이끌려 가는 성진은 그제야 제 잘못을 뉘우쳤으나, 이미 때는 늦은 뒤였다.</p>
          <p>육관대사의 깊은 뜻은 다른 데 있었다. 성진이 스스로 속세의 영화를 끝까지 누려 본 뒤에야, 비로소 그 부질없음을 깨닫게 하려는 것이었다. 그리하여 성진은 맑은 연화봉을 떠나, 티끌 가득한 인간 세상으로 떨어지게 되었다. 성진은 눈물로 용서를 빌었으나, 대사의 뜻은 이미 정해진 뒤였다. 다만 그 벌은 성진을 미워해서가 아니라, 오히려 그를 참되게 깨우치기 위한 깊은 자비에서 나온 것이었다. 사람은 때로 스스로 겪어 보아야만 비로소 깨닫는 법이기 때문이었다. 기나긴 꿈의 여정이 그렇게 막 시작되려 하고 있었다.</p>

          <p class="section-title">Part 5. 양소유로 태어나다</p>
          <p>인간 세상에 떨어진 성진은, 양처사라는 사람의 아들 양소유로 다시 태어났다. 어려서부터 양소유는 비범한 재주를 드러내었다. 하나를 들으면 열을 깨치는 총명함에, 글재주와 무예가 모두 남달라 일찍이 신동이라는 소문이 자자했다. 지난 생의 성진이 그러했듯, 양소유 또한 맑고 빼어난 인물로 자라났다. 한편 성진과 더불어 벌을 받은 팔선녀도, 저마다 다른 집안의 여인으로 인간 세상에 태어났다. 어느 선녀는 재상가의 귀한 딸로, 어느 선녀는 이름난 기생으로, 또 어느 선녀는 공주로 태어나니, 그 신분과 처지는 저마다 달랐다. 그러나 전생의 인연은 끊어지지 않는 법이어서, 이 여덟 여인은 머지않아 양소유와 하나하나 기이한 인연으로 맺어질 운명이었다.</p>
          <p>다만 인간으로 태어난 이들은 모두 전생의 일을 까맣게 잊은 채였다. 제가 본디 연화봉의 성진이요 선녀였다는 것도 모르고, 그저 주어진 삶을 향해 묵묵히 나아갈 뿐이었다. 전생의 인연이란 참으로 질기고도 묘한 것이었다. 비록 서로를 알아보지 못할지라도, 정해진 운명은 이들을 기어이 한자리로 이끌 터였다. 양소유의 앞에는, 여덟 여인과 얽힌 기이하고도 화려한 인연의 길이 활짝 열려 있었다. 운명의 실타래는 그렇게 조용히 풀려 가기 시작했다.</p>

          <p class="section-title">Part 6. 장원급제와 입신양명</p>
          <p>장성한 양소유는 큰 뜻을 품고 과거를 보러 서울로 올라갔다. 그 빼어난 글재주 앞에서는 당할 자가 없어, 양소유는 단번에 과거에 장원으로 급제하였다. 어린 나이에 벼슬길에 오른 그는, 가는 곳마다 비범한 재주를 떨쳤다. 나라에 어려운 일이 생기면 양소유가 나서서 지혜로 풀었고, 변방에 난리가 일면 대장이 되어 적을 물리쳤다. 문무를 두루 갖춘 그의 공은 날로 높아만 갔다. 임금의 두터운 신임을 받은 양소유는 마침내 벼슬이 대승상에 이르고, 위국공이라는 높은 작위까지 받기에 이르렀다. 한 몸에 부귀와 공명을 모두 거머쥔 것이다. 지난날 성진이 그토록 그리워하던 속세의 영화가, 이제 양소유의 손안에 고스란히 들어온 셈이었다.</p>
          <p>세상 사람들은 그의 출세를 우러러보았고, 양소유의 이름은 온 나라에 드높았다. 입신양명의 꿈을 남김없이 이룬 그의 앞날은, 눈부신 햇살처럼 찬란하게만 보였다. 양소유가 가는 길마다 영광과 찬사가 뒤따랐다. 미천한 선비에서 일약 나라의 기둥이 되기까지, 그의 출세는 거침이 없었다. 지난 생에 성진이 산중에서 꿈꾸던 바로 그 부귀영화를, 양소유는 이제 현실에서 손에 쥔 것이다. 그러나 그 영화의 끝에 무엇이 기다리는지는 아직 아무도 알지 못했다.</p>

          <p class="section-title">Part 7. 2처 6첩의 영화</p>
          <p>부귀와 공명을 이룬 양소유에게는, 세상의 온갖 사랑 또한 아낌없이 찾아들었다. 양소유는 살아가는 동안 여덟 여인을 차례로 만나, 그들을 모두 아내와 첩으로 맞아들였다. 그 여덟 여인이 바로 전생의 팔선녀였으나, 아무도 그 사실을 알지 못했다. 재상가의 규수인 정경패와 임금의 누이인 난양공주를 두 정실 아내로 삼고, 기생이던 계섬월과 적경홍, 그리고 진채봉을 비롯한 여섯 여인을 첩으로 거느리니, 이른바 이처 육첩의 복을 누리게 되었다. 여덟 여인은 서로 시기하거나 다투는 법 없이, 한 지아비를 모시며 우애 좋게 어울려 살았다. 양소유의 집안에는 날마다 웃음과 풍악이 끊이지 않았다.</p>
          <p>세상의 부귀와 영화, 그리고 사랑까지 모두 거머쥔 그의 삶은, 그야말로 더 바랄 것이 없어 보였다. 사람으로 태어나 누릴 수 있는 온갖 복락을, 양소유는 남김없이 다 누리고 있었던 것이다. 그렇게 영화로운 세월은 꿈결처럼 흘러갔다. 부귀와 사랑을 한꺼번에 거머쥔 양소유는, 세상에 부러울 것이 없었다. 지난날 성진이 그리던 속세의 즐거움이란 즐거움은, 양소유의 삶 속에 남김없이 펼쳐졌다. 사람이 누릴 수 있는 복이 이보다 더할 수 있으랴 싶을 만큼, 그의 나날은 화려하고 흡족했다. 그러나 화무십일홍이라 하였던가.</p>

          <p class="section-title">Part 8. 인생무상</p>
          <p>부귀영화 속에 세월은 덧없이 흘러, 양소유도 어느덧 머리가 희끗한 노인이 되었다. 그는 벼슬에서 물러나 여덟 부인과 더불어 한가로운 여생을 보내고 있었다. 어느 가을날, 양소유는 부인들과 함께 높은 누각에 올라 사방을 둘러보았다. 때마침 저무는 가을 들녘에는 쓸쓸한 바람이 불고, 멀리 산기슭에는 옛 영웅호걸들의 무덤이 점점이 흩어져 있었다. 그 황량한 풍경을 바라보던 양소유의 가슴에, 문득 알 수 없는 서글픔이 밀려들었다. 한 시대를 호령하던 진시황도, 한무제도 지금은 한 줌 흙이 되어 저 무덤 속에 누워 있지 않은가. 제가 평생을 다해 이룬 이 부귀와 영화 또한, 결국은 저 무덤처럼 덧없이 스러지고 말 것이었다.</p>
          <p>인생이란 참으로 한바탕 봄꿈처럼 허망한 것이로구나. 양소유는 비로소 세상의 모든 영화가 부질없음을 사무치게 느꼈다. 그러고는 이 덧없는 삶을 넘어, 생사를 초월하는 참된 도를 구하고 싶은 마음이 간절히 일었다. 평생을 바쳐 쌓아 올린 부귀와 공명이, 돌이켜 보니 한낱 뜬구름 같기만 했다. 영원할 줄 알았던 젊음도, 권세도, 사랑도 세월 앞에서는 속절없이 저물어 갔다. 양소유의 눈가에는 저도 모르게 서글픈 눈물이 맺혔다. 이 허망함을 넘어설 길은 과연 어디에 있단 말인가.</p>

          <p class="section-title">Part 9. 노승의 깨우침과 각성</p>
          <p>양소유의 마음에 인생무상의 서글픔이 가득할 바로 그때, 한 노승이 홀연히 누각 앞에 나타났다. 백발이 성성한 그 노승은 손에 지팡이를 짚고, 양소유를 가만히 바라보며 알 듯 모를 듯한 말을 건넸다. 양소유가 그 노승과 몇 마디 선문답을 주고받는 사이, 문득 눈앞의 모든 것이 아득히 흐려지기 시작했다. 다음 순간, 양소유는 소스라치게 놀라며 정신을 차렸다. 눈을 떠 보니, 자신은 호화로운 승상의 저택이 아니라 연화봉의 작은 암자에 앉아 있는 젊은 승려 성진이 아닌가. 평생을 누린 그 부귀영화와 여덟 부인이, 실은 하룻밤 꿈이었던 것이다. 그 노승이 바로 스승 육관대사였음을, 성진은 그제야 깨달았다.</p>
          <p>대사는 성진의 헛된 욕망을 다스리고자, 꿈을 빌려 속세의 영화를 끝까지 겪게 한 것이었다. 성진은 꿈과 현실이 둘이 아님을, 그리고 그토록 그리던 속세의 복락이 한바탕 꿈에 지나지 않음을 온몸으로 깨달았다. 꿈과 생시가 뒤바뀐 그 순간, 성진의 머릿속은 아득하기만 했다. 평생이라 여겼던 그 긴 세월이, 눈 깜짝할 사이의 한바탕 꿈이었다니. 성진은 비로소 스승의 깊은 뜻을 헤아렸다. 속세의 영화를 끝까지 겪어 본 뒤에야, 그 부질없음을 뼈저리게 알게 된 것이다. 그 뼈아픈 깨달음은 천금보다도 값진 것이었다.</p>

          <p class="section-title">Part 10. 꿈에서 깨어 도를 이루다</p>
          <p>꿈에서 깨어난 성진은 육관대사 앞에 엎드려 눈물로 뉘우쳤다. 지난날 속세의 부귀영화를 탐하여 도심을 어지럽힌 제 어리석음을, 이제야 비로소 깊이 깨달은 것이다. 양소유로서 누린 그 모든 영화가 결국 한바탕 봄꿈이었듯, 사람이 그토록 좇는 부귀와 공명, 사랑 또한 다 덧없는 것임을 성진은 사무치게 알았다. 그 깨달음 앞에서, 속세를 향하던 성진의 번뇌는 눈 녹듯 스러졌다. 한편 성진과 더불어 꿈을 꾸고 깨어난 팔선녀 역시, 저마다 헛된 욕망의 부질없음을 깨닫고 육관대사에게 나아가 제자가 되기를 청했다. 이에 육관대사는 성진과 팔선녀를 거두어 참된 불법을 전수하였다.</p>
