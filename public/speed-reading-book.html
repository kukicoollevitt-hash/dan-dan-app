        content: `
          <p class="section-title">① 모든 사람을 한눈에 감시하는 패놉티콘의 구조</p>
          <p>벤담이 구상한 ‘패놉티콘’은 한곳에서 모든 대상을 감시할 수 있도록 설계된 일망 감시 감옥이다. 그 구조는 원형의 건물이 중앙의 탑을 둘러싼 형태다. 탑에는 바깥의 원형 건물 안쪽을 향한 여러 개의 큰 창문이 나 있다. 원형 건물은 수많은 독방으로 나뉘며, 각 독방은 건물의 앞면에서 뒷면까지 이어진다. 독방마다 창문이 두 개 있는데, 하나는 중앙 탑을 향하고 다른 하나는 바깥을 향한다. 바깥 창문으로 들어오는 빛은 방 안을 구석구석 비추고, 중앙 탑에 있는 감시자는 역광을 이용해 독방 속 사람의 윤곽을 선명하게 파악할 수 있다. 중앙 탑에 감시인 한 명을 배치하고 각각의 독방에 죄수나 병자, 광인, 노동자, 학생 등을 한 사람씩 수용할 수 있도록 한 것이다. 이렇게 각 독방은 한 사람이 연기하는 작은 무대처럼 분리되어 언제나 감시자의 시선에 노출된다. 패놉티콘은 대상을 끊임없이 바라보고 즉각적으로 구별할 수 있도록 공간을 세밀하게 나눈 장치다. 감시자는 수많은 독방을 직접 돌아다니지 않고도 중앙에서 각 사람의 상태를 확인할 수 있다. 이것이 설계의 출발점이다.</p>
          <p class="section-title">② 어둠 대신 빛으로 감시하는 새로운 감옥</p>
          <p>패놉티콘에서는 전통적인 지하 감옥의 원리가 뒤집힌다. 지하 감옥에는 사람을 가두고, 빛을 차단하고, 외부의 시선에서 숨겨 두는 세 가지 기능이 있었다. 그러나 일망 감시 감옥은 그중 감금 기능만 남기고 어둠과 은폐를 없앤다. 충분한 빛과 감시자의 시선이 오히려 수감자를 더 쉽게 포착하게 만드는 것이다. 이곳에서는 여러 사람이 한 공간에 모여 소란을 피우는 모습을 볼 수 없다. 각 사람은 정면에서 감시자가 바라볼 수 있는 독방에 혼자 머물며 자기 자리를 지킨다. 양쪽 벽은 이웃 독방의 사람과 접촉하는 일을 차단한다. 감시자는 수감자를 볼 수 있지만 수감자는 감시자를 볼 수 없다. 따라서 수감자는 정보를 제공하는 대상일 뿐, 서로 소통하며 정보를 주고받는 주체가 되지 못한다. 중앙 탑과 마주한 독방에서는 언제나 보이는 상태가 강요되고, 옆방과 분리된 구조에서는 다른 수감자를 볼 수 없는 상태가 만들어진다. 이처럼 패놉티콘은 감시자의 가시성과 수감자의 고립을 하나의 건축 구조 안에 결합한다.</p>
          <p class="section-title">③ 개인을 고립시켜 질서를 유지하는 감시 체제</p>
          <p>독방 사이의 비가시성은 감옥 안의 질서를 유지하는 중요한 수단이 된다. 죄수들이 서로 만나지 못하면 음모를 꾸미거나 집단 탈옥을 계획하고, 출소한 뒤 저지를 범죄를 의논할 가능성을 줄일 수 있다. 병자들이 분리되어 있으면 전염의 위험을 낮출 수 있고, 광인들이 서로 폭력을 행사할 위험도 줄어든다. 어린이들이라면 다른 사람의 숙제를 베끼거나 시끄럽게 떠들고 수다를 떨어 주의를 흐트러뜨리는 행동을 막을 수 있다. 노동자들에게 적용할 경우에는 구타와 절도, 공모를 방지하고 작업이 지연되거나 마무리가 불완전해지는 일, 부주의로 사고가 생기는 일을 줄일 수 있다. 이처럼 사람들 사이의 접촉을 차단하는 일은 단순한 격리가 아니라 집단의 움직임을 통제하는 방식이다. 여러 사람이 뒤섞여 교류하며 집단적인 영향을 만들어 내던 군중은 사라지고, 서로 분리된 개인들의 집합이 남는다. 간수에게는 통제하기 어려운 군중이 셀 수 있고 관리할 수 있는 개인들로 바뀌며, 수감자에게는 함께하는 생활 대신 고립과 감시가 주어진다.</p>
          <p class="section-title">④ 감시자가 없어도 계속되는 감시의 효과</p>
          <p>패놉티콘에서 중요한 것은 감시자가 실제로 매 순간 수감자를 바라보는지 여부가 아니다. 수감자가 자신이 언제든 감시당할 수 있다고 의식하도록 만드는 것이 핵심이다. 독방에 갇힌 사람은 중앙 탑 안의 감시자를 볼 수 없으므로 지금 감시가 이루어지는지 확인할 수 없다. 그 결과 그는 감시자의 시선을 늘 의식하며 스스로 행동을 조심하게 된다. 감시가 잠시 중단되더라도 그 효과는 계속될 수 있다. 권력이 완벽하게 작동할수록 실제로 권력을 행사하는 횟수나 강제적인 행동은 오히려 줄어드는 것이다. 이러한 건축적 장치는 특정한 감시자의 능력이나 의지와 상관없이 일정한 권력 관계를 만들어 내고 유지한다. 수감자는 외부에서 누군가 계속 명령하지 않아도 감시받는 상황에 맞추어 스스로 행동한다. 결국 패놉티콘은 사람을 물리적으로 가두는 시설인 동시에 감시 가능성을 마음속에 심어 놓는 장치가 된다. 수감자는 자신을 감시하는 힘이 실제로 작용하는지 알 수 없으면서도 그 힘의 효과를 지속적으로 경험한다. 결국 실제 감시보다 감시당할 수 있다는 의식이 더 중요한 힘을 발휘한다.</p>
          <p class="section-title">⑤ 보는 사람과 보이는 사람을 분리하는 권력</p>
          <p>일망 감시 감옥의 구조는 ‘봄’과 ‘보임’의 관계를 분리한다. 원형 건물의 독방에 있는 사람은 중앙 탑을 제대로 볼 수 없지만 자신의 모습은 완전히 드러난다. 반대로 중앙 탑에 있는 사람은 모든 독방을 바라볼 수 있으면서도 독방 안의 사람에게는 모습을 드러내지 않는다. 이처럼 보는 사람과 보이는 사람이 철저하게 나뉘는 구조는 권력을 자동적이고 비개성적인 것으로 만든다. 권력의 근원이 특정한 감시자의 인격이나 능력에 있는 것이 아니라 건물의 배치 자체에 있기 때문이다. 감시자가 누구인지는 별로 중요하지 않다. 관리 책임자가 자리를 비우더라도 그의 가족이나 친구, 측근, 방문객, 심지어 하인까지 중앙 탑에 들어가 감시자의 역할을 대신할 수 있다. 독방에 있는 수감자는 그 사람이 누구인지 알 수 없으며, 자신을 감시하는 사람이 바뀌어도 같은 불안감을 느낀다. 결국 권력은 한 사람에게 속한 힘이라기보다 누구든 일정한 자리에 들어서면 행사할 수 있는 힘으로 바뀐다. 감시하는 자리가 개인보다 중요해지는 구조인 것이다.</p>
          <p class="section-title">⑥ 감시자의 의도와 관계없이 작동하는 권력</p>
          <p>패놉티콘에서 감시자의 동기는 권력의 효과를 결정하는 중요한 조건이 아니다. 중앙 탑에 들어선 사람이 단순한 호기심으로 수감자를 살펴보든, 어린아이의 장난으로 바라보든, 철학적인 탐구를 위해 관찰하든 결과는 비슷하다. 몰래 지켜보거나 처벌하는 데서 즐거움을 느끼는 사람이 감시하더라도 수감자에게는 자신이 관찰될 수 있다는 사실이 중요하다. 익명의 관찰자가 많아질수록 수감자는 언제 누구에게 자신의 행동이 드러날지 더욱 알 수 없게 된다. 따라서 간파될 위험과 감시받는다는 불안감은 더 커진다. 권력을 행사하는 사람들의 목적과 성격이 서로 달라도 독방에 있는 사람에게 나타나는 효과는 한결같다. 그는 언제나 자신의 행동을 통제해야 한다고 느낀다. 패놉티콘이 경이로운 시설인 이유는 다양한 사람의 서로 다른 욕망을 하나의 동일한 권력 효과로 바꾸어 놓기 때문이다. 감시하는 사람의 개인적인 특성이 사라진 자리에는 감시당할 가능성이라는 지속적인 압력이 남는다. 수감자에게는 관찰자의 얼굴보다 관찰당할 수 있다는 사실이 더 큰 영향을 미친다.</p>
          <p class="section-title">⑦ 외부의 감시가 스스로를 통제하는 힘으로 바뀌다</p>
          <p>패놉티콘의 감시 효과는 결국 수감자 자신의 마음속으로 옮겨 간다. 자신이 감시당하고 있다는 사실을 의식하는 사람은 외부의 명령이나 처벌을 기다리지 않고 스스로 권력의 강제력을 떠맡는다. 그는 자신을 감시하는 시선을 마음속에 받아들여 자신의 행동을 점검하고 통제한다. 말하자면 감시하는 사람과 감시받는 사람의 역할을 혼자서 동시에 수행하는 것이다. 이렇게 권력 관계를 내면화한 사람은 스스로 자신을 예속시키게 된다. 바로 이 때문에 외부의 권력은 직접적인 물리적 힘을 덜 사용해도 된다. 감시자가 수시로 개입하거나 폭력을 행사하지 않더라도 수감자는 규칙에 맞추어 행동할 가능성이 커진다. 권력의 모습은 점점 희미해지지만 그 효과는 오히려 깊고 오래 지속된다. 권력은 사람과 직접 충돌하기 전에 이미 그의 행동에 영향을 미치며, 별도의 명령 없이도 끊임없이 자신을 갱신한다. 패놉티콘은 이처럼 외부의 감시가 자기 감시로 바뀌는 과정을 보여 준다. 감시자는 눈에 띄지 않아도 수감자의 행동을 지배하는 효과를 얻는다. 이러한 작용은 지속된다.</p>
          <p class="section-title">⑧ 감옥을 넘어 사회 전반으로 확장되는 감시 원리</p>
          <p>일망 감시 감옥은 단지 죄수를 가두는 특이한 건물로만 이해해서는 안 된다. 그것은 인간의 일상생활과 권력 사이의 관계를 규정하는 하나의 일반적인 모델이다. 패놉티콘이 처음 구상된 뒤 오랜 세월 동안 여러 형태로 변형되어 온 사실은 이 구조가 사람들에게 강렬한 영향을 주었음을 보여 준다. 그러나 이를 현실과 동떨어진 상상 속의 건축물로 보는 것은 적절하지 않다. 패놉티콘에는 특정한 권력 체제가 이상적인 형태로 압축되어 있다. 그 체제는 저항을 최소화하면서 사람들을 관찰하고 통제하는 기능을 단순한 건축과 시각의 체계로 구현한다. 중앙에서 여러 개인을 볼 수 있고 개인들은 서로 분리되는 구조는 감옥 밖에서도 응용할 수 있다. 일정한 공간 안에서 정해진 수의 사람들을 감시해야 하는 시설이라면 비슷한 원리가 적용될 수 있기 때문이다. 그러므로 패놉티콘은 감옥의 설계도인 동시에 권력이 사람들에게 작용하는 방식을 설명하는 정치적 기술의 모델이기도 하다. 이는 공간을 조직하는 방식이 사람들의 행동을 조직하는 방식으로 이어질 수 있음을 뜻한다.</p>
          <p class="section-title">⑨ 적은 인원으로 많은 사람을 통제하는 효율성</p>
          <p>패놉티콘의 구조가 여러 시설에 적용될 수 있는 까닭은 적은 수의 감시자로 많은 사람을 통제할 수 있기 때문이다. 일반적인 방식이라면 감시 대상이 늘어날수록 그들을 지켜보는 사람도 늘어나야 한다. 그러나 일망 감시의 구조에서는 중앙 탑과 독방의 배치만으로 수많은 개인을 한눈에 파악할 수 있다. 권력을 행사하는 사람의 수는 줄이면서도 그 대상의 수는 늘릴 수 있는 것이다. 또한 감시받는 사람들이 스스로 행동을 조절하므로 매번 강제로 명령하거나 물리적인 힘을 행사할 필요도 줄어든다. 감시의 효과는 개인에게서 또 다른 개인으로 이어지는 것이 아니라 각자에게 직접 작용한다. 건물의 형태와 기하학적인 배치가 별도의 강제 수단 없이도 행동을 바꾸는 조건이 되는 셈이다. 이러한 체제는 조용하고 자발적으로 작동하는 것처럼 보이지만, 실제로는 권력의 효과를 끊임없이 유지한다. 패놉티콘은 적은 비용과 인력으로 강한 통제 효과를 얻으려는 권력의 효율성을 드러낸다. 권력은 감시자의 직접적인 개입 없이도 공간 속에 배치된 관계를 통해 작동한다.</p>
          <p class="section-title">⑩ 패놉티콘이 보여 주는 보이지 않는 권력의 본질</p>
          <p>패놉티콘의 핵심은 감시자가 모든 사람을 실제로 계속 바라보는 데 있지 않다. 감시 대상이 자신이 언제든 보일 수 있다는 사실을 의식하고, 그 가능성에 맞추어 스스로 행동하도록 만드는 데 있다. 원형 건물과 중앙 탑, 빛이 들어오는 독방, 서로를 볼 수 없도록 막힌 벽은 이러한 효과를 위해 설계된 장치들이다. 이 구조에서 수감자는 정보를 제공하는 대상으로 남고 감시자는 보이지 않는 위치에서 정보를 얻는다. 감시자가 누구인지, 어떤 목적으로 관찰하는지와 관계없이 권력의 효과가 유지된다는 점도 중요하다. 그 결과 외부의 감시는 수감자의 자기 통제로 바뀌고, 직접적인 강제력은 줄어들어도 권력 관계는 지속된다. 이 원리는 감옥을 넘어 일정한 공간에서 사람들을 관찰하고 관리하는 여러 시설에 응용될 수 있다. 결국 일망 감시 감옥은 권력이 반드시 눈에 보이는 명령이나 폭력으로만 작동하는 것은 아니라는 사실을 보여 준다. 보이지 않는 감시의 가능성만으로도 사람의 행동을 바꿀 수 있다는 것이다. 이런 점에서 패놉티콘은 감시와 권력의 관계를 설명하는 대표적인 사례가 된다.</p>

          <p class="section-title">③ 간디와 슈마허가 꿈꾼 인간을 위한 기술</p>
          <p>적정 기술은 가난한 사람들도 기술의 혜택을 누릴 수 있도록 하자는 취지에서 발전했습니다. 이러한 운동의 출발점에는 마하트마 간디의 노력이 있습니다. 간디는 인도의 각 마을이 다른 곳에 지나치게 의존하지 않고 독립적으로 경제 활동을 할 수 있기를 바랐습니다. 그래서 지역을 중심으로 활용할 수 있는 작고 실용적인 기술을 개발하려 했습니다. 그는 기업의 이윤을 늘리기 위한 대량 생산 기술이나 소수의 사람만 이익을 얻는 기술을 바람직하게 여기지 않았습니다. 간디의 생각에 영향을 받은 경제학자 에른스트 슈마허는 《작은 것이 아름답다》에서 ‘중간 기술’을 강조했습니다. 중간 기술이란 최소한의 비용을 들이고 현지에서 구할 수 있는 재료를 사용하며, 현지 주민이 직접 활용할 수 있는 기술을 말합니다. 선진국의 값비싼 첨단 기술과 비교하면 소박하지만, 개발도상국의 기존 기술보다 실용적인 도움을 줄 수 있습니다. 슈마허는 소수의 부유한 사람만을 위한 기술이 아니라 많은 사람의 삶을 개선하는 ‘인간의 얼굴을 한 기술’을 추구했습니다.</p>

          <p class="section-title">⑤ 전기가 없어도 음식을 보관하는 항아리 냉장고</p>
          <p>적정 기술은 첨단 기계에 익숙한 사람의 눈에는 다소 불편하고 단순한 기술처럼 보일 수 있습니다. 그러나 전기가 없어 늘 어둡게 살아가거나 오염된 물을 마셔야 하는 사람들에게는 꼭 필요한 기술입니다. 그 대표적인 예가 전기를 사용하지 않는 ‘항아리 냉장고’입니다. 우리는 운동을 마친 뒤 냉장고에서 꺼낸 차가운 음료수를 마시는 일을 당연하게 생각합니다. 하지만 전기 시설이 부족한 아프리카의 일부 지역에서는 냉장고를 사용하기 어렵습니다. 기온이 40도를 넘는 곳에서는 차가운 음료수를 마시기는커녕 음식이 쉽게 상하기도 합니다. 부패한 음식을 먹은 주민들은 질병에 걸릴 위험이 커집니다. 항아리 냉장고는 이러한 환경에서 음식을 조금 더 오래 보관할 수 있도록 고안된 장치입니다. 특별한 전기 장치 없이 주변에서 구할 수 있는 항아리와 모래, 물을 이용한다는 점이 특징입니다. 고가의 냉장고를 설치하기 어려운 곳에서도 주민들이 비교적 간단하게 만들어 사용할 수 있다는 점에서 적정 기술의 취지를 잘 보여 줍니다.</p>
          <p class="section-title">⑥ 항아리 두 개와 모래로 만드는 냉장고의 원리</p>

          <p class="section-title">⑧ 안경조차 사기 어려운 사람들을 위한 발명</p>
          <p>안경을 쓰거나 콘택트렌즈를 착용하는 사람이라면 시력이 나쁜데도 아무런 도움 없이 생활하는 일이 얼마나 불편할지 짐작할 수 있을 것입니다. 우리는 시력이 나빠지면 검사를 받고 자신에게 맞는 안경을 구입해 비교적 쉽게 문제를 해결합니다. 그러나 가난한 지역에서는 흐릿한 세상을 당연하게 받아들이며 살아가는 사람들도 있습니다. 원문에서는 적절한 시력 교정의 도움을 받지 못하는 사람이 전 세계적으로 약 10억 명에 이른다고 소개합니다. 하루에 1~2달러로 생활하는 사람에게 안경은 사치품처럼 느껴질 수 있습니다. 돈을 마련하더라도 전문적으로 시력을 검사하는 검안사가 부족해 자신에게 맞는 안경을 구하기 어려운 경우가 있습니다. 거주지에서 멀리 떨어진 곳까지 찾아가 검사를 받고 안경을 맞추는 일은 시간과 비용을 모두 요구합니다. 그래서 값싸고, 검안사의 도움 없이도 초점을 조절할 수 있으며, 한 번 구입하면 오래 사용할 수 있는 안경이 필요해졌습니다. 이런 문제를 해결하기 위해 개발된 것이 ‘스스로 도수를 조절할 수 있는 안경’입니다.</p>
          <p class="section-title">⑨ 실리콘 오일로 도수를 조절하는 신기한 안경</p>
          <p>스스로 도수를 조절하는 안경은 어떻게 만들 수 있을까요? 우리는 과학 시간에 근시에는 빛을 퍼뜨리는 오목 렌즈를, 원시에는 빛을 모으는 볼록 렌즈를 이용한다고 배웁니다. 일반적인 안경의 렌즈는 딱딱해서 사용자가 모양을 마음대로 바꾸기 어렵습니다. 개발자들은 고체 렌즈를 바꾸기 어렵다면 액체를 이용해 보자는 생각을 했습니다. 이 안경에는 투명한 막과 실리콘 오일이 사용됩니다. 안경 양쪽에 연결된 장치를 통해 액체의 양을 조절하면 투명한 막 사이로 실리콘 오일이 들어가거나 빠져나오면서 렌즈의 볼록한 정도가 달라집니다. 그러면 렌즈를 통과하는 빛의 굴절 정도도 변해 사용자가 자신의 시력에 맞게 초점을 조절할 수 있습니다. 실리콘 오일은 쉽게 증발하지 않아 오랫동안 사용할 수 있다는 장점도 있습니다. 원문에서는 이 안경의 가격이 15달러이며, 5달러 이하로 낮추기 위해 노력하고 있다고 설명합니다. 전문적인 장비를 쉽게 이용할 수 없는 사람들에게 시력을 교정할 새로운 가능성을 제공한 것입니다.</p>
          <p class="section-title">⑩ 세상을 바꾸는 과학, 함께 살아가는 적정 기술</p>
          <p>항아리 냉장고와 스스로 도수를 조절하는 안경은 서로 다른 문제를 해결하지만 중요한 공통점을 가지고 있습니다. 비싼 시설이나 전문 장비를 갖추기 어려운 사람들도 생활에 필요한 기술을 이용하도록 돕는다는 점입니다. 항아리 냉장고는 물이 증발할 때 주변의 열을 흡수하는 원리를 이용하고, 도수 조절 안경은 액체의 양에 따라 렌즈의 모양과 빛의 굴절이 달라지는 원리를 활용합니다. 두 기술 모두 복잡하고 값비싼 기계 대신 비교적 단순한 과학 원리로 생활 속 불편을 줄이려 합니다. 이 밖에도 많은 기업과 과학자들이 더 나은 생활환경을 만들기 위해 적정 기술을 연구하고 있습니다. 일반인들도 기부와 여러 활동을 통해 개발도상국의 주민들이 가난과 질병에서 벗어날 수 있도록 돕고 있습니다. 과학 기술의 가치는 얼마나 새롭고 화려한가에만 있지 않습니다. 누구의 어려움을 해결하고 얼마나 많은 사람에게 실질적인 도움을 주는지도 중요합니다. 적정 기술은 과학이 사람들과 함께 살아가는 방법을 찾는 데 쓰일 수 있음을 보여 줍니다.</p>

          <p class="section-title">① 인간 사회에서 갈등과 논쟁이 필요한 이유</p>
          <p>인간은 혼자 살아가는 존재가 아니라 무리를 이루어 살아가는 존재이다. 여러 사람이 함께 생활하는 사회에서는 서로 다른 생각과 의견이 부딪치는 일이 자연스럽게 일어난다. 따라서 갈등이 생기는 것을 무조건 피하는 것이 능사는 아니다. 오히려 갈등을 잘 해결하는 과정에서 사회가 나아가야 할 긍정적인 방향을 찾아 발전할 수도 있다. 이러한 갈등을 합리적으로 해결하기 위해 필요한 도구가 바로 논쟁이다. 그러나 한국인들은 대체로 논쟁을 좋아하지 않는다고 글쓴이는 지적한다. 자신과 생각이 다른 사람과 부딪치는 일을 바람직하지 않게 여기고, 반대 의견을 내면 갈등을 조장한다고 생각하는 사람이 적지 않다. 자신의 불만과 갈등을 밖으로 드러내지 않고 마음속에 품어 삭이는 사람을 그릇이 큰 사람으로 여기기도 한다. 하지만 서로 다른 의견을 감추기만 한다면 문제는 해결되지 않는다. 논쟁은 갈등을 더 크게 만드는 수단이 아니라, 갈등을 드러내고 해결의 실마리를 찾는 과정이 될 수 있다. 이 점을 이해해야 논쟁을 바라보는 태도도 달라질 수 있다.</p>
          <p class="section-title">② 서구 사회에서 논쟁이 발전해 온 역사</p>
          <p>우리 사회에서 논쟁을 꺼리는 태도와 달리, 미국이나 유럽 등 서구 사회에서는 논쟁을 학습의 도구이자 삶의 방식으로 여겨 왔다. 고대 그리스에서 소크라테스와 고르기아스는 격렬한 논쟁을 통해 수사학의 정체성을 탐색했다. 소크라테스는 상대방에게 질문을 던지고 답을 검토하는 ‘산파법’이라는 변증법적 대화로 진리를 탐구했다. 한 사람이 정답을 일방적으로 전달하는 대신 서로 질문하고 반박하면서 생각을 다듬어 나간 것이다. 오랜 역사를 지닌 서구의 정당들도 격렬한 토론을 거쳐 정책을 만들어 왔으며, 공직 후보자가 얼마나 경쟁력을 갖추었는지 가려 왔다. 이처럼 논쟁은 단순히 상대를 이기기 위한 말싸움이 아니라 생각의 타당성을 확인하고 더 나은 결론을 찾아가는 방법이다. 다른 의견이 제기된다는 사실 자체를 불편하게 여기기보다, 그 차이를 검토할 기회로 받아들이는 태도가 중요하다. 사회가 논쟁을 익숙하게 활용할수록 갈등은 피해야 할 문제가 아니라 함께 해결해야 할 과제가 된다. 이러한 역사적 경험은 논쟁의 교육적 가치를 잘 보여 준다.</p>
          <p class="section-title">③ 좋은 논쟁의 핵심은 만남과 부딪침이다</p>
          <p>좋은 논쟁이란 서로의 의견이 실제로 맞부딪치는 ‘상호 부딪침’이 있는 논쟁이다. 그러기 위해서는 논점이 평평하게 만나야 한다. 의견이 갈리는 부분을 정확히 찾아 마치 싸움터에서 장수들이 겨루듯 자신의 논리로 상대방의 논리와 맞서야 한다. 서로 다른 주장을 나란히 늘어놓기만 해서는 진정한 논쟁이 이루어졌다고 보기 어렵다. 논쟁이 생산적일 수 있는 까닭은 바로 이 ‘만남’과 ‘부딪침’에 있다. 서로의 생각이 얼마나 다른지, 어느 부분에서 어떻게 갈리는지는 의견을 직접 견주어 보아야 알 수 있기 때문이다. 그래서 논쟁은 겉으로 보면 싸움처럼 보이지만 실제로는 서로를 이해하는 장이 될 수 있다. 이를 지켜보는 청중에게도 생각할 거리와 배움의 즐거움을 제공한다. 서로의 주장이 부딪치는 지점을 논쟁에서는 ‘접점’이라고 한다. 접점은 서로의 갈등을 해결하기 위해 만나는 개념적 장소라고 할 수 있다. 논쟁을 잘하려면 먼저 이 접점을 찾아 상대와 같은 문제를 놓고 이야기해야 한다. 논점이 어긋난 채 이어지는 말싸움과는 분명히 다르다.</p>
          <p class="section-title">④ 다른 의견을 듣지 않을 때 나타나는 집단 편향</p>
          <p>서로 다른 의견을 가진 사람들이 접점에서 만나지 않으면 어떤 일이 생길까? 다른 사람의 생각을 듣지 않는 사람은 마치 메아리 방에 들어간 것처럼 자기 목소리만 되풀이해서 듣게 된다. 또는 비슷한 생각을 가진 사람들끼리만 모여 서로 동의하면서 기존의 입장을 더욱 굳힐 수 있다. 이런 상황에서는 각 집단의 생각이 한쪽으로 쏠리는 집단 편향이나 집단 극화 현상이 강화된다. 서로 다른 의견을 검토하지 않으니 자신들의 판단이 언제나 옳다고 믿기 쉬워지는 것이다. 이러한 현상은 인터넷 시대에 더욱 심해지고 있다. 원문에서 소개한 연구들에 따르면 사람들은 소수의 여론 주도자에게 일방적으로 끌려가기보다 자신과 생각이 비슷한 사람들에게 동조하며 기존 입장을 강화하는 경향을 보인다. 그 결과 사람들의 의견이 극단적으로 나뉘기도 한다. 같은 의견만 반복해서 접하면 다른 입장을 이해할 기회가 줄어든다. 따라서 의견이 다른 사람과 직접 만나 논쟁하는 일은 생각의 쏠림을 줄이는 중요한 출발점이 된다. 서로의 생각을 확인할 기회가 있어야 편향도 돌아볼 수 있다.</p>
          <p class="section-title">⑤ 찬반 의견을 나열하는 것만으로는 부족하다</p>
          <p>우리 사회에는 서로 다른 의견이 날카롭게 대립하는 문제가 많지만, 그 문제를 두고 치열하게 논쟁하는 모습을 찾아보기는 어렵다. 토론의 자리가 마련되어도 상대방의 주장과 정면으로 맞부딪쳐 조목조목 따지는 논쟁이 제대로 이루어지지 않는 경우가 많다. 겉으로는 찬성과 반대의 의견이 모두 제시되는 것처럼 보이지만, 내용을 살펴보면 찬성하는 사람은 찬성하는 이유만 나열하고 반대하는 사람은 반대하는 이유만 나열하는 수준에 머무르곤 한다. 상대방이 어떤 근거를 들었는지 살펴보거나 그 근거의 문제점을 지적하는 과정은 부족하다. 이렇게 되면 토론에 참여한 사람들은 자신의 입장을 다시 말할 뿐 상대방의 생각을 이해하거나 수정할 기회를 얻지 못한다. 논쟁이란 단순히 두 사람이 번갈아 말하는 일이 아니다. 의견이 갈리는 부분을 찾아 서로의 논리를 검토하고, 상대가 납득할 수 있는 이유를 제시하는 과정이다. 이러한 과정이 빠진 토론은 갈등을 해결하기보다 기존의 대립을 확인하는 데 그치기 쉽다. 상대방의 말에 응답하는 태도가 논쟁의 핵심인 것이다.</p>
          <p class="section-title">⑥ 논쟁이 사라진 사회에서 발생하는 위험</p>
          <p>우리 사회가 토론과 논쟁에 서툴다는 사실은 많은 사람이 알고 있다. 그러나 논쟁이 제대로 이루어지지 않는 사회가 얼마나 큰 부작용을 겪을 수 있는지는 충분히 인식하지 못하는 듯하다. 사상가 존 스튜어트 밀은 사회에서 널리 받아들여지는 의견이나 감정이 횡포를 부릴 수 있다고 경고했다. 특히 다수의 생각과 다른 의견이나 생활 방식을 가진 사람들에게 법률적인 처벌 외의 방식으로 압력을 가해 통설을 따르도록 강요하는 경향을 경계해야 한다고 보았다. 이는 다수의 의견을 모든 사회 구성원에게 강요하고 조금이라도 다른 생각을 제시하면 묵살하는 사회의 위험성을 지적한 것이다. 법으로 금지하지 않더라도 주변의 비난이나 압박 때문에 사람들은 자신의 생각을 말하지 못할 수 있다. 이러한 사회에서는 소수자의 권익을 지키기 어렵고 다수에게 도움이 되는 합리적인 정책도 충분히 검토되기 어렵다. 따라서 반대 의견이 자유롭게 제시되고 검토될 수 있는 논쟁의 문화가 필요하다. 다른 생각을 말할 권리가 보장되어야 사회도 발전할 수 있다.</p>
          <p class="section-title">⑦ 생산적인 논쟁은 상대방의 말을 듣는 데서 시작된다</p>
          <p>모든 소통이 그러하듯 논쟁도 상대방의 입장을 듣는 데서 출발한다. 논쟁에서 중요한 것은 상대방이 무슨 말을 하는지 충분히 이해한 뒤 그 논리에서 허점을 찾아내고, 상대방도 납득할 만한 이유를 제시하는 일이다. 그러려면 어울리기 싫은 사람이라도 생각이 다르다면 대화하고 그들의 입장을 들어야 한다. 자신과 비슷한 의견을 가진 사람들하고만 이야기해서는 자신의 생각이 지닌 약점을 발견하기 어렵다. 미국의 법학자 캐스 선스타인은 ‘나는 네 의견에 동의하지 않는다’고 말하지 않는 사람들은 집단의 의견에 동조하거나 더욱 강화된 자기 의견 속에 안주한다고 지적했다. 그 결과 자기 합리화와 서로를 향한 비방만 남을 수 있다. 이러한 상황을 바꾸려면 반대 의견을 기꺼이 내놓고 논쟁에 참여하는 사람이 필요하다. 서로의 주장을 듣고 반박하는 과정에서 기존의 생각을 다시 살펴볼 수 있기 때문이다. 상대의 말을 듣는 태도는 논쟁을 포기하는 것이 아니라 생산적인 논쟁을 시작하는 조건이다. 자신의 의견을 수정할 가능성도 열어 두어야 한다.</p>

          <p>의견이 양극단으로 갈라진 사회에서는 중간에 있는 사람들의 생각이 제대로 반영되지 못할 수 있다. 서로 다른 집단이 자신들의 주장만 되풀이하고 상대방의 근거를 듣지 않으면 공유되는 정보가 줄어들고 갈등은 더욱 깊어진다. 특히 다수의 분위기와 다른 생각을 가진 사람들은 비난을 피하려고 침묵하기 쉽다. 그러면 실제 사회에 다양한 의견이 존재하더라도 겉으로는 찬성과 반대라는 두 극단만 남은 것처럼 보인다. 이러한 상황에서 내려지는 결정은 중간 의견을 충분히 반영하지 못한 극단적인 결정이 될 위험이 있다. 논쟁이 필요한 까닭은 바로 여기에 있다. 서로 다른 주장을 접점에서 만나게 하고, 상대방의 논리를 검토하며, 미처 알려지지 않은 정보를 함께 나누어야 한다. 그 과정에서 처음에는 대립하던 사람들도 공통으로 받아들일 수 있는 부분을 찾을 수 있다. 논쟁은 갈등을 없었던 일로 만드는 것이 아니라 갈등을 합리적으로 다룰 수 있게 하는 사회적 도구다. 다양한 목소리가 함께 논의될 때 결정의 균형도 찾을 수 있다.</p>

          <p>인간이 함께 살아가는 한 서로 다른 의견과 갈등은 사라지지 않는다. 중요한 것은 갈등을 드러내지 않고 참는 일이 아니라 서로의 생각을 부딪치게 하여 더 나은 해결책을 찾는 일이다. 좋은 논쟁은 상대방의 주장을 듣고 의견이 갈리는 접점을 찾아 자신의 논리로 반박하는 과정에서 이루어진다. 이런 만남이 없다면 사람들은 비슷한 생각을 가진 사람들끼리 모여 자신의 의견만 강화하고, 사회는 양극단으로 갈라지기 쉽다. 반대 의견을 억누르는 분위기에서는 소수자의 목소리가 사라지고 합리적인 정책을 마련하기도 어려워진다. 반면 서로 다른 의견이 자유롭게 제시되는 사회에서는 다양한 정보가 공유되고 중간 의견도 드러날 수 있다. 논쟁은 상대를 무조건 이기거나 굴복시키기 위한 싸움이 아니다. 서로를 이해하고 갈등을 해결하며 사회가 나아갈 방향을 찾기 위한 과정이다. 그렇다면 오늘날 우리 사회는 얼마나 다른 의견에 귀를 기울이고 있는가? 우리는 논쟁을 피하고 있는지, 아니면 논쟁을 통해 함께 발전하고 있는지 돌아보아야 한다.</p>

          <p>눈앞에 먹을 것이 있다고 해서 인간이 언제나 자신의 본성과 감정대로 행동하는 것은 아닙니다. 사흘 동안 굶주린 내 곁에 나보다 더 불쌍한 어린아이나 노인이 있다고 생각해 봅시다. 배고픈 마음은 여전하지만 음식을 어떻게 해야 할지 고민에 빠질 것입니다. 혼자 전부 먹어 버릴 수도 있고, 어린아이나 노인과 나누어 먹을 수도 있으며, 그들에게 모두 주어 버릴 수도 있습니다. 이런 여러 가능성을 놓고 생각하고 선택하는 과정이 바로 려의 작용입니다. 사실 자기 배고픔만 생각한다면 혼자 다 먹거나 주인이 오지 않는 틈에 음식을 먹고 달아나는 편이 본성의 욕구에 충실한 행동일 것입니다. 그러나 사람들은 반드시 그렇게 행동하지 않습니다. 자신의 욕구와 반대되는 행동을 선택하고, 굳센 의지로 배고픔을 억누르며 참아 내기도 합니다. 이렇게 판단한 내용을 실제 행동으로 옮기는 것이 위의 작용입니다. 순자는 이처럼 인간에게 타고난 욕구를 넘어 생각하고 실천하는 능력이 있다는 사실을 중요하게 보았습니다. 착한 행동은 본성에 끌려가는 것이 아니라 의지적으로 선택하는 데서 나타납니다.</p>

          <p class="section-title">③ 오토 뢰비의 개구리 심장 실험과 신경 전달 물질의 발견</p>
          <p>1921년 오토 뢰비 박사는 신경 전달 물질의 존재를 알아내기 위해 개구리 심장 두 개를 이용한 실험을 했다. 먼저 미주 신경이 붙어 있는 개구리 심장과 미주 신경을 제거한 개구리 심장을 준비했다. 그는 두 심장을 각각 링거액에 담근 뒤 액체가 서로 통하도록 연결했다. 이어 첫 번째 심장에 붙어 있는 미주 신경을 자극하자 그 심장의 박동이 느려졌다. 그런데 놀랍게도 미주 신경이 제거된 두 번째 심장의 박동까지 느려졌다. 신경이 직접 연결되지 않은 두 번째 심장에 어떻게 변화가 나타난 것일까? 뢰비는 첫 번째 심장의 미주 신경 말단에서 어떤 물질이 방출되었고, 그 물질이 링거액을 따라 이동하여 두 번째 심장에도 영향을 주었다고 판단했다. 이는 신경의 작용이 화학 물질을 통해 전달될 수 있음을 보여 주는 결정적인 증거였다. 뢰비는 이 물질을 ‘미주 신경 물질’이라고 불렀다. 나중에 그 정체가 아세틸콜린이라는 사실이 밝혀졌으며, 뢰비는 이 연구의 공로로 1936년 노벨 생리·의학상을 받았다.</p>
          <p class="section-title">④ 신경 전달 물질이 시냅스 틈을 건너는 과정</p>
          <p>신경 전달 물질은 평소 신경 섬유의 말단에 있는 작은 주머니, 즉 시냅스 소포에 저장되어 있다. 신경 세포 안에서 전기적 신호가 신경 섬유막을 따라 말단까지 전달되면 소포가 세포막과 융합하면서 안에 있던 신경 전달 물질을 밖으로 내보낸다. 이렇게 방출된 물질은 신경 세포와 다음 신경 세포 사이의 아주 좁은 공간인 ‘시냅스 틈’을 지나간다. 원문에서는 이 간격을 약 2만분의 1밀리미터라고 설명한다. 신경 전달 물질이 다음 신경 세포의 막에 도달하면 그곳에 있는 특별한 구조와 결합한다. 이 구조를 ‘수용체’라고 하며, 정보를 받아들이는 역할을 하는 단백질로 이루어져 있다. 신경 세포끼리 서로 붙어 있지 않아도 정보가 이어지는 까닭은 바로 이러한 과정 때문이다. 전기적 신호가 화학적 신호로 바뀌어 틈을 건너고, 다시 다음 세포의 반응을 일으키는 것이다. 우리가 무언가를 보고 느끼고 움직이는 동안에도 신경 세포 사이에서는 이와 같은 전달 과정이 끊임없이 일어난다. 이처럼 작은 틈을 사이에 두고 신호가 이어지는 연결 부위를 시냅스라고 부른다.</p>
          <p class="section-title">⑤ 열쇠와 열쇠 구멍으로 이해하는 신경 전달의 원리</p>
          <p>신경 전달 물질과 수용체의 관계는 열쇠와 열쇠 구멍에 비유할 수 있다. 신경 전달 물질이 열쇠라면, 이를 받아들이는 수용체는 열쇠 구멍에 해당한다. 알맞은 열쇠가 열쇠 구멍에 들어가야 문이 열리듯, 특정 신경 전달 물질이 자신과 결합할 수 있는 수용체에 붙어야 다음 신경 세포에 영향을 줄 수 있다. 모든 신경 전달 물질이 모든 수용체와 결합하는 것은 아니다. 물질마다 결합할 수 있는 수용체의 종류가 다르고, 그 결과 나타나는 세포의 반응도 달라진다. 이렇게 화학 분자와 단백질 분자가 서로 맞물리면서 신경 정보가 전달된다. 그 과정은 단순한 움직임뿐 아니라 감각, 감정, 사고와 같은 복잡한 정신 활동에도 관여한다. 다만 하나의 물질이 하나의 감정이나 행동을 단독으로 결정하는 것은 아니다. 여러 신경 세포와 전달 물질, 수용체가 함께 작용하여 복잡한 반응을 만들어 낸다. 열쇠와 열쇠 구멍의 비유는 이 정교한 정보 전달의 첫 단계를 이해하는 데 도움을 준다. 그래서 수용체의 종류를 이해하는 일은 신경 전달 물질 자체를 연구하는 일만큼 중요하다.</p>
          <p class="section-title">⑥ 신경 세포의 전기 신호를 조절하는 이온 통로</p>
          <p>신경 전달 물질이 수용체와 결합하면 신경 세포막에서 전기를 띤 입자들이 이동할 수 있는 길이 열리기도 한다. 이 길을 ‘이온 통로’라고 한다. 이온이란 원자나 분자가 전기를 띠게 된 것으로, 양의 전기를 띠면 양이온, 음의 전기를 띠면 음이온이라고 부른다. 이온 통로가 열리는 방식에는 수용체 자체가 통로 역할을 하는 경우와 수용체의 작용으로 다른 통로가 활성화되는 경우가 있다. 통로가 열리면 나트륨 이온이나 칼슘 이온 같은 양이온, 염화 이온 같은 음이온이 세포막을 가로질러 이동할 수 있다. 이때 어떤 이온이 어느 방향으로 움직이는지에 따라 신경 세포의 전기적 상태가 달라진다. 결국 신경 전달 물질은 수용체와 결합하여 이온의 흐름을 조절하고, 그 결과 다음 신경 세포가 반응하도록 만든다. 눈에 보이지 않는 작은 분자들의 이동이 우리 몸의 정보 전달에 중요한 역할을 하는 셈이다. 이러한 과정은 신경 세포의 흥분과 억제를 이해하는 데 꼭 필요하다. 세포막의 전기적 상태가 바뀌면 신경 신호가 만들어지거나 다음 신호의 발생 가능성이 달라진다.</p>
          <p class="section-title">⑦ 신경 세포를 흥분시키거나 억제하는 화학 물질</p>
          <p>신경 세포의 안쪽은 평소 바깥쪽에 비해 상대적으로 음전하를 띤다. 이때 나트륨 이온이나 칼슘 이온 같은 양이온이 세포 안으로 들어오면 막 안팎의 전압 차이가 줄어들어 신경 세포가 흥분하기 쉬운 상태가 될 수 있다. 반대로 염화 이온과 같은 음이온의 이동은 조건에 따라 신경 세포의 흥분을 억제하는 데 관여한다. 이처럼 신경 전달 물질은 신경 세포의 활동을 촉진하거나 억제하는 역할을 한다. 흥분성 전달에 대표적으로 관여하는 물질은 글루탐산이고, 억제성 전달에 대표적으로 관여하는 물질은 감마 아미노뷰티르산, 즉 가바(GABA)이다. 신경 세포가 무조건 많이 흥분한다고 좋은 것은 아니다. 필요한 신호는 전달되고 불필요한 흥분은 억제되어야 뇌의 활동이 조화롭게 이루어진다. 신경 전달 물질을 신경에 전기를 흐르게 하거나 멈추게 하는 여닫개에 비유할 수 있는 것도 이 때문이다. 그러나 실제 작용은 단순한 스위치보다 훨씬 복잡하다. 흥분과 억제의 균형은 뇌가 정보를 정확하게 처리하기 위한 중요한 조건이다. 어느 한쪽만으로는 정상적인 기능을 유지하기 어렵다.</p>
          <p class="section-title">⑧ 신경 전달 물질과 수용체가 함께 작동해야 하는 이유</p>
          <p>신경 전달 물질이 적절한 양으로 방출되더라도 그것과 결합하는 수용체가 제대로 작동하지 않으면 정보는 효율적으로 전달되지 못한다. 따라서 신경 전달 물질만으로는 온전한 여닫개 역할을 할 수 없다. 신경 전달 물질과 수용체가 함께 작용해야 비로소 다음 신경 세포에 알맞은 반응이 나타난다. 더구나 뇌에는 다양한 신경 전달 물질이 있고, 각 물질에 반응하는 수용체의 종류도 여러 가지다. 하나의 물질이 결합하는 수용체가 달라지면 세포에 나타나는 효과도 달라질 수 있다. 그러므로 신경 전달 과정을 하나의 단순한 전기 스위치로만 이해해서는 안 된다. 신경 세포는 여러 종류의 신호를 받아들이고 그 영향을 종합하여 다음 반응을 결정한다. 이처럼 신경 전달 물질과 수용체의 정교한 협력은 뇌가 복잡한 정보를 처리하는 바탕이 된다. 어느 한쪽에 문제가 생기면 정보 전달의 균형이 흔들릴 수 있으며, 이는 뇌의 기능에도 영향을 미칠 수 있다. 신경 전달의 결과는 전달 물질의 종류뿐 아니라 수용체의 성질과 신경 세포의 상태에 따라서도 달라진다.</p>
          <p class="section-title">⑨ 신경 전달 물질과 수용체가 유지하는 뇌의 항상성</p>
          <p>뇌에는 신경 전달 물질과 수용체의 작용을 일정하게 유지하려는 조절 능력이 있다. 원문에서는 방출되는 신경 전달 물질의 양이 줄어들면 수용체의 수가 증가하고, 반대로 전달 물질이 지나치게 많아지면 수용체의 수가 줄어들 수 있다고 설명한다. 이는 신경 세포가 신호의 변화에 맞추어 민감도를 조절하는 현상의 한 예다. 마치 여닫개에 자동 수리 기능이 달린 것처럼 신경 전달의 균형을 유지하려는 것이다. 물론 모든 전달 물질과 수용체가 언제나 똑같은 방식으로 변하는 것은 아니지만, 이러한 조절은 뇌의 기능을 비교적 안정적으로 유지하는 데 도움이 된다. 생물체가 내부 상태를 일정한 범위 안에서 유지하려는 성질을 ‘항상성’이라고 한다. 뇌 역시 신경 전달 물질의 분비와 수용체의 반응을 조절하며 항상성을 유지하려 한다. 이 균형이 크게 흔들리면 여러 신경계 질환이나 정신 질환과 관련된 문제가 나타날 수 있다. 따라서 뇌를 이해하려면 전달 물질의 양뿐 아니라 수용체와 조절 과정도 함께 살펴야 한다. 이러한 변화는 뇌가 끊임없이 변하는 환경 속에서도 기능을 조절하려는 모습을 보여 준다.</p>
          <p class="section-title">⑩ 인간의 정신세계를 밝히는 신경 과학의 미래</p>
          <p>신경 전달 물질은 인간의 사고와 감정, 행동을 이해하는 데 중요한 열쇠다. 우리가 보고 듣고 움직이며 기억하고 판단하는 과정에는 수많은 신경 세포의 정보 교환이 관여한다. 이런 점에서 신경 전달 물질은 인간의 정신 활동과 문화적 행동을 가능하게 하는 생물학적 바탕의 일부라고 할 수 있다. 역사적으로 중요한 사건을 일으킨 사람들의 생각과 행동을 이해할 때에도 뇌의 작용에 관한 연구는 의미가 있다. 다만 복잡한 사상이나 행동을 신경 전달 물질의 차이만으로 모두 설명할 수는 없다. 개인의 경험과 환경, 사회적 관계도 함께 고려해야 하기 때문이다. 과학자들은 고도의 정신 기능과 감정, 운동, 감각을 위해 어떤 전달 물질과 수용체가 어떻게 작용하는지 계속 연구하고 있다. 아직 모든 작용이 밝혀진 것은 아니며 앞으로 새로운 물질과 기능이 더 발견될 가능성도 있다. 신경 전달 물질과 수용체의 체계를 이해하는 일은 결국 인간의 뇌와 정신세계를 더 깊이 알아가는 길이다. 작은 분자들의 움직임을 연구하는 일이 인간의 복잡한 정신 활동을 이해하는 데 이어지는 것이다.</p>

        content: `
          <p class="section-title">① 태평양 한가운데에서 발견된 거대한 쓰레기 섬</p>
          <p>대양을 횡단하는 요트 경기를 마치고 캘리포니아로 돌아가던 찰스 무어는 북태평양 아열대 환류대를 통과하고 있었다. 그때 바다 저 멀리 흐릿한 섬처럼 보이는 것이 나타났다. 지도를 펼쳐 보았지만 그곳은 섬이 있을 만한 위치가 아니었다. 하와이에서도, 미국 서부 연안에서도 멀리 떨어진 태평양 한가운데였기 때문이다. 그런데 가까이 다가가자 그가 발견한 것은 땅으로 이루어진 섬이 아니라 거대한 쓰레기 더미였다. 무어는 훗날 수필에서 가장 원시적일 것이라 생각했던 바다에서 플라스틱으로 뒤덮인 광경을 보고 자신의 눈을 의심했다고 회상했다. 그는 일주일 동안 아열대 바다를 건너며 수많은 페트병과 뚜껑, 포장재 조각 사이를 지나갔다. 고무 타이어와 자동차 계기판, 버려진 욕조까지 눈에 띄었다. 사람의 손길이 닿지 않았을 것 같은 외딴 바다에도 인간이 버린 물건들이 모여 있었던 것이다. 이 거대한 쓰레기 집적 지역은 훗날 ‘태평양 쓰레기 섬’이라는 이름으로 알려졌다. 그러나 실제 육지처럼 단단한 섬이 아니라 해류에 따라 쓰레기가 넓게 모인 해역이라는 점도 기억해야 한다.</p>
          <p class="section-title">② 해류를 따라 쓰레기가 모이는 북태평양 환류대</p>
          <p>태평양 쓰레기 섬이 나타나는 곳은 북태평양 환류대 주변이다. 이곳에서는 바람과 해류의 영향으로 바닷물이 아시아와 북아메리카 사이를 크게 시계 방향으로 순환한다. 육지에서 버려진 플라스틱과 각종 쓰레기는 해류를 타고 바다를 떠돌다가 환류의 안쪽으로 모여들기 시작한다. 한 번 모인 쓰레기는 쉽게 빠져나가지 못하고 오랫동안 머물면서 점점 쌓인다. 이렇게 수많은 쓰레기가 모인 지역을 사람들은 거대한 쓰레기 섬이라고 부르게 되었다. 예부터 뱃사람들은 이 주변의 바람이 약한 해역을 무풍지대라 여기며 피하곤 했다. 원문에서는 참치와 고래, 상어도 이곳을 꺼렸으며, 다른 생태계와의 교류가 적어 ‘태평양의 사막’이라고 불렸다고 설명한다. 그런데 사람들이 쉽게 찾아가지 않던 외딴 바다에 오히려 육지에서 흘러온 쓰레기가 쌓여 있었던 것이다. 쓰레기를 버린 장소와 쓰레기가 모이는 장소가 반드시 같지는 않다는 사실을 보여 준다. 우리가 육지에서 버린 작은 플라스틱 하나도 해류를 따라 멀리 이동해 바다 한가운데에 남을 수 있다.</p>
          <p class="section-title">③ 육지에서 발생한 쓰레기가 바다로 향하는 과정</p>
          <p>쓰레기를 처리할 때에는 흔히 ‘육지의 쓰레기는 육지로, 바다의 쓰레기는 바다로’라는 원칙이 언급된다. 원문에서는 우리나라 역시 이러한 원칙을 적용하여 수산물 가공 공장에서 나오는 생선 기름과 생선 찌꺼기, 수산물 시장에서 나오는 조개껍데기와 폐수 등을 바다에 버릴 수 있었다고 설명한다. 하지만 실제로는 바다에서 나온 것만 해양에 버려진 것이 아니었다. 소나 돼지를 기르는 축사에서 발생하는 가축 분뇨와 일반 가정에서 나오는 음식물 쓰레기도 과거에는 바다에 버려졌다. 가축 분뇨는 2012년까지, 음식물 쓰레기 관련 폐기물은 그 이후까지 해양 배출 문제가 이어졌다. 우리가 남은 음식을 음식물 쓰레기통에 버리면 지방 자치 단체의 수거 차량이 이를 음식물 자원화 시설로 옮긴다. 시설에서는 음식물을 가축의 사료나 농경지의 퇴비로 바꾸려 한다. 그러나 모두 자원화되는 것은 아니어서 처리하고 남은 찌꺼기가 생긴다. 과거에는 이러한 잔여 폐기물을 운반선에 실어 바다로 보내기도 했다. 육지에서 발생한 쓰레기의 처리 부담을 바다에 떠넘긴 셈이다.</p>
          <p class="section-title">④ 우리나라 바다에 지정되었던 세 곳의 쓰레기장</p>
          <p>그렇다면 폐기물 운반선은 바다 아무 곳에나 쓰레기를 버렸을까? 그렇지는 않았다. 원문에 따르면 정부는 1993년부터 동해와 서해의 연안에서 떨어진 세 구역을 해양 폐기물 배출 구역으로 지정해 운영했다. 이곳은 ‘서해 병’, ‘동해 병’, ‘동해 정’으로 불렸다. 서해 병 구역은 군산에서 서쪽으로 약 200킬로미터 떨어진 곳으로 수심이 약 80미터였다. 동해 병 구역은 포항에서 동쪽으로 약 125킬로미터 떨어졌으며 수심은 200미터에서 2,000미터에 이르렀다. 동해 정 구역은 울산에서 남동쪽으로 약 63킬로미터 떨어져 있었고 수심은 약 150미터였다. 당시 동해 병 구역은 전체 해양 배출 폐기물의 약 60퍼센트를 담당하는 가장 큰 배출 구역이었다. 서해 병과 동해 정 구역의 비율은 각각 약 27퍼센트와 13퍼센트로 소개되었다. 이렇게 특정 구역에 폐기물을 모아 버리는 방식은 처리하기 편리해 보일 수 있다. 그러나 그만큼 오염 물질이 바다의 일정한 지역에 집중될 위험도 있었다. 바다의 깊은 곳이라고 해서 오염의 피해를 피할 수 있는 것은 아니었다.</p>
          <p class="section-title">⑤ 바다에 쓰레기를 버리는 손쉬운 방법을 택한 이유</p>
          <p>바다에 버려지는 폐기물이 많아진 데에는 육지에서 쓰레기를 처리하기 어려웠던 현실이 있었다. 음식물 쓰레기의 육상 매립이 금지되자 음식물 자원화 시설에서는 가능한 한 많은 양을 사료나 퇴비로 만들어야 했다. 그러나 원문에서는 당시 기술 부족 등의 이유로 모든 폐기물을 재활용하지 못했고, 남은 찌꺼기들이 바다로 향했다고 설명한다. 축사에서 나오는 가축 분뇨도 마찬가지였다. 분뇨를 깨끗하게 처리하려면 정화 시설이 필요했지만 이러한 시설을 충분히 짓지 못했다. 결국 새로운 기술을 개발하거나 처리 시설에 투자하는 대신 바다에 버리는 쉬운 방법을 택한 것이다. 육지에서 보이지 않게 되었다고 해서 쓰레기가 사라지는 것은 아니다. 배에 실려 먼바다로 옮겨졌을 뿐 오염 물질은 여전히 지구의 환경 안에 남아 있다. 바다는 무한히 많은 쓰레기를 받아들일 수 있는 공간이 아니다. 편리한 처리 방법만 찾다가 해양 생태계에 더 큰 부담을 떠넘겼다는 점에서 우리 모두의 책임을 돌아볼 필요가 있다. 결국 당장의 편리함이 미래의 환경 문제를 키운 셈이다.</p>
          <p class="section-title">⑥ 런던 의정서와 우리나라 해양 투기 중단의 시작</p>
          <p>그러나 바다에 폐기물을 버리던 방식에도 변화가 찾아왔다. 국제 사회가 해양 오염을 막기 위한 규범을 강화하면서 우리나라 역시 런던 의정서에 따라 해양 투기를 줄이고 중단해야 하는 상황에 놓였다. 원문에 따르면 우리나라는 2012년부터 가축 분뇨의 해양 배출을 중단하겠다고 약속했다. 이어 2013년부터는 음식물 쓰레기 관련 폐기물도 육상에서 처리하겠다고 밝혔다. 이에 따라 과거 바다로 보내던 폐기물을 육지에서 처리하기 위한 시설과 기술을 마련해야 했다. 원문은 당시 정부가 막대한 양의 폐기물을 육상에서 처리하기 위해 여러 대책을 추진했다고 설명한다. 다만 해양 투기는 폐기물의 종류별로 단계적으로 금지되었으므로, 2013년에 모든 종류의 해양 투기가 한꺼번에 전면 금지된 것은 아니다. 중요한 변화는 처리하기 어려운 쓰레기를 바다에 떠넘기던 방식에서 벗어나려 했다는 점이다. 쓰레기가 발생하는 곳에서부터 양을 줄이고 재활용과 정화 시설을 늘리는 일이 필요해졌다. 바다를 보호하려면 육지의 폐기물 처리 방식부터 바뀌어야 한다.</p>
          <p class="section-title">⑦ 오염된 바다가 인간의 건강까지 위협하는 이유</p>
          <p>바다가 오염되면 그 피해는 바닷속 생물에게만 머무르지 않는다. 해양 생태계의 건강이 나빠지고, 생선과 해초 등 바다에서 얻는 식품을 먹는 인간의 건강도 위협받을 수 있다. 특히 납이나 카드뮴 같은 중금속은 생물의 몸속에 축적될 수 있어 주의가 필요하다. 오염된 바다에 사는 생물을 먹이로 삼는 다른 생물에게도 오염 물질이 전달될 수 있기 때문이다. 결국 인간이 바다에 버린 오염 물질이 먹이 관계를 거쳐 다시 인간에게 돌아올 가능성이 있는 것이다. 원문에서는 정부가 2006년부터 일부 해양 배출 구역에 휴식년제를 적용해 폐기물 배출을 금지했다고 설명한다. 오염된 해역에 회복할 시간을 주기 위한 조치였다. 휴식년제 이후 일부 오염 물질의 농도가 줄어들기는 했지만, 당시 조사에서는 납과 카드뮴 등의 농도가 미국 해양 대기 관리처의 기준을 초과한 곳도 있었다고 한다. 쓰레기를 더 이상 버리지 않는다고 해서 이미 쌓인 오염이 곧바로 사라지는 것은 아니다. 바다를 회복시키려면 오염을 막는 노력과 지속적인 관찰이 함께 필요하다.</p>
          <p class="section-title">⑧ 지구의 자정 능력에도 한계가 존재한다</p>
          <p>지구에는 오염 물질을 분해하거나 희석하는 자연적인 자정 능력이 있다. 바다에 떠다니는 플라스틱은 오랜 시간 파도에 부딪히고 햇빛의 자외선에 노출되면서 조금씩 부서진다. 음식물 쓰레기 등에서 나온 오염 물질도 해류를 따라 퍼지면 특정 지역에서 측정되는 농도가 낮아질 수 있다. 그러나 여기서 주의해야 할 점이 있다. 플라스틱이 작은 조각으로 부서진다고 해서 완전히 없어지는 것은 아니다. 오히려 잘 보이지 않는 미세 플라스틱이 되어 바다에 오래 남을 수 있다. 오염 물질이 넓게 퍼지는 현상 역시 오염 자체가 사라졌다는 뜻은 아니다. 다른 지역으로 이동하거나 더 넓은 범위에 영향을 줄 수도 있기 때문이다. 따라서 자연의 자정 능력을 믿고 계속 쓰레기를 버려도 된다고 생각해서는 안 된다. 오염이 자연이 감당할 수 있는 수준을 넘어서면 생태계가 회복하는 데 훨씬 긴 시간이 필요할 수 있다. 자연이 스스로 회복할 수 있도록 돕는 가장 확실한 방법은 처음부터 오염 물질이 바다에 들어가지 않게 하는 것이다.</p>
          <p class="section-title">⑨ 쓰레기는 사라지지 않고 다른 곳으로 이동한다</p>
          <p>태평양 쓰레기 섬과 우리나라의 해양 폐기물 배출 문제는 서로 다른 장소에서 일어났지만 공통된 사실을 알려 준다. 인간이 버린 쓰레기는 눈앞에서 사라져도 지구에서 없어지지 않는다는 것이다. 육지에서 흘러간 플라스틱은 해류를 따라 태평양 한가운데에 모이고, 육지에서 처리하지 못한 폐기물은 과거 특정 해역에 쌓였다. 두 경우 모두 쓰레기를 버리는 사람과 그 피해를 받는 장소가 멀리 떨어져 있다는 특징이 있다. 그래서 우리는 일상에서 버린 물건이 바다에 어떤 영향을 주는지 쉽게 실감하지 못한다. 하지만 바다 생태계가 오염되면 그 영향은 결국 인간에게도 돌아올 수 있다. 생선과 해초를 먹는 우리의 건강이 위협받을 수 있고, 바다에 의존해 살아가는 사람들의 생활도 어려워질 수 있다. 쓰레기 문제를 해결하려면 버리는 장소를 바꾸는 것만으로는 부족하다. 쓰레기 발생량을 줄이고, 재사용과 재활용을 늘리며, 안전하게 처리하는 방법을 함께 마련해야 한다. 바다의 문제는 결국 육지에서 살아가는 우리 모두의 문제다.</p>
          <p class="section-title">⑩ 지구가 기다려 주지 않는 이유와 우리의 책임</p>

          <p class="section-title">⑨ 자연의 리듬을 아는 인간</p>

          <p>지금 인류에게 정말로 필요한 것은 ‘자연을 살피는 마음’이다. ‘시간은 돈’이라며 쉼 없이 째깍거리는 시계는 우리 마음을 자꾸만 조급하게 몰아세운다. 조금이라도 더 빨리, 조금이라도 더 많이 거두려는 생각은 자연의 느긋한 리듬을 어느새 잊게 만든다. 그러나 우리는 이따금 멈추어 서서 쫓기는 마음을 가라앉힐 필요가 있다. 그리고 자연의 리듬을 고스란히 담고 있는 달력의 의미를 곰곰이 되새겨 보아야 한다. 달력을 무엇보다 소중히 여긴 조상들의 삶 속에는 계절의 변화를 읽어 내고 자연의 흐름에 몸을 맞추려는 겸손한 마음이 깃들어 있었다. 시계가 가리키는 시간에 끝없이 쫓기기보다, 자연과 보조를 맞추며 조화롭게 살아가는 오랜 지혜를 이제라도 되찾아야 한다. 그것이야말로 인간과 자연이 서로를 해치지 않고 오래도록 함께 살아갈 수 있는 길이기 때문이다. 달력이 일러 주던 삶의 속도를 돌아보는 일이 그 출발점이 될 것이다. 빠름만을 좇는 삶에서 한 걸음 물러나, 자연이 내어 주는 속도에 다시 귀 기울이는 지혜가 필요한 때이다.</p>

          <p>세포 생물학자들은 현대 사회에서 사람들이 겪는 건강 문제의 대부분이 몸속 수분이 부족한 탓이라고 말한다. 그런데 흥미로운 점은, 그들이 체내 수분이 부족한 까닭을 단순히 물을 적게 마시기 때문이라고 보지 않는다는 것이다. 오히려 그 진짜 원인은 음식을 너무 짜게 먹는 데 있다고 주장한다. 쉽게 말해 소금이 우리 몸속에서 수분을 슬그머니 빼앗아 가는 ‘물 도둑’ 노릇을 한다는 것이다. 사람들은 흔히 목이 마르면 물을 마시면 된다고 가볍게 생각하지만, 그에 앞서 평소 음식을 얼마나 짜게 먹고 있는지를 돌아볼 필요가 있다. 소금을 과하게 섭취하면 아무리 물을 많이 마셔도 몸속의 수분 균형이 쉽게 흐트러질 수 있기 때문이다. 따라서 건강을 지키려면 물을 충분히 마시는 것만으로는 부족하며, 날마다 먹는 음식 속에 소금이 얼마나 들어 있는지에도 꾸준히 관심을 기울여야 한다. 보이지 않는 물 도둑을 경계하는 일, 그것이 건강 관리의 출발점인 셈이다. 짜게 먹으면서 물만 많이 마신다고 해서 몸속 수분 부족이 저절로 해결되지는 않는다.</p>
          <p class="section-title">④ 소금이 수분을 끌어당기는 원리</p>
          <p>우리가 먹은 소금은 몸속에 들어가면 나트륨 이온과 염화 이온으로 나뉘는데, 이 이온들은 물과 아주 쉽게 결합하는 성질을 지니고 있다. 소금이 물을 자석처럼 끌어당기기 때문이다. 원문에서는 바로 이러한 성질을 두고 소금이 세포로부터 수분을 빼앗아 간다고 설명한다. 소금과 물의 이러한 관계는 멀리서 찾을 것 없이 우리 주변의 부엌에서도 어렵지 않게 확인할 수 있다. 예를 들어 싱싱한 고기나 생선을 소금에 절여 두면, 얼마 지나지 않아 그 안에 머금고 있던 수분이 겉으로 주르륵 빠져나오는 모습을 직접 볼 수 있다. 배추를 소금에 절이면 빳빳하던 숨이 죽어 흐물흐물해지는 것도 꼭 같은 까닭이다. 이 모두가 소금이 수분을 강하게 끌어당기는 성질을 이용한 결과이다. 이처럼 소금은 그저 음식의 맛을 짜게 만드는 단순한 물질이 아니라 물과 매우 밀접한 관계를 맺고 있으며, 우리 몸속에서도 수분이 어디로 이동하고 어떻게 균형을 이루는지에 깊이 관여한다. 소금을 제대로 이해하려면 먼저 물을 끌어당기는 이 성질부터 알아야 하는 셈이다.</p>
          <p class="section-title">⑤ 소금에 절인 음식이 오래 보관되는 이유</p>
          <p>소금에 절인 육류나 생선을 오랫동안 상하지 않게 보관할 수 있는 까닭 역시 소금이 수분을 끌어당기는 바로 그 성질 덕분이다. 음식을 썩게 만드는 부패균은 수분이 넉넉한 환경에서 쑥쑥 잘 자라는데, 소금이 식품 속에 든 수분을 빨아들여 줄여 버리면 부패균이 번식할 터전을 잃어 제대로 자라지 못하게 된다. 그래서 냉장고가 없던 먼 옛날부터 사람들은 귀한 고기나 생선을 오래 두고 먹기 위해 소금에 절이는 지혜로운 방법을 꾸준히 사용해 왔다. 젓갈이나 소금에 절인 생선, 햄 같은 음식이 모두 이러한 원리로 만들어진 것이다. 소금이 식품의 부패를 늦추어 저장 기간을 늘려 주는 고마운 역할을 하는 셈이다. 하지만 음식을 보존하는 데 이토록 유용한 소금도, 입으로 지나치게 많이 섭취하면 도리어 건강에 좋지 않은 영향을 줄 수 있다. 따라서 소금이 지닌 이로운 성질과 과다 섭취로 생길 수 있는 해로움을 함께 균형 있게 이해하는 것이 무엇보다 중요하다. 같은 소금이라도 식품을 지킬 때와 몸속에 들어왔을 때의 역할이 사뭇 다른 것이다.</p>
          <p class="section-title">⑥ 어린아이들에게 더욱 심각한 소금 과다 섭취</p>
          <p>요즈음에는 아직 초등학교에도 입학하지 않은 어린아이들마저 부모와 똑같은, 심지어 그보다 더 많은 양의 소금을 섭취하고 있다고 한다. 이는 결코 가볍게 넘길 수 없는 대단히 심각한 문제이다. 아이들은 어른들에 비해 몸집이 훨씬 작고 몸속을 도는 혈액량도 적기 때문에, 설령 똑같은 양의 소금을 섭취하더라도 그 몸에 미치는 부담은 상대적으로 훨씬 클 수밖에 없다. 게다가 어린아이들은 한창 몸이 자라나는 성장 과정에 있으므로, 평소 어떤 음식을 얼마나 먹고 있는지를 어른이 더욱 세심하게 살펴 주어야 한다. 특히 어른들이 먹는 짭짤한 음식을 간을 줄이지도 않은 채 아이들에게 그대로 먹이는 습관은 각별히 주의할 필요가 있다. 아이의 여린 입맛에는 어른의 음식이 지나치게 짤 수 있기 때문이다. 아이들의 건강을 올바르게 지키려면 어릴 때부터 음식 속에 든 소금의 양을 꼼꼼히 살피고, 혀가 지나치게 짠맛에 길들지 않도록 어른이 먼저 신경 써 주어야 한다. 어릴 때 길든 입맛이 평생의 건강을 좌우할 수 있기 때문이다.</p>
          <p class="section-title">⑦ 점점 더 짠맛을 찾게 되는 아이들</p>
          <p>이뿐만이 아니다. 어릴 때부터 소금을 많이 먹는 습관이 들면 혀가 점점 짠맛에 익숙해져, 시간이 갈수록 더 짜고 더 자극적인 맛을 끊임없이 찾게 된다. 처음에는 적당히 간이 맞다고 느꼈던 음식도 얼마 지나면 어쩐지 밍밍하고 싱겁게만 느껴지기 시작한다. 그러면 자연히 예전보다 소금을 더 많이 넣은, 한층 더 짠 음식을 찾아 손이 가게 되는 것이다. 짠맛은 뇌의 쾌감 중추를 자극해 음식을 먹을 때 기분 좋은 즐거움을 느끼게 하는데, 바로 이 점이 문제를 더 키운다. 이러한 자극적인 맛에 혀와 뇌가 지나치게 길들면, 담백하고 슴슴한 음식은 점점 멀리하고 강하고 짠 음식만을 유난히 좋아하게 될 수 있기 때문이다. 한번 굳어진 입맛은 쉽게 되돌리기 어렵다. 따라서 어린 시절부터 짠 음식을 자주 먹는 습관은 당장의 건강뿐 아니라 어른이 된 뒤의 식생활에까지 두고두고 영향을 미칠 수 있으므로 각별히 주의해야 한다. 어른이 되어 입맛을 바로잡으려 애써도 어릴 적 깊이 밴 습관을 이겨 내기란 결코 쉬운 일이 아니다.</p>
          <p class="section-title">⑧ 짠 음식과 과식, 비만의 관계</p>
          <p>만약 이렇게 소금을 계속해서 과하게 섭취한다면, 아이들은 짜고 자극적인 맛에서 얻는 즐거움을 놓치지 않으려고 배가 그다지 고프지 않은데도 자꾸만 음식에 손을 대게 된다. 원문에서는 이러한 상태가 점점 심해지면 마치 몸이 맛에 지배당하는 ‘음식 중독’과 같은 문제로까지 이어질 수 있다고 설명한다. 배가 이미 충분히 부른데도 맛있는 음식을 자꾸 찾아 입에 넣는 습관은 자연스럽게 과식으로 이어지기 마련이다. 더구나 짠 음식과 더불어 열량이 높은 기름진 음식까지 자주 곁들여 먹는다면, 몸에 쌓이는 열량이 늘어 체중이 불어날 가능성도 그만큼 커진다. 결국 잘못된 식습관이 꼬리에 꼬리를 물고 반복되면서, 끝내는 폭식이나 비만 같은 건강 문제를 겪게 될 수 있는 것이다. 그러므로 아이들이 어릴 때부터 짠맛에 지나치게 익숙해지지 않도록 평소의 식습관을 세심하게 살피고 바로잡아 주는 일이 무엇보다 중요하다. 짠맛이 주는 잠깐의 즐거움이 과식과 비만이라는 훨씬 더 큰 대가가 되어 돌아올 수 있음을 늘 기억해야 한다.</p>
          <p class="section-title">⑨ 짜게 먹을수록 음료를 많이 마시는 이유</p>
          <p>안타깝게도 문제는 여기서 그치지 않는다. 영국의 한 대학 연구팀이 네 살부터 열여덟 살까지의 아동 및 청소년 1,688명을 일주일 동안 꼼꼼히 관찰한 결과, 음식을 짜게 먹는 아이일수록 음료를 더 많이 마신다는 뚜렷한 사실을 발견했다. 소금을 많이 섭취하면 몸속의 수분 균형이 흐트러지면서 평소보다 쉽게 갈증을 느끼게 되기 때문이다. 그런데 문제는, 대부분의 아이들이 그 갈증을 달래기 위해 맹물보다는 달콤한 맛이 강한 탄산음료 쪽으로 손을 뻗는다는 데 있다. 이렇게 짭짤한 음식을 먹고 나서 단 음료를 벌컥벌컥 마시는 습관이 날마다 되풀이되면, 소금뿐 아니라 당분까지 지나치게 많이 섭취하게 된다. 결국 소금을 많이 먹는 하나의 나쁜 습관이 단 음료를 자주 마시는 또 다른 나쁜 습관으로 꼬리를 물고 이어지면서, 알게 모르게 아이들의 건강에 이중으로 부담을 지우게 되는 것이다. 짜게 먹는 작은 습관 하나가 당분 과다 섭취라는 전혀 다른 문제까지 불러오는 셈이다. 식습관은 이렇게 서로 얽혀 영향을 주고받는다.</p>
          <p class="section-title">⑩ 아이들의 건강을 지키는 올바른 식습관</p>
          <p>그래서 어떤 부모들은 아이들의 건강을 지켜 주기 위해 음식을 요리할 때 일부러 소금을 적게 넣기도 하고, 소금 함량을 줄인 저염식 음식을 부지런히 찾아 먹이기도 한다. 하지만 건강을 위협하는 소금은 집에서 만든 음식에만 들어 있는 것이 아니다. 간편하게 사 먹을 수 있는 즉석식품이나 통조림, 소시지와 같은 가공식품에도 소금이 놀랄 만큼 많이 들어 있기 때문에, 먹거리를 고를 때에는 언제나 각별히 주의를 기울여야 한다. 집에서 만든 음식의 간을 조금 싱겁게 하는 것만으로는 충분하지 않을 수 있다는 뜻이다. 그러므로 아이들이 평소 어떤 간식과 군것질거리를 즐겨 먹는지도 함께 눈여겨보아야 한다. 또한 식품을 살 때 포장지의 영양정보에 표시된 나트륨 함량을 꼼꼼히 확인하는 습관을 들이는 것도 큰 도움이 된다. 아이들의 건강을 지키는 가장 확실한 첫걸음은, 바로 소금을 지나치게 많이 먹지 않는 올바른 식습관을 어릴 때부터 몸에 배게 하는 것이다. 작은 관심과 꾸준한 노력이 아이의 평생 건강을 지키는 든든한 밑거름이 된다.</p>

          <p>소금을 많이 생산할 수 있는 도시는 그 소금을 밑천 삼아 큰 부를 차곡차곡 쌓아 올릴 수 있었고, 소금이 오가는 길목이 되는 중심지에는 자연스레 교역로가 번듯하게 발달하였다. 소금은 지위가 높든 낮든 누구에게나 반드시 필요한 물질이었기 때문에, 수많은 사람이 저마다 소금을 손에 넣으려고 애를 썼다. 소금을 손쉽게 생산할 수 있는 지역에서는 그것을 소금이 부족한 다른 지역에 내다 팔 수 있었고, 이를 통해 다양한 물건을 맞바꾸거나 적지 않은 재화를 벌어들일 수 있었다. 소금을 등에 지고 먼 길을 오가는 상인들이 끊임없이 드나드는 길에는 이내 활발한 교역이 꽃피었다. 로마에서 병사들에게 소금을 사라고 급료를 준 데에서 ‘봉급’을 뜻하는 말이 나왔다는 이야기도 전해진다. 이렇게 소금은 한 도시의 경제적 성장은 물론 멀리 떨어진 지역 사이의 교류에도 중요한 역할을 톡톡히 해냈다. 그렇다면 사람들은 고작 조그만 알갱이에 불과한 소금을 어찌하여 이토록 중요한 존재로 여기게 되었을까? 그 답은 소금이 지닌 성질을 하나하나 들여다보면 자연스레 드러난다.</p>
          <p class="section-title">③ 작은 알갱이에 담긴 중요한 성분</p>
          <p>소금은 나트륨 원자 하나가 염소 원자 하나와 사이좋게 결합하여 이루어진 물질의 결정체이다. 우리가 밥상에서 흔히 마주하는 소금은 겉으로 보기에는 작고 하얀 알갱이에 지나지 않지만, 그 자그마한 알갱이 속에는 생명을 유지하는 데 꼭 필요한 중요한 성분이 알차게 담겨 있다. 원문에서는 사람에게 하루 동안 필요한 소금의 양이 겨우 3그램 정도밖에 되지 않는다고 설명한다. 손가락으로 집으면 한 줌도 되지 않는 적은 양이다. 그러나 이처럼 필요한 양이 적다고 해서 소금을 가볍게 여겨서는 안 된다. 소금은 그 적은 양으로도 우리 몸속에서 아주 중요한 역할을 묵묵히 담당하기 때문이다. 다시 말해 소금은 단순히 음식의 맛을 돋우는 데만 쓰이는 물질이 아니라, 우리 몸이 탈 없이 정상적으로 활동하는 데 반드시 있어야 하는 물질이기도 하다. 그렇다면 이 작은 소금 알갱이가 우리 몸속으로 들어가 과연 어떤 일들을 해내는지 지금부터 하나하나 자세히 살펴보기로 하자. 작다고 해서 결코 하찮지 않은 것이 바로 소금인 셈이다.</p>
          <p class="section-title">④ 신진대사에 영향을 미치는 소금</p>
          <p>우리 몸에 들어온 소금은 곧바로 나트륨 이온과 염화 이온으로 나뉘어 우리 몸의 신진대사에 폭넓은 영향을 미친다. 신진대사란 우리 몸이 생명을 유지하기 위해 음식에서 얻은 영양소를 쓸모 있게 이용하고, 그 과정에서 생겨나는 여러 가지 물질을 적절히 처리하는 일련의 과정을 말한다. 소금에서 갈라져 나온 이온들은 바로 이러한 복잡한 과정이 막힘없이 원활하게 이루어지도록 곳곳에서 돕는 역할을 한다. 겉으로 보기에는 그저 단순한 하얀 알갱이에 지나지 않지만, 일단 몸속에 들어가고 나면 이렇게 다양한 생명 활동에 깊숙이 관여하는 것이다. 우리가 음식을 먹고 몸을 움직이며 체온을 유지하고 몸속의 온갖 기능을 제대로 돌아가게 하는 거의 모든 과정에 소금의 성분이 알게 모르게 필요하다. 이처럼 소금은 우리 몸의 정상적인 활동을 든든하게 뒷받침하는 중요한 물질이며, 생명을 유지하는 데 결코 없어서는 안 되는 소중한 존재라 할 수 있다. 눈에 보이지 않는 작은 이온의 움직임이 우리 생명을 든든히 떠받치고 있는 것이다.</p>
          <p class="section-title">⑤ 영양소를 운반하는 데 필요한 소금</p>
          <p>소금은 혈액이나 위액과 같은 체액의 주요 성분이 되어 우리 몸속에서 아주 중요한 역할을 맡는다. 체액이란 혈액을 비롯해 몸속에 존재하는 여러 종류의 액체를 두루 이르는 말로, 영양소가 몸 곳곳으로 이동하고 신체의 다양한 기능이 제대로 이루어지는 데 꼭 필요하다. 예를 들어 우리가 음식을 먹어 얻은 영양소는 혈액이라는 흐름을 타고 우리 몸 구석구석 멀리까지 빠짐없이 전달된다. 바로 이 과정에서 소금의 성분은 체액이 너무 묽어지거나 너무 진해지지 않도록 그 균형을 알맞게 유지하는 데 큰 도움을 준다. 우리 몸을 이루는 수많은 세포가 저마다 제 역할을 하며 정상적으로 활동하려면, 필요한 영양소가 알맞은 때에 알맞게 공급되어야만 한다. 따라서 소금은 단순히 음식에 간을 맞추어 맛을 내는 데 그치지 않고, 영양소가 몸속에서 원활하게 이동할 수 있는 안정된 환경을 마련해 주는 꼭 필요한 역할까지 함께 해내고 있는 셈이다. 영양소를 몸 곳곳으로 실어 나르는 길 위에 소금이 언제나 조용히 함께하고 있는 셈이다.</p>
          <p class="section-title">⑥ 몸속 노폐물 배출을 돕는 소금</p>
          <p>소금은 우리 몸 안에 쌓인 각종 노폐물을 땀이나 오줌으로 내보내는 과정에도 긴밀하게 관여한다. 우리 몸은 쉴 새 없이 활동하는 동안 여러 가지 노폐물을 끊임없이 만들어 내는데, 이러한 물질이 몸속에 자꾸만 쌓여 가지 않도록 그때그때 바깥으로 내보내 주어야 한다. 땀을 흘리거나 오줌을 누는 일은 단순히 물을 내보내는 것이 아니라, 몸속의 불필요한 물질과 수분의 양을 알맞게 조절하는 대단히 중요한 과정이다. 소금의 성분은 이때 체액의 균형을 알맞게 유지하여, 노폐물을 걸러 내보내는 이러한 기능이 탈 없이 정상적으로 이루어지도록 돕는다. 이처럼 소금은 영양소를 몸 곳곳으로 운반하는 과정뿐 아니라, 거꾸로 몸속의 쓸모없는 물질을 깨끗이 배출하는 과정에도 빠짐없이 필요하다. 그래서 소금은 사람은 물론 소나 말, 사슴 같은 모든 동물이 생명을 건강하게 유지하는 데 결코 없어서는 안 되는 존재인 것이다. 영양소를 들여보내는 일과 노폐물을 내보내는 일, 그 상반된 두 가지 모두에 소금이 빠짐없이 꼭 필요한 셈이다.</p>
          <p class="section-title">⑦ 음식의 맛을 더욱 좋게 만드는 소금</p>
          <p>소금은 그것만 따로 집어 먹으면 혀가 아릴 만큼 너무 짜고 심지어 쓰기까지 하지만, 음식 본연의 맛과 알맞게 어우러지면 그 맛을 한결 더 좋게 끌어올려 주는 놀라운 작용을 한다. 실제로 소금을 그대로 먹었을 때와 음식에 적당히 넣어 간을 맞추어 먹었을 때 느껴지는 맛은 하늘과 땅만큼이나 크게 다르다. 소금은 음식이 본래부터 지니고 있는 고유한 맛을 더욱 또렷하고 깊게 느낄 수 있도록 뒤에서 돕기 때문이다. 수박에 소금을 살짝 뿌리면 단맛이 더 도드라지는 것도 바로 이런 까닭이다. 그래서 사람들은 차나 커피와 같은 몇몇 기호 식품이나 과일을 빼고는 거의 모든 음식에 소금을 넣는다. 음식의 재료가 제각각이고 조리하는 방법이 서로 다르더라도, 소금만큼은 다양한 음식의 맛을 두루 살려 내는 데 한결같이 쓰인다. 이처럼 소금은 사람들의 식생활에서 좀처럼 빼놓기 어려운, 없어서는 안 될 중요한 조미료라 할 수 있다. 짠맛을 내는 데 그치지 않고 다른 맛까지 돋보이게 하는 것이 소금의 숨은 재주인 셈이다.</p>
          <p class="section-title">⑧ 식품을 오래 보존하는 소금의 역할</p>
          <p>소금은 음식의 맛을 살리는 것에 더해 식품을 오래도록 보존하는 데에도 큰 역할을 한다. 요즈음에야 집집마다 놓인 냉장고 덕분에 음식을 제법 오래 두고 먹을 수 있지만, 냉장 시설이라고는 변변히 갖추어져 있지 않던 먼 옛날에는 결코 그럴 수 없었다. 음식은 시간이 조금만 지나도 금세 상하거나 썩어 버리기 일쑤였기 때문에, 오랫동안 안전하게 보관할 수 있는 지혜로운 방법이 꼭 필요했다. 특히 날이 춥거나 흉년이 들어 식품을 쉽게 구할 수 없는 시기에는, 형편이 넉넉할 때 미리 마련해 둔 음식을 상하지 않게 오래 보존하는 일이 생존과 직결되는 중요한 문제였다. 그래서 옛날 사람들은 소중한 식품을 오래 보존하기 위해 소금을 요긴하게 이용했다. 소금은 특별한 냉장 시설이 전혀 없던 시대에도 음식을 비교적 오랫동안 상하지 않게 지켜 주었다. 바로 이러한 성질 덕분에 소금은 사람들의 살림살이에서 한층 더 귀하고 소중한 물질로 대접받게 되었다. 소금 한 줌이 한 집안의 겨울나기를 좌우하기도 했던 것이다.</p>
          <p class="section-title">⑨ 음식이 썩는 것을 막아 주는 소금</p>
          <p>그렇다면 소금은 어떻게 식품을 오래 보존할 수 있게 하는 것일까? 그 비밀은 바로 소금이 음식을 썩게 만드는 미생물이 자라는 것을 억제하는 데 있다. 눈으로는 볼 수 없을 만큼 작은 미생물은 식품 속에서 수를 불리며 자라나는 동안 음식을 서서히 부패하게 만든다. 그런데 소금은 식품 속에 든 수분을 끌어당겨 줄여 버림으로써, 이러한 미생물이 번식하며 자라나기 어려운 메마른 환경을 만들어 놓는다. 그 결과 식품은 쉽게 상하지 않고 비교적 오랫동안 신선함을 잃지 않은 채 보존될 수 있다. 옛날 사람들이 귀한 고기나 생선을 소금에 꾹꾹 절여 저장해 둔 것도 모두 소금의 이러한 성질을 슬기롭게 이용한 것이었다. 냉장고라고는 구경조차 할 수 없던 시절에, 소금은 음식을 오랫동안 먹을 수 있도록 지켜 주는 더없이 중요한 수단이었다. 이처럼 소금은 음식의 맛을 끌어올리는 것에 더해, 식품을 썩지 않게 보존하는 데에도 오랜 세월 큰 역할을 꾸준히 해 왔다. 눈에 보이지 않는 미생물과의 싸움에서 소금이 든든한 방패가 되어 준 셈이다.</p>
          <p class="section-title">⑩ 하얀 황금이라고 불리는 소금</p>
          <p>지금까지 두루 살펴본 것처럼, 소금은 그 자체로 우리의 생명을 유지하는 데 꼭 필요한 더없이 소중한 물질이다. 우리 몸에 들어온 소금은 나트륨 이온과 염화 이온으로 나뉘어 신진대사에 폭넓게 영향을 미치고, 영양소가 몸 곳곳으로 이동하는 일과 몸속 노폐물을 바깥으로 배출하는 일에도 빠짐없이 관여한다. 뿐만 아니라 소금은 다양한 음식의 맛을 한결 더 좋게 끌어올려 주고, 변변한 냉장 시설이 없던 시절에도 식품을 오랫동안 상하지 않게 보존할 수 있도록 도왔다. 바로 이러한 여러 역할 덕분에 소금은 고대 문명이 발달하는 과정에서도, 또 오늘날 사람들의 일상생활에서도 변함없이 중요한 가치를 지녀 왔다. 비록 손바닥 위에 올려놓으면 보잘것없어 보이는 작고 하얀 알갱이에 불과하지만, 소금이 우리 삶에 미치는 영향은 결코 작지 않다. 생명을 지켜 주고 식생활을 풍요롭게 해 주는 소중한 존재, 그것이 바로 예로부터 사람들이 ‘하얀 황금’이라 부르며 귀하게 여겨 온 소금인 것이다. 작은 알갱이 하나에 담긴 큰 가치를 우리는 다시금 돌아보게 된다.</p>

          <p>이러한 여러 차이 때문에, 훗날 통일이 되고 나면 남북 사람들이 함께 어울려 살아가는 과정에서 의사소통에 적지 않은 문제가 생길 수 있다. 남한과 북한의 사람들은 분명 모두 같은 우리말을 쓰지만, 날마다 입에 올리는 익숙한 낱말과 말하는 표현 방식이 서로 다르기 때문이다. 상대방이 건네는 말을 정확하게 알아듣지 못하면, 아주 간단한 부탁이나 자세한 설명조차 제대로 주고받지 못해 일이 어긋날 수 있다. 특히 학교처럼 여러 사람이 날마다 한데 모여 함께 배우고 어울려 활동하는 곳에서는, 서로가 하는 말의 뜻을 정확히 이해하는 일이 무엇보다 중요하다. 서로 다른 표현을 제대로 알지 못한 채 섣불리 대화를 이어 가다 보면, 애초에 아무도 의도하지 않았던 뜻밖의 오해가 불쑥불쑥 생겨날 수 있다. 따라서 통일 이후에 서로 막힘없이 소통하기 위해서는, 바로 지금부터 남북의 언어 차이에 꾸준히 관심을 기울여 둘 필요가 있다. 미리미리 준비해 둔 만큼 통일 이후의 만남과 소통도 그만큼 더 수월해질 것이다.</p>
          <p class="section-title">⑦ 축구 경기에서 겪은 언어 차이</p>
          <p>남한에 온 북한 이탈 청소년들의 생생한 경험담을 들어 보면, 언어 차이로 겪는 어려움이 결코 작지 않음을 알 수 있다. 한 청소년은 친구들과 축구를 하던 중에 “연락하라.”라고 외쳤는데, 어찌 된 일인지 아무도 자신에게 공을 주지 않아 몹시 당황했던 적이 있다고 한다. 북한에서 공을 자신에게 달라는 뜻으로 쓰던 그 말이 자신에게는 더없이 익숙한 표현이었지만, 함께 운동장을 누비던 남한 친구들은 그 말의 뜻을 전혀 알아듣지 못했던 것이다. 같은 운동장에서 같은 공을 차며 같은 경기를 즐기면서도, 서로 입에 밴 말이 달라 의사소통이 어긋나 버린 셈이다. 이처럼 함께 어울려 노는 즐거운 놀이의 순간에도 언어 차이는 뜻밖의 불편과 서먹함을 불러일으킬 수 있다. 만약 그때 친구들이 “그게 무슨 말이야?” 하고 가볍게 묻고, 또 그 청소년이 뜻을 친절히 알려 주었더라면, 둘은 서로를 훨씬 더 쉽게 이해할 수 있었을 것이다. 서로의 말을 그때그때 확인하고 묻는 일이 그래서 중요하다. 작은 물음 하나가 뜻밖의 큰 오해를 미리 막아 준다.</p>

          <p>북한 이탈 청소년들은 교실에서 벌어지는 수업 시간에도 쓰는 말이 서로 달라 배우는 내용을 이해하기가 여간 어렵지 않았다고 입을 모은다. 학교에서는 선생님의 설명을 귀 기울여 듣고 친구들과 이런저런 의견을 주고받으며 새로운 지식을 하나씩 배워 나간다. 그런데 귀에 익지 않은 낯선 낱말이 수업 중에 자꾸만 튀어나오면, 선생님의 설명을 놓치지 않고 따라가는 일이 결코 만만치가 않다. 게다가 모르는 말이 나왔을 때 손을 들어 질문하는 데에도 적잖은 용기가 필요할 수 있다. 괜히 물었다가 다른 친구들이 이상하게 여기지는 않을까 망설여지기 때문이다. 이러한 어려움은 결코 그 학생이 공부를 게을리하거나 열심히 하지 않아서 생기는 문제가 아니다. 오랜 세월 남북에서 서로 다르게 쓰여 온 언어가 학교생활에까지 고스란히 영향을 미치는 것일 뿐이다. 따라서 학생들이 서로의 표현을 너그러이 이해하고, 낯선 말이 나오면 흉보지 않고 친절하게 설명해 주는 따뜻한 분위기를 만들어 가는 것이 무엇보다 중요하다.</p>
          <p class="section-title">⑨ 남북의 언어 차이를 극복하는 방법</p>
          <p>남북의 언어 차이를 슬기롭게 극복하려면 학생 개인과 국가가 서로 발맞추어 함께 노력해야 한다. 먼저 학생 차원에서는 남한 학생과 북한 출신 학생이 머리를 맞대고 함께 &lt;학교 생활 안내서&gt;를 만들어 보면 좋을 것이다. 학교에서 자주 쓰는 낱말과 표현을 서로에게 알려 주고, 겉모습은 같지만 뜻이 다른 말을 한데 모아 정리해 두면 실제 학교생활에 큰 도움이 될 수 있다. 다음으로 국가 차원에서는 &lt;겨레말큰사전&gt; 편찬처럼 남북의 언어를 하나로 아우르고 통합하려는 정책을 꾸준히 펼쳐 나가야 한다. 남북의 언어를 꼼꼼히 비교하고 누구나 서로를 이해할 수 있도록 돕는 자료를 넉넉히 마련하는 일이 꼭 필요하기 때문이다. 또한 눈에 보이는 언어뿐 아니라 그 말 속에 녹아 있는 서로의 문화에도 깊은 관심을 가지고 자주 오가며 교류해야 한다. 어떤 말이든 그 안에는 그것을 쓰는 사람들의 생활 방식과 오랜 문화가 고스란히 담겨 있기 때문이다. 언어를 서로 나누는 일은 결국 서로의 삶과 마음을 나누는 일과 다르지 않은 셈이다.</p>
          <p class="section-title">⑩ 이해와 존중으로 준비하는 통일 시대</p>
          <p>언어가 서로 막힘없이 통하면 공연한 오해도 저절로 사라지고 의사소통도 한결 매끄러워진다. 남북이 이렇게 서로 다른 말을 쓰게 된 데에는, 광복 이후 오랫동안 달랐던 사회 체제와 생활 방식이 깊이 영향을 미쳤다. 그러므로 상대방의 표현이 조금 낯설게 들린다고 해서 그것을 이상하거나 틀린 말로 함부로 여기기보다, 어째서 그런 차이가 생겨났는지를 먼저 헤아리고 이해하려는 너그러운 태도가 필요하다. 학생들은 서로의 말을 스스럼없이 배우고, 사회와 국가는 남북의 언어 차이를 조금씩 줄여 나갈 수 있는 실질적인 방법을 꾸준히 마련해야 한다. 아울러 언어뿐 아니라 서로의 문화에도 관심을 가지고 자주 오가며 교류하려는 노력 또한 그 못지않게 중요하다. 다가올 통일 시대를 차분히 준비하며 남북이 서로 화합하고 원활하게 소통하려면, 무엇보다 언어 문제에 먼저 적극적으로 관심을 기울이고 서로를 진심으로 존중하는 마음을 가져야 한다. 말이 가까워지면 마음도 가까워지고, 마음이 가까워지면 통일의 길도 한층 가까워질 것이다.</p>

          <p>해수 담수화에는 비용 문제뿐 아니라 뜻밖의 환경적인 문제까지 뒤따른다. 원문에서 소개한 증발법은 짠 바닷물을 펄펄 끓도록 가열하여 거기서 생겨난 깨끗한 증기를 식혀 물을 얻는 방식인데, 바로 이 과정에서 어마어마하게 많은 에너지가 소비된다. 부족한 물을 얻겠다고 그토록 많은 에너지를 쏟아붓는다면, 물 부족을 해결하려던 노력이 도리어 또 다른 환경 문제를 새로 불러일으키는 셈이 될 수 있다. 에너지를 많이 쓸수록 온실가스 배출이 늘어 기후 변화를 부채질할 수도 있기 때문이다. 결국 바닷물을 담수로 바꾸는 기술 하나만 철석같이 믿고 지금처럼 물을 흥청망청 계속 써 대는 것은 결코 바람직한 태도가 아니다. 기술이 부족한 물을 확보하는 데 어느 정도 도움을 줄 수는 있지만, 높은 비용과 막대한 에너지 소비라는 분명한 한계를 늘 함께 염두에 두어야 한다. 물 부족을 조금이라도 줄이려면 새로운 물을 얻어 내는 방법을 찾는 것뿐 아니라, 이미 우리 손에 있는 물을 알뜰히 아껴 쓰는 태도가 무엇보다 먼저 필요하다.</p>
          <p class="section-title">⑩ 미래 세대를 위한 물 절약의 실천</p>
          <p>이제 우리는 아주 중요한 갈림길 앞에 서 있다. 다음 세대에게 물 부족으로 인한 쓰라린 고통을 그대로 물려줄 것인지, 아니면 사람다운 삶을 넉넉히 영위할 수 있는 건강한 환경을 물려줄 것인지를 진지하게 고민해야 할 때이다. 만약 지금의 위기를 대수롭지 않게 과소평가한다면, 그동안 영화 속에서나 펼쳐지던 물 없는 비극적인 미래가 어느 날 우리 눈앞의 현실이 되어 버릴 수도 있다. 그러나 다행히도 아직은 결코 늦지 않았다. 지금 이 순간부터라도 우리가 날마다 물을 쓰는 소비 행태에 대해 또렷한 경각심을 가지고, 물을 아끼며 경제적으로 쓰도록 부지런히 노력한다면 얼마든지 달라질 수 있다. 무엇보다 물은 언제까지나 넘치도록 충분할 것이라고 막연히 믿으며 아무렇지 않게 낭비하던 오랜 습관부터 찬찬히 돌아볼 필요가 있다. 한 사람 한 사람의 실천은 비록 작고 보잘것없어 보여도, 수많은 사람이 뜻을 모아 함께 물을 아껴 쓴다면 다가올 물 부족에 대비하는 데 분명 큰 힘이 될 것이다. 우리 뒤에 올 미래 세대의 삶을 위해, 지금 바로 이 순간 물의 소중함을 가슴 깊이 기억해야 한다.</p>

        content: `
          <p class="section-title">① 잊힐 권리를 인정한 유럽의 판결</p>
          <p>2014년 5월, 유럽 사법 재판소는 인터넷상에 떠도는 개인 정보의 삭제를 요구하는 한 재판에서 ‘잊힐 권리’를 인정하는 중요한 판결을 내렸다. 사건의 발단은 이러했다. 스페인의 한 변호사가 인터넷을 검색하다가 오래전 자신의 빚과 관련된 개인 정보가 담긴 기사를 우연히 발견하고는, 인터넷 검색 서비스 업체를 상대로 그 기사가 더 이상 검색되지 않도록 해 달라고 요청하였는데, 마침내 법원이 그의 주장을 받아들인 것이다. 이 판결은 인터넷에 남아 있는 개인 정보를 당사자의 요구에 따라 검색 결과에서 빼낼 수 있는지에 관한 선구적인 사례가 되었다. 인터넷에 한 번 올라온 정보는 세월이 아무리 흘러도 좀처럼 사라지지 않고 계속 검색될 수 있기 때문에, 개인의 지나간 과거가 본인의 뜻과 무관하게 끊임없이 알려지는 문제가 생길 수 있다. 바로 이러한 상황 속에서 잊힐 권리가 세상의 주목을 받기 시작하였다. 디지털 시대에 지워지지 않는 과거의 기록으로부터 벗어나고 싶은 사람들의 바람이 마침내 하나의 권리로 떠오른 것이다.</p>
          <p class="section-title">② 잊힐 권리의 법제화를 둘러싼 논의</p>
          <p>이 판결을 하나의 계기로, 세계의 많은 국가가 잊힐 권리에 대해 본격적으로 관심을 기울이기 시작하였다. 잊힐 권리란 인터넷에 공개된 자신에 관한 정보가 더 이상 검색되거나 함부로 알려지지 않도록 당사자가 요구할 수 있는 권리와 관련된 것이다. 최근에는 우리나라에서도 이 잊힐 권리를 법으로 정하자는, 이른바 법제화에 관한 논의가 제법 활발하게 진행되고 있다. 여기서 법제화란 어떤 내용을 정식으로 법으로 정하여, 누구에게나 일정한 기준에 따라 똑같이 적용되도록 만드는 일을 말한다. 개인의 소중한 정보를 지켜 준다는 점에서 잊힐 권리는 분명 중요하게 여겨질 만하다. 그런데 문제는, 이 권리를 섣불리 법으로 정해 버리면 뜻하지 않게 다른 사람들이 지닌 또 다른 권리와 정면으로 충돌하는 상황이 생길 수 있다는 데 있다. 따라서 법제화에 앞서 과연 어떤 문제들이 뒤따라 나타날 수 있는지를 하나하나 충분히 꼼꼼하게 따져 보아야 한다. 아무리 좋은 뜻으로 만든 법이라도 뜻밖의 부작용을 낳을 수 있기 때문이다.</p>
          <p class="section-title">③ 첫 번째 문제, 국민의 알 권리 침해</p>
          <p>먼저 잊힐 권리를 선뜻 법제화할 경우, 자칫 국민의 알 권리가 침해될 수 있다는 문제가 있다. 모든 국민은 중요한 결정을 내려야 할 때 그 바탕이 되는 정보를 충분히 얻어 이용할 수 있어야 한다. 알 권리는 바로 이렇게 자신에게 필요한 정보를 자유롭게 얻고, 그 정보를 바탕으로 스스로 올바른 판단을 내리는 데 더없이 중요한 역할을 한다. 그런데 만약 어떤 사람이 자신에게 불리한 정보를 잊힐 권리를 근거로 내세워 삭제하도록 요구한다면, 그 정보를 꼭 알아야 할 다른 사람들은 정작 그 내용을 확인하기가 어려워질 수 있다. 꼭 필요한 정보가 이렇게 슬그머니 사라져 버리면, 사람들은 어떤 사건이나 인물을 여러 각도에서 고루 살펴보지 못한 채 한쪽으로 치우친 판단을 내릴 수도 있다. 더구나 사회 전체에 영향을 미치는 중요한 결정을 내릴 때일수록 충분한 정보를 얻는 일은 무엇보다 중요하다. 그러므로 개인 정보 보호라는 가치와 국민의 알 권리가 서로 부딪칠 가능성을 결코 가볍게 넘겨서는 안 된다.</p>
          <p class="section-title">④ 정치인 선출 과정에서 발생하는 문제</p>
          <p>이러한 문제는 특히 선거처럼 중요한 상황에서 더욱 또렷하게 드러난다. 예를 들어 국민은 어떤 정치인을 대표로 뽑기에 앞서, 그 후보자가 과거에 어떤 길을 걸어왔는지 그 행적을 인터넷에서 꼼꼼히 검색해 볼 수 있다. 후보자가 지난날 어떤 행동을 했고 또 그에 대해 사람들로부터 어떤 평가를 받았는지를 두루 알아보는 일은, 소중한 한 표를 어디에 던질지 결정하는 데 매우 중요한 판단 자료가 된다. 그런데 어떤 후보자가 잊힐 권리를 앞세워 자신에게 불리한 과거의 정보를 모조리 삭제하도록 요구했다고 한번 가정해 보자. 만약 그 후보자에 관한 중요한 정보가 검색 결과에서 감쪽같이 사라져 버린다면, 국민은 정작 판단에 꼭 필요한 내용을 충분히 얻기가 어려워진다. 그렇게 되면 그 후보자가 과연 국민의 대표인 정치인으로 뽑히기에 걸맞은 사람인지 제대로 판단하기조차 어려워질 것이다. 이처럼 잊힐 권리가 지나치게 넓게 적용되면, 국민이 마땅히 알아야 할 중요한 정보까지 가려져 버릴 수 있다는 문제가 있다.</p>
          <p class="section-title">⑤ 두 번째 문제, 표현의 자유 침해</p>
          <p>둘째로, 잊힐 권리를 법제화하면 이번에는 표현의 자유가 침해될 수 있다는 또 다른 문제가 나타난다. 표현의 자유란 자신의 생각이나 의견, 주장 따위를 누구의 눈치도 보지 않고 자유롭게 겉으로 드러내 표현할 수 있는 권리를 말한다. 이는 여러 사람이 함께 어울려 살아가는 민주주의 사회에서 결코 없어서는 안 될 필수 불가결한 기본권이라고 할 수 있다. 사람들은 글이나 말, 또는 인터넷 게시물 같은 다양한 통로를 통해 자신의 생각을 다른 사람에게 전하며 살아간다. 이처럼 서로 다른 의견을 저마다 자유롭게 표현할 수 있어야, 비로소 다양한 생각이 사회 안에서 활발하게 오가고 논의될 수 있는 것이다. 그런데 만약 어떤 글 속에 등장하는 사람이 잊힐 권리를 내세우며 그 게시물을 삭제해 달라고 요구한다면, 애써 그 글을 작성한 사람의 표현이 뜻하지 않게 제한되고 억눌릴 수 있다. 따라서 잊힐 권리를 인정해 나가는 과정에서는 반드시 표현의 자유라는 또 하나의 소중한 가치도 함께 저울질하여 고려해야 한다.</p>
          <p class="section-title">⑥ 누리 소통망 게시물에서 발생하는 갈등</p>
          <p>이러한 표현의 자유 문제 역시 구체적인 예를 들어 보면 한결 쉽게 이해할 수 있다. 예를 들어 ‘민호’가 자신의 친구인 ‘정수’에 대해 평가한 내용이 담긴 게시물을 자신의 누리 소통망에 올렸다고 가정해 보자. 민호는 자신이 평소 생각하고 느낀 바를 한 편의 글로 솔직하게 작성하여 다른 사람들과 함께 나눈 것이다. 그런데 만약 잊힐 권리가 법으로 정해진다면, 정수는 민호를 찾아가 그 게시물을 당장 삭제해 달라고 떳떳이 요구할 수 있게 된다. 정수의 입장에서는 자신에 관한 이런저런 평가가 인터넷에 고스란히 남아 있는 것이 영 달갑지 않을 수 있기 때문이다. 하지만 거꾸로 민호의 입장에서 보면, 자신의 생각과 의견을 자유롭게 표현한 소중한 게시물을 본인의 뜻과 상관없이 지워야만 하는 난처한 상황에 놓이게 된다. 바로 이럴 경우 게시물을 올린 민호의 표현의 자유가 침해될 수 있는 것이다. 이처럼 한 사람의 잊힐 권리와 다른 사람의 표현의 자유, 두 권리가 정면으로 충돌할 수 있다는 점이 문제이다.</p>
          <p class="section-title">⑦ 세 번째 문제, 법 적용 범위의 논란</p>
          <p>셋째로, 잊힐 권리를 법제화하면 정작 그 법을 어디까지 적용할 것인가 하는 적용 범위가 큰 논란거리가 될 수 있다. 과연 어떤 정보는 지워 줄 수 있고 또 어떤 정보는 반드시 남겨 두어야 하는지, 그것을 가르는 명확한 기준을 세우기가 생각만큼 쉽지 않기 때문이다. 똑같은 하나의 정보를 두고도 어떤 사람은 그것을 여러 사람과 관계된 공적인 영역에 속하는 정보로 보고, 그러한 정보를 함부로 삭제하는 데 단호히 반대할 수 있다. 반면 또 다른 사람은 바로 그 정보를 지극히 개인적인 사적 영역에 속하는 정보로 보아, 당연히 잊힐 권리의 적용 대상이 되어야 한다고 판단할 수 있다. 이처럼 하나의 정보가 지닌 성격을 바라보는 관점이 사람마다 서로 다르면, 그 정보를 삭제할지 말지에 대한 의견 또한 자연히 엇갈릴 수밖에 없다. 따라서 설령 잊힐 권리를 법으로 정한다 하더라도, 그 법을 과연 어디까지 적용해야 하는가에 관한 끝없는 논란이 꼬리에 꼬리를 물고 이어질 수 있다. 기준이 모호한 법은 언제나 다툼의 불씨를 남기기 마련이다.</p>
          <p class="section-title">⑧ 공적 정보와 사적 정보의 구분</p>
          <p>공무원과 같은 공인이 누군가와 식사를 함께했다는 정보는 과연 공적 정보일까, 아니면 사적 정보일까? 만약 그것이 그저 가까운 사람과 나눈 지극히 개인적인 식사 자리였다면, 그 사람의 사생활에 관한 정보라고 볼 수도 있을 것이다. 그러나 반대로 그 식사가 공적인 업무와 깊이 관련된 사람을 만난 자리였다면, 마땅히 국민이 알아야 할 중요한 정보라고 생각하는 사람도 적지 않을 것이다. 이처럼 똑같이 ‘누군가와 식사했다’는 하나의 사실이라 하더라도, 그것이 어떤 상황에서 어떤 의도로 이루어졌는지에 따라 그 성격에 대한 판단은 얼마든지 달라질 수 있다. 결국 어떤 정보가 공적인 영역에 속하고 어떤 정보가 사적인 영역에 속하는지를 칼로 자르듯 명확하게 구분하기란 결코 쉬운 일이 아니다. 그러므로 잊힐 권리를 법제화하면, 과연 어디까지를 보호해야 할 개인 정보로 볼 것인지, 또 어떤 경우에 삭제를 허용할 것인지를 둘러싼 논란이 한층 더 크고 복잡해질 것이다. 경계가 흐릿한 곳일수록 그 판단은 더욱 조심스러워야 한다.</p>
          <p class="section-title">⑨ 잊힐 권리 법제화의 문제점 정리</p>
          <p>지금까지 차근차근 살펴본 것처럼, 잊힐 권리를 섣불리 법제화하면 여러 가지 만만치 않은 문제가 뒤따라 생길 수 있다. 물론 개인의 지나간 과거 정보가 인터넷에 언제까지나 남아 끊임없이 알려지는 문제를 바로잡으려는 그 취지 자체는 분명 중요하고 뜻깊다. 그러나 그 좋은 취지를 이루어 가는 과정에서, 자칫 국민의 알 권리나 표현의 자유처럼 똑같이 소중한 다른 권리가 침해될 가능성도 함께 도사리고 있다. 또한 공적인 정보와 사적인 정보를 가르는 뚜렷한 기준을 정하기가 어려워, 법의 적용 범위를 둘러싼 지루한 논란이 끊이지 않고 이어질 수 있다. 결국 어느 한 사람의 정보 삭제 요구가 또 다른 사람의 정보 이용이나 자유로운 의견 표현에 적잖은 영향을 미칠 수 있는 셈이다. 따라서 우리는 잊힐 권리의 필요성이라는 한쪽 면만 바라볼 것이 아니라, 그것을 법으로 정했을 때 생겨날 수 있는 문제점까지 충분히 함께 검토해야 한다. 서로 다른 권리들이 맺고 있는 미묘한 관계를 더없이 신중하게 살펴야 한다.</p>
          <p class="section-title">⑩ 잊힐 권리의 법제화는 신중해야 한다</p>
          <p>그러므로 잊힐 권리를 조급한 마음에 성급하게 법제화하려 들기보다는, 우선 인터넷 검색 서비스 분야의 기업들이 사회 통념을 두루 고려하여 정보를 삭제할 수 있는 합리적인 기준과 절차를 스스로 마련해 시행해 나가는 편이 한결 바람직하다. 과연 어떤 정보가 삭제의 대상이 되는지, 또 삭제 요청을 받았을 때 무엇을 먼저 확인해야 하는지 등을 하나하나 신중하게 정해 둘 필요가 있다. 개인의 소중한 정보를 잘 보호하면서도, 그 못지않게 중요한 국민의 알 권리와 표현의 자유를 지나치게 제한하는 일이 없도록 세심하게 균형을 잡아야 하기 때문이다. 인터넷에 남은 정보를 무턱대고 모조리 지워 버리거나, 반대로 무엇이든 무조건 그대로 공개해 두는 어느 한쪽의 방식만으로는 이 복잡한 문제를 결코 말끔히 해결할 수 없다. 서로 다른 권리가 언제든 부딪칠 수 있다는 점을 늘 염두에 두어야 한다. 결론적으로, 잊힐 권리의 법제화에는 무엇보다 신중하고 또 신중하게 접근해야 한다. 서두르기보다 충분히 논의하는 것이 더 나은 답에 이르는 길이다.</p>

          <p>향신료의 나라로 이름난 인도에서도 아주 매운 품종의 고추가 많이 생산되고 있습니다. 특히 인도의 북동부에 자리한 아삼 지역에서는, 입에 넣는 순간 숨이 턱 막힐 만큼 엄청난 매운맛을 자랑하는 ‘부트졸로키아’라는 고추가 오래전부터 재배되어 왔습니다. 부트졸로키아는 한때 세계에서 가장 매운 고추로 꼽혔을 만큼 강렬하고 지독한 매운맛으로 널리 알려진 고추로, 우리가 평소 흔히 먹는 순한 고추와는 전혀 다른 뚜렷한 특징을 지니고 있습니다. 이처럼 고추는 어느 지역에서 자라느냐에 따라 매운맛의 정도와 품종이 실로 다양하게 나타납니다. 어떤 고추는 아주 조금만 먹어도 온몸이 화끈거릴 만큼 강한 매운맛을 느끼게 하지만, 또 어떤 고추는 거의 맵지 않고 비교적 순하고 부드러운 맛을 냅니다. 세계 여러 나라의 사람들은 바로 이러한 고추의 저마다 다른 특징을 슬기롭게 활용하여 자신들만의 개성 있는 음식을 발전시켜 왔습니다. 고추가 전 세계인의 입맛을 사로잡은 까닭도 바로 여기에 있습니다. 다양함이야말로 고추가 지닌 가장 큰 힘인 셈입니다.</p>
          <p class="section-title">⑥ 달콤한 고추, 파프리카의 등장</p>
          <p>한편 우리에게도 제법 익숙한, 이른바 ‘달콤한’ 고추인 파프리카는 부드러운 성질을 지닌 고추의 변종으로, 본래 미국의 따뜻한 열대 지역에 그 뿌리를 두고 있습니다. 흔히 고추라고 하면 누구나 혀가 얼얼한 매운맛을 가장 먼저 떠올리기 마련이지만, 세상의 모든 고추가 하나같이 강한 매운맛을 내는 것은 결코 아닙니다. 파프리카처럼 매운 기운은 거의 없이 오히려 부드럽고 달콤한 맛을 지닌 고추도 엄연히 존재합니다. 파프리카는 품종에 따라 은은한 단맛부터 제법 알싸한 매운맛까지 매우 다양한 맛의 특징을 지니고 있어, 샐러드나 볶음 요리 등 실로 여러 음식에 폭넓게 활용됩니다. 이러한 점에서 파프리카 역시 매운맛과는 또 다른 방식으로 세계인의 입맛을 사로잡은 고추의 당당한 한 종류라고 할 수 있습니다. 결국 고추는 단순히 맵기만 한 향신료에 머무르지 않고, 순한 맛과 달콤한 맛까지 두루 품은 다채로운 식재료로 폭넓게 발전해 온 것입니다. 바로 이것이 고추가 지닌 또 하나의 숨은 매력입니다. 매운맛만이 고추의 전부는 아닌 것입니다.</p>
          <p class="section-title">⑦ 헝가리를 대표하는 향신료, 파프리카</p>
          <p>터키를 대표하는 향신료로 널리 알려진 파프리카는, 거대한 오스만 제국이 유럽까지 세력을 뻗치던 당시에 멀리 헝가리로 전파되었습니다. 앞서 살펴보았듯 파프리카는 은은한 단맛부터 알싸한 매운맛까지 그 맛의 폭이 무척 다양한데, 이 가운데에서도 특히 맵지 않고 순한 맛을 내는 파프리카 가루가 오늘날 헝가리를 대표하는 자랑스러운 향신료로 자리 잡았습니다. 헝가리 사람들은 이 붉은 파프리카 가루를 음식에 듬뿍 넣어 다른 데서는 맛볼 수 없는 독특한 풍미와 먹음직스러운 붉은 색을 한껏 더했습니다. 그 대표적인 음식으로는 파프리카를 넉넉히 넣어 끓인 헝가리식 쇠고기 스튜인 ‘굴라시’를 꼽을 수 있습니다. 굴라시는 파프리카를 활용한 가장 대표적인 음식으로, 오늘날 헝가리를 상징하는 국민 음식으로까지 손꼽힙니다. 이처럼 파프리카는 낯선 새로운 지역으로 전해진 뒤 그 나라 고유의 식문화와 멋지게 어우러지며 특별한 향신료로 깊이 뿌리내렸습니다. 결국 고추는 매운맛이든 순한 맛이든 가리지 않고 전 세계인의 입맛을 두루 사로잡은 것입니다.</p>
          <p class="section-title">⑧ 우리나라에 고추가 들어온 시기</p>
          <p>고추는 오늘날 우리 식탁에서 결코 빼놓을 수 없는 중요한 향신료이지만, 놀랍게도 우리나라에 고추가 들어온 지는 겨우 400년 정도밖에 되지 않는다고 합니다. 지금이야 고추장이나 김치처럼 고추를 듬뿍 넣어 만든 음식이 더없이 익숙하고 당연하게 느껴지지만, 아주 먼 옛날부터 우리 땅에 고추가 자라고 있었던 것은 결코 아니라는 뜻입니다. 고추가 과연 언제 우리나라 안으로 처음 들어오게 되었는지, 그 정확한 시기를 놓고는 학자들 사이에 여러 가지 의견이 분분합니다. 그 가운데에서도 임진왜란이 일어난 즈음에 일본으로부터 전해 받은 것이라는 설이 비교적 널리 일반적으로 알려져 있습니다. 고추가 우리나라에 전해진 뒤로 사람들은 이를 밭에 심어 부지런히 재배하고, 또 다양한 음식에 조금씩 활용하기 시작했습니다. 오늘날 한국 음식의 가장 중요한 특징으로 꼽히는 얼큰하고 매운맛 역시, 바로 이 고추가 전해진 이후에야 비로소 한층 더 풍부하고 다양하게 발전해 나갈 수 있었던 것입니다. 우리 식탁의 얼큰한 매운맛에도 그리 길지 않은 역사가 숨어 있는 셈입니다.</p>
          <p class="section-title">⑨ 일본을 거쳐 우리나라로 전해진 고추</p>
          <p>저 멀리 중남미에서 바다를 건너 유럽으로 처음 건너온 고추는, 이후 포르투갈 무역선에 실린 채 다시 머나먼 항해를 거듭하여 1540년대에는 마카오와 중국의 여러 무역항에 다다랐습니다. 그리고 1543년에는 마침내 포르투갈 상인의 손을 거쳐 일본의 규슈 지방에까지 전해지게 되었습니다. 그렇게 긴 여정을 거친 고추는 일본을 징검다리 삼아, 지금의 부산 자리에 있던 동래 왜관을 통해 우리나라 땅에 처음 들어와 본격적으로 재배되기 시작했습니다. 임진왜란이 벌어질 즈음에는 이미 고추 재배가 경상도 일대로 제법 널리 퍼져 나간 것으로 설명됩니다. 다행히 고추는 기르는 일이 그다지 까다롭거나 어렵지 않았기 때문에, 이후로는 따뜻한 남쪽에서 시작하여 점차 북쪽으로까지 빠르게 확산되어 갔습니다. 처음에는 바다 건너 외국에서 들어온 낯설기만 한 작물이었지만, 세월이 흐르면서 어느새 우리나라 방방곡곡에서 흔히 재배되는 더없이 친숙한 식재료로 자리 잡았습니다. 그렇게 고추는 마침내 한국인의 식생활 속에 깊고 단단히 뿌리내렸습니다.</p>
          <p class="section-title">⑩ 고추가 바꾸어 놓은 한국 김치의 맛</p>
          <p>한국을 대표하는 음식인 김치는 고추의 맛을 가장 잘 보여 주는 음식이라 할 수 있습니다. 그런데 뜻밖에도 김치가 처음부터 지금처럼 빨갛고 매웠던 것은 결코 아니라고 합니다. 김치라는 말의 어원은 ‘국물이 많은 절인 채소’라는 뜻을 지닌 옛말 ‘침채’에서 그 뿌리를 찾을 수 있습니다. 김치에 비로소 고추를 넣어 담그기 시작한 것은 대략 1700년경부터라고 전해집니다. 그 이전까지만 해도 사람들은 마늘이나 산초, 생강, 파와 같은 재료를 매운맛을 내는 향신료로 두루 사용하고, 거기에 소금으로 알맞게 간을 하여 김치를 발효해 먹었습니다. 그러다 고추가 이 땅에 전해진 뒤로는, 김치에 전에 없던 얼큰하고 새로운 매운맛을 더할 수 있게 되었습니다. 이처럼 머나먼 신대륙에서 우연히 발견된 작은 고추 한 알은, 바다를 건너 세계 여러 지역으로 퍼져 나가 저마다 다채로운 음식 문화를 꽃피웠고, 마침내 우리나라의 대표 음식인 김치의 맛에까지 커다란 변화를 가져왔습니다. 작은 고추 한 알에 담긴 긴 역사가 오늘 우리 밥상에까지 고스란히 이어지고 있는 것입니다.</p>

          <p class="section-title">③ 인류의 진화를 설명한 철학자 미셸 세르</p>
          <p>프랑스의 저명한 철학자 미셸 세르는 자신의 저서 『호미네상스(Hominescence)』와, 2005년 12월에 ‘새로운 기술들은 우리에게 무엇을 가져다주는가’라는 제목으로 행한 강연에서, 인류의 진화 과정에 관한 무척 흥미롭고 새로운 관점을 제시했다. 그의 설명에 따르면, 인간은 지금껏 새로운 도구나 기술을 손에 넣어 사용하면서 그 이전에 꼭 필요했던 어떤 능력의 일부를 잃어버리기도 했지만, 그 대신 전에는 없던 또 다른 새로운 능력을 얻기도 했다는 것이다. 따라서 어떤 한 가지 능력이 약화되었다는 사실만을 덜컥 보고서, 기술의 발전이 결국 인간을 퇴보시키고 말았다고 섣불리 판단해서는 결코 안 된다. 실제로 길고 긴 인간의 역사를 찬찬히 되짚어 보면, 한 가지 능력의 상실이 오히려 또 다른 능력의 눈부신 발달과 긴밀히 연결된 흥미로운 사례들을 어렵지 않게 찾아볼 수 있다. 미셸 세르는 바로 이러한 주고받음의 변화에 깊이 주목했던 것이다. 그의 통찰은 기술을 바라보는 우리의 시선을 한층 넓고 깊게 넓혀 주는 소중한 실마리가 되어 준다.</p>
          <p class="section-title">④ 손의 발달과 입이 획득한 새로운 기능</p>
          <p>인류가 두 발로 꼿꼿이 서서 걷는 직립 원인으로 서서히 진화해 가는 과정에서, 자유로워진 손은 비로소 온갖 도구를 자유자재로 사용하는 중요한 역할을 맡게 되었다. 손이 자유롭기 전 그 이전에는 입으로 먹이나 물건을 꽉 물어 이리저리 옮기는 일이 꼭 필요했지만, 이제 손을 마음껏 쓸 수 있게 되면서 입이 담당하던 그러한 기능은 쓸 일이 줄어 점차 퇴화하고 말았다. 그러나 그렇다고 해서 입이 단지 아무짝에도 쓸모없는 기관으로 전락해 버린 것은 결코 아니었다. 인간은 그 대신 입으로 말을 하여 생각을 전하는, 전에 없던 놀라운 기능을 새롭게 얻게 되었기 때문이다. 하나의 기능이 서서히 약해져 가는 바로 그동안, 또 다른 기능이 눈부시게 발달한 것이다. 이 흥미로운 사례는 인간의 진화라는 것이 기존의 모든 능력을 고스란히 유지한 채 새로운 능력만 덧붙이는 단순한 과정이 결코 아니라는 점을 잘 보여 준다. 이전의 역할이 줄어드는 자리에서, 더 중요한 새로운 역할이 돋아날 수도 있는 것임을 이 사례는 조용히 일깨워 준다.</p>
          <p class="section-title">⑤ 문자와 인쇄술이 가져온 기억의 변화</p>
          <p>먼 옛날 발명된 문자와 인쇄술 역시 인간이 지닌 능력의 모습을 크게 바꾸어 놓았다. 문자가 널리 쓰이기 전 아주 오랜 옛날에는, 호메로스의 기나긴 서사시를 처음부터 끝까지 줄줄 외워 암송할 수 있을 만큼 엄청나게 많은 내용을 머릿속에 통째로 기억해야만 했다. 그러나 문자가 널리 보급되면서 사람들은 비로소 중요한 정보를 글로 또박또박 기록하고 오래도록 보존할 수 있게 되었다. 그 결과 인간은 방대한 내용을 하나하나 외우던 놀라운 기억력을 어느 정도 잃어버리게 되었지만, 그 대신 모든 것을 반드시 기억해야 한다는 무거운 압박에서는 홀가분하게 벗어날 수 있었다. 그리고 이전에 오로지 암기에만 쏟아붓던 그 소중한 능력을, 이제는 전에 없던 새로운 지식을 생산해 내는 더 값진 일에 활용하게 되었다. 한 번 기록해 둔 내용은 필요할 때마다 언제든 다시 찾아볼 수 있었으므로, 모든 정보를 빠짐없이 머릿속에 저장해 둘 필요가 크게 줄어든 것이다. 이처럼 문자와 인쇄술은 무거운 기억의 부담을 덜어 주면서, 동시에 지식을 다루는 전혀 새로운 길을 활짝 열어 주었다.</p>
          <p class="section-title">⑥ 디지털 기술이 가져온 새로운 능력</p>
          <p>오늘날 우리 곁에서도 이와 꼭 닮은 변화가 똑같이 나타나고 있다. 사람과 기계를 이어 주는 휴먼 인터페이스를 비롯한 여러 디지털 기술이 눈부시게 발달하면서, 인간의 기억력과 계산력은 분명 예전보다 약화되었지만 그 대신 단순한 기억이나 계산을 일일이 떠안아야 하는 무거운 부담에서는 말끔히 벗어나게 되었다. 이제 사람들은 손안의 기기를 이용해 필요한 온갖 정보를 손쉽게 저장해 두고, 머리 아픈 복잡한 계산도 눈 깜짝할 사이에 척척 처리할 수 있다. 그리고 그렇게 아낀 힘으로, 흩어진 정보를 알맞게 통제하고 관리하며 전에 없던 새로운 지식을 창조해 내는 더 고차원적인 능력을 한층 중요하게 활용하게 되었다. 과거에는 많은 것을 하나도 빠짐없이 정확히 외우는 능력이 무엇보다 필요했다면, 이제는 손쉽게 얻은 수많은 정보를 과연 어떻게 정리하고 또 어떻게 활용할 것인가가 훨씬 더 중요해진 것이다. 인간은 이렇게 기술에 일부 기능을 기꺼이 맡김으로써, 정작 자신은 더 가치 있는 다른 활동에 능력을 오롯이 집중할 수 있게 되었다.</p>
          <p class="section-title">⑦ 능력의 상실과 획득으로 보는 인간의 진화</p>
          <p>이처럼 기나긴 인류의 진화 과정과 역사를 차분히 돌아보면, 인간에게는 언제나 잃어버리는 능력이 있는 동시에 그 대신 새롭게 얻는 능력도 함께 있었음을 알 수 있다. 손을 도구를 다루는 데 쓰게 되면서 입은 도리어 말하는 기능을 발달시켰고, 문자와 인쇄술이 세상에 등장하면서 인간은 무거운 암기의 부담에서 벗어나 비로소 새로운 지식을 생산하는 일에 온 힘을 쏟을 수 있었다. 오늘날의 디지털 기술 역시 기억력과 계산력의 약화를 가져오는 대신, 전에 없던 더 창조적인 능력을 마음껏 발휘할 새로운 기회를 우리에게 넉넉히 제공한다. 바로 이러한 관점에서 가만히 들여다보면, 사람들이 걱정하는 디지털 치매 현상은 단순히 인간의 능력이 뒷걸음질 친 저하가 아니라, 인간이 급변하는 새로운 기술 환경에 슬기롭게 적응해 가는 자연스러운 모습일 수도 있다. 그렇다면 우리는 이 현상을 오히려 인간 진화의 또 다른 한 양상으로 너그럽게 받아들여 볼 수도 있지 않겠는가? 잃어버린 능력을 아쉬워하기보다 새롭게 피어난 능력에 눈을 돌릴 때, 변화의 참된 의미가 비로소 또렷하게 드러나기 때문이다.</p>
          <p class="section-title">⑧ 기억하는 뇌에서 정보를 찾는 뇌로</p>
          <p>사람들이 일하는 환경이 크게 달라짐에 따라, 우리 뇌가 지닌 능력 또한 점점 모든 것을 기억하는 뇌가 아니라 필요한 정보를 재빨리 찾아내는 뇌로 서서히 바뀌어 가고 있다. 수많은 사람이 복잡하게 얽혀 살아가는 현대 사회에서는, 한 사람이 홀로 알고 있는 몇몇 정보보다 여러 사람이 저마다 가진 정보를 한데 그러모아 놓은 것이 훨씬 더 크고 값진 가치를 지니기 때문이다. 따라서 오로지 자기 자신만의 정보를 빠짐없이 정확하게 기억해 내는 능력보다, 세상 여기저기에 흩어져 있는 방대한 정보를 효과적으로 찾아내는 능력이 한층 더 중요해지고 있다. 세상의 그 많은 정보를 하나도 빠뜨리지 않고 모조리 외우는 일은 현실적으로 거의 불가능에 가깝지만, 꼭 필요한 바로 그 순간에 알맞은 정보를 척척 찾아내 활용하는 일은 얼마든지 가능하다. 이러한 변화는 결국 우리 사회가 사람들에게 요구하는 능력의 중심축이, 이제 기억에서 검색과 활용 쪽으로 서서히 옮겨 가고 있음을 뚜렷이 보여 준다. 무엇을 아느냐 못지않게 어디에서 무엇을 찾을 수 있느냐가 중요한 시대로 성큼 접어든 셈이다.</p>
          <p class="section-title">⑨ 정보 자체보다 정보를 찾는 방법이 중요하다</p>
          <p>물론 어떤 사람들은, 디지털 기술에 이토록 깊이 의존하는 현상이 결국에는 인간의 소중한 기억 능력을 크게 떨어뜨려 끝내 인류 전체를 퇴보하게 만들고 말 것이라고 목소리를 높여 주장하기도 한다. 그러나 보조적인 기억을 머릿속 대신 디지털 기기로 옮겨 두는 것이, 그 자체로 곧바로 기억 능력의 퇴보를 뜻하는 것은 결코 아니다. 비록 어떤 정보를 하나하나 직접 외우지는 않더라도, 정작 그 정보를 과연 어디에서 찾을 수 있는지는 여전히 또렷이 기억하고 있어야 하기 때문이다. 또한 넘쳐 나는 수많은 정보 가운데에서 정말로 필요한 것만 쏙쏙 골라 찾아내려면, 그 정보가 어디에서 나왔는지 그 원천과 올바른 검색 방법을 미리 잘 알고 있어야만 한다. 그러므로 앞으로는 정보 그 자체를 통째로 기억하는 능력보다, 필요한 정보를 어디에서 어떻게 찾을 수 있는지 그 장소와 방법을 기억하는 능력이 한층 더 중요해질 것이다. 결국 우리가 기억해야 할 대상과 그 쓰임새가 시대에 맞추어 달라지고 있는 셈이며, 기억의 참된 가치 역시 그 변화의 흐름 속에서 새롭게 매겨지고 있는 것이다.</p>
          <p class="section-title">⑩ 디지털 치매는 미래형 인간을 향한 진보인가?</p>
          <p>요컨대 디지털 기술에 기대는 오늘날의 의존 현상은, 기나긴 인간의 진화와 문명의 발전 과정에서 사실 늘 되풀이되어 왔던 기술 의존 현상과 그 본질에서 크게 다르지 않다. 엄청나게 쏟아지는 방대한 정보를 그때그때 처리하고 주어진 업무를 효율적으로 척척 해내야만 하는 복잡한 현대 사회의 환경에 슬기롭게 적응하기 위한, 어찌 보면 불가피한 선택이라고 볼 수 있다. 그 과정에서 비록 기억력이나 계산력의 일부가 다소 약해지더라도, 인간은 그 대신 흩어진 정보를 능숙하게 관리하고 전에 없던 새로운 지식을 창조해 내는 더 값진 능력을 얼마든지 발전시켜 나갈 수 있다. 그러므로 단지 디지털 기기를 가까이 사용한다는 이유 하나만으로, 마치 이상한 종류의 병에라도 걸린 것처럼 지나치게 걱정하고 두려워할 까닭은 조금도 없다. 오히려 이 현상을 인간 진화의 지극히 자연스러운 한 양상이자, 다가올 미래형 인간을 향해 나아가는 또 하나의 진보의 결과로 너그럽게 받아들이자는 것이 바로 글쓴이의 생각이다. 두려움에 사로잡히기보다 변화의 참뜻을 헤아리는 지혜가, 우리에게 진정 필요한 자세인 것이다.</p>

          <p>요즘은 집집마다 참으로 다양한 전기 제품을 사용하며 살아가고 있다. 음식을 신선하게 보관하기 위한 냉장고, 무더운 여름철 실내 온도를 알맞게 조절하기 위한 에어컨, 그 밖에도 세탁기와 텔레비전, 컴퓨터에 이르기까지 우리가 날마다 사용하는 전기 제품은 이루 다 셀 수 없을 만큼 많다. 이처럼 전기는 우리의 생활을 한결 편리하게 해 주는 더없이 소중한 자원이다. 그러나 우리가 쓸 수 있는 에너지는 결코 무한하지 않기 때문에, 사람들은 언제나 전기를 조금이라도 더 절약할 방법은 없을지 깊이 고민하곤 한다. 특히 전기가 제대로 공급되지 않는 가난한 지역에서는, 우리에게는 너무도 평범한 가전제품조차 마음껏 사용하기가 어려운 형편이다. 그렇다면 많은 전기를 쓰지 않고도 생활의 불편을 크게 줄일 수 있는 지혜로운 방법은 정녕 없는 것일까? 바로 이러한 고민에서 출발한 작은 기술이 때로는 수많은 사람들의 삶을 송두리째 바꾸어 놓기도 한다. 거창한 설비나 막대한 비용이 없어도, 작은 발상의 전환 하나가 누군가에게는 더없이 소중한 변화를 가져다줄 수 있는 것이다.</p>
          <p class="section-title">② 적정 기술의 의미와 특징</p>
          <p>한정된 자원을 조금이라도 더 효율적으로 이용하기 위해 오늘날 세계 곳곳에서 다양한 방법이 끊임없이 모색되고 있는데, 그 가운데 하나가 바로 ‘적정 기술’이다. 적정 기술이란 한 공동체가 지닌 문화와 정치, 환경적인 여러 측면들을 두루 종합적으로 고려하여 개발된 기술을 가리켜 일컫는 말이다. 멀리서 들여오는 대신 현지에서 손쉽게 구할 수 있는 재료를 사용하고, 많은 자본을 투자하지 않으면서도 누구나 어렵지 않게 배우고 쓸 수 있다는 커다란 장점을 지닌다. 반드시 복잡한 기계나 값비싼 설비를 번듯하게 갖추어야만 하는 것은 결코 아니다. 무엇보다 중요한 것은 바로 그 지역에 사는 사람들이 실제 생활에서 겪는 절실한 어려움을 실질적으로 해결해 내는 일이다. 이렇듯 주변에서 쉽게 구하는 재료와 간단한 과학 원리를 슬기롭게 이용해 사람들의 생활을 편리하게 만들어 주는 것이 바로 적정 기술이 지닌 뚜렷한 특징이다. 화려한 첨단 기술이 아니더라도, 그 지역의 형편과 사람들의 처지를 따뜻하게 헤아린 기술이야말로 진정으로 값진 기술이라 할 수 있는 셈이다.</p>
          <p class="section-title">③ 전기 없이 사용하는 항아리 냉장고</p>
          <p>적정 기술을 보여 주는 대표적인 예로는, 나이지리아의 한 교사인 모하메드 바 압바가 손수 개발한 ‘항아리 냉장고’가 널리 유명하다. 이 냉장고는 아예 냉장고가 없는 가난한 지역이나, 설령 냉장고가 있더라도 전기가 제대로 공급되지 않아 음식물 보관에 늘 어려움을 겪는 사람들에게 더없이 유용한 발명품이다. 보통 보관 기간이 고작 3일 정도밖에 되지 않는 토마토나 후추와 같은 식품을 이 냉장고에 넣어 두면, 무려 21일 정도까지도 신선한 상태를 그대로 유지하며 보관할 수 있다고 한다. 전기를 사용하는 일반적인 냉장고와는 달리, 오직 주변에서 손쉽게 구할 수 있는 흔한 재료만을 활용한다는 점도 무척 특별하게 다가온다. 아주 간단한 구조만으로 소중한 식품을 훨씬 오래 보관할 수 있도록 돕는, 그야말로 획기적인 기술인 셈이다. 애써 기른 농작물이 미처 다 팔리기도 전에 상해 버리던 안타까운 일이 크게 줄어들면서, 가난한 지역 사람들의 살림살이에도 적지 않은 보탬이 되었다고 한다. 거창한 기계 하나 없이도 사람들의 오랜 고민을 풀어 준, 참으로 지혜로운 발명이라 하지 않을 수 없다.</p>
          <p class="section-title">④ 항아리 냉장고에 숨겨진 과학 원리</p>
          <p>언뜻 신기해 보이는 ‘항아리 냉장고’이지만 그 속에 담긴 원리는 뜻밖에도 참으로 간단하다. 먼저 커다란 항아리 속에 그보다 작은 항아리를 나란히 집어넣는다. 그리고 크고 작은 두 항아리 사이에 생긴 빈 공간을 축축하게 젖은 모래로 빈틈없이 채운 다음, 다시 젖은 헝겊으로 안쪽의 작은 항아리를 덮어 준다. 진흙으로 정성껏 빚어 만든 항아리는 바깥의 뜨거운 열이 안쪽으로 곧장 전달되는 것을 효과적으로 줄여 주는 역할을 한다. 또한 두 항아리 사이를 채운 모래 속의 물은 서서히 증발하면서 그 주변의 열을 야금야금 빼앗아 간다. 바로 이 때문에 안쪽 작은 항아리 속의 온도가 한결 낮아져, 채소나 과일 같은 식품을 아주 오랫동안 신선하게 보관할 수 있는 것이다. 전기를 전혀 공급받지 못하는 곳에서도, 물이 증발할 때 주변의 열을 흡수하는 과학적 원리를 슬기롭게 이용해 냉장 효과를 얻어 내는 셈이다. 우리가 교과서에서 배우는 평범한 과학 원리 하나가, 이렇듯 실제 생활의 어려움을 해결하는 소중한 열쇠가 될 수 있다는 사실이 새삼 놀랍게 다가온다.</p>
          <p class="section-title">⑤ 오염된 물을 정화하는 라이프 스트로</p>
          <p>또 다른 대표적인 적정 기술로는, 더럽게 오염된 물을 그 자리에서 깨끗하게 정화할 수 있는 휴대용 물 정화 장치인 ‘라이프 스트로’를 꼽을 수 있다. 마치 기다란 빨대처럼 생긴 이 라이프 스트로로 오염된 물을 쭉 빨아들이면, 그 물이 안에 들어 있는 간이 정화 장치를 차례로 통과하면서 말끔하게 깨끗해져 안심하고 마실 수 있게 된다. 깨끗한 식수를 좀처럼 구하기 어려운 지역에 사는 사람들에게 그야말로 큰 도움이 되는 고마운 장치이다. 거대하고 값비싼 정수 시설을 따로 설치하지 않더라도, 개인이 저마다 오염된 물을 손수 정화해 마실 수 있도록 알뜰하게 고안되었다는 점에서 그 의미가 무척 깊다. 이처럼 적정 기술은 사람들이 생활 속에서 실제로 겪는 어려움을 세심하게 살피고, 꼭 필요한 기능만을 간단한 도구에 담아 알뜰하게 구현해 낸다. 복잡하고 거창한 기술보다 사용자가 처한 환경을 깊이 고려한 발상이 훨씬 더 중요한 것이다. 오염된 물 때문에 병을 앓던 수많은 사람들이 이 작은 빨대 하나로 건강을 지킬 수 있게 되었다는 점에서, 그 가치는 결코 작다고 할 수 없다.</p>
          <p class="section-title">⑥ 물을 쉽게 운반하는 큐 드럼</p>
          <p>먼 곳까지 힘겹게 가서 식수를 길어 와야만 하는 사람들을 위해 특별히 만든 ‘큐 드럼’이라는 기발한 물통도 있다. 큐 드럼은 마치 자동차 바퀴처럼 둥글고 납작하게 생긴 통으로, 그 한가운데에 동그란 구멍이 뚫려 있는 독특한 모양을 하고 있다. 이 가운데 구멍에 튼튼한 줄을 엮어서 끌기만 하면, 무거운 물통을 데굴데굴 굴리면서 아주 손쉽게 운반할 수 있다. 무겁고 버거운 물통을 번쩍 들어 올리거나 머리에 위태롭게 이고 이동하는 대신, 아예 바닥에 눕혀 데굴데굴 굴리도록 영리하게 만든 것이다. 그 덕분에 힘이 약한 어린아이들도 제법 많은 양의 물을 통에 가득 담아 비교적 손쉽게 이동할 수 있게 되었다. 특별한 동력 장치 하나 없이, 그저 물통의 모양과 운반하는 방식을 조금 바꾸는 것만으로 사람들의 오랜 불편을 크게 덜어 준 것이다. 이는 작고 사소해 보이는 아이디어 하나가 일상생활에 얼마나 큰 도움을 줄 수 있는지를 잘 보여 준다. 날마다 먼 길을 오가며 물을 긷느라 학교조차 가기 어렵던 아이들이, 이 둥근 물통 덕분에 수월하게 물을 나르게 되었다는 점에서 그 의미가 깊다.</p>
          <p class="section-title">⑦ 사막에서도 시원한 서남아시아의 흙벽돌집</p>
          <p>몹시 덥고 메마르게 건조한 서남아시아 지역에서는 예로부터 주변에서 흔히 구할 수 있는 흙을 이용해 만든 흙벽돌로 집을 지어 왔다. 흙으로 단단하게 구워 만든 벽돌을 차곡차곡 쌓아 벽을 아주 두껍게 올리고 천장을 한껏 높인 다음, 집의 창문은 꼭대기 높은 곳에 설치하였다. 또 집 안의 벽에는 호리병처럼 생긴 물병을 적당한 높이에 알맞게 걸어 두었다. 이렇게 지혜롭게 지은 덕분에, 바깥 기온이 무려 40도가 훌쩍 넘는 뜨거운 더위 속에서도 실내 온도를 25도 정도로 제법 시원하게 유지할 수 있었다고 한다. 전기를 펑펑 쓰는 에어컨이 전혀 없어도, 건물을 짓는 재료와 그 구조, 그리고 물이 지닌 성질을 슬기롭게 이용해 사막의 지독한 더위를 효과적으로 줄여 낸 것이다. 주변 환경에 꼭 알맞은 재료를 신중하게 선택하고 집의 형태를 알뜰하게 조절했다는 점에서, 적정 기술이 지닌 뚜렷한 특징을 더없이 잘 보여 주는 사례이다. 오랜 세월에 걸쳐 그 땅의 기후와 더불어 살아온 사람들의 경험과 지혜가, 집 한 채에 고스란히 녹아들어 있는 셈이다.</p>
          <p class="section-title">⑧ 흙벽돌집의 온도를 낮추는 과학적 원리</p>
          <p>사막 한가운데의 서남아시아 흙벽돌집이 그토록 시원할 수 있는 원리 또한 알고 보면 참으로 간단하다. 우선 단열 효과가 뛰어난 두껍고 단단한 흙벽돌이, 바깥의 더운 공기가 머금은 열이 실내로 곧장 들어오는 것을 효과적으로 줄여 준다. 그리고 따뜻하게 데워진 공기가 가벼워져 위로 둥실 떠오르는 성질을 교묘하게 이용해, 더워진 실내 공기가 자연스레 높은 곳에 난 창문으로 솔솔 빠져나가도록 한다. 바로 이때 벽에 나란히 걸어 놓은 호리병 속의 물은 실내에 가득한 열에너지를 야금야금 흡수하면서 서서히 증발하여, 눈에 보이지 않는 수증기가 되어 밖으로 빠져나간다. 물이 증발하면서 그 주변의 열을 고스란히 빼앗아 가는 것이다. 서남아시아 사람들은 이처럼 지혜로운 과학적 원리를 자신들의 생활에 알뜰하게 적용하여, 덥고 건조하기로 이름난 사막의 혹독한 기후 속에서도 비교적 시원하게 지낼 수 있었다. 이는 자연이 지닌 성질을 더없이 잘 활용한, 참으로 지혜로운 방법이라 할 만하다. 자연을 거스르기보다 그 이치를 가만히 따르며 더불어 살아간 조상들의 슬기가 돋보이는 대목이다.</p>
          <p class="section-title">⑨ 추운 지역의 지혜가 담긴 이글루</p>
          <p>지구상에서 가장 춥기로 손꼽히는 극지방에 사는 이누이트들은 ‘이글루’라고 부르는 독특한 집을 지어 생활한다. 이글루를 짓는 재료는 다름 아닌, 그들의 주변에서 아주 손쉽게 구할 수 있는 새하얀 눈이다. 이들은 소복이 쌓인 눈을 차곡차곡 다듬어 네모난 벽돌 모양으로 단단하게 다진 뒤, 그것을 둥글게 쌓아 올려 반원 모양의 아늑한 집을 짓는다. 그런 다음 다 지은 이글루의 안쪽 벽에 물을 골고루 뿌리면, 그 물이 차가운 눈과 얼음을 만나 서서히 얼어붙으면서 열을 바깥으로 방출한다. 이렇게 액체가 고체로 굳으면서 내놓는 열을 어려운 말로 ‘응고열’이라고 부른다. 바로 이 과정에서 이글루 내부의 기온이 조금씩 올라가 실내가 한결 따뜻해진다. 눈은 비록 추운 곳에서 흔하게 얻을 수 있는 하찮은 재료이지만, 이를 슬기롭게 집의 재료로 활용하면 뼈를 에는 혹독한 추위에도 거뜬히 대응할 수 있다. 이글루에는 가혹한 자연환경에 꼭 맞춘 생활의 지혜가 고스란히 담겨 있는 것이다. 가장 흔한 것을 가장 요긴하게 쓸 줄 아는 안목이야말로, 적정 기술이 우리에게 전하는 소중한 가르침인 셈이다.</p>
          <p class="section-title">⑩ 생활 속 과학과 적정 기술의 가치</p>

          <p class="section-title">④ 평균 노동 시간의 두 배를 넘는 근무</p>
          <p>2017년 서울노동권익센터는 서울 지역에서 일하는 택배 기사 500명을 대상으로 그들의 노동 실태를 꼼꼼하게 조사하였다. 그 결과 놀랍게도 택배 기사들의 주당 평균 노동 시간은 무려 74시간에 이르는 것으로 나타났다. 이를 다시 일 년 단위로 꼼꼼히 계산해 보면 자그마치 3,848시간이나 된다. 이는 2017년을 기준으로 경제협력개발기구(OECD) 회원국의 1인당 연간 평균 노동 시간인 1,759시간의 두 배를 훌쩍 넘어서는 엄청난 수치이다. 또한 당시 세계에서도 장시간 노동을 하는 편에 속했던 우리나라의 평균 노동 시간 2,024시간과 견주어 보아도, 무려 1,824시간이나 더 많은 셈이었다. 이러한 냉정한 통계는 택배 기사들이 다른 일반적인 노동자들보다 훨씬 더 긴 시간을 쉼 없이 일하고 있었음을 또렷하게 보여 준다. 그만큼 빠른 배송을 한결같이 유지하기 위해 그들이 짊어진 부담이 참으로 무겁고 컸던 것이다. 숫자로만 보면 무심히 지나칠 수 있는 이 긴 시간이, 실은 한 사람 한 사람의 고단한 하루하루가 켜켜이 쌓여 이루어진 것임을 우리는 잊지 말아야 한다.</p>
          <p class="section-title">⑤ 쉬는 날조차 부족한 택배 기사들의 현실</p>
          <p>택배 기사들은 단지 일하는 시간이 길었을 뿐만 아니라, 마음 놓고 쉬는 날 역시 몹시도 적었다. 2017년에 이루어진 같은 조사에서, 이들은 한 달 평균 무려 25.3일이나 쉬지 않고 근무한 것으로 나타났다. 일요일과 공휴일을 모두 제외하고 나면 한 달 평균 휴무일은 고작 0.152일에 불과할 정도였다. 심지어 일요일과 공휴일을 빼고 나면 따로 쉬는 날이 아예 단 하루도 없다고 답한 사람도, 전체 응답자 가운데 무려 90.6퍼센트나 되었다. 더욱 안타깝게도, 몸이 아픈 날에도 쉬지 못하고 억지로 일을 한 경험이 있다는 응답 역시 74.1퍼센트라는 높은 수치에 이르렀다. 충분한 휴식 하나 없이 이렇게 오랫동안 고되게 일하다 보면, 여유로운 여가 생활을 즐기기는커녕 지친 몸을 회복할 최소한의 시간조차 턱없이 부족해지고 만다. 이처럼 택배 기사들의 소중한 건강은 과도한 노동과 턱없이 부족한 휴식으로 인해 심각하게 위협받고 있었다. 누구나 당연하게 누려야 할 쉼과 회복의 시간마저 이들에게는 좀처럼 허락되지 않는 먼 이야기였던 셈이다.</p>
          <p class="section-title">⑥ 배달 산업의 성장과 제자리걸음인 수입</p>
          <p>흔히 배달 산업의 규모가 쑥쑥 커지면 자연히 그 분야에서 일하는 사람들의 수입도 함께 넉넉하게 늘어날 것이라고 생각하기 쉽다. 그러나 안타깝게도 택배 기사들이 마주한 현실은 결코 그렇지가 못했다. 택배 시장이 지나치게 과열되면서, 업체들 사이에 서로 더 저렴한 가격으로 물건을 배달하려는 치열한 경쟁이 갈수록 심해졌기 때문이다. 그 탓에 배송하는 물건의 수가 제법 많아져도, 정작 택배 기사 개인이 손에 쥐는 수입은 거의 달라지지 않았다. 게다가 택배 기사들은 일을 하는 과정에서 기름값인 유류비를 비롯해 차량 유지비, 통신비 등 여러 가지 비용을 고스란히 자기 주머니에서 직접 부담해야만 한다. 이런저런 비용을 모두 제외하고 나면, 택배 한 건을 배달하여 손에 쥐는 돈은 고작 평균 800원 정도에 지나지 않는다고 한다. 결국 눈부신 배달 산업의 성장이 곧바로 택배 기사 개인의 소득 증가로 고스란히 이어지지는 않았던 것이다. 산업의 화려한 성장 그늘에서, 정작 그 바퀴를 굴리는 사람들은 더 많이 일하고도 넉넉해지지 못하는 모순에 놓여 있었던 셈이다.</p>
          <p class="section-title">⑦ 하루 170개 가까운 물건을 배달해야 하는 이유</p>
          <p>택배 기사들이 과연 하루에 얼마나 많은 물건을 배달해야 하는지를 직접 계산해 보면, 그들이 감당하는 노동의 강도를 한층 더 분명하게 실감할 수 있다. 택배 한 건당 평균 800원을 번다고 가정했을 때, 한 달에 약 350만 원가량을 벌기 위해서는 한 달에 25.3일을 일하며 하루 평균 무려 170개에 가까운 물건을 쉼 없이 배달해야만 한다. 주당 평균 노동 시간이 74시간이므로 이를 주 6일 근무로 다시 나누어 계산해 보면, 결국 하루에 약 12시간씩이나 꼬박 일하는 셈이 된다. 그 긴 시간 동안 한 시간에 평균 14개가 넘는 물건을 쉴 틈 없이 전달해야 하는 것이다. 더구나 물건을 일일이 차에 싣고 먼 거리를 이동하며 물건을 받는 수취인에게 직접 전달하는 번거로운 과정까지 두루 생각하면, 이는 결코 여유롭다고 할 수 없는 몹시 빠듯한 일정이다. 결국 택배 기사들은 조금이라도 더 많이 배달하기 위해, 하루 종일 쉴 새 없이 부지런히 움직여야만 하는 처지인 것이다. 우리가 문 앞에서 받아 드는 상자 하나하나에는, 이렇듯 숨 가쁘게 달려온 누군가의 하루가 담겨 있는 것이다.</p>
          <p class="section-title">⑧ 속도 경쟁의 부담은 누구에게 돌아가는가?</p>

          <p>미처 재활용되지 못한 플라스틱 쓰레기는 대개 뜨거운 불에 태우거나 넓은 매립장에 깊이 묻어 처리한다. 그러나 이러한 처리 방법마저도 제대로 수거된 쓰레기에만 해당하는 이야기일 뿐이다. 끝내 수거되지 못한 플라스틱은 산과 들에 아무렇게나 함부로 버려지거나 땅속에 묻히고, 바람과 물을 따라 이곳저곳 정처 없이 떠돌다가 마침내 드넓은 바다로 흘러 들어가기도 한다. 어렵게 바다에 도착한 플라스틱은 결코 금방 사라지지 않는다. 거센 파도와 뜨거운 햇빛 등의 영향을 끊임없이 받으며 조금씩 깨지고 닳아, 점점 더 작은 조각으로 하염없이 부서져 간다. 그렇게 잘게 작아진 플라스틱 조각은 드넓은 물속을 하염없이 떠다니며 수많은 바다 생물과 마주치게 된다. 그러므로 우리는 사람이 버린 물건이 눈앞에서 사라졌다고 해서, 저 넓은 자연에서도 완전히 없어진 것은 결코 아니라는 사실을 늘 마음 깊이 기억해야 한다. 우리 손을 떠난 쓰레기는 단지 우리 눈에 보이지 않는 먼 곳으로 옮겨 갔을 뿐, 지구 어딘가에서 여전히 그 자리를 지키고 있는 것이다.</p>
          <p class="section-title">⑥ 플라스틱을 먹고 죽어 간 앨버트로스</p>
          <p>미국의 사진작가 크리스 조던은 2009년, 머나먼 북태평양의 미드웨이섬에서 촬영한 충격적인 사진 한 장을 인터넷에 널리 공개했다. 그 사진 속에는 멸종 위기종인 앨버트로스 한 마리가 처참하게 죽어 있었고, 놀랍게도 그 몸속에는 알록달록한 플라스틱 병뚜껑과 잘게 부서진 수많은 조각들이 빈틈없이 가득 차 있었다. 드넓은 바다를 하염없이 떠다니던 플라스틱은 오랜 세월 깨지고 닳으면서 아주 작은 크기로 변했고, 앨버트로스는 그 알록달록한 조각들을 그만 먹이로 착각하여 덥석덥석 삼켰던 것이다. 그러나 안타깝게도 플라스틱은 새의 몸에 꼭 필요한 영양분을 전혀 제공해 주지 못한다. 쓸모없는 플라스틱 조각만을 계속 삼킨 앨버트로스는 정작 먹이를 충분히 섭취하지 못해 끝내 영양실조에 걸리고, 그렇게 서서히 죽어 갔을 것으로 추정된다. 이 한 장의 사진은 우리에게 바다 쓰레기의 위험을 더없이 생생하게 보여 준다. 저 먼바다 외딴섬의 새마저 우리가 버린 플라스틱으로부터 결코 자유롭지 못하다는 사실은, 이 문제가 결코 남의 일이 아님을 뼈아프게 일깨워 준다.</p>
          <p class="section-title">⑦ 플라스틱이 위협하는 붉은바다거북의 생존</p>
          <p>플라스틱은 또 다른 멸종 위기종인 붉은바다거북의 소중한 생존마저 심각하게 위협한다. 산란기를 맞이한 어미 바다거북은 한 번에 많으면 무려 백 개가량의 알을 낳고, 이러한 고된 산란을 무려 일곱 번까지 거듭하기도 한다. 어렵사리 알에서 깨어난 작고 여린 새끼 거북은 모래 구덩이를 간신히 빠져나와 저 넓은 바다를 향해 힘차게 나아간다. 그 뒤로 아주 오랜 시간을 드넓은 바다에서 보내다가, 약 30년이라는 긴 세월이 지나서야 비로소 자신이 태어났던 그 바닷가를 다시 찾아온다. 그러나 안타깝게도 그때까지 무사히 살아 돌아올 확률은 고작 5,000분의 1에 지나지 않는다고 한다. 이처럼 본래부터 생존하기가 몹시 어려운 바다거북에게, 바다를 뒤덮은 플라스틱 쓰레기는 또 하나의 가혹한 위협으로 다가온다. 바다 위를 끝없이 떠다니는 쓰레기가 그러잖아도 낮은 생존 가능성을 더욱더 떨어뜨리고 있는 것이다. 수천만 년을 꿋꿋하게 바다에서 살아온 이 오랜 생명이, 겨우 백 년 남짓한 플라스틱의 역사 앞에서 벼랑 끝으로 내몰리고 있는 셈이다.</p>
          <p class="section-title">⑧ 먹이로 착각한 플라스틱의 치명적인 위험</p>
          <p>바다거북은 드넓은 바다를 떠다니는 플라스틱 조각이나 비닐, 풍선 따위를 자신이 즐겨 먹는 해파리 같은 먹이로 그만 착각하여 덥석 삼키기도 한다. 하지만 이런 쓰레기는 바다거북의 몸속에서 결코 제대로 소화되지 않는다. 먹이를 배불리 먹었다고 생각하더라도 정작 몸에 꼭 필요한 영양분은 충분히 얻지 못하고, 도리어 쓰레기와 관련된 온갖 해로운 화학 물질이 몸속에 차곡차곡 쌓일 수도 있다. 그 결과 바다거북은 이상한 행동을 보이거나 껍질이 유난히 약한 알을 낳기도 하며, 증상이 심한 경우에는 끝내 안타까운 죽음에 이르기도 한다. 결국 플라스틱은 바다거북 한 마리의 건강만을 해치는 데 그치지 않고, 그 다음 세대의 생존에까지 깊은 영향을 미칠 수 있는 것이다. 우리가 아무 생각 없이 무심코 버린 비닐이나 풍선 하나가, 저 넓은 바다에서는 소중한 생명을 위협하는 위험천만한 물건으로 뒤바뀌고 마는 셈이다. 우리에게는 그저 한순간의 쓰레기일 뿐이지만, 바다 생물에게는 생사를 가르는 치명적인 덫이 되고 마는 것이다.</p>
          <p class="section-title">⑨ 제주 바다에서 발견된 뱀머리돌고래의 죽음</p>
          <p>플라스틱으로 말미암아 커다란 피해를 입은 해양 동물의 안타까운 사례는 결코 먼 해외에만 있는 것이 아니다. 2012년 8월, 제주 김녕 앞바다에서는 아직 어린 암컷 뱀머리돌고래 한 마리가 싸늘하게 바닷가로 떠밀려 왔다. 사람들이 그 죽음의 정확한 원인을 알아보기 위해 조심스레 부검한 결과, 돌고래는 몸의 근육량과 지방층이 턱없이 부족한 안타까운 상태였다. 게다가 잔뜩 팽창한 위 속에서는 뜻밖에도 비닐과 어지럽게 엉킨 끈 뭉치까지 함께 발견되었다. 이 가엾은 돌고래는 바로 이런 이물질 때문에 먹이를 제대로 먹지 못했고, 결국 극심한 영양 부족에 시달리다 죽음에 이른 것으로 설명된다. 이처럼 바다에 함부로 버려진 플라스틱은 멀리 떨어진 남의 나라 동물만의 문제가 결코 아니라, 바로 우리나라 바다의 소중한 생명까지도 심각하게 위협하고 있다. 제주 앞바다에서 발견된 이 돌고래는 그 서글픈 사실을 똑똑히 보여 주는 안타까운 사례이다. 우리가 날마다 쓰고 버리는 플라스틱이 돌고 돌아, 결국 우리 곁의 바다로 되돌아오고 있다는 분명한 경고인 셈이다.</p>
          <p class="section-title">⑩ 인간의 건강까지 위협하는 플라스틱 오염</p>
          <p>오늘날 바다를 뒤덮은 해양 쓰레기의 무려 60에서 80퍼센트가량을 다름 아닌 플라스틱이 차지하고 있다고 한다. 이 플라스틱 쓰레기는 잘게 부서져 힘없는 새와 바다거북, 돌고래에게 치명적인 피해를 주고, 아름다운 자연 경관마저 흉하게 해쳐 소중한 관광 산업에도 적지 않은 손실을 끼친다. 때로는 바다를 바쁘게 오가는 선박의 안전까지 위협하기도 한다. 더구나 눈에 잘 보이지도 않을 만큼 아주 작은 미세 플라스틱은 물고기의 내장이나 굴 속으로 슬그머니 들어가, 결국 돌고 돌아 우리의 밥상 위에까지 버젓이 오를 수 있다. 플라스틱 오염이 마침내 우리 사람의 건강까지 은근히 위협하고 있는 셈이다. 물론 생활 속에서 플라스틱을 단 하나도 쓰지 않고 완전히 멀리하기란 무척 어려운 일이지만, 그래도 우리는 줄일 수 있는 만큼 최대한 줄여 나가야 한다. 특히 잠깐 쓰고 미련 없이 버리는 일회용 플라스틱 제품만큼은 되도록 선택하지 않으려는 성숙한 태도가 무엇보다 절실히 필요하다. 작은 불편을 감수하는 한 사람 한 사람의 실천이 모일 때, 지구와 바다는 건강한 숨을 되찾을 수 있을 것이다.</p>

          <p class="section-title">③ 인공조명이 인간의 건강에 미치는 영향</p>
          <p>우리는 원하든 원하지 않든 간에, 알게 모르게 수많은 인공 빛에 둘러싸인 채로 하루하루를 살아간다. 밤늦게까지 환하게 켜진 실내의 전등과 거리 곳곳의 조명은, 마땅히 어둠이 고요하게 찾아와야 할 시간에도 우리 주변을 쉴 새 없이 밝히고 있다. 그 결과 참으로 많은 사람이 자기 자신도 전혀 의식하지 못하는 사이에 이러한 빛의 영향을 고스란히 받아, 몸의 생체 리듬이 어지럽게 흐트러지고 그와 관련된 여러 가지 증상을 겪을 수 있다. 특히 밤에 과도한 인공 빛에 지속적으로 노출되는 현상과 우리의 건강 문제 사이의 관계를 면밀히 살펴본 여러 연구도 이미 이루어져 있다. 그중 일부 연구에서는 밤에 인공조명에 노출되는 정도와 유방암이 발생할 위험 사이에 서로 관련성이 있다는 사실이 조심스럽게 보고되기도 하였다. 연구자들은 밝은 빛이 몸에 이로운 멜라토닌의 합성을 억제한다는 바로 그 점을, 이러한 현상을 일으키는 가능한 원인 가운데 하나로 눈여겨 살펴보고 있다. 우리가 무심코 켜 두는 밤의 불빛 하나가, 알고 보면 우리 몸의 건강과 이렇게 깊숙이 맞닿아 있는 셈이다.</p>
          <p class="section-title">④ 호수의 생태계까지 바꾸는 빛 공해</p>
          <p>지나친 빛이 일으키는 빛 공해는 결코 우리 인간에게만 영향을 미치는 문제가 아니다. 자연 속의 수많은 동물 또한 저마다 자연의 낮과 밤의 흐름에 맞추어 활동하고 성장하기 때문에, 밤새 이어지는 지나친 야간 조명은 생태계 전체에 뜻밖의 변화를 불러일으킬 수 있다. 예를 들어 고요한 호숫가에 밤새도록 환한 인공조명을 켜 놓으면, 물고기의 중요한 먹이가 되는 동물성 플랑크톤이 제대로 성장하지 못하는 일이 벌어질 수 있다. 그와 동시에 물속에서 녹조류가 지나치게 늘어나 맑던 호수의 수질이 점점 나빠지는 현상도 함께 나타나곤 한다. 이처럼 물속의 작은 생물과 물의 상태가 조금씩 달라지면, 결국 그곳에 터를 잡고 살아가는 물고기의 생태에도 적지 않은 나쁜 영향을 미치게 된다. 상황이 심한 경우에는 애꿎은 물고기가 끝내 죽음에 이르고 마는 안타까운 일도 벌어질 수 있다. 이처럼 저 멀리 육지에서 무심코 켠 불빛 하나가, 깊은 물속 생명체의 삶까지도 송두리째 바꾸어 놓을 수 있는 것이다. 작은 생물에서 시작된 변화가 결국 호수 전체의 생태계를 뒤흔들 수 있음을 잊어서는 안 된다.</p>
          <p class="section-title">⑤ 인공 빛 때문에 길을 잃는 벌과 철새</p>
          <p>어두운 밤을 환하게 밝히는 인공 빛은 드넓은 하늘을 자유롭게 날아다니는 생물에게도 뜻밖의 위험이 될 수 있다. 많은 곤충학자는 밤의 인공조명이 부지런한 벌의 비행 능력을 심각하게 방해한다고 한목소리로 주장한다. 또한 조류를 연구하는 학자들은 머나먼 길을 떠나는 철새가 밤하늘을 수놓은 인공 빛을 반짝이는 별빛으로 그만 착각하여, 본래 가야 할 이동 경로에서 크게 벗어날 수 있다고 설명한다. 그렇게 길을 잃고 헤매는 철새는 미처 피하지 못하고 도심의 높은 건물에 세차게 부딪혀 그만 목숨을 잃기도 한다. 결국 벌과 철새에게 빛이란 단순히 주변을 환하게 밝혀 주는 고마운 존재가 아니라, 그들의 움직임과 나아갈 방향을 판단하는 데 결정적인 영향을 주는 중요한 요소인 셈이다. 사람이 그저 편리하게 생활하려고 아무 생각 없이 설치한 조명이, 정작 다른 생물에게는 큰 혼란을 일으키는 뜻밖의 원인이 될 수 있는 것이다. 그러므로 밤하늘이 밝아지면 밝아질수록, 우리는 함께 살아가는 동물의 안전까지도 마땅히 함께 생각해야 한다.</p>
          <p class="section-title">⑥ 밤에도 빛을 받으면 씨를 맺지 못하는 식물</p>
          <p>한자리에 뿌리내려 살아가는 식물 역시 빛을 받는 시간의 길이에 따라 민감하게 영향을 받는다. 물론 식물에게 따사로운 햇빛은 건강한 성장에 반드시 필요한 소중한 것이지만, 그렇다고 해서 깊은 밤까지 계속해서 인공 빛을 쬐는 것이 언제나 반드시 좋기만 한 것은 결코 아니다. 어떤 식물은 밤낮없이 하루 종일 빛에 노출되면, 아름다운 꽃이 피어나거나 소중한 씨가 맺히는 자연스러운 과정에 그만 문제가 생기고 만다. 특히 빛에 유난히 민감한 들깨는 밤에도 오랫동안 인공조명을 받게 되면, 꽃망울과 씨를 제대로 맺지 못한 채 애꿎은 키만 멀대같이 훌쩍 자라 버릴 수 있다. 겉으로 보기에는 줄기가 더없이 잘 자라는 것처럼 보여도, 정작 땀 흘려 수확해야 할 소중한 씨앗은 도리어 줄어들고 마는 것이다. 따라서 식물의 건강하고 알찬 성장을 위해서는 빛의 밝기뿐만 아니라, 빛을 받는 시간의 길이 또한 무척 중요하다. 이처럼 자연스러운 어둠은 조용히 자라나는 식물에게도 반드시 필요한 소중한 조건인 셈이다.</p>
          <p class="section-title">⑦ 농작물의 수확량까지 줄이는 야간 조명</p>
          <p>밤의 인공 빛이 애써 기른 농작물에 미치는 빛 공해의 영향은, 실제 연구 결과에서도 뚜렷하게 확인해 볼 수 있다. 농촌진흥청 산하 국립식량과학원에서 수행한 한 연구에 따르면, 밤에 6에서 10럭스 정도의 그리 밝지 않은 빛에 오랜 기간 장기간 노출되었을 때 여러 작물의 소중한 수확량이 눈에 띄게 줄어들었다고 한다. 구체적으로 살펴보면 벼는 16퍼센트, 보리는 20퍼센트, 그리고 들깨는 무려 94퍼센트나 줄어든 것으로 제시되었다. 특히 들깨의 감소 폭이 유난히 대단히 커서, 밤의 야간 조명이 작물의 종류에 따라 서로 전혀 다른 영향을 미칠 수 있음을 분명하게 보여 준다. 이처럼 농작물은 단순히 밝은 환경에서 오래도록 자란다고 해서 결코 더 많은 열매를 맺는 것이 아니다. 오히려 빛과 어둠이 번갈아 찾아오는 자연스러운 주기가 조금만 어긋나도, 소중한 농업 생산에까지 뜻밖의 큰 피해가 생길 수 있다는 중요한 사실을 우리는 똑똑히 알 수 있다. 밤의 어둠은 작물에게도 꼭 필요한 휴식이자, 알찬 열매를 맺기 위한 소중한 준비의 시간인 셈이다.</p>
          <p class="section-title">⑧ 문명의 상징인 인공조명에 숨겨진 문제</p>
          <p>이처럼 지나친 인공 빛은 우리가 미처 알아차리지 못하는 사이에, 사람은 물론이고 동물과 식물 모두에게 조용히 영향을 미치고 있다. 우선 사람에게는 편안한 수면을 방해하고 몸의 생체 리듬을 흐트러뜨리는 문제를 일으킬 수 있고, 동물에게는 가야 할 길을 찾는 이동과 먹이를 구하는 활동에 큰 혼란을 가져올 수 있다. 또한 식물에게는 꽃과 씨를 맺는 소중한 과정에 영향을 주어, 결국에는 애써 기른 농작물의 수확량까지도 눈에 띄게 줄일 수 있다. 어두운 밤을 대낮처럼 환하게 밝히는 인공조명은 오랜 세월 동안 눈부신 문명의 발전을 상징하는 자랑스러운 존재로 여겨져 왔다. 그러나 그 화려하고 눈부신 겉모습의 이면에는, 정작 수많은 생명과 자연환경이 고스란히 감당해야 할 무거운 문제가 조용히 숨어 있다. 결국 빛 공해는 단순히 밤하늘의 아름다운 별이 보이지 않는 작은 불편함에 그치는 것이 결코 아니다. 그것은 우리의 소중한 건강과 생태계, 나아가 식량 생산에까지 깊숙이 연결되는 중대한 문제인 것이다.</p>
          <p class="section-title">⑨ 빛 공해를 줄이기 위한 사회의 노력</p>
          <p>빛 공해가 우리에게 일으키는 여러 문제가 결코 가볍지 않기 때문에, 오늘날 세계 여러 나라에서는 넘쳐 나는 인공 빛을 알맞게 규제하기 위한 다양한 대책을 앞다투어 내놓고 있다. 깊은 밤에 굳이 필요하지 않은 불필요한 조명을 과감하게 줄이거나, 빛이 사방으로 지나치게 멀리 퍼져 나가지 않도록 꼼꼼하게 관리하려는 노력도 바로 그러한 대책 가운데 하나이다. 그러나 안타깝게도 이러한 규제만으로 세상의 모든 빛 공해를 말끔하게 막아 낼 수는 없는 노릇이다. 도시의 밝은 밤을 너무도 당연한 것으로 여기는 사람들의 생활 방식이 지금 그대로라면, 과도한 조명은 앞으로도 변함없이 계속 사용될 수밖에 없기 때문이다. 그러므로 우리는 현대 문명이 애써 만들어 낸 눈부신 편리함이, 오히려 우리의 소중한 건강과 자연에 깊은 상처를 남기고 있는 지금의 상황을 차분히 돌아보아야 한다. 과연 건강하게 살아가고 싶은 우리는 지금 이 순간 어떤 현명한 선택을 해야 할까? 무엇보다 꼭 필요한 빛과 굳이 필요하지 않은 빛을 슬기롭게 구별하는 태도부터 갖추는 것이 중요하다.</p>
          <p class="section-title">⑩ 자연의 시계대로 살아가기 위한 작은 실천</p>
          <p>이 넓은 지구상에 더불어 살아가는 모든 생명체는, 자연이 정해 준 낮과 밤의 흐름에 알맞게 맞추어 살아갈 때 비로소 건강을 온전히 유지하기가 쉬워진다. 우리 인간도 다른 수많은 동물이나 식물과 조금도 다르지 않게, 이 지구의 자연환경 속에서 함께 숨 쉬며 살아가는 하나의 생명체일 뿐이다. 그러므로 우리 역시 지나치게 과도한 인공 빛에서 과감하게 벗어나, 어둠이 반드시 필요한 고요한 시간을 마땅히 존중할 줄 알아야 한다. 밤에도 환하게 밝혀 생활하는 달콤한 편리함을 마음껏 누리면서, 그로 인해 생겨나는 피해를 애써 못 본 척 외면해서는 결코 안 될 것이다. 온 세상이 먼저 알아서 바뀌기를 그저 하염없이 기다리기보다는, 바로 나 자신이 지금 당장 할 수 있는 작은 일부터 하나하나 시작하는 것이 무엇보다 중요하다. 아무도 사용하지 않는 빈방의 전등을 부지런히 끄고, 굳이 꼭 필요하지 않은 조명을 조금씩 줄여 나가는 그 작은 실천 하나하나가 큰 도움이 된다. 자연이 정해 준 시계대로 건강하게 살아가기 위해, 지금 이 순간 불필요한 불부터 다 함께 끄자.</p>

          <p>예로부터 밥상머리 교육의 첫 출발은 바로 올바른 젓가락질을 가르치는 일에서 비롯되었다. 예전에는 젓가락질을 제대로 하지 못하면 집안에서 제대로 배우지 못했다는 흉을 들을 만큼, 어른들이 자녀에게 무척 엄격하게 가르치곤 하였다. 그래서 그 사람이 젓가락을 사용하는 모습만 가만히 보아도, 과연 밥상머리 교육을 제대로 잘 받고 자랐는지를 능히 판단할 수 있다고 여겼던 것이다. 그런데 요즘에는 젓가락질이 몹시 서툴러 음식을 자꾸 흘리거나 불편하게 먹는 어린이도 적지 않게 많아졌다. 그러자 여러 기업들은 이런 어린이들을 위해 젓가락의 모양을 다루기 쉽게 바꾸어, 누구나 손쉽게 사용할 수 있도록 만든 이른바 기능성 젓가락을 앞다투어 개발해 내놓았다. 하지만 첫 번째 글의 글쓴이는 오직 편리함만을 좇는 이런 제품이, 도리어 젓가락에 깊이 숨어 있는 소중한 힘을 미처 깨닫지 못하게 만드는 어설픈 장난처럼 보인다며 날카롭게 비판한다. 당장 편하게 쓰자고 손에 쥐여 준 도구가, 오히려 아이가 스스로 익힐 수 있는 소중한 배움의 기회를 빼앗아 버릴 수도 있다는 것이다.</p>
          <p class="section-title">② 젓가락질에 숨겨진 뇌 자극과 성장의 효과</p>
          <p>본래 젓가락이란 복잡하고 특별한 장치 하나 없이, 그저 가느다란 막대기 두 개만 있으면 충분한 참으로 단순한 도구였다. 그러나 젓가락으로 음식을 집어 올리는 동작은 겉보기에만 단순할 뿐, 실제로는 여러 손가락과 우리의 뇌가 끊임없이 긴밀하게 협력해야만 하는 꽤나 복잡한 활동이다. 젓가락질을 올바르고 정확하게 해내려면, 손가락마다 자리한 수많은 관절과 근육을 무척 정확하고 섬세하게 움직여야 한다. 또한 작고 미끄러운 음식을 집어 올릴 때는, 손가락에 과연 힘을 얼마나 주어야 하는지까지도 세심하게 조절할 줄 알아야 한다. 첫 번째 글에서는 바로 이러한 미세하고 섬세한 움직임이 우리의 뇌를 끊임없이 자극하여, 한창 자라나는 유아와 어린이의 성장 발육에도 무척 유익하다고 자세히 설명한다. 그저 단순한 식사 도구처럼 보이기만 하던 젓가락에, 사실은 이토록 매우 중요한 기능이 조용히 숨어 있다는 것이다. 날마다 무심코 반복하는 이 작은 동작 하나가, 알고 보면 아이의 두뇌와 손을 함께 단련시키는 훌륭한 훈련이 되는 셈이다.</p>
          <p class="section-title">③ 쇠젓가락으로 발달한 정교한 손놀림</p>
          <p>특히 우리나라에서 아주 흔히 사용하는 쇠젓가락은 제법 무거운 데다 가늘기까지 해서, 다른 재질로 만든 젓가락보다 한층 더 정교하고 힘 있는 손놀림을 필요로 한다. 이 쇠젓가락은 음식에 힘을 정확하게 전달할 수 있어서, 음식을 알맞게 찢거나 자르고 한데 모으는 데에 유난히 뛰어난 성능을 발휘한다. 그래서 우리나라 사람들은 젓가락만으로 질긴 김치를 쭉쭉 찢어 내고, 심지어 손으로도 집기 어려운 아주 작고 동그란 콩알까지도 거뜬히 집어 낸다. 또한 여러 장이 착 달라붙은 깻잎절임을 한 장씩 조심스레 떼어 내는 모습은, 마치 한 편의 묘기처럼 신기하게 보이기도 한다. 이런 섬세한 동작에는 상당히 높은 집중력과, 음식의 무게를 미세하게 알아차리는 예민한 손의 촉각이 반드시 필요하다. 그래서 첫 번째 글은 우리나라 사람들의 능숙한 젓가락질이, 오랜 세월의 연습으로 비로소 익힌 달인의 기술에 가깝다고 높이 평가한다. 어릴 적부터 날마다 밥상 앞에서 되풀이해 온 이 소박한 연습이, 어느새 누구도 쉽게 흉내 낼 수 없는 놀라운 솜씨로 다져진 것이다.</p>
          <p class="section-title">④ 젓가락질과 우리나라의 뛰어난 손기술</p>
          <p>첫 번째 글은 이처럼 정교한 젓가락질이 우리나라 사람들의 유난히 뛰어난 손기술과도 깊은 관련이 있다고 자신 있게 주장한다. 그 근거로는 양궁과 핸드볼, 골프, 야구처럼 섬세한 손의 움직임이 무엇보다 중요한 여러 운동 경기에서, 우리나라 선수들이 꾸준히 좋은 성적을 거두는 일이 제시된다. 또한 국제 기능 올림픽 대회에서 거둔 빛나는 우승이나, 오차가 거의 없는 정밀한 용접 기술을 바탕으로 눈부시게 발전한 조선 기술까지도 젓가락질과 자연스레 연결 지어 설명한다. 글쓴이는 젓가락을 능숙하게 다루며 오랫동안 길러진 섬세한 손놀림과 높은 집중력이, 결국 이렇듯 여러 분야에서의 값진 성취로 고스란히 이어졌다고 보는 것이다. 다만 이러한 설명은 어디까지나 첫 번째 글쓴이의 주장일 뿐, 운동이나 산업에서 거둔 눈부신 성과가 오직 젓가락질 하나만으로 모두 결정된다는 뜻은 결코 아니다. 하나의 성취에는 수많은 요인이 함께 얽혀 있으므로, 우리는 이러한 주장을 흥미롭게 받아들이되 지나치게 단순하게 믿어 버리지 않는 신중한 태도가 필요하다.</p>
          <p class="section-title">⑤ 젓가락질을 잘해야 식사 예절도 좋은 것일까?</p>
          <p>한편 두 번째 글은 우리가 젓가락질을 둘러싸고 흔히 품어 온 생각에 대해 조심스레 근본적인 질문을 던진다. 식사를 할 때마다 서툰 젓가락질 때문에 어른들에게 번번이 꾸중을 듣는 어떤 친구는, 젓가락질을 조금 못하더라도 밥만 맛있게 잘 먹으면 되는 것 아니냐며 억울하게 하소연한다. 그렇다면 과연 반드시 정석에 가까운 올바른 방법으로만 젓가락을 쥐어야만 밥을 제대로 잘 먹을 수 있는 것일까? 또한 표준적인 젓가락질을 그대로 따르지 않는 것이, 곧바로 식사 예절에 어긋나는 잘못된 행동이라고 할 수 있을까? 물론 한국인들이 무거운 쇠젓가락만으로 질긴 김치를 척척 찢어 내는 솜씨는, 이웃한 중국이나 일본과 견주어 보아도 단연 뛰어난 수준이라고 할 만하다. 그러나 두 번째 글은 이처럼 젓가락을 잘 다루는 능력과 젓가락질에 관한 규범은 서로 분명히 구별하여 생각하자고 차분히 제안한다. 즉 음식을 능숙하게 다루는 것과 정해진 방식대로 젓가락을 쥐는 것은 전혀 다른 문제일 수 있으니, 둘을 뒤섞어 함부로 평가해서는 안 된다는 것이다.</p>
          <p class="section-title">⑥ 젓가락질에는 완벽한 표준이 있을까?</p>
          <p>음식 문화를 깊이 연구한 여러 전문가들의 설명에 따르면, 사실 젓가락을 쥐는 방법에 완벽하게 딱 정해진 유일한 표준이 있는 것은 결코 아니라고 한다. 다만 한국과 중국, 일본 세 나라에서 공통적으로 두루 발견되는 보편적인 사용법 정도는 분명히 존재한다. 그 방법은 먼저 위쪽 젓가락을 집게손가락과 가운뎃손가락 사이에 알맞게 끼우고, 넷째 손가락과 새끼손가락으로는 아래쪽 젓가락을 가만히 받쳐 주는 것이다. 그런 다음 엄지손가락으로 두 젓가락을 가볍게 지그시 눌러 가며 자유자재로 움직이는 방식이다. 두 번째 글은 저 멀리 중국에서 처음 시작되어 무려 약 3천 년이라는 긴 역사를 면면히 이어 온 젓가락을, 수많은 사람들이 오랫동안 요리조리 쥐어 보고 다듬으며 자연스레 이런 편리한 방법을 익혔을 것이라고 본다. 따라서 그 누군가 한 사람을 가장 올바른 유일한 정석의 저작권자로 내세우기는 참으로 어려운 노릇이다. 오랜 세월 수많은 사람의 손을 거치며 다듬어진 방법에, 누가 옳고 누가 그르다는 잣대를 함부로 들이대기는 쉽지 않은 일인 셈이다.</p>
          <p class="section-title">⑦ 젓가락질을 평가하는 문화는 어디서 왔을까?</p>
          <p>두 번째 글은 심지어 국제표준화기구인 ISO에조차 공식적으로 등재되지 않은 젓가락 사용법을 두고, 누가 더 잘하고 누가 못하는지를 시시콜콜 따지는 태도가 과연 언제부터 시작되었는지를 흥미롭게 되묻는다. 한국인의 젓가락과 숟가락 문화를 오랜 세월에 걸쳐 깊이 연구해 온 주영하 한국학중앙연구원 민속학 교수는, 젓가락질을 얼마나 잘하는지를 까다롭게 따지는 이러한 풍속이 본래 이웃 나라 일본에서 우리나라로 들어온 것이라고 설명한다. 그의 견해에 따르면, 우리 한국의 전통적인 식생활에서는 오히려 젓가락보다 숟가락이 훨씬 더 중요한 식사 도구였다고 한다. 지금이야 우리가 젓가락질을 식사 예절의 기본처럼 당연하게 여기지만, 사실 옛날에는 모든 사람이 젓가락을 똑같이 중요하게 생각했던 것은 결코 아니라는 뜻이다. 따라서 우리에게 더없이 익숙한 식사 예절이라 할지라도, 그 속에 담긴 역사적 배경을 한 번쯤 찬찬히 살펴볼 필요가 있다. 당연하게만 여겨 온 관습도 그 뿌리를 거슬러 올라가 보면, 뜻밖에 짧은 역사나 낯선 유래를 지니고 있는 경우가 적지 않기 때문이다.</p>
          <p class="section-title">⑧ 조선 시대에는 숟가락이 더 중요한 식사 도구였다</p>
          <p>조선 시대에 밥과 국을 중심으로 소박하게 식사하던 평범한 일반 백성에게, 젓가락은 사실 꼭 있어야만 하는 필수적인 도구가 결코 아니었다. 오히려 잘게 썬 갖가지 밑반찬을 여러 가지 차려 놓고 먹던 양반 계층에서나, 젓가락을 귀하게 갖추어 두고 쓰는 경우가 많았다고 한다. 실제로 당시의 생활을 생생하게 담은 옛 풍속화를 들여다보면, 평범한 백성들이 오직 숟가락만을 들고서 밥을 먹는 정겨운 모습이 고스란히 나타난다. 두 번째 글에 따르면, 당시 번듯한 젓가락을 따로 가진 사람은 양반가의 남성 외에는 무척 드물었고, 심지어 양반가의 여성들조차도 숟가락 하나만으로 식사를 해결하는 경우가 적지 않았다고 한다. 이는 오늘날처럼 젓가락질을 마치 모든 사람의 필수적인 식사 능력인 양 여기는 우리의 생각과는 사뭇 다른 낯선 풍경이다. 이러한 흥미로운 역사적 사례는, 우리의 식사 문화가 기나긴 시대의 흐름에 따라 끊임없이 달라져 왔음을 뚜렷이 보여 준다. 오늘 우리가 당연하게 여기는 밥상 위의 풍경 역시, 머나먼 훗날에는 또 다른 모습으로 바뀌어 있을지도 모를 일이다.</p>
          <p class="section-title">⑨ 일본의 젓가락 교육과 한국 식사 문화의 변화</p>
          <p>이와는 반대로, 식사할 때 숟가락을 거의 사용하지 않는 이웃 나라 일본에서는 젓가락을 다루는 사용법이 한층 더 정교하고 세밀하게 발달했다고 두 번째 글은 설명한다. 어린아이들에게 올바른 젓가락질을 체계적으로 가르치는 교육 프로그램을 일찍이 만들고, 요즘 젊은 부모들 사이에서 널리 쓰이는 편리한 젓가락 교정기를 처음으로 발명해 낸 곳도 다름 아닌 일본이라고 한다. 주영하 교수는 저 아픈 일제 강점기 이후로 조선 땅에 밖에서 사 먹는 외식업과 근대적인 위생 관념이 점차 발달하면서, 비로소 젓가락이 새삼 크게 주목받게 되었을 것이라고 조심스레 추정한다. 이러한 설명을 가만히 따라가 보면, 오늘날 젓가락질을 유난히 엄격하게 평가하는 사회적 분위기는 아주 오래전부터 변함없이 꾸준히 이어져 내려온 고유한 전통이라기보다는, 여러 사회적 변화와 이웃 나라와의 활발한 교류 속에서 비교적 최근에 새롭게 형성된 문화일 수 있다. 우리가 오래된 전통이라 굳게 믿는 것 가운데에도, 실은 생각보다 가까운 과거에 자리 잡은 것이 적지 않다는 사실을 다시금 일깨워 주는 대목이다.</p>
          <p class="section-title">⑩ 젓가락질의 가치와 식사 예절을 바라보는 두 시선</p>

          <p class="section-title">⑥ 별빛을 잃어버린 도시의 밤하늘</p>
          <p>세상의 모든 생물체가 건강하고 온전하게 살아가려면, 밝은 햇빛뿐만 아니라 고요한 어둠과 깊은 쉼의 시간 또한 반드시 필요하다. 낮 동안 부지런히 활동한 뒤에는 밤에 편안히 푹 쉬어야만, 비로소 다시 새로운 생기를 되찾을 수 있기 때문이다. 하지만 안타깝게도 오늘날 도시의 밤은 점점 더 깊은 어둠을 잃어 가고 있다. 수많은 건물의 조명과 번쩍이는 네온사인, 그리고 끝없이 늘어선 가로등의 불빛이 하늘로 높이 퍼지고 이리저리 반사되어, 마침내 밤하늘마저 온통 붉게 물들여 버린다. 그 환한 불빛 속에서는 반짝이는 별을 단 한 점이라도 찾아보기가 여간 어려운 일이 아니다. 그래서 글쓴이는 이렇듯 별이 보이지 않는 밤을 두고 ‘별 볼 일이 없는 밤’이라고 재치 있게 표현한다. 그렇다면 잠시 방 안의 전등 스위치를 가만히 끄고, 고요한 어둠 속에서 차분히 기다려 보면 어떨까? 인공 빛에 가려 있던 수많은 별빛이 하나둘 제 모습을 드러내며, 어느새 우리가 까맣게 잊고 지내던 자연 그대로의 밤을 조용히 되찾아 줄지도 모른다.</p>
          <p class="section-title">⑦ 도시의 아름다움을 만드는 야간 경관 조명</p>
          <p>그렇다고 해서 도시의 야간 조명이 오직 해롭고 나쁜 역할만 하는 것은 결코 아니다. 조금 다른 관점에서 가만히 들여다보면, 조명은 오히려 도시의 모습을 한층 아름답게 꾸미고 전에 없던 새로운 매력을 만들어 내는 훌륭한 수단이 될 수도 있다. 높은 건물과 번화한 거리, 강을 가로지르는 교량 등 도시의 전체적인 경관을 통째로 바꾸려면 아주 오랜 시간과 많은 비용이 반드시 필요하다. 그러나 이와 달리 야간 경관은 알맞은 조명을 적절히 설치하는 것만으로도, 비교적 짧은 기간 안에 우리가 원하는 분위기를 손쉽게 연출해 낼 수 있다. 커다란 구조물을 애써 새로 세우지 않고도 그 도시만의 고유한 특징을 또렷이 드러낼 수 있다는 점에서, 야간 조명은 그 활용 가치가 참으로 크다. 바로 이런 까닭에 오늘날 세계 여러 도시에서는 야간 조명을 관광 정책의 더없이 중요한 전략으로 여기고 있다. 밤의 아름다움이 수많은 관광객을 불러들이는 소중한 자원이 될 수 있기 때문이다. 낮에는 평범해 보이던 거리도 밤이 되어 알맞은 조명을 입으면, 다른 분위기의 매력적인 공간으로 태어날 수 있는 것이다.</p>
          <p class="section-title">⑧ 프랑스 리옹을 변화시킨 야간 조명 정책</p>

          <p>남북한의 벌어진 언어 차이를 줄이기 위한 첫 번째 방법은, 바로 남북이 함께 쓸 수 있는 공통 국어사전을 편찬하는 일이다. 현재 남한과 북한에는 각각 서로 다른 국어사전이 따로따로 존재하고 있다. 국어사전은 사람들이 어떤 단어의 정확한 뜻과 올바른 쓰임을 확인하고자 할 때, 믿고 기준으로 삼는 더없이 소중한 자료다. 그런데 만약 통일이 이루어진 이후에도 서로 다른 사전만을 계속 따로 사용한다면, 똑같은 단어를 두고도 그 뜻을 저마다 다르게 이해하거나 알맞은 표현을 고르는 데에 적지 않은 혼란을 겪을 수 있다. 바로 그럴 때 남북이 함께 쓰는 공통 국어사전은 이런 불편을 크게 줄이는 데 든든한 도움을 줄 수 있다. 여기서 무엇보다 중요한 것은 어느 한쪽의 말만 옳다고 성급하게 정하는 일이 결코 아니라, 남북한에서 실제로 두루 사용하는 어휘를 함께 꼼꼼히 살피고 서로가 이해할 수 있도록 차근차근 정리해 가는 일이다. 한쪽의 말을 억지로 밀어붙이기보다 서로의 말을 존중하며 다가설 때, 비로소 진정한 하나의 언어로 어우러질 수 있기 때문이다.</p>
