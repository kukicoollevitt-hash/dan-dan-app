<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교재 전체 현황 관리</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 1500px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      padding: 36px 40px 50px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 3px solid #d97706;
    }
    .header h1 { font-size: 28px; color: #1f2937; margin-bottom: 6px; }
    .header p { color: #6b7280; font-size: 14px; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #d97706; color: #fff;
      padding: 10px 18px; border-radius: 10px;
      text-decoration: none; font-weight: 600;
      transition: all 0.2s; margin-bottom: 24px;
      font-size: 14px;
    }
    .back-btn:hover { background: #b45309; transform: translateX(-2px); }

    /* 필터 + 통계 */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 12px;
      justify-content: space-between; align-items: center;
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
      border: 1px solid #fed7aa;
      padding: 16px 20px; border-radius: 12px;
      margin-bottom: 20px;
    }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 14px; border: 1.5px solid #fed7aa;
      background: #fff; color: #9a3412; border-radius: 8px;
      cursor: pointer; font-size: 13px; font-weight: 600;
      transition: all 0.15s;
    }
    .filter-btn:hover { background: #ffedd5; }
    .filter-btn.active { background: #d97706; color: #fff; border-color: #d97706; }
    .stats {
      display: flex; gap: 16px; font-size: 13px; color: #92400e;
    }
    .stats b { color: #7c2d12; font-size: 15px; }

    /* 리스트 */
    .order-list { display: flex; flex-direction: column; gap: 10px; }
    .order-row {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;
      overflow: hidden; transition: box-shadow 0.2s;
    }
    .order-row:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .order-summary {
      display: grid;
      grid-template-columns: 34px 50px 1.6fr 1.4fr 1fr 1fr 1fr auto;
      gap: 12px; align-items: center;
      padding: 14px 18px; cursor: pointer;
      transition: background 0.15s;
    }
    .col-check {
      display: flex; align-items: center; justify-content: center;
    }
    .col-check input[type="checkbox"] {
      width: 18px; height: 18px;
      cursor: pointer; accent-color: #d97706;
    }
    .order-summary:hover { background: #fff7ed; }
    .order-row.expanded .order-summary { background: #fff7ed; border-bottom: 1px solid #fed7aa; }
    .col-idx { font-size: 12px; color: #6b7280; }
    .col-branch { font-weight: 700; color: #1f2937; }
    .col-name   { color: #374151; }
    .col-amount { font-weight: 700; color: #c2410c; }
    .col-date   { font-size: 12px; color: #6b7280; }
    .col-badges { display: inline-flex; gap: 4px; flex-wrap: wrap; }
    .badge {
      padding: 2px 7px; border-radius: 999px;
      font-size: 11px; font-weight: 700;
      border: 1.5px solid #d1d5db; color: #6b7280; background: #f9fafb;
    }
    .badge.on { background: #dcfce7; color: #166534; border-color: #86efac; }

    .toggle-icon {
      width: 24px; height: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      color: #9ca3af; font-size: 14px;
      transition: transform 0.2s;
    }
    .order-row.expanded .toggle-icon { transform: rotate(90deg); color: #d97706; }

    /* 상세 영역 */
    .order-detail { display: none; padding: 16px 22px 18px; }
    .order-row.expanded .order-detail { display: block; }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 24px;
      margin-bottom: 14px;
    }
    .detail-item { font-size: 13px; }
    .detail-item .label { color: #6b7280; font-weight: 600; margin-right: 6px; }
    .detail-item .value { color: #111827; }
    .detail-item.full { grid-column: 1 / -1; }

    .items-table {
      width: 100%; border-collapse: collapse;
      margin-top: 10px; font-size: 13px;
    }
    .items-table th, .items-table td {
      padding: 8px 10px; border-bottom: 1px solid #f3f4f6;
      text-align: left;
    }
    .items-table th { background: #fff7ed; font-weight: 700; color: #7c2d12; }
    .items-table tfoot td {
      font-weight: 700; color: #b45309;
      border-top: 2px solid #d97706; border-bottom: none;
      padding-top: 10px;
    }

    /* 상태 토글 버튼 */
    .status-actions {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin-top: 14px; padding-top: 14px;
      border-top: 1px dashed #fed7aa;
    }
    .status-btn {
      padding: 7px 14px; border-radius: 8px;
      border: 1.5px solid #d1d5db; background: #fff; color: #6b7280;
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.15s;
    }
    .status-btn:hover { background: #f9fafb; }
    .status-btn.on {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff; border-color: #15803d;
      box-shadow: 0 2px 6px rgba(22, 163, 74, 0.3);
    }
    .status-btn.on::before { content: "✓"; font-weight: 800; }
    .status-time { font-size: 11px; color: #6b7280; margin-left: 4px; }

    .empty {
      padding: 60px 20px; text-align: center; color: #9ca3af; font-size: 14px;
      background: #f9fafb; border-radius: 12px;
    }

    /* 일괄 삭제 버튼 */
    .bulk-actions {
      display: flex; align-items: center; gap: 10px;
    }
    .delete-btn {
      padding: 9px 18px; border-radius: 8px;
      background: #dc2626; color: #fff; border: none;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .delete-btn:hover:not(:disabled) { background: #b91c1c; }
    .delete-btn:disabled {
      background: #d1d5db; color: #6b7280; cursor: not-allowed;
    }
    .selected-count {
      font-size: 13px; color: #92400e; font-weight: 600;
    }
    .select-all-wrap {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: #4b5563; cursor: pointer;
      user-select: none;
    }
    .select-all-wrap input { accent-color: #d97706; width: 16px; height: 16px; }

    @media (max-width: 980px) {
      .order-summary {
        grid-template-columns: 34px 50px 1fr 1fr auto;
        font-size: 13px;
      }
      .col-name, .col-date { display: none; }
      .detail-grid { grid-template-columns: 1fr; }
    }

    /* ========== 📦 잔여 재고 섹션 ========== */
    .inv-section {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 2px solid #fcd34d;
      border-radius: 14px;
      padding: 22px 26px 26px;
      margin-bottom: 26px;
    }
    .inv-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1.5px dashed #fcd34d;
    }
    .inv-title { font-size: 18px; font-weight: 800; color: #7c2d12; }
    .inv-meta { font-size: 12px; color: #92400e; margin-top: 4px; }
    .inv-actions { display: flex; gap: 8px; align-items: center; }
    .inv-btn {
      padding: 9px 18px; border-radius: 9px;
      border: none; cursor: pointer;
      font-size: 13px; font-weight: 700;
      transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .inv-btn.edit {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }
    .inv-btn.edit:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4); }
    .inv-btn.save {
      background: linear-gradient(135deg, #d97706, #b45309);
      color: #fff;
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.3);
    }
    .inv-btn.save:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4); }
    .inv-btn.cancel {
      background: #fff; color: #4b5563;
      border: 1.5px solid #d1d5db;
    }
    .inv-btn.cancel:hover { background: #f9fafb; border-color: #9ca3af; }
    .inv-btn:disabled {
      background: #d1d5db; color: #6b7280; cursor: not-allowed;
      box-shadow: none; transform: none;
    }
    .inv-mode-chip {
      font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .inv-mode-chip.view { color: #4b5563; background: #f3f4f6; border: 1px solid #d1d5db; }
    .inv-mode-chip.edit { color: #1e40af; background: #dbeafe; border: 1px solid #93c5fd; }
    .inv-dirty-chip {
      font-size: 12px; font-weight: 700; color: #b91c1c;
      background: #fee2e2; border: 1px solid #fca5a5;
      padding: 4px 10px; border-radius: 999px;
      display: none;
    }
    .inv-dirty-chip.show { display: inline-flex; }

    .inv-category {
      background: #fff;
      border: 1px solid #fde68a;
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .inv-category:last-child { margin-bottom: 0; }
    .inv-category-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px;
      background: #fffbeb;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }
    .inv-category-head:hover { background: #fef3c7; }
    .inv-category-title {
      font-size: 15px; font-weight: 800; color: #92400e;
      display: flex; align-items: center; gap: 8px;
    }
    .inv-category-stats {
      font-size: 12px; color: #b45309; font-weight: 600;
      display: flex; align-items: center; gap: 10px;
    }
    .inv-category-toggle {
      font-size: 14px; color: #d97706;
      transition: transform 0.25s;
      display: inline-block;
    }
    .inv-category.open .inv-category-toggle { transform: rotate(90deg); }
    .inv-category-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      padding: 0 18px;
    }
    .inv-category.open .inv-category-body {
      max-height: 1200px;
      padding: 14px 18px 16px;
      border-top: 1px dashed #fde68a;
    }
    .inv-row {
      display: grid;
      grid-template-columns: 110px repeat(12, minmax(56px, 1fr));
      gap: 8px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed #fef3c7;
    }
    .inv-row:last-child { border-bottom: none; }
    .inv-row-label {
      font-size: 13px; font-weight: 700; color: #374151;
    }
    .inv-cell {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
    }
    .inv-cell-no {
      font-size: 11px; color: #9ca3af; font-weight: 600;
    }
    .inv-input {
      width: 100%;
      padding: 6px 4px;
      border: 1.5px solid #fde68a;
      border-radius: 6px;
      text-align: center;
      font-size: 13px; font-weight: 700;
      color: #1f2937; background: #fffbeb;
      transition: all 0.15s;
    }
    .inv-input:focus {
      outline: none; border-color: #d97706;
      background: #fff; box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.18);
    }
    .inv-input.dirty { border-color: #ef4444; background: #fef2f2; }
    .inv-input:disabled, .inv-input[readonly] {
      background: #f9fafb; color: #1f2937;
      border-color: #e5e7eb; cursor: default;
      -moz-appearance: textfield;
    }
    .inv-input:disabled::-webkit-inner-spin-button,
    .inv-input[readonly]::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    .inv-input.zero { color: #9ca3af; }

    /* 헤더 행 (1호 ~ 12호) */
    .inv-row.head .inv-row-label { color: transparent; }
    .inv-row.head .inv-cell-no { font-size: 12px; color: #d97706; font-weight: 700; }

    /* 한국사: 2칸짜리 가로 레이아웃 */
    .inv-row.kh {
      grid-template-columns: 110px repeat(2, minmax(120px, 1fr));
    }

    @media (max-width: 1200px) {
      .inv-row, .inv-row.head {
        grid-template-columns: 90px repeat(6, minmax(56px, 1fr));
      }
      .inv-row.kh { grid-template-columns: 110px repeat(2, 1fr); }
    }

    /* ========== 📦 차감 확인 모달 ========== */
    .dec-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center;
      z-index: 9999;
      animation: decFade 0.15s ease;
    }
    .dec-modal-overlay.show { display: flex; }
    @keyframes decFade { from { opacity: 0; } to { opacity: 1; } }
    .dec-modal {
      background: #fff;
      border-radius: 18px;
      padding: 28px 30px 24px;
      width: min(720px, 92vw);
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      animation: decPop 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes decPop {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .dec-title {
      font-size: 20px; font-weight: 800; color: #92400e;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px;
    }
    .dec-subtitle { font-size: 13px; color: #6b7280; margin-bottom: 18px; }
    .dec-note {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-left: 4px solid #d97706;
      padding: 12px 14px; border-radius: 8px;
      font-size: 13px; color: #7c2d12; font-weight: 600;
      margin-bottom: 18px;
    }
    .dec-table {
      width: 100%; border-collapse: collapse;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .dec-table th, .dec-table td {
      padding: 9px 10px;
      border-bottom: 1px solid #f3f4f6;
      text-align: left;
    }
    .dec-table th {
      background: #fff7ed; color: #7c2d12;
      font-weight: 700; font-size: 12px;
    }
    .dec-table td .qty-before { color: #6b7280; }
    .dec-table td .qty-arrow { color: #d97706; margin: 0 6px; }
    .dec-table td .qty-after { font-weight: 800; color: #15803d; }
    .dec-table td .qty-after.neg { color: #b91c1c; }
    .dec-table td .qty-delta { color: #b91c1c; font-weight: 700; }
    .dec-unmapped {
      background: #fef2f2; border: 1px solid #fca5a5;
      border-radius: 8px; padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 12px; color: #991b1b;
    }
    .dec-unmapped strong { display: block; margin-bottom: 4px; }
    .dec-actions {
      display: flex; justify-content: flex-end; gap: 10px;
      padding-top: 14px;
      border-top: 1px solid #f3f4f6;
    }
    .dec-btn {
      padding: 10px 22px; border-radius: 9px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 0.15s;
      border: none;
    }
    .dec-btn.cancel {
      background: #fff; color: #4b5563; border: 1.5px solid #d1d5db;
    }
    .dec-btn.cancel:hover { background: #f9fafb; }
    .dec-btn.confirm {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #fff;
      box-shadow: 0 3px 10px rgba(22, 163, 74, 0.35);
    }
    .dec-btn.confirm:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(22, 163, 74, 0.45); }
    .dec-btn.confirm:disabled {
      background: #d1d5db; color: #6b7280; cursor: not-allowed;
      box-shadow: none; transform: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/super/dashboard" class="back-btn">← 슈퍼관리자 대시보드로</a>

    <div class="header">
      <h1>📚 교재 전체 현황 관리</h1>
      <p>모든 센터의 교재 신청을 한 곳에서 일괄 관리합니다</p>
    </div>

    <!-- 📦 잔여 재고 섹션 (실시간 재계산으로 대체되어 숨김 처리 2026-08-09) -->
    <div class="inv-section" style="display:none;">
      <div class="inv-header">
        <div>
          <div class="inv-title">📦 교재별 잔여 재고</div>
          <div class="inv-meta" id="invMeta">불러오는 중…</div>
        </div>
        <div class="inv-actions">
          <span class="inv-mode-chip view" id="invModeChip">👁 보기 모드</span>
          <span class="inv-dirty-chip" id="invDirtyChip">● 변경됨</span>
          <button class="inv-btn edit" id="invEditBtn" onclick="enterInventoryEdit()">✏️ 전체 수정</button>
          <button class="inv-btn cancel" id="invCancelBtn" onclick="cancelInventoryEdit()" style="display:none;">✖ 취소</button>
          <button class="inv-btn save" id="invSaveBtn" onclick="saveInventory()" style="display:none;" disabled>💾 저장</button>
        </div>
      </div>
      <div id="invBody"><div style="padding:30px 0;text-align:center;color:#92400e;">📡 불러오는 중…</div></div>
    </div>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="pending">미처리</button>
        <button class="filter-btn" data-filter="payment">결제확인 대기</button>
        <button class="filter-btn" data-filter="order">주문확인 대기</button>
        <button class="filter-btn" data-filter="delivery">배송 대기</button>
        <button class="filter-btn" data-filter="done">완료</button>
      </div>
      <div class="stats" id="stats">불러오는 중…</div>
    </div>

    <div class="toolbar" style="background: #f9fafb; border-color: #e5e7eb;">
      <label class="select-all-wrap">
        <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
        전체 선택
      </label>
      <div class="bulk-actions">
        <span class="selected-count" id="selectedCount">선택: 0건</span>
        <button class="delete-btn" id="deleteSelectedBtn" onclick="deleteSelected()" disabled>
          🗑 선택 삭제
        </button>
      </div>
    </div>

    <div class="order-list" id="orderList">
      <div class="empty">불러오는 중…</div>
    </div>
  </div>

  <!-- 📦 차감 확인 모달 -->
  <div class="dec-modal-overlay" id="decModalOverlay" onclick="closeDecModal(event)">
    <div class="dec-modal" onclick="event.stopPropagation()">
      <div class="dec-title">📦 재고 차감 확인</div>
      <div class="dec-subtitle" id="decSubtitle">주문 정보를 불러오는 중…</div>
      <div class="dec-note">
        ⚠️ <strong>아래 항목들이 인벤토리에서 차감됩니다.</strong> 차감 후에는 자동 복원되지 않으니 한 번 더 확인해주세요.
      </div>
      <div id="decBody">
        <div style="padding:30px 0;text-align:center;color:#6b7280;">불러오는 중…</div>
      </div>
      <div class="dec-actions">
        <button class="dec-btn cancel" onclick="closeDecModal()">취소</button>
        <button class="dec-btn confirm" id="decConfirmBtn" onclick="confirmDecrement()" disabled>✓ 차감하고 배송 완료</button>
      </div>
    </div>
  </div>

  <script>
    let allOrders = [];
    let currentFilter = 'all';

    function fmtMoney(n) {
      return (n || 0).toLocaleString('ko-KR') + '원';
    }
    function fmtDate(d) {
      try { return new Date(d).toLocaleString('ko-KR'); } catch { return ''; }
    }
    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    function isFullyDone(o) {
      return !!(o.paymentConfirmed && o.orderConfirmed && o.deliveryCompleted);
    }
    function isFullyPending(o) {
      return !o.paymentConfirmed && !o.orderConfirmed && !o.deliveryCompleted;
    }

    function applyFilter(orders) {
      switch (currentFilter) {
        case 'pending':  return orders.filter(isFullyPending);
        case 'payment':  return orders.filter(o => !o.paymentConfirmed);
        case 'order':    return orders.filter(o => o.paymentConfirmed && !o.orderConfirmed);
        case 'delivery': return orders.filter(o => o.orderConfirmed && !o.deliveryCompleted);
        case 'done':     return orders.filter(isFullyDone);
        case 'all':
        default:         return orders;
      }
    }

    function renderStats() {
      const total = allOrders.length;
      const pay  = allOrders.filter(o => o.paymentConfirmed).length;
      const ord  = allOrders.filter(o => o.orderConfirmed).length;
      const ship = allOrders.filter(o => o.deliveryCompleted).length;
      const amt  = allOrders.reduce((s, o) => s + (o.totalAmount || 0), 0);
      document.getElementById('stats').innerHTML =
        `총 <b>${total}</b>건 · 결제확인 <b>${pay}</b> · 주문확인 <b>${ord}</b> · 배송완료 <b>${ship}</b> · 금액합계 <b>${fmtMoney(amt)}</b>`;
    }

    function renderList() {
      const list = applyFilter(allOrders);
      const el = document.getElementById('orderList');
      if (!list.length) {
        el.innerHTML = '<div class="empty">조건에 맞는 주문이 없습니다.</div>';
        return;
      }
      el.innerHTML = list.map((o, i) => renderRow(o, i + 1)).join('');
    }

    function renderRow(o, idx) {
      const itemsRows = (o.items || []).map(it => {
        let issueLabel;
        if (it.bookType === '브레인비평') issueLabel = `${it.issueNumber}월호`;
        else if (it.bookType === '특강교재') issueLabel = '기본+심화 통합';
        else if (it.bookType === '문해어휘학습장') issueLabel = `${it.issueNumber}권`;
        else issueLabel = `${it.issueNumber}호`;
        return `
        <tr>
          <td>${escapeHtml(it.bookType)}</td>
          <td>${escapeHtml(it.series)}</td>
          <td>${issueLabel}</td>
          <td>${it.quantity}권</td>
          <td>${fmtMoney(it.unitPrice)}</td>
          <td>${fmtMoney((it.quantity || 0) * (it.unitPrice || 0))}</td>
        </tr>
        `;
      }).join('');
      const vat = Math.round((o.totalAmount || 0) * 0.1);
      const grand = (o.totalAmount || 0) + vat;
      const badges = [
        `<span class="badge ${o.paymentConfirmed ? 'on' : ''}">결제</span>`,
        `<span class="badge ${o.orderConfirmed ? 'on' : ''}">주문</span>`,
        `<span class="badge ${o.deliveryCompleted ? 'on' : ''}">배송</span>`
      ].join('');

      return `
        <div class="order-row" data-id="${o._id}">
          <div class="order-summary" onclick="toggleRow('${o._id}', event)">
            <div class="col-check" onclick="event.stopPropagation()">
              <input type="checkbox" class="row-check" data-id="${o._id}" onchange="updateSelectedCount()">
            </div>
            <div class="col-idx">#${idx}</div>
            <div class="col-branch">${escapeHtml(o.branchName)}</div>
            <div class="col-name">${escapeHtml(o.applicantName)} · ${escapeHtml(o.phone)}</div>
            <div class="col-amount">${fmtMoney(grand)}</div>
            <div class="col-badges">${badges}</div>
            <div class="col-date">${fmtDate(o.createdAt)}</div>
            <div class="toggle-icon">▶</div>
          </div>
          <div class="order-detail">
            <div class="detail-grid">
              <div class="detail-item"><span class="label">센터:</span><span class="value">${escapeHtml(o.branchName)}</span></div>
              <div class="detail-item"><span class="label">신청자:</span><span class="value">${escapeHtml(o.applicantName)}</span></div>
              <div class="detail-item"><span class="label">연락처:</span><span class="value">${escapeHtml(o.phone)}</span></div>
              <div class="detail-item"><span class="label">우편번호:</span><span class="value">${escapeHtml(o.postcode || '-')}</span></div>
              <div class="detail-item full"><span class="label">주소:</span><span class="value">${escapeHtml(o.address || '-')}${o.addressDetail ? ' ' + escapeHtml(o.addressDetail) : ''}</span></div>
              ${o.memo ? `<div class="detail-item full"><span class="label">메모:</span><span class="value">${escapeHtml(o.memo)}</span></div>` : ''}
            </div>
            <table class="items-table">
              <thead>
                <tr><th>교재 종류</th><th>시리즈</th><th>호수</th><th>권수</th><th>단가</th><th>소계</th></tr>
              </thead>
              <tbody>${itemsRows}</tbody>
              <tfoot>
                <tr><td colspan="5">공급가액</td><td>${fmtMoney(o.totalAmount)}</td></tr>
                <tr><td colspan="5">부가세(10%)</td><td>${fmtMoney(vat)}</td></tr>
                <tr><td colspan="5">총액 (VAT 포함, ${o.totalQuantity || 0}권)</td><td>${fmtMoney(grand)}</td></tr>
              </tfoot>
            </table>
            <div class="status-actions">
              <button class="status-btn ${o.paymentConfirmed ? 'on' : ''}"
                      onclick="toggleStatus('${o._id}', 'paymentConfirmed', ${!o.paymentConfirmed})">
                결제 완료 ${o.paymentConfirmedAt ? `<span class="status-time">(${fmtDate(o.paymentConfirmedAt)})</span>` : ''}
              </button>
              <button class="status-btn ${o.orderConfirmed ? 'on' : ''}"
                      onclick="toggleStatus('${o._id}', 'orderConfirmed', ${!o.orderConfirmed})">
                주문 확인 ${o.orderConfirmedAt ? `<span class="status-time">(${fmtDate(o.orderConfirmedAt)})</span>` : ''}
              </button>
              <button class="status-btn ${o.deliveryCompleted ? 'on' : ''}"
                      onclick="handleDeliveryClick('${o._id}', ${o.deliveryCompleted ? 'true' : 'false'}, ${o.inventoryDecrementedAt ? 'true' : 'false'})">
                배송 완료 ${o.deliveryCompletedAt ? `<span class="status-time">(${fmtDate(o.deliveryCompletedAt)})</span>` : ''}${o.inventoryDecrementedAt ? ' 📦' : ''}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleRow(id, evt) {
      // 체크박스 클릭은 무시 (stopPropagation으로 이미 처리)
      const row = document.querySelector(`.order-row[data-id="${id}"]`);
      if (row) row.classList.toggle('expanded');
    }

    // 체크박스 동작
    function updateSelectedCount() {
      const checked = document.querySelectorAll('.row-check:checked');
      const count = checked.length;
      document.getElementById('selectedCount').textContent = `선택: ${count}건`;
      document.getElementById('deleteSelectedBtn').disabled = (count === 0);
      // 전체선택 체크박스 상태 동기화
      const all = document.querySelectorAll('.row-check');
      const selectAllBox = document.getElementById('selectAll');
      if (all.length > 0 && count === all.length) {
        selectAllBox.checked = true;
        selectAllBox.indeterminate = false;
      } else if (count === 0) {
        selectAllBox.checked = false;
        selectAllBox.indeterminate = false;
      } else {
        selectAllBox.checked = false;
        selectAllBox.indeterminate = true;
      }
    }

    function toggleSelectAll(box) {
      document.querySelectorAll('.row-check').forEach(cb => { cb.checked = box.checked; });
      updateSelectedCount();
    }

    async function deleteSelected() {
      const ids = Array.from(document.querySelectorAll('.row-check:checked')).map(cb => cb.dataset.id);
      if (ids.length === 0) return;
      if (!confirm(`선택한 ${ids.length}건의 교재 주문을 영구 삭제하시겠습니까?\n\n⚠️ 삭제 후 복원되지 않습니다.`)) return;
      try {
        const res = await fetch('/api/textbook-orders/bulk-delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids })
        });
        const data = await res.json();
        if (!data.ok) {
          alert('삭제 실패: ' + (data.message || ''));
          return;
        }
        alert(`${data.deleted || 0}건 삭제 완료`);
        // 로컬 데이터에서도 제거 후 재렌더
        allOrders = allOrders.filter(o => !ids.includes(o._id));
        document.getElementById('selectAll').checked = false;
        renderStats();
        renderList();
        updateSelectedCount();
      } catch (err) {
        console.error(err);
        alert('통신 오류: ' + err.message);
      }
    }

    async function toggleStatus(id, field, newValue) {
      event && event.stopPropagation && event.stopPropagation();
      try {
        const res = await fetch(`/api/textbook-orders/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ field, value: newValue })
        });
        const data = await res.json();
        if (!data.ok) {
          alert('상태 변경 실패: ' + (data.message || ''));
          return;
        }
        // 로컬 갱신
        const idx = allOrders.findIndex(o => o._id === id);
        if (idx >= 0) {
          allOrders[idx] = data.order;
          // 확장 상태 보존
          const wasExpanded = document.querySelector(`.order-row[data-id="${id}"]`)?.classList.contains('expanded');
          renderStats();
          renderList();
          if (wasExpanded) {
            const r = document.querySelector(`.order-row[data-id="${id}"]`);
            if (r) r.classList.add('expanded');
          }
        }
      } catch (err) {
        console.error(err);
        alert('통신 오류: ' + err.message);
      }
    }

    async function loadOrders() {
      try {
        const res = await fetch('/api/textbook-orders/all', { credentials: 'include' });
        const data = await res.json();
        // API 응답이 { ok, orders } 또는 배열 둘 다 처리
        const orders = Array.isArray(data) ? data : (data && Array.isArray(data.orders) ? data.orders : []);
        allOrders = orders;
        // 최신순 정렬
        allOrders.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        renderStats();
        renderList();
      } catch (err) {
        console.error(err);
        document.getElementById('orderList').innerHTML =
          '<div class="empty">불러오는 중 오류가 발생했습니다: ' + escapeHtml(err.message) + '</div>';
      }
    }

    // 필터 버튼 이벤트
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderList();
      });
    });

    loadOrders();

    // ============ 📦 잔여 재고 ============
    const INV_CATEGORIES = [
      {
        key: 'brain', title: '📚 브레인',
        series: [
          { key: 'on',   label: '브레인온' },
          { key: 'up',   label: '브레인업' },
          { key: 'fit',  label: '브레인핏' },
          { key: 'deep', label: '브레인딥' }
        ],
        issues: 12, unitLabel: '호'
      },
      {
        key: 'creative', title: '📖 창작독서',
        series: [
          { key: 'on',  label: '창작독서온' },
          { key: 'up',  label: '창작독서업' },
          { key: 'fit', label: '창작독서핏' }
        ],
        issues: 12, unitLabel: '호'
      },
      {
        key: 'daily', title: '📰 매일비평',
        series: [
          { key: 'on',   label: '매일비평온' },
          { key: 'up',   label: '매일비평업' },
          { key: 'fit',  label: '매일비평핏' },
          { key: 'deep', label: '매일비평딥' }
        ],
        issues: 12, unitLabel: '월호'
      }
    ];
    let _invServerState = {}; // 서버 마지막 상태
    let _invHasDirty = false;
    let _invEditMode = false;

    function renderInventory(quantities, meta) {
      const body = document.getElementById('invBody');
      const html = [];
      const categoryStats = (catKey) => {
        let total = 0;
        for (const k in quantities) {
          if (k.startsWith(catKey + '_')) total += Number(quantities[k] || 0);
        }
        return total;
      };
      for (const cat of INV_CATEGORIES) {
        const total = categoryStats(cat.key);
        html.push(`<div class="inv-category" data-cat="${cat.key}">`);
        html.push(`<div class="inv-category-head" onclick="toggleInvCategory('${cat.key}')">`);
        html.push(`<div class="inv-category-title"><span class="inv-category-toggle">▶</span>${cat.title}</div>`);
        html.push(`<div class="inv-category-stats"><span>${cat.series.length}종 × ${cat.issues}${cat.unitLabel}</span><span>총 <b id="invCatTotal_${cat.key}">${total.toLocaleString()}</b> 부</span></div>`);
        html.push('</div>');
        html.push('<div class="inv-category-body">');
        // 헤더 행 (1호~12호)
        html.push('<div class="inv-row head"><div class="inv-row-label"></div>');
        for (let i = 1; i <= cat.issues; i++) {
          html.push(`<div class="inv-cell"><div class="inv-cell-no">${i}${cat.unitLabel}</div></div>`);
        }
        html.push('</div>');
        // 시리즈별 행
        for (const s of cat.series) {
          html.push(`<div class="inv-row"><div class="inv-row-label">${s.label}</div>`);
          for (let i = 1; i <= cat.issues; i++) {
            const k = `${cat.key}_${s.key}_${i}`;
            const v = Number(quantities[k] || 0);
            const zeroClass = v === 0 ? ' zero' : '';
            html.push(`<div class="inv-cell"><input class="inv-input${zeroClass}" type="number" min="0" data-k="${k}" data-cat="${cat.key}" value="${v}" disabled></div>`);
          }
          html.push('</div>');
        }
        html.push('</div></div>');
      }
      // 한국사: 기본/심화
      const khTotal = Number(quantities.korhistory_basic || 0) + Number(quantities.korhistory_advanced || 0);
      html.push('<div class="inv-category" data-cat="korhistory">');
      html.push(`<div class="inv-category-head" onclick="toggleInvCategory('korhistory')">`);
      html.push(`<div class="inv-category-title"><span class="inv-category-toggle">▶</span>🇰🇷 한국사교재</div>`);
      html.push(`<div class="inv-category-stats"><span>기본 / 심화</span><span>총 <b id="invCatTotal_korhistory">${khTotal.toLocaleString()}</b> 부</span></div>`);
      html.push('</div>');
      html.push('<div class="inv-category-body">');
      html.push('<div class="inv-row kh"><div class="inv-row-label"></div>');
      html.push('<div class="inv-cell"><div class="inv-cell-no">기본</div></div>');
      html.push('<div class="inv-cell"><div class="inv-cell-no">심화</div></div>');
      html.push('</div>');
      html.push('<div class="inv-row kh"><div class="inv-row-label">한국사</div>');
      const basicV = Number(quantities.korhistory_basic || 0);
      const advV = Number(quantities.korhistory_advanced || 0);
      html.push(`<div class="inv-cell"><input class="inv-input${basicV===0?' zero':''}" type="number" min="0" data-k="korhistory_basic" data-cat="korhistory" value="${basicV}" disabled></div>`);
      html.push(`<div class="inv-cell"><input class="inv-input${advV===0?' zero':''}" type="number" min="0" data-k="korhistory_advanced" data-cat="korhistory" value="${advV}" disabled></div>`);
      html.push('</div>');
      html.push('</div></div>');

      // 문해어휘학습장: 1~4권
      const vwbVals = [1,2,3,4].map(n => Number(quantities['vocabwb_'+n] || 0));
      const vwbTotal = vwbVals.reduce((s,n)=>s+n,0);
      html.push('<div class="inv-category" data-cat="vocabwb">');
      html.push(`<div class="inv-category-head" onclick="toggleInvCategory('vocabwb')">`);
      html.push(`<div class="inv-category-title"><span class="inv-category-toggle">▶</span>📘 문해어휘학습장</div>`);
      html.push(`<div class="inv-category-stats"><span>4권 분할</span><span>총 <b id="invCatTotal_vocabwb">${vwbTotal.toLocaleString()}</b> 부</span></div>`);
      html.push('</div>');
      html.push('<div class="inv-category-body">');
      html.push('<div class="inv-row" style="grid-template-columns: 110px repeat(4, 1fr);"><div class="inv-row-label"></div>');
      ['1권','2권','3권','4권'].forEach(label => {
        html.push(`<div class="inv-cell"><div class="inv-cell-no">${label}</div></div>`);
      });
      html.push('</div>');
      html.push('<div class="inv-row" style="grid-template-columns: 110px repeat(4, 1fr);"><div class="inv-row-label">어휘학습장</div>');
      [1,2,3,4].forEach((n, i) => {
        const v = vwbVals[i];
        html.push(`<div class="inv-cell"><input class="inv-input${v===0?' zero':''}" type="number" min="0" data-k="vocabwb_${n}" data-cat="vocabwb" value="${v}" disabled></div>`);
      });
      html.push('</div>');
      html.push('</div></div>');

      body.innerHTML = html.join('');

      // 입력 변경 시 dirty + 카테고리 합계 실시간 갱신
      body.querySelectorAll('.inv-input').forEach(inp => {
        inp.addEventListener('input', () => {
          const k = inp.dataset.k;
          const cur = Math.max(0, Math.floor(Number(inp.value) || 0));
          const prev = Number(_invServerState[k] || 0);
          inp.classList.toggle('dirty', cur !== prev);
          inp.classList.toggle('zero', cur === 0);
          recalcCategoryTotal(inp.dataset.cat);
          updateInvDirtyState();
        });
      });
      updateInvMeta(meta);
      updateInvDirtyState();
      applyEditMode();
    }

    function recalcCategoryTotal(catKey) {
      const el = document.getElementById('invCatTotal_' + catKey);
      if (!el) return;
      let total = 0;
      document.querySelectorAll(`#invBody .inv-input[data-cat="${catKey}"]`).forEach(inp => {
        total += Math.max(0, Math.floor(Number(inp.value) || 0));
      });
      el.textContent = total.toLocaleString();
    }

    function toggleInvCategory(catKey) {
      const el = document.querySelector(`#invBody .inv-category[data-cat="${catKey}"]`);
      if (el) el.classList.toggle('open');
    }

    function applyEditMode() {
      const inputs = document.querySelectorAll('#invBody .inv-input');
      inputs.forEach(inp => { inp.disabled = !_invEditMode; });
      document.getElementById('invEditBtn').style.display = _invEditMode ? 'none' : '';
      document.getElementById('invCancelBtn').style.display = _invEditMode ? '' : 'none';
      document.getElementById('invSaveBtn').style.display = _invEditMode ? '' : 'none';
      const chip = document.getElementById('invModeChip');
      chip.textContent = _invEditMode ? '✏️ 수정 모드' : '👁 보기 모드';
      chip.classList.toggle('view', !_invEditMode);
      chip.classList.toggle('edit', _invEditMode);
    }

    function enterInventoryEdit() {
      _invEditMode = true;
      applyEditMode();
      // 모든 카테고리 자동 펼침 (편의)
      document.querySelectorAll('#invBody .inv-category').forEach(el => el.classList.add('open'));
    }

    function cancelInventoryEdit() {
      if (_invHasDirty && !confirm('변경사항을 버리고 보기 모드로 돌아갈까요?')) return;
      _invEditMode = false;
      // 서버 상태로 되돌리기
      renderInventory(_invServerState, { updatedAt: _invLastMeta && _invLastMeta.updatedAt, updatedBy: _invLastMeta && _invLastMeta.updatedBy });
    }
    let _invLastMeta = null;

    function updateInvMeta(meta) {
      const el = document.getElementById('invMeta');
      if (!meta || !meta.updatedAt) {
        el.textContent = '아직 저장 이력이 없습니다';
        return;
      }
      const d = new Date(meta.updatedAt);
      const date = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      el.textContent = `최종 수정: ${date}${meta.updatedBy ? ' · ' + meta.updatedBy : ''}`;
    }

    function updateInvDirtyState() {
      const dirty = document.querySelectorAll('#invBody .inv-input.dirty').length > 0;
      _invHasDirty = dirty;
      document.getElementById('invSaveBtn').disabled = !dirty;
      document.getElementById('invDirtyChip').classList.toggle('show', dirty);
    }

    async function loadInventory() {
      try {
        const res = await fetch('/api/super/textbook-inventory');
        const json = await res.json();
        if (!json.ok) {
          document.getElementById('invBody').innerHTML = '<div style="padding:30px 0;text-align:center;color:#b91c1c;">⚠️ 불러오기 실패</div>';
          return;
        }
        _invServerState = json.quantities || {};
        _invLastMeta = { updatedAt: json.updatedAt, updatedBy: json.updatedBy };
        renderInventory(_invServerState, _invLastMeta);
      } catch (err) {
        console.error('재고 로드 오류:', err);
        document.getElementById('invBody').innerHTML = '<div style="padding:30px 0;text-align:center;color:#b91c1c;">⚠️ 네트워크 오류</div>';
      }
    }

    async function saveInventory() {
      const inputs = document.querySelectorAll('#invBody .inv-input');
      const quantities = {};
      inputs.forEach(inp => {
        quantities[inp.dataset.k] = Math.max(0, Math.floor(Number(inp.value) || 0));
      });
      const btn = document.getElementById('invSaveBtn');
      btn.disabled = true;
      btn.textContent = '저장 중…';
      try {
        const res = await fetch('/api/super/textbook-inventory', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quantities })
        });
        const json = await res.json();
        if (!json.ok) {
          alert(json.message || '저장 실패');
          btn.disabled = false;
        } else {
          _invServerState = quantities;
          _invLastMeta = { updatedAt: json.updatedAt, updatedBy: _invLastMeta && _invLastMeta.updatedBy };
          document.querySelectorAll('#invBody .inv-input.dirty').forEach(inp => inp.classList.remove('dirty'));
          updateInvDirtyState();
          updateInvMeta(_invLastMeta);
          // 저장 후 보기 모드로 복귀
          _invEditMode = false;
          applyEditMode();
        }
      } catch (err) {
        console.error('재고 저장 오류:', err);
        alert('네트워크 오류로 저장에 실패했습니다.');
        btn.disabled = false;
      } finally {
        btn.textContent = '💾 변경사항 저장';
      }
    }

    // 페이지 이탈 가드 (변경된 값 보호)
    window.addEventListener('beforeunload', (e) => {
      if (_invHasDirty) {
        e.preventDefault();
        e.returnValue = '';
      }
    });

    // ============ 📦 배송완료 클릭 → 차감 모달 ============
    let _decOrderId = null;
    let _decPreview = null;

    async function handleDeliveryClick(orderId, currentlyDelivered, alreadyDecremented) {
      if (currentlyDelivered) {
        // 이미 배송완료 상태 — 토글 해제만 (재고는 복원하지 않음)
        const msg = alreadyDecremented
          ? '이미 재고가 차감된 주문입니다. 배송 완료를 해제해도 재고는 자동 복원되지 않습니다. 계속할까요?'
          : '배송 완료를 해제하시겠습니까?';
        if (!confirm(msg)) return;
        toggleStatus(orderId, 'deliveryCompleted', false);
        return;
      }
      if (alreadyDecremented) {
        // 이미 차감된 적이 있는데 deliveryCompleted가 false인 경우 — 차감 없이 토글만
        toggleStatus(orderId, 'deliveryCompleted', true);
        return;
      }
      // 차감 미리보기 + 모달
      _decOrderId = orderId;
      openDecModal();
      try {
        const res = await fetch(`/api/super/textbook-orders/${orderId}/decrement-preview`);
        const json = await res.json();
        if (!json.ok) {
          alert(json.message || '미리보기 실패');
          closeDecModal();
          return;
        }
        _decPreview = json;
        renderDecModal();
      } catch (err) {
        console.error(err);
        alert('미리보기 네트워크 오류');
        closeDecModal();
      }
    }

    function openDecModal() {
      document.getElementById('decModalOverlay').classList.add('show');
      document.getElementById('decConfirmBtn').disabled = true;
      document.getElementById('decSubtitle').textContent = '주문 정보를 불러오는 중…';
      document.getElementById('decBody').innerHTML = '<div style="padding:30px 0;text-align:center;color:#6b7280;">불러오는 중…</div>';
    }

    function closeDecModal(e) {
      if (e && e.target.id !== 'decModalOverlay') return;
      document.getElementById('decModalOverlay').classList.remove('show');
      _decOrderId = null;
      _decPreview = null;
    }

    function renderDecModal() {
      const data = _decPreview;
      if (!data) return;
      const order = allOrders.find(o => o._id === _decOrderId);
      const branch = order ? order.branchName : '';
      document.getElementById('decSubtitle').textContent =
        `${branch} · ${data.preview.length}개 항목 차감 예정`;

      const rows = data.preview.map(p => {
        const it = p.item;
        let issueLabel;
        if (it.bookType === '브레인비평') issueLabel = `${it.issueNumber}월호`;
        else if (it.bookType === '특강교재') issueLabel = '기본+심화 통합';
        else if (it.bookType === '문해어휘학습장') issueLabel = `${it.issueNumber}권`;
        else issueLabel = `${it.issueNumber}호`;
        const afterClass = p.after < 0 ? 'neg' : '';
        return `
          <tr>
            <td style="color:#374151;font-weight:600;">${escapeHtml(it.bookType)} · ${escapeHtml(it.series)} · ${issueLabel}</td>
            <td><code style="font-size:11px;color:#6b7280;">${p.key}</code></td>
            <td style="text-align:right;">
              <span class="qty-before">${p.before.toLocaleString()}</span>
              <span class="qty-arrow">→</span>
              <span class="qty-after ${afterClass}">${p.after.toLocaleString()}</span>
            </td>
            <td style="text-align:right;"><span class="qty-delta">−${p.qty}</span></td>
          </tr>
        `;
      }).join('');

      const unmappedHtml = (data.unmapped && data.unmapped.length > 0)
        ? `<div class="dec-unmapped"><strong>⚠️ 매핑되지 않은 항목 (차감 제외):</strong>${data.unmapped.map(u => `<div>· ${escapeHtml(u.reason)}</div>`).join('')}</div>`
        : '';

      const negCount = data.preview.filter(p => p.after < 0).length;
      const negWarn = negCount > 0
        ? `<div class="dec-unmapped" style="background:#fff7ed;border-color:#fdba74;color:#9a3412;"><strong>⚠️ 재고 부족 ${negCount}건:</strong>차감 후 음수가 되는 항목이 있습니다. 그대로 진행하면 재고가 음수로 기록됩니다.</div>`
        : '';

      document.getElementById('decBody').innerHTML = `
        ${unmappedHtml}
        ${negWarn}
        <table class="dec-table">
          <thead>
            <tr><th>교재</th><th>인벤토리 키</th><th style="text-align:right;">차감 후 재고</th><th style="text-align:right;">수량</th></tr>
          </thead>
          <tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:#9ca3af;padding:20px 0;">차감할 항목이 없습니다</td></tr>'}</tbody>
        </table>
      `;
      document.getElementById('decConfirmBtn').disabled = data.preview.length === 0;
    }

    async function confirmDecrement() {
      if (!_decOrderId) return;
      const btn = document.getElementById('decConfirmBtn');
      btn.disabled = true;
      btn.textContent = '처리 중…';
      try {
        const res = await fetch(`/api/super/textbook-orders/${_decOrderId}/decrement-and-deliver`, { method: 'POST' });
        const json = await res.json();
        if (!json.ok) {
          alert(json.message || '차감 실패');
          btn.disabled = false;
          btn.textContent = '✓ 차감하고 배송 완료';
          return;
        }
        closeDecModal();
        // 인벤토리 + 주문 목록 동시 새로고침
        _invServerState = json.quantities || _invServerState;
        renderInventory(_invServerState, { updatedAt: new Date().toISOString(), updatedBy: _invLastMeta && _invLastMeta.updatedBy });
        loadOrders();
      } catch (err) {
        console.error(err);
        alert('네트워크 오류로 차감에 실패했습니다');
        btn.disabled = false;
        btn.textContent = '✓ 차감하고 배송 완료';
      }
    }

    loadInventory();
  </script>
</body>
</html>
