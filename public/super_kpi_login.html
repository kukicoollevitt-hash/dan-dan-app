<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>브레인 KPI 자동관리시스템 · 로그인</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(rgba(20,25,35,0.45), rgba(20,25,35,0.55)),
                  url('/images/kpi자동화관리배경.jpg') center center / cover no-repeat fixed;
      background-color: #2c3e50;
      padding: 20px;
    }
    .login-box {
      width: 100%; max-width: 400px; background: #fff; border-radius: 18px;
      padding: 40px 34px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .logo { text-align: center; margin-bottom: 8px; font-size: 40px; }
    h1 { text-align: center; font-size: 20px; color: #2c3e50; margin-bottom: 4px; }
    .sub { text-align: center; font-size: 13px; color: #999; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #555; margin: 16px 0 6px; }
    select, input {
      width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 15px; outline: none; transition: border-color .15s;
    }
    select:focus, input:focus { border-color: #E67E22; }
    .btn {
      width: 100%; margin-top: 26px; padding: 14px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #E67E22 0%, #D35400 100%);
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .err { display: none; margin-top: 14px; color: #e74c3c; font-size: 13px; text-align: center; }
    .back { display: block; text-align: center; margin-top: 18px; color: #999; font-size: 13px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">🏆</div>
    <h1>브레인 KPI 자동관리시스템</h1>
    <p class="sub">소속과 담당자 정보로 로그인하세요</p>

    <form id="kpiLoginForm" autocomplete="off">
      <label for="scope">소속</label>
      <select id="scope" name="scope" required>
        <option value="">선택하세요</option>
        <option value="본사">본사</option>
        <option value="사업본부">사업본부</option>
        <option value="예비지사">예비지사</option>
        <option value="정식지사">정식지사</option>
      </select>

      <label for="name">담당자</label>
      <input type="text" id="name" name="name" placeholder="담당자 이름" required />

      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password" placeholder="비밀번호" required />

      <button type="submit" class="btn" id="submitBtn">로그인</button>
      <p class="err" id="errMsg"></p>
    </form>
  </div>

  <script>
    const form = document.getElementById('kpiLoginForm');
    const btn = document.getElementById('submitBtn');
    const errMsg = document.getElementById('errMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errMsg.style.display = 'none';
      btn.disabled = true;
      btn.textContent = '로그인 중...';
      try {
        const payload = {
          scope: document.getElementById('scope').value,
          name: document.getElementById('name').value.trim(),
          password: document.getElementById('password').value,
        };
        const res = await fetch('/api/super/kpi/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (data.ok) {
          location.href = '/super/kpi';
        } else {
          errMsg.textContent = data.message || '로그인에 실패했습니다.';
          errMsg.style.display = 'block';
        }
      } catch (err) {
        errMsg.textContent = '서버 오류가 발생했습니다.';
        errMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '로그인';
      }
    });
  </script>
</body>
</html>
