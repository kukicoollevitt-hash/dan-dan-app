<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브레인입문 쓰기문해 학습리포트</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'Nanum Gothic', 'Pretendard', sans-serif;
      background: linear-gradient(135deg, #fff8e7 0%, #fef3d0 45%, #ffe8c9 100%);
      color: #37474f;
      min-height: 100vh;
    }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }

    /* 헤더 */
    .report-header {
      background: linear-gradient(135deg, #ff8b3d 0%, #d05a1a 100%);
      color: #fff;
      padding: 20px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(208,90,26,0.28);
      margin-bottom: 18px;
      text-align: center;
    }
    .report-header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }
    .report-header .meta {
      font-size: 14px;
      opacity: 0.95;
      font-weight: 700;
    }
    .report-header .date {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 4px;
    }

    /* 리포트 본문 카드 스타일 (menu.html 과 동일) */
    .wr-summary-panel {
      background: white;
      border-radius: 18px;
      padding: 20px 24px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      margin-bottom: 22px;
    }
    .wr-summary-title { font-size: 15px; font-weight: 800; color: #2e7d32; margin-bottom: 14px; }
    .wr-bars { display: flex; flex-direction: column; gap: 9px; }
    .wr-bar-row {
      display: grid;
      grid-template-columns: 100px 1fr 52px;
      gap: 12px; align-items: center;
      font-size: 13px; font-weight: 700; color: #37474f;
    }
    .wr-bar-track {
      height: 18px;
      background: #eceff1;
      border-radius: 9px;
      overflow: hidden;
      position: relative;
    }
    .wr-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #66bb6a, #2e7d32);
      border-radius: 9px;
      transition: width .6s ease;
    }
    .wr-bar-val { text-align: right; color: #2e7d32; font-weight: 900; }
    .wr-total-row {
      border-top: 2px dashed #ffcc80;
      margin-top: 12px; padding-top: 12px;
      display: grid;
      grid-template-columns: 100px 1fr 68px;
      gap: 12px; align-items: center;
      font-size: 14px; font-weight: 900; color: #d05a1a;
    }
    .wr-total-row .wr-bar-track { height: 22px; }
    .wr-total-row .wr-bar-fill {
      background: linear-gradient(90deg, #ff8b3d, #d05a1a);
    }
    .wr-total-row .wr-bar-val { color: #d05a1a; font-size: 18px; }
    .wr-day-grid-title {
      font-size: 15px; font-weight: 800; color: #d05a1a;
      margin: 4px 0 12px;
    }
    .wr-day-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
    }
    .wr-day-card {
      background: white;
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      border: 2px solid rgba(255,180,80,0.3);
    }
    .wr-day-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #e0e0e0;
    }
    .wr-day-num { font-size: 15px; font-weight: 900; color: #d05a1a; }
    .wr-day-topic {
      font-size: 12px; color: #7a8fa4; flex: 1; margin-left: 10px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .wr-day-total {
      background: linear-gradient(135deg, #ff8b3d, #d05a1a);
      color: white; padding: 3px 10px;
      border-radius: 8px;
      font-size: 12px; font-weight: 800;
    }
    .wr-day-bars .wr-bar-row {
      grid-template-columns: 62px 1fr 38px;
      font-size: 11px; gap: 8px;
    }
    .wr-day-bars .wr-bar-track { height: 10px; border-radius: 5px; }
    .wr-day-bars .wr-bar-fill { border-radius: 5px; }
    .wr-day-bars .wr-bar-val { font-size: 11px; }
    .wr-report-empty {
      text-align: center;
      padding: 60px 20px;
      color: #7a8fa4;
      font-size: 14px;
      line-height: 1.6;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    .footer-note {
      text-align: center;
      color: #b78e5a;
      font-size: 12px;
      margin-top: 24px;
      font-weight: 600;
    }
    @media (max-width: 600px) {
      .wrap { padding: 12px 10px 30px; }
      .report-header h1 { font-size: 19px; }
      .report-header .meta { font-size: 13px; }
      .wr-bar-row { grid-template-columns: 82px 1fr 44px; font-size: 12px; }
      .wr-total-row { grid-template-columns: 82px 1fr 58px; }
      .wr-day-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="report-header">
      <h1>📊 브레인입문 쓰기문해 학습리포트</h1>
      <div class="meta" id="reportMeta">불러오는 중…</div>
      <div class="date" id="reportDate"></div>
    </div>
    <div id="reportBody">
      <div class="wr-report-empty">불러오는 중…</div>
    </div>
    <div class="footer-note">브레인문해력 · brainmoon.kr</div>
  </div>

  <script>
    /* ────── URL 파라미터 파싱 ────── */
    const params = new URLSearchParams(location.search);
    const grade = params.get('grade') || '';
    const name  = params.get('name')  || '';

    /* ────── 레이더 캔버스 렌더 (menu.html 과 동일) ────── */
    function wr100RadarPngDataUrl(pctArr, labelArr, size) {
      size = size || 320;
      const dpr = 2;
      const canvas = document.createElement('canvas');
      canvas.width = size * dpr;
      canvas.height = size * dpr;
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      const cx = size / 2, cy = size / 2;
      const R  = size / 2 * 0.60;
      const n  = pctArr.length;
      const angles = pctArr.map((_, i) => (Math.PI * 2 * i / n) - Math.PI / 2);
      const drawPoly = (points, close) => {
        ctx.beginPath();
        points.forEach((p, i) => (i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1])));
        if (close) ctx.closePath();
      };
      for (let g = 20; g <= 100; g += 20) {
        const pts = angles.map(a => [cx + R * (g/100) * Math.cos(a), cy + R * (g/100) * Math.sin(a)]);
        drawPoly(pts, true);
        ctx.strokeStyle = g === 100 ? '#a5d6a7' : '#e6efe7';
        ctx.lineWidth = g === 100 ? 1.5 : 1;
        ctx.stroke();
      }
      ctx.strokeStyle = '#c8e6c9';
      ctx.lineWidth = 1;
      angles.forEach(a => {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
        ctx.stroke();
      });
      const dataPts = pctArr.map((p, i) => {
        const a = angles[i]; const r = R * (Math.max(0, Math.min(100, p)) / 100);
        return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      });
      drawPoly(dataPts, true);
      ctx.fillStyle = 'rgba(102,187,106,0.32)';
      ctx.fill();
      ctx.strokeStyle = '#43a047';
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.stroke();
      dataPts.forEach(([x, y]) => {
        ctx.beginPath();
        ctx.arc(x, y, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#2e7d32';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      labelArr.forEach((lbl, i) => {
        const a = angles[i];
        const labelR = R + 28;
        const x = cx + labelR * Math.cos(a);
        const y = cy + labelR * Math.sin(a);
        ctx.font = '800 13.5px "Nanum Gothic", "Pretendard", sans-serif';
        ctx.fillStyle = '#1b5e20';
        ctx.fillText(lbl, x, y);
        ctx.font = '700 12px "Nanum Gothic", "Pretendard", sans-serif';
        ctx.fillStyle = '#43a047';
        ctx.fillText(pctArr[i] + '%', x, y + 16);
      });
      return canvas.toDataURL('image/png');
    }

    /* ────── 본문 렌더 (menu.html 과 동일 로직) ────── */
    function renderWr100ReportBody(records) {
      const keys = ['vocab', 'word', 'wordApply', 'sentence', 'paraOrder'];
      const labels = { vocab: '어휘학습', word: '단어학습', wordApply: '단어활용', sentence: '문장학습', paraOrder: '문단순서' };
      const agg = {};
      keys.forEach(k => { agg[k] = 0; });
      records.forEach(r => {
        keys.forEach(k => {
          const a = r.accuracies && r.accuracies[k];
          if (a && a.attempts > 0) {
            agg[k] += Math.round((a.correct / a.attempts) * 100);
          }
        });
      });
      const N = records.length;
      const pct = k => N === 0 ? 0 : Math.round(agg[k] / N);
      let totalPctSum = 0;
      records.forEach(r => {
        const t = r.accuracies && r.accuracies.total;
        totalPctSum += (t && typeof t.pct === 'number') ? t.pct : 0;
      });
      const totalPct = N === 0 ? 0 : Math.round(totalPctSum / N);
      const pctArr = keys.map(k => pct(k));
      const lblArr = keys.map(k => labels[k]);
      const radarUrl = wr100RadarPngDataUrl(pctArr, lblArr, 340);
      const radarImg = `<img src="${radarUrl}" width="340" height="340" alt="레이더" style="display:block;margin:0 auto;max-width:100%;">`;

      const doneDays = records.length;
      const totalDays = 100;
      const progressPct = Math.round((doneDays / totalDays) * 100);

      let html = `
        <div class="wr-radar-card" style="background:linear-gradient(135deg,#e8f5e9 0%,#f1f8e9 55%,#e8f5e9 100%);border-radius:20px;padding:24px 22px 20px 22px;margin-bottom:16px;border:1.5px solid #c8e6c9;box-shadow:0 6px 18px rgba(76,175,80,0.10);text-align:center;">
          <div style="font-size:20px;font-weight:900;color:#1b5e20;letter-spacing:-0.3px;">🎯 5가지 영역 정답률 레이더</div>
          <div style="font-size:14.5px;color:#558b6a;margin-top:6px;margin-bottom:8px;font-weight:600;">완료한 ${records.length}일 평균 · 균형있게 성장 중이에요</div>
          ${radarImg}
          <div style="display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,0.75);padding:9px 20px;border-radius:24px;margin-top:6px;font-size:16px;font-weight:800;color:#2e7d32;box-shadow:0 3px 10px rgba(76,175,80,0.15);">
            <span>✨ 전체 평균</span>
            <span style="background:linear-gradient(135deg,#66bb6a,#43a047);color:#fff;padding:4px 16px;border-radius:16px;font-size:18px;font-weight:900;">${totalPct}%</span>
          </div>
        </div>
        <div class="wr-progress-card" style="background:linear-gradient(135deg,#e3f2fd 0%,#e1f5fe 55%,#e3f2fd 100%);border-radius:18px;padding:18px 22px;margin-bottom:16px;border:1.5px solid #b3e5fc;box-shadow:0 4px 14px rgba(2,119,189,0.10);">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="font-size:18px;">🚀</span>
              <div>
                <div style="font-size:14.5px;font-weight:900;color:#01579b;letter-spacing:-0.3px;">100일 진도율</div>
                <div style="font-size:11.5px;color:#0277bd;margin-top:2px;">브레인입문 쓰기문해 여정</div>
              </div>
            </div>
            <div style="display:flex;align-items:baseline;gap:6px;">
              <span style="font-size:24px;font-weight:900;color:#0277bd;letter-spacing:-0.5px;">${doneDays}</span>
              <span style="font-size:14px;color:#0288d1;font-weight:700;">/ ${totalDays}일</span>
              <span style="background:linear-gradient(135deg,#29b6f6,#0288d1);color:#fff;padding:3px 12px;border-radius:14px;font-size:12.5px;font-weight:800;margin-left:6px;">${progressPct}%</span>
            </div>
          </div>
          <div style="background:rgba(255,255,255,0.75);height:14px;border-radius:10px;overflow:hidden;position:relative;box-shadow:inset 0 1px 3px rgba(1,87,155,0.08);">
            <div style="width:${progressPct}%;height:100%;background:linear-gradient(90deg,#4fc3f7 0%,#29b6f6 50%,#0288d1 100%);border-radius:10px;transition:width 0.6s ease;position:relative;">
              ${progressPct >= 10 ? `<span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#fff;font-size:10px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,0.15);">${progressPct}%</span>` : ''}
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:10.5px;color:#0277bd;margin-top:6px;font-weight:600;">
            <span>Day 1</span>
            <span>Day 50</span>
            <span>Day 100</span>
          </div>
        </div>
        <div class="wr-summary-panel">
          <div class="wr-summary-title">📈 전체 요약 (완료한 ${records.length}일 기준)</div>
          <div class="wr-bars">
            ${keys.map(k => `
              <div class="wr-bar-row">
                <div>총 ${labels[k]}</div>
                <div class="wr-bar-track"><div class="wr-bar-fill" style="width:${pct(k)}%"></div></div>
                <div class="wr-bar-val">${pct(k)}%</div>
              </div>
            `).join('')}
            <div class="wr-total-row">
              <div>🎯 전체 정답률</div>
              <div class="wr-bar-track"><div class="wr-bar-fill" style="width:${totalPct}%"></div></div>
              <div class="wr-bar-val">${totalPct}%</div>
            </div>
          </div>
        </div>
        <div class="wr-day-grid-title">📅 Day별 상세 (${records.length}일 완료)</div>
        <div class="wr-day-grid">
          ${records.map(r => {
            const dayTotal = r.accuracies && r.accuracies.total ? (r.accuracies.total.pct || 0) : 0;
            return `
              <div class="wr-day-card">
                <div class="wr-day-head">
                  <div class="wr-day-num">Day ${r.day}</div>
                  <div class="wr-day-topic">${(r.topic || '').replace(/</g,'&lt;')}</div>
                  <div class="wr-day-total">${dayTotal}%</div>
                </div>
                <div class="wr-day-bars">
                  ${keys.map(k => {
                    const p = (r.accuracies && r.accuracies[k]) ? (r.accuracies[k].pct || 0) : 0;
                    return `
                      <div class="wr-bar-row">
                        <div>${labels[k]}</div>
                        <div class="wr-bar-track"><div class="wr-bar-fill" style="width:${p}%"></div></div>
                        <div class="wr-bar-val">${p}%</div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
      return html;
    }

    /* ────── 초기화 ────── */
    (async () => {
      const bodyEl = document.getElementById('reportBody');
      const metaEl = document.getElementById('reportMeta');
      const dateEl = document.getElementById('reportDate');

      if (!grade || !name) {
        metaEl.textContent = '학생 정보가 없어요';
        bodyEl.innerHTML = '<div class="wr-report-empty">URL에 학생 정보가 없어 리포트를 불러올 수 없어요.</div>';
        return;
      }

      metaEl.textContent = `${grade} ${name} 학생`;
      const today = new Date();
      const yy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      dateEl.textContent = `${yy}. ${mm}. ${dd} 기준`;

      try {
        const url = `/api/writing100/report?grade=${encodeURIComponent(grade)}&name=${encodeURIComponent(name)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.ok || !data.records || data.records.length === 0) {
          bodyEl.innerHTML = '<div class="wr-report-empty">아직 완료한 학습이 없어요.<br>Day 1부터 학습을 시작해 봐요!</div>';
          return;
        }
        bodyEl.innerHTML = renderWr100ReportBody(data.records);
      } catch (err) {
        console.error(err);
        bodyEl.innerHTML = '<div class="wr-report-empty">리포트를 불러올 수 없어요.<br>잠시 후 다시 시도해 주세요.</div>';
      }
    })();
  </script>
</body>
</html>
